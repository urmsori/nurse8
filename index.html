{"id":"e276","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe Saebom Senior Welfare Center is one of the busiest public facilities (A) __in__ the district. It (B) __has opened__ three years ago in a former elementary school building, and more than four hundred residents now visit it every day. In the morning, members can take classes in calligraphy, smartphone use, and table tennis, all of (C) __which__ are free of charge. In the afternoon, a team of nurses from the public health center checks blood pressure and gives advice on (D) __managing__ chronic diseases such as diabetes.","opts":["(A) in","(B) has opened","(C) which","(D) managing"],"ans":1,"exp":"three years ago처럼 분명한 과거 시점을 나타내는 말은 현재완료와 함께 쓸 수 없으므로 과거 시제 opened가 되어야 한다. (A)는 최상급 뒤에서 범위를 나타내는 전치사, (C)는 \"all of which\" 꼴로 앞의 수업들을 받는 관계대명사, (D)는 전치사 on의 목적어인 동명사로 모두 옳다."},
{"id":"e277","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nApplying for a library card at the city library is simple. First-time users are required (A) __to visit__ the information desk on the first floor with a valid photo ID. There they must fill out a short application form, show proof of their current address, and (B) __choosing__ a four-digit password for the self-checkout machines. The card is issued on the spot and can be used immediately. With it, members may borrow up to ten books at a time and keep (C) __them__ for two weeks. Books (D) __returned__ late cannot be renewed.","opts":["(A) to visit","(B) choosing","(C) them","(D) returned"],"ans":1,"exp":"조동사 must 뒤에 fill out, show가 동사원형으로 나열되고 and로 이어지므로 마지막도 같은 꼴인 choose여야 한다(병렬 구조). (A)는 \"be required to + 동사원형\", (C)는 복수 명사 books를 받는 대명사, (D)는 \"늦게 반납된\" 책이라는 뜻으로 Books를 꾸미는 과거분사로 모두 옳다."},
{"id":"e278","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nEvery April, the city holds a flower festival along the river. The festival began as a small event (A) __organized__ by local shop owners, but it has since grown into one of the region's main attractions. Its center is Riverside Park, (B) __which__ thousands of visitors gather each evening to watch the lantern parade. Because parking near the park is extremely (C) __limited__, visitors are encouraged to use the free shuttle buses that (D) __run__ from the subway station every ten minutes.","opts":["(A) organized","(B) which","(C) limited","(D) run"],"ans":1,"exp":"뒤에 주어(thousands of visitors)와 자동사(gather)를 갖춘 완전한 절이 오고 선행사가 장소(Riverside Park)이므로 which가 아니라 관계부사 where(또는 in which)가 되어야 한다. (A)는 event를 꾸미는 수동의 과거분사, (C)는 is의 보어로 쓰인 형용사, (D)는 복수 선행사 buses에 맞춘 동사로 모두 옳다."},
{"id":"e279","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nMany office workers spend more than eight hours a day (A) __sitting__ at a desk, which can lead to back pain and poor circulation. Health experts say that the problem is not sitting itself but staying in the same position for too long. They recommend standing up and stretching for a few minutes every hour, even (B) __if__ you feel perfectly comfortable. Those who cannot leave their desks often should consider (C) __to use__ a height-adjustable desk. Small changes like these are (D) __much__ easier to maintain than an ambitious exercise plan.","opts":["(A) sitting","(B) if","(C) to use","(D) much"],"ans":2,"exp":"consider는 동명사를 목적어로 취하는 동사이므로 to use가 아니라 using이어야 한다. (A)는 \"spend + 시간 + -ing\"(~하며 시간을 보내다), (B)는 even if(비록 ~하더라도)의 접속사, (D)는 비교급 easier를 강조하는 부사로 모두 옳다."},
{"id":"e280","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nEmergency calls should be made only when someone's life or safety is in danger. When you call, stay calm and tell the operator exactly (A) __where__ you are, since help cannot be sent without a location. Next, explain what happened and how many people (B) __are injured__. If the accident (C) __was occurred__ on a road, mention the direction of traffic and any nearby landmarks. Do not hang up until the operator tells you to, because he or she may need (D) __further__ information or may give you first-aid instructions over the phone.","opts":["(A) where","(B) are injured","(C) was occurred","(D) further"],"ans":2,"exp":"occur는 목적어를 취하지 않는 자동사여서 수동태로 쓸 수 없으므로 occurred가 되어야 한다. (A)는 tell의 직접목적어인 간접의문문을 이끄는 where, (B)는 사람이 \"다친\" 상태를 나타내는 be injured, (D)는 \"추가의\"라는 뜻으로 information을 꾸미는 형용사로 모두 옳다."},
{"id":"e281","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe public health center offers a free walking program for residents (A) __aged__ 50 and over. Participants meet at the entrance of the riverside trail at 7 a.m. on weekdays and walk for about an hour under the guidance of a trained instructor. Before joining, each participant (B) __has__ his or her blood pressure and blood sugar measured, and the same tests are repeated three months (C) __later__ to see how much progress has been made. Since it began, the walking class has become one of the most popular (D) __program__ run by the center.","opts":["(A) aged","(B) has","(C) later","(D) program"],"ans":3,"exp":"\"one of the + 최상급\" 뒤에는 복수 명사가 오므로 program이 아니라 programs여야 한다. (A)는 \"aged + 나이\"(~세의)로 residents를 꾸미는 말, (B)는 단수 주어 each participant에 맞춘 사역동사(have + 목적어 + 과거분사), (C)는 \"three months later\"(석 달 뒤에)의 부사로 모두 옳다."},
{"id":"e282","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nPatients visiting the outpatient clinic for the first time often feel anxious because the procedures are (A) __unfamiliar__ to them. To make their visit easier, the hospital has placed volunteer guides near the main entrance. The guides help patients (B) __register__ at the reception desk and show them the way to the right department. They also explain (C) __how__ the electronic waiting board works, so that no one misses a turn. In addition, free tea is served to patients (D) __during__ they are waiting to see a doctor.","opts":["(A) unfamiliar","(B) register","(C) how","(D) during"],"ans":3,"exp":"during은 전치사여서 뒤에 명사(구)가 와야 한다. 여기서는 \"주어 + 동사\"(they are waiting)가 이어지므로 접속사 while을 써야 한다. (A)는 \"be unfamiliar to + 사람\"(~에게 낯설다)의 형용사, (B)는 \"help + 목적어 + 동사원형\", (C)는 explain의 목적절(간접의문문)을 이끄는 how로 모두 옳다."},
{"id":"e283","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: 119. What is your emergency?\nB: I smell gas in the hallway of my apartment building!\nA: What is the address?\nB: 25 Maple Street, Building C. I'm on the third floor.\nA: A fire engine is on its way. ______.\nB: Okay, I won't touch anything. Should I knock on my neighbors' doors?\nA: Yes, and tell everyone to go outside by the stairs, not the elevator.\nB: All right. We'll wait in the parking lot.","opts":["Please do not turn any switches on or off","Please check where the smell is coming from","Please bring your valuables when you leave","Please wait for the firefighters in your room"],"ans":0,"exp":"B가 \"알겠습니다. 아무것도 만지지 않을게요\"라고 답했으므로 빈칸은 무엇을 하지 말라는 지시여야 한다. 가스 냄새가 날 때는 불꽃이 튈 수 있어 전기 스위치를 켜거나 끄면 안 된다. 냄새가 나는 곳을 확인하라거나 귀중품을 챙기라는 말에는 만지지 않겠다는 대답이 맞지 않고, 방에서 기다리라는 말은 밖으로 나가라는 뒤의 지시와 어긋난다."},
{"id":"e284","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nPaul Reed (2:05 pm): Hello. I'd like to book a seminar room at the community center for next Thursday.\nCenter Staff (2:06 pm): Sure. How many people will be attending?\nPaul Reed (2:07 pm): About twenty.\nCenter Staff (2:08 pm): Then Room B would be best. It seats twenty-five. ______?\nPaul Reed (2:09 pm): From 2 to 4 pm. Is a projector available?\nCenter Staff (2:10 pm): Yes, it's included at no extra charge.\nPaul Reed (2:11 pm): Perfect. How do I pay the rental fee?\nCenter Staff (2:12 pm): You can pay at the front desk on the day.","opts":["Would you prefer a larger room","What time would you like to use it","How did you hear about our center","Have you ever used our rooms before"],"ans":1,"exp":"빈칸 다음에 Paul이 \"오후 2시부터 4시까지\"라고 시간으로 답했으므로 몇 시에 쓰고 싶은지 묻는 말이 알맞다. 더 큰 방을 원하는지, 센터를 어떻게 알았는지, 전에 써 본 적이 있는지를 묻는 말에는 이용 시간으로 답할 수 없다."},
{"id":"e335","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nTo end this confusion, the railroads of the United States and Canada agreed in 1883 to divide the continent into a small number of time zones.\n\nUntil the nineteenth century, every town kept its own time. (A) Noon was simply the moment when the sun stood highest in the sky, so a clock in one town might differ by several minutes from a clock in the next town to the east or west. (B) As long as people traveled on foot or by horse, these small differences did not matter. (C) The spread of the railroad, however, changed the situation, for a traveler crossing the country passed through dozens of local times, and timetables became almost impossible to read. (D) Within each zone, all clocks showed the same hour, whatever the position of the sun. The following year, an international conference chose the line passing through Greenwich, England, as the starting point for measuring time around the world.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장의 this confusion은 (D) 앞 문장에서 말한, 지역 시간이 수십 개여서 열차 시간표를 읽기 어려웠던 혼란을 가리킨다. 또 (D) 뒤의 Within each zone은 주어진 문장의 time zones가 먼저 나와야 이어지므로 (D)가 알맞다. (C)에 넣으면 철도 때문에 생긴 혼란이 아직 나오지 않았고, 뒤 문장의 however가 가리키는 흐름도 끊긴다."},
{"id":"e336","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nSuppose you have paid for a ticket to a concert, and on the evening of the performance you feel ill and a heavy rain is falling. Many people would go anyway, reasoning that otherwise the money would be wasted. Yet the money is gone whether they go or not; the only real question is whether an evening in the hall will be more enjoyable than an evening at home. Economists call a cost of this kind, one that has already been paid and cannot be recovered, a \"sunk cost,\" and they point out that it has no bearing on which choice is better from now on. The same error appears on a larger scale when a company keeps pouring funds into a failing project because so much has already been spent on it. A sensible decision, in short, ______.","opts":["is based on how much has already been paid","follows what the majority would choose","depends only on future costs and benefits","avoids every possible risk of losing money"],"ans":2,"exp":"이미 내서 돌려받을 수 없는 돈(매몰 비용)은 가든 안 가든 사라진 것이므로 앞으로 어느 쪽이 더 나은지와 관계가 없다는 글이다. 따라서 현명한 결정은 앞으로의 비용과 이득만 따진다는 말이 알맞다. 이미 낸 돈을 기준으로 삼는 것은 글이 잘못이라고 한 바로 그 생각이고, 다수의 선택이나 위험 회피는 글에 나오지 않는다."},
{"id":"e337","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWe tend to think of the meaning of a word as something fixed, recorded once and for all in the dictionary. The history of English shows otherwise. Several centuries ago, \"nice\" meant foolish or ignorant, and to call someone nice was no compliment. \"Awful\" once described something that filled people with awe, so that a great cathedral could be praised as awful. \"Girl\" could refer to a young child of either sex. None of these changes was decided by a committee or announced on a particular day. Each came about gradually, as speakers began to use the word in slightly new situations and listeners followed them, until the older sense faded from memory. Dictionaries record such shifts after they have happened; they do not cause them. The meaning of a word, then, is ______.","opts":["fixed at the moment the word is first written down","decided by the scholars who compile dictionaries","shaped by the way people actually use it over time","kept unchanged as long as its spelling stays the same"],"ans":2,"exp":"nice, awful, girl의 뜻이 누가 정해서가 아니라 사람들이 조금씩 다르게 쓰면서 서서히 바뀌었다는 글이다. 따라서 낱말의 뜻은 사람들이 실제로 쓰는 방식에 따라 시간이 흐르며 만들어진다는 말이 알맞다. 사전은 변화를 뒤에 기록할 뿐 일으키지 않는다고 했으므로 사전 편찬자가 정한다는 선지는 맞지 않고, 뜻이 고정되어 있다는 것은 첫 문장에서 바로잡는 통념이다."},
{"id":"e338","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nAsk people to picture a desert, and most will describe burning sand under a blazing sun. Scientists, however, define a desert by a different measure. A desert is a region that receives very little precipitation, usually less than about 250 millimeters a year, so that few plants can grow there. By this standard, the largest desert on earth is not the Sahara but Antarctica. Although the continent is covered with ice several kilometers thick in places, very little new snow falls on its interior in a year; the ice has simply built up over an immense span of time because almost none of it melts. Cold, dry regions such as the Gobi in Asia, where winter temperatures fall far below freezing, are deserts as well. What makes a place a desert, in other words, is ______.\n\n* precipitation: 강수량","opts":["how hot the ground becomes at noon","how far it lies from the nearest sea","how much of its surface is covered with sand","how little rain or snow falls on it"],"ans":3,"exp":"과학자들은 더위가 아니라 강수량이 아주 적은가로 사막을 정의하며, 그래서 얼음으로 덮인 남극이 지구에서 가장 큰 사막이라는 글이다. 따라서 사막을 사막으로 만드는 것은 비나 눈이 얼마나 적게 내리는가이다. 뜨거운 땅과 모래는 첫 문장에서 든 통념이고, 남극과 고비 사막의 예가 이를 반박한다. 바다에서 떨어진 거리는 글에 나오지 않는다."},
{"id":"h01","subj":"한국사","unit":"조선 후기","q":"(가)에 들어갈 제도로 옳은 것은?\n\n방납의 폐단으로 농민의 부담이 커지자 광해군 때 이원익 등의 건의로 경기도에서 (가) ______을/를 처음 실시하였다. 집집마다 토산물로 거두던 공납을 토지 결수에 따라 쌀, 베, 동전 등으로 내게 한 것으로, 양반 지주의 반대로 전국으로 넓혀지는 데 100년가량이 걸렸다.","opts":["대동법","균역법","영정법","호포법"],"ans":0,"exp":"공납을 토지 결수에 따라 쌀(1결당 12두), 베, 동전으로 내게 한 제도는 대동법이다. 광해군 때 경기도에서 시작하여 숙종 때 전국으로 넓혀졌다. 균역법은 군포를 1필로 줄인 것이고, 영정법은 전세를 1결당 4~6두로 고정한 것이다."},
{"id":"h03","subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘만세 시위’를 계기로 일어난 일로 옳은 것은?\n\n고종의 장례를 앞두고 종교계 인사들로 이루어진 민족 대표들은 태화관에 모여 독립 선언식을 치렀다. 같은 시각 탑골 공원에 모인 학생과 시민은 독립 선언서를 읽고 거리로 나섰다. __만세 시위__는 곧 전국의 도시와 농촌으로 퍼져 나갔다.","opts":["대한민국 임시 정부가 수립되었다.","105인 사건이 일어났다.","대한 광복회가 조직되었다.","토지 조사 사업이 시작되었다."],"ans":0,"exp":"3·1 운동(1919)이다. 3·1 운동을 계기로 독립운동을 체계적으로 이끌 지도부가 필요하다는 생각이 커져 같은 해 상하이에서 대한민국 임시 정부가 수립되었다. 토지 조사 사업(1910년대 초), 105인 사건(1911), 대한 광복회 조직(1915)은 모두 3·1 운동 이전의 일이다."},
{"id":"h05","subj":"한국사","unit":"선사·고조선","q":"(가) 시대의 생활 모습으로 옳은 것은?\n\n제주 고산리 유적과 양양 오산리 유적은 (가) ______ 시대의 유적이다. 이 시대 사람들은 돌을 갈아 만든 도구를 쓰기 시작하였고, 조와 피 같은 잡곡을 기르는 농사를 처음 지었다. 강가나 바닷가에 움집을 짓고 한곳에 머물러 살았다.","opts":["철제 농기구를 사용하여 농사를 지었다.","빗살무늬 토기를 만들어 식량을 저장하였다.","고인돌을 만들어 지배자의 무덤으로 삼았다.","주먹도끼를 만들어 쓰며 동굴에서 살았다."],"ans":1,"exp":"간석기를 쓰고 농경과 정착 생활을 시작한 (가)는 신석기 시대이다. 신석기 시대 사람들은 빗살무늬 토기를 만들어 식량을 저장하고 조리하였다. 고인돌은 청동기 시대, 철제 농기구는 철기 시대, 주먹도끼와 동굴 생활은 구석기 시대의 모습이다."},
{"id":"h06","subj":"한국사","unit":"선사·고조선","q":"밑줄 친 ‘이 시대’에 대한 설명으로 옳은 것은?\n\n부여 송국리 유적은 __이 시대__의 대표적인 마을 유적이다. 마을 둘레에 도랑을 파고 나무 울타리를 세운 흔적이 있으며, 집터에서는 민무늬 토기와 불에 탄 쌀이, 돌널무덤에서는 비파형 동검이 나왔다.","opts":["슴베찌르개를 만들어 사냥에 썼다.","사유 재산이 생기고 계급이 나타났다.","가락바퀴와 뼈바늘을 처음 사용하였다.","명도전 같은 중국 화폐를 사용하였다."],"ans":1,"exp":"민무늬 토기와 비파형 동검은 청동기 시대의 대표 유물이다. 이 시대에는 농업 생산력이 늘어 사유 재산과 계급이 생기고 군장이 등장하였으며, 마을을 지키려고 도랑과 울타리를 둘렀다. 가락바퀴와 뼈바늘은 신석기 시대, 슴베찌르개는 구석기 시대, 명도전은 철기 시대의 것이다."},
{"id":"h07","subj":"한국사","unit":"선사·고조선","q":"다음 법이 시행된 나라에 대한 설명으로 옳은 것은?\n\n사람을 죽인 자는 즉시 죽음으로 갚는다. 남에게 상처를 입힌 자는 곡식으로 갚는다. 도둑질한 자는 남자는 그 집의 노(奴)로, 여자는 비(婢)로 삼는다. 죄를 씻고자 하는 자는 한 사람마다 50만 전을 내야 한다.\n- 「한서」 지리지","opts":["책화라는 풍습이 있었다.","영고라는 제천 행사를 열었다.","소도라는 신성 지역을 두었다.","위만이 준왕을 몰아내고 왕이 되었다."],"ans":3,"exp":"제시된 법은 고조선의 8조법 가운데 전해지는 세 조항이다. 고조선에서는 기원전 2세기에 위만이 준왕을 몰아내고 왕위를 차지하였다. 영고는 부여, 소도는 삼한, 책화는 동예의 것이다."},
{"id":"h08","subj":"한국사","unit":"초기 국가","q":"(가) 나라에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 구릉과 넓은 못이 많아 동이 지역 가운데 가장 넓고 평탄하다. 은력 정월에 하늘에 제사를 지내는데, 온 나라 사람이 모여 날마다 먹고 마시며 노래하고 춤춘다. 이를 영고라 한다.\n- 「삼국지」 위서 동이전","opts":["무천이라는 제천 행사를 열었다.","민며느리제라는 혼인 풍습이 있었다.","신지, 읍차 등의 군장이 다스렸다.","도둑질한 자에게 물건값의 12배를 물게 하였다."],"ans":3,"exp":"영고는 부여의 제천 행사이다. 부여에는 남의 물건을 훔치면 12배로 갚게 하는 1책 12법이 있었다. 민며느리제는 옥저, 무천은 동예, 신지와 읍차는 삼한의 것이다."},
{"id":"h09","subj":"한국사","unit":"초기 국가","q":"(가) 나라에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 대군장이 없고 후, 읍군, 삼로가 하호를 다스렸다. 같은 성씨끼리는 혼인하지 않는다. 꺼리는 것이 많아 병을 앓거나 사람이 죽으면 살던 집을 버리고 새집을 지었다. 호랑이를 신으로 여겨 제사를 지낸다.\n- 「삼국지」 위서 동이전","opts":["천군이라는 제사장이 소도를 다스렸다.","제가 회의에서 나라의 중요한 일을 결정하였다.","가족이 죽으면 뼈를 추려 큰 목곽에 함께 안치하였다.","다른 부족의 영역을 침범하면 노비나 소, 말로 갚게 하였다."],"ans":3,"exp":"같은 성씨끼리 혼인하지 않고(족외혼) 호랑이에게 제사를 지낸 (가)는 동예이다. 동예에는 다른 부족의 생활 영역을 침범하면 노비나 소, 말로 배상하게 하는 책화가 있었다. 가족 공동 무덤은 옥저, 제가 회의는 고구려와 부여, 천군과 소도는 삼한의 것이다."},
{"id":"h10","subj":"한국사","unit":"초기 국가","q":"(가)에 대한 설명으로 옳지 않은 것은?\n\n(가) ______에서는 국읍마다 한 사람을 세워 하늘에 지내는 제사를 주관하게 하는데, 이를 천군이라 한다. 또 나라마다 별읍이 있어 소도라 하는데, 죄를 짓고 도망한 사람이 그 안으로 들어가면 잡아가지 못하였다.\n- 「삼국지」 위서 동이전","opts":["서옥제라는 혼인 풍습이 있었다.","5월과 10월에 계절제를 지냈다.","변한에서는 철을 낙랑과 왜에 수출하였다.","신지, 읍차 등으로 불린 군장이 있었다."],"ans":0,"exp":"천군과 소도가 있던 (가)는 삼한이다. 서옥제는 혼인 뒤 신랑이 신부 집 뒤꼍의 작은 집(서옥)에서 살던 고구려의 풍습이므로 옳지 않다. 삼한에서는 씨를 뿌린 5월과 추수를 마친 10월에 계절제를 지냈고, 변한은 철이 풍부하여 낙랑과 왜에 수출하였다. 신지와 읍차는 삼한의 군장이다."},
{"id":"h13","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘왕’의 업적으로 옳은 것은?\n\n__왕__은 열여덟 살에 왕위에 올라 영락 대왕이라 일컬었다. 은택이 하늘까지 미쳤고 위엄은 온 세상에 떨쳤다. 나쁜 무리를 쓸어 없애니 백성이 저마다 생업에 힘쓰고 편안히 살게 되었다. 나라는 부강해지고 오곡이 풍성하게 익었다.\n- 중국 지안에 있는 고구려 비문","opts":["진대법을 실시하였다.","평양으로 도읍을 옮겼다.","신라에 침입한 왜를 물리쳤다.","율령을 반포하고 태학을 세웠다."],"ans":2,"exp":"영락이라는 연호를 쓴 왕은 고구려 광개토 대왕이며, 자료는 아들 장수왕이 세운 광개토 대왕릉비의 내용이다. 광개토 대왕은 신라의 요청을 받아 군대를 보내 신라에 침입한 왜를 물리쳤다. 평양 천도는 장수왕, 율령 반포와 태학 설립은 소수림왕, 진대법 실시는 고국천왕 때의 일이다."},
{"id":"h15","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n겨울에 __왕__이 태자와 함께 정예 군사 3만 명을 거느리고 고구려에 쳐들어가 평양성을 공격하였다. 고구려 왕 사유가 힘을 다해 싸우며 막다가 날아온 화살에 맞아 죽었다. 왕이 군사를 이끌고 물러났다.\n- 「삼국사기」","opts":["고흥이 『서기』를 편찬하였다.","22담로에 왕족을 파견하였다.","동진에서 불교를 받아들였다.","사비로 도읍을 옮기고 국호를 남부여로 바꾸었다."],"ans":0,"exp":"평양성을 공격하여 고구려 고국원왕(사유)을 전사시킨 왕은 4세기 백제의 전성기를 이끈 근초고왕이다. 근초고왕 때 박사 고흥이 역사서 『서기』를 편찬하였다. 사비 천도와 남부여 개칭은 성왕, 22담로에 왕족을 파견한 왕은 무령왕, 불교 수용은 침류왕 때의 일이다."},
{"id":"h16","subj":"한국사","unit":"삼국 시대","q":"(가) 왕에 대한 설명으로 옳은 것은?\n\n(가) ______ 16년 봄에 도읍을 사비로 옮기고 나라 이름을 남부여라 하였다. … (중략) … 32년 가을에 왕이 신라를 습격하고자 몸소 보병과 기병 50명을 거느리고 밤에 구천에 이르렀는데, 신라의 복병을 만나 싸우다가 살해되었다.\n- 「삼국사기」","opts":["익산에 미륵사를 세웠다.","신라의 대야성을 빼앗았다.","고구려의 공격을 받아 웅진으로 도읍을 옮겼다.","신라와 연합하여 한강 하류 지역을 일시 되찾았다."],"ans":3,"exp":"사비로 도읍을 옮기고 국호를 남부여로 바꾼 (가)는 백제 성왕이다. 성왕은 신라 진흥왕과 연합하여 한강 하류 지역을 되찾았으나 곧 신라에 빼앗겼고, 관산성 전투에서 전사하였다. 웅진 천도는 문주왕, 미륵사 창건은 무왕, 대야성 함락은 의자왕 때의 일이다."},
{"id":"h17","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n금관국의 왕 김구해가 왕비와 세 아들과 함께 나라의 보물을 가지고 와서 항복하였다. __왕__이 예를 갖추어 대접하고 높은 관등을 주었으며, 본래의 나라를 식읍으로 삼게 하였다.\n- 「삼국사기」","opts":["대가야를 정복하였다.","황룡사 9층 목탑을 세웠다.","이차돈의 순교를 계기로 불교를 공인하였다.","국호를 신라로 정하고 왕이라는 칭호를 썼다."],"ans":2,"exp":"금관가야의 김구해(구형왕)가 항복한 것은 신라 법흥왕 때인 532년이다. 법흥왕은 병부를 설치하고 율령을 반포했으며, 이차돈의 순교를 계기로 불교를 공인하였다. 국호 신라와 왕 칭호 사용은 지증왕, 황룡사 9층 목탑 건립은 선덕 여왕, 대가야 정복은 진흥왕 때의 일이다."},
{"id":"h19","subj":"한국사","unit":"삼국 시대","q":"(가) 운동에 대한 설명으로 옳은 것은?\n\n사비성이 함락되고 의자왕이 당으로 끌려간 뒤, 흑치상지는 임존성을 근거지로 삼아 군사를 모았다. 열흘 만에 3만여 명이 모여들었고, 당의 소정방이 군사를 보내 공격하였으나 이기지 못하였다. 이렇게 시작된 (가) ______은/는 한때 200여 성을 되찾았다.","opts":["검모잠이 안승을 왕으로 받들었다.","계백의 결사대가 황산벌에서 싸웠다.","안시성에서 당 태종의 군대를 물리쳤다.","복신과 도침이 주류성에서 왕자 풍을 왕으로 맞이하였다."],"ans":3,"exp":"백제가 멸망한 뒤 흑치상지는 임존성에서, 복신과 도침은 주류성에서 부흥 운동을 일으켰고, 왜에 있던 왕자 풍을 왕으로 맞이하였다. 검모잠과 안승은 고구려 부흥 운동, 안시성 싸움은 645년 고구려와 당의 전쟁, 황산벌 전투는 백제 멸망 직전의 일이다."},
{"id":"h20","subj":"한국사","unit":"삼국 시대","q":"(가) 나라에 대한 설명으로 옳은 것은?\n\n구지봉에서 하늘의 목소리가 들려 사람들이 노래하고 춤추자, 하늘에서 금빛 상자가 내려왔다. 상자 안에는 황금 알 여섯 개가 있었는데, 가장 먼저 깨어난 아이를 수로라 하고 왕으로 받드니 이 나라가 (가) ______이다.\n- 「삼국유사」","opts":["고령 지산동에 대규모 고분군을 남겼다.","5세기 후반부터 후기 가야 연맹을 이끌었다.","김해 지역에서 성장하여 전기 가야 연맹을 이끌었다.","진흥왕 때 이사부의 공격을 받아 신라에 병합되었다."],"ans":2,"exp":"수로왕이 세운 (가)는 금관가야(가락국)이다. 금관가야는 김해 지역에서 풍부한 철과 해상 교역을 바탕으로 전기 가야 연맹을 이끌었고, 법흥왕 때인 532년 신라에 병합되었다. 진흥왕 때 병합된 나라, 고령 지산동 고분군을 남긴 나라, 후기 가야 연맹의 중심은 모두 대가야이다."},
{"id":"h21","subj":"한국사","unit":"삼국 시대","q":"백제 무령왕릉에 대한 설명으로 옳은 것은?","opts":["도굴이 어려운 돌무지덧널무덤이다.","널방 벽에 사신도가 그려져 있다.","중국 남조의 영향을 받은 벽돌무덤이다.","돌을 계단식으로 쌓은 돌무지무덤이다."],"ans":2,"exp":"공주에 있는 무령왕릉은 중국 남조의 영향을 받아 벽돌을 쌓아 만든 무덤으로, 무덤 주인을 알려 주는 지석이 나왔다. 돌무지덧널무덤은 신라의 천마총 등이고, 사신도 벽화는 고구려 강서대묘가 대표적이며, 계단식 돌무지무덤은 고구려 장군총과 백제 석촌동 고분이다."},
{"id":"h23","subj":"한국사","unit":"삼국 시대","q":"(가) 나라의 사회 모습으로 옳은 것은?\n\n(가) ______에서는 나라에 큰일이 있으면 반드시 여러 사람이 모여 의논하였다. 이를 화백이라 하는데, 한 사람이라도 반대하면 결정하지 못하였다.\n- 「신당서」","opts":["정사암에 모여 재상을 뽑았다.","제가 회의에서 중대한 범죄자를 처벌하였다.","경당에서 청소년에게 글과 활쏘기를 가르쳤다.","골품에 따라 오를 수 있는 관등에 한계가 있었다."],"ans":3,"exp":"화백 회의는 신라의 귀족 회의로 만장일치로 나랏일을 결정하였다. 신라에서는 골품에 따라 관등 승진의 상한과 일상생활까지 제한을 받았다. 정사암 회의는 백제, 제가 회의와 경당은 고구려의 것이다."},
{"id":"h24","subj":"한국사","unit":"삼국 시대","q":"다음 시가 지어진 전쟁에 대한 설명으로 옳은 것은?\n\n신묘한 계책은 하늘의 이치를 다하였고\n기묘한 꾀는 땅의 이치를 꿰뚫었네.\n싸움에 이겨 공이 이미 높으니\n만족함을 알고 그만두기를 바라노라.\n- 「삼국사기」","opts":["위의 관구검이 환도성을 함락하였다.","안시성의 군민이 당의 군대를 물리쳤다.","수의 별동대가 살수에서 크게 패하였다.","당이 평양에 안동 도호부를 설치하였다."],"ans":2,"exp":"제시된 시는 을지문덕이 수의 장수 우중문에게 보낸 것이다. 612년 을지문덕은 평양성 가까이 쳐들어온 수의 별동대를 살수에서 크게 무찔렀다(살수 대첩). 안시성 싸움은 645년 당과의 전쟁, 안동 도호부 설치는 고구려 멸망 뒤, 관구검의 침입은 3세기 동천왕 때의 일이다."},
{"id":"h26","subj":"한국사","unit":"남북국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n대조영의 뒤를 이어 즉위한 __왕__은 당이 흑수 말갈과 손잡고 발해를 압박하자, 동생 대문예에게 흑수 말갈을 치게 하였다. 대문예가 이에 반대하다가 당으로 달아나면서 당과의 관계는 더욱 나빠졌다. 한편 일본에 처음으로 사신을 보내 국교를 맺었다.","opts":["인안이라는 연호를 사용하였다.","대흥이라는 연호를 사용하였다.","상경 용천부로 도읍을 옮겼다.","전성기를 맞아 해동성국이라 불렸다."],"ans":0,"exp":"밑줄 친 왕은 대조영의 뒤를 이은 무왕(대무예)으로, 인안이라는 독자 연호를 썼고 장문휴를 보내 당의 등주를 공격하기도 하였다. 상경 천도와 대흥 연호는 문왕, 해동성국이라 불릴 만큼 전성기를 이룬 것은 선왕 무렵의 일이다."},
{"id":"h28","subj":"한국사","unit":"남북국 시대","q":"다음 사건이 일어난 시기의 상황으로 옳은 것은?\n\n나라 안의 여러 주와 군에서 공물과 조세를 보내지 않아 나라의 창고가 비고 재정이 어려워졌다. 왕이 사신을 보내 독촉하니 곳곳에서 도적이 벌 떼처럼 일어났다. 이때 원종과 애노 등이 사벌주를 근거로 반란을 일으켰다.\n- 「삼국사기」","opts":["진골 출신이 처음으로 왕위에 올랐다.","녹읍이 폐지되어 귀족의 경제 기반이 약해졌다.","6두품 일부가 골품제를 비판하며 호족과 손잡았다.","집사부 시중의 권한이 강해지고 상대등의 힘이 약해졌다."],"ans":2,"exp":"원종과 애노의 난은 신라 하대인 9세기 말 진성 여왕 때 일어났다. 이 시기에는 지방에서 호족이 성장하였고, 6두품 일부는 골품제를 비판하며 호족과 연계하였다. 시중 권한 강화와 녹읍 폐지는 신라 중대의 모습이고, 진골 출신으로 처음 왕이 된 사람은 중대를 연 무열왕이다."},
{"id":"h29","subj":"한국사","unit":"남북국 시대","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n문무왕이 도성을 새로 쌓으려고 (가) ______에게 의견을 물었다. 그가 말하기를 “비록 들판의 초가집에 살더라도 바른 도를 행하면 복이 오래갈 것이요, 그렇지 않으면 사람을 수고롭게 하여 성을 쌓더라도 이익이 없을 것입니다.”라고 하니, 왕이 공사를 그만두었다.\n- 「삼국사기」","opts":["부석사를 세우고 화엄 사상을 정립하였다.","무애가를 지어 불교의 대중화에 힘썼다.","인도를 다녀와 『왕오천축국전』을 썼다.","『십문화쟁론』을 지어 종파 간 대립을 풀려 하였다."],"ans":0,"exp":"문무왕에게 성을 쌓지 말라고 건의한 승려는 의상이다. 의상은 당에서 화엄학을 공부하고 돌아와 부석사를 세우고 화엄 사상을 정립했으며, 「화엄일승법계도」를 지었다. 무애가와 『십문화쟁론』은 원효, 『왕오천축국전』은 혜초와 관련된 것이다."},
{"id":"h30","subj":"한국사","unit":"남북국 시대","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 신라 왕실의 후손으로 전한다. 세달사에서 승려가 되어 스스로 선종이라 이름하였고, 뒤에 북원의 양길에게 몸을 맡겨 세력을 키웠다. 왕이 된 뒤에는 스스로 미륵불이라 일컬으며 머리에 금빛 고깔을 썼다.\n- 「삼국사기」","opts":["완산주에 도읍을 정하고 나라를 세웠다.","신라에 쳐들어가 경애왕을 죽게 하였다.","국호를 마진으로 바꾸고 철원으로 도읍을 옮겼다.","후당과 오월에 사신을 보내 외교 관계를 맺었다."],"ans":2,"exp":"세달사의 승려였다가 양길의 부하가 되고 스스로 미륵불이라 한 인물은 궁예이다. 궁예는 송악에서 후고구려를 세운 뒤 국호를 마진으로 바꾸고 철원으로 도읍을 옮겼으며, 다시 국호를 태봉으로 고쳤다. 완산주에 도읍한 것, 경애왕을 죽게 한 것, 후당과 오월에 사신을 보낸 것은 모두 후백제 견훤의 활동이다."},
{"id":"h31","subj":"한국사","unit":"고려 전기","q":"다음 유훈을 남긴 왕의 정책으로 옳은 것은?\n\n○ 우리나라의 대업은 반드시 여러 부처가 지켜 주는 힘에 의지한 것이니, 사원을 세우고 주지를 보내어 불도를 닦게 하라.\n○ 서경은 물의 덕이 순조로워 우리나라 지맥의 근본이 되니, 마땅히 네 계절의 가운데 달마다 가서 백 일 넘게 머물러 나라를 편안하게 하라.\n- 「고려사」","opts":["과거제를 처음 실시하였다.","전시과 제도를 처음 시행하였다.","최승로의 시무 28조를 받아들였다.","사심관 제도와 기인 제도를 실시하였다."],"ans":3,"exp":"제시된 글은 태조가 후대 왕들에게 남긴 훈요 10조의 일부이다. 태조는 호족을 견제하고 지방을 통제하려고 사심관 제도와 기인 제도를 실시했으며, 혼인 정책과 사성 정책으로 호족을 포섭하였다. 과거제 실시는 광종, 시무 28조 수용은 성종, 전시과의 첫 시행은 경종 때의 일이다."},
{"id":"h32","subj":"한국사","unit":"고려 전기","q":"다음 건의를 받아들인 왕의 정책으로 옳은 것은?\n\n우리 태조께서 나라를 통일한 뒤에 지방관을 두려 하였으나, 나라를 세운 초기라 일이 많아 겨를이 없었습니다. 지금 살펴보건대 지방의 세력가들이 늘 공무를 핑계 삼아 백성을 괴롭히니, 백성이 견디지 못합니다. 청컨대 지방관을 두소서.\n- 「고려사」","opts":["북쪽 국경에 천리장성을 쌓았다.","광덕, 준풍 등의 연호를 사용하였다.","12목을 설치하고 지방관을 파견하였다.","흑창을 두어 가난한 백성을 구제하였다."],"ans":2,"exp":"제시된 글은 최승로가 성종에게 올린 시무 28조의 내용이다. 성종은 이를 받아들여 12목에 지방관을 파견하고 유교 정치 이념에 따라 제도를 정비하였다. 광덕, 준풍 연호는 광종, 천리장성 축조는 덕종에서 정종(靖宗) 때, 흑창 설치는 태조 때의 일이다."},
{"id":"h34","subj":"한국사","unit":"고려 전기","q":"밑줄 친 ‘그’의 활동으로 옳은 것은?\n\n__그__가 말하기를 “압록강 안팎도 우리 땅인데, 지금 여진이 그 사이에 훔쳐 살면서 길을 막고 있어 바다를 건너는 것보다 가기가 어렵다. 조빙이 통하지 못하는 것은 여진 때문이니, 여진을 쫓아내고 우리 옛 땅을 돌려주어 성을 쌓고 길을 통하게 한다면 어찌 교빙하지 않겠는가.”라고 하였다.\n- 「고려사」","opts":["귀주에서 거란군을 크게 물리쳤다.","쌍성총관부를 공격하여 되찾았다.","외교 담판으로 강동 6주를 확보하였다.","여진을 정벌하고 동북 9성을 쌓았다."],"ans":2,"exp":"제시된 글은 993년 거란의 1차 침입 때 서희가 소손녕과 벌인 담판의 내용이다. 서희는 거란과 교류할 것을 약속하고 압록강 동쪽의 강동 6주를 확보하였다. 동북 9성은 윤관이 여진을 정벌하고 쌓았고, 귀주 대첩은 거란의 3차 침입 때 강감찬이 거둔 승리이며, 쌍성총관부 수복은 공민왕 때의 일이다."},
{"id":"h35","subj":"한국사","unit":"고려 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 이자겸의 난\n(나) 무신 정변\n(다) 귀주 대첩\n(라) 묘청의 서경 천도 운동","opts":["(다) - (라) - (가) - (나)","(가) - (다) - (라) - (나)","(다) - (가) - (나) - (라)","(다) - (가) - (라) - (나)"],"ans":3,"exp":"귀주 대첩은 1019년, 이자겸의 난은 1126년, 묘청의 서경 천도 운동은 1135년, 무신 정변은 1170년이다. 이자겸의 난으로 개경의 궁궐이 불타고 왕권이 약해진 뒤 서경 천도 운동이 일어났고, 이후 문벌 사회의 모순이 깊어져 무신 정변으로 이어졌다."},
{"id":"h36","subj":"한국사","unit":"고려 전기","q":"다음 주장을 편 세력이 일으킨 사건에 대한 설명으로 옳은 것은?\n\n서경 임원역의 땅은 풍수에서 말하는 아주 좋은 터입니다. 이곳에 궁궐을 짓고 옮겨 가시면 천하를 아우를 수 있고, 금이 예물을 가지고 스스로 항복할 것이며, 서른여섯 나라가 모두 신하가 될 것입니다.\n- 「고려사」","opts":["김부식이 이끄는 관군에게 진압되었다.","이성계가 위화도에서 군대를 돌렸다.","최충헌이 이의민을 없애고 권력을 잡았다.","만적이 신분 해방을 내세워 봉기를 꾀하였다."],"ans":0,"exp":"제시된 글은 묘청 등 서경 세력의 주장이다. 묘청은 서경 천도와 칭제 건원, 금 정벌을 주장하다가 1135년 서경에서 난을 일으켰으나 김부식이 이끈 관군에게 진압되었다. 만적의 봉기 시도와 최충헌의 집권은 무신 집권기, 위화도 회군은 고려 말의 일이다."},
{"id":"h37","subj":"한국사","unit":"고려 후기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 아버지 최충헌의 뒤를 이어 권력을 잡았다. 자기 집에 서방을 두어 문신들을 번갈아 숙직하게 하였고, 도둑을 막는다는 구실로 야별초를 조직하였다. 몽골이 쳐들어오자 도읍을 강화도로 옮겨 맞섰다.","opts":["교정도감을 처음 설치하였다.","정방을 설치하여 인사권을 장악하였다.","중방을 중심으로 권력을 행사하였다.","봉사 10조를 올려 개혁을 건의하였다."],"ans":1,"exp":"최충헌의 아들로 강화 천도를 단행한 (가)는 최우이다. 최우는 자기 집에 정방을 설치하여 인사권을 장악하였다. 교정도감 설치와 봉사 10조 건의는 최충헌이 한 일이고, 중방을 중심으로 권력을 행사한 것은 정중부 등 무신 정권 초기의 집권자들이다."},
{"id":"h38","subj":"한국사","unit":"고려 후기","q":"밑줄 친 ‘이 시기’에 일어난 봉기에 대한 설명으로 옳은 것은?\n\n__이 시기__에는 신분이 낮은 이들도 권력자가 되는 일이 생기면서 신분 질서가 흔들렸다. 지배층의 수탈이 심해지자 농민과 천민의 봉기가 전국에서 일어났다. 개경에서는 만적이 “장수와 재상의 씨가 따로 있겠는가.”라며 노비들을 모아 봉기를 꾀하였다.","opts":["김사미와 효심은 서경에서 봉기하였다.","망이·망소이는 공주 명학소에서 봉기하였다.","조위총은 신라 부흥을 내세우며 봉기하였다.","최광수는 백제 부흥을 내세우며 담양에서 봉기하였다."],"ans":1,"exp":"만적이 봉기를 꾀한 시기는 무신 집권기이다. 이 시기에 망이·망소이는 특수 행정 구역인 공주 명학소에서 지나친 수탈에 저항하여 봉기하였다. 김사미와 효심은 경상도의 운문과 초전에서 봉기하였고, 조위총은 서경 유수로서 무신 정권에 반대하여 군사를 일으켰다. 최광수는 서경에서 고구려 부흥을 내세웠고, 담양에서 백제 부흥을 내세운 이는 이연년 형제이다."},
{"id":"h40","subj":"한국사","unit":"고려 후기","q":"(가)에 대한 설명으로 옳지 않은 것은?\n\n(가) ______이/가 반란을 일으켰다. … (중략) … 배중손 등이 사람들을 시켜 “몽골 군사가 대거 몰려와 백성을 죽이고 있으니, 나라를 돕고자 하는 사람은 모두 구정으로 모이라.”라고 외치게 하였다. 이어 승화후 온을 왕으로 삼고 관부를 설치하였다.\n- 「고려사」","opts":["개경 환도에 반대하여 봉기하였다.","최우가 설치한 야별초에서 비롯되었다.","진도와 제주도로 근거지를 옮기며 싸웠다.","윤관의 건의에 따라 여진 정벌을 위해 만들어졌다."],"ans":3,"exp":"배중손의 지휘 아래 승화후 온을 왕으로 세운 (가)는 삼별초이다. 윤관의 건의로 여진 정벌을 위해 만든 부대는 별무반이므로 옳지 않다. 삼별초는 최우가 만든 야별초에서 비롯된 좌별초, 우별초와 신의군으로 이루어졌으며, 고려 정부가 몽골과 강화하고 개경으로 돌아가자 이에 반대하여 진도와 제주도로 옮겨 가며 항쟁하였다."},
{"id":"h43","subj":"한국사","unit":"고려 전기","q":"밑줄 친 ‘이 제도’에 대한 설명으로 옳은 것은?\n\n경종 원년 11월에 처음으로 직관과 산관의 각 품에 따라 __이 제도__를 정하였다. 이때에는 관품의 높고 낮음은 따지지 않고 다만 인품만으로 지급 기준을 정하였다. … (중략) … 목종 원년에 이를 고쳐 정하였고, 문종 30년에 다시 고쳐 정하였다.\n- 「고려사」","opts":["관리에게 전지와 시지의 수조권을 지급하였다.","지급 대상 토지를 경기 지방으로 한정하였다.","수신전, 휼양전의 이름으로 세습을 허용하였다.","후삼국 통일에 공을 세운 신하와 군사에게 지급하였다."],"ans":0,"exp":"경종 때 처음 정하고 목종과 문종 때 고친 제도는 전시과이다. 전시과는 관리에게 등급에 따라 곡물을 거둘 수 있는 전지와 땔감을 얻을 수 있는 시지의 수조권을 준 제도이다. 경기 지방으로 한정한 것과 수신전, 휼양전은 과전법의 내용이고, 통일에 공을 세운 사람에게 준 토지는 태조 때의 역분전이다."},
{"id":"h44","subj":"한국사","unit":"고려 전기","q":"다음 상소가 올라온 시대의 사회 모습으로 옳은 것은?\n\n박유가 글을 올려 말하기를 “우리나라는 남자가 적고 여자가 많은데도 신분이 높든 낮든 처를 하나만 두고 있습니다. 청컨대 여러 신하에게 처와 첩을 두게 하소서.”라고 하였다. 부녀자들이 이 소식을 듣고 두려워하며 박유를 원망하였고, 재상들 가운데에도 부인을 두려워하는 이가 있어 결국 시행하지 못하였다.\n- 「고려사」","opts":["제사는 반드시 맏아들이 지냈다.","재산은 아들딸 구별 없이 고르게 상속되었다.","재혼한 여성의 자손은 벼슬길이 법으로 막혔다.","혼인 뒤 곧바로 남자 집에서 사는 것이 일반적이었다."],"ans":1,"exp":"제시된 글은 고려 충렬왕 때 박유가 올린 상소로, 고려에서 일부일처가 일반적이었고 여성의 지위가 비교적 높았음을 보여 준다. 고려 시대에는 재산을 자녀에게 고르게 나누어 주었고, 아들이 없으면 딸이 제사를 지냈으며, 혼인 뒤 남자가 여자 집에서 사는 일이 많았다. 맏아들 중심의 제사와 남자 집에서의 혼인 생활은 조선 후기에 자리 잡았고, 재혼한 여성의 자손에 대한 관직 제한은 조선 성종 때 법으로 정해졌다."},
{"id":"h45","subj":"한국사","unit":"고려 후기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______이/가 말하기를 “지금의 불교계를 보면 아침저녁으로 하는 일이 비록 부처의 법에 의지한다고 하나, 자신을 내세우고 이익을 구하는 데 열중한다. … (중략) … 마땅히 명예와 이익을 버리고 산림에 은둔하여 모임을 만들자. 항상 선정을 익히고 지혜를 고르게 하는 데 힘쓰자.”라고 하였다.\n- 「권수정혜결사문」","opts":["수선사 결사를 이끌며 돈오점수를 주장하였다.","해동 천태종을 창시하고 교관겸수를 주장하였다.","만덕사에서 백련 결사를 이끌며 참회 수행을 강조하였다.","유교와 불교가 다르지 않다는 유불 일치설을 주장하였다."],"ans":0,"exp":"명예와 이익을 버리고 선정과 지혜를 함께 닦는 결사를 만들자고 한 (가)는 지눌이다. 지눌은 수선사 결사를 조직하여 불교 개혁에 힘썼고, 깨달은 뒤에도 꾸준히 수행하는 돈오점수와 선과 교학을 함께 닦는 정혜쌍수를 내세웠다. 해동 천태종과 교관겸수는 의천, 백련 결사는 요세, 유불 일치설은 혜심과 관련된 것이다."},
{"id":"h46","subj":"한국사","unit":"고려 후기","q":"(가) 책에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 고려 충렬왕 때 한 승려가 지은 책이다. 왕력, 기이, 흥법, 탑상 등 아홉 편으로 이루어져 있으며, 불교에 관한 이야기와 민간에 전하던 설화를 많이 실었다. 향가 14수가 실려 있어 국문학 연구에도 귀중한 자료가 된다.","opts":["동명왕의 업적을 서사시로 읊었다.","고조선을 세운 단군의 건국 이야기를 실었다.","본기, 열전 등을 갖춘 기전체로 서술되었다.","현재 전하는 우리나라의 가장 오래된 역사서이다."],"ans":1,"exp":"(가)는 원 간섭기에 승려 일연이 쓴 『삼국유사』로, 불교사를 중심으로 설화와 전래 기록을 모았으며 단군의 건국 이야기를 실었다. 현존하는 가장 오래된 역사서이자 기전체로 쓰인 책은 김부식의 『삼국사기』이고, 동명왕의 업적을 서사시로 읊은 것은 이규보의 「동명왕편」이다."},
{"id":"h47","subj":"한국사","unit":"고려 후기","q":"고려 시대에 만들어진 문화유산으로 옳은 것은?","opts":["부석사 무량수전","법주사 팔상전","불국사 3층 석탑","원각사지 10층 석탑"],"ans":0,"exp":"영주 부석사 무량수전은 고려 시대의 대표적인 목조 건축으로 주심포 양식과 배흘림기둥으로 유명하다. 법주사 팔상전은 조선 후기, 불국사 3층 석탑은 통일 신라, 원각사지 10층 석탑은 조선 세조 때 만들어졌다."},
{"id":"h48","subj":"한국사","unit":"고려 후기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 왜구를 막는 데에는 화약만 한 것이 없다고 여겼다. 중국 상인에게서 염초를 만드는 방법을 배워 화약을 만드는 데 성공하였고, 조정에 건의하여 화통도감을 설치하게 하였다.","opts":["흥화진에서 거란군을 무찔렀다.","두만강 유역에 6진을 개척하였다.","진포에서 화포를 써서 왜구를 물리쳤다.","군사를 이끌고 쓰시마섬을 정벌하였다."],"ans":2,"exp":"화약을 만들고 화통도감 설치를 건의한 (가)는 최무선이다. 최무선은 1380년 진포에서 화포로 왜구의 배를 불태웠다. 흥화진 전투는 거란의 3차 침입 때 강감찬이 이끌었고, 6진 개척은 조선 세종 때 김종서가, 쓰시마섬 정벌은 고려 말 박위와 조선 세종 때 이종무가 한 일이다."},
{"id":"h49","subj":"한국사","unit":"조선 전기","q":"(가) 왕의 정책으로 옳은 것은?\n\n(가) ______은/는 두 차례 왕자의 난을 거쳐 왕위에 올랐다. 도읍을 개경에서 다시 한양으로 옮겼고, 억울한 일을 당한 백성이 직접 호소할 수 있도록 신문고를 설치하였다. 주자소를 두어 구리 활자인 계미자를 만들었다.","opts":["직전법을 실시하였다.","집현전을 설치하였다.","『경국대전』을 완성하여 반포하였다.","6조 직계제를 실시하고 사병을 없앴다."],"ans":3,"exp":"왕자의 난을 거쳐 즉위하고 신문고를 설치한 (가)는 태종이다. 태종은 6조가 의정부를 거치지 않고 왕에게 직접 보고하는 6조 직계제를 실시하고 사병을 없애 왕권을 강화했으며, 호패법을 시행하였다. 『경국대전』 완성은 성종, 직전법은 세조, 집현전 설치는 세종 때의 일이다."},
{"id":"h51","subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘왕’의 정책으로 옳은 것은?\n\n__왕__은 함길도에서 이시애가 난을 일으키자 이를 진압하고, 난에 관련되었다 하여 유향소를 없앴다. 불교를 깊이 믿어 간경도감을 두고 불경을 한글로 옮겨 펴냈으며, 한양에 원각사를 세웠다.","opts":["의정부 서사제를 실시하였다.","현량과를 실시하여 사림을 등용하였다.","현직 관리에게만 수조권을 주는 직전법을 실시하였다.","관청이 조세를 거두어 관리에게 나누어 주게 하였다."],"ans":2,"exp":"이시애의 난을 진압하고 간경도감을 둔 왕은 세조이다. 세조는 관리에게 줄 토지가 모자라자 현직 관리에게만 수조권을 주는 직전법을 실시하였고, 6조 직계제를 다시 시행하고 집현전을 없앴다. 관청이 조세를 거두어 나누어 주는 관수 관급제는 성종, 의정부 서사제는 세종, 현량과는 중종 때 조광조의 건의로 실시되었다."},
{"id":"h52","subj":"한국사","unit":"조선 전기","q":"(가)에 해당하는 기구는?\n\n(가) ______은/는 왕명을 받아 전달하고 신하들이 올리는 글을 왕에게 올리는 일을 맡은 왕의 비서 기관이다. 도승지를 비롯한 여섯 승지가 6조의 일을 나누어 맡았다. 이곳에서 날마다 적은 일기는 유네스코 세계 기록 유산으로 등재되었다.","opts":["승정원","의금부","춘추관","사간원"],"ans":0,"exp":"왕명의 출납을 맡은 왕의 비서 기관은 승정원이며, 이곳에서 적은 『승정원일기』는 세계 기록 유산이다. 의금부는 왕명에 따라 나라의 큰 죄인을 다스렸고, 춘추관은 역사서의 편찬과 보관을 맡았으며, 사간원은 왕에게 간쟁하는 일을 하였다."},
{"id":"h53","subj":"한국사","unit":"조선 전기","q":"다음 글이 발단이 되어 일어난 사건은?\n\n꿈에 한 신인이 나타나 말하기를 “나는 초나라 회왕 손심인데, 서초 패왕에게 죽임을 당하여 빈강에 잠겼다.”라고 하고는 홀연히 사라졌다. 나는 꿈에서 깨어 놀라며 … (중략) … 마침내 글을 지어 그를 조문하였다.\n- 「조의제문」","opts":["갑자사화","기묘사화","무오사화","을사사화"],"ans":2,"exp":"제시된 글은 김종직이 지은 「조의제문」이다. 무오사화는 연산군 때인 1498년 김일손이 이 글을 사초에 실은 것을 빌미로 훈구 세력이 사림을 제거한 사건이다. 갑자사화는 연산군의 생모 윤씨 폐위 문제, 기묘사화는 중종 때 조광조의 개혁에 대한 훈구의 반발, 을사사화는 명종 때 외척 사이의 다툼으로 일어났다."},
{"id":"h54","subj":"한국사","unit":"조선 전기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 중종의 신임을 받아 개혁을 이끌었다. 왕이 학문과 덕을 닦아야 한다며 경연을 강화하였고, 『소학』 교육을 장려하고 향약을 널리 시행하려 하였다. 그러나 훈구 세력의 반발을 사 능주로 유배되었다가 죽임을 당하였다.","opts":["백운동 서원을 세웠다.","『동호문답』에서 수미법을 주장하였다.","『성학십도』를 지어 왕에게 올렸다.","위훈 삭제를 주장하고 소격서를 없애자고 하였다."],"ans":3,"exp":"중종 때 개혁을 이끌다 기묘사화로 죽임을 당한 (가)는 조광조이다. 조광조는 현량과 실시, 소격서 폐지, 위훈 삭제 등을 추진하다가 훈구 세력의 반발로 제거되었다. 백운동 서원은 주세붕이 세웠고, 『성학십도』는 이황, 『동호문답』은 이이의 저술이다."},
{"id":"h55","subj":"한국사","unit":"조선 전기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 강릉에서 태어났으며, 과거에 아홉 차례 장원으로 급제하였다. 『동호문답』과 「만언봉사」를 올려 공납의 폐단을 고치는 등 여러 개혁안을 내놓았고, 처음 글을 배우는 이들을 위하여 『격몽요결』을 지었다. 해주에서 향약을 만들어 시행하기도 하였다.","opts":["예안 향약을 만들었다.","『성학십도』를 지어 왕에게 올렸다.","『성학집요』를 지어 왕에게 올렸다.","일본 성리학의 발전에 영향을 주었다."],"ans":2,"exp":"『동호문답』과 『격몽요결』을 짓고 해주 향약을 만든 (가)는 이이이다. 이이는 『성학집요』에서 현명한 신하가 왕에게 성학을 가르쳐 기질을 바꾸게 해야 한다고 하였다. 『성학십도』와 예안 향약은 이황의 것이며, 이황의 학문은 임진왜란 이후 일본 성리학에 영향을 주었다."},
{"id":"h58","subj":"한국사","unit":"조선 전기","q":"다음 서문이 실린 책은?\n\n지방마다 풍토가 같지 않아 곡식을 심고 가꾸는 법이 저마다 알맞은 바가 있으니, 옛 책의 내용과 다 같을 수 없다. 이에 여러 도의 감사에게 명하여 고을의 경험 많은 농부들을 찾아가, 그 땅에서 이미 시험해 본 방법을 물어 아뢰게 하였다.\n- 「세종실록」","opts":["『농사직설』","『금양잡록』","『농가집성』","『임원경제지』"],"ans":0,"exp":"『농사직설』은 세종 때 정초 등이 각 지방 농민의 경험을 모아 우리 풍토에 맞는 농사법을 정리한 책이다. 『금양잡록』은 성종 때 강희맹이 경기도 금양에서 농사지은 경험을 적은 책이고, 『농가집성』은 효종 때 신속이 여러 농서를 묶은 책이며, 『임원경제지』는 19세기에 서유구가 지은 농촌 생활 백과사전이다."},
{"id":"h59","subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘이 기관’에 대한 설명으로 옳은 것은?\n\n풍기 군수 주세붕이 안향을 기리려고 순흥에 세운 것이 __이 기관__의 시초이다. 그 뒤 이황의 건의로 왕이 이름을 적은 현판을 내리고 책과 노비를 지원하였다. 사림의 세력이 커지면서 전국 곳곳에 세워졌다.","opts":["유향소를 통제하려고 한양에 둔 기구이다.","생원과 진사에게 입학 자격을 준 최고 교육 기관이다.","중앙에서 교수나 훈도를 보낸 지방의 관립 교육 기관이다.","선현에게 제사를 지내고 성리학을 가르친 사립 교육 기관이다."],"ans":3,"exp":"주세붕이 세운 백운동 서원에서 비롯된 기관은 서원이다. 서원은 사림이 세운 사립 교육 기관으로 선현에 대한 제사와 성리학 교육을 맡았다. 교수나 훈도가 파견된 지방 관립 학교는 향교, 생원과 진사가 입학한 최고 교육 기관은 성균관, 유향소를 통제한 기구는 경재소이다."},
{"id":"h60","subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘이 시기’의 대외 관계에 대한 설명으로 옳은 것은?\n\n__이 시기__에 조선은 명과는 사대 관계를, 여진과 일본 등 주변 나라와는 교린 관계를 맺었다. 여진에 대해서는 국경 지역인 경성과 경원에 무역소를 열어 교역을 허락하는 한편, 국경을 침범하면 군대를 보내 토벌하였다.","opts":["백두산정계비를 세워 국경을 정하였다.","청을 정벌하자는 북벌을 추진하였다.","기유약조를 맺어 일본과 무역을 다시 시작하였다.","3포를 열고 계해약조를 맺어 일본과의 무역을 제한하였다."],"ans":3,"exp":"명과 사대 관계를 맺고 여진에 무역소를 열어 준 시기는 조선 전기이다. 세종 때 조선은 부산포, 제포, 염포의 3포를 열어 주고 계해약조를 맺어 쓰시마섬과의 무역 규모를 제한하였다. 북벌 추진은 효종, 기유약조는 임진왜란 뒤 광해군, 백두산정계비 건립은 숙종 때의 일로 모두 조선 후기에 해당한다."},
{"id":"h61","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 만들어진 것으로 옳지 않은 것은?","opts":["자격루","거중기","측우기","앙부일구"],"ans":1,"exp":"거중기는 정조 때 정약용이 만들어 수원 화성을 쌓는 데 쓴 기구이다. 물시계인 자격루, 해시계인 앙부일구, 강우량을 재는 측우기는 모두 세종 때 만들어졌다."},
{"id":"h62","subj":"한국사","unit":"조선 전기","q":"다음 대립의 결과로 옳은 것은?\n\n김효원이 이조 전랑의 후보에 오르자 심의겸은 그가 지난날 권세가의 집을 드나들었다며 반대하였다. 뒤에 심의겸의 아우 심충겸이 전랑의 후보에 오르자, 이번에는 김효원이 외척에게 전랑을 맡길 수 없다며 반대하였다.","opts":["서인이 노론과 소론으로 나뉘었다.","사림이 동인과 서인으로 나뉘었다.","동인이 남인과 북인으로 나뉘었다.","훈구 세력이 사림을 대거 몰아냈다."],"ans":1,"exp":"선조 때 사림은 척신 정치의 청산 문제와 이조 전랑 임명 문제를 두고 김효원을 지지하는 동인과 심의겸을 지지하는 서인으로 나뉘었다. 동인이 남인과 북인으로 나뉜 것은 정여립 모반 사건과 정철의 처벌 문제, 서인이 노론과 소론으로 나뉜 것은 숙종 때 남인에 대한 처벌 문제가 계기였다. 훈구 세력이 사림을 몰아낸 사화는 그보다 앞선 연산군에서 명종 때의 일이다."},
{"id":"h63","subj":"한국사","unit":"조선 후기","q":"(가) 왕 때의 사실로 옳은 것은?\n\n(가) ______은/는 임진왜란 뒤 토지 대장과 호적을 새로 만들어 재정을 늘리고 성곽과 무기를 손보았다. 허준이 『동의보감』을 완성한 것도 이 왕 때이다. 그러나 영창 대군을 죽이고 인목 대비를 유폐한 일을 구실로 서인이 일으킨 정변으로 왕위에서 쫓겨났다.","opts":["훈련도감을 처음 설치하였다.","이괄이 난을 일으켜 한양을 점령하였다.","청의 요청으로 나선 정벌에 조총 부대를 보냈다.","강홍립의 부대를 명에 보내며 상황에 맞게 대처하게 하였다."],"ans":3,"exp":"(가)는 인조반정으로 쫓겨난 광해군이다. 광해군은 명과 후금 사이에서 중립 외교를 펴 강홍립에게 형세를 보아 대처하라고 지시하였다. 이괄의 난은 인조, 나선 정벌은 효종, 훈련도감 설치는 선조 때의 일이다."},
{"id":"h64","subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘이 전쟁’에 대한 설명으로 옳은 것은?\n\n후금은 나라 이름을 청으로 바꾸고 조선에 군신 관계를 요구하였다. 조정에서는 최명길 등이 외교로 풀자고 하였으나 김상헌 등 싸우자는 주장이 우세하여 요구를 거절하였다. 이에 청 태종이 직접 군대를 이끌고 쳐들어와 __이 전쟁__이 일어났다.","opts":["곽재우가 의령에서 의병을 일으켰다.","정봉수와 이립이 의병을 일으켜 싸웠다.","형제 관계를 맺는 것으로 화의가 이루어졌다.","인조가 남한산성에서 버티다가 삼전도에서 항복하였다."],"ans":3,"exp":"청의 군신 관계 요구를 거절하여 일어난 전쟁은 병자호란(1636)이다. 인조는 남한산성에서 40여 일을 버티다가 삼전도에서 항복하였다. 형제 관계의 화의와 정봉수·이립의 의병은 정묘호란, 곽재우의 의병은 임진왜란 때의 일이다."},
{"id":"h67","subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘이 왕’의 정책으로 옳은 것은?\n\n__이 왕__은 아버지 사도 세자의 묘를 수원으로 옮기고 그 가까이에 화성을 쌓았다. 또 왕실 도서관인 규장각을 두어 학문과 정책을 연구하게 하고, 박제가와 유득공 등 서얼 출신 학자를 검서관으로 등용하였다.","opts":["서원을 47곳만 남기고 정리하였다.","『속대전』을 편찬하여 법전을 정비하였다.","삼정이정청을 두어 삼정의 문란을 고치려 하였다.","초계문신제를 시행하여 젊은 관리를 다시 교육하였다."],"ans":3,"exp":"화성을 쌓고 규장각을 둔 왕은 정조이다. 정조는 젊은 문신을 뽑아 규장각에서 다시 교육하는 초계문신제를 시행하였다. 『속대전』은 영조, 삼정이정청은 철종, 서원 정리는 고종 때 흥선 대원군이 한 일이다."},
{"id":"h68","subj":"한국사","unit":"조선 후기","q":"(가) 봉기에 대한 설명으로 옳은 것은?\n\n1811년 몰락 양반 출신의 지도자가 영세 농민, 광산 노동자 등을 모아 평안도 가산에서 (가) ______을/를 일으켰다. 봉기군은 선천, 정주 등 청천강 이북의 여러 고을을 빠르게 차지하였으나, 이듬해 정주성에서 관군에게 진압되었다.","opts":["서북 지역에 대한 차별에 반발하여 일어났다.","수습책으로 삼정이정청이 설치되었다.","경상 우병사 백낙신의 수탈이 계기가 되었다.","고부 군수의 횡포에 맞서 전봉준이 이끌었다."],"ans":0,"exp":"(가)는 홍경래의 난이다. 세도 정치의 부패와 서북 지역(평안도) 사람에 대한 차별이 원인이 되었다. 백낙신의 수탈과 삼정이정청 설치는 임술 농민 봉기(1862), 고부 군수의 횡포는 동학 농민 운동(1894)과 관련된다."},
{"id":"h69","subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘이 시기’의 경제 모습으로 옳지 않은 것은?\n\n__이 시기__에는 장시가 전국에 1,000여 곳으로 늘어났고, 보부상이 장시를 돌며 물건을 팔았다. 상평통보가 전국에서 쓰이면서 세금과 소작료를 동전으로 내는 일도 많아졌다. 그러나 지주나 대상인이 동전을 재산으로 쌓아 두어 시중에 동전이 모자라는 일이 생기기도 하였다.","opts":["송상, 만상 등 사상의 활동이 활발해졌다.","담배, 인삼 같은 상품 작물의 재배가 늘었다.","관영 수공업이 발달하고 민영 수공업은 쇠퇴하였다.","모내기법이 퍼지면서 넓은 땅을 경작하는 농민이 나타났다."],"ans":2,"exp":"장시가 1,000여 곳으로 늘고 전황이 나타난 시기는 조선 후기이다. 이 시기에는 장인 등록제가 무너지면서 관영 수공업이 쇠퇴하고 민영 수공업이 발달하였다. 모내기법의 확산으로 광작이 나타나고, 상품 작물 재배와 사상의 활동이 늘어난 것은 모두 조선 후기의 모습이다."},
{"id":"h71","subj":"한국사","unit":"조선 후기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 정조의 신임을 받아 한강에 배다리를 놓고, 거중기를 만들어 화성을 쌓는 데 썼다. 정조가 세상을 떠난 뒤 천주교 박해에 얽혀 전라도 강진에서 오랫동안 유배 생활을 하였다.","opts":["영업전의 매매를 금지하자는 한전론을 주장하였다.","『북학의』에서 소비를 권장해야 생산이 늘어난다고 하였다.","신분에 따라 토지를 차등 있게 나누어 주자는 균전론을 주장하였다.","마을 단위로 토지를 함께 경작하고 일한 만큼 나누자는 여전론을 주장하였다."],"ans":3,"exp":"(가)는 정약용이다. 정약용은 한 마을(여)의 토지를 공동으로 소유·경작하고 일한 양에 따라 수확을 나누는 여전론을 주장하였다. 균전론은 유형원, 한전론은 이익의 주장이고, 『북학의』는 박제가의 저술이다."},
{"id":"h72","subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n__그__는 「양반전」과 「허생전」에서 양반의 무능과 허례를 꼬집었다. 또 『과농소초』를 지어 농업 기술을 고칠 것을 주장하고, 토지 소유의 상한선을 정하자는 한전론을 내놓았다.","opts":["『발해고』에서 남북국이라는 말을 썼다.","『의산문답』에서 지구가 돈다고 주장하였다.","『우서』에서 사농공상의 직업 평등을 주장하였다.","『열하일기』를 쓰고 수레와 선박의 이용을 강조하였다."],"ans":3,"exp":"「양반전」, 「허생전」, 『과농소초』를 쓴 인물은 박지원이다. 박지원은 청에 다녀와 『열하일기』를 쓰고 수레와 선박의 이용, 화폐 유통을 강조하였다. 『의산문답』은 홍대용, 『우서』는 유수원, 『발해고』는 유득공의 저술이다."},
{"id":"h76","subj":"한국사","unit":"조선 후기","q":"(가) 종교에 대한 설명으로 옳은 것은?\n\n경주의 몰락 양반 최제우가 창시한 (가) ______은/는 삼남 지방의 농민 사이에 빠르게 퍼졌다. 조정은 세상을 어지럽히고 백성을 속인다는 죄로 최제우를 처형하였다. 그 뒤 2대 교주 최시형은 『동경대전』과 『용담유사』를 펴내 교리를 정리하였다.","opts":["신유박해로 큰 탄압을 받았다.","시천주와 후천개벽 사상을 내세웠다.","청을 오가던 사신들이 들여왔다.","처음에는 서학이라는 학문으로 받아들여졌다."],"ans":1,"exp":"(가)는 동학이다. 동학은 마음속에 한울님을 모신다는 시천주와, 새 세상이 열린다는 후천개벽 사상을 내세웠다. 서학으로 받아들여지고 청을 오가던 사신들이 들여왔으며 신유박해를 겪은 것은 천주교이다."},
{"id":"h77","subj":"한국사","unit":"개항기","q":"밑줄 친 ‘그’의 정책으로 옳은 것은?\n\n__그__는 서원을 헐라는 명령에 유생들이 대궐 앞에 몰려와 반대하자 이렇게 말하였다. “백성을 해치는 자라면 공자가 다시 살아난다 해도 내가 용서하지 않을 것이다. 하물며 서원은 우리나라 선현을 제사하는 곳인데 지금은 도둑의 소굴이 되지 않았는가.”","opts":["통리기무아문을 설치하였다.","신식 군대인 별기군을 창설하였다.","토지 소유자에게 지계를 발급하였다.","호포제를 실시하여 양반에게도 군포를 거두었다."],"ans":3,"exp":"서원을 47곳만 남기고 철폐한 인물은 흥선 대원군이다. 흥선 대원군은 군정의 문란을 바로잡으려고 호포제를 실시하여 양반에게도 군포를 거두었다. 통리기무아문과 별기군은 개항 뒤 고종이 추진한 개화 정책이고, 지계 발급은 대한 제국의 광무개혁이다."},
{"id":"h79","subj":"한국사","unit":"개항기","q":"다음 조약에 대한 설명으로 옳지 않은 것은?\n\n제1관 조선국은 자주국이며 일본국과 평등한 권리를 가진다.\n제7관 조선국 연해의 섬과 암초를 조사하지 않아 매우 위험하므로 일본국 항해자가 자유로이 해안을 측량하도록 허가한다.","opts":["운요호 사건을 계기로 체결되었다.","최혜국 대우를 처음으로 규정하였다.","부산 외에 두 곳의 항구를 열기로 하였다.","일본인의 범죄를 일본 관리가 재판하도록 하였다."],"ans":1,"exp":"강화도 조약(조일 수호 조규, 1876)이다. 운요호 사건을 계기로 맺어졌으며 부산 외 두 곳의 개항, 해안 측량권, 영사 재판권(치외 법권)을 담았다. 최혜국 대우는 1882년 조미 수호 통상 조약에서 처음 규정되었다."},
{"id":"h80","subj":"한국사","unit":"개항기","q":"밑줄 친 ‘이 사건’의 결과로 옳은 것은?\n\n신식 군대인 별기군에 비해 차별 대우를 받던 구식 군인들은 13개월 만에 받은 급료에 겨와 모래가 섞여 있자 분노하여 들고일어났다. 군인들은 선혜청 당상 민겸호의 집을 부수고 일본 공사관을 습격하였으며, 도시 하층민도 __이 사건__에 합세하였다.","opts":["조청 상민 수륙 무역 장정이 맺어졌다.","군국기무처가 설치되었다.","청과 일본이 톈진 조약을 맺었다.","고종이 러시아 공사관으로 거처를 옮겼다."],"ans":0,"exp":"임오군란(1882)이다. 군란을 진압한 청은 조선의 내정에 간섭하면서 조청 상민 수륙 무역 장정을 맺어 청 상인의 특권을 보장받았다. 톈진 조약은 갑신정변 뒤, 군국기무처는 갑오개혁 때의 일이고, 아관 파천은 을미사변 뒤의 일이다."},
{"id":"h81","subj":"한국사","unit":"개항기","q":"다음 개혁안을 발표한 세력에 대한 설명으로 옳은 것은?\n\n1. 청에 잡혀간 흥선 대원군을 곧 돌아오게 하고, 조공하는 허례를 폐지할 것\n2. 문벌을 폐지하여 인민 평등의 권리를 세울 것\n3. 지조법을 개혁할 것","opts":["전라도 각지에 집강소를 설치하였다.","만민 공동회를 열어 민권 신장을 주장하였다.","13도 창의군을 꾸려 서울 진공 작전을 폈다.","우정총국 개국 축하연을 이용하여 정변을 일으켰다."],"ans":3,"exp":"갑신정변(1884) 때 급진 개화파가 발표한 개혁 정강이다. 김옥균, 박영효 등은 우정총국 개국 축하연을 이용하여 정변을 일으켰으나 청군의 개입으로 3일 만에 실패하였다. 집강소는 동학 농민군, 만민 공동회는 독립 협회, 13도 창의군은 정미의병과 관련된다."},
{"id":"h82","subj":"한국사","unit":"개항기","q":"(가)와 (나) 사이에 있었던 사실로 옳은 것은?\n\n(가) 농민군은 폐정 개혁을 조건으로 정부와 화약을 맺고 전주성에서 물러났다.\n(나) 농민군은 공주 우금치에서 일본군과 관군을 상대로 싸웠으나 크게 패하였다.","opts":["전봉준이 체포되어 재판을 받았다.","일본군이 경복궁을 점령하였다.","농민군이 황토현에서 관군을 이겼다.","농민군이 백산에 모여 4대 강령을 발표하였다."],"ans":1,"exp":"(가)는 전주 화약, (나)는 우금치 전투로 모두 1894년의 일이다. 그 사이에 일본군이 경복궁을 점령하고 청일 전쟁을 일으키자 농민군이 다시 봉기하였다. 백산 봉기와 황토현 전투는 전주 화약 이전, 전봉준의 체포는 우금치 전투 이후의 일이다."},
{"id":"h83","subj":"한국사","unit":"개항기","q":"밑줄 친 ‘이 개혁’의 내용으로 옳지 않은 것은?\n\n경복궁을 점령한 일본은 조선에 내정 개혁을 강요하였다. 이에 김홍집을 중심으로 한 새 내각이 들어서고, 초정부적 회의 기구인 군국기무처가 __이 개혁__을 이끌었다. 군국기무처는 석 달 남짓한 기간에 200건이 넘는 안건을 처리하였다.","opts":["과거제 폐지","연좌제 폐지","대한국 국제 반포","공사 노비법 혁파"],"ans":2,"exp":"군국기무처가 이끈 개혁은 제1차 갑오개혁(1894)이다. 과거제와 연좌제를 폐지하고 공사 노비법을 혁파하여 신분제를 없앴다. 대한국 국제는 1899년 대한 제국이 반포한 것으로 광무개혁에 해당한다."},
{"id":"h84","subj":"한국사","unit":"개항기","q":"(가) 단체의 활동으로 옳은 것은?\n\n서재필 등은 정부 관료와 개화 지식인을 모아 (가) ______을/를 만들었다. 이 단체는 청의 사신을 맞이하던 영은문 자리 부근에 독립문을 세우고, 토론회와 연설회를 열어 민중을 계몽하였다.","opts":["대성 학교와 오산 학교를 세웠다.","일본의 황무지 개간권 요구를 막아 냈다.","고종의 강제 퇴위에 반대하는 운동을 벌였다.","관민 공동회를 열어 헌의 6조를 결의하였다."],"ans":3,"exp":"(가)는 독립 협회(1896)이다. 독립 협회는 만민 공동회와 관민 공동회를 열었고, 관민 공동회에서 헌의 6조를 결의하여 고종에게 올렸다. 고종 강제 퇴위 반대 운동은 대한 자강회, 대성 학교와 오산 학교는 신민회, 황무지 개간권 요구 저지는 보안회의 활동이다."},
{"id":"h85","subj":"한국사","unit":"개항기","q":"(가) 조약에 대한 설명으로 옳은 것은?\n\n러일 전쟁에서 이긴 일본은 이토 히로부미를 보내 군대로 궁궐을 에워싸고 대신들을 위협하여 (가) ______을/를 강제로 맺었다. 고종은 끝까지 비준하지 않았으며, 민영환은 이에 항거하여 스스로 목숨을 끊었다.","opts":["대한 제국의 군대를 해산하는 근거가 되었다.","대한 제국의 외교권을 빼앗고 통감부를 두게 하였다.","일본이 군사상 필요한 곳을 쓸 수 있게 하였다.","일본이 추천하는 재정 고문과 외교 고문을 두게 하였다."],"ans":1,"exp":"(가)는 을사늑약(1905)이다. 대한 제국의 외교권을 빼앗고 통감부를 두어 이토 히로부미가 초대 통감으로 왔다. 군대 해산은 한일 신협약의 부속 각서, 고문 초빙은 제1차 한일 협약, 군사 요지 사용은 한일 의정서의 내용이다."},
{"id":"h86","subj":"한국사","unit":"개항기","q":"다음 취지서를 발표한 (가) 단체에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 무엇을 위하여 일어났는가? 백성의 낡은 습관이 굳어 있으니 새로운 사상이 시급하고, 백성이 어리석으니 새로운 교육이 시급하며 … (중략) … 간단히 말하면 오직 새 정신을 불러 깨우쳐 새 단체를 조직한 뒤에 새 나라를 건설할 뿐이다.","opts":["헌정 연구회를 이어받아 조직되었다.","남만주 삼원보에 독립운동 기지를 세웠다.","러시아의 절영도 조차 요구를 막아 냈다.","대구에서 국채 보상 운동을 처음 시작하였다."],"ans":1,"exp":"(가)는 신민회(1907)이다. 안창호, 양기탁 등이 만든 비밀 결사로, 국권 회복과 공화정 수립을 목표로 대성 학교와 오산 학교, 태극 서관을 세웠고 남만주 삼원보에 독립운동 기지를 건설하였다. 헌정 연구회를 이은 것은 대한 자강회, 절영도 조차 요구 저지는 독립 협회의 활동이다."},
{"id":"h87","subj":"한국사","unit":"일제 강점기","q":"다음 법령이 시행된 시기의 모습으로 옳은 것은?\n\n제1조 3개월 이하의 징역 또는 구류에 처해야 할 자는 그 정상에 따라 태형에 처할 수 있다.\n제11조 태형은 감옥 또는 즉결 관서에서 비밀리에 집행한다.\n제13조 본령은 조선인에 한하여 적용한다.","opts":["치안 유지법으로 사회주의 운동을 탄압하였다.","회사를 세우려면 총독의 허가를 받아야 하였다.","국가 총동원법으로 인력과 물자를 수탈하였다.","농촌 진흥 운동으로 농민의 자력갱생을 내세웠다."],"ans":1,"exp":"1912년에 제정되어 1920년까지 시행된 조선 태형령으로, 무단 통치 시기의 법령이다. 이 시기에는 회사령(1910)에 따라 회사를 세울 때 총독의 허가를 받아야 하였다. 치안 유지법은 1925년, 농촌 진흥 운동은 1932년, 국가 총동원법은 1938년의 일이다."},
{"id":"h88","subj":"한국사","unit":"일제 강점기","q":"(가) 정책에 대한 설명으로 옳은 것은?\n\n제1차 세계 대전 뒤 일본은 공업화로 도시 인구가 늘면서 쌀이 모자라게 되었다. 이를 한반도에서 해결하려고 조선 총독부는 1920년부터 (가) ______을/를 추진하였다. 수리 시설을 늘리고 품종을 바꾸게 하였는데, 그 비용의 상당 부분은 농민에게 돌아갔다.","opts":["놋그릇과 수저까지 공출하였다.","남부에 면화, 북부에 양을 기르게 하였다.","늘어난 생산량보다 더 많은 쌀이 일본으로 실려 나갔다.","정해진 기간 안에 토지 소유권을 신고하게 하였다."],"ans":2,"exp":"(가)는 산미 증식 계획이다. 쌀 생산은 늘었으나 그보다 더 많은 양이 일본으로 실려 나가 한국인의 1인당 쌀 소비량은 오히려 줄었다. 토지 소유권 신고는 토지 조사 사업, 금속 공출은 전시 동원 체제, 남면북양은 1930년대의 정책이다."},
{"id":"h89","subj":"한국사","unit":"일제 강점기","q":"다음 법령이 제정된 이후에 있었던 사실이 아닌 것은?\n\n제1조 본법에서 국가 총동원이란 전시에 국방 목적을 달성하기 위하여 국가의 모든 힘을 가장 효과적으로 발휘하도록 인적·물적 자원을 통제하고 운용하는 것을 말한다.","opts":["성과 이름을 일본식으로 바꾸게 하였다.","미곡 공출제를 실시하여 쌀을 강제로 거두었다.","학도 지원병 제도로 학생들을 전쟁터로 내몰았다.","조선 태형령을 만들어 한국인에게만 태형을 가하였다."],"ans":3,"exp":"중일 전쟁 중인 1938년에 제정된 국가 총동원법이다. 조선 태형령은 1912년에 만들어져 1920년에 폐지된 무단 통치 시기의 법령이다. 창씨개명(1940), 미곡 공출(1940년대), 학도 지원병 제도(1943)는 모두 국가 총동원법 제정 이후의 전시 동원 정책이다."},
{"id":"h90","subj":"한국사","unit":"일제 강점기","q":"(가)의 활동으로 옳지 않은 것은?\n\n3·1 운동 뒤 여러 곳에 세워진 임시 정부를 하나로 합쳐 상하이에서 (가) ______이/가 출범하였다. 대통령에는 이승만, 국무총리에는 이동휘가 뽑혔으며, 국내와 연락하려고 연통제와 교통국을 두었다.","opts":["신흥 무관 학교를 세웠다.","독립 공채를 발행하였다.","구미 위원부를 설치하였다.","한국 광복군을 창설하였다."],"ans":0,"exp":"(가)는 대한민국 임시 정부이다. 신흥 무관 학교는 신민회 인사들이 서간도 삼원보에 세운 신흥 강습소가 발전한 것으로 임시 정부의 활동이 아니다. 임시 정부는 독립 공채를 발행하여 자금을 모으고, 미국에 구미 위원부를 두어 외교 활동을 폈으며, 1940년 충칭에서 한국 광복군을 창설하였다."},
{"id":"h91","subj":"한국사","unit":"일제 강점기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 독립군이 자유시에서 무장 해제를 당하며 큰 피해를 입었다.\n(나) 홍범도 등이 이끈 독립군 연합 부대가 봉오동에서 일본군을 물리쳤다.\n(다) 북로 군정서 등이 청산리 일대에서 일본군을 물리쳤다.\n(라) 조선 총독부와 만주 군벌이 미쓰야 협정을 맺었다.","opts":["(나) - (가) - (다) - (라)","(나) - (다) - (가) - (라)","(나) - (다) - (라) - (가)","(다) - (나) - (가) - (라)"],"ans":1,"exp":"봉오동 전투(1920년 6월) → 청산리 대첩(1920년 10월) → 자유시 참변(1921) → 미쓰야 협정(1925)의 순서이다. 청산리 대첩 뒤 일제가 간도 참변을 일으키자 독립군은 소련 영토인 자유시로 옮겨 갔다가 참변을 당하였다."},
{"id":"h92","subj":"한국사","unit":"일제 강점기","q":"(가) 단체에 대한 설명으로 옳은 것은?\n\n국민 대표 회의가 성과 없이 끝난 뒤 임시 정부의 활동은 크게 움츠러들었다. 김구는 어려움을 헤쳐 나가고자 1931년 상하이에서 (가) ______을/를 조직하였다. 이 단체의 단원 이봉창은 도쿄에서 일왕이 탄 마차에 폭탄을 던졌다.","opts":["김원봉이 만주 지린에서 조직하였다.","김상옥이 종로 경찰서에 폭탄을 던졌다.","「조선 혁명 선언」을 활동 지침으로 삼았다.","윤봉길이 상하이 훙커우 공원에서 의거를 일으켰다."],"ans":3,"exp":"(가)는 한인 애국단이다. 단원 윤봉길은 1932년 상하이 훙커우 공원에서 열린 일본군 전승 기념식장에 폭탄을 던졌고, 이 의거는 중국 국민당 정부가 임시 정부를 지원하는 계기가 되었다. 나머지는 모두 의열단에 대한 설명이다."},
{"id":"h93","subj":"한국사","unit":"일제 강점기","q":"다음 강령을 내건 단체에 대한 설명으로 옳은 것은?\n\n1. 우리는 정치적·경제적 각성을 촉진한다.\n2. 우리는 단결을 공고히 한다.\n3. 우리는 기회주의를 일체 부인한다.","opts":["민립 대학 설립 운동을 이끌었다.","6·10 만세 운동을 계획하였다.","평양에서 물산 장려 운동을 시작하였다.","광주 학생 항일 운동에 진상 조사단을 보냈다."],"ans":3,"exp":"1927년 비타협적 민족주의 세력과 사회주의 세력이 손잡고 만든 신간회의 강령이다. 신간회는 광주 학생 항일 운동이 일어나자 진상 조사단을 보내고 민중 대회를 열려고 하였다. 물산 장려 운동(1920), 민립 대학 설립 운동(1922~1923), 6·10 만세 운동(1926)은 신간회 창립 이전의 일이다."},
{"id":"h94","subj":"한국사","unit":"일제 강점기","q":"(가) 운동에 대한 설명으로 옳은 것은?\n\n일본이 한국으로 들여오는 일본 상품의 관세를 없애려 하자 민족 자본을 지키려는 움직임이 일어났다. 조만식 등은 평양에서 (가) ______을/를 시작하였고, 이 운동은 서울을 거쳐 전국으로 퍼졌다. 그러나 토산품 값이 오르면서 상인과 자본가의 이익만 채운다는 비판을 받기도 하였다.","opts":["‘내 살림 내 것으로’라는 구호를 내세웠다.","백정에 대한 차별을 없애려고 진주에서 시작되었다.","‘한민족 1천만이 한 사람 1원씩’이라는 구호를 내세웠다.","‘배우자, 가르치자, 다 함께 브나로드’라는 구호를 내세웠다."],"ans":0,"exp":"(가)는 물산 장려 운동이다. ‘내 살림 내 것으로’, ‘조선 사람 조선 것’이라는 구호를 내세워 토산품 애용과 근검저축을 호소하였다. ‘브나로드’는 동아일보의 농촌 계몽 운동, ‘한 사람 1원씩’은 민립 대학 설립 운동의 구호이고, 백정 차별 철폐는 형평 운동이다."},
{"id":"h95","subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘이 부대’에 대한 설명으로 옳은 것은?\n\n대한민국 임시 정부는 충칭에 자리를 잡은 뒤 __이 부대__를 창설하고 지청천을 총사령에, 이범석을 참모장에 임명하였다. 태평양 전쟁이 일어나자 임시 정부는 일본에 선전 포고를 하였고, __이 부대__는 연합군과 함께 대일 전쟁에 나섰다.","opts":["영릉가와 흥경성에서 일본군을 물리쳤다.","미국 전략 정보국(OSS)과 함께 국내 진공 작전을 준비하였다.","쌍성보와 대전자령에서 일본군을 물리쳤다.","중국 관내에서 만들어진 첫 한인 무장 부대였다."],"ans":1,"exp":"밑줄 친 부대는 한국 광복군(1940)이다. 한국 광복군은 미국 전략 정보국(OSS)과 함께 국내 진공 작전을 준비하였으나 일제의 항복으로 실행하지 못하였다. 쌍성보·대전자령 전투는 한국 독립군, 영릉가·흥경성 전투는 조선 혁명군의 활동이고, 중국 관내의 첫 한인 무장 부대는 조선 의용대이다."},
{"id":"h96","subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n__그__는 황성신문과 대한매일신보의 주필로 활동하며, 유교를 실천적인 종교로 새롭게 하자는 「유교 구신론」을 발표하였다. 국권을 빼앗긴 뒤에는 중국으로 건너가 독립운동에 참여하였고, 이승만이 탄핵된 뒤 임시 정부의 두 번째 대통령에 뽑혔다.","opts":["『한국통사』를 쓰고 국혼을 강조하였다.","진단 학회를 만들어 실증적 연구를 이끌었다.","『조선상고사』에서 역사를 아와 비아의 투쟁으로 보았다.","『조선사회경제사』에서 한국사를 세계사의 보편 법칙으로 설명하였다."],"ans":0,"exp":"밑줄 친 인물은 박은식이다. 박은식은 『한국통사』에서 나라는 형체이고 역사는 정신이라고 하며 국혼을 지킬 것을 강조하였다. 『조선사회경제사』는 백남운, 진단 학회는 이병도·손진태 등, 『조선상고사』는 신채호와 관련된다."},
{"id":"h98","subj":"한국사","unit":"현대","q":"(가)의 활동으로 옳은 것은?\n\n5·10 총선거로 구성된 (가) ______은/는 임기가 2년이었다. 국호를 대한민국으로 정하고 헌법을 만들어 공포하였으며, 이승만을 대통령으로, 이시영을 부통령으로 뽑았다.","opts":["한일 협정을 비준하였다.","발췌 개헌안을 통과시켰다.","반민족 행위 처벌법을 만들었다.","사사오입 개헌안을 통과시켰다."],"ans":2,"exp":"(가)는 제헌 국회이다. 제헌 국회는 1948년 반민족 행위 처벌법을, 1949년 농지 개혁법을 만들었다. 발췌 개헌(1952)은 제2대 국회, 사사오입 개헌(1954)은 제3대 국회, 한일 협정 비준(1965)은 제6대 국회 때의 일이다."},
{"id":"h99","subj":"한국사","unit":"현대","q":"다음 선언문이 발표된 이후에 있었던 사실로 옳은 것은?\n\n○ 마산, 서울 기타 각지의 학생 데모는 주권을 빼앗긴 국민의 울분을 대신하여 일어난 학생들의 순수한 정의감의 발로이며, 부정과 불의에 항거하는 민족정기의 표현이다.\n… (중략) …\n○ 3·15 선거는 불법 선거이다. 공명선거로 정·부통령 선거를 다시 실시하라.","opts":["조봉암이 진보당 사건으로 처형되었다.","마산 앞바다에서 김주열의 시신이 발견되었다.","대구에서 학생들이 2·28 민주 운동을 일으켰다.","내각 책임제와 국회 양원제를 담은 개헌이 이루어졌다."],"ans":3,"exp":"4·19 혁명 중인 1960년 4월 25일 대학 교수단이 발표한 시국 선언문이다. 이튿날 이승만이 물러났고, 허정 과도 정부 아래에서 내각 책임제와 국회 양원제를 담은 개헌이 이루어졌다. 조봉암의 처형(1959), 2·28 민주 운동(1960년 2월), 김주열의 시신 발견(1960년 4월 11일)은 모두 그 이전의 일이다."},
{"id":"h101","subj":"한국사","unit":"선사·고조선","q":"신석기 시대의 대표적인 유적으로 옳은 것은?","opts":["연천 전곡리 유적","부여 송국리 유적","서울 암사동 유적","공주 석장리 유적"],"ans":2,"exp":"서울 암사동 유적에서는 신석기 시대의 움집터와 빗살무늬 토기가 나왔다. 연천 전곡리와 공주 석장리는 구석기 시대 유적이고, 부여 송국리는 청동기 시대의 마을 유적이다."},
{"id":"h102","subj":"한국사","unit":"선사·고조선","q":"(가) 나라에 대한 설명으로 옳지 않은 것은?\n\n『위서』에 이르기를, “지금으로부터 2천 년 전에 단군왕검이 있어 아사달에 도읍을 정하고 나라를 세워 이름을 (가) ______(이)라 하였으니, 중국의 요임금과 같은 때이다.”라고 하였다.\n- 「삼국유사」","opts":["천군이 소도라는 신성 지역을 다스렸다.","왕 아래에 상, 대부, 장군 등의 관직을 두었다.","한과 주변 나라 사이에서 중계 무역으로 이익을 얻었다.","한 무제가 보낸 군대의 공격으로 왕검성이 함락되었다."],"ans":0,"exp":"단군왕검이 아사달에 세운 (가)는 고조선이다. 천군과 소도는 삼한의 제도이므로 옳지 않다. 고조선은 왕 아래에 상, 대부, 장군 등의 관직을 두었고, 위만이 집권한 뒤에는 철기 문화를 바탕으로 세력을 넓히며 중계 무역으로 이익을 얻었다. 이에 한 무제가 군대를 보내 기원전 108년에 왕검성을 함락하였다."},
{"id":"h104","subj":"한국사","unit":"초기 국가","q":"(가) 나라에 대한 설명으로 옳은 것은?\n\n(가) ______의 혼인 풍속은 여자가 열 살이 되면 혼인을 약속하고, 신랑 집에서 맞아들여 길러 아내로 삼는다. 어른이 되면 여자 집으로 돌려보내는데, 여자 집에서 돈을 요구하고, 돈을 치른 뒤에 다시 신랑 집으로 온다.\n- 「삼국지」 위서 동이전","opts":["천군이 소도에서 제사를 주관하였다.","소금과 해산물을 고구려에 공물로 바쳤다.","12월에 영고라는 제천 행사를 열었다.","10월에 무천이라는 제천 행사를 열었다."],"ans":1,"exp":"자료는 옥저의 민며느리제이다. 옥저는 왕이 없이 읍군, 삼로 같은 군장이 다스렸고, 고구려의 압력을 받아 소금과 해산물 등을 공물로 바쳤다. 영고는 부여, 천군과 소도는 삼한, 무천은 동예의 것이다."},
{"id":"h107","subj":"한국사","unit":"삼국 시대","q":"(가) 왕 재위 시기의 사실로 옳은 것은?\n\n고국원왕이 백제와의 전쟁에서 전사한 뒤 왕위에 오른 (가) ______은/는 나라의 위기를 수습하는 데 힘썼다. 태학을 세워 인재를 기르고, 율령을 반포하여 통치 체제를 정비하였다.","opts":["평양으로 도읍을 옮겼다.","전진에서 불교를 받아들였다.","신라에 침입한 왜를 물리쳤다.","서안평을 차지하고 낙랑군을 몰아냈다."],"ans":1,"exp":"태학을 세우고 율령을 반포한 (가)는 소수림왕이다. 소수림왕은 372년 전진에서 불교를 받아들여 나라의 사상적 통합을 꾀하였다. 서안평 점령과 낙랑군 축출은 미천왕, 평양 천도는 장수왕, 신라에 침입한 왜를 물리친 것은 광개토 대왕 때의 일이다."},
{"id":"h108","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n__왕__이 사냥을 나갔다가 길에서 앉아 우는 사람을 보고 까닭을 물었다. 그가 “품을 팔아 어머니를 모셔 왔는데, 올해는 흉년이 들어 품 팔 곳이 없습니다.”라고 하였다. 왕은 해마다 봄부터 가을까지 관청의 곡식을 빌려주었다가 겨울에 갚게 하는 법을 만들게 하였다.\n- 「삼국사기」","opts":["옥저를 정복하였다.","율령을 반포하였다.","백제의 한성을 함락하였다.","을파소를 국상으로 등용하였다."],"ans":3,"exp":"자료는 고구려 고국천왕 때 실시한 진대법이다. 고국천왕은 을파소를 국상으로 등용하였고, 그의 건의로 진대법을 시행하였다. 옥저 정복은 태조왕, 율령 반포는 소수림왕, 한성 함락은 장수왕 때의 일이다."},
{"id":"h109","subj":"한국사","unit":"삼국 시대","q":"(가) 왕 재위 시기의 사실로 옳은 것은?\n\n(가) ______은/는 중국 남조의 양에 사신을 보내 “여러 차례 고구려를 깨뜨려 다시 강한 나라가 되었다.”라고 알렸다. 1971년 공주에서 발견된 그의 무덤에서는 무덤의 주인을 알려 주는 지석이 나왔다.","opts":["사비로 도읍을 옮겼다.","익산에 미륵사를 세웠다.","동진에서 불교를 받아들였다.","지방의 22담로에 왕족을 보냈다."],"ans":3,"exp":"(가)는 백제 무령왕이다. 무령왕은 지방의 22담로에 왕족을 보내 지방 통제를 강화하고, 양과 교류하며 나라의 힘을 되찾았다. 사비 천도는 성왕, 불교 수용은 침류왕, 미륵사 창건은 무왕 때의 일이다."},
{"id":"h110","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n신하들이 아뢰기를 “신(新)은 덕업이 날로 새로워진다는 뜻이고, 라(羅)는 사방을 아우른다는 뜻이니, 이를 나라 이름으로 삼는 것이 마땅합니다. … (중략) … 삼가 신라 국왕이라는 칭호를 올립니다.”라고 하니, __왕__이 이를 따랐다.\n- 「삼국사기」","opts":["황룡사를 짓기 시작하였다.","천문을 관측하는 첨성대를 세웠다.","시장을 감독하는 동시전을 설치하였다.","군사 업무를 맡는 병부를 설치하였다."],"ans":2,"exp":"국호를 신라로 정하고 왕이라는 칭호를 쓴 왕은 지증왕이다. 지증왕은 우산국을 복속하고 수도에 동시와 이를 감독하는 동시전을 두었다. 병부 설치는 법흥왕, 황룡사 창건은 진흥왕, 첨성대 건립은 선덕 여왕 때의 일이다."},
{"id":"h111","subj":"한국사","unit":"삼국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 사비성이 함락되고 백제가 멸망하였다.\n(나) 평양성이 함락되고 고구려가 멸망하였다.\n(다) 신라가 매소성에서 당의 군대를 물리쳤다.\n(라) 백제 부흥군과 왜의 수군이 백강에서 패하였다.","opts":["(가) - (나) - (라) - (다)","(가) - (라) - (나) - (다)","(가) - (라) - (다) - (나)","(라) - (가) - (나) - (다)"],"ans":1,"exp":"백제 멸망(660) → 백강 전투(663) → 고구려 멸망(668) → 매소성 전투(675)의 순서이다. 백강 전투는 백제가 멸망한 뒤 부흥 운동 과정에서 일어났고, 매소성 전투는 고구려가 멸망한 뒤 신라가 당을 몰아내는 전쟁 중에 일어났다."},
{"id":"h112","subj":"한국사","unit":"삼국 시대","q":"백제의 문화유산으로 옳지 않은 것은?","opts":["미륵사지 석탑","분황사 모전 석탑","정림사지 5층 석탑","서산 용현리 마애 여래 삼존상"],"ans":1,"exp":"분황사 모전 석탑은 신라 선덕 여왕 때 돌을 벽돌 모양으로 다듬어 쌓은 탑이다. 익산 미륵사지 석탑과 부여 정림사지 5층 석탑은 백제의 석탑이고, 서산 용현리 마애 여래 삼존상은 ‘백제의 미소’로 불리는 백제의 불상이다."},
{"id":"h113","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘이 무덤 양식’에 대한 설명으로 옳은 것은?\n\n신라에서는 마립간 시기에 __이 무덤 양식__이 유행하였다. 나무로 덧널을 짜서 시신과 껴묻거리를 넣고, 그 위에 돌을 쌓은 다음 흙으로 덮어 봉분을 만들었다. 구조상 도굴하기 어려워 금관을 비롯한 껴묻거리가 많이 남아 있다.","opts":["벽돌을 쌓아 널방을 만들었다.","천마총과 황남대총이 대표적이다.","널방의 벽과 천장에 벽화를 그렸다.","무덤의 둘레돌에 12지 신상을 새겼다."],"ans":1,"exp":"자료는 돌무지덧널무덤으로, 경주의 천마총과 황남대총이 대표적이다. 널방이 없어 벽화를 그릴 수 없고 도굴이 어려워 껴묻거리가 많이 남았다. 벽화는 굴식 돌방무덤, 벽돌로 쌓은 널방은 무령왕릉 같은 벽돌무덤, 12지 신상을 새긴 둘레돌은 통일 신라 무덤의 특징이다."},
{"id":"h114","subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘그’가 권력을 잡고 있던 시기의 사실로 옳은 것은?\n\n__그__는 천리장성을 쌓는 일을 감독하다가 정변을 일으켜 영류왕을 죽이고 보장왕을 세웠다. 그 뒤 스스로 대막리지가 되어 나라의 정치와 군사를 모두 쥐었으며, 당에서 도사를 불러들이는 등 도교를 장려하였다.","opts":["백제의 한성을 함락하였다.","안시성에서 당의 군대를 물리쳤다.","살수에서 수의 군대를 물리쳤다.","위의 관구검에게 환도성을 빼앗겼다."],"ans":1,"exp":"자료의 인물은 642년에 정변을 일으킨 연개소문이다. 당 태종은 이를 구실로 고구려에 쳐들어왔으나 645년 안시성에서 물러났다. 살수 대첩은 612년 영양왕 때, 한성 함락은 475년 장수왕 때, 관구검의 침입은 3세기 동천왕 때의 일이다."},
{"id":"h115","subj":"한국사","unit":"삼국 시대","q":"(가) 나라의 통치 체제에 대한 설명으로 옳은 것은?\n\n(가) ______의 호암사에는 정사암이라는 바위가 있다. 나라에서 재상을 뽑을 때 후보 서너 명의 이름을 적어 상자에 넣고 봉하여 바위 위에 두었다가, 얼마 뒤에 열어 보아 이름 위에 도장이 찍혀 있는 사람을 재상으로 삼았다.\n- 「삼국유사」","opts":["대대로가 국정을 총괄하였다.","상대등이 귀족 회의를 이끌었다.","6좌평과 16관등의 제도를 두었다.","지방에 욕살과 처려근지를 보냈다."],"ans":2,"exp":"정사암에서 재상을 뽑은 (가)는 백제이다. 백제는 6좌평과 16관등의 제도를 갖추었고, 지방을 5방으로 나누어 방령을 두었다. 상대등은 신라에서 화백 회의를 이끈 귀족의 대표이고, 대대로는 고구려의 최고 관직이며, 욕살과 처려근지는 고구려의 지방관이다."},
{"id":"h118","subj":"한국사","unit":"남북국 시대","q":"밑줄 친 ‘왕’ 재위 시기의 사실로 옳은 것은?\n\n발해의 __왕__은 대흥, 보력 등의 연호를 썼고, 아버지 무왕과 달리 당과 친선 관계를 맺어 문물을 받아들였다. 일본에 보낸 국서에서는 스스로를 ‘고려 국왕’이라 일컬었다.","opts":["동모산에서 나라를 세웠다.","전성기를 맞아 해동성국이라 불렸다.","장문휴를 보내 당의 등주를 공격하였다.","당의 제도를 받아들여 3성 6부를 정비하였다."],"ans":3,"exp":"자료의 왕은 문왕이다. 문왕은 당과 친선 관계를 맺고 3성 6부를 비롯한 통치 체제를 정비하였으며, 도읍을 중경에서 상경으로 옮겼다. 등주 공격은 무왕, 해동성국이라 불린 것은 선왕 무렵, 동모산에서의 건국은 고왕 대조영 때의 일이다."},
{"id":"h119","subj":"한국사","unit":"남북국 시대","q":"발해 문화에서 고구려의 영향을 보여 주는 것으로 옳지 않은 것은?","opts":["상경성의 주작대로","집터의 온돌 장치","연꽃무늬 수막새","정혜 공주 묘의 모줄임천장 구조"],"ans":0,"exp":"상경성은 당의 수도 장안성을 본떠 지었고, 남북으로 뻗은 넓은 주작대로는 당의 영향을 보여 준다. 온돌 장치, 연꽃무늬 수막새, 굴식 돌방무덤인 정혜 공주 묘의 모줄임천장 구조는 고구려 문화를 이은 것이다."},
{"id":"h120","subj":"한국사","unit":"남북국 시대","q":"(가) 문서에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 1933년 일본 도다이사의 쇼소인에서 발견되었다. 통일 신라 때 서원경 부근에 있던 네 마을의 사정을 조사하여 적은 것으로, 당시 나라가 백성을 어떻게 파악하고 다스렸는지 보여 준다.","opts":["노비와 가축의 수는 기록하지 않았다.","세금을 거두려고 3년마다 다시 작성하였다.","호를 사람 수에 따라 3등급으로 나누었다.","사람은 나이와 성별을 가리지 않고 한 등급으로 적었다."],"ans":1,"exp":"(가)는 신라 촌락 문서(민정 문서)이다. 조세와 노동력을 거두기 위해 마을의 인구, 토지, 가축, 나무의 수를 조사하여 3년마다 다시 작성하였다. 호는 사람 수에 따라 9등급으로, 사람은 성별과 나이에 따라 6등급으로 나누어 적었고, 노비와 소, 말의 수도 적었다."},
{"id":"h121","subj":"한국사","unit":"남북국 시대","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n__그__는 당에 건너가 빈공과에 합격하였고, 황소의 난이 일어나자 이를 꾸짖는 격문을 지어 이름을 떨쳤다. 신라로 돌아온 뒤 진성 여왕에게 개혁안 10여 조를 올렸으나 제대로 시행되지 못하였다.","opts":["『계원필경』을 지었다.","「화왕계」를 지었다.","『화랑세기』를 지었다.","『왕오천축국전』을 지었다."],"ans":0,"exp":"자료의 인물은 6두품 출신 최치원이다. 그가 당에서 쓴 글을 모은 『계원필경』이 전한다. 「화왕계」는 설총, 『화랑세기』는 김대문, 『왕오천축국전』은 인도와 중앙아시아를 다녀온 승려 혜초가 지었다."},
{"id":"h122","subj":"한국사","unit":"남북국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 원종과 애노가 사벌주에서 봉기하였다.\n(나) 김헌창이 웅천주에서 반란을 일으켰다.\n(다) 견훤이 완산주에 도읍하여 후백제를 세웠다.\n(라) 장보고가 완도에 청해진을 설치하였다.","opts":["(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":3,"exp":"김헌창의 난(822) → 청해진 설치(828) → 원종과 애노의 난(889) → 후백제 건국(900)의 순서이다. 김헌창은 아버지 김주원이 왕이 되지 못한 데 불만을 품고 헌덕왕 때 반란을 일으켰고, 원종과 애노의 난은 진성 여왕 때 세금 독촉에 반발하여 일어났다."},
{"id":"h123","subj":"한국사","unit":"남북국 시대","q":"다음 설명에 해당하는 제도는?\n\n신라 원성왕 때 국학의 학생을 대상으로 마련하였다. 유교 경전을 얼마나 깊이 이해하는지를 시험하여 상, 중, 하의 세 등급으로 나누고 관리를 뽑는 데 반영하려 하였으나, 진골 귀족의 반발로 제대로 시행되지 못하였다.","opts":["빈공과","음서","현량과","독서삼품과"],"ans":3,"exp":"독서삼품과는 원성왕 때 국학 학생을 대상으로 유교 경전의 이해 수준을 상, 중, 하로 나누어 관리 임용에 반영하려던 제도이다. 빈공과는 당에서 외국인을 대상으로 치른 시험, 음서는 고려와 조선에서 고위 관리의 자손을 시험 없이 등용한 제도, 현량과는 조선 중종 때 조광조가 건의한 추천 제도이다."},
{"id":"h127","subj":"한국사","unit":"고려 전기","q":"다음 사건을 구실로 일어난 침입 때의 사실로 옳은 것은?\n\n목종의 어머니 천추 태후와 김치양이 권력을 휘두르자, 서북면 도순검사 강조가 군사를 이끌고 개경으로 들어와 김치양 일파를 없앴다. 이어 목종을 왕위에서 몰아내고 현종을 세웠다.","opts":["현종이 나주까지 피란하였다.","윤관이 별무반을 이끌고 출정하였다.","강감찬이 귀주에서 큰 승리를 거두었다.","서희가 담판으로 강동 6주를 확보하였다."],"ans":0,"exp":"거란은 강조의 정변을 구실로 1010년에 다시 쳐들어왔다(2차 침입). 개경이 함락되어 현종은 나주까지 피란하였고, 양규가 물러가는 거란군을 공격하여 큰 피해를 주었다. 서희의 담판은 1차 침입, 귀주 대첩은 3차 침입 때의 일이고, 별무반은 여진을 정벌하려고 만든 부대이다."},
{"id":"h128","subj":"한국사","unit":"고려 전기","q":"(가) 부대에 대한 설명으로 옳은 것은?\n\n윤관이 왕에게 아뢰기를 “신이 적에게 패한 까닭은 적은 말을 타고 싸우는데 우리는 걸어서 싸워 맞설 수 없었기 때문입니다.”라고 하였다. 이에 왕에게 건의하여 처음으로 (가) ______을/를 만들었다.\n- 「고려사」","opts":["신기군, 신보군, 항마군으로 편성되었다.","좌별초, 우별초, 신의군으로 편성되었다.","국경 지대인 양계에 주둔한 상비군이었다.","거란의 침입에 대비하여 정종 때 조직되었다."],"ans":0,"exp":"윤관의 건의로 숙종 때 만든 (가)는 별무반이다. 별무반은 기병이 강한 여진에 맞서려고 만든 부대로, 기병인 신기군, 보병인 신보군, 승병인 항마군으로 편성되었다. 좌별초, 우별초, 신의군은 삼별초이고, 정종 때 거란에 대비해 만든 부대는 광군, 양계의 상비군은 주진군이다."},
{"id":"h130","subj":"한국사","unit":"고려 전기","q":"다음 설명에 해당하는 기구는?\n\n고려 성종 때 개경과 서경, 12목에 설치하였다. 풍년이 들어 곡식 값이 떨어지면 나라에서 곡식을 사들이고, 흉년이 들어 곡식 값이 오르면 내다 팔아 물가를 고르게 하였다.","opts":["상평창","의창","제위보","동서 대비원"],"ans":0,"exp":"고려 성종은 개경, 서경과 12목에 상평창을 두어 곡식 값을 조절하였다. 의창은 흉년에 곡식을 빌려주어 백성을 구제한 기구이고, 제위보는 기금을 마련하여 그 이자로 빈민을 구제한 기구이며, 동서 대비원은 환자를 돌보고 빈민을 구휼한 기구이다."},
{"id":"h131","subj":"한국사","unit":"고려 전기","q":"밑줄 친 ‘그’의 활동으로 옳은 것은?\n\n문종의 아들인 __그__는 송에 유학하고 돌아와 국청사를 중심으로 해동 천태종을 열었다. 교종의 입장에서 선종을 아우르려 하였고, 이론 공부와 실천 수행을 함께 닦아야 한다고 주장하였다.","opts":["교장도감을 두고 교장을 펴냈다.","수선사에서 정혜결사를 이끌었다.","만덕사에서 백련 결사를 이끌었다.","『삼국유사』를 지어 불교 설화를 모았다."],"ans":0,"exp":"자료의 인물은 대각 국사 의천이다. 의천은 교관겸수를 내세웠고, 고려와 송, 요, 일본의 불교 주석서를 모아 흥왕사에 교장도감을 두고 교장을 펴냈다. 정혜결사는 지눌, 백련 결사는 요세가 이끌었고, 『삼국유사』는 일연이 지었다."},
{"id":"h133","subj":"한국사","unit":"고려 전기","q":"밑줄 친 ‘이들’에 대한 설명으로 옳은 것은?\n\n고려에서 __이들__은 왕의 잘못을 논하는 간쟁, 잘못된 왕명을 시행하지 않고 되돌려 보내는 봉박, 관리의 임명이나 법령의 개정과 폐지에 동의하는 서경의 권한을 가졌다. 직위는 낮았으나 왕과 고위 관리의 활동을 견제하여 정치 운영에서 균형을 이루게 하였다.","opts":["화폐와 곡식의 출납과 회계를 맡았다.","왕명의 출납과 군사 기밀을 맡았다.","국방과 군사 문제를 회의로 결정하였다.","어사대의 관원과 중서문하성의 낭사로 이루어졌다."],"ans":3,"exp":"간쟁, 봉박, 서경의 권한을 가진 이들은 대간이다. 대간은 어사대의 관원과 중서문하성의 낭사를 함께 부르는 말이다. 국방 문제를 회의로 결정한 기구는 도병마사, 출납과 회계를 맡은 기구는 삼사, 왕명 출납과 군사 기밀을 맡은 기구는 중추원이다."},
{"id":"h134","subj":"한국사","unit":"고려 후기","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n__그__가 이의민을 없앤 뒤 왕에게 글을 올려 아뢰기를 “관직에 있는 자들이 탐욕스러워 공전과 사전을 빼앗아 차지하고 있으니, 문서를 살펴 빼앗은 것은 모두 본래 주인에게 돌려주소서. … (중략) … 승려들이 궁궐에 드나들지 못하게 하시고, 곡식을 빌려주고 이자를 받는 일을 그만두게 하소서.”라고 하였다.\n- 「고려사」","opts":["강화도로 도읍을 옮겼다.","정방을 두어 인사권을 장악하였다.","교정도감을 두어 국정을 장악하였다.","도방을 처음 만들어 신변을 지켰다."],"ans":2,"exp":"이의민을 없애고 봉사 10조를 올린 인물은 최충헌이다. 최충헌은 교정도감을 설치하고 그 우두머리인 교정별감이 되어 국정을 장악하였으며, 경대승이 처음 만들었던 도방을 크게 늘려 호위를 맡겼다. 정방 설치와 강화도 천도는 그의 아들 최우가 한 일이다."},
{"id":"h136","subj":"한국사","unit":"고려 후기","q":"(가) 왕에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 즉위하여 정방을 폐지하고 사림원을 두어 개혁을 추진하였다. 다시 왕위에 오른 뒤에는 소금을 나라에서만 팔게 하여 재정을 늘리려 하였고, 왕실과 혼인할 수 있는 가문을 정하여 발표하였다.","opts":["정치도감을 두어 개혁을 추진하였다.","과전법을 실시하여 토지 제도를 바꾸었다.","쌍성총관부를 공격하여 철령 이북의 땅을 되찾았다.","원의 수도에 만권당을 세워 학자들이 교류하게 하였다."],"ans":3,"exp":"사림원을 두고 소금 전매제를 시행한 (가)는 충선왕이다. 충선왕은 왕위에서 물러난 뒤 원의 수도 연경에 만권당을 세워 이제현 등 고려 학자와 원의 학자가 교류하게 하였다. 정치도감은 충목왕 때 설치되었고, 쌍성총관부를 되찾은 왕은 공민왕이며, 과전법은 공양왕 때 실시되었다."},
{"id":"h137","subj":"한국사","unit":"고려 후기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 이성계가 위화도에서 군대를 돌렸다.\n(나) 과전법이 실시되었다.\n(다) 홍건적의 침입으로 공민왕이 복주(안동)로 피란하였다.\n(라) 이성계가 황산에서 왜구를 크게 물리쳤다.","opts":["(다) - (라) - (가) - (나)","(라) - (다) - (가) - (나)","(다) - (가) - (라) - (나)","(다) - (라) - (나) - (가)"],"ans":0,"exp":"홍건적의 2차 침입과 공민왕의 피란(1361) → 황산 대첩(1380) → 위화도 회군(1388) → 과전법 실시(1391)의 순서이다. 이성계는 홍건적과 왜구를 물리치며 이름을 얻었고, 위화도 회군으로 권력을 잡은 뒤 신진 사대부와 함께 과전법을 실시하여 새 왕조의 경제 기반을 마련하였다."},
{"id":"h138","subj":"한국사","unit":"고려 후기","q":"(가) 세력에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 지방의 향리 집안 출신이 많았고, 주로 과거를 거쳐 중앙 관리가 되었다. 공민왕이 성균관을 다시 정비하고 개혁을 추진하는 과정에서 정치 세력으로 성장하였으며, 이색, 정몽주, 정도전 등이 대표적인 인물이다.","opts":["성리학을 받아들이고 권문세족의 비리를 비판하였다.","원과의 관계를 배경으로 도평의사사를 장악하였다.","정변을 일으켜 중방을 중심으로 권력을 행사하였다.","음서와 공음전을 바탕으로 대대로 고위 관직을 차지하였다."],"ans":0,"exp":"(가)는 신진 사대부이다. 신진 사대부는 주로 과거를 거쳐 관직에 나간 세력으로, 성리학을 받아들여 권문세족의 비리와 불교의 폐단을 비판하였다. 음서와 공음전을 바탕으로 한 세력은 고려 전기의 문벌, 원을 배경으로 도평의사사를 장악한 세력은 권문세족, 중방을 중심으로 권력을 잡은 세력은 무신이다."},
{"id":"h139","subj":"한국사","unit":"고려 후기","q":"밑줄 친 ‘이 탑’에 대한 설명으로 옳은 것은?\n\n__이 탑__은 고려 충목왕 때 개성 부근의 경천사에 세워졌다. 대한 제국 시기에 일본으로 불법 반출되었다가 되돌아왔으며, 지금은 국립중앙박물관 안에 전시되어 있다.","opts":["돌을 벽돌 모양으로 다듬어 쌓았다.","원의 영향을 받아 대리석으로 만들었다.","목탑의 양식을 따른 백제의 석탑이다.","탑 안에서 무구정광대다라니경이 나왔다."],"ans":1,"exp":"밑줄 친 탑은 경천사지 10층 석탑으로, 원 간섭기에 원의 영향을 받아 대리석으로 만들었다. 돌을 벽돌 모양으로 다듬어 쌓은 탑은 신라의 분황사 모전 석탑이고, 목탑 양식을 따른 백제의 석탑은 익산 미륵사지 석탑과 부여 정림사지 5층 석탑이며, 무구정광대다라니경은 불국사 3층 석탑에서 나왔다."},
{"id":"h140","subj":"한국사","unit":"고려 전기","q":"밑줄 친 ‘이 시기’의 대외 무역에 대한 설명으로 옳은 것은?\n\n__이 시기__에는 송과의 무역이 가장 활발하였다. 송에서 비단, 약재, 서적 등을 들여오고 종이, 인삼, 나전 칠기 등을 내보냈다. 대식국이라 불린 아라비아의 상인들도 찾아와 수은, 향료 등을 팔았는데, 이들을 통해 ‘코리아’라는 이름이 서방에 알려졌다.","opts":["부산포의 왜관에서 일본과 무역하였다.","의주의 만상이 청과의 무역을 주도하였다.","완도에 청해진을 두어 해상 무역을 장악하였다.","예성강 어귀의 벽란도가 국제 무역항으로 번성하였다."],"ans":3,"exp":"송과 활발히 무역하고 아라비아 상인이 드나든 시기는 고려 시대이다. 개경에 가까운 예성강 어귀의 벽란도에는 송과 일본, 아라비아 상인까지 드나들었다. 청해진은 통일 신라의 장보고가 설치하였고, 부산포 왜관에서의 무역과 만상의 대청 무역은 조선 시대의 일이다."},
{"id":"h141","subj":"한국사","unit":"조선 전기","q":"(가) 인물의 활동으로 옳은 것은?\n\n(가) ______이/가 말하기를 “임금의 직책은 한 사람의 재상을 논정하는 데 있다. … (중략) … 임금의 자질에는 어리석음과 현명함이 있고 강함과 약함이 있어 한결같지 않으니, 재상은 임금의 좋은 점은 따르고 나쁜 점은 바로잡아야 한다.”라고 하였다.\n- 「조선경국전」","opts":["『동국통감』을 편찬하였다.","『불씨잡변』을 지어 불교를 비판하였다.","「시무 28조」를 지어 왕에게 올렸다.","「조의제문」을 지어 세조의 왕위 찬탈을 비판하였다."],"ans":1,"exp":"『조선경국전』을 지어 재상 중심의 정치를 주장한 (가)는 정도전이다. 정도전은 이성계를 도와 조선 건국을 이끌었고, 『불씨잡변』으로 불교를 비판하여 성리학을 통치 이념으로 세웠다. 「조의제문」은 김종직, 『동국통감』은 성종 때 서거정 등, 「시무 28조」는 고려 성종 때 최승로가 지었다."},
{"id":"h144","subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘이들 기구’를 바르게 묶은 것은?\n\n조선에서 __이들 기구__는 함께 삼사라 불리며 언론 기능을 맡았다. 왕의 잘못을 간하고 관리의 비리를 살폈으며, 왕의 물음에 답하고 경연을 이끌었다. 이곳의 관원은 벼슬은 높지 않아도 학문과 덕망이 뛰어난 사람이 임명되었다.","opts":["사헌부, 사간원, 홍문관","사헌부, 사간원, 승정원","의금부, 사헌부, 홍문관","사간원, 홍문관, 춘추관"],"ans":0,"exp":"조선의 삼사는 관리의 비리를 감찰하는 사헌부, 왕에게 간쟁하는 사간원, 경연과 자문을 맡은 홍문관을 가리키며, 언론 기능으로 권력의 독점을 막았다. 승정원은 왕명의 출납, 의금부는 중대한 죄인의 심문, 춘추관은 역사 편찬을 맡았다."},
{"id":"h146","subj":"한국사","unit":"조선 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 조광조 등 사림이 위훈 삭제를 주장하다가 제거되었다.\n(나) 폐비 윤씨 사건을 구실로 훈구와 사림이 화를 입었다.\n(다) 「조의제문」이 문제가 되어 김일손 등이 처형되었다.\n(라) 외척인 대윤과 소윤의 대립으로 사림이 피해를 입었다.","opts":["(나) - (다) - (가) - (라)","(다) - (가) - (나) - (라)","(다) - (나) - (가) - (라)","(다) - (나) - (라) - (가)"],"ans":2,"exp":"무오사화(1498) → 갑자사화(1504) → 기묘사화(1519) → 을사사화(1545)의 순서이다. 무오사화와 갑자사화는 연산군 때, 기묘사화는 중종 때, 을사사화는 명종이 즉위한 해에 일어났다."},
{"id":"h147","subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘이것’에 대한 설명으로 옳은 것은?\n\n__이것__은 중국 송의 여씨 형제가 처음 만들었다. 조선에서는 중종 때 조광조 등이 널리 보급하려 하였고, 그 뒤 이황과 이이가 우리 실정에 맞게 고쳐 예안과 해주 등지에서 시행하였다.","opts":["유향소를 통제하려고 한양에 둔 기구이다.","향나무를 묻는 매향 활동을 하던 신앙 조직이다.","수령을 보좌하고 향리를 감찰한 향촌 자치 기구이다.","덕업상권, 환난상휼 등을 덕목으로 삼은 향촌 규약이다."],"ans":3,"exp":"밑줄 친 것은 향약이다. 향약은 덕업상권, 과실상규, 예속상교, 환난상휼을 덕목으로 삼은 향촌의 자치 규약이다. 수령을 보좌하고 향리를 감찰한 기구는 유향소, 매향 활동을 하던 조직은 향도, 유향소를 통제한 기구는 경재소이다."},
{"id":"h150","subj":"한국사","unit":"조선 전기","q":"다음 글이 쓰인 시기의 사회 모습으로 옳은 것은?\n\n도적이 성행하는 것은 수령의 가렴주구 탓이며, 수령의 가렴주구는 재상이 청렴하지 못한 탓이다. … (중략) … 백성이 곤궁해져도 하소연할 곳이 없으니, 도적이 되지 않으면 살아갈 길이 없다. 군사를 풀어 잡으려고만 한다면 잡는 대로 또 뒤따라 일어날 것이다.\n- 「명종실록」","opts":["대동법이 전국으로 확대 실시되었다.","균역법으로 군포 부담이 1필로 줄었다.","방납의 폐단으로 농민의 공납 부담이 커졌다.","신해통공으로 금난전권이 대부분 폐지되었다."],"ans":2,"exp":"제시된 글은 16세기 중엽 명종 때 임꺽정 무리가 활동하던 무렵 사관이 쓴 글이다. 16세기에는 서리나 상인이 공물을 대신 내고 농민에게 높은 값을 받아 내는 방납의 폐단이 심해졌고, 군역에서도 대립과 방군수포가 퍼졌다. 대동법은 17세기 초 경기도에서 시작하여 18세기 초에 전국으로 확대되었고, 균역법은 1750년 영조 때, 신해통공은 1791년 정조 때의 일이다."},
{"id":"h154","subj":"한국사","unit":"조선 후기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 후금이 침입하여 조선과 형제 관계를 맺었다.\n(나) 서인이 광해군을 몰아내고 인조를 왕으로 세웠다.\n(다) 인조가 삼전도에서 청 태종에게 항복하였다.\n(라) 이괄이 반란을 일으켜 한양을 점령하였다.","opts":["(나) - (가) - (라) - (다)","(나) - (라) - (가) - (다)","(나) - (라) - (다) - (가)","(라) - (나) - (가) - (다)"],"ans":1,"exp":"인조반정(1623) → 이괄의 난(1624) → 정묘호란(1627) → 병자호란과 삼전도의 항복(1637)의 순서이다. 이괄의 난은 인조반정의 논공행상에 대한 불만에서 비롯되었고, 그 잔당이 후금으로 달아난 것이 정묘호란의 구실이 되었다."},
{"id":"h155","subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘논쟁’에 대한 설명으로 옳은 것은?\n\n효종이 세상을 떠나자 인조의 계비인 자의 대비가 상복을 얼마 동안 입어야 하는지를 두고 서인과 남인 사이에 __논쟁__이 벌어졌다. 효종이 둘째 아들로서 왕위를 이은 점을 어떻게 볼 것인지가 쟁점이었다. 이 __논쟁__은 효종의 비가 세상을 떠났을 때 다시 일어났다.","opts":["동인이 남인과 북인으로 나뉘는 계기가 되었다.","두 번째 논쟁의 결과 서인이 정국을 주도하게 되었다.","첫 번째 논쟁에서는 서인이 주장한 1년설이 받아들여졌다.","남인은 왕에게도 사대부와 같은 예를 적용해야 한다고 주장하였다."],"ans":2,"exp":"현종 때의 예송이다. 첫 번째인 기해예송에서는 서인의 1년설(기년설)이 남인의 3년설을 누르고 받아들여졌다. 두 번째인 갑인예송에서는 남인의 1년설이 채택되어 남인이 정국을 주도하였다. 왕도 사대부와 같은 예를 따라야 한다고 본 쪽은 서인이며, 남인과 북인의 분화는 선조 때 정철의 처벌 문제에서 비롯되었다."},
{"id":"h156","subj":"한국사","unit":"조선 후기","q":"다음 비석이 세워진 왕 때의 사실로 옳은 것은?\n\n오라총관 목극등이 황제의 명을 받들어 변경을 조사하고 이곳에 이르러 살펴보니, 서쪽은 압록강이고 동쪽은 토문강이다. 그러므로 분수령 위에 돌을 세워 기록한다.","opts":["균역법을 시행하였다.","장용영을 설치하였다.","상평통보를 법정 화폐로 삼았다.","비변사를 처음 설치하였다."],"ans":2,"exp":"숙종 때(1712) 세운 백두산정계비의 비문이다. 숙종은 상평통보를 법정 화폐로 삼아 널리 유통시켰다. 비변사는 중종 때 처음 설치되었고, 균역법은 영조, 장용영은 정조 때의 일이다."},
{"id":"h157","subj":"한국사","unit":"조선 후기","q":"(가) 왕의 정책으로 옳지 않은 것은?\n\n(가) ______은/는 탕평 교서를 발표하여 탕평의 뜻을 밝혔고, 이인좌의 난을 겪은 뒤에는 탕평파를 중심으로 정국을 운영하였다. 붕당의 근거지인 서원을 크게 정리하고, 이조 전랑이 후임자를 추천하는 관행을 없앴다. 또 가혹한 형벌을 없애고 신문고를 다시 두었다.","opts":["청계천을 준설하여 홍수에 대비하였다.","장용영을 설치하여 왕권을 뒷받침하였다.","균역법을 시행하여 군포 부담을 줄였다.","『속대전』을 편찬하여 법전을 정비하였다."],"ans":1,"exp":"(가)는 영조이다. 장용영은 정조가 둔 국왕 친위 부대이다. 영조는 균역법을 시행하여 군포를 1필로 줄이고, 『속대전』을 편찬하였으며, 청계천 바닥을 파내어 홍수에 대비하였다."},
{"id":"h160","subj":"한국사","unit":"조선 후기","q":"(가)에 들어갈 기구로 옳은 것은?\n\n1862년 경상 우병사 백낙신의 수탈을 견디지 못한 진주의 농민들이 유계춘 등을 중심으로 봉기하였다. 봉기가 삼남 지방을 비롯한 전국으로 번지자, 정부는 안핵사 박규수의 건의를 받아들여 (가) ______을/를 설치하고 수취 제도를 바로잡겠다고 약속하였다.","opts":["교정청","균역청","삼정이정청","선혜청"],"ans":2,"exp":"임술 농민 봉기(1862)의 수습책으로 설치된 기구는 삼정이정청이다. 전정, 군정, 환곡의 문란을 고치려 하였으나 곧 폐지되어 근본적인 해결에는 이르지 못하였다. 교정청은 1894년 정부가 자주적 개혁을 내세워 둔 기구이고, 균역청은 균역법, 선혜청은 대동법을 맡은 관청이다."},
{"id":"h163","subj":"한국사","unit":"조선 후기","q":"다음 주장을 한 인물의 저술로 옳은 것은?\n\n나라를 좀먹는 여섯 가지가 있다. 노비 제도, 과거 제도, 양반 문벌 제도, 사치와 미신, 승려, 게으름이 그것이다.","opts":["『성호사설』","『북학의』","『반계수록』","『목민심서』"],"ans":0,"exp":"나라를 좀먹는 여섯 가지 폐단(6좀)을 지적한 인물은 이익이다. 이익은 『성호사설』을 짓고, 한 집이 살아가는 데 필요한 영업전의 매매를 금지하는 한전론을 주장하였다. 『반계수록』은 유형원, 『목민심서』는 정약용, 『북학의』는 박제가의 저술이다."},
{"id":"h168","subj":"한국사","unit":"개항기","q":"(가)에 들어갈 화폐로 옳은 것은?\n\n흥선 대원군은 경복궁을 다시 짓는 데 드는 비용을 마련하려고 (가) ______을/를 발행하였다. 이 화폐는 실제 가치가 상평통보의 대여섯 배에 지나지 않았으나 100배의 값으로 쓰게 하였으므로 물가가 크게 올랐다.","opts":["당백전","백동화","당오전","해동통보"],"ans":0,"exp":"경복궁 중건 비용을 마련하려고 발행한 고액 화폐는 당백전이다. 명목 가치가 실제 가치보다 훨씬 높아 물가가 크게 올랐다. 당오전은 1883년, 백동화는 1892년부터 전환국에서 만든 화폐이고, 해동통보는 고려 숙종 때의 화폐이다."},
{"id":"h169","subj":"한국사","unit":"개항기","q":"(가)에 대한 설명으로 옳은 것은?\n\n조선 정부는 1881년 유학생과 기술자를 (가) ______(으)로 파견하였다. 이들은 재정 부족 등으로 1년여 만에 돌아왔으나, 이를 계기로 서울에 근대식 무기 공장인 기기창이 세워졌다.","opts":["김홍집이 이끌고 『조선책략』을 들여왔다.","민영익이 이끌고 미국의 여러 시설을 살펴보았다.","김윤식이 이끌고 톈진에서 무기 제조 기술을 배웠다.","박정양 등이 일본의 정부 기관과 산업 시설을 살펴보았다."],"ans":2,"exp":"(가)는 영선사이다. 김윤식이 이끈 영선사는 청의 톈진 기기국에서 근대식 무기 제조 기술과 군사 훈련법을 배웠다. 『조선책략』을 들여온 것은 제2차 수신사, 미국을 살펴본 것은 보빙사, 일본을 살펴본 것은 조사 시찰단이다."},
{"id":"h170","subj":"한국사","unit":"개항기","q":"다음 상소를 올린 인물에 대한 설명으로 옳은 것은?\n\n저들이 비록 왜인이라고 하나 실은 서양 도적입니다. 화의가 한번 이루어지면 사학의 서적과 천주의 초상이 교역하는 가운데 섞여 들어올 것입니다.","opts":["을사늑약에 반대하여 태인에서 의병을 일으켰다.","영남 만인소를 올려 『조선책략』의 유포에 반대하였다.","13도 창의군의 총대장으로 서울 진공 작전을 이끌었다.","평민 출신 의병장으로 경상도와 강원도 일대에서 활약하였다."],"ans":0,"exp":"일본과 서양이 한 몸이라는 왜양 일체론을 내세워 개항에 반대한 최익현의 상소이다. 최익현은 을사늑약이 맺어지자 태인에서 의병을 일으켰다가 쓰시마섬에 끌려가 순국하였다. 영남 만인소는 이만손, 13도 창의군 총대장은 이인영, 평민 출신 의병장은 신돌석이다."},
{"id":"h171","subj":"한국사","unit":"개항기","q":"다음 조약에 대한 설명으로 옳은 것은?\n\n제1관 조선과 미국 두 나라 가운데 한 나라가 제3국에게 부당한 대우나 업신여김을 받으면, 이를 알리는 대로 반드시 서로 돕고 중간에서 잘 조정하여 우의를 보인다.\n제5관 무역을 목적으로 조선국에 오는 미국 상인과 상선은 수출입하는 모든 상품에 대하여 관세를 내야 한다.","opts":["부산 외에 두 곳의 항구를 더 열기로 하였다.","최혜국 대우를 처음으로 규정하였다.","일본 공사관에 경비병을 두는 것을 허용하였다.","청 상인이 내륙에서 장사하는 것을 허용하였다."],"ans":1,"exp":"조미 수호 통상 조약(1882)이다. 거중 조정(제1관)과 관세 부과를 규정하였고, 최혜국 대우를 처음으로 담았다. 부산 외 두 항구의 개항은 강화도 조약, 일본 공사관 경비병은 제물포 조약, 청 상인의 내륙 통상은 조청 상민 수륙 무역 장정의 내용이다."},
{"id":"h172","subj":"한국사","unit":"개항기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 영국이 거문도를 불법으로 점령하였다.\n(나) 구식 군인들이 임오군란을 일으켰다.\n(다) 동학 농민군이 전주성을 점령하였다.\n(라) 급진 개화파가 갑신정변을 일으켰다.","opts":["(나) - (라) - (가) - (다)","(나) - (라) - (다) - (가)","(라) - (나) - (가) - (다)","(라) - (나) - (다) - (가)"],"ans":0,"exp":"임오군란(1882) → 갑신정변(1884) → 거문도 사건(1885~1887) → 동학 농민군의 전주성 점령(1894)의 순서이다. 거문도 사건은 갑신정변 뒤 조선이 러시아에 접근하자 영국이 러시아를 견제하려고 일으켰다."},
{"id":"h173","subj":"한국사","unit":"개항기","q":"(가)에 들어갈 기구로 옳은 것은?\n\n전주 화약을 맺은 뒤 동학 농민군은 전라도 각 고을에 (가) ______을/를 설치하였다. 농민군은 이 기구를 통해 치안과 행정에 참여하면서 탐관오리를 징계하고 잘못된 조세 제도를 고치는 등 폐정 개혁을 실천해 나갔다.","opts":["집강소","교정청","군국기무처","통리기무아문"],"ans":0,"exp":"동학 농민군이 전주 화약 뒤 전라도 각 고을에 둔 자치 기구는 집강소이다. 교정청은 같은 시기 정부가 자주적 개혁을 내세워 둔 기구이고, 군국기무처는 제1차 갑오개혁을 이끈 기구, 통리기무아문은 1880년 개화 정책을 맡은 기구이다."},
{"id":"h174","subj":"한국사","unit":"개항기","q":"다음 문서가 반포된 시기에 추진된 개혁의 내용으로 옳은 것은?\n\n○ 청에 의존하는 생각을 끊고 자주독립의 기초를 세운다.\n○ 왕실 사무와 국정 사무는 나누어 서로 섞이지 않게 한다.\n○ 조세의 부과와 징수, 경비의 지출은 모두 탁지아문에서 맡는다.","opts":["건양이라는 연호를 쓰기 시작하였다.","원수부를 설치하여 황제가 군대를 통솔하였다.","통리기무아문을 설치하여 개화 정책을 맡겼다.","지방 행정 구역을 8도에서 23부로 바꾸었다."],"ans":3,"exp":"고종이 반포한 홍범 14조로, 제2차 갑오개혁의 기본 방향을 담았다. 제2차 갑오개혁에서는 지방 행정 구역을 8도에서 23부로 바꾸고 재판소를 두어 사법권을 독립시켰다. 건양 연호는 을미개혁, 원수부는 광무개혁, 통리기무아문은 1880년의 일이다."},
{"id":"h175","subj":"한국사","unit":"개항기","q":"대한 제국이 추진한 광무개혁의 내용으로 옳지 않은 것은?","opts":["군국기무처를 두어 개혁을 추진하였다.","상공 학교 등 실업 학교를 세웠다.","양전 사업을 벌이고 지계를 발급하였다.","원수부를 두어 황제가 군대를 직접 통솔하였다."],"ans":0,"exp":"군국기무처는 1894년 제1차 갑오개혁을 이끈 기구이다. 광무개혁은 옛 법을 근본으로 하고 새것을 참고한다는 구본신참을 원칙으로 삼아 원수부 설치, 양전·지계 사업, 상공업 진흥과 실업 학교 설립 등을 추진하였다."},
{"id":"h176","subj":"한국사","unit":"개항기","q":"다음 논설이 처음 실린 신문으로 옳은 것은?\n\n아, 원통하고 분하도다. 우리 이천만 동포여, 살았는가 죽었는가. 단군과 기자 이래 사천 년 국민 정신이 하룻밤 사이에 갑자기 망하고 말 것인가. 원통하고 원통하다, 동포여 동포여.","opts":["한성순보","독립신문","황성신문","대한매일신보"],"ans":2,"exp":"을사늑약을 비판한 장지연의 「시일야방성대곡」으로, 1905년 황성신문에 실렸다. 황성신문은 국한문 혼용체로 발행되어 유생층이 주로 읽었다. 한성순보는 1883년 박문국에서 펴낸 첫 근대 신문이고, 대한매일신보는 양기탁과 영국인 베델이 1904년에 창간하였다."},
{"id":"h177","subj":"한국사","unit":"개항기","q":"일제의 국권 침탈 과정에서 맺어진 조약 (가)~(라)를 체결된 순서대로 바르게 나열한 것은?\n\n(가) 대한 제국의 외교권을 빼앗고 통감부를 두기로 하였다.\n(나) 일본이 군사상 필요한 곳을 쓸 수 있게 하였다.\n(다) 통감의 권한을 강화하고 각 부에 일본인 차관을 두게 하였다.\n(라) 일본이 추천하는 재정 고문과 외교 고문을 두게 하였다.","opts":["(나) - (가) - (라) - (다)","(나) - (라) - (가) - (다)","(나) - (라) - (다) - (가)","(라) - (나) - (가) - (다)"],"ans":1,"exp":"한일 의정서(1904년 2월) → 제1차 한일 협약(1904년 8월) → 을사늑약(1905) → 한일 신협약(정미 7조약, 1907)의 순서이다. 군사 요지 사용에서 고문 정치, 외교권 박탈, 차관 정치로 침탈이 깊어졌다."},
{"id":"h178","subj":"한국사","unit":"개항기","q":"밑줄 친 ‘의병’에 대한 설명으로 옳은 것은?\n\n이인영을 총대장으로 하여 전국에서 모인 __의병__ 부대는 서울 주재 각국 영사관에 글을 보내 자신들을 국제법상의 교전 단체로 인정해 달라고 요구하였다. 이어 허위가 이끄는 선발대가 동대문 밖 30리 지점까지 나아갔다.","opts":["단발령에 반발하여 처음 일어났다.","고종의 해산 권고에 따라 대부분 활동을 멈추었다.","남접과 북접이 논산에 모여 연합 부대를 이루었다.","해산된 군인이 합류하여 전투력이 강해졌다."],"ans":3,"exp":"13도 창의군을 꾸려 서울 진공 작전을 편 정미의병이다. 1907년 고종의 강제 퇴위와 군대 해산을 계기로 일어났으며, 해산 군인이 합류하여 전투력과 조직력이 강해졌다. 단발령에 대한 반발과 고종의 해산 권고는 을미의병, 남접과 북접의 연합은 동학 농민 운동과 관련된다."},
{"id":"h179","subj":"한국사","unit":"개항기","q":"다음 취지서를 계기로 시작된 운동에 대한 설명으로 옳은 것은?\n\n지금 나라의 빚이 1,300만 원이니 이는 우리 대한의 존망이 달린 일이다. 갚으면 나라가 살고 갚지 못하면 나라가 망하는 것은 뻔한 이치이다. … (중략) … 2천만 동포가 석 달 동안 담배를 끊고 그 값으로 한 사람이 다달이 20전씩 거둔다면 1,300만 원이 될 것이다.","opts":["일본의 황무지 개간권 요구를 물리쳤다.","독립 협회가 만민 공동회를 열어 이끌었다.","평양에서 조만식 등이 중심이 되어 시작하였다.","대한매일신보 등 언론의 지원을 받아 전국으로 퍼졌다."],"ans":3,"exp":"1907년 대구에서 서상돈 등이 시작한 국채 보상 운동의 취지서이다. 대한매일신보, 황성신문 등 언론이 지원하면서 전국으로 퍼졌으나 통감부의 방해로 중단되었다. 평양에서 조만식이 시작한 것은 물산 장려 운동, 황무지 개간권 요구 저지는 보안회의 활동이다."},
{"id":"h180","subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘이 사업’에 대한 설명으로 옳은 것은?\n\n조선 총독부는 임시 토지 조사국을 두고 __이 사업__을 벌였다. 토지 소유자가 정해진 기간 안에 자기 땅의 위치와 넓이 등을 직접 신고해야 소유권을 인정받을 수 있었다. 이 과정에서 왕실과 관청의 땅, 주인이 뚜렷하지 않은 땅 등이 총독부의 소유가 되었다.","opts":["지주의 권한이 약해지고 자작농이 크게 늘었다.","수리 조합을 만들고 벼 품종을 바꾸게 하였다.","쌀 생산을 늘려 일본으로 가져가려고 추진되었다.","농민이 관습적으로 누리던 경작권이 인정되지 않았다."],"ans":3,"exp":"1910년대의 토지 조사 사업이다. 지주의 소유권만 인정하고 농민이 관습적으로 누리던 경작권은 인정하지 않아, 많은 농민이 기한부 계약의 소작농으로 떨어졌다. 쌀 증산과 수리 조합, 품종 교체는 1920년대 산미 증식 계획의 내용이다."},
{"id":"h181","subj":"한국사","unit":"일제 강점기","q":"(가) 단체에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 1915년 대구에서 풍기 광복단과 조선 국권 회복단의 일부 인사가 모여 만든 비밀 결사이다. 박상진이 총사령을, 김좌진이 부사령을 맡았으며, 군자금을 모으고 친일 부호를 처단하였다.","opts":["105인 사건으로 조직이 무너졌다.","고종의 밀지를 받은 임병찬이 조직하였다.","공화 정체의 나라를 세우는 것을 목표로 삼았다.","「조선 혁명 선언」을 활동 지침으로 삼았다."],"ans":2,"exp":"(가)는 대한 광복회이다. 대한 광복회는 군대식 조직을 갖추고 공화 정체의 국가 건설을 목표로 삼았다. 임병찬이 조직한 것은 고종 복위를 내세운 독립 의군부, 105인 사건으로 무너진 것은 신민회, 「조선 혁명 선언」을 지침으로 삼은 것은 의열단이다."},
{"id":"h182","subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘이 시기’의 사실로 옳은 것은?\n\n새로 부임한 총독 사이토는 문관도 총독이 될 수 있게 하고 헌병 경찰제를 보통 경찰제로 바꾸겠다고 발표하였다. 그러나 __이 시기__에 문관 총독은 한 명도 임명되지 않았고, 경찰 관서와 경찰의 수는 오히려 크게 늘었다.","opts":["조선 태형령이 제정되어 시행되었다.","교사가 제복을 입고 칼을 차게 하였다.","성과 이름을 일본식으로 바꾸게 하였다.","조선일보와 동아일보의 발행이 허용되었다."],"ans":3,"exp":"3·1 운동 뒤 일제가 이른바 문화 통치를 내세운 1920년대이다. 이 시기에 한글 신문인 조선일보와 동아일보의 발행이 허용되었으나 검열과 삭제, 정간이 되풀이되었다. 조선 태형령과 교사의 제복·착검은 1910년대 무단 통치, 창씨개명은 1940년 무렵의 일이다."},
{"id":"h183","subj":"한국사","unit":"일제 강점기","q":"다음 선언서가 발표된 운동에 대한 설명으로 옳지 않은 것은?\n\n1. 오늘 우리의 이 거사는 정의, 인도, 생존, 존영을 위한 민족적 요구이니, 오직 자유로운 정신을 드러낼 것이요 결코 배타적 감정으로 치닫지 말라.\n1. 최후의 한 사람까지, 최후의 한 순간까지 민족의 정당한 의사를 시원하게 발표하라.","opts":["일제가 화성 제암리에서 주민을 학살하였다.","도쿄 유학생들의 2·8 독립 선언이 영향을 주었다.","순종의 장례일을 계기로 일어났다.","일제가 통치 방식을 이른바 문화 통치로 바꾸는 계기가 되었다."],"ans":2,"exp":"기미 독립 선언서의 공약 3장으로, 3·1 운동(1919) 때 발표되었다. 3·1 운동은 고종의 장례를 앞두고 일어났으며, 순종의 장례일에 일어난 것은 6·10 만세 운동(1926)이다. 2·8 독립 선언의 영향, 제암리 학살, 문화 통치로의 전환은 모두 3·1 운동에 대한 옳은 설명이다."},
{"id":"h184","subj":"한국사","unit":"일제 강점기","q":"다음 선언을 활동 지침으로 삼은 단체의 활동으로 옳은 것은?\n\n강도 일본을 쫓아내려면 오직 혁명으로써 할 뿐이니, 혁명이 아니고는 강도 일본을 쫓아낼 방법이 없다. … (중략) … 민중은 우리 혁명의 대본영이다. 폭력은 우리 혁명의 유일한 무기이다.","opts":["강우규가 사이토 총독에게 폭탄을 던졌다.","나석주가 동양 척식 주식회사에 폭탄을 던졌다.","안중근이 하얼빈에서 이토 히로부미를 처단하였다.","이봉창이 도쿄에서 일왕이 탄 마차에 폭탄을 던졌다."],"ans":1,"exp":"신채호가 쓴 「조선 혁명 선언」(1923)으로, 김원봉이 이끈 의열단의 활동 지침이었다. 의열단원 나석주는 1926년 동양 척식 주식회사와 조선 식산 은행에 폭탄을 던졌다. 이봉창은 한인 애국단원이고, 강우규는 노인 동맹단 소속이며, 안중근의 의거는 1909년의 일이다."},
{"id":"h188","subj":"한국사","unit":"일제 강점기","q":"(가)에 들어갈 군사 조직으로 옳은 것은?\n\n1938년 김원봉 등은 중국 국민당 정부의 지원을 받아 한커우에서 (가) ______을/를 만들었다. 이 부대는 중국군을 도와 정보 수집과 선전 활동을 벌였으며, 뒤에 일부는 화북으로 옮겨 가고 나머지는 한국 광복군에 합류하였다.","opts":["조선 혁명군","한국 독립군","조선 의용대","대한 독립군"],"ans":2,"exp":"1938년 한커우에서 만들어진 조선 의용대는 중국 관내에서 조직된 첫 한인 무장 부대이다. 조선 혁명군(양세봉)과 한국 독립군(지청천)은 1930년대 초 만주에서 중국군과 연합 작전을 폈고, 대한 독립군(홍범도)은 1920년 봉오동 전투에서 활약하였다."},
{"id":"h189","subj":"한국사","unit":"일제 강점기","q":"(가) 단체의 활동으로 옳은 것은?\n\n(가) ______은/는 조선어 연구회를 이어받아 우리말과 글을 연구하고 보급하는 데 힘썼다. 『우리말 큰사전』을 펴내려고 준비하였으나, 1942년 일제가 회원들을 치안 유지법 위반으로 잡아 가두면서 활동이 중단되었다.","opts":["『조선사』를 편찬하여 펴냈다.","민립 대학 설립 운동을 이끌었다.","한글 맞춤법 통일안과 표준어를 정하였다.","국문 연구소를 세워 국문을 정리하였다."],"ans":2,"exp":"(가)는 조선어 학회이다. 조선어 학회는 한글 맞춤법 통일안(1933)과 표준어(1936)를 정하였다. 국문 연구소는 1907년 대한 제국 학부에 둔 기관이고, 『조선사』는 총독부의 조선사 편수회가 펴냈으며, 민립 대학 설립 운동은 이상재 등의 조선 민립 대학 기성회가 이끌었다."},
{"id":"h190","subj":"한국사","unit":"일제 강점기","q":"다음 글을 쓴 인물의 활동으로 옳은 것은?\n\n역사란 무엇인가? 인류 사회의 ‘아’와 ‘비아’의 투쟁이 시간으로 발전하고 공간으로 확대되는 마음의 활동 상태에 관한 기록이다.","opts":["의열단의 부탁으로 「조선 혁명 선언」을 썼다.","『한국독립운동지혈사』를 썼다.","조선학 운동을 벌이며 ‘얼’을 강조하였다.","『조선사회경제사』를 써서 정체성론을 반박하였다."],"ans":0,"exp":"『조선상고사』의 첫머리로, 글쓴이는 신채호이다. 신채호는 김원봉의 부탁을 받아 의열단의 활동 지침인 「조선 혁명 선언」을 썼다. 『한국독립운동지혈사』는 박은식, ‘얼’의 강조는 정인보, 『조선사회경제사』는 백남운과 관련된다."},
{"id":"h191","subj":"한국사","unit":"일제 강점기","q":"대한민국 임시 정부가 발표한 다음 강령의 바탕이 된 사상으로 옳은 것은?\n\n○ 보통 선거 제도를 실시하여 정권을 고르게 하고, 국유 제도를 채용하여 이권을 고르게 하고, 공비 교육으로 학권을 고르게 한다.\n○ 대생산 기관의 공구와 수단은 국유로 하고, 토지·광산·어업·수리·은행·전신·교통 등은 국유로 한다.","opts":["이승만의 외교 독립론","조소앙의 삼균주의","안창호의 실력 양성론","신채호의 민중 직접 혁명론"],"ans":1,"exp":"1941년 임시 정부가 발표한 대한민국 건국 강령이다. 건국 강령은 정치, 경제, 교육의 균등을 내세운 조소앙의 삼균주의를 바탕으로 보통 선거, 주요 산업의 국유화, 무상 교육 등을 담았다."},
{"id":"h192","subj":"한국사","unit":"현대","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n__그__는 미소 공동 위원회가 성과 없이 쉬게 되자 김규식과 함께 좌우 합작 위원회를 이끌며 좌우 합작 7원칙을 발표하였다. 그러나 좌우 양쪽의 외면 속에 운동은 힘을 잃었고, __그__는 1947년 서울 혜화동에서 암살되었다.","opts":["한국 민주당의 창당을 주도하였다.","김구와 함께 평양의 남북 협상에 참석하였다.","광복 직후 조선 건국 준비 위원회를 조직하였다.","정읍에서 남한만의 단독 정부 수립을 주장하였다."],"ans":2,"exp":"밑줄 친 인물은 여운형이다. 여운형은 광복 직후 조선 건국 동맹을 바탕으로 조선 건국 준비 위원회를 조직하여 치안과 질서 유지에 나섰다. 정읍 발언은 이승만, 남북 협상 참석은 김규식, 한국 민주당 창당은 송진우와 김성수 등이 한 일이다."},
{"id":"h193","subj":"한국사","unit":"현대","q":"다음 글이 발표된 이후에 있었던 사실로 옳은 것은?\n\n나는 통일된 조국을 건설하려다가 38도선을 베고 쓰러질지언정, 일신의 구차한 안일을 위하여 단독 정부를 세우는 데에는 협력하지 않겠다.","opts":["평양에서 남북 협상이 열렸다.","좌우 합작 위원회가 출범하였다.","제1차 미소 공동 위원회가 열렸다.","모스크바 3국 외상 회의가 열렸다."],"ans":0,"exp":"1948년 2월 김구가 발표한 「삼천만 동포에게 읍고함」이다. 김구는 같은 해 4월 김규식과 함께 평양에 가서 남북 협상에 참석하였다. 모스크바 3국 외상 회의(1945), 제1차 미소 공동 위원회와 좌우 합작 위원회 출범(1946)은 모두 그 이전의 일이다."},
{"id":"h194","subj":"한국사","unit":"현대","q":"밑줄 친 ‘이 개혁’에 대한 설명으로 옳은 것은?\n\n제헌 헌법은 농지를 농민에게 분배한다고 규정하였다. 이에 따라 정부는 1949년 관련 법을 만들고 이듬해부터 __이 개혁__을 실시하였다. 한 집이 가질 수 있는 농지는 3정보로 제한되었다.","opts":["농지와 함께 산림과 임야도 분배하였다.","유상 매수, 유상 분배의 원칙에 따라 이루어졌다.","지주제가 강화되고 소작농이 크게 늘었다.","무상 몰수, 무상 분배의 원칙에 따라 이루어졌다."],"ans":1,"exp":"농지 개혁법에 따른 농지 개혁이다. 정부가 3정보를 넘는 농지 등을 지가 증권을 주고 사들여(유상 매수) 농민에게 팔고 5년 동안 수확물로 갚게 하였다(유상 분배). 무상 몰수·무상 분배는 북한의 토지 개혁 방식이며, 산림과 임야는 대상에서 빠졌고, 개혁의 결과 지주제가 무너지고 자작농이 늘었다."},
{"id":"h196","subj":"한국사","unit":"현대","q":"밑줄 친 ‘개헌’에 대한 설명으로 옳은 것은?\n\n1954년 국회 표결에서 개헌안은 재적 의원 203명 가운데 찬성 135표를 얻어, 필요한 의결 정족수에 1표가 모자라 부결이 선포되었다. 그러나 여당인 자유당은 이틀 뒤 수학의 반올림을 내세워 가결되었다고 번복하고 __개헌__을 강행하였다.","opts":["대통령의 3선 연임을 허용하였다.","대통령을 국민이 직접 뽑도록 바꾸었다.","대통령을 7년 단임의 간선제로 뽑게 하였다.","개헌 당시의 대통령에 한하여 중임 제한을 없앴다."],"ans":3,"exp":"사사오입 개헌(1954)이다. 개헌 당시의 대통령(초대 대통령)에 한하여 중임 제한을 없애 이승만이 계속 출마할 수 있게 하였다. 대통령 직선제는 발췌 개헌(1952), 3선 연임 허용은 3선 개헌(1969), 7년 단임 간선제는 1980년 개헌의 내용이다."},
{"id":"h197","subj":"한국사","unit":"현대","q":"박정희 정부 시기의 사실로 옳지 않은 것은?","opts":["한일 협정을 체결하였다.","베트남에 국군을 파병하였다.","금융 실명제를 실시하였다.","새마을 운동을 시작하였다."],"ans":2,"exp":"금융 실명제는 1993년 김영삼 정부가 대통령 긴급 명령으로 실시하였다. 박정희 정부는 한일 협정을 체결하고(1965) 베트남에 국군을 파병하였으며, 1970년부터 새마을 운동을 추진하였다."},
{"id":"h198","subj":"한국사","unit":"현대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 광주에서 5·18 민주화 운동이 일어났다.\n(나) 유신 헌법이 공포되었다.\n(다) 6월 민주 항쟁이 일어났다.\n(라) 부산과 마산에서 부마 민주 항쟁이 일어났다.","opts":["(나) - (가) - (라) - (다)","(나) - (라) - (가) - (다)","(나) - (라) - (다) - (가)","(라) - (나) - (가) - (다)"],"ans":1,"exp":"유신 헌법 공포(1972) → 부마 민주 항쟁(1979) → 5·18 민주화 운동(1980) → 6월 민주 항쟁(1987)의 순서이다. 부마 민주 항쟁은 유신 체제가 무너지는 계기가 되었고, 5·18 민주화 운동은 신군부의 비상계엄 확대에 맞서 일어났다."},
{"id":"h199","subj":"한국사","unit":"현대","q":"김영삼 정부 시기의 사실로 옳은 것은?","opts":["서울 올림픽을 개최하였다.","경제 협력 개발 기구(OECD)에 가입하였다.","첫 남북 정상 회담을 열었다.","제1차 경제 개발 5개년 계획을 시작하였다."],"ans":1,"exp":"김영삼 정부는 금융 실명제를 실시하고 1996년 경제 협력 개발 기구(OECD)에 가입하였으나, 임기 말 외환 위기를 맞아 국제 통화 기금(IMF)의 지원을 받았다. 제1차 경제 개발 5개년 계획은 박정희 정부, 서울 올림픽은 노태우 정부, 첫 남북 정상 회담은 김대중 정부 때의 일이다."},
{"id":"h200","subj":"한국사","unit":"현대","q":"(가) 정부 시기의 사실로 옳은 것은?\n\n(가) ______ 정부는 서울 올림픽을 치른 뒤 사회주의 국가들과 관계를 맺는 북방 외교를 적극적으로 펼쳐 소련, 중국과 차례로 국교를 맺었다. 이 시기에 남북한은 유엔에 동시에 가입하였다.","opts":["남북 기본 합의서를 채택하였다.","7·4 남북 공동 성명을 발표하였다.","6·15 남북 공동 선언을 발표하였다.","남북 이산가족 고향 방문단을 처음 교환하였다."],"ans":0,"exp":"(가)는 노태우 정부이다. 노태우 정부는 1991년 남북 기본 합의서를 채택하고 한반도 비핵화 공동 선언에 합의하였다. 7·4 남북 공동 성명은 박정희 정부, 6·15 남북 공동 선언은 김대중 정부, 이산가족 고향 방문단의 첫 교환(1985)은 전두환 정부 때의 일이다."},
{"id":"h201","subj":"한국사","unit":"선사·고조선","q":"구석기 시대에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 주먹도끼, 찍개 같은 뗀석기를 사용하였다.\nㄴ. 가락바퀴를 사용하여 실을 뽑았다.\nㄷ. 고인돌을 만들어 지배자의 무덤으로 삼았다.\nㄹ. 무리를 이루어 옮겨 다니며 사냥과 채집을 하였다.","opts":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":1,"exp":"구석기 시대 사람들은 주먹도끼, 찍개 같은 뗀석기를 쓰고(ㄱ), 무리 지어 옮겨 다니며 사냥과 채집으로 먹을거리를 얻었다(ㄹ). 가락바퀴로 실을 뽑아 옷을 지은 것(ㄴ)은 신석기 시대부터이고, 고인돌(ㄷ)은 계급이 생긴 청동기 시대의 무덤이다."},
{"id":"h202","subj":"한국사","unit":"삼국 시대","q":"(가) 왕의 업적으로 옳지 않은 것은?\n\n(가) ______은/는 백제와 연합하여 고구려가 차지하고 있던 한강 상류 지역을 빼앗고, 이어 백제가 되찾은 한강 하류 지역까지 차지하였다. 이후 넓어진 영토를 돌아보고 북한산, 황초령, 마운령 등에 순수비를 세웠다.","opts":["대가야를 정복하였다.","황룡사를 건립하였다.","병부와 상대등을 설치하였다.","화랑도를 국가적 조직으로 개편하였다."],"ans":2,"exp":"한강 유역을 모두 차지하고 순수비를 세운 (가)는 신라 진흥왕이다. 병부와 상대등을 설치한 왕은 법흥왕이므로 옳지 않다. 진흥왕은 화랑도를 국가 조직으로 개편하고 황룡사를 지었으며, 562년 대가야를 정복하여 낙동강 유역을 차지하였다."},
{"id":"h203","subj":"한국사","unit":"삼국 시대","q":"(가) 왕 재위 시기의 사실로 옳지 않은 것은?\n\n(가) ______은/는 광개토 대왕의 뒤를 이어 즉위하여 아버지의 업적을 기리는 비석을 국내성 부근에 세웠다. 중국의 남북조와 각각 교류하면서 서쪽 국경을 안정시킨 뒤, 남쪽으로 영토를 넓히는 데 힘을 쏟았다.","opts":["고구려가 낙랑군을 몰아냈다.","고구려가 평양으로 도읍을 옮겼다.","고구려가 백제의 수도 한성을 함락하였다.","백제와 신라가 동맹을 맺어 고구려에 맞섰다."],"ans":0,"exp":"광개토 대왕릉비를 세우고 남진 정책을 편 (가)는 장수왕(재위 413~491)이다. 낙랑군을 몰아낸 것은 4세기 초 미천왕 때의 일이므로 옳지 않다. 장수왕은 427년 평양으로 도읍을 옮겼고, 이에 맞서 백제와 신라가 동맹을 맺었으며(433), 475년에는 백제의 한성을 함락하고 개로왕을 죽였다."},
{"id":"h204","subj":"한국사","unit":"남북국 시대","q":"밑줄 친 ‘왕’의 정책으로 옳지 않은 것은?\n\n__왕__이 교서를 내려 말하기를 “… (중략) … 역적의 우두머리 흠돌, 흥원, 진공 등은 재능이 있어 벼슬에 오른 것이 아니고 은혜로 관직에 올랐는데도 … (중략) … 군사를 모아 그 무리를 없애려 하니, 흩어져 달아나거나 대궐에 와서 항복하였다.”라고 하였다.\n- 「삼국사기」","opts":["국학을 설립하였다.","독서삼품과를 실시하였다.","관료전을 지급하고 녹읍을 폐지하였다.","지방 제도를 9주 5소경으로 정비하였다."],"ans":1,"exp":"장인 김흠돌의 반란을 진압한 왕은 신라 신문왕이다. 독서삼품과는 원성왕 때 마련한 제도이므로 옳지 않다. 신문왕은 국학을 세워 유학을 가르치고, 9주 5소경의 지방 제도를 완비하였으며, 관료전을 지급하고 녹읍을 폐지하여 귀족의 경제 기반을 약화하였다."},
