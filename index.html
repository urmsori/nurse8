<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8급 간호직 학습 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 배치: 앱 전체가 한 권의 시험지. 흰 종이마다 굵은 윗줄과 자간 넓힌 제목을 두고, 본문은 명조, 조작은 고딕과 먹색 버튼, 채점과 복습은 빨간 펜으로 통일한다. */
:root{
  --paper:#F1F2F4;--card:#FFFFFF;--ink:#16181D;--sub:#565B66;--line:#DDDFE4;--line2:#B9BDC6;
  --pen:#2747C7;--pen-t:#E6EBFB;
  --ok:#0A6B50;--on-ok:#FFFFFF;--ok-t:#DDF2EA;
  --no:#C0321F;--no-t:#FBE6E1;
  --hl:#FFE680;
  --ui:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --exam:'Noto Serif KR','AppleMyungjo','Batang',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111318;--card:#1B1E25;--ink:#ECEEF3;--sub:#A3A9B8;--line:#2C303C;--line2:#474C5A;
  --pen:#8FA6FF;--pen-t:#232B4D;
  --ok:#5FD0A8;--on-ok:#06261C;--ok-t:#12332A;
  --no:#FF8A7A;--no-t:#3B1A16;
  --hl:#6B5A10;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111318;--card:#1B1E25;--ink:#ECEEF3;--sub:#A3A9B8;--line:#2C303C;--line2:#474C5A;
  --pen:#8FA6FF;--pen-t:#232B4D;
  --ok:#5FD0A8;--on-ok:#06261C;--ok-t:#12332A;
  --no:#FF8A7A;--no-t:#3B1A16;
  --hl:#6B5A10;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:13px;font-weight:800;color:var(--sub)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 20px 96px;display:flex;flex-direction:column;gap:18px}
#app.focus{padding-bottom:0}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.sub{color:var(--sub);font-size:13px}
.grow{flex:1;min-width:0}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
/* 종이 한 장. 평소에는 선 없이 흰 종이와 제목만 두고, 문제 화면(.exam)에서만 시험지의 굵은 머리줄을 쓴다. */
.sheet{background:var(--card);border-radius:6px;padding:18px 18px 18px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh .subj{flex:1;min-width:0;font-size:17px;font-weight:800}
.sh .unit{font-size:13px;font-weight:600;color:var(--sub);text-align:right}
.sh .kind{padding:3px 8px;border-radius:4px;background:var(--paper);color:var(--sub);font-size:12px;font-weight:800;white-space:nowrap}
.sheet.exam{border:1px solid var(--line2);border-radius:4px;padding:14px 18px 16px}
.exam .sh{padding:10px 0 9px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:16px}
.exam .sh .subj{font-size:16px;letter-spacing:.25em}
.exam .sh .unit{font-size:12px}
.exam .sh .kind{border:1px solid var(--ink);border-radius:0;background:none;color:var(--ink);padding:2px 8px}
.body{font-family:var(--exam);font-size:16px;font-weight:500;line-height:1.8}

/* 버튼과 네모 칸 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:0 18px;border:0;border-radius:6px;background:var(--ink);color:var(--card);font-size:17px;font-weight:800;letter-spacing:.04em;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--sub)}
.btn.quiet{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{min-height:46px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-size:13px;font-weight:800;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pill:disabled{border-color:var(--line2);color:var(--sub)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;border-radius:4px;flex:none}
.ai{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--pen);border-radius:2px;color:var(--pen);font-size:11px;font-weight:800;letter-spacing:0}
.sq{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border:1px solid var(--line2);border-radius:6px;flex:none;background:var(--card);color:var(--ink)}
.sq.fill{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sq:disabled{border-color:var(--line2);background:var(--line);color:var(--sub)}
.sq.on{background:var(--no);border-color:var(--no);color:var(--card);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--no-t)}}

/* 줄 목록 */
.rows{display:flex;flex-direction:column;margin:-8px 0 -8px}
.rows > button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.rows > button:last-child,.rows > div:last-child{border-bottom:0}
.rows > div{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.rows > div > button.grow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border:0;background:none;text-align:left}
.rows .dayh{min-height:36px;padding:10px 0 4px;font-size:12px;font-weight:800;color:var(--sub);justify-content:space-between}
.rows .mk{display:flex;align-items:center;justify-content:center;width:26px;height:26px;color:var(--no);flex:none}
.sname{width:100px;font-weight:800;flex:none}
.bar{flex:1;height:6px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pen)}
.cnt{width:52px;text-align:right;font-family:var(--exam);font-size:14px;font-weight:700;color:var(--sub);flex:none}
.item{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item small{font-size:12px;font-weight:700;color:var(--sub)}
.item span{font-family:var(--exam);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;font-weight:800;white-space:nowrap;color:var(--no)}
.st.g{color:var(--sub)}

/* 표: 이번 주, 복습 단계 */
.tbl{display:grid;gap:6px}
.tbl > div{display:flex;flex-direction:column;min-width:0;border-radius:4px;background:var(--paper);overflow:hidden}
.tbl > div > span{display:block;padding:5px 0 0;font-size:12px;font-weight:800;color:var(--sub);text-align:center}
.tbl > div > i,.tbl > div > b{display:flex;align-items:center;justify-content:center;height:46px;font-style:normal;font-family:var(--exam);font-size:22px;font-weight:700}
.tbl .now{box-shadow:inset 0 0 0 2px var(--ink)}
.tbl .now > span{color:var(--ink)}
.tbl svg{color:var(--no)}
.tbl .first b{color:var(--no)}
.tbl .last b{color:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 오늘 */
.big{font-family:var(--exam);font-size:44px;font-weight:700;line-height:1.1}
.big small{font-size:20px;margin-left:4px}
.split{display:flex;height:8px;background:var(--line);gap:2px}
.split i{display:block;height:100%}
.split .r{background:var(--no)}
.split .n{background:var(--pen)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sub)}
.legend b{color:var(--ink);font-family:var(--exam)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}

/* 문제 풀이 */
.qtop{display:flex;align-items:center;gap:8px;margin:-8px -8px 0 -12px}
.prog{flex:1;height:8px;border:1px solid var(--ink);background:var(--card);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.qrow{position:relative;display:flex;gap:8px;font-family:var(--exam);font-size:18px;font-weight:500;line-height:1.75}
.qrow .no{font-family:var(--ui);font-weight:800;flex:none;white-space:nowrap}
.qrow .stem{flex:1;min-width:0;white-space:pre-line}
.pen{position:absolute;left:-16px;top:-13px;width:76px;height:58px;color:var(--no);pointer-events:none}
.pen path,.score path{stroke-dasharray:260;stroke-dashoffset:0}
.pen.draw path,.score path{animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
.passage{margin-top:12px;padding:12px 14px;border:1px solid var(--ink);font-family:var(--exam);font-size:17px;font-weight:500;line-height:1.75;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:2px;margin:12px -8px -6px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:52px;padding:12px 8px;border:0;border-radius:4px;background:none;font-family:var(--exam);font-size:17px;font-weight:500;line-height:1.6;text-align:left}
.opt .n{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:12px;border:1px solid var(--ink);font-size:13px;font-weight:700;line-height:1;flex:none}
.opt .t{flex:1;min-width:0}
.opt .m{font-family:var(--ui);font-size:12px;font-weight:800;white-space:nowrap;margin-top:4px}
.opt.sel{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.opt.sel .n{background:var(--ink);color:var(--card)}
.opt.right{background:var(--ok-t);color:var(--ok);font-weight:700}
.opt.right .n{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.opt.wrong{background:var(--no-t);color:var(--no);font-weight:700}
.opt.wrong .n{background:var(--no);border-color:var(--no);color:var(--card)}
.opt.dim{color:var(--sub)}
.opt.dim .n{border-color:var(--sub)}
.aibox{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.steps{margin:0;padding-left:22px;font-family:var(--exam);font-size:15px;font-weight:500;line-height:1.75}
.steps li{padding:2px 0}
a.btn{text-decoration:none}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-size:14px;font-weight:800}
.check input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.conn .cd{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--sub)}
.conn.on{color:var(--ok)}
.conn.on .cd{background:var(--ok);border-color:var(--ok)}
.conn.wait,.sub.wait{color:var(--pen);font-weight:700}
.sub.wait{display:flex;align-items:center;gap:8px}
#jobBar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:0 8px 0 20px;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;font-weight:800;color:var(--pen)}
#jobBar[hidden]{display:none}
#jobBar button{margin-left:auto;min-height:44px;padding:0 12px;border:0;background:none;font-weight:800;color:var(--ink)}
.sub.warn{color:var(--no);font-weight:700}
.foot{position:sticky;bottom:0;margin:auto -20px 0;padding:12px 20px 16px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;z-index:3}
.foot.good{background:var(--ok-t);border-top:3px solid var(--ok)}
.foot.bad{background:var(--no-t);border-top:3px solid var(--no)}
.foot.pop{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.verdict{display:flex;align-items:flex-start;gap:12px}
.verdict .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;flex:none}
.good .verdict{color:var(--ok)}
.good .verdict .ic{background:var(--ok);color:var(--on-ok)}
.bad .verdict{color:var(--no)}
.bad .verdict .ic{background:var(--no);color:var(--card)}
.verdict b{display:block;font-size:18px;font-weight:800;line-height:1.3}
.verdict span{font-size:14px;font-weight:600}
.verdict mark{background:var(--hl);color:var(--ink);padding:1px 5px;font-family:var(--exam)}
.good .btn{background:var(--ok);color:var(--on-ok)}
.bad .btn{background:var(--no);color:var(--card)}

/* 채점 결과 */
.score{position:relative;align-self:center;padding:0 18px 14px;font-family:var(--exam);font-size:60px;font-weight:700;line-height:1.1;color:var(--no)}
.score small{font-size:28px}
.score svg{position:absolute;left:0;bottom:0;width:100%;height:16px}

/* 복습 */
.switch{display:flex;align-items:center;width:54px;height:30px;padding:3px;border:1px solid var(--line2);border-radius:4px;background:var(--card);flex:none}
.switch i{width:22px;height:22px;border-radius:2px;background:var(--sub);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"] i{background:var(--card);transform:translateX(24px)}
.chip-w{min-height:44px;padding:0 12px;border:0;border-radius:4px;background:var(--no-t);color:var(--no);font-size:13px;font-weight:800}
.field{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-size:16px}
textarea.field{min-height:120px;resize:vertical;font-family:var(--exam)}
details > summary{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:800;cursor:pointer;list-style:none}
details > summary::-webkit-details-marker{display:none}
details[open] > summary .chev{transform:rotate(90deg)}

/* 강사 */
.ctxq > summary{font-size:13px}
.ctxq > summary .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--sub)}
.ctxq[open] > summary .t{visibility:hidden}
.ctxq[open] > summary .chev{transform:rotate(90deg)}
.ctxq div.opt{min-height:0;padding:8px}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;padding:4px 0 10px}
.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:52px;padding:2px 0;border:1px solid var(--line);border-radius:4px;background:none;color:var(--no)}
.oc small{font-size:11px;font-weight:700;color:var(--sub);line-height:1.2}
.oc:disabled{opacity:.45}
.oc.sel{border-color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.oc.sel small{color:var(--ink)}
.selbar{position:sticky;bottom:72px;margin:0 -20px;padding:10px 20px 12px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:3}
.chat{display:flex;flex-direction:column;gap:12px;flex:1}
.msg{max-width:90%;padding:12px 14px;border-radius:4px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--card);font-size:15px;font-weight:600;line-height:1.6}
.msg.a{align-self:flex-start;background:var(--card);font-family:var(--exam);font-size:16px;font-weight:500;line-height:1.8}
.msg.n{align-self:center;background:none;color:var(--sub);font-size:13px;text-align:center;padding:4px}
.msg .again{display:flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:none;font-family:var(--ui);font-size:13px;font-weight:800}
.composer{position:sticky;bottom:72px;margin:0 -20px -24px;padding:10px 20px 14px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:3}
.composer .status{font-size:13px;font-weight:600;color:var(--sub);min-height:20px}
.composer form{display:flex;align-items:center;gap:8px}
.composer input{flex:1;min-width:0;height:54px;padding:0 14px;border:1px solid var(--line2);border-radius:6px;background:var(--card);font-size:16px}
.composer input:disabled{border-color:var(--line2)}

nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav > div{max-width:480px;margin:0 auto;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:12px;font-weight:700;text-decoration:none}
nav a[aria-current="page"]{color:var(--ink);font-weight:800}
nav a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--ink)}
nav a .badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:var(--card);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
nav.hide{display:none}
[hidden]{display:none!important}
dialog{border:0;border-radius:8px;padding:20px;width:min(340px,calc(100vw - 40px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,18,.55)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 40px);padding:12px 16px;border-radius:4px;background:var(--ink);color:var(--card);font-size:14px;font-weight:700;z-index:9;display:none}
u{text-underline-offset:4px}
.blank{display:inline-block;width:4.5em;border-bottom:1px solid currentColor;vertical-align:baseline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="jobBar" role="status" hidden></div>
<main id="app"></main>
<nav id="nav" aria-label="주요 메뉴"><div>
<a href="#home" data-tab="home"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>오늘</span></a>
<a href="#quiz" data-tab="quiz"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7"/><path d="M9 16h7"/></svg><span>과목</span></a>

<script>
var BANK = [
{"id":"m02","subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 기획의 유형은?\n\n○ 최고관리자가 수립한다.\n○ 조직 전체의 방향을 정하는 장기적이고 포괄적인 기획이다.","opts":["전략적 기획","전술적 기획","운영적 기획","단기 기획"],"ans":0,"exp":"전략적 기획은 최고관리층이 조직의 비전과 장기 목표를 정하는 기획이다. 전술적 기획은 중간관리층이 전략을 부서 단위로 구체화하는 중기 기획이고, 운영적 기획은 일선관리자가 세우는 단기의 구체적 실행 계획이다."},
{"id":"m03","subj":"간호관리","unit":"간호전달체계","q":"다음 설명에 해당하는 간호전달체계는?\n\n○ 한 명의 간호사가 환자의 입원부터 퇴원까지 간호를 책임진다.\n○ 담당 간호사가 24시간의 간호 계획을 세우고 그 결과에 책임을 진다.","opts":["일차간호방법","팀 간호방법","모듈 방법","기능적 분담방법"],"ans":0,"exp":"일차간호방법은 일차간호사가 담당 환자의 입원에서 퇴원까지 간호를 계획하고 책임진다. 기능적 분담방법은 투약, 처치처럼 업무별로 나누어 맡는 방식이고, 팀 간호방법은 팀 리더를 중심으로 팀원이 함께 간호하는 방식이며, 모듈 방법은 병동을 구역으로 나누어 작은 팀이 그 구역 환자를 맡는 방식이다."},
{"id":"m04","subj":"간호관리","unit":"리더십","q":"허시와 블랜차드(Hersey & Blanchard)의 이론에서 능력과 의지가 모두 낮은 구성원에게 적합한 유형은?","opts":["지시형","설득형","참여형","위임형"],"ans":0,"exp":"구성원 성숙도가 가장 낮은 단계(능력 낮음, 의지 낮음)에는 과업 지향이 높고 관계 지향이 낮은 지시형이 적합하다. 능력은 낮지만 의지가 높으면 설득형, 능력은 높지만 의지가 낮으면 참여형, 둘 다 높으면 위임형이다."},
{"id":"m05","subj":"간호관리","unit":"조직","q":"규칙과 절차가 문서로 표준화된 정도를 뜻하는 조직 구조의 구성 요소는?","opts":["공식화","복잡성","집권화","분권화"],"ans":0,"exp":"공식화는 직무가 규칙, 절차, 지침으로 표준화된 정도이다. 복잡성은 조직이 수평적, 수직적, 지역적으로 분화된 정도이고, 집권화는 의사결정 권한이 상위 계층에 집중된 정도이며, 분권화는 그 권한이 하위 계층에 나뉘어 있는 정도이다."},
{"id":"m06","subj":"간호관리","unit":"질 관리","q":"도나베디안(Donabedian)의 질 평가 접근법 중 구조적 평가의 지표는?","opts":["환자 만족도","간호사 대 환자 비율","투약 시 환자 확인 수행률","평균 재원일수"],"ans":1,"exp":"구조적 평가는 간호가 제공되는 여건을 본다. 인력, 시설, 장비, 정책, 조직 구조가 해당하므로 간호사 대 환자 비율이 정답이다. 환자 확인 수행률은 간호 활동 자체를 보는 과정적 평가이고, 환자 만족도와 재원일수는 결과적 평가이다."},
{"id":"m07","subj":"간호관리","unit":"환자안전","q":"다음 설명에 해당하는 환자안전 용어는?\n\n○ 환자에게 사망이나 심각한 신체적·정신적 손상을 초래한 예기치 못한 사건이다.\n○ 발생하면 근본원인분석으로 원인을 찾아 재발을 막아야 한다.","opts":["근접오류","위해사건","적신호 사건","잠재적 오류"],"ans":2,"exp":"적신호 사건은 사망이나 영구적 손상 같은 심각한 결과를 낳은 예기치 못한 사건으로, 근본원인분석의 대상이 된다. 근접오류는 오류가 환자에게 도달하기 전에 발견되어 해가 없었던 경우이고, 위해사건은 의료 제공 과정에서 환자에게 해가 발생한 사건 전반을 가리킨다. 잠재적 오류는 사고의 바탕에 숨어 있는 시스템의 결함이다."},
{"id":"m08","subj":"간호관리","unit":"예산","q":"전년도 예산과 관계없이 모든 사업을 원점에서 검토하여 편성하는 예산제도는?","opts":["점증적 예산제도","영기준 예산제도","품목별 예산제도","성과주의 예산제도"],"ans":1,"exp":"영기준 예산제도는 기존 사업도 처음 시작하는 것처럼 타당성을 다시 검토해 우선순위에 따라 편성한다. 점증적 예산제도는 전년도 예산에 일정 비율을 더하는 방식이고, 품목별 예산제도는 지출 대상 품목별로, 성과주의 예산제도는 사업과 성과 중심으로 편성한다."},
{"id":"m10","subj":"간호관리","unit":"인사고과","q":"다음 사례에 해당하는 직무수행평가의 오류는?\n\nA 수간호사는 B 간호사가 환자에게 매우 친절하다는 점 때문에 업무의 정확성, 책임감 등 다른 평가 항목도 모두 높게 평가하였다.","opts":["후광 효과","관대화 경향","중심화 경향","근접 오류"],"ans":0,"exp":"후광 효과는 피평가자의 한 가지 뛰어난 특성에서 받은 인상이 다른 항목의 평가에까지 번지는 오류이다. 관대화 경향은 특정 특성과 관계없이 전반적으로 실제보다 높게 평가하는 것이고, 중심화 경향은 모두 중간 점수로 평가하는 것이며, 근접 오류는 평가표에서 가까이 놓인 항목에 비슷한 점수를 주거나 평가 시점에 가까운 최근의 실적에 치우쳐 평가하는 것이다."},
{"id":"m12","subj":"간호관리","unit":"간호윤리","q":"환자에게 해를 입히거나 해가 될 위험을 초래하지 않아야 한다는 생명윤리 원칙은?","opts":["자율성 존중의 원칙","선행의 원칙","정의의 원칙","악행금지의 원칙"],"ans":3,"exp":"악행금지의 원칙은 해를 끼치지 말라는 원칙이다. 선행의 원칙은 한 걸음 더 나아가 적극적으로 이익이 되는 행위를 하라는 것이고, 자율성 존중은 환자의 자기 결정을 존중하는 것이며, 정의의 원칙은 자원과 부담을 공정하게 분배하는 것이다."},
{"id":"m13","subj":"간호관리","unit":"관리이론","q":"테일러(Taylor)의 과학적 관리론에 대한 설명으로 옳은 것은?","opts":["조직을 환경과 상호작용하는 개방 체계로 보았다.","조직 전체에 적용할 14가지 관리 원칙을 제시하였다.","시간－동작 연구로 표준 작업량을 정하고 차별 성과급을 주었다.","비공식 집단과 사회적 욕구가 생산성을 좌우한다고 보았다."],"ans":2,"exp":"과학적 관리론은 시간－동작 연구로 하루의 표준 작업량을 정하고, 달성 여부에 따라 임금을 달리 주는 차별 성과급으로 능률을 높이려 하였다. 14가지 관리 원칙은 페이욜의 행정관리론, 비공식 집단과 사회적 욕구는 인간관계론, 개방 체계는 체계이론의 내용이다."},
{"id":"m14","subj":"간호관리","unit":"관리이론","q":"메이요(Mayo)의 호손 실험 결과에 대한 설명으로 옳은 것은?","opts":["생산성은 조명과 같은 물리적 작업 조건에 따라 결정된다.","생산성은 구성원의 사회·심리적 요인과 비공식 집단의 영향을 받는다.","분업과 작업 표준화가 생산성을 높이는 가장 좋은 방법이다.","합법적 권한에 근거한 계층 구조가 가장 능률적인 조직 형태이다."],"ans":1,"exp":"호손 실험에서는 조명 같은 물리적 조건보다 구성원의 감정, 인정받는다는 느낌, 비공식 집단의 규범이 생산성에 더 큰 영향을 준다는 결과가 나왔고, 이것이 인간관계론의 바탕이 되었다. 분업과 표준화는 과학적 관리론, 합법적 권한과 계층 구조는 관료제 이론의 주장이다."},
{"id":"m15","subj":"간호관리","unit":"관리이론","q":"베버(Weber)의 관료제 이론에서 제시한 조직의 특성으로 옳지 않은 것은?","opts":["권한의 계층에 따른 명확한 위계","전문적 자격과 능력에 근거한 선발과 승진","문서화된 규칙과 절차에 따른 업무 수행","개인적 친분과 감정을 고려한 업무 처리"],"ans":3,"exp":"관료제는 개인적 감정과 친분을 배제하고 규칙에 따라 공평하게 업무를 처리하는 비개인성(공사의 구분)을 특성으로 한다. 계층에 따른 위계, 문서화된 규칙과 절차, 전문 자격에 따른 선발과 승진, 분업은 모두 관료제의 특성이다."},
{"id":"m16","subj":"간호관리","unit":"관리이론","q":"길리스(Gillies)의 간호관리 체계모형에서 변환 과정에 해당하는 것은?","opts":["환자 만족도와 간호의 질","간호 인력, 물자, 자금, 정보","간호사 이직률과 재원 일수","기획, 조직, 인사, 지휘, 통제"],"ans":3,"exp":"체계모형은 투입, 변환 과정, 산출, 피드백으로 이루어지며 변환 과정은 투입을 산출로 바꾸는 관리 과정(기획, 조직, 인사, 지휘, 통제)이다. 인력, 물자, 자금, 정보는 투입이고 환자 만족도, 간호의 질, 이직률, 재원 일수는 산출이다."},
{"id":"m17","subj":"간호관리","unit":"관리이론","q":"카츠(Katz)의 관리 기술 중 최고관리자에게 상대적으로 더 많이 요구되는 것은?","opts":["실무적 기술","인간적 기술","개념적 기술","임상 수기 기술"],"ans":2,"exp":"개념적 기술은 조직 전체를 보고 부분 간의 관계를 파악하여 방향을 정하는 능력으로, 위 계층으로 갈수록 더 많이 요구된다. 실무적(전문적) 기술은 일선관리자에게 가장 많이 필요하고 임상 수기도 여기에 속한다. 인간적 기술은 모든 계층의 관리자에게 비슷하게 중요하다."},
{"id":"m18","subj":"간호관리","unit":"관리이론","q":"다음 설명에 해당하는 개념은?\n\n투입한 자원에 대한 산출의 비율로, 최소의 자원으로 최대의 산출을 얻었는지를 나타낸다. '일을 올바르게 하는 것'에 해당한다.","opts":["형평성","효율성","효과성","적합성"],"ans":1,"exp":"효율성은 투입 대 산출의 비율로, 자원을 낭비 없이 사용했는지를 본다. 효과성은 설정한 목표를 얼마나 달성했는지를 뜻하며 '올바른 일을 하는 것'에 해당한다. 형평성은 공정한 분배, 적합성은 대상자의 요구에 맞는 정도를 말한다."},
{"id":"m20","subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 기획의 계층은?\n\n○ 특정 업무를 수행하는 방법을 시간 순서에 따라 단계별로 제시한 지침이다.\n○ 유치도뇨관 삽입 순서, 입원 환자 접수 순서 등이 해당한다.","opts":["정책","철학","절차","규칙"],"ans":2,"exp":"절차는 업무를 수행하는 방법과 순서를 단계별로 적은 지침이다. 정책은 의사결정과 행동의 방향을 제시하는 포괄적 지침이고, 규칙은 해야 할 것과 하지 말아야 할 것을 정해 재량의 여지가 없는 지시이다. 철학은 조직 구성원의 행동을 이끄는 신념과 가치를 진술한 것이다."},
{"id":"m21","subj":"간호관리","unit":"기획","q":"목표관리(MBO)에 대한 설명으로 옳지 않은 것은?","opts":["구성원이 자신의 목표를 정하는 과정에 참여한다.","목표는 상급자가 단독으로 정하여 하급자에게 내려보낸다.","목표는 측정할 수 있도록 구체적으로 정한다.","정해진 기간 뒤에 성과를 함께 평가하고 피드백한다."],"ans":1,"exp":"목표관리는 상급자와 하급자가 협의하여 목표를 정하고, 구성원이 스스로 통제하며 수행한 뒤 성과를 함께 평가하는 참여적 관리 기법이다. 상급자가 혼자 목표를 정해 내려보내는 것은 목표관리의 핵심인 참여와 자기 통제에 어긋난다."},
{"id":"m22","subj":"간호관리","unit":"기획","q":"다음 사례에 해당하는 집단 의사결정 방법은?\n\nA 병동 간호사들이 한자리에 모여 토의 없이 각자 해결 방안을 종이에 적어 냈다. 진행자가 의견을 모두 적고 설명을 들은 뒤 무기명 투표로 우선순위를 정하였다.","opts":["명목집단법","델파이법","전자회의법","브레인스토밍"],"ans":0,"exp":"명목집단법은 구성원이 모이기는 하지만 토의 없이 각자 의견을 글로 내고 투표로 결정하여, 소수의 발언 독점과 동조 압력을 줄이는 방법이다. 브레인스토밍은 비판 없이 자유롭게 말로 아이디어를 내는 방법이고, 델파이법은 전문가들이 만나지 않고 익명 설문을 여러 차례 반복하여 의견을 모으는 방법이다."},
{"id":"m23","subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 현상은?\n\n응집력이 강한 집단에서 만장일치를 이루려는 압력 때문에 반대 의견이 억제되고 대안을 충분히 검토하지 못하게 된다.","opts":["선택적 지각","사회적 태만","집단 양극화","집단사고"],"ans":3,"exp":"집단사고는 응집력이 높은 집단이 합의를 지나치게 중시하여 비판적 검토 없이 결정을 내리는 현상이다. 집단 양극화는 토의 뒤에 집단의 의견이 처음보다 더 극단으로 치우치는 것이고, 사회적 태만은 집단 속에서 개인이 노력을 덜 하는 것이며, 선택적 지각은 자신에게 유리한 정보만 받아들이는 것이다."},
{"id":"m24","subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 기획 기법은?\n\n○ 과업 완료에 걸리는 시간을 낙관적 시간, 가능성이 가장 높은 시간, 비관적 시간의 세 가지로 추정한다.\n○ 활동들의 선후 관계를 연결망으로 나타낸다.","opts":["간트 차트(Gantt chart)","의사결정나무(decision tree)","프로그램 평가 검토 기법(PERT)","기획예산제도(PPBS)"],"ans":2,"exp":"PERT는 세 가지 추정 시간으로 기대 시간을 계산하고 활동 간의 관계를 연결망으로 그려, 불확실성이 큰 사업의 일정을 관리하는 기법이다. 간트 차트는 활동별 일정을 막대로 표시하는 도표이고, 의사결정나무는 대안과 그 결과를 가지 모양으로 그려 비교하는 도구이며, 기획예산제도는 장기 계획과 예산 편성을 연결하는 예산 제도이다."},
{"id":"m25","subj":"간호관리","unit":"기획","q":"다음 사례에 해당하는 SWOT 분석의 전략 유형은?\n\nA 병원 간호부는 숙련된 전문간호사가 많다는 점을 살려, 지역의 노인 인구 증가로 늘어나는 가정간호 수요에 맞추어 가정간호 사업을 확대하기로 하였다.","opts":["SO 전략","ST 전략","WO 전략","WT 전략"],"ans":0,"exp":"숙련된 전문간호사가 많다는 것은 내부의 강점(S)이고 가정간호 수요 증가는 외부의 기회(O)이므로, 강점으로 기회를 살리는 SO 전략이다. ST 전략은 강점으로 외부 위협에 대응하는 것, WO 전략은 약점을 보완하여 기회를 살리는 것, WT 전략은 약점을 줄이고 위협을 피하는 방어적 전략이다."},
{"id":"m26","subj":"간호관리","unit":"재무관리","q":"다음 설명에 해당하는 재무제표는?\n\n○ 일정 시점의 재무 상태를 보여 준다.\n○ 자산, 부채, 자본으로 구성된다.","opts":["재무상태표","현금흐름표","손익계산서","자본변동표"],"ans":0,"exp":"재무상태표(대차대조표)는 특정 시점의 자산, 부채, 자본을 보여 주어 재무 구조의 건전성을 알 수 있게 한다. 손익계산서는 일정 기간의 수익과 비용으로 경영 성과를 보여 주고, 현금흐름표는 일정 기간의 현금 유입과 유출을, 자본변동표는 일정 기간의 자본 변동 내용을 보여 준다."},
{"id":"m27","subj":"간호관리","unit":"예산","q":"환자 감시 장치, 인공호흡기 같은 고가 장비를 구입하기 위해 편성하는 예산은?","opts":["현금예산","자본지출예산","운영예산","인력예산"],"ans":1,"exp":"자본지출예산은 건물, 고가 장비처럼 오래 사용하는 고정 자산의 구입에 쓰는 예산이다. 운영예산은 한 회계 연도의 일상적 운영에 드는 소모품비, 관리비 등을 다루고, 인력예산은 급여와 수당 등 인건비를, 현금예산은 현금의 수입과 지출 흐름을 다룬다."},
{"id":"m28","subj":"간호관리","unit":"예산","q":"예산 과정을 순서대로 바르게 나열한 것은?\n\n(가) 예산 집행\n(나) 예산 편성\n(다) 결산 및 평가\n(라) 심의·확정","opts":["(나) → (가) → (라) → (다)","(나) → (라) → (가) → (다)","(라) → (나) → (가) → (다)","(나) → (라) → (다) → (가)"],"ans":1,"exp":"예산은 먼저 부서별 요구를 모아 편성하고, 심의를 거쳐 확정한 뒤, 확정된 예산을 집행하고, 회계 연도가 끝나면 결산하고 평가한다. 심의·확정 없이 집행할 수 없고, 결산은 집행이 끝난 뒤에 이루어진다."},
{"id":"m29","subj":"간호관리","unit":"재무관리","q":"환자 수와 관계없이 총액이 일정하게 발생하는 고정비에 해당하는 것은?","opts":["환자 급식의 식재료비","병동 건물의 감가상각비","일회용 주사기 등 진료 재료비","환자에게 투여한 약품비"],"ans":1,"exp":"고정비는 조업도(환자 수, 서비스 양)와 관계없이 일정하게 발생하는 원가로 건물 감가상각비, 임차료, 정규직 기본급 등이 해당한다. 약품비, 진료 재료비, 급식 재료비는 환자 수에 비례하여 늘어나는 변동비이다."},
{"id":"m30","subj":"간호관리","unit":"재무관리","q":"질병군별 포괄수가제(DRG)에 대한 설명으로 옳은 것은?","opts":["입원 1일당 정해진 금액을 재원 일수만큼 지불한다.","의료 행위 하나하나에 가격을 매겨 합산한 금액을 지불한다.","등록된 주민 수에 따라 일정 금액을 미리 지불한다.","서비스의 양과 관계없이 질병군별로 미리 정한 금액을 지불한다."],"ans":3,"exp":"포괄수가제는 환자가 어느 질병군에 속하는지에 따라 미리 정한 금액을 지불하는 방식으로, 과잉 진료를 줄이고 재원 일수를 단축하는 효과가 있지만 서비스가 과소 제공될 우려가 있다. 행위마다 값을 매기는 것은 행위별수가제, 등록 주민 수 기준은 인두제, 1일당 정액은 일당수가제이다."},
{"id":"m32","subj":"간호관리","unit":"조직","q":"다음 사례에서 지켜지지 않은 조직화의 원리는?\n\n신규 간호사 A는 같은 업무에 대해 수간호사와 책임간호사에게서 서로 다른 지시를 받아 혼란을 겪고 있다.","opts":["통솔범위의 원리","분업·전문화의 원리","계층제의 원리","명령통일의 원리"],"ans":3,"exp":"명령통일의 원리는 구성원이 한 명의 상관에게서만 명령을 받고 그에게 보고해야 한다는 원리로, 지켜지지 않으면 혼란과 책임 회피가 생긴다. 통솔범위의 원리는 한 관리자가 효과적으로 감독할 수 있는 부하의 수에 관한 것이고, 계층제의 원리는 권한과 책임에 따라 직위를 등급화하는 것이다."},
{"id":"m33","subj":"간호관리","unit":"조직","q":"매트릭스 조직에 대한 설명으로 옳은 것은?","opts":["전문 지식을 가진 참모가 조언만 하고 명령권은 갖지 않는다.","최고관리자에서 일선 직원까지 명령이 수직으로만 전달된다.","구성원이 기능 부서와 프로젝트 팀에 함께 속해 두 상사에게 보고한다.","구성원이 원래 부서를 떠나 과제만 전담하고 과제가 끝나면 해산한다."],"ans":2,"exp":"매트릭스 조직은 기능 조직에 프로젝트 조직을 결합한 구조로, 구성원이 기능 부서장과 프로젝트 관리자 두 사람의 지휘를 받아 명령통일의 원리에 어긋날 수 있다. 수직적 명령 전달은 라인 조직, 조언하는 참모는 라인－스태프 조직, 과제만 전담하다가 해산하는 임시 조직은 프로젝트 조직의 특성이다."},
{"id":"m36","subj":"간호관리","unit":"조직변화","q":"다음 사례에 해당하는 레윈(Lewin)의 조직변화 단계는?\n\n전자간호기록 도입을 앞두고 A 수간호사가 수기 기록의 문제점을 알려, 간호사들이 변화가 필요하다고 느끼게 하였다.","opts":["움직임 단계","종결 단계","재동결 단계","해빙 단계"],"ans":3,"exp":"해빙 단계는 현재 상태의 문제를 인식시켜 변화의 필요성과 동기를 갖게 하는 단계이다. 움직임(변화) 단계는 새로운 방법을 실제로 받아들여 실행하는 단계이고, 재동결 단계는 변화가 정착되어 새로운 균형을 이루도록 굳히는 단계이다. 종결 단계는 레윈의 3단계에 없다."},
{"id":"m37","subj":"간호관리","unit":"조직변화","q":"다음 설명에 해당하는 계획적 조직변화 전략은?\n\n사람은 합리적 존재이므로, 변화가 자신에게 이익이 된다는 지식과 정보를 얻으면 변화를 받아들인다고 본다.","opts":["규범적－재교육적 전략","동지적 전략","권력－강제적 전략","경험적－합리적 전략"],"ans":3,"exp":"경험적－합리적 전략은 사람이 합리적으로 자기 이익을 따른다고 보고 지식과 정보를 제공하여 변화를 이끈다. 규범적－재교육적 전략은 태도와 가치관, 집단 규범을 바꾸는 데 초점을 두고, 권력－강제적 전략은 권력과 제재를 이용하며, 동지적 전략은 구성원 간의 친밀감과 소속감을 이용한다."},
{"id":"m38","subj":"간호관리","unit":"조직","q":"권한위임에 대한 설명으로 옳은 것은?","opts":["위임하면 최종 책임도 위임받은 사람에게 모두 넘어간다.","인사고과나 훈육 같은 관리자 고유의 업무부터 위임한다.","위임할 때는 책임만 주고 권한은 주지 않는다.","업무를 위임해도 결과에 대한 최종 책임은 관리자에게 남는다."],"ans":3,"exp":"권한은 위임할 수 있지만 최종 책임은 위임되지 않으므로 관리자는 위임한 업무의 결과를 확인해야 한다. 위임할 때는 업무 수행에 필요한 권한을 책임과 함께 주어야 하며, 인사고과, 훈육, 기밀 사항처럼 관리자 고유의 업무는 위임하지 않는다."},
{"id":"m39","subj":"간호관리","unit":"조직","q":"다음 사례에 해당하는 직무설계 방법은?\n\n투약 업무만 담당하던 A 간호사에게 담당 환자의 간호 계획 수립과 평가, 퇴원 교육 내용의 결정까지 맡겨 자율성과 책임을 높였다.","opts":["직무확대","직무충실화","직무단순화","직무순환"],"ans":1,"exp":"직무충실화는 계획, 통제, 평가 같은 관리 기능을 직무에 더해 자율성과 책임을 수직적으로 늘리는 방법이다. 직무확대는 비슷한 수준의 과업 수만 수평적으로 늘리는 것이고, 직무순환은 여러 직무를 돌아가며 맡는 것이며, 직무단순화는 과업을 세분하여 단순하게 만드는 것이다."},
{"id":"m40","subj":"간호관리","unit":"간호전달체계","q":"간호전달체계 중 사례관리에 대한 설명으로 옳은 것은?","opts":["업무 종류별로 담당자를 정해 병동의 모든 환자에게 수행한다.","간호사 한 명이 근무 시간 동안 맡은 환자의 모든 간호를 수행한다.","표준진료지침을 이용해 진료 과정과 재원 기간, 비용을 관리한다.","병동을 구역으로 나누어 소수의 간호 인력이 그 구역 환자를 맡는다."],"ans":2,"exp":"사례관리는 사례관리자가 표준진료지침(critical pathway)을 도구로 여러 직종의 서비스를 조정하고, 정해진 기간 안에 기대하는 결과를 얻도록 재원 일수와 비용을 관리하는 방식이다. 업무별로 나누어 맡는 것은 기능적 분담방법, 근무 시간 동안 맡은 환자의 간호를 모두 하는 것은 사례방법, 구역별로 맡는 것은 모듈 방법이다."},
{"id":"m41","subj":"간호관리","unit":"인적자원관리","q":"간호 인력 산정 방법 중 산업공학적 방법에 대한 설명으로 옳은 것은?","opts":["경험 많은 관리자의 주관적 판단으로 인력 수를 정한다.","간호 활동별 소요 시간을 측정하여 필요한 인력을 계산한다.","환자 유형별 간호 표준을 정하고 그에 따른 간호 시간으로 산정한다.","전년도 인력 수에 일정 비율을 더하여 인력 수를 정한다."],"ans":1,"exp":"산업공학적 방법은 간호 업무를 직접 간호, 간접 간호 등으로 나누고 시간－동작 분석으로 활동별 소요 시간을 측정하여 업무량과 인력을 계산한다. 관리자의 경험과 판단에 따르는 것은 서술적 방법이고, 환자 유형별 간호 표준을 정한 뒤 그에 따른 간호 시간으로 산정하는 것은 관리공학적 방법이다."},
{"id":"m42","subj":"간호관리","unit":"인적자원관리","q":"환자분류체계 중 요인평가제에 대한 설명으로 옳은 것은?","opts":["진단명이 같은 환자는 모두 같은 군으로 분류한다.","환자의 재원 일수만을 기준으로 군을 나눈다.","군별 전형적 특성을 기술해 두고 가장 비슷한 군에 환자를 배정한다.","간호 의존도를 나타내는 항목마다 점수를 매기고 합산하여 군을 정한다."],"ans":3,"exp":"요인평가제는 위생, 영양, 투약 등 간호 요구를 나타내는 항목별로 점수를 주고 총점으로 환자군을 정한다. 군별 전형적 특성을 기술해 놓고 비슷한 군에 배정하는 것은 원형평가제이다. 환자분류체계는 진단명이나 재원 일수가 아니라 간호 요구량을 기준으로 한다."},
{"id":"m44","subj":"간호관리","unit":"인적자원관리","q":"다음 설명에 해당하는 신규 간호사 교육 방법은?\n\n○ 숙련된 경력 간호사가 일정 기간 신규 간호사 한 명을 맡는다.\n○ 일대일로 임상 실무를 가르치고 역할 모델이 되어 준다.","opts":["프리셉터십","집합 강의","유도 훈련","보수교육"],"ans":0,"exp":"프리셉터십은 프리셉터(경력 간호사)가 신규 간호사를 일대일로 지도하여 현장 적응을 돕는 방법이다. 유도 훈련은 입사 직후 조직의 이념, 규정, 시설 등을 소개하는 교육이고, 보수교육은 면허 취득 뒤 지식과 기술을 유지·향상하기 위한 교육이며, 집합 강의는 여러 명을 한자리에 모아 가르치는 방식이다."},
{"id":"m46","subj":"간호관리","unit":"인적자원관리","q":"직무평가 방법 중 점수법에 대한 설명으로 옳은 것은?","opts":["직무 전체를 서로 비교하여 순위를 매긴다.","미리 정한 등급 기준에 맞추어 직무를 배정한다.","평가 요소별로 점수를 주고 합산하여 직무 가치를 정한다.","기준 직무와 요소별로 비교하여 임금액을 정한다."],"ans":2,"exp":"점수법은 숙련도, 책임, 노력, 작업 조건 등 요소별 점수의 합으로 직무의 상대적 가치를 정한다. 직무 전체를 비교해 순위를 매기는 것은 서열법, 미리 정한 등급 기준에 직무를 배정하는 것은 직무분류법, 기준 직무를 정하고 요소별로 견주어 임금액을 정하는 것은 요소비교법이다."},
{"id":"m47","subj":"간호관리","unit":"인사고과","q":"다음 설명에 해당하는 직무수행평가 방법은?\n\n○ 평가 등급별 인원 비율을 미리 정해 놓고 그에 맞추어 피평가자를 배정한다.\n○ 관대화 경향과 중심화 경향을 줄일 수 있다.","opts":["강제배분법","중요사건 기술법","자기평가법","도표식 평정척도법"],"ans":0,"exp":"강제배분법은 예를 들어 상 20%, 중 60%, 하 20%처럼 등급별 비율을 정해 두어 관대화, 중심화 경향을 막는다. 도표식 평정척도법은 평가 요소별로 척도에 표시하는 방법으로 관대화 경향이 생기기 쉽고, 중요사건 기술법은 성과에 영향을 준 구체적 행동을 기록하는 방법이다."},
{"id":"m48","subj":"간호관리","unit":"인사고과","q":"다음 사례에 해당하는 직무수행평가의 오류는?\n\nA 수간호사는 B 간호사가 특정 대학 출신이라는 이유로 \"그 학교 출신은 성실하지 않다.\"라고 여겨 근무 성적을 낮게 평가하였다.","opts":["대비 오류","관대화 경향","상동적 오류","논리적 오류"],"ans":2,"exp":"상동적 오류는 피평가자가 속한 집단(출신 학교, 지역, 성별 등)에 대한 고정관념으로 개인을 평가하는 오류이다. 대비 오류는 평가자 자신이나 다른 피평가자와 비교하여 평가하는 것이고, 논리적 오류는 서로 관련이 있어 보이는 평가 항목에 비슷한 점수를 주는 것이며, 관대화 경향은 전반적으로 실제보다 높게 평가하는 것이다."},
{"id":"m49","subj":"간호관리","unit":"인적자원관리","q":"직무의 난이도와 책임 등 직무의 상대적 가치에 따라 기본급을 정하는 임금체계는?","opts":["직능급","연공급","성과급","직무급"],"ans":3,"exp":"직무급은 직무평가로 정한 직무의 상대적 가치에 따라 임금을 정하므로 '같은 직무에 같은 임금'의 원칙에 맞는다. 연공급은 근속 연수와 연령 등에 따라, 직능급은 직무 수행 능력에 따라, 성과급은 달성한 성과에 따라 임금을 정한다."},
{"id":"m50","subj":"간호관리","unit":"인적자원관리","q":"간호사 훈육의 원칙으로 옳은 것은?","opts":["위반한 행위에 초점을 두고 다른 사람이 없는 곳에서 한다.","문제 행위가 있고 나서 충분한 기간이 지난 뒤에 한다.","같은 위반이라도 평소 친분에 따라 수위를 다르게 한다.","본보기가 되도록 동료들이 있는 곳에서 공개적으로 한다."],"ans":0,"exp":"훈육은 사람이 아니라 문제 행위에 초점을 두고, 사생활을 보호할 수 있는 곳에서 비공개로 해야 한다. 또한 문제 행위가 생기면 신속하게 다루어야 하고, 같은 위반에는 누구에게나 같은 기준을 적용하는 일관성이 있어야 한다."},
{"id":"m51","subj":"간호관리","unit":"리더십","q":"블레이크와 머튼(Blake & Mouton)의 관리격자이론에서 생산과 인간에 대한 관심이 모두 높은 유형은?","opts":["중도형","과업형","팀형","인기형"],"ans":2,"exp":"팀형(9.9형)은 생산과 인간 모두에 대한 관심이 높아 가장 이상적인 유형으로 본다. 과업형(9.1형)은 생산에만, 인기형(1.9형, 컨트리클럽형)은 인간에만 관심이 높고, 중도형(5.5형)은 둘 다 중간 수준이다."},
{"id":"m52","subj":"간호관리","unit":"리더십","q":"피들러(Fiedler)의 상황적합성 이론에서 상황 호의성을 결정하는 요소가 아닌 것은?","opts":["리더의 직위 권력","과업의 구조화 정도","리더와 구성원의 관계","구성원의 성숙도"],"ans":3,"exp":"피들러는 리더－구성원 관계, 과업 구조, 직위 권력의 세 요소로 상황이 리더에게 얼마나 유리한지를 판단하였다. 상황이 매우 유리하거나 매우 불리하면 과업지향 리더가, 중간 정도이면 관계지향 리더가 효과적이라고 보았다. 구성원의 성숙도는 허시와 블랜차드의 상황적 리더십이론에서 쓰는 상황 변수이다."},
{"id":"m55","subj":"간호관리","unit":"동기부여","q":"병원이 간호사에게 제공한 다음 내용이 충족시키는 매슬로(Maslow)의 욕구는?\n\n○ 고용 보장\n○ 산업재해 보상 보험\n○ 주사침 자상 예방 장비","opts":["생리적 욕구","안전 욕구","소속과 애정의 욕구","존경 욕구"],"ans":1,"exp":"안전 욕구는 신체적 위험과 경제적 불안에서 보호받으려는 욕구로 고용 안정, 보험, 안전한 작업 환경이 이를 충족시킨다. 생리적 욕구는 적정 임금, 휴식, 식사와 관련되고, 소속과 애정의 욕구는 동료 관계와 팀 소속감, 존경 욕구는 인정, 포상, 승진과 관련된다."},
{"id":"m56","subj":"간호관리","unit":"동기부여","q":"알더퍼(Alderfer)의 ERG이론에 대한 설명으로 옳은 것은?","opts":["상위 욕구가 좌절되면 하위 욕구가 더 커진다고 본다.","인간의 욕구를 다섯 단계로 세분하였다.","한 시점에는 한 가지 욕구만 작용한다고 본다.","하위 욕구가 충족되어야만 상위 욕구가 나타난다고 본다."],"ans":0,"exp":"ERG이론은 욕구를 존재, 관계, 성장의 세 가지로 줄였고, 상위 욕구가 충족되지 않으면 하위 욕구로 되돌아가는 좌절－퇴행과 여러 욕구가 동시에 작용할 수 있음을 인정한다. 다섯 단계로 나누고 하위 욕구가 채워져야 다음 욕구가 나타난다고 본 것은 매슬로의 이론이다."},
{"id":"m57","subj":"간호관리","unit":"동기부여","q":"다음 설명에 해당하는 브룸(Vroom)의 기대이론의 구성요소는?\n\n일정한 성과를 달성하면 그에 따른 보상이 주어질 것이라는 주관적 믿음이다.","opts":["유의성","공정성","수단성","기대"],"ans":2,"exp":"수단성은 성과가 보상으로 이어질 것이라는 믿음이다. 기대는 노력하면 성과를 낼 수 있다는 믿음이고, 유의성은 보상이 자신에게 얼마나 가치 있는지에 대한 선호의 정도이다. 기대이론은 이 세 가지의 곱으로 동기의 강도가 정해진다고 본다. 공정성은 아담스의 공정성이론의 개념이다."},
{"id":"m58","subj":"간호관리","unit":"동기부여","q":"다음 사례를 설명하는 동기부여 이론은?\n\nA 간호사는 경력과 업무량이 비슷한 동료가 더 많은 성과급을 받은 것을 알고, 의욕이 떨어져 업무에 들이는 노력을 줄였다.","opts":["아담스(Adams)의 공정성이론","허츠버그(Herzberg)의 동기－위생이론","맥클리랜드(McClelland)의 성취동기이론","로크(Locke)의 목표설정이론"],"ans":0,"exp":"공정성이론은 사람이 자신의 투입 대비 보상의 비율을 다른 사람과 비교하고, 불공정하다고 느끼면 노력을 줄이는 등의 방법으로 균형을 되찾으려 한다고 본다. 목표설정이론은 구체적이고 도전적인 목표가 동기를 높인다는 것이고, 성취동기이론은 성취, 권력, 친화 욕구를, 동기－위생이론은 동기요인과 위생요인을 다룬다."},
{"id":"m60","subj":"간호관리","unit":"갈등관리","q":"다음 사례에서 A 수간호사가 사용한 갈등 관리 방법은?\n\n두 간호사가 휴가 일정을 두고 갈등하자, A 수간호사는 두 사람이 각자의 사정을 터놓고 이야기하게 하여 양쪽 모두 만족하는 근무 일정을 함께 찾도록 하였다.","opts":["회피","타협","협력","수용"],"ans":2,"exp":"협력은 양쪽의 관심사를 모두 충족하는 해결책을 함께 찾는 방법으로 자기주장과 협조가 모두 높다. 타협은 서로 조금씩 양보하여 절충하는 것이라 양쪽 모두 완전히 만족하지는 못한다. 회피는 갈등을 다루지 않고 피하는 것이고, 수용은 자신의 관심사를 접고 상대의 요구를 들어주는 것이다."},
{"id":"m61","subj":"간호관리","unit":"의사소통","q":"다음 상황에서 주장행동에 해당하는 A 간호사의 반응은?\n\n동료가 A 간호사에게 자신의 야간 근무를 대신 서 달라고 자주 부탁한다.","opts":["\"이번 주는 대신 서기 어려워요. 다른 방법을 같이 찾아봐요.\"라고 말한다.","내키지 않지만 \"알겠어요. 제가 할게요.\"라고 말한다.","\"선생님은 왜 늘 남에게 일을 떠넘겨요?\"라고 따진다.","대답하지 않고 자리를 피한 뒤 다른 동료에게 불만을 말한다."],"ans":0,"exp":"주장행동은 상대의 권리를 침해하지 않으면서 자신의 생각과 감정, 권리를 솔직하게 표현하는 것으로, ‘나’를 주어로 자신의 상태와 바라는 점을 말한다. 내키지 않는데 받아들이는 것은 소극적 행동이고, 상대를 비난하는 것은 공격적 행동이며, 직접 말하지 않고 뒤에서 불만을 드러내는 것은 수동공격적 행동이다."},
{"id":"m62","subj":"간호관리","unit":"리더십","q":"특정 분야의 뛰어난 지식과 기술에서 나오는 권력의 유형은?","opts":["보상적 권력","전문적 권력","준거적 권력","합법적 권력"],"ans":1,"exp":"전문적 권력은 특정 분야의 지식과 기술, 경험에서 나오는 권력으로, 상처 간호에 뛰어난 간호사의 의견을 동료와 의사가 따르는 것이 그 예이다. 합법적 권력은 조직이 부여한 직위에서, 보상적 권력은 승진이나 급여 같은 보상을 줄 수 있는 능력에서 나오며, 준거적 권력은 인격적 매력으로 다른 사람이 닮고 싶어 할 때 생긴다."},
{"id":"m63","subj":"간호관리","unit":"질 관리","q":"질 보장(QA)과 비교한 총체적 질 관리(TQM)의 특성으로 옳은 것은?","opts":["표준에 미달한 개인을 찾아내어 교정하는 데 초점을 둔다.","질 관리 부서의 전담 직원만 활동에 참여한다.","문제가 발견된 뒤에 사후적으로 해결하는 것이 목적이다.","문제가 없어도 과정을 지속적으로 개선하며 모든 직원이 참여한다."],"ans":3,"exp":"총체적 질 관리는 고객 중심으로 업무 과정과 시스템을 지속적으로 개선하며, 최고관리자에서 일선 직원까지 모두 참여한다. 표준 미달 사례와 개인을 찾아 교정하고, 전담 부서 중심으로 문제 발생 뒤에 해결하는 것은 전통적 질 보장의 특성이다."},
{"id":"m64","subj":"간호관리","unit":"질 관리","q":"다음에서 설명하는 질 향상 활동 도구는?\n\n결과를 머리에, 원인을 사람·환경·장비·절차 같은 범주별 가지에 적어 생선 뼈 모양으로 정리함으로써 결과와 원인의 관계를 한눈에 보여 준다.","opts":["인과관계도","히스토그램","런 차트","파레토 차트"],"ans":0,"exp":"인과관계도(특성요인도, 어골도)는 결과를 머리에, 원인을 범주별 가지에 적어 문제의 원인을 체계적으로 찾는 도구이다. 파레토 차트는 원인을 빈도순 막대로 나열한 것이고, 런 차트는 시간의 흐름에 따른 변화를 꺾은선으로 그린 것이며, 히스토그램은 자료의 분포를 막대로 나타낸 것이다."},
{"id":"m65","subj":"간호관리","unit":"질 관리","q":"다음 설명에 해당하는 질 향상 활동 도구는?\n\n○ 문제의 원인을 발생 빈도가 높은 순서대로 막대그래프로 나열한다.\n○ 누적 백분율을 꺾은선으로 함께 표시하여 먼저 해결할 원인을 찾는다.","opts":["관리도","파레토 차트","산점도","흐름도"],"ans":1,"exp":"파레토 차트는 소수의 주요 원인이 문제의 대부분을 차지한다는 원리에 따라 개선의 우선순위를 정하는 데 쓴다. 흐름도는 업무 과정의 단계를 순서대로 그린 것이고, 산점도는 두 변수의 관계를 점으로 나타낸 것이며, 관리도는 상한선과 하한선을 두고 시간에 따른 변동을 살피는 것이다."},
{"id":"m66","subj":"간호관리","unit":"질 관리","q":"욕창 발생을 줄이기 위한 다음 활동에 해당하는 PDCA 순환의 단계는?\n\nA 병동은 새로 만든 체위 변경 프로토콜을 한 병실에서 2주 동안 시범 적용하였다.","opts":["Plan(계획)","Do(실행)","Check(검증)","Act(개선)"],"ans":1,"exp":"실행(Do) 단계는 계획한 개선안을 작은 규모로 시험 적용하고 자료를 모으는 단계이다. 계획(Plan)은 문제를 분석하고 개선안을 마련하는 단계, 검증(Check)은 시범 적용 결과를 목표와 비교해 평가하는 단계, 개선(Act)은 효과가 확인된 방법을 표준화하여 전체로 넓히거나 수정하는 단계이다."},
{"id":"m67","subj":"간호관리","unit":"환자안전","q":"다음 설명에 해당하는 환자안전 분석 방법은?\n\n사고가 발생하기 전에 업무 과정의 단계마다 일어날 수 있는 오류와 그 영향을 예측하고, 위험 우선순위를 정하여 미리 개선하는 전향적 방법이다.","opts":["근본원인분석(RCA)","의무기록 감사","동료 심사","오류유형과 영향분석(FMEA)"],"ans":3,"exp":"오류유형과 영향분석은 사고가 나기 전에 과정의 단계별로 일어날 수 있는 오류와 그 심각도, 발생 가능성 등을 따져 미리 개선하는 전향적 방법이다. 근본원인분석은 적신호 사건 등이 이미 발생한 뒤에 근본 원인을 찾는 후향적 방법이다. 의무기록 감사와 동료 심사는 이미 제공된 진료와 간호를 평가하는 방법이다."},
{"id":"m69","subj":"간호관리","unit":"환자안전","q":"구두 처방을 받은 간호사의 조치로 옳은 것은?","opts":["받아 적은 내용을 다시 읽어 주어 처방자의 확인을 받는다.","수행한 뒤에는 서면 처방을 따로 받지 않아도 된다.","응급 상황이 아니어도 편의를 위해 적극적으로 활용한다.","받아 적지 않고 들은 내용을 기억하여 바로 수행한다."],"ans":0,"exp":"구두 처방은 받아 적고(write down), 적은 내용을 다시 읽어 주어(read back), 처방자의 확인을 받은 뒤 수행한다. 구두 처방은 응급 상황이나 시술 중처럼 직접 처방을 입력할 수 없을 때로 제한하고, 수행한 뒤에는 정해진 시간 안에 서면(전산) 처방을 받아야 한다."},
{"id":"m70","subj":"간호관리","unit":"질 관리","q":"의료법령상 의료기관 인증에 대한 설명으로 옳은 것은?","opts":["의료기관 인증은 관할 시·도지사가 실시한다.","모든 의원급 의료기관은 의무적으로 인증을 신청해야 한다.","인증의 유효기간은 4년이고 조건부인증의 유효기간은 1년이다.","인증 등급은 인증과 불인증의 두 가지로 구분한다."],"ans":2,"exp":"의료기관 인증의 등급은 인증, 조건부인증, 불인증의 세 가지이며, 유효기간은 인증 4년, 조건부인증 1년이다. 인증은 보건복지부장관이 병원급 의료기관을 대상으로 실시하고 그 업무를 의료기관평가인증원에 위탁하며, 원칙적으로 의료기관의 자율 신청에 따른다."},
{"id":"m71","subj":"간호관리","unit":"질 관리","q":"의료법령상 의료기관 인증을 의무적으로 신청해야 하는 의료기관은?","opts":["요양병원","치과병원","종합병원","한방병원"],"ans":0,"exp":"의료기관 인증은 병원급 의료기관의 자율 신청이 원칙이지만, 요양병원은 의료서비스의 질과 환자안전을 확보하기 위해 의무적으로 인증을 신청하도록 정해져 있다. 종합병원, 치과병원, 한방병원은 자율적으로 신청한다."},
{"id":"m72","subj":"간호관리","unit":"환자안전","q":"환자안전법령상 200병상 이상 병원의 장이 보건복지부장관에게 지체 없이 보고해야 하는 사고는?","opts":["환자에게 아무런 손상이 생기지 않은 침상 낙상","투약 직전에 발견되어 환자에게 도달하지 않은 처방 오류","설명하고 동의받은 내용과 다른 수술로 환자가 사망한 사고","보호자가 복도에서 넘어져 가벼운 찰과상을 입은 사고"],"ans":2,"exp":"환자안전사고 보고는 자율 보고가 원칙이지만, 일정 규모 이상의 병원급 의료기관에서 중대한 환자안전사고가 발생하면 의료기관의 장이 지체 없이 보고해야 한다. 설명하고 동의받은 내용과 다른 수술·수혈·전신마취로 환자가 사망하거나 심각한 손상을 입은 경우가 대표적이다. 근접오류나 손상이 없는 사고는 자율 보고 대상이다."},
{"id":"m73","subj":"간호관리","unit":"간호단위관리","q":"다음 설명에 해당하는 물품 공급 방식은?\n\n사용 여부와 관계없이 정해진 시간에, 정해진 수량의 물품을 채운 카트를 통째로 바꾸어 준다.","opts":["정수보충 방식","정기 청구 방식","수시 청구 방식","정수교환 방식"],"ans":3,"exp":"정수교환 방식은 기준 수량을 채운 새 카트나 용기를 가져와 기존 것과 통째로 바꾸는 방식이다. 정수보충 방식은 정해진 시간에 사용한 수량만큼만 채워 기준 수량을 맞추는 방식이다. 청구 방식은 간호단위에서 필요한 물품을 정기 또는 수시로 청구서를 내어 받는 방식이다."},
{"id":"m75","subj":"간호관리","unit":"감염관리","q":"반코마이신 내성 장알균(VRE) 감염 환자의 격리 방법으로 옳은 것은?","opts":["수술용 마스크만 착용하고 장갑과 가운은 착용하지 않는다.","음압 격리실에 두고 병실에 들어갈 때 N95 마스크를 쓴다.","병실에 들어갈 때 장갑과 가운을 착용하고 물품은 환자 전용으로 쓴다.","면역 저하 환자를 위한 양압 보호 격리실에 둔다."],"ans":2,"exp":"VRE, MRSA, CRE 같은 다제내성균은 직접 접촉이나 오염된 물품을 통해 전파되므로 접촉주의를 적용한다. 병실에 들어갈 때 장갑과 가운을 착용하고, 청진기 같은 물품은 환자 전용으로 쓰며, 나올 때 보호구를 벗고 손위생을 한다. 음압 격리실과 N95 마스크는 공기주의, 수술용 마스크는 비말주의의 방법이다."},
{"id":"m77","subj":"간호관리","unit":"간호단위관리","q":"간호단위의 마약류 관리 방법으로 옳은 것은?","opts":["마약은 다른 의약품과 구분하여 이중 잠금장치가 된 금고에 보관한다.","근무 교대 때의 재고 확인은 생략하고 월말에 한 번 대조한다.","마약 금고의 열쇠는 금고 옆 서랍에 두어 누구나 쓸 수 있게 한다.","사용하고 남은 마약은 간호사가 혼자 폐기하고 기록은 생략한다."],"ans":0,"exp":"마약은 다른 의약품과 구분하여 이중으로 잠금장치가 된 금고에 보관하고, 열쇠는 책임자가 관리한다. 근무 교대 때마다 재고량과 기록을 대조하여 인수인계하며, 사용하고 남은 잔량은 임의로 버리지 않고 기관의 규정에 따라 확인자와 함께 처리하고 기록한다."},
{"id":"m79","subj":"간호관리","unit":"간호기록","q":"문제중심기록의 SOAP 형식 중 'A'에 해당하는 것은?","opts":["환자가 말한 주관적 자료","관찰과 측정으로 얻은 객관적 자료","자료를 근거로 내린 사정(판단)","문제 해결을 위한 계획"],"ans":2,"exp":"SOAP는 주관적 자료(Subjective), 객관적 자료(Objective), 사정(Assessment), 계획(Plan)의 순서로 적는다. A는 주관적·객관적 자료를 분석하여 내린 판단으로, 간호 진단이나 문제의 진술이 여기에 해당한다."},
{"id":"m80","subj":"간호관리","unit":"의사소통","q":"다음 보고 내용에 해당하는 SBAR의 단계는?\n\n\"환자는 3일 전에 위절제술을 받았고, 당뇨병 병력이 있어 현재 인슐린을 투여 중입니다.\"","opts":["Situation(상황)","Background(배경)","Assessment(사정)","Recommendation(권고)"],"ans":1,"exp":"Background(배경) 단계에서는 입원 사유, 수술 이력, 과거 병력, 현재 치료 등 상황을 이해하는 데 필요한 정보를 전달한다. Situation(상황)은 지금 일어나고 있는 문제를, Assessment(사정)는 보고자가 판단한 환자의 상태를, Recommendation(권고)은 필요하다고 생각하는 조치나 요청을 말하는 단계이다."},
{"id":"m81","subj":"간호관리","unit":"간호기록","q":"표준화된 간호 용어 체계 중 간호 중재를 분류한 것은?","opts":["NOC","NIC","NANDA-I","ICD"],"ans":1,"exp":"NIC(Nursing Interventions Classification)는 간호 중재 분류 체계이다. NANDA-I는 간호 진단을, NOC(Nursing Outcomes Classification)는 간호 결과를 분류한 것이고, ICD는 세계보건기구의 국제질병분류로 간호 용어 체계가 아니다."},
{"id":"m84","subj":"간호관리","unit":"의료법규","q":"「의료법」상 의사가 환자에게 설명하고 서면 동의를 받아야 하는 의료행위가 아닌 것은?","opts":["전신마취","근육 주사","수혈","수술"],"ans":1,"exp":"「의료법」은 사람의 생명이나 신체에 중대한 위해를 일으킬 우려가 있는 수술, 수혈, 전신마취를 할 때 환자(의사결정 능력이 없으면 법정대리인)에게 설명하고 서면으로 동의를 받도록 정하고 있다. 근육 주사는 이 조항에 명시된 행위가 아니다."},
{"id":"m85","subj":"간호관리","unit":"의료법규","q":"「의료법」상 의료인에 해당하지 않는 사람은?","opts":["간호사","조산사","간호조무사","한의사"],"ans":2,"exp":"「의료법」상 의료인은 보건복지부장관의 면허를 받은 의사, 치과의사, 한의사, 조산사, 간호사이다. 간호조무사는 보건복지부장관의 자격 인정을 받는 인력으로 의료인에 포함되지 않는다."},
{"id":"m87","subj":"간호관리","unit":"의료법규","q":"「간호법」상 간호사의 업무에 해당하는 것은?","opts":["질병에 대한 의학적 진단과 처방","처방전에 따른 의약품의 조제","진단서와 검안서의 작성 및 교부","간호조무사가 수행하는 업무 보조에 대한 지도"],"ans":3,"exp":"「간호법」은 간호사의 업무를 환자의 간호요구에 대한 관찰·자료수집·간호판단 및 요양을 위한 간호, 의사·치과의사·한의사의 지도하에 시행하는 진료의 보조, 간호 요구자에 대한 교육·상담 및 건강증진 활동의 기획과 수행, 간호조무사가 수행하는 업무 보조에 대한 지도로 정한다. 질병의 진단과 처방, 진단서·검안서의 작성과 교부는 의사·치과의사·한의사의 업무이고, 의약품의 조제는 원칙적으로 약사의 업무이다."},
{"id":"m88","subj":"간호관리","unit":"의료법규","q":"「간호법」에 대한 설명으로 옳은 것은?","opts":["2024년에 제정·공포되어 2025년 6월부터 시행되었다.","간호조무사에 관한 규정은 이 법에 포함되지 않는다.","이 법의 시행으로 간호사는 「의료법」상 의료인에서 제외되었다.","간호사 면허는 대한간호협회장이 발급한다."],"ans":0,"exp":"「간호법」은 2024년 9월에 공포되어 2025년 6월 21일부터 시행되었다. 간호사 면허는 보건복지부장관이 발급하고, 간호사는 여전히 「의료법」상 의료인이다. 이 법은 간호사, 전문간호사와 함께 간호조무사의 자격과 업무에 관한 사항도 규정한다."},
{"id":"m89","subj":"간호관리","unit":"의료법규","q":"「간호법」상 간호사가 실태와 취업 상황 등을 보건복지부장관에게 신고해야 하는 주기는?","opts":["1년마다","2년마다","3년마다","5년마다"],"ans":2,"exp":"간호사는 최초로 면허를 받은 뒤부터 3년마다 실태와 취업 상황 등을 보건복지부장관에게 신고해야 한다. 이 신고 제도는 「의료법」에 있던 것이 「간호법」으로 옮겨졌으며, 보수교육을 이수하지 않으면 신고가 반려될 수 있다."},
{"id":"m90","subj":"간호관리","unit":"간호윤리","q":"부족한 의료 자원을 공정한 기준에 따라 분배해야 한다는 생명윤리 원칙은?","opts":["정의의 원칙","선행의 원칙","악행금지의 원칙","자율성 존중의 원칙"],"ans":0,"exp":"정의의 원칙은 부족한 의료 자원과 부담을 공정한 기준에 따라 분배해야 한다는 원칙으로, 한정된 중환자실 병상을 의학적 필요에 따라 배정하는 일이 그 예이다. 선행의 원칙은 환자에게 이익이 되는 행위를 하라는 것, 자율성 존중의 원칙은 환자 스스로의 결정을 존중하라는 것, 악행금지의 원칙은 해를 끼치지 말라는 것이다."},
{"id":"m91","subj":"간호관리","unit":"간호윤리","q":"다음 설명에 해당하는 윤리적 개념은?\n\n환자에게 이익이 된다는 이유로 의료인이 환자의 뜻을 묻지 않거나 환자의 뜻에 반하여 결정을 내리는 것이다.","opts":["사전 동의","이중효과의 원칙","공리주의","선의의 간섭주의"],"ans":3,"exp":"선의의 간섭주의(온정적 간섭주의)는 환자의 이익을 위한다는 선행의 원칙을 앞세워 환자의 자율성을 제한하는 것이다. 이중효과의 원칙은 좋은 결과를 의도한 행위에 예견된 나쁜 결과가 따르더라도 일정 조건에서 허용된다는 것이고, 사전 동의는 충분한 설명을 듣고 환자가 자발적으로 하는 동의이다."},
{"id":"m92","subj":"간호관리","unit":"간호윤리","q":"다음 설명에 해당하는 윤리 이론은?\n\n○ 행위의 옳고 그름을 그 행위가 가져온 결과로 판단한다.\n○ 최대 다수에게 최대 행복을 가져오는 행위를 옳다고 본다.","opts":["의무론","덕 윤리","공리주의","돌봄 윤리"],"ans":2,"exp":"공리주의는 행위의 결과로 생기는 이익과 행복의 총합이 가장 큰 행위를 옳다고 보는 결과주의 이론이다. 의무론은 결과와 관계없이 행위 자체가 도덕 법칙과 의무에 맞는지를 기준으로 삼는다. 덕 윤리는 행위자의 품성을, 돌봄 윤리는 관계와 배려를 중심에 둔다."},
{"id":"m93","subj":"간호관리","unit":"마케팅","q":"다음 설명에 해당하는 서비스의 특성은?\n\n간호 서비스는 저장하거나 재고로 보관할 수 없어, 제공되지 않은 서비스는 그대로 사라진다.","opts":["이질성","무형성","비분리성","소멸성"],"ans":3,"exp":"소멸성은 서비스를 저장할 수 없다는 특성으로, 수요와 공급을 맞추기 위한 예약 제도나 인력의 탄력적 배치가 필요하다. 무형성은 형태가 없어 미리 보거나 만질 수 없다는 것, 비분리성은 생산과 소비가 동시에 일어난다는 것, 이질성은 제공자와 상황에 따라 질이 달라진다는 것이다."},
{"id":"m94","subj":"간호관리","unit":"마케팅","q":"서비스의 이질성에 대응하는 간호관리 전략으로 옳은 것은?","opts":["병원 시설과 유니폼 등 유형적 단서로 서비스를 가시화한다.","간호 실무 표준과 지침을 마련하여 서비스를 표준화한다.","예약 제도를 운영하여 수요와 공급을 조절한다.","서비스 가격을 낮추어 이용 수요를 늘린다."],"ans":1,"exp":"이질성(변동성)은 같은 서비스라도 제공하는 사람, 시간, 장소에 따라 질이 달라지는 특성이며, 실무 표준과 지침, 교육훈련으로 서비스를 표준화하여 대응한다. 예약 제도로 수요와 공급을 맞추는 것은 소멸성에, 유형적 단서를 제공하는 것은 무형성에 대응하는 전략이다."},
{"id":"m95","subj":"간호관리","unit":"마케팅","q":"간호 서비스 마케팅 믹스(4P) 중 유통(place) 전략에 해당하는 것은?","opts":["병원 소식지와 건강 강좌로 간호 서비스를 알린다.","가정간호와 야간·주말 진료로 서비스 이용 통로를 넓힌다.","새로운 전문 간호 서비스 프로그램을 개발한다.","간호 원가 분석을 근거로 간호 수가를 산정한다."],"ans":1,"exp":"유통 전략은 고객이 서비스를 쉽게 이용하도록 장소, 시간, 전달 경로의 접근성을 높이는 것으로 가정간호, 야간·주말 진료, 원격 상담 등이 해당한다. 새 서비스 개발은 제품 전략, 수가 산정은 가격 전략, 소식지와 건강 강좌는 촉진 전략이다."},
{"id":"m97","subj":"간호관리","unit":"간호전문직","q":"전문직의 특성으로 옳지 않은 것은?","opts":["자체 윤리강령과 전문직 단체가 있다.","업무 수행의 기준을 외부 기관의 통제에만 의존한다.","장기간의 체계적인 교육이 필요하다.","고유한 지식 체계에 근거하여 실무를 수행한다."],"ans":1,"exp":"전문직은 스스로 업무의 기준을 정하고 통제하는 자율성을 가진다. 그 밖에 고유한 지식 체계, 장기간의 교육, 윤리강령, 전문직 단체, 사회에 대한 봉사가 전문직의 특성이다. 외부 통제에만 의존하는 것은 자율성과 어긋난다."},
{"id":"m98","subj":"간호관리","unit":"간호역사","q":"나이팅게일(Nightingale)의 업적으로 옳은 것은?","opts":["성 토마스 병원에 간호학교를 세웠다.","국제적십자를 창설하였다.","국제간호협의회(ICN)를 창립하였다.","간호사 면허 시험 제도의 도입을 주도하였다."],"ans":0,"exp":"나이팅게일은 크림 전쟁에서의 간호 활동 뒤 1860년 성 토마스 병원에 나이팅게일 간호학교를 세웠다. 국제간호협의회는 펜윅이 주도하여 창립하였고, 국제적십자는 앙리 뒤낭이 창설하였다. 나이팅게일은 간호사 등록(면허) 제도에는 반대하였다."},
{"id":"m99","subj":"간호관리","unit":"간호역사","q":"1903년 우리나라 최초의 간호 교육 기관인 간호원 양성소가 설치된 곳은?","opts":["보구여관","광혜원","대한의원","세브란스 병원"],"ans":0,"exp":"1903년 선교 간호사 에드먼즈가 여성 전문 병원인 보구여관에 간호원 양성소를 세운 것이 우리나라 간호 교육의 시작이다. 세브란스 병원 간호원 양성소는 1906년 쉴즈가 세웠고, 대한의원은 1907년에 설립된 관립 의료 기관이며, 광혜원(제중원)은 1885년에 세워진 최초의 서양식 국립 병원이다."},
{"id":"m103","subj":"간호관리","unit":"갈등관리","q":"토마스와 킬만(Thomas & Kilmann)의 갈등 관리 유형 중 경쟁형이 적절한 상황은?","opts":["문제가 사소하여 시간을 들여 다룰 가치가 없을 때","응급 상황처럼 신속하고 단호한 결정이 필요할 때","문제 해결보다 상대와의 관계 유지가 더 중요할 때","양쪽의 관심사를 모두 살린 해결책이 꼭 필요할 때"],"ans":1,"exp":"경쟁형(강압)은 자기주장은 높고 협조는 낮은 방법으로, 응급 상황이나 인기는 없어도 반드시 해야 하는 조치를 빠르게 결정할 때 적절하다. 문제가 사소할 때는 회피형, 관계 유지가 더 중요할 때는 수용형, 양쪽의 관심사가 모두 중요할 때는 협력형이 알맞다."},
{"id":"m104","subj":"간호관리","unit":"갈등관리","q":"통합적 협상(integrative negotiation)에 대한 설명으로 옳은 것은?","opts":["한정된 자원을 나누므로 한쪽의 이익이 곧 다른 쪽의 손실이 된다.","정보를 감추고 처음 내세운 입장을 끝까지 지키는 것이 기본이다.","단기적인 거래에 알맞고 협상 뒤의 관계는 중요하게 보지 않는다.","양쪽의 이해를 함께 채우도록 이익의 전체 크기를 키우려 한다."],"ans":3,"exp":"통합적 협상은 정보를 나누고 서로의 관심사를 파악하여 양쪽 모두 이익을 얻는(win-win) 방안을 찾는 협상으로, 장기적 관계를 중시한다. 나머지는 고정된 몫을 두고 다투는 분배적 협상(win-lose)의 특징이다."},
{"id":"m106","subj":"간호관리","unit":"갈등관리","q":"갈등에 대한 상호작용주의적 관점으로 옳은 것은?","opts":["적정한 수준의 갈등은 조직의 변화와 성과에 도움이 된다.","갈등은 조직에 해로우므로 생기는 즉시 없애야 한다.","갈등은 관리자의 잘못으로 생기는 비정상적인 현상이다.","갈등은 자연스러운 현상이므로 받아들이기만 하면 된다."],"ans":0,"exp":"상호작용주의적 관점은 갈등이 너무 적어도 조직이 정체된다고 보고, 적정 수준의 갈등을 유지하고 때로는 조장해야 한다고 본다. 갈등을 해롭고 비정상적인 것으로 보아 제거하려는 것은 전통적 관점이고, 자연스러운 현상으로 수용하는 데 그치는 것은 행동과학적(인간관계론적) 관점이다."},
{"id":"m108","subj":"간호관리","unit":"간호전문직","q":"다음 설명에 해당하는 크레이머(Kramer)의 현실충격 단계는?\n\n모든 것이 새롭고 즐거워 보이던 시기가 지나고, 학교에서 배운 간호와 실제 임상이 다르다는 것을 느끼면서 분노와 좌절, 무력감을 경험한다.","opts":["밀월기","회복기","해결기","충격기"],"ans":3,"exp":"현실충격은 밀월기, 충격기, 회복기, 해결기의 순서로 진행된다. 충격기에는 학교에서 배운 가치와 임상 현실의 차이 때문에 분노와 좌절을 느낀다. 밀월기는 모든 것이 좋아 보이는 처음 시기이고, 회복기는 현실을 균형 있게 보기 시작하는 시기이며, 해결기는 갈등을 나름대로 해결하여 적응하는 시기이다."},
{"id":"m111","subj":"간호관리","unit":"조직변화","q":"레윈(Lewin)의 힘의 장 이론에 대한 설명으로 옳은 것은?","opts":["추진력이 저항력보다 커질 때 변화가 일어난다.","추진력과 저항력이 같을 때 변화가 일어난다.","저항력이 추진력보다 커질 때 변화가 일어난다.","추진력과 저항력이 모두 없을 때 변화가 일어난다."],"ans":0,"exp":"힘의 장 이론은 변화를 밀어 주는 추진력과 변화를 막는 저항력이 균형을 이루면 현재 상태가 유지된다고 본다. 변화를 일으키려면 추진력을 키우거나 저항력을 줄여 추진력이 더 커지게 해야 하며, 저항력을 줄이는 쪽이 더 효과적이라고 본다."},
{"id":"m113","subj":"간호관리","unit":"조직","q":"다음 설명에 해당하는 샤인(Schein)의 조직문화 수준은?\n\n병원의 로고와 건물 배치, 간호사의 유니폼, 신규 간호사 환영식 같은 의례처럼 겉으로 드러나 눈으로 볼 수 있는 수준이다.","opts":["표방하는 가치","인공물","기본 가정","공유 비전"],"ans":1,"exp":"샤인은 조직문화를 인공물, 표방하는 가치, 기본 가정의 세 수준으로 나누었다. 인공물은 상징, 복장, 의례처럼 눈에 보이는 수준이다. 표방하는 가치는 조직이 내세우는 신념과 행동 기준이고, 기본 가정은 구성원이 당연하게 여겨 의식하지 못하는 가장 깊은 수준이다. 공유 비전은 이 분류에 없다."},
{"id":"m115","subj":"간호관리","unit":"조직","q":"관리자의 통솔범위를 넓게 할 수 있는 경우는?","opts":["구성원의 능력과 경험이 부족할 때","부서가 여러 장소에 흩어져 있을 때","업무가 복잡하여 자주 상의해야 할 때","업무가 단순하고 표준화되어 있을 때"],"ans":3,"exp":"통솔범위는 한 관리자가 직접 지휘·감독하는 부하의 수이다. 업무가 단순하고 표준화되어 있거나, 구성원의 능력이 높거나, 지원 부서와 의사소통 수단이 잘 갖추어져 있으면 넓힐 수 있다. 구성원의 능력이 부족하거나 근무 장소가 흩어져 있거나 업무가 복잡하면 통솔범위를 좁혀야 한다."},
{"id":"m116","subj":"간호관리","unit":"조직","q":"라인－스태프 조직에서 스태프(참모)의 기능으로 옳은 것은?","opts":["전문 지식으로 라인 관리자에게 조언하고 지원한다.","조직 목표 달성에 직접 책임을 지고 명령을 내린다.","라인 관리자의 결정을 취소하고 대신 집행한다.","하위 직원에 대한 인사권과 지휘권을 행사한다."],"ans":0,"exp":"스태프는 전문 지식과 기술로 라인 관리자를 조언하고 지원하지만, 원칙적으로 명령하거나 집행할 권한은 없다. 목표 달성에 직접 책임을 지고 명령 계통에 따라 지휘하는 것은 라인의 기능이다."},
{"id":"m117","subj":"간호관리","unit":"조직","q":"다음 사례에 해당하는 조직 유형은?\n\nA 병원은 의료기관 인증 평가에 대비하여 여러 부서의 직원을 뽑아 이 일만 전담하는 임시 조직을 만들었고, 평가가 끝나자 해산하여 구성원을 원래 부서로 돌려보냈다.","opts":["매트릭스 조직","프로젝트 조직","라인 조직","위원회 조직"],"ans":1,"exp":"프로젝트 조직은 특정 과제를 수행하려고 여러 부서의 전문 인력을 모아 임시로 만들고, 과제가 끝나면 해산하는 조직이다. 매트릭스 조직은 구성원이 기능 부서에 소속된 채 프로젝트에도 참여하여 두 상사를 두는 조직이고, 위원회 조직은 본래 업무를 하면서 회의로 의견을 모으는 조직이다."},
{"id":"m118","subj":"간호관리","unit":"간호단위관리","q":"다음에서 설명하는 물품 공급 방식은?\n\n○ 간호단위에 품목별 기준 재고량을 정해 둔다.\n○ 정기적으로 재고를 확인하여 사용한 만큼만 채워 준다.","opts":["정수교환 방식","필요시 청구 방식","정수보충 방식","적시 공급(JIT) 방식"],"ans":2,"exp":"정수보충 방식은 기준 재고량에서 쓴 만큼만 채워 넣는 방식이다. 정수교환 방식은 사용 여부와 관계없이 물품을 채운 카트를 통째로 바꾸는 방식이고, 필요시 청구 방식은 병동이 필요할 때마다 청구서를 내는 방식이다. 적시 공급 방식은 병동에 재고를 거의 두지 않고 필요한 때에 필요한 양만 납품받는 방식이다."},
{"id":"m119","subj":"간호관리","unit":"간호단위관리","q":"멸균 물품의 보관 방법으로 옳은 것은?","opts":["새로 들어온 물품을 앞쪽에 두어 먼저 쓰게 한다.","포장이 젖은 물품은 잘 말려서 다시 넣어 둔다.","유효기간이 가까운 물품을 앞쪽에 두어 먼저 쓰게 한다.","넘어지지 않도록 바닥에 닿게 낮게 쌓아 둔다."],"ans":2,"exp":"멸균 물품은 먼저 들어온 것을 먼저 쓰는 선입선출 원칙에 따라, 유효기간이 가까운 것을 앞쪽에 둔다. 포장이 젖거나 찢어진 물품은 오염된 것으로 보아 쓰지 않고, 바닥과 벽, 천장에서 떨어진 깨끗하고 건조한 선반에 보관한다."},
{"id":"m121","subj":"간호관리","unit":"간호단위관리","q":"고농도 염화칼륨(KCl) 주사제의 관리 방법으로 옳은 것은?","opts":["쓰기 편하도록 일반 수액과 같은 칸에 함께 보관한다.","다른 약품과 분리하여 보관하고 경고 표시를 붙인다.","응급 시에는 희석하지 않고 정맥으로 빠르게 주입한다.","병동마다 넉넉히 비치하여 처방 즉시 쓸 수 있게 한다."],"ans":1,"exp":"고농도 전해질은 잘못 투여하면 치명적인 고위험 약물이므로 다른 약품과 분리하여 보관하고 ‘반드시 희석 후 사용’ 같은 경고 표시를 붙인다. 병동 비치는 꼭 필요한 곳으로 제한하며, 희석하지 않은 원액을 정맥으로 직접 주입해서는 안 된다."},
{"id":"m122","subj":"간호관리","unit":"간호단위관리","q":"주사용 마약을 처방 용량만큼 쓰고 남은 잔량의 처리 방법으로 옳은 것은?","opts":["임의로 버리지 않고 잔량을 기록하여 병원 지침대로 처리한다.","혼자 싱크대에 버리고 사용 기록에는 전량 사용으로 적는다.","다음 투여 때 쓰도록 주사기에 담아 마약장에 넣어 둔다.","같은 약이 처방된 옆 환자에게 남은 약을 이어서 쓴다."],"ans":0,"exp":"쓰고 남은 마약은 간호사가 혼자 임의로 버리거나 다른 용도로 쓰지 않는다. 실제 사용량과 잔량을 사실대로 기록하고, 병원 지침에 따라 약제부에 반납하거나 정해진 입회자와 함께 폐기하여 근거를 남긴다. 남은 약을 보관했다가 다시 쓰거나 다른 환자에게 써서는 안 된다."},
{"id":"m123","subj":"간호관리","unit":"간호단위관리","q":"낙상 고위험 환자의 병실 환경 관리로 옳은 것은?","opts":["밤에는 숙면을 위해 병실 조명을 모두 끈다.","호출기는 환자 손이 닿지 않는 벽에 걸어 둔다.","침상 난간은 답답하지 않도록 늘 내려 둔다.","침대 높이를 가장 낮게 하고 바퀴를 고정한다."],"ans":3,"exp":"낙상을 예방하려면 침대를 가장 낮게 하고 바퀴를 고정하며, 침상 난간을 올리고 호출기와 자주 쓰는 물건을 손 닿는 곳에 둔다. 밤에도 발밑을 볼 수 있도록 야간 조명을 켜 두고 바닥의 물기와 장애물을 없앤다."},
{"id":"m124","subj":"간호관리","unit":"간호전달체계","q":"다음 사례에 해당하는 간호전달체계는?\n\nA 병동은 경력 간호사 한 명이 리더가 되어 간호사와 간호조무사로 이루어진 집단을 이끌며, 날마다 집담회를 열어 환자 15명의 간호 계획을 조정한다.","opts":["기능적 분담방법","팀 간호방법","일차간호방법","사례방법"],"ans":1,"exp":"팀 간호방법은 팀 리더가 전문 간호사와 비전문 인력으로 이루어진 팀을 이끌어 일정한 수의 환자를 함께 간호하는 방법으로, 팀 집담회와 간호 계획이 핵심이다. 기능적 분담방법은 업무별로 담당자를 나누는 것, 일차간호방법은 한 간호사가 입원부터 퇴원까지 책임지는 것, 사례방법은 한 간호사가 근무 시간 동안 배정된 환자의 모든 간호를 하는 것이다."},
{"id":"m129","subj":"간호관리","unit":"리더십","q":"다음 설명에 해당하는 관리 개념은?\n\n관리자가 구성원에게 권한과 정보, 자원을 나누어 주어 구성원이 스스로 결정하고 책임질 수 있는 능력과 자신감을 키우는 것이다.","opts":["집권화","임파워먼트","직무 단순화","목표관리"],"ans":1,"exp":"임파워먼트는 구성원에게 권한과 정보, 자원을 나누어 주어 스스로 결정하고 책임질 수 있는 능력과 자신감을 키우는 것이다. 집권화는 결정 권한이 상위 관리자에게 모이는 것이고, 직무 단순화는 과업을 잘게 나누어 단순하게 만드는 것이며, 목표관리는 상급자와 하급자가 목표를 함께 정하고 평가하는 관리 기법이다."},
{"id":"m134","subj":"간호관리","unit":"기획","q":"사이먼(Simon)의 만족 모형에 대한 설명으로 옳은 것은?","opts":["모든 대안을 빠짐없이 검토하여 최적의 대안을 택한다.","기존 정책을 조금씩 고쳐 가는 방식으로 대안을 택한다.","제한된 합리성 안에서 만족할 만한 수준의 대안을 택한다.","직관이나 영감 같은 초합리적 요소로 대안을 택한다."],"ans":2,"exp":"만족 모형은 사람이 정보와 시간, 능력의 한계 때문에 완전히 합리적일 수 없다고 보고, 최적의 대안이 아니라 만족할 만한 대안을 택한다고 설명한다. 모든 대안을 검토해 최적을 찾는 것은 합리 모형, 기존 정책을 조금씩 고치는 것은 점증 모형, 초합리적 요소를 함께 고려하는 것은 최적 모형이다."},
{"id":"m137","subj":"간호관리","unit":"재무관리","q":"다음 자료에서 손익분기점에 이르는 A 검진센터의 연간 검진 건수는?\n\n○ 연간 고정비: 6,000만 원\n○ 검진 1건당 수가: 5만 원\n○ 검진 1건당 변동비: 2만 원","opts":["1,200건","2,000건","3,000건","4,000건"],"ans":1,"exp":"손익분기점 판매량은 고정비를 단위당 공헌이익(단위당 가격 － 단위당 변동비)으로 나누어 구한다. 6,000만 원 ÷ (5만 원 － 2만 원) = 2,000건이다. 2,000건을 넘으면 이익이 나고, 그에 못 미치면 손실이 난다."},
{"id":"m139","subj":"간호관리","unit":"재무관리","q":"병동의 간호 원가를 계산할 때 직접비에 해당하는 것은?","opts":["병동 간호사의 인건비","원무과 직원의 인건비","병원 건물의 화재 보험료","병원 전체의 수도 요금"],"ans":0,"exp":"직접비는 특정 부서나 서비스에 직접 쓰여 그 대상에 바로 귀속시킬 수 있는 원가로, 병동 간호사의 인건비와 병동에서 쓴 간호 재료비가 해당한다. 원무과 인건비, 건물 보험료, 병원 전체의 수도 요금은 여러 부서가 함께 쓰는 비용이어서 기준에 따라 나누어 배부하는 간접비이다."},
{"id":"m144","subj":"간호관리","unit":"인적자원관리","q":"임상 경력 사다리(clinical ladder) 제도의 목적으로 옳은 것은?","opts":["근무 연수만을 기준으로 모든 간호사의 급여를 똑같이 올린다.","숙련된 간호사를 빨리 관리직으로 승진시켜 임상을 떠나게 한다.","신규 간호사의 수습 기간을 줄여 교육에 드는 비용을 아낀다.","실무 능력을 단계별로 인정하고 보상하여 숙련 간호사를 임상에 남게 한다."],"ans":3,"exp":"임상 경력 사다리는 간호사의 임상 실무 능력을 여러 단계로 나누어 평가하고, 단계에 따라 인정과 보상을 달리하는 제도이다. 관리직으로 옮기지 않아도 임상에서 성장하고 보상받을 수 있게 하여 숙련 간호사의 이직을 줄이고 간호의 질을 높이려는 것이다."},
{"id":"m145","subj":"간호관리","unit":"인적자원관리","q":"다음 사례에서 점진적 훈육에 따라 수간호사가 다음으로 할 조치는?\n\nA 간호사는 근무 규칙을 위반하여 수간호사에게 구두 견책을 받았으나 같은 위반을 되풀이하였다.","opts":["정직","서면 견책","해고","감봉"],"ans":1,"exp":"점진적 훈육은 가벼운 조치에서 무거운 조치로 나아가며, 구두 견책 다음 단계는 서면 견책이다. 서면 견책은 위반 내용과 고치지 않을 때 따를 결과를 문서로 알리고 기록으로 남기는 것이다. 그래도 고쳐지지 않으면 정직, 해고의 순서로 넘어간다. 교재에 따라 구두 견책 앞에 비공식적인 면담(상담)을 첫 단계로 두기도 한다."},
{"id":"m150","subj":"간호관리","unit":"간호기록","q":"전자의무기록을 사용하는 간호사의 정보 보호 행동으로 옳은 것은?","opts":["바쁠 때는 동료의 아이디로 접속하여 기록한다.","담당하지 않는 지인의 기록을 걱정되어 열어 본다.","비밀번호를 종이에 적어 모니터 옆에 붙여 둔다.","자리를 비울 때는 화면을 잠그거나 로그아웃한다."],"ans":3,"exp":"전자의무기록은 자신의 아이디로만 접속하고, 자리를 비울 때는 화면을 잠그거나 로그아웃하여 다른 사람이 보거나 쓰지 못하게 한다. 아이디와 비밀번호를 남과 함께 쓰거나 드러내 두어서는 안 되며, 업무와 관계없는 환자의 기록을 열람하는 것은 개인정보 침해이다."},
{"id":"m151","subj":"간호관리","unit":"질 관리","q":"관리의 통제 과정을 순서대로 바르게 나열한 것은?","opts":["성과 측정 → 표준 설정 → 수정 활동 → 표준과 성과의 비교","표준 설정 → 수정 활동 → 성과 측정 → 표준과 성과의 비교","성과 측정 → 표준과 성과의 비교 → 표준 설정 → 수정 활동","표준 설정 → 성과 측정 → 표준과 성과의 비교 → 수정 활동"],"ans":3,"exp":"통제는 먼저 성과를 판단할 표준을 정하고, 실제 성과를 측정한 뒤, 표준과 성과를 비교하여 차이를 확인하고, 차이가 있으면 원인을 찾아 수정 활동을 하는 순서로 이루어진다. 표준이 있어야 성과를 측정하고 비교할 수 있으므로 표준 설정이 가장 먼저이다."},
{"id":"m153","subj":"간호관리","unit":"질 관리","q":"다음 설명에 해당하는 질 관리 도구는?\n\n시간에 따른 측정값을 선으로 잇고 중심선과 관리 상한선·하한선을 함께 그려, 과정의 변동이 허용 범위 안에 있는지 판단한다.","opts":["관리도","런 차트","히스토그램","흐름도"],"ans":0,"exp":"관리도는 런 차트에 평균을 나타내는 중심선과 관리 상한선, 하한선을 더한 것으로, 측정값이 한계선을 벗어나면 과정에 특별한 원인의 변이가 있다고 본다. 히스토그램은 자료의 분포를 막대로 나타낸 것이고, 흐름도는 업무 과정의 단계를 순서대로 그린 것이다."},
{"id":"m154","subj":"간호관리","unit":"질 관리","q":"PDCA 순환의 Act(개선) 단계에서 하는 활동은?","opts":["문제의 원인을 분석하여 개선 목표와 방법을 정한다.","마련한 개선안을 작은 규모로 먼저 시범 적용해 본다.","시범 적용한 결과를 측정하여 목표와 견주어 본다.","효과가 확인된 개선안을 표준으로 삼아 전체로 넓힌다."],"ans":3,"exp":"Act(개선) 단계에서는 평가 결과에 따라 효과가 있는 개선안을 표준화하여 확대 적용하고, 효과가 없으면 계획을 고쳐 다음 순환으로 넘어간다. 원인을 분석하고 목표를 정하는 것은 Plan(계획), 시범 적용은 Do(실행), 결과를 측정하여 비교하는 것은 Check(검증) 단계이다."},
{"id":"m157","subj":"간호관리","unit":"환자안전","q":"이미 발생한 적신호 사건의 원인을 시스템과 과정에서 찾는 후향적 분석 방법은?","opts":["근본원인분석(RCA)","오류유형과 영향분석(FMEA)","벤치마킹","SWOT 분석"],"ans":0,"exp":"근본원인분석은 이미 일어난 사건을 대상으로 \"왜 일어났는가\"를 거듭 물어 근본 원인을 개인이 아닌 시스템과 과정에서 찾고 재발을 막으려는 후향적 분석이다. 오류유형과 영향분석은 사고가 나기 전에 생길 수 있는 오류를 예측하는 전향적 분석이고, 벤치마킹은 우수한 기관과 비교하여 개선점을 찾는 방법이다."},
{"id":"m158","subj":"간호관리","unit":"환자안전","q":"다음 사례에 해당하는 환자안전사건의 유형은?\n\nA 간호사는 다른 환자의 약을 B 환자에게 주려다가, 투약 직전 환자 확인 과정에서 잘못을 발견하여 투약하지 않았다.","opts":["위해사건(adverse event)","적신호 사건(sentinel event)","근접오류(near miss)","의료과오(malpractice)"],"ans":2,"exp":"근접오류는 오류가 있었지만 환자에게 도달하기 전에 발견되어 해가 생기지 않은 사건이다. 위해사건은 의료 제공 과정에서 환자에게 해가 생긴 사건이고, 적신호 사건은 그 가운데 사망이나 심각한 손상을 가져온 사건이다. 의료과오는 주의의무를 다하지 않아 환자에게 손해를 입힌 것을 뜻하는 법적 개념이다."},
{"id":"m160","subj":"간호관리","unit":"환자안전","q":"리즌(Reason)의 인적 오류 분류에서 다음 사례에 해당하는 것은?\n\nA 간호사는 투약 전에 환자 팔찌를 확인해야 한다는 규정을 알고 있었지만, 바쁘다는 이유로 일부러 확인을 생략하고 투약하였다.","opts":["실수(slip)","망각(lapse)","착오(mistake)","위반(violation)"],"ans":3,"exp":"위반은 규정이나 절차를 알면서도 의도적으로 따르지 않는 것이다. 실수는 계획은 옳았으나 주의가 흐트러져 행동을 잘못한 것, 망각은 기억이 나지 않아 해야 할 행동을 빠뜨린 것, 착오는 지식이나 판단이 잘못되어 계획 자체를 잘못 세운 것으로, 세 가지 모두 의도하지 않은 오류이다."},
{"id":"m161","subj":"간호관리","unit":"환자안전","q":"환자안전 문화 중 공정 문화(just culture)에 대한 설명으로 옳은 것은?","opts":["오류의 원인과 관계없이 개인에게는 어떤 책임도 묻지 않는다.","시스템에서 비롯된 오류는 비난하지 않되 무모한 행위에는 책임을 묻는다.","오류를 낸 개인을 찾아내 엄하게 처벌하는 것을 가장 중시한다.","환자에게 해가 생긴 오류만 골라 관리자를 거쳐 보고하게 한다."],"ans":1,"exp":"공정 문화는 사람이 저지를 수 있는 오류와 시스템의 결함에서 비롯된 오류는 비난하지 않고 학습의 기회로 삼되, 위험을 알면서 저지른 무모한 행위에는 책임을 묻는 문화이다. 무조건 처벌하는 비난 문화와도, 어떤 책임도 묻지 않는 문화와도 구별된다."},
{"id":"m162","subj":"간호관리","unit":"환자안전","q":"하인리히(Heinrich)의 법칙이 환자안전 관리에 주는 의미로 옳은 것은?","opts":["큰 사고에 앞선 작은 사고와 징후를 관리해야 한다.","큰 사고는 아무런 징후 없이 우연하게 일어난다.","사고의 대부분은 몇 안 되는 원인에서 비롯된다.","사고는 여러 방어벽의 구멍이 겹칠 때 일어난다."],"ans":0,"exp":"하인리히의 법칙은 중대한 사고 1건 뒤에는 가벼운 사고 29건과 다칠 뻔한 일 300건이 있다는 것으로, 근접오류와 작은 사고를 보고하고 관리하면 큰 사고를 막을 수 있음을 보여 준다. 소수의 원인이 대부분의 결과를 낳는다는 것은 파레토 법칙이고, 방어벽의 구멍이 겹쳐 사고가 난다는 것은 스위스 치즈 모형이다."},
{"id":"m163","subj":"간호관리","unit":"환자안전","q":"환자안전법령상 환자안전위원회를 설치·운영해야 하는 의료기관은?","opts":["병상이 없는 의원","병상이 50개인 병원","병상이 150개인 요양병원","병상이 250개인 병원"],"ans":3,"exp":"환자안전법령은 병상 수가 200병상 이상인 병원급 의료기관(종합병원은 100병상 이상)에 환자안전위원회를 설치하고 환자안전 전담인력을 두도록 한다. 의원과 200병상 미만의 병원·요양병원은 의무 대상이 아니다."},
{"id":"m164","subj":"간호관리","unit":"환자안전","q":"환자안전법령상 환자안전사고의 자율 보고에 대한 설명으로 옳은 것은?","opts":["보건의료인만 보고할 수 있고 환자와 보호자는 할 수 없다.","보고를 이유로 보고자에게 불리한 조치를 할 수 없다.","환자에게 해가 없었던 근접오류는 보고할 수 없다.","보고 내용은 보고자의 이름과 함께 일반에 공개된다."],"ans":1,"exp":"「환자안전법」은 자율 보고를 한 사람을 보호하여, 보고 내용의 비밀을 지키고 보고를 이유로 해고나 전보 같은 불리한 조치를 하지 못하게 한다. 보건의료인뿐 아니라 환자와 보호자도 보고할 수 있고, 환자에게 해가 없었던 사고와 발생할 우려가 있었던 사고도 보고할 수 있다."},
{"id":"m167","subj":"간호관리","unit":"감염관리","q":"표준주의(standard precautions)에 대한 설명으로 옳은 것은?","opts":["감염병이 확진된 환자를 간호할 때에만 보호구를 쓰도록 한 지침이다.","장갑을 끼고 처치하였다면 장갑을 벗은 뒤의 손위생은 생략할 수 있다.","접촉주의나 비말주의를 적용하는 환자에게는 표준주의를 적용하지 않는다.","진단명과 관계없이 모든 환자의 혈액과 체액을 감염원으로 보고 다룬다."],"ans":3,"exp":"표준주의는 감염 여부와 관계없이 모든 환자의 혈액, 체액, 분비물, 배설물, 손상된 피부와 점막에 감염원이 있을 수 있다고 보고 적용하는 기본 지침이다. 장갑을 벗은 뒤에도 손위생을 해야 하며, 접촉·비말·공기주의는 표준주의에 더하여 적용하는 전파 경로별 주의이다."},
{"id":"m169","subj":"간호관리","unit":"감염관리","q":"C. difficile 감염으로 설사하는 환자를 간호한 뒤의 손위생 방법으로 옳은 것은?","opts":["물과 비누로 손을 씻는다.","알코올 손소독제로만 문지른다.","장갑을 꼈으면 손위생을 생략한다.","마른 종이 수건으로 닦아 낸다."],"ans":0,"exp":"C. difficile은 아포를 만드는 균이고 알코올은 아포를 죽이지 못하므로, 물과 비누로 손을 씻어 아포를 물리적으로 씻어 내야 한다. 장갑을 꼈더라도 벗은 뒤에는 반드시 손위생을 하며, 이 환자에게는 장갑과 가운을 착용하는 접촉주의를 적용한다."},
{"id":"m170","subj":"간호관리","unit":"감염관리","q":"의료법령상 감염관리위원회와 감염관리실을 설치해야 하는 병원급 의료기관의 병상 기준은?","opts":["30개 이상","100개 이상","200개 이상","300개 이상"],"ans":1,"exp":"「의료법」과 같은 법 시행규칙은 100개 이상의 병상을 갖춘 병원급 의료기관의 장이 감염관리위원회와 감염관리실을 설치·운영하고 감염관리 업무를 맡는 전담 인력을 두도록 정하고 있다. 설치 대상은 여러 차례 확대되어 왔으며, 150병상 이상이던 기준이 100병상 이상으로 낮아졌다."},
{"id":"m171","subj":"간호관리","unit":"법적 의무","q":"다음 설명에 해당하는 법적 책임은?\n\n병원에 고용된 간호사가 업무 중 과실로 환자에게 손해를 입혔을 때, 간호사를 고용한 병원 개설자도 「민법」에 따라 환자에게 손해배상 책임을 진다.","opts":["형사 책임","사용자 책임","행정 책임","제조물 책임"],"ans":1,"exp":"사용자 책임은 다른 사람을 사용하여 일을 시키는 사람이, 피용자가 그 업무를 하다가 제3자에게 입힌 손해를 배상해야 하는 「민법」상 책임이다. 형사 책임은 업무상 과실치사상죄 등으로 처벌받는 것, 행정 책임은 면허 취소나 자격정지 같은 처분을 받는 것, 제조물 책임은 결함 있는 제품의 제조업자가 지는 책임이다."},
{"id":"m172","subj":"간호관리","unit":"법적 의무","q":"다음 사례에서 A 간호사가 위반한 주의의무는?\n\nA 간호사는 낙상 고위험 환자가 혼자 화장실에 가다가 넘어질 수 있다는 것을 알고 있었지만, 침상 난간을 올리지 않고 주의 사항도 알려 주지 않아 환자가 낙상하였다.","opts":["결과 예견 의무","비밀유지 의무","결과 회피 의무","진료 요청에 응할 의무"],"ans":2,"exp":"주의의무는 위험을 미리 내다볼 결과 예견 의무와, 예견한 위험이 일어나지 않도록 조치할 결과 회피 의무로 이루어진다. A 간호사는 낙상 위험을 예견하고도 이를 막는 조치를 하지 않았으므로 결과 회피 의무를 위반하였다."},
{"id":"m174","subj":"간호관리","unit":"법적 의무","q":"간호사의 비밀유지 의무에 대한 설명으로 옳은 것은?","opts":["법령에 따른 감염병 신고는 비밀 누설에 해당하지 않는다.","환자가 퇴원하면 비밀유지 의무도 그때 함께 끝난다.","환자의 직장 동료가 물으면 진단명 정도는 알려 준다.","교육 목적이면 환자의 실명을 넣어 사례를 발표한다."],"ans":0,"exp":"간호사는 업무 중 알게 된 환자의 정보를 누설해서는 안 되며, 이 의무는 환자가 퇴원한 뒤에도 이어진다. 다만 감염병 신고처럼 법령이 정한 경우나 환자 본인이 동의한 경우는 예외이다. 환자의 동의 없이 다른 사람에게 진단명을 알리거나, 환자를 알아볼 수 있는 정보를 넣어 사례를 발표해서는 안 된다."},
{"id":"m176","subj":"간호관리","unit":"질 관리","q":"의료법령상 의료기관 인증기준에 포함되는 사항이 아닌 것은?","opts":["환자의 권리와 안전","의료기관의 수익성과 시장 점유율","의료기관의 의료서비스 질 향상 활동","의료서비스의 제공과정 및 성과"],"ans":1,"exp":"「의료법」은 의료기관 인증기준에 환자의 권리와 안전, 의료기관의 의료서비스 질 향상 활동, 의료서비스의 제공과정 및 성과, 의료기관의 조직·인력관리 및 운영, 환자 만족도를 포함하도록 정한다. 인증은 환자안전과 의료의 질을 평가하는 제도이므로 수익성이나 시장 점유율은 기준이 아니다."},
{"id":"m177","subj":"간호관리","unit":"간호윤리","q":"치료를 거부하는 환자의 뜻과 치료가 이롭다는 의료진의 판단이 맞설 때 충돌하는 윤리 원칙은?","opts":["자율성 존중의 원칙과 선행의 원칙","자율성 존중의 원칙과 정의의 원칙","선행의 원칙과 정의의 원칙","악행금지의 원칙과 정의의 원칙"],"ans":0,"exp":"스스로 결정할 능력이 있는 환자의 치료 거부를 존중해야 한다는 것은 자율성 존중의 원칙이고, 환자에게 이로운 치료를 해야 한다는 것은 선행의 원칙이다. 두 원칙이 서로 다른 행동을 요구하여 윤리적 딜레마가 생긴다. 정의의 원칙은 자원과 부담을 공정하게 나누는 문제에 적용된다."},
{"id":"m178","subj":"간호관리","unit":"간호윤리","q":"환자에게 진실을 말하고 속이지 않아야 한다는 윤리 규칙은?","opts":["신의","정직","비밀유지","정의"],"ans":1,"exp":"정직(veracity)은 진실을 말하고 상대를 속이지 않아야 한다는 규칙이다. 신의(fidelity, 성실)는 환자와 한 약속을 지켜야 한다는 규칙이고, 비밀유지(confidentiality)는 알게 된 환자의 정보를 남에게 알리지 않아야 한다는 규칙이다. 정의는 공정한 분배에 관한 원칙이다."},
{"id":"m179","subj":"간호관리","unit":"간호윤리","q":"결과와 관계없이 행위 자체가 도덕적 의무에 맞는지를 옳고 그름의 기준으로 삼는 윤리 이론은?","opts":["공리주의","윤리적 상대주의","윤리적 이기주의","의무론"],"ans":3,"exp":"의무론은 행위의 옳고 그름이 결과가 아니라 행위 자체가 도덕적 의무와 규칙에 맞는지에 달려 있다고 본다. 그래서 환자를 안심시키는 결과를 가져오더라도 거짓말은 그 자체로 옳지 않다고 판단한다. 공리주의는 결과가 최대 다수에게 최대의 행복을 주는지로 판단한다."},
{"id":"m180","subj":"간호관리","unit":"간호윤리","q":"다음 설명에 해당하는 윤리적 원리는?\n\n말기 환자의 통증을 줄이려고 투여한 모르핀이 호흡 억제라는 나쁜 결과를 함께 가져올 수 있더라도, 통증 완화라는 좋은 결과만을 의도하였다면 그 행위는 허용될 수 있다.","opts":["이중효과의 원리","선의의 간섭주의","분배적 정의의 원리","대리 판단의 원리"],"ans":0,"exp":"이중효과의 원리는 한 행위가 좋은 결과와 나쁜 결과를 함께 낳을 때, 행위 자체가 나쁘지 않고 좋은 결과만을 의도하였으며 나쁜 결과가 좋은 결과의 수단이 아니고 좋은 결과가 더 클 경우 그 행위가 허용된다고 본다. 선의의 간섭주의는 환자의 이익을 이유로 환자의 뜻과 관계없이 결정하는 것이다."},
{"id":"m181","subj":"간호관리","unit":"간호윤리","q":"한국간호사 윤리강령에서 밝힌 간호사의 기본 책무에 해당하지 않는 것은?","opts":["건강 증진","질병 예방","의학적 진단","고통 경감"],"ans":2,"exp":"한국간호사 윤리강령은 간호의 근본 이념을 인간 생명의 존엄성과 기본권을 존중하고 옹호하는 것으로 밝히고, 간호사의 책무를 대상자의 건강 증진, 질병 예방, 건강 회복, 고통 경감을 돕는 것으로 제시한다. 의학적 진단은 의사의 업무이다."},
{"id":"m182","subj":"간호관리","unit":"간호윤리","q":"다음 상황에서 A 간호사가 가장 먼저 해야 할 행동은?\n\n야간 근무 중 A 간호사는 동료 간호사에게서 술 냄새가 나고, 투약을 준비하며 비틀거리는 것을 보았다.","opts":["동료의 사정을 생각하여 모른 척하고 자기 일을 한다.","동료가 환자 간호를 하지 않게 하고 관리자에게 알린다.","근무가 끝난 뒤에 동료를 따로 불러 조용히 충고한다.","친한 동료들에게 먼저 알리고 어떻게 할지 상의한다."],"ans":1,"exp":"간호사의 가장 중요한 책임은 대상자의 안전을 지키는 것이다. 동료가 안전하게 간호할 수 없는 상태라면 먼저 환자에게서 떨어지게 하고 관리자에게 보고하여 적절한 조치가 이루어지게 해야 한다. 모른 척하거나 나중으로 미루면 환자가 위험에 놓인다."},
{"id":"m184","subj":"간호관리","unit":"간호역사","q":"종교개혁 뒤 수도원 병원이 문을 닫아 간호의 질이 크게 떨어진 시기는?","opts":["간호의 암흑기","초기 기독교 시대","십자군 시대","근대 간호 시대"],"ans":0,"exp":"종교개혁으로 가톨릭 수도원이 폐쇄되면서 간호를 맡던 수도자들이 흩어지고, 교육받지 못한 사람들이 생계를 위해 간호하게 되어 간호가 크게 쇠퇴한 16세기부터 19세기 중반까지를 간호의 암흑기라 한다. 초기 기독교 시대에는 여집사들이 봉사로 간호하였고, 십자군 시대에는 기사간호단이 활동하였다."},
{"id":"m187","subj":"간호관리","unit":"마케팅","q":"다음 사례에 해당하는 서비스 마케팅 믹스(7P)의 요소는?\n\nA 병원은 병동의 안내 표지를 알아보기 쉽게 바꾸고 병실 인테리어와 간호사 유니폼을 새로 단장하여, 고객이 간호 서비스의 질을 짐작할 수 있게 하였다.","opts":["과정","물리적 증거","사람","촉진"],"ans":1,"exp":"물리적 증거(physical evidence)는 시설, 인테리어, 표지, 유니폼처럼 무형의 서비스를 눈에 보이게 해 주는 단서이다. 과정(process)은 서비스가 전달되는 절차와 흐름, 사람(people)은 서비스를 제공하는 직원과 고객, 촉진(promotion)은 광고와 홍보로 서비스를 알리는 활동이다."},
{"id":"m190","subj":"간호관리","unit":"마케팅","q":"직원을 고객으로 보고 교육과 보상으로 직원 만족을 높여 서비스 질을 높이려는 마케팅은?","opts":["내부 마케팅","외부 마케팅","상호작용 마케팅","사회 마케팅"],"ans":0,"exp":"내부 마케팅은 조직이 직원을 내부 고객으로 보고 교육하고 동기를 부여하여 서비스의 질을 높이려는 활동이다. 외부 마케팅은 조직이 고객에게 서비스를 알리고 약속하는 활동이고, 상호작용 마케팅은 직원이 고객과 만나는 순간에 서비스를 제대로 전달하는 활동이다. 사회 마케팅은 금연처럼 사회에 이로운 행동 변화를 이끌려는 것이다."},
{"id":"m191","subj":"간호관리","unit":"리더십","q":"다음 사례에 해당하는 변혁적 리더십의 구성요소는?\n\nA 수간호사는 간호사들에게 \"늘 해 오던 방식이 정말 최선일까요?\"라고 물으며, 인수인계 방식을 새로운 관점에서 다시 생각해 보도록 격려한다.","opts":["개별적 배려","영감적 동기부여","이상적 영향력","지적 자극"],"ans":3,"exp":"지적 자극은 구성원이 기존의 가정과 방식에 의문을 품고 문제를 새로운 관점에서 보도록 북돋우는 것이다. 개별적 배려는 구성원 한 사람 한 사람의 요구에 관심을 두고 성장을 돕는 것, 영감적 동기부여는 비전을 제시하여 의욕을 불러일으키는 것, 이상적 영향력(카리스마)은 리더가 존경과 신뢰를 받는 본보기가 되는 것이다."},
{"id":"m192","subj":"간호관리","unit":"리더십","q":"다음 설명에 해당하는 리더십은?\n\n○ 리더가 구성원 위에 서기보다 봉사자의 역할을 앞세운다.\n○ 구성원의 말을 경청하고 공감하며 구성원의 성장과 공동체 형성을 돕는다.","opts":["서번트 리더십","거래적 리더십","카리스마적 리더십","셀프 리더십"],"ans":0,"exp":"서번트 리더십은 리더가 구성원을 섬기는 자세로 경청, 공감, 치유, 구성원의 성장 지원, 공동체 형성에 힘쓰는 리더십이다. 거래적 리더십은 성과와 보상을 주고받는 것, 카리스마적 리더십은 리더의 비범한 매력과 비전으로 이끄는 것, 셀프 리더십은 자기 자신을 스스로 이끄는 것이다."},
{"id":"m194","subj":"간호관리","unit":"리더십","q":"슈퍼 리더십(super leadership)에 대한 설명으로 옳은 것은?","opts":["리더가 모든 결정을 내리고 구성원은 지시를 따른다.","성과에 따른 보상과 처벌을 정확히 주고받게 한다.","구성원이 스스로를 이끄는 셀프 리더가 되도록 돕는다.","리더의 비범한 능력에 구성원이 의지하게 만든다."],"ans":2,"exp":"슈퍼 리더십은 리더가 셀프 리더십의 본보기가 되고 구성원에게 자율과 책임을 주어, 구성원 각자가 자신을 스스로 이끄는 셀프 리더가 되게 하는 리더십이다. 리더가 혼자 결정하는 것은 전제형, 보상과 처벌을 주고받는 것은 거래적 리더십, 리더의 비범함에 의지하게 하는 것은 카리스마적 리더십의 특징이다."},
{"id":"m196","subj":"간호관리","unit":"리더십","q":"하우스(House)의 경로－목표이론에서 다음 사례에 해당하는 리더십 유형은?\n\nA 수간호사는 성취 욕구가 강한 간호사들에게 ‘욕창 발생 0건’이라는 도전적인 목표를 제시하고, 그들이 해낼 수 있다는 신뢰를 보인다.","opts":["지시적 리더십","지지적 리더십","참여적 리더십","성취지향적 리더십"],"ans":3,"exp":"성취지향적 리더십은 도전적인 목표를 세우고 구성원이 높은 수준의 성과를 낼 것이라는 기대와 신뢰를 보이는 유형이다. 지시적 리더십은 할 일과 방법을 구체적으로 알려 주는 것, 지지적 리더십은 구성원의 욕구와 복지에 관심을 보이는 것, 참여적 리더십은 결정에 구성원의 의견을 반영하는 것이다."},
{"id":"m197","subj":"간호관리","unit":"동기부여","q":"맥클리랜드(McClelland)의 성취동기이론에서 성취 욕구가 높은 사람의 특성으로 옳은 것은?","opts":["다른 사람을 통제하고 영향력을 미치는 일을 좋아한다.","적당히 어려운 목표를 택하고 결과에 대한 피드백을 원한다.","다른 사람과 친밀한 관계를 맺는 일을 가장 중시한다.","실패를 피하려고 누구나 할 수 있는 쉬운 목표만 택한다."],"ans":1,"exp":"성취 욕구가 높은 사람은 너무 쉽지도 불가능하지도 않은 적당히 어려운 목표를 택하고, 결과에 스스로 책임지려 하며, 자신이 얼마나 잘했는지 즉각적인 피드백을 원한다. 다른 사람을 통제하고 영향을 미치려는 것은 권력 욕구, 친밀한 관계를 중시하는 것은 친화 욕구이다."},
{"id":"m199","subj":"간호관리","unit":"동기부여","q":"다음 사례에서 A 간호사가 낮게 지각한 브룸(Vroom)의 기대이론의 요소는?\n\nA 간호사는 \"아무리 노력해도 승급 심사가 요구하는 성과에는 이를 수 없다\"고 생각하여 준비를 포기하였다.","opts":["기대","수단성","유의성","공정성"],"ans":0,"exp":"기대(expectancy)는 노력하면 일정한 성과를 달성할 수 있다는 주관적 믿음으로, A 간호사는 이것을 낮게 보았다. 수단성은 성과를 내면 보상이 따를 것이라는 믿음이고, 유의성은 그 보상이 자신에게 얼마나 가치 있는지에 대한 선호이다. 공정성은 아담스의 공정성이론의 개념이다."},
{"id":"m200","subj":"간호관리","unit":"관리이론","q":"다음 사례에 해당하는 민츠버그(Mintzberg)의 관리자 역할은?\n\nA 수간호사는 병동의 한정된 인력과 예산, 물품을 어느 업무에 얼마나 쓸지 정하고 그에 따라 근무표를 편성하였다.","opts":["자원분배자","대표자","대변인","섭외자"],"ans":0,"exp":"자원분배자는 인력, 예산, 물품, 시간 같은 자원을 누구에게 얼마나 줄지 결정하는 의사결정 역할이다. 대표자는 조직을 상징하여 의례적 업무를 하는 대인관계 역할, 섭외자(연결자)는 조직 밖의 사람들과 관계망을 유지하는 대인관계 역할, 대변인은 조직의 정보를 외부에 알리는 정보 역할이다."},
{"id":"m201","subj":"간호관리","unit":"관리이론","q":"간호관리과정 중 지휘 기능에 해당하지 않는 활동은?","opts":["구성원의 동기를 부여한다.","구성원과 의사소통한다.","부서 간 갈등을 조정한다.","간호단위의 내년도 예산을 편성한다."],"ans":3,"exp":"지휘는 구성원이 목표를 향해 움직이도록 이끄는 기능으로 리더십, 동기부여, 의사소통, 갈등관리가 여기에 속한다. 예산을 편성하는 일은 목표와 그 달성 방법을 미리 정하는 기획 기능이다."},
{"id":"m202","subj":"간호관리","unit":"관리이론","q":"길리스(Gillies)의 간호관리 체계모형에서 투입 요소만을 모두 고르면?\n\nㄱ. 간호 인력\nㄴ. 시설과 장비\nㄷ. 환자 만족도\nㄹ. 재원 일수","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":0,"exp":"투입은 관리 과정에 들어가는 자원으로 인력, 시설과 장비, 물자, 자금, 정보, 환자의 간호 요구 등이 해당한다. 환자 만족도와 재원 일수는 관리 과정을 거쳐 나온 결과이므로 산출 요소이다."},
{"id":"m203","subj":"간호관리","unit":"관리이론","q":"간호관리과정 중 통제 기능에 대한 설명으로 옳지 않은 것은?","opts":["수행 결과를 평가할 표준을 설정한다.","실제 성과를 측정하여 표준과 비교한다.","표준과 성과에 차이가 있으면 교정 활동을 한다.","관리과정의 첫 단계로 다른 기능의 방향을 정한다."],"ans":3,"exp":"통제는 표준을 설정하고, 성과를 측정하여 표준과 비교한 뒤, 차이가 있으면 교정하는 관리과정의 마지막 기능이다. 관리과정의 첫 단계로서 목표와 방향을 정하는 것은 기획이며, 통제의 결과는 다음 기획에 반영된다."},
{"id":"m204","subj":"간호관리","unit":"관리이론","q":"간호관리과정의 단계와 활동을 옳게 짝 지은 것은?","opts":["기획 － 간호 인력을 모집·선발하고 배치한다.","조직 － 간호 업무의 표준을 정하고 성과를 측정한다.","인사 － 간호부의 철학과 목표를 설정한다.","지휘 － 구성원을 동기부여하고 갈등을 관리한다."],"ans":3,"exp":"관리과정은 기획, 조직, 인사, 지휘, 통제의 다섯 단계이다. 지휘는 리더십, 동기부여, 의사소통, 갈등관리로 구성원을 이끄는 단계이다. 인력의 모집·선발과 배치는 인사, 표준 설정과 성과 측정은 통제, 철학과 목표 설정은 기획에 해당한다."},
{"id":"m205","subj":"간호관리","unit":"관리이론","q":"다음 설명에 해당하는 카츠(Katz)의 관리 기술은?\n\n○ 전문 분야의 지식, 방법, 장비를 사용하여 업무를 수행하는 능력이다.\n○ 일선관리자에게 상대적으로 많이 요구된다.","opts":["개념적 기술","인간적 기술","실무적 기술","의사소통 기술"],"ans":2,"exp":"실무적 기술(전문적 기술)은 특정 분야의 지식과 방법, 기구를 다루는 능력으로, 구성원의 업무를 직접 지도하는 일선관리자에게 많이 요구된다. 개념적 기술은 조직 전체를 보는 능력으로 최고관리자에게, 인간적 기술은 사람들과 함께 일하는 능력으로 모든 계층에 필요하다. 카츠의 분류는 이 세 가지이다."},
{"id":"m206","subj":"간호관리","unit":"관리이론","q":"카츠(Katz)의 관리 기술에 대한 설명으로 옳지 않은 것은?","opts":["인간적 기술은 모든 계층의 관리자에게 중요하다.","실무적 기술은 하위 관리계층일수록 더 많이 요구된다.","개념적 기술은 조직 전체를 보고 부분 간의 관계를 파악하는 능력이다.","인간적 기술은 업무에 필요한 장비와 기법을 다루는 능력이다."],"ans":3,"exp":"업무에 필요한 지식, 장비, 기법을 다루는 능력은 실무적 기술이다. 인간적 기술은 구성원과 원만하게 의사소통하고 협력하게 하는 능력으로 모든 관리계층에 비슷하게 중요하다. 실무적 기술은 아래 계층일수록, 개념적 기술은 위 계층일수록 더 많이 요구된다."},
{"id":"m207","subj":"간호관리","unit":"관리이론","q":"페이욜(Fayol)의 행정관리론에 대한 설명으로 옳은 것은?","opts":["관리 활동을 계획, 조직, 지휘, 조정, 통제로 구분하였다.","시간－동작 연구로 작업의 표준 시간을 정하였다.","합법적 권한에 근거한 관료제를 이상적 조직으로 보았다.","조명 실험으로 인간관계의 중요성을 밝혔다."],"ans":0,"exp":"페이욜은 관리 활동을 계획, 조직, 지휘, 조정, 통제의 다섯 요소로 나누고 분업, 명령 통일 등 14가지 관리 원칙을 제시하였다. 시간－동작 연구는 테일러의 과학적 관리론, 관료제는 베버, 조명 실험(호손 실험)은 메이요의 인간관계론에 해당한다."},
{"id":"m208","subj":"간호관리","unit":"관리이론","q":"민츠버그(Mintzberg)의 관리자 역할 중 의사결정 역할만을 모두 고르면?\n\nㄱ. 대변인\nㄴ. 기업가\nㄷ. 지도자\nㄹ. 협상자","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":2,"exp":"민츠버그는 관리자의 역할을 대인관계 역할(대표자, 지도자, 섭외자), 정보 역할(감시자, 전달자, 대변인), 의사결정 역할(기업가, 고충 처리자, 자원분배자, 협상자)로 나누었다. 기업가와 협상자는 의사결정 역할이고, 대변인은 정보 역할, 지도자는 대인관계 역할이다."},
{"id":"m209","subj":"간호관리","unit":"관리이론","q":"관리이론 중 상황이론에 대한 설명으로 옳은 것은?","opts":["모든 조직에 적용되는 유일한 최선의 관리 방법을 찾는다.","조직이 처한 환경에 따라 효과적인 관리 방법이 다르다고 본다.","구성원의 감정과 비공식 집단이 생산성을 결정한다고 본다.","과업을 세분하고 표준화하여 능률을 높이려 한다."],"ans":1,"exp":"상황이론은 어느 조직에나 맞는 유일한 최선의 방법은 없으며, 환경, 기술, 규모 같은 상황 조건에 따라 알맞은 조직 구조와 관리 방법이 달라진다고 본다. 유일한 최선의 방법과 과업의 표준화는 과학적 관리론, 감정과 비공식 집단의 강조는 인간관계론의 내용이다."},
{"id":"m210","subj":"간호관리","unit":"기획","q":"기획의 원칙에 대한 설명으로 옳지 않은 것은?","opts":["간결성의 원칙 － 계획은 쉽고 명료하게 표현한다.","계층화의 원칙 － 큰 계획에서 구체적인 하위 계획이 파생되게 한다.","포괄성의 원칙 － 필요한 인력, 물자, 예산을 빠짐없이 포함한다.","탄력성의 원칙 － 한번 수립한 계획은 바꾸지 않고 끝까지 유지한다."],"ans":3,"exp":"탄력성의 원칙은 상황이 변하면 계획을 고칠 수 있도록 융통성을 두어야 한다는 것이므로, 계획을 바꾸지 않고 유지한다는 설명은 맞지 않는다. 간결성은 명료한 표현, 계층화는 상위 계획에서 하위 계획이 차례로 나오는 것, 포괄성은 필요한 요소를 빠짐없이 담는 것을 뜻한다."},
{"id":"m211","subj":"간호관리","unit":"기획","q":"개인 의사결정과 비교한 집단 의사결정의 단점만을 모두 고르면?\n\nㄱ. 문제를 여러 관점에서 분석하기 어렵다.\nㄴ. 소수의 구성원이 토의를 지배할 수 있다.\nㄷ. 동조 압력으로 집단사고가 생길 수 있다.\nㄹ. 결정된 내용을 구성원이 받아들이기 어렵다.","opts":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"ans":2,"exp":"집단 의사결정에서는 목소리가 큰 소수가 토의를 지배하거나, 의견 일치를 바라는 동조 압력 때문에 반대 의견이 억제되는 집단사고가 생길 수 있다. 시간과 비용이 많이 들고 책임 소재가 흐려지는 것도 단점이다. 반면 여러 사람의 지식으로 문제를 다각도로 분석할 수 있고, 구성원이 결정 과정에 참여하므로 결정을 잘 받아들이는 것은 집단 의사결정의 장점이다."},
{"id":"m212","subj":"간호관리","unit":"기획","q":"운영적 기획의 특성만을 모두 고르면?\n\nㄱ. 일선관리자가 수립한다.\nㄴ. 조직의 사명과 비전을 설정한다.\nㄷ. 단기적이고 구체적인 실행 계획이다.\nㄹ. 조직 전체를 대상으로 하는 장기 계획이다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":1,"exp":"운영적 기획은 일선관리자가 간호단위 수준에서 세우는 단기의 구체적 실행 계획으로, 주간·월간 업무 계획이나 근무표 작성이 해당한다. 조직의 사명과 비전을 정하고 조직 전체를 대상으로 장기 방향을 잡는 것은 최고관리자의 전략적 기획이다."},
{"id":"m213","subj":"간호관리","unit":"기획","q":"브레인스토밍의 진행 원칙으로 옳지 않은 것은?","opts":["다른 사람의 의견을 비판하지 않는다.","자유분방한 의견을 환영한다.","의견의 양보다 질을 중요하게 여긴다.","다른 사람의 의견에 덧붙여 새 의견을 낸다."],"ans":2,"exp":"브레인스토밍은 비판 금지, 자유분방한 발상 환영, 질보다 양, 다른 의견과의 결합과 개선이라는 네 원칙에 따라 진행한다. 되도록 많은 의견을 내는 것이 목적이므로 양보다 질을 중요하게 여긴다는 설명은 맞지 않는다. 의견에 대한 평가는 의견을 모두 낸 뒤로 미룬다."},
{"id":"m214","subj":"간호관리","unit":"재무관리","q":"손익계산서에 나타나는 항목만을 모두 고르면?\n\nㄱ. 의료수익\nㄴ. 인건비\nㄷ. 유동부채\nㄹ. 당기순이익","opts":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"ans":2,"exp":"손익계산서는 일정 기간의 수익과 비용, 그 차이인 순이익을 보여 주므로 의료수익, 인건비 같은 비용, 당기순이익이 나타난다. 유동부채는 일정 시점의 자산, 부채, 자본을 보여 주는 재무상태표의 항목이다."},
{"id":"m215","subj":"간호관리","unit":"예산","q":"점증적 예산제도에 대한 설명으로 옳지 않은 것은?","opts":["전년도 예산을 기준으로 일정 비율을 더하거나 뺀다.","예산 편성 방법이 간단하고 시간이 적게 든다.","모든 사업의 타당성을 원점에서 다시 검토한다.","사업의 우선순위를 고려하지 않아 낭비가 생길 수 있다."],"ans":2,"exp":"점증적 예산제도는 전년도 예산을 기준으로 일정 비율을 가감하는 방식이어서 편성이 간단하고 빠르지만, 기존 사업의 타당성과 우선순위를 따지지 않아 비효율이 이어질 수 있다. 모든 사업을 원점에서 다시 검토하는 것은 영기준 예산제도이다."},
{"id":"m216","subj":"간호관리","unit":"예산","q":"운영예산에 해당하는 항목만을 모두 고르면?\n\nㄱ. 진료 재료 구입비\nㄴ. 병동 증축 공사비\nㄷ. 의료 장비 수리·유지비\nㄹ. 전기·수도 요금","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"ans":3,"exp":"운영예산은 한 회계 연도 동안 조직을 일상적으로 운영하는 데 드는 비용으로, 소모품과 진료 재료 구입비, 장비의 수리·유지비, 전기·수도 같은 공공요금 등이 포함된다. 병동 증축 공사비는 오래 쓰는 고정 자산에 대한 지출이므로 자본지출예산에 해당한다."},
{"id":"m217","subj":"간호관리","unit":"재무관리","q":"의료기관이 단기 채무를 갚을 능력이 있는지를 평가하는 재무비율은?","opts":["유동비율","부채비율","총자산회전율","의료수익 순이익률"],"ans":0,"exp":"유동비율은 유동자산을 유동부채로 나눈 값으로, 1년 안에 갚아야 할 빚을 갚을 능력(유동성)을 보여 준다. 부채비율은 자기자본에 대한 부채의 크기로 재무 구조의 안정성을, 총자산회전율은 자산을 얼마나 활발히 쓰는지(활동성)를, 의료수익 순이익률은 수익성을 나타낸다."},
{"id":"m218","subj":"간호관리","unit":"조직","q":"비공식 조직에 대한 설명으로 옳지 않은 것은?","opts":["구성원의 친밀감을 바탕으로 자연 발생적으로 형성된다.","구성원에게 소속감과 심리적 안정감을 준다.","조직도와 직제 규정에 구조와 직위가 명시된다.","공식 경로를 보완하는 의사소통 통로가 된다."],"ans":2,"exp":"비공식 조직은 구성원 사이의 친분과 감정을 바탕으로 저절로 생기며 조직도에 나타나지 않는다. 소속감과 안정감을 주고 공식 의사소통을 보완하는 기능을 한다. 조직도와 직제 규정에 구조와 직위가 명시되는 것은 공식 조직의 특성이다."},
{"id":"m219","subj":"간호관리","unit":"조직","q":"분권화된 조직의 장점만을 모두 고르면?\n\nㄱ. 상황 변화에 신속하게 대응할 수 있다.\nㄴ. 조직 전체의 통일성을 유지하기 쉽다.\nㄷ. 부서 간 업무 중복을 줄일 수 있다.\nㄹ. 하위 관리자의 능력을 개발할 수 있다.","opts":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"ans":1,"exp":"분권화는 의사결정 권한을 하위 계층에 나누어 주는 것으로, 현장에서 바로 결정하므로 대응이 빠르고 하위 관리자가 결정 경험을 쌓아 능력이 개발된다. 조직 전체의 통일성 유지와 업무 중복의 감소는 권한이 위에 모인 집권화의 장점이다."},
{"id":"m220","subj":"간호관리","unit":"인적자원관리","q":"(가), (나)에 해당하는 직무분석의 결과물을 옳게 짝 지은 것은?\n\n(가) － 직무의 목적, 과업, 책임 등 직무 자체의 내용을 적은 문서\n(나) － 직무 수행에 필요한 자격, 지식, 기술 등 인적 요건을 적은 문서","opts":["(가) 직무기술서, (나) 직무명세서","(가) 직무명세서, (나) 직무기술서","(가) 직무기술서, (나) 직무평가서","(가) 직무평가서, (나) 직무명세서"],"ans":0,"exp":"직무기술서는 직무의 목적, 과업, 책임, 근무 조건 등 직무 자체의 내용을 적고, 직무명세서는 그 직무를 수행하는 사람에게 요구되는 자격, 지식, 기술 등 인적 요건을 적는다. 직무평가는 직무 간의 상대적 가치를 정해 임금 결정에 활용하는 절차로, 직무분석의 결과물이 아니라 그 결과를 이용하는 다음 단계이다."},
{"id":"m221","subj":"간호관리","unit":"인적자원관리","q":"내부 모집과 비교한 외부 모집의 장점만을 모두 고르면?\n\nㄱ. 채용된 사람의 조직 적응 기간이 짧다.\nㄴ. 새로운 관점과 아이디어가 조직에 들어온다.\nㄷ. 기존 구성원의 승진 기회가 늘어 사기가 높아진다.\nㄹ. 모집 범위가 넓어 유능한 인재를 확보할 수 있다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":2,"exp":"외부 모집은 모집 범위가 넓어 유능한 인재를 얻을 수 있고 새로운 관점과 정보가 들어와 조직에 활력을 준다. 그러나 모집 비용이 많이 들고 적응 기간이 길며 기존 구성원의 사기가 떨어질 수 있다. 짧은 적응 기간과 승진 기회에 따른 사기 향상은 내부 모집의 장점이다."},
{"id":"m222","subj":"간호관리","unit":"인적자원관리","q":"선발 면접 방법에 대한 설명으로 옳은 것은?","opts":["정형적 면접은 미리 정한 질문을 모든 지원자에게 똑같이 묻는다.","비정형적 면접은 질문 목록과 순서를 엄격하게 지켜 진행한다.","패널 면접은 면접자 한 명이 여러 지원자를 한꺼번에 면접한다.","스트레스 면접은 지원자가 편안하도록 우호적인 분위기를 만든다."],"ans":0,"exp":"정형적(구조적) 면접은 직무명세서를 바탕으로 미리 준비한 질문 목록에 따라 진행하므로 지원자 간 비교가 쉽다. 비정형적 면접은 질문 목록 없이 자유롭게 진행한다. 패널 면접은 여러 면접자가 지원자 한 명을 면접하는 방법이고, 스트레스 면접은 일부러 압박하는 상황을 만들어 감정 조절과 인내력을 보는 방법이다."},
{"id":"m223","subj":"간호관리","unit":"인적자원관리","q":"다음 설명에 해당하는 인력 배치의 원칙은?\n\n개인과 조직 전체의 조화를 고려하여, 조직의 상하좌우 모든 구성원에게 배치의 기회가 평등하게 돌아가도록 한다.","opts":["균형주의","능력주의","적재적소주의","인재육성주의"],"ans":0,"exp":"균형주의는 개인과 조직 전체의 조화를 생각하여 모든 구성원에게 평등하게 적재적소의 기회가 돌아가게 하는 원칙이다. 적재적소주의는 개인의 능력과 성격에 가장 알맞은 직위에 배치하는 것, 능력주의는 능력을 발휘할 영역을 주고 그 성과를 바르게 평가하여 대우하는 것, 인재육성주의는 직무를 통해 구성원을 성장시키는 것이다."},
{"id":"m224","subj":"간호관리","unit":"인적자원관리","q":"임금체계에 대한 설명으로 옳지 않은 것은?","opts":["연공급은 근속 연수에 따라 임금을 정하여 생활 안정에 도움이 된다.","직무급은 같은 직무에 같은 임금을 지급하는 원칙에 따른다.","직능급은 직무를 수행하는 능력에 따라 임금을 정한다.","성과급은 성과와 관계없이 일정한 임금을 고정적으로 지급한다."],"ans":3,"exp":"성과급은 구성원이 달성한 성과에 따라 임금을 달리 주는 변동급이므로, 성과와 관계없이 고정적으로 지급한다는 설명은 맞지 않는다. 연공급은 근속 연수·연령·학력에 따라, 직무급은 직무의 상대적 가치에 따라, 직능급은 직무 수행 능력에 따라 임금을 정한다."},
{"id":"m225","subj":"간호관리","unit":"인적자원관리","q":"직무분석 방법에 대한 설명으로 옳지 않은 것은?","opts":["관찰법 － 직무 수행자가 일하는 모습을 직접 보고 기록한다.","면접법 － 직무 수행자를 만나 직무 내용을 묻고 듣는다.","질문지법 － 한 사람씩 오래 관찰하므로 많은 인원에게 쓰기 어렵다.","중요사건법 － 직무 성과에 큰 영향을 준 행동 사례를 모아 분석한다."],"ans":2,"exp":"질문지법은 표준화된 질문지를 나누어 주고 직무 수행자가 직접 적게 하는 방법으로, 짧은 시간에 많은 사람에게서 정보를 얻을 수 있다. 한 사람씩 오래 지켜보아 시간이 많이 드는 것은 관찰법의 단점이다. 면접법은 직접 만나 묻는 방법이고, 중요사건법은 성과에 결정적인 영향을 준 행동 사례를 모아 분석하는 방법이다."},
{"id":"m226","subj":"간호관리","unit":"인적자원관리","q":"인적자원관리 과정 중 개발관리에 해당하는 활동만을 모두 고르면?\n\nㄱ. 모집과 선발\nㄴ. 교육훈련\nㄷ. 경력개발\nㄹ. 임금관리","opts":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"ans":2,"exp":"개발관리는 확보한 인력의 능력을 키우는 활동으로 교육훈련과 경력개발이 대표적이다. 모집과 선발은 필요한 인력을 조직에 들이는 확보관리이고, 임금관리는 구성원의 공헌에 대가를 주는 보상관리이다."},
{"id":"m227","subj":"간호관리","unit":"인사고과","q":"직무수행평가 방법 중 중요사건 기술법에 대한 설명으로 옳은 것은?","opts":["피평가자들을 서로 비교하여 우수한 사람부터 순위를 매긴다.","성과에 영향을 준 효과적·비효과적 행동을 기록해 두었다가 평가한다.","평가 요소마다 단계별 척도를 두고 해당하는 곳에 표시한다.","행동 목록에서 피평가자에게 해당하는 항목을 골라 표시한다."],"ans":1,"exp":"중요사건 기술법은 평가 기간 동안 직무 성과에 큰 영향을 준 효과적인 행동과 비효과적인 행동을 그때그때 기록해 두었다가 평가에 쓰는 방법이다. 순위를 매기는 것은 서열법, 요소별 척도에 표시하는 것은 도표식 평정척도법, 행동 목록에서 해당 항목을 고르는 것은 체크리스트법이다."},
{"id":"m228","subj":"간호관리","unit":"인사고과","q":"직무수행평가의 오류에 대한 설명으로 옳지 않은 것은?","opts":["관대화 경향 － 피평가자를 실제 능력이나 성과보다 높게 평가한다.","논리적 오류 － 서로 관련 있어 보이는 평가 요소에 비슷한 점수를 준다.","대비 오류 － 다른 피평가자나 평가자 자신과 견주어 평가한다.","근접 오류 － 피평가자가 속한 집단에 대한 고정관념으로 평가한다."],"ans":3,"exp":"피평가자가 속한 집단에 대한 고정관념으로 평가하는 것은 상동적 오류이다. 근접 오류는 평가표에서 가까이 놓인 요소에 비슷한 점수를 주거나, 평가 시점에 가까운 최근의 실적에 치우쳐 평가하는 오류(시간적 오류)를 가리킨다. 관대화 경향, 논리적 오류, 대비 오류에 대한 설명은 모두 옳다."},
{"id":"m229","subj":"간호관리","unit":"인사고과","q":"다음 설명에 해당하는 직무수행평가 방법은?\n\n○ 직무 수행에서 나타나는 구체적인 행동 사례를 척도의 단계별 기준으로 제시한다.\n○ 중요사건 기술법과 평정척도법을 결합한 방법이다.","opts":["서열법","체크리스트법","목표관리법","행동기준 평정척도법"],"ans":3,"exp":"행동기준 평정척도법(BARS)은 직무에서 실제로 관찰되는 중요한 행동 사례를 척도의 각 단계에 기준으로 붙여 평가하는 방법으로, 중요사건 기술법과 평정척도법의 장점을 합친 것이다. 서열법은 피평가자의 순위를 매기는 방법, 체크리스트법은 행동 목록에서 해당 항목을 고르는 방법, 목표관리법은 함께 정한 목표의 달성 정도로 평가하는 방법이다."},
{"id":"m230","subj":"간호관리","unit":"인사고과","q":"다면평가(360도 평가)에 대한 설명으로 옳은 것은?","opts":["직속 상급자 한 사람이 단독으로 평가한다.","상급자, 동료, 하급자, 고객 등 여러 평가자가 참여한다.","등급별 인원 비율을 미리 정해 놓고 그에 맞추어 평가한다.","평가자가 한 명이어서 시간과 비용이 적게 든다."],"ans":1,"exp":"다면평가는 상급자뿐 아니라 동료, 하급자, 고객 등 여러 방향의 평가자가 참여하여 평가의 객관성과 공정성을 높이려는 방법이다. 평가자가 많아 시간과 비용은 더 든다. 등급별 인원 비율을 미리 정하는 것은 강제배분법이다."},
{"id":"m231","subj":"간호관리","unit":"인사고과","q":"직무수행평가 방법 중 상대평가 방법만을 모두 고르면?\n\nㄱ. 서열법\nㄴ. 강제배분법\nㄷ. 체크리스트법\nㄹ. 도표식 평정척도법","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":0,"exp":"상대평가는 피평가자들을 서로 비교하여 평가하는 방법으로 서열법, 쌍대비교법, 강제배분법이 해당한다. 체크리스트법과 도표식 평정척도법은 미리 정한 기준에 비추어 한 사람씩 평가하는 절대평가 방법이다."},
{"id":"m232","subj":"간호관리","unit":"인사고과","q":"직무수행평가의 목적에 해당하지 않는 것은?","opts":["승진, 이동 등 인사 결정의 자료를 얻는다.","구성원의 교육훈련 요구를 파악한다.","직무의 상대적 가치를 정하여 직무 등급을 매긴다.","구성원에게 피드백을 주어 능력 개발을 돕는다."],"ans":2,"exp":"직무수행평가(인사고과)는 사람이 직무를 얼마나 잘 수행했는지를 평가하여 승진·이동·보상의 근거로 삼고, 교육훈련 요구를 파악하며, 피드백으로 능력 개발을 돕는다. 직무의 상대적 가치를 정해 등급을 매기는 것은 사람이 아니라 직무를 평가하는 직무평가의 목적이다."},
{"id":"m233","subj":"간호관리","unit":"간호전달체계","q":"기능적 분담방법에 대한 설명으로 옳지 않은 것은?","opts":["투약, 처치 등 업무 종류별로 담당 간호사를 정한다.","적은 인력으로 많은 환자를 간호할 수 있다.","간호가 단편적이어서 책임 소재가 불분명해질 수 있다.","환자의 요구를 통합한 전인 간호를 제공하기 쉽다."],"ans":3,"exp":"기능적 분담방법은 투약, 활력징후 측정처럼 업무별로 담당자를 정하므로 적은 인력으로 많은 환자를 간호할 수 있어 효율적이다. 그러나 환자가 여러 간호사에게서 조각난 간호를 받게 되어 전인 간호가 어렵고 책임 소재가 흐려지는 것이 단점이다."},
{"id":"m234","subj":"간호관리","unit":"마케팅","q":"STP 전략에 대한 설명으로 옳지 않은 것은?","opts":["시장 세분화는 전체 시장을 요구가 비슷한 고객 집단으로 나누는 것이다.","표적시장 선정은 세분화한 시장 가운데 집중할 시장을 고르는 것이다.","포지셔닝은 모든 고객에게 한 가지 서비스를 똑같이 제공하는 것이다.","시장 세분화, 표적시장 선정, 포지셔닝의 순서로 진행한다."],"ans":2,"exp":"포지셔닝은 표적 고객이 우리 서비스를 경쟁 서비스와 다르게 인식하도록 고객의 마음속에 차별적인 위치를 심는 일이다. 모든 고객에게 한 가지 서비스를 똑같이 제공하는 것은 시장을 나누지 않는 방식이어서 STP 전략과 맞지 않는다. STP는 시장 세분화, 표적시장 선정, 포지셔닝의 순서로 진행한다."},
{"id":"m235","subj":"간호관리","unit":"마케팅","q":"마케팅 믹스(4P) 중 촉진 전략에 해당하는 활동만을 모두 고르면?\n\nㄱ. 병원 소식지에 가정간호 서비스를 소개한다.\nㄴ. 야간과 주말에도 진료 시간을 운영한다.\nㄷ. 지역 주민을 대상으로 건강 강좌를 연다.\nㄹ. 원가 분석을 근거로 간호 수가를 조정한다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":1,"exp":"촉진 전략은 광고, 홍보, 건강 강좌, 인적 접촉으로 서비스를 고객에게 알리고 이용을 이끄는 활동이므로 소식지 소개와 건강 강좌가 해당한다. 야간·주말 진료는 이용 시간과 통로를 넓히는 유통 전략이고, 수가 조정은 가격 전략이다."},
{"id":"m236","subj":"간호관리","unit":"간호기록","q":"간호기록 작성 방법으로 옳지 않은 것은?","opts":["간호를 수행한 뒤 바로 기록한다.","관찰한 사실을 구체적이고 객관적으로 적는다.","잘못 적은 내용은 수정액으로 지우고 다시 쓴다.","기록 끝에 서명하여 기록한 사람을 분명히 한다."],"ans":2,"exp":"잘못 적은 내용을 수정액으로 지우거나 덧써서 알아볼 수 없게 하면 안 된다. 원래 내용을 알아볼 수 있게 두고 기관의 규정에 따라 수정한 사실과 수정한 사람을 남긴다. 간호기록은 수행한 직후에, 관찰한 사실을 구체적이고 객관적으로 적고 기록자를 밝혀야 한다."},
{"id":"m237","subj":"간호관리","unit":"간호기록","q":"초점기록(focus charting)의 DAR 형식에 포함되는 항목만을 모두 고르면?\n\nㄱ. 자료\nㄴ. 활동\nㄷ. 반응\nㄹ. 계획","opts":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"ans":2,"exp":"초점기록은 환자의 관심사나 문제를 초점으로 잡고 자료(Data), 간호 활동(Action), 환자 반응(Response)의 DAR 형식으로 적는다. 계획(Plan)은 문제중심기록의 SOAP 형식에서 쓰는 항목이다."},
