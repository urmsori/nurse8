{"id":"k273","subj":"국어","unit":"국어학 지문","q":"윗글에서 추론한 내용으로 적절하지 않은 것은?\n\n우리말에서 음절의 끝에 올 수 있는 자음은 ‘ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ’의 일곱뿐이다. 받침에 그 밖의 자음이 적혀 있으면 발음할 때 이 일곱 가운데 하나로 바뀐다. ‘ㅋ, ㄲ’은 [ㄱ]으로, ‘ㅅ, ㅆ, ㅈ, ㅊ, ㅌ’은 [ㄷ]으로, ‘ㅍ’은 [ㅂ]으로 소리 난다. 그래서 ‘부엌’은 [부억], ‘옷’은 [옫], ‘숲’은 [숩]으로 발음한다. 바뀐 뒤의 소리를 대표음이라고 한다.\n그런데 받침 뒤에 모음으로 시작하는 말이 이어지면 사정이 달라진다. 이때에는 뒤에 오는 말이 어떤 말인지를 ㉠ __보아야__ 한다. 뒤에 오는 말이 조사나 어미, 접미사처럼 실질적인 뜻이 없이 문법적인 구실만 하는 말이면, 받침은 대표음으로 바뀌지 않고 제 소리 그대로 뒤 음절의 첫소리로 옮겨 간다. ‘옷이’는 [오시], ‘숲을’은 [수플], ‘깎아’는 [까까]로 발음하는 것이 그 예이다.\n반면 뒤에 오는 말이 실질적인 뜻을 지닌 말이면, 받침은 먼저 대표음으로 바뀐 다음 뒤 음절의 첫소리로 옮겨 간다. ‘옷 안’은 [오단], ‘숲 위’는 [수뷔]가 된다. 두 말이 합쳐져 한 단어가 된 경우에도 마찬가지여서 ‘겉옷’은 [거돋]으로, 접두사 ‘헛-’이 붙은 ‘헛웃음’은 [허두슴]으로 발음한다. ‘헛웃음’의 마지막 음절이 [슴]인 것은 ‘-음’이 접미사여서 ‘웃’의 받침이 제 소리대로 옮겨 갔기 때문이다.\n이 원리를 알면 글자는 비슷해도 발음이 다른 까닭을 설명할 수 있다. ‘꽃이’와 ‘꽃 위’에서 ‘꽃’의 받침은 똑같이 ‘ㅊ’이지만, 앞의 것은 [꼬치]로, 뒤의 것은 [꼬뒤]로 소리 난다.","opts":["‘밭을’은 [바틀]로 발음한다.","‘웃어른’은 [우더른]으로 발음한다.","‘잎 아래’는 [이파래]로 발음한다.","‘부엌 안’은 [부어간]으로 발음한다."],"ans":2,"exp":"'아래'는 실질적인 뜻을 지닌 말이므로 '잎'의 받침 'ㅍ'은 먼저 대표음 [ㅂ]으로 바뀐 다음 옮겨 가 [이바래]로 발음한다. [이파래]는 받침이 제 소리대로 옮겨 간 것이어서 적절하지 않다. '밭을'은 조사 '을'이 이어지므로 [바틀]이고, '웃어른'과 '부엌 안'은 뒤에 실질적인 뜻을 지닌 말이 오므로 대표음으로 바뀐 뒤 옮겨 가 [우더른], [부어간]이 된다."},
{"id":"k274","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n우리말에서 음절의 끝에 올 수 있는 자음은 ‘ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ’의 일곱뿐이다. 받침에 그 밖의 자음이 적혀 있으면 발음할 때 이 일곱 가운데 하나로 바뀐다. ‘ㅋ, ㄲ’은 [ㄱ]으로, ‘ㅅ, ㅆ, ㅈ, ㅊ, ㅌ’은 [ㄷ]으로, ‘ㅍ’은 [ㅂ]으로 소리 난다. 그래서 ‘부엌’은 [부억], ‘옷’은 [옫], ‘숲’은 [숩]으로 발음한다. 바뀐 뒤의 소리를 대표음이라고 한다.\n그런데 받침 뒤에 모음으로 시작하는 말이 이어지면 사정이 달라진다. 이때에는 뒤에 오는 말이 어떤 말인지를 ㉠ __보아야__ 한다. 뒤에 오는 말이 조사나 어미, 접미사처럼 실질적인 뜻이 없이 문법적인 구실만 하는 말이면, 받침은 대표음으로 바뀌지 않고 제 소리 그대로 뒤 음절의 첫소리로 옮겨 간다. ‘옷이’는 [오시], ‘숲을’은 [수플], ‘깎아’는 [까까]로 발음하는 것이 그 예이다.\n반면 뒤에 오는 말이 실질적인 뜻을 지닌 말이면, 받침은 먼저 대표음으로 바뀐 다음 뒤 음절의 첫소리로 옮겨 간다. ‘옷 안’은 [오단], ‘숲 위’는 [수뷔]가 된다. 두 말이 합쳐져 한 단어가 된 경우에도 마찬가지여서 ‘겉옷’은 [거돋]으로, 접두사 ‘헛-’이 붙은 ‘헛웃음’은 [허두슴]으로 발음한다. ‘헛웃음’의 마지막 음절이 [슴]인 것은 ‘-음’이 접미사여서 ‘웃’의 받침이 제 소리대로 옮겨 갔기 때문이다.\n이 원리를 알면 글자는 비슷해도 발음이 다른 까닭을 설명할 수 있다. ‘꽃이’와 ‘꽃 위’에서 ‘꽃’의 받침은 똑같이 ‘ㅊ’이지만, 앞의 것은 [꼬치]로, 뒤의 것은 [꼬뒤]로 소리 난다.","opts":["어디가 고장인지 __보려고__ 덮개를 열었다.","주말에 친구와 새로 나온 영화를 __보기로__ 했다.","부모님이 외출하신 동안 내가 어린 동생을 __보았다__.","그 회사는 무리하게 사업을 넓히다가 큰 손해를 __보았다__."],"ans":0,"exp":"㉠의 '보다'는 '대상의 내용이나 상태를 알기 위하여 살피다'라는 뜻이고, '어디가 고장인지 보려고'의 '보다'가 같은 뜻이다. '영화를 보다'는 '눈으로 대상을 즐기거나 감상하다', '동생을 보다'는 '맡아서 보살피거나 지키다', '손해를 보다'는 '어떤 일을 당하거나 겪거나 얻어 가지다'의 뜻이다."},
{"id":"k275","subj":"국어","unit":"국어학 지문","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n단어는 짜임에 따라 단일어와 복합어로 나뉜다. ‘하늘’, ‘먹다’처럼 뜻을 지닌 중심 부분인 어근 하나로 된 말이 단일어이고, 둘 이상의 요소가 ㉠ __어울려__ 이루어진 말이 복합어이다. 복합어는 다시 둘로 나뉜다. ‘밤낮’, ‘돌다리’처럼 어근과 어근이 만난 말은 합성어이고, ‘풋사과’, ‘지우개’처럼 어근에 접사가 붙은 말은 파생어이다. 접사는 홀로 쓰이지 못하고 어근에 붙어 뜻을 더하거나 품사를 바꾸는 요소로, 어근 앞에 붙는 ‘풋-’ 같은 접두사와 뒤에 붙는 ‘-개’ 같은 접미사가 있다.\n요소가 셋 이상인 단어는 합성어인지 파생어인지를 어떻게 ㉡ __가릴까__? 이때에는 단어를 한꺼번에 낱낱으로 쪼개지 않고, 먼저 크게 둘로 나눈다. 이렇게 처음 나누어 얻은 두 덩어리를 직접 구성 성분이라고 한다. 직접 구성 성분이 둘 다 어근이면 합성어이고, 어느 하나가 접사이면 파생어이다. 이때 어근은 그 자체가 다시 복합어여도 상관없다. ‘볶음밥’은 ‘볶-’, ‘-음’, ‘밥’의 세 요소로 이루어졌지만 먼저 ‘볶음’과 ‘밥’으로 나뉜다. ‘볶음’ 속에 접미사가 들어 있어도 ‘볶음’과 ‘밥’은 둘 다 어근이므로 ‘볶음밥’은 합성어이다.\n어디를 먼저 나눌지는 두 가지를 ㉢ __따져__ 정한다. 나눈 덩어리가 실제로 쓰이는 말인지, 그리고 나눈 덩어리의 뜻을 합쳤을 때 전체의 뜻과 맞는지이다. ‘코웃음’은 ‘코웃-’과 ‘-음’으로 나눌 수 없다. ‘코웃다’라는 말이 없기 때문이다. 따라서 ‘코’와 ‘웃음’으로 나뉘는 합성어이다. 반대로 ‘비웃음’은 ‘비’와 ‘웃음’으로 나누면 뜻이 통하지 않고, ‘비웃다’라는 말이 따로 있으므로 ‘비웃-’과 ‘-음’으로 나뉘는 파생어이다. 겉모습은 ㉣ __닮았어도__ 짜임은 다른 것이다.","opts":["‘놀이터’는 ‘놀이’와 ‘터’로 나뉘는 파생어이다.","‘잠꾸러기’는 ‘잠’과 ‘-꾸러기’로 나뉘는 파생어이다.","‘눈웃음’은 ‘눈웃-’과 ‘-음’으로 나뉘는 파생어이다.","‘손가락질’은 ‘손’과 ‘가락질’로 나뉘는 합성어이다."],"ans":1,"exp":"'잠꾸러기'는 '잠'과 홀로 쓰이지 못하는 접미사 '-꾸러기'로 나뉘므로 직접 구성 성분의 하나가 접사인 파생어이다. '놀이터'는 '놀이'와 '터'가 둘 다 어근이므로 합성어이다. '눈웃다'라는 말이 없으므로 '눈웃음'은 '눈'과 '웃음'으로 나뉘는 합성어이고, '가락질'이라는 말이 없으므로 '손가락질'은 '손가락'과 접미사 '-질'로 나뉘는 파생어이다."},
{"id":"k276","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n단어는 짜임에 따라 단일어와 복합어로 나뉜다. ‘하늘’, ‘먹다’처럼 뜻을 지닌 중심 부분인 어근 하나로 된 말이 단일어이고, 둘 이상의 요소가 ㉠ __어울려__ 이루어진 말이 복합어이다. 복합어는 다시 둘로 나뉜다. ‘밤낮’, ‘돌다리’처럼 어근과 어근이 만난 말은 합성어이고, ‘풋사과’, ‘지우개’처럼 어근에 접사가 붙은 말은 파생어이다. 접사는 홀로 쓰이지 못하고 어근에 붙어 뜻을 더하거나 품사를 바꾸는 요소로, 어근 앞에 붙는 ‘풋-’ 같은 접두사와 뒤에 붙는 ‘-개’ 같은 접미사가 있다.\n요소가 셋 이상인 단어는 합성어인지 파생어인지를 어떻게 ㉡ __가릴까__? 이때에는 단어를 한꺼번에 낱낱으로 쪼개지 않고, 먼저 크게 둘로 나눈다. 이렇게 처음 나누어 얻은 두 덩어리를 직접 구성 성분이라고 한다. 직접 구성 성분이 둘 다 어근이면 합성어이고, 어느 하나가 접사이면 파생어이다. 이때 어근은 그 자체가 다시 복합어여도 상관없다. ‘볶음밥’은 ‘볶-’, ‘-음’, ‘밥’의 세 요소로 이루어졌지만 먼저 ‘볶음’과 ‘밥’으로 나뉜다. ‘볶음’ 속에 접미사가 들어 있어도 ‘볶음’과 ‘밥’은 둘 다 어근이므로 ‘볶음밥’은 합성어이다.\n어디를 먼저 나눌지는 두 가지를 ㉢ __따져__ 정한다. 나눈 덩어리가 실제로 쓰이는 말인지, 그리고 나눈 덩어리의 뜻을 합쳤을 때 전체의 뜻과 맞는지이다. ‘코웃음’은 ‘코웃-’과 ‘-음’으로 나눌 수 없다. ‘코웃다’라는 말이 없기 때문이다. 따라서 ‘코’와 ‘웃음’으로 나뉘는 합성어이다. 반대로 ‘비웃음’은 ‘비’와 ‘웃음’으로 나누면 뜻이 통하지 않고, ‘비웃다’라는 말이 따로 있으므로 ‘비웃-’과 ‘-음’으로 나뉘는 파생어이다. 겉모습은 ㉣ __닮았어도__ 짜임은 다른 것이다.","opts":["㉠: 결합(結合)하여","㉡: 판별(判別)할까","㉢: 추궁(追窮)하여","㉣: 유사(類似)해도"],"ans":2,"exp":"㉢의 '따지다'는 조건이나 사정을 꼼꼼히 살펴 헤아린다는 뜻이므로 '검토(檢討)하여'로 바꿀 수 있다. '추궁(追窮)하다'는 잘못한 일을 엄하게 캐묻는다는 뜻이어서 이 문맥에 맞지 않는다. '어울리다'는 '결합하다', '가리다'는 '판별하다', '닮다'는 '유사하다'와 뜻이 통한다."},
{"id":"k277","subj":"국어","unit":"국어학 지문","q":"윗글에서 추론한 내용으로 적절하지 않은 것은?\n\n주어가 어떤 동작을 직접 하는 것을 주동이라 하고, 주어가 남에게 그 동작을 하게 하는 것을 사동이라 한다. ‘아이가 밥을 먹는다.’는 주동문이고 ‘아버지가 아이에게 밥을 먹인다.’는 사동문이다. 우리말에서 사동문을 만드는 방법은 두 가지이다. 하나는 동사나 형용사의 어간에 ‘-이-, -히-, -리-, -기-, -우-’ 같은 접미사를 붙이는 것으로, ‘먹이다’, ‘입히다’, ‘울리다’ 등이 이렇게 만들어진다. 다른 하나는 어간에 ‘-게 하다’를 붙이는 것으로, ‘먹게 하다’, ‘입게 하다’가 그 예이다. 앞의 것은 길이가 짧아 짧은 사동, 뒤의 것은 긴 사동이라고 부른다.\n두 사동문은 뜻이 꼭 같지 않다. ‘어머니가 아이에게 옷을 입혔다.’는 두 가지로 읽힌다. 어머니가 손수 아이의 몸에 옷을 꿰어 준 것일 수도 있고, 어머니는 말로 시키기만 하고 아이가 제 손으로 입은 것일 수도 있다. 앞의 것처럼 주어가 동작에 직접 참여하는 경우를 직접 사동, 뒤의 것처럼 시키기만 하는 경우를 간접 사동이라 한다. 그런데 ‘어머니가 아이에게 옷을 입게 하였다.’는 아이가 제 손으로 입었다는 뜻으로만 읽힌다. 곧 짧은 사동문은 대체로 직접 사동과 간접 사동의 두 뜻으로 읽힐 수 있고, 긴 사동문은 간접 사동으로만 읽힌다.\n다만 짧은 사동문이라고 해서 언제나 두 뜻으로 읽히는 것은 아니다. ‘선생님이 학생에게 책을 읽혔다.’에서 책을 읽는 사람은 학생일 수밖에 없다. 읽는 동작은 남이 대신 해 줄 수 없기 때문이다. 또 모든 동사에 짧은 사동이 있는 것도 아니다. ‘가다’, ‘만나다’에는 사동 접미사가 붙지 못하여 ‘가게 하다’, ‘만나게 하다’처럼 긴 사동만 ㉠ __쓴다__.","opts":["‘간호사가 환자를 침대에 눕게 하였다.’는 간호사가 환자의 몸을 잡아 눕혔다는 뜻으로만 읽힌다.","‘누나가 동생에게 신발을 신게 하였다.’는 동생이 제 손으로 신발을 신었다는 뜻으로 읽히는 문장이다.","‘누나가 동생에게 신발을 신겼다.’는 누나가 손수 동생의 발에 신발을 신겨 주었다는 뜻으로도 읽힐 수 있다.","‘할머니가 손자에게 약을 먹였다.’는 할머니가 약을 입에 넣어 주었다는 뜻으로도, 먹으라고 시켰다는 뜻으로도 읽힐 수 있다."],"ans":0,"exp":"'-게 하다'가 붙은 긴 사동문은 간접 사동으로만 읽히므로, '눕게 하였다'는 간호사가 시키고 환자가 스스로 누웠다는 뜻으로 읽힌다. 간호사가 몸을 잡아 눕혔다는 직접 사동의 뜻으로만 읽힌다는 진술은 적절하지 않다. '신게 하였다'는 긴 사동이므로 동생이 제 손으로 신었다는 뜻이고, '신겼다'와 '먹였다'는 짧은 사동이므로 직접 사동과 간접 사동의 두 뜻으로 읽힐 수 있다."},
{"id":"k278","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n주어가 어떤 동작을 직접 하는 것을 주동이라 하고, 주어가 남에게 그 동작을 하게 하는 것을 사동이라 한다. ‘아이가 밥을 먹는다.’는 주동문이고 ‘아버지가 아이에게 밥을 먹인다.’는 사동문이다. 우리말에서 사동문을 만드는 방법은 두 가지이다. 하나는 동사나 형용사의 어간에 ‘-이-, -히-, -리-, -기-, -우-’ 같은 접미사를 붙이는 것으로, ‘먹이다’, ‘입히다’, ‘울리다’ 등이 이렇게 만들어진다. 다른 하나는 어간에 ‘-게 하다’를 붙이는 것으로, ‘먹게 하다’, ‘입게 하다’가 그 예이다. 앞의 것은 길이가 짧아 짧은 사동, 뒤의 것은 긴 사동이라고 부른다.\n두 사동문은 뜻이 꼭 같지 않다. ‘어머니가 아이에게 옷을 입혔다.’는 두 가지로 읽힌다. 어머니가 손수 아이의 몸에 옷을 꿰어 준 것일 수도 있고, 어머니는 말로 시키기만 하고 아이가 제 손으로 입은 것일 수도 있다. 앞의 것처럼 주어가 동작에 직접 참여하는 경우를 직접 사동, 뒤의 것처럼 시키기만 하는 경우를 간접 사동이라 한다. 그런데 ‘어머니가 아이에게 옷을 입게 하였다.’는 아이가 제 손으로 입었다는 뜻으로만 읽힌다. 곧 짧은 사동문은 대체로 직접 사동과 간접 사동의 두 뜻으로 읽힐 수 있고, 긴 사동문은 간접 사동으로만 읽힌다.\n다만 짧은 사동문이라고 해서 언제나 두 뜻으로 읽히는 것은 아니다. ‘선생님이 학생에게 책을 읽혔다.’에서 책을 읽는 사람은 학생일 수밖에 없다. 읽는 동작은 남이 대신 해 줄 수 없기 때문이다. 또 모든 동사에 짧은 사동이 있는 것도 아니다. ‘가다’, ‘만나다’에는 사동 접미사가 붙지 못하여 ‘가게 하다’, ‘만나게 하다’처럼 긴 사동만 ㉠ __쓴다__.","opts":["동생은 밤마다 일기를 __쓴다__.","그는 여행에 돈을 아낌없이 __쓴다__.","이삿짐을 옮기려면 사람을 더 __써야__ 한다.","그 외국인은 우리말을 한국 사람처럼 자연스럽게 __쓴다__."],"ans":3,"exp":"㉠의 '쓰다'는 '어떤 말이나 언어를 사용하다'라는 뜻이고, '우리말을 자연스럽게 쓴다'의 '쓰다'가 같은 뜻이다. '일기를 쓰다'는 글을 적는다는 뜻의 다른 단어이다. '돈을 쓰다'는 '어떤 일에 돈을 들이다', '사람을 쓰다'는 '사람에게 일정한 돈을 주고 일을 하도록 부리다'의 뜻이다."},
{"id":"k279","subj":"국어","unit":"국어학 지문","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n뜻이 서로 맞서는 두 단어를 반의어라고 한다. 반의어는 모든 점에서 다른 말이 아니다. ‘아버지’와 ‘어머니’는 사람이고 부모라는 점이 같고 성별 하나만 다르다. 이처럼 반의어는 여러 의미 요소를 함께 지니면서 단 하나의 요소에서만 맞선다. 반의 관계는 맞서는 방식에 따라 셋으로 나눌 수 있다.\n첫째는 상보 반의어이다. ‘살다’와 ‘죽다’, ‘합격’과 ‘불합격’처럼 어떤 영역을 둘로 남김없이 나누는 짝이다. 상보 반의어에서는 한쪽을 부정하면 곧 다른 쪽이 된다. 살지 않았다면 죽은 것이다. ㉠ __이런 짝__은 중간이 없으므로 ㉡ __두 단어__를 함께 긍정하거나 함께 부정하면 모순이 되고, ‘조금’, ‘매우’처럼 정도를 나타내는 말의 꾸밈을 받지 못한다.\n둘째는 정도 반의어이다. ‘길다’와 ‘짧다’, ‘덥다’와 ‘춥다’처럼 정도의 차이를 나타내는 짝이다. ㉢ __이들__ 사이에는 중간 단계가 있어서 한쪽을 부정한다고 다른 쪽이 되지 않는다. 덥지 않다고 해서 반드시 추운 것은 아니다. 그래서 ‘길지도 짧지도 않다’처럼 둘을 함께 부정할 수 있고, ‘매우 길다’, ‘더 짧다’처럼 정도를 나타내는 말이나 비교 표현과 어울린다. ‘조금 덥다’는 자연스럽지만 ㉣ __중간이 없는 짝__에 속하는 ‘죽다’를 두고 ‘조금 죽다’라고 하지 않는 것과 견주어 볼 만하다.\n셋째는 방향 반의어이다. ‘위’와 ‘아래’, ‘가다’와 ‘오다’, ‘사다’와 ‘팔다’처럼 한 기준점을 두고 방향이 맞서거나, 같은 일을 서로 다른 쪽에서 바라본 짝이다. 갑이 을에게 물건을 팔았다면 을은 갑에게서 그 물건을 산 것이다.\n한 단어가 반의어를 하나만 가지는 것도 아니다. ‘서다’는 ‘앉다’와 맞서지만, 달리던 차가 서는 경우에는 ‘가다’와 맞선다. 뜻이 여럿인 단어는 뜻마다 다른 반의어를 가질 수 있다.","opts":["‘크다’와 ‘작다’는 한쪽을 부정하면 곧 다른 쪽이 된다.","‘있다’와 ‘없다’는 두 단어를 함께 부정하면 모순이 된다.","‘주다’와 ‘받다’는 정도의 차이를 나타내는 정도 반의어이다.","‘무겁다’와 ‘가볍다’는 ‘매우’ 같은 말의 꾸밈을 받지 못하는 짝이다."],"ans":1,"exp":"'있다'와 '없다'는 있지 않으면 곧 없는 것이어서 영역을 둘로 남김없이 나누는 상보 반의어이므로, 둘을 함께 부정하면 모순이 된다. '크다'와 '작다', '무겁다'와 '가볍다'는 중간 단계가 있는 정도 반의어여서 한쪽을 부정해도 다른 쪽이 되지 않고 '매우' 같은 말과 어울린다. '주다'와 '받다'는 같은 일을 서로 다른 쪽에서 바라본 방향 반의어이다."},
{"id":"k280","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 문맥상 가리키는 대상이 나머지와 다른 하나는?\n\n뜻이 서로 맞서는 두 단어를 반의어라고 한다. 반의어는 모든 점에서 다른 말이 아니다. ‘아버지’와 ‘어머니’는 사람이고 부모라는 점이 같고 성별 하나만 다르다. 이처럼 반의어는 여러 의미 요소를 함께 지니면서 단 하나의 요소에서만 맞선다. 반의 관계는 맞서는 방식에 따라 셋으로 나눌 수 있다.\n첫째는 상보 반의어이다. ‘살다’와 ‘죽다’, ‘합격’과 ‘불합격’처럼 어떤 영역을 둘로 남김없이 나누는 짝이다. 상보 반의어에서는 한쪽을 부정하면 곧 다른 쪽이 된다. 살지 않았다면 죽은 것이다. ㉠ __이런 짝__은 중간이 없으므로 ㉡ __두 단어__를 함께 긍정하거나 함께 부정하면 모순이 되고, ‘조금’, ‘매우’처럼 정도를 나타내는 말의 꾸밈을 받지 못한다.\n둘째는 정도 반의어이다. ‘길다’와 ‘짧다’, ‘덥다’와 ‘춥다’처럼 정도의 차이를 나타내는 짝이다. ㉢ __이들__ 사이에는 중간 단계가 있어서 한쪽을 부정한다고 다른 쪽이 되지 않는다. 덥지 않다고 해서 반드시 추운 것은 아니다. 그래서 ‘길지도 짧지도 않다’처럼 둘을 함께 부정할 수 있고, ‘매우 길다’, ‘더 짧다’처럼 정도를 나타내는 말이나 비교 표현과 어울린다. ‘조금 덥다’는 자연스럽지만 ㉣ __중간이 없는 짝__에 속하는 ‘죽다’를 두고 ‘조금 죽다’라고 하지 않는 것과 견주어 볼 만하다.\n셋째는 방향 반의어이다. ‘위’와 ‘아래’, ‘가다’와 ‘오다’, ‘사다’와 ‘팔다’처럼 한 기준점을 두고 방향이 맞서거나, 같은 일을 서로 다른 쪽에서 바라본 짝이다. 갑이 을에게 물건을 팔았다면 을은 갑에게서 그 물건을 산 것이다.\n한 단어가 반의어를 하나만 가지는 것도 아니다. ‘서다’는 ‘앉다’와 맞서지만, 달리던 차가 서는 경우에는 ‘가다’와 맞선다. 뜻이 여럿인 단어는 뜻마다 다른 반의어를 가질 수 있다.","opts":["㉠","㉡","㉢","㉣"],"ans":2,"exp":"㉠ '이런 짝', ㉡ '두 단어', ㉣ '중간이 없는 짝'은 모두 '살다'와 '죽다'처럼 영역을 둘로 남김없이 나누는 상보 반의어를 가리킨다. ㉢ '이들'은 '길다'와 '짧다', '덥다'와 '춥다' 같은 정도 반의어를 가리키므로 나머지와 다르다."},
{"id":"k281","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n조선은 백성이 억울한 일을 임금에게 직접 알릴 길을 열어 두려 하였다. 태종 때 대궐 밖에 단 신문고가 그 시작이다. 그러나 신문고는 아무나 칠 수 있는 북이 아니었다. 지방의 백성은 억울한 일이 있으면 먼저 고을 수령에게, 다음에는 관찰사에게, 그다음에는 사헌부에 호소해야 했고, 그래도 풀리지 않을 때에야 북을 칠 수 있었다. 이 절차를 건너뛰면 도리어 벌을 받았다. 더구나 북이 서울에 있었으므로 지방의 백성이 이용하기는 어려웠다.\n조선 후기에는 상언과 격쟁이 그 자리를 대신하였다. 상언은 임금에게 글을 올려 사정을 아뢰는 것이고, 격쟁은 임금이 거둥하는 길가에서 징이나 꽹과리를 쳐서 임금의 눈길을 끈 뒤 말로 사정을 아뢰는 것이다. 상언은 격식에 맞는 글을 지어야 했으므로 글을 아는 사람의 손을 빌려야 했지만, 격쟁은 글을 몰라도 할 수 있었다. 그래서 격쟁은 글을 모르는 백성이 기댈 수 있는 길이 되었다.\n처음에 조정은 호소할 수 있는 일을 자신이 받을 형벌, 부자 관계, 본처와 첩의 구분, 양인과 천인의 구분에 관한 네 가지로 묶어 두었다. 그러나 정조는 이 범위를 넓혀 백성이 살면서 겪는 괴로움 전반을 아뢸 수 있게 하였다. 그 뒤로는 세금을 지나치게 거두는 수령을 고발하는 일처럼 개인의 억울함을 넘어서는 호소가 늘어났다.","opts":["격쟁은 글을 지어 임금에게 올리는 방식으로 이루어졌다.","신문고는 고을마다 달려 있어서 누구나 쉽게 칠 수 있었다.","정조 때에는 개인의 억울함이 아닌 일도 임금에게 호소할 수 있었다.","지방의 백성은 관찰사와 사헌부를 거치지 않고도 신문고를 칠 수 있었다."],"ans":2,"exp":"정조가 호소할 수 있는 범위를 백성이 겪는 괴로움 전반으로 넓힌 뒤 수령의 지나친 세금 징수를 고발하는 일처럼 개인의 억울함을 넘어서는 호소가 늘어났다고 하였다. 글을 지어 올리는 것은 상언이고 격쟁은 징이나 꽹과리를 친 뒤 말로 아뢰는 것이다. 신문고는 서울의 대궐 밖에 있었고, 지방의 백성은 수령, 관찰사, 사헌부를 차례로 거친 뒤에야 칠 수 있었다."},
{"id":"k282","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n조선 시대의 그림은 누가 무엇을 위해 그렸는가에 따라 성격이 크게 달랐다. 문인화는 그림을 직업으로 삼지 않는 사대부가 글씨와 시를 익히는 틈에 그린 그림이다. 문인화가에게 중요한 것은 대상을 닮게 그리는 솜씨가 아니라 그리는 사람의 뜻과 품격을 담는 일이었다. 그래서 문인화는 대상의 겉모습을 꼼꼼히 옮기기보다 몇 번의 붓질로 그 기운을 드러내는 쪽을 높이 쳤고, 화면에 여백을 넓게 두고 시를 적어 넣었다. 매화, 난초, 국화, 대나무가 즐겨 그려진 것도 이 식물들이 선비의 절개를 뜻한다고 여겨졌기 때문이다.\n민화는 이와 달리 쓰임새가 분명한 그림이었다. 민화는 이름이 알려지지 않은 화가들이 주문을 받아 그렸고, 집 안을 꾸미거나 복을 빌고 나쁜 기운을 막는 데 쓰였다. 대문에는 호랑이와 까치를, 신혼부부의 방에는 꽃과 새를 그린 그림을 두었다. 모란은 부귀를, 잉어는 출세를, 석류는 많은 자손을 뜻하였으므로, 민화를 보는 사람은 그림의 솜씨보다 그림에 담긴 바람을 읽었다. 민화의 색이 짙고 화면이 빈틈없이 채워진 것, 같은 그림본을 되풀이해 그린 것도 이런 쓰임과 관계가 있다.\n다만 두 그림을 신분에 따라 칼로 자르듯 나눌 수는 없다. 책과 문방구를 그린 책거리는 궁중과 양반가에서 먼저 유행한 뒤 민간으로 퍼졌고, 민화의 소재 가운데에는 문인화의 소재를 빌려 온 것도 적지 않다.","opts":["문인화에서는 대상을 꼭 닮게 그리는 솜씨를 으뜸으로 쳤다.","민화를 보는 사람은 그려진 소재가 뜻하는 바람을 읽어 내었다.","책거리는 민간에서 먼저 그려져 궁중으로 전해진 그림이 아니다.","민화의 화면이 빈틈없이 채워진 것은 그림의 쓰임새와 관련이 있다."],"ans":0,"exp":"문인화가에게 중요한 것은 대상을 닮게 그리는 솜씨가 아니라 그리는 사람의 뜻과 품격을 담는 일이었다고 하였으므로, 닮게 그리는 솜씨를 으뜸으로 쳤다는 진술은 적절하지 않다. 민화를 보는 사람은 그림에 담긴 바람을 읽었고, 책거리는 궁중과 양반가에서 먼저 유행한 뒤 민간으로 퍼졌으며, 화면이 빈틈없이 채워진 것은 민화의 쓰임과 관계가 있다."},
{"id":"k283","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n사회적 자본은 사람들 사이의 연결망과 거기에서 생겨나는 믿음, 서로 돕는 규범을 아울러 이르는 말이다. 돈이나 기계가 생산에 쓰이는 자본이듯, 사람 사이의 관계도 무언가를 이루는 데 쓰이는 밑천이라는 뜻에서 붙은 이름이다. 이웃끼리 믿고 지내는 동네에서는 아이를 잠깐 맡기거나 연장을 빌리는 일이 쉽다.\n정치학자 퍼트넘은 사회적 자본을 두 가지로 나누었다. 결속형은 가족, 동향 사람, 같은 종교를 믿는 사람처럼 서로 비슷한 사람들을 안으로 묶는 관계이다. 결속형 관계는 어려울 때 기댈 곳이 되어 주고 구성원에게 소속감을 준다. 교량형은 출신과 처지가 다른 사람들을 밖으로 잇는 관계이다. 여러 동네 사람이 섞인 운동 모임이나 서로 다른 직업을 가진 사람들의 봉사 단체가 그 예이다. 교량형 관계는 결속형만큼 끈끈하지 않지만, 자기 집단 안에서는 얻을 수 없는 정보와 기회를 가져다준다. 결속형이 ‘버티게 해 주는’ 관계라면 교량형은 ‘앞으로 나아가게 해 주는’ 관계이다.\n사회적 자본이 언제나 이롭기만 한 것은 아니다. 결속형 관계만 두터운 집단은 안에서는 서로 돕지만 바깥사람을 믿지 않고 밀어내기 쉽다. 구성원에게 집단의 방식을 따르라고 압박하여 개인의 자유를 누르기도 한다. 그래서 한 사회의 사회적 자본을 따질 때에는 관계가 얼마나 많은가와 함께 그 관계가 어느 쪽으로 열려 있는가를 보아야 한다.","opts":["교량형 관계는 서로 비슷한 사람끼리 맺는 끈끈한 관계이다.","사회적 자본은 관계의 수가 많기만 하면 사회에 이롭게 작용한다.","결속형 관계는 집단 밖에 있는 새로운 정보와 기회를 가져다준다.","결속형 관계에 치우친 집단에서는 바깥사람을 배척하는 일이 생길 수 있다."],"ans":3,"exp":"결속형 관계만 두터운 집단은 바깥사람을 믿지 않고 밀어내기 쉽다고 하였으므로, 그런 집단에서 바깥사람을 배척하는 일이 생길 수 있다는 진술이 적절하다. 서로 비슷한 사람을 묶는 것은 결속형이고 교량형은 결속형만큼 끈끈하지 않다. 집단 밖의 정보와 기회를 가져다주는 것은 교량형이며, 사회적 자본은 관계의 수와 함께 관계가 어느 쪽으로 열려 있는가를 보아야 한다."},
{"id":"k284","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n정책은 법령과 계획으로 만들어지지만 시민이 정책을 만나는 곳은 창구와 현장이다. 사회복지 담당 공무원, 경찰관, 교사처럼 시민을 직접 대하면서 정책을 집행하는 사람들을 일선 관료라고 한다. 립스키는 이들의 일터에 세 가지 공통점이 있다고 보았다. 맡은 일에 비해 시간과 인력이 늘 모자라고, 서비스를 바라는 사람은 줄지 않으며, 조직이 요구하는 목표가 모호하거나 서로 부딪친다는 것이다. 민원인 한 사람 한 사람에게 맞는 서비스를 하라는 요구와 많은 민원을 빨리 처리하라는 요구가 함께 주어지는 것이 그 예이다.\n일선 관료의 또 다른 특징은 재량이 크다는 점이다. 현장의 사정은 사람마다 달라서 규정으로 미리 다 정해 둘 수 없고, 상급자가 창구의 일을 하나하나 지켜볼 수도 없다. 그래서 누구에게 먼저 서비스를 줄지, 규정을 얼마나 엄격하게 적용할지가 상당 부분 일선 관료의 판단에 맡겨진다.\n모자란 자원과 큰 재량이 만나면 일선 관료는 일을 감당하기 위한 나름의 요령을 만들어 낸다. 민원인을 몇 가지 유형으로 나누어 유형별로 정해진 방식으로 대하거나, 절차를 번거롭게 하여 찾아오는 사람의 수를 줄이거나, 성과가 잘 나올 만한 사람에게 먼저 힘을 쏟는 것이다. 이런 요령은 개인의 게으름에서가 아니라 일터의 조건에서 나온다. 립스키는 일선 관료가 날마다 내리는 이런 결정들이 쌓인 것이 시민이 실제로 겪는 정책이라고 보았다.","opts":["일선 관료는 시민을 직접 대하면서 정책을 집행하는 사람이다.","일선 관료에게 주어지는 조직의 요구는 서로 충돌하는 일이 있다.","립스키는 일선 관료의 요령이 개인의 불성실한 태도에서 비롯된다고 보았다.","립스키에 따르면 창구에서 내려진 결정들이 쌓여 시민이 겪는 정책을 이룬다."],"ans":2,"exp":"일선 관료가 만들어 내는 요령은 개인의 게으름에서가 아니라 모자란 자원과 큰 재량이라는 일터의 조건에서 나온다고 하였으므로, 개인의 불성실한 태도에서 비롯된다고 보았다는 진술은 적절하지 않다. 일선 관료는 시민을 직접 대하며 정책을 집행하고, 조직이 요구하는 목표가 서로 부딪치기도 하며, 날마다 내리는 결정들이 쌓인 것이 시민이 실제로 겪는 정책이다."},
{"id":"k285","subj":"국어","unit":"내용 이해","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n문자가 없던 사회에서 지식은 사람의 기억 속에만 있었다. 말은 입에서 나오는 순간 사라지므로, 기억해 둘 만한 것은 외우기 쉬운 꼴로 다듬어야 했다. 구술 문화의 이야기에 같은 구절이 되풀이되고, 인물에게 늘 같은 꾸밈말이 붙으며, 가락과 운이 실리는 것은 그 때문이다. 이런 되풀이는 글에서라면 군더더기이겠지만 말에서는 기억을 붙드는 못과 같다. 또 구술 문화의 지식은 구체적인 상황과 떨어지지 않는다. 지식은 누가 언제 누구에게 한 말로서 전해지고, 쓸모가 없어진 지식은 아무도 말하지 않게 되면서 저절로 잊힌다.\n문자는 이 조건을 바꾸었다. 글로 적힌 말은 말한 사람과 그 자리를 떠나서도 남는다. 읽는 사람은 앞으로 되돌아가 다시 읽을 수 있고, 떨어져 있는 두 대목을 나란히 놓고 견줄 수 있다. 그러자 앞뒤가 맞지 않는 곳이 눈에 띄게 되었고, 말을 그 말이 쓰인 상황에서 떼어 내어 낱말의 뜻을 따로 따지는 일이 가능해졌다. 목록을 만들고 갈래를 나누고 정의를 내리는 일, 곧 우리가 분석이라고 부르는 사고방식은 문자에 크게 기대고 있다. 외우는 데 쓰던 힘을 덜어 낸 정신이 새로운 것을 따져 보는 데 쓰일 수 있게 된 점도 빼놓을 수 없다.\n그러므로 문자는 이미 있던 말을 옮겨 적는 도구에 그치지 않는다. 문자는 사람이 지식을 간직하는 방식뿐 아니라 생각하는 방식 자체를 바꾸어 놓았다.","opts":["구술 문화의 이야기는 되풀이가 많아서 전달력이 떨어진다.","문자는 말을 적는 도구를 넘어 사람의 사고방식을 바꾸었다.","문자가 생기면서 사람들은 지식을 외우는 능력을 잃게 되었다.","구술 문화의 지식은 상황과 떨어져 있어서 오래 보존되기 어려웠다."],"ans":1,"exp":"글은 구술 문화에서 지식이 간직되는 방식을 설명한 뒤, 문자가 다시 읽기와 견주기를 가능하게 하여 분석적인 사고방식을 낳았다고 하고, 문자가 옮겨 적는 도구에 그치지 않고 생각하는 방식 자체를 바꾸었다고 맺는다. 구술 문화의 되풀이는 기억을 붙드는 구실을 한다고 하였고, 외우는 능력을 잃었다는 내용은 없다. 구술 문화의 지식은 구체적인 상황과 떨어지지 않는다고 하였다."},
{"id":"k286","subj":"국어","unit":"내용 이해","q":"다음 글의 「대동여지도」를 이해한 내용으로 가장 적절한 것은?\n\n김정호가 1861년에 펴낸 「대동여지도」는 조선의 옛 지도 가운데 가장 널리 알려져 있지만, 그 가치는 크기나 정밀함에만 있지 않다. 이 지도는 쓰는 사람의 편의를 헤아려 만든 지도였다.\n첫째, 「대동여지도」는 목판에 새겨 찍은 지도이다. 그 이전의 정밀한 전국 지도는 대개 손으로 그린 것이어서 관청이나 몇몇 집안에만 있었고, 베낄 때마다 틀린 곳이 생겼다. 목판으로 찍으면 같은 지도를 여러 벌 만들 수 있고 내용도 달라지지 않는다. 둘째, 이 지도는 나라 전체를 남북으로 22층으로 나누고 층마다 한 권의 책처럼 접어서 만들었다. 모두 이어 붙이면 세로가 6미터를 넘지만, 길을 떠나는 사람은 자기가 지나갈 지역의 책만 골라 들고 갈 수 있었다. 셋째, 글자를 줄이고 기호를 썼다. 고을, 역, 창고, 봉수 같은 시설을 약속된 기호로 나타내고 그 기호의 뜻을 지도 첫머리에 모아 보여 주었다. 덕분에 화면이 글자로 덮이지 않아 산줄기와 물줄기가 한눈에 들어온다. 넷째, 길을 나타낸 선 위에 10리마다 점을 찍었다. 점의 수를 세면 두 곳 사이의 거리를 어림할 수 있는데, 굽이가 많은 산길에서는 점 사이가 평지보다 촘촘해지기도 한다. 지도 위의 곧은 거리가 아니라 사람이 실제로 걷는 길의 거리를 나타내려 하였기 때문이다.\n흔히 김정호가 이 지도를 만들려고 전국을 여러 번 걸어 다녔다고 하지만, 이를 뒷받침하는 기록은 없다. 오늘날에는 그가 앞선 시대의 지도와 지리지를 널리 모아 견주고 바로잡아 이 지도를 완성하였다고 본다.","opts":["길 위의 점들이 촘촘하게 찍힌 구간은 산길일 수 있다.","길 위에 찍힌 점은 고을이 있는 자리를 나타낸 것이다.","손으로 그려서 관청과 몇몇 집안에만 두던 지도에 해당한다.","김정호가 전국을 여러 번 답사한 사실이 기록으로 확인된 지도이다."],"ans":0,"exp":"길 위의 점은 10리마다 찍었는데 사람이 실제로 걷는 길의 거리를 나타내려 하였기 때문에 굽이가 많은 산길에서는 점 사이가 평지보다 촘촘해지기도 한다고 하였다. 따라서 점들이 촘촘한 구간은 산길일 수 있다. 점은 고을의 자리가 아니라 거리를 나타내고, 「대동여지도」는 손으로 그린 지도가 아니라 목판에 새겨 찍은 지도이다. 김정호가 전국을 걸어 다녔다는 말을 뒷받침하는 기록은 없다."},
{"id":"k287","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n아리스토텔레스는 사람의 탁월함, 곧 덕을 두 가지로 나누었다. 하나는 지혜나 이해력처럼 생각하는 능력과 관계된 지적인 덕이고, 다른 하나는 용기나 절제처럼 감정과 욕구를 다스리는 일과 관계된 품성의 덕이다. 두 덕은 얻는 길이 다르다. 지적인 덕은 주로 가르침을 받아 생기고 자라므로 경험과 시간이 필요하다. 품성의 덕은 습관에서 생긴다. 집을 지어 보아야 목수가 되고 악기를 타 보아야 연주자가 되듯이, 사람은 올바른 행동을 거듭함으로써 올바른 사람이 되고 용감한 행동을 거듭함으로써 용감한 사람이 된다.\n그렇다면 어떤 행동이 덕 있는 행동인가. 아리스토텔레스는 품성의 덕이 지나침과 모자람 사이의 중간, 곧 중용에 있다고 보았다. 두려움을 지나치게 느끼면 비겁해지고 너무 느끼지 않으면 무모해지며, 그 중간에 용기가 있다. 그러나 중용은 양쪽 끝에서 똑같이 떨어진 산술적 한가운데가 아니다. 운동선수에게 알맞은 식사량과 초보자에게 알맞은 식사량이 다르듯이, 중용은 사람과 상황에 따라 달라진다. 마땅한 때에, 마땅한 일에 대하여, 마땅한 사람에게, 마땅한 방식으로 감정을 느끼고 행동하는 것이 중용이다.\n이 ‘마땅함’을 가려내는 능력이 실천적 지혜이다. 실천적 지혜는 지적인 덕에 속하지만 품성의 덕과 떨어질 수 없다. 실천적 지혜가 없으면 좋은 뜻을 가지고도 상황에 맞지 않게 행동하게 되고, 품성의 덕이 없으면 영리함이 나쁜 목적에 쓰일 수 있기 때문이다.","opts":["품성의 덕은 올바른 행동을 거듭하는 가운데 길러진다.","중용에 맞는 행동은 누구에게나 같은 것으로 정해져 있다.","실천적 지혜는 지적인 덕에 속하면서 품성의 덕과 맞물려 있다.","두려움을 지나치게 느끼는 것과 너무 느끼지 않는 것은 모두 용기가 아니다."],"ans":1,"exp":"중용은 양쪽 끝에서 똑같이 떨어진 산술적 한가운데가 아니며 사람과 상황에 따라 달라진다고 하였으므로, 누구에게나 같은 것으로 정해져 있다는 진술은 적절하지 않다. 품성의 덕은 습관에서 생기고, 실천적 지혜는 지적인 덕에 속하지만 품성의 덕과 떨어질 수 없다. 두려움을 지나치게 느끼면 비겁, 너무 느끼지 않으면 무모이고 그 중간이 용기이다."},
{"id":"k288","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n한옥의 가장 큰 특징은 온돌과 마루가 한 지붕 아래 나란히 놓인다는 점이다. 온돌은 아궁이에서 땐 불의 열기가 방바닥 밑의 고래를 지나며 구들장을 데우고 굴뚝으로 빠져나가게 한 난방 장치이다. 불을 지피지 않는 동안에도 달궈진 구들장이 오래 열을 내므로, 겨울이 길고 추운 북쪽 지방에서 먼저 발달하였다. 열을 가두어야 하므로 온돌방은 벽을 두껍게 치고 창과 문을 작게 내며 천장을 낮춘다.\n마루는 땅에서 띄워 널빤지를 깐 바닥이다. 바닥 밑으로 바람이 통해 땅의 습기와 열기가 올라오지 못하므로, 여름이 덥고 습한 남쪽 지방에서 발달하였다. 마루가 있는 대청은 앞이 트여 있고 뒤에도 문을 내어 바람이 집을 꿰뚫고 지나가게 한다.\n서로 다른 기후에서 나온 두 장치가 한 집에 함께 자리 잡은 것은 한반도의 겨울이 몹시 춥고 여름이 무덥기 때문이다. 다만 둘이 섞이는 비율은 지역에 따라 달랐다. 추운 북부 지방에서는 방을 두 줄로 겹쳐 놓아 바깥 공기에 닿는 벽을 줄였고, 마루를 두지 않거나 작게 두었다. 더운 남부 지방에서는 방을 한 줄로 늘어놓고 넓은 대청을 두어 바람길을 열었다.\n온돌은 앉아서 생활하는 방식도 굳혔다. 바닥이 가장 따뜻하므로 사람들은 의자와 침대 대신 바닥에 앉고 누웠으며, 가구도 앉은 사람의 눈높이에 맞추어 낮게 만들었다.","opts":["온돌방의 창을 작게 내는 것은 방 안의 열이 새는 것을 줄이려는 것이다.","한옥의 가구가 낮은 것은 바닥에 앉아서 지내는 생활 방식과 관련이 있다.","겨울이 짧고 따뜻한 지역의 한옥일수록 마루가 차지하는 비중이 클 것이다.","북부 지방의 집이 방을 두 줄로 겹쳐 놓은 것은 집 안에 바람이 잘 통하게 하려는 것이다."],"ans":3,"exp":"북부 지방에서 방을 두 줄로 겹쳐 놓은 것은 바깥 공기에 닿는 벽을 줄여 추위를 막으려는 것이고, 바람길을 여는 것은 방을 한 줄로 늘어놓고 넓은 대청을 둔 남부 지방의 집이다. 온돌방은 열을 가두려고 창과 문을 작게 내고, 가구는 바닥에 앉은 사람의 눈높이에 맞추어 낮게 만들었다. 마루는 덥고 습한 지방에서 발달하였고 추운 북부에서는 두지 않거나 작게 두었으므로 따뜻한 지역일수록 마루의 비중이 클 것이다."},
{"id":"k289","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n일탈을 설명하는 이론들은 대개 ‘왜 어떤 사람은 규범을 어기는가’를 묻는다. 낙인 이론은 물음을 바꾼다. 어떤 행위가 일탈인지는 행위 자체의 성질이 아니라 사회가 그 행위에 어떻게 반응하느냐에 따라 정해진다는 것이다. 같은 행위도 누가, 어디에서 했느냐에 따라 장난으로 넘어가기도 하고 비행으로 규정되기도 한다.\n레머트는 일탈을 두 단계로 나누어 이 과정을 설명하였다. 일차적 일탈은 누구나 한두 번쯤 저지르는 가벼운 규범 위반이다. 이것은 대개 남의 눈에 띄지 않거나 띄더라도 대수롭지 않게 넘어가며, 행위자도 자신을 일탈자로 여기지 않는다. 문제는 그 행위가 드러나 주위에서 그를 ‘문제아’나 ‘전과자’로 부르기 시작할 때 생긴다. 딱지가 붙은 사람은 학교와 일터에서 밀려나고, 평범한 사람들과 어울릴 기회를 잃으며, 비슷한 딱지가 붙은 사람들과 가까워진다. 그러는 사이 그는 남들이 자신을 보는 대로 자신을 보게 되고, 일탈자라는 정체성을 받아들여 그에 맞게 행동한다. 이렇게 낙인에 대한 반응으로 나타나는 일탈이 이차적 일탈이다.\n낙인 이론은 일탈을 줄이려는 사회의 통제가 도리어 일탈을 굳힐 수 있음을 일깨운다. 다만 이 이론은 일차적 일탈이 처음에 왜 일어나는지를 설명하지 못하고, 낙인이 찍히지 않아도 일탈을 거듭하는 사람이 있다는 점을 놓친다는 비판을 받는다.","opts":["낙인 이론은 어떤 행위가 일탈인지가 그 행위 자체의 성질에 따라 정해진다고 볼 것이다.","레머트는 일차적 일탈을 한 사람이 대개 그 일을 계기로 자신을 일탈자로 여기게 된다고 볼 것이다.","낙인 이론은 주위에서 낙인을 찍지 않았는데도 비행을 거듭하는 사람의 행동을 설명하는 데 알맞을 것이다.","물건을 훔친 일이 알려져 ‘도둑’이라 불리며 따돌림받던 학생이 비행 집단에 들어가 절도를 거듭한 것은 이차적 일탈일 것이다."],"ans":3,"exp":"이차적 일탈은 행위가 드러나 딱지가 붙은 사람이 밀려나고 비슷한 딱지가 붙은 사람들과 가까워지면서 일탈자라는 정체성에 맞게 행동하는 것이므로, '도둑'이라 불리며 따돌림받다가 비행 집단에 들어가 절도를 거듭한 것은 이차적 일탈이다. 낙인 이론에서 일탈은 행위의 성질이 아니라 사회의 반응에 따라 정해지고, 일차적 일탈을 한 사람은 자신을 일탈자로 여기지 않는다. 낙인 없이 일탈을 거듭하는 사람을 설명하지 못한다는 것은 이 이론이 받는 비판이다."},
{"id":"k290","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n번역가는 두 가지 길 사이에서 선택해야 한다. 슐라이어마허의 말을 빌리면, 하나는 저자를 가만히 두고 독자를 저자 쪽으로 데려가는 길이고, 다른 하나는 독자를 가만히 두고 저자를 독자 쪽으로 데려오는 길이다. 오늘날에는 앞의 것을 이국화, 뒤의 것을 자국화라고 부른다.\n자국화 번역은 번역문이 처음부터 그 언어로 쓰인 글처럼 매끄럽게 읽히는 것을 목표로 한다. 낯선 풍습이나 사물은 독자에게 익숙한 것으로 바꾸고, 원문의 문장 구조도 번역하는 언어의 습관에 맞추어 고친다. 독자는 걸리는 데 없이 읽을 수 있지만, 그 글이 다른 문화에서 왔다는 흔적은 지워진다. 이국화 번역은 반대로 원문의 낯선 표현과 문화 요소를 되도록 살려 둔다. 고유한 음식이나 제도의 이름을 소리 나는 대로 옮기고 필요하면 주석을 단다. 독자는 읽다가 멈칫하게 되지만 그 멈칫거림을 통해 자기와 다른 세계를 만난다.\n번역학자 베누티는 영어권의 번역이 자국화에 치우쳐 왔다고 비판하였다. 매끄러운 번역문에서는 번역가가 보이지 않게 되고, 다른 문화의 글이 영어권 독자의 입맛에 맞게 길들여진다는 것이다.\n그러나 어느 쪽이 옳은지는 글의 종류와 독자에 따라 달라진다. 기계의 사용 설명서를 옮길 때에는 독자가 오해 없이 곧바로 알아듣는 것이 무엇보다 중요하다. 반면 다른 사회의 삶을 보여 주는 것이 목적인 문학 작품에서는 낯섦이 곧 전하려는 내용의 일부가 된다.","opts":["베누티는 번역문이 매끄럽게 읽힐수록 번역가의 존재가 독자에게 잘 드러난다고 볼 것이다.","외국 소설에 나오는 전통 음식의 이름을 소리 나는 대로 적고 주석을 단 것은 자국화 번역일 것이다.","외국의 속담을 뜻이 비슷한 우리 속담으로 바꾸어 옮긴 것은 독자를 저자 쪽으로 데려가는 번역일 것이다.","글쓴이는 외국에서 들여온 세탁기의 사용 설명서를 옮길 때에는 이국화보다 자국화가 알맞다고 볼 것이다."],"ans":3,"exp":"글쓴이는 기계의 사용 설명서에서는 독자가 오해 없이 곧바로 알아듣는 것이 가장 중요하다고 하였으므로, 매끄럽게 읽히는 것을 목표로 하는 자국화가 알맞다고 볼 것이다. 베누티는 매끄러운 번역문에서 번역가가 보이지 않게 된다고 하였다. 이름을 소리 나는 대로 옮기고 주석을 다는 것은 이국화이고, 낯선 것을 독자에게 익숙한 것으로 바꾸는 것은 저자를 독자 쪽으로 데려오는 자국화이다."},
{"id":"k291","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n여론은 사람들의 의견을 그저 더한 값이 아니다. 노엘레노이만의 ‘침묵의 나선’ 이론에 따르면 여론은 사람들이 서로의 눈치를 살피는 가운데 만들어진다. 이 이론의 출발점은 사람이 무리에서 따돌려지는 것을 두려워한다는 가정이다. 사람들은 이 두려움 때문에 어떤 의견이 늘고 있고 어떤 의견이 줄고 있는지를 끊임없이 살핀다.\n자기 의견이 다수이거나 늘어나는 쪽이라고 느끼는 사람은 그 의견을 거리낌 없이 말한다. 반대로 자기 의견이 소수이거나 줄어드는 쪽이라고 느끼는 사람은 입을 다문다. 그런데 한쪽이 크게 말하고 다른 쪽이 침묵하면, 말하는 쪽의 의견은 실제보다 더 우세해 보이고 침묵하는 쪽의 의견은 실제보다 더 약해 보인다. 그러면 침묵하던 사람들은 더욱 입을 닫고, 이 과정이 나선처럼 되풀이되면서 한쪽 의견이 사회의 지배적인 의견으로 굳어진다. 여기에서 중요한 것은 실제의 의견 분포가 아니라 사람들이 그 분포를 어떻게 느끼는가이다. 그 느낌을 만드는 데에는 대중 매체가 큰 구실을 한다. 매체가 어느 한쪽의 의견을 거듭 보여 주면 사람들은 그 의견이 다수라고 여기게 된다.\n그러나 모든 사람이 침묵의 나선에 빨려 드는 것은 아니다. 따돌림을 개의치 않고 끝까지 제 의견을 말하는 사람들이 있는데, 노엘레노이만은 이들을 ‘단단한 핵’이라고 불렀다. 또 이 이론은 옳고 그름이 걸려 있어 사람들이 민감하게 받아들이는 쟁점에 잘 들어맞으며, 취향의 문제처럼 의견이 달라도 따돌려질 염려가 없는 사안에는 잘 들어맞지 않는다.","opts":["실제로는 다수인 의견도 소수처럼 보이면 공개적으로 표현되는 일이 줄어들 수 있다.","좋아하는 음식에 관한 의견 차이는 침묵의 나선 이론으로 설명하기에 알맞은 사례일 것이다.","매체가 한쪽 의견만 되풀이하여 전하면 그와 다른 의견을 가진 사람은 말하기를 꺼리게 될 수 있다.","자기 의견이 줄어드는 쪽이라고 느끼면서도 굽히지 않고 공개적으로 말하는 사람은 ‘단단한 핵’에 해당할 것이다."],"ans":1,"exp":"이 이론은 취향의 문제처럼 의견이 달라도 따돌려질 염려가 없는 사안에는 잘 들어맞지 않는다고 하였으므로, 좋아하는 음식에 관한 의견 차이가 알맞은 사례라는 추론은 적절하지 않다. 중요한 것은 실제의 의견 분포가 아니라 사람들이 느끼는 분포이므로 다수 의견도 소수처럼 보이면 말하는 사람이 줄 수 있고, 매체가 한쪽 의견을 거듭 보여 주면 그 의견이 다수라고 여겨진다. 따돌림을 개의치 않고 끝까지 말하는 사람들이 '단단한 핵'이다."},
{"id":"k292","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n가사가 없는 기악 음악은 무엇을 나타내는가. 19세기 유럽에서는 이 물음을 두고 두 생각이 맞섰다. 한쪽은 음악이 시나 그림처럼 음악 바깥의 무언가를 그려 낼 수 있고 또 그래야 한다고 보았다. 이들은 곡에 제목을 붙이고 때로는 줄거리를 적은 글을 청중에게 나누어 주어, 음악이 어떤 장면이나 이야기를 따라가는지 알렸다. 이런 음악을 표제 음악이라고 한다. 베를리오즈는 「환상 교향곡」에서 한 예술가의 사랑과 환각을 다섯 악장의 이야기로 엮고, 사랑하는 여인을 나타내는 선율이 악장마다 모습을 바꾸어 나타나게 하였다.\n다른 쪽은 음악의 가치가 음들이 짜이는 방식 그 자체에 있다고 보았다. 비평가 한슬리크는 음악의 내용이 ‘울리면서 움직이는 형식’이라고 하였다. 그에 따르면 음악은 슬픔이나 그리움 같은 특정한 감정을 그려 낼 수 없다. 음악의 아름다움은 선율과 화성과 리듬이 맺는 관계에 있으며, 듣는 사람이 떠올리는 장면이나 감정은 음악에 딸린 것일 뿐 음악의 본질이 아니다. 제목이나 줄거리에 기대지 않는 이런 음악을 절대 음악이라고 한다.\n그러나 둘 사이의 금을 또렷이 긋기는 어렵다. 베토벤은 여섯째 교향곡에 ‘전원’이라는 제목을 붙이고 악장마다 ‘시냇가의 풍경’ 같은 말을 달았지만, 이 곡이 ‘그림이라기보다 느낌의 표현’이라고 적어 두었다. 제목이 있어도 음의 짜임만으로 충분히 들을 수 있는 곡이 있고, 제목이 없어도 듣는 이가 이야기를 떠올리는 곡이 있다.","opts":["한슬리크는 「환상 교향곡」의 아름다움도 음들이 짜인 방식에서 찾으려 할 것이다.","한슬리크는 듣는 사람이 곡을 들으며 떠올린 장면을 그 곡의 본질로 여길 것이다.","줄거리를 적은 글을 연주회의 청중에게 나누어 주는 것은 절대 음악을 따르는 태도일 것이다.","베토벤이 여섯째 교향곡에 적어 둔 말은 이 곡이 풍경을 눈에 보이듯 그려 낸 것임을 뜻할 것이다."],"ans":0,"exp":"한슬리크는 음악의 아름다움이 선율과 화성과 리듬이 맺는 관계에 있다고 보았으므로, 표제 음악인 「환상 교향곡」에 대해서도 아름다움을 음들의 짜임에서 찾으려 할 것이다. 그에게 듣는 사람이 떠올리는 장면은 음악에 딸린 것일 뿐 본질이 아니다. 줄거리를 적은 글을 나누어 주는 것은 표제 음악 쪽의 방식이고, 베토벤은 여섯째 교향곡이 그림이라기보다 느낌의 표현이라고 적었다."},
{"id":"k293","subj":"국어","unit":"국어학 지문","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n우리말에서 띄어쓰기의 단위는 단어이다. 다만 조사는 단어이면서도 홀로 쓰이지 못하므로 앞말에 붙여 쓴다. 의존 명사 역시 앞에 꾸며 주는 말이 있어야만 쓰이지만, 명사의 한 갈래이므로 앞말과 띄어 쓴다. 문제는 ‘만큼’, ‘대로’, ‘뿐’처럼 꼴이 같은 말이 조사로도 쓰이고 의존 명사로도 쓰이는 경우이다. 이때에는 앞에 오는 말이 무엇인지를 보면 된다.\n이 말들이 ‘나’, ‘법’, ‘셋’ 같은 체언 바로 뒤에 오면 조사이다. ‘나만큼 해 봐.’, ‘법대로 처리하자.’, ‘남은 것은 셋뿐이다.’에서는 모두 앞말에 붙여 쓴다. 반면 ‘먹을’, ‘본’, ‘웃을’처럼 용언의 어간에 ‘-ㄴ’, ‘-는’, ‘-ㄹ’ 따위가 붙어 뒷말을 꾸미는 말 뒤에 오면 의존 명사이다. ‘먹을 만큼 덜어라.’, ‘본 대로 말해라.’, ‘그저 웃을 뿐이다.’에서는 앞말과 띄어 쓴다.\n‘지’도 비슷하다. ‘집을 나선 지 삼 년이 되었다.’처럼 어떤 일이 있었던 때로부터 지금까지의 동안을 나타내는 ‘지’는 의존 명사이므로 띄어 쓴다. 그러나 ‘그가 갈지 모르겠다.’의 ‘지’는 막연한 의문을 나타내는 어미 ‘-ㄹ지’의 일부이므로 붙여 쓴다. 꼴은 같아도 앞의 ‘지’ 뒤에는 시간의 길이를 나타내는 말이 이어지고, 뒤의 ‘지’ 뒤에는 ‘모르다’, ‘알다’, ‘궁금하다’처럼 앎이나 물음과 관계된 말이 이어지는 일이 많다.","opts":["‘형’ 뒤에 ‘만큼’을 쓸 때에는 ‘형 만큼’으로 띄어 쓴다.","‘들은’ 뒤에 ‘대로’를 쓸 때에는 ‘들은 대로’로 띄어 쓴다.","‘비가 얼마나 올지 모른다.’의 ‘올지’는 ‘올 지’로 띄어 쓰지 않는다.","‘고향을 떠난 지 십 년이 넘었다.’의 ‘떠난 지’는 ‘떠난지’로 붙여 쓰지 않는다."],"ans":0,"exp":"'형'은 체언이므로 그 바로 뒤에 오는 '만큼'은 조사이고 '형만큼'으로 붙여 써야 한다. '들은'은 용언의 어간에 '-은'이 붙어 뒷말을 꾸미는 말이므로 뒤의 '대로'는 의존 명사여서 띄어 쓴다. '올지 모른다'의 '지'는 막연한 의문을 나타내는 어미의 일부이므로 붙여 쓰고, '떠난 지 십 년'의 '지'는 지금까지의 동안을 나타내는 의존 명사이므로 띄어 쓴다."},
{"id":"k294","subj":"국어","unit":"국어학 지문","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n국어의 로마자 표기는 글자를 하나하나 옮기는 것이 아니라 표준 발음에 따라 적는 것을 원칙으로 한다. 그래서 소리가 바뀌는 말은 바뀐 소리대로 적는다. ‘신라’는 [실라]로 소리 나므로 ‘Silla’로, ‘종로’는 [종노]로 소리 나므로 ‘Jongno’로 적는다. ‘해돋이’는 [해도지]로 소리 나므로 ‘haedoji’로 적는다. ‘ㄱ, ㄷ, ㅂ, ㅈ’이 ‘ㅎ’과 만나 거센소리로 나는 경우도 소리대로 적어서 ‘좋고[조코]’는 ‘joko’, ‘놓다[노타]’는 ‘nota’가 된다.\n그런데 이 원칙에는 두 가지 예외가 있다. 첫째, 체언에서 ‘ㄱ, ㄷ, ㅂ’ 뒤에 ‘ㅎ’이 따를 때에는 ‘ㅎ’을 밝혀 적는다. ‘묵호’는 [무코]로 소리 나지만 ‘Muko’가 아니라 ‘Mukho’로 적는다. 둘째, 된소리되기는 표기에 반영하지 않는다. ‘압구정’은 [압꾸정]으로, ‘울산’은 [울싼]으로 소리 나지만 ‘Apgujeong’, ‘Ulsan’으로 적는다.\n자음 가운데 ‘ㄱ, ㄷ, ㅂ’은 놓인 자리에 따라 달리 적는다. 모음 앞에서는 ‘g, d, b’로, 자음 앞이나 말의 끝에서는 ‘k, t, p’로 적는다. ‘구미’는 ‘Gumi’이고 ‘옥천’은 ‘Okcheon’, ‘합덕’은 ‘Hapdeok’이다. ‘ㄹ’은 모음 앞에서는 ‘r’로, 자음 앞이나 말의 끝에서는 ‘l’로 적되, ‘ㄹㄹ’은 ‘ll’로 적는다. ‘구리’는 ‘Guri’, ‘임실’은 ‘Imsil’, ‘울릉’은 ‘Ulleung’이다.","opts":["‘선릉[설릉]’은 ‘Seolleung’으로 적는다.","‘왕십리[왕심니]’는 ‘Wangsimni’로 적는다.","‘낙동강[낙똥강]’은 ‘Nakdonggang’으로 적는다.","‘집현전[지편전]’은 ‘Jipyeonjeon’으로 적는다."],"ans":3,"exp":"'집현전'은 체언이고 'ㅂ' 뒤에 'ㅎ'이 따르므로, [지편전]으로 소리 나더라도 'ㅎ'을 밝혀 'Jiphyeonjeon'으로 적어야 한다. '선릉'은 [설릉]의 'ㄹㄹ'을 'll'로 적고, '왕십리'는 바뀐 소리 [왕심니]대로 적는다. '낙동강'은 된소리되기를 반영하지 않고 자음 앞의 'ㄱ'을 'k'로 적어 'Nakdonggang'이 된다."},
{"id":"k295","subj":"국어","unit":"국어학 지문","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n문장의 주어가 가리키는 사람을 높이는 방법을 주체 높임이라고 한다. 주체 높임은 주로 서술어에 ‘-시-’를 넣어 나타낸다. ‘아버지가 오신다.’에서는 ‘오다’의 주체인 아버지를 높이려고 ‘-시-’를 썼다. 이처럼 높여야 할 사람을 직접 높이는 것이 직접 높임이다.\n그런데 ‘-시-’는 높여야 할 사람 자신이 아니라 그 사람의 몸의 일부, 그 사람이 지닌 물건, 그 사람의 생각이나 말처럼 그와 뗄 수 없이 가까운 것을 높임으로써 그 사람을 높이는 데에도 쓰인다. ‘할머니는 귀가 밝으시다.’에서 ‘밝다’의 주어는 ‘귀’이지만 귀를 높임으로써 할머니를 높인다. 이를 간접 높임이라고 한다.\n직접 높임과 간접 높임은 몇몇 서술어에서 꼴이 갈린다. ‘있다’를 높일 때 직접 높임에는 ‘계시다’를, 간접 높임에는 ‘있으시다’를 쓴다. ‘선생님은 지금 교실에 계신다.’는 선생님을 직접 높인 것이고, ‘선생님은 따님이 있으시다.’는 따님을 통해 선생님을 높인 것이다. 그러므로 ‘회장님의 말씀이 계시겠습니다.’는 알맞지 않다. ‘말씀’은 간접 높임의 대상이므로 ‘말씀이 있으시겠습니다.’라고 해야 한다. ‘아프다’도 직접 높임에는 ‘편찮으시다’를, 몸의 일부를 두고 하는 간접 높임에는 ‘아프시다’를 쓴다.\n간접 높임은 높여야 할 사람과 가까운 것에만 쓸 수 있다. 손님이 주문한 상품이나 치러야 할 값은 손님의 몸이나 소유물이 아니므로, 가게에서 흔히 듣는 ‘주문하신 커피 나오셨습니다.’나 ‘모두 만 원이십니다.’는 ‘-시-’를 잘못 넣은 말이다.","opts":["‘손님, 이 옷은 품절이십니다.’는 간접 높임을 알맞게 쓴 말이다.","‘할아버지께서는 수염이 많으시다.’는 할아버지를 직접 높인 말이다.","‘교수님은 댁에 책이 많이 계신다.’는 책을 통해 교수님을 높인 알맞은 말이다.","‘어머니는 어제부터 허리가 아프시다.’는 허리를 통해 어머니를 높인 알맞은 말이다."],"ans":3,"exp":"몸의 일부를 두고 하는 간접 높임에는 '아프시다'를 쓴다고 하였으므로, 허리를 높임으로써 어머니를 높인 '허리가 아프시다'는 알맞은 말이다. 가게의 옷은 손님의 몸이나 소유물이 아니므로 '품절이십니다'는 '-시-'를 잘못 넣은 말이고, '수염이 많으시다'는 수염을 통해 할아버지를 높인 간접 높임이다. 책을 통해 교수님을 높이는 간접 높임에는 '계시다'가 아니라 '있으시다'를 써야 한다."},
{"id":"k296","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n태양에서 오는 빛 가운데 가시광선의 보라색보다 파장이 짧아 눈에 보이지 않는 빛을 자외선이라고 한다. 자외선은 파장에 따라 A, B, C로 나뉜다. 파장이 가장 짧은 자외선 C는 에너지가 가장 크지만 대기의 오존층에서 거의 다 흡수되어 지표에 닿지 않는다. 우리 피부가 실제로 만나는 것은 자외선 A와 B이다.\n자외선 B는 파장이 짧고 에너지가 커서 피부의 겉쪽인 표피에 주로 작용한다. 한여름 바닷가에서 몇 시간 만에 피부가 벌겋게 달아오르고 물집이 잡히는 일광 화상은 대부분 ㉠ __이 빛__ 때문이다. 표피 세포의 유전 물질을 직접 손상하여 피부암의 원인이 되기도 한다. 다만 ㉡ __표피에서 주로 흡수되는 자외선__은 오존층과 구름, 유리에 상당 부분 가로막히므로 계절과 날씨, 시각에 따라 양이 크게 달라진다. 피부에서 비타민 D가 만들어지는 것도 자외선 B의 작용이다.\n자외선 A는 파장이 길어 에너지는 작지만 표피를 지나 그 아래의 진피까지 깊이 들어간다. 진피에서 피부의 탄력을 지탱하는 섬유를 서서히 망가뜨려 주름과 처짐 같은 피부 노화를 앞당기는 주된 원인으로 꼽힌다. 화상처럼 곧바로 드러나는 증상이 없어 알아차리기도 어렵다. 더구나 자외선 A는 ㉢ __화상을 주로 일으키는 자외선__과 달리 구름과 유리창을 잘 통과하고 계절에 따른 변화도 작다. 지표에 닿는 자외선의 대부분도 자외선 A이다. 그래서 흐린 날이나 실내의 창가에서도 ㉣ __진피까지 닿는 자외선__의 영향은 계속된다.\n자외선 차단제에 적힌 두 가지 표시는 이 둘에 각각 대응한다. SPF 뒤의 숫자는 자외선 B를 막는 정도를, PA 뒤의 + 개수는 자외선 A를 막는 정도를 나타낸다.","opts":["자외선 C는 에너지가 작아서 피부에 닿아도 해를 주지 않는다.","자외선 B는 A보다 피부 깊이 들어가지 못하지만 화상은 더 잘 일으킨다.","유리창 안쪽에 오래 앉아 있을 때 피부에 주로 닿는 자외선은 자외선 B이다.","SPF 뒤의 숫자는 자외선 A를, PA 뒤의 + 개수는 자외선 B를 막는 정도를 나타낸다."],"ans":1,"exp":"자외선 B는 표피에 주로 작용하고 일광 화상의 대부분을 일으키며, 자외선 A는 진피까지 깊이 들어가지만 화상처럼 곧바로 드러나는 증상이 없다. 자외선 C는 에너지가 가장 크고 오존층에서 흡수되어 지표에 닿지 않는다. 유리창을 잘 통과하는 것은 자외선 A이고, SPF 뒤의 숫자는 자외선 B를, PA 뒤의 + 개수는 자외선 A를 막는 정도를 나타낸다."},
{"id":"k297","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 가리키는 대상이 나머지와 다른 하나는?\n\n태양에서 오는 빛 가운데 가시광선의 보라색보다 파장이 짧아 눈에 보이지 않는 빛을 자외선이라고 한다. 자외선은 파장에 따라 A, B, C로 나뉜다. 파장이 가장 짧은 자외선 C는 에너지가 가장 크지만 대기의 오존층에서 거의 다 흡수되어 지표에 닿지 않는다. 우리 피부가 실제로 만나는 것은 자외선 A와 B이다.\n자외선 B는 파장이 짧고 에너지가 커서 피부의 겉쪽인 표피에 주로 작용한다. 한여름 바닷가에서 몇 시간 만에 피부가 벌겋게 달아오르고 물집이 잡히는 일광 화상은 대부분 ㉠ __이 빛__ 때문이다. 표피 세포의 유전 물질을 직접 손상하여 피부암의 원인이 되기도 한다. 다만 ㉡ __표피에서 주로 흡수되는 자외선__은 오존층과 구름, 유리에 상당 부분 가로막히므로 계절과 날씨, 시각에 따라 양이 크게 달라진다. 피부에서 비타민 D가 만들어지는 것도 자외선 B의 작용이다.\n자외선 A는 파장이 길어 에너지는 작지만 표피를 지나 그 아래의 진피까지 깊이 들어간다. 진피에서 피부의 탄력을 지탱하는 섬유를 서서히 망가뜨려 주름과 처짐 같은 피부 노화를 앞당기는 주된 원인으로 꼽힌다. 화상처럼 곧바로 드러나는 증상이 없어 알아차리기도 어렵다. 더구나 자외선 A는 ㉢ __화상을 주로 일으키는 자외선__과 달리 구름과 유리창을 잘 통과하고 계절에 따른 변화도 작다. 지표에 닿는 자외선의 대부분도 자외선 A이다. 그래서 흐린 날이나 실내의 창가에서도 ㉣ __진피까지 닿는 자외선__의 영향은 계속된다.\n자외선 차단제에 적힌 두 가지 표시는 이 둘에 각각 대응한다. SPF 뒤의 숫자는 자외선 B를 막는 정도를, PA 뒤의 + 개수는 자외선 A를 막는 정도를 나타낸다.","opts":["㉠","㉡","㉢","㉣"],"ans":3,"exp":"㉠, ㉡, ㉢은 표피에 주로 작용하여 일광 화상을 일으키는 자외선 B를 가리킨다. ㉣은 표피를 지나 진피까지 들어가고 구름과 유리창을 잘 통과하는 자외선 A이다."},
{"id":"k298","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n사람의 몸에는 약 24시간을 주기로 되풀이되는 변화가 있다. 잠들고 깨는 때, 체온, 호르몬의 분비가 하루를 단위로 오르내린다. 이를 일주기 리듬이라고 하며, 이 리듬을 만들어 내는 몸속의 장치를 생체 시계라고 부른다.\n생체 시계의 중심은 뇌의 시상 하부에 있는 시교차 상핵이다. 이곳의 신경 세포들은 바깥의 신호가 없어도 스스로 약 24시간 주기의 리듬을 만들어 낸다. 다만 이 주기는 정확히 24시간이 아니어서 그대로 두면 실제의 하루와 조금씩 어긋난다. 어긋남을 바로잡는 가장 강력한 신호가 빛이다. 눈의 망막으로 들어온 빛의 정보가 시교차 상핵에 전달되어 시계를 날마다 다시 맞춘다.\n시교차 상핵은 솔방울샘에 신호를 보내 멜라토닌의 분비를 조절한다. 멜라토닌은 어두워지면 분비가 늘어 몸에 밤이 왔음을 알리고, 빛을 받으면 분비가 억제된다. 밤늦게 밝은 화면을 오래 보면 잠들기 어려워지는 까닭이 여기에 있다.\n생체 시계와 바깥의 시간이 어긋나면 몸에 탈이 난다. 여러 시간대를 단숨에 건너는 비행 뒤에 겪는 시차증이 대표적이다. 생체 시계는 하루에 한 시간 안팎씩만 옮겨 갈 수 있어서 현지 시간에 맞춰지기까지 여러 날이 걸린다. 밤낮이 자주 바뀌는 교대 근무자도 비슷한 어려움을 겪는다. 이들에게는 일하는 시간에 밝은 빛을 쬐고 잠자는 시간에 빛을 철저히 가리는 것이 도움이 된다.","opts":["멜라토닌은 밝은 빛을 받을 때 분비가 늘어 몸을 깨어 있게 한다.","생체 시계는 빛이 전혀 들지 않는 곳에서는 리듬을 만들어 내지 못한다.","빛은 생체 시계의 주기와 실제 하루 사이의 어긋남을 바로잡는 구실을 한다.","시차증은 도착한 날에 생체 시계가 현지 시간에 곧바로 맞춰지기 때문에 생긴다."],"ans":2,"exp":"생체 시계의 주기는 정확히 24시간이 아니어서 실제 하루와 어긋나는데, 이를 바로잡는 가장 강력한 신호가 빛이라고 했다. 멜라토닌은 어두워지면 늘고 빛을 받으면 억제되며, 시교차 상핵은 바깥의 신호 없이도 리듬을 만든다. 시차증은 생체 시계가 하루에 한 시간 안팎씩만 옮겨 가 현지 시간에 늦게 맞춰지기 때문에 생긴다."},
{"id":"k299","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n다른 나라보다 어떤 물건을 더 적은 비용으로 만들 수 있을 때 그 나라는 그 물건에 절대 우위가 있다고 한다. 얼핏 생각하면 무역은 서로 절대 우위가 있는 물건을 맞바꿀 때에만 이로울 것 같다. 그렇다면 모든 물건을 남보다 잘 만드는 나라는 무역을 할 까닭이 없을 것이다. 그러나 비교 우위의 원리는 그런 나라도 무역으로 이익을 ㉠ __본다__는 것을 보여 준다.\n비교 우위는 기회비용으로 따진다. 어떤 물건의 기회비용이란 그것 하나를 더 만들기 위해 포기해야 하는 다른 물건의 양이다. 갑국에서는 노동자 한 사람이 하루에 옷 10벌 또는 쌀 10포대를 만들고, 을국에서는 옷 2벌 또는 쌀 6포대를 만든다고 하자. 갑국은 두 물건 모두에 절대 우위가 있다. 그런데 갑국에서 옷 1벌을 더 만들려면 쌀 1포대를 포기해야 하고, 을국에서는 쌀 3포대를 포기해야 한다. 옷의 기회비용은 갑국이 더 작다. 반대로 쌀 1포대의 기회비용은 갑국에서 옷 1벌, 을국에서 옷 3분의 1벌이므로 을국이 더 작다. 이때 갑국은 옷에, 을국은 쌀에 비교 우위가 있다고 한다.\n각 나라가 비교 우위가 있는 물건의 생산에 힘을 모은 뒤 서로 바꾸면 두 나라 모두 혼자서 만들 때보다 더 많이 소비할 수 있다. 갑국이 옷 1벌을 주고 쌀 2포대를 받는다고 하자. 갑국은 나라 안에서라면 옷 1벌로 쌀 1포대밖에 얻지 못하므로 이득이고, 을국은 나라 안에서라면 옷 1벌을 얻는 데 쌀 3포대를 들여야 하므로 역시 이득이다. 교환 비율이 두 나라의 기회비용 사이에 있는 한 무역은 양쪽 모두에 이롭다. 한 나라가 모든 물건에 절대 우위를 가질 수는 있어도 모든 물건에 비교 우위를 가질 수는 없다. 한 물건의 기회비용이 작으면 다른 물건의 기회비용은 클 수밖에 없기 때문이다.","opts":["을국은 두 물건 모두 생산 능력이 뒤지므로 무역에서 이익을 얻지 못한다.","옷 1벌에 쌀 4포대를 주어야 한다면 을국은 옷을 스스로 만드는 편이 낫다.","갑국은 쌀 1포대를 만드는 기회비용이 을국보다 작으므로 쌀에 비교 우위가 있다.","두 나라가 비교 우위에 따라 무역을 하면 갑국은 쌀의, 을국은 옷의 생산을 늘리게 된다."],"ans":1,"exp":"을국은 나라 안에서 쌀 3포대를 포기하면 옷 1벌을 만들 수 있으므로, 옷 1벌에 쌀 4포대를 주는 교환은 손해이다. 교환 비율이 두 나라의 기회비용(쌀 1포대와 3포대) 사이에 있어야 양쪽에 이롭다. 을국은 쌀에 비교 우위가 있어 무역으로 이익을 얻고, 쌀의 기회비용은 을국이 더 작다. 비교 우위에 따르면 갑국은 옷, 을국은 쌀의 생산을 늘린다."},
{"id":"k300","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n다른 나라보다 어떤 물건을 더 적은 비용으로 만들 수 있을 때 그 나라는 그 물건에 절대 우위가 있다고 한다. 얼핏 생각하면 무역은 서로 절대 우위가 있는 물건을 맞바꿀 때에만 이로울 것 같다. 그렇다면 모든 물건을 남보다 잘 만드는 나라는 무역을 할 까닭이 없을 것이다. 그러나 비교 우위의 원리는 그런 나라도 무역으로 이익을 ㉠ __본다__는 것을 보여 준다.\n비교 우위는 기회비용으로 따진다. 어떤 물건의 기회비용이란 그것 하나를 더 만들기 위해 포기해야 하는 다른 물건의 양이다. 갑국에서는 노동자 한 사람이 하루에 옷 10벌 또는 쌀 10포대를 만들고, 을국에서는 옷 2벌 또는 쌀 6포대를 만든다고 하자. 갑국은 두 물건 모두에 절대 우위가 있다. 그런데 갑국에서 옷 1벌을 더 만들려면 쌀 1포대를 포기해야 하고, 을국에서는 쌀 3포대를 포기해야 한다. 옷의 기회비용은 갑국이 더 작다. 반대로 쌀 1포대의 기회비용은 갑국에서 옷 1벌, 을국에서 옷 3분의 1벌이므로 을국이 더 작다. 이때 갑국은 옷에, 을국은 쌀에 비교 우위가 있다고 한다.\n각 나라가 비교 우위가 있는 물건의 생산에 힘을 모은 뒤 서로 바꾸면 두 나라 모두 혼자서 만들 때보다 더 많이 소비할 수 있다. 갑국이 옷 1벌을 주고 쌀 2포대를 받는다고 하자. 갑국은 나라 안에서라면 옷 1벌로 쌀 1포대밖에 얻지 못하므로 이득이고, 을국은 나라 안에서라면 옷 1벌을 얻는 데 쌀 3포대를 들여야 하므로 역시 이득이다. 교환 비율이 두 나라의 기회비용 사이에 있는 한 무역은 양쪽 모두에 이롭다. 한 나라가 모든 물건에 절대 우위를 가질 수는 있어도 모든 물건에 비교 우위를 가질 수는 없다. 한 물건의 기회비용이 작으면 다른 물건의 기회비용은 클 수밖에 없기 때문이다.","opts":["국이 싱거운지 숟가락으로 간을 __보았다__.","동생은 내일 오전에 입사 시험을 __본다__.","주말에는 할머니가 오셔서 아이를 __봐__ 주신다.","그 회사는 이번 거래에서 적지 않은 손해를 __보았다__."],"ans":3,"exp":"㉠의 '보다'는 '어떤 일을 당하거나 겪거나 얻어 가지다'라는 뜻으로, '손해를 보았다'의 '보다'와 같다. '간을 보다'는 맛을 알려고 조금 먹다, '시험을 보다'는 시험을 치르다, '아이를 보다'는 맡아서 보살피다의 뜻이다."},
{"id":"k301","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 가장 적절한 것은?\n\n하나의 문장이 둘 이상의 뜻으로 해석되는 성질을 중의성이라고 한다. 중의성은 생기는 원인에 따라 나눌 수 있다.\n어휘적 중의성은 문장에 쓰인 단어가 여러 뜻을 지녀서 생긴다. “길이 없다.”는 ‘길’이 ‘도로’인지 ‘방법’인지에 따라 뜻이 갈린다.\n구조적 중의성은 단어의 뜻은 분명한데 단어들이 맺는 문법적 관계가 둘 이상으로 분석되어 생긴다. “예쁜 친구의 동생을 만났다.”에서는 ‘예쁜’이 ‘친구’를 꾸미는지 ‘동생’을 꾸미는지 알 수 없다. “나는 형과 동생을 찾아다녔다.”는 내가 형과 함께 동생을 찾은 것인지, 내가 형과 동생 두 사람을 찾은 것인지 분명하지 않다. 비교하는 문장도 그렇다. “그는 나보다 축구를 더 좋아한다.”는 그가 나를 좋아하는 것보다 축구를 더 좋아한다는 뜻으로도, 내가 축구를 좋아하는 것보다 그가 축구를 더 좋아한다는 뜻으로도 읽힌다.\n영향권 중의성은 수량이나 부정을 나타내는 말이 문장의 어디까지 영향을 미치는지가 달라서 생긴다. “손님이 다 오지 않았다.”는 ‘한 명도 오지 않았다’로도, ‘일부만 왔다’로도 읽힌다.\n구조적 중의성과 영향권 중의성은 쉼표를 찍거나, 어순을 바꾸거나, 보조사를 넣어 해소할 수 있다. “예쁜, 친구의 동생”이라고 쓰면 꾸밈을 받는 말이 ‘동생’임이 드러나고, “손님이 다는 오지 않았다.”라고 하면 ‘일부만 왔다’는 뜻만 남는다. 그러나 어휘적 중의성은 이런 방법으로 해소되지 않으며, 다른 단어로 바꾸거나 앞뒤에 문맥을 보태야 한다.","opts":["“배가 정말 크다.”의 중의성은 쉼표를 찍어서 해소할 수 있다.","“용감한 그의 아버지는 적을 물리쳤다.”에는 영향권 중의성이 있다.","“회원들이 모두 참석하지 않았다.”는 단어의 뜻이 여럿이어서 중의성이 생긴다.","“아내는 나보다 드라마를 더 좋아한다.”는 문법적 관계가 둘 이상으로 분석되는 문장이다."],"ans":3,"exp":"“아내는 나보다 드라마를 더 좋아한다.”는 ‘그는 나보다 축구를 더 좋아한다.’와 같은 비교 문장으로, 비교 대상이 둘로 분석되는 구조적 중의성을 지닌다. “배가 정말 크다.”는 ‘배’의 뜻이 여럿인 어휘적 중의성이어서 쉼표로는 해소되지 않는다. “용감한 그의 아버지”는 꾸밈 관계가 둘인 구조적 중의성이고, “모두 참석하지 않았다.”는 부정이 미치는 범위에 따른 영향권 중의성이다."},
{"id":"k302","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 추론한 내용으로 적절하지 않은 것은?\n\n국어에서는 두 자음이 ㉠ __연속될__ 때 발음하기 쉽도록 한쪽이 다른 쪽을 닮아 바뀌는 일이 흔하다. 대표적인 것이 비음화와 유음화이다.\n비음화는 비음이 아닌 자음이 비음을 만나 비음으로 바뀌는 현상이다. 받침소리 ‘ㄱ, ㄷ, ㅂ’은 뒤에 오는 ‘ㄴ, ㅁ’의 영향을 받아 각각 같은 자리에서 나는 비음 ‘ㅇ, ㄴ, ㅁ’으로 ㉡ __교체된다__. ‘국물’이 [궁물]로, ‘닫는’이 [단는]으로, ‘밥물’이 [밤물]로 소리 나는 것이 그 예이다. 받침이 이 셋이 아니더라도 먼저 셋 가운데 하나로 바뀐 뒤에 비음화가 일어난다. ‘앞마당’은 받침 ‘ㅍ’이 ‘ㅂ’으로 바뀐 다음 [암마당]이 되고, ‘꽃망울’은 받침 ‘ㅊ’이 ‘ㄷ’으로 바뀐 다음 [꼰망울]이 된다.\n‘ㄹ’도 비음으로 바뀌는 일이 있다. 받침 ‘ㅁ, ㅇ’ 뒤에 오는 ‘ㄹ’은 ‘ㄴ’으로 바뀌어 ‘담력’이 [담녁], ‘종로’가 [종노]로 소리 난다. 받침 ‘ㄱ, ㅂ’ 뒤에서도 ‘ㄹ’이 ‘ㄴ’으로 바뀌는데, 이때는 바뀐 ‘ㄴ’ 때문에 앞의 받침이 다시 비음으로 바뀐다. ‘국력’이 [궁녁], ‘협력’이 [혐녁]으로 소리 나는 까닭이다.\n유음화는 ‘ㄴ’이 유음 ‘ㄹ’의 앞이나 뒤에서 ‘ㄹ’로 바뀌는 현상이다. ‘신라’는 [실라]로, ‘칼날’은 [칼랄]로 소리 난다. 그런데 ‘ㄴ’과 ‘ㄹ’이 만난다고 언제나 유음화가 ㉢ __발생하는__ 것은 아니다. ‘ㄴ’으로 끝나는 단어 뒤에 ‘란, 량, 력, 론’처럼 ‘ㄹ’로 시작하는 한 글자 한자어가 ㉣ __결합하여__ 새말이 될 때는 거꾸로 ‘ㄹ’이 ‘ㄴ’으로 바뀐다. ‘의견’에 ‘란’이 붙은 ‘의견란’은 [의견난]으로, ‘생산’에 ‘량’이 붙은 ‘생산량’은 [생산냥]으로 발음한다.","opts":["‘물난리’는 ‘ㄹ’ 뒤의 ‘ㄴ’이 그대로 남아 [물난리]로 발음된다.","‘음운론’은 ‘음운’에 ‘론’이 붙은 말이므로 [으문논]으로 발음된다.","‘부엌문’은 받침 ‘ㅋ’이 ‘ㄱ’으로 바뀐 뒤 비음화가 일어나 [부엉문]으로 발음된다.","‘섭리’는 ‘ㄹ’이 ‘ㄴ’으로 바뀌고 그 때문에 받침 ‘ㅂ’이 ‘ㅁ’으로 바뀌어 [섬니]로 발음된다."],"ans":0,"exp":"‘ㄴ’은 ‘ㄹ’의 앞이나 뒤에서 ‘ㄹ’로 바뀌므로 ‘물난리’는 ‘칼날[칼랄]’처럼 [물랄리]로 발음된다. ‘음운론’은 ‘ㄴ’으로 끝나는 단어에 ‘론’이 붙은 말이어서 ‘ㄹ’이 ‘ㄴ’으로 바뀌고, ‘부엌문’은 받침이 ‘ㄱ’으로 바뀐 뒤 ‘ㅁ’ 앞에서 ‘ㅇ’이 된다. ‘섭리’는 ‘협력[혐녁]’과 같은 과정을 거친다."},
{"id":"k303","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n국어에서는 두 자음이 ㉠ __연속될__ 때 발음하기 쉽도록 한쪽이 다른 쪽을 닮아 바뀌는 일이 흔하다. 대표적인 것이 비음화와 유음화이다.\n비음화는 비음이 아닌 자음이 비음을 만나 비음으로 바뀌는 현상이다. 받침소리 ‘ㄱ, ㄷ, ㅂ’은 뒤에 오는 ‘ㄴ, ㅁ’의 영향을 받아 각각 같은 자리에서 나는 비음 ‘ㅇ, ㄴ, ㅁ’으로 ㉡ __교체된다__. ‘국물’이 [궁물]로, ‘닫는’이 [단는]으로, ‘밥물’이 [밤물]로 소리 나는 것이 그 예이다. 받침이 이 셋이 아니더라도 먼저 셋 가운데 하나로 바뀐 뒤에 비음화가 일어난다. ‘앞마당’은 받침 ‘ㅍ’이 ‘ㅂ’으로 바뀐 다음 [암마당]이 되고, ‘꽃망울’은 받침 ‘ㅊ’이 ‘ㄷ’으로 바뀐 다음 [꼰망울]이 된다.\n‘ㄹ’도 비음으로 바뀌는 일이 있다. 받침 ‘ㅁ, ㅇ’ 뒤에 오는 ‘ㄹ’은 ‘ㄴ’으로 바뀌어 ‘담력’이 [담녁], ‘종로’가 [종노]로 소리 난다. 받침 ‘ㄱ, ㅂ’ 뒤에서도 ‘ㄹ’이 ‘ㄴ’으로 바뀌는데, 이때는 바뀐 ‘ㄴ’ 때문에 앞의 받침이 다시 비음으로 바뀐다. ‘국력’이 [궁녁], ‘협력’이 [혐녁]으로 소리 나는 까닭이다.\n유음화는 ‘ㄴ’이 유음 ‘ㄹ’의 앞이나 뒤에서 ‘ㄹ’로 바뀌는 현상이다. ‘신라’는 [실라]로, ‘칼날’은 [칼랄]로 소리 난다. 그런데 ‘ㄴ’과 ‘ㄹ’이 만난다고 언제나 유음화가 ㉢ __발생하는__ 것은 아니다. ‘ㄴ’으로 끝나는 단어 뒤에 ‘란, 량, 력, 론’처럼 ‘ㄹ’로 시작하는 한 글자 한자어가 ㉣ __결합하여__ 새말이 될 때는 거꾸로 ‘ㄹ’이 ‘ㄴ’으로 바뀐다. ‘의견’에 ‘란’이 붙은 ‘의견란’은 [의견난]으로, ‘생산’에 ‘량’이 붙은 ‘생산량’은 [생산냥]으로 발음한다.","opts":["㉠: 잇따를","㉡: 없어진다","㉢: 일어나는","㉣: 붙어"],"ans":1,"exp":"‘교체되다’는 어떤 것이 다른 것으로 바뀐다는 뜻이므로 ‘바뀐다’와 통하고, 소리가 아예 사라진다는 뜻의 ‘없어진다’와는 바꿔 쓸 수 없다. ‘연속될’은 ‘잇따를’, ‘발생하는’은 ‘일어나는’, ‘결합하여’는 ‘붙어’와 뜻이 통한다."},
{"id":"k304","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n어떤 상품의 수요는 그 상품의 값뿐 아니라 관련된 다른 상품의 값과 소비자의 소득에 따라서도 달라진다.\n두 상품이 서로 비슷한 쓸모를 지녀 한쪽을 다른 쪽 대신 쓸 수 있을 때 둘을 대체재라고 한다. 버터와 마가린, 쇠고기와 돼지고기가 그 예이다. 대체재 관계에서는 한 상품의 값이 오르면 사람들이 다른 상품으로 옮겨 가므로 다른 상품의 수요가 늘어난다. 반대로 두 상품을 함께 써야 쓸모가 커질 때 둘을 보완재라고 한다. 프린터와 잉크, 자동차와 휘발유가 그렇다. 보완재 관계에서는 한 상품의 값이 오르면 그 상품을 덜 사게 되고, 함께 쓰는 다른 상품의 수요도 줄어든다.\n소득과의 관계로도 상품을 나눌 수 있다. 소득이 늘 때 수요가 함께 늘어나는 상품을 정상재라고 하며 대부분의 상품이 여기에 든다. 반면 소득이 늘면 오히려 수요가 줄어드는 상품이 있는데 이를 열등재라고 한다. 형편이 나아지면 더 나은 것으로 바꾸어 쓰게 되는 상품이 그렇다. 주의할 점은 열등재가 품질이 나쁜 상품이라는 뜻이 아니라는 것이다. 어떤 상품이 정상재인지 열등재인지는 상품에 붙박인 성질이 아니라 소비자의 형편에 따라 달라진다. 버스는 승용차를 살 여유가 생긴 사람에게는 열등재이지만, 걸어 다니다가 버스를 타게 된 사람에게는 정상재이다.","opts":["소득이 늘자 라면을 덜 사게 된 사람에게 라면은 열등재이다.","휴대 전화의 값이 내리면 함께 쓰는 휴대 전화 덮개의 수요는 줄어든다.","커피 값이 올랐을 때 설탕의 수요가 줄었다면 커피와 설탕은 보완재 관계이다.","닭고기 값이 내렸을 때 돼지고기의 수요가 줄었다면 닭고기와 돼지고기는 대체재 관계이다."],"ans":1,"exp":"보완재 관계에서는 한 상품의 값이 오르면 함께 쓰는 상품의 수요가 줄어들므로, 반대로 휴대 전화의 값이 내리면 휴대 전화가 더 팔리고 덮개의 수요도 늘어난다. 소득이 늘 때 수요가 줄면 그 사람에게 열등재이고, 한 상품의 값이 오를 때 다른 상품의 수요가 줄면 보완재이다. 닭고기 값이 내려 사람들이 닭고기로 옮겨 가 돼지고기 수요가 줄었다면 둘은 대체재이다."},
{"id":"k305","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n가격이 오르면 수요량이 줄어든다는 것은 누구나 안다. 그러나 얼마나 줄어드는지는 상품마다 다르다. 가격 변화에 수요량이 얼마나 민감하게 반응하는지를 나타내는 것이 수요의 가격 탄력성이며, 수요량의 변화율을 가격의 변화율로 나눈 값의 크기로 잰다. 이 값이 1보다 크면 수요가 탄력적이라 하고, 1보다 작으면 비탄력적이라 한다. 가격이 10% 올랐을 때 수요량이 20% 줄면 탄력적이고, 5%만 줄면 비탄력적이다.\n탄력성은 대체로 대신 쓸 수 있는 상품이 많을수록, 그리고 없어도 살 수 있는 상품일수록 크다. 특정 상표의 과자는 값이 오르면 다른 과자로 바꾸면 되지만, 쌀이나 수돗물 같은 필수품은 값이 올라도 소비를 크게 줄이기 어렵다. 시간도 영향을 준다. 휘발유 값이 올라도 당장은 타던 차를 계속 몰 수밖에 없지만, 기간이 길어지면 연비가 좋은 차로 바꾸거나 대중교통을 이용하는 사람이 늘어 수요량이 더 많이 줄어든다.\n탄력성은 판매자의 수입과도 관계가 있다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 값을 올리면 판매량이 그보다 큰 비율로 줄어 수입이 감소하고, 비탄력적인 상품은 값을 올려도 판매량이 조금만 줄어 수입이 증가한다. 풍년이 들어 농산물 값이 크게 ㉠ __떨어지면__ 농가의 수입이 오히려 줄어드는 일이 생기는 것도 농산물의 수요가 비탄력적이기 때문이다. 값이 내려도 사람들이 먹는 양을 그만큼 늘리지는 않는 것이다.","opts":["가격이 10% 오를 때 수요량이 15% 줄어드는 상품의 수요는 탄력적이다.","수요가 비탄력적인 상품은 값을 내리면 판매량이 늘어 판매 수입이 증가한다.","휘발유의 수요는 값이 오른 직후보다 오랜 기간이 지난 뒤에 더 탄력적으로 나타난다.","대신 쓸 상품을 구하기 쉬운 상품은 그렇지 않은 상품보다 수요의 가격 탄력성이 큰 편이다."],"ans":1,"exp":"수요가 비탄력적이면 값이 내려도 판매량이 그보다 작은 비율로만 늘어 판매 수입은 줄어든다. 풍년에 농산물 값이 떨어지면 농가의 수입이 줄어드는 것이 그 예이다. 수요량의 변화율(15%)이 가격의 변화율(10%)보다 크면 탄력적이고, 기간이 길수록, 대신 쓸 상품이 많을수록 탄력성이 크다는 것은 글의 내용과 맞는다."},
{"id":"k306","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n가격이 오르면 수요량이 줄어든다는 것은 누구나 안다. 그러나 얼마나 줄어드는지는 상품마다 다르다. 가격 변화에 수요량이 얼마나 민감하게 반응하는지를 나타내는 것이 수요의 가격 탄력성이며, 수요량의 변화율을 가격의 변화율로 나눈 값의 크기로 잰다. 이 값이 1보다 크면 수요가 탄력적이라 하고, 1보다 작으면 비탄력적이라 한다. 가격이 10% 올랐을 때 수요량이 20% 줄면 탄력적이고, 5%만 줄면 비탄력적이다.\n탄력성은 대체로 대신 쓸 수 있는 상품이 많을수록, 그리고 없어도 살 수 있는 상품일수록 크다. 특정 상표의 과자는 값이 오르면 다른 과자로 바꾸면 되지만, 쌀이나 수돗물 같은 필수품은 값이 올라도 소비를 크게 줄이기 어렵다. 시간도 영향을 준다. 휘발유 값이 올라도 당장은 타던 차를 계속 몰 수밖에 없지만, 기간이 길어지면 연비가 좋은 차로 바꾸거나 대중교통을 이용하는 사람이 늘어 수요량이 더 많이 줄어든다.\n탄력성은 판매자의 수입과도 관계가 있다. 판매 수입은 가격에 판매량을 곱한 값이다. 수요가 탄력적인 상품은 값을 올리면 판매량이 그보다 큰 비율로 줄어 수입이 감소하고, 비탄력적인 상품은 값을 올려도 판매량이 조금만 줄어 수입이 증가한다. 풍년이 들어 농산물 값이 크게 ㉠ __떨어지면__ 농가의 수입이 오히려 줄어드는 일이 생기는 것도 농산물의 수요가 비탄력적이기 때문이다. 값이 내려도 사람들이 먹는 양을 그만큼 늘리지는 않는 것이다.","opts":["약을 먹어도 감기가 __떨어지지__ 않는다.","그는 이번에도 입사 시험에서 __떨어졌다__.","밤사이 기온이 영하로 __떨어져__ 수도관이 얼었다.","우리 집은 지하철역에서 꽤 멀리 __떨어져__ 있는 편이다."],"ans":2,"exp":"㉠의 '떨어지다'는 '값, 기온, 수준 따위가 낮아지거나 내려가다'라는 뜻으로, '기온이 영하로 떨어져'의 '떨어지다'와 같다. '감기가 떨어지다'는 병이나 습관 따위가 없어지다, '시험에서 떨어지다'는 시험이나 선발에 뽑히지 못하다, '멀리 떨어져 있다'는 일정한 거리를 두고 있다는 뜻이다."},
{"id":"k307","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n크기가 5밀리미터보다 작은 플라스틱 조각을 미세 플라스틱이라고 한다. 생겨난 경로에 따라 둘로 나눈다. 1차 미세 플라스틱은 처음부터 작게 만들어진 것이다. 세안제나 치약에 넣던 알갱이, 플라스틱 제품의 원료로 쓰는 작은 알갱이가 여기에 든다. 2차 미세 플라스틱은 큰 플라스틱 제품이 쓰이거나 버려진 뒤에 잘게 부서져 생긴 것이다. 바다에 떠다니는 병과 그물, 비닐봉지가 햇빛의 자외선과 파도에 삭아 부서진 조각이 그 예이다.\n두 가지는 줄이는 방법이 다르다. 1차 미세 플라스틱은 누가 어디에 넣는지가 분명하므로 제품에 넣지 못하게 막으면 된다. 실제로 여러 나라가 씻어 내는 화장품에 플라스틱 알갱이를 쓰지 못하게 하였다. 반면 2차 미세 플라스틱은 이미 쓰이고 버려진 수많은 제품에서 조금씩, 곳곳에서 생겨나므로 한 가지 규제로 막기 어렵다. 플라스틱 사용량 자체를 줄이고, 버려진 것이 자연으로 흘러들기 전에 거두어들이는 수밖에 없다.\n미세 플라스틱이 걱정스러운 까닭은 잘 썩지 않아 오래 남고, 한번 퍼지면 거두어들일 길이 거의 없기 때문이다. 작은 생물이 먹이로 잘못 알고 삼키면 먹이 사슬을 따라 더 큰 생물로 옮겨 간다. 다만 사람의 몸에 얼마나 들어오고 건강에 어떤 영향을 주는지는 아직 연구가 진행 중이어서 단정하기 어렵다.","opts":["미세 플라스틱이 사람의 건강에 미치는 영향은 이미 분명하게 밝혀졌다.","버려진 플라스틱 상자가 바닷가에서 부서져 생긴 조각은 2차 미세 플라스틱이다.","2차 미세 플라스틱은 생겨나는 곳이 흩어져 있어 1차 미세 플라스틱보다 규제로 막기 어렵다.","제품에 플라스틱 알갱이를 넣지 못하게 하는 규제는 1차 미세 플라스틱을 줄이는 데 알맞은 방법이다."],"ans":0,"exp":"사람의 몸에 얼마나 들어오고 건강에 어떤 영향을 주는지는 아직 연구가 진행 중이어서 단정하기 어렵다고 했다. 큰 제품이 버려진 뒤 부서져 생긴 조각은 2차 미세 플라스틱이고, 2차는 곳곳에서 조금씩 생겨 한 가지 규제로 막기 어렵다. 1차는 넣는 곳이 분명하므로 제품에 넣지 못하게 막으면 된다."},
{"id":"k308","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n컴퓨터의 기억 장치는 맡은 일에 따라 주기억 장치와 보조 기억 장치로 나뉜다. 흔히 램이라고 부르는 주기억 장치는 중앙 처리 장치가 지금 처리하고 있는 프로그램과 자료를 올려 두는 곳이다. 중앙 처리 장치는 이곳에 있는 내용만 직접 읽고 쓸 수 있다. 주기억 장치는 읽고 쓰는 속도가 매우 빠르지만 전원이 꺼지면 담긴 내용이 모두 사라진다. 같은 용량이라면 값도 비싸다.\n하드 디스크나 에스에스디(SSD) 같은 보조 기억 장치는 전원이 꺼져도 내용이 남는다. 값이 싸서 큰 용량을 갖추기 쉽지만 주기억 장치에 견주면 읽고 쓰는 속도가 훨씬 느리다. 그래서 프로그램과 파일은 평소에 ㉠ __전원이 없어도 내용을 지키는 장치__에 보관해 두었다가, 실행할 때 필요한 부분만 주기억 장치로 옮겨 온다. 프로그램을 처음 열 때 시간이 걸리는 것은 이 옮기는 과정 때문이다. 문서를 고치는 동안 바뀐 내용은 ㉡ __중앙 처리 장치가 직접 읽고 쓰는 곳__에만 있으며, ‘저장’을 해야 비로소 보조 기억 장치에 기록된다.\n여러 프로그램을 한꺼번에 열어 주기억 장치가 가득 차면 컴퓨터는 가상 메모리라는 방법을 쓴다. ㉢ __느리지만 넉넉한 저장 공간__의 일부를 주기억 장치처럼 빌려 쓰는 것이다. 당장 쓰지 않는 내용을 ㉣ __그쪽__으로 내보내 자리를 만들고, 다시 필요해지면 불러들인다. 덕분에 프로그램이 멈추지는 않지만, 느린 장치를 오가야 하므로 컴퓨터 전체가 눈에 띄게 굼떠진다. 이럴 때 주기억 장치의 용량을 늘리면 내보내고 불러들이는 일이 줄어 속도가 되살아난다.","opts":["문서를 고치다가 저장하지 않은 채 전원이 끊기면 고친 내용은 사라진다.","보조 기억 장치를 더 빠른 것으로 바꾸면 프로그램을 처음 여는 시간이 줄어든다.","주기억 장치가 남아도는 컴퓨터는 주기억 장치를 더 늘려도 속도가 크게 빨라지지 않는다.","가상 메모리를 쓰면 보조 기억 장치가 주기억 장치 구실을 하므로 컴퓨터의 속도가 떨어지지 않는다."],"ans":3,"exp":"가상 메모리는 느린 보조 기억 장치의 일부를 주기억 장치처럼 빌려 쓰는 것이어서, 프로그램이 멈추지는 않지만 느린 장치를 오가느라 컴퓨터가 굼떠진다. 저장하지 않은 내용은 전원이 꺼지면 사라지는 주기억 장치에만 있고, 프로그램을 처음 열 때는 보조 기억 장치에서 옮겨 오는 시간이 걸린다. 주기억 장치를 늘려 빨라지는 것은 내보내고 불러들이는 일이 줄기 때문이므로, 그런 일이 없는 컴퓨터에서는 효과가 작다."},
{"id":"k309","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 가리키는 대상이 나머지와 다른 하나는?\n\n컴퓨터의 기억 장치는 맡은 일에 따라 주기억 장치와 보조 기억 장치로 나뉜다. 흔히 램이라고 부르는 주기억 장치는 중앙 처리 장치가 지금 처리하고 있는 프로그램과 자료를 올려 두는 곳이다. 중앙 처리 장치는 이곳에 있는 내용만 직접 읽고 쓸 수 있다. 주기억 장치는 읽고 쓰는 속도가 매우 빠르지만 전원이 꺼지면 담긴 내용이 모두 사라진다. 같은 용량이라면 값도 비싸다.\n하드 디스크나 에스에스디(SSD) 같은 보조 기억 장치는 전원이 꺼져도 내용이 남는다. 값이 싸서 큰 용량을 갖추기 쉽지만 주기억 장치에 견주면 읽고 쓰는 속도가 훨씬 느리다. 그래서 프로그램과 파일은 평소에 ㉠ __전원이 없어도 내용을 지키는 장치__에 보관해 두었다가, 실행할 때 필요한 부분만 주기억 장치로 옮겨 온다. 프로그램을 처음 열 때 시간이 걸리는 것은 이 옮기는 과정 때문이다. 문서를 고치는 동안 바뀐 내용은 ㉡ __중앙 처리 장치가 직접 읽고 쓰는 곳__에만 있으며, ‘저장’을 해야 비로소 보조 기억 장치에 기록된다.\n여러 프로그램을 한꺼번에 열어 주기억 장치가 가득 차면 컴퓨터는 가상 메모리라는 방법을 쓴다. ㉢ __느리지만 넉넉한 저장 공간__의 일부를 주기억 장치처럼 빌려 쓰는 것이다. 당장 쓰지 않는 내용을 ㉣ __그쪽__으로 내보내 자리를 만들고, 다시 필요해지면 불러들인다. 덕분에 프로그램이 멈추지는 않지만, 느린 장치를 오가야 하므로 컴퓨터 전체가 눈에 띄게 굼떠진다. 이럴 때 주기억 장치의 용량을 늘리면 내보내고 불러들이는 일이 줄어 속도가 되살아난다.","opts":["㉠","㉡","㉢","㉣"],"ans":1,"exp":"㉠, ㉢, ㉣은 전원이 꺼져도 내용이 남고 용량이 크지만 느린 보조 기억 장치를 가리킨다. ㉡은 중앙 처리 장치가 직접 읽고 쓰는 주기억 장치이다."},
{"id":"k310","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 적절하지 않은 것은?\n\n주어가 제힘으로 동작을 하는 것을 능동, 주어가 남의 동작을 받거나 당하는 것을 피동이라고 한다. “경찰이 도둑을 잡았다.”는 능동문이고 “도둑이 경찰에게 잡혔다.”는 피동문이다. 능동문의 목적어가 피동문의 주어가 되고, 능동문의 주어는 ‘에게’나 ‘에 의해’가 붙은 부사어가 된다.\n피동을 나타내는 방법에는 타동사의 어간에 접미사 ‘-이-, -히-, -리-, -기-’를 붙이는 파생적 피동과, 어간에 ‘-어지다’를 붙이는 통사적 피동이 있다. ‘보이다, 잡히다, 들리다, 쫓기다’는 앞의 예이고 ‘만들어지다, 지워지다’는 뒤의 예이다. ‘-어지다’는 형용사에도 붙는데, ‘밝아지다’처럼 이때는 피동이 아니라 상태가 변함을 나타낸다.\n피동은 한 번만 표시하면 된다. 그런데 이미 피동 접미사가 붙은 말에 ‘-어지다’를 또 붙여 쓰는 일이 있다. ‘잊히다’로 충분한데 ‘잊혀지다’라고 하거나 ‘보이다’를 ‘보여지다’라고 하는 것이다. 이를 이중 피동이라고 하며 규범에 맞지 않는 표현으로 본다.\n한편 피동문 가운데는 대응하는 능동문을 세우기 어려운 것도 있다. “날씨가 풀렸다.”는 누가 날씨를 풀었다고 말할 수 없다. 이런 문장은 누가 그 일을 했는지를 문제 삼지 않고 일이 저절로 그렇게 되었음을 나타낸다.","opts":["‘닫혀지다’는 ‘닫히다’에 ‘-어지다’가 다시 붙은 이중 피동이다.","‘넓어지다’는 형용사에 ‘-어지다’가 붙은 말이므로 통사적 피동에 해당한다.","“아기가 엄마에게 안겼다.”는 “엄마가 아기를 안았다.”에 대응하는 파생적 피동문이다.","“이 글은 십 년 전에 쓰였다.”의 ‘쓰였다’를 ‘쓰여졌다’로 바꾸면 피동을 두 번 표시한 것이 된다."],"ans":1,"exp":"‘-어지다’가 형용사에 붙으면 ‘밝아지다’처럼 피동이 아니라 상태의 변화를 나타내므로, ‘넓어지다’는 통사적 피동이 아니다. ‘닫혀지다’와 ‘쓰여지다’는 피동 접미사가 붙은 ‘닫히다’, ‘쓰이다’에 ‘-어지다’를 또 붙인 이중 피동이다. ‘안기다’는 ‘안다’에 ‘-기-’가 붙은 파생적 피동이고 능동문의 목적어 ‘아기’가 주어가 되었다."},
{"id":"k311","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n지구는 태양에서 오는 에너지를 받아 데워지고, 받은 만큼의 에너지를 우주로 내보내 온도를 일정하게 ㉠ __유지한다__. 태양에서 오는 빛은 가시광선을 중심으로 한 파장이 짧은 빛이어서 대기를 대부분 그대로 지나 지표에 닿는다. 데워진 지표는 파장이 긴 적외선의 형태로 에너지를 내보내는데, 대기 중의 수증기, 이산화 탄소, 메테인 같은 기체가 이 적외선의 일부를 ㉡ __흡수했다가__ 다시 사방으로 내놓는다. 그 가운데 지표 쪽으로 되돌아온 에너지가 지표를 한 번 더 데운다. 이것이 온실 효과이고, 이런 일을 하는 기체를 온실 기체라고 한다.\n온실 효과 자체는 해로운 것이 아니다. 온실 효과가 없다면 지구의 평균 기온은 영하 18도쯤일 것으로 계산되는데 실제로는 영상 15도 안팎이다. 온실 효과가 있기에 물이 액체로 존재하고 생물이 살 수 있는 것이다. 문제가 되는 것은 인간의 활동으로 온실 기체가 늘어나 온실 효과가 강해지는 현상, 곧 지구 온난화이다. 산업화 이후 석탄과 석유를 대량으로 태우면서 대기 중 이산화 탄소의 농도가 꾸준히 높아졌고 지구의 평균 기온도 함께 올랐다.\n온실 기체마다 성질은 다르다. 메테인은 같은 양의 이산화 탄소보다 열을 붙잡는 힘이 훨씬 세지만 대기에 머무는 기간은 십여 년으로 짧다. 이산화 탄소는 붙잡는 힘은 약해도 배출량이 압도적으로 많고 수백 년 넘게 대기에 ㉢ __잔류한다__. 그래서 메테인을 줄이면 비교적 빨리 효과가 나타나지만, 온난화를 장기적으로 ㉣ __억제하려면__ 이산화 탄소의 배출을 줄이는 일을 피할 수 없다.","opts":["지구 온난화는 본래 있던 온실 효과가 더 강해지는 현상이다.","온실 효과가 없었다면 지구의 평균 기온은 지금보다 높았을 것이다.","온실 기체는 태양에서 오는 가시광선을 흡수하여 지표를 직접 데운다.","메테인은 이산화 탄소보다 대기에 오래 남아 장기적인 온난화의 주된 원인이 된다."],"ans":0,"exp":"온실 효과는 본래부터 있어 지구를 살 만한 온도로 지켜 주는 것이고, 인간의 활동으로 온실 기체가 늘어 그 효과가 강해지는 현상이 지구 온난화이다. 온실 효과가 없으면 기온은 영하 18도쯤으로 지금보다 낮고, 온실 기체가 흡수하는 것은 지표가 내보내는 적외선이다. 메테인은 대기에 머무는 기간이 십여 년으로 이산화 탄소보다 짧다."},
{"id":"k312","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n지구는 태양에서 오는 에너지를 받아 데워지고, 받은 만큼의 에너지를 우주로 내보내 온도를 일정하게 ㉠ __유지한다__. 태양에서 오는 빛은 가시광선을 중심으로 한 파장이 짧은 빛이어서 대기를 대부분 그대로 지나 지표에 닿는다. 데워진 지표는 파장이 긴 적외선의 형태로 에너지를 내보내는데, 대기 중의 수증기, 이산화 탄소, 메테인 같은 기체가 이 적외선의 일부를 ㉡ __흡수했다가__ 다시 사방으로 내놓는다. 그 가운데 지표 쪽으로 되돌아온 에너지가 지표를 한 번 더 데운다. 이것이 온실 효과이고, 이런 일을 하는 기체를 온실 기체라고 한다.\n온실 효과 자체는 해로운 것이 아니다. 온실 효과가 없다면 지구의 평균 기온은 영하 18도쯤일 것으로 계산되는데 실제로는 영상 15도 안팎이다. 온실 효과가 있기에 물이 액체로 존재하고 생물이 살 수 있는 것이다. 문제가 되는 것은 인간의 활동으로 온실 기체가 늘어나 온실 효과가 강해지는 현상, 곧 지구 온난화이다. 산업화 이후 석탄과 석유를 대량으로 태우면서 대기 중 이산화 탄소의 농도가 꾸준히 높아졌고 지구의 평균 기온도 함께 올랐다.\n온실 기체마다 성질은 다르다. 메테인은 같은 양의 이산화 탄소보다 열을 붙잡는 힘이 훨씬 세지만 대기에 머무는 기간은 십여 년으로 짧다. 이산화 탄소는 붙잡는 힘은 약해도 배출량이 압도적으로 많고 수백 년 넘게 대기에 ㉢ __잔류한다__. 그래서 메테인을 줄이면 비교적 빨리 효과가 나타나지만, 온난화를 장기적으로 ㉣ __억제하려면__ 이산화 탄소의 배출을 줄이는 일을 피할 수 없다.","opts":["㉠: 지킨다","㉡: 빨아들였다가","㉢: 흩어진다","㉣: 막으려면"],"ans":2,"exp":"‘잔류하다’는 뒤에 처져 남아 있다는 뜻이므로 ‘남는다’와 통하고, 사방으로 퍼져 없어진다는 뜻의 ‘흩어진다’와는 바꿔 쓸 수 없다. ‘유지한다’는 ‘지킨다’, ‘흡수했다가’는 ‘빨아들였다가’, ‘억제하려면’은 ‘막으려면’과 뜻이 통한다."},
{"id":"k313","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n특정 병원체에 대한 면역은 얻는 방식에 따라 능동 면역과 수동 면역으로 나뉜다. 능동 면역은 몸이 병원체의 항원을 직접 만나 스스로 항체와 기억 세포를 만들어 얻는 면역이다. 병을 앓고 나서 생기기도 하고, 독성을 없애거나 약하게 한 항원을 넣어 주는 예방 접종으로 생기기도 한다. 몸이 항체를 충분히 만들어 내기까지 보통 한두 주가 걸리므로 효과가 늦게 나타나지만, 기억 세포가 남아 있어 같은 병원체가 다시 들어오면 빠르고 강하게 대응한다. 그래서 면역이 여러 해, 길게는 평생 이어진다.\n수동 면역은 다른 사람이나 동물이 이미 만든 항체를 받아서 얻는 면역이다. 태아가 태반을 통해, 갓난아기가 모유를 통해 어머니의 항체를 받는 것이 자연적으로 얻는 수동 면역이다. 병원체에 노출된 사람에게 항체가 든 면역 글로불린을 주사하는 것은 인공적으로 얻는 수동 면역이다. 완성된 항체가 들어오므로 효과가 곧바로 나타난다. 그러나 받은 항체는 몇 주에서 몇 달 사이에 분해되어 사라지고, 몸이 스스로 항체를 만든 것이 아니어서 기억 세포도 남지 않는다.\n두 방식은 필요에 따라 함께 쓰인다. 병원체에 이미 노출되어 몸이 항체를 만들 때까지 기다릴 여유가 없으면 면역 글로불린으로 당장의 방어를 맡기고, 동시에 백신을 맞혀 오래가는 면역을 준비한다.","opts":["홍역을 앓고 회복한 사람이 홍역에 다시 잘 걸리지 않는 것은 능동 면역의 결과이다.","면역 글로불린 주사를 맞은 사람은 몇 년 뒤에도 기억 세포 덕분에 빠르게 대응한다.","태아 때 어머니에게서 받은 항체는 태어난 뒤 시간이 지나면 아기의 몸에서 점차 사라진다.","독사에 물린 사람에게 말의 몸에서 만들어진 항체를 주사하는 것은 수동 면역을 이용한 것이다."],"ans":1,"exp":"면역 글로불린은 남이 만든 항체를 받는 수동 면역이어서 받은 항체가 몇 주에서 몇 달 사이에 사라지고 기억 세포도 남지 않는다. 병을 앓고 나서 생기는 면역은 능동 면역이고, 태아 때 어머니에게서 받은 항체도 수동 면역으로 얻은 것이어서 시간이 지나면 분해되어 사라진다. 동물이 이미 만든 항체를 받는 것 역시 수동 면역이다."},
{"id":"k314","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 적절하지 않은 것은?\n\n국어의 높임법은 말하는 이가 누구를 높이느냐에 따라 셋으로 나뉜다. 주체 높임은 문장의 주어가 가리키는 인물, 곧 서술어가 나타내는 행위나 상태의 주체를 높이는 것이다. 서술어에 ‘-시-’를 붙이고 조사 ‘이/가’ 대신 ‘께서’를 쓴다. 객체 높임은 목적어나 부사어가 가리키는 인물, 곧 행위가 미치는 대상을 높이는 것이다. ‘드리다, 모시다, 뵙다, 여쭙다’ 같은 특수한 동사를 쓰고 조사 ‘에게’ 대신 ‘께’를 쓴다. 상대 높임은 말을 듣는 사람을 높이거나 낮추는 것으로, ‘-습니다’, ‘-어요’, ‘-어라’ 같은 종결 어미로 나타낸다.\n세 가지 높임은 한 문장 안에서 따로따로 작동한다. 손녀가 어머니에게 “아버지께서 할머니를 모시고 오셨어요.”라고 말했다고 하자. ‘께서’와 ‘-시-’는 ㉠ __오는 행위를 한 사람__을 높이고, ‘모시다’는 ㉡ __그 행위에서 모심을 받은 사람__을 높이며, ‘-어요’는 이 말을 듣는 어머니를 높인다. 같은 내용을 친구에게 전한다면 종결 어미만 바뀌어 “아버지께서 할머니를 모시고 오셨어.”가 된다. 듣는 사람이 달라져도 ㉢ __문장의 주어가 가리키는 인물__과 목적어가 가리키는 인물은 그대로이기 때문이다. 한편 주어를 ‘동생’으로 바꾸면 “동생이 할머니를 모시고 왔어요.”가 된다. ㉣ __‘-시-’가 높이던 사람__이 문장에서 빠지면서 ‘께서’와 ‘-시-’도 함께 사라진 것이다.\n주체 높임과 객체 높임은 하나의 서술어에 함께 나타나기도 한다. ‘주다’를 예로 들면, 주는 사람을 높일 때는 ‘-시-’를 붙여 ‘주시다’라고 하고, 받는 사람을 높일 때는 ‘주다’ 대신 ‘드리다’를 쓴다. “할머니께서 동생에게 용돈을 주셨다.”는 주는 사람인 할머니를 높인 문장이고, “동생이 할머니께 선물을 드렸다.”는 받는 사람인 할머니를 높인 문장이다. 주는 사람과 받는 사람을 모두 높여야 할 때는 ‘드리다’에 ‘-시-’를 붙여 “아버지께서 할머니께 선물을 드리셨다.”라고 한다.","opts":["“누나가 할아버지께 물을 드렸다.”의 ‘드렸다’는 물을 준 사람인 누나를 높이는 말이다.","“삼촌께서 손님을 모시고 가셨습니다.”에는 세 가지 높임이 모두 나타난다.","“선생님께서 할머니께 책을 드리셨다.”에서는 주는 사람과 받는 사람이 모두 높임을 받는다.","“형이 할머니께 안부를 여쭈었다.”에서 높임을 받는 사람은 부사어가 가리키는 인물이다."],"ans":0,"exp":"‘드리다’는 받는 사람, 곧 부사어 ‘할아버지께’가 가리키는 인물을 높이는 객체 높임의 말이므로 물을 준 누나를 높이는 것이 아니다. “삼촌께서 손님을 모시고 가셨습니다.”에는 ‘께서’와 ‘-시-’(주체), ‘모시다’(객체), ‘-습니다’(상대)가 모두 있다. ‘드리셨다’는 ‘드리다’로 받는 사람을, ‘-시-’로 주는 사람을 함께 높이고, ‘여쭈다’는 부사어 ‘할머니께’가 가리키는 인물을 높인다."},
{"id":"k315","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 가리키는 대상이 나머지와 다른 하나는?\n\n국어의 높임법은 말하는 이가 누구를 높이느냐에 따라 셋으로 나뉜다. 주체 높임은 문장의 주어가 가리키는 인물, 곧 서술어가 나타내는 행위나 상태의 주체를 높이는 것이다. 서술어에 ‘-시-’를 붙이고 조사 ‘이/가’ 대신 ‘께서’를 쓴다. 객체 높임은 목적어나 부사어가 가리키는 인물, 곧 행위가 미치는 대상을 높이는 것이다. ‘드리다, 모시다, 뵙다, 여쭙다’ 같은 특수한 동사를 쓰고 조사 ‘에게’ 대신 ‘께’를 쓴다. 상대 높임은 말을 듣는 사람을 높이거나 낮추는 것으로, ‘-습니다’, ‘-어요’, ‘-어라’ 같은 종결 어미로 나타낸다.\n세 가지 높임은 한 문장 안에서 따로따로 작동한다. 손녀가 어머니에게 “아버지께서 할머니를 모시고 오셨어요.”라고 말했다고 하자. ‘께서’와 ‘-시-’는 ㉠ __오는 행위를 한 사람__을 높이고, ‘모시다’는 ㉡ __그 행위에서 모심을 받은 사람__을 높이며, ‘-어요’는 이 말을 듣는 어머니를 높인다. 같은 내용을 친구에게 전한다면 종결 어미만 바뀌어 “아버지께서 할머니를 모시고 오셨어.”가 된다. 듣는 사람이 달라져도 ㉢ __문장의 주어가 가리키는 인물__과 목적어가 가리키는 인물은 그대로이기 때문이다. 한편 주어를 ‘동생’으로 바꾸면 “동생이 할머니를 모시고 왔어요.”가 된다. ㉣ __‘-시-’가 높이던 사람__이 문장에서 빠지면서 ‘께서’와 ‘-시-’도 함께 사라진 것이다.\n주체 높임과 객체 높임은 하나의 서술어에 함께 나타나기도 한다. ‘주다’를 예로 들면, 주는 사람을 높일 때는 ‘-시-’를 붙여 ‘주시다’라고 하고, 받는 사람을 높일 때는 ‘주다’ 대신 ‘드리다’를 쓴다. “할머니께서 동생에게 용돈을 주셨다.”는 주는 사람인 할머니를 높인 문장이고, “동생이 할머니께 선물을 드렸다.”는 받는 사람인 할머니를 높인 문장이다. 주는 사람과 받는 사람을 모두 높여야 할 때는 ‘드리다’에 ‘-시-’를 붙여 “아버지께서 할머니께 선물을 드리셨다.”라고 한다.","opts":["㉠","㉡","㉢","㉣"],"ans":1,"exp":"㉠, ㉢, ㉣은 모두 “아버지께서 할머니를 모시고 오셨어요.”의 주어가 가리키는 ‘아버지’이다. ㉡은 ‘모시다’가 높이는 대상, 곧 목적어가 가리키는 ‘할머니’이다."},
{"id":"k316","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n암호는 남이 읽어도 뜻을 알 수 없도록 글을 바꾸는 기술이다. 글을 바꾸는 것을 암호화, 되돌리는 것을 복호화라고 하며, 이때 쓰는 비밀 값을 키라고 한다. 키를 쓰는 방식에 따라 암호는 둘로 나뉜다.\n대칭키 암호는 암호화와 복호화에 같은 키를 쓴다. 계산이 단순하여 속도가 빠르므로 큰 자료를 다루기에 알맞다. 약점은 키를 전하는 일이다. 보내는 사람과 받는 사람이 미리 같은 키를 나누어 가져야 하는데, 키를 전하는 도중에 누가 엿보면 그 뒤의 통신이 모두 드러난다. 통신할 상대가 늘어날수록 관리해야 할 키도 불어난다.\n공개키 암호는 짝을 이루는 두 개의 키를 쓴다. 하나는 누구에게나 알려 주는 공개키이고 다른 하나는 주인만 간직하는 개인키이다. 공개키로 잠근 글은 그 짝인 개인키로만 풀 수 있다. 보내는 사람은 받는 사람의 공개키로 글을 잠가 보내면 되고, 개인키는 한 번도 밖으로 나가지 않으므로 키를 몰래 전해야 하는 문제가 사라진다. 그 대신 계산이 복잡하여 대칭키 암호보다 훨씬 느리다.\n그래서 실제 통신에서는 둘을 함께 쓴다. 먼저 공개키 암호로 대칭키 하나를 안전하게 주고받고, 그다음부터는 그 대칭키로 자료를 빠르게 암호화하여 주고받는다. 공개키 암호의 안전한 키 전달과 대칭키 암호의 빠른 속도를 모두 얻는 방법이다.","opts":["대칭키 암호는 계산이 복잡하여 큰 자료를 다루기에 알맞지 않다.","두 방식을 함께 쓰는 통신에서 자료 자체는 대칭키로 암호화된다.","공개키 암호에서 잠긴 글을 푸는 데 쓰는 키는 누구에게나 알려져 있다.","공개키 암호를 쓰려면 통신하기 전에 개인키를 상대에게 몰래 전해 두어야 한다."],"ans":1,"exp":"실제 통신에서는 공개키 암호로 대칭키를 안전하게 주고받은 뒤 그 대칭키로 자료를 암호화한다고 했다. 대칭키 암호는 계산이 단순하고 빨라 큰 자료에 알맞다. 공개키 암호에서 글을 푸는 키는 주인만 간직하는 개인키이고, 개인키는 밖으로 나가지 않는다."},
{"id":"k317","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n재화와 서비스는 두 가지 성질을 기준으로 나눌 수 있다. 하나는 배제성으로, 값을 치르지 않은 사람이 쓰지 못하게 막을 수 있는 성질이다. 다른 하나는 경합성으로, 한 사람이 쓰면 다른 사람이 쓸 수 있는 양이 줄어드는 성질이다.\n우리가 가게에서 사는 물건은 대부분 두 성질을 다 갖춘 사적 재화이다. 빵은 돈을 낸 사람만 가져가고, 내가 먹은 빵을 남이 또 먹을 수는 없다. 반대로 두 성질이 모두 없는 것이 공공재이다. 국방이나 가로등 불빛은 돈을 내지 않은 사람만 골라 ㉠ __제외할__ 수 없고, 한 사람이 누린다고 다른 사람의 몫이 줄지도 않는다. 그러니 사람들은 값을 치르지 않고 혜택만 누리려 하고, 이 무임승차 때문에 기업은 공공재를 생산해서는 수입을 ㉡ __얻기__ 어렵다. 공공재가 시장에서 사회에 필요한 양보다 적게 공급되고 정부가 세금을 거두어 직접 공급하는 까닭이 여기에 있다.\n나머지 두 유형은 성질을 하나씩만 가진다. 배제성은 없고 경합성만 있는 것은 공유 자원이다. 주인 없는 바다의 물고기는 누구나 잡을 수 있지만 한 사람이 잡으면 남이 잡을 물고기가 줄어든다. 각자 자기 이익만 좇아 남보다 먼저 잡으려 들면 자원은 금세 ㉢ __고갈된다__. 그래서 어획량을 정하거나 이용 자격을 두는 규칙이 필요하다. 배제성은 있고 경합성이 없는 것은 클럽재라고 한다. 값을 낸 회원끼리만 함께 쓰는 모임에 빗댄 이름으로, 책에 따라 요금재라고도 부른다. 유료 방송은 가입자만 볼 수 있지만 한 사람이 본다고 다른 가입자의 시청이 ㉣ __방해받지__ 않는다. 다만 같은 재화라도 상황에 따라 성질이 달라진다. 한산할 때는 경합성이 없던 도로도 차가 몰려 막히기 시작하면 경합성을 띠게 된다.","opts":["통행료를 받는 한산한 고속도로는 두 성질을 다 갖춘 사적 재화에 해당한다.","무료로 개방된 해수욕장도 피서객으로 붐비면 공유 자원의 성질을 띠게 된다.","누구나 들어가 나물을 캘 수 있는 뒷산의 나물은 경합성이 없으므로 공공재에 해당한다.","가입자만 듣는 온라인 강의는 수강생이 늘어도 불편이 없다면 공유 자원으로 볼 수 있다."],"ans":1,"exp":"무료로 개방된 해수욕장은 배제성이 없는데, 붐벼서 한 사람이 쓰면 남이 쓸 자리가 줄어들면 경합성이 생기므로 배제성은 없고 경합성만 있는 공유 자원의 성질을 띤다. 통행료를 받는 한산한 도로와 가입자만 듣는 강의는 배제성은 있고 경합성이 없는 클럽재(요금재)이다. 누구나 캘 수 있는 나물은 한 사람이 캐면 남의 몫이 줄어 경합성이 있으므로 공유 자원이다."},
{"id":"k318","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n재화와 서비스는 두 가지 성질을 기준으로 나눌 수 있다. 하나는 배제성으로, 값을 치르지 않은 사람이 쓰지 못하게 막을 수 있는 성질이다. 다른 하나는 경합성으로, 한 사람이 쓰면 다른 사람이 쓸 수 있는 양이 줄어드는 성질이다.\n우리가 가게에서 사는 물건은 대부분 두 성질을 다 갖춘 사적 재화이다. 빵은 돈을 낸 사람만 가져가고, 내가 먹은 빵을 남이 또 먹을 수는 없다. 반대로 두 성질이 모두 없는 것이 공공재이다. 국방이나 가로등 불빛은 돈을 내지 않은 사람만 골라 ㉠ __제외할__ 수 없고, 한 사람이 누린다고 다른 사람의 몫이 줄지도 않는다. 그러니 사람들은 값을 치르지 않고 혜택만 누리려 하고, 이 무임승차 때문에 기업은 공공재를 생산해서는 수입을 ㉡ __얻기__ 어렵다. 공공재가 시장에서 사회에 필요한 양보다 적게 공급되고 정부가 세금을 거두어 직접 공급하는 까닭이 여기에 있다.\n나머지 두 유형은 성질을 하나씩만 가진다. 배제성은 없고 경합성만 있는 것은 공유 자원이다. 주인 없는 바다의 물고기는 누구나 잡을 수 있지만 한 사람이 잡으면 남이 잡을 물고기가 줄어든다. 각자 자기 이익만 좇아 남보다 먼저 잡으려 들면 자원은 금세 ㉢ __고갈된다__. 그래서 어획량을 정하거나 이용 자격을 두는 규칙이 필요하다. 배제성은 있고 경합성이 없는 것은 클럽재라고 한다. 값을 낸 회원끼리만 함께 쓰는 모임에 빗댄 이름으로, 책에 따라 요금재라고도 부른다. 유료 방송은 가입자만 볼 수 있지만 한 사람이 본다고 다른 가입자의 시청이 ㉣ __방해받지__ 않는다. 다만 같은 재화라도 상황에 따라 성질이 달라진다. 한산할 때는 경합성이 없던 도로도 차가 몰려 막히기 시작하면 경합성을 띠게 된다.","opts":["㉠: 빼놓을","㉡: 거두기","㉢: 바닥난다","㉣: 보장받지"],"ans":3,"exp":"‘방해받다’는 일이 제대로 되지 못하게 간섭이나 훼방을 당한다는 뜻이므로 ‘지장을 받지’ 정도로 바꿀 수 있고, 어떤 일이 이루어지도록 보증을 받는다는 뜻의 ‘보장받지’로 바꾸면 뜻이 반대가 된다. ‘제외할’은 ‘빼놓을’, ‘(수입을) 얻기’는 ‘거두기’, ‘고갈된다’는 ‘바닥난다’와 뜻이 통한다."},
{"id":"k319","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n생물이 먹이나 물을 통해 받아들인 물질 가운데 일부는 분해되거나 배설되지 않고 몸 안에 쌓인다. 이런 물질의 농도는 먹이 사슬의 위쪽으로 갈수록 높아지는데, 이 현상을 생물 농축이라고 한다.\n생물 농축을 일으키는 물질에는 공통된 성질이 있다. 첫째, 자연에서 잘 분해되지 않아 환경에 오래 남는다. 둘째, 물보다 지방에 잘 녹아 생물의 지방 조직에 자리 잡는다. 물에 잘 녹는 물질은 오줌에 섞여 쉽게 빠져나가지만 지방에 녹아든 물질은 좀처럼 몸 밖으로 나가지 않는다. 살충제로 쓰였던 디디티(DDT)와 수은 화합물의 하나인 메틸수은이 이런 물질이다.\n농도가 단계마다 높아지는 까닭은 먹이의 양에 있다. 생물은 살아가는 동안 자기 몸무게보다 훨씬 많은 먹이를 먹는다. 먹이에 든 물질이 빠져나가지 않고 남으면 먹은 만큼 몸에 쌓이고, 그 생물을 먹는 다음 단계의 생물에게는 더 짙어진 채로 넘어간다. 물속의 농도는 재기 어려울 만큼 낮더라도 플랑크톤, 작은 물고기, 큰 물고기를 거치며 농도가 수만 배 이상으로 높아질 수 있다.\n따라서 피해는 먹이 사슬의 꼭대기에 있는 생물에게 가장 크게 나타난다. 디디티가 널리 쓰이던 시절에는 물고기를 먹는 맹금류의 알껍데기가 얇아져 번식에 실패하는 일이 벌어졌다. 또 같은 종이라도 오래 산 개체일수록 몸에 쌓인 양이 많다.","opts":["물에 잘 녹아 오줌으로 쉽게 나가는 물질은 생물 농축을 일으킬 가능성이 낮다.","같은 종의 물고기라면 어린 개체가 오래 산 개체보다 몸에 쌓인 메틸수은의 양이 많다.","같은 호수에서 플랑크톤을 먹는 물고기는 다른 물고기를 잡아먹는 물고기보다 디디티 농도가 높다.","어떤 물질의 물속 농도가 재기 어려울 만큼 낮다면 그 물에 사는 물고기를 먹는 새에게는 피해가 없다."],"ans":0,"exp":"생물 농축을 일으키는 물질은 물보다 지방에 잘 녹아 몸 밖으로 잘 나가지 않는 것이고, 물에 잘 녹는 물질은 오줌에 섞여 쉽게 빠져나간다고 했다. 쌓인 양은 오래 산 개체일수록 많고, 농도는 먹이 사슬의 위쪽으로 갈수록 높다. 물속 농도가 매우 낮아도 먹이 사슬을 거치며 수만 배 이상 높아질 수 있으므로 꼭대기의 생물은 피해를 볼 수 있다."},
{"id":"k320","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n혈액 속 포도당의 농도를 혈당이라고 한다. 포도당은 세포가 가장 먼저 쓰는 에너지원이어서 혈당은 좁은 범위 안에서 유지되어야 한다. 이 일을 맡는 것이 이자(췌장)에서 분비되는 두 호르몬, 인슐린과 글루카곤이다. 둘은 서로 반대 방향으로 작용한다.\n식사를 하여 혈당이 올라가면 이자의 베타 세포가 인슐린을 분비한다. 인슐린은 근육과 지방 조직의 세포가 포도당을 받아들이게 하고, 간이 포도당을 글리코젠으로 바꾸어 저장하게 한다. 그 결과 혈당이 내려간다. 반대로 공복이 길어져 혈당이 내려가면 이자의 알파 세포가 글루카곤을 분비한다. 글루카곤은 간에 저장된 글리코젠을 포도당으로 분해하여 혈액으로 내보내게 함으로써 혈당을 끌어올린다. 혈당이 오르면 인슐린이, 내리면 글루카곤이 나와 변화를 되돌리는 것이다.\n당뇨병은 이 조절이 무너져 혈당이 높은 상태가 이어지는 병이다. 원인에 따라 크게 둘로 나뉜다. 제1형 당뇨병은 면역 체계가 베타 세포를 파괴하여 인슐린이 거의 만들어지지 않는 경우로, 인슐린을 주사로 보충해야 한다. 제2형 당뇨병은 인슐린이 분비되는데도 세포가 그에 제대로 반응하지 않는 인슐린 저항성에서 시작한다. 인슐린이 잘 ㉠ __듣지__ 않으니 이자는 더 많은 인슐린을 내보내 혈당을 맞추려 하고, 이 부담이 오래 이어지면 베타 세포의 기능이 떨어져 분비량마저 줄어든다. 제2형은 비만이나 운동 부족 같은 생활 습관과 관련이 깊어 식사 조절과 운동이 치료의 바탕이 되며, 필요하면 먹는 약이나 인슐린을 함께 쓴다.","opts":["글루카곤은 간에서 글리코젠이 포도당으로 분해되는 것을 막는다.","인슐린과 글루카곤은 이자의 같은 세포에서 분비되어 서로의 작용을 돕는다.","제2형 당뇨병의 초기에는 인슐린 분비량이 오히려 늘어나는 시기가 있을 수 있다.","제1형 당뇨병은 인슐린이 충분히 분비되는데도 세포가 반응하지 않아 생기는 병이다."],"ans":2,"exp":"제2형 당뇨병은 인슐린 저항성에서 시작하며, 인슐린이 잘 듣지 않으니 이자가 더 많은 인슐린을 내보내 혈당을 맞추려 한다고 했으므로 초기에는 분비량이 늘 수 있다. 글루카곤은 글리코젠을 포도당으로 분해하게 하고, 인슐린은 베타 세포에서, 글루카곤은 알파 세포에서 나와 반대로 작용한다. 인슐린이 분비되는데도 세포가 반응하지 않는 것은 제2형의 설명이다."},
{"id":"k321","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n혈액 속 포도당의 농도를 혈당이라고 한다. 포도당은 세포가 가장 먼저 쓰는 에너지원이어서 혈당은 좁은 범위 안에서 유지되어야 한다. 이 일을 맡는 것이 이자(췌장)에서 분비되는 두 호르몬, 인슐린과 글루카곤이다. 둘은 서로 반대 방향으로 작용한다.\n식사를 하여 혈당이 올라가면 이자의 베타 세포가 인슐린을 분비한다. 인슐린은 근육과 지방 조직의 세포가 포도당을 받아들이게 하고, 간이 포도당을 글리코젠으로 바꾸어 저장하게 한다. 그 결과 혈당이 내려간다. 반대로 공복이 길어져 혈당이 내려가면 이자의 알파 세포가 글루카곤을 분비한다. 글루카곤은 간에 저장된 글리코젠을 포도당으로 분해하여 혈액으로 내보내게 함으로써 혈당을 끌어올린다. 혈당이 오르면 인슐린이, 내리면 글루카곤이 나와 변화를 되돌리는 것이다.\n당뇨병은 이 조절이 무너져 혈당이 높은 상태가 이어지는 병이다. 원인에 따라 크게 둘로 나뉜다. 제1형 당뇨병은 면역 체계가 베타 세포를 파괴하여 인슐린이 거의 만들어지지 않는 경우로, 인슐린을 주사로 보충해야 한다. 제2형 당뇨병은 인슐린이 분비되는데도 세포가 그에 제대로 반응하지 않는 인슐린 저항성에서 시작한다. 인슐린이 잘 ㉠ __듣지__ 않으니 이자는 더 많은 인슐린을 내보내 혈당을 맞추려 하고, 이 부담이 오래 이어지면 베타 세포의 기능이 떨어져 분비량마저 줄어든다. 제2형은 비만이나 운동 부족 같은 생활 습관과 관련이 깊어 식사 조절과 운동이 치료의 바탕이 되며, 필요하면 먹는 약이나 인슐린을 함께 쓴다.","opts":["이 약은 마른기침에 잘 __듣는다__.","나는 그 소식을 친구에게서 처음 __들었다__.","아이는 좀처럼 어른들의 말을 __듣지__ 않았다.","낡은 자전거라 브레이크가 잘 __듣지__ 않는다."],"ans":0,"exp":"㉠의 '듣다'는 '약 따위가 효험을 나타내다'라는 뜻으로, '이 약은 마른기침에 잘 듣는다'의 '듣다'와 같다. '소식을 듣다'는 다른 사람에게서 어떤 내용을 전달받다, '말을 듣지 않다'는 남의 말을 받아들여 따르다, '브레이크가 듣지 않다'는 기계나 장치가 제대로 움직이다의 뜻이다."},
{"id":"k322","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 가장 적절한 것은?\n\n외래어는 다른 나라 말에서 들어와 우리말처럼 쓰이는 말이다. 원어의 발음은 사람마다 달리 듣고 달리 적을 수 있으므로 외래어 표기법은 몇 가지 원칙을 세워 표기를 통일한다.\n첫째, 외래어는 국어에서 지금 쓰는 24개의 자모만으로 적는다. 국어에 없는 소리를 적으려고 새 글자를 만들지 않는다는 뜻이다. 둘째, 원어의 한 소리는 원칙적으로 한 가지 글자로 적는다. 영어의 [f]는 국어에 없는 소리여서 ‘ㅍ’으로도 ‘ㅎ’으로도 들릴 수 있지만, 한 소리를 여러 글자로 적으면 혼란스러우므로 ‘ㅍ’으로 정하였다. 그래서 ‘file’은 ‘화일’이 아니라 ‘파일’로 적는다. 셋째, 받침에는 ‘ㄱ, ㄴ, ㄹ, ㅁ, ㅂ, ㅅ, ㅇ’의 일곱 글자만 쓴다. ‘shop’은 ‘숖’이 아니라 ‘숍’으로 적는다. 조사가 붙었을 때 [쇼피]가 아니라 [쇼비]로 소리 나기 때문이다. ‘robot’을 ‘로볻’이 아니라 ‘로봇’으로 적는 것도 ‘로봇이’가 [로보시]로 소리 나기 때문이다. 넷째, 파열음을 적을 때는 된소리를 쓰지 않는 것을 원칙으로 한다. ‘bus’와 ‘Paris’는 [뻐스], [빠리]에 가깝게 들리더라도 ‘버스’, ‘파리’로 적는다.\n다만 이미 오랫동안 쓰여 굳어진 말은 원칙에 맞지 않더라도 관용을 존중한다. ‘camera’는 원어의 발음을 따르면 ‘캐머러’에 가깝지만 널리 쓰여 온 ‘카메라’를 표준으로 삼는다. ‘빵’이나 ‘껌’처럼 된소리로 굳은 말도 그대로 인정한다.","opts":["‘cake’의 끝소리를 살리려면 받침에 ‘ㅋ’을 써서 ‘케잌’으로 적어야 한다.","‘café’는 [까페]에 가깝게 들리므로 원어의 소리를 살려 ‘까페’로 적어야 한다.","‘family’의 첫소리는 ‘ㅎ’처럼 들리더라도 ‘훼밀리’가 아니라 ‘패밀리’로 적는다.","‘radio’는 ‘라디오’로 굳어졌더라도 원어의 발음에 가까운 ‘레이디오’로 고쳐 적어야 한다."],"ans":2,"exp":"영어의 [f]는 한 가지 글자 ‘ㅍ’으로 적기로 했으므로 ‘family’는 ‘패밀리’로 적는다. 받침에는 일곱 글자만 쓰므로 ‘ㅋ’ 받침을 쓸 수 없고, 파열음은 된소리로 적지 않는 것이 원칙이므로 ‘까페’가 아니라 ‘카페’이다. ‘라디오’처럼 오랫동안 쓰여 굳어진 말은 ‘카메라’와 마찬가지로 관용을 존중한다."},
{"id":"k323","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n기계 학습은 사람이 규칙을 일일이 적어 주는 대신 컴퓨터가 자료에서 규칙을 스스로 찾아내게 하는 기술이다. 학습에 쓰는 자료에 정답이 붙어 있느냐에 따라 지도 학습과 비지도 학습으로 나뉜다.\n지도 학습은 문제와 정답이 짝지어진 자료로 이루어진다. 수많은 사진에 ‘개’, ‘고양이’라는 이름표를 붙여 보여 주면, 컴퓨터는 자기가 낸 답과 ㉠ __사람이 미리 달아 둔 이름표__를 견주어 틀린 만큼 내부의 값을 고쳐 나간다. 이 과정을 되풀이하면 처음 보는 사진에도 답을 낼 수 있게 된다. 답이 ‘스팸이다, 아니다’처럼 정해진 범주 가운데 하나이면 분류라 하고, 내일의 기온이나 집값처럼 이어진 수치이면 회귀라 한다. 지도 학습은 목표가 분명하고 성능을 재기 쉽지만, ㉡ __학습의 기준이 되는 답__을 사람이 일일이 달아야 하므로 자료를 마련하는 데 품이 많이 든다.\n비지도 학습에 쓰는 자료에는 그런 표시가 없다. 컴퓨터는 자료들 사이의 닮은 점과 다른 점만을 근거로 구조를 찾아낸다. 대표적인 것이 비슷한 것끼리 묶는 군집화이다. 쇼핑몰이 구매 기록만으로 고객을 몇 무리로 나누는 일이 그 예이다. 이때 컴퓨터가 내놓는 것은 ㉢ __자료에서 스스로 찾아낸 묶음__일 뿐이어서, 각 무리가 어떤 사람들인지 이름을 붙이고 뜻을 풀이하는 일은 사람의 몫으로 남는다. ㉣ __결과와 견주어 볼 기준__이 없으니 결과가 얼마나 좋은지를 재기도 지도 학습보다 까다롭다. 그 대신 이름표 없는 방대한 자료를 그대로 쓸 수 있고, 사람이 미처 생각하지 못한 구분을 찾아내기도 한다.","opts":["과거의 기온과 그날의 전력 사용량을 짝지어 학습시켜 내일의 전력 사용량을 맞히게 하는 것은 회귀이다.","의사의 판독 결과가 붙은 흉부 사진으로 학습시켜 새 사진의 폐렴 여부를 가리게 하는 것은 지도 학습이다.","자료가 방대하여 사람이 정답을 일일이 달 수 없는 경우에는 비지도 학습이 지도 학습보다 자료를 마련하기 쉽다.","이름표 없는 기사들을 비슷한 것끼리 나누게 하면 컴퓨터는 묶음마다 ‘경제’, ‘운동’ 같은 이름을 붙여 내놓는다."],"ans":3,"exp":"비지도 학습에서 컴퓨터가 내놓는 것은 스스로 찾아낸 묶음일 뿐이고, 각 묶음에 이름을 붙이고 뜻을 풀이하는 일은 사람의 몫이라고 했다. 정답(사용량, 판독 결과)이 짝지어진 자료로 학습하는 것은 지도 학습이고 그 답이 이어진 수치이면 회귀이다. 비지도 학습은 이름표 없는 자료를 그대로 쓸 수 있다."},
{"id":"k324","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 가리키는 대상이 나머지와 다른 하나는?\n\n기계 학습은 사람이 규칙을 일일이 적어 주는 대신 컴퓨터가 자료에서 규칙을 스스로 찾아내게 하는 기술이다. 학습에 쓰는 자료에 정답이 붙어 있느냐에 따라 지도 학습과 비지도 학습으로 나뉜다.\n지도 학습은 문제와 정답이 짝지어진 자료로 이루어진다. 수많은 사진에 ‘개’, ‘고양이’라는 이름표를 붙여 보여 주면, 컴퓨터는 자기가 낸 답과 ㉠ __사람이 미리 달아 둔 이름표__를 견주어 틀린 만큼 내부의 값을 고쳐 나간다. 이 과정을 되풀이하면 처음 보는 사진에도 답을 낼 수 있게 된다. 답이 ‘스팸이다, 아니다’처럼 정해진 범주 가운데 하나이면 분류라 하고, 내일의 기온이나 집값처럼 이어진 수치이면 회귀라 한다. 지도 학습은 목표가 분명하고 성능을 재기 쉽지만, ㉡ __학습의 기준이 되는 답__을 사람이 일일이 달아야 하므로 자료를 마련하는 데 품이 많이 든다.\n비지도 학습에 쓰는 자료에는 그런 표시가 없다. 컴퓨터는 자료들 사이의 닮은 점과 다른 점만을 근거로 구조를 찾아낸다. 대표적인 것이 비슷한 것끼리 묶는 군집화이다. 쇼핑몰이 구매 기록만으로 고객을 몇 무리로 나누는 일이 그 예이다. 이때 컴퓨터가 내놓는 것은 ㉢ __자료에서 스스로 찾아낸 묶음__일 뿐이어서, 각 무리가 어떤 사람들인지 이름을 붙이고 뜻을 풀이하는 일은 사람의 몫으로 남는다. ㉣ __결과와 견주어 볼 기준__이 없으니 결과가 얼마나 좋은지를 재기도 지도 학습보다 까다롭다. 그 대신 이름표 없는 방대한 자료를 그대로 쓸 수 있고, 사람이 미처 생각하지 못한 구분을 찾아내기도 한다.","opts":["㉠","㉡","㉢","㉣"],"ans":2,"exp":"㉠, ㉡, ㉣은 모두 지도 학습의 자료에 붙어 있는 정답(이름표)을 가리킨다. ㉢은 비지도 학습에서 컴퓨터가 자료의 닮은 점을 근거로 나눈 무리, 곧 군집이다."},
{"id":"k325","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n환율은 두 나라 돈을 바꾸는 비율이다. 우리나라에서는 보통 외국 돈 한 단위를 사는 데 드는 원화의 액수로 나타낸다. 1달러에 1,200원이던 환율이 1,400원이 되면 환율이 올랐다고 하는데, 이는 달러의 값이 오르고 원화의 가치가 떨어졌다는 뜻이다.\n환율이 오르면 수출과 수입이 엇갈린 영향을 받는다. 우리 기업이 1달러에 파는 물건은 달러 가격을 그대로 두어도 원화로 받는 돈이 1,200원에서 1,400원으로 늘어난다. 기업은 달러 가격을 낮추어 더 많이 팔 수도 있다. 그래서 환율 상승은 대체로 수출에 유리하다. 반대로 외국에서 사 오는 물건은 같은 달러 가격이라도 원화로 치르는 값이 올라 수입이 줄어든다. 수입 원유와 곡물의 값이 오르면 국내 물가도 따라 오른다. 외국에 달러로 빚을 진 기업은 갚아야 할 돈이 원화로 따져 불어난다.\n환율이 내릴 때는 이와 반대의 일이 일어난다. 수입품 값이 싸져 물가가 안정되고 해외여행의 부담이 줄지만, 수출 기업은 가격 경쟁에서 불리해진다.\n다만 환율 상승이 언제나 수출 기업에 이득이 되는 것은 아니다. 원자재와 부품을 수입해 가공하여 수출하는 기업은 환율이 오르면 재료를 사는 비용도 함께 오르므로 이득이 줄어든다. 수출품이 세계 시장에서 가격보다 품질로 경쟁하는 경우에도 환율의 효과는 크지 않다.","opts":["환율이 오르면 외국으로 여행을 가려는 사람의 부담은 이전보다 커진다.","환율이 내리면 달러로 빚을 진 기업이 갚을 돈은 원화로 따져 줄어든다.","원화의 가치가 오르면 수입 원자재의 원화 가격이 올라 국내 물가가 오른다.","부품을 많이 수입해 쓰는 수출 기업은 환율이 올라도 이득이 크지 않을 수 있다."],"ans":2,"exp":"원화의 가치가 오른다는 것은 환율이 내린다는 뜻이고, 환율이 내리면 수입품 값이 싸져 물가가 안정된다. 원자재의 원화 가격이 올라 물가가 오르는 것은 환율이 오를 때의 일이다. 환율이 내리면 달러 빚의 원화 부담이 줄고, 환율이 오르면 해외여행 부담이 커지며, 재료를 수입하는 수출 기업은 비용도 함께 올라 이득이 줄어든다."},
{"id":"k326","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 적절하지 않은 것은?\n\n말소리는 놓이는 자리에 따라 본래와 다르게 발음되는 일이 있는데 이를 음운 변동이라고 한다. 음운 변동은 그 결과에 따라 네 가지로 나뉜다. 이 구분을 알면 표기와 발음이 달라지는 까닭을 ㉠ __밝힐__ 수 있다.\n첫째는 한 음운이 다른 음운으로 바뀌는 교체이다. ‘국밥’이 [국빱]으로 소리 날 때 ‘ㅂ’이 ‘ㅃ’으로 바뀐 것이 그 예이다. 교체에서는 음운의 종류만 달라질 뿐 개수는 그대로이다. 둘째는 있던 음운이 없어지는 탈락이다. ‘값’이 [갑]으로 소리 날 때에는 겹받침 가운데 ‘ㅅ’이 탈락하고, ‘좋은’이 [조은]으로 소리 날 때에는 ‘ㅎ’이 탈락한다. 셋째는 없던 음운이 새로 생기는 첨가이다. ‘솜이불’은 ‘솜’과 ‘이불’ 사이에 ‘ㄴ’이 덧나 [솜니불]로 발음된다. 넷째는 두 음운이 합쳐져 다른 하나의 음운이 되는 축약이다. ‘놓고’가 [노코]로 소리 날 때 ‘ㅎ’과 ‘ㄱ’이 합쳐져 ‘ㅋ’이 된다.\n음운의 개수는 탈락과 축약에서는 하나 줄고, 첨가에서는 하나 는다. 탈락과 축약은 개수가 준다는 점은 같지만 구별된다. 탈락은 한 음운이 흔적 없이 사라지는 것이고, 축약은 두 음운의 성질이 새 음운에 함께 남는 것이다. ‘ㅋ’에는 ‘ㄱ’이 나는 자리와 ‘ㅎ’의 거센 숨이 모두 들어 있다.\n한 단어에서 여러 변동이 차례로 일어나기도 한다. ‘닭만’은 먼저 겹받침의 ‘ㄹ’이 탈락하여 [닥만]이 되고, 이어서 ‘ㄱ’이 ‘ㅁ’ 앞에서 ‘ㅇ’으로 교체되어 [당만]으로 발음된다. 이때 음운의 개수는 탈락이 한 번 일어난 만큼만 줄어든다.","opts":["‘낳은’이 [나은]으로 발음될 때에는 ‘ㅎ’이 사라지는 탈락이 일어난다.","‘축하’가 [추카]로 발음될 때에는 축약이 일어나 음운의 개수가 하나 줄어든다.","‘맨입’이 [맨닙]으로 발음될 때에는 첨가가 일어나 음운의 개수가 하나 늘어난다.","‘흙도’가 [흑또]로 발음될 때에는 탈락과 교체가 일어나 음운의 개수가 둘 줄어든다."],"ans":3,"exp":"‘흙도[흑또]’에서는 겹받침의 ‘ㄹ’이 탈락하고 ‘ㄷ’이 ‘ㄸ’으로 교체된다. 교체에서는 음운의 개수가 변하지 않으므로 ‘닭만[당만]’처럼 탈락이 한 번 일어난 만큼, 곧 하나만 줄어든다. ‘낳은[나은]’은 ‘좋은[조은]’과 같은 ‘ㅎ’ 탈락이고, ‘축하[추카]’는 ‘ㄱ’과 ‘ㅎ’이 ‘ㅋ’으로 합쳐지는 축약이며, ‘맨입[맨닙]’은 ‘ㄴ’이 덧나는 첨가이다."},
{"id":"k327","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n말소리는 놓이는 자리에 따라 본래와 다르게 발음되는 일이 있는데 이를 음운 변동이라고 한다. 음운 변동은 그 결과에 따라 네 가지로 나뉜다. 이 구분을 알면 표기와 발음이 달라지는 까닭을 ㉠ __밝힐__ 수 있다.\n첫째는 한 음운이 다른 음운으로 바뀌는 교체이다. ‘국밥’이 [국빱]으로 소리 날 때 ‘ㅂ’이 ‘ㅃ’으로 바뀐 것이 그 예이다. 교체에서는 음운의 종류만 달라질 뿐 개수는 그대로이다. 둘째는 있던 음운이 없어지는 탈락이다. ‘값’이 [갑]으로 소리 날 때에는 겹받침 가운데 ‘ㅅ’이 탈락하고, ‘좋은’이 [조은]으로 소리 날 때에는 ‘ㅎ’이 탈락한다. 셋째는 없던 음운이 새로 생기는 첨가이다. ‘솜이불’은 ‘솜’과 ‘이불’ 사이에 ‘ㄴ’이 덧나 [솜니불]로 발음된다. 넷째는 두 음운이 합쳐져 다른 하나의 음운이 되는 축약이다. ‘놓고’가 [노코]로 소리 날 때 ‘ㅎ’과 ‘ㄱ’이 합쳐져 ‘ㅋ’이 된다.\n음운의 개수는 탈락과 축약에서는 하나 줄고, 첨가에서는 하나 는다. 탈락과 축약은 개수가 준다는 점은 같지만 구별된다. 탈락은 한 음운이 흔적 없이 사라지는 것이고, 축약은 두 음운의 성질이 새 음운에 함께 남는 것이다. ‘ㅋ’에는 ‘ㄱ’이 나는 자리와 ‘ㅎ’의 거센 숨이 모두 들어 있다.\n한 단어에서 여러 변동이 차례로 일어나기도 한다. ‘닭만’은 먼저 겹받침의 ‘ㄹ’이 탈락하여 [닥만]이 되고, 이어서 ‘ㄱ’이 ‘ㅁ’ 앞에서 ‘ㅇ’으로 교체되어 [당만]으로 발음된다. 이때 음운의 개수는 탈락이 한 번 일어난 만큼만 줄어든다.","opts":["그 사람은 돈을 지나치게 __밝힌다__.","걱정이 되어 뜬눈으로 밤을 __밝혔다__.","촛불을 __밝히고__ 밤늦도록 혼자 책을 읽었다.","조사단은 여러 달 만에 사고의 원인을 __밝혔다__."],"ans":3,"exp":"㉠의 '밝히다'는 '드러나지 않거나 알려지지 않은 사실, 내용 따위를 드러내 알리다'라는 뜻으로, '사고의 원인을 밝혔다'의 '밝히다'와 같다. '돈을 밝히다'는 어떤 것을 드러나게 좋아하다, '밤을 밝히다'는 자지 않고 밤을 지내다, '촛불을 밝히다'는 불을 켜서 환하게 하다의 뜻이다."},
{"id":"k328","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n전통적인 경제학은 사람이 이익과 손해를 정확히 따져 가장 유리한 것을 고른다고 가정한다. 그러나 실제의 선택은 이 가정에서 일정한 방향으로 벗어난다. 행동 경제학은 그 벗어남의 규칙을 연구한다.\n대표적인 것이 손실 회피이다. 사람은 같은 크기라면 얻는 기쁨보다 잃는 아픔을 더 크게 느낀다. 만 원을 주웠을 때의 기쁨보다 만 원을 잃어버렸을 때의 속상함이 더 큰 것이다. 그래서 같은 내용이라도 이익을 놓치는 것으로 제시될 때보다 손해를 보는 것으로 제시될 때 사람들은 더 민감하게 반응한다. 손실 회피는 이미 가진 것을 높게 치는 태도로도 나타난다. 자기 물건을 팔 때 받으려는 값은 같은 물건을 살 때 내려는 값보다 높은 경우가 많은데, 이를 보유 효과라고 한다. 가진 것을 내놓는 일이 손실로 느껴지기 때문이다.\n기준점 효과도 널리 확인된다. 사람은 수치를 어림할 때 처음 접한 숫자에 이끌린다. 그 숫자가 판단과 아무 관계가 없어도 그렇다. 처음 본 숫자가 기준점이 되고, 사람들은 거기서 조금씩 고쳐 나가다가 충분히 고치지 못한 채 멈춘다. 물건값을 흥정할 때 먼저 부른 값이 최종 가격을 끌어당기는 것이 그 예이다.","opts":["이길 때 받는 돈과 질 때 내는 돈이 같은 반반 확률의 내기를 사람들이 꺼리는 것은 기준점 효과 때문이다.","경품으로 받은 컵을 팔라고 하면 같은 컵을 사려는 사람이 내겠다는 값보다 높은 값을 부르는 것은 보유 효과로 설명된다.","‘현금으로 내면 할인’이라는 안내보다 ‘카드로 내면 추가 요금’이라는 안내에 더 민감하게 반응하는 것은 손실 회피로 설명된다.","정가 10만 원에 줄을 긋고 6만 원이라고 적은 가격표가 그냥 6만 원이라고 적은 가격표보다 싸게 느껴지는 것은 기준점 효과이다."],"ans":0,"exp":"이길 때 얻는 돈과 질 때 잃는 돈이 같은데도 내기를 꺼리는 것은 같은 크기라도 잃는 아픔을 더 크게 느끼는 손실 회피 때문이지, 처음 접한 숫자에 이끌리는 기준점 효과 때문이 아니다. 줄을 그은 정가는 기준점 구실을 하고, 가진 물건을 내놓을 때 더 높은 값을 부르는 것은 보유 효과이다. 추가 요금은 손해로 제시된 것이어서 더 민감하게 반응한다."},
{"id":"k329","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n디지털 자료는 0과 1의 긴 나열로 저장된다. 압축은 이 나열을 더 짧게 줄여 저장 공간과 전송 시간을 아끼는 기술이며, 줄인 자료를 원래대로 되돌릴 수 있느냐에 따라 무손실 압축과 손실 압축으로 나뉜다.\n무손실 압축은 자료 안의 ㉠ __중복__을 찾아 더 짧은 표현으로 바꾼다. 같은 글자가 스무 번 이어지면 글자 스무 개를 적는 대신 ‘이 글자가 스무 번’이라고 적는 식이다. 자주 나오는 글자에는 짧은 부호를, 드물게 나오는 글자에는 긴 부호를 주는 방법도 쓴다. 이렇게 줄인 자료는 풀었을 때 원본과 조금도 다르지 않다. 글자 하나만 달라져도 뜻이 바뀌는 문서나 프로그램 파일에는 이 방식을 써야 한다. 다만 정보를 버리지 않으므로 줄일 수 있는 양에 한계가 있고, 되풀이되는 부분이 거의 없는 자료는 별로 줄어들지 않는다.\n손실 압축은 사람이 잘 알아차리지 못하는 정보를 ㉡ __과감히__ 버린다. 사람의 눈은 밝기의 차이에는 민감하지만 색의 미세한 차이에는 둔하고, 귀는 큰 소리와 함께 나는 작은 소리를 잘 듣지 못한다. 사진과 음악, 동영상의 압축은 이런 감각의 특성을 이용해 덜 중요한 부분을 덜어 내어 용량을 십분의 일 수준으로 줄이기도 한다. 그 대신 버린 정보는 되살릴 수 없다. 압축률을 높일수록 화질과 음질이 ㉢ __저하되고__, 압축된 파일을 고쳐서 다시 압축하기를 되풀이하면 손상이 ㉣ __누적된다__. 그래서 원본은 무손실 방식으로 보관하고, 남에게 보낼 때만 손실 방식으로 줄이는 일이 많다.","opts":["손실 압축된 사진을 무손실 방식으로 다시 압축하면 버려진 정보가 되살아난다.","무손실 압축은 같은 내용이 되풀이되는 자료일수록 용량을 더 많이 줄일 수 있다.","프로그램 파일을 손실 방식으로 압축하면 풀었을 때 원본과 달라져 쓸 수 없게 될 수 있다.","손실 압축은 사람의 감각이 둔하게 받아들이는 부분의 정보를 덜어 내는 방식으로 용량을 줄인다."],"ans":0,"exp":"손실 압축에서 버린 정보는 되살릴 수 없다고 했으므로, 그 뒤에 어떤 방식으로 다시 압축해도 버려진 정보는 돌아오지 않는다. 무손실 압축은 중복을 짧은 표현으로 바꾸므로 되풀이가 많을수록 많이 줄고, 글자 하나만 달라져도 안 되는 프로그램 파일에는 무손실 방식을 써야 한다. 손실 압축은 눈과 귀가 잘 알아차리지 못하는 정보를 버린다."},
{"id":"k330","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n디지털 자료는 0과 1의 긴 나열로 저장된다. 압축은 이 나열을 더 짧게 줄여 저장 공간과 전송 시간을 아끼는 기술이며, 줄인 자료를 원래대로 되돌릴 수 있느냐에 따라 무손실 압축과 손실 압축으로 나뉜다.\n무손실 압축은 자료 안의 ㉠ __중복__을 찾아 더 짧은 표현으로 바꾼다. 같은 글자가 스무 번 이어지면 글자 스무 개를 적는 대신 ‘이 글자가 스무 번’이라고 적는 식이다. 자주 나오는 글자에는 짧은 부호를, 드물게 나오는 글자에는 긴 부호를 주는 방법도 쓴다. 이렇게 줄인 자료는 풀었을 때 원본과 조금도 다르지 않다. 글자 하나만 달라져도 뜻이 바뀌는 문서나 프로그램 파일에는 이 방식을 써야 한다. 다만 정보를 버리지 않으므로 줄일 수 있는 양에 한계가 있고, 되풀이되는 부분이 거의 없는 자료는 별로 줄어들지 않는다.\n손실 압축은 사람이 잘 알아차리지 못하는 정보를 ㉡ __과감히__ 버린다. 사람의 눈은 밝기의 차이에는 민감하지만 색의 미세한 차이에는 둔하고, 귀는 큰 소리와 함께 나는 작은 소리를 잘 듣지 못한다. 사진과 음악, 동영상의 압축은 이런 감각의 특성을 이용해 덜 중요한 부분을 덜어 내어 용량을 십분의 일 수준으로 줄이기도 한다. 그 대신 버린 정보는 되살릴 수 없다. 압축률을 높일수록 화질과 음질이 ㉢ __저하되고__, 압축된 파일을 고쳐서 다시 압축하기를 되풀이하면 손상이 ㉣ __누적된다__. 그래서 원본은 무손실 방식으로 보관하고, 남에게 보낼 때만 손실 방식으로 줄이는 일이 많다.","opts":["㉠: 빈틈","㉡: 거침없이","㉢: 떨어지고","㉣: 쌓인다"],"ans":0,"exp":"‘중복’은 같은 것이 거듭되거나 겹친다는 뜻이므로 ‘겹치는 부분’ 정도로 바꿀 수 있고, 비어 있는 사이를 뜻하는 ‘빈틈’과는 바꿔 쓸 수 없다. ‘과감히’는 ‘거침없이’, ‘저하되고’는 ‘떨어지고’, ‘누적된다’는 ‘쌓인다’와 뜻이 통한다."},
{"id":"k331","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n지진의 크기를 나타내는 말에는 규모와 진도가 있다. 둘은 자주 섞여 쓰이지만 뜻이 다르다.\n규모는 지진이 일어날 때 땅속에서 방출된 에너지의 크기를 나타낸다. 지진계에 기록된 진동을 바탕으로 계산하며, 하나의 지진에는 하나의 규모 값만 있다. 어디에서 관측하든 같은 지진이면 규모는 같다. 규모의 값이 1 커지면 방출된 에너지는 약 32배가 된다. 규모 6의 지진은 규모 4의 지진보다 에너지가 약 1,000배 큰 셈이다.\n진도는 어떤 지점에서 사람이 느끼는 흔들림과 건물이 입은 피해의 정도를 등급으로 나타낸 것이다. 같은 지진이라도 진도는 장소마다 다르다. 지진이 시작된 곳에서 멀어질수록 대체로 작아지고, 지반이 무른 곳에서는 같은 거리라도 더 크게 나타난다. 지진이 일어난 깊이도 영향을 준다. 규모가 같더라도 얕은 곳에서 일어난 지진은 지표를 더 세게 흔든다. 또 진도는 등급을 나누는 기준이 나라마다 다를 수 있다.\n따라서 지진의 피해는 규모만으로 가늠할 수 없다. 규모가 큰 지진이라도 사람이 살지 않는 먼바다의 깊은 곳에서 일어나면 피해가 거의 없고, 규모가 그리 크지 않아도 도시 바로 아래 얕은 곳에서 일어나면 큰 피해를 낸다.","opts":["규모가 2만큼 큰 지진은 방출된 에너지가 약 64배 크다.","하나의 지진에 대해 관측 지점마다 서로 다른 규모 값이 정해진다.","같은 지진에서 같은 거리만큼 떨어진 두 지점의 진도는 서로 다를 수 있다.","진도는 지진계의 기록으로 계산한 에너지의 크기여서 어느 나라에서나 등급이 같다."],"ans":2,"exp":"진도는 장소마다 다르고, 지반이 무른 곳에서는 같은 거리라도 더 크게 나타난다고 했으므로 같은 거리의 두 지점도 진도가 다를 수 있다. 규모가 1 커지면 에너지가 약 32배이므로 2 커지면 약 1,000배이고, 하나의 지진에는 하나의 규모 값만 있다. 에너지의 크기를 나타내는 것은 규모이며 진도의 등급 기준은 나라마다 다를 수 있다."},
{"id":"k332","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n물체가 물에 뜨는지 가라앉는지는 무게가 아니라 밀도로 정해진다. 밀도는 물질의 질량을 부피로 나눈 값으로, 같은 부피 안에 물질이 얼마나 빽빽하게 들어 있는지를 나타낸다. 물의 밀도는 1세제곱센티미터에 1그램쯤이다. 밀도가 이보다 작은 나무토막은 물에 뜨고, 밀도가 큰 쇳덩이는 ㉠ __가라앉는다__.\n이는 부력으로 설명된다. 물에 잠긴 물체는 물로부터 위쪽으로 밀어 올리는 힘을 받는데, 그 크기는 물체가 밀어낸 물의 무게와 같다. 물체 전체가 잠겼을 때 밀어낸 물의 무게가 물체의 무게보다 크면 물체는 떠오른다. 떠오른 물체는 일부만 물에 잠긴 채로 멈추는데, 이때 잠긴 부분이 밀어낸 물의 무게는 물체의 무게와 꼭 같다.\n쇠로 만든 배가 뜨는 것도 같은 이치이다. 배는 속이 비어 있어서 쇠와 그 안의 공기를 합친 전체의 부피가 매우 크다. 전체 질량을 전체 부피로 나눈 평균 밀도가 물보다 작으므로 뜨는 것이다. 짐을 실을수록 배는 더 깊이 잠겨 더 많은 물을 밀어내고, 그만큼 커진 부력이 늘어난 무게를 떠받친다. 잠수함은 이 원리를 이용해 오르내린다. 탱크에 바닷물을 채워 평균 밀도를 바닷물보다 크게 하면 내려가고, 압축 공기로 그 물을 밀어내면 다시 떠오른다.\n부력의 크기는 물체가 잠긴 액체의 밀도에도 달려 있다. 소금이 녹아 있는 바닷물은 민물보다 밀도가 크므로 같은 부피를 밀어내도 더 큰 부력이 생긴다. 그래서 같은 배라도 강에서보다 바다에서 덜 잠긴다.","opts":["바다에서 강으로 들어선 배는 물에 잠기는 깊이가 전보다 얕아진다.","민물에서 가라앉는 달걀도 소금을 충분히 녹인 물에서는 떠오를 수 있다.","무게가 같은 두 물체는 부피가 서로 달라도 물에 뜨고 가라앉는 것이 같다.","잠수함이 탱크의 바닷물을 압축 공기로 밀어내면 평균 밀도가 커져서 가라앉는다."],"ans":1,"exp":"소금이 녹은 물은 민물보다 밀도가 커서 같은 부피를 밀어내도 부력이 더 크므로, 민물에서 가라앉던 달걀도 소금물의 밀도가 달걀보다 커지면 떠오른다. 바닷물보다 밀도가 작은 강물에서는 배가 더 깊이 잠기고, 뜨고 가라앉는 것은 무게가 아니라 밀도로 정해지므로 부피가 다르면 결과가 달라질 수 있다. 잠수함은 탱크의 물을 밀어내면 평균 밀도가 작아져 떠오른다."},
{"id":"k333","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n물체가 물에 뜨는지 가라앉는지는 무게가 아니라 밀도로 정해진다. 밀도는 물질의 질량을 부피로 나눈 값으로, 같은 부피 안에 물질이 얼마나 빽빽하게 들어 있는지를 나타낸다. 물의 밀도는 1세제곱센티미터에 1그램쯤이다. 밀도가 이보다 작은 나무토막은 물에 뜨고, 밀도가 큰 쇳덩이는 ㉠ __가라앉는다__.\n이는 부력으로 설명된다. 물에 잠긴 물체는 물로부터 위쪽으로 밀어 올리는 힘을 받는데, 그 크기는 물체가 밀어낸 물의 무게와 같다. 물체 전체가 잠겼을 때 밀어낸 물의 무게가 물체의 무게보다 크면 물체는 떠오른다. 떠오른 물체는 일부만 물에 잠긴 채로 멈추는데, 이때 잠긴 부분이 밀어낸 물의 무게는 물체의 무게와 꼭 같다.\n쇠로 만든 배가 뜨는 것도 같은 이치이다. 배는 속이 비어 있어서 쇠와 그 안의 공기를 합친 전체의 부피가 매우 크다. 전체 질량을 전체 부피로 나눈 평균 밀도가 물보다 작으므로 뜨는 것이다. 짐을 실을수록 배는 더 깊이 잠겨 더 많은 물을 밀어내고, 그만큼 커진 부력이 늘어난 무게를 떠받친다. 잠수함은 이 원리를 이용해 오르내린다. 탱크에 바닷물을 채워 평균 밀도를 바닷물보다 크게 하면 내려가고, 압축 공기로 그 물을 밀어내면 다시 떠오른다.\n부력의 크기는 물체가 잠긴 액체의 밀도에도 달려 있다. 소금이 녹아 있는 바닷물은 민물보다 밀도가 크므로 같은 부피를 밀어내도 더 큰 부력이 생긴다. 그래서 같은 배라도 강에서보다 바다에서 덜 잠긴다.","opts":["한참 울고 나니 마음이 __가라앉았다__.","약을 바르자 발목의 부기가 __가라앉았다__.","저녁이 되자 거세던 바람이 __가라앉았다__.","풍랑을 만난 고깃배가 바다 밑으로 __가라앉았다__."],"ans":3,"exp":"㉠의 '가라앉다'는 '물 따위에 떠 있거나 섞여 있는 것이 밑바닥으로 내려앉다'라는 뜻으로, '고깃배가 바다 밑으로 가라앉았다'의 '가라앉다'와 같다. '부기가 가라앉다'는 붓거나 부풀었던 것이 줄어들다, '마음이 가라앉다'는 흥분이나 괴로움 따위가 수그러들다, '바람이 가라앉다'는 바람이나 물결이 잠잠해지다의 뜻이다."},
{"id":"k334","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 적절하지 않은 것은?\n\n받침 ‘ㄷ, ㅌ’이 모음 ‘ㅣ’를 만나 ‘ㅈ, ㅊ’으로 바뀌는 현상을 구개음화라고 한다. ‘ㄷ, ㅌ’은 혀끝이 윗잇몸에 닿아 나는 소리이고 ‘ㅣ’는 혓바닥이 입천장 가까이 올라가 나는 소리이다. 둘을 이어 내려면 혀가 바삐 움직여야 하므로, 앞의 자음을 아예 ‘ㅣ’와 가까운 자리인 입천장에서 나는 ‘ㅈ, ㅊ’으로 바꾸어 발음을 편하게 하는 것이다. ‘굳이’가 [구지]로, ‘같이’가 [가치]로 소리 나는 것이 그 예이다. ‘ㄷ’ 뒤에 접미사 ‘-히-’가 올 때에도 ‘ㄷ’과 ‘ㅎ’이 합쳐진 ‘ㅌ’이 ‘ㅊ’으로 바뀌어 ‘닫히다’가 [다치다]로 발음된다.\n그런데 ‘ㄷ, ㅌ’ 뒤에 ‘ㅣ’가 온다고 언제나 구개음화가 일어나는 것은 아니다. 조건이 두 가지 있다. 첫째, ‘ㄷ, ㅌ’과 ‘ㅣ’ 사이에 형태소의 경계가 있어야 한다. ‘잔디’나 ‘느티나무’처럼 하나의 형태소 안에서는 일어나지 않는다. 둘째, 뒤에 오는 말이 조사나 접미사처럼 문법적 기능을 하는 말이어야 한다. ‘밭이’의 ‘이’는 조사이므로 [바치]로 발음하지만, ‘밭이랑’의 ‘이랑’은 실질적인 뜻을 지닌 말이므로 구개음화가 일어나지 않고 [반니랑]으로 발음한다.\n구개음화는 발음에서만 일어나며 표기에는 반영하지 않는다. [해도지]로 소리 나더라도 ‘해돋이’로 적어야 ‘돋다’에서 온 말임을 알아볼 수 있기 때문이다.","opts":["‘끝이’는 조사 ‘이’가 붙은 말이므로 [끄치]로 발음한다.","‘미닫이’는 [미다지]로 소리 나지만 적을 때는 ‘미닫이’로 적는다.","‘홑이불’은 ‘ㅌ’ 뒤에 ‘ㅣ’로 시작하는 ‘이불’이 왔으므로 [호치불]로 발음한다.","‘굳히다’는 ‘ㄷ’과 ‘ㅎ’이 합쳐진 ‘ㅌ’이 ‘ㅊ’으로 바뀌어 [구치다]로 발음한다."],"ans":2,"exp":"구개음화는 뒤에 오는 말이 조사나 접미사처럼 문법적 기능을 하는 말일 때만 일어난다. ‘홑이불’의 ‘이불’은 ‘밭이랑’의 ‘이랑’처럼 실질적인 뜻을 지닌 말이므로 구개음화가 일어나지 않는다. ‘끝이’는 조사가 붙어 [끄치]가 되고, ‘굳히다’는 ‘닫히다[다치다]’와 같은 과정을 거치며, 구개음화는 표기에 반영하지 않으므로 ‘미닫이’로 적는다."},
{"id":"k335","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n물가가 전반적으로, 그리고 지속적으로 오르는 현상을 인플레이션이라고 한다. 한두 가지 상품의 값이 오르는 것은 인플레이션이 아니다. 인플레이션이 일어나면 같은 돈으로 살 수 있는 물건의 양이 줄어든다. 곧 화폐의 구매력이 떨어진다.\n인플레이션은 원인에 따라 둘로 나누어 설명한다. 하나는 경제 전체의 수요가 공급 능력보다 빠르게 늘어날 때 생기는 수요 견인 인플레이션이다. 가계의 소비와 기업의 투자, 정부의 지출이 한꺼번에 늘어나면 사려는 양이 만들 수 있는 양을 넘어서고 물가가 오른다. ㉠ __이때__는 생산과 고용도 함께 늘어나므로 경기가 과열된 모습을 띤다. 다른 하나는 원자재 값이나 임금처럼 생산에 드는 비용이 올라서 생기는 비용 인상 인플레이션이다. 석유 값이 급등하면 기업은 같은 양을 만드는 데 돈이 더 들므로 값을 올리고 생산을 줄인다. ㉡ __이 경우__에는 물가가 오르면서 생산과 고용은 오히려 줄어든다. 물가 상승과 경기 침체가 겹치는 이런 상태를 스태그플레이션이라고 한다.\n원인이 다르면 대응의 어려움도 다르다. 중앙은행이 금리를 올리면 돈을 빌려 쓰는 부담이 커져 소비와 투자가 줄고, 수요가 식으면서 물가가 잡힌다. 경기 과열에서 비롯한 물가 상승에는 이 처방이 잘 맞는다. 그러나 ㉢ __공급 쪽의 충격으로 물가가 오를 때__ 금리를 올리면 물가는 잡히더라도 이미 위축된 생산과 고용이 더 나빠진다. 그렇다고 경기를 살리려고 금리를 내리면 물가가 더 오른다. ㉣ __이런 상황__에서 정책 당국은 물가와 경기 가운데 하나를 포기해야 하는 처지에 놓인다.","opts":["수요 견인 인플레이션이 일어날 때에는 물가가 오르면서 생산과 고용이 줄어든다.","인플레이션이 일어나면 화폐 한 단위로 살 수 있는 상품의 양이 이전보다 늘어난다.","특정 상품의 값이 크게 오르면 다른 상품의 값이 그대로여도 인플레이션이라고 한다.","금리 인상은 물가 상승의 원인이 수요 쪽보다 공급 쪽에 있을 때 경기에 주는 부담이 더 크다."],"ans":3,"exp":"금리 인상은 경기 과열에서 비롯한 물가 상승에는 잘 맞지만, 공급 쪽의 충격으로 물가가 오를 때에는 이미 위축된 생산과 고용을 더 나쁘게 한다고 했다. 인플레이션이 일어나면 화폐의 구매력이 떨어지고, 수요 견인 인플레이션에서는 생산과 고용이 함께 늘어난다. 한두 가지 상품의 값이 오르는 것은 인플레이션이 아니다."},
{"id":"k336","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 가리키는 대상이 나머지와 다른 하나는?\n\n물가가 전반적으로, 그리고 지속적으로 오르는 현상을 인플레이션이라고 한다. 한두 가지 상품의 값이 오르는 것은 인플레이션이 아니다. 인플레이션이 일어나면 같은 돈으로 살 수 있는 물건의 양이 줄어든다. 곧 화폐의 구매력이 떨어진다.\n인플레이션은 원인에 따라 둘로 나누어 설명한다. 하나는 경제 전체의 수요가 공급 능력보다 빠르게 늘어날 때 생기는 수요 견인 인플레이션이다. 가계의 소비와 기업의 투자, 정부의 지출이 한꺼번에 늘어나면 사려는 양이 만들 수 있는 양을 넘어서고 물가가 오른다. ㉠ __이때__는 생산과 고용도 함께 늘어나므로 경기가 과열된 모습을 띤다. 다른 하나는 원자재 값이나 임금처럼 생산에 드는 비용이 올라서 생기는 비용 인상 인플레이션이다. 석유 값이 급등하면 기업은 같은 양을 만드는 데 돈이 더 들므로 값을 올리고 생산을 줄인다. ㉡ __이 경우__에는 물가가 오르면서 생산과 고용은 오히려 줄어든다. 물가 상승과 경기 침체가 겹치는 이런 상태를 스태그플레이션이라고 한다.\n원인이 다르면 대응의 어려움도 다르다. 중앙은행이 금리를 올리면 돈을 빌려 쓰는 부담이 커져 소비와 투자가 줄고, 수요가 식으면서 물가가 잡힌다. 경기 과열에서 비롯한 물가 상승에는 이 처방이 잘 맞는다. 그러나 ㉢ __공급 쪽의 충격으로 물가가 오를 때__ 금리를 올리면 물가는 잡히더라도 이미 위축된 생산과 고용이 더 나빠진다. 그렇다고 경기를 살리려고 금리를 내리면 물가가 더 오른다. ㉣ __이런 상황__에서 정책 당국은 물가와 경기 가운데 하나를 포기해야 하는 처지에 놓인다.","opts":["㉠","㉡","㉢","㉣"],"ans":0,"exp":"㉠은 수요가 공급 능력보다 빠르게 늘어 물가가 오르는 수요 견인 인플레이션의 경우를 가리킨다. ㉡, ㉢, ㉣은 모두 생산 비용이 올라 물가가 오르면서 생산과 고용이 줄어드는 비용 인상 인플레이션의 경우를 가리킨다."},
{"id":"k337","subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 가장 적절한 것은?\n\n기체는 고체나 액체와 달리 부피가 쉽게 변한다. 기체를 이루는 입자들이 서로 멀리 떨어진 채 빠르게 움직이기 때문이다. 기체의 부피를 바꾸는 요인은 압력과 온도이다.\n온도가 일정할 때 기체의 부피는 압력에 반비례한다. 압력을 두 배로 높이면 부피는 절반으로 줄고, 압력이 절반으로 낮아지면 부피는 두 배로 늘어난다. 주사기의 끝을 막고 피스톤을 누르면 안의 공기가 눌려 부피가 줄어드는 것이 그 예이다. 높은 산에 오르면 과자 봉지가 부풀어 오르는 것도 같은 이치이다. 봉지 밖의 기압이 낮아지면서 안의 공기가 팽창한 것이다.\n압력이 일정할 때 기체의 부피는 온도가 오를수록 늘어난다. 온도가 오르면 입자들의 운동이 활발해져 벽을 더 세게, 더 자주 두드리기 때문이다. 찌그러진 탁구공을 뜨거운 물에 넣으면 안의 공기가 팽창하여 공이 펴진다.\n부피가 변할 수 없는 단단한 용기에 갇힌 기체는 온도가 오르면 부피 대신 압력이 커진다. 그래서 불 가까이에 둔 스프레이 통은 터질 수 있다. 반대로 온도가 내려가면 압력이 낮아진다. 추운 겨울 아침에 자동차 타이어의 공기압이 낮게 나오는 것은 공기가 샌 것이 아니라 타이어 안 공기의 온도가 내려갔기 때문일 수 있다.","opts":["여름 한낮에 오래 달린 자동차의 타이어 공기압은 달리기 전보다 낮아진다.","비행기가 높이 올라 기내의 기압이 낮아지면 밀봉한 과자 봉지는 쪼그라든다.","뜨거운 물로 헹군 빈 페트병의 뚜껑을 바로 닫아 두면 식으면서 병이 부풀어 오른다.","물속은 깊을수록 압력이 크므로 잠수부가 내쉰 공기 방울은 수면에 가까워질수록 커진다."],"ans":3,"exp":"기체의 부피는 압력에 반비례하므로, 공기 방울은 압력이 큰 깊은 곳에서 압력이 작은 수면 쪽으로 올라올수록 커진다. 달려서 뜨거워진 타이어 안의 공기는 온도가 올라 압력이 커지고, 밖의 기압이 낮아지면 봉지 안의 공기는 팽창한다. 뜨거운 공기가 든 페트병은 식으면서 안의 공기가 줄어들어 찌그러진다."},
{"id":"k338","subj":"국어","unit":"국어학 지문","q":"다음 글을 바탕으로 판단한 내용으로 적절하지 않은 것은?\n\n어떤 내용을 부정하는 문장을 부정문이라고 한다. 국어의 부정문은 부정하는 말에 따라 ‘안’ 부정문과 ‘못’ 부정문으로 ㉠ __구분된다__. ‘안’ 부정문은 어떤 사실이 그렇지 않음을 단순히 나타내거나, 주어가 그 일을 할 뜻이 없음을 나타낸다. “오늘은 비가 안 온다.”는 앞의 예이고 “나는 그 모임에 안 갔다.”는 뒤의 예이다. ‘못’ 부정문은 주어에게 할 뜻이 있더라도 능력이 ㉡ __부족하거나__ 바깥 사정이 허락하지 않아 일이 이루어지지 않음을 나타낸다. “다리를 다쳐서 모임에 못 갔다.”가 그 예이다.\n부정문은 길이에 따라서도 나뉜다. 서술어 앞에 ‘안’이나 ‘못’을 놓은 것을 짧은 부정문, 서술어의 어간에 ‘-지 않다’나 ‘-지 못하다’를 붙인 것을 긴 부정문이라고 한다. “밥을 안 먹는다.”와 “밥을 먹지 않는다.”, “밥을 못 먹는다.”와 “밥을 먹지 못한다.”가 각각 짝을 이룬다. 다만 ‘공부하다’처럼 명사에 ‘하다’가 붙어 이루어진 동사는 짧은 부정문을 만들 때 ‘안’을 명사와 ‘하다’ 사이에 넣어 “공부 안 한다.”라고 한다.\n부정문을 만드는 데에는 몇 가지 ㉢ __제약__이 있다. 첫째, ‘못’ 부정문은 능력과 관계되는 것이어서 원칙적으로 동사에만 쓰인다. 상태를 나타내는 형용사 앞에는 ‘못’을 놓을 수 없어서 “방이 못 넓다.”라고 하지 않는다. 다만 긴 부정문의 ‘-지 못하다’는 형용사에 붙어, 기대하는 정도에 미치지 못하여 아쉽다는 뜻을 나타내기도 한다. “방이 넓지 못하다.”가 그런 예이다. 둘째, 명령문과 청유문에서는 ‘-지 않다’나 ‘-지 못하다’를 쓰지 않고 ‘말다’가 그 자리를 ㉣ __대체한다__. “떠들지 않아라.”, “떠들지 않자.”가 아니라 “떠들지 마라.”, “떠들지 말자.”라고 하는 것이다.","opts":["“눈이 많이 와서 학교에 못 갔다.”는 바깥 사정 때문에 일이 이루어지지 않았음을 나타낸다.","“형은 주말에 운동하지 않는다.”를 짧은 부정문으로 바꾸면 “형은 주말에 운동 안 한다.”가 된다.","“복도에서 뛰지 않자.”는 청유문에 ‘-지 않다’를 붙여 알맞게 만든 부정문이다.","형용사 ‘넉넉하다’에 ‘-지 못하다’가 붙은 “살림이 넉넉하지 못하다.”는 기대에 미치지 못한다는 뜻을 나타낸다."],"ans":2,"exp":"명령문과 청유문에서는 ‘-지 않다’ 대신 ‘말다’를 쓰므로 “복도에서 뛰지 말자.”라고 해야 한다. 눈이 와서 가지 못한 것은 바깥 사정이 허락하지 않은 경우이고, 명사에 ‘하다’가 붙은 ‘운동하다’는 ‘안’을 사이에 넣어 ‘운동 안 한다’로 짧은 부정문을 만든다. 형용사에 붙은 ‘-지 못하다’는 기대하는 정도에 미치지 못하여 아쉽다는 뜻을 나타낸다."},
{"id":"k339","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n어떤 내용을 부정하는 문장을 부정문이라고 한다. 국어의 부정문은 부정하는 말에 따라 ‘안’ 부정문과 ‘못’ 부정문으로 ㉠ __구분된다__. ‘안’ 부정문은 어떤 사실이 그렇지 않음을 단순히 나타내거나, 주어가 그 일을 할 뜻이 없음을 나타낸다. “오늘은 비가 안 온다.”는 앞의 예이고 “나는 그 모임에 안 갔다.”는 뒤의 예이다. ‘못’ 부정문은 주어에게 할 뜻이 있더라도 능력이 ㉡ __부족하거나__ 바깥 사정이 허락하지 않아 일이 이루어지지 않음을 나타낸다. “다리를 다쳐서 모임에 못 갔다.”가 그 예이다.\n부정문은 길이에 따라서도 나뉜다. 서술어 앞에 ‘안’이나 ‘못’을 놓은 것을 짧은 부정문, 서술어의 어간에 ‘-지 않다’나 ‘-지 못하다’를 붙인 것을 긴 부정문이라고 한다. “밥을 안 먹는다.”와 “밥을 먹지 않는다.”, “밥을 못 먹는다.”와 “밥을 먹지 못한다.”가 각각 짝을 이룬다. 다만 ‘공부하다’처럼 명사에 ‘하다’가 붙어 이루어진 동사는 짧은 부정문을 만들 때 ‘안’을 명사와 ‘하다’ 사이에 넣어 “공부 안 한다.”라고 한다.\n부정문을 만드는 데에는 몇 가지 ㉢ __제약__이 있다. 첫째, ‘못’ 부정문은 능력과 관계되는 것이어서 원칙적으로 동사에만 쓰인다. 상태를 나타내는 형용사 앞에는 ‘못’을 놓을 수 없어서 “방이 못 넓다.”라고 하지 않는다. 다만 긴 부정문의 ‘-지 못하다’는 형용사에 붙어, 기대하는 정도에 미치지 못하여 아쉽다는 뜻을 나타내기도 한다. “방이 넓지 못하다.”가 그런 예이다. 둘째, 명령문과 청유문에서는 ‘-지 않다’나 ‘-지 못하다’를 쓰지 않고 ‘말다’가 그 자리를 ㉣ __대체한다__. “떠들지 않아라.”, “떠들지 않자.”가 아니라 “떠들지 마라.”, “떠들지 말자.”라고 하는 것이다.","opts":["㉠: 묶인다","㉡: 모자라거나","㉢: 제한","㉣: 대신한다"],"ans":0,"exp":"‘구분되다’는 일정한 기준에 따라 전체가 몇 갈래로 갈린다는 뜻이므로 ‘나뉜다’와 통하고, 여럿이 하나로 합쳐진다는 뜻의 ‘묶인다’와는 바꿔 쓸 수 없다. ‘부족하거나’는 ‘모자라거나’, ‘제약’은 ‘제한’, ‘대체한다’는 ‘대신한다’와 뜻이 통한다."},
