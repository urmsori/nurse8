{"id":"k340","subj":"국어","unit":"내용 이해","q":"다음 글을 이해한 내용으로 적절하지 않은 것은?\n\n새 약의 효과를 확인하려면 약을 먹은 사람들이 나았다는 사실만으로는 부족하다. 병은 저절로 낫기도 하고, 약을 먹었다는 믿음만으로 증상이 가벼워지기도 하기 때문이다. 약효 성분이 없는 가짜 약을 먹고도 증상이 나아지는 현상을 위약 효과라고 한다.\n그래서 임상 시험에서는 참가자를 두 집단으로 나누어 한쪽에는 시험하려는 약을, 다른 쪽에는 모양과 맛이 똑같은 위약을 준다. 두 집단의 결과를 견주어 그 차이만을 약의 효과로 본다. 이때 누가 어느 집단에 들어갈지는 연구자가 고르지 않고 제비뽑기처럼 무작위로 정한다. 연구자가 고르면 증상이 가벼운 사람을 자기도 모르게 시험약 쪽에 넣을 수 있고, 그러면 약이 실제보다 좋아 보이게 된다.\n또 하나의 장치가 눈가림이다. 참가자가 자기가 어느 약을 받는지 알면 기대나 실망이 증상에 영향을 준다. 그래서 참가자가 모르게 하는 것을 단일 눈가림이라고 한다. 그런데 평가하는 의료진이 알고 있어도 문제가 생긴다. 시험약을 받은 사람의 변화를 더 좋게 평가하거나, 태도와 말투로 참가자에게 단서를 줄 수 있다. 참가자와 의료진이 모두 모르게 하는 것을 이중 눈가림이라고 하며, 이것이 약효를 확인하는 믿을 만한 방법으로 꼽힌다. 다만 수술처럼 가짜로 꾸미기 어려운 치료에는 눈가림을 온전히 적용하기 어렵다.","opts":["위약을 받은 집단에서도 증상이 나아지는 사람이 나올 수 있다.","무작위 배정은 연구자의 선택이 결과에 끼어드는 것을 막는 장치이다.","두 집단이 나아진 정도가 같다면 그 시험에서 약의 효과는 확인되지 않은 것이다.","이중 눈가림 시험에서 의료진은 참가자가 받은 약이 무엇인지 알고서 변화를 평가한다."],"ans":3,"exp":"이중 눈가림은 참가자와 의료진이 모두 누가 어느 약을 받았는지 모르게 하는 것이다. 의료진이 알면 평가가 기울거나 참가자에게 단서를 줄 수 있기 때문이다. 위약을 먹고도 증상이 나아질 수 있고, 무작위 배정은 연구자가 고를 때 생기는 치우침을 막으며, 약의 효과는 두 집단의 차이로 보므로 차이가 없으면 효과가 확인되지 않은 것이다."},
{"id":"k341","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 김 주무관이 민원실에 배치되면 이 주무관은 세무과에 배치된다.\n○ 이 주무관이 세무과에 배치되지 않거나 박 주무관이 복지과에 배치된다.\n○ 박 주무관은 복지과에 배치되지 않는다.\n○ 김 주무관이 민원실에 배치되지 않으면 최 주무관이 민원실에 배치된다.","opts":["최 주무관은 민원실에 배치된다.","이 주무관은 세무과에 배치된다.","김 주무관과 최 주무관은 모두 민원실에 배치된다.","김 주무관은 민원실에 배치되고 이 주무관은 세무과에 배치되지 않는다."],"ans":0,"exp":"박 주무관이 복지과에 배치되지 않으므로, 둘째 진술이 참이려면 이 주무관은 세무과에 배치되지 않아야 한다. 그러면 첫째 진술의 대우에 따라 김 주무관은 민원실에 배치되지 않고, 넷째 진술에 따라 최 주무관이 민원실에 배치된다. 이 주무관이 세무과에 배치된다는 진술과 김 주무관이 민원실에 배치된다는 내용이 들어간 진술은 모두 거짓이다."},
{"id":"k342","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 정보화 교육을 이수한 직원은 모두 승진 심사 대상이다.\n○ 승진 심사 대상인 직원 중에 징계를 받은 직원은 없다.\n○ 기획팀 직원 중에는 징계를 받은 직원이 있다.","opts":["기획팀 직원은 모두 승진 심사 대상이 아니다.","승진 심사 대상이 아닌 직원은 모두 징계를 받았다.","정보화 교육을 이수하지 않은 직원은 모두 징계를 받았다.","기획팀 직원 중에는 정보화 교육을 이수하지 않은 직원이 있다."],"ans":3,"exp":"첫째와 둘째 진술에서 '정보화 교육을 이수한 직원 중에 징계를 받은 직원은 없다'가 나온다. 셋째 진술에 따라 기획팀에는 징계를 받은 직원이 있고, 그 직원은 정보화 교육을 이수하지 않았으므로 기획팀에는 정보화 교육을 이수하지 않은 직원이 있다. 기획팀 직원 전부가 심사 대상이 아닌지는 알 수 없고, 심사 대상이 아니거나 교육을 이수하지 않았다고 해서 징계를 받았다고 할 수도 없다."},
{"id":"k343","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 예산이 증액되거나 인력이 충원되면 방문 건강 관리 사업이 확대된다.\n○ 방문 건강 관리 사업이 확대되면 전담 부서가 신설된다.\n○ 전담 부서는 신설되지 않는다.\n○ 인력이 충원되지 않으면 사업 기간이 연장된다.","opts":["인력이 충원된다.","사업 기간이 연장되지 않는다.","예산은 증액되지 않고 사업 기간은 연장된다.","예산이 증액되거나 방문 건강 관리 사업이 확대된다."],"ans":2,"exp":"전담 부서가 신설되지 않으므로 둘째 진술의 대우에 따라 사업은 확대되지 않는다. 그러면 첫째 진술의 대우에 따라 예산은 증액되지 않고 인력도 충원되지 않는다('또는'의 부정은 둘 다 아님이다). 인력이 충원되지 않으므로 넷째 진술에 따라 사업 기간은 연장된다. 따라서 '예산은 증액되지 않고 사업 기간은 연장된다'가 반드시 참이고, 나머지는 모두 거짓이다."},
{"id":"k344","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참이라고 할 수 없는 것은?\n\n○ 청렴 교육을 이수한 사람은 모두 성과 평가에서 가점을 받는다.\n○ 신규 임용자는 모두 청렴 교육을 이수하였다.\n○ 성과 평가에서 가점을 받는 사람 중에는 국외 연수 대상자로 선발된 사람이 있다.","opts":["신규 임용자는 모두 성과 평가에서 가점을 받는다.","성과 평가에서 가점을 받지 못하는 사람은 신규 임용자가 아니다.","신규 임용자 중에는 국외 연수 대상자로 선발된 사람이 있다.","청렴 교육을 이수하지 않은 사람 중에 신규 임용자는 없다."],"ans":2,"exp":"둘째와 첫째 진술을 이으면 '신규 임용자는 모두 가점을 받는다'가 되고, 그 대우인 '가점을 받지 못하는 사람은 신규 임용자가 아니다'도 참이다. '청렴 교육을 이수하지 않은 사람 중에 신규 임용자는 없다'는 둘째 진술과 같은 말이다. 그러나 가점을 받는 사람 가운데 국외 연수 대상자로 선발된 사람이 신규 임용자인지는 알 수 없으므로, 신규 임용자 중에 국외 연수 대상자가 있다는 것은 반드시 참이라고 할 수 없다."},
{"id":"k345","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 재난 대응 훈련에 참가한 직원은 모두 응급 처치 교육을 받았다.\n○ 갑은 재난 대응 훈련에 참가하였거나 야간 당직에서 제외되었다.\n○ 야간 당직에서 제외된 직원은 모두 주말 근무를 한다.\n○ 갑은 응급 처치 교육을 받지 않았다.","opts":["갑은 주말 근무를 한다.","갑은 재난 대응 훈련에 참가하였다.","갑은 야간 당직에서 제외되지 않았다.","주말 근무를 하는 직원은 모두 야간 당직에서 제외되었다."],"ans":0,"exp":"갑은 응급 처치 교육을 받지 않았으므로 첫째 진술의 대우에 따라 재난 대응 훈련에 참가하지 않았다. 둘째 진술에서 훈련에 참가하지 않았으니 갑은 야간 당직에서 제외되었고, 셋째 진술에 따라 갑은 주말 근무를 한다. '주말 근무를 하는 직원은 모두 야간 당직에서 제외되었다'는 셋째 진술의 역이어서 반드시 참이 아니다."},
{"id":"k346","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ ‘마을 돌봄’ 사업이 선정되면 ‘청년 창업’ 사업은 선정되지 않는다.\n○ ‘도시 재생’ 사업이 선정되는 경우에만 ‘스마트 농업’ 사업이 선정된다.\n○ ‘청년 창업’ 사업과 ‘스마트 농업’ 사업 중 적어도 하나는 선정된다.\n○ ‘도시 재생’ 사업은 선정되지 않는다.","opts":["‘마을 돌봄’ 사업과 ‘청년 창업’ 사업이 모두 선정된다.","‘마을 돌봄’ 사업과 ‘스마트 농업’ 사업은 모두 선정되지 않는다.","‘청년 창업’ 사업은 선정되지 않고 ‘스마트 농업’ 사업은 선정된다.","‘마을 돌봄’ 사업은 선정되고 ‘청년 창업’ 사업은 선정되지 않는다."],"ans":1,"exp":"둘째 진술은 '스마트 농업이 선정되면 도시 재생이 선정된다'는 뜻이다. 도시 재생이 선정되지 않으므로 스마트 농업도 선정되지 않고, 셋째 진술에 따라 청년 창업이 선정된다. 청년 창업이 선정되므로 첫째 진술의 대우에 따라 마을 돌봄은 선정되지 않는다. 따라서 마을 돌봄과 스마트 농업은 모두 선정되지 않으며, 나머지는 이 결과와 어긋난다."},
{"id":"k347","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 조직 개편안이 통과되면 총무과와 회계과가 통합되고 민원 창구가 일원화된다.\n○ 민원 창구가 일원화되면 대기 시간이 단축되거나 상담 인력이 감축된다.\n○ 상담 인력은 감축되지 않는다.","opts":["조직 개편안이 통과되면 대기 시간이 단축된다.","대기 시간이 단축되면 조직 개편안이 통과된 것이다.","총무과와 회계과가 통합되면 민원 창구가 일원화된다.","민원 창구가 일원화되지 않으면 대기 시간이 단축되지 않는다."],"ans":0,"exp":"개편안이 통과되면 첫째 진술에 따라 민원 창구가 일원화되고, 둘째 진술에 따라 대기 시간이 단축되거나 상담 인력이 감축된다. 상담 인력은 감축되지 않으므로 대기 시간이 단축된다. 따라서 '개편안이 통과되면 대기 시간이 단축된다'가 반드시 참이다. 대기 시간이 단축되었다고 해서 개편안이 통과된 것은 아니고, 통합과 일원화는 개편안 통과의 결과로 함께 제시되었을 뿐 서로 조건 관계가 아니며, 창구가 일원화되지 않아도 다른 까닭으로 대기 시간이 단축될 수 있다."},
{"id":"k348","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 보건직 공무원만 감염병 대응팀에 배치된다.\n○ 감염병 대응팀에 배치된 사람은 모두 역학 조사 교육을 이수하였다.\n○ 역학 조사 교육을 이수한 사람 중에는 보건직 공무원이 아닌 사람이 있다.","opts":["보건직 공무원은 모두 감염병 대응팀에 배치된다.","보건직 공무원은 모두 역학 조사 교육을 이수하였다.","감염병 대응팀에 배치되지 않은 사람은 모두 보건직 공무원이 아니다.","역학 조사 교육을 이수한 사람 중에는 감염병 대응팀에 배치되지 않은 사람이 있다."],"ans":3,"exp":"첫째 진술은 '감염병 대응팀에 배치된 사람은 모두 보건직 공무원이다'라는 뜻이다. 셋째 진술의 '역학 조사 교육을 이수했지만 보건직이 아닌 사람'은 보건직이 아니므로 대응팀에 배치되지 않았다. 따라서 교육을 이수한 사람 중에는 대응팀에 배치되지 않은 사람이 있다. 보건직이 모두 대응팀에 배치되거나 모두 교육을 이수했다는 것, 대응팀에 배치되지 않은 사람이 모두 보건직이 아니라는 것은 첫째 진술을 거꾸로 읽은 것이어서 반드시 참이 아니다."},
{"id":"k349","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n민원 응대 우수자로 뽑힌 직원 중에 친절 교육에 빠진 적이 있는 직원은 없다. 따라서 __세무과 직원 중에는 민원 응대 우수자로 뽑히지 않은 직원이 있다__.","opts":["세무과 직원 중에 친절 교육에 빠진 적이 있는 직원은 없다.","세무과 직원 중에는 친절 교육에 빠진 적이 있는 직원이 있다.","친절 교육에 빠진 적이 없는 직원은 모두 민원 응대 우수자로 뽑혔다.","친절 교육에 빠진 적이 있는 직원 중에는 세무과 직원이 아닌 직원이 있다."],"ans":1,"exp":"주어진 전제의 대우는 '친절 교육에 빠진 적이 있는 직원은 민원 응대 우수자로 뽑히지 않았다'이다. 세무과 직원 중에 친절 교육에 빠진 적이 있는 직원이 있다면 그 직원은 우수자로 뽑히지 않았으므로 결론이 나온다. 세무과 직원이 모두 교육에 빠진 적이 없다거나, 빠진 적이 없는 직원이 모두 우수자로 뽑혔다는 전제로는 세무과에 우수자로 뽑히지 않은 직원이 있음을 알 수 없고, 세무과 밖의 직원에 대한 진술은 결론과 관계가 없다."},
{"id":"k350","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n적극 행정 우수 사례로 선정된 부서는 모두 포상을 받는다. 포상을 받는 부서는 모두 다음 해 예산 편성에서 우대를 받는다. 따라서 __주민 참여 예산제를 운영하는 부서는 모두 다음 해 예산 편성에서 우대를 받는다__.","opts":["포상을 받는 부서는 모두 주민 참여 예산제를 운영한다.","주민 참여 예산제를 운영하는 부서 중에는 포상을 받는 부서가 있다.","적극 행정 우수 사례로 선정된 부서는 모두 주민 참여 예산제를 운영한다.","적극 행정 우수 사례로 선정되지 않은 부서 중에 주민 참여 예산제를 운영하는 부서는 없다."],"ans":3,"exp":"두 전제를 이으면 '적극 행정 우수 사례로 선정된 부서는 모두 우대를 받는다'가 된다. 결론이 나오려면 주민 참여 예산제를 운영하는 부서가 모두 우수 사례로 선정된 부서여야 하는데, '우수 사례로 선정되지 않은 부서 중에 주민 참여 예산제를 운영하는 부서는 없다'가 바로 그 말이다. 포상을 받는 부서나 우수 사례 부서가 모두 주민 참여 예산제를 운영한다는 것은 방향이 거꾸로이고, 일부가 포상을 받는다는 것으로는 '모두'라는 결론에 이르지 못한다."},
{"id":"k351","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n박 팀장이 출장을 가면 최 주무관이 회의를 주재한다. 최 주무관이 회의를 주재하면 회의는 오후로 미뤄진다. 박 팀장이 출장을 가지 않으면 현장 점검이 취소된다. 따라서 __회의는 오후로 미뤄진다__.","opts":["현장 점검이 취소된다.","박 팀장은 출장을 가지 않는다.","회의가 오후로 미뤄지면 박 팀장이 출장을 간다.","현장 점검이 취소되면 회의는 오후로 미뤄진다."],"ans":3,"exp":"박 팀장이 출장을 가는 경우에는 앞의 두 전제에 따라 회의가 오후로 미뤄진다. 출장을 가지 않는 경우에는 현장 점검이 취소되므로, '현장 점검이 취소되면 회의는 오후로 미뤄진다'가 더해지면 이 경우에도 회의가 미뤄진다. 두 경우 모두 같은 결과이므로 결론이 나온다. 현장 점검이 취소된다거나 박 팀장이 출장을 가지 않는다는 것만으로는 회의가 미뤄지는지 알 수 없고, 회의가 미뤄지면 출장을 간다는 것은 방향이 거꾸로이다."},
{"id":"k352","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n이번 인사에서 갑은 본청에 남거나 사업소로 옮긴다. 갑이 본청에 남으면 갑은 예산 업무를 맡는다. 따라서 __갑은 예산 업무를 맡거나 시설 관리 업무를 맡는다__.","opts":["갑이 사업소로 옮기면 갑은 시설 관리 업무를 맡는다.","갑이 시설 관리 업무를 맡으면 갑은 사업소로 옮긴다.","갑이 예산 업무를 맡지 않으면 갑은 본청에 남지 않는다.","갑이 본청에 남으면 갑은 시설 관리 업무를 맡지 않는다."],"ans":0,"exp":"갑은 본청에 남거나 사업소로 옮기는데, 본청에 남는 경우에는 예산 업무를 맡는다. 사업소로 옮기는 경우에 시설 관리 업무를 맡는다는 전제가 더해지면, 어느 경우든 예산 업무나 시설 관리 업무 가운데 하나를 맡게 되어 결론이 나온다. '시설 관리 업무를 맡으면 사업소로 옮긴다'는 방향이 거꾸로이고, '예산 업무를 맡지 않으면 본청에 남지 않는다'는 이미 있는 전제의 대우일 뿐이며, 나머지 하나는 사업소로 옮기는 경우에 대해 아무것도 알려 주지 않는다."},
{"id":"k353","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n비상 근무 명단에 오른 직원 중에 이번 주에 연가를 쓴 직원은 없다. 따라서 __재난 상황실 근무자 중에 이번 주에 연가를 쓴 직원은 없다__.","opts":["재난 상황실 근무자는 모두 비상 근무 명단에 올랐다.","비상 근무 명단에 오른 직원은 모두 재난 상황실 근무자이다.","재난 상황실 근무자 중에는 비상 근무 명단에 오른 직원이 있다.","이번 주에 연가를 쓰지 않은 직원은 모두 비상 근무 명단에 올랐다."],"ans":0,"exp":"전제는 '비상 근무 명단에 오른 직원은 누구도 이번 주에 연가를 쓰지 않았다'는 뜻이다. 재난 상황실 근무자가 모두 그 명단에 올랐다면 상황실 근무자 누구도 연가를 쓰지 않았다는 결론이 나온다. 명단에 오른 직원이 모두 상황실 근무자라는 것은 방향이 거꾸로이고, 상황실 근무자 일부만 명단에 올랐다면 나머지 근무자가 연가를 썼을 수 있다. 연가를 쓰지 않은 직원이 모두 명단에 올랐다는 것도 연가를 쓴 상황실 근무자가 없음을 보장하지 않는다."},
{"id":"k354","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n5년 이상 근무한 직원만 국외 단기 연수를 신청할 수 있다. 올해 전입한 직원 중에 5년 이상 근무한 직원은 없다. 따라서 __갑은 국외 단기 연수를 신청할 수 없다__.","opts":["갑은 올해 전입한 직원이다.","갑은 올해 전입한 직원이 아니다.","올해 전입하지 않은 직원은 모두 5년 이상 근무하였다.","5년 이상 근무한 직원은 모두 국외 단기 연수를 신청할 수 있다."],"ans":0,"exp":"첫째 전제는 '국외 단기 연수를 신청할 수 있는 직원은 모두 5년 이상 근무하였다'는 뜻이므로, 5년 이상 근무하지 않은 직원은 신청할 수 없다. 갑이 올해 전입한 직원이라면 둘째 전제에 따라 5년 이상 근무하지 않았으므로 신청할 수 없다는 결론이 나온다. 갑이 올해 전입한 직원이 아니라면 근무 기간을 알 수 없고, 나머지 두 진술은 갑에 대해 아무것도 알려 주지 않는다."},
{"id":"k355","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n올해 우수 부서로는 교통과와 환경과 가운데 적어도 한 곳이 선정된다. 환경과가 선정되면 위생과도 선정된다. 따라서 __교통과가 선정된다__.","opts":["환경과가 선정된다.","위생과가 선정된다.","위생과는 선정되지 않는다.","환경과가 선정되지 않으면 위생과도 선정되지 않는다."],"ans":2,"exp":"위생과가 선정되지 않는다면 둘째 전제의 대우에 따라 환경과도 선정되지 않는다. 교통과와 환경과 가운데 적어도 한 곳은 선정되므로 교통과가 선정된다는 결론이 나온다. 환경과나 위생과가 선정된다는 전제를 더해도 교통과가 선정되는지는 알 수 없고, '환경과가 선정되지 않으면 위생과도 선정되지 않는다'를 더해도 환경과와 위생과만 선정되는 경우를 막지 못한다."},
{"id":"k356","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n공직 윤리 과정 수강생 중에는 5급 승진 예정자가 있다. 따라서 __5급 승진 예정자 중에는 원격 강의를 듣지 않는 사람이 있다__.","opts":["5급 승진 예정자는 모두 공직 윤리 과정 수강생이다.","공직 윤리 과정 수강생 중에 원격 강의를 듣는 사람은 없다.","원격 강의를 듣지 않는 사람은 모두 공직 윤리 과정 수강생이다.","공직 윤리 과정 수강생 중에는 원격 강의를 듣지 않는 사람이 있다."],"ans":1,"exp":"공직 윤리 과정 수강생이면서 5급 승진 예정자인 사람이 적어도 한 명 있다. 수강생 중에 원격 강의를 듣는 사람이 없다면 그 사람도 원격 강의를 듣지 않으므로 결론이 나온다. 수강생 일부만 원격 강의를 듣지 않는다는 전제로는 그 일부가 승진 예정자인지 알 수 없다. 승진 예정자가 모두 수강생이라거나 원격 강의를 듣지 않는 사람이 모두 수강생이라는 전제도 승진 예정자가 원격 강의를 듣는지에 대해서는 말해 주지 않는다."},
{"id":"k357","subj":"국어","unit":"논리","q":"(가)~(다)를 전제로 할 때 빈칸에 들어갈 결론으로 가장 적절한 것은?\n\n(가) 재택근무를 신청한 직원은 모두 보안 서약서를 제출하였다.\n(나) 보안 서약서를 제출한 직원은 모두 업무용 노트북을 지급받았거나 원격 접속 계정을 발급받았다.\n(다) 갑은 재택근무를 신청하였지만 업무용 노트북을 지급받지 못하였다.\n따라서 ______.","opts":["갑은 보안 서약서를 제출하지 않았다","갑은 원격 접속 계정을 발급받았다","보안 서약서를 제출한 직원은 모두 재택근무를 신청하였다","원격 접속 계정을 발급받은 직원은 모두 재택근무를 신청하였다"],"ans":1,"exp":"(다)에서 갑은 재택근무를 신청하였으므로 (가)에 따라 보안 서약서를 제출하였고, (나)에 따라 업무용 노트북을 지급받았거나 원격 접속 계정을 발급받았다. 갑은 노트북을 지급받지 못하였으므로 원격 접속 계정을 발급받았다. 갑이 서약서를 제출하지 않았다는 것은 (가)와 어긋나고, 나머지 둘은 (가)와 (나)의 방향을 거꾸로 읽은 것이어서 결론으로 삼을 수 없다."},
{"id":"k358","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 다음 달 순회 교육은 어느 권역에서 열기로 했나요?\n을: 아직 조율하고 있는데, 여러 권역에서 열 수도 있습니다. 다만 동부권에서 열지 않는다면 서부권에서는 엽니다.\n병: 서부권에서 열면 남부권에서는 열지 않습니다.\n정: 그리고 강사 일정을 확인해 보니 ______.\n갑: 여러분의 말을 종합하면 남부권에서는 열지 않겠군요.","opts":["동부권에서 열면 남부권에서도 엽니다","서부권에서 열지 않으면 남부권에서 엽니다","동부권과 서부권 가운데 한 곳에서만 엽니다","동부권과 남부권 두 곳에서 모두 열 수는 없습니다"],"ans":3,"exp":"남부권에서 연다고 가정해 보자. 정의 말이 '동부권과 남부권 두 곳에서 모두 열 수는 없다'라면 동부권에서는 열지 않고, 을의 말에 따라 서부권에서 열며, 병의 말에 따라 남부권에서는 열지 않게 되어 가정과 어긋난다. 따라서 남부권에서는 열지 않는다는 갑의 결론이 나온다. 나머지 말을 넣으면 '동부권과 남부권에서 열고 서부권에서는 열지 않는 경우'가 모든 말과 어긋나지 않으므로 갑의 결론이 보장되지 않는다."},
{"id":"k359","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 이번 정책 제안 공모의 수상 팀은 모두 제안서를 기한 안에 냈대. 우리 팀도 제안서를 기한 안에 냈으니까 우리 팀도 수상 팀이야.\n을: 수상 팀이 모두 기한을 지켰다고 해서 기한을 지킨 팀이 모두 수상 팀인 것은 아니잖아. 네 결론이 따라 나오려면 “______.”가 참이어야 해.","opts":["수상 팀 중에 제안서를 기한 안에 내지 않은 팀은 없다","제안서를 기한 안에 내지 않은 팀은 모두 수상 팀이 아니다","수상 팀이 아닌 팀은 모두 제안서를 기한 안에 내지 않았다","수상 팀이 아닌 팀 중에는 제안서를 기한 안에 낸 팀이 있다"],"ans":2,"exp":"갑은 '수상 팀은 모두 기한 안에 냈다'와 '우리 팀은 기한 안에 냈다'에서 '우리 팀은 수상 팀이다'를 이끌어 냈다. 이 결론이 나오려면 '기한 안에 낸 팀은 모두 수상 팀이다'가 있어야 하고, 그 대우가 '수상 팀이 아닌 팀은 모두 기한 안에 내지 않았다'이다. '수상 팀 중에 기한 안에 내지 않은 팀은 없다'와 '기한 안에 내지 않은 팀은 모두 수상 팀이 아니다'는 갑이 이미 한 말과 같은 뜻이고, 수상 팀이 아닌데 기한 안에 낸 팀이 있다는 것은 오히려 갑의 결론을 막는다."},
{"id":"k360","subj":"국어","unit":"논리","q":"다음 글의 빈칸에 들어갈 결론으로 가장 적절한 것은?\n\n우리 구는 내년에 치매 안심 센터를 증설하거나 방문 간호 인력을 늘린다. 방문 간호 인력은 정원 조례를 개정하는 경우에만 늘릴 수 있다. 그런데 구 의회는 정원 조례를 개정하지 않기로 하였다. 한편 치매 안심 센터를 증설하면 기존 센터의 운영 시간은 늘리지 않는다. 따라서 우리 구는 내년에 ______.","opts":["방문 간호 인력을 늘리고 기존 센터의 운영 시간도 늘린다","치매 안심 센터를 증설하지 않고 방문 간호 인력을 늘린다","치매 안심 센터를 증설하고 기존 센터의 운영 시간도 늘린다","치매 안심 센터를 증설하고 기존 센터의 운영 시간은 늘리지 않는다"],"ans":3,"exp":"방문 간호 인력은 정원 조례를 개정하는 경우에만 늘릴 수 있는데 조례는 개정되지 않으므로 방문 간호 인력은 늘리지 않는다. 센터 증설과 인력 증원 가운데 하나는 해야 하므로 치매 안심 센터를 증설하고, 증설하면 기존 센터의 운영 시간은 늘리지 않는다. 방문 간호 인력을 늘린다거나 운영 시간을 늘린다는 내용이 들어간 결론은 이와 어긋난다."},
{"id":"k361","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 우리 과 직원 가운데 데이터 분석 과정을 수료한 사람은 모두 통계 업무를 맡고 있어.\n을: 맞아. 그리고 통계 업무를 맡은 사람 중에 올해 전보 대상자는 한 명도 없지.\n갑: 그런데 우리 과의 병과 정은 둘 다 올해 전보 대상자야.\n을: 그렇다면 “______.”라는 결론이 나오네.","opts":["병과 정은 모두 통계 업무를 맡고 있다","병과 정은 모두 데이터 분석 과정을 수료하였다","병과 정은 모두 데이터 분석 과정을 수료하지 않았다","데이터 분석 과정을 수료하지 않은 사람은 모두 올해 전보 대상자이다"],"ans":2,"exp":"통계 업무를 맡은 사람 중에 전보 대상자가 없으므로, 전보 대상자인 병과 정은 통계 업무를 맡고 있지 않다. 데이터 분석 과정을 수료한 사람은 모두 통계 업무를 맡고 있으므로, 통계 업무를 맡지 않은 병과 정은 그 과정을 수료하지 않았다. 과정을 수료하지 않은 사람이 모두 전보 대상자라는 것은 주어진 말에서 나오지 않는다."},
{"id":"k362","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 이번에 새로 위촉된 감사 위원 중에는 회계사 자격을 가진 사람이 있대.\n을: 회계사 자격을 가진 위원은 모두 재무 분과에 배정된다고 들었어. 그러면 재무 분과에 외부 인사가 들어가겠네.\n갑: 그렇게 말하려면 “______.”라는 사실이 더 있어야 해. 그래야 ‘재무 분과에 배정된 위원 중에는 외부 인사가 있다.’라는 결론이 나와.","opts":["새로 위촉된 감사 위원은 모두 외부 인사이다","새로 위촉된 감사 위원 중에는 외부 인사가 있다","외부 인사 중에는 재무 분과에 배정되지 않은 위원이 있다","재무 분과에 배정된 위원은 모두 회계사 자격을 가지고 있다"],"ans":0,"exp":"새로 위촉된 위원 중에 회계사 자격을 가진 사람이 있고, 그 사람은 재무 분과에 배정된다. 새로 위촉된 위원이 모두 외부 인사라면 그 사람도 외부 인사이므로 재무 분과에 외부 인사가 있다는 결론이 나온다. 새로 위촉된 위원 가운데 일부만 외부 인사라면 그 일부가 회계사 자격을 가진 사람인지 알 수 없다. 나머지 두 진술은 재무 분과에 배정된 위원이 외부 인사인지에 대해 알려 주지 않는다."},
{"id":"k363","subj":"국어","unit":"논리","q":"(가)~(다)를 전제로 할 때 빈칸에 들어갈 결론으로 가장 적절한 것은?\n\n(가) 야간 민원실을 운영하는 구청은 모두 당직 인력을 증원하였다.\n(나) 당직 인력을 증원한 구청 중에 초과 근무 수당 예산을 줄인 곳은 없다.\n(다) 초과 근무 수당 예산을 줄이지 않은 구청은 모두 인건비 총액이 늘었다.\n따라서 ______.","opts":["인건비 총액이 늘어난 구청은 모두 야간 민원실을 운영한다","당직 인력을 증원하지 않은 구청은 모두 인건비 총액이 늘지 않았다","인건비 총액이 늘지 않은 구청 중에 야간 민원실을 운영하는 곳은 없다","야간 민원실을 운영하지 않는 구청은 모두 초과 근무 수당 예산을 줄였다"],"ans":2,"exp":"(가), (나), (다)를 차례로 이으면 '야간 민원실을 운영하는 구청은 모두 당직 인력을 증원하였고, 초과 근무 수당 예산을 줄이지 않았으며, 인건비 총액이 늘었다'가 된다. 그 대우가 '인건비 총액이 늘지 않은 구청 중에 야간 민원실을 운영하는 곳은 없다'이다. 나머지는 전제의 앞뒤를 바꾸거나 앞뒤를 각각 부정한 것이어서 전제에서 따라 나오지 않는다."},
{"id":"k364","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 내년도 신규 시책 후보는 ‘공유 주차’, ‘야간 돌봄’, ‘마을 버스’ 세 가지입니다.\n을: ‘공유 주차’를 추진하지 않으면 ‘마을 버스’도 추진하지 않습니다.\n병: 예산 사정상 ‘야간 돌봄’과 ‘마을 버스’를 함께 추진하지는 않습니다.\n갑: 방금 ‘마을 버스’는 추진하는 것으로 확정되었다는 연락을 받았습니다. 그렇다면 ______.","opts":["‘공유 주차’와 ‘야간 돌봄’을 모두 추진하겠군요","‘공유 주차’와 ‘야간 돌봄’을 모두 추진하지 않겠군요","‘공유 주차’는 추진하고 ‘야간 돌봄’은 추진하지 않겠군요","‘공유 주차’는 추진하지 않고 ‘야간 돌봄’은 추진하겠군요"],"ans":2,"exp":"을의 말의 대우는 \"'마을 버스'를 추진하면 '공유 주차'도 추진한다\"이다. '마을 버스'를 추진하는 것이 확정되었으므로 '공유 주차'도 추진한다. 병의 말에 따라 '야간 돌봄'과 '마을 버스'를 함께 추진하지는 않으므로 '야간 돌봄'은 추진하지 않는다. 따라서 '공유 주차'는 추진하고 '야간 돌봄'은 추진하지 않는다."},
{"id":"k365","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n칸막이를 없앤 개방형 사무실로 바꾸려는 공공 기관이 늘고 있다. 이를 두고 소음과 사생활 침해를 걱정하는 목소리도 있으나, 필자는 개방형 사무실이 조직의 소통을 늘린다는 점에서 전환에 찬성한다. 업무 공간의 구조는 그 안에서 일하는 사람들이 서로 어떻게 만나는지를 좌우하기 때문이다. 칸막이와 닫힌 문은 공간을 나누는 데 그치지 않고 사람 사이의 왕래를 막는다. 옆 부서에 물어볼 일이 있어도 문을 두드리는 번거로움 때문에 전자 우편을 보내고 답을 기다리게 된다. 반면 벽이 없는 공간에서는 동료가 무슨 일을 하는지 자연스럽게 눈에 들어오고, 자리에서 고개만 들면 말을 걸 수 있다. 얼굴을 마주하는 대화가 잦아지면 부서 사이의 협조도 빨라진다. 문서로 주고받으면 며칠이 걸릴 일이 말 몇 마디로 그 자리에서 정리되기도 한다. 여러 부서가 함께 풀어야 하는 민원이 늘어나는 요즘, 이러한 대면 소통의 증가는 행정 서비스의 질을 높이는 데 꼭 필요하다. 소음 문제는 집중 업무 공간을 따로 두는 것으로 줄일 수 있다. 그러므로 공공 기관은 개방형 사무실로의 전환을 적극적으로 추진해야 한다.","opts":["여러 부서가 함께 처리해야 하는 민원의 비율이 최근 몇 해 동안 꾸준히 높아졌다.","개방형 사무실로 바꾼 기관에서 직원들이 얼굴을 마주하고 대화하는 시간이 바꾸기 전보다 줄었다.","칸막이가 있는 사무실의 직원들은 다른 부서에 협조를 구할 때 주로 전자 우편을 이용하였다.","개방형 사무실로 바꾸면서 집중 업무 공간을 함께 마련한 기관에서는 소음에 대한 불만이 줄었다."],"ans":1,"exp":"글은 개방형 사무실에서 얼굴을 마주하는 대화가 잦아져 소통과 협조가 늘어난다는 것을 근거로 전환을 주장한다. 개방형으로 바꾼 뒤 대면 대화 시간이 오히려 줄었다면 이 근거가 무너지므로 논지가 약화된다. 여러 부서가 함께 처리할 민원이 늘었다는 것과 칸막이 사무실에서 전자 우편에 의존했다는 것은 글의 전제를 뒷받침하고, 집중 업무 공간으로 소음 불만이 줄었다는 것은 예상되는 반론을 막아 주므로 논지를 약화하지 않는다."},
{"id":"k366","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n일을 잘한 사람에게 돈을 더 주면 모두가 더 열심히 일할 것이라는 생각은 상식처럼 받아들여진다. 그러나 이 상식은 사람이 일하는 이유가 보상 하나뿐이라고 가정할 때에만 성립한다. 사람은 보람이나 책임감 때문에도 일한다. 남이 알아주지 않아도 맡은 일을 끝까지 해내는 것은 그 때문이다. 문제는 금전적 보상이 이런 내적 동기를 북돋우기는커녕 오히려 밀어낼 수 있다는 점이다. 스스로 의미를 느껴서 하던 일에 값이 매겨지면, 그 일은 ‘마땅히 할 도리’에서 ‘값을 받고 하는 거래’로 바뀐다. 거래가 된 일은 값이 맞지 않으면 하지 않아도 되는 일이 된다. 주민을 돕는다는 보람으로 움직이던 사람일수록 이 변화는 크게 작용한다. 게다가 공공 부문의 업무는 성과를 숫자로 재기 어려운 것이 많아서, 보상의 기준이 되는 지표는 일의 일부만을 비출 뿐이다. 그러니 지표에 잡히지 않는 일, 곧 어려운 처지의 민원인이 하는 말을 끝까지 들어 주는 일 같은 것은 뒷전으로 밀린다. 따라서 공공 부문에서 개인별 성과에 따라 금전적 보상을 달리하는 제도는 기대와 달리 업무의 질을 떨어뜨릴 가능성이 크다. 성과를 북돋우려면 돈으로 줄을 세우기보다 일의 의미를 확인할 기회를 넓히는 편이 낫다.","opts":["개인별 성과급을 도입한 기관에서 지표에 없는 상담 시간이 줄고 재방문 민원이 늘었다.","개인별 성과급을 도입한 기관에서 직원들의 초과 근무 시간이 도입하기 전보다 눈에 띄게 늘었다.","공공 부문에 들어온 사람 가운데에는 보수가 안정적이라는 이유로 직업을 고른 사람이 적지 않다.","성과를 숫자로 재기 쉬운 민간 영업 직군에서는 개인별 성과급을 도입한 뒤 매출이 늘어난 사례가 많다."],"ans":0,"exp":"글의 논지는 공공 부문의 개인별 성과급이 내적 동기를 밀어내고 지표에 잡히지 않는 일을 뒷전으로 밀어 업무의 질을 떨어뜨린다는 것이다. 성과급 도입 뒤 지표에 없는 상담 시간이 줄고 재방문 민원이 늘었다는 사실은 이 예측과 맞아떨어져 논지를 강화한다. 초과 근무가 늘었다는 것은 보상이 직원을 더 일하게 했다는 쪽이고, 안정적인 보수 때문에 직업을 골랐다는 것은 내적 동기를 전제한 글의 설명과 어긋난다. 민간 영업 직군의 사례는 성과를 숫자로 재기 어려운 공공 부문에 대한 논지와 관련이 없다."},
{"id":"k367","subj":"국어","unit":"강화 약화","q":"다음 글의 ㉠, ㉡에 대한 평가로 적절한 것만을 모두 고르면?\n\n민원실을 찾은 주민들이 가장 자주 제기하는 불만은 오래 기다려야 한다는 것이다. 그런데 대기에 대한 불만이 어디에서 비롯되는지에 대해서는 두 가지 가설이 맞선다. 하나는 ㉠ __불만의 크기가 기다리는 동안 느끼는 불확실성에 따라 정해진다__는 가설이다. 이에 따르면 사람들은 얼마나 더 기다려야 하는지 알 수 없을 때 초조해지고, 그 초조함이 불만으로 이어진다. 기다린 시간이 같더라도 끝이 보이는 기다림과 끝을 모르는 기다림은 전혀 다르게 경험되며, 남은 시간을 아는 사람에게는 기다린 시간의 길이가 불만에 영향을 주지 않는다는 것이다. 다른 하나는 ㉡ __불만의 크기가 실제로 기다린 시간의 길이에 따라 정해진다__는 가설이다. 이에 따르면 안내가 있든 없든 오래 기다린 사람은 그만큼 더 불만스럽고, 불만을 줄이는 방법은 창구나 인력을 늘려 대기 시간 자체를 줄이는 것뿐이다. 어느 가설이 옳은지에 따라 한정된 예산을 어디에 쓸지가 달라지므로, 한 구청은 민원실 운영 방식을 바꾸어 가며 주민의 불만을 조사해 보기로 하였다.\n\nㄱ. 실제로 기다린 시간이 같은데도 예상 대기 시간을 안내받은 주민의 불만이 안내받지 못한 주민의 불만보다 작았다면, ㉠은 강화된다.\nㄴ. 예상 대기 시간을 안내하지 않고 창구만 늘려 대기 시간을 절반으로 줄였더니 주민의 불만도 크게 줄었다면, ㉡은 약화된다.\nㄷ. 예상 대기 시간을 정확히 안내받은 주민들 사이에서도 오래 기다린 주민일수록 불만이 컸다면, ㉠은 약화된다.","opts":["ㄱ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ"],"ans":3,"exp":"ㄱ은 기다린 시간이 같은데 안내 여부, 곧 불확실성의 차이에 따라 불만이 달라진 경우이므로 ㉠을 강화한다. ㄴ은 안내 없이 대기 시간만 줄였는데 불만이 줄어든 경우로, 불만이 기다린 시간의 길이에 따른다는 ㉡과 맞아떨어지므로 ㉡을 약화하지 않고 강화한다. ㄷ은 남은 시간을 알아 불확실성이 없는데도 기다린 시간이 길수록 불만이 컸다는 것이어서, 남은 시간을 알면 기다린 시간의 길이가 불만에 영향을 주지 않는다는 ㉠을 약화한다. 따라서 ㄱ, ㄷ이 적절하다."},
{"id":"k368","subj":"국어","unit":"강화 약화","q":"다음 글의 ㉠에 대한 분석으로 적절하지 않은 것은?\n\n어제의 나와 오늘의 나는 무엇 때문에 같은 사람인가? 한 가지 답은 몸이 같기 때문이라는 것이다. 그러나 몸을 이루는 물질은 세월이 흐르면 대부분 바뀌고, 몸이 그대로라도 사고로 지난 삶을 송두리째 잊은 사람을 예전의 그 사람이라고 하기는 망설여진다. 그래서 어떤 철학자들은 ㉠ __과거의 어떤 사람이 한 경험을 지금의 내가 기억한다면, 그리고 그럴 때에만, 나는 그 사람과 같은 사람이다__라고 주장한다. 이 견해에 따르면 사람의 동일성을 정하는 것은 몸이 아니라 기억의 연결이다.\n그런데 이 견해에는 잘 알려진 반론이 있다. 한 노장군을 생각해 보자. 그는 젊은 장교 시절 전투에서 공을 세웠고, 장교 시절에는 어린 시절 과수원에서 꾸중을 들은 일을 기억하고 있었다. 노인이 된 그는 장교 시절의 전공은 기억하지만 어린 시절의 꾸중은 전혀 기억하지 못한다. ㉠에 따르면 노장군은 젊은 장교와 같은 사람이고 젊은 장교는 소년과 같은 사람이다. 같음은 이어지는 관계이므로, 곧 갑이 을과 같고 을이 병과 같으면 갑은 병과 같으므로 노장군은 소년과 같은 사람이어야 한다. 그러나 노장군은 소년의 경험을 기억하지 못하므로 ㉠에 따르면 둘은 같은 사람이 아니다. 결국 ㉠은 노장군이 소년과 같은 사람이면서 같은 사람이 아니라는 모순에 이른다.","opts":["㉠에 따르면, 몸을 이루는 물질이 모두 바뀐 사람도 과거의 자신과 같은 사람일 수 있다.","같음이 이어지는 관계가 아니라는 점이 밝혀진다면, 노장군의 사례를 이용한 반론은 약화된다.","㉠에 따르면, 사고로 지난 삶을 전부 잊은 사람은 사고를 당하기 전의 그 사람과 같은 사람이 아니다.","노장군이 어린 시절의 꾸중까지 기억하고 있다고 사례를 바꾸면, 그 사례는 ㉠을 더 크게 약화한다."],"ans":3,"exp":"반론은 노장군이 소년의 경험을 기억하지 못한다는 점에서 '같은 사람이 아니다'를 끌어내 모순을 만든다. 노장군이 꾸중까지 기억한다면 ㉠에 따르더라도 노장군은 소년과 같은 사람이어서 모순이 생기지 않으므로, 바꾼 사례는 ㉠을 약화하지 못한다. ㉠은 몸이 아니라 기억으로 동일성을 정하므로 몸의 물질이 바뀌어도 같은 사람일 수 있고, '그럴 때에만'이라는 조건 때문에 기억을 전부 잃은 사람은 이전의 사람과 같은 사람이 아니다. 반론은 같음이 이어지는 관계라는 전제에 기대고 있으므로 그 전제가 무너지면 반론이 약화된다."},
{"id":"k369","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n가을이 되면 수천 킬로미터 떨어진 월동지로 날아가는 철새들은 어떻게 길을 잃지 않을까? 오랫동안 유력했던 설명은 철새가 해와 별의 위치, 그리고 산맥이나 해안선 같은 지형을 보고 방향을 잡는다는 것이다. 실제로 많은 철새가 맑은 날 밤에 이동하고 해안선을 따라 나는 모습이 관찰된다. 그러나 이 설명만으로는 풀리지 않는 점이 있다. 철새는 구름이 하늘을 두껍게 덮어 별이 보이지 않는 밤에도, 눈에 띄는 지형이 없는 망망대해 위에서도 방향을 유지한다. 눈에 보이는 단서가 모두 사라진 조건에서도 길을 찾는다면 그 밖의 단서가 있다고 보아야 한다. 그래서 일부 연구자들은 철새가 눈에 보이는 단서가 아니라 지구 자기장을 감지하여 방향을 잡는다고 주장한다. 지구는 하나의 커다란 자석과 같아서 어디에서나 일정한 방향의 자기장이 형성되어 있고, 이것은 날씨나 밤낮에 따라 달라지지 않는다. 철새의 몸 어딘가에 이 자기장의 방향을 읽어 내는 감각 기관이 있다면, 철새는 아무것도 보이지 않는 조건에서도 나침반을 가진 것처럼 날 수 있다. 필자는 이 주장이 철새의 방향 감각을 가장 잘 설명한다고 본다.","opts":["처음으로 먼 길을 이동하는 어린 철새는 경험이 많은 철새의 뒤를 따라가면서 이동 경로를 익힌다.","하늘과 지형이 보이지 않는 실내에서 주변 자기장의 방향을 틀자 철새가 날아가려는 방향도 함께 틀어졌다.","둥근 천장에 별자리를 비추고 그 위치를 돌리자 철새가 날아가려는 방향이 별자리를 따라 바뀌었다.","별이 잘 보이는 맑은 밤에 이동하는 철새의 수가 구름이 낀 흐린 밤에 이동하는 철새의 수보다 많다."],"ans":1,"exp":"글의 논지는 철새가 눈에 보이는 단서가 아니라 지구 자기장을 감지해 방향을 잡는다는 것이다. 하늘과 지형을 볼 수 없는 조건에서 자기장의 방향만 바꾸었는데 철새의 방향이 그에 따라 바뀌었다면, 자기장이 방향을 정하는 단서임을 직접 보여 주므로 논지를 강화한다. 맑은 밤에 더 많이 이동한다는 것과 별자리를 돌리자 방향이 바뀌었다는 것은 별을 보고 방향을 잡는다는 기존 설명을 뒷받침하고, 어린 철새가 뒤따르며 경로를 익힌다는 것은 자기장 감지와 관계가 없다."},
{"id":"k370","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n공문서와 안내문에 쓰이는 말은 주민 누구나 이해할 수 있어야 한다. 그런데 행정 기관의 글에는 여전히 ‘익일’, ‘징구’, ‘거버넌스’ 같은 낯선 한자어와 외래어가 적지 않다. 글을 쓰는 사람에게는 익숙한 말이지만 읽는 주민에게는 사전을 찾아보아야 하는 말이다. 이런 말을 쉬운 말로 바꾸자는 주장에 대해, 뜻이 조금 달라질 수 있고 바꾸는 데 품이 든다는 반론이 있다. 그러나 필자는 쉬운 말 쓰기가 주민의 알 권리를 지키는 일일 뿐 아니라 행정의 비용을 줄이는 일이라고 생각한다. 안내문이 어려우면 주민은 내용을 확인하려고 담당 부서에 전화를 걸거나 직접 찾아온다. 담당자는 같은 설명을 되풀이하느라 다른 업무를 미루게 되고, 주민은 기한을 놓치거나 서류를 잘못 내어 다시 걸음을 해야 한다. 어려운 말 때문에 생기는 이러한 문의와 재방문은 모두 사회가 치르는 비용이다. 안내문의 낱말을 쉬운 말로 바꾸면 주민이 글만 읽고도 무엇을 언제까지 해야 하는지 알 수 있으므로 문의와 재방문이 줄어든다. 따라서 쉬운 말로 바꾸는 데 드는 품은 낭비가 아니라 더 큰 비용을 막는 투자이다.","opts":["공공 기관의 안내문에 쓰인 외래어의 수는 지난 몇 해 동안 꾸준히 늘어났다.","낯선 한자어가 많은 안내문을 받은 주민일수록 담당 부서에 전화로 문의하는 횟수가 많았다.","주민의 문의는 대부분 자신이 지원 대상인지를 묻는 것이어서 낱말을 쉬운 말로 고친 뒤에도 줄지 않았다.","쉬운 말로 고친 안내문을 받은 주민 가운데 제출 기한을 넘긴 사람의 비율이 고치기 전보다 낮아졌다."],"ans":2,"exp":"글은 어려운 낱말 때문에 문의와 재방문이 생기므로 낱말을 쉬운 말로 바꾸면 그 비용이 줄어든다고 주장한다. 문의의 대부분이 낱말의 뜻이 아니라 지원 대상 여부를 묻는 것이어서 쉬운 말로 고친 뒤에도 문의가 줄지 않았다면, 쉬운 말 쓰기가 비용을 줄인다는 논지가 약화된다. 낯선 한자어가 많을수록 문의가 많았다는 것과 고친 뒤 기한을 넘긴 사람이 줄었다는 것은 논지를 강화하고, 외래어가 늘었다는 사실은 쉬운 말로 바꾸는 일의 효과와 관계가 없다."},
{"id":"k371","subj":"국어","unit":"강화 약화","q":"다음 대화에 대한 평가로 적절한 것만을 모두 고르면?\n\n갑: 우리 시 도서관도 연체료를 없애야 합니다. 연체료는 책을 제때 돌려받으려고 만든 제도이지만 실제로는 그 구실을 하지 못합니다. 연체료가 쌓인 이용자는 돈을 내는 것이 부담스럽거나 창피해서 아예 도서관에 발길을 끊고, 책도 끝내 돌아오지 않습니다. 연체료가 없어지면 이런 이용자들이 책을 들고 돌아올 것입니다.\n을: 저는 생각이 다릅니다. 연체료는 반납을 늦추는 사람을 줄이는 구실을 분명히 합니다. 값을 치러야 한다는 것을 알면 사람들은 기한을 지키려고 애씁니다. 연체료를 없애면 늦게 반납되는 책이 늘어나 다른 이용자가 그 책을 빌리지 못하는 피해가 생깁니다.\n갑: 기한을 지키게 하는 방법이 꼭 돈이어야 할까요? 책을 돌려줄 때까지 새로 빌리지 못하게 하는 것만으로도 충분합니다. 게다가 연체료는 소득이 낮은 이용자에게 더 무거운 짐이 되어 도서관의 문턱을 높입니다.\n을: 대출 정지만으로는 책을 자주 빌리지 않는 사람을 움직이기 어렵습니다. 문턱이 문제라면 연체료를 없앨 것이 아니라 형편이 어려운 이용자에게 감면해 주면 됩니다.\n\nㄱ. 연체료를 없앤 도서관에서 오랫동안 반납되지 않던 책이 많이 돌아오고 발길을 끊었던 이용자가 다시 찾아왔다면, 이는 갑의 입장을 강화한다.\nㄴ. 연체료를 없앤 도서관에서 기한을 넘겨 반납되는 책의 비율이 없애기 전과 차이가 없었다면, 이는 을의 입장을 강화한다.\nㄷ. 연체료 대신 대출 정지만 시행한 도서관에서 한 해에 한두 번 책을 빌리는 이용자의 연체가 크게 늘었다면, 이는 을의 입장을 약화한다.","opts":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"ans":0,"exp":"갑은 연체료가 이용자를 떠나게 할 뿐 책을 돌려받는 구실을 못 하므로 없애야 한다는 입장이고, 을은 연체료가 반납 지연을 줄이며 대출 정지만으로는 부족하다는 입장이다. ㄱ은 연체료를 없애면 이용자와 책이 돌아온다는 갑의 예측과 일치하므로 갑의 입장을 강화한다. ㄴ은 연체료를 없애도 늦은 반납이 늘지 않았다는 것이어서 을의 입장을 약화한다. ㄷ은 대출 정지만으로는 책을 자주 빌리지 않는 사람을 움직이기 어렵다는 을의 말과 일치하므로 을의 입장을 강화한다. 따라서 ㄱ만 적절하다."},
{"id":"k372","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n역사 연구는 오랫동안 글로 남은 기록에 기대어 왔다. 기록은 작성된 때와 작성한 사람을 따질 수 있고, 한번 쓰이면 내용이 변하지 않는다. 이에 비해 입에서 입으로 전해지는 이야기는 전하는 사람의 기억과 처지에 따라 달라지므로 믿기 어려운 자료로 여겨졌다. 그래서 구전은 민속이나 문학의 연구 대상일 수는 있어도 역사의 증거는 될 수 없다고 보는 것이 보통이었다. 그러나 구전을 역사 연구에서 배제하는 태도는 다시 생각해 보아야 한다. 우선 기록은 글을 쓸 수 있었던 사람들, 곧 대체로 지배층의 눈으로 본 세계를 담는다. 글을 남기지 못한 사람들의 삶은 기록에 아예 나타나지 않거나 다스림의 대상으로만 등장한다. 구전은 바로 이들의 경험이 전해지는 통로이다. 기록만을 사료로 인정한다면 이들의 과거는 처음부터 연구할 수 없는 것이 된다. 또한 구전이 변한다는 사실이 곧 그것이 사실을 담지 못한다는 뜻은 아니다. 이야기의 세부는 달라져도 공동체가 겪은 큰 사건의 뼈대는 여러 세대에 걸쳐 안정되게 전승될 수 있다. 그러므로 구전은 기록과 견주어 가며 조심스럽게 다룬다면 과거를 복원하는 데 쓸 수 있는 정당한 사료이다.","opts":["기록이 풍부하게 남아 있는 시기일수록 그 시기를 다룬 역사 연구가 활발하게 이루어진다.","한 마을에서 전해 오는 옛이야기가 전하는 사람에 따라 주인공의 이름과 결말이 서로 달랐다.","어느 해안 마을에 대대로 전해 온 큰 해일 이야기의 시기와 피해 범위가 뒷날의 지층 조사 결과와 일치하였다.","구전되던 이야기 가운데에는 여러 세대를 거치는 동안 사건이 일어난 때와 장소가 서로 뒤바뀌어 전해진 것이 많다."],"ans":2,"exp":"글의 논지는 구전이 세부는 달라져도 큰 사건의 뼈대를 안정되게 전하므로 과거를 복원하는 사료가 될 수 있다는 것이다. 대대로 전해 온 해일 이야기의 시기와 범위가 지층 조사 결과와 일치했다는 사실은 구전이 실제 사건을 정확히 전승할 수 있음을 보여 주어 논지를 강화한다. 전하는 사람에 따라 내용이 달랐다는 것과 세대를 거치면서 때와 장소가 뒤바뀌었다는 것은 구전을 믿기 어렵다는 쪽을 뒷받침하고, 기록이 많은 시기의 연구가 활발하다는 것은 구전의 사료 가치와 관계가 없다."},
{"id":"k373","subj":"국어","unit":"강화 약화","q":"다음 글의 가설 A, B에 대한 평가로 적절한 것만을 모두 고르면?\n\n창가에 둔 화분의 어린싹이 창 쪽으로 굽어 자라는 것은 누구나 본 적이 있는 현상이다. 싹이 굽는 곳은 끝에서 조금 아래로 내려온 부분이다. 그렇다면 빛이 어느 쪽에서 오는지를 알아차리는 곳은 어디일까? 이에 대해 두 가지 가설을 세울 수 있다. 가설 A는 빛을 감지하는 곳이 싹의 맨 끝부분이라는 것이다. 이 가설에 따르면 끝부분이 빛의 방향을 감지하고, 그 정보가 어떤 방식으로든 아래로 전해져 아랫부분이 굽는다. 감지하는 곳과 반응하는 곳이 서로 다르다는 것이다. 가설 B는 빛을 감지하는 곳이 실제로 굽는 아랫부분이라는 것이다. 이 가설에 따르면 굽는 부분이 스스로 빛의 방향을 감지하고 그 자리에서 반응하므로, 끝부분에 빛이 닿는지는 싹이 굽는 것과 관계가 없다. 두 가설 가운데 어느 것이 옳은지 가리려면 싹의 끝부분과 아랫부분 가운데 한쪽에만 빛이 닿지 않게 하고 싹이 굽는지를 살펴보면 된다. 다만 덮개를 씌우는 일 자체가 싹의 생장에 영향을 줄 수 있으므로, 빛이 통과하는 투명한 덮개를 씌운 경우도 함께 살펴야 한다.\n\nㄱ. 끝부분에 빛이 통하지 않는 덮개를 씌운 싹은 굽지 않고 투명한 덮개를 씌운 싹은 빛 쪽으로 굽었다면, 가설 A는 강화된다.\nㄴ. 끝부분은 그대로 두고 아랫부분만 빛이 통하지 않는 띠로 감싼 싹이 빛 쪽으로 굽었다면, 가설 B는 약화된다.\nㄷ. 끝부분에 빛이 통하지 않는 덮개를 씌운 싹과 아무것도 씌우지 않은 싹이 똑같이 빛 쪽으로 굽었다면, 가설 A는 약화된다.","opts":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":3,"exp":"ㄱ은 덮개 자체의 영향이 아니라 끝부분에 빛이 닿지 않은 것 때문에 싹이 굽지 않았음을 보여 주므로, 끝부분이 빛을 감지한다는 가설 A를 강화한다. ㄴ은 굽는 아랫부분에 빛이 닿지 않았는데도 싹이 굽은 경우이므로, 아랫부분이 스스로 빛을 감지한다는 가설 B를 약화한다. ㄷ은 끝부분에 빛이 닿지 않아도 싹이 굽은 경우이므로, 끝부분이 빛을 감지해야 굽는다는 가설 A를 약화한다. 따라서 ㄱ, ㄴ, ㄷ이 모두 적절하다."},
{"id":"k374","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n대형 유통업체들이 내세우는 ‘최저가 보상제’는 같은 상품을 다른 매장에서 더 싸게 팔면 그 차액을 돌려주겠다는 약속이다. 소비자는 어디서 사든 가장 싼값에 살 수 있게 되므로 이 제도는 소비자에게 이로운 것처럼 보인다. 매장마다 값을 일일이 비교하는 수고를 덜어 준다는 점도 매력으로 꼽힌다. 그러나 이 제도가 시장 전체의 가격을 낮춘다고 기대하는 것은 잘못이다. 가격 경쟁이 일어나는 까닭은 값을 내린 매장이 경쟁 매장의 손님을 끌어올 수 있기 때문이다. 그런데 어떤 매장이 최저가 보상을 약속하고 있으면 사정이 달라진다. 경쟁 매장이 값을 내려도 손님들은 원래 다니던 매장에서 차액을 돌려받으면 그만이므로 굳이 매장을 옮기지 않는다. 값을 내린 매장은 손님은 늘지 않고 이윤만 줄어든다. 이를 아는 경쟁 매장은 처음부터 값을 내리려 하지 않는다. 결국 최저가 보상제는 ‘우리보다 싸게 팔아 보아야 소용없다’는 신호를 경쟁자에게 보내는 장치가 되어, 가격 인하 경쟁을 북돋우기보다 오히려 가라앉힌다. 겉으로 보이는 것과 달리 이 제도 아래에서 소비자는 더 싼값을 만나기 어려워진다.","opts":["최저가 보상제를 시행하는 매장은 시행하지 않는 매장보다 광고에 더 많은 비용을 쓴다.","한 대형 매장이 최저가 보상제를 시행한 뒤 인근 경쟁 매장들이 같은 상품의 값을 전보다 자주 내렸다.","최저가 보상제를 시행하는 매장의 단골손님은 다른 매장의 값이 더 싸다는 것을 알고도 매장을 옮기지 않았다.","최저가 보상제를 시행하는 매장이 있는 지역의 평균 판매 가격이 그런 매장이 없는 지역보다 높게 나타났다."],"ans":1,"exp":"글의 논지는 최저가 보상제가 경쟁 매장이 값을 내릴 까닭을 없애 가격 인하 경쟁을 가라앉힌다는 것이다. 제도 시행 뒤 경쟁 매장들이 오히려 값을 더 자주 내렸다면 이 예측과 반대이므로 논지가 약화된다. 단골손님이 매장을 옮기지 않았다는 것은 글이 든 이유와 일치하고, 그런 매장이 있는 지역의 가격이 더 높았다는 것은 결론을 뒷받침하므로 둘 다 논지를 강화한다. 광고 비용은 가격 경쟁에 대한 논지와 관계가 없다."},
{"id":"k375","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n아이들은 따로 가르치지 않아도 주변에서 들리는 말을 듣고 몇 해 만에 모어의 문법을 익힌다. 반면 어른이 되어 외국어를 배우는 사람은 오랜 시간 공을 들여도 발음과 문법에서 모어 화자와 차이를 보이는 일이 많다. 함께 이민한 가족 가운데 부모보다 어린 자녀가 새 언어를 훨씬 자연스럽게 구사하게 되는 것도 흔히 보는 일이다. 이 차이를 설명하기 위해 제시된 것이 ‘결정적 시기’ 가설이다. 이 가설에 따르면 언어를 온전히 습득할 수 있는 능력은 생애 초기의 일정한 기간에만 열려 있고, 이 기간이 지나면 같은 양의 언어 자극을 받더라도 습득의 결과가 달라진다. 이에 대해 어른의 외국어 학습이 더딘 것은 능력의 문이 닫혀서가 아니라 배우는 데 쓰는 시간이 적고 틀릴까 봐 두려워하기 때문이라는 반론이 있다. 그러나 이 반론은 설득력이 떨어진다. 학습 시간이나 태도가 원인이라면 충분한 시간과 의욕을 가진 성인 학습자는 아이와 같은 수준에 이르러야 하는데, 그렇지 못한 경우가 흔하기 때문이다. 언어 습득의 성패를 가르는 것은 언어에 노출된 양이나 학습자의 태도가 아니라 언어에 처음 노출된 시기이다.","opts":["외국어 학습에 쓰는 시간이 많은 성인일수록 그 언어의 문법 시험에서 높은 점수를 받았다.","수어를 쓴 기간이 같아도 청소년기 이후에 처음 접한 사람은 어려서 접한 사람보다 문법 오류가 많았다.","부모가 아이에게 말을 많이 걸어 주는 가정일수록 아이가 모어의 문법을 익히는 속도가 빨랐다.","틀리는 것을 두려워하지 않는 성인 학습자가 그렇지 않은 성인 학습자보다 외국어 말하기 실력이 빨리 늘었다."],"ans":1,"exp":"글의 논지는 언어 습득의 성패를 가르는 것이 노출의 양이나 태도가 아니라 처음 노출된 시기라는 것이다. 언어를 쓴 기간, 곧 노출의 양이 같은데도 늦게 접한 사람이 문법 오류를 더 많이 보였다면 시기가 결정적이라는 논지가 강화된다. 학습 시간이 많을수록 점수가 높았다는 것과 말을 많이 걸어 줄수록 습득이 빨랐다는 것은 노출의 양이 중요하다는 쪽이고, 두려워하지 않는 학습자가 빨리 늘었다는 것은 태도가 원인이라는 반론을 뒷받침하므로 논지를 강화하지 않는다."},
{"id":"k376","subj":"국어","unit":"강화 약화","q":"다음 글의 ㉠에 대한 평가로 가장 적절한 것은?\n\n주민 참여 예산제는 지방 자치 단체의 예산 편성 과정에 주민이 직접 참여하여 사업을 제안하고 우선순위를 정하는 제도이다. 이 제도를 옹호하는 사람들은 주민이 생활 현장의 필요를 가장 잘 알기 때문에 주민이 고른 사업일수록 예산이 꼭 필요한 곳에 쓰인다고 말한다. 그러나 ㉠ __주민 참여 예산제는 지역 전체의 필요보다 참여한 일부 주민의 이해를 반영하는 데 그친다__는 비판이 있다. 비판의 요지는 이렇다. 예산 회의는 대개 평일 낮이나 저녁에 열리고, 사업 제안서를 쓰려면 적지 않은 시간과 요령이 필요하다. 그래서 회의에 꾸준히 나올 수 있는 사람은 시간 여유가 있는 특정 연령층이나 이미 조직된 단체의 회원으로 한정되기 쉽다. 이들이 제안하고 이들이 투표하는 구조에서는 참여자가 사는 동네, 참여자가 속한 단체에 이로운 사업이 뽑힐 가능성이 크다. 정작 생계에 쫓겨 회의에 나올 수 없는 주민의 필요는 논의의 장에 오르지도 못한다. 참여의 문이 형식적으로 열려 있다는 사실만으로는 예산이 고르게 쓰인다고 보장할 수 없다는 것이다. 이 비판에 따르면 제도의 성패는 참여의 기회가 열려 있는지가 아니라 실제로 누가 참여하는지에 달려 있다.","opts":["주민 참여 예산 회의가 대부분 평일에 열린다는 사실은 ㉠을 약화한다.","선정된 사업의 대다수가 회의 참여자가 한 명도 없는 동네에 배정되었다면, ㉠은 강화된다.","회의 참여자의 연령과 직업 분포가 전체 주민의 분포와 거의 같다는 사실이 확인되면, ㉠은 강화된다.","회의 참여자가 많이 사는 동네일수록 주민 한 사람당 배정된 참여 예산 사업비가 많았다면, ㉠은 강화된다."],"ans":3,"exp":"㉠은 참여자가 특정 집단으로 한정되어 참여자에게 이로운 사업이 뽑힌다는 비판이다. 참여자가 많이 사는 동네일수록 한 사람당 사업비가 많이 배정되었다면 예산이 참여자의 이해에 따라 쓰였다는 것이므로 ㉠이 강화된다. 회의가 평일에 열린다는 사실은 참여자가 한정된다는 비판의 근거이므로 ㉠을 약화하지 않는다. 사업이 참여자가 없는 동네에 주로 배정되었다는 것과 참여자의 분포가 전체 주민과 같다는 것은 비판의 근거와 어긋나므로 ㉠을 강화하지 않고 약화한다."},
{"id":"k377","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n여러 가지 일을 한꺼번에 처리하는 능력은 바쁜 직장인의 미덕처럼 여겨진다. 보고서를 쓰면서 전화를 받고, 회의를 들으면서 전자 우편에 답하는 사람은 유능해 보인다. 채용 공고에서 ‘여러 업무를 동시에 처리할 수 있는 사람’을 찾는 일도 드물지 않다. 그러나 사람이 주의를 기울여야 하는 두 가지 일을 정말로 동시에 해내는 것은 아니다. 우리 뇌는 한 번에 하나의 과제에만 주의를 온전히 쏟을 수 있어서, 동시에 한다고 느낄 때에도 실제로는 두 과제 사이를 빠르게 오가고 있을 뿐이다. 문제는 과제를 바꿀 때마다 비용이 든다는 점이다. 하던 일의 맥락을 내려놓고 새 일의 규칙을 불러오는 데 짧게나마 시간이 걸리고, 그 사이에 앞선 일의 흔적이 남아 실수를 부른다. 한 번의 전환에 드는 비용은 작아 보여도 전환이 잦아지면 합계는 결코 작지 않다. 더구나 이런 손실은 일하는 당사자가 알아차리기 어려워서, 사람들은 자신이 일을 빨리 해내고 있다고 믿는다. 그러므로 주의가 필요한 일들을 한꺼번에 처리하는 방식은 하나씩 차례로 끝내는 방식보다 시간은 더 걸리고 정확도는 떨어진다. 동시 작업은 효율을 높이는 기술이 아니라 효율을 갉아먹는 습관이다.","opts":["여러 일을 함께 하는 데 자신이 있다고 답한 사람일수록 평소 여러 기기를 동시에 쓰는 시간이 길었다.","걸으면서 이야기하는 것처럼 한쪽이 몸에 밴 동작일 때에는 두 일을 함께 해도 수행에 차이가 없었다.","두 종류의 계산 문제를 번갈아 푼 집단이 한 종류를 다 풀고 다음 종류를 푼 집단보다 시간이 더 걸리고 오답도 많았다.","주의가 필요한 두 과제를 번갈아 처리한 사람들과 차례로 처리한 사람들이 과제를 마치는 데 걸린 시간과 정확도가 같았다."],"ans":2,"exp":"글의 논지는 주의가 필요한 일들을 오가며 처리하면 전환 비용 때문에 차례로 처리할 때보다 시간이 더 걸리고 정확도가 떨어진다는 것이다. 번갈아 푼 집단이 차례로 푼 집단보다 느리고 오답이 많았다는 결과는 이 논지를 직접 뒷받침한다. 번갈아 처리한 사람들과 차례로 처리한 사람들의 시간과 정확도가 같았다는 것은 논지를 약화한다. 몸에 밴 동작은 글이 말하는 '주의가 필요한 일'이 아니고, 자신감과 기기 사용 시간의 관계는 수행의 효율에 대해 알려 주는 바가 없다."},
{"id":"k378","subj":"국어","unit":"강화 약화","q":"다음 글의 ㉠, ㉡에 대한 평가로 적절한 것만을 모두 고르면?\n\n도시에 사는 새는 같은 종이라도 숲에 사는 새보다 높은 음으로 노래하는 경우가 있다. 이 차이가 왜 생기는지에 대해서는 설명이 갈린다. ㉠ __소음 가설__은 도시의 교통 소음을 원인으로 든다. 자동차와 기계가 내는 소음은 주로 낮은 음역에 몰려 있어서, 낮은 음의 노래는 소음에 묻혀 멀리 전달되지 않는다. 새의 노래는 짝을 부르고 세력권을 알리는 수단이므로, 상대에게 들리지 않는 노래는 쓸모가 없다. 그래서 도시의 새는 소음과 겹치지 않도록 그때그때 노래의 음을 높인다는 것이다. 이와 달리 ㉡ __몸집 가설__은 도시와 숲의 먹이 조건이 다르다는 데 주목한다. 새는 몸집이 작을수록 발성 기관도 작아 높은 음을 낸다. 도시는 숲보다 새끼에게 먹일 곤충이 부족하여 새가 작게 자라고, 그 결과로 노래의 음이 높아졌을 뿐이라는 것이다. 이 가설이 옳다면 높은 음은 소음에 대한 대응이 아니라 작은 몸집에 따라오는 부수적 결과이며, 주변이 시끄러운지 조용한지에 따라 달라지지 않는다.\n\nㄱ. 교통량이 많은 도로변에 사는 새와 같은 도시의 한적한 공원에 사는 새가 같은 높이의 음으로 노래한다면, ㉠은 강화된다.\nㄴ. 도시의 새와 숲의 새를 잡아 재어 보았더니 몸집에 차이가 없었다면, ㉡은 약화된다.\nㄷ. 차량 통행을 막아 조용해진 날에 도시의 새가 평소보다 낮은 음으로 노래한다면, ㉠은 강화된다.","opts":["ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":2,"exp":"ㄱ은 소음의 크기가 다른데도 노래의 높이가 같은 경우이므로, 소음 때문에 음을 높인다는 ㉠을 강화하지 않고 약화한다. ㄴ은 도시의 새가 숲의 새보다 몸집이 작다는 ㉡의 전제가 성립하지 않는 경우이므로 ㉡을 약화한다. ㄷ은 소음이 사라지자 노래의 음이 낮아진 경우로, 소음에 맞추어 음을 높인다는 ㉠의 예측과 일치하므로 ㉠을 강화한다. 따라서 ㄴ, ㄷ이 적절하다."},
{"id":"k379","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n초등학교에서 숙제를 없애야 한다는 주장이 힘을 얻고 있다. 필자도 이에 동의한다. 숙제가 아이들에게 주는 부담 때문만은 아니다. 숙제는 학교에서 배운 것을 집에서 익히게 하려는 것이지만, 실제로 숙제의 완성도를 좌우하는 것은 학생의 노력보다 가정의 여건이다. 보호자가 곁에서 살펴 줄 수 있는 가정의 아이는 모르는 것을 물어 가며 숙제를 해 오지만, 보호자가 늦게까지 일하는 가정의 아이는 혼자서 씨름하다가 포기하기 쉽다. 숙제를 해 오지 못한 아이는 다음 날 교실에서 꾸중을 듣고, 그런 일이 되풀이되면 공부 자체에 흥미를 잃는다. 숙제 검사는 이 차이를 고스란히 성적과 평판의 차이로 바꾸어 놓는다. 다시 말해 숙제는 가정 배경에 따른 학습 격차를 학교가 나서서 키우는 장치이다. 숙제를 없애면 모든 학생이 학교라는 같은 조건에서 배우고 익히게 되므로, 가정 배경이 학습에 미치는 영향은 그만큼 줄어든다. 방과 후의 시간은 놀이와 휴식, 가족과의 대화에 쓰이게 될 것이다. 따라서 초등학교의 숙제 폐지는 아이들의 부담을 덜어 줄 뿐 아니라 가정 배경에 따른 학습 격차를 줄이는 길이다.","opts":["숙제를 없앤 학교의 학생들은 방과 후에 가족과 대화하는 시간이 늘었다고 답하였다.","보호자가 숙제를 도와주는 가정의 학생일수록 숙제 검사에서 좋은 평가를 받았다.","숙제가 많은 학교의 학생들은 숙제가 적은 학교의 학생들보다 학교생활 만족도가 낮았다.","숙제를 없앤 학교에서 형편이 넉넉한 가정의 학생만 사교육을 더 받게 되어 성취도 차이가 전보다 벌어졌다."],"ans":3,"exp":"글의 논지는 숙제를 없애면 가정 배경에 따른 학습 격차가 줄어든다는 것이다. 숙제를 없앤 뒤 형편이 넉넉한 가정의 학생만 사교육을 더 받아 성취도 차이가 오히려 벌어졌다면, 숙제 폐지가 격차를 줄인다는 논지가 약화된다. 보호자가 도와주는 학생이 숙제 검사에서 좋은 평가를 받았다는 것은 글의 근거와 일치하고, 가족과 대화하는 시간이 늘었다는 것도 글의 예측과 일치한다. 숙제가 많은 학교의 만족도가 낮았다는 것은 논지를 약화하지 않는다."},
{"id":"k380","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n병은 일찍 찾아낼수록 좋다는 믿음 때문에, 증상이 없는 사람에게도 가능한 한 많은 검사를 하는 것이 최선이라고 생각하기 쉽다. 그러나 검사의 확대가 언제나 건강에 이로운 것은 아니다. 정밀한 검사는 평생 아무 문제도 일으키지 않았을 작은 이상까지 찾아낸다. 일단 이상이 발견되면 그것이 해로운 것인지 아닌지를 미리 가려내기 어려우므로 대개 추가 검사와 치료가 뒤따른다. 그 결과 치료하지 않아도 되었을 사람들이 수술과 약물의 부작용, 그리고 환자가 되었다는 불안을 떠안는다. 이를 과잉 진단이라고 한다. 과잉 진단은 검사가 틀려서 생기는 오진과 다르다. 이상은 실제로 있지만 그것을 찾아내어 치료하는 일이 그 사람에게 아무 이득도 주지 않는 경우를 가리킨다. 과잉 진단이 많은 검사에서는 발견되는 환자 수가 크게 늘어나고 발견된 환자의 생존율도 높게 나타나지만, 이는 애초에 생명을 위협하지 않는 이상을 많이 찾아냈기 때문일 뿐 검사가 생명을 구했다는 증거가 아니다. 검사가 실제로 이로운지는 그 검사를 받은 집단에서 해당 질환으로 인한 사망이 줄었는지로 판단해야 한다. 따라서 증상이 없는 사람을 대상으로 한 검사는 무작정 늘릴 것이 아니라 이득과 해를 따져 선별적으로 시행해야 한다.","opts":["어떤 검사를 받은 사람들 가운데 다수가 검사 결과를 듣고 나서 마음이 놓였다고 답하였다.","어떤 검사로 발견된 환자의 5년 생존율이 증상이 생긴 뒤에 발견된 환자의 생존율보다 높았다.","어떤 검사를 널리 시행한 뒤 그 질환의 진단 건수는 크게 늘었지만 그로 인한 사망자 수는 그대로였다.","어떤 검사를 정기적으로 받은 집단에서는 받지 않은 집단보다 그 질환으로 인한 사망이 뚜렷하게 적었다."],"ans":2,"exp":"글의 논지는 증상 없는 사람에 대한 검사 확대가 과잉 진단을 낳을 수 있으므로 이득과 해를 따져 선별적으로 해야 한다는 것이다. 검사를 널리 시행한 뒤 진단받는 사람만 늘고 사망자 수는 그대로였다면, 생명을 위협하지 않는 이상을 많이 찾아냈을 뿐이라는 글의 설명과 일치하여 논지를 강화한다. 검사로 발견된 환자의 생존율이 높다는 것은 글에서 이미 검사의 이로움을 보여 주는 증거가 아니라고 한 것이고, 검사를 받은 집단의 사망이 뚜렷이 적었다는 것은 검사가 이롭다는 쪽이어서 논지를 약화한다. 마음이 놓였다는 응답은 과잉 진단에 관한 논지와 관계가 없다."},
{"id":"k381","subj":"국어","unit":"강화 약화","q":"다음 글의 가설 A, B에 대한 평가로 적절한 것만을 모두 고르면?\n\n이웃한 두 마을의 말이 뚜렷이 다를 때, 방언학에서는 그 사이에 방언의 경계가 지난다고 말한다. 방언의 경계가 왜 하필 그 자리에 생기는지에 대해서는 두 가지 설명이 있다. 가설 A는 지형을 원인으로 본다. 높은 산줄기나 큰 강은 사람의 왕래를 막고, 왕래가 끊긴 두 지역의 말은 세월이 흐르면서 저마다 다른 방향으로 변해 간다는 것이다. 이 가설에 따르면 방언의 경계는 산줄기나 강과 겹쳐서 나타난다. 가설 B는 생활권을 원인으로 본다. 사람들은 같은 장터에 다니고 같은 범위 안에서 혼인하면서 말을 닮아 가는데, 어느 장터에 다니는지는 지형만이 아니라 길과 행정 구역, 오랜 관습에 따라서도 정해진다. 이 가설에 따르면 방언의 경계는 장터를 함께 쓰는 범위의 경계와 겹쳐서 나타나며, 그 사이에 산이나 강이 있는지는 중요하지 않다. 물론 산줄기가 곧 생활권의 경계인 곳에서는 두 가설이 같은 결과를 예측한다. 그러므로 두 가설을 가리려면 지형의 경계와 생활권의 경계가 어긋나는 지역을 조사해야 한다.\n\nㄱ. 높은 고개로 막혀 있지만 예부터 같은 장터를 써 온 두 마을의 말이 거의 같다면, 가설 A는 약화된다.\nㄴ. 산이나 강이 없는 평야에 나란히 있으면서 서로 다른 장터를 써 온 두 마을의 말이 뚜렷이 다르다면, 가설 B는 강화된다.\nㄷ. 큰 강을 사이에 두고 서로 다른 장터를 써 온 두 마을의 말이 뚜렷이 다르다면, 가설 A는 강화되고 가설 B는 약화된다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":0,"exp":"ㄱ은 지형의 장벽이 있는데도 장터를 함께 쓴 두 마을의 말이 같은 경우이므로, 지형이 방언의 경계를 만든다는 가설 A를 약화한다. ㄴ은 지형의 장벽이 없는데도 장터가 다른 두 마을의 말이 다른 경우이므로, 생활권이 경계를 만든다는 가설 B를 강화한다. ㄷ은 지형의 경계와 생활권의 경계가 겹치는 경우여서 두 가설이 모두 말이 다를 것이라고 예측하므로, 이 결과로 가설 B가 약화되지는 않는다. 따라서 ㄱ, ㄴ이 적절하다."},
{"id":"k382","subj":"국어","unit":"강화 약화","q":"다음 글의 ㉠에 대한 평가로 적절하지 않은 것은?\n\n도심 일반 도로의 제한 속도를 시속 60킬로미터에서 50킬로미터로 낮추는 정책을 두고 논란이 이어진다. 반대하는 쪽은 통행 시간이 늘어 시민의 불편과 물류 비용이 커진다고 말한다. 출퇴근길이 길어지고 배달과 운송이 늦어지면 그 부담이 결국 시민 모두에게 돌아온다는 것이다. 이에 대해 찬성하는 쪽은 ㉠ __도심에서 제한 속도를 낮추어도 통행 시간은 거의 늘지 않으며 보행자 사망은 크게 줄어든다__고 주장한다. 근거는 이렇다. 도심 도로에서 차량이 목적지까지 가는 데 걸리는 시간은 달릴 때의 최고 속도보다 신호 대기와 교차로의 정체에 좌우된다. 신호와 신호 사이의 짧은 구간에서 잠깐 빨리 달려 보아야 다음 신호에서 다시 멈추게 되므로, 최고 속도를 낮추어도 전체 통행 시간에는 큰 차이가 생기지 않는다는 것이다. 한편 차량의 속도가 낮아지면 운전자가 위험을 알아차리고 멈추기까지의 거리가 짧아지고, 부딪치더라도 보행자가 받는 충격이 작아진다. 충격의 크기는 속도가 조금만 줄어도 크게 줄어들기 때문에 사망에 이르는 사고의 비율이 뚜렷이 낮아진다고 한다. 요컨대 잃는 것은 적고 얻는 것은 크다는 주장이다.","opts":["제한 속도를 낮춘 도심 도로에서 보행자 사고 건수는 그대로인데 보행자 사망자 수는 크게 줄었다면, ㉠은 약화된다.","신호등이 없는 고속 도로에서는 제한 속도를 낮추면 통행 시간이 크게 늘어난다는 사실은 ㉠을 약화하지 않는다.","제한 속도를 낮춘 도심 구간에서 출퇴근 시간대의 평균 통행 시간이 낮추기 전과 비슷하였다면, ㉠은 강화된다.","제한 속도를 낮춘 도심 구간에서 차량의 실제 주행 속도가 낮아졌는데도 보행자 사망자 수가 그대로였다면, ㉠은 약화된다."],"ans":0,"exp":"㉠은 도심에서 제한 속도를 낮추면 통행 시간은 거의 늘지 않고 보행자 사망은 크게 줄어든다는 주장이다. 사고 건수는 그대로인데 사망자 수가 크게 줄었다면, 속도가 낮아져 충격이 작아지고 사망에 이르는 사고의 비율이 낮아진다는 근거와 일치하므로 ㉠은 약화되지 않고 강화된다. 고속 도로는 신호 대기가 통행 시간을 좌우하는 도심 도로가 아니므로 ㉠과 무관하고, 도심의 통행 시간이 비슷했다는 결과는 ㉠을 강화하며, 주행 속도가 낮아졌는데도 사망자 수가 그대로였다는 결과는 ㉠을 약화한다."},
{"id":"k383","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 우리 구립 도서관 열람실의 운영 시간을 밤 10시에서 자정까지로 늘렸으면 합니다. 퇴근 후에 공부할 곳을 찾는 직장인과 수험생의 요청이 꾸준히 들어오고 있습니다. 공공시설은 이용자의 편의를 가장 먼저 생각해야 합니다.\n을: 늦은 시간에 열람실을 찾는 수요가 있다는 점은 저도 인정합니다. 하지만 운영 시간을 늘리면 야간 근무자 인건비와 냉난방비가 추가로 듭니다. 예산은 정해져 있으니 결국 자료 구입비를 줄여야 할 텐데, 도서관이 가장 먼저 챙겨야 할 것은 좋은 자료를 갖추는 일입니다.\n병: 두 분 말씀에 모두 일리가 있습니다. 그렇다면 수요가 몰리는 시험 기간에만 연장하는 방법은 어떻습니까?\n갑: 직장인은 시험 기간이 아니어도 늘 밤에만 도서관에 올 수 있습니다. 그래서 일 년 내내 연장해야 합니다. 비용은 무인 출입 시스템을 들여놓으면 크게 줄일 수 있습니다.\n을: 무인 시스템으로는 야간에 생기는 응급 상황에 대처할 수 없습니다. 야간에는 직원이 반드시 자리를 지켜야 합니다. 다만 시험 기간에만 연장한다면 추가 비용이 자료 구입비를 건드리지 않는 수준이니 병의 안에는 찬성합니다.\n병: 저도 야간에는 직원이 있어야 한다고 봅니다. 우선 시험 기간에 시범 운영을 하고, 이용 실적을 본 뒤에 일 년 내내 연장할지를 다시 논의합시다.","opts":["늦은 시간에 열람실을 이용하려는 수요가 있다는 점에 대해 갑과 을은 동의한다.","야간에 운영할 때 직원이 자리를 지켜야 한다는 점에 대해 을과 병은 동의한다.","시험 기간에만 운영 시간을 연장하는 방안에 대해 갑과 을은 모두 찬성한다.","도서관이 가장 먼저 고려해야 할 것이 무엇인가에 대해 갑과 을은 생각이 다르다."],"ans":2,"exp":"을은 '병의 안에는 찬성합니다'라고 했지만, 갑은 직장인은 늘 밤에만 올 수 있다며 '일 년 내내 연장해야 합니다'라고 했으므로 시험 기간에만 연장하는 방안에 찬성하지 않는다. 을은 늦은 시간의 수요가 있다는 점을 인정했고, 을과 병은 모두 야간에는 직원이 있어야 한다고 말했다. 갑은 이용자의 편의를, 을은 좋은 자료를 갖추는 일을 가장 먼저 꼽았으므로 두 사람의 생각은 다르다."},
{"id":"k384","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 가장 적절한 것은?\n\n갑: 민원 상담에 인공지능 챗봇을 도입합시다. 여권 발급 절차나 수수료처럼 단순한 문의가 전체 상담의 절반을 넘습니다. 챗봇이 이런 문의를 맡으면 주민은 밤에도 답을 얻고, 직원은 복잡한 민원에 집중할 수 있습니다.\n을: 단순한 문의가 많다는 것은 사실입니다. 그러나 챗봇은 틀린 안내를 할 수 있고, 행정에서 틀린 안내는 주민의 손해로 이어집니다. 정확성이 검증되기 전에는 도입해서는 안 됩니다.\n병: 저는 정확성보다 접근성이 걱정입니다. 민원실을 찾는 분들 가운데에는 스마트폰 사용이 서툰 어르신이 많습니다. 챗봇을 도입하면서 전화 상담 인력을 줄인다면 이분들은 오히려 불편해집니다.\n갑: 전화 상담을 줄이자는 것이 아닙니다. 챗봇은 기존 창구에 더해지는 통로입니다. 정확성 문제는 챗봇이 법령과 지침에 있는 내용만 답하게 하고, 그 밖의 질문은 직원에게 넘기도록 하면 됩니다.\n을: 답변 범위를 그렇게 제한하고 직원 연결을 보장한다면 틀린 안내의 위험은 상당히 줄겠군요. 그 조건이라면 시범 도입에는 반대하지 않겠습니다.\n병: 기존 상담 인력을 유지한다는 전제라면 저도 찬성입니다. 다만 그 전제가 지켜지는지 도입한 뒤에 점검해야 합니다.","opts":["챗봇 도입을 우려하는 이유에 대해 을과 병은 같은 점을 들고 있다.","을은 답변 범위를 제한하더라도 틀린 안내의 위험은 줄지 않는다고 본다.","챗봇을 도입하면 전화 상담 인력을 줄여야 한다는 점에 대해 갑과 병은 동의한다.","단순한 문의가 민원 상담에서 큰 비중을 차지한다는 점에 대해 갑과 을은 동의한다."],"ans":3,"exp":"갑이 단순한 문의가 전체 상담의 절반을 넘는다고 하자 을은 '단순한 문의가 많다는 것은 사실입니다'라고 동의했다. 을은 틀린 안내(정확성)를, 병은 어르신의 접근성을 걱정하므로 우려하는 이유가 다르다. 을은 답변 범위를 제한하면 틀린 안내의 위험이 상당히 준다고 인정했다. 갑은 전화 상담을 줄이자는 것이 아니라고 했고 병도 인력 감축을 걱정했으므로, 두 사람이 인력을 줄여야 한다는 데 동의한 것이 아니다."},
{"id":"k385","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 역사가는 사실을 있는 그대로 기록하는 사람이야. 역사가가 자기 가치관을 서술에 섞기 시작하면 역사는 사실의 기록이 아니라 주장이 되어 버려. 역사 서술에서 가치 판단은 빼야 해.\n을: 나는 그게 가능하다고 생각하지 않아. 과거에 일어난 일은 셀 수 없이 많은데 역사가는 그 가운데 일부만 골라서 쓰잖아. 무엇이 기록할 만큼 중요한지 고르는 순간에 이미 가치 판단이 들어가.\n병: 고르는 과정에 판단이 들어간다는 을의 말은 맞아. 하지만 그렇다고 어떤 서술이든 다 괜찮다는 뜻은 아니지. 사료로 확인되는 사실과 어긋나는 서술은 가치관이 어떻든 틀린 서술이야.\n갑: 사료와 어긋나면 틀린 서술이라는 데에는 나도 같은 생각이야. 그런데 사실을 고르는 일과 사실을 평가하는 일은 구별해야 해. 무엇을 쓸지는 역사가가 골라야 하지만, 고른 사실에 대해 옳다 그르다를 말하는 것은 역사가의 몫이 아니야.\n을: 그 구별도 깔끔하지 않아. ‘학살’이라고 쓸지 ‘진압’이라고 쓸지처럼 낱말 하나를 고르는 데에도 평가가 담기거든. 평가를 완전히 뺀 서술은 없어.\n병: 나도 평가가 전혀 없는 서술은 없다고 봐. 그러니 역사가는 평가를 서술에 담되, 그것을 숨길 것이 아니라 자신이 어떤 관점에서 쓰는지를 밝혀야 해.","opts":["역사가가 기록할 사실을 골라서 쓴다는 점에 대해 갑과 을은 동의한다.","역사가가 사실에 대한 평가를 서술에 담아도 된다는 점에 대해 갑과 병은 동의한다.","평가가 전혀 담기지 않은 역사 서술은 없다는 점에 대해 을과 병은 동의한다.","사료로 확인되는 사실과 어긋나는 서술은 틀린 서술이라는 점에 대해 갑과 병은 동의한다."],"ans":1,"exp":"갑은 고른 사실에 대해 옳다 그르다를 말하는 것은 역사가의 몫이 아니라고 했고, 병은 역사가가 평가를 서술에 담되 관점을 밝혀야 한다고 했으므로 두 사람은 이 점에서 생각이 다르다. 을은 역사가가 일부만 골라서 쓴다고 했고 갑도 무엇을 쓸지는 역사가가 골라야 한다고 했다. 을은 평가를 완전히 뺀 서술은 없다고 했고 병도 같은 말을 했다. 병이 사료와 어긋나는 서술은 틀린 서술이라고 하자 갑은 같은 생각이라고 했다."},
{"id":"k386","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 가장 적절한 것은?\n\n갑: 우리 군에서 열리는 축제 다섯 개를 두 개로 통합하는 안을 검토했으면 합니다. 축제마다 방문객이 줄고 있고, 내용도 먹거리 장터와 초청 가수 공연으로 비슷비슷합니다. 예산을 나누어 쓰기보다 모아서 제대로 된 축제를 만드는 편이 낫습니다.\n을: 내용이 서로 비슷해졌다는 진단에는 동의합니다. 하지만 축제는 관광객만을 위한 것이 아닙니다. 면마다 열리는 축제는 주민들이 한 해에 한 번 모여 어울리는 자리이기도 합니다. 통합하면 그 자리가 사라집니다.\n병: 저는 통합할지 말지보다 순서가 문제라고 봅니다. 축제를 여는 주민 단체들과 협의하지 않고 군에서 먼저 통합안을 내놓으면 반발만 커질 것입니다.\n갑: 주민들이 어울리는 자리가 필요하다는 점은 인정합니다. 그런 자리는 축제라는 이름이 아니어도 마을 행사로 이어 갈 수 있고, 군에서 따로 지원하면 됩니다. 협의가 먼저라는 병의 지적은 받아들이겠습니다.\n을: 마을 행사에 대한 지원이 보장된다면 통합에 반대할 이유가 줄어듭니다. 다만 지원 규모를 통합안과 함께 문서로 밝혀 주셔야 합니다.\n병: 그러면 통합안을 확정하기 전에 주민 단체 간담회부터 열고, 그 자리에서 마을 행사 지원 방안도 함께 내놓는 것으로 정리하지요.","opts":["을은 마을 행사 지원이 보장되면 통합에 반대할 이유가 줄어든다고 본다.","을은 축제들의 내용이 서로 비슷해졌다는 갑의 진단에 동의하지 않는다.","병은 축제를 통합하지 말고 지금처럼 다섯 개를 유지해야 한다고 주장한다.","갑은 주민 단체와 협의하기 전에 군에서 통합안을 먼저 확정해야 한다고 본다."],"ans":0,"exp":"을은 '마을 행사에 대한 지원이 보장된다면 통합에 반대할 이유가 줄어듭니다'라고 말했다. 을은 내용이 비슷해졌다는 갑의 진단에는 동의한다고 했다. 병은 통합할지 말지가 아니라 주민 단체와 협의하는 순서를 문제 삼았을 뿐 축제를 그대로 두자고 하지 않았다. 갑은 협의가 먼저라는 병의 지적을 받아들이겠다고 했으므로 통합안을 먼저 확정해야 한다고 보지 않는다."},
{"id":"k387","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 동물원은 없어져야 한다고 생각해. 야생에서 하루에 수십 킬로미터를 움직이는 동물을 좁은 우리에 가두는 것은 그 자체로 고통을 주는 일이야. 사람의 구경거리를 위해 동물이 고통받아서는 안 돼.\n을: 좁은 우리가 동물에게 고통을 준다는 점은 나도 인정해. 그렇지만 동물원이 구경거리만 제공하는 곳은 아니야. 서식지가 파괴되어 야생에서는 사라진 종을 동물원이 번식시켜서 지켜 낸 경우도 있거든. 동물원을 없애면 그런 종은 설 곳이 없어.\n병: 나는 교육의 측면도 봐야 한다고 생각해. 아이들이 살아 있는 동물을 직접 보는 경험은 책이나 영상으로 대신할 수 없고, 그 경험이 자연을 아끼는 마음으로 이어져.\n갑: 우리에 갇혀 같은 자리를 맴도는 동물을 보는 것이 자연을 아끼는 마음을 길러 줄지 의문이야. 오히려 동물은 가두어도 되는 존재라는 생각을 심어 줄 수 있어. 종을 지키는 일은 필요하지만 그건 관람객을 받지 않는 보호 시설에서도 할 수 있잖아.\n을: 보호 시설을 운영하려면 돈이 드는데, 지금은 그 비용의 상당 부분을 관람 수입으로 대고 있어. 그러니 당장 없애기보다 우리를 넓히고 관람 방식을 바꾸는 쪽이 현실적이야.\n병: 나도 지금의 사육 환경은 나아져야 한다고 봐. 다만 직접 보는 경험의 가치는 포기할 수 없으니 관람은 유지해야 해.","opts":["좁은 우리가 동물에게 고통을 준다는 점에 대해 갑과 을은 동의한다.","사라질 위기에 놓인 종을 지키는 일이 필요하다는 점에 대해 갑과 을은 동의한다.","동물원의 사육 환경이 지금보다 나아져야 한다는 점에 대해 을과 병은 동의한다.","동물을 직접 보는 경험이 자연을 아끼는 마음을 길러 준다는 점에 대해 갑과 병은 동의한다."],"ans":3,"exp":"병은 살아 있는 동물을 직접 보는 경험이 자연을 아끼는 마음으로 이어진다고 했지만, 갑은 그것이 의문이며 오히려 동물은 가두어도 된다는 생각을 심어 줄 수 있다고 했으므로 두 사람은 동의하지 않는다. 을은 좁은 우리가 고통을 준다는 점을 인정했고, 갑은 종을 지키는 일은 필요하다고 했다. 을은 우리를 넓히자고 했고 병은 사육 환경이 나아져야 한다고 했으므로 이 점에서 두 사람의 생각은 같다."},
{"id":"k388","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 보건소 건강 교실을 내년부터 온라인 강의 중심으로 바꾸었으면 합니다. 지금은 평일 낮에 보건소까지 와야 해서 직장인은 사실상 참여할 수 없습니다. 온라인으로 바꾸면 더 많은 주민이 원하는 시간에 들을 수 있습니다.\n을: 참여자를 넓혀야 한다는 취지에는 공감합니다. 그런데 지금 건강 교실에 나오시는 분들은 대부분 70대 이상입니다. 이분들께는 강의 내용만큼이나 함께 모여 운동하고 이야기 나누는 일이 중요합니다. 온라인으로는 그 효과를 기대하기 어렵습니다.\n병: 저는 두 방식의 효과를 비교한 자료가 우리에게 없다는 점이 마음에 걸립니다. 온라인 강의를 끝까지 듣는 비율이 얼마나 되는지도 모르는 상태에서 전면 전환을 결정하기는 이릅니다.\n갑: 어르신들께 모이는 자리가 중요하다는 말씀은 맞습니다. 그렇다면 기존 대면 교실은 그대로 두고, 직장인을 위한 온라인 과정을 새로 만드는 것으로 제 안을 고치겠습니다.\n을: 대면 교실을 유지한다면 저는 반대할 이유가 없습니다. 온라인 과정이 생기면 그동안 오지 못하던 분들께 도움이 될 것입니다.\n병: 저도 그 방향에는 찬성합니다. 다만 온라인 과정은 한 분기만 시범으로 운영해서 수강 완료율을 확인한 다음에 계속할지 정했으면 합니다.","opts":["건강 교실의 참여 대상을 넓혀야 한다는 점에 대해 갑과 을은 동의한다.","병은 자료가 부족하다는 이유로 온라인 과정을 새로 만드는 데 끝까지 반대한다.","갑은 을의 의견을 받아들여 자신이 처음에 내놓은 안을 고쳐서 다시 제시한다.","을은 대면 교실이 유지된다는 조건에서 온라인 과정을 새로 만드는 데 찬성한다."],"ans":1,"exp":"병은 자료 없이 전면 전환을 결정하기는 이르다고 했을 뿐이며, 갑이 안을 고친 뒤에는 '그 방향에는 찬성합니다'라고 하고 시범 운영을 제안했으므로 끝까지 반대한 것이 아니다. 을은 참여자를 넓혀야 한다는 취지에 공감했다. 갑은 어르신들께 모이는 자리가 중요하다는 을의 말을 받아들여 대면 교실을 유지하고 온라인 과정을 더하는 안으로 고쳤고, 을은 대면 교실을 유지한다면 반대할 이유가 없다고 했다."},
{"id":"k389","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 가장 적절한 것은?\n\n갑: 학교 운동장과 체육관을 방과 후와 주말에 주민에게 개방해야 합니다. 학교 시설은 세금으로 지은 공공재인데, 수업이 없는 시간에 비워 두는 것은 낭비입니다. 동네에 운동할 곳이 부족한 주민들에게 큰 도움이 됩니다.\n을: 학교 시설이 공공재라는 데에는 이견이 없습니다. 그러나 학교는 무엇보다 학생이 안전하게 지내야 하는 곳입니다. 외부인이 드나들면 시설이 훼손되거나 위험한 물건이 남을 수 있고, 그 피해는 다음 날 학생들이 입습니다. 저는 개방에 반대합니다.\n병: 저는 개방에는 찬성하지만 지금 방식으로는 안 된다고 봅니다. 현재는 개방한 뒤에 생기는 사고와 청소의 책임을 모두 학교장이 집니다. 이 부담을 그대로 두면 어느 학교도 선뜻 문을 열지 않을 것입니다.\n갑: 병의 지적이 옳습니다. 관리 책임은 학교가 아니라 지방 자치 단체가 맡도록 하고, 관리 인력도 자치 단체가 배치해야 합니다.\n을: 자치 단체가 인력을 두고 책임을 진다면 제가 걱정한 문제는 많이 줄어듭니다. 그래도 체육관은 교실 건물과 이어져 있는 경우가 많으니 개방 대상에서 빼야 합니다. 운동장만이라면 받아들일 수 있습니다.\n병: 체육관까지 열지는 학교마다 건물 구조가 다르니 학교별로 정하게 하면 좋겠습니다.","opts":["학교 시설이 공공재라는 점에 대해 갑은 동의하지만 을은 동의하지 않는다.","을은 관리 책임을 자치 단체가 맡더라도 운동장을 개방하는 데 반대한다.","개방한 뒤의 관리 책임을 학교장이 져야 한다는 점에 대해 갑과 병은 동의한다.","체육관을 개방할 것인지에 대해 을과 병은 서로 다른 방안을 제시하고 있다."],"ans":3,"exp":"을은 체육관을 개방 대상에서 빼야 한다고 했고, 병은 학교별로 정하게 하자고 했으므로 두 사람은 체육관에 대해 서로 다른 방안을 내놓았다. 을은 학교 시설이 공공재라는 데 이견이 없다고 했다. 을은 자치 단체가 책임을 진다면 운동장만은 받아들일 수 있다고 했다. 병은 학교장이 책임을 지는 지금 방식이 문제라고 했고 갑도 자치 단체가 맡아야 한다고 했으므로, 두 사람은 학교장이 책임을 져야 한다고 보지 않는다."},
{"id":"k390","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 우리 기관도 시차 출퇴근제를 전 부서로 확대했으면 합니다. 시범 부서 직원들의 만족도가 높았고, 육아나 통학 때문에 고정된 출근 시간이 부담스러운 직원이 많습니다. 직원의 생활이 안정되어야 업무 집중도도 올라갑니다.\n을: 직원 만족도가 높았다는 점은 저도 확인했습니다. 문제는 민원 부서입니다. 창구는 오전 9시부터 오후 6시까지 반드시 열려 있어야 하는데, 직원마다 출퇴근 시간이 다르면 창구에 공백이 생깁니다. 민원 부서는 확대 대상에서 제외해야 합니다.\n병: 민원 부서 직원이야말로 감정 노동이 많아 제도가 더 필요한 사람들입니다. 한꺼번에 제외하는 것은 형평에 맞지 않습니다. 창구 공백은 조를 나누어 근무 시간이 겹치도록 짜면 막을 수 있습니다.\n갑: 저도 민원 부서를 통째로 빼는 것에는 반대합니다. 병의 말처럼 조 편성으로 해결할 수 있는지 먼저 따져 보아야 합니다.\n을: 조를 짜려면 부서 인원이 어느 정도 되어야 합니다. 직원이 서너 명뿐인 동 주민 센터에서는 한 사람만 빠져도 창구가 빕니다. 인원이 충분한 민원 부서라면 조 편성 방식으로 확대하는 데 동의하겠습니다.\n병: 인원이 적은 곳은 조 편성만으로 공백을 막기 어렵다는 점은 인정합니다. 그런 곳은 주 단위로 돌아가며 사용하는 방식을 따로 마련해야 합니다.","opts":["을은 민원 부서 전체를 제외해야 한다는 입장을 끝까지 유지한다.","시범 부서 직원들의 만족도가 높았다는 점에 대해 갑과 을은 동의한다.","민원 부서 전체를 확대 대상에서 제외하는 것에 대해 갑과 병은 반대한다.","인원이 적은 부서는 조 편성만으로 창구 공백을 막기 어렵다는 점에 대해 을과 병은 동의한다."],"ans":0,"exp":"을은 처음에는 민원 부서를 제외해야 한다고 했지만, 나중에 '인원이 충분한 민원 부서라면 조 편성 방식으로 확대하는 데 동의하겠습니다'라고 했으므로 입장을 끝까지 유지한 것이 아니다. 을은 만족도가 높았다는 점을 확인했다고 했고, 병과 갑은 모두 민원 부서를 통째로 빼는 데 반대했다. 을이 인원이 적은 주민 센터의 사정을 말하자 병은 그런 곳은 조 편성만으로 공백을 막기 어렵다는 점을 인정했다."},
{"id":"k391","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 공공 기금으로 예술을 지원할 때에는 많은 사람이 즐길 수 있는 작품을 우선해야 해. 세금은 시민 모두가 낸 돈이니까 혜택도 되도록 많은 시민에게 돌아가야지. 관객이 거의 들지 않는 실험적인 공연에 큰돈을 쓰는 것은 납득하기 어려워.\n을: 세금의 혜택이 시민에게 돌아가야 한다는 원칙에는 나도 동의해. 하지만 많은 사람이 즐기는 작품은 지원이 없어도 시장에서 살아남아. 공공 지원이 필요한 쪽은 오히려 시장에서 외면받는 실험적인 작업이야. 그런 작업이 있어야 예술 전체가 새로워지고, 그 성과는 결국 대중적인 작품으로도 흘러들어.\n병: 나는 둘 다 기준을 잘못 잡았다고 생각해. 대중적인지 실험적인지를 따질 것이 아니라 지원이 없으면 그 작업이 이루어질 수 없는지를 봐야 해. 대중적인 작품이라도 지역의 작은 극단처럼 지원 없이는 무대에 올릴 수 없는 경우가 있거든.\n갑: 지원이 없어도 만들어질 작품에 세금을 쓸 필요가 없다는 점은 받아들일게. 그래도 지원이 꼭 필요한 작업들 가운데에서는 더 많은 시민이 볼 수 있는 쪽을 먼저 지원해야 해.\n을: 나는 그 순서에는 반대야. 관객 수를 기준으로 삼으면 실험적인 작업은 언제나 뒤로 밀리게 돼. 일정한 몫은 관객 수와 상관없이 새로운 시도에 떼어 두어야 해.\n병: 몫을 따로 두자는 을의 생각은 괜찮은 절충안이네. 그렇게 하면 갑이 말한 원칙도 나머지 몫에서 지킬 수 있어.","opts":["세금으로 하는 지원의 혜택이 시민에게 돌아가야 한다는 점에 대해 갑과 을은 동의한다.","새로운 시도에 지원의 일정한 몫을 따로 떼어 두는 방안에 대해 을은 찬성하지만 병은 반대한다.","지원이 없어도 만들어질 작품에는 세금을 쓸 필요가 없다는 점에 대해 갑과 병은 동의한다.","관객 수를 지원의 우선순위를 정하는 기준으로 삼는 것에 대해 갑과 을은 의견이 다르다."],"ans":1,"exp":"새로운 시도에 일정한 몫을 떼어 두자는 것은 을의 제안이고, 병은 이를 '괜찮은 절충안'이라고 평가했으므로 병이 반대한다는 분석은 적절하지 않다. 을은 세금의 혜택이 시민에게 돌아가야 한다는 원칙에 동의한다고 했다. 병은 지원이 없으면 이루어질 수 없는 작업인지를 보아야 한다고 했고 갑은 지원이 없어도 만들어질 작품에 세금을 쓸 필요가 없다는 점을 받아들였다. 갑은 더 많은 시민이 볼 수 있는 쪽을 먼저 지원하자고 했고 을은 그 순서에 반대했다."},
{"id":"k392","subj":"국어","unit":"대화 분석","q":"다음 대화를 분석한 내용으로 가장 적절한 것은?\n\n갑: 중앙 공원에 반려견 놀이터를 만들었으면 합니다. 우리 동에 등록된 반려견이 해마다 늘고 있는데 목줄을 풀고 뛰놀 수 있는 곳이 없습니다. 그러다 보니 공원 잔디밭에서 몰래 목줄을 푸는 일이 생기고, 그게 다른 이용자와의 갈등으로 이어집니다.\n을: 목줄을 푼 개 때문에 갈등이 생긴다는 점은 저도 여러 번 보았습니다. 하지만 놀이터를 만들면 개 짖는 소리와 냄새 때문에 공원 옆 주택가 주민들이 피해를 봅니다. 공원은 반려견을 키우지 않는 주민도 함께 쓰는 곳입니다. 저는 반대합니다.\n병: 저는 놀이터가 생기면 오히려 갈등이 줄어든다고 봅니다. 개가 뛰놀 곳이 따로 있으면 잔디밭에서 목줄을 풀 이유가 없어지니까요. 문제는 위치입니다. 주택가와 붙어 있는 동쪽이 아니라 도로와 접한 서쪽 끝에 두면 소음 피해는 크지 않을 것입니다.\n갑: 위치에 대한 병의 생각에 찬성합니다. 서쪽 끝이라면 주택가와 멀리 떨어져 있습니다.\n을: 서쪽 끝이라면 소음 걱정은 덜 수 있겠습니다. 그래도 배설물 관리가 되지 않으면 냄새 문제는 남습니다. 관리 인력을 두는 조건이 붙어야 찬성할 수 있습니다.\n병: 관리가 필요하다는 데에는 동의합니다. 다만 별도 인력을 두기보다 이용자 모임이 돌아가며 청소하도록 하는 방식이 예산 면에서 현실적입니다.","opts":["목줄을 푼 반려견 때문에 공원에서 갈등이 생긴다는 점에 대해 갑과 을은 동의한다.","놀이터를 공원의 서쪽 끝에 두는 방안에 대해 갑은 찬성하지만 병은 반대한다.","놀이터의 배설물을 관리하는 방식에 대해 을과 병은 같은 방안을 제시하고 있다.","을은 놀이터를 서쪽 끝에 두더라도 소음 피해는 조금도 줄지 않는다고 본다."],"ans":0,"exp":"갑이 목줄을 푸는 일이 다른 이용자와의 갈등으로 이어진다고 하자 을은 그런 갈등을 여러 번 보았다고 했으므로 두 사람은 이 점에 동의한다. 서쪽 끝에 두자는 것은 병의 제안이고 갑이 이에 찬성했다. 배설물 관리에 대해 을은 관리 인력을 두자고 했고 병은 이용자 모임이 돌아가며 청소하자고 했으므로 방안이 다르다. 을은 서쪽 끝이라면 소음 걱정은 덜 수 있겠다고 인정했다."},
{"id":"e01","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe nurse gently changed the patient's position and applied a warm pack to ______ the pain in his lower back until the medication took effect.","opts":["aggravate","alleviate","transmit","diagnose"],"ans":1,"exp":"약효가 나타날 때까지 자세를 바꿔 주고 따뜻한 찜질을 하는 것은 통증을 \"덜어 주기\"(alleviate) 위한 것이다. aggravate(악화시키다)는 반대 뜻이고, transmit(옮기다, 전하다)과 diagnose(진단하다)는 찜질의 목적이 될 수 없다."},
{"id":"e02","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIf I ______ in your position, with two small children to support and a mortgage to pay, I would accept the offer without hesitating for a moment.","opts":["am","were","have been","will be"],"ans":1,"exp":"주절이 \"would + 동사원형\"(would accept)이므로 현재 사실과 반대되는 일을 가정하는 가정법 과거이다. if절에는 과거 동사를 쓰고 be동사는 주어와 관계없이 were를 쓴다. am, have been, will be는 would accept와 짝이 맞지 않는다."},
{"id":"e06","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWearing a mask is ______ for all visitors to the intensive care unit, and anyone who refuses to put one on will not be allowed to enter.","opts":["optional","voluntary","harmful","mandatory"],"ans":3,"exp":"마스크 쓰기를 거부하면 들어갈 수 없다고 했으므로 마스크 착용은 \"의무적인\"(mandatory) 것이다. optional(선택할 수 있는)과 voluntary(자발적인)는 거부해도 된다는 뜻이어서 뒤 내용과 어긋나고, harmful(해로운)이라면 쓰라고 요구할 까닭이 없다."},
{"id":"e12","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe wording of the contract was so ______ that the two companies interpreted the same clause in completely different ways and eventually took the dispute to court.","opts":["convincing","explicit","ambiguous","concise"],"ans":2,"exp":"두 회사가 같은 조항을 전혀 다르게 해석해 소송까지 갔으므로 계약서의 표현이 \"여러 뜻으로 읽힐 수 있는, 모호한\"(ambiguous) 것이다. explicit(분명한)은 반대 뜻이고, convincing(설득력 있는)과 concise(간결한)는 해석이 갈린 원인이 되지 못한다."},
{"id":"e20","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nBecause the patient had a severe allergy to penicillin, the doctor looked for ______ antibiotics that could treat the infection without triggering a dangerous reaction.","opts":["alternative","identical","harmful","expired"],"ans":0,"exp":"페니실린에 심한 알레르기가 있으므로 위험한 반응을 일으키지 않는 \"다른, 대체할 수 있는\"(alternative) 항생제를 찾았다는 흐름이다. identical(똑같은)은 페니실린과 같은 약이 되어 맞지 않고, harmful(해로운)과 expired(유효 기간이 지난)는 치료에 쓸 약을 꾸밀 수 없다."},
{"id":"e21","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nApplicants are reminded that all the required documents must be submitted before the ______, as late applications will not be accepted under any circumstances.","opts":["refund","ceremony","deadline","vacancy"],"ans":2,"exp":"늦게 낸 지원서는 어떤 경우에도 받지 않는다고 했으므로 서류는 \"마감 기한\"(deadline) 전에 내야 한다. refund(환불), ceremony(의식), vacancy(빈자리, 결원)는 늦은 접수를 받지 않는다는 말과 이어지지 않는다."},
{"id":"e22","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nUnlike his talkative brother, who makes friends wherever he goes, Minsu is rather ______ and seldom speaks unless someone asks him a direct question.","opts":["outgoing","noisy","humorous","reserved"],"ans":3,"exp":"Unlike(~와 달리)로 수다스러운 형과 대비되고, 누가 직접 묻지 않으면 좀처럼 말하지 않는다고 했으므로 \"말수가 적은, 내성적인\"(reserved)이 알맞다. outgoing(외향적인), noisy(시끄러운), humorous(재미있는)는 형과 비슷한 성격이어서 대비가 되지 않는다."},
{"id":"e23","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nHealth officials explained that a single dose of the new vaccine provides ______ against the virus for at least ten years, so no booster shot is needed during that period.","opts":["exposure","immunity","infection","addiction"],"ans":1,"exp":"백신이 주는 것이고 그 기간에는 추가 접종이 필요 없다고 했으므로 \"면역\"(immunity)이 알맞다. provide immunity against는 \"~에 대한 면역을 주다\"라는 뜻이다. exposure(노출), infection(감염), addiction(중독)은 백신의 효과가 될 수 없다."},
{"id":"e24","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe police believed the witness because her statement was ______ with the security camera footage, which showed the suspect leaving the building at exactly the time she had mentioned.","opts":["consistent","unfamiliar","incompatible","dissatisfied"],"ans":0,"exp":"경찰이 증인을 믿은 이유이고, 영상이 증인이 말한 바로 그 시각에 용의자가 건물을 나서는 모습을 보여 주었으므로 진술이 영상과 \"일치하는\"(consistent with) 것이다. incompatible(맞지 않는)은 반대 뜻이고, unfamiliar(익숙하지 않은)와 dissatisfied(불만인)는 진술과 영상의 관계를 나타내지 못한다."},
{"id":"e25","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe long drought had a ______ effect on local agriculture, with most farmers losing more than half of their crops and some giving up farming altogether.","opts":["beneficial","negligible","devastating","soothing"],"ans":2,"exp":"농민 대부분이 작물의 절반 넘게 잃고 농사를 그만둔 사람도 있다고 했으므로 가뭄의 영향은 \"엄청난 피해를 주는\"(devastating) 것이다. beneficial(이로운), negligible(무시해도 될 만큼 작은), soothing(달래 주는)은 큰 피해와 맞지 않는다."},
{"id":"e26","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nFacing serious financial difficulties after sales dropped sharply, the company had no choice but to ______ two hundred workers at its main factory last month.","opts":["recruit","promote","reward","dismiss"],"ans":3,"exp":"매출이 급감해 재정이 어려워진 회사가 어쩔 수 없이 한 일이므로 직원을 \"해고하다\"(dismiss)가 알맞다. recruit(모집하다, 채용하다)는 반대 뜻이고, promote(승진시키다)와 reward(보상하다)는 재정이 어려운 회사가 마지못해 하는 일이 아니다."},
{"id":"e39","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe district hospital, (A) __which__ was built in 1990, is the only medical facility within thirty kilometers of the town. It (B) __is known__ for its emergency care, and patients are sometimes brought there by helicopter from the nearby islands. Most of its nurses (C) __has worked__ there for more than ten years, so they are familiar with the needs of the local community. They often visit elderly residents at home, (D) __providing__ skilled care to those who cannot travel to the hospital.","opts":["(A) which","(B) is known","(C) has worked","(D) providing"],"ans":2,"exp":"\"most of + 명사\"는 뒤의 명사에 수를 맞추는데 its nurses가 복수이므로 has worked가 아니라 have worked여야 한다. (A)는 콤마 뒤에서 The district hospital을 받는 주격 관계대명사, (B)는 \"~로 알려져 있다\"는 수동태, (D)는 They가 돌봄을 \"제공하는\" 능동의 분사구문으로 모두 옳다."},
{"id":"e40","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\n(A) __Although__ heavy rain had been forecast for the weekend, the annual riverside festival was not canceled. The organizers set up large tents over the main stage and handed out free raincoats at the entrance. As a result, thousands of visitors (B) __enjoyed__ (C) __themselves__ in spite of the weather, tasting local food while (D) __listened__ to live music. Many of them said afterward that the rain had made the evening even more memorable, and ticket sales for next year have already begun.","opts":["(A) Although","(B) enjoyed","(C) themselves","(D) listened"],"ans":3,"exp":"접속사 while 뒤에 주어 없이 과거 동사만 올 수 없다. \"주어 + be동사\"(they were)를 생략한 꼴인 while listening이 되어야 한다. (A)는 절을 이끄는 양보의 접속사, (B)는 문장의 과거 동사, (C)는 enjoy oneself(즐겁게 보내다)의 재귀대명사로 모두 옳다."},
{"id":"e41","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe company introduced a new safety policy last month. It requires that every employee (A) __complete__ the basic safety course, (B) __that__ is offered online, (C) __within__ thirty days of (D) __being hired__. Those who work with heavy machinery must also attend a half-day practical session at the main plant. Managers are responsible for checking the records of their team members, and workers who fail to finish the course on time will not be allowed to enter the production area until they do so.","opts":["(A) complete","(B) that","(C) within","(D) being hired"],"ans":1,"exp":"관계대명사 that은 콤마 뒤의 계속적 용법으로 쓸 수 없으므로 which가 되어야 한다. (A)는 요구를 나타내는 require that 뒤의 \"(should) + 동사원형\", (C)는 기한을 나타내는 전치사, (D)는 전치사 of 뒤에서 \"채용되는\" 것을 나타내는 수동형 동명사로 모두 옳다."},
{"id":"e42","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\n(A) __Surrounding__ by steep mountains on all sides, the village (B) __remained__ isolated for centuries. The only way in or out was a narrow path that was often blocked by snow in winter. This isolation, (C) __which__ kept outside influences away, helped its residents (D) __preserve__ their traditional songs, crafts, and farming methods. Today a paved road connects the village to the nearest city, and visitors come from all over the country to experience a way of life that has disappeared elsewhere.","opts":["(A) Surrounding","(B) remained","(C) which","(D) preserve"],"ans":0,"exp":"분사구문의 주어는 주절의 주어 the village이고 마을은 산에 \"둘러싸인\" 것이므로(뒤에 by가 있다) 과거분사 Surrounded여야 한다. (B)는 형용사 보어 isolated를 취하는 동사, (C)는 This isolation을 받는 계속적 용법의 주격 관계대명사, (D)는 \"help + 목적어 + 동사원형\"으로 모두 옳다."},
{"id":"e43","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nResearchers have long been interested in the relationship between sleep and health. Several studies suggest that people (A) __who__ sleep less than six hours a night are (B) __more likely__ to catch a cold than (C) __those__ who sleep (D) __enough long__. One explanation is that the immune system does not work as well when the body is deprived of rest. For this reason, doctors advise adults to keep a regular bedtime and to avoid using smartphones in bed, since the light from the screen can delay sleep.","opts":["(A) who","(B) more likely","(C) those","(D) enough long"],"ans":3,"exp":"enough가 형용사나 부사를 꾸밀 때는 그 뒤에 놓으므로 long enough가 옳다. (A)는 people을 선행사로 하는 주격 관계대명사, (B)는 than과 짝을 이루는 be likely to의 비교급, (C)는 people을 대신하는 지시대명사로 모두 옳다."},
{"id":"e49","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Good morning. I'd like to see a doctor, please.\nB: Good morning. Do you have an appointment?\nA: No, I don't. I woke up with a high fever and a sore throat. ______?\nB: Let me check the schedule. Dr. Kim has an opening at eleven.\nA: That's a relief. I'll take it.\nB: All right. Could you fill out this form while you wait?\nA: Sure. Do you need my health insurance card as well?\nB: Yes, please.","opts":["Is there any chance I could be seen today","Could I get a copy of my medical records","Do I have to pay for my last visit first","Can I change my appointment to next week"],"ans":0,"exp":"예약이 없다고 한 뒤 B가 \"일정을 확인해 보겠다. 김 선생님이 11시에 비어 있다\"고 답하고 A가 안도하므로, 빈칸은 오늘 진료를 받을 수 있는지 묻는 말이다. 예약이 없으니 예약을 바꿀 수 없고, 의무 기록 사본이나 지난 진료비를 묻는 말에는 진료 시간을 알려 주는 대답이 이어지지 않는다."},
{"id":"e50","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Excuse me. I'd like to get a copy of my resident registration.\nB: Sure. May I see your ID card, please?\nA: Here you are. I need two copies, one for my bank and one for my company.\nB: All right. There is a small fee for each copy.\nA: No problem. How long will it take?\nB: ______.\nA: Great. I'll wait right here, then.\nB: Please take a seat. I'll call your name when they are done.","opts":["It'll be ready in just a few minutes","The office closes at six on weekdays","You should have applied for it online","You can pay the fee by card or in cash"],"ans":0,"exp":"얼마나 걸리는지(How long will it take?) 물었고 A가 \"잘됐네요. 그럼 여기서 기다릴게요\"라고 했으므로 몇 분이면 된다는 대답이 알맞다. 근무 시간, 온라인 신청, 수수료를 내는 방법에 대한 말은 걸리는 시간을 묻는 질문의 답이 아니다."},
{"id":"e51","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: You look pale, Sora. Are you feeling all right?\nB: Not really. I've had a terrible headache since this morning's meeting.\nA: ______?\nB: I did, about two hours ago, but it didn't help much.\nA: Then you'd better see the nurse in the health office on the second floor.\nB: But I still have to finish the monthly report by five.\nA: I'll let the manager know. Your health comes first.\nB: Thanks. I'll go down right now.","opts":["How long have you had it","Did you take any medicine","Shall I open the window for you","Would you like a glass of water"],"ans":1,"exp":"B가 \"I did(그렇게 했어요), 두 시간쯤 전에요. 하지만 별로 도움이 안 됐어요\"라고 답했으므로 과거에 한 행동을 묻는 Did you ~? 질문이 와야 한다. 약을 먹었느냐는 질문만 이 대답과 이어진다. 얼마나 오래 아팠는지는 이미 말했고, 창문이나 물을 권하는 말에는 I did로 답할 수 없다."},
{"id":"e52","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nSujin (12:40 pm): Did you see the notice? The public health center is hiring a visiting nurse.\nDahye (12:41 pm): I did. Actually, I'm thinking of applying.\nSujin (12:41 pm): That's great! You've always wanted to work in the community.\nDahye (12:43 pm): But they prefer people with home care experience, and I've only worked in a hospital ward.\nSujin (12:44 pm): ______. You'll never know unless you try.\nDahye (12:45 pm): Maybe you're right. When is the deadline?\nSujin (12:45 pm): Next Friday. I'll send you the link.","opts":["Just give it a shot","I told you so","You'd better give up now","That's out of the question"],"ans":0,"exp":"give it a shot은 \"한번 해 보다\"라는 뜻이다. 뒤에 \"해 보지 않으면 모른다\"는 말이 이어지고 Dahye가 마감일을 묻는 것으로 보아 도전을 권하는 말이 알맞다. I told you so는 \"내가 그럴 거라고 했잖아\", out of the question은 \"불가능한\"이라는 뜻이고, 포기하라는 말은 뒤 문장과 어긋난다."},
{"id":"e53","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nHana (9:02 am): Hello. I saw a poster about the free flu vaccination this fall, but it didn't say much. Who is eligible?\nCity Health Desk (9:03 am): ______.\nHana (9:04 am): My mother is eighty and lives here, so she qualifies. Where can she get it?\nCity Health Desk (9:05 am): At any clinic on the list on our website.\nHana (9:06 am): Does she need to make a reservation or bring anything?\nCity Health Desk (9:07 am): No reservation is needed. She only has to bring her ID card.\nHana (9:08 am): Thank you. That was very helpful.","opts":["It starts on the first Monday of October","Senior citizens living in the city are","You can find the poster at any clinic","It is given at clinics across the city"],"ans":1,"exp":"eligible은 \"자격이 있는\"이라는 뜻이다. 누가 대상인지 물었고 Hana가 \"어머니가 여든이고 이곳에 사니 해당된다\"고 했으므로 대상이 누구인지 알려 주는 대답이 알맞다. 시작 날짜, 포스터가 있는 곳, 접종 장소를 말하는 대답은 누가 대상이냐는 질문의 답이 아니다."},
{"id":"e54","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nJihoon (8:10 am): Welcome back! How was the training workshop in Jeju?\nSeoyeon (8:11 am): It was really useful, except for the last day of the trip.\nJihoon (8:11 am): Why? What happened?\nSeoyeon (8:12 am): ______.\nJihoon (8:13 am): Oh no. How did you get home?\nSeoyeon (8:14 am): I stayed one more night at a hotel near the airport and took the first plane this morning.\nJihoon (8:15 am): You must be tired. Keep the hotel receipt so that you can claim the cost from the office later.","opts":["I learned a lot from the final lecture","The weather was perfect the whole time","I'd love to attend the workshop again","My flight was canceled because of strong winds"],"ans":3,"exp":"마지막 날만 빼고 좋았다고 했고, Jihoon이 \"저런, 집에는 어떻게 왔어요?\"라고 묻자 공항 근처 호텔에서 하루 더 묵고 오늘 첫 비행기를 탔다고 답하므로 마지막 날에 비행기가 결항되었다는 말이 알맞다. 나머지는 모두 좋았던 일이어서 except for the last day와 Oh no에 맞지 않는다."},
{"id":"e55","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMinho (1:15 pm): Jisu, do you have time to help me sort the application files this afternoon?\nJisu (1:16 pm): I'm afraid not. ______.\nMinho (1:17 pm): Oh, I see. Is it the budget meeting?\nJisu (1:18 pm): Yes, and then I have to train the new interns until six.\nMinho (1:18 pm): No problem. I'll ask Taeho instead.\nJisu (1:19 pm): Sorry about that. I can give you a hand tomorrow morning if you still need it.\nMinho (1:20 pm): Thanks. I'll let you know before I leave today.","opts":["I'm all ears","Be my guest","It's on the house","I'm tied up all day"],"ans":3,"exp":"be tied up은 \"(일로) 바빠서 꼼짝 못하다\"라는 뜻이다. I'm afraid not으로 거절한 뒤 그 이유를 말하는 자리이고, 회의와 인턴 교육이 6시까지 있다는 말이 이어진다. I'm all ears는 \"잘 듣고 있다\", Be my guest는 \"그렇게 하세요\", on the house는 \"가게에서 무료로 주는\"이라는 뜻이다."},
{"id":"e56","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Excuse me. How can I get to the National Museum from here?\nB: Take bus number 7 from the stop across the street.\nA: Do I need to transfer on the way?\nB: No, it goes straight there. Get off at the museum's front gate.\nA: ______?\nB: It takes about twenty minutes, depending on traffic.\nA: Good. The museum closes at six, so I should have enough time to look around.\nB: You will. Enjoy your visit.","opts":["How much is the bus fare","How often does the bus come","What time does the museum open","How long does it take to get there"],"ans":3,"exp":"B가 \"교통 상황에 따라 20분쯤 걸린다\"(It takes ~)고 답했으므로 걸리는 시간을 묻는 How long does it take ~?가 알맞다. A가 둘러볼 시간이 충분하겠다고 말하는 것과도 이어진다. 요금, 배차 간격, 문 여는 시각을 묻는 말에는 It takes로 답하지 않는다."},
{"id":"e57","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nYuri (10:20 am): The copier on the third floor is out of order again.\nDaniel (10:21 am): Again? It was repaired just last week.\nYuri (10:22 am): I know. That was the fourth time this year. ______.\nDaniel (10:23 am): I agree. It would cost less than fixing it over and over.\nYuri (10:24 am): Should we bring it up at the staff meeting on Monday?\nDaniel (10:25 am): Good idea. I'll get a price list from the supplier before then.\nYuri (10:25 am): Great. I'll use the one downstairs for now.","opts":["It seems to be working fine now","Let's call the repair technician again","I think it's time we bought a new one","I'll make the copies some other time"],"ans":2,"exp":"Daniel이 동의하면서 \"계속 고치는 것보다 돈이 덜 들 것\"이라고 하고 공급 업체에서 가격표를 받겠다고 했으므로, Yuri는 새 복사기를 사자고 제안한 것이다. \"it's time + 주어 + 과거 동사\"는 \"이제 ~할 때다\"라는 뜻이다. 수리 기사를 다시 부르자는 말은 Daniel의 대답과 어긋난다."},
{"id":"e64","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nTrees in cities do far more than make streets look pleasant. Their leaves absorb pollutants and trap dust, improving the air that residents breathe. In summer, their shade can lower the temperature of streets and buildings by several degrees, which reduces the need for air conditioning. Their roots take in rainwater and so lessen the risk of flooding after heavy storms. Trees also soften the noise of traffic and give birds and insects a place to live in the middle of concrete and glass. Some studies even suggest that people who live near green spaces report lower levels of stress. For these reasons, many city governments no longer treat trees as decoration. They count them, map them, and budget for their care in the same way as they do for roads, pipes, and other essential public facilities.","opts":["difficulties of growing trees in crowded cities","ways to cut the cost of air conditioning","various benefits that trees bring to cities","major causes of flooding in urban areas"],"ans":2,"exp":"도시의 나무가 공기를 맑게 하고, 기온을 낮추고, 홍수 위험과 소음을 줄이고, 스트레스를 덜어 준다는 여러 이점을 나열한 뒤, 그래서 시 정부가 나무를 필수 공공시설처럼 관리한다고 맺는 글이다. 냉방과 홍수는 이점의 예로 잠깐 나올 뿐이고, 나무를 기르기 어렵다는 내용은 없다."},
{"id":"e66","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nGovernment documents are often filled with long sentences and technical terms that ordinary citizens find hard to follow. When people cannot understand a notice, they may miss a deadline, fill out a form incorrectly, or fail to receive a benefit they are entitled to. Offices then have to spend time answering the same questions by phone again and again, and mistakes on forms must be corrected one by one. For this reason, a growing number of public agencies are training their employees to write in plain language: short sentences, familiar words, and the most important point first. Some agencies also test a draft on a few members of the public before sending it out, to see whether readers can find what they need. Clear writing is not a matter of style alone. It saves time and money for both the public and the government.","opts":["how citizens can apply for government benefits","the long history of government record keeping","the difficulty of learning technical terms","the need for plain language in public documents"],"ans":3,"exp":"공문서가 어려우면 시민은 기한을 놓치거나 혜택을 받지 못하고 기관은 같은 문의와 서류 수정에 시간을 쓰게 되므로, 짧은 문장과 익숙한 낱말로 쉽게 써야 한다는 글이다. 혜택은 피해의 예로 나올 뿐 신청 방법을 설명하지 않고, 기록 관리의 역사나 전문 용어를 배우는 어려움은 다루지 않는다."},
{"id":"e68","subj":"영어","unit":"독해 주제","q":"다음 글의 요지로 가장 적절한 것은?\n\nWhen we think of good communicators, we usually picture people who speak well. Yet the most trusted colleagues are often those who listen well. A good listener does not plan a reply while the other person is still talking. Instead, he or she pays full attention, asks questions to check understanding, and waits before giving an opinion. This is harder than it sounds, because most of us are eager to show what we know or to offer a solution at once. People who feel heard, however, are more willing to share problems early, which helps a team prevent small troubles from growing into large ones. They are also more ready to accept advice when it finally comes, since they know it is based on what they actually said. Speaking skills may impress others, but it is careful listening that builds lasting trust.","opts":["신뢰를 쌓는 데에는 말솜씨보다 주의 깊게 듣는 태도가 중요하다.","회의에서는 자신의 의견을 먼저 분명하게 밝혀야 한다.","문제가 생기면 먼저 혼자 해결하려고 노력해야 한다.","말하기 능력은 꾸준히 훈련하면 누구나 기를 수 있다."],"ans":0,"exp":"가장 신뢰받는 동료는 말을 잘하는 사람이 아니라 잘 듣는 사람이라는 글이다. 마지막 문장의 \"it is careful listening that builds lasting trust\"가 요지다. 좋은 청자는 의견을 말하기 전에 기다린다고 했으므로 의견을 먼저 밝히라는 선지는 글과 맞지 않고, 혼자 해결하라는 말이나 말하기 훈련 이야기는 없다."},
{"id":"e69","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nIn many countries the number of elderly people living alone is rising rapidly. Living alone is not a problem in itself, and many older people value their independence. It can become dangerous, however, when no one notices that a person has fallen ill, has had a fall, or has stopped eating properly. Some local governments have responded by asking mail carriers, meter readers, and delivery workers to report anything unusual at the homes they visit regularly, such as uncollected mail or lights left on all day. Others have installed sensors that send an alert to a care worker when there has been no movement in a home for many hours. In some neighborhoods, volunteers telephone older residents every morning simply to ask how they are. Each of these measures aims at the same thing: making sure that help arrives before a small problem turns into a tragedy.","opts":["reasons why elderly people prefer to live alone","poor working conditions of delivery workers","efforts to watch over elderly people living alone","privacy problems caused by sensors in homes"],"ans":2,"exp":"혼자 사는 노인이 늘어나자 집배원과 검침원의 신고, 움직임 감지 장치, 자원봉사자의 안부 전화 같은 방법으로 이들을 살피려 한다는 글이다. 마지막 문장이 이 조치들의 공통된 목적(문제가 커지기 전에 도움이 닿게 함)을 정리한다. 혼자 사는 이유, 배달 노동자의 근무 여건, 감지 장치의 사생활 문제는 언급되지 않는다."},
{"id":"e70","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nA large share of the food thrown away at home is still perfectly safe to eat. One reason is confusion about the dates printed on packages. Many shoppers assume that food becomes harmful the day after a \"sell-by\" date. This date, however, is only a guide for stores, telling them how long a product may stay on the shelf, and it says little about safety. Properly stored milk, eggs, and bread usually remain good for days beyond it. Yet people who are unsure tend to play it safe and put the food in the trash. To reduce such waste, some countries have replaced the sell-by date with a \"use-by\" date, which tells consumers how long a product can actually be eaten if it is stored as directed. A clearer label, it is hoped, will keep good food out of the garbage.","opts":["How to Store Milk and Eggs at Home","Why Fresh Food Costs More Than Before","The Dangers of Eating Expired Food","Misunderstood Date Labels and Food Waste"],"ans":3,"exp":"포장에 적힌 판매 기한을 먹을 수 있는 기한으로 오해해서 멀쩡한 음식을 버리게 되고, 이를 줄이려고 표시를 바꾸는 나라가 있다는 글이다. 기한이 지난 음식이 위험하다는 것은 글이 바로잡으려는 오해이고, 보관 방법이나 식품 가격은 중심 내용이 아니다."},
{"id":"e72","subj":"영어","unit":"독해 내용일치","q":"sea otter에 관한 다음 글의 내용과 일치하는 것은?\n\nSea otters spend almost their entire lives in the cold coastal waters of the North Pacific. Unlike whales and seals, they have no thick layer of fat under the skin; instead, they are kept warm by the densest fur of any animal, which traps a layer of air next to the body. To keep this fur working, they spend several hours a day cleaning it. To maintain their body heat, they must also eat about a quarter of their body weight every day, feeding mainly on sea urchins, crabs, and shellfish. They often float on their backs, place a stone on their chest, and strike a shell against it until it cracks open. When they sleep, they wrap themselves in seaweed so that they do not drift away. Their fur was once so highly prized that hunting nearly wiped them out, and they are now protected by law.","opts":["They have a thick layer of fat like seals.","They eat about half of their body weight each day.","They sleep on rocks along the shore.","They use stones to open shellfish."],"ans":3,"exp":"해달은 배를 위로 하고 떠서 가슴에 돌을 올려놓고 조개를 내리쳐 깬다고 했다. 고래나 물범과 달리 두꺼운 지방층이 없고 촘촘한 털로 체온을 지키며, 하루에 몸무게의 4분의 1쯤을 먹고, 잘 때는 떠내려가지 않도록 물 위에서 해초를 몸에 감는다."},
{"id":"e76","subj":"영어","unit":"독해 내용일치","q":"octopus에 관한 다음 글의 내용과 일치하는 것은?\n\nThe octopus is one of the most unusual animals in the sea. It has three hearts and blue blood, and because it has no bones, it can squeeze through extremely narrow gaps; the only hard part of its body is a beak resembling that of a parrot. About two-thirds of its nerve cells are located not in its head but in its eight arms, which can taste what they touch. An octopus can also change the color of its skin within a second to match its surroundings and hide from enemies. When this fails, it may release a cloud of dark ink and escape while the attacker cannot see. In aquariums, octopuses have been observed opening jars to reach the food inside. Despite these remarkable abilities, many species live for only one or two years, and the females usually die soon after their eggs hatch.","opts":["It has three hearts and red blood.","Most of its nerve cells are in its arms.","It needs several minutes to change its skin color.","Its females live for many years after their eggs hatch."],"ans":1,"exp":"문어의 신경 세포는 약 3분의 2가 머리가 아니라 여덟 개의 팔에 있다고 했다. 피는 파란색이고, 피부색은 1초 안에 바꿀 수 있으며, 암컷은 대개 알이 부화한 뒤 곧 죽는다."},
{"id":"e78","subj":"영어","unit":"독해 내용일치","q":"vitamin D에 관한 다음 글의 내용과 일치하는 것은?\n\nVitamin D helps the body absorb calcium and is therefore essential for strong bones. Children who lack it may develop soft, weak bones, and adults who lack it are more likely to suffer fractures. Unlike most vitamins, it can be produced by the body itself when the skin is exposed to sunlight. Only a few foods, such as oily fish and egg yolks, contain it naturally, which is why it is added to milk and cereals in some countries. People who spend most of the day indoors, as well as older adults, whose skin makes the vitamin less efficiently, are at greater risk of deficiency. In winter, when sunlight is weak, doctors may recommend supplements. More is not always better, however: because the vitamin is stored in body fat, taking very large doses over a long period can be harmful.","opts":["Older adults' skin produces it less efficiently.","It is found naturally in most kinds of food.","The body is unable to make it by itself.","Supplements are mainly recommended in summer."],"ans":0,"exp":"노인은 피부에서 비타민 D를 만드는 효율이 떨어져 결핍 위험이 크다고 했다. 비타민 D가 자연적으로 들어 있는 음식은 몇 가지뿐이고, 피부가 햇빛을 받으면 몸에서 스스로 만들 수 있으며, 보충제는 햇빛이 약한 겨울에 권한다."},
{"id":"e79","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMany people assume that multitasking helps them get more done. They answer messages during meetings, check the news while writing reports, and feel productive because they are always busy. In fact, the brain cannot focus on two demanding tasks at once; it simply switches rapidly between them. Each switch costs a little time and attention, because the mind must recall where it left off, and the costs add up over a day. In experiments, people who are interrupted by messages typically take longer to finish a piece of writing and make more errors than those who work without interruption. What is more, people who believe they are good at multitasking are not necessarily better at it than anyone else. Doing several things at the same time, in other words, usually means ______.","opts":["doing each of them less well","finishing all of them earlier","enjoying work more than before","learning to ignore messages"],"ans":0,"exp":"뇌는 두 가지 일을 동시에 하지 못하고 빠르게 오갈 뿐이며, 그때마다 시간과 주의력이 든다는 글이다. 실험에서도 방해받은 사람들이 더 오래 걸리고 실수가 많았으므로, 여러 일을 한꺼번에 하면 하나하나를 덜 잘하게 된다는 결론이 알맞다. 더 일찍 끝낸다는 선지는 글과 반대다."},
{"id":"e80","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nPlacebos are pills that contain no active medicine, yet patients who take them often report feeling better. For a long time this was dismissed as imagination, but researchers now take it seriously. They believe that the improvement comes from ______. When people trust that a treatment will work, the brain can release chemicals of its own that actually reduce pain. Interestingly, studies have reported that the effect tends to be stronger when the pill is larger, when it is described as expensive, or when it is given by a doctor in a white coat who takes time to explain it. Everything that signals serious treatment, it seems, strengthens the patient's belief. This does not mean that placebos can cure infections; their effect is mainly on symptoms such as pain and nausea. Still, it shows that the mind plays a real part in how we feel when we are ill.\n\n* placebo: 위약(가짜 약)","opts":["a hidden ingredient in the pills","the patient's expectation of getting well","the low price of the treatment","the doctor's skill in surgery"],"ans":1,"exp":"빈칸 다음 문장이 \"치료가 효과가 있으리라고 믿으면 뇌가 통증을 줄이는 물질을 내보낸다\"고 설명하고, 뒤에서도 진지한 치료처럼 보이는 것이 환자의 믿음을 키운다고 했으므로 호전의 원인은 나을 것이라는 환자의 기대다. 위약에는 약 성분이 없다고 했고, 비싸다고 할수록 효과가 크다고 했으므로 나머지 선지는 맞지 않는다."},
{"id":"e81","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nElectric cars produce no exhaust gas while they are being driven, so they are often described as perfectly clean. ______, the electricity that charges them may come from power plants that burn coal or gas, and making their batteries requires large amounts of energy and metals such as lithium and cobalt, which must be mined. Part of the pollution, in other words, is not removed but moved from the street to the power plant and the mine. This does not mean that electric cars are worse than gasoline cars; most studies find that they cause less pollution over their whole lifetime. It does mean that how clean they are depends on how the electricity is produced. A country that wants the full benefit of electric cars must therefore clean up its power supply at the same time as it changes what people drive.","opts":["Therefore","For example","However","Similarly"],"ans":2,"exp":"앞 문장은 전기차가 완전히 깨끗하다고들 말한다는 내용이고, 뒤 문장은 충전용 전기가 석탄·가스 발전소에서 올 수 있고 배터리 생산에도 자원이 많이 든다는 반대 내용이다. 따라서 역접의 However가 알맞다. Therefore는 결과, For example은 예시, Similarly는 비슷한 내용을 이을 때 쓴다."},
{"id":"e82","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIn a traditional market, prices are rarely fixed. A seller names a price, the buyer offers less, and the two move step by step toward a figure that both can accept. Visitors from countries where bargaining is uncommon often feel uncomfortable with this process. They suspect that they are being cheated, or they pay the first price simply to get away. To the people who shop there every day, however, bargaining is ______. It is a chance to chat, to joke, to ask after each other's families, and to build a relationship that will bring the customer back tomorrow. A seller may add a few extra pieces for a familiar face, and a buyer may accept a slightly higher price from a stall he or she has trusted for years. Seen in this light, the few coins gained or lost matter less than the exchange itself.","opts":["a form of social interaction","a waste of valuable time","a sign of dishonesty","a rule set by the government"],"ans":0,"exp":"빈칸 뒤에서 흥정은 이야기를 나누고 농담을 하고 관계를 쌓는 기회라고 했고, 마지막 문장도 돈보다 주고받는 일 자체가 중요하다고 했으므로 \"사회적 교류의 한 형태\"가 알맞다. 속는다고 느끼는 것은 흥정이 낯선 방문객의 생각이고, however 뒤에서는 날마다 장을 보는 사람들의 긍정적인 시각이 나온다."},
