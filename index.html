{"id":"h117","subj":"한국사","unit":"삼국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 신라가 관산성에서 백제 성왕을 전사시켰다.\n(나) 백제와 신라가 고구려에 맞서 처음 동맹을 맺었다.\n(다) 고구려가 살수에서 수의 군대를 물리쳤다.\n(라) 백제가 신라의 대야성을 빼앗았다.","opts":["(나) - (가) - (다) - (라)","(나) - (다) - (가) - (라)","(가) - (나) - (다) - (라)","(나) - (가) - (라) - (다)"],"ans":0,"exp":"나제 동맹 체결(433) → 관산성 전투(554) → 살수 대첩(612) → 대야성 함락(642)의 순서이다. 나제 동맹은 고구려 장수왕의 남진에 맞서 백제 비유왕과 신라 눌지왕이 맺었고, 신라 진흥왕이 한강 유역을 차지하면서 깨졌다. 대야성은 백제 의자왕이 빼앗았다."},
{"id":"h118","subj":"한국사","unit":"남북국 시대","q":"__이 왕__ 때의 사실로 옳은 것은?\n\n발해의 __이 왕__은 대흥, 보력 등의 연호를 썼고, 아버지 무왕과 달리 당과 친선 관계를 맺어 문물을 받아들였다. 일본에 보낸 국서에서는 스스로를 '고려 국왕'이라 일컬었다.","opts":["당의 제도를 받아들여 3성 6부를 정비하였다.","장문휴를 보내 당의 등주를 공격하였다.","전성기를 맞아 해동성국이라 불렸다.","동모산에서 나라를 세웠다."],"ans":0,"exp":"자료의 왕은 문왕이다. 문왕은 당과 친선 관계를 맺고 3성 6부를 비롯한 통치 체제를 정비하였으며, 도읍을 중경에서 상경으로 옮겼다. 등주 공격은 무왕, 해동성국이라 불린 것은 선왕 무렵, 동모산에서의 건국은 고왕 대조영 때의 일이다."},
{"id":"h119","subj":"한국사","unit":"남북국 시대","q":"발해 문화에서 고구려의 영향을 보여 주는 것으로 옳지 않은 것은?","opts":["집터의 온돌 장치","연꽃무늬 수막새","상경성의 주작대로","정혜 공주 묘의 모줄임천장 구조"],"ans":2,"exp":"상경성은 당의 수도 장안성을 본떠 지었고, 남북으로 뻗은 넓은 주작대로는 당의 영향을 보여 준다. 온돌 장치, 연꽃무늬 수막새, 굴식 돌방무덤인 정혜 공주 묘의 모줄임천장 구조는 고구려 문화를 이은 것이다."},
{"id":"h120","subj":"한국사","unit":"남북국 시대","q":"신라 촌락 문서(민정 문서)에 대한 설명으로 옳은 것은?","opts":["호를 사람 수에 따라 3등급으로 나누었다.","세금을 거두려고 3년마다 다시 작성하였다.","노비와 가축의 수는 적지 않았다.","경주 월지(안압지)에서 발견되었다."],"ans":1,"exp":"신라 촌락 문서는 조세와 노동력을 거두기 위해 마을의 인구, 토지, 가축, 나무의 수를 조사하여 3년마다 다시 작성한 문서이다. 호는 사람 수에 따라 9등급으로 나누었고, 노비와 소, 말의 수도 적었다. 서원경(청주) 부근 네 마을의 문서가 일본 도다이사 쇼소인에서 발견되었다."},
{"id":"h121","subj":"한국사","unit":"남북국 시대","q":"__그__에 대한 설명으로 옳은 것은?\n\n__그__는 당에 건너가 빈공과에 합격하였고, 황소의 난이 일어나자 이를 꾸짖는 격문을 지어 이름을 떨쳤다. 신라로 돌아온 뒤 진성 여왕에게 개혁안 10여 조를 올렸으나 제대로 시행되지 못하였다.","opts":["「화왕계」를 지었다.","『화랑세기』를 지었다.","『왕오천축국전』을 지었다.","『계원필경』을 지었다."],"ans":3,"exp":"자료의 인물은 6두품 출신 최치원이다. 그가 당에서 쓴 글을 모은 『계원필경』이 전한다. 「화왕계」는 설총, 『화랑세기』는 김대문, 『왕오천축국전』은 인도와 중앙아시아를 다녀온 승려 혜초가 지었다."},
{"id":"h122","subj":"한국사","unit":"남북국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 원종과 애노가 사벌주에서 봉기하였다.\n(나) 김헌창이 웅천주에서 반란을 일으켰다.\n(다) 견훤이 완산주에 도읍하여 후백제를 세웠다.\n(라) 장보고가 완도에 청해진을 설치하였다.","opts":["(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":3,"exp":"김헌창의 난(822) → 청해진 설치(828) → 원종과 애노의 난(889) → 후백제 건국(900)의 순서이다. 김헌창은 아버지 김주원이 왕이 되지 못한 데 불만을 품고 헌덕왕 때 반란을 일으켰고, 원종과 애노의 난은 진성 여왕 때 세금 독촉에 반발하여 일어났다."},
{"id":"h123","subj":"한국사","unit":"남북국 시대","q":"신라 원성왕 때 유교 경전의 이해 수준을 시험하여 관리를 뽑으려고 마련한 제도는?","opts":["빈공과","독서삼품과","음서","현량과"],"ans":1,"exp":"독서삼품과는 원성왕 때 국학 학생을 대상으로 유교 경전의 이해 수준을 상, 중, 하로 나누어 관리 임용에 반영하려던 제도이다. 진골 귀족의 반발로 제대로 시행되지 못하였다. 빈공과는 당에서 외국인을 대상으로 치른 시험, 음서는 고려와 조선에서 고위 관리의 자손을 시험 없이 등용한 제도, 현량과는 조선 중종 때 조광조가 건의한 추천 제도이다."},
{"id":"h124","subj":"한국사","unit":"고려 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 고려가 고창 전투에서 후백제군을 크게 이겼다.\n(나) 고려가 일리천 전투에서 후백제군을 물리쳤다.\n(다) 후백제가 공산 전투에서 고려군을 크게 이겼다.\n(라) 신라 경순왕이 고려에 항복하였다.","opts":["(가) - (다) - (라) - (나)","(다) - (가) - (나) - (라)","(다) - (가) - (라) - (나)","(다) - (라) - (가) - (나)"],"ans":2,"exp":"공산 전투(927) → 고창 전투(930) → 신라 경순왕의 항복(935) → 일리천 전투(936)의 순서이다. 공산(대구)에서 크게 진 고려는 고창(안동) 전투에서 이겨 주도권을 잡았고, 신라를 넘겨받은 뒤 일리천(구미)에서 후백제군을 물리쳐 후삼국을 통일하였다."},
{"id":"h125","subj":"한국사","unit":"고려 전기","q":"고려의 지방 제도에 대한 설명으로 옳은 것은?","opts":["모든 군현에 지방관을 파견하였다.","전국을 8도로 나누고 관찰사를 보냈다.","전국을 9주로 나누고 5소경을 두었다.","북쪽 국경 지역에 양계를 두고 병마사를 보냈다."],"ans":3,"exp":"고려는 일반 행정 구역인 5도에 안찰사를, 군사 행정 구역인 양계(북계와 동계)에 병마사를 보냈다. 지방관이 파견되지 않은 속현이 많았으며, 모든 군현에 지방관을 보내고 8도에 관찰사를 둔 것은 조선이다. 9주 5소경은 통일 신라의 지방 제도이다."},
{"id":"h126","subj":"한국사","unit":"고려 전기","q":"고려의 관리 등용 제도에 대한 설명으로 옳지 않은 것은?","opts":["5품 이상 관리의 자손은 음서로 관직에 나갈 수 있었다.","제술과와 명경과를 두어 문관을 뽑았다.","승려를 대상으로 하는 승과를 실시하였다.","성종 때 쌍기의 건의로 과거제를 처음 실시하였다."],"ans":3,"exp":"과거제는 광종 때 후주에서 귀화한 쌍기의 건의로 처음 실시되었다. 고려의 과거에는 문관을 뽑는 제술과와 명경과, 기술관을 뽑는 잡과, 승려를 대상으로 하는 승과가 있었다. 5품 이상 관리의 자손은 음서로 과거를 거치지 않고 관직에 나갈 수 있었다."},
{"id":"h127","subj":"한국사","unit":"고려 전기","q":"다음 사건을 구실로 일어난 침입 때의 사실로 옳은 것은?\n\n서북면 도순검사 강조가 군사를 이끌고 개경으로 들어와 목종을 왕위에서 몰아내고 현종을 세웠다.","opts":["서희가 담판으로 강동 6주를 확보하였다.","현종이 나주까지 피란하였다.","강감찬이 귀주에서 큰 승리를 거두었다.","윤관이 별무반을 이끌고 출정하였다."],"ans":1,"exp":"거란은 강조의 정변을 구실로 1010년에 다시 쳐들어왔다(2차 침입). 개경이 함락되어 현종은 나주까지 피란하였고, 양규가 물러가는 거란군을 공격하여 큰 피해를 주었다. 서희의 담판은 1차 침입, 귀주 대첩은 3차 침입 때의 일이고, 별무반은 여진을 정벌하려고 만든 부대이다."},
{"id":"h128","subj":"한국사","unit":"고려 전기","q":"고려 숙종 때 윤관의 건의로 만든 별무반에 대한 설명으로 옳은 것은?","opts":["좌별초, 우별초, 신의군으로 편성되었다.","거란의 침입에 대비하여 정종 때 조직되었다.","국경 지대인 양계에 주둔한 상비군이었다.","신기군, 신보군, 항마군으로 편성되었다."],"ans":3,"exp":"별무반은 기병이 강한 여진에 맞서려고 만든 부대로, 기병인 신기군, 보병인 신보군, 승병인 항마군으로 편성되었다. 윤관은 예종 때 별무반을 이끌고 여진을 정벌하여 동북 9성을 쌓았다. 좌별초, 우별초, 신의군은 삼별초이고, 정종 때 거란에 대비해 만든 부대는 광군, 양계의 상비군은 주진군이다."},
{"id":"h129","subj":"한국사","unit":"고려 전기","q":"고려 시대 화폐에 대한 설명으로 옳은 것은?","opts":["태조 때 건원중보를 처음 만들었다.","광종 때 은병(활구)을 만들어 썼다.","숙종 때 주전도감을 두고 해동통보를 만들었다.","성종 때 상평통보를 널리 유통하였다."],"ans":2,"exp":"고려 숙종은 주전도감을 설치하고 해동통보, 삼한통보 같은 동전과 은병(활구)을 만들었다. 건원중보는 성종 때 만든 철전이고, 상평통보는 조선 후기 숙종 때부터 널리 쓰인 동전이다. 고려에서는 자급자족 경제가 중심이어서 화폐가 널리 쓰이지 못하였다."},
{"id":"h130","subj":"한국사","unit":"고려 전기","q":"고려 시대의 사회 제도에 대한 설명으로 옳은 것은?","opts":["진대법을 처음 실시하여 봄에 곡식을 빌려주었다.","동서 활인서를 두어 도성의 환자를 돌보았다.","상평창을 두어 물가를 조절하였다.","사창제를 실시하여 환곡의 폐단을 줄이려 하였다."],"ans":2,"exp":"고려 성종은 개경, 서경과 12목에 상평창을 두어 곡식 값을 조절하였고, 의창을 두어 흉년에 백성을 구제하였다. 진대법은 고구려 고국천왕 때의 제도이고, 동서 활인서는 조선의 기구이다. 고려에서 환자를 돌본 기구는 동서 대비원이며, 사창제는 조선 흥선 대원군이 실시하였다."},
{"id":"h131","subj":"한국사","unit":"고려 전기","q":"__그__의 활동으로 옳은 것은?\n\n문종의 아들인 __그__는 송에 유학하고 돌아와 국청사를 중심으로 해동 천태종을 열었다. 교종의 입장에서 선종을 아우르려 하였고, 이론 공부와 실천 수행을 함께 닦아야 한다고 주장하였다.","opts":["수선사에서 정혜결사를 이끌었다.","만덕사에서 백련 결사를 이끌었다.","『삼국유사』를 지어 불교 설화를 모았다.","교장도감을 두고 교장을 펴냈다."],"ans":3,"exp":"자료의 인물은 대각 국사 의천이다. 의천은 교관겸수를 내세웠고, 고려와 송, 요, 일본의 불교 주석서를 모아 흥왕사에 교장도감을 두고 교장을 펴냈다. 정혜결사는 지눌, 백련 결사는 요세가 이끌었고, 『삼국유사』는 일연이 지었다."},
{"id":"h132","subj":"한국사","unit":"고려 후기","q":"고려 시대 역사서에 대한 설명으로 옳은 것은?","opts":["『동명왕편』: 신라 시조 박혁거세의 일대기를 시로 읊었다.","『해동고승전』: 성리학의 관점에서 고려 왕조의 역사를 정리하였다.","『삼국사기』: 불교 설화와 향가를 모아 실었다.","『제왕운기』: 단군에서 시작하는 우리 역사를 시로 읊었다."],"ans":3,"exp":"이승휴의 『제왕운기』는 단군에서 시작하는 우리 역사를 중국 역사와 나란히 시로 읊은 책이다. 이규보의 『동명왕편』은 고구려를 세운 동명왕의 이야기를 읊은 서사시이고, 각훈의 『해동고승전』은 이름난 승려의 전기를 모은 책이다. 불교 설화와 향가를 실은 책은 일연의 『삼국유사』이다."},
{"id":"h133","subj":"한국사","unit":"고려 전기","q":"고려의 대간에 대한 설명으로 옳은 것은?","opts":["국방과 군사 문제를 회의로 결정하였다.","화폐와 곡식의 출납과 회계를 맡았다.","왕명의 출납과 군사 기밀을 맡았다.","어사대의 관원과 중서문하성의 낭사로 이루어졌다."],"ans":3,"exp":"대간은 어사대의 관원과 중서문하성의 낭사를 함께 부르는 말로, 왕의 잘못을 비판하는 간쟁, 잘못된 왕명을 돌려보내는 봉박, 관리 임명에 동의하는 서경의 권한을 가졌다. 국방 문제를 회의로 결정한 기구는 도병마사, 출납과 회계를 맡은 기구는 삼사, 왕명 출납과 군사 기밀을 맡은 기구는 중추원이다."},
{"id":"h134","subj":"한국사","unit":"고려 후기","q":"__그__에 대한 설명으로 옳은 것은?\n\n__그__는 이의민을 없애고 권력을 잡은 뒤, 왕에게 토지 겸병의 금지, 조세 제도의 개혁 등을 담은 봉사 10조를 올렸다.","opts":["정방을 두어 인사권을 장악하였다.","도방을 처음 만들어 신변을 지켰다.","강화도로 도읍을 옮겼다.","교정도감을 두어 국정을 장악하였다."],"ans":3,"exp":"자료의 인물은 최충헌이다. 최충헌은 교정도감을 설치하고 그 우두머리인 교정별감이 되어 국정을 장악하였으며, 경대승이 처음 만들었던 도방을 크게 늘려 호위를 맡겼다. 정방 설치와 강화도 천도는 그의 아들 최우가 한 일이다."},
{"id":"h135","subj":"한국사","unit":"고려 후기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 고려 조정이 강화도로 도읍을 옮겼다.\n(나) 김윤후가 처인성에서 몽골 장수 살리타를 사살하였다.\n(다) 박서가 귀주성에서 몽골군을 막아 냈다.\n(라) 고려 조정이 개경으로 돌아왔다.","opts":["(다) - (가) - (나) - (라)","(가) - (다) - (나) - (라)","(다) - (나) - (가) - (라)","(가) - (나) - (다) - (라)"],"ans":0,"exp":"귀주성 전투(1231) → 강화도 천도(1232) → 처인성 전투(1232) → 개경 환도(1270)의 순서이다. 몽골의 1차 침입 때 박서가 귀주성을 지켰고, 최우가 강화도로 도읍을 옮기자 몽골이 다시 쳐들어왔으나 처인성에서 살리타가 죽자 물러갔다. 개경 환도에 반발하여 삼별초가 봉기하였다."},
{"id":"h136","subj":"한국사","unit":"고려 후기","q":"고려 충선왕에 대한 설명으로 옳은 것은?","opts":["정치도감을 두어 개혁을 추진하였다.","원의 수도에 만권당을 세워 학자들이 교류하게 하였다.","쌍성총관부를 공격하여 철령 이북의 땅을 되찾았다.","과전법을 실시하여 토지 제도를 바꾸었다."],"ans":1,"exp":"충선왕은 사림원을 두어 개혁을 추진하였고, 왕위에서 물러난 뒤 원의 수도 연경에 만권당을 세워 이제현 등 고려 학자와 원의 학자가 교류하게 하였다. 정치도감은 충목왕 때 설치되었고, 쌍성총관부를 되찾은 왕은 공민왕이며, 과전법은 공양왕 때 실시되었다."},
{"id":"h137","subj":"한국사","unit":"고려 후기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 이성계가 위화도에서 군대를 돌렸다.\n(나) 과전법이 실시되었다.\n(다) 홍건적의 침입으로 공민왕이 복주(안동)로 피란하였다.\n(라) 이성계가 황산에서 왜구를 크게 물리쳤다.","opts":["(다) - (라) - (가) - (나)","(라) - (다) - (가) - (나)","(다) - (가) - (라) - (나)","(다) - (라) - (나) - (가)"],"ans":0,"exp":"홍건적의 2차 침입과 공민왕의 피란(1361) → 황산 대첩(1380) → 위화도 회군(1388) → 과전법 실시(1391)의 순서이다. 이성계는 홍건적과 왜구를 물리치며 이름을 얻었고, 위화도 회군으로 권력을 잡은 뒤 신진 사대부와 함께 과전법을 실시하여 새 왕조의 경제 기반을 마련하였다."},
{"id":"h138","subj":"한국사","unit":"고려 후기","q":"고려 말 신진 사대부에 대한 설명으로 옳은 것은?","opts":["음서와 공음전을 바탕으로 대대로 고위 관직을 차지하였다.","원과의 관계를 배경으로 도평의사사를 장악하였다.","성리학을 받아들이고 권문세족의 비리를 비판하였다.","정변을 일으켜 중방을 중심으로 권력을 행사하였다."],"ans":2,"exp":"신진 사대부는 주로 과거를 거쳐 관직에 나간 세력으로, 성리학을 받아들여 권문세족의 비리와 불교의 폐단을 비판하였다. 음서와 공음전을 바탕으로 한 세력은 고려 전기의 문벌, 원을 배경으로 도평의사사를 장악한 세력은 권문세족, 중방을 중심으로 권력을 잡은 세력은 무신이다."},
{"id":"h139","subj":"한국사","unit":"고려 후기","q":"고려 시대 문화유산에 대한 설명으로 옳은 것은?","opts":["『직지심체요절』은 목판으로 찍은 인쇄물이다.","초조대장경의 경판은 합천 해인사에 보관되어 있다.","부석사 무량수전은 다포 양식으로 지은 건물이다.","경천사지 10층 석탑은 원의 영향을 받아 대리석으로 만들었다."],"ans":3,"exp":"경천사지 10층 석탑은 원 간섭기에 원의 영향을 받아 대리석으로 만든 탑이다. 『직지심체요절』은 1377년 청주 흥덕사에서 금속 활자로 찍었고, 초조대장경의 경판은 몽골의 침입 때 불에 탔다. 해인사에 있는 것은 팔만대장경이며, 부석사 무량수전은 주심포 양식의 건물이다."},
{"id":"h140","subj":"한국사","unit":"고려 전기","q":"고려의 대외 무역에 대한 설명으로 옳은 것은?","opts":["완도에 청해진을 두어 해상 무역을 장악하였다.","부산포의 왜관에서 일본과 무역하였다.","예성강 어귀의 벽란도가 국제 무역항으로 번성하였다.","의주의 만상이 청과의 무역을 주도하였다."],"ans":2,"exp":"고려는 송과 가장 활발히 무역하였고, 개경에 가까운 예성강 어귀의 벽란도에는 송과 일본, 아라비아 상인까지 드나들었다. 청해진은 통일 신라의 장보고가 설치하였고, 부산포 왜관에서의 무역과 만상의 대청 무역은 조선 시대의 일이다."},
{"id":"h141","subj":"한국사","unit":"조선 전기","q":"__그__의 활동으로 옳은 것은?\n\n__그__는 이성계를 도와 조선 건국을 이끌었고, 『조선경국전』을 지어 재상 중심의 정치를 주장하였다. 한양의 궁궐과 도성 문의 이름을 지었으나, 왕자의 난 때 이방원 세력에게 죽임을 당하였다.","opts":["『불씨잡변』을 지어 불교를 비판하였다.","「조의제문」을 지어 세조의 왕위 찬탈을 비판하였다.","『동국통감』을 편찬하였다.","「시무 28조」를 지어 왕에게 올렸다."],"ans":0,"exp":"자료의 인물은 정도전이다. 정도전은 『조선경국전』으로 통치 제도의 틀을 제시하고 『불씨잡변』으로 불교를 비판하여 성리학을 통치 이념으로 세웠다. 「조의제문」은 김종직, 『동국통감』은 성종 때 서거정 등, 「시무 28조」는 고려 성종 때 최승로가 지었다."},
{"id":"h142","subj":"한국사","unit":"조선 전기","q":"조선 성종 때의 사실로 옳은 것은?","opts":["홍문관을 설치하였다.","호패법을 처음 실시하였다.","4군과 6진을 설치하였다.","직전법을 실시하였다."],"ans":0,"exp":"성종은 집현전의 기능을 잇는 홍문관을 설치하고 경연을 활성화하였으며, 『경국대전』을 완성하여 반포하였다. 호패법을 처음 실시한 왕은 태종, 4군과 6진을 설치한 왕은 세종, 직전법을 실시한 왕은 세조이다."},
{"id":"h143","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 김종서가 여진을 몰아내고 6진을 설치한 지역은?","opts":["압록강 중상류 지역","요동 지역","쓰시마섬","두만강 유역"],"ans":3,"exp":"세종 때 최윤덕이 압록강 중상류 지역에 4군을, 김종서가 두만강 유역에 6진을 설치하여 오늘날과 비슷한 국경선이 만들어졌다. 쓰시마섬은 세종 때 이종무가 왜구의 근거지를 없애려고 정벌한 곳이다."},
{"id":"h144","subj":"한국사","unit":"조선 전기","q":"조선 시대에 삼사로 불린 기구를 바르게 묶은 것은?","opts":["사헌부, 사간원, 승정원","의금부, 사헌부, 홍문관","사헌부, 사간원, 홍문관","사간원, 홍문관, 춘추관"],"ans":2,"exp":"조선의 삼사는 관리의 비리를 감찰하는 사헌부, 왕에게 간쟁하는 사간원, 경연과 자문을 맡은 홍문관을 가리키며, 언론 기능으로 권력의 독점을 막았다. 승정원은 왕명의 출납, 의금부는 중대한 죄인의 심문, 춘추관은 역사 편찬을 맡았다."},
{"id":"h145","subj":"한국사","unit":"조선 전기","q":"조선의 과거 제도에 대한 설명으로 옳지 않은 것은?","opts":["무과를 두지 않아 무관은 추천으로만 뽑았다.","문과의 정기 시험인 식년시는 3년마다 치렀다.","소과에 합격하면 생원이나 진사가 되었다.","잡과를 두어 역관, 의관 등 기술관을 뽑았다."],"ans":0,"exp":"조선은 문과와 함께 무과를 정기적으로 치러 무관을 뽑았다. 무과가 거의 시행되지 않은 것은 고려이다. 정기 시험인 식년시는 3년마다 치렀고, 소과(생원시와 진사시)에 합격하면 생원이나 진사가 되어 성균관에 들어갈 수 있었으며, 잡과로 역관, 의관 등 기술관을 뽑았다."},
{"id":"h146","subj":"한국사","unit":"조선 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 조광조 등 사림이 위훈 삭제를 주장하다가 제거되었다.\n(나) 폐비 윤씨 사건을 구실로 훈구와 사림이 화를 입었다.\n(다) 「조의제문」이 문제가 되어 김일손 등이 처형되었다.\n(라) 외척인 대윤과 소윤의 대립으로 사림이 피해를 입었다.","opts":["(나) - (다) - (가) - (라)","(다) - (가) - (나) - (라)","(다) - (나) - (가) - (라)","(다) - (나) - (라) - (가)"],"ans":2,"exp":"무오사화(1498) → 갑자사화(1504) → 기묘사화(1519) → 을사사화(1545)의 순서이다. 무오사화와 갑자사화는 연산군 때, 기묘사화는 중종 때, 을사사화는 명종이 즉위한 해에 일어났다."},
{"id":"h147","subj":"한국사","unit":"조선 전기","q":"조선 시대 향약에 대한 설명으로 옳은 것은?","opts":["덕업상권, 환난상휼 등을 덕목으로 삼은 향촌 규약이다.","수령을 보좌하고 향리를 감찰한 향촌 자치 기구이다.","향나무를 묻는 매향 활동을 하던 신앙 조직이다.","유향소를 통제하려고 한양에 둔 기구이다."],"ans":0,"exp":"향약은 덕업상권, 과실상규, 예속상교, 환난상휼을 덕목으로 삼은 향촌의 자치 규약으로, 중종 때 조광조 등이 보급하려 하였고 이황과 이이가 우리 실정에 맞게 고쳤다. 수령을 보좌하고 향리를 감찰한 기구는 유향소, 매향 활동을 하던 조직은 향도, 유향소를 통제한 기구는 경재소이다."},
{"id":"h148","subj":"한국사","unit":"조선 전기","q":"임진왜란 때 활약한 인물과 그 활동을 바르게 연결한 것은?","opts":["권율 - 한산도 앞바다에서 일본 수군을 물리쳤다.","곽재우 - 명량에서 일본 수군을 물리쳤다.","김시민 - 진주성에서 일본군을 물리쳤다.","신립 - 행주산성에서 일본군을 물리쳤다."],"ans":2,"exp":"진주 목사 김시민은 1592년 진주성에서 일본군의 공격을 막아 냈다(진주 대첩). 한산도 대첩과 명량 해전은 이순신, 행주 대첩은 권율이 이끌었다. 곽재우는 의령에서 일어난 의병장이고, 신립은 충주 탄금대에서 패하였다."},
{"id":"h149","subj":"한국사","unit":"조선 전기","q":"조선 전기의 편찬 사업에 대한 설명으로 옳은 것은?","opts":["세종 때 서거정 등이 『동국통감』을 편찬하였다.","태종 때 세계 지도인 「혼일강리역대국도지도」를 만들었다.","세조 때 『국조오례의』를 완성하였다.","성종 때 『고려사』를 완성하였다."],"ans":1,"exp":"「혼일강리역대국도지도」는 태종 때인 1402년에 만든 세계 지도이다. 『동국통감』과 『국조오례의』는 성종 때 완성되었고, 『고려사』는 문종 때 완성되었다."},
{"id":"h150","subj":"한국사","unit":"조선 전기","q":"16세기 조선의 사회 모습으로 옳은 것은?","opts":["대동법이 전국으로 확대 실시되었다.","방납의 폐단으로 농민의 공납 부담이 커졌다.","균역법으로 군포 부담이 1필로 줄었다.","신해통공으로 금난전권이 대부분 폐지되었다."],"ans":1,"exp":"16세기에는 서리나 상인이 공물을 대신 내고 농민에게 높은 값을 받아 내는 방납의 폐단이 심해졌고, 군역에서도 대립과 방군수포가 퍼졌다. 대동법은 17세기 초 경기도에서 시작하여 18세기 초에 전국으로 확대되었고, 균역법은 1750년 영조 때, 신해통공은 1791년 정조 때의 일이다."},
{"id":"h151","subj":"한국사","unit":"조선 전기","q":"조선 시대 신분 제도에 대한 설명으로 옳은 것은?","opts":["서얼은 문과 응시에 아무런 제한이 없었다.","노비는 매매하거나 상속할 수 없었다.","법으로는 양인과 천인으로 나누는 양천제를 따랐다.","향리는 과거를 거치지 않고 문반 고위직에 올랐다."],"ans":2,"exp":"조선은 법으로는 백성을 양인과 천인으로 나누는 양천제를 따랐으나, 실제로는 양반, 중인, 상민, 천민의 구분이 자리 잡았다. 서얼은 문과에 응시할 수 없었고, 노비는 재산으로 취급되어 매매, 상속, 증여의 대상이었다. 향리는 수령을 돕는 세습 아전으로 중인에 속하였다."},
{"id":"h152","subj":"한국사","unit":"조선 전기","q":"조선 전기에 지어진 건축물로 옳은 것은?","opts":["화엄사 각황전","금산사 미륵전","법주사 팔상전","해인사 장경판전"],"ans":3,"exp":"해인사 장경판전은 팔만대장경을 보관하려고 15세기에 지은 건물로, 바람이 잘 통하고 습도가 조절되도록 과학적으로 설계되었다. 화엄사 각황전, 금산사 미륵전, 법주사 팔상전은 모두 17세기 이후 조선 후기에 지은 건물이다."},
{"id":"h153","subj":"한국사","unit":"조선 전기","q":"__이 왕__의 정책으로 옳은 것은?\n\n__이 왕__은 계유정난으로 김종서 등을 없애고 권력을 잡은 뒤 조카의 왕위를 빼앗았다. 성삼문 등이 단종을 다시 왕위에 올리려다 발각되자 이들을 처형하였다.","opts":["사병을 없애고 호패법을 처음 실시하였다.","『경국대전』을 완성하여 반포하였다.","6조 직계제를 다시 시행하고 집현전을 없앴다.","훈민정음을 창제하여 반포하였다."],"ans":2,"exp":"자료의 왕은 세조이다. 세조는 왕권을 강화하려고 6조 직계제를 다시 시행하고, 단종 복위 운동에 집현전 출신 학자들이 참여하자 집현전과 경연을 없앴다. 사병 혁파와 호패법 실시는 태종, 『경국대전』 완성은 성종, 훈민정음 창제는 세종 때의 일이다."},
{"id":"h154","subj":"한국사","unit":"조선 후기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 후금이 침입하여 조선과 형제 관계를 맺었다.\n(나) 서인이 광해군을 몰아내고 인조를 왕으로 세웠다.\n(다) 인조가 삼전도에서 청 태종에게 항복하였다.\n(라) 이괄이 반란을 일으켜 한양을 점령하였다.","opts":["(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":3,"exp":"인조반정(1623) → 이괄의 난(1624) → 정묘호란(1627) → 병자호란(1636)의 순서이다. 인조반정의 공신 책봉에 불만을 품은 이괄이 난을 일으켰고, 그 잔당이 후금으로 달아난 것이 정묘호란의 구실 가운데 하나가 되었다."},
{"id":"h155","subj":"한국사","unit":"조선 후기","q":"현종 때 일어난 예송에 대한 설명으로 옳은 것은?","opts":["갑인예송의 결과 서인이 정국을 주도하게 되었다.","기해예송에서는 서인이 주장한 1년설이 받아들여졌다.","남인은 왕에게도 사대부와 같은 예를 적용해야 한다고 주장하였다.","동인이 남인과 북인으로 나뉘는 계기가 되었다."],"ans":1,"exp":"예송은 효종과 효종비가 죽었을 때 자의 대비가 상복을 입는 기간을 두고 서인과 남인이 벌인 논쟁이다. 효종이 죽은 뒤의 기해예송에서는 서인의 1년설이, 효종비가 죽은 뒤의 갑인예송에서는 남인의 1년설이 받아들여져 남인이 정국을 주도하게 되었다. 왕에게도 사대부와 같은 예를 적용하자는 쪽은 서인이었다."},
{"id":"h156","subj":"한국사","unit":"조선 후기","q":"다음 비석이 세워진 왕 때의 사실로 옳은 것은?\n\n오라총관 목극등이 황제의 명을 받들어 변경을 조사하고 이곳에 이르러 살펴보니, 서쪽은 압록강이고 동쪽은 토문강이다. 그러므로 분수령 위에 돌을 세워 기록한다.","opts":["상평통보를 법정 화폐로 채택하였다.","훈련도감을 처음 설치하였다.","균역법을 시행하였다.","장용영을 설치하였다."],"ans":0,"exp":"자료는 1712년 숙종 때 세운 백두산정계비의 내용이다. 숙종 때에는 상평통보를 법정 화폐로 채택하여 널리 쓰게 하였고, 금위영을 설치하여 5군영 체제를 갖추었다. 훈련도감은 선조, 균역법은 영조, 장용영은 정조 때의 일이다."},
{"id":"h157","subj":"한국사","unit":"조선 후기","q":"영조의 정책으로 옳지 않은 것은?","opts":["탕평비를 세워 탕평의 뜻을 알렸다.","장용영을 설치하여 왕권을 뒷받침하였다.","『속대전』을 편찬하여 법전을 정비하였다.","청계천을 준설하여 홍수에 대비하였다."],"ans":1,"exp":"장용영은 정조가 설치한 국왕 친위 부대이다. 영조는 성균관 앞에 탕평비를 세우고 붕당의 근거지인 서원을 정리하였으며, 『속대전』을 편찬하고 청계천을 준설하였다."},
{"id":"h158","subj":"한국사","unit":"조선 후기","q":"다음 조치가 시행된 왕 때의 사실로 옳은 것은?\n\n좌의정 채제공이 아뢰었다. \"육의전 이외의 시전 상인이 난전을 단속하지 못하게 하면, 상인은 자유롭게 사고파는 이익을 얻고 백성은 물건이 귀해 겪는 어려움이 없어질 것입니다.\" 왕이 이를 따랐다.","opts":["『속대전』을 편찬하였다.","『경국대전』을 완성하였다.","『대전회통』을 편찬하였다.","『대전통편』을 편찬하였다."],"ans":3,"exp":"자료는 1791년 정조 때 육의전을 뺀 시전 상인의 금난전권을 없앤 신해통공이다. 정조는 『경국대전』과 『속대전』 등을 합쳐 『대전통편』을 편찬하였다. 『속대전』은 영조, 『경국대전』 완성은 성종, 『대전회통』은 고종 때의 일이다."},
{"id":"h159","subj":"한국사","unit":"조선 후기","q":"순조, 헌종, 철종 때 이어진 세도 정치 시기의 사실로 옳은 것은?","opts":["탕평책으로 붕당의 대립을 누그러뜨렸다.","여러 차례의 환국으로 집권 붕당이 바뀌었다.","소수의 유력 가문이 비변사의 요직을 독점하였다.","서인과 남인이 상복 문제로 예송을 벌였다."],"ans":2,"exp":"세도 정치 시기에는 안동 김씨, 풍양 조씨 등 왕실과 혼인한 소수 가문이 비변사의 요직을 독점하고 권력을 휘둘렀다. 그 결과 매관매직이 성행하고 삼정이 문란해져 농민 봉기가 잇따랐다. 탕평책은 영조와 정조, 환국은 숙종, 예송은 현종 때의 일이다."},
{"id":"h160","subj":"한국사","unit":"조선 후기","q":"1862년 진주에서 시작된 임술 농민 봉기에 대한 설명으로 옳은 것은?","opts":["수습책으로 삼정이정청이 설치되었다.","서북 지역에 대한 차별이 원인이 되었다.","전라도 각 고을에 집강소가 설치되었다.","이인좌 등 소론 강경파가 주도하였다."],"ans":0,"exp":"1862년 경상 우병사 백낙신의 수탈에 맞서 진주에서 일어난 봉기는 전국으로 퍼졌다. 정부는 박규수를 안핵사로 보내고 삼정의 문란을 바로잡겠다며 삼정이정청을 설치하였으나 근본적인 해결책이 되지 못하였다. 서북 지역 차별은 홍경래의 난, 집강소는 동학 농민 운동, 이인좌는 영조 때 일어난 난과 관련된다."},
{"id":"h161","subj":"한국사","unit":"조선 후기","q":"조선 후기 상인에 대한 설명으로 옳은 것은?","opts":["만상은 개성을 근거지로 전국에 송방을 두었다.","내상은 동래를 근거지로 일본과의 무역에 종사하였다.","송상은 한강을 무대로 운송업에 종사하였다.","경강상인은 의주를 근거지로 청과의 무역에 종사하였다."],"ans":1,"exp":"동래의 내상은 왜관을 통해 일본과의 무역에 종사하였다. 개성을 근거지로 전국에 송방이라는 지점을 둔 상인은 송상, 한강을 무대로 운송업에 종사한 상인은 경강상인, 의주를 근거지로 청과의 무역에 종사한 상인은 만상이다."},
{"id":"h162","subj":"한국사","unit":"조선 후기","q":"조선 후기의 경제 모습으로 옳은 것은?","opts":["공장안에 등록된 장인이 물품을 만드는 관영 수공업이 중심이었다.","저화와 조선통보를 만들어 보급하려 하였다.","현직 관리에게만 수조권을 주는 직전법을 시행하였다.","덕대가 물주의 자본을 받아 광산을 경영하였다."],"ans":3,"exp":"조선 후기에는 민간의 광산 개발이 늘면서, 덕대라는 경영 전문가가 상인 물주에게 자본을 받아 채굴업자와 노동자를 고용하여 광산을 경영하였다. 공장안에 장인을 등록하여 운영한 관영 수공업, 저화와 조선통보의 발행, 직전법 시행은 모두 조선 전기의 일이다."},
{"id":"h163","subj":"한국사","unit":"조선 후기","q":"다음 주장을 한 인물에 대한 설명으로 옳은 것은?\n\n나라를 좀먹는 여섯 가지가 있다. 노비 제도, 과거 제도, 양반 문벌 제도, 사치와 미신, 승려, 게으름이 그것이다.","opts":["『성호사설』을 지었다.","『반계수록』을 지었다.","『목민심서』를 지었다.","『북학의』를 지었다."],"ans":0,"exp":"나라를 좀먹는 여섯 가지 폐단(6좀)을 지적한 인물은 이익이다. 이익은 『성호사설』을 지었고, 생활에 꼭 필요한 영업전의 매매를 금지하는 한전론을 주장하였다. 『반계수록』은 유형원, 『목민심서』는 정약용, 『북학의』는 박제가가 지었다."},
{"id":"h164","subj":"한국사","unit":"조선 후기","q":"김정호가 만든 「대동여지도」에 대한 설명으로 옳은 것은?","opts":["처음으로 100리 척을 사용하여 만들었다.","조선 태종 때 만든 세계 지도이다.","서양 선교사 마테오 리치가 만들었다.","10리마다 눈금을 표시하여 거리를 알 수 있게 하였다."],"ans":3,"exp":"「대동여지도」는 1861년 김정호가 목판으로 찍어 낸 전국 지도로, 산맥과 하천, 도로를 자세히 그리고 도로에 10리마다 눈금을 표시하였다. 처음으로 100리 척을 사용한 지도는 영조 때 정상기의 「동국지도」이고, 태종 때의 세계 지도는 「혼일강리역대국도지도」, 마테오 리치가 만든 세계 지도는 「곤여만국전도」이다."},
{"id":"h165","subj":"한국사","unit":"조선 후기","q":"정선에 대한 설명으로 옳은 것은?","opts":["「세한도」를 그리고 추사체를 만들었다.","「인왕제색도」 등 진경산수화를 그렸다.","「고사관수도」를 그렸다.","「미인도」 등 풍속화를 그렸다."],"ans":1,"exp":"정선은 우리나라의 산천을 직접 보고 그리는 진경산수화를 개척하여 「인왕제색도」, 「금강전도」 등을 남겼다. 「세한도」와 추사체는 김정희, 「고사관수도」는 조선 전기의 강희안, 「미인도」는 신윤복의 작품이다."},
{"id":"h166","subj":"한국사","unit":"조선 후기","q":"1801년에 일어난 신유박해에 대한 설명으로 옳은 것은?","opts":["윤지충이 신주를 불태운 일이 계기가 되었다.","황사영 백서 사건이 일어났다.","프랑스 함대가 강화도를 침입하는 구실이 되었다.","최제우가 세상을 어지럽힌다는 죄로 처형되었다."],"ans":1,"exp":"순조가 즉위한 직후인 1801년에 일어난 신유박해로 이승훈 등이 처형되고 정약용 등이 유배되었다. 이때 황사영이 베이징의 주교에게 도움을 청하는 글을 보내려다 발각되었다(황사영 백서 사건). 윤지충 사건은 정조 때의 신해박해, 프랑스 함대의 침입 구실은 1866년의 병인박해이고, 최제우는 동학을 창시한 인물이다."},
{"id":"h167","subj":"한국사","unit":"조선 후기","q":"조선 후기의 통신사에 대한 설명으로 옳은 것은?","opts":["청의 수도 연경을 오가며 서양 문물을 들여왔다.","에도 막부의 요청으로 일본에 파견되었다.","개항 뒤 일본의 근대 문물을 살피러 파견되었다.","조미 수호 통상 조약을 맺은 뒤 미국에 파견되었다."],"ans":1,"exp":"임진왜란 뒤 에도 막부는 조선에 국교 재개와 사절 파견을 요청하였고, 조선은 통신사를 보내 외교 사절이자 문화 사절의 구실을 하게 하였다. 청의 연경을 오간 사절은 연행사, 개항 뒤 일본에 보낸 사절은 수신사, 미국에 보낸 사절은 보빙사이다."},
{"id":"h168","subj":"한국사","unit":"개항기","q":"흥선 대원군이 경복궁을 다시 짓는 비용을 마련하려고 발행한 화폐는?","opts":["백동화","당백전","상평통보","해동통보"],"ans":1,"exp":"흥선 대원군은 경복궁 중건 비용을 마련하려고 원납전을 거두고, 상평통보의 100배 값어치를 매긴 당백전을 발행하였다. 그러나 실제 가치가 그에 미치지 못하여 물가가 크게 올랐다. 백동화는 1890년대에 전환국에서 만든 화폐이고, 해동통보는 고려 숙종 때의 동전이다."},
{"id":"h169","subj":"한국사","unit":"개항기","q":"1881년 청에 파견된 영선사에 대한 설명으로 옳은 것은?","opts":["김홍집이 이끌고 『조선책략』을 들여왔다.","김윤식이 이끌고 톈진에서 무기 제조 기술을 배웠다.","민영익이 이끌고 미국의 여러 시설을 살펴보았다.","박정양 등이 일본의 정부 기관과 산업 시설을 살펴보았다."],"ans":1,"exp":"영선사는 김윤식이 유학생과 기술자를 이끌고 청의 톈진에 가서 근대 무기 제조 기술을 배우게 한 사절로, 돌아온 뒤 기기창이 세워졌다. 『조선책략』을 들여온 것은 2차 수신사 김홍집, 미국을 방문한 것은 민영익 등의 보빙사, 일본을 시찰한 것은 박정양 등의 조사 시찰단이다."},
{"id":"h170","subj":"한국사","unit":"개항기","q":"다음 상소를 올린 인물에 대한 설명으로 옳은 것은?\n\n저들이 비록 왜인이라고 하나 실은 서양 도적입니다. 화의가 한번 이루어지면 사학의 서적과 천주의 초상이 교역하는 가운데 섞여 들어올 것입니다.","opts":["을사늑약에 반대하여 태인에서 의병을 일으켰다.","영남 만인소를 올려 『조선책략』의 유포에 반대하였다.","13도 창의군의 총대장으로 서울 진공 작전을 이끌었다.","평민 출신 의병장으로 경상도와 강원도 일대에서 활약하였다."],"ans":0,"exp":"자료는 1876년 강화도 조약 체결에 반대하여 최익현이 올린 상소로, 일본과 서양이 같다는 왜양일체론을 담고 있다. 최익현은 1906년 태인에서 의병을 일으켰다가 붙잡혀 쓰시마섬에서 숨졌다. 영남 만인소는 이만손 등, 13도 창의군 총대장은 이인영, 평민 출신 의병장은 신돌석이다."},
{"id":"h171","subj":"한국사","unit":"개항기","q":"조미 수호 통상 조약(1882)에 대한 설명으로 옳은 것은?","opts":["부산 외에 두 곳의 항구를 더 열기로 하였다.","일본 공사관에 경비병을 두는 것을 허용하였다.","거중 조정과 최혜국 대우를 규정하였다.","청 상인이 내륙에서 장사하는 것을 허용하였다."],"ans":2,"exp":"조미 수호 통상 조약은 조선이 서양 나라와 맺은 첫 조약으로, 거중 조정, 치외 법권, 최혜국 대우, 관세 부과를 규정하였다. 부산 외 두 항구의 개항은 강화도 조약, 일본 공사관의 경비병 주둔은 임오군란 뒤의 제물포 조약, 청 상인의 내륙 통상은 조청 상민 수륙 무역 장정의 내용이다."},
{"id":"h172","subj":"한국사","unit":"개항기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 영국이 거문도를 불법으로 점령하였다.\n(나) 구식 군인들이 임오군란을 일으켰다.\n(다) 동학 농민군이 전주성을 점령하였다.\n(라) 급진 개화파가 갑신정변을 일으켰다.","opts":["(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":3,"exp":"임오군란(1882) → 갑신정변(1884) → 거문도 사건(1885) → 동학 농민군의 전주성 점령(1894)의 순서이다. 갑신정변 뒤 조선이 러시아와 가까워지려 하자, 영국은 러시아의 남하를 막는다는 구실로 거문도를 점령하였다가 1887년에 물러났다."},
{"id":"h173","subj":"한국사","unit":"개항기","q":"동학 농민군이 전주 화약을 맺은 뒤 전라도 각 고을에 설치한 자치 기구는?","opts":["교정청","군국기무처","집강소","통리기무아문"],"ans":2,"exp":"동학 농민군은 정부와 전주 화약을 맺고 물러난 뒤 전라도 각 고을에 집강소를 두고 폐정 개혁을 추진하였다. 교정청은 같은 무렵 정부가 스스로 개혁을 추진하려고 둔 기구이고, 군국기무처는 1차 갑오개혁을 이끈 기구, 통리기무아문은 1880년에 개화 정책을 맡기려고 둔 기구이다."},
{"id":"h174","subj":"한국사","unit":"개항기","q":"다음 문서가 반포된 시기에 추진된 개혁의 내용으로 옳은 것은?\n\n1. 청에 의존하는 생각을 끊고 자주독립의 기초를 세운다.\n2. 왕실 사무와 국정 사무는 나누어 서로 섞이지 않게 한다.\n3. 조세의 부과와 징수, 경비의 지출은 모두 탁지아문에서 맡는다.","opts":["건양이라는 연호를 쓰기 시작하였다.","원수부를 설치하여 황제가 군대를 통솔하였다.","지방 행정 구역을 8도에서 23부로 바꾸었다.","통리기무아문을 설치하여 개화 정책을 맡겼다."],"ans":2,"exp":"자료는 고종이 종묘에서 반포한 홍범 14조로, 2차 갑오개혁의 방향을 밝힌 것이다. 2차 갑오개혁에서는 의정부를 내각으로, 8아문을 7부로, 지방의 8도를 23부로 바꾸고 재판소를 두어 사법권을 독립시켰다. 건양 연호는 을미개혁, 원수부는 대한 제국의 광무개혁, 통리기무아문은 1880년의 일이다."},
{"id":"h175","subj":"한국사","unit":"개항기","q":"대한 제국이 추진한 광무개혁의 내용으로 옳지 않은 것은?","opts":["대한국 국제를 반포하였다.","군국기무처를 두어 개혁을 추진하였다.","원수부를 두어 황제가 군대를 직접 통솔하였다.","양전 사업을 벌이고 지계를 발급하였다."],"ans":1,"exp":"군국기무처는 1894년 1차 갑오개혁을 이끈 기구이다. 대한 제국은 옛것을 바탕으로 새것을 참고한다는 구본신참을 내세워, 대한국 국제를 반포하여 황제권을 강화하고 원수부를 두었으며, 양전 사업을 벌여 토지 소유자에게 지계를 발급하였다."},
{"id":"h176","subj":"한국사","unit":"개항기","q":"장지연이 을사늑약을 비판하며 쓴 다음 논설이 처음 실린 신문은?\n\n아, 원통하고 분하도다. 우리 이천만 동포여, 살았는가 죽었는가. 단군과 기자 이래 사천 년 국민 정신이 하룻밤 사이에 갑자기 망하고 말 것인가. 원통하고 원통하다, 동포여 동포여.","opts":["한성순보","독립신문","대한매일신보","황성신문"],"ans":3,"exp":"자료는 1905년 장지연이 황성신문에 실은 「시일야방성대곡」이다. 황성신문은 이 일로 한동안 발행이 중지되었다. 한성순보는 1883년 박문국에서 펴낸 최초의 근대 신문, 독립신문은 1896년 서재필이 창간한 신문, 대한매일신보는 1904년 양기탁과 영국인 베델이 창간한 신문이다."},
{"id":"h177","subj":"한국사","unit":"개항기","q":"일제의 국권 침탈 과정에서 맺어진 조약 (가)~(라)를 체결된 순서대로 바르게 나열한 것은?\n\n(가) 대한 제국의 외교권을 빼앗고 통감부를 두기로 하였다.\n(나) 일본이 군사상 필요한 곳을 쓸 수 있게 하였다.\n(다) 통감의 권한을 강화하고 각 부에 일본인 차관을 두게 하였다.\n(라) 일본이 추천하는 재정 고문과 외교 고문을 두게 하였다.","opts":["(나) - (라) - (가) - (다)","(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)"],"ans":0,"exp":"한일 의정서(1904. 2.) → 제1차 한일 협약(1904. 8.) → 을사늑약(1905) → 한일 신협약(정미 7조약, 1907)의 순서이다. 일본은 러일 전쟁을 일으키면서 한일 의정서를 강요하였고, 전쟁에서 이긴 뒤 을사늑약으로 외교권을 빼앗았다. 한일 신협약 직후에는 대한 제국의 군대를 해산하였다."},
{"id":"h178","subj":"한국사","unit":"개항기","q":"1907년에 일어난 정미의병에 대한 설명으로 옳은 것은?","opts":["해산된 군인이 합류하여 전투력이 강해졌다.","단발령에 반발하여 처음 일어났다.","고종의 해산 권고에 따라 대부분 활동을 멈추었다.","남접과 북접이 논산에 모여 연합 부대를 이루었다."],"ans":0,"exp":"정미의병은 1907년 고종의 강제 퇴위와 군대 해산을 계기로 일어났고, 해산된 군인이 합류하여 전투력과 조직이 강해졌다. 이들은 13도 창의군을 꾸려 서울 진공 작전을 폈다. 단발령에 반발하여 일어났다가 고종의 권고로 해산한 것은 1895년의 을미의병이고, 남접과 북접의 연합은 동학 농민 운동의 일이다."},
{"id":"h179","subj":"한국사","unit":"개항기","q":"국채 보상 운동에 대한 설명으로 옳은 것은?","opts":["평양에서 조만식 등이 중심이 되어 시작하였다.","일본의 황무지 개간권 요구를 물리쳤다.","대한매일신보 등 언론의 지원을 받아 전국으로 퍼졌다.","독립 협회가 만민 공동회를 열어 이끌었다."],"ans":2,"exp":"국채 보상 운동은 1907년 대구에서 서상돈 등의 제안으로 시작되어, 대한매일신보 등 언론의 지원을 받으며 전국으로 퍼졌으나 통감부의 방해로 중단되었다. 평양에서 조만식 등이 시작한 것은 물산 장려 운동이고, 일본의 황무지 개간권 요구를 물리친 단체는 보안회이다. 독립 협회는 1898년에 해산되었다."},
{"id":"h180","subj":"한국사","unit":"일제 강점기","q":"1910년대에 일제가 실시한 토지 조사 사업에 대한 설명으로 옳은 것은?","opts":["쌀 생산을 늘려 일본으로 가져가려고 추진되었다.","지주의 권한이 약해지고 자작농이 크게 늘었다.","회사를 세울 때 총독의 허가를 받게 하였다.","농민이 관습적으로 누리던 경작권이 인정되지 않았다."],"ans":3,"exp":"토지 조사 사업은 기한 안에 신고한 토지의 소유권만 인정하였고, 농민이 관습적으로 누리던 경작권은 인정하지 않았다. 그 결과 지주의 권한이 강해지고 많은 농민이 기한부 계약의 소작농이 되었다. 쌀 생산을 늘려 일본으로 가져가려던 정책은 1920년대의 산미 증식 계획이고, 회사 설립 허가제는 회사령의 내용이다."},
{"id":"h181","subj":"한국사","unit":"일제 강점기","q":"1915년 대구에서 조직된 대한 광복회에 대한 설명으로 옳은 것은?","opts":["고종의 밀지를 받은 임병찬이 조직하였다.","105인 사건으로 조직이 무너졌다.","공화 정체의 나라를 세우는 것을 목표로 삼았다.","「조선 혁명 선언」을 활동 지침으로 삼았다."],"ans":2,"exp":"대한 광복회는 박상진을 총사령으로 하여 군자금을 모으고 친일파를 처단하였으며, 공화 정체의 나라를 세우려 하였다. 고종의 밀지를 받아 임병찬이 조직한 단체는 대한 제국의 회복을 내세운 독립 의군부이다. 105인 사건으로 무너진 단체는 신민회, 「조선 혁명 선언」을 지침으로 삼은 단체는 의열단이다."},
{"id":"h182","subj":"한국사","unit":"일제 강점기","q":"3·1 운동 이후 일제가 이른바 문화 통치를 내세운 시기의 사실로 옳은 것은?","opts":["조선 태형령이 제정되어 시행되었다.","교사가 제복을 입고 칼을 차게 하였다.","성과 이름을 일본식으로 바꾸게 하였다.","조선일보와 동아일보의 발행이 허용되었다."],"ans":3,"exp":"일제는 3·1 운동 이후 헌병 경찰제를 보통 경찰제로 바꾸고 1920년에 조선일보와 동아일보의 발행을 허용하였으나, 경찰의 수를 늘리고 신문을 검열하였다. 조선 태형령 시행과 교사의 제복 착용은 1910년대 무단 통치 시기의 일이고, 창씨개명은 1940년부터 강요되었다."},
{"id":"h183","subj":"한국사","unit":"일제 강점기","q":"3·1 운동에 대한 설명으로 옳지 않은 것은?","opts":["도쿄 유학생들의 2·8 독립 선언이 영향을 주었다.","일제가 화성 제암리에서 주민을 학살하였다.","일제가 통치 방식을 이른바 문화 통치로 바꾸는 계기가 되었다.","순종의 장례일을 계기로 일어났다."],"ans":3,"exp":"3·1 운동은 1919년 고종의 장례를 앞두고 일어났다. 순종의 장례일에 일어난 것은 1926년의 6·10 만세 운동이다. 3·1 운동은 민족 자결주의와 2·8 독립 선언의 영향을 받았고, 일제는 제암리 학살 등으로 탄압하였으나 결국 통치 방식을 이른바 문화 통치로 바꾸었다."},
{"id":"h184","subj":"한국사","unit":"일제 강점기","q":"의열단원의 활동으로 옳은 것은?","opts":["나석주가 동양 척식 주식회사에 폭탄을 던졌다.","이봉창이 도쿄에서 일왕이 탄 마차에 폭탄을 던졌다.","안중근이 하얼빈에서 이토 히로부미를 처단하였다.","강우규가 사이토 총독에게 폭탄을 던졌다."],"ans":0,"exp":"의열단원 나석주는 1926년 조선 식산 은행과 동양 척식 주식회사에 폭탄을 던졌다. 이봉창은 한인 애국단원으로 1932년에 의거를 일으켰고, 안중근의 의거는 1909년의 일이다. 강우규는 의열단이 조직되기 전인 1919년 9월에 서울역에서 의거를 일으켰다."},
{"id":"h185","subj":"한국사","unit":"일제 강점기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 순종의 장례일에 6·10 만세 운동이 일어났다.\n(나) 민족 유일당 운동의 결과로 신간회가 창립되었다.\n(다) 광주에서 학생 항일 운동이 일어났다.\n(라) 평양에서 조선 물산 장려회가 조직되었다.","opts":["(가) - (라) - (나) - (다)","(라) - (나) - (가) - (다)","(라) - (가) - (나) - (다)","(라) - (가) - (다) - (나)"],"ans":2,"exp":"평양의 조선 물산 장려회 조직(1920년대 초) → 6·10 만세 운동(1926) → 신간회 창립(1927) → 광주 학생 항일 운동(1929)의 순서이다. 6·10 만세 운동을 준비하면서 민족주의 세력과 사회주의 세력이 손잡은 경험이 신간회 창립으로 이어졌고, 신간회는 광주 학생 항일 운동이 일어나자 진상 조사단을 보냈다."},
{"id":"h186","subj":"한국사","unit":"일제 강점기","q":"1920년대 사회 운동에 대한 설명으로 옳은 것은?","opts":["형평 운동은 여성에 대한 차별을 없애려고 일어났다.","근우회는 신간회가 해소된 뒤에 조직되었다.","암태도 소작 쟁의에서 농민들이 소작료를 낮추는 데 성공하였다.","원산 총파업은 3·1 운동 직전에 일어났다."],"ans":2,"exp":"1923년에 시작된 암태도 소작 쟁의에서 농민들은 1년 가까이 싸워 소작료를 낮추는 데 성공하였다. 형평 운동은 백정에 대한 차별을 없애려고 1923년 진주에서 시작되었고, 근우회는 신간회와 같은 해인 1927년에 조직된 여성 단체이다. 원산 총파업은 1929년에 일어났다."},
{"id":"h187","subj":"한국사","unit":"일제 강점기","q":"대한민국 임시 정부와 관련된 사실 (가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 일본에 선전 포고를 하는 성명서를 발표하였다.\n(나) 독립운동의 방향을 논의하려고 국민 대표 회의가 열렸다.\n(다) 충칭에 자리를 잡고 한국 광복군을 창설하였다.\n(라) 김구가 한인 애국단을 조직하였다.","opts":["(나) - (라) - (다) - (가)","(나) - (다) - (라) - (가)","(라) - (나) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":0,"exp":"국민 대표 회의(1923) → 한인 애국단 조직(1931) → 충칭 정착과 한국 광복군 창설(1940) → 대일 선전 성명서 발표(1941)의 순서이다. 국민 대표 회의가 창조파와 개조파의 대립으로 결렬된 뒤 침체에 빠진 임시 정부는 한인 애국단의 의거로 활로를 찾았고, 태평양 전쟁이 일어나자 일본에 선전 포고를 하였다."},
{"id":"h188","subj":"한국사","unit":"일제 강점기","q":"다음에서 설명하는 군사 조직으로 옳은 것은?\n\n1938년 김원봉 등이 중국 국민당 정부의 지원을 받아 한커우에서 만들었다. 중국군을 도와 정보 수집과 선전 활동을 벌였으며, 뒤에 일부는 화북으로 옮겨 가고 나머지는 한국 광복군에 합류하였다.","opts":["조선 혁명군","한국 독립군","조선 의용대","대한 독립군"],"ans":2,"exp":"조선 의용대는 1938년 한커우에서 만들어진, 중국 관내 최초의 한인 무장 부대이다. 조선 혁명군은 양세봉, 한국 독립군은 지청천이 이끌며 1930년대 초 만주에서 중국군과 연합하여 싸웠고, 대한 독립군은 홍범도가 이끌며 1920년 봉오동 전투에서 승리하였다."},
{"id":"h189","subj":"한국사","unit":"일제 강점기","q":"조선어 학회의 활동으로 옳은 것은?","opts":["국문 연구소를 세워 국문을 정리하였다.","『조선사』를 편찬하여 펴냈다.","한글 맞춤법 통일안과 표준어를 정하였다.","민립 대학 설립 운동을 이끌었다."],"ans":2,"exp":"조선어 학회는 1933년 한글 맞춤법 통일안을 만들고 표준어를 정하였으며 『우리말 큰사전』 편찬을 추진하였으나, 1942년 일제가 일으킨 조선어 학회 사건으로 활동이 중단되었다. 국문 연구소는 1907년 대한 제국의 학부에 둔 기구이고, 『조선사』는 일제의 조선사 편수회가 펴냈으며, 민립 대학 설립 운동은 조선 민립 대학 기성회가 이끌었다."},
{"id":"h190","subj":"한국사","unit":"일제 강점기","q":"다음 글을 쓴 인물의 활동으로 옳은 것은?\n\n역사란 무엇인가? 인류 사회의 '아'와 '비아'의 투쟁이 시간으로 발전하고 공간으로 확대되는 마음의 활동 상태에 관한 기록이다.","opts":["의열단의 부탁으로 「조선 혁명 선언」을 썼다.","『한국독립운동지혈사』를 썼다.","조선학 운동을 벌이며 '얼'을 강조하였다.","『조선사회경제사』를 써서 정체성론을 반박하였다."],"ans":0,"exp":"자료는 신채호가 쓴 『조선상고사』의 첫머리이다. 신채호는 1923년 김원봉의 부탁을 받아 의열단의 활동 지침인 「조선 혁명 선언」을 썼다. 『한국독립운동지혈사』는 박은식, '얼'의 강조는 정인보, 『조선사회경제사』는 백남운과 관련된다."},
{"id":"h191","subj":"한국사","unit":"일제 강점기","q":"대한민국 임시 정부가 1941년에 발표한 건국 강령의 바탕이 된 사상은?","opts":["이승만의 외교 독립론","조소앙의 삼균주의","안창호의 실력 양성론","신채호의 민중 직접 혁명론"],"ans":1,"exp":"대한민국 임시 정부는 1941년 조소앙의 삼균주의를 바탕으로 건국 강령을 발표하였다. 삼균주의는 정치, 경제, 교육의 균등을 통해 개인과 개인, 민족과 민족, 국가와 국가의 균등을 이루자는 사상이다. 건국 강령에는 보통 선거, 토지와 주요 산업의 국유화, 무상 교육 등이 담겼다."},
{"id":"h192","subj":"한국사","unit":"현대","q":"여운형에 대한 설명으로 옳은 것은?","opts":["정읍에서 남한만의 단독 정부 수립을 주장하였다.","광복 직후 조선 건국 준비 위원회를 조직하였다.","김구와 함께 평양의 남북 협상에 참석하였다.","한국 민주당의 창당을 주도하였다."],"ans":1,"exp":"여운형은 1944년 조선 건국 동맹을 만들었고, 광복 직후 이를 바탕으로 안재홍 등과 조선 건국 준비 위원회를 조직하였다. 그 뒤 김규식과 좌우 합작 운동을 이끌다가 1947년에 암살되었다. 정읍 발언은 이승만, 1948년의 남북 협상 참석은 김구와 김규식, 한국 민주당 창당은 송진우와 김성수 등이 한 일이다."},
{"id":"h193","subj":"한국사","unit":"현대","q":"다음 글을 발표한 인물에 대한 설명으로 옳은 것은?\n\n나는 통일된 조국을 건설하려다가 38도선을 베고 쓰러질지언정, 일신의 구차한 안일을 위하여 단독 정부를 세우는 데에는 협력하지 않겠다.","opts":["남북 협상에 참여하려고 평양을 방문하였다.","제헌 국회에서 초대 대통령으로 선출되었다.","5·10 총선거에 출마하여 제헌 국회 의원이 되었다.","좌우 합작 위원회를 이끌다가 1947년에 암살되었다."],"ans":0,"exp":"자료는 1948년 2월 김구가 발표한 「삼천만 동포에게 읍고함」이다. 김구는 남한만의 단독 정부 수립에 반대하여 김규식과 함께 평양에서 열린 남북 협상에 참여하였고, 5·10 총선거에는 참여하지 않았다. 초대 대통령은 이승만이고, 좌우 합작 위원회를 이끌다가 1947년에 암살된 인물은 여운형이다."},
{"id":"h194","subj":"한국사","unit":"현대","q":"제헌 국회가 제정한 농지 개혁법에 따른 농지 개혁에 대한 설명으로 옳은 것은?","opts":["무상 몰수, 무상 분배의 원칙에 따라 이루어졌다.","농지와 함께 산림과 임야도 분배하였다.","유상 매수, 유상 분배의 원칙에 따라 이루어졌다.","지주제가 강화되고 소작농이 크게 늘었다."],"ans":2,"exp":"농지 개혁법은 한 가구가 가질 수 있는 농지를 3정보로 제한하고, 그 이상의 농지는 국가가 지가 증권을 주고 사들여 농민에게 유상으로 분배하게 하였다. 산림과 임야는 대상에서 빠졌다. 그 결과 지주제가 무너지고 자기 땅을 가진 농민이 크게 늘었다. 무상 몰수, 무상 분배는 1946년 북한에서 실시한 토지 개혁의 원칙이다."},
{"id":"h195","subj":"한국사","unit":"현대","q":"6·25 전쟁의 과정 (가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 중국군이 전쟁에 개입하였다.\n(나) 판문점에서 정전 협정이 체결되었다.\n(다) 국군과 유엔군이 인천 상륙 작전에 성공하였다.\n(라) 국군과 유엔군이 서울을 다시 내주고 남쪽으로 물러났다.","opts":["(가) - (다) - (라) - (나)","(다) - (가) - (라) - (나)","(다) - (라) - (가) - (나)","(다) - (가) - (나) - (라)"],"ans":1,"exp":"인천 상륙 작전(1950. 9.) → 중국군 개입(1950. 10.) → 1·4 후퇴(1951. 1.) → 정전 협정 체결(1953. 7.)의 순서이다. 인천 상륙 작전으로 서울을 되찾고 압록강 가까이 나아갔던 국군과 유엔군은 중국군의 개입으로 밀려 서울을 다시 내주었고, 그 뒤 38도선 부근에서 전선이 굳어진 가운데 정전 회담이 이어졌다."},
{"id":"h196","subj":"한국사","unit":"현대","q":"1954년의 사사오입 개헌에 대한 설명으로 옳은 것은?","opts":["대통령을 국민이 직접 뽑도록 바꾸었다.","개헌 당시의 대통령에 한하여 중임 제한을 없앴다.","대통령의 3선 연임을 허용하였다.","대통령을 7년 단임의 간선제로 뽑게 하였다."],"ans":1,"exp":"사사오입 개헌은 이승만 대통령의 장기 집권을 위해 개헌 당시의 대통령에 한하여 중임 제한을 없앤 개헌으로, 의결 정족수에 한 표가 모자랐으나 사사오입의 논리를 내세워 통과시켰다. 대통령 직선제로 바꾼 것은 1952년 발췌 개헌, 3선 연임 허용은 1969년 3선 개헌, 7년 단임의 간선제는 1980년 개헌의 내용이다."},
{"id":"h197","subj":"한국사","unit":"현대","q":"박정희 정부 시기의 사실로 옳지 않은 것은?","opts":["한일 협정을 체결하였다.","베트남에 국군을 파병하였다.","금융 실명제를 실시하였다.","새마을 운동을 시작하였다."],"ans":2,"exp":"금융 실명제는 1993년 김영삼 정부가 실시하였다. 박정희 정부는 1965년 한일 협정을 체결하고 베트남에 전투 부대를 파병하였으며, 1970년에 새마을 운동을 시작하였다."},
{"id":"h198","subj":"한국사","unit":"현대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 광주에서 5·18 민주화 운동이 일어났다.\n(나) 유신 헌법이 공포되었다.\n(다) 6월 민주 항쟁이 일어났다.\n(라) 부산과 마산에서 부마 민주 항쟁이 일어났다.","opts":["(나) - (라) - (가) - (다)","(나) - (가) - (라) - (다)","(라) - (나) - (가) - (다)","(나) - (라) - (다) - (가)"],"ans":0,"exp":"유신 헌법 공포(1972) → 부마 민주 항쟁(1979) → 5·18 민주화 운동(1980) → 6월 민주 항쟁(1987)의 순서이다. 부마 민주 항쟁 직후 10·26 사태로 유신 체제가 무너졌으나 신군부가 권력을 잡았고, 이에 맞서 5·18 민주화 운동이 일어났다. 6월 민주 항쟁의 결과 5년 단임의 대통령 직선제 개헌이 이루어졌다."},
{"id":"h199","subj":"한국사","unit":"현대","q":"김영삼 정부 시기의 사실로 옳은 것은?","opts":["제1차 경제 개발 5개년 계획을 시작하였다.","서울 올림픽을 개최하였다.","경제 협력 개발 기구(OECD)에 가입하였다.","첫 남북 정상 회담을 열었다."],"ans":2,"exp":"김영삼 정부는 1993년 금융 실명제를 실시하고 1996년 경제 협력 개발 기구(OECD)에 가입하였으나, 1997년 말 외환 위기를 맞아 국제 통화 기금(IMF)의 지원을 받았다. 제1차 경제 개발 5개년 계획은 1962년 박정희 정부, 서울 올림픽은 1988년 노태우 정부, 첫 남북 정상 회담은 2000년 김대중 정부 때의 일이다."},
{"id":"h200","subj":"한국사","unit":"현대","q":"노태우 정부 시기의 사실로 옳은 것은?","opts":["7·4 남북 공동 성명을 발표하였다.","6·15 남북 공동 선언을 발표하였다.","남북 기본 합의서를 채택하였다.","남북 이산가족 고향 방문단을 처음 교환하였다."],"ans":2,"exp":"노태우 정부는 북방 외교를 펼쳐 소련, 중국과 수교하였고, 1991년 남북한 유엔 동시 가입에 이어 화해와 불가침, 교류 협력을 담은 남북 기본 합의서를 채택하였다. 7·4 남북 공동 성명은 1972년 박정희 정부, 6·15 남북 공동 선언은 2000년 김대중 정부, 첫 이산가족 고향 방문단 교환은 1985년 전두환 정부 때의 일이다."}
];

{"id":"p26m01","no":1,"subj":"간호관리","unit":"인적자원관리","q":"다음 설명에 해당하는 임금체계는?\n\n○ 보상체계의 운영이 쉬우나 유능한 전문인력의 확보가 어렵다.\n○ 구성원의 근속연수, 학력, 연령 등을 고려해서 임금을 결정한다.","opts":["성과급","연공급","직무급","직능급"],"ans":1,"exp":"근속연수·학력·연령 같은 속인적 요소로 임금을 정하는 것은 연공급이다. 운영은 쉽지만 능력과 임금이 따로 움직여 유능한 전문인력을 붙잡기 어렵다. 직무급은 직무의 가치, 직능급은 직무 수행 능력, 성과급은 업적을 기준으로 한다.","past":true,"paper":"2026-m","src":"2026 기출 1번"},
{"id":"p26m02","no":2,"subj":"간호관리","unit":"간호윤리","q":"다음 설명에 해당하는 환자의 권리는?\n\n담당 의사와 간호사로부터 질병 상태, 치료 방법, 의학적 연구 대상 여부, 진료 비용 등에 관하여 충분한 설명을 듣고 자세히 물어볼 수 있으며, 이에 관한 동의 여부를 결정할 권리를 가진다.","opts":["진료받을 권리","비밀을 보호받을 권리","알권리 및 자기결정권","상담ㆍ조정을 신청할 권리"],"ans":2,"exp":"충분한 설명을 듣고 물어볼 수 있으며 동의 여부를 스스로 정하는 것은 의료법 시행규칙이 정한 환자의 권리 가운데 '알권리 및 자기결정권'이다. 진료받을 권리는 차별 없이 최선의 의료를 받는 것, 비밀을 보호받을 권리는 사생활과 진료 정보의 보호, 상담ㆍ조정을 신청할 권리는 의료 분쟁이 생겼을 때의 권리다.","past":true,"paper":"2026-m","src":"2026 기출 2번"},
{"id":"p26m03","no":3,"subj":"간호관리","unit":"간호윤리","q":"생명윤리에서 ‘신의의 규칙’에 해당하는 것은?","opts":["공평하게 자원 분배하기","위험과 고통 최소화하기","간호하면서 알게 된 비밀 유지하기","환자에게 치료에 대한 동의 구하기"],"ans":2,"exp":"신의의 규칙은 환자의 비밀을 지키는 것으로, 간호하면서 알게 된 사실을 남에게 알리지 않는 것이 해당한다. 공평한 자원 분배는 정의의 원칙, 위험과 고통을 줄이는 것은 악행금지의 원칙, 동의를 구하는 것은 자율성 존중의 원칙이다.","past":true,"paper":"2026-m","src":"2026 기출 3번"},
{"id":"p26m04","no":4,"subj":"간호관리","unit":"질 관리","q":"병동에서 월별로 낙상 발생 건수의 추이를 파악하고자 할 때, 적합한 질 향상 활동 도구는?","opts":["런차트","흐름도","레이더 차트","인과관계도"],"ans":0,"exp":"런차트는 시간의 흐름에 따라 값이 어떻게 변하는지 꺾은선으로 보여 주어 월별 추이를 보기에 알맞다. 흐름도는 업무 과정의 순서, 레이더 차트는 여러 항목의 균형, 인과관계도(물고기뼈 그림)는 문제의 원인을 정리하는 도구다.","past":true,"paper":"2026-m","src":"2026 기출 4번"},
{"id":"p26m05","no":5,"subj":"간호관리","unit":"의사소통","q":"A 간호사가 K 의사와 다음과 같이 이야기하고 있다. 이에 해당하는 'SBAR'의 단계는?\n\n“환자에게 운동이 필요합니다. 그러므로 통증을 줄이기 위해서 진통제를 좀 더 사용해야 할 것 같습니다. 환자 상태를 확인하러 병실로 와 주시거나 진통제를 처방해 주실 수 있으세요?”","opts":["Situation(상황)","Background(배경)","Assessment(사정)","Recommendation(권고)"],"ans":3,"exp":"와서 환자를 봐 달라거나 진통제를 처방해 달라고 필요한 조치를 요청하는 말이므로 Recommendation(권고) 단계다. Situation은 지금 일어난 문제, Background는 병력과 경과, Assessment는 간호사가 판단한 환자 상태를 전하는 단계다.","past":true,"paper":"2026-m","src":"2026 기출 5번"},
{"id":"p26m06","no":6,"subj":"간호관리","unit":"동기부여","q":"알더퍼(Alderfer)의 ERG 동기부여이론 구성요소가 아닌 것은?","opts":["소속욕구","성장욕구","관계욕구","존재욕구"],"ans":0,"exp":"ERG 이론은 욕구를 존재(Existence), 관계(Relatedness), 성장(Growth)의 세 가지로 나눈다. 소속욕구는 매슬로우의 욕구단계이론(또는 맥클리랜드의 친화욕구)에 나오는 말로 ERG의 구성요소가 아니다.","past":true,"paper":"2026-m","src":"2026 기출 6번"},
{"id":"p26m07","no":7,"subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 기획의 원칙은?\n\n변동되는 상황에 대응할 수 있고, 하부 집행기관이 창의력을 충분히 발휘할 수 있도록 해야 한다.","opts":["필요성의 원칙","탄력성의 원칙","균형성의 원칙","포괄성의 원칙"],"ans":1,"exp":"상황이 바뀌어도 고쳐 쓸 수 있게 융통성을 두고 하부 기관이 창의력을 발휘하게 하는 것은 탄력성(신축성)의 원칙이다. 필요성은 타당한 근거와 꼭 필요한 기획일 것, 균형성은 다른 계획이나 업무와 조화를 이룰 것, 포괄성은 필요한 인력·물자·예산 등 모든 요소를 빠짐없이 담을 것을 뜻한다.","past":true,"paper":"2026-m","src":"2026 기출 7번"},
{"id":"p26m08","no":8,"subj":"간호관리","unit":"인사고과","q":"다음 설명에 해당하는 직무수행평가의 유형은?\n\n○ A 병동의 낙상률을 감소시키기 위해 간호관리자와 간호사들이 함께 측정 가능한 목표를 설정하였다.\n○ 3개월 동안 낙상 예방을 위한 관리 조치를 주기적으로 실시한 결과, A 병동의 낙상률은 감소되었고 이를 간호사의 직무수행평가에 반영하였다.","opts":["목표관리법","강제배분법","도표식 평정척도법","행동기준 평정척도법"],"ans":0,"exp":"관리자와 구성원이 함께 측정 가능한 목표를 세우고 그 달성 정도로 평가하는 것은 목표관리법(MBO)이다. 강제배분법은 등급별 인원 비율을 미리 정해 나누는 방법, 도표식 평정척도법은 평가 요소마다 척도에 점수를 매기는 방법, 행동기준 평정척도법은 구체적인 행동 사례를 기준으로 삼는 방법이다.","past":true,"paper":"2026-m","src":"2026 기출 8번"},
{"id":"p26m09","no":9,"subj":"간호관리","unit":"환자안전","q":"간호사가 병동 순회 도중 복도 화장실 쪽에서 연기가 나는 것을 발견하였을 때, 가장 먼저 해야 할 행동은?","opts":["중환자를 우선 이동시킨다.","화재 발생 즉시 ‘불이야’라고 외치고 알린다.","보행이 가능한 환자를 우선 승강기로 신속히 대피시킨다.","보호자와 방문객을 우선 대피시킨다."],"ans":1,"exp":"화재를 발견하면 가장 먼저 큰 소리로 알리고 경보를 울려 주변에 전파한다. 대피는 그다음이며, 불에서 가까운 환자와 걸을 수 있는 환자부터 옮기고 중환자는 나중에 인력을 모아 옮긴다. 화재 때 승강기는 쓰지 않고 계단으로 대피한다.","past":true,"paper":"2026-m","src":"2026 기출 9번"},
{"id":"p26m10","no":10,"subj":"간호관리","unit":"관리이론","q":"길리스(Gillies)의 체계론적 관점에서 간호관리과정의 산출에 해당하는 것은?","opts":["재무관리","갈등관리","동기부여","직무만족"],"ans":3,"exp":"길리스의 체계모형에서 산출은 관리 활동의 결과로 나타나는 간호의 질, 환자 만족, 직무만족, 이직률 등이다. 재무관리, 갈등관리, 동기부여는 투입을 산출로 바꾸는 전환과정(기획·조직·인사·지휘·통제)에 속하는 관리 활동이다.","past":true,"paper":"2026-m","src":"2026 기출 10번"},
{"id":"p26m11","no":11,"subj":"간호관리","unit":"간호전달체계","q":"간호전달체계 방법 중 기능적 간호에 대한 설명으로 옳은 것은?","opts":["전인적 간호를 위하여 전문인력과 비전문인력이 함께 참여한다.","효율성에 기초하여 각 간호사는 특정한 업무를 분담받아 간호를 제공한다.","배정받은 환자의 간호에 대해 입원에서 퇴원까지 한 명의 간호사가 책임을 진다.","병동의 지리적 구분에 따라 2 ～ 3명의 간호요원이 팀을 구성하여 환자간호를 제공한다."],"ans":1,"exp":"기능적 간호는 투약, 활력징후 측정처럼 업무를 나누어 맡기는 분업 방식으로 효율은 높지만 간호가 조각나기 쉽다. 전문인력과 비전문인력이 함께 참여하는 것은 팀간호, 입원부터 퇴원까지 한 간호사가 책임지는 것은 일차간호, 병동을 구역으로 나눠 작은 팀이 맡는 것은 모듈간호다.","past":true,"paper":"2026-m","src":"2026 기출 11번"},
{"id":"p26m12","no":12,"subj":"간호관리","unit":"의료법규","q":"「의료법 시행규칙」상 계속적인 진료를 위해 연장 보존하는 경우를 제외하고, 10년간 보존해야 할 문서는?","opts":["환자 명부","수술기록","간호기록부","검사내용 및 검사소견기록"],"ans":1,"exp":"의료법 시행규칙은 진료기록부와 수술기록을 10년간 보존하도록 정한다. 환자 명부, 간호기록부, 검사내용 및 검사소견기록은 모두 5년이다. 참고로 처방전은 2년, 진단서 등의 부본은 3년이다.","past":true,"paper":"2026-m","src":"2026 기출 12번"},
{"id":"p26m13","no":13,"subj":"간호관리","unit":"인적자원관리","q":"간호조직에서 인력배치의 원칙에 대한 설명으로 옳은 것은?","opts":["능력주의 － 조직 전체 차원에서 상하좌우의 모든 구성원들을 평등하게 배치함","균형주의 － 직무를 통하여 직원을 성장시키면서, 상급자에 의한 개발뿐만 아니라 본인의 자아실현 의지를 고취하도록 함","인재육성주의 － 능력을 발휘할 수 있는 영역을 제공하며, 평가된 실력과 업적에 대해 만족할 수 있도록 대우함","적재적소주의 － 개인이 소유하고 있는 능력과 성격 등의 면에서 최적의 직위에 배치하여 최고의 능력을 발휘하게 함"],"ans":3,"exp":"적재적소주의는 사람의 능력과 성격에 가장 맞는 자리에 배치해 능력을 최대로 발휘하게 하는 원칙이다. 나머지는 설명이 서로 바뀌어 있다. 모든 구성원을 고르게 배치하는 것은 균형주의, 직무를 통해 성장시키는 것은 인재육성주의, 능력을 발휘할 영역을 주고 실력과 업적에 맞게 대우하는 것은 능력주의다.","past":true,"paper":"2026-m","src":"2026 기출 13번"},
{"id":"p26m14","no":14,"subj":"간호관리","unit":"조직","q":"간호조직 구조 중 비공식조직에 대한 설명으로 옳은 것은?","opts":["계층, 부서 간의 권한 및 책임, 의사소통의 경로를 분명하게 밝혀 준다.","조직구성원에게 구체적인 직무를 할당하며, 지위와 신분 체계를 문서화한다.","사회적 욕구에 의해 만들어진 자생적 조직으로 인간 상호관계를 바탕으로 한다.","조직의 목표 달성을 위해 조직 내 구성원들 간의 역할 관계를 인위적으로 체계화한 구조이다."],"ans":2,"exp":"비공식조직은 구성원의 사회적 욕구에서 저절로 생겨난 모임으로, 조직도에 나타나지 않고 감정과 인간관계를 바탕으로 한다. 권한·책임·의사소통 경로를 밝히고, 직무와 지위를 문서로 정하며, 목표 달성을 위해 인위적으로 짠 구조는 모두 공식조직의 특징이다.","past":true,"paper":"2026-m","src":"2026 기출 14번"},
{"id":"p26m15","no":15,"subj":"간호관리","unit":"리더십","q":"카츠(Katz)가 제시한 관리자의 관리기술 중 인간적 기술에 대한 설명으로 옳은 것은?","opts":["특정 분야 업무 수행에 필요한 지식, 방법, 기구 등을 사용할 수 있는 능력","조직구성원과 원만하게 의사소통하고 효과적으로 상호작용하는 능력","조직을 전체적인 관점에서 바라볼 수 있고 각 부분의 연관성을 이해하는 능력","분석적 사고와 상황판단을 통해 조직의 이해관계와 활동을 조정하고 통합할 수 있는 능력"],"ans":1,"exp":"인간적 기술은 다른 사람과 소통하고 협력하며 함께 일하는 능력으로 모든 관리계층에 고르게 필요하다. 지식·방법·기구를 다루는 능력은 실무적(전문적) 기술이고, 조직을 전체로 보고 각 부분의 관계를 이해해 조정·통합하는 능력은 개념적 기술이다.","past":true,"paper":"2026-m","src":"2026 기출 15번"},
{"id":"p26m16","no":16,"subj":"간호관리","unit":"인적자원관리","q":"다음 설명에 해당하는 직무분석방법은?\n\n직무분석 담당자가 전체 작업 과정 동안 무작위적 간격으로 관찰하여 직무에 관한 정보를 얻는 방법이다.","opts":["면접법","설문지법","중요사건방법","작업표본방법"],"ans":3,"exp":"작업 전체를 계속 지켜보지 않고 무작위로 고른 시점에 여러 번 관찰해 직무 정보를 얻는 것은 작업표본방법(워크샘플링)이다. 면접법은 직무 수행자와 만나 묻는 방법, 설문지법은 질문지를 돌려 답을 받는 방법, 중요사건방법은 성과를 가른 결정적 행동 사례를 모으는 방법이다.","past":true,"paper":"2026-m","src":"2026 기출 16번"},
{"id":"p26m17","no":17,"subj":"간호관리","unit":"의료법규","q":"「간호법」상 간호사의 임무에 해당하는 업무가 아닌 것은?","opts":["조산과 임산부 및 신생아에 대한 보건과 양호지도","간호 요구자에 대한 교육ㆍ상담 및 건강증진을 위한 활동의 기획과 수행","환자의 간호요구에 대한 관찰, 자료수집, 간호판단 및 요양을 위한 간호","「의료법」에 따른 의사, 치과의사, 한의사의 지도하에 시행하는 진료의 보조"],"ans":0,"exp":"조산과 임산부 및 신생아에 대한 보건과 양호지도는 조산사의 임무다. 간호법이 정한 간호사의 업무는 환자의 간호요구에 대한 관찰·자료수집·간호판단 및 요양을 위한 간호, 의사 등의 지도하에 시행하는 진료의 보조, 간호 요구자에 대한 교육ㆍ상담 및 건강증진 활동의 기획과 수행, 간호조무사 업무보조에 대한 지도다.","past":true,"paper":"2026-m","src":"2026 기출 17번"},
{"id":"p26m18","no":18,"subj":"간호관리","unit":"리더십","q":"변혁적 리더십의 구성요소만을 모두 고르면?\n\nㄱ. 지적 자극\nㄴ. 카리스마\nㄷ. 개별적 배려\nㄹ. 상황에 따른 보상","opts":["ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ"],"ans":2,"exp":"변혁적 리더십의 구성요소는 카리스마(이상적 영향력), 영감적 동기부여, 지적 자극, 개별적 배려다. 상황에 따른 보상은 성과와 보상을 맞바꾸는 거래적 리더십의 요소(예외에 의한 관리와 함께)이므로 ㄹ은 빠진다.","past":true,"paper":"2026-m","src":"2026 기출 18번"},
{"id":"p26m19","no":19,"subj":"간호관리","unit":"감염관리","q":"활동성 결핵으로 입원한 환자에 대해 간호사의 감염관리 활동으로 옳은 것은?","opts":["음압 격리실에 다른 세균성 이질 환자와 함께 격리하였다.","환자와의 거리가 1 m 이내라서 간호사는 수술용 마스크를 착용하였다.","격리실에서 간호사가 사용한 마스크를 병실 앞 복도에 비치된 일반폐기물 용기에 버렸다.","사용할 수 있는 음압 격리실이 없어서 다른 공간과 공기의 흐름이 연결되지 않는 1인실에 배치하였다."],"ans":3,"exp":"활동성 결핵은 공기주의 대상이라 음압 격리실에 두는 것이 원칙이고, 음압실이 없으면 공기가 다른 곳으로 흘러가지 않는 1인실에 두고 문을 닫아 둔다. 다른 질환의 환자와 같은 방을 쓰게 하지 않으며, 간호사는 거리와 상관없이 병실에 들어가기 전에 N95 마스크를 쓴다. 쓴 마스크는 일반폐기물이 아니라 의료폐기물 용기에 버린다.","past":true,"paper":"2026-m","src":"2026 기출 19번"},
{"id":"p26m20","no":20,"subj":"간호관리","unit":"관리이론","q":"간호관리과정에 대한 설명으로 옳지 않은 것은?","opts":["기획 － 조직의 목적, 철학을 정하고 예산을 계획한다.","조직 － 직무내용을 편성하고 권한과 책임을 명확히 한다.","인사 － 성과를 측정하며 표준과 성과 간의 차이를 파악한다.","지휘 － 갈등을 관리하고 협력을 강화한다."],"ans":2,"exp":"성과를 측정해 표준과 비교하고 차이를 찾아 고치는 것은 통제 기능이다. 인사는 필요한 인력을 산정하고 모집·선발·배치·개발·보상하는 기능이다. 나머지 기획, 조직, 지휘의 설명은 옳다.","past":true,"paper":"2026-m","src":"2026 기출 20번"},
{"id":"p26k01","no":1,"subj":"국어","unit":"문장 고쳐 쓰기","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 명사의 반복된 나열을 피하고 적절한 조사나 어미를 사용할 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n○ 올바른 피동 표현을 사용할 것.\n○ 의미가 유사하거나 동일한 표현을 중복해서 사용하지 말 것.\n\n\u003c공문서>\n○○시청\n수신 수신처 참조\n제목 2026년 ○○시립도서관 신규 사서 교육 안내\n1. ○○시립도서관 신규 사서 여러분의 원활한 적응을 기원합니다.\n2. 부서별 ㉠ __신규 사서 업무 적응 교육__을 실시합니다. 이번 교육 내용에는 ㉡ __도서관 이용자의 편의를 확대하고 불편의 축소__ 방안이 포함됩니다.\n3. ㉢ __교육은 분기별로 계획되어져 있으며__, 수강 신청서 제출 마감일은 이달 30일입니다. 이번 교육이 원활히 이루어지도록 신청서 ㉣ __제출 기한을 반드시 엄수하기 바랍니다__.","opts":["㉠: 신규 사서의 업무 적응을 위한 교육","㉡: 도서관 이용자의 편의 확대와 불편을 축소하는","㉢: 교육은 분기별로 계획되어 있으며","㉣: 제출 기한을 엄수하기 바랍니다"],"ans":1,"exp":"㉡은 '대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것'에 따라 고쳐야 하는데, ②의 '편의 확대와 불편을 축소하는'은 명사구와 절이 이어져 여전히 구조가 다르다. '편의를 확대하고 불편을 축소하는'처럼 맞춰야 한다. ①은 명사의 나열을 조사와 어미로 풀었고, ③은 이중 피동 '계획되어져'를 바로잡았으며, ④는 '기한을 지킨다'는 뜻이 겹치는 '반드시'와 '엄수'의 중복을 없앴으므로 적절하다.","past":true,"paper":"2026-k","src":"2026 기출 1번"},
{"id":"p26k02","no":2,"subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 정독을 위해서는 조용한 공간에서 홀로 부동자세를 취해야 한다. 근대 사람들은 가정과 학교, 도서관과 같은 근대적 공간에서 책 읽는 자세를 집단적으로 훈련하며 정독에 익숙해져 갔다.\n(나) 책에 사진이나 그림을 삽입할 수 있는 기술이 발전했고, 구두점ㆍ띄어쓰기의 도입과 더불어 문자를 보충하는 여러 부호가 삽입되는 등 새로운 편집 형식이 등장한 것이다.\n(다) 근대 시기 책 읽기는 책의 내용을 입으로 외워서 연기하듯이 말하거나 반복적으로 암송하는 방식에서, 눈으로 꼼꼼하게 단어들을 읽으며 문장의 의미를 파헤쳐 가는 방식, 즉 정독으로 이행해 갔다. 이런 책 읽기 방식에는 책을 읽기 위한 공간과 거기에 맞는 자세가 필요했다.\n(라) 훈련을 통해 정독에 익숙해진 사람들의 글 읽는 속도가 빨라짐에 따라 짧은 시간에 많은 책을 읽어 내는 독서 방식이 나타났다. 이러한 독서 방식에 적합하도록 텍스트 편집 기술이 발전하고 편집 형식이 변화했다.","opts":["(다) － (가) － (라) － (나)","(다) － (라) － (가) － (나)","(라) － (나) － (가) － (다)","(라) － (다) － (가) － (나)"],"ans":0,"exp":"(다)가 근대의 책 읽기가 정독으로 이행했고 그에 맞는 공간과 자세가 필요했다고 화제를 열고, (가)가 그 공간과 자세를 훈련한 과정을 잇는다. (라)는 '훈련을 통해 정독에 익숙해진 사람들'로 (가)를 받아 편집 형식이 변화했다고 하고, (나)가 '~한 것이다'로 그 변화를 구체적으로 풀이한다. 따라서 (다)－(가)－(라)－(나)이다.","past":true,"paper":"2026-k","src":"2026 기출 2번"},
{"id":"p26k03","no":3,"subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가) ～ (다)에 들어갈 말을 적절하게 나열한 것은?\n\n기호는 어떤 대상과 일정한 의미가 결합한 것이다. 기호는 대상과 의미, 즉 기표와 기의의 관련성에 따라 도상적 기호, 지표적 기호, 상징적 기호로 나뉜다. 도상적 기호는 기표와 기의 사이에 시각적 유사성이 있는 기호이고, 지표적 기호는 기표와 기의 사이에 실제적인 연관성과 인과적인 관계가 있는 기호이다. 반면 상징적 기호는 기표와 기의의 관계가 관습적일 뿐, 시각적 유사성이나 실제적인 연관성이 없는 기호이다.\n예를 들어 신호등 체계는 대표적인 (가) ______의 사례이다. 신호등에서 빨강은 ‘멈춰라’, 초록은 ‘가라’를 의미하는데, 색채라는 시각적 기표가 그것의 기의와 실제적인 연관성이나 유사성이 없고 다른 색깔로 대체하는 것도 가능하기 때문이다. 한편 이모티콘 ‘^^’는 웃는 얼굴과 닮았기 때문에 ‘웃음’을 나타내고, 우리나라 지도는 우리나라 영토의 모습을 그려 냈기 때문에 (나) ______의 사례이다. 곰이 지나간 흔적인 곰 발자국을 보고 사냥꾼이 곰을 쫓게 되었다면, 그 발자국은 ‘곰이 지나갔다’는 사실과 인과적 관계를 맺기 때문에 (다) ______의 예이다.","opts":["(가) 도상적 기호, (나) 상징적 기호, (다) 지표적 기호","(가) 도상적 기호, (나) 지표적 기호, (다) 상징적 기호","(가) 상징적 기호, (나) 도상적 기호, (다) 지표적 기호","(가) 상징적 기호, (나) 지표적 기호, (다) 도상적 기호"],"ans":2,"exp":"신호등의 색은 뜻과 유사성도 실제적 연관성도 없고 다른 색으로 바꿀 수도 있으므로 관습에 따른 상징적 기호(가)이다. 이모티콘과 지도는 대상과 닮았으므로 시각적 유사성에 바탕을 둔 도상적 기호(나)이다. 곰 발자국은 '곰이 지나갔다'는 사실과 인과적 관계를 맺으므로 지표적 기호(다)이다.","past":true,"paper":"2026-k","src":"2026 기출 3번"},
{"id":"p26k04","no":4,"subj":"국어","unit":"작문","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 핵심 개념과 연구 목표를 제시할 것.\n○ 본론은 2개의 장으로 구성하고 하위 절은 각 장의 제목에 맞추어 통일성 있게 구성할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 귀농 청년의 지역 정착을 위한 통합 지원 전략\n1장 서론\n1절 귀농 청년의 개념\n2절 (가) ______\n2장 귀농 청년의 창업 지원 방안\n1절 스마트팜 창업 및 임대 농장 보조금 지원\n2절 (나) ______\n3장 귀농 청년의 주거 지원 방안\n1절 초기 정착을 위한 입주비 지원\n2절 (다) ______\n4장 결론\n1절 귀농 청년의 원활한 지역 사회 정착\n2절 (라) ______","opts":["(가): 귀농 청년의 창업ㆍ주거 지원을 위한 효율적 방안 모색","(나): 농산업 창업자와 연계한 멘토링 프로그램 지원","(다): 미사용 주택지 정리를 통한 농지 확대","(라): 귀농 청년 지원을 위한 제도 정비 및 확대"],"ans":2,"exp":"\u003c지침>에 따르면 본론의 하위 절은 각 장의 제목에 맞아야 한다. 3장은 '귀농 청년의 주거 지원 방안'인데 ③의 '미사용 주택지 정리를 통한 농지 확대'는 주거 지원이 아니라 농지에 관한 내용이어서 통일성을 해친다. ①은 서론의 연구 목표, ②는 2장의 창업 지원, ④는 결론의 향후 과제에 해당하므로 적절하다.","past":true,"paper":"2026-k","src":"2026 기출 4번"},
{"id":"p26k05","no":5,"subj":"국어","unit":"문장 고쳐 쓰기","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n일반적으로 물질은 ㉠ __분자 운동이 활발할수록 부피가 크다__. 기체는 분자 운동이 가장 활발하고 액체, 고체 순으로 그 뒤를 잇는다. 그러므로 같은 물질의 질량이 동일하다면, 기체의 부피가 가장 크고, 그다음이 액체이고, 고체는 그 부피가 가장 작다. 그러나 물은 예외이다. 액체인 물이 기체인 수증기가 되면 부피가 커지고 ㉡ __고체인 얼음이 되면 오히려 부피가 작아진다__.\n빙산이 녹으면 해수면의 높이는 어떻게 될까? 빙산은 바다에 떠 있는데 이때 빙산의 일부가 수면 위로 나와 있다. 빙산이 녹아서 생긴 물의 부피는 고체였을 때 빙산의 부피보다 약간 작다. 수면 위로 나와 있던 빙산이 녹아서 생긴 물이, 낮아진 해수면만큼을 채우기 때문에, 결국 ㉢ __해수면의 높이에는 거의 변화가 없다__.\n그렇다면 오늘날 해수면 상승을 걱정하는 이유는 무엇인가? 지구에 있는 대부분의 빙하는 육지에 있는데, 빙산이 녹을 정도의 상황이라면 육지의 빙하도 녹게 된다. 육지의 빙하가 녹아 바다로 흘러 들어가면 바닷물의 양이 증가하여 해수면 상승으로 이어진다. ㉣ __빙하가 녹을 정도의 기온이라면__ 바닷물 자체도 열팽창을 해서 해수면이 높아진다.","opts":["㉠: 분자 운동이 활발할수록 부피가 작다","㉡: 고체인 얼음이 되어도 부피가 커진다","㉢: 해수면의 높이가 급격하게 높아진다","㉣: 빙하가 녹지 않을 정도의 기온이라면"],"ans":1,"exp":"앞에서 '물은 예외'라고 했고, 둘째 문단에서 빙산이 녹아 생긴 물의 부피가 고체였을 때보다 작다고 했으므로 물은 얼음이 되면 부피가 커진다. 따라서 ㉡은 '고체인 얼음이 되어도 부피가 커진다'로 고쳐야 한다. ㉠은 이어지는 기체·액체·고체의 부피 순서와 맞고, ㉢은 녹은 물이 낮아진 해수면만큼을 채운다는 설명과 맞으며, ㉣은 빙하가 녹는 상황을 말하는 문맥과 맞아 고칠 필요가 없다.","past":true,"paper":"2026-k","src":"2026 기출 5번"},
{"id":"p26k06","no":6,"subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n우리나라의 성(姓)과 이름은 자립적으로 쓰일 수 있고 고유한 의미가 있다는 점에서 독립적인 단어라고 할 수 있다. 따라서 성과 이름은 띄어 써야 할 것으로 볼 수도 있다. 그러나 성과 이름을 묶어서 부르는 성명은 하나의 고유 명사라서, 성과 이름을 분리하여 생각하기 어려운 면이 있다. 또한 우리나라 사람의 성은 거의 한 음절로 되어 있어서 직관적으로 한 단어처럼 느껴지지 않는다. 이러한 이유로 한글 맞춤법에서는 성과 이름을 붙여 쓰도록 규정하고 있다. 이름과 마찬가지 성격을 지닌 호(號)나 자(字)도 성에 붙여 쓴다.\n그러나 성과 이름을 혼동할 우려가 있을 때는 띄어 쓸 수 있다. 예컨대, ‘선우주’, ‘남궁수’ 같은 성명은 ‘선-우주’, ‘남-궁수’인지 ‘선우-주’, ‘남궁-수’인지 혼동할 염려가 있으므로, 성과 이름을 분명하게 밝힐 필요가 있을 때에는 ‘선우 주’나 ‘남궁 수’와 같이 띄어 쓸 수 있도록 한 것이다. 규정에서는 ‘선우’, ‘독고’, ‘황보’와 같이 두 글자 성만을 예로 들고 있으나, 성과 이름의 경계가 혼동될 여지가 있으면 한 글자 성도 띄어 쓸 수 있다. 한편, 성명 또는 성이나 이름 뒤에 붙는 호칭어나 관직명 등은 별개의 단위이므로 띄어 쓴다. 호나 자 등이 성명 앞에 놓이는 경우도 띄어 써야 한다.","opts":["‘황보영’의 성이 ‘황’일 때 ‘황 보영’으로 쓸 수 없다.","‘최서현’의 성 ‘최’ 뒤에 호칭어 ‘군’을 쓸 때 ‘최 군’으로 쓴다.","‘김구’의 호인 ‘백범’을 성명 앞에 쓸 때 ‘백범 김구’로 써야 한다.","‘허초희’의 호인 ‘난설헌’을 성 ‘허’ 뒤에 쓸 때 ‘허난설헌’으로 쓴다."],"ans":0,"exp":"성과 이름의 경계가 혼동될 여지가 있으면 한 글자 성도 띄어 쓸 수 있다고 했다. '황보영'은 성이 '황보'인지 '황'인지 혼동될 수 있으므로 성이 '황'일 때 '황 보영'으로 쓸 수 있어 ①은 적절하지 않다. 호칭어는 띄어 쓰고(②), 성명 앞에 놓이는 호는 띄어 쓰며(③), 호는 성에 붙여 쓰므로(④) 나머지는 글과 맞는다.","past":true,"paper":"2026-k","src":"2026 기출 6번"},
{"id":"p26k07","no":7,"subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n우리의 고전 서사문학에는, 지하세계에 살고 있는 괴물을 물리치는 이야기가 많다. 『홍길동전』, 『김원전』과 같은 소설뿐 아니라, 흔히 ‘지하국 대적 퇴치 설화’로 불리는 많은 설화들이 있다. 여기에서 지하국은 단순한 공간적 배경이 아니라, 인간이 살아가며 만나게 되는 위협과 혼란의 세계를 상징한다.\n전통적인 세계관에서 지상은 인간이 질서를 이루며 살아가는 현실의 공간이고, 천상은 이상적이고 완성된 세계로 인식된다. 이에 비해 지하세계는 어둡고 음험한 존재들이 머무는 장소로 설정된다. ‘지하국’에 ‘대적’이라는 개념이 합해지면, 그 괴물은 단순한 외부의 적이 아니라 인간이 살면서 마주하는 악, 부정, 부조리 등을 상징한다고 볼 수 있다. 지하국에서의 전투는 한 개인의 문제가 아니라, 인간 모두가 겪어야 할 보편적 과제를 나타낸 것이다.\n이 서사에서 중요한 점은, 괴물을 물리치는 행위가 타인을 위한 정의 실현에 앞서 주인공 자신의 성장과 변화를 이룬다는 데 있다. 그렇다면 주인공의 승리의 원인, 성장의 원동력은 무엇인가? 이야기 속 해답은 의외로 소박하다. 주인공은 특별한 물건이나 외부의 도움이 아니라, 자신이 이미 지니고 있던 것으로 괴물을 제압한다. 예컨대 항상 몸에 지녔던 칼집의 가죽이나, 하찮은 풀로 만든 약이 결정적인 역할을 한다. 이는 문제 해결의 열쇠가 외부에 있지 않으며, 자신이 가진 것을 정확히 인식하고 활용할 때 비로소 위기를 극복할 수 있음을 말한다. 또한 괴물을 피하거나 외면하지 않고 정면으로 마주할 때, 그 실체가 드러나고 문제 해결의 실마리가 드러난다는 점을 강조한다.\n결국 지하국의 대적을 퇴치하는 서사는 영웅이 막강한 괴물을 처치하는 특별한 서사가 아니라, 인간이 삶의 문제를 어떻게 직면하고 극복해 나갈 것인가에 대한 보편적 서사라 할 수 있다. 이 서사를 통해, 우리는 지하국이 두려운 공간이지만, 동시에 성장이 가능한 시험의 장소이며, 그 시험의 해답은 언제나 인간 자신에게 있다는 것을 ㉠ __알__ 수 있다.","opts":["지하국 대적 퇴치 서사의 주된 관심사는 사회의 정의 구현이 아니라 인간 자신의 성장에 있다.","고전 서사에서 주인공은 천상적 존재의 도움이 아니라 현실적 인물의 도움으로 싸움에서 승리한다.","지하국 대적 퇴치 서사에서 주인공은 괴물을 직접 마주하지 않고 우회적인 방법으로 문제를 해결한다.","전통적인 세계관은 인간이 사는 현실 세계와 비인간적 존재가 사는 천상 세계의 이원적 구조로 구성된다."],"ans":0,"exp":"셋째 문단에서 괴물을 물리치는 행위가 타인을 위한 정의 실현에 앞서 주인공 자신의 성장과 변화를 이룬다는 데 중요한 점이 있다고 했으므로 ①이 적절하다. 주인공은 외부의 도움이 아니라 자신이 이미 지닌 것으로 괴물을 제압하고(②), 괴물을 정면으로 마주하며(③), 전통적 세계관은 지상·천상·지하세계로 이루어진다(④).","past":true,"paper":"2026-k","src":"2026 기출 7번"},
{"id":"p26k08","no":8,"subj":"국어","unit":"어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n우리의 고전 서사문학에는, 지하세계에 살고 있는 괴물을 물리치는 이야기가 많다. 『홍길동전』, 『김원전』과 같은 소설뿐 아니라, 흔히 ‘지하국 대적 퇴치 설화’로 불리는 많은 설화들이 있다. 여기에서 지하국은 단순한 공간적 배경이 아니라, 인간이 살아가며 만나게 되는 위협과 혼란의 세계를 상징한다.\n전통적인 세계관에서 지상은 인간이 질서를 이루며 살아가는 현실의 공간이고, 천상은 이상적이고 완성된 세계로 인식된다. 이에 비해 지하세계는 어둡고 음험한 존재들이 머무는 장소로 설정된다. ‘지하국’에 ‘대적’이라는 개념이 합해지면, 그 괴물은 단순한 외부의 적이 아니라 인간이 살면서 마주하는 악, 부정, 부조리 등을 상징한다고 볼 수 있다. 지하국에서의 전투는 한 개인의 문제가 아니라, 인간 모두가 겪어야 할 보편적 과제를 나타낸 것이다.\n이 서사에서 중요한 점은, 괴물을 물리치는 행위가 타인을 위한 정의 실현에 앞서 주인공 자신의 성장과 변화를 이룬다는 데 있다. 그렇다면 주인공의 승리의 원인, 성장의 원동력은 무엇인가? 이야기 속 해답은 의외로 소박하다. 주인공은 특별한 물건이나 외부의 도움이 아니라, 자신이 이미 지니고 있던 것으로 괴물을 제압한다. 예컨대 항상 몸에 지녔던 칼집의 가죽이나, 하찮은 풀로 만든 약이 결정적인 역할을 한다. 이는 문제 해결의 열쇠가 외부에 있지 않으며, 자신이 가진 것을 정확히 인식하고 활용할 때 비로소 위기를 극복할 수 있음을 말한다. 또한 괴물을 피하거나 외면하지 않고 정면으로 마주할 때, 그 실체가 드러나고 문제 해결의 실마리가 드러난다는 점을 강조한다.\n결국 지하국의 대적을 퇴치하는 서사는 영웅이 막강한 괴물을 처치하는 특별한 서사가 아니라, 인간이 삶의 문제를 어떻게 직면하고 극복해 나갈 것인가에 대한 보편적 서사라 할 수 있다. 이 서사를 통해, 우리는 지하국이 두려운 공간이지만, 동시에 성장이 가능한 시험의 장소이며, 그 시험의 해답은 언제나 인간 자신에게 있다는 것을 ㉠ __알__ 수 있다.","opts":["자신의 방은 자기가 __알아서__ 청소해야 한다.","나는 감기에 걸려서 음식 맛을 __알__ 수가 없었다.","어떤 부모는 자식을 전부로 __알아__ 모든 것을 다 해 준다.","앞으로 무엇을 해야 하는가를 __알기__ 위해서는 책을 읽어야 한다."],"ans":3,"exp":"㉠의 '알다'는 '어떤 사실이나 내용을 배우거나 깨달아 정보나 지식을 갖추다'라는 뜻이고, ④의 '무엇을 해야 하는가를 알기'가 같은 뜻이다. ①은 '어떤 일을 스스로 판단하여 처리하다', ②는 '감각으로 느끼거나 깨닫다', ③은 '어떤 것을 소중히 여기거나 그러하다고 여기다'의 뜻이다.","past":true,"paper":"2026-k","src":"2026 기출 8번"},
{"id":"p26k09","no":9,"subj":"국어","unit":"주제 찾기","q":"윗글의 중심 내용으로 가장 적절한 것은?\n\n감정을 느낀다는 것은 외부 사건에 대한 인간의 생리적인 반응이라고 여겨져 왔는데, 이에 대한 새로운 관점이 ㉠ __등장했다__. 생리적 반응에 대한 우리의 주관적 해석이 감정을 느끼는 데에 결정적인 영향을 미친다고 보는 것이다. 이에 따르면 동일한 현상을 어떻게 인식하고 명명하는지에 따라 각기 다른 감정을 경험하게 된다.\n예컨대 빠른 속도로 움직이는 놀이기구를 타는 상황에서 대부분의 사람은 심장이 두근거리고 숨이 가빠지는 신체적 변화를 지각한다. 그러나 같은 생리적인 반응에 대해 사람마다 다르게 해석을 할 수 있다. 어떤 사람은 놀이기구의 움직임이 자신의 안전을 위협한다고 생각하는 반면, 다른 사람은 자신을 신나고 재미있게 해 준다고 생각할 수 있다. 이렇게 다르게 해석한 후, 전자는 이를 ‘두려움’이라는 감정으로, 후자는 이를 ‘즐거움’이라는 감정으로 ㉡ __명명한다__. 같은 현상을 경험하더라도 위험으로 해석하면 ‘두려움’이라는 감정을, 재미로 해석하면 ‘즐거움’이라는 감정을 느끼는 것이다.\n이 관점에 따르면 감정은 외부 사건 때문에 수동적으로 얻어지는 것이 아니라 외부 사건에 대한 해석과 명명을 통해 능동적으로 구성되는 것이다. 즉 같은 상황에서도 그 순간 우리가 ㉢ __부여하는__ 의미에 따라 경험하는 감정은 달라진다. 이러한 관점에서 감정은 고정된 반응이 아니라 ㉣ __가변적__ 경험이다.","opts":["신체 반응을 조정하는 것이 감정 관리의 핵심이다.","감정은 사건에 대한 해석과 명명에 의해 좌우되는 능동적인 경험이다.","감정을 어떻게 명명하느냐에 따라 생리적인 반응에 대한 해석이 달라진다.","감정은 타고난 기질에 의해 결정되므로 개인의 노력으로 감정 반응을 바꿀 수 없다."],"ans":1,"exp":"글은 감정이 외부 사건에 대한 수동적인 생리 반응이 아니라, 생리적 반응을 어떻게 해석하고 명명하느냐에 따라 능동적으로 구성되는 경험이라는 관점을 소개한다. 이를 담은 것은 ②이다. ①과 ④는 글에 없는 내용이고, ③은 해석한 뒤에 명명한다는 글의 순서를 거꾸로 말했다.","past":true,"paper":"2026-k","src":"2026 기출 9번"},
{"id":"p26k10","no":10,"subj":"국어","unit":"어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n감정을 느낀다는 것은 외부 사건에 대한 인간의 생리적인 반응이라고 여겨져 왔는데, 이에 대한 새로운 관점이 ㉠ __등장했다__. 생리적 반응에 대한 우리의 주관적 해석이 감정을 느끼는 데에 결정적인 영향을 미친다고 보는 것이다. 이에 따르면 동일한 현상을 어떻게 인식하고 명명하는지에 따라 각기 다른 감정을 경험하게 된다.\n예컨대 빠른 속도로 움직이는 놀이기구를 타는 상황에서 대부분의 사람은 심장이 두근거리고 숨이 가빠지는 신체적 변화를 지각한다. 그러나 같은 생리적인 반응에 대해 사람마다 다르게 해석을 할 수 있다. 어떤 사람은 놀이기구의 움직임이 자신의 안전을 위협한다고 생각하는 반면, 다른 사람은 자신을 신나고 재미있게 해 준다고 생각할 수 있다. 이렇게 다르게 해석한 후, 전자는 이를 ‘두려움’이라는 감정으로, 후자는 이를 ‘즐거움’이라는 감정으로 ㉡ __명명한다__. 같은 현상을 경험하더라도 위험으로 해석하면 ‘두려움’이라는 감정을, 재미로 해석하면 ‘즐거움’이라는 감정을 느끼는 것이다.\n이 관점에 따르면 감정은 외부 사건 때문에 수동적으로 얻어지는 것이 아니라 외부 사건에 대한 해석과 명명을 통해 능동적으로 구성되는 것이다. 즉 같은 상황에서도 그 순간 우리가 ㉢ __부여하는__ 의미에 따라 경험하는 감정은 달라진다. 이러한 관점에서 감정은 고정된 반응이 아니라 ㉣ __가변적__ 경험이다.","opts":["㉠: 나타났다","㉡: 이름 짓는다","㉢: 깨닫는","㉣: 바뀔 수 있는"],"ans":2,"exp":"'부여하다'는 가치나 의미 따위를 붙여 준다는 뜻이므로 '(의미를) 주는, 붙이는' 정도로 바꿀 수 있고, 이미 있는 것을 알아차린다는 뜻의 '깨닫는'과는 바꿔 쓸 수 없다. '등장했다'는 '나타났다', '명명한다'는 '이름 짓는다', '가변적'은 '바뀔 수 있는'과 뜻이 통한다.","past":true,"paper":"2026-k","src":"2026 기출 10번"},
{"id":"p26k11","no":11,"subj":"국어","unit":"논리","q":"(가) ～ (다)를 전제로 할 때 빈칸에 들어갈 결론으로 가장 적절한 것은?\n\n(가) 마음이 있는 것은 모두 인간과 감정적 소통을 하지만, 마음이 없는 것은 그 어떤 것도 인간과 감정적 소통을 하지 않는다.\n(나) 인간과 감정적 소통을 하는 것은 모두 도덕적 지위를 갖지만, 그렇지 않은 것은 그 어떤 것도 도덕적 지위를 갖지 않는다.\n(다) 모든 식물에게는 마음이 있지만, 모든 로봇에게는 마음이 없다.\n따라서 ______.","opts":["식물은 모두 도덕적 지위를 갖지만, 로봇은 모두 도덕적 지위를 갖지 않는다","로봇은 모두 도덕적 지위를 갖지만, 식물은 모두 도덕적 지위를 갖지 않는다","로봇과 식물 모두 도덕적 지위를 갖지 않는다","로봇과 식물 모두 도덕적 지위를 갖는다"],"ans":0,"exp":"(가)와 (나)는 각각 '마음이 있다 ↔ 인간과 감정적 소통을 한다', '감정적 소통을 한다 ↔ 도덕적 지위를 갖는다'는 필요충분 관계를 말한다. (다)에서 식물은 모두 마음이 있으므로 감정적 소통을 하고 도덕적 지위를 가지며, 로봇은 모두 마음이 없으므로 감정적 소통을 하지 않고 도덕적 지위도 갖지 않는다. 따라서 ①이 결론이다.","past":true,"paper":"2026-k","src":"2026 기출 11번"},
{"id":"p26k12","no":12,"subj":"국어","unit":"내용 일치","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n전설은 증거물에 대한 이야기이며, ㉠ __어떤 사건을 증거물에 담아 전하는 이야기__이다. 뒷산의 바위, 마을의 연못, 산사의 종 같은 증거물은 우리의 실제 삶에서 직접 확인할 수 있는 것이다. 전설은 허구적이지만 증거물이 있기 때문에 역사와 밀접한 관계를 맺는다. 서구에서는 전설의 어원을 ‘legere(읽다)’에서 찾기도 한다. 종교 의식 중에 낭독되는 ㉡ __성인이나 순교자의 신성한 기적 이야기__가 점차 사실이라고 믿어지게 되면서 특정한 때와 장소, 주인공을 구체적으로 설명하는 이야기로 변하였다. 신성한 이야기에서 역사적 이야기로의 질적 전환을 도모하는 과정에서 산출된 이야기 양식이 전설이라는 것이다.\n그렇다면 전설과 역사의 관계는 어떻게 이해해야 할까? 역사는 과거에 있었던 일을 사실적으로 구성하는 반면 전설은 허구적으로 구성한다는 점에서 뚜렷이 구별된다. 그렇지만 둘 다 이야기를 만들어 현실에 대한 언어적 이미지를 제공하는 방식으로 과거의 공백을 채운다는 점은 공통적이다. 그 공백을 사실적으로 채우는 이야기이냐, ㉢ __허구적으로 채우는 이야기__이냐의 차이가 있을 뿐이다. 실제로 공식적 역사 기술의 원칙과 전형이 만들어지기 전까지 전설은 큰 범주에서 역사로서 기능하기도 했다.\n그러나 전설은 공식적인 역사와 거리를 가진다. 전설 향유층은 공식적인 역사와 뚜렷이 구별되는 이야기를 만들고 전하였다. 과거의 공백에 특정한 시각과 욕망을 투영하여, 공식적인 역사 기록에서 누락되거나 감추어져 있던 일을 ㉣ __자신들의 목소리가 담긴 이야기__로 만들었던 것이다. 즉 그들은 공식적 역사의 이면에서 작동하는 자신들만의 역사를 구축하며 오늘날까지 전설의 전승력을 유지해 왔던 것이다.","opts":["전설은 역사 기술의 원칙이 확립된 이후 공식적인 역사의 기능을 수행하였다.","역사적 이야기는 신성한 이야기에서 전설로 질적 전환이 일어나는 과정에서 산출된다.","과거에 있었던 일을 어떻게 구성하느냐에 따라 전설이 되기도 하고 역사가 되기도 한다.","증거물이 사라진 후 전설 향유층은 공식적 역사와 다른 방식으로 자신의 목소리를 드러냈다."],"ans":2,"exp":"둘째 문단에서 역사는 과거의 일을 사실적으로, 전설은 허구적으로 구성한다는 점에서 구별된다고 했으므로, 과거의 일을 어떻게 구성하느냐에 따라 전설이 되기도 하고 역사가 되기도 한다는 ③이 적절하다. 전설이 역사로 기능한 것은 역사 기술의 원칙이 만들어지기 전이고(①), 신성한 이야기에서 역사적 이야기로 전환하는 과정에서 나온 것이 전설이며(②), 증거물이 사라졌다는 내용은 없다(④).","past":true,"paper":"2026-k","src":"2026 기출 12번"},

{"id":"p26k14","no":14,"subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n시 「광야」는 “까마득한 날에 / 하늘이 처음 열리고 / 어데 닭 우는 소리 들렸으랴”로 시작된다. 이 시의 해석과 관련해서 1연 3행의 시구, “어데 닭 우는 소리 들렸으랴”를 둘러싼 논쟁이 있다. “들렸으랴”를 어떻게 해석할 것인가가 쟁점이다. 대체로 이를 수사적 의문 ‘들렸겠는가?’로 파악하여 닭 우는 소리가 들리지 않았다고 해석해 왔다. 그런데 “들렸으랴”가 ‘들렸으리라’의 축약형이며, 이 시구를 ‘들렸을 것이다’라고 해석해야 한다는 주장이 제기되었다.\n닭이 울었을 것이라고 해석하는 입장과 닭 울음소리가 들리지 않았다고 해석하는 입장이 갈렸다. 입장에 따라 “어데”의 의미 해석도 달라지게 된다. 전자의 입장에서는 ‘어디선가’라는 뜻이지만, 후자의 입장에서는 ‘어디 그뿐인 줄 알아?’에서 쓰인 ‘어디’와 같이 되물어 강조할 때 쓰는 감탄사로 해석된다. “닭”에 대해서도 두 입장은 해석을 달리한다. 닭 울음소리를 부정하는 논자들에게 닭은 소리를 내어 우는 동물을 의미할 뿐이다. 이들에게 시의 첫 연은 아무 소리 없는 정적 그대로의 광야를 나타낸다. 하늘이 처음 열린 날 어찌 닭 울음소리 같은 것이 들렸겠느냐고 말하는 것이다. 반면 닭 울음소리를 긍정하는 쪽에서는 실제 동물로서의 닭에 의미를 두기보다는 새벽을 알리는 소리의 매개체로서의 닭에 의미를 둔다. 이렇게 해석하면 시의 첫 연은 천지가 개벽하는 순간 어떤 지고한 소리가 울리고 있는 광야를 그려 낸다.","opts":["“어데”를 ‘어디선가’로 해석하는 입장은 닭의 울음소리가 들렸을 것이라고 이해한다.","1연 3행을 수사적 의문으로 보는 입장은 개벽의 시간에 아무 소리가 나지 않았다고 해석한다.","“들렸으랴”를 ‘들렸으리라’의 축약으로 보는 입장은 닭의 울음소리를 개벽을 알리는 소리로 파악한다.","닭의 울음소리를 부정하는 입장은 닭을 개벽의 순간에 광야에 울리는 지고한 소리의 매개체로 파악한다."],"ans":3,"exp":"닭 울음소리를 부정하는 논자들에게 닭은 '소리를 내어 우는 동물을 의미할 뿐'이다. 닭을 새벽을 알리는 지고한 소리의 매개체로 보는 것은 울음소리를 긍정하는 쪽이므로 ④는 두 입장을 뒤바꾼 것이다. '어디선가'로 해석하는 쪽과 '들렸으리라'의 축약으로 보는 쪽은 닭이 울었다고 보는 입장이고(①, ③), 수사적 의문으로 보는 쪽은 아무 소리 없는 정적으로 해석한다(②).","past":true,"paper":"2026-k","src":"2026 기출 14번"},
{"id":"p26k15","no":15,"subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 찾아가는 민원 사업은 잘 준비되고 있나요? 방문이 확정된 사업장은 어디죠?\n을: 방문 후보인 사업장이 여럿 있습니다. 그런데 아동돌봄센터에 방문하지 않고, 주민도서관에도 방문하지 않습니다.\n병: 아동돌봄센터에 방문하지 않고 다문화센터에 방문한다면, 전통시장에 방문해야 합니다.\n정: 그리고 행사 계획상 ______.\n갑: 여러분의 의견을 취합하면, 전통시장은 반드시 방문하겠네요.","opts":["전통시장에 방문한다면 주민도서관에도 방문해야 합니다","아동돌봄센터에 방문한다면 다문화센터에도 방문해야 합니다","다문화센터와 주민도서관 중 적어도 한 곳은 방문해야 합니다","다문화센터는 방문하면서 아동돌봄센터는 방문하지 않는 일은 없어야 합니다"],"ans":2,"exp":"을에 따르면 아동돌봄센터와 주민도서관에는 방문하지 않는다. 병의 말에서 전통시장 방문을 이끌어 내려면 다문화센터에 방문한다는 것이 확정되어야 한다. ③ '다문화센터와 주민도서관 중 적어도 한 곳은 방문'이 더해지면 주민도서관에 가지 않으므로 다문화센터에 방문하게 되고, 따라서 전통시장에 반드시 방문한다. ①, ②, ④로는 다문화센터 방문을 확정할 수 없다.","past":true,"paper":"2026-k","src":"2026 기출 15번"},
{"id":"p26k16","no":16,"subj":"국어","unit":"논리","q":"다음 글을 분석한 내용으로 적절하지 않은 것은?\n\n흔히 사람들은 책을 읽고 있는 당신이 무엇인가를 보고 있으며 무엇인가를 생각하고 있다는 것은 당신의 감각이나 의식에 근거해 확실한 사실이라고 생각한다. 이와 달리 당신이 용을 보았고 용이 존재한다고 생각한 것은 당신의 감각이나 의식에 근거한 확실한 사실이라고 할 수 없다. 왜냐하면 당신이 환각을 보고 상상한 것이라고 여길 수 있기 때문이다. 즉 용의 존재 여부가 우리 감각이나 의식에 근거한 확실한 사실이 아니며, 용의 존재 여부를 입증할 논증도 없기 때문에, 용이 존재한다고 믿는 것은 비합리적이라는 것이다. 이는 무엇인가를 믿는 행위가 합리적이라는 것은 세 가지 조건 중 하나 이상을 충족해야 한다는 입장이다. 우리 감각에 근거해 확실한 사실이거나, 우리 의식에 근거한 확실한 사실이거나, 입증할 논증이 있어야 한다.\n하지만 이러한 입장에 따르자면, 내 앞에 있는 친구가 기계가 아닌 사람이라는 당연한 상식을 믿는 것조차 합리적일 수 없다. 또한 내가 눈을 감고 있을 때 그 친구가 내 앞에 있다고 믿는 것도 합리적일 수 없다. 이러한 믿음은 우리 감각이나 의식에 근거한 확실한 사실도 아니고 이를 입증할 어떠한 논증도 존재하지 않기 때문이다. 따라서 ㉠ __무엇인가를 믿는 행위의 합리성을 위 세 가지 조건 중 적어도 하나 이상을 충족해야 하는 것으로 판단하는 입장은 옳지 않다__. 만약 그 입장이 옳다면, 우리 삶에 보편적으로 통용되는 상식을 믿는 것조차 비합리적인 것이 된다. 그렇게 되면 우리는 보편적 인간의 삶을 영위할 수 없다. 그래서 그러한 상식을 믿는 것이 비합리적이라는 것은 결코 받아들일 수 없다.","opts":["㉠이 참이라면, 용이 존재한다고 믿는 것이 반드시 비합리적인 것은 아니다.","㉠이 거짓이라면, 우리 삶에 보편적으로 통용되는 상식을 믿는 것조차 비합리적인 것이 된다.","우리 삶에 보편적으로 통용되는 상식을 믿는 것이 비합리적임을 받아들일 수 있다면, ㉠은 약화된다.","도깨비의 존재 여부를 입증할 논증이 있고 도깨비가 존재한다고 믿는 것이 합리적이라면, ㉠은 강화된다."],"ans":3,"exp":"㉠은 '세 조건 중 하나 이상을 충족해야 합리적'이라는 입장이 옳지 않다는 주장이다. ④의 사례는 입증할 논증이 있고(조건 충족) 믿음이 합리적인 경우로, 그 입장에 들어맞는 사례일 뿐 입장이 틀렸음을 보여 주지 않으므로 ㉠을 강화하지 않는다. ㉠이 참이면 조건을 충족하지 못한 믿음도 합리적일 수 있고(①), ㉠이 거짓이면 그 입장이 옳으므로 상식을 믿는 것도 비합리적이 되며(②), ㉠의 근거는 '상식을 믿는 것이 비합리적임은 받아들일 수 없다'이므로 이것이 무너지면 ㉠은 약화된다(③).","past":true,"paper":"2026-k","src":"2026 기출 16번"},
{"id":"p26k17","no":17,"subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 금리가 인상되고 시중 통화량이 동결되면, 소비 심리가 위축되고 기업의 설비 투자가 감소된다.\n○ 소비 심리가 위축되면 물가 상승률이 둔화된다.\n○ 물가 상승률이 둔화되지 않는다.","opts":["기업의 설비 투자가 감소된다.","금리가 인상되고, 시중 통화량이 동결된다.","금리가 인상되지 않고, 시중 통화량이 동결되지 않는다.","금리가 인상되지 않거나, 시중 통화량이 동결되지 않는다."],"ans":3,"exp":"물가 상승률이 둔화되지 않으므로 둘째 진술의 대우에 따라 소비 심리는 위축되지 않는다. 그러면 첫째 진술의 뒷부분(소비 심리 위축 그리고 설비 투자 감소)이 거짓이므로 앞부분 '금리가 인상되고 시중 통화량이 동결된다'도 거짓이어야 한다. '그리고'의 부정은 '또는'이므로 ④ '금리가 인상되지 않거나 시중 통화량이 동결되지 않는다'가 반드시 참이다. ③은 둘 다 아니라는 더 강한 말이어서 반드시 참은 아니다.","past":true,"paper":"2026-k","src":"2026 기출 17번"},
{"id":"p26k18","no":18,"subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n훈민정음의 초성자는 모두 17자인데 초성자의 창제 원리는 상형의 원리와 가획의 원리로 설명할 수 있다. 당시 음운 이론에서는 자음이 소리 나는 위치에 따라 ‘아음, 설음, 순음, 치음, 후음’으로 나누어져 있었다. 훈민정음을 창제할 때는 이 분류 체계를 도입하여 기본자 ‘ㄱ, ㄴ, ㅁ, ㅅ, ㅇ’을 만들었다. 기본자는 발음 기관의 모양을 본뜨는, 즉 상형의 원리를 적용하여 만들었다. 아음 ‘ㄱ’은 ‘혀뿌리가 목구멍을 막는 모양’을, 설음 ‘ㄴ’은 ‘혀 끝이 윗잇몸에 닿는 모양’을, 순음 ‘ㅁ’은 ‘입 모양’을, 치음 ‘ㅅ’은 ‘이 모양’을, 후음 ‘ㅇ’은 ‘목구멍 모양’을 각각 본떴다.\n그다음 가획의 원리를 적용하였다. 가획의 원리는 각각의 기본자에 획을 더할수록, 그 소리가 더 세어진다는 원리이다. 예를 들어 ‘ㄴ → ㄷ → ㅌ’, ‘ㅁ → ㅂ → ㅍ’, ‘ㅇ → ㆆ → ㅎ’ 등이 있다. 이때 획이 더해져 만들어진 초성자는 기본자와 소리 나는 위치가 같다. 그런데 가획의 원리로 모든 초성자가 설명되는 것은 아니다. ‘ㄹ’은 ‘ㄴ’에, ‘ㅿ’은 ‘ㅅ’에 획을 더하여 만들어졌지만 소리의 세기와는 상관이 없다. 그리고 ‘ㆁ(옛이응)’은 아음이지만 기본자 ‘ㄱ’과 글자 모양의 유사성이 전혀 없다. 이들 ‘ㄹ, ㅿ, ㆁ(옛이응)’을 이체자라고 한다.","opts":["‘ㆁ(옛이응)’과 ‘ㅎ’은 소리 나는 위치가 다르다.","‘ㅿ’은 ‘이 모양’을 본떠 만든 기본자에 획을 더해 만들어졌다.","‘ㄷ’보다 ‘ㅌ’이 소리가 세고, ‘ㅍ’보다 ‘ㅂ’이 소리가 약하다.","훈민정음을 창제할 때 ‘아음, 설음, 순음, 치음, 후음’의 분류 체계를 새로 만들어 기본자를 정하였다."],"ans":3,"exp":"아음·설음·순음·치음·후음의 분류는 '당시 음운 이론'에 이미 있던 것이고 훈민정음은 이 분류 체계를 '도입'했으므로, 새로 만들었다는 ④는 적절하지 않다. ㆁ은 아음이고 ㅎ은 후음 ㅇ에 획을 더한 글자여서 소리 나는 위치가 다르고(①), ㅿ은 '이 모양'을 본뜬 ㅅ에 획을 더했으며(②), 획을 더할수록 소리가 세어지므로 ㄷ보다 ㅌ이, ㅂ보다 ㅍ이 세다(③).","past":true,"paper":"2026-k","src":"2026 기출 18번"},
{"id":"p26k19","no":19,"subj":"국어","unit":"논리","q":"다음 글의 논지를 강화하는 진술로 가장 적절한 것은?\n\n알레르기는 우리의 면역 체계가 신체 외부의 물질을 적으로 오인하여 과민 반응을 일으킬 때 발생한다. 흔히 개인이 비위생적인 환경에 적응하면서 정상적인 면역 체계가 발달한다고 생각하기 때문에 지나친 위생 습관이 알레르기 질환을 일으킨다고 여긴다. 하지만 우리 면역 체계는, 질병을 유발하는 병원체에 적응하는 과정에서 발달하는 것이 아니라 인류가 수렵ㆍ채집 시절부터 공생해 온 ‘오랜 친구들’이라 불리는 유익한 미생물의 도움으로 발달하는 것이다.\n인간의 면역 체계는 데이터가 입력되지 않은 컴퓨터 학습 시스템과 유사해서 데이터가 없으면 제대로 작동하지 않는다. 논밭과 동산이 있는 자연환경인 전원에는 수백만 년 동안 인류와 함께해 온 유익한 공생 미생물이 존재하는데 이들은 면역 체계에 일종의 학습 데이터를 제공한다. 이를 통해 면역 체계는 햇빛이나 꽃가루 같은 무해한 물질에 과민 반응하지 않도록 발달하는 것이다. 실제로 청소나 목욕 같은 위생 습관은 가정 내 미생물 구성을 근본적으로 변화시키지 않는다. 즉 알레르기 질환은 우리의 지나친 위생 습관 때문이 아니다.\n우리의 면역 체계가 제대로 학습하기 위해서는 유익한 공생 미생물 환경에 노출되어야 한다. 그런데 자연과 격리된 도시 생활은 이러한 노출을 막기 때문에 우리의 면역 체계가 제대로 작동하지 않아 알레르기 질환이 발생하는 것이다.","opts":["자연과 격리된 도시에서 개인 위생용품 소비량이 증가할수록 알레르기 질환 발병률이 낮았다.","동일한 전원에서 자란 두 집단의 아이들을 비교할 때, 거주지의 위생 상태가 나쁠수록 알레르기 질환 발병률이 낮았다.","주거지의 위생 상태가 유사한 아이들을 비교할 때, 전원에서 오래 생활한 아이일수록 알레르기 질환의 발병률이 낮았다.","어린 시절 알레르기 질환을 앓았던 아이들이 그렇지 않은 아이들보다 성인이 된 후 알레르기 질환에 걸릴 확률이 낮았다."],"ans":2,"exp":"글의 논지는 알레르기가 지나친 위생 습관 때문이 아니라 유익한 공생 미생물이 있는 자연환경(전원)에 노출되지 못해서 생긴다는 것이다. ③은 위생 상태가 비슷한데도 전원에서 오래 생활할수록 발병률이 낮았다는 것이어서, 위생이 아니라 전원 노출이 원인임을 뒷받침한다. ②는 위생 상태가 원인이라는 통념을 지지해 논지를 약화하고, ①과 ④는 전원의 미생물 노출과 관계가 없다.","past":true,"paper":"2026-k","src":"2026 기출 19번"},
{"id":"p26k20","no":20,"subj":"국어","unit":"화법","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n시라: 에스컬레이터를 이용할 때 한 줄 서기보다는 두 줄 서기가 바람직하다고 생각해. 그러면 같은 시간 내에 더 많은 사람이 이동할 수 있고, 에스컬레이터 주변의 혼잡을 줄일 수도 있어. 개인의 이동 속도보다 전체적인 효율을 우선해야 해.\n승현: 물론 두 줄 서기가 전체적으로 효율이 좋지. 그런데 두 줄로 서면 급한 사람은 빨리 이동하기 어렵잖아. 이동이 급한 사람을 위하여 자리를 비워두는 배려가 효율보다 우선하는 기준이라고 생각해.\n범주: 에스컬레이터 줄 서기를 결정하는 데 있어 두 사람이 고려하는 기준 모두 나름의 일리가 있어. 그런데 혼잡한 시간대에는 두 줄로 서는 것이 효율적이지만, 이용자가 많지 않을 때까지 그럴 필요가 있을까?\n시라: 안전도 고려할 중요한 기준이지. 한 줄 서기를 해서 에스컬레이터에서 걸어가는 사람이 많을수록 넘어지는 사고가 많이 발생해. 두 줄 서기를 하면 이런 사고를 줄일 수 있다는 점을 명심해야 해.\n승현: 그러고 보니 에스컬레이터에 한쪽으로만 설 경우 무게가 한쪽으로 쏠려 에스컬레이터 구조물에 부담을 준다는 기사를 본 적이 있어. 에스컬레이터가 갑자기 고장이 나면 큰 인명 피해가 날 수 있어. 안전이 최우선이니만큼 항상 두 줄 서기를 해야겠네.\n범주: 안전이 중요하니까 혼잡할 때는 두 줄 서기를 해야겠지. 하지만 혼잡하지 않을 때에는 이동이 급한 사람을 배려해서 한 줄 서기를 해야지.","opts":["두 줄 서기가 전체적으로 효율적이라는 점에 대해 시라와 승현은 동의한다.","혼잡 정도에 따라 줄 서기 방식이 달라져야 한다는 점에 대해 범주는 동의한다.","시라와 승현은 고려하는 기준에 따라 줄 서기 방식을 바꾸는 것에 동의한다.","안전 면에서는 두 줄 서기가 낫다는 점에 대해 시라, 승현, 범주는 모두 동의한다."],"ans":2,"exp":"시라는 효율과 안전을 들어 처음부터 끝까지 두 줄 서기를 주장하고, 승현도 마지막에 '항상 두 줄 서기를 해야겠네'라고 한다. 기준에 따라 줄 서기 방식을 바꾸자는 것은 범주의 생각이므로 ③은 적절하지 않다. 승현은 두 줄 서기가 효율이 좋다는 데 동의했고(①), 범주는 혼잡할 때와 아닐 때를 나누었으며(②), 세 사람 모두 안전을 이유로 두 줄 서기를 받아들였다(④).","past":true,"paper":"2026-k","src":"2026 기출 20번"},
{"id":"p26h01","no":1,"subj":"한국사","unit":"삼국 시대","q":"광개토 대왕의 명칭이 새겨진 유물은?","opts":["단양 신라 적성비","공주 무령왕릉 지석","창녕 신라 진흥왕 척경비","경주 호우총 출토 호우명 그릇"],"ans":3,"exp":"경주 호우총에서 나온 호우명 그릇 바닥에는 '국강상광개토지호태왕'이라는 광개토 대왕의 명칭이 새겨져 있어 당시 고구려와 신라의 관계를 보여 준다. 단양 적성비와 창녕 척경비는 신라 진흥왕 때의 비석이고, 무령왕릉 지석은 백제 무령왕(영동대장군 사마왕)의 것이다.","past":true,"paper":"2026-h","src":"2026 기출 1번"},
{"id":"p26h02","no":2,"subj":"한국사","unit":"삼국 시대","q":"(가) 왕에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 상대등을 설치하고, 이차돈의 순교를 계기로 불교를 공인하였다. 울진 봉평리 신라비에는 (가) ______와/과 율령에 관한 기록이 담겨 있다.","opts":["병부를 설치하였다.","대가야를 정복하였다.","국호를 신라로 정하였다.","독서삼품과를 실시하였다."],"ans":0,"exp":"상대등 설치, 불교 공인, 율령 반포는 신라 법흥왕의 업적이며, 법흥왕은 병부를 설치하여 군사권을 장악하였다. 대가야 정복은 진흥왕, 국호를 신라로 정한 것은 지증왕, 독서삼품과 실시는 통일 신라 원성왕 때의 일이다.","past":true,"paper":"2026-h","src":"2026 기출 2번"},
{"id":"p26h03","no":3,"subj":"한국사","unit":"남북국 시대","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n아찬 우징은 김명의 왕위 찬탈 소식을 듣고 이의 원수를 갚고자 청해진을 관장하는 __그__에게 군사를 요청하였다. … (중략) … 문성왕 8년에 __그__는 왕이 자신의 딸을 받아들이지 않은 것에 원한을 품고 반란을 일으켰다.","opts":["사벌주를 근거로 반란을 일으켰다.","관료전을 지급하고 녹읍을 폐지하였다.","완산주에 도읍을 정하고 후백제를 세웠다.","당, 신라, 일본 등을 연결하는 해상무역을 주도하였다."],"ans":3,"exp":"청해진을 관장하며 우징(신무왕)을 도왔고 문성왕 때 반란을 일으킨 인물은 장보고이다. 장보고는 청해진을 거점으로 당, 신라, 일본을 잇는 해상 무역을 주도하였다. 사벌주의 반란은 원종과 애노, 관료전 지급과 녹읍 폐지는 신문왕, 완산주에서 후백제를 세운 것은 견훤이다.","past":true,"paper":"2026-h","src":"2026 기출 3번"},
{"id":"p26h04","no":4,"subj":"한국사","unit":"남북국 시대","q":"(가) 국가에 대한 설명으로 옳은 것은?\n\n(가) ______ 무왕은 고구려 옛 땅을 회복하는 데 힘쓰는 한편, 일본과 외교 관계를 수립하였다. 당이 흑수 말갈과 유대를 강화하여 (가) ______을/를 견제하려 하자, 무왕은 장문휴가 지휘하는 군대로 산둥반도를 공격하기도 하였다.","opts":["중앙군을 2군 6위로 구성하였다.","3성 6부제의 중앙 관제를 갖추었다.","9서당 10정의 군사 조직을 설치하였다.","지방에 22담로를 두어 왕족을 파견하였다."],"ans":1,"exp":"무왕이 장문휴를 보내 당의 산둥반도(등주)를 공격한 나라는 발해이다. 발해는 당의 제도를 받아들여 3성 6부의 중앙 관제를 갖추되 명칭과 운영은 독자적으로 하였다. 2군 6위는 고려, 9서당 10정은 통일 신라, 22담로는 백제의 제도이다.","past":true,"paper":"2026-h","src":"2026 기출 4번"},
{"id":"p26h05","no":5,"subj":"한국사","unit":"고려 전기","q":"(가) 왕에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 공을 세운 호족들에게 관직과 토지를 내리며 국가 체제를 정비하였다. 유력한 호족과 혼인 관계를 맺고, 일부에게는 왕씨 성을 내려 호족들을 포섭하기 위한 노력을 기울였다.","opts":["친원 세력인 기철 등을 제거하였다.","광덕ㆍ준풍이라는 연호를 사용하였다.","12목을 설치하고 지방관을 파견하였다.","기인 제도와 사심관 제도를 실시하였다."],"ans":3,"exp":"호족과 혼인 관계를 맺고 왕씨 성을 내려(사성 정책) 호족을 포섭한 왕은 고려 태조 왕건이다. 태조는 호족을 견제하기 위해 기인 제도와 사심관 제도도 실시하였다. 기철 제거는 공민왕, 광덕ㆍ준풍 연호는 광종, 12목 설치는 성종의 일이다.","past":true,"paper":"2026-h","src":"2026 기출 5번"},
{"id":"p26h06","no":6,"subj":"한국사","unit":"고려 전기","q":"다음 설명에 해당하는 기구는?\n\n고려의 독자적인 기구로 중서문하성과 중추원의 고위 관료가 함께 모여 주로 국방 문제를 논의하였다. 고려 후기에 그 기능이 확대되었으며 명칭도 바뀌었다.","opts":["도병마사","식목도감","정동행성","교정도감"],"ans":0,"exp":"재신과 추밀이 모여 국방 문제를 논의한 고려의 독자적 회의 기구는 도병마사이며, 원 간섭기에 도평의사사로 이름이 바뀌고 기능이 확대되었다. 식목도감은 법제와 격식을 다룬 회의 기구이고, 정동행성은 원이 일본 원정을 위해 둔 기구, 교정도감은 최충헌이 세운 무신 정권의 최고 권력 기구이다.","past":true,"paper":"2026-h","src":"2026 기출 6번"},
{"id":"p26h07","no":7,"subj":"한국사","unit":"고려 후기","q":"(가)의 침입에 대한 고려의 대응으로 옳은 것은?\n\n○ 충주 부사 우종주와 판관 유홍익은 (가) ______이/가 쳐들어오자 성을 버리고 달아났다.\n○ 김윤후는 (가) ______이/가 침입해 오자 처인부곡의 작은 성에서 살리타를 격살하였다.","opts":["팔만대장경을 제작하였다.","개경에 나성을 축조하였다.","최영을 중심으로 요동 정벌을 추진하였다.","신기군, 신보군 등으로 구성된 별무반을 조직하였다."],"ans":0,"exp":"김윤후가 처인성에서 살리타를 사살한 것은 몽골의 침입 때이며, 고려는 부처의 힘으로 몽골을 물리치고자 팔만대장경(재조대장경)을 만들었다. 개경 나성 축조는 거란의 침입 뒤의 대응이고, 요동 정벌 추진은 명의 철령위 설치 통보에 대한 것이며, 별무반은 여진 정벌을 위해 조직하였다.","past":true,"paper":"2026-h","src":"2026 기출 7번"},
{"id":"p26h08","no":8,"subj":"한국사","unit":"조선 전기","q":"(가) 왕에 대한 설명으로 옳은 것은?\n\n정변을 일으킨 다음 어린 왕을 몰아내고 왕위에 오른 (가) ______은/는 집현전을 폐지하고 경연을 열지 않았다. 아울러 통치 체제를 정비하고 『경국대전』을 편찬하기 시작하였다.","opts":["영정법을 시행하였다.","수원 화성을 건설하였다.","진관 체제를 실시하였다.","관수관급제를 시행하였다."],"ans":2,"exp":"계유정난으로 단종을 몰아내고 즉위하여 집현전과 경연을 없애고 『경국대전』 편찬을 시작한 왕은 세조이다. 세조는 지역 단위 방어 체제인 진관 체제를 실시하였다(직전법도 세조 때이다). 영정법은 인조, 수원 화성 건설은 정조, 관수관급제는 성종 때의 일이다.","past":true,"paper":"2026-h","src":"2026 기출 8번"},
{"id":"p26h09","no":9,"subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘그’에 대한 설명으로 옳은 것은?\n\n지난번 __그__가 아뢴바 천거로 인재를 뽑는 일은 관중에서 여럿이 의논한 일입니다. 이른바 현량과 시행에 혹시 뒷폐단이 있을까 염려되고 혹시 공평하지 못할까 염려되기는 하지만 대체로 좋은 일입니다. 비록 한두 사람이 천거에 빠진다 하더라도 주저하지 말고 시행해야 합니다.","opts":["북벌 운동을 추진하였다.","『성학집요』를 저술하였다.","소격서 폐지를 건의하였다.","전민변정도감을 설치하였다."],"ans":2,"exp":"천거로 인재를 뽑는 현량과 시행을 건의한 인물은 중종 때의 조광조이다. 조광조는 도교 행사를 맡던 소격서의 폐지, 위훈 삭제 등을 주장하다 기묘사화로 제거되었다. 북벌 운동은 효종과 송시열 등, 『성학집요』는 이이, 전민변정도감 설치는 고려 공민왕 때 신돈 등과 관련된다.","past":true,"paper":"2026-h","src":"2026 기출 9번"},
{"id":"p26h10","no":10,"subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘이 시기’에 볼 수 있는 모습이 아닌 것은?\n\n__이 시기__ 문화의 두드러진 특징 중 하나는 풍속화의 유행이다. 특히 김홍도는 서민의 일상을 사실적이고 재치 있게 묘사하였다. 「서당」, 「씨름」 등의 작품이 그것이다.","opts":["담배, 면화를 재배하는 농민","규장각 검서관으로 근무하는 서얼","지눌과 수선사 결사를 논의하는 승려","금난전권의 폐지에 반대하는 시전 상인"],"ans":2,"exp":"김홍도의 풍속화가 유행한 시기는 조선 후기이다. 지눌의 수선사 결사는 고려 무신 집권기의 일이므로 이 시기에 볼 수 없다. 담배ㆍ면화 같은 상품 작물 재배, 정조 때 서얼의 규장각 검서관 등용, 신해통공(금난전권 폐지)을 둘러싼 시전 상인의 반발은 모두 조선 후기의 모습이다.","past":true,"paper":"2026-h","src":"2026 기출 10번"},
{"id":"p26h11","no":11,"subj":"한국사","unit":"조선 후기","q":"(가)에 들어갈 내용으로 옳은 것은?\n\n그는 전남 강진으로 유배되었으며, 『경세유표』, 『(가) ______』 등을 저술하였다.","opts":["동사강목","열하일기","연려실기술","아방강역고"],"ans":3,"exp":"강진에 유배되어 『경세유표』를 쓴 인물은 정약용이며, 우리나라 역대 강역을 고증한 『아방강역고』도 그의 저술이다. 『동사강목』은 안정복, 『열하일기』는 박지원, 『연려실기술』은 이긍익이 지었다.","past":true,"paper":"2026-h","src":"2026 기출 11번"},
{"id":"p26h12","no":12,"subj":"한국사","unit":"개항기","q":"밑줄 친 ‘그’에 대한 설명으로 옳지 않은 것은?\n\n__그__는 경복궁 중건에 필요한 재정이 메말라 8도의 부자 명단을 뽑아서 돈을 거두었다. 그리하여 파산자가 잇달았다. 이때 거두어들인 돈을 원납전이라 하였는데, 사람들은 이를 비아냥대며 이렇게 말하였다. “스스로 원해서 내는 돈인 원납전이 아니라, 원망하며 바치는 돈이라는 의미의 원납전이다.”","opts":["당백전 발행","사창제 실시","장용영 설치","호포제 시행"],"ans":2,"exp":"경복궁을 중건하며 원납전을 거둔 인물은 흥선 대원군이다. 장용영은 정조가 왕권 강화를 위해 설치한 친위 부대이므로 옳지 않다. 당백전 발행(경복궁 중건 비용 마련), 사창제 실시(환곡 개혁), 호포제 시행(군정 개혁)은 모두 흥선 대원군의 정책이다.","past":true,"paper":"2026-h","src":"2026 기출 12번"},
{"id":"p26h13","no":13,"subj":"한국사","unit":"개항기","q":"다음 취지서를 발표한 단체에 대한 설명으로 옳은 것은?\n\n나라의 독립은 오직 자강의 여하에 달려 있다. … (중략) … 자강의 방도를 강구하려 할 것 같으면 다른 곳에 있지 않고 교육을 진작하고 산업을 일으키는 데 있으니 … (중략) … 교육과 산업의 발달이 곧 자강의 방도임을 알 수 있는 것이다.","opts":["민립 대학 설립 운동을 추진하였다.","고종 강제 퇴위 반대 운동을 전개하였다.","러시아의 절영도 조차 요구를 저지하였다.","만주에 한인촌을 건설하고 독립 전쟁을 준비하였다."],"ans":1,"exp":"교육과 산업을 통한 자강을 내세운 취지서는 대한 자강회(1906)의 것이다. 대한 자강회는 1907년 고종 강제 퇴위 반대 운동을 벌이다 통감부에 의해 해산되었다. 민립 대학 설립 운동은 1920년대 조선 민립 대학 기성회, 절영도 조차 요구 저지는 독립 협회, 만주의 독립운동 기지 건설은 신민회의 활동이다.","past":true,"paper":"2026-h","src":"2026 기출 13번"},
{"id":"p26h14","no":14,"subj":"한국사","unit":"개항기","q":"밑줄 친 ‘개혁’의 내용으로 옳은 것은?\n\n고종과 명성황후는 일본의 간섭에서 벗어나기 위해 러시아에 접근하였다. 러시아의 위세에 눌려 영향력이 줄어든 일본은 친러 정책의 배후 인물로 명성황후를 지목하였고, 미우라 공사가 동원한 일본 낭인들이 경복궁에 난입하여 명성황후를 시해하였다. 그 결과 김홍집 등을 중심으로 한 친일 내각이 구성되어 여러 __개혁__을 추진하였다.","opts":["태양력 채택","연좌제 폐지","집강소 설치","영선사 파견"],"ans":0,"exp":"을미사변 뒤 김홍집 내각이 추진한 개혁은 을미개혁(1895)으로, 태양력 채택, 건양 연호 사용, 단발령, 종두법 시행 등이 내용이다. 연좌제 폐지는 제1차 갑오개혁, 집강소 설치는 전주 화약 뒤 동학 농민군의 활동, 영선사 파견은 1881년의 일이다.","past":true,"paper":"2026-h","src":"2026 기출 14번"},
{"id":"p26h15","no":15,"subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘독립운동’에 대한 설명으로 옳은 것은?\n\n탑골 공원에서 시작된 조선의 __독립운동__은 전국으로 확산하였으며, 학생ㆍ농민ㆍ상인 등 각계각층이 참여하였다. 해외에 거주하는 한인들까지도 조선 독립 만세를 높이 외쳤다. 일제는 경찰과 군대를 동원하여 무력으로 __독립운동__을 진압하였고, 제암리 등지에서 무자비한 학살을 자행하였다.","opts":["대전자령 전투에서 승리하였다.","미쓰야 협정이 체결된 이후에 전개되었다.","순종의 인산일을 기회로 삼아 추진되었다.","대한민국 임시 정부 수립의 계기가 되었다."],"ans":3,"exp":"탑골 공원에서 시작되고 제암리 학살이 일어난 운동은 1919년의 3ㆍ1 운동이며, 이를 계기로 같은 해 상하이에서 대한민국 임시 정부가 수립되었다. 대전자령 전투는 1933년 한국 독립군의 승리이고, 미쓰야 협정은 1925년에 체결되었으며, 순종의 인산일을 기회로 삼은 것은 1926년 6ㆍ10 만세 운동이다.","past":true,"paper":"2026-h","src":"2026 기출 15번"},
{"id":"p26h16","no":16,"subj":"한국사","unit":"현대","q":"(가) 지역에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 고구려 장수왕이 천도한 곳으로, 고려 태조는 이 지역을 서경으로 삼아 중시하였다. 묘청 등은 여러 근거를 들어 서경으로의 천도를 주장하였다.","opts":["외규장각이 위치하였다.","영국이 불법으로 점령하였다.","조일 수호 조규로 개항되었다.","김구가 참석한 남북 협상이 열렸다."],"ans":3,"exp":"장수왕이 천도하였고 고려 때 서경이라 불린 곳은 평양이다. 1948년 4월 김구와 김규식 등이 참석한 남북 협상(남북 연석 회의)이 평양에서 열렸다. 외규장각은 강화도에 있었고, 영국이 불법 점령한 곳은 거문도이며, 조일 수호 조규로 개항된 곳은 부산ㆍ원산ㆍ인천이다.","past":true,"paper":"2026-h","src":"2026 기출 16번"},
{"id":"p26h17","no":17,"subj":"한국사","unit":"일제 강점기","q":"다음 법령이 제정된 이후에 있었던 사실은?\n\n제1조 국체를 변혁하거나 사유 재산 제도를 부인하는 것을 목적으로 결사를 조직하거나 이에 가입한 자는 10년 이하의 징역 또는 금고에 처한다.","opts":["조선 태형령이 제정되었다.","정우회 선언이 발표되었다.","헤이그 특사가 파견되었다.","조선 총독부가 창설되었다."],"ans":1,"exp":"제시된 법령은 1925년에 제정된 치안 유지법이다. 정우회 선언은 1926년에 발표되어 신간회 창립(1927)의 계기가 되었으므로 그 이후의 사실이다. 조선 태형령 제정은 1912년, 헤이그 특사 파견은 1907년, 조선 총독부 창설은 1910년으로 모두 그 이전이다.","past":true,"paper":"2026-h","src":"2026 기출 17번"},
{"id":"p26h18","no":18,"subj":"한국사","unit":"일제 강점기","q":"(가) 단체에 대한 설명으로 옳은 것은?\n\n김원봉을 중심으로 조직된 (가) ______은/는 신채호가 작성한 「조선 혁명 선언」을 활동 지침으로 삼았다. 이 단체는 일제 통치 기관 파괴, 일제 고위 관료ㆍ친일파 처단 등을 목표로 삼았다.","opts":["신흥 강습소를 설립하였다.","연통제와 교통국을 운영하였다.","하와이에 근거를 두고 조직되었다.","김익상, 나석주가 단원으로 활동하였다."],"ans":3,"exp":"김원봉이 조직하고 「조선 혁명 선언」을 지침으로 삼은 단체는 의열단(1919)이다. 김익상(조선 총독부 투탄)과 나석주(동양 척식 주식회사 투탄)는 의열단원이었다. 신흥 강습소는 신민회 계열 인사들이 세웠고, 연통제와 교통국은 대한민국 임시 정부가 운영하였으며, 하와이에서 조직된 단체로는 대조선 국민 군단 등이 있다.","past":true,"paper":"2026-h","src":"2026 기출 18번"},
{"id":"p26h19","no":19,"subj":"한국사","unit":"현대","q":"(가) ～ (라)를 시기순으로 바르게 나열한 것은?\n\n(가) 제1차 미소 공동 위원회가 개최되었다.\n(나) 반민족 행위 처벌법이 제정되었다.\n(다) 모스크바 3국 외상 회의가 열렸다.\n(라) 5ㆍ10 총선거가 시행되었다.","opts":["(가) → (다) → (라) → (나)","(가) → (다) → (나) → (라)","(다) → (가) → (라) → (나)","(다) → (가) → (나) → (라)"],"ans":2,"exp":"모스크바 3국 외상 회의(1945년 12월)의 결정에 따라 제1차 미소 공동 위원회(1946년 3월)가 열렸다. 그 뒤 5ㆍ10 총선거(1948년 5월)로 구성된 제헌 국회가 반민족 행위 처벌법(1948년 9월)을 제정하였다. 따라서 (다) → (가) → (라) → (나) 순이다.","past":true,"paper":"2026-h","src":"2026 기출 19번"},
{"id":"p26h20","no":20,"subj":"한국사","unit":"현대","q":"(가)에 대한 설명으로 옳은 것은?\n\n(가) ______의 결과 이승만 정부가 무너지고 과도 정부가 수립되었다. 과도 정부는 개헌을 단행하였다. 새로운 헌법에 따라 구성된 국회는 윤보선을 대통령으로 선출하였다.","opts":["4ㆍ13 호헌 조치를 비판하였다.","장면 내각이 출범하는 배경이 되었다.","유신 헌법 철폐ㆍ신군부 퇴진을 주장하였다.","3ㆍ1 민주 구국 선언이 발표된 이후에 일어났다."],"ans":1,"exp":"이승만 정부를 무너뜨린 사건은 1960년의 4ㆍ19 혁명이며, 그 뒤 허정 과도 정부의 내각 책임제 개헌을 거쳐 윤보선 대통령과 장면 내각이 출범하였다. 4ㆍ13 호헌 조치 비판은 1987년 6월 민주 항쟁, 유신 헌법 철폐와 신군부 퇴진 요구는 1980년 '서울의 봄'과 5ㆍ18 민주화 운동 무렵의 일이고, 3ㆍ1 민주 구국 선언은 1976년에 발표되었다.","past":true,"paper":"2026-h","src":"2026 기출 20번"},
{"id":"p26e01","no":1,"subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nUnfortunately, the survey results show that children’s health is ______ due to overconsumption of fast food.","opts":["deteriorating","improving","recovering","advancing"],"ans":0,"exp":"Unfortunately(유감스럽게도)와 패스트푸드 과다 섭취라는 원인으로 보아 건강이 \"나빠지고 있다\"는 뜻의 deteriorating이 알맞다. improving(나아지는), recovering(회복하는), advancing(진전하는)은 모두 긍정적인 변화라서 문맥과 반대이다.","past":true,"paper":"2026-e","src":"2026 기출 1번"},
{"id":"p26e02","no":2,"subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nI suggest that you discuss this matter ______ if you don’t want many people to know about it.","opts":["discreetly","publicly","loudly","outwardly"],"ans":0,"exp":"많은 사람이 알기를 원하지 않는다면 이 문제를 \"신중하게, 남의 눈에 띄지 않게\"(discreetly) 의논해야 한다. publicly(공개적으로), loudly(큰 소리로), outwardly(겉으로)는 남들이 알게 되는 방식이라 맞지 않다.","past":true,"paper":"2026-e","src":"2026 기출 2번"},
{"id":"p26e03","no":3,"subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA small plaque ______ from mammoth ivory, dating from 30,000 BCE, is thought to have been carved by prehistoric humans to represent the constellation Orion.","opts":["makes","made","to make","was made"],"ans":1,"exp":"문장의 동사는 is thought이므로 빈칸에는 주어 A small plaque를 뒤에서 꾸미는 말이 와야 한다. 판은 매머드 상아로 \"만들어진\" 것이므로 수동의 과거분사 made가 알맞다. makes와 was made는 동사가 하나 더 생겨 틀리고, to make는 능동이라 뜻이 맞지 않는다.","past":true,"paper":"2026-e","src":"2026 기출 3번"},
{"id":"p26e04","no":4,"subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nJames Mayer (10:11 am): Hello. We’d like to reserve a pick-up service from the airport.\nMinji Kim (10:12 am): Hi! How many are in your group?\nJames Mayer (10:13 am): 8. I think we’ll need a large van.\nMinji Kim (10:13 am): ______?\nJames Mayer (10:15 am): Riverside Hotel. Is it far from the airport?\nMinji Kim (10:15 am): No, it’s only a 5 minute drive.\nJames Mayer (10:17 am): Great! Can you pick us up tomorrow at 10 am? Gate 7.\nMinji Kim (10:17 am): Sure! See you tomorrow.","opts":["Do you need a smaller car","Where is your group headed","How long are you staying in Korea","When will you pick up your luggage"],"ans":1,"exp":"빈칸 뒤에서 James가 \"Riverside Hotel\"이라고 목적지를 답하고 공항에서 먼지 묻고 있으므로, 빈칸은 \"일행이 어디로 가십니까\"라는 질문이어야 한다. 더 작은 차, 한국 체류 기간, 짐 찾는 때를 묻는 말에는 호텔 이름으로 답할 수 없다.","past":true,"paper":"2026-e","src":"2026 기출 4번"},
{"id":"p26e05","no":5,"subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Hello, emergency services.\nB: My friend broke his arm while skateboarding! There are no taxis around.\nA: Please tell me your exact location.\nB: We’re in front of the main entrance of city hall.\nA: I’m sending an ambulance to your location.\nB: ______?\nA: The nearest ambulance has already been dispatched, so it should arrive within a few minutes.\nB: Thank you so much.","opts":["Will there be a specialist available","Does my friend need his identification card","Do you charge for taking an ambulance","How long will it take for the ambulance to get here"],"ans":3,"exp":"빈칸 다음에 A가 \"가장 가까운 구급차가 이미 출동했으니 몇 분 안에 도착할 것\"이라고 답하므로, B는 구급차가 오는 데 얼마나 걸리는지 물은 것이다. 전문의, 신분증, 이용 요금을 묻는 말은 도착 시간에 대한 대답과 이어지지 않는다.","past":true,"paper":"2026-e","src":"2026 기출 5번"},
{"id":"p26e06","no":6,"subj":"영어","unit":"독해 주제","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nNoRatVctr (https://noratvectors.com)\n\n(A) ______\n\nThe Vector Control Program inspects and treats disease vectors from rats. (Vectors are living organisms that can transfer diseases to people.)\n\nProcess for our rat program:\n■ Make a service request through 311.\n■ Our team will come to your property to do an assessment.\n■ If you see active signs (droppings, hairs, tracks) and you wish to have the property treated, we will ask you to sign a Release of Liability form for us to service your property.\n■ You will be placed in our rotation for one recommended treatment each month.\n\nWhen does Springfield Public Health not treat for rats?\nRequirements for our rat program:\n■ No dog waste\n■ No bird seed\n■ No overgrown yards\n■ No trash/debris\n\nThe program only treats outdoor areas. If you have rats inside your home or garage, please contact your property owner or a licensed exterminator.","opts":["The Spread of Vectors in Homes","How to Identify Vectors on Your Own","Becoming a Licensed Rat Exterminator","Springfield’s Vector Control Service"],"ans":3,"exp":"글은 Springfield 보건 당국의 Vector Control Program이 쥐를 점검·처리해 주는 절차와 조건을 안내하므로 \"Springfield의 매개체 방제 서비스\"가 제목으로 알맞다. 매개체가 집에 퍼지는 과정, 스스로 식별하는 법, 방제업자 자격을 얻는 법은 글에 나오지 않는다.","past":true,"paper":"2026-e","src":"2026 기출 6번"},
{"id":"p26e07","no":7,"subj":"영어","unit":"독해 내용일치","q":"윗글에 제시된 프로그램의 내용과 일치하는 것은?\n\nNoRatVctr (https://noratvectors.com)\n\n(A) ______\n\nThe Vector Control Program inspects and treats disease vectors from rats. (Vectors are living organisms that can transfer diseases to people.)\n\nProcess for our rat program:\n■ Make a service request through 311.\n■ Our team will come to your property to do an assessment.\n■ If you see active signs (droppings, hairs, tracks) and you wish to have the property treated, we will ask you to sign a Release of Liability form for us to service your property.\n■ You will be placed in our rotation for one recommended treatment each month.\n\nWhen does Springfield Public Health not treat for rats?\nRequirements for our rat program:\n■ No dog waste\n■ No bird seed\n■ No overgrown yards\n■ No trash/debris\n\nThe program only treats outdoor areas. If you have rats inside your home or garage, please contact your property owner or a licensed exterminator.","opts":["서비스 신청 시 별도의 평가 절차가 필요하지 않다.","서비스를 신청한 집에 매주 2회 방문한다.","개 배설물이 있는 경우 쥐를 처리해 주지 않는다.","집 안에 있는 쥐도 처리해 준다."],"ans":2,"exp":"처리해 주지 않는 경우를 묻는 항목 아래 요건으로 \"No dog waste\"가 있으므로 개 배설물이 있으면 처리해 주지 않는다. 팀이 방문해 평가(assessment)를 하고, 처리는 매달 한 번(one recommended treatment each month)이며, 야외만 처리하고 집이나 차고 안의 쥐는 집주인이나 방제업자에게 맡기라고 했으므로 나머지는 틀리다.","past":true,"paper":"2026-e","src":"2026 기출 7번"},
{"id":"p26e08","no":8,"subj":"영어","unit":"독해 주제","q":"윗글의 목적으로 가장 적절한 것은?\n\nHHWnever (https://hhwnever.com)\n\nHousehold Hazardous Waste\n\nLeftover household products that can catch fire or explode under certain circumstances are considered household hazardous waste (HHW). Although it depends on your local solid waste agency or recycling facility, some examples include pesticides, paints, light bulbs, batteries, and nail polish. These products require special care when you dispose of them. HHW may be dangerous to people and bad for the environment if they are poured down the drain, dumped on the ground, or thrown out with __regular__ trash.\n\nWhat you can do:\n▪ Try to reduce your purchases of these products, and look for alternative, non-hazardous products.\n▪ When you need to dispose of these products, look for special collection events in your community or permanent collection centers.\n▪ If you have to dispose of HHW, first check with your local waste management agency to learn what rules apply in your community.","opts":["to promote the safe disposal of HHW","to show how HHW is managed at collection centers","to inform how to distinguish HHW from regular trash","to introduce local agencies dealing with HHW"],"ans":0,"exp":"가정용 유해 폐기물은 아무렇게나 버리면 사람과 환경에 해로우니 덜 사고, 수거 행사나 수거 센터를 이용하고, 지역 규정을 확인하라고 권하는 글이므로 안전한 처리를 장려하는 것이 목적이다. 수거 센터의 관리 방식, 일반 쓰레기와 구별하는 법, 담당 기관 소개는 글의 중심 내용이 아니다.","past":true,"paper":"2026-e","src":"2026 기출 8번"},
