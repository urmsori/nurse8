{"id":"e76","subj":"영어","unit":"독해 내용일치","q":"octopus에 관한 다음 글의 내용과 일치하는 것은?\n\nThe octopus is one of the most unusual animals in the sea. It has three hearts and blue blood, and because it has no bones, it can squeeze through extremely narrow gaps. About two-thirds of its nerve cells are located not in its head but in its eight arms, which can taste what they touch. An octopus can also change the color of its skin within a second to hide from enemies. Despite these remarkable abilities, most species live for only one or two years.","opts":["It has three hearts and red blood.","Most of its nerve cells are in its arms.","It needs several minutes to change its skin color.","Most species live for more than ten years."],"ans":1,"exp":"문어의 신경 세포는 약 3분의 2가 머리가 아니라 여덟 개의 팔에 있다고 했다. 피는 파란색이고, 피부색은 1초 안에 바꿀 수 있으며, 대부분의 종은 1~2년밖에 살지 못한다."},
{"id":"e77","subj":"영어","unit":"독해 내용일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\nDear staff members,\nA fire safety training session will be held on Thursday, June 12, from 2 p.m. to 4 p.m. in the main auditorium on the third floor. Attendance is required for all employees who joined the office this year; others are welcome but need not attend. The session will include a short lecture by a local firefighter and hands-on practice with fire extinguishers in the parking lot. Please wear comfortable shoes. If you cannot attend, notify the General Affairs Team by June 10, and you will be assigned to the next session in September.","opts":["The session will last two hours.","It includes practice with fire extinguishers.","Those who cannot attend should give notice by June 10.","Every employee in the office is required to attend."],"ans":3,"exp":"참석이 의무인 사람은 올해 입사한 직원뿐이고, 나머지는 와도 되지만 꼭 올 필요는 없다(need not attend)고 했다. 교육은 오후 2시부터 4시까지 두 시간이고, 소화기 실습이 있으며, 참석하지 못하면 6월 10일까지 총무팀에 알려야 한다."},
{"id":"e78","subj":"영어","unit":"독해 내용일치","q":"vitamin D에 관한 다음 글의 내용과 일치하는 것은?\n\nVitamin D helps the body absorb calcium and is therefore essential for strong bones. Unlike most vitamins, it can be produced by the body itself when the skin is exposed to sunlight. Only a few foods, such as oily fish and egg yolks, contain it naturally. People who spend most of the day indoors, as well as older adults, whose skin makes the vitamin less efficiently, are at greater risk of deficiency. In winter, when sunlight is weak, doctors may recommend supplements.","opts":["Older adults' skin produces it less efficiently.","It is found naturally in most kinds of food.","The body is unable to make it by itself.","Supplements are mainly recommended in summer."],"ans":0,"exp":"노인은 피부에서 비타민 D를 만드는 효율이 떨어져 결핍 위험이 크다고 했다. 비타민 D가 자연적으로 들어 있는 음식은 몇 가지뿐이고, 피부가 햇빛을 받으면 몸에서 스스로 만들 수 있으며, 보충제는 햇빛이 약한 겨울에 권한다."},
{"id":"e79","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nMany people assume that multitasking helps them get more done. In fact, the brain cannot focus on two demanding tasks at once; it simply switches rapidly between them. Each switch costs a little time and attention, and the costs add up. In one experiment, workers who were interrupted by messages took much longer to finish a report and made more errors than those who worked without interruption. Doing several things at the same time, in other words, usually means ______.","opts":["doing each of them less well","finishing all of them earlier","enjoying work more than before","learning to ignore messages"],"ans":0,"exp":"뇌는 두 가지 일을 동시에 하지 못하고 빠르게 오갈 뿐이며, 그때마다 시간과 주의력이 든다는 글이다. 실험에서도 방해받은 사람들이 더 오래 걸리고 실수가 많았으므로, 여러 일을 한꺼번에 하면 하나하나를 덜 잘하게 된다는 결론이 알맞다. 더 일찍 끝낸다는 선지는 글과 반대다."},
{"id":"e80","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nPlacebos are pills that contain no active medicine, yet patients who take them often report feeling better. Researchers believe that the improvement comes from ______. When people trust that a treatment will work, the brain releases chemicals that actually reduce pain. Interestingly, the effect is stronger when the pill is larger, more expensive, or given by a doctor in a white coat. The mind, it seems, plays a real part in healing.","opts":["a hidden ingredient in the pills","the patient's expectation of getting well","the low price of the treatment","the doctor's skill in surgery"],"ans":1,"exp":"빈칸 다음 문장이 \"치료가 효과가 있으리라고 믿으면 뇌가 통증을 줄이는 물질을 내보낸다\"고 설명하므로, 호전의 원인은 나을 것이라는 환자의 기대다. 위약에는 약 성분이 없다고 했고, 값이 비쌀수록 효과가 크다고 했으므로 나머지 선지는 맞지 않는다."},
{"id":"e81","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nElectric cars produce no exhaust gas while they are being driven, so they are often described as perfectly clean. ______, the electricity that charges them may come from power plants that burn coal, and making their batteries requires large amounts of energy and rare metals. This does not mean that electric cars are worse than gasoline cars; most studies find that they cause less pollution over their whole lifetime. It does mean that how clean they are depends on how the electricity is produced.","opts":["Therefore","For example","However","Similarly"],"ans":2,"exp":"앞 문장은 전기차가 완전히 깨끗하다고들 말한다는 내용이고, 뒤 문장은 충전용 전기가 석탄 발전소에서 올 수 있고 배터리 생산에도 자원이 많이 든다는 반대 내용이다. 따라서 역접의 However가 알맞다. Therefore는 결과, For example은 예시, Similarly는 비슷한 내용을 이을 때 쓴다."},
{"id":"e82","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nIn a traditional market, prices are rarely fixed. A seller names a price, the buyer offers less, and the two move toward a figure that both can accept. Visitors from countries where bargaining is uncommon often feel uncomfortable with this process and think they are being cheated. To the people who shop there every day, however, bargaining is ______. It is a chance to chat, to joke, and to build a relationship that will bring the customer back tomorrow.","opts":["a form of social interaction","a waste of valuable time","a sign of dishonesty","a rule set by the government"],"ans":0,"exp":"빈칸 뒤에서 흥정은 이야기를 나누고 농담을 하고 관계를 쌓는 기회라고 했으므로 \"사회적 교류의 한 형태\"가 알맞다. 속는다고 느끼는 것은 흥정이 낯선 방문객의 생각이고, however 뒤에서는 날마다 장을 보는 사람들의 긍정적인 시각이 나온다."},
{"id":"e83","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nNurses on night shifts must stay alert at hours when the body expects to sleep. Hospitals that have studied the problem report that short, planned naps are surprisingly effective. A nap of about twenty minutes during a break restores attention for several hours, whereas a longer nap can leave a person feeling heavy and slow on waking. Bright lighting in work areas and a light meal instead of a heavy one also help. These findings suggest that fatigue on the night shift is not simply a matter of willpower; it can be ______.","opts":["ignored by experienced nurses","cured with stronger medicine","managed through careful planning","blamed on individual workers"],"ans":2,"exp":"20분쯤의 계획된 낮잠, 밝은 조명, 가벼운 식사가 야간 근무의 피로를 덜어 준다는 글이다. 피로는 의지력만의 문제가 아니라고 했으므로, 세심한 계획으로 관리할 수 있다는 말이 이어져야 한다. 약이나 개인의 책임에 관한 내용은 글에 없다."},
{"id":"e84","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nWhen a new road is built to relieve traffic jams, drivers are usually pleased at first. Within a few years, however, the new road is often as crowded as the old one. The reason is that easier driving encourages people to make trips they would not have made before, to move farther from their workplaces, and to give up buses and trains. Economists call this \"induced demand.\" It explains why cities that keep adding roads rarely solve congestion: ______.","opts":["new roads cost too much to maintain","more road space attracts more cars","most drivers prefer the older roads","public transportation becomes faster"],"ans":1,"exp":"길이 넓어져 운전이 편해지면 사람들이 차를 더 많이 타게 되어 새 도로도 다시 막힌다는 \"유발 수요\"를 설명한 글이다. 따라서 도로가 늘면 차도 더 몰린다는 말이 알맞다. 유지비나 옛 도로에 대한 선호는 글에 나오지 않는다."},
{"id":"e85","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nHoneybees cannot speak, but they share information with remarkable precision. When a bee finds a rich patch of flowers, it returns to the hive and performs a dance on the comb. The direction in which it moves shows the direction of the flowers in relation to the sun, and the length of the dance indicates how far away they are. Other bees follow the dancer closely and then fly straight to the spot. Through this dance, a single bee's discovery quickly becomes ______.","opts":["a secret kept from the other bees","a serious danger to the queen","a reason to leave the hive for good","knowledge shared by the whole hive"],"ans":3,"exp":"꿀벌은 춤으로 꽃이 있는 방향과 거리를 알리고, 다른 벌들이 그것을 보고 그곳으로 곧장 날아간다는 글이다. 따라서 한 마리의 발견이 벌집 전체가 함께 아는 지식이 된다는 말이 알맞다. 첫 문장의 \"정보를 공유한다\"와도 이어진다."},
{"id":"e86","subj":"영어","unit":"독해 빈칸","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nMany offices have removed walls so that employees can work in one large open room. The idea is that people will talk to each other more and share ideas freely. Several studies, however, have found the opposite result. Surrounded by noise and aware of being watched, workers in open offices put on headphones and send messages instead of speaking. Face-to-face conversation actually decreased after the walls came down. An office designed to bring people together may, ironically, ______.","opts":["make them talk far too much","lower the cost of renting space","push them further apart","improve their concentration"],"ans":2,"exp":"벽을 없앤 사무실에서 오히려 직원들이 헤드폰을 쓰고 메시지로만 소통해 대면 대화가 줄었다는 글이다. ironically(역설적으로)로 보아 사람들을 모으려던 설계가 도리어 서로를 멀어지게 한다는 말이 알맞다."},
{"id":"e87","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nMost people think of dust as nothing more than a nuisance to be wiped away.\n\n(A) These tiny particles do not stay where they started. Winds can carry them across entire oceans.\n(B) Yet dust plays an important role in nature. Much of it consists of minerals blown up from dry land such as deserts.\n(C) When they finally settle, the minerals they contain feed plants on land and tiny organisms in the sea.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":1,"exp":"먼지를 귀찮은 것으로만 여긴다는 주어진 글 뒤에, Yet으로 먼지의 중요한 역할을 꺼내는 (B)가 온다. (A)의 These tiny particles는 (B)의 광물 입자를 가리키고, (C)의 When they finally settle은 (A)에서 바람에 실려 간 입자가 내려앉는 것을 말하므로 (B)-(A)-(C)이다."},
{"id":"e88","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nA patient arriving at an emergency room is not always treated in the order of arrival.\n\n(A) Those in the most serious condition are seen immediately, while those with minor problems may wait for hours.\n(B) This system may seem unfair to people who have waited a long time, but it saves lives by directing limited resources to where they are needed most.\n(C) Instead, a nurse first checks each patient's symptoms and vital signs and assigns a level of urgency.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":3,"exp":"도착 순서대로 진료하지 않는다는 주어진 글 뒤에 Instead로 시작해 간호사가 긴급도를 매긴다는 (C)가 온다. 그 긴급도에 따라 중한 환자부터 본다는 (A)가 이어지고, 이 방식(This system)을 평가하는 (B)가 마지막에 온다."},
{"id":"e89","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nIn the 1840s, a doctor working in a hospital in Vienna noticed something puzzling.\n\n(A) He suspected that the doctors were carrying something harmful on their hands, since they often came straight from examining dead bodies.\n(B) Far more mothers died of fever in the ward run by doctors than in the ward run by midwives.\n(C) So he ordered them to wash their hands in a chlorine solution before seeing patients, and the death rate dropped sharply.","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":0,"exp":"주어진 글의 \"이상한 점\"이 무엇인지 밝히는 (B)가 먼저 온다(의사 병동의 산모 사망이 훨씬 많음). 그 원인을 의사들의 손에서 찾는 (A)가 이어지고, 그래서(So) 손을 씻게 하자 사망률이 떨어졌다는 (C)가 결론이다."},
{"id":"e90","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nJiwon had always been afraid of speaking in front of others.\n\n(A) To her surprise, the audience listened closely and applauded warmly when she finished.\n(B) So when her manager asked her to present the team's project, her first thought was to refuse.\n(C) But she decided to accept, and for two weeks she practiced every evening in front of a mirror.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(B)-(A)"],"ans":2,"exp":"남 앞에서 말하기를 두려워했다는 주어진 글 뒤에, 그래서(So) 발표 요청을 거절하고 싶었다는 (B)가 온다. 그러나(But) 받아들이고 연습했다는 (C)가 이어지고, 발표를 마쳤을 때 청중이 박수를 보냈다는 (A)가 마지막이다."},
{"id":"e91","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nRecycling plastic is more complicated than most people imagine.\n\n(A) Because this step must be done so thoroughly, a single dirty item, such as a greasy food container, can spoil a whole batch.\n(B) For one thing, there are many kinds of plastic, and they cannot be melted together.\n(C) They must therefore be sorted by type and cleaned before processing, which takes time and money.","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":1,"exp":"재활용이 복잡하다는 주어진 글 뒤에 첫 번째 이유(For one thing)로 플라스틱 종류가 많다는 (B)가 온다. 그래서(therefore) 종류별로 나누고 씻어야 한다는 (C)가 이어지고, (A)의 this step은 (C)의 분류·세척 과정을 가리키므로 마지막에 온다."},
{"id":"e92","subj":"영어","unit":"독해 흐름","q":"글의 흐름상 가장 어색한 문장은?\n\nWalking is one of the easiest forms of exercise to begin. (A) It requires no special equipment other than a comfortable pair of shoes. (B) A brisk thirty-minute walk each day strengthens the heart and helps control weight. (C) The price of running shoes has risen sharply in recent years because of higher material costs. (D) Walking also improves mood, since physical activity triggers the release of chemicals that reduce stress.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"걷기는 시작하기 쉽고 심장, 체중, 기분에 좋다는 글이다. (C)는 신발이라는 낱말로 이어지는 듯하지만 운동화 가격이 올랐다는 내용이어서 걷기의 장점이라는 흐름에서 벗어난다."},
{"id":"e93","subj":"영어","unit":"독해 흐름","q":"글의 흐름상 가장 어색한 문장은?\n\nMore and more government services are moving online. (A) Citizens can now obtain many certificates at home without visiting an office. (B) This saves travel time and shortens the lines for those who still need to come in person. (C) Some older residents, however, find the websites difficult to use, so offices keep staff available to assist them. (D) Many young people today prefer shopping online to visiting stores. Making services digital while leaving no one behind remains the goal.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"행정 서비스의 온라인화가 주는 편리함과, 이용이 어려운 주민에 대한 배려를 다룬 글이다. (D)는 젊은 층의 온라인 쇼핑 이야기여서 행정 서비스와 관계가 없다."},
{"id":"e94","subj":"영어","unit":"독해 흐름","q":"글의 흐름상 가장 어색한 문장은?\n\nBlood for transfusion cannot be manufactured; it can only come from volunteers. (A) A person's blood type is determined by genes inherited from his or her parents. (B) Because blood components can be stored for only a limited time, hospitals need a steady supply throughout the year. (C) Supplies tend to fall during holidays and in winter, when fewer people come to donate. (D) For this reason, blood centers run special campaigns at these times to encourage donors.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"혈액은 헌혈로만 얻을 수 있고 오래 보관할 수 없어 꾸준한 공급이 필요하다는 글이다. (A)는 혈액형이 유전으로 정해진다는 내용이어서 헌혈과 혈액 수급이라는 흐름과 관계가 없다. (D)의 these times는 (C)의 연휴와 겨울을 가리킨다."},
{"id":"e95","subj":"영어","unit":"독해 흐름","q":"글의 흐름상 가장 어색한 문장은?\n\nNoise is often regarded as a mere annoyance, but it can harm health. (A) People who live near airports or busy roads have higher rates of high blood pressure and heart disease. (B) Airports have become important centers of trade as air travel has grown. (C) Even when noise does not wake us, it raises the level of stress hormones during sleep. (D) Children in noisy schools have also been found to learn to read more slowly.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"소음이 고혈압, 심장병, 스트레스 호르몬, 아이들의 학습에 나쁜 영향을 준다는 글이다. (B)는 공항이라는 낱말이 겹치지만 공항이 무역의 중심지가 되었다는 내용이어서 소음과 건강이라는 주제에서 벗어난다."},
{"id":"e96","subj":"영어","unit":"독해 흐름","q":"글의 흐름상 가장 어색한 문장은?\n\nReading aloud to young children brings benefits that last for years. (A) Many children's books are printed on thick paper so that they are not easily torn. (B) Children who are read to regularly hear many more words than those who are not, and their vocabulary grows faster. (C) They also learn to sit still and follow a story, a skill that helps them when they enter school. (D) Just as important, the shared time strengthens the bond between parent and child.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"아이에게 책을 읽어 주면 어휘력, 집중해서 이야기를 따라가는 힘, 부모와의 유대가 자란다는 글이다. (A)는 어린이 책의 종이 두께에 관한 내용이어서 책 읽어 주기의 효과와 관계가 없다."},
{"id":"e97","subj":"영어","unit":"독해 삽입","q":"글의 흐름으로 보아 주어진 문장이 들어가기에 가장 적절한 곳은?\n\nThat result was a forest floor piled high with dead branches and dry leaves, which small, regular fires would once have burned away.\n\nFor years, parks in the region put out every forest fire as quickly as possible. (A) Managers believed that fire only destroyed and that a healthy forest was one that never burned. (B) Over time, however, this policy produced an unexpected result. (C) When a fire finally did break out, this thick layer of fuel made it far larger and hotter than any natural fire. (D) Today, managers deliberately set small, controlled fires to clear away the fuel before it becomes dangerous.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"주어진 문장은 불을 모두 끈 결과 마른 가지와 잎이 쌓였다는 내용이다. That result는 (B) 뒤 문장의 an unexpected result를 받아 그것을 구체적으로 풀어 주므로 그 문장보다 앞에 올 수 없고, (C) 뒤의 this thick layer of fuel이 바로 이 쌓인 가지와 잎을 가리키므로 (C)에 들어가야 한다."},
{"id":"e98","subj":"영어","unit":"독해 삽입","q":"글의 흐름으로 보아 주어진 문장이 들어가기에 가장 적절한 곳은?\n\nFor example, a nurse may notice that a patient is breathing a little faster than an hour ago.\n\nMachines in a modern hospital monitor patients around the clock. (A) Yet experienced nurses often detect trouble before any alarm sounds. (B) Such a small change may not be enough to trigger a monitor, but it can be the first sign of a serious problem. (C) By reporting it early, the nurse gives doctors time to act. (D) Technology is valuable, but it cannot replace the trained eye of a person at the bedside.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장은 경험 많은 간호사가 경보보다 먼저 이상을 알아챈다는 말의 예(For example)이므로 그 문장 뒤인 (B)에 온다. 바로 뒤의 Such a small change가 \"호흡이 조금 빨라진 것\"을 가리킨다는 점도 단서다."},
{"id":"e99","subj":"영어","unit":"독해 삽입","q":"글의 흐름으로 보아 주어진 문장이 들어가기에 가장 적절한 곳은?\n\nIt continues to follow the time at home, so you feel sleepy at noon and wide awake at midnight.\n\nWhen you fly across several time zones, your body clock does not reset at once. (A) Fortunately, there are ways to help it adjust. (B) Light is the most powerful signal for resetting the clock, so spending time outdoors in daylight is especially useful. (C) Eating meals at local times and avoiding long daytime naps also speed up the adjustment. (D) Even so, most travelers need several days to recover completely.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"주어진 문장의 It은 첫 문장의 your body clock을 가리키며, 체내 시계가 바로 맞춰지지 않는다는 말을 구체적으로 설명한다. 그 뒤에 Fortunately로 해결 방법이 이어지므로 (A)가 알맞다. (B) 이후는 모두 적응을 돕는 방법이어서 증상을 말하는 문장이 들어갈 수 없다."},
{"id":"e100","subj":"영어","unit":"독해 삽입","q":"글의 흐름으로 보아 주어진 문장이 들어가기에 가장 적절한 곳은?\n\nUnlike the warning signs, this playful idea worked.\n\nA small town wanted to reduce litter in its central park. (A) At first, officials put up signs warning that anyone caught littering would be fined. (B) Few people were ever caught, however, and the park remained as dirty as before. (C) Then the town tried a different approach: it painted bright green footprints on the ground leading to each trash can. (D) Within weeks, the amount of litter fell by almost half, without a single fine being issued.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장의 this playful idea는 쓰레기통으로 이어지는 초록 발자국을 그린 일을 가리키므로 그 내용이 나온 뒤인 (D)에 와야 한다. 효과가 있었다(worked)는 말 뒤에 쓰레기가 절반 가까이 줄었다는 구체적인 결과가 이어진다."},
{"id":"h01","subj":"한국사","unit":"조선 후기","q":"조선 후기에 집집마다 토산물로 부과하던 공납을 토지 결수에 따라 쌀, 베, 동전 등으로 내게 한 제도는?","opts":["균역법","대동법","영정법","호포법"],"ans":1,"exp":"대동법은 광해군 때 경기도에서 처음 시행되어 점차 확대되었다. 토지를 기준으로 부과하여 농민 부담을 줄였고, 공인이 등장해 상품 화폐 경제가 발달하는 계기가 되었다. 균역법은 군포를 1필로 줄인 제도, 영정법은 전세를 1결당 4~6두로 고정한 제도이다."},
{"id":"h02","subj":"한국사","unit":"고려 전기","q":"고려 광종의 정책으로 옳은 것은?","opts":["노비안검법을 실시하였다.","12목에 지방관을 파견하였다.","훈요 10조를 남겼다.","전시과 제도를 처음 시행하였다."],"ans":0,"exp":"광종은 노비안검법으로 호족의 경제적, 군사적 기반을 약화하고 과거제를 실시해 왕권을 강화하였다. 12목에 지방관을 파견한 왕은 성종, 훈요 10조를 남긴 왕은 태조, 전시과를 처음 시행한 왕은 경종이다."},
{"id":"h03","subj":"한국사","unit":"일제 강점기","q":"3·1 운동을 계기로 일어난 일로 옳은 것은?","opts":["대한민국 임시 정부가 수립되었다.","독립 협회가 창립되었다.","신민회가 조직되었다.","국채 보상 운동이 시작되었다."],"ans":0,"exp":"1919년 3·1 운동을 계기로 독립운동을 체계적으로 이끌 지도부의 필요성이 커져 같은 해 상하이에서 대한민국 임시 정부가 수립되었다. 독립 협회는 1896년, 신민회와 국채 보상 운동은 1907년의 일이다."},
{"id":"h04","subj":"한국사","unit":"삼국 시대","q":"신라 진흥왕의 업적으로 옳은 것은?","opts":["화랑도를 국가적 조직으로 개편하였다.","율령을 반포하였다.","국학을 설립하였다.","우산국을 정벌하였다."],"ans":0,"exp":"진흥왕은 화랑도를 국가 조직으로 개편하고 한강 유역을 차지했으며 순수비를 세웠다. 율령 반포는 법흥왕, 국학 설립은 신문왕, 우산국 정벌은 지증왕 때의 일이다."},
{"id":"h05","subj":"한국사","unit":"선사·고조선","q":"신석기 시대의 생활 모습으로 옳은 것은?","opts":["빗살무늬 토기를 만들어 식량을 저장하였다.","고인돌을 만들어 지배자의 무덤으로 삼았다.","철제 농기구를 사용하여 농사를 지었다.","주먹도끼를 만들어 쓰며 동굴에서 살았다."],"ans":0,"exp":"신석기 시대에는 농경과 정착 생활이 시작되어 빗살무늬 토기에 식량을 저장하고 조리하였다. 고인돌은 청동기 시대, 철제 농기구는 철기 시대, 주먹도끼와 동굴 생활은 구석기 시대의 모습이다."},
{"id":"h06","subj":"한국사","unit":"선사·고조선","q":"비파형 동검과 민무늬 토기를 사용하던 시대에 대한 설명으로 옳은 것은?","opts":["가락바퀴와 뼈바늘을 처음 사용하였다.","사유 재산이 생기고 계급이 나타났다.","슴베찌르개를 만들어 사냥에 썼다.","명도전 같은 중국 화폐를 사용하였다."],"ans":1,"exp":"비파형 동검과 민무늬 토기는 청동기 시대의 대표 유물이다. 이 시대에는 농업 생산력이 늘어 사유 재산과 계급이 생기고 군장이 등장하였다. 가락바퀴와 뼈바늘은 신석기 시대, 슴베찌르개는 구석기 시대, 명도전은 철기 시대의 것이다."},
{"id":"h07","subj":"한국사","unit":"선사·고조선","q":"다음 법이 시행된 나라에 대한 설명으로 옳은 것은?\n\n사람을 죽인 자는 즉시 죽인다. 남에게 상처를 입힌 자는 곡식으로 갚는다. 도둑질한 자는 노비로 삼는데, 용서받으려면 한 사람당 50만 전을 내야 한다.","opts":["영고라는 제천 행사를 열었다.","위만이 준왕을 몰아내고 왕이 되었다.","소도라는 신성 지역을 두었다.","책화라는 풍습이 있었다."],"ans":1,"exp":"제시된 법은 고조선의 8조법 가운데 전해지는 세 조항이다. 고조선에서는 기원전 2세기에 위만이 준왕을 몰아내고 왕위를 차지하였다. 영고는 부여, 소도는 삼한, 책화는 동예의 것이다."},
{"id":"h08","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n은력 정월에 하늘에 제사를 지내는데, 온 나라 사람이 모여 날마다 먹고 마시며 노래하고 춤춘다. 이를 영고라 한다. 가뭄이나 장마가 이어져 곡식이 익지 않으면 그 허물을 왕에게 돌렸다.","opts":["민며느리제라는 혼인 풍습이 있었다.","무천이라는 제천 행사를 열었다.","도둑질한 자에게 물건값의 12배를 물게 하였다.","신지, 읍차 등의 군장이 다스렸다."],"ans":2,"exp":"영고는 부여의 제천 행사이다. 부여에는 남의 물건을 훔치면 12배로 갚게 하는 1책 12법이 있었다. 민며느리제는 옥저, 무천은 동예, 신지와 읍차는 삼한의 것이다."},
{"id":"h09","subj":"한국사","unit":"초기 국가","q":"동예에 대한 설명으로 옳은 것은?","opts":["다른 부족의 영역을 침범하면 노비나 소, 말로 갚게 하였다.","가족이 죽으면 뼈를 추려 큰 목곽에 함께 안치하였다.","제가 회의에서 나라의 중요한 일을 결정하였다.","천군이라는 제사장이 소도를 다스렸다."],"ans":0,"exp":"동예에는 다른 부족의 생활 영역을 침범하면 노비나 소, 말로 배상하게 하는 책화가 있었다. 가족 공동 무덤은 옥저, 제가 회의는 고구려, 천군과 소도는 삼한의 것이다."},
{"id":"h10","subj":"한국사","unit":"초기 국가","q":"삼한에 대한 설명으로 옳지 않은 것은?","opts":["5월과 10월에 계절제를 지냈다.","서옥제라는 혼인 풍습이 있었다.","변한은 철을 낙랑과 왜에 수출하였다.","신지, 읍차 등으로 불린 군장이 있었다."],"ans":1,"exp":"서옥제는 혼인 뒤 신랑이 신부 집 뒤꼍의 작은 집(서옥)에서 살던 고구려의 풍습이다. 삼한에서는 씨를 뿌린 5월과 추수를 마친 10월에 계절제를 지냈고, 변한은 철이 풍부하여 낙랑과 왜에 수출하였다. 신지와 읍차는 삼한의 군장이다."},
{"id":"h11","subj":"한국사","unit":"선사·고조선","q":"구석기 시대에 대한 설명으로 옳은 것은?","opts":["강가나 바닷가에 움집을 짓고 정착하였다.","거친무늬 거울을 의례에 사용하였다.","조, 피 등을 재배하는 농사를 시작하였다.","무리를 이루어 옮겨 다니며 사냥과 채집을 하였다."],"ans":3,"exp":"구석기 시대 사람들은 뗀석기를 쓰며 무리 지어 이동 생활을 하고 사냥과 채집으로 먹을거리를 얻었다. 움집에서의 정착 생활과 조, 피 농사는 신석기 시대, 거친무늬 거울은 청동기 시대의 것이다."},
{"id":"h12","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n혼인할 때에는 말로 미리 정하고, 여자의 집에서 큰 집 뒤에 작은 집을 짓는데 이를 서옥이라 한다. 10월에 하늘에 제사를 지내며 온 나라가 크게 모이는데, 이를 동맹이라 한다.","opts":["단궁, 과하마, 반어피가 특산물이었다.","대가들이 사자, 조의, 선인을 거느렸다.","철이 많이 나서 화폐처럼 사용하였다.","읍군, 삼로라는 군장이 읍락을 다스렸다."],"ans":1,"exp":"서옥제와 동맹은 고구려의 풍습과 제천 행사이다. 고구려에서는 왕 아래 상가, 고추가 등의 대가들이 저마다 사자, 조의, 선인이라는 관리를 거느렸다. 단궁, 과하마, 반어피는 동예의 특산물이고, 철을 화폐처럼 쓴 곳은 변한이며, 읍군과 삼로는 옥저와 동예의 군장이다."},
{"id":"h13","subj":"한국사","unit":"삼국 시대","q":"고구려 광개토 대왕의 업적으로 옳은 것은?","opts":["신라에 침입한 왜를 물리쳤다.","평양으로 도읍을 옮겼다.","율령을 반포하고 태학을 세웠다.","진대법을 실시하였다."],"ans":0,"exp":"광개토 대왕은 신라의 요청을 받아 군대를 보내 신라에 침입한 왜를 물리쳤고, 영락이라는 연호를 사용하였다. 평양 천도는 장수왕, 율령 반포와 태학 설립은 소수림왕, 진대법 실시는 고국천왕 때의 일이다."},
{"id":"h14","subj":"한국사","unit":"삼국 시대","q":"고구려 장수왕 때의 사실로 옳은 것은?","opts":["백제의 수도 한성을 함락하였다.","낙랑군을 몰아냈다.","살수에서 수의 군대를 크게 물리쳤다.","천리장성을 쌓기 시작하였다."],"ans":0,"exp":"장수왕은 평양으로 도읍을 옮기고 남진 정책을 펴 475년 백제의 한성을 함락하고 개로왕을 죽였다. 낙랑군 축출은 미천왕, 살수 대첩은 영양왕, 천리장성 축조 시작은 영류왕 때의 일이다."},
{"id":"h15","subj":"한국사","unit":"삼국 시대","q":"__이 왕__의 업적으로 옳은 것은?\n\n백제의 __이 왕__은 마한의 남은 세력을 정복하여 남해안까지 영토를 넓혔고, 고구려의 평양성을 공격하여 고국원왕을 전사시켰다.","opts":["사비로 도읍을 옮기고 국호를 남부여로 바꾸었다.","고흥에게 『서기』를 편찬하게 하였다.","22담로에 왕족을 파견하였다.","동진에서 불교를 받아들였다."],"ans":1,"exp":"밑줄 친 왕은 4세기 백제의 전성기를 이끈 근초고왕이다. 근초고왕 때 박사 고흥이 역사서 『서기』를 편찬하였다. 사비 천도와 남부여 개칭은 성왕, 22담로에 왕족을 파견한 왕은 무령왕, 불교 수용은 침류왕 때의 일이다."},
{"id":"h16","subj":"한국사","unit":"삼국 시대","q":"백제 성왕 때의 사실로 옳은 것은?","opts":["고구려의 공격을 받아 웅진으로 도읍을 옮겼다.","익산에 미륵사를 세웠다.","신라의 대야성을 빼앗았다.","신라와 연합하여 한강 하류 지역을 일시 되찾았다."],"ans":3,"exp":"성왕은 사비로 도읍을 옮기고 신라 진흥왕과 연합하여 한강 하류 지역을 되찾았으나, 곧 신라에 빼앗기고 관산성 전투에서 전사하였다. 웅진 천도는 문주왕, 미륵사 창건은 무왕, 대야성 함락은 의자왕 때의 일이다."},
{"id":"h17","subj":"한국사","unit":"삼국 시대","q":"신라 법흥왕 때의 사실로 옳은 것은?","opts":["이차돈의 순교를 계기로 불교를 공인하였다.","국호를 신라로 정하고 왕이라는 칭호를 썼다.","황룡사 9층 목탑을 세웠다.","대가야를 정복하였다."],"ans":0,"exp":"법흥왕은 병부를 설치하고 율령을 반포했으며, 이차돈의 순교를 계기로 불교를 공인하고 금관가야를 병합하였다. 국호 신라와 왕 칭호 사용은 지증왕, 황룡사 9층 목탑 건립은 선덕 여왕, 대가야 정복은 진흥왕 때의 일이다."},
{"id":"h18","subj":"한국사","unit":"삼국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 고구려가 평양으로 도읍을 옮겼다.\n(나) 백제가 웅진으로 도읍을 옮겼다.\n(다) 신라가 대가야를 정복하였다.\n(라) 고구려가 태학을 설립하였다.","opts":["(가) - (라) - (나) - (다)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)","(가) - (나) - (라) - (다)"],"ans":1,"exp":"태학 설립은 소수림왕 때인 372년, 평양 천도는 장수왕 때인 427년, 웅진 천도는 475년, 대가야 정복은 진흥왕 때인 562년이다. 백제의 웅진 천도는 장수왕의 남진으로 한성이 함락된 결과이므로 평양 천도보다 뒤이다."},
{"id":"h19","subj":"한국사","unit":"삼국 시대","q":"백제 부흥 운동에 대한 설명으로 옳은 것은?","opts":["검모잠이 안승을 왕으로 받들었다.","안시성에서 당 태종의 군대를 물리쳤다.","복신과 도침이 주류성에서 왕자 풍을 왕으로 맞이하였다.","계백의 결사대가 황산벌에서 싸웠다."],"ans":2,"exp":"백제가 멸망한 뒤 복신과 도침은 주류성에서, 흑치상지는 임존성에서 부흥 운동을 일으켰고, 왜에 있던 왕자 풍을 왕으로 맞이하였다. 검모잠과 안승은 고구려 부흥 운동, 안시성 싸움은 645년 고구려와 당의 전쟁, 황산벌 전투는 백제 멸망 직전의 일이다."},
{"id":"h20","subj":"한국사","unit":"삼국 시대","q":"금관가야에 대한 설명으로 옳은 것은?","opts":["진흥왕 때 신라에 병합되었다.","김해 지역에서 성장하여 전기 가야 연맹을 이끌었다.","고령 지산동 고분군을 남겼다.","후기 가야 연맹의 중심이었다."],"ans":1,"exp":"금관가야는 김해 지역에서 풍부한 철과 해상 교역을 바탕으로 전기 가야 연맹을 이끌었고, 법흥왕 때인 532년 신라에 병합되었다. 진흥왕 때 병합된 나라, 고령 지산동 고분군을 남긴 나라, 후기 가야 연맹의 중심은 모두 대가야이다."},
{"id":"h21","subj":"한국사","unit":"삼국 시대","q":"백제 무령왕릉에 대한 설명으로 옳은 것은?","opts":["도굴이 어려운 돌무지덧널무덤이다.","널방 벽에 사신도가 그려져 있다.","중국 남조의 영향을 받은 벽돌무덤이다.","돌을 계단식으로 쌓은 돌무지무덤이다."],"ans":2,"exp":"공주에 있는 무령왕릉은 중국 남조의 영향을 받아 벽돌을 쌓아 만든 무덤으로, 무덤 주인을 알려 주는 지석이 나왔다. 돌무지덧널무덤은 신라의 천마총 등이고, 사신도 벽화는 고구려 강서대묘가 대표적이며, 계단식 돌무지무덤은 고구려 장군총과 백제 석촌동 고분이다."},
{"id":"h22","subj":"한국사","unit":"삼국 시대","q":"삼국의 문화가 일본에 전해진 내용으로 옳은 것은?","opts":["백제의 혜자가 쇼토쿠 태자의 스승이 되었다.","신라의 왕인이 『천자문』과 『논어』를 전하였다.","고구려의 담징이 종이와 먹 만드는 법을 전하였다.","고구려의 노리사치계가 불경과 불상을 전하였다."],"ans":2,"exp":"『일본서기』에 따르면 고구려의 승려 담징은 610년 일본에 건너가 종이와 먹 만드는 법을 전하였다. 쇼토쿠 태자의 스승이 된 혜자는 고구려의 승려이고, 『천자문』과 『논어』를 전한 왕인과 불경, 불상을 전한 노리사치계는 백제 사람이다."},
{"id":"h23","subj":"한국사","unit":"삼국 시대","q":"다음 제도가 있던 나라의 사회 모습으로 옳은 것은?\n\n나라에 큰일이 있으면 반드시 여러 사람이 모여 의논하였다. 이를 화백이라 하는데, 한 사람이라도 반대하면 결정하지 못하였다.","opts":["정사암에 모여 재상을 뽑았다.","제가 회의에서 중대한 범죄자를 처벌하였다.","경당에서 청소년에게 글과 활쏘기를 가르쳤다.","골품에 따라 오를 수 있는 관등에 한계가 있었다."],"ans":3,"exp":"화백 회의는 신라의 귀족 회의로 만장일치로 나랏일을 결정하였다. 신라에서는 골품에 따라 관등 승진의 상한과 일상생활까지 제한을 받았다. 정사암 회의는 백제, 제가 회의와 경당은 고구려의 것이다."},
{"id":"h24","subj":"한국사","unit":"삼국 시대","q":"다음 시가 지어진 전쟁에 대한 설명으로 옳은 것은?\n\n신묘한 계책은 하늘의 이치를 다하였고, 기묘한 꾀는 땅의 이치를 꿰뚫었네. 싸움에 이겨 공이 이미 높으니, 만족함을 알고 그만두기를 바라노라.","opts":["안시성의 군민이 당의 군대를 물리쳤다.","당이 평양에 안동 도호부를 설치하였다.","위의 관구검이 환도성을 함락하였다.","수의 별동대가 살수에서 크게 패하였다."],"ans":3,"exp":"제시된 시는 을지문덕이 수의 장수 우중문에게 보낸 것이다. 612년 을지문덕은 평양성 가까이 쳐들어온 수의 별동대를 살수에서 크게 무찔렀다(살수 대첩). 안시성 싸움은 645년 당과의 전쟁, 안동 도호부 설치는 고구려 멸망 뒤, 관구검의 침입은 3세기 동천왕 때의 일이다."},
{"id":"h25","subj":"한국사","unit":"남북국 시대","q":"신라 신문왕의 정책으로 옳은 것은?","opts":["독서삼품과를 실시하였다.","청해진을 설치하였다.","백성에게 정전을 지급하였다.","관료전을 지급하고 녹읍을 폐지하였다."],"ans":3,"exp":"신문왕은 김흠돌의 난을 진압하고 왕권을 강화했으며, 관료전을 지급하고 녹읍을 폐지하여 귀족의 경제 기반을 약화하였다. 독서삼품과는 원성왕, 청해진 설치는 흥덕왕, 정전 지급은 성덕왕 때의 일이다."},
{"id":"h26","subj":"한국사","unit":"남북국 시대","q":"__이 왕__ 때의 사실로 옳은 것은?\n\n발해의 __이 왕__은 당이 흑수 말갈과 손잡고 발해를 압박하자, 장문휴를 보내 당의 등주를 공격하게 하였다.","opts":["상경 용천부로 도읍을 옮겼다.","인안이라는 연호를 사용하였다.","해동성국이라고 불렸다.","대흥이라는 연호를 사용하였다."],"ans":1,"exp":"밑줄 친 왕은 대조영의 뒤를 이은 무왕(대무예)으로, 인안이라는 독자 연호를 썼다. 상경 천도와 대흥 연호는 문왕, 해동성국이라 불릴 만큼 전성기를 이룬 것은 선왕 때의 일이다."},
{"id":"h27","subj":"한국사","unit":"남북국 시대","q":"발해에 대한 설명으로 옳은 것은?","opts":["상수리 제도로 지방 세력을 견제하였다.","9서당과 10정의 군사 조직을 두었다.","지방을 9주 5소경으로 정비하였다.","주자감을 두어 유학을 가르쳤다."],"ans":3,"exp":"발해는 중앙에 최고 교육 기관인 주자감을 두어 귀족 자제에게 유학을 가르쳤다. 상수리 제도, 9서당 10정, 9주 5소경은 모두 통일 신라의 제도이다. 발해의 지방은 5경 15부 62주로 조직되었다."},
{"id":"h28","subj":"한국사","unit":"남북국 시대","q":"원종과 애노의 난이 일어난 무렵 신라의 상황으로 옳은 것은?","opts":["6두품 일부가 골품제를 비판하며 호족과 손잡았다.","집사부 시중의 권한이 강해지고 상대등의 힘이 약해졌다.","녹읍이 폐지되어 귀족의 경제 기반이 약해졌다.","진골 출신이 처음으로 왕위에 올랐다."],"ans":0,"exp":"원종과 애노의 난은 신라 하대인 9세기 말 진성 여왕 때 일어났다. 이 시기에는 지방에서 호족이 성장하였고, 6두품 일부는 골품제를 비판하며 호족과 연계하였다. 시중 권한 강화와 녹읍 폐지는 신라 중대의 모습이고, 진골 출신으로 처음 왕이 된 사람은 중대를 연 무열왕이다."},
{"id":"h29","subj":"한국사","unit":"남북국 시대","q":"신라의 승려 의상에 대한 설명으로 옳은 것은?","opts":["무애가를 지어 불교의 대중화에 힘썼다.","인도를 다녀와 『왕오천축국전』을 썼다.","부석사를 세우고 화엄 사상을 정립하였다.","『십문화쟁론』을 지어 종파 간 대립을 풀려 하였다."],"ans":2,"exp":"의상은 당에서 화엄학을 공부하고 돌아와 부석사를 세우고 화엄 사상을 정립했으며, 「화엄일승법계도」를 지었다. 무애가와 『십문화쟁론』은 원효, 『왕오천축국전』은 혜초와 관련된 것이다."},
{"id":"h30","subj":"한국사","unit":"남북국 시대","q":"궁예에 대한 설명으로 옳은 것은?","opts":["완산주에 도읍을 정하고 나라를 세웠다.","신라에 쳐들어가 경애왕을 죽게 하였다.","후당과 오월에 사신을 보내 외교 관계를 맺었다.","국호를 마진으로 바꾸고 철원으로 도읍을 옮겼다."],"ans":3,"exp":"궁예는 송악에서 후고구려를 세운 뒤 국호를 마진으로 바꾸고 철원으로 도읍을 옮겼으며, 다시 국호를 태봉으로 고쳤다. 완산주에 도읍한 것, 경애왕을 죽게 한 것, 후당과 오월에 사신을 보낸 것은 모두 후백제 견훤의 활동이다."},
{"id":"h31","subj":"한국사","unit":"고려 전기","q":"고려 태조의 정책으로 옳은 것은?","opts":["과거제를 처음 실시하였다.","최승로의 시무 28조를 받아들였다.","사심관 제도와 기인 제도를 실시하였다.","전시과 제도를 처음 시행하였다."],"ans":2,"exp":"태조는 호족을 견제하고 지방을 통제하려고 사심관 제도와 기인 제도를 실시했으며, 혼인 정책과 사성 정책으로 호족을 포섭하였다. 과거제 실시는 광종, 시무 28조 수용은 성종, 전시과의 첫 시행은 경종 때의 일이다."},
{"id":"h32","subj":"한국사","unit":"고려 전기","q":"다음 건의를 받아들인 왕의 정책으로 옳은 것은?\n\n불교 행사에 드는 비용이 너무 많으니 줄이소서. 또 지방의 호족이 백성을 괴롭히고 있으니, 청컨대 지방관을 두소서.","opts":["광덕, 준풍 등의 연호를 사용하였다.","12목을 설치하고 지방관을 파견하였다.","북쪽 국경에 천리장성을 쌓았다.","흑창을 두어 가난한 백성을 구제하였다."],"ans":1,"exp":"제시된 글은 최승로가 성종에게 올린 시무 28조의 내용이다. 성종은 이를 받아들여 12목에 지방관을 파견하고 유교 정치 이념에 따라 제도를 정비하였다. 광덕, 준풍 연호는 광종, 천리장성 축조는 덕종에서 정종(靖宗) 때, 흑창 설치는 태조 때의 일이다."},
{"id":"h33","subj":"한국사","unit":"고려 전기","q":"고려의 정치 기구에 대한 설명으로 옳은 것은?","opts":["중추원은 화폐와 곡식의 출납과 회계를 맡았다.","어사대는 관리의 비리를 감찰하였다.","도병마사는 법과 제도를 논의하여 정하였다.","삼사는 왕의 잘못을 비판하는 언론 기구였다."],"ans":1,"exp":"어사대는 정치의 잘잘못을 논하고 관리의 비리를 감찰하였다. 화폐와 곡식의 출납, 회계는 삼사가 맡았고 중추원은 군사 기밀과 왕명 출납을 맡았다. 법과 제도를 논의한 기구는 식목도감이며 도병마사는 국방 문제를 다루었다. 삼사가 언론 기능을 맡은 것은 조선 시대이다."},
{"id":"h34","subj":"한국사","unit":"고려 전기","q":"거란의 1차 침입 때 서희가 외교 담판으로 얻은 결과로 옳은 것은?","opts":["동북 9성을 쌓았다.","귀주에서 큰 승리를 거두었다.","쌍성총관부를 되찾았다.","강동 6주를 확보하였다."],"ans":3,"exp":"993년 거란의 소손녕이 침입하자 서희는 담판을 벌여 거란과 교류할 것을 약속하고 압록강 동쪽의 강동 6주를 확보하였다. 동북 9성은 윤관이 여진을 정벌하고 쌓았고, 귀주 대첩은 거란의 3차 침입 때 강감찬이 거둔 승리이며, 쌍성총관부 수복은 공민왕 때의 일이다."},
{"id":"h35","subj":"한국사","unit":"고려 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 이자겸의 난\n(나) 무신 정변\n(다) 귀주 대첩\n(라) 묘청의 서경 천도 운동","opts":["(다) - (라) - (가) - (나)","(가) - (다) - (라) - (나)","(다) - (가) - (나) - (라)","(다) - (가) - (라) - (나)"],"ans":3,"exp":"귀주 대첩은 1019년, 이자겸의 난은 1126년, 묘청의 서경 천도 운동은 1135년, 무신 정변은 1170년이다. 이자겸의 난으로 개경의 궁궐이 불타고 왕권이 약해진 뒤 서경 천도 운동이 일어났고, 이후 문벌 사회의 모순이 깊어져 무신 정변으로 이어졌다."},
{"id":"h36","subj":"한국사","unit":"고려 전기","q":"다음 주장을 편 세력이 일으킨 사건에 대한 설명으로 옳은 것은?\n\n서경 임원역의 땅은 풍수에서 말하는 큰 명당입니다. 이곳에 궁궐을 짓고 옮겨 가시면 천하를 아우를 수 있고, 금이 스스로 항복할 것입니다. 황제를 칭하고 연호를 정하소서.","opts":["김부식이 이끄는 관군에게 진압되었다.","만적이 신분 해방을 내세워 봉기를 꾀하였다.","최충헌이 이의민을 없애고 권력을 잡았다.","이성계가 위화도에서 군대를 돌렸다."],"ans":0,"exp":"제시된 글은 묘청 등 서경 세력의 주장이다. 묘청은 서경 천도와 칭제 건원, 금 정벌을 주장하다가 1135년 서경에서 난을 일으켰으나 김부식이 이끈 관군에게 진압되었다. 만적의 봉기 시도와 최충헌의 집권은 무신 집권기, 위화도 회군은 고려 말의 일이다."},
{"id":"h37","subj":"한국사","unit":"고려 후기","q":"최우가 권력을 잡았던 시기의 사실로 옳은 것은?","opts":["교정도감을 처음 설치하였다.","정방을 설치하여 인사권을 장악하였다.","중방이 최고 권력 기구 역할을 하였다.","봉사 10조를 올려 개혁을 건의하였다."],"ans":1,"exp":"최우는 자기 집에 정방을 설치하여 인사권을 장악하고, 몽골이 침입하자 강화도로 도읍을 옮겼다. 교정도감 설치와 봉사 10조 건의는 최충헌이 한 일이고, 중방이 권력의 중심이던 때는 정중부 등 무신 정권 초기이다."},
{"id":"h38","subj":"한국사","unit":"고려 후기","q":"무신 집권기에 일어난 봉기에 대한 설명으로 옳은 것은?","opts":["김사미와 효심은 서경에서 봉기하였다.","만적은 전주의 관노비를 이끌고 봉기하였다.","조위총은 신라 부흥을 내세우며 봉기하였다.","망이·망소이는 공주 명학소에서 봉기하였다."],"ans":3,"exp":"망이·망소이는 특수 행정 구역인 공주 명학소에서 지나친 수탈에 저항하여 봉기하였다. 김사미와 효심은 경상도의 운문과 초전에서 봉기하였고, 만적은 개경에서 사노비들을 모아 봉기를 꾀하였다. 조위총은 서경 유수로서 무신 정권에 반대하여 군사를 일으켰다."},
{"id":"h39","subj":"한국사","unit":"고려 후기","q":"고려가 몽골의 침입에 맞서 싸우던 시기의 사실로 옳은 것은?","opts":["초조대장경을 새기기 시작하였다.","『직지심체요절』을 금속 활자로 찍었다.","팔만대장경을 새겼다.","최충이 9재 학당을 세웠다."],"ans":2,"exp":"고려는 몽골의 침입으로 초조대장경이 불타자 강화도에서 부처의 힘으로 몽골을 물리치기를 바라며 팔만대장경을 새겼다. 초조대장경은 거란의 침입 때 새기기 시작했고, 『직지심체요절』은 고려 말인 1377년에 간행되었으며, 9재 학당은 문종 때 세워졌다."},
{"id":"h40","subj":"한국사","unit":"고려 후기","q":"삼별초에 대한 설명으로 옳지 않은 것은?","opts":["윤관의 건의에 따라 여진 정벌을 위해 만들어졌다.","최우가 설치한 야별초에서 비롯되었다.","개경 환도에 반대하여 봉기하였다.","진도와 제주도로 근거지를 옮기며 싸웠다."],"ans":0,"exp":"윤관의 건의로 여진 정벌을 위해 만든 부대는 별무반이다. 삼별초는 최우가 만든 야별초에서 비롯된 좌별초, 우별초와 신의군으로 이루어졌으며, 고려 정부가 몽골과 강화하고 개경으로 돌아가자 이에 반대하여 진도와 제주도로 옮겨 가며 항쟁하였다."},
{"id":"h41","subj":"한국사","unit":"고려 후기","q":"원 간섭기 고려의 모습으로 옳은 것은?","opts":["2성 6부 체제가 처음 갖추어졌다.","왕의 묘호에 '조'와 '종'을 붙이기 시작하였다.","정동행성의 이문소가 내정에 간섭하였다.","거란의 침입에 대비하여 광군을 조직하였다."],"ans":2,"exp":"원 간섭기에는 일본 원정을 위해 설치한 정동행성이 남아 그 부속 기구인 이문소가 고려의 내정에 간섭하였다. 이 시기에 2성은 첨의부로, 6부는 4사로 격이 낮아졌고 왕의 호칭도 '충○왕'으로 낮추어졌다. 광군은 고려 초 정종(定宗) 때 조직되었다."},
{"id":"h42","subj":"한국사","unit":"고려 후기","q":"공민왕의 개혁 정책으로 옳은 것은?","opts":["과전법을 실시하였다.","정치도감을 설치하였다.","신돈을 등용하고 전민변정도감을 설치하였다.","사림원을 설치하였다."],"ans":2,"exp":"공민왕은 신돈을 등용하고 전민변정도감을 설치하여 권문세족이 빼앗은 토지와 노비를 본래대로 돌려놓으려 하였다. 과전법은 공양왕 때인 1391년에 실시되었고, 정치도감은 충목왕, 사림원은 충선왕 때 설치된 개혁 기구이다."},
{"id":"h43","subj":"한국사","unit":"고려 전기","q":"고려의 전시과에 대한 설명으로 옳은 것은?","opts":["지급 대상 토지를 경기 지방으로 한정하였다.","수신전, 휼양전의 이름으로 세습을 허용하였다.","관리에게 전지와 시지의 수조권을 지급하였다.","후삼국 통일에 공을 세운 사람에게 인품과 공로를 따져 지급하였다."],"ans":2,"exp":"전시과는 관리에게 등급에 따라 곡물을 거둘 수 있는 전지와 땔감을 얻을 수 있는 시지의 수조권을 준 제도이다. 경기 지방으로 한정한 것과 수신전, 휼양전은 과전법의 내용이고, 통일에 공을 세운 사람에게 인품과 공로에 따라 준 토지는 태조 때의 역분전이다."},
{"id":"h44","subj":"한국사","unit":"고려 전기","q":"고려 시대의 가족 제도와 풍속에 대한 설명으로 옳은 것은?","opts":["혼인 뒤 곧바로 남자 집에서 사는 것이 일반적이었다.","제사는 반드시 맏아들이 지냈다.","재혼한 여성의 자손은 벼슬길이 법으로 막혔다.","재산은 아들딸 구별 없이 고르게 상속되었다."],"ans":3,"exp":"고려 시대에는 재산을 자녀에게 고르게 나누어 주었고, 아들이 없으면 딸이 제사를 지냈으며, 혼인 뒤 남자가 여자 집에서 사는 일이 많았다. 남자 집에서 혼인 생활을 하는 친영과 맏아들 중심의 제사는 조선 후기에 자리 잡았고, 재혼한 여성의 자손에 대한 관직 제한은 조선 성종 때 법으로 정해졌다."},
{"id":"h45","subj":"한국사","unit":"고려 후기","q":"지눌에 대한 설명으로 옳은 것은?","opts":["해동 천태종을 창시하고 교관겸수를 주장하였다.","수선사 결사를 이끌며 정혜쌍수와 돈오점수를 주장하였다.","만덕사에서 백련 결사를 이끌며 참회 수행을 강조하였다.","유교와 불교가 다르지 않다는 유불 일치설을 주장하였다."],"ans":1,"exp":"지눌은 수선사 결사를 조직하여 불교 개혁에 힘썼고, 선과 교학을 함께 닦는 정혜쌍수와 깨달은 뒤에도 꾸준히 수행하는 돈오점수를 내세웠다. 해동 천태종과 교관겸수는 의천, 백련 결사는 요세, 유불 일치설은 혜심과 관련된 것이다."},
{"id":"h46","subj":"한국사","unit":"고려 후기","q":"『삼국유사』에 대한 설명으로 옳은 것은?","opts":["일연이 썼으며 단군의 건국 이야기를 실었다.","현재 전하는 우리나라의 가장 오래된 역사서이다.","동명왕의 업적을 서사시로 읊었다.","본기, 열전 등을 갖춘 기전체로 서술되었다."],"ans":0,"exp":"『삼국유사』는 원 간섭기에 승려 일연이 쓴 책으로, 불교사를 중심으로 설화와 전래 기록을 모았으며 단군의 건국 이야기를 실었다. 현존하는 가장 오래된 역사서이자 기전체로 쓰인 책은 김부식의 『삼국사기』이고, 동명왕의 업적을 서사시로 읊은 것은 이규보의 「동명왕편」이다."},
{"id":"h47","subj":"한국사","unit":"고려 후기","q":"고려 시대에 만들어진 문화유산으로 옳은 것은?","opts":["법주사 팔상전","부석사 무량수전","불국사 3층 석탑","원각사지 10층 석탑"],"ans":1,"exp":"영주 부석사 무량수전은 고려 시대의 대표적인 목조 건축으로 주심포 양식과 배흘림기둥으로 유명하다. 법주사 팔상전은 조선 후기, 불국사 3층 석탑은 통일 신라, 원각사지 10층 석탑은 조선 세조 때 만들어졌다."},
{"id":"h48","subj":"한국사","unit":"고려 후기","q":"고려 말 왜구의 침입에 맞선 활동으로 옳은 것은?","opts":["최무선이 화포를 써서 진포에서 왜구를 물리쳤다.","이종무가 쓰시마섬을 정벌하였다.","김종서가 6진을 개척하였다.","강감찬이 흥화진에서 적을 무찔렀다."],"ans":0,"exp":"고려 말 최무선은 화통도감에서 화약과 화포를 만들었고, 1380년 진포에서 화포로 왜구의 배를 불태웠다. 이종무의 쓰시마섬 정벌과 김종서의 6진 개척은 조선 세종 때의 일이고, 강감찬의 흥화진 전투는 거란의 3차 침입 때의 일이다."},
{"id":"h49","subj":"한국사","unit":"조선 전기","q":"조선 태종의 정책으로 옳은 것은?","opts":["『경국대전』을 완성하여 반포하였다.","6조 직계제를 실시하고 사병을 없앴다.","직전법을 실시하였다.","집현전을 설치하였다."],"ans":1,"exp":"태종은 6조가 의정부를 거치지 않고 왕에게 직접 보고하는 6조 직계제를 실시하고 사병을 없애 왕권을 강화했으며, 호패법을 시행하였다. 『경국대전』 완성은 성종, 직전법은 세조, 집현전 설치는 세종 때의 일이다."},
{"id":"h50","subj":"한국사","unit":"조선 전기","q":"조선 세종 때의 사실로 옳은 것은?","opts":["홍문관을 설치하였다.","전분 6등법과 연분 9등법을 시행하였다.","계미자를 주조하였다.","『동국통감』을 편찬하였다."],"ans":1,"exp":"세종은 토지의 비옥도에 따라 6등급, 그해 풍흉에 따라 9등급으로 나누어 전세를 거두는 공법을 마련하였다. 홍문관 설치와 『동국통감』 편찬은 성종, 계미자 주조는 태종 때의 일이다."},
{"id":"h51","subj":"한국사","unit":"조선 전기","q":"조선 세조의 정책으로 옳은 것은?","opts":["관청이 조세를 거두어 관리에게 나누어 주게 하였다.","의정부 서사제를 실시하였다.","현량과를 실시하여 사림을 등용하였다.","현직 관리에게만 수조권을 주는 직전법을 실시하였다."],"ans":3,"exp":"세조는 관리에게 줄 토지가 모자라자 현직 관리에게만 수조권을 주는 직전법을 실시하였고, 6조 직계제를 다시 시행하고 집현전을 없앴다. 관청이 조세를 거두어 나누어 주는 관수 관급제는 성종, 의정부 서사제는 세종, 현량과는 중종 때 조광조의 건의로 실시되었다."},
{"id":"h52","subj":"한국사","unit":"조선 전기","q":"조선의 통치 기구에 대한 설명으로 옳은 것은?","opts":["의금부는 수도의 행정과 치안을 맡았다.","춘추관은 외교 문서를 작성하였다.","사간원은 관리의 비리를 감찰하였다.","승정원은 왕명의 출납을 맡았다."],"ans":3,"exp":"승정원은 왕의 비서 기관으로 왕명의 출납을 맡았다. 수도의 행정과 치안은 한성부가 맡았고 의금부는 나라의 큰 죄인을 다스렸다. 춘추관은 역사서 편찬과 보관을, 외교 문서 작성은 승문원이 맡았다. 관리 감찰은 사헌부의 일이고 사간원은 왕에게 간쟁하는 일을 하였다."},
{"id":"h53","subj":"한국사","unit":"조선 전기","q":"김종직이 지은 「조의제문」을 김일손이 사초에 실은 것이 발단이 되어 일어난 사화는?","opts":["무오사화","갑자사화","기묘사화","을사사화"],"ans":0,"exp":"무오사화는 연산군 때인 1498년 「조의제문」이 사초에 실린 것을 빌미로 훈구 세력이 사림을 제거한 사건이다. 갑자사화는 연산군의 생모 윤씨 폐위 문제, 기묘사화는 중종 때 조광조의 개혁에 대한 훈구의 반발, 을사사화는 명종 때 외척 사이의 다툼으로 일어났다."},
{"id":"h54","subj":"한국사","unit":"조선 전기","q":"조광조의 활동으로 옳은 것은?","opts":["백운동 서원을 세웠다.","위훈 삭제를 주장하고 소격서를 없애자고 하였다.","『성학십도』를 지어 왕에게 올렸다.","『동호문답』에서 수미법을 주장하였다."],"ans":1,"exp":"조광조는 중종 때 등용되어 현량과 실시, 소격서 폐지, 위훈 삭제 등을 추진하다가 훈구 세력의 반발로 기묘사화 때 제거되었다. 백운동 서원은 주세붕이 세웠고, 『성학십도』는 이황, 『동호문답』은 이이의 저술이다."},
{"id":"h55","subj":"한국사","unit":"조선 전기","q":"이이에 대한 설명으로 옳은 것은?","opts":["『성학집요』를 지어 왕에게 올렸다.","『성학십도』를 지어 왕에게 올렸다.","예안 향약을 만들었다.","일본 성리학의 발전에 영향을 주었다."],"ans":0,"exp":"이이는 『성학집요』에서 현명한 신하가 왕에게 성학을 가르쳐 기질을 바꾸게 해야 한다고 하였고, 『동호문답』 등으로 개혁 방안을 제시하였다. 『성학십도』와 예안 향약은 이황의 것이며, 이황의 학문은 임진왜란 이후 일본 성리학에 영향을 주었다."},
{"id":"h56","subj":"한국사","unit":"조선 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 한산도 대첩\n(나) 행주 대첩\n(다) 명량 해전\n(라) 충주 탄금대 전투","opts":["(가) - (라) - (나) - (다)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)","(라) - (가) - (다) - (나)"],"ans":1,"exp":"1592년 4월 신립이 충주 탄금대에서 패하여 선조가 피란하였고, 같은 해 7월 이순신이 한산도에서 크게 이겼다. 행주 대첩은 1593년 2월 권율이 거둔 승리이고, 명량 해전은 정유재란 때인 1597년의 일이다."},
{"id":"h57","subj":"한국사","unit":"조선 전기","q":"조선 전기의 경제 상황으로 옳은 것은?","opts":["상평통보가 전국에서 널리 쓰였다.","모내기법이 전국으로 퍼져 벼와 보리의 이모작이 늘었다.","도고가 성장하여 물건을 매점하였다.","시전 상인이 관청에 물품을 대고 특정 상품의 독점 판매권을 얻었다."],"ans":3,"exp":"조선 전기에 정부는 한양 종로에 시전을 두고, 시전 상인에게 왕실과 관청에 물품을 공급하는 대신 특정 상품을 독점하여 팔 권리를 주었다. 상평통보의 전국적 유통, 모내기법의 전국 보급, 도고의 성장은 모두 조선 후기의 모습이다."},
{"id":"h58","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 편찬된 책에 대한 설명으로 옳은 것은?","opts":["『동의보감』: 전통 의학을 집대성하였다.","『동국여지승람』: 각 도의 지리와 풍속을 정리하였다.","『국조오례의』: 국가 행사의 의례를 정리하였다.","『농사직설』: 우리 풍토에 맞는 농사법을 정리하였다."],"ans":3,"exp":"『농사직설』은 세종 때 정초 등이 농민의 경험을 모아 우리 풍토에 맞는 농사법을 정리한 책이다. 『동의보감』은 허준이 광해군 때 완성하였고, 『동국여지승람』과 『국조오례의』는 성종 때 완성되었다."},
{"id":"h59","subj":"한국사","unit":"조선 전기","q":"조선 시대의 서원에 대한 설명으로 옳은 것은?","opts":["중앙에서 교수나 훈도를 보낸 지방의 관립 교육 기관이다.","생원과 진사에게 입학 자격을 준 최고 교육 기관이다.","선현에게 제사를 지내고 성리학을 가르친 사립 교육 기관이다.","유향소를 통제하려고 한양에 둔 기구이다."],"ans":2,"exp":"서원은 사림이 세운 사립 교육 기관으로 선현에 대한 제사와 성리학 교육을 맡았으며, 주세붕이 세운 백운동 서원이 시초이다. 교수나 훈도가 파견된 지방 관립 학교는 향교, 생원과 진사가 입학한 최고 교육 기관은 성균관, 유향소를 통제한 기구는 경재소이다."},
{"id":"h60","subj":"한국사","unit":"조선 전기","q":"조선 전기의 대외 관계에 대한 설명으로 옳은 것은?","opts":["청을 정벌하자는 북벌을 추진하였다.","기유약조를 맺어 일본과 무역을 다시 시작하였다.","3포를 열고 계해약조를 맺어 일본과의 무역을 제한하였다.","백두산정계비를 세워 국경을 정하였다."],"ans":2,"exp":"세종 때 조선은 부산포, 제포, 염포의 3포를 열어 주고 계해약조를 맺어 쓰시마섬과의 무역 규모를 제한하였다. 북벌 추진은 효종, 기유약조는 임진왜란 뒤 광해군, 백두산정계비 건립은 숙종 때의 일로 모두 조선 후기에 해당한다."},
{"id":"h61","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 만들어진 것으로 옳지 않은 것은?","opts":["자격루","앙부일구","거중기","측우기"],"ans":2,"exp":"거중기는 정조 때 정약용이 만들어 수원 화성을 쌓는 데 쓴 기구이다. 물시계인 자격루, 해시계인 앙부일구, 강우량을 재는 측우기는 모두 세종 때 만들어졌다."},
{"id":"h62","subj":"한국사","unit":"조선 전기","q":"선조 때 사림이 동인과 서인으로 나뉜 직접적인 계기는?","opts":["효종의 정통성과 관련된 상복 문제","이조 전랑 임명을 둘러싼 대립","남인에 대한 처벌 수위를 둘러싼 대립","사도 세자의 죽음에 대한 입장 차이"],"ans":1,"exp":"선조 때 사림은 척신 정치의 청산 문제와 이조 전랑 임명 문제를 두고 김효원을 지지하는 동인과 심의겸을 지지하는 서인으로 나뉘었다. 상복 문제(예송)는 현종 때 서인과 남인의 대립이고, 남인 처벌 문제는 숙종 때 서인이 노론과 소론으로 갈린 계기이며, 사도 세자 문제는 시파와 벽파의 구분과 관련된다."},
{"id":"h63","subj":"한국사","unit":"조선 후기","q":"광해군 때의 사실로 옳은 것은?","opts":["이괄이 난을 일으켜 한양을 점령하였다.","청의 요청으로 나선 정벌에 조총 부대를 보냈다.","훈련도감을 처음 설치하였다.","강홍립의 부대를 명에 보내면서 상황에 따라 대처하게 하였다."],"ans":3,"exp":"광해군은 명과 후금 사이에서 중립 외교를 펴, 명의 요청으로 강홍립의 부대를 보내면서도 형세를 보아 대처하게 하였다. 이괄의 난은 인조, 나선 정벌은 효종, 훈련도감 설치는 임진왜란 중인 선조 때의 일이다."},
{"id":"h64","subj":"한국사","unit":"조선 후기","q":"병자호란에 대한 설명으로 옳은 것은?","opts":["인조가 남한산성에서 버티다가 삼전도에서 항복하였다.","형제 관계를 맺는 것으로 화의가 이루어졌다.","정봉수와 이립이 의병을 일으켜 싸웠다.","곽재우가 의령에서 의병을 일으켰다."],"ans":0,"exp":"1636년 청이 군신 관계를 요구하며 쳐들어오자 인조는 남한산성에서 항전하다가 이듬해 삼전도에서 항복하고 청과 군신 관계를 맺었다. 형제 관계를 맺은 화의와 정봉수, 이립의 의병 활동은 1627년 정묘호란 때의 일이고, 곽재우는 임진왜란 때의 의병장이다."},
{"id":"h65","subj":"한국사","unit":"조선 후기","q":"조선 숙종 때의 사실로 옳은 것은?","opts":["탕평비를 성균관 앞에 세웠다.","장용영을 설치하였다.","여러 차례 환국이 일어나 집권 붕당이 바뀌었다.","비변사를 처음 설치하였다."],"ans":2,"exp":"숙종 때에는 경신환국, 기사환국, 갑술환국이 잇달아 일어나 집권 붕당이 급격히 바뀌었고, 상대 붕당을 철저히 배제하는 일당 전제화 경향이 나타났다. 탕평비 건립은 영조, 장용영 설치는 정조, 비변사의 첫 설치는 중종 때의 일이다."},
{"id":"h66","subj":"한국사","unit":"조선 후기","q":"영조의 정책으로 옳은 것은?","opts":["균역법을 시행하여 군포 부담을 1필로 줄였다.","『대전회통』을 편찬하였다.","규장각을 설치하였다.","시전 상인의 금난전권을 대부분 없앴다."],"ans":0,"exp":"영조는 균역법을 시행하여 1년에 2필이던 군포를 1필로 줄였고, 『속대전』을 편찬하고 탕평책을 폈다. 『대전회통』은 고종 때 편찬되었고, 규장각 설치와 육의전을 뺀 시전의 금난전권 폐지(신해통공)는 정조 때의 일이다."},
{"id":"h67","subj":"한국사","unit":"조선 후기","q":"__이 왕__의 정책으로 옳은 것은?\n\n__이 왕__은 아버지 사도 세자의 묘를 수원으로 옮기고 화성을 쌓았으며, 국왕 친위 부대인 장용영을 두었다.","opts":["『속대전』을 편찬하여 법전을 정비하였다.","청계천을 준설하여 홍수에 대비하였다.","서원을 47곳만 남기고 정리하였다.","초계문신제를 시행하여 젊은 관리를 다시 교육하였다."],"ans":3,"exp":"밑줄 친 왕은 정조이다. 정조는 규장각을 설치하고 초계문신제를 시행하여 젊고 유능한 관리를 뽑아 재교육하였다. 『속대전』 편찬과 청계천 준설은 영조, 서원을 47곳만 남기고 정리한 것은 고종 때 흥선 대원군이 한 일이다."},
{"id":"h68","subj":"한국사","unit":"조선 후기","q":"홍경래의 난에 대한 설명으로 옳은 것은?","opts":["경상 우병사 백낙신의 수탈이 계기가 되었다.","서북 지역에 대한 차별에 반발하여 일어났다.","수습책으로 삼정이정청이 설치되었다.","고부 군수의 횡포에 맞서 전봉준이 이끌었다."],"ans":1,"exp":"홍경래의 난은 1811년 평안도에서 세도 정권의 수탈과 서북 지역에 대한 차별에 반발하여 일어났다. 백낙신의 수탈이 계기가 되고 삼정이정청이 설치된 것은 1862년 임술 농민 봉기와 관련되며, 전봉준이 이끈 고부 봉기는 1894년 동학 농민 운동의 시작이다."},
{"id":"h69","subj":"한국사","unit":"조선 후기","q":"조선 후기의 경제 변화에 대한 설명으로 옳지 않은 것은?","opts":["관영 수공업이 발달하고 민영 수공업은 쇠퇴하였다.","모내기법이 퍼지면서 넓은 땅을 경작하는 농민이 나타났다.","담배, 인삼 같은 상품 작물의 재배가 늘었다.","송상, 만상 등 사상의 활동이 활발해졌다."],"ans":0,"exp":"조선 후기에는 장인 등록제가 폐지되는 등 관영 수공업이 쇠퇴하고 민영 수공업이 발달하였다. 모내기법 확산으로 광작이 가능해졌고, 상품 작물 재배가 늘었으며, 개성의 송상과 의주의 만상 같은 사상이 성장하였다."},
{"id":"h70","subj":"한국사","unit":"조선 후기","q":"균역법 시행으로 줄어든 재정 수입을 메우기 위한 방법으로 옳지 않은 것은?","opts":["토지 1결당 쌀 2두의 결작을 거두었다.","일부 상류층에게 선무군관이라는 칭호를 주고 군포를 거두었다.","어장세, 염세, 선박세를 국가 재정으로 돌렸다.","공인에게 공가를 미리 주고 필요한 물품을 사들이게 하였다."],"ans":3,"exp":"공인에게 공가를 주고 물품을 사들이게 한 것은 대동법의 운영 방식이다. 균역법으로 군포가 1필로 줄자 정부는 지주에게 결작을 거두고, 일부 상류층에게 선무군관포를 받았으며, 어장세와 염세, 선박세를 재정에 보탰다."},
{"id":"h71","subj":"한국사","unit":"조선 후기","q":"정약용에 대한 설명으로 옳은 것은?","opts":["신분에 따라 토지를 차등 있게 나누어 주는 균전론을 주장하였다.","영업전의 매매를 금지하는 한전론을 주장하였다.","마을 단위로 토지를 함께 경작하고 일한 만큼 나누는 여전론을 주장하였다.","『북학의』에서 소비를 권장해야 생산이 늘어난다고 하였다."],"ans":2,"exp":"정약용은 한 마을이 토지를 공동으로 소유하고 경작하여 노동량에 따라 수확을 나누는 여전론을 내놓았고, 뒤에 정전제를 주장하였다. 균전론은 유형원, 한전론은 이익, 『북학의』는 박제가의 것이다."},
{"id":"h72","subj":"한국사","unit":"조선 후기","q":"박지원에 대한 설명으로 옳은 것은?","opts":["『의산문답』에서 지구가 돈다고 주장하였다.","『우서』에서 사농공상의 직업 평등을 주장하였다.","『열하일기』를 쓰고 수레와 선박의 이용을 강조하였다.","『발해고』에서 남북국이라는 말을 썼다."],"ans":2,"exp":"박지원은 청에 다녀와 『열하일기』를 쓰고 수레와 선박의 이용, 화폐 유통의 필요성을 강조했으며 「양반전」 등으로 양반의 무능을 비판하였다. 『의산문답』은 홍대용, 『우서』는 유수원, 『발해고』는 유득공의 저술이다."},
{"id":"h73","subj":"한국사","unit":"조선 후기","q":"조선 후기의 국학 연구에 대한 설명으로 옳은 것은?","opts":["안정복은 『발해고』에서 발해를 우리 역사로 다루었다.","이긍익은 『동사강목』에서 독자적인 정통론을 세웠다.","이중환은 『택리지』에서 각 지방의 자연환경과 풍속을 서술하였다.","정상기는 목판으로 「대동여지도」를 만들었다."],"ans":2,"exp":"이중환의 『택리지』는 각 지방의 자연환경, 경제, 풍속, 인심을 서술한 인문 지리서이다. 『발해고』는 유득공, 『동사강목』은 안정복, 「대동여지도」는 김정호가 만들었다. 이긍익은 『연려실기술』을 썼고 정상기는 「동국지도」를 만들었다."},
{"id":"h74","subj":"한국사","unit":"조선 후기","q":"조선 후기의 문화에 대한 설명으로 옳지 않은 것은?","opts":["『춘향전』 같은 한글 소설이 널리 읽혔다.","안견이 「몽유도원도」를 그렸다.","김홍도와 신윤복이 풍속화를 그렸다.","백자가 민간에까지 널리 쓰이고 청화 백자가 유행하였다."],"ans":1,"exp":"「몽유도원도」는 조선 전기 세종 때 안견이 안평 대군의 꿈 이야기를 듣고 그린 그림이다. 조선 후기에는 서민 문화가 발달하여 한글 소설, 판소리, 탈춤이 유행하고 풍속화와 민화가 그려졌으며, 백자가 민간에까지 널리 쓰이면서 청화 백자가 유행하였다."},
{"id":"h75","subj":"한국사","unit":"조선 후기","q":"조선 후기 신분제의 변화에 대한 설명으로 옳지 않은 것은?","opts":["영조 때 아버지가 노비이면 어머니가 양인이어도 자식을 노비로 삼도록 법을 정하였다.","공명첩 발급과 납속으로 양반의 수가 늘었다.","순조 때 중앙 관청에 속한 공노비가 해방되었다.","서얼이 규장각 검서관으로 등용되었다."],"ans":0,"exp":"조선 후기에는 노비를 줄이고 양인을 늘리기 위해 어머니가 양인이면 자식도 양인이 되게 하는 노비종모법을 영조 때(1731) 확정하였다. 따라서 아버지가 노비여도 어머니가 양인이면 자식은 양인이 되었다. 공명첩과 납속으로 양반이 늘었고, 1801년 순조 때 공노비 6만 6천여 명이 해방되었으며, 정조 때 박제가, 유득공 등 서얼이 규장각 검서관이 되었다."},
{"id":"h76","subj":"한국사","unit":"조선 후기","q":"동학에 대한 설명으로 옳은 것은?","opts":["처음에는 서학이라는 학문으로 받아들여졌다.","신유박해로 큰 탄압을 받았다.","청을 오가던 사신들이 들여왔다.","시천주와 후천개벽 사상을 내세웠다."],"ans":3,"exp":"동학은 1860년 경주의 몰락 양반 최제우가 창시한 종교로, 마음속에 한울님을 모신다는 시천주와 새 세상이 온다는 후천개벽을 내세웠다. 서학으로 수용된 것, 신유박해로 탄압받은 것, 청을 오가던 사신을 통해 들어온 것은 모두 천주교에 대한 설명이다."},
{"id":"h77","subj":"한국사","unit":"개항기","q":"흥선 대원군의 정책으로 옳은 것은?","opts":["통리기무아문을 설치하였다.","토지 소유자에게 지계를 발급하였다.","신식 군대인 별기군을 창설하였다.","호포제를 실시하여 양반에게도 군포를 거두었다."],"ans":3,"exp":"흥선 대원군은 호포제를 실시하여 양반에게도 군포를 거두고, 사창제를 실시하여 환곡의 폐단을 줄이려 하였다. 통리기무아문 설치(1880)와 별기군 창설(1881)은 개항 이후 고종의 개화 정책이고, 지계 발급은 대한 제국의 광무개혁 때 이루어졌다."},
{"id":"h78","subj":"한국사","unit":"개항기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 오페르트가 남연군의 묘를 도굴하려 하였다.\n(나) 프랑스군이 강화도를 침입하였다.\n(다) 미군이 광성보를 공격하였다.\n(라) 전국 각지에 척화비가 세워졌다.","opts":["(나) - (가) - (다) - (라)","(가) - (나) - (다) - (라)","(나) - (다) - (가) - (라)","(나) - (가) - (라) - (다)"],"ans":0,"exp":"프랑스군이 강화도를 침입한 병인양요는 1866년, 오페르트 도굴 사건은 1868년, 미군이 광성보를 공격한 신미양요는 1871년이다. 흥선 대원군은 1871년 광성보가 함락된 직후 서울 종로와 전국 각지에 척화비를 세워 통상 수교 거부 의지를 밝혔다."},
{"id":"h79","subj":"한국사","unit":"개항기","q":"강화도 조약(조일 수호 조규)에 대한 설명으로 옳지 않은 것은?","opts":["조선이 자주국임을 밝혔다.","일본에 조선 해안을 측량할 권리를 주었다.","개항장에서 죄를 지은 일본인은 일본 관리가 재판하게 하였다.","최혜국 대우를 처음으로 규정하였다."],"ans":3,"exp":"최혜국 대우는 1882년 조미 수호 통상 조약에서 처음 규정되었다. 1876년 강화도 조약은 조선이 자주국임을 밝혀 청의 간섭을 막으려 하였고, 해안 측량권과 영사 재판권(치외 법권)을 인정한 불평등 조약이었다."},
{"id":"h80","subj":"한국사","unit":"개항기","q":"임오군란의 결과로 옳은 것은?","opts":["청과 일본이 톈진 조약을 맺었다.","군국기무처가 설치되었다.","고종이 러시아 공사관으로 거처를 옮겼다.","조청 상민 수륙 무역 장정이 맺어졌다."],"ans":3,"exp":"1882년 임오군란을 진압한 청은 군대를 조선에 머물게 하고 조청 상민 수륙 무역 장정을 맺어 청 상인의 내륙 진출 길을 열었다. 톈진 조약은 갑신정변, 군국기무처 설치는 제1차 갑오개혁, 고종의 러시아 공사관 이동은 1896년 아관 파천이다."},
{"id":"h81","subj":"한국사","unit":"개항기","q":"다음 개혁안을 발표한 세력에 대한 설명으로 옳은 것은?\n\n1. 청에 잡혀간 흥선 대원군을 곧 돌아오게 하고, 조공하는 허례를 폐지할 것\n2. 문벌을 폐지하여 인민 평등의 권리를 세울 것\n3. 지조법을 개혁할 것","opts":["전라도 각지에 집강소를 설치하였다.","만민 공동회를 열어 민권 신장을 주장하였다.","13도 창의군을 꾸려 서울 진공 작전을 폈다.","우정총국 개국 축하연을 이용하여 정변을 일으켰다."],"ans":3,"exp":"제시된 자료는 1884년 갑신정변 때 급진 개화파가 발표한 개혁 정강이다. 김옥균 등은 우정총국 개국 축하연을 틈타 정변을 일으켰으나 청군의 개입으로 3일 만에 실패하였다. 집강소는 동학 농민군, 만민 공동회는 독립 협회, 13도 창의군은 정미의병과 관련된다."},
{"id":"h82","subj":"한국사","unit":"개항기","q":"동학 농민 운동에서 전주 화약 체결과 우금치 전투 사이에 있었던 사실로 옳은 것은?","opts":["농민군이 황토현에서 관군을 이겼다.","농민군이 백산에 모여 4대 강령을 발표하였다.","일본군이 경복궁을 점령하였다.","전봉준이 체포되어 재판을 받았다."],"ans":2,"exp":"농민군과 정부가 전주 화약을 맺은 뒤에도 일본군은 물러가지 않고 경복궁을 점령하였고, 이에 농민군이 다시 봉기하여 우금치에서 싸웠다. 백산 봉기와 황토현 전투는 전주 화약 이전이고, 전봉준 체포는 우금치 전투에서 패한 뒤의 일이다."},
{"id":"h83","subj":"한국사","unit":"개항기","q":"갑오·을미개혁의 내용으로 옳지 않은 것은?","opts":["공사 노비법을 없앴다.","과거제를 폐지하였다.","대한국 국제를 반포하였다.","태양력을 쓰고 단발령을 내렸다."],"ans":2,"exp":"대한국 국제는 대한 제국이 1899년에 반포한 것으로 황제의 무한한 권한을 밝혔다. 공사 노비법 혁파와 과거제 폐지는 1894년 제1차 갑오개혁, 태양력 사용과 단발령은 1895년 을미개혁의 내용이다."},
{"id":"h84","subj":"한국사","unit":"개항기","q":"독립 협회의 활동으로 옳은 것은?","opts":["고종의 강제 퇴위에 반대하는 운동을 벌였다.","대성 학교와 오산 학교를 세웠다.","일본의 황무지 개간권 요구를 막아 냈다.","관민 공동회를 열어 헌의 6조를 결의하였다."],"ans":3,"exp":"독립 협회는 1898년 관민 공동회를 열어 헌의 6조를 결의하고 의회 설립을 추진하였다. 고종 강제 퇴위 반대 운동은 대한 자강회, 대성 학교와 오산 학교 설립은 신민회, 황무지 개간권 요구 저지는 보안회의 활동이다."},
{"id":"h85","subj":"한국사","unit":"개항기","q":"을사늑약에 대한 설명으로 옳은 것은?","opts":["대한 제국의 군대를 해산하는 근거가 되었다.","일본이 추천하는 재정 고문과 외교 고문을 두게 하였다.","대한 제국의 외교권을 빼앗고 통감부를 두게 하였다.","일본이 군사상 필요한 곳을 쓸 수 있게 하였다."],"ans":2,"exp":"1905년 을사늑약으로 일본은 대한 제국의 외교권을 빼앗고 통감부를 설치하였다. 군대 해산은 1907년 한일 신협약의 부속 각서에 따른 것이고, 고문을 두게 한 것은 1904년 제1차 한일 협약, 군사 요충지 사용은 1904년 한일 의정서의 내용이다."},
{"id":"h86","subj":"한국사","unit":"개항기","q":"신민회에 대한 설명으로 옳은 것은?","opts":["헌정 연구회를 이어받아 조직되었다.","러시아의 절영도 조차 요구를 막아 냈다.","남만주 삼원보에 독립운동 기지를 세웠다.","대구에서 국채 보상 운동을 처음 시작하였다."],"ans":2,"exp":"신민회는 1907년 안창호, 양기탁 등이 만든 비밀 결사로 공화정 수립을 목표로 하였고, 남만주 삼원보에 독립운동 기지를 세웠다. 헌정 연구회를 이은 단체는 대한 자강회이고, 절영도 조차 요구 저지는 독립 협회의 활동이며, 국채 보상 운동은 대구에서 서상돈 등의 제안으로 시작되었다."},
{"id":"h87","subj":"한국사","unit":"일제 강점기","q":"1910년대 일제의 식민 통치 정책으로 옳은 것은?","opts":["회사를 세울 때 총독의 허가를 받게 하였다.","치안 유지법을 만들었다.","국가 총동원법을 적용하였다.","산미 증식 계획을 추진하였다."],"ans":0,"exp":"1910년대 일제는 회사령을 만들어 회사를 세울 때 총독의 허가를 받게 하여 한국인의 기업 활동을 억눌렀고, 헌병 경찰 제도와 토지 조사 사업을 실시하였다. 산미 증식 계획은 1920년부터, 치안 유지법은 1925년, 국가 총동원법은 1938년의 일이다."},
{"id":"h88","subj":"한국사","unit":"일제 강점기","q":"산미 증식 계획에 대한 설명으로 옳은 것은?","opts":["정해진 기간 안에 토지 소유권을 신고하게 하였다.","놋그릇과 수저까지 공출하였다.","남부에 면화, 북부에 양을 기르게 하였다.","늘어난 생산량보다 더 많은 쌀이 일본으로 실려 나갔다."],"ans":3,"exp":"일제는 1920년부터 일본의 식량 부족을 해결하려고 산미 증식 계획을 추진하였는데, 증산량보다 많은 쌀을 가져가 한국의 식량 사정이 나빠졌다. 기한 내 신고는 1910년대 토지 조사 사업, 금속 공출은 전시 동원 체제, 면화와 양 사육 강요는 1930년대 남면북양 정책이다."},
{"id":"h89","subj":"한국사","unit":"일제 강점기","q":"중일 전쟁 이후 일제가 실시한 정책으로 옳지 않은 것은?","opts":["황국 신민 서사를 외우게 하였다.","성과 이름을 일본식으로 바꾸게 하였다.","조선 태형령을 만들어 한국인에게만 태형을 가하였다.","국가 총동원법을 적용하여 인력과 물자를 수탈하였다."],"ans":2,"exp":"조선 태형령은 1912년에 만들어져 1910년대 무단 통치 시기에 시행되다가 3·1 운동 뒤 폐지되었다. 1937년 중일 전쟁 이후 일제는 황국 신민 서사 암송과 창씨개명을 강요하고, 1938년 국가 총동원법으로 인력과 물자를 수탈하였다."},
{"id":"h90","subj":"한국사","unit":"일제 강점기","q":"대한민국 임시 정부의 활동으로 옳지 않은 것은?","opts":["독립 공채를 발행하였다.","신흥 무관 학교를 세웠다.","구미 위원부를 설치하였다.","한국 광복군을 창설하였다."],"ans":1,"exp":"신흥 무관 학교는 이회영 등 신민회 인사들이 남만주에 세운 신흥 강습소가 발전한 것이다. 대한민국 임시 정부는 독립 공채를 발행하여 자금을 모으고, 미국에 구미 위원부를 두어 외교 활동을 폈으며, 1940년 충칭에서 한국 광복군을 창설하였다."},
{"id":"h91","subj":"한국사","unit":"일제 강점기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 자유시 참변\n(나) 봉오동 전투\n(다) 청산리 대첩\n(라) 미쓰야 협정 체결","opts":["(나) - (가) - (다) - (라)","(다) - (나) - (가) - (라)","(나) - (다) - (가) - (라)","(나) - (다) - (라) - (가)"],"ans":2,"exp":"봉오동 전투는 1920년 6월, 청산리 대첩은 1920년 10월이다. 이후 일제의 보복을 피해 이동한 독립군은 1921년 자유시 참변을 겪었고, 만주로 돌아와 3부를 조직하였다. 미쓰야 협정은 1925년 일제와 만주 군벌이 독립군 탄압을 위해 맺었다."},
{"id":"h92","subj":"한국사","unit":"일제 강점기","q":"한인 애국단에 대한 설명으로 옳은 것은?","opts":["김원봉이 만주 지린에서 조직하였다.","윤봉길이 상하이 훙커우 공원에서 의거를 일으켰다.","「조선 혁명 선언」을 활동 지침으로 삼았다.","김상옥이 종로 경찰서에 폭탄을 던졌다."],"ans":1,"exp":"한인 애국단은 1931년 김구가 임시 정부의 활로를 찾으려고 상하이에서 조직하였고, 단원 이봉창과 윤봉길이 1932년에 의거를 일으켰다. 김원봉이 지린에서 조직한 단체, 「조선 혁명 선언」을 지침으로 삼은 단체, 김상옥이 속한 단체는 모두 의열단이다."},
{"id":"h93","subj":"한국사","unit":"일제 강점기","q":"신간회에 대한 설명으로 옳은 것은?","opts":["광주 학생 항일 운동에 진상 조사단을 보냈다.","평양에서 물산 장려 운동을 시작하였다.","민립 대학 설립 운동을 이끌었다.","6·10 만세 운동을 계획하였다."],"ans":0,"exp":"신간회는 1927년 비타협적 민족주의 세력과 사회주의 세력이 함께 만든 단체로, 1929년 광주 학생 항일 운동이 일어나자 진상 조사단을 보내고 민중 대회를 열려 하였다. 물산 장려 운동은 1920년 조선 물산 장려회, 민립 대학 설립 운동은 1923년 민립 대학 기성회가 이끌었고, 6·10 만세 운동은 신간회 창립 전인 1926년의 일이다."},
{"id":"h94","subj":"한국사","unit":"일제 강점기","q":"물산 장려 운동에 대한 설명으로 옳은 것은?","opts":["'내 살림 내 것으로'라는 구호를 내세웠다.","'배우자, 가르치자, 다 함께 브나로드'라는 구호를 내세웠다.","'한민족 1천만이 한 사람 1원씩'이라는 구호를 내세웠다.","백정에 대한 차별을 없애려고 진주에서 시작되었다."],"ans":0,"exp":"물산 장려 운동은 조만식 등이 평양에서 시작한 운동으로 '내 살림 내 것으로', '조선 사람 조선 것'을 구호로 토산품 애용을 호소하였다. 브나로드 운동은 동아일보의 농촌 계몽 운동, '1천만이 1원씩'은 민립 대학 설립 운동의 구호이고, 진주에서 시작된 백정 차별 철폐 운동은 형평 운동이다."},
{"id":"h95","subj":"한국사","unit":"일제 강점기","q":"한국 광복군에 대한 설명으로 옳은 것은?","opts":["미국 전략 정보국(OSS)과 함께 국내 진공 작전을 준비하였다.","쌍성보와 대전자령에서 일본군을 물리쳤다.","영릉가와 흥경성에서 일본군을 물리쳤다.","중국 관내에서 만들어진 첫 한인 무장 부대였다."],"ans":0,"exp":"한국 광복군은 1940년 충칭에서 대한민국 임시 정부의 군대로 창설되어 인도·미얀마 전선에 대원을 보냈고, 미국 전략 정보국과 협력하여 국내 진공 작전을 준비하였다. 쌍성보, 대전자령 전투는 한국 독립군, 영릉가, 흥경성 전투는 조선 혁명군의 활동이고, 중국 관내 최초의 한인 무장 부대는 1938년에 만들어진 조선 의용대이다."},
{"id":"h96","subj":"한국사","unit":"일제 강점기","q":"박은식에 대한 설명으로 옳은 것은?","opts":["『조선사회경제사』에서 한국사를 세계사의 보편 법칙으로 설명하였다.","『한국통사』를 쓰고 국혼을 강조하였다.","진단 학회를 만들어 실증적 연구를 이끌었다.","『조선상고사』에서 역사를 아와 비아의 투쟁으로 보았다."],"ans":1,"exp":"박은식은 『한국통사』와 『한국독립운동지혈사』를 쓰고, 나라의 형체는 잃어도 정신인 국혼을 지키면 나라를 되찾을 수 있다고 하였다. 『조선사회경제사』는 백남운, 『조선상고사』는 신채호의 저술이고, 진단 학회는 1934년 이병도, 손진태 등이 만들었다."},
{"id":"h97","subj":"한국사","unit":"현대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 5·10 총선거 실시\n(나) 모스크바 3국 외상 회의 개최\n(다) 좌우 합작 7원칙 발표\n(라) 제1차 미소 공동 위원회 개최","opts":["(나) - (라) - (다) - (가)","(나) - (다) - (라) - (가)","(라) - (나) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":0,"exp":"모스크바 3국 외상 회의는 1945년 12월, 그 결정에 따른 제1차 미소 공동 위원회는 1946년 3월에 열렸다. 미소 공동 위원회가 결렬된 뒤 좌우 합작 위원회가 1946년 10월 좌우 합작 7원칙을 발표하였고, 5·10 총선거는 1948년 5월에 실시되었다."},
{"id":"h98","subj":"한국사","unit":"현대","q":"제헌 국회의 활동으로 옳은 것은?","opts":["발췌 개헌안을 통과시켰다.","사사오입 개헌안을 통과시켰다.","반민족 행위 처벌법을 만들었다.","한일 협정을 비준하였다."],"ans":2,"exp":"1948년 5·10 총선거로 구성된 제헌 국회는 헌법을 만들고, 반민족 행위 처벌법과 농지 개혁법을 제정하였다. 발췌 개헌은 1952년, 사사오입 개헌은 1954년, 한일 협정 비준은 1965년의 일로 모두 그 뒤의 국회에서 이루어졌다."},
{"id":"h99","subj":"한국사","unit":"현대","q":"4·19 혁명의 결과로 옳은 것은?","opts":["5년 단임의 대통령 직선제 개헌이 이루어졌다.","대통령에게 긴급 조치권을 준 유신 헌법이 만들어졌다.","내각 책임제와 국회 양원제를 담은 개헌이 이루어졌다.","통일 주체 국민 회의에서 대통령을 뽑게 되었다."],"ans":2,"exp":"1960년 3·15 부정 선거에 항의하여 일어난 4·19 혁명으로 이승만 대통령이 물러났고, 내각 책임제와 양원제 국회를 내용으로 헌법이 바뀌어 장면 내각이 들어섰다. 5년 단임 대통령 직선제 개헌은 1987년 6월 민주 항쟁의 결과이고, 긴급 조치권과 통일 주체 국민 회의는 1972년 유신 헌법의 내용이다."},

function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function qBy(id){var a=allQ();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function seen(q){return (S.prog[q.id]||{}).seen||0;}
function inLadder(p){return p&&p.stage>=0&&p.stage<4;}
function dueList(){var t=day(0);return allQ().filter(function(q){var p=S.prog[q.id];return inLadder(p)&&p.due<=t;});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rich(s){return esc(s).replace(/_{4,}/g,'<span class="blank"></span>').replace(/__(.+?)__/g,'<u>$1</u>');}

function leastSeen(qs,n){qs=shuffle(qs);qs.sort(function(a,b){return seen(a)-seen(b);});return qs.slice(0,n);}
function newToday(){var n=S.newDay;return n&&n.d===day(0)?n.n:0;}
// 오늘 할 양 = 복습할 문제 전부 + 하루 목표만큼의 새 문제(한 번도 안 푼 문제). 한 세트는 SET 문제이고,
// 복습과 새 문제가 함께 끝나도록 남은 비율대로 섞는다. 목표를 마친 뒤(extra)에는 새 문제를 더 주고, 새 문제가 없으면 덜 푼 문제를 준다.
function todayPlan(extra){var due=dueList(),fresh=allQ().filter(function(q){return !seen(q);});
  var rest=allQ().filter(function(q){return due.indexOf(q)<0&&!inLadder(S.prog[q.id]);});
  var newLeft=Math.max(0,Math.min(S.goal-newToday(),fresh.length)),left=due.length+newLeft;
  var pool=newLeft?fresh:[],nNew=0,nDue=Math.min(due.length,SET);
  if(newLeft){nNew=Math.min(newLeft,Math.max(SET-nDue,Math.round(SET*newLeft/left)));nDue=Math.min(due.length,SET-nNew);}
  else if(!due.length&&extra){pool=fresh.length?fresh:rest;nNew=Math.min(SET,pool.length);}
  return {due:due,rest:rest,fresh:fresh,pool:pool,newLeft:newLeft,left:left,nDue:nDue,nNew:nNew};}
function planNote(){var f=allQ().filter(function(q){return !seen(q);}).length;if(!f)return '모든 문제를 한 번 이상 풀었습니다. 복습과 다시 풀기로 다져 보세요.';
  var days=Math.ceil(f/S.goal),t='아직 안 푼 문제 '+f+'개. 지금 속도면 약 '+days+'일 뒤에 모두 풉니다.';
  if(S.examDate){var d=Math.round((new Date(S.examDate+'T00:00:00')-new Date(day(0)+'T00:00:00'))/864e5);
    if(d>0&&days>d)t+=' 시험일 전에 다 보려면 하루 '+Math.ceil(f/d)+'개가 필요합니다.';}
  return t;}

var view='home',sess=null,chat=[],ctxId=null,draft='',busy=false,job=null,genN=5,qSeq=0,chatTask=null,keyTask=null,pickSubj=SUBJ[0],pasteDraft='',addOpen=false;
var AI=null,D=null,TTS=null,listening=false,dictBase='',dictFinal='',dictPart='';
// 화면이 새로 배포됐는지 확인하는 용도. 앱을 고칠 때마다 올린다(작은 수정은 끝자리, 기능 추가는 가운데 자리).
var VERSION='1.6.0';
var KEYLS='nurse8-key-v1',CONN=null,MODEL='claude-opus-5-5',HAS_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
var keyProv='gemini',keyDraft='',keyBusy=false,keyMsg='';
var app=document.getElementById('app'),nav=document.getElementById('nav');

function startSession(title,ids){if(!ids.length){toast('풀 문제가 없습니다.');return;}
  sess={title:title,ids:ids,idx:0,pick:null,conf:'sure',graded:false,ok:false,msg:'',prev:null,right:0,log:[],done:false,pop:false,w:0,kind:{}};
  ids.forEach(function(id){var p=S.prog[id];sess.kind[id]=inLadder(p)?'복습':(p&&p.seen?'다시 풀기':'새 문제');});go('quiz');}
function startToday(){var p=todayPlan(true);
  var ids=shuffle(p.due).slice(0,p.nDue).concat(leastSeen(p.pool,p.nNew)).map(function(q){return q.id;});
  startSession('오늘의 학습',shuffle(ids));}
function startSubject(s){startSession(s,leastSeen(allQ().filter(function(q){return q.subj===s;}),SET).map(function(q){return q.id;}));}
function startReview(){var d=dueList();
  d=S.mix?shuffle(d):d.sort(function(a,b){return SUBJ.indexOf(a.subj)-SUBJ.indexOf(b.subj);});
  startSession('복습',d.map(function(q){return q.id;}));}
function cur(){return sess?qBy(sess.ids[sess.idx]):null;}

// 채점 결과를 복습 일정에 반영한다. prev는 채점 전 기록이라, 확신도를 바꿔도 다시 계산할 수 있다.
function schedule(q,ok,c,prev){var t=day(0),msg='';
  var p=prev?JSON.parse(prev):{seen:0,wrong:0,stage:-1,due:null,last:''};
  var was=inLadder(p),due=was&&p.due<=t;
  p.seen++;
  if(!ok){p.wrong++;p.stage=0;p.due=day(1);p.last='wrong';msg='내일 다시 나옵니다';}
  else if(c==='guess'){p.stage=0;p.due=day(1);p.last='guess';msg='찍은 문제라 내일 다시 나옵니다';}
  else if(c==='unsure'&&!was){p.stage=1;p.due=day(3);p.last='unsure';msg='헷갈린 문제라 3일 뒤 다시 나옵니다';}
  else if(c==='unsure'&&due){p.last='unsure';p.due=day(INTERVALS[p.stage]);msg='헷갈린 문제라 '+INTERVALS[p.stage]+'일 뒤 한 번 더 나옵니다';}
  else if(due){p.stage++;p.last='correct';
    if(p.stage>=4){p.stage=4;p.due=null;msg='이 문제는 복습을 모두 마쳤습니다';}
    else{p.due=day(INTERVALS[p.stage]);msg=INTERVALS[p.stage]+'일 뒤 다시 나옵니다';}}
  else if(was){p.last='correct';msg='예정된 복습일에 다시 나옵니다';}
  else{p.last='correct';}
  S.prog[q.id]=p;return msg;}
function grade(){var q=cur();if(!q||sess.pick==null||sess.graded)return;
  var ok=sess.pick===q.ans;sess.prev=S.prog[q.id]?JSON.stringify(S.prog[q.id]):null;
  if(!seen(q))S.newDay={d:day(0),n:newToday()+1};
  sess.conf='sure';sess.msg=schedule(q,ok,'sure',sess.prev);
  S.days[day(0)]=(S.days[day(0)]||0)+1;
  sess.graded=true;sess.ok=ok;sess.pop=true;if(ok)sess.right++;sess.log.push({id:q.id,ok:ok});logAdd(q,sess.pick,ok);
  save();render();}
function setConf(c){var q=cur();if(!q||!sess.graded||!sess.ok||sess.peek)return;
  sess.conf=sess.conf===c?'sure':c;sess.msg=schedule(q,true,sess.conf,sess.prev);logConf(sess.conf);save();render();}
function nextQ(){if(!sess)return;if(sess.idx+1>=sess.ids.length){sess.done=true;}
  else{sess.idx++;sess.pick=null;sess.conf='sure';sess.graded=false;sess.prev=null;}
  render();window.scrollTo(0,0);}

// ── 화면 그리기 ──
function go(v){view=v;if(location.hash!=='#'+v){try{location.hash=v;}catch(e){}}render();window.scrollTo(0,0);}
function render(){
  var focus=view==='quiz'&&sess&&!sess.done;
  app.className=focus?'focus':'';nav.className=focus?'hide':'';
  [].forEach.call(nav.querySelectorAll('a'),function(a){if(a.dataset.tab===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var nd=dueList().length,b=document.getElementById('navDue');b.hidden=!nd;b.textContent=nd;
  app.innerHTML=view==='quiz'?vQuiz():view==='review'?vReview():view==='tutor'?vTutor():view==='records'?vRecords():vHome();
  if(view==='tutor'){var i=document.getElementById('chatIn');if(i)i.value=draft;}
  var bar=app.querySelector('.prog > i');
  if(bar&&sess){var w=bar.dataset.w;sess.w=+w;requestAnimationFrame(function(){bar.style.width=w+'%';});}
}
function dday(){if(!S.examDate)return '시험일 설정';
  var a=new Date(S.examDate+'T00:00:00'),b=new Date(day(0)+'T00:00:00');var n=Math.round((a-b)/864e5);
  return n>0?'시험까지 D-'+n:n===0?'오늘이 시험일':'시험일 설정';}
function circle(sz){return '<svg aria-hidden="true" width="'+sz+'" height="'+sz+'" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 5C11 4 4 11 5 20s8 15 17 14 14-8 13-17S29 4 18 7"/></svg>';}
function weekHtml(){var d=new Date(),dow=(d.getDay()+6)%7,names=['월','화','수','목','금','토','일'],h='';
  for(var i=0;i<7;i++){var k=day(i-dow),done=S.days[k]>0;
    h+='<div class="'+(i===dow?'now ':'')+(done?'done':'')+'"><span>'+names[i]+'</span><i>'+(done?circle(30)+'<span class="sr">학습함</span>':'')+'</i></div>';}
  return h;}
function subjRows(){return SUBJ.map(function(s){var qs=allQ().filter(function(q){return q.subj===s;});
  var n=qs.filter(function(q){return seen(q)>0;}).length;
  return '<button data-act="subj" data-s="'+esc(s)+'"><span class="sname">'+esc(s)+'</span><span class="bar"><i style="width:'+(qs.length?Math.round(n/qs.length*100):0)+'%"></i></span><span class="cnt num">'+n+'/'+qs.length+'</span></button>';}).join('');}
function sheet(title,side,body,attr){return '<section class="sheet"'+(attr||'')+'><header class="sh"><b class="subj">'+title+'</b>'+(side||'')+'</header>'+body+'</section>';}
function vHome(){var p=todayPlan(),n=p.left,did=S.days[day(0)]||0,h='',b='';
  h+='<div class="head"><h1>오늘</h1><button class="pill" data-act="exam">'+esc(dday())+'</button></div>';
  var goalRow='<div class="row between" style="min-height:44px"><span class="sub num" id="goalNote">하루 새 문제 '+S.goal+'개 · 한 세트 '+SET+'문제</span><button class="pill" data-act="exam">목표 바꾸기</button></div>';
  if(n){
    b+='<div class="col" style="gap:14px"><div class="big num">'+n+'<small>문제</small></div>';
    b+='<div class="col" style="gap:8px"><div class="split" role="img" aria-label="복습 '+p.due.length+'문제, 새 문제 '+p.newLeft+'문제">'+(p.due.length?'<i class="r" style="flex:'+p.due.length+'"></i>':'')+(p.newLeft?'<i class="n" style="flex:'+p.newLeft+'"></i>':'')+'</div>';
    b+='<div class="legend"><span><i class="dot" style="background:var(--no)"></i>복습 <b class="num">'+p.due.length+'</b></span><span><i class="dot" style="background:var(--pen)"></i>새 문제 <b class="num">'+p.newLeft+'</b></span></div></div>';
    b+='<button class="btn" data-act="today">'+(did?'다음 세트 풀기':'시작하기')+'</button>'+goalRow+'</div>';
    h+=sheet('오늘 남은 학습','<span class="kind">약 '+Math.max(1,Math.round(n/2))+'분</span>',b);
  }else if(allQ().length){
    b='<div class="col" style="gap:14px"><p class="body" id="goalDone">'+(did?'오늘 목표를 마쳤습니다. 더 풀고 싶으면 한 세트씩 이어서 풀 수 있습니다.':'오늘 복습할 문제와 새 문제가 없습니다. 덜 푼 문제를 다시 풀어 볼 수 있습니다.')+'</p>';
    b+='<button class="btn" data-act="today">한 세트 더 풀기</button>'+goalRow+'</div>';
    h+=sheet('오늘의 학습',did?'<span class="kind">완료</span>':'',b);
  }else{h+=sheet('오늘의 학습','','<div class="col" style="gap:14px"><p class="body">풀 문제가 없습니다. 과목 쪽에서 새 문제를 추가할 수 있습니다.</p><button class="btn" data-act="tab" data-v="quiz">과목으로 가기</button></div>');}
  h+='<p class="sub num" id="planNote" style="text-align:center">'+esc(planNote())+'</p>';
  h+=sheet('이번 주','<span class="unit num">오늘 '+did+'문제 풂</span>','<div class="tbl week" style="grid-template-columns:repeat(7,minmax(0,1fr))">'+weekHtml()+'</div>');
  h+=sheet('과목별 진도','','<div class="rows">'+subjRows()+'</div>');
  h+='<p class="sub" style="text-align:center">'+(DOC?'학습 기록은 계정에 저장됩니다':'학습 기록은 이 기기에 저장됩니다')+'</p>';
  h+='<p class="sub num" id="ver" style="text-align:center">버전 '+VERSION+'</p>';
  return h;}
function penMark(ok,draw){return '<svg class="pen'+(draw?' draw':'')+'" aria-hidden="true" viewBox="0 0 76 58" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="'+(ok?'M40 6C20 4 5 14 6 29s17 24 35 23 30-12 29-26S56 5 33 9':'M12 52L64 6')+'"/></svg>';}
function optHtml(q){
  return q.opts.map(function(o,i){var cls='opt',m='',n=String(i+1);
    if(sess.graded){if(i===q.ans){cls+=' right';m='정답';n=svg(I.ok,16,3);}else if(i===sess.pick){cls+=' wrong';m='내 답';n=svg(I.x,14,3);}else cls+=' dim';}
    else if(i===sess.pick)cls+=' sel';
    return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(sess.graded?' disabled':' aria-pressed="'+(i===sess.pick)+'"')+'><span class="n">'+n+'</span><span class="t">'+rich(o)+'</span>'+(m?'<span class="m">'+m+'</span>':'')+'</button>';
  }).join('');}
function vQuiz(){
  if(!sess)return vPicker();
  if(sess.done)return vDone();
  var q=cur(),n=sess.ids.length,h='';if(!q){sess=null;return vPicker();}
  var w=Math.round((sess.idx+(sess.graded?1:0))/n*100);
  h+='<div class="qtop"><button class="icon-btn" data-act="quit" aria-label="그만하기">'+svg(I.x)+'</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(sess.idx+(sess.graded?1:0))+'" aria-label="진행"><i data-w="'+w+'" style="width:'+sess.w+'%"></i></div><span class="sub num" style="min-width:44px;text-align:right;padding-right:8px">'+(sess.peek?'':(sess.idx+1)+'/'+n)+'</span></div>';
  var parts=String(q.q).split(/\n\s*\n/),stem=parts.shift(),pass=parts.join('\n\n');
  h+='<article class="sheet exam"><header class="sh"><b class="subj">'+esc(q.subj)+'</b><span class="unit">'+esc(q.unit||'')+'</span><span class="kind">'+esc(sess.peek?'기록':q.ai?(q.src||'AI 생성'):(sess.kind[q.id]||'새 문제'))+'</span></header>';
  h+='<div class="qrow">'+(sess.graded?penMark(sess.ok,sess.pop):'')+'<span class="no">문'+(sess.peek?'':' '+(sess.idx+1))+'.</span><p class="stem">'+rich(stem)+'</p></div>';
  if(pass)h+='<div class="passage">'+rich(pass)+'</div>';
  h+='<div class="opts">'+optHtml(q)+'</div></article>';
  if(!sess.graded){
    h+='<div class="foot"><div class="row"><button class="sq" data-act="askq" aria-label="이 문제를 강사에게 묻기">'+svg(I.chat)+'</button><button class="btn" data-act="grade"'+(sess.pick==null?' disabled':'')+'>'+(sess.pick==null?'답을 고르세요':'채점하기')+'</button></div></div>';
    return h;}
  if(sess.ok&&!sess.peek){h+='<div class="col" style="gap:8px"><h2>맞혔지만 자신이 없었다면 알려 주세요</h2><div class="chips"><button class="pill" data-act="conf" data-c="unsure" aria-pressed="'+(sess.conf==='unsure')+'">헷갈렸어요</button><button class="pill" data-act="conf" data-c="guess" aria-pressed="'+(sess.conf==='guess')+'">찍었어요</button></div></div>';}
  h+='<section class="sheet exam"><header class="sh"><b class="subj">해설</b><span class="unit num">'+(q.ai?'AI가 작성해 오류가 있을 수 있습니다':seen(q)?seen(q)+'번 풀어 '+((S.prog[q.id]||{}).wrong||0)+'번 틀림':'')+'</span></header><p class="body">'+rich(q.exp||'해설이 없습니다.')+'</p>';
  if(AI){h+='<div class="aibox"><div class="row" style="gap:8px"><h2>강사에게 더 묻기</h2><span class="ai">AI</span></div><div class="chips"><button class="pill" data-act="ask" data-p="easy">더 쉽게</button><button class="pill" data-act="ask" data-p="opts">선지별 이유</button><button class="pill" data-act="ask" data-p="concept">관련 개념 배우기</button><button class="pill" data-act="similar"'+(job?' disabled':'')+'>'+(job?'만드는 중…':'비슷한 문제 풀기')+'</button></div></div>';}
  h+='</section>';
  if(sess.peek){h+='<div class="foot"><p class="sub num">'+esc(whenText(sess.when))+'에 '+(sess.pick+1)+'번을 골라 '+(sess.ok?'맞혔습니다':'틀렸습니다')+'.</p><div class="row"><button class="btn quiet" data-act="quit">기록으로</button><button class="btn" data-act="retry">다시 풀기</button></div></div>';return h;}
  var a=(q.ans+1)+'번 '+plain(q.opts[q.ans]);
  h+='<div class="foot '+(sess.ok?'good':'bad')+(sess.pop?' pop':'')+'" role="status"><div class="verdict"><span class="ic">'+svg(sess.ok?I.ok:I.x,18,3)+'</span><div><b>'+(sess.ok?'정답입니다':'정답은 <mark>'+esc(a)+'</mark>')+'</b>'+(sess.msg?'<span>'+esc(sess.msg)+'</span>':'')+'</div></div>';
  h+='<button class="btn" data-act="next">'+(sess.idx+1>=n?'결과 보기':'계속')+'</button></div>';
  sess.pop=false;return h;}
function vDone(){var n=sess.ids.length,r=sess.right,wrong=sess.log.filter(function(x){return !x.ok;}),h='',b='';
  h+='<div class="head"><h1>'+(r===n?'모두 맞혔습니다':'채점 결과')+'</h1></div>';
  b+='<div class="col" style="gap:14px"><div class="score num" role="img" aria-label="'+n+'문제 중 '+r+'문제 정답">'+r+'<small>/'+n+'</small><svg aria-hidden="true" viewBox="0 0 120 16" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 5c30-3 80-3 112 0M10 12c30-3 70-3 100 0"/></svg></div>';
  b+='<p class="body" style="text-align:center">'+(wrong.length?'틀린 '+wrong.length+'문제는 내일 복습에 다시 나옵니다.':'복습 일정은 자동으로 잡혔습니다.')+'</p></div>';
  h+=sheet(esc(sess.title),'<span class="kind">'+n+'문제</span>',b);
  if(wrong.length){h+=sheet('틀린 문제','<span class="unit">누르면 강사가 다시 설명합니다</span>','<div class="rows">'+wrong.map(function(x){var q=qBy(x.id);if(!q)return '';
    return '<button data-act="askw" data-id="'+esc(q.id)+'"><span class="item"><small>'+esc(q.subj)+' '+esc(q.unit||'')+'</small><span>'+esc(first(q))+'</span></span>'+svg(I.chev,18)+'</button>';}).join('')+'</div>');}
  h+='<div class="col"><button class="btn" data-act="today">한 세트 더 풀기</button><button class="btn quiet" data-act="tab" data-v="home" data-reset="1">오늘 쪽으로</button></div>';
  return h;}
function vPicker(){var h='<div class="head"><h1>과목</h1></div>',b='';
  h+=sheet('과목 선택','<span class="unit">한 번에 '+SET+'문제</span>','<div class="rows">'+subjRows()+'<button data-act="mixall"><span class="grow" style="font-weight:800">전 과목 섞어 풀기</span>'+svg(I.chev,18)+'</button></div>');
  h+='<details class="sheet"'+(job||addOpen?' open':'')+' id="addBox"><summary><span class="chev" style="display:flex">'+svg(I.chev,18)+'</span>문제 추가 <span class="ai">AI</span><span class="grow"></span><span class="sub num">추가됨 '+S.custom.length+'</span></summary><div class="col" style="gap:14px;padding-top:12px">';
  if(AI){
    h+='<div class="row" style="gap:10px;align-items:flex-end"><label class="col grow" for="genSubj" style="gap:6px"><span class="sub">과목</span><select class="field" id="genSubj">'+SUBJ.map(function(s){return '<option'+(s===pickSubj?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select></label>';
    h+='<label class="col" for="genN" style="gap:6px;width:112px"><span class="sub">개수</span><select class="field" id="genN">'+[5,10,20,30].map(function(n){return '<option value="'+n+'"'+(n===genN?' selected':'')+'>'+n+'문제</option>';}).join('')+'</select></label></div>';
    if(job)h+='<p class="sub wait" id="jobNote"><span class="spin" aria-hidden="true"></span><span>'+esc(jobText())+' 만드는 동안 다른 화면에서 문제를 풀거나 강사에게 물어봐도 됩니다.</span></p><button class="btn quiet sm" data-act="jobCancel">만들기 취소</button>';
    else h+='<button class="btn sm" data-act="gen">기출 유형으로 문제 만들기</button>';
    h+='<label class="col" for="pasteIn" style="gap:6px"><span class="sub">공식 사이트에서 받은 기출 문제지의 글을 붙여 넣으면 문제로 바꾸고 해설을 붙입니다.</span><textarea class="field" id="pasteIn" placeholder="문 1. …  ① … ② … ③ … ④ …">'+esc(pasteDraft)+'</textarea></label>';
    h+='<button class="btn quiet sm" data-act="paste"'+(job?' disabled':'')+'>붙여 넣은 문제 가져오기</button>';
    h+='<p class="sub">AI가 만든 문제와 해설에는 오류가 있을 수 있습니다.</p>';
    if(S.custom.length)h+='<button class="btn quiet sm" data-act="clearCustom">추가한 문제 '+S.custom.length+'개 모두 지우기</button>';
  }else{h+='<p class="sub">'+(HAS_CLAUDE?'AI 기능을 준비하는 중이거나 이 화면에서는 쓸 수 없습니다.':'AI 기능은 강사 화면에서 AI를 연결하면 켜집니다.')+' 기본 문제는 그대로 풀 수 있습니다.</p>'+(HAS_CLAUDE?'':'<button class="btn quiet sm" data-act="tab" data-v="tutor">AI 연결하러 가기</button>');}
  h+='</div></details>';return h;}
function vReview(){var cnt=[0,0,0,0,0];allQ().forEach(function(q){var p=S.prog[q.id];if(p&&p.stage>=0&&p.stage<=4)cnt[p.stage]++;});

function loadConn(){var v='';try{v=localStorage.getItem(KEYLS)||'';}catch(e){}
  if(!v)return null;
  if(v.charAt(0)!=='{')return /^sk-ant-/.test(v)?{p:'anthropic',k:v,m:MODEL}:null;  // 1.2 까지는 Claude 키 글자만 저장했다
  try{var o=JSON.parse(v);return o&&PROV[o.p]&&typeof o.k==='string'&&o.k?{p:o.p,k:o.k,m:String(o.m||'')}:null;}catch(e){return null;}}
function setConn(c){CONN=c||null;try{if(CONN)localStorage.setItem(KEYLS,JSON.stringify(CONN));else localStorage.removeItem(KEYLS);}catch(e){}
  if(!HAS_CLAUDE)AI=CONN?keyAI():null;}
// claude.use('sample') 과 같은 모양: (input, {onText, modelTier}) → Promise<{text}>
function keyAI(){return function(input,opts){opts=opts||{};var c=CONN;if(!c)return Promise.reject({code:'bad_key'});
  var msgs=typeof input==='string'?[{role:'user',content:input}]:input,P=PROV[c.p];
  // 저장해 둔 모델이 없어졌으면 목록을 다시 받아 새 모델로 한 번 더 보낸다.
  return P.chat(c,msgs,opts).catch(function(e){if(!e||e.code!=='model')throw e;
    return P.pick(c.k,opts.signal).then(function(m){if(!m||m===c.m)throw e;c.m=m;if(CONN===c)setConn(c);return P.chat(c,msgs,opts);});});};}
// 이 키로는 앞으로도 안 되는 오류. 연결을 지우고 안내 카드를 다시 보여 준다.
function deadKey(e){var c=e&&e.code;return c==='bad_key'||c==='workspace'||c==='cors_org';}
function keyErr(e,p){var c=e&&e.code;
  return c==='bad_key'?'키가 맞지 않습니다. 키 전체를 빠짐없이 복사했는지, 위에서 고른 회사가 맞는지 확인해 주세요.':
    c==='no_credit'?'키는 맞지만 충전된 금액이 없습니다. '+PROV[p].site+'의 Billing(결제) 메뉴에서 충전한 뒤 다시 눌러 주세요.':
    c==='forbidden'?'이 키로는 AI를 쓸 수 없다고 합니다. '+PROV[p].site+'에서 키를 새로 만들어 주세요.':aiErr(e);}
function connectKey(){if(keyBusy)return;var k=keyDraft.replace(/["'\s]/g,'');
  if(k.length<20){keyMsg='키를 붙여 넣어 주세요. 키는 수십 자짜리 긴 영문·숫자입니다.';render();return;}
  // 키 모양으로 회사를 알 수 있으면 고른 것과 달라도 맞춰 준다.
  var p=/^sk-ant-/.test(k)?'anthropic':/^AIza/.test(k)?'gemini':/^sk-/.test(k)?'openai':keyProv;
  keyProv=p;keyBusy=true;keyMsg='';render();
  // 20초 안에 답이 없으면 그만두고 알린다. 취소 버튼으로도 멈출 수 있다.
  var ctl=window.AbortController?new AbortController():null,dead=false,tm=setTimeout(function(){end({code:'timeout'});},20000);
  function end(e,m){if(dead)return;dead=true;clearTimeout(tm);keyTask=null;keyBusy=false;
    if(e){if(ctl)try{ctl.abort();}catch(x){}keyMsg=e.code==='aborted'?'':keyErr(e,p);}
    else{keyDraft='';setConn({p:p,k:k,m:m});toast(PROV[p].short+' 연결을 마쳤습니다. 강사에게 물어보세요.');}
    render();}
  keyTask={cancel:function(){end({code:'aborted'});}};
  PROV[p].pick(k,ctl?ctl.signal:undefined).then(function(m){end(null,m);},function(e){end(e);});}
function webDictation(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;
  var rec=null,cb={},endRes=null;function state(s){if(cb.s)cb.s({state:s});}
  return {onPartial:function(f){cb.p=f;},onFinal:function(f){cb.f=f;},onState:function(f){cb.s=f;},
    start:function(){return new Promise(function(res,rej){try{rec=new R();rec.lang='ko-KR';rec.interimResults=true;rec.continuous=true;
      rec.onresult=function(ev){var part='';for(var i=ev.resultIndex;i<ev.results.length;i++){var x=ev.results[i];
          if(x.isFinal){if(cb.f)cb.f({text:x[0].transcript.trim()});}else part+=x[0].transcript;}
        if(cb.p)cb.p({text:part.trim()});};
      rec.onerror=function(ev){if(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed'))rej({code:'not_granted'});};
      rec.onstart=function(){state('listening');res();};
      rec.onend=function(){rec=null;state('idle');if(endRes){var f=endRes;endRes=null;f();}};
      rec.start();}catch(e){rej(e);}});},
    stop:function(){return new Promise(function(res){if(!rec){res();return;}endRes=res;try{rec.stop();}catch(e){endRes=null;res();}});}};}

function sysPrompt(){var t=TUTOR;
  var q=ctxId?qBy(ctxId):null;
  if(q){t+='\n[학생이 지금 보고 있는 문제]\n과목: '+q.subj+' / 단원: '+(q.unit||'')+'\n문제: '+plain(q.q)+'\n'+q.opts.map(function(o,i){return (i+1)+') '+plain(o);}).join('\n')+'\n정답: '+(q.ans+1)+'번\n해설: '+(q.exp||'');
    if(sess&&!sess.done&&cur()&&cur().id===q.id){if(sess.graded)t+='\n학생이 고른 답: '+(sess.pick+1)+'번 ('+(sess.ok?'정답':'오답')+')';else t+='\n학생은 아직 이 문제를 채점하지 않았습니다. 정답 번호를 바로 알려 주지 말고 힌트로 이끌어 주세요.';}
    else{var p=S.prog[q.id];if(p&&p.wrong)t+='\n학생은 이 문제를 '+p.wrong+'번 틀렸습니다.';}}
  var w=allQ().filter(function(x){return (S.prog[x.id]||{}).wrong>0;}).map(function(x){return x.subj+' '+x.unit;});
  if(w.length)t+='\n\n[학생이 틀린 적 있는 단원] '+w.filter(function(x,i){return w.indexOf(x)===i;}).slice(0,8).join(', ');
  return t;}
function buildMsgs(){var out=[];chat.forEach(function(m){if(m.role==='note'||m.pending||!m.content)return;
    var r=m.role==='user'?'user':'assistant';
    if(out.length&&out[out.length-1].role===r)out[out.length-1].content+='\n'+m.content;else out.push({role:r,content:m.content});});
  while(out.length>30)out.shift();while(out.length&&out[0].role!=='user')out.shift();
  if(out.length)out[0]={role:'user',content:sysPrompt()+'\n\n[학생의 말]\n'+out[0].content};
  return out;}
// AI 요청 하나. cancel() 을 부르면 요청을 끊고 promise 는 {code:'aborted'} 로 끝난다.
// claude.use('sample') 은 끊는 방법이 없어서 결과만 버린다.
function aiTask(input,opts){opts=opts||{};var ctl=!HAS_CLAUDE&&window.AbortController?new AbortController():null,dead=false,rej,onText=opts.onText;
  if(ctl)opts.signal=ctl.signal;
  if(onText)opts.onText=function(o){if(!dead)onText(o);};
  var pr=new Promise(function(res,reject){rej=reject;
    var run;try{run=AI(input,opts);}catch(e){reject(e);return;}
    run.then(function(r){if(!dead)res(r);},function(e){if(!dead)reject(e);});});
  return {promise:pr,cancel:function(){if(dead)return;dead=true;if(ctl)try{ctl.abort();}catch(e){}rej({code:'aborted'});}};}
function send(text,show){text=(text||'').trim();if(!text||busy)return;
  if(!AI){toast('AI 강사를 쓸 수 없습니다.');return;}
  chat.push({role:'user',content:text,show:show||null});var a={role:'assistant',content:'',pending:true};chat.push(a);
  busy=true;draft='';render();scrollEnd();
  var t=chatTask=aiTask(buildMsgs(),{cache:false,onText:function(o){if(!o||!o.text)return;a.part=o.text;var el=document.getElementById('stream');if(el){el.textContent=o.text;scrollEnd();}}});
  function done(){delete a.part;busy=false;if(chatTask===t)chatTask=null;saveChat();if(view==='tutor'){render();scrollEnd();}}
  t.promise.then(function(r){a.content=(r&&r.text||'').trim();a.pending=false;if(!a.content){chat.pop();chat.push({role:'note',content:'답을 받지 못했습니다. 다시 시도해 주세요.'});}
    done();if(a.content&&S.voiceOut)speak(a.content);},
  function(e){
    if(e&&e.code==='aborted'){var part=(a.part||'').trim();if(part){a.content=part;a.pending=false;}else chat.pop();chat.push({role:'note',content:'답을 멈췄습니다.'});done();return;}
    chat.pop();chat.push({role:'note',content:aiErr(e)});if(e&&e.code==='not_granted')AI=null;if(deadKey(e))setConn(null);done();});}
function scrollEnd(){window.scrollTo(0,document.documentElement.scrollHeight);}

function canSpeak(){return !!TTS||('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window);}
function speak(t){t=String(t).slice(0,1900);
  if(TTS){TTS.speak(t).catch(function(e){if(e&&e.code==='not_granted'){TTS=null;}});return;}
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';window.speechSynthesis.speak(u);}catch(e){}}
function stopSpeak(){try{if(TTS)TTS.stop();else if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}

function parseQs(text,subj){var a=text.indexOf('['),b=text.lastIndexOf(']');if(a<0||b<=a)return [];var arr;
  try{arr=JSON.parse(text.slice(a,b+1));}catch(e){return [];}
  if(!Array.isArray(arr))return [];var out=[],now=Date.now();
  arr.forEach(function(x,i){if(!x||typeof x.q!=='string'||!Array.isArray(x.opts)||x.opts.length!==4)return;
    var ans=parseInt(x.ans,10);if(!(ans>=1&&ans<=4))return;
    out.push({id:'a'+now+'_'+(qSeq++),subj:subj,unit:String(x.unit||'기타').slice(0,20),q:String(x.q).slice(0,1200),opts:x.opts.map(function(o){return String(o).slice(0,300);}),ans:ans-1,exp:String(x.exp||'').slice(0,1500),ai:true,src:'AI 생성'});});
  return out;}
var FORMAT='\n\n출력 형식: 설명 없이 JSON 배열만 출력한다.\n[{"unit":"단원명","q":"문제","opts":["선지1","선지2","선지3","선지4"],"ans":정답번호(1~4),"exp":"정답 근거와 나머지 선지가 틀린 이유를 담은 3~4문장 해설"}]';
function qKey(q){return plain(q.q).replace(/\s+/g,'');}
function jobText(){return job?job.label+' 만드는 중'+(job.count?' '+job.made+'/'+job.want:'')+'…':'';}

  if(!job){b.hidden=true;b.innerHTML='';return;}
  b.hidden=false;b.innerHTML='<span class="spin" aria-hidden="true"></span><span>'+esc(jobText())+'</span><button data-act="jobCancel">취소</button>';}

// AI로 문제를 만든다. 화면을 막지 않고 뒤에서 돌며(다른 화면을 써도 된다), 위쪽 띠(#jobBar)에 진행 상황과 취소 버튼을 보여 준다.
// o: {label, subj, want, batch(5문제씩 나눠 요청), count(진행 숫자 표시), src, prompt(k), done(qs) → 알림 글}
function startJob(o){if(!AI||job)return Promise.resolve([]);
  var j=job={label:o.label,want:o.want,made:0,count:!!o.count,task:null},all=[],tries=Math.ceil(o.want/5)+1;
  jobTouch();
  return new Promise(function(res){
    function finish(msg){if(job===j)job=null;var okMsg=all.length&&o.done?o.done(all):'';
      updateJob();toast(msg||okMsg);res(all);if(view!=='tutor')render();}
    function step(){var k=o.batch?Math.min(5,j.want-j.made):j.want;
      j.task=aiTask(o.prompt(k)+FORMAT,{modelTier:'default'});
      j.task.promise.then(function(r){var have={};allQ().forEach(function(q){have[qKey(q)]=1;});
        var qs=parseQs(r&&r.text||'',o.subj).filter(function(q){var key=qKey(q);if(have[key])return false;have[key]=1;return true;});
        if(o.batch)qs=qs.slice(0,k);
        if(o.src)qs.forEach(function(q){q.src=o.src;});
        if(qs.length){S.custom=S.custom.concat(qs);save();all=all.concat(qs);j.made+=qs.length;}
        tries--;
        if(o.batch&&qs.length&&j.made<j.want&&tries>0){jobTouch();step();return;}
        finish(all.length?'':'문제를 만들지 못했습니다. 다시 시도해 주세요.');},
      function(e){
        if(e&&e.code==='aborted'){finish(all.length?'만들기를 멈췄습니다. '+all.length+'개는 추가했습니다.':'만들기를 취소했습니다.');return;}
        if(deadKey(e))setConn(null);finish((all.length?all.length+'개를 만든 뒤 멈췄습니다. ':'')+aiErr(e));});}
    step();});}
function genPrompt(subj,n,seed){var ex=allQ().filter(function(q){return q.subj===subj;});
  var sample=shuffle(ex).slice(0,3).map(function(q){return {unit:q.unit,q:plain(q.q),opts:q.opts.map(plain),ans:q.ans+1,exp:q.exp};});
  var p='너는 한국 8급 간호직 지방공무원 필기시험의 출제 경향을 잘 아는 출제위원이다. 과목 "'+subj+'"의 4지선다 문제 '+n+'개를 새로 만든다.\n조건:\n- 실제 기출문제의 유형, 난이도, 문체를 따른다(9급 공통과목 또는 8급 간호직 전문과목 수준).\n- 정답은 반드시 하나이고 사실관계가 정확해야 한다. 법령과 제도는 현행 기준으로 쓴다. 확신이 없는 내용은 출제하지 않는다.\n- 아래 [이미 있는 문제]와 겹치지 않게, 자주 출제되는 다른 단원에서 고르게 낸다.\n';
  if(seed)p+='- 특히 다음 문제와 같은 개념을 다른 각도에서 묻는 문제로 만든다: '+plain(seed.q)+' (단원: '+seed.unit+')\n';
  p+='\n[문체 예시]\n'+JSON.stringify(sample)+'\n\n[이미 있는 문제]\n'+ex.slice(-40).map(function(q){return '- '+plain(q.q).slice(0,60);}).join('\n');
  return p;}

        withTimeout(col.orderBy('updatedAt','desc').limit(40).get(),10000).then(function(qs){CHCOL=col;var byId={};CH.forEach(function(c){byId[c.id]=c;});
          (qs&&qs.docs||[]).forEach(function(d0){var c=null;try{c=JSON.parse(d0.data().json);}catch(e){}
            if(!validChat(c))return;var mine=byId[c.id];
            if(!mine){CH.push(c);byId[c.id]=c;}else if(c.updatedAt>mine.updatedAt&&!(C&&C.id===c.id)){mine.msgs=c.msgs;mine.title=c.title;mine.ctxId=c.ctxId;mine.updatedAt=c.updatedAt;}
            byId[c.id].remote=c.updatedAt;});
