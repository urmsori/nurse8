<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8급 간호직 학습 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 배치: 앱 전체가 한 권의 시험지. 흰 종이마다 굵은 윗줄과 자간 넓힌 제목을 두고, 본문은 명조, 조작은 고딕과 먹색 버튼, 채점과 복습은 빨간 펜으로 통일한다. */
:root{
  --paper:#F1F2F4;--card:#FFFFFF;--ink:#16181D;--sub:#565B66;--line:#DDDFE4;--line2:#B9BDC6;
  --pen:#2747C7;--pen-t:#E6EBFB;
  --ok:#0A6B50;--on-ok:#FFFFFF;--ok-t:#DDF2EA;
  --no:#C0321F;--no-t:#FBE6E1;
  --hl:#FFE680;
  --ui:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --exam:'Noto Serif KR','AppleMyungjo','Batang',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111318;--card:#1B1E25;--ink:#ECEEF3;--sub:#A3A9B8;--line:#2C303C;--line2:#474C5A;
  --pen:#8FA6FF;--pen-t:#232B4D;
  --ok:#5FD0A8;--on-ok:#06261C;--ok-t:#12332A;
  --no:#FF8A7A;--no-t:#3B1A16;
  --hl:#6B5A10;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#111318;--card:#1B1E25;--ink:#ECEEF3;--sub:#A3A9B8;--line:#2C303C;--line2:#474C5A;
  --pen:#8FA6FF;--pen-t:#232B4D;
  --ok:#5FD0A8;--on-ok:#06261C;--ok-t:#12332A;
  --no:#FF8A7A;--no-t:#3B1A16;
  --hl:#6B5A10;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:13px;font-weight:800;color:var(--sub)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:20px 20px 96px;display:flex;flex-direction:column;gap:18px}
#app.focus{padding-bottom:0}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.sub{color:var(--sub);font-size:13px}
.grow{flex:1;min-width:0}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
/* 종이 한 장. 평소에는 선 없이 흰 종이와 제목만 두고, 문제 화면(.exam)에서만 시험지의 굵은 머리줄을 쓴다. */
.sheet{background:var(--card);border-radius:6px;padding:18px 18px 18px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh .subj{flex:1;min-width:0;font-size:17px;font-weight:800}
.sh .unit{font-size:13px;font-weight:600;color:var(--sub);text-align:right}
.sh .kind{padding:3px 8px;border-radius:4px;background:var(--paper);color:var(--sub);font-size:12px;font-weight:800;white-space:nowrap}
.sheet.exam{border:1px solid var(--line2);border-radius:4px;padding:14px 18px 16px}
.exam .sh{padding:10px 0 9px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);margin-bottom:16px}
.exam .sh .subj{font-size:16px;letter-spacing:.25em}
.exam .sh .unit{font-size:12px}
.exam .sh .kind{border:1px solid var(--ink);border-radius:0;background:none;color:var(--ink);padding:2px 8px}
.body{font-family:var(--exam);font-size:16px;font-weight:500;line-height:1.8}

/* 버튼과 네모 칸 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:0 18px;border:0;border-radius:6px;background:var(--ink);color:var(--card);font-size:17px;font-weight:800;letter-spacing:.04em;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--sub)}
.btn.quiet{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{min-height:46px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-size:13px;font-weight:800;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pill:disabled{border-color:var(--line2);color:var(--sub)}
.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;border-radius:4px;flex:none}
.ai{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--pen);border-radius:2px;color:var(--pen);font-size:11px;font-weight:800;letter-spacing:0}
.sq{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border:1px solid var(--line2);border-radius:6px;flex:none;background:var(--card);color:var(--ink)}
.sq.fill{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sq:disabled{border-color:var(--line2);background:var(--line);color:var(--sub)}
.sq.on{background:var(--no);border-color:var(--no);color:var(--card);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--no-t)}}

/* 줄 목록 */
.rows{display:flex;flex-direction:column;margin:-8px 0 -8px}
.rows > button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.rows > button:last-child,.rows > div:last-child{border-bottom:0}
.rows > div{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.rows > div > button.grow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border:0;background:none;text-align:left}
.rows .dayh{min-height:36px;padding:10px 0 4px;font-size:12px;font-weight:800;color:var(--sub);justify-content:space-between}
.rows .mk{display:flex;align-items:center;justify-content:center;width:26px;height:26px;color:var(--no);flex:none}
.sname{width:100px;font-weight:800;flex:none}
.bar{flex:1;height:6px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pen)}
.cnt{width:52px;text-align:right;font-family:var(--exam);font-size:14px;font-weight:700;color:var(--sub);flex:none}
.item{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item small{font-size:12px;font-weight:700;color:var(--sub)}
.item span{font-family:var(--exam);font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;font-weight:800;white-space:nowrap;color:var(--no)}
.st.g{color:var(--sub)}

/* 표: 이번 주, 복습 단계 */
.tbl{display:grid;gap:6px}
.tbl > div{display:flex;flex-direction:column;min-width:0;border-radius:4px;background:var(--paper);overflow:hidden}
.tbl > div > span{display:block;padding:5px 0 0;font-size:12px;font-weight:800;color:var(--sub);text-align:center}
.tbl > div > i,.tbl > div > b{display:flex;align-items:center;justify-content:center;height:46px;font-style:normal;font-family:var(--exam);font-size:22px;font-weight:700}
.tbl .now{box-shadow:inset 0 0 0 2px var(--ink)}
.tbl .now > span{color:var(--ink)}
.tbl svg{color:var(--no)}
.tbl .first b{color:var(--no)}
.tbl .last b{color:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 오늘 */
.big{font-family:var(--exam);font-size:44px;font-weight:700;line-height:1.1}
.big small{font-size:20px;margin-left:4px}
.split{display:flex;height:8px;background:var(--line);gap:2px}
.split i{display:block;height:100%}
.split .r{background:var(--no)}
.split .n{background:var(--pen)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sub)}
.legend b{color:var(--ink);font-family:var(--exam)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}

/* 문제 풀이 */
.qtop{display:flex;align-items:center;gap:8px;margin:-8px -8px 0 -12px}
.prog{flex:1;height:8px;border:1px solid var(--ink);background:var(--card);overflow:hidden}
.prog > i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.qrow{position:relative;display:flex;gap:8px;font-family:var(--exam);font-size:18px;font-weight:500;line-height:1.75}
.qrow .no{font-family:var(--ui);font-weight:800;flex:none;white-space:nowrap}
.qrow .stem{flex:1;min-width:0;white-space:pre-line}
.pen{position:absolute;left:-16px;top:-13px;width:76px;height:58px;color:var(--no);pointer-events:none}
.pen path,.score path{stroke-dasharray:260;stroke-dashoffset:0}
.pen.draw path,.score path{animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
.passage{margin-top:12px;padding:12px 14px;border:1px solid var(--ink);font-family:var(--exam);font-size:17px;font-weight:500;line-height:1.75;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:2px;margin:12px -8px -6px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:52px;padding:12px 8px;border:0;border-radius:4px;background:none;font-family:var(--exam);font-size:17px;font-weight:500;line-height:1.6;text-align:left}
.opt .n{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:12px;border:1px solid var(--ink);font-size:13px;font-weight:700;line-height:1;flex:none}
.opt .t{flex:1;min-width:0}
.opt .m{font-family:var(--ui);font-size:12px;font-weight:800;white-space:nowrap;margin-top:4px}
.opt.sel{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.opt.sel .n{background:var(--ink);color:var(--card)}
.opt.right{background:var(--ok-t);color:var(--ok);font-weight:700}
.opt.right .n{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.opt.wrong{background:var(--no-t);color:var(--no);font-weight:700}
.opt.wrong .n{background:var(--no);border-color:var(--no);color:var(--card)}
.opt.dim{color:var(--sub)}
.opt.dim .n{border-color:var(--sub)}
.aibox{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.steps{margin:0;padding-left:22px;font-family:var(--exam);font-size:15px;font-weight:500;line-height:1.75}
.steps li{padding:2px 0}
a.btn{text-decoration:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.conn .cd{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--sub)}
.conn.on{color:var(--ok)}
.conn.on .cd{background:var(--ok);border-color:var(--ok)}
.conn.wait,.sub.wait{color:var(--pen);font-weight:700}
.sub.wait{display:flex;align-items:center;gap:8px}
#jobBar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:0 8px 0 20px;min-height:48px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;font-weight:800;color:var(--pen)}
#jobBar[hidden]{display:none}
#jobBar button{margin-left:auto;min-height:44px;padding:0 12px;border:0;background:none;font-weight:800;color:var(--ink)}
.sub.warn{color:var(--no);font-weight:700}
.foot{position:sticky;bottom:0;margin:auto -20px 0;padding:12px 20px 16px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;z-index:3}
.foot.good{background:var(--ok-t);border-top:3px solid var(--ok)}
.foot.bad{background:var(--no-t);border-top:3px solid var(--no)}
.foot.pop{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.verdict{display:flex;align-items:flex-start;gap:12px}
.verdict .ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;flex:none}
.good .verdict{color:var(--ok)}
.good .verdict .ic{background:var(--ok);color:var(--on-ok)}
.bad .verdict{color:var(--no)}
.bad .verdict .ic{background:var(--no);color:var(--card)}
.verdict b{display:block;font-size:18px;font-weight:800;line-height:1.3}
.verdict span{font-size:14px;font-weight:600}
.verdict mark{background:var(--hl);color:var(--ink);padding:1px 5px;font-family:var(--exam)}
.good .btn{background:var(--ok);color:var(--on-ok)}
.bad .btn{background:var(--no);color:var(--card)}

/* 채점 결과 */
.score{position:relative;align-self:center;padding:0 18px 14px;font-family:var(--exam);font-size:60px;font-weight:700;line-height:1.1;color:var(--no)}
.score small{font-size:28px}
.score svg{position:absolute;left:0;bottom:0;width:100%;height:16px}

/* 복습 */
.switch{display:flex;align-items:center;width:54px;height:30px;padding:3px;border:1px solid var(--line2);border-radius:4px;background:var(--card);flex:none}
.switch i{width:22px;height:22px;border-radius:2px;background:var(--sub);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"] i{background:var(--card);transform:translateX(24px)}
.chip-w{min-height:44px;padding:0 12px;border:0;border-radius:4px;background:var(--no-t);color:var(--no);font-size:13px;font-weight:800}
.field{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-size:16px}
textarea.field{min-height:120px;resize:vertical;font-family:var(--exam)}
details > summary{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:800;cursor:pointer;list-style:none}
details > summary::-webkit-details-marker{display:none}
details[open] > summary .chev{transform:rotate(90deg)}

/* 강사 */
.ctx{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 4px 4px 12px;border-radius:4px;background:var(--card);font-size:13px;font-weight:700}
.ctx span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;gap:12px;flex:1}
.msg{max-width:90%;padding:12px 14px;border-radius:4px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--card);font-size:15px;font-weight:600;line-height:1.6}
.msg.a{align-self:flex-start;background:var(--card);font-family:var(--exam);font-size:16px;font-weight:500;line-height:1.8}
.msg.n{align-self:center;background:none;color:var(--sub);font-size:13px;text-align:center;padding:4px}
.msg .again{display:flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:none;font-family:var(--ui);font-size:13px;font-weight:800}
.composer{position:sticky;bottom:72px;margin:0 -20px -24px;padding:10px 20px 14px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:3}
.composer .status{font-size:13px;font-weight:600;color:var(--sub);min-height:20px}
.composer form{display:flex;align-items:center;gap:8px}
.composer input{flex:1;min-width:0;height:54px;padding:0 14px;border:1px solid var(--line2);border-radius:6px;background:var(--card);font-size:16px}
.composer input:disabled{border-color:var(--line2)}

nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--line);z-index:5}
nav > div{max-width:480px;margin:0 auto;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:12px;font-weight:700;text-decoration:none}
nav a[aria-current="page"]{color:var(--ink);font-weight:800}
nav a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--ink)}
nav a .badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:var(--card);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
nav.hide{display:none}
[hidden]{display:none!important}
dialog{border:0;border-radius:8px;padding:20px;width:min(340px,calc(100vw - 40px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,18,.55)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 40px);padding:12px 16px;border-radius:4px;background:var(--ink);color:var(--card);font-size:14px;font-weight:700;z-index:9;display:none}
u{text-underline-offset:4px}
.blank{display:inline-block;width:4.5em;border-bottom:1px solid currentColor;vertical-align:baseline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="jobBar" role="status" hidden></div>
<main id="app"></main>
<nav id="nav" aria-label="주요 메뉴"><div>
<a href="#home" data-tab="home"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>오늘</span></a>
<a href="#quiz" data-tab="quiz"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7"/><path d="M9 16h7"/></svg><span>과목</span></a>
<a href="#review" data-tab="review"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M4 20v-5h5"/></svg><span>복습</span><span class="badge num" id="navDue" hidden></span></a>
<a href="#tutor" data-tab="tutor"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span>강사</span></a>
<a href="#records" data-tab="records"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/><path d="M12 7v5l3 2"/></svg><span>기록</span></a>
</div></nav>
<dialog id="dlg" aria-labelledby="dlgT">
<form id="dlgF" class="col" style="gap:14px">
<header class="sh" style="margin:0"><b class="subj" id="dlgT">학습 설정</b></header>
<label class="col" for="examIn"><span class="sub">필기시험 날짜</span><input class="field" type="date" id="examIn"></label>
<label class="col" for="goalIn"><span class="sub">하루에 새로 풀 문제 수 (복습할 문제는 여기에 더해집니다)</span><select class="field" id="goalIn"></select></label>
<div class="row"><button type="button" class="btn quiet sm" data-act="dlgClose">취소</button><button type="submit" class="btn sm">저장</button></div>
</form>
</dialog>
<dialog id="quitDlg" aria-labelledby="quitT">
<div class="col" style="gap:14px">
<header class="sh" style="margin:0"><b class="subj" id="quitT">그만할까요</b></header>

<script>
var BANK = [
{"id":"m01","subj":"간호관리","unit":"동기부여","q":"허즈버그(Herzberg)의 2요인 이론에서 동기요인에 해당하는 것은?","opts":["급여","작업 조건","성취감","동료와의 관계"],"ans":2,"exp":"동기요인은 일 자체에서 오는 만족으로 성취감, 인정, 책임, 승진, 성장이 해당한다. 급여, 작업 조건, 대인관계, 감독, 회사 정책은 위생요인이다. 위생요인은 부족하면 불만을 낳지만 채워져도 동기를 높이지는 않는다."},
{"id":"m02","subj":"간호관리","unit":"기획","q":"최고관리자가 조직 전체의 방향을 정하기 위해 수립하는 장기적이고 포괄적인 기획은?","opts":["전략적 기획","전술적 기획","운영적 기획","단용 계획"],"ans":0,"exp":"전략적 기획은 최고관리층이 조직의 비전과 장기 목표를 정하는 기획이다. 전술적 기획은 중간관리층이 전략을 부서 단위로 구체화하는 중기 기획이고, 운영적 기획은 일선관리자가 세우는 단기의 구체적 실행 계획이다."},
{"id":"m03","subj":"간호관리","unit":"간호전달체계","q":"한 명의 간호사가 환자의 입원부터 퇴원까지 24시간 간호 계획과 결과에 책임을 지는 간호전달체계는?","opts":["기능적 분담방법","팀 간호방법","일차간호방법","모듈 방법"],"ans":2,"exp":"일차간호방법은 일차간호사가 담당 환자의 입원에서 퇴원까지 간호를 계획하고 책임진다. 기능적 분담방법은 투약, 처치처럼 업무별로 나누어 맡는 방식이고, 팀 간호방법은 팀 리더를 중심으로 팀원이 함께 간호하는 방식이다."},
{"id":"m04","subj":"간호관리","unit":"리더십","q":"허시와 블랜차드의 상황적 리더십 이론에서, 구성원의 능력과 의지가 모두 낮을 때 가장 적합한 리더십 유형은?","opts":["지시형","설득형","참여형","위임형"],"ans":0,"exp":"구성원 성숙도가 가장 낮은 단계(능력 낮음, 의지 낮음)에는 과업 지향이 높고 관계 지향이 낮은 지시형이 적합하다. 능력은 낮지만 의지가 높으면 설득형, 능력은 높지만 의지가 낮으면 참여형, 둘 다 높으면 위임형이다."},
{"id":"m05","subj":"간호관리","unit":"조직","q":"조직 구조의 구성 요소 중, 직무 수행에 관한 규칙과 절차가 문서로 표준화되어 있는 정도를 뜻하는 것은?","opts":["복잡성","공식화","집권화","분권화"],"ans":1,"exp":"공식화는 직무가 규칙, 절차, 지침으로 표준화된 정도이다. 복잡성은 조직이 수평적, 수직적, 지역적으로 분화된 정도이고, 집권화는 의사결정 권한이 상위 계층에 집중된 정도이다."},
{"id":"m06","subj":"간호관리","unit":"질 관리","q":"도나베디안(Donabedian)의 질 평가 접근법 중 구조적 평가에 해당하는 것은?","opts":["환자 만족도","간호기록을 통한 간호수행 평가","간호사 대 환자 비율","평균 재원 일수"],"ans":2,"exp":"구조적 평가는 간호가 제공되는 여건을 본다. 인력, 시설, 장비, 정책, 조직 구조가 해당하므로 간호사 대 환자 비율이 정답이다. 간호수행 평가는 과정적 평가이고, 환자 만족도와 재원 일수는 결과적 평가이다."},
{"id":"m07","subj":"간호관리","unit":"환자안전","q":"환자에게 사망이나 심각한 신체적·정신적 손상을 초래한 예기치 못한 사건을 뜻하는 용어는?","opts":["근접오류","위해사건","적신호 사건","잠재적 오류"],"ans":2,"exp":"적신호 사건은 사망이나 영구적 손상 같은 심각한 결과를 낳은 예기치 못한 사건이다. 근접오류는 오류가 있었지만 환자에게 도달하기 전에 발견되어 해가 없었던 경우이고, 위해사건은 의료 제공 과정에서 환자에게 해가 발생한 사건 전반을 가리킨다."},
{"id":"m08","subj":"간호관리","unit":"예산","q":"전년도 예산을 기준으로 삼지 않고 모든 사업을 원점에서 다시 검토하여 우선순위에 따라 편성하는 예산제도는?","opts":["점증적 예산제도","영기준 예산제도","품목별 예산제도","성과주의 예산제도"],"ans":1,"exp":"영기준 예산제도는 기존 사업도 처음 시작하는 것처럼 타당성을 다시 검토해 편성한다. 점증적 예산제도는 전년도 예산에 일정 비율을 더하는 방식이고, 품목별 예산제도는 지출 대상 품목별로, 성과주의 예산제도는 사업과 성과 중심으로 편성한다."},
{"id":"m09","subj":"간호관리","unit":"인적자원관리","q":"직무분석의 결과물 중, 직무 수행에 필요한 자격·지식·기술 등 인적 요건을 기술한 문서는?","opts":["직무기술서","직무명세서","직무평가서","인사고과표"],"ans":1,"exp":"직무명세서는 그 직무를 수행하는 사람에게 요구되는 인적 요건을 적는다. 직무기술서는 직무의 목적, 과업, 책임, 근무 조건 등 직무 자체의 내용을 적는다. 직무평가는 직무 간 상대적 가치를 정해 임금 결정에 활용하는 절차이다."},
{"id":"m10","subj":"간호관리","unit":"인사고과","q":"피평가자의 한 가지 뛰어난 특성 때문에 다른 평가 항목까지 높게 평가하는 인사고과 오류는?","opts":["후광효과","관대화 경향","중심화 경향","근접 오류"],"ans":0,"exp":"후광효과는 한 가지 특성의 인상이 다른 항목 평가에 번지는 오류이다. 관대화 경향은 전반적으로 실제보다 높게 평가하는 것이고, 중심화 경향은 모두 중간 점수로 평가하는 것이며, 근접 오류는 평가 항목이 가까이 놓여 있거나 평가 시점이 가까울 때 비슷한 점수를 주는 것이다."},
{"id":"m11","subj":"간호관리","unit":"의사소통","q":"구성원 누구나 다른 모든 구성원과 직접 정보를 주고받을 수 있고, 구성원 만족도가 가장 높은 의사소통 네트워크 유형은?","opts":["사슬형","수레바퀴형","원형","완전연결형"],"ans":3,"exp":"완전연결형은 모든 구성원이 자유롭게 소통하여 만족도가 높고 창의적 문제 해결에 유리하다. 사슬형은 공식 명령 계통을 따라 위아래로만 흐르고, 수레바퀴형은 중심 인물 한 명에게 정보가 집중되어 단순 과업에서 빠르다."},
{"id":"m12","subj":"간호관리","unit":"간호윤리","q":"\"환자에게 해를 입히거나 해가 될 위험을 초래하는 행위를 하지 않아야 한다\"는 생명윤리 원칙은?","opts":["자율성 존중의 원칙","악행금지의 원칙","선행의 원칙","정의의 원칙"],"ans":1,"exp":"악행금지의 원칙은 해를 끼치지 말라는 원칙이다. 선행의 원칙은 한 걸음 더 나아가 적극적으로 이익이 되는 행위를 하라는 것이고, 자율성 존중은 환자의 자기 결정을 존중하는 것이며, 정의의 원칙은 자원과 부담을 공정하게 분배하는 것이다."},
{"id":"m13","subj":"간호관리","unit":"관리이론","q":"테일러(Taylor)의 과학적 관리론에 대한 설명으로 옳은 것은?","opts":["시간-동작 연구로 과업의 표준을 정하고 차별 성과급을 적용하였다","비공식 집단과 사회적 욕구가 생산성을 좌우한다고 보았다","조직 전체에 적용할 관리 원칙 14가지를 제시하였다","조직을 환경과 상호작용하는 개방 체계로 보았다"],"ans":0,"exp":"과학적 관리론은 시간-동작 연구로 하루의 표준 작업량을 정하고, 달성 여부에 따라 임금을 달리 주는 차별 성과급으로 능률을 높이려 하였다. 관리 원칙 14가지는 페이욜의 행정관리론, 비공식 집단과 사회적 욕구는 인간관계론, 개방 체계는 체계이론의 내용이다."},
{"id":"m14","subj":"간호관리","unit":"관리이론","q":"메이요(Mayo)의 호손 실험 결과로 강조된 내용은?","opts":["생산성은 구성원의 사회·심리적 요인과 비공식 집단의 영향을 받는다","합법적 권한에 근거한 계층 구조가 가장 능률적인 조직 형태이다","분업과 작업 표준화가 생산성을 높이는 유일한 최선의 방법이다","생산성은 조명과 같은 물리적 작업 조건에 따라 결정된다"],"ans":0,"exp":"호손 실험에서는 조명 같은 물리적 조건보다 구성원의 감정, 인정받는다는 느낌, 비공식 집단의 규범이 생산성에 더 큰 영향을 준다는 결과가 나왔고, 이것이 인간관계론의 바탕이 되었다. 분업과 표준화는 과학적 관리론, 합법적 권한과 계층 구조는 관료제 이론의 주장이다."},
{"id":"m15","subj":"간호관리","unit":"관리이론","q":"베버(Weber)의 관료제 이론이 제시한 이상적 조직의 특성으로 옳지 않은 것은?","opts":["권한의 계층에 따른 명확한 위계","전문적 자격과 능력에 근거한 선발과 승진","문서화된 규칙과 절차에 따른 업무 수행","개인적 친분과 감정을 고려한 업무 처리"],"ans":3,"exp":"관료제는 개인적 감정과 친분을 배제하고 규칙에 따라 공평하게 업무를 처리하는 비개인성(공사의 구분)을 특성으로 한다. 계층에 따른 위계, 문서화된 규칙과 절차, 전문 자격에 따른 선발과 승진, 분업은 모두 관료제의 특성이다."},
{"id":"m16","subj":"간호관리","unit":"관리이론","q":"간호관리 체계모형에서 전환 과정(변환 과정)에 해당하는 것은?","opts":["환자 만족도와 간호의 질","간호 인력, 물자, 자금, 정보","간호사 이직률과 재원 일수","기획, 조직, 인사, 지휘, 통제"],"ans":3,"exp":"체계모형은 투입, 전환 과정, 산출, 피드백으로 이루어지며 전환 과정은 투입을 산출로 바꾸는 관리 과정(기획, 조직, 인사, 지휘, 통제)이다. 인력, 물자, 자금, 정보는 투입이고 환자 만족도, 간호의 질, 이직률, 재원 일수는 산출이다."},
{"id":"m17","subj":"간호관리","unit":"관리이론","q":"카츠(Katz)가 제시한 관리 기술 중 최고관리자에게 상대적으로 가장 많이 요구되는 것은?","opts":["개념적 기술","실무적 기술","인간적 기술","임상 수기 기술"],"ans":0,"exp":"개념적 기술은 조직 전체를 보고 부분 간의 관계를 파악하여 방향을 정하는 능력으로, 위 계층으로 갈수록 더 많이 요구된다. 실무적(전문적) 기술은 일선관리자에게 가장 많이 필요하고 임상 수기도 여기에 속한다. 인간적 기술은 모든 계층의 관리자에게 비슷하게 중요하다."},
{"id":"m18","subj":"간호관리","unit":"관리이론","q":"다음 설명에 해당하는 개념은?\n\n투입한 자원에 대한 산출의 비율이다. 최소의 자원으로 최대의 산출을 얻었는지를 나타내며, '일을 올바르게 하는 것'에 해당한다.","opts":["형평성","효율성","효과성","적합성"],"ans":1,"exp":"효율성은 투입 대 산출의 비율로, 자원을 낭비 없이 사용했는지를 본다. 효과성은 설정한 목표를 얼마나 달성했는지를 뜻하며 '올바른 일을 하는 것'에 해당한다. 형평성은 공정한 분배, 적합성은 대상자의 요구에 맞는 정도를 말한다."},
{"id":"m19","subj":"간호관리","unit":"기획","q":"기획의 원칙 중 \"상황이 변하면 계획을 수정할 수 있도록 융통성을 두어야 한다\"는 원칙은?","opts":["탄력성의 원칙","포괄성의 원칙","계층화의 원칙","간결성의 원칙"],"ans":0,"exp":"탄력성의 원칙은 환경 변화에 맞추어 계획을 조정할 수 있어야 한다는 것이다. 계층화의 원칙은 큰 계획에서 구체적인 하위 계획이 차례로 파생되어야 한다는 것이고, 간결성의 원칙은 계획을 쉽고 명료하게 표현하라는 것이며, 포괄성의 원칙은 필요한 인력, 물자, 예산 등 모든 요소를 빠짐없이 담으라는 것이다."},
{"id":"m20","subj":"간호관리","unit":"기획","q":"다음 설명에 해당하는 기획의 계층은?\n\n특정 업무를 수행하는 방법을 시간 순서에 따라 단계별로 제시한 지침이다.\n예: 유치도뇨관 삽입 순서, 입원 환자 접수 순서","opts":["정책","철학","절차","규칙"],"ans":2,"exp":"절차는 업무를 수행하는 방법과 순서를 단계별로 적은 지침이다. 정책은 의사결정과 행동의 방향을 제시하는 포괄적 지침이고, 규칙은 해야 할 것과 하지 말아야 할 것을 정해 재량의 여지가 없는 지시이다. 철학은 조직 구성원의 행동을 이끄는 신념과 가치를 진술한 것이다."},
{"id":"m21","subj":"간호관리","unit":"기획","q":"목표관리(MBO)에 대한 설명으로 옳지 않은 것은?","opts":["구성원이 자신의 목표를 정하는 과정에 참여한다","목표는 측정할 수 있도록 구체적으로 정한다","정해진 기간 뒤에 성과를 함께 평가하고 피드백한다","목표는 상급자가 단독으로 정하여 하급자에게 내려보낸다"],"ans":3,"exp":"목표관리는 상급자와 하급자가 협의하여 목표를 정하고, 구성원이 스스로 통제하며 수행한 뒤 성과를 함께 평가하는 참여적 관리 기법이다. 상급자가 혼자 목표를 정해 내려보내는 것은 목표관리의 핵심인 참여와 자기 통제에 어긋난다."},
{"id":"m22","subj":"간호관리","unit":"기획","q":"다음과 같이 진행한 집단 의사결정 방법은?\n\n간호사 7명이 한자리에 모였지만 서로 말을 하지 않고 각자 해결 방안을 종이에 적어 냈다. 진행자가 모든 의견을 칠판에 적은 뒤 의견별로 설명을 듣고, 무기명 투표로 우선순위를 정하였다.","opts":["명목집단법","델파이법","전자회의법","브레인스토밍"],"ans":0,"exp":"명목집단법은 구성원이 모이기는 하지만 토의 없이 각자 의견을 글로 내고 투표로 결정하여, 소수의 발언 독점과 동조 압력을 줄이는 방법이다. 브레인스토밍은 비판 없이 자유롭게 말로 아이디어를 내는 방법이고, 델파이법은 전문가들이 만나지 않고 익명 설문을 여러 차례 반복하여 의견을 모으는 방법이다."},
{"id":"m23","subj":"간호관리","unit":"기획","q":"응집력이 강한 집단에서 만장일치를 이루려는 압력 때문에 반대 의견이 억제되고 대안을 충분히 검토하지 못하게 되는 현상은?","opts":["선택적 지각","사회적 태만","집단 양극화","집단사고"],"ans":3,"exp":"집단사고는 응집력이 높은 집단이 합의를 지나치게 중시하여 비판적 검토 없이 결정을 내리는 현상이다. 집단 양극화는 토의 뒤에 집단의 의견이 처음보다 더 극단으로 치우치는 것이고, 사회적 태만은 집단 속에서 개인이 노력을 덜 하는 것이며, 선택적 지각은 자신에게 유리한 정보만 받아들이는 것이다."},
{"id":"m24","subj":"간호관리","unit":"기획","q":"과업 완료에 걸리는 시간을 낙관적 시간, 가능성이 가장 높은 시간, 비관적 시간의 세 가지로 추정하고, 활동들의 선후 관계를 연결망으로 나타내는 기획 기법은?","opts":["의사결정 나무","간트 차트","PERT","기획예산제도(PPBS)"],"ans":2,"exp":"PERT는 세 가지 추정 시간으로 기대 시간을 계산하고 활동 간의 관계를 연결망으로 그려, 불확실성이 큰 사업의 일정을 관리하는 기법이다. 간트 차트는 활동별 일정을 막대로 표시하는 도표이고, 의사결정 나무는 대안과 그 결과를 가지 모양으로 그려 비교하는 도구이며, 기획예산제도는 장기 계획과 예산 편성을 연결하는 예산 제도이다."},
{"id":"m25","subj":"간호관리","unit":"기획","q":"A 병원 간호부가 SWOT 분석 뒤 다음 전략을 세웠다. 이 전략의 유형은?\n\n숙련된 전문간호사가 많다는 내부 강점을 살려, 지역 노인 인구 증가로 가정간호 수요가 늘어나는 외부 기회를 선점하고자 가정간호 사업을 확대한다.","opts":["SO 전략","ST 전략","WO 전략","WT 전략"],"ans":0,"exp":"내부의 강점(S)을 이용해 외부의 기회(O)를 살리는 것은 SO 전략이다. ST 전략은 강점으로 외부 위협에 대응하는 것, WO 전략은 약점을 보완하여 기회를 살리는 것, WT 전략은 약점을 줄이고 위협을 피하는 방어적 전략이다."},
{"id":"m26","subj":"간호관리","unit":"재무관리","q":"일정 시점에서 의료기관의 자산, 부채, 자본의 상태를 보여 주는 재무제표는?","opts":["재무상태표","현금흐름표","손익계산서","자본변동표"],"ans":0,"exp":"재무상태표(대차대조표)는 특정 시점의 자산, 부채, 자본을 보여 주어 재무 구조의 건전성을 알 수 있게 한다. 손익계산서는 일정 기간의 수익과 비용으로 경영 성과를 보여 주고, 현금흐름표는 일정 기간의 현금 유입과 유출을, 자본변동표는 일정 기간의 자본 변동 내용을 보여 준다."},
{"id":"m27","subj":"간호관리","unit":"예산","q":"A 병동 수간호사가 내년도에 환자 감시 장치와 인공호흡기를 구입하기 위해 편성해야 하는 예산은?","opts":["현금예산","자본지출예산","운영예산","인력예산"],"ans":1,"exp":"자본지출예산은 건물, 고가 장비처럼 오래 사용하는 고정 자산의 구입에 쓰는 예산이다. 운영예산은 한 회계 연도의 일상적 운영에 드는 소모품비, 관리비 등을 다루고, 인력예산은 급여와 수당 등 인건비를, 현금예산은 현금의 수입과 지출 흐름을 다룬다."},
{"id":"m28","subj":"간호관리","unit":"예산","q":"예산 과정을 순서대로 나열한 것은?","opts":["편성 → 심의·확정 → 집행 → 결산 및 평가","심의·확정 → 편성 → 집행 → 결산 및 평가","편성 → 집행 → 심의·확정 → 결산 및 평가","편성 → 심의·확정 → 결산 및 평가 → 집행"],"ans":0,"exp":"예산은 먼저 부서별 요구를 모아 편성하고, 심의를 거쳐 확정한 뒤, 확정된 예산을 집행하고, 회계 연도가 끝나면 결산하고 평가한다. 심의·확정 없이 집행할 수 없고, 결산은 집행이 끝난 뒤에 이루어진다."},
{"id":"m29","subj":"간호관리","unit":"재무관리","q":"환자 수나 서비스 제공량이 늘거나 줄어도 총액이 일정하게 발생하는 원가의 예는?","opts":["환자 급식의 식재료비","병동 건물의 감가상각비","일회용 주사기 등 진료 재료비","환자에게 투여한 약품비"],"ans":1,"exp":"고정비는 조업도(환자 수, 서비스 양)와 관계없이 일정하게 발생하는 원가로 건물 감가상각비, 임차료, 정규직 기본급 등이 해당한다. 약품비, 진료 재료비, 급식 재료비는 환자 수에 비례하여 늘어나는 변동비이다."},
{"id":"m30","subj":"간호관리","unit":"재무관리","q":"질병군별 포괄수가제(DRG)에 대한 설명으로 옳은 것은?","opts":["입원 1일당 정해진 금액을 재원 일수만큼 지불한다","제공한 서비스의 양과 관계없이 질병군별로 미리 정한 금액을 지불한다","의료 행위 하나하나에 가격을 매겨 합산한 금액을 지불한다","등록된 주민 수에 따라 일정 금액을 미리 지불한다"],"ans":1,"exp":"포괄수가제는 환자가 어느 질병군에 속하는지에 따라 미리 정한 금액을 지불하는 방식으로, 과잉 진료를 줄이고 재원 일수를 단축하는 효과가 있지만 서비스가 과소 제공될 우려가 있다. 행위마다 값을 매기는 것은 행위별수가제, 등록 주민 수 기준은 인두제, 1일당 정액은 일당수가제이다."},
{"id":"m31","subj":"간호관리","unit":"재무관리","q":"환자를 간호 요구량에 따라 몇 개의 군으로 분류하고, 군별로 간호 원가를 달리 산정하여 수가를 정하는 간호수가 산정 방법은?","opts":["일당 수가제","행위별 수가제","환자분류군별 수가제","방문당 수가제"],"ans":2,"exp":"환자분류군별 수가제는 환자분류체계로 나눈 군마다 필요한 간호 시간과 원가가 다르다는 점을 반영하여 수가를 달리 정한다. 일당 수가제는 간호 요구량과 관계없이 하루당 같은 금액을, 행위별 수가제는 간호 행위마다, 방문당 수가제는 방문 1회마다 금액을 정하는 방식이다."},
{"id":"m32","subj":"간호관리","unit":"조직","q":"신규 간호사 A는 같은 업무에 대해 수간호사와 책임간호사에게서 서로 다른 지시를 받아 혼란을 겪고 있다. 이 상황에서 지켜지지 않은 조직화의 원리는?","opts":["통솔범위의 원리","분업·전문화의 원리","계층제의 원리","명령통일의 원리"],"ans":3,"exp":"명령통일의 원리는 구성원이 한 명의 상관에게서만 명령을 받고 그에게 보고해야 한다는 원리로, 지켜지지 않으면 혼란과 책임 회피가 생긴다. 통솔범위의 원리는 한 관리자가 효과적으로 감독할 수 있는 부하의 수에 관한 것이고, 계층제의 원리는 권한과 책임에 따라 직위를 등급화하는 것이다."},
{"id":"m33","subj":"간호관리","unit":"조직","q":"매트릭스 조직에 대한 설명으로 옳은 것은?","opts":["과제가 끝나면 해체되며 구성원은 원래 부서에 소속되지 않는다","구성원이 기능 부서와 프로젝트 팀에 함께 속해 두 상사에게 보고한다","최고관리자에서 일선 직원까지 명령이 수직으로만 전달된다","전문 지식을 가진 참모가 조언만 하고 명령권은 갖지 않는다"],"ans":1,"exp":"매트릭스 조직은 기능 조직에 프로젝트 조직을 결합한 구조로, 구성원이 기능 부서장과 프로젝트 관리자 두 사람의 지휘를 받아 명령통일의 원리에 어긋날 수 있다. 수직적 명령 전달은 라인 조직, 조언하는 참모는 라인-스태프 조직, 과제 완료 뒤 해체되는 임시 조직은 프로젝트 조직의 특성이다."},
{"id":"m34","subj":"간호관리","unit":"조직","q":"비공식 조직의 특성으로 옳은 것은?","opts":["조직도와 직제 규정에 구조와 직위가 명시되어 있다","권한과 책임이 직위에 따라 공식적으로 배분된다","능률의 논리에 따라 인위적으로 만들어진다","구성원의 감정과 친밀감을 바탕으로 자연 발생적으로 형성된다"],"ans":3,"exp":"비공식 조직은 구성원 사이의 친분, 관심사, 감정을 바탕으로 저절로 생기며 조직도에 나타나지 않는다. 조직도에 명시되고, 능률의 논리에 따라 인위적으로 만들어지며, 직위에 따라 권한과 책임이 배분되는 것은 공식 조직의 특성이다."},
{"id":"m35","subj":"간호관리","unit":"조직","q":"맥킨지(McKinsey)의 7S 모형에서 조직문화 형성의 핵심이 되며, 다른 요소들을 연결하고 구성원의 행동 방향을 이끄는 요소는?","opts":["전략","구조","공유 가치","관리 시스템"],"ans":2,"exp":"공유 가치는 구성원이 함께 가지는 가치관과 신념으로 7S의 중심에 놓이며 나머지 요소에 영향을 준다. 전략은 조직의 장기 방향과 자원 배분 계획, 구조는 역할과 권한 관계의 틀, 관리 시스템은 의사결정과 운영을 위한 제도를 말한다."},
{"id":"m36","subj":"간호관리","unit":"조직변화","q":"전자간호기록 도입을 앞두고 수간호사가 현재 수기 기록의 문제점을 알려, 간호사들이 변화가 필요하다고 느끼도록 하였다. 레윈(Lewin)의 변화 단계 중 어느 단계인가?","opts":["움직임 단계","종결 단계","재동결 단계","해빙 단계"],"ans":3,"exp":"해빙 단계는 현재 상태의 문제를 인식시켜 변화의 필요성과 동기를 갖게 하는 단계이다. 움직임(변화) 단계는 새로운 방법을 실제로 받아들여 실행하는 단계이고, 재동결 단계는 변화가 정착되어 새로운 균형을 이루도록 굳히는 단계이다. 종결 단계는 레윈의 3단계에 없다."},
{"id":"m37","subj":"간호관리","unit":"조직변화","q":"사람은 합리적 존재이므로, 변화가 자신에게 이익이 된다는 지식과 정보를 얻으면 변화를 받아들인다고 보는 계획적 조직변화 전략은?","opts":["규범적-재교육적 전략","동지적 전략","권력-강제적 전략","경험적-합리적 전략"],"ans":3,"exp":"경험적-합리적 전략은 사람이 합리적으로 자기 이익을 따른다고 보고 지식과 정보를 제공하여 변화를 이끈다. 규범적-재교육적 전략은 태도와 가치관, 집단 규범을 바꾸는 데 초점을 두고, 권력-강제적 전략은 권력과 제재를 이용하며, 동지적 전략은 구성원 간의 친밀감과 소속감을 이용한다."},
{"id":"m38","subj":"간호관리","unit":"조직","q":"권한위임에 대한 설명으로 옳은 것은?","opts":["위임하면 권한과 최종 책임이 모두 위임받은 사람에게 넘어간다","업무를 위임해도 결과에 대한 최종 책임은 위임한 관리자에게 남는다","인사고과나 훈육 같은 관리자 고유의 업무부터 위임한다","위임할 때는 책임만 주고 권한은 주지 않는 것이 원칙이다"],"ans":1,"exp":"권한은 위임할 수 있지만 최종 책임은 위임되지 않으므로 관리자는 위임한 업무의 결과를 확인해야 한다. 위임할 때는 업무 수행에 필요한 권한을 책임과 함께 주어야 하며, 인사고과, 훈육, 기밀 사항처럼 관리자 고유의 업무는 위임하지 않는다."},
{"id":"m39","subj":"간호관리","unit":"조직","q":"투약 업무만 담당하던 간호사에게 담당 환자의 간호 계획 수립과 평가, 퇴원 교육 내용의 결정까지 맡겨 자율성과 책임을 높였다. 이 직무설계 방법은?","opts":["직무확대","직무충실화","직무단순화","직무순환"],"ans":1,"exp":"직무충실화는 계획, 통제, 평가 같은 관리 기능을 직무에 더해 자율성과 책임을 수직적으로 늘리는 방법이다. 직무확대는 비슷한 수준의 과업 수만 수평적으로 늘리는 것이고, 직무순환은 여러 직무를 돌아가며 맡는 것이며, 직무단순화는 과업을 세분하여 단순하게 만드는 것이다."},
{"id":"m40","subj":"간호관리","unit":"간호전달체계","q":"표준진료지침(critical pathway)을 도구로 사용하여, 특정 질환군 환자의 입원부터 퇴원까지 진료 과정과 자원 사용을 조정하고 재원 일수와 비용을 관리하는 간호전달체계는?","opts":["사례관리","기능적 분담방법","사례방법(전인간호)","팀 간호방법"],"ans":0,"exp":"사례관리는 사례관리자가 표준진료지침을 이용해 여러 직종의 서비스를 조정하고, 정해진 기간 안에 기대하는 결과를 얻도록 관리하는 방식이다. 기능적 분담방법은 업무별로 나누어 맡는 방식, 팀 간호방법은 팀 리더 중심의 공동 간호이고, 사례방법은 간호사 한 명이 근무 시간 동안 맡은 환자의 간호를 모두 수행하는 방식이다."},
{"id":"m41","subj":"간호관리","unit":"인적자원관리","q":"간호 업무를 직접 간호, 간접 간호 등으로 나누고 각 활동에 걸리는 시간을 시간-동작 분석으로 측정하여 필요한 간호 인력을 산정하는 방법은?","opts":["산업공학적 방법","원형평가 방법","관리공학적 방법","서술적 방법"],"ans":0,"exp":"산업공학적 방법은 간호 활동별 소요 시간을 측정하고 업무량을 계산하여 인력을 산정한다. 서술적 방법은 경험 있는 관리자의 판단으로 환자 유형별 간호사 비율을 정하는 것이고, 관리공학적 방법은 환자 유형별 간호 표준을 정한 뒤 그에 따른 간호 시간으로 산정하는 것이다. 원형평가는 환자분류 방법이다."},
{"id":"m42","subj":"간호관리","unit":"인적자원관리","q":"환자분류체계 중 요인평가제에 대한 설명으로 옳은 것은?","opts":["진단명이 같은 환자는 모두 같은 군으로 분류한다","환자의 재원 일수만을 기준으로 군을 나눈다","군별 전형적 특성을 기술해 두고 가장 비슷한 군에 환자를 배정한다","간호 의존도를 나타내는 항목마다 점수를 매기고 합산하여 군을 정한다"],"ans":3,"exp":"요인평가제는 위생, 영양, 투약 등 간호 요구를 나타내는 항목별로 점수를 주고 총점으로 환자군을 정한다. 군별 전형적 특성을 기술해 놓고 비슷한 군에 배정하는 것은 원형평가제이다. 환자분류체계는 진단명이나 재원 일수가 아니라 간호 요구량을 기준으로 한다."},
{"id":"m43","subj":"간호관리","unit":"인적자원관리","q":"A 병동의 하루 평균 재원 환자는 24명이고 환자 1인당 하루에 필요한 간호 시간은 4시간이다. 간호사 한 명이 하루 8시간 근무한다면, 휴일과 결근을 고려하지 않을 때 하루에 필요한 근무 간호사 수는?","opts":["8명","12명","16명","24명"],"ans":1,"exp":"하루 총 간호 시간은 24명 × 4시간 = 96시간이다. 이를 간호사 1인의 하루 근무 시간 8시간으로 나누면 96 ÷ 8 = 12명이다. 실제 채용 인원은 여기에 휴일과 휴가, 결근을 반영하여 더 많이 산정한다."},
{"id":"m44","subj":"간호관리","unit":"인적자원관리","q":"숙련된 경력 간호사가 일정 기간 신규 간호사 한 명을 맡아 일대일로 임상 실무를 가르치고 역할 모델이 되어 주는 교육 방법은?","opts":["프리셉터십","집합 강의","유도 훈련","보수교육"],"ans":0,"exp":"프리셉터십은 프리셉터(경력 간호사)가 신규 간호사를 일대일로 지도하여 현장 적응을 돕는 방법이다. 유도 훈련은 입사 직후 조직의 이념, 규정, 시설 등을 소개하는 교육이고, 보수교육은 면허 취득 뒤 지식과 기술을 유지·향상하기 위한 교육이며, 집합 강의는 여러 명을 한자리에 모아 가르치는 방식이다."},
{"id":"m45","subj":"간호관리","unit":"인적자원관리","q":"베너(Benner)의 임상 경력 발달 단계 중, 풍부한 경험을 바탕으로 규칙이나 지침에 의존하지 않고 상황을 직관적으로 파악하여 문제의 핵심에 바로 접근하는 단계는?","opts":["적임자(competent)","상급 초보자(advanced beginner)","숙련가(proficient)","전문가(expert)"],"ans":3,"exp":"전문가 단계의 간호사는 분석적 원칙에 기대지 않고 직관으로 상황 전체를 파악해 정확하게 대처한다. 상급 초보자는 반복되는 상황의 의미를 겨우 알아보는 단계, 적임자는 장기 목표에 따라 의식적으로 계획하지만 속도와 융통성이 부족한 단계, 숙련가는 상황을 전체로 지각하지만 아직 지침(격률)을 활용하는 단계이다."},
{"id":"m46","subj":"간호관리","unit":"인적자원관리","q":"직무평가 방법 중, 직무를 여러 평가 요소로 나누고 요소마다 중요도에 따른 점수를 준 뒤 합산한 총점으로 직무의 상대적 가치를 정하는 방법은?","opts":["직무분류법","점수법","요소비교법","서열법"],"ans":1,"exp":"점수법은 숙련도, 책임, 노력, 작업 조건 등 요소별 점수의 합으로 직무 가치를 정한다. 서열법은 직무 전체를 서로 비교해 순위를 매기는 방법이고, 직무분류법은 미리 정한 등급 기준에 직무를 배정하는 방법이며, 요소비교법은 기준 직무를 정하고 요소별로 다른 직무를 그와 비교하여 임금액을 정하는 방법이다."},
{"id":"m47","subj":"간호관리","unit":"인사고과","q":"평가자가 대부분의 간호사에게 높은 점수를 주는 관대화 경향을 줄이기 위해, 평가 등급별 인원 비율을 미리 정해 놓고 그에 맞추어 배정하는 평가 방법은?","opts":["강제배분법","중요사건 기술법","자기평가법","도표식 평정척도법"],"ans":0,"exp":"강제배분법은 예를 들어 상 20%, 중 60%, 하 20%처럼 등급별 비율을 정해 두어 관대화, 중심화 경향을 막는다. 도표식 평정척도법은 평가 요소별로 척도에 표시하는 방법으로 관대화 경향이 생기기 쉽고, 중요사건 기술법은 성과에 영향을 준 구체적 행동을 기록하는 방법이다."},
{"id":"m48","subj":"간호관리","unit":"인사고과","q":"A 수간호사는 간호사 B가 특정 대학 출신이라는 이유로 \"그 학교 출신은 성실하지 않다\"는 선입견을 가지고 근무 성적을 낮게 평가하였다. 이 인사고과 오류는?","opts":["대비 오류","관대화 경향","상동적 오류","논리적 오류"],"ans":2,"exp":"상동적 오류는 피평가자가 속한 집단(출신 학교, 지역, 성별 등)에 대한 고정관념으로 개인을 평가하는 오류이다. 대비 오류는 평가자 자신이나 다른 피평가자와 비교하여 평가하는 것이고, 논리적 오류는 서로 관련이 있어 보이는 평가 항목에 비슷한 점수를 주는 것이며, 관대화 경향은 전반적으로 실제보다 높게 평가하는 것이다."},
{"id":"m49","subj":"간호관리","unit":"인적자원관리","q":"임금 체계 중, 직무의 난이도와 책임 정도 등 직무의 상대적 가치에 따라 기본급을 정하는 것은?","opts":["직능급","연공급","성과급","직무급"],"ans":3,"exp":"직무급은 직무평가로 정한 직무의 상대적 가치에 따라 임금을 정하므로 '같은 직무에 같은 임금'의 원칙에 맞는다. 연공급은 근속 연수와 연령 등에 따라, 직능급은 직무 수행 능력에 따라, 성과급은 달성한 성과에 따라 임금을 정한다."},
{"id":"m50","subj":"간호관리","unit":"인적자원관리","q":"간호사 훈육의 원칙으로 옳은 것은?","opts":["위반한 행위에 초점을 두고, 다른 사람이 없는 곳에서 한다","문제 행위가 있고 나서 충분한 기간이 지난 뒤에 한다","같은 위반이라도 평소 친분에 따라 수위를 다르게 한다","본보기가 되도록 동료들이 있는 곳에서 공개적으로 한다"],"ans":0,"exp":"훈육은 사람이 아니라 문제 행위에 초점을 두고, 사생활을 보호할 수 있는 곳에서 비공개로 해야 한다. 또한 문제 행위가 생기면 신속하게 다루어야 하고, 같은 위반에는 누구에게나 같은 기준을 적용하는 일관성이 있어야 한다."},
{"id":"m51","subj":"간호관리","unit":"리더십","q":"블레이크와 머튼(Blake & Mouton)의 관리격자 이론에서 생산에 대한 관심과 인간에 대한 관심이 모두 높은 리더십 유형은?","opts":["중도형","과업형","인기형","팀형"],"ans":3,"exp":"팀형(9.9형)은 생산과 인간 모두에 대한 관심이 높아 가장 이상적인 유형으로 본다. 과업형(9.1형)은 생산에만, 인기형(1.9형, 컨트리클럽형)은 인간에만 관심이 높고, 중도형(5.5형)은 둘 다 중간 수준이다."},
{"id":"m52","subj":"간호관리","unit":"리더십","q":"피들러(Fiedler)의 상황적합 이론에서 리더십 상황의 호의성을 결정하는 요소가 아닌 것은?","opts":["리더의 직위 권력","구성원의 성숙도","과업의 구조화 정도","리더와 구성원의 관계"],"ans":1,"exp":"피들러는 리더-구성원 관계, 과업 구조, 직위 권력의 세 요소로 상황이 리더에게 얼마나 유리한지를 판단하였다. 상황이 매우 유리하거나 매우 불리하면 과업지향 리더가, 중간 정도이면 관계지향 리더가 효과적이라고 보았다. 구성원의 성숙도는 허시와 블랜차드의 상황적 리더십 이론에서 쓰는 상황 변수이다."},
{"id":"m53","subj":"간호관리","unit":"리더십","q":"거래적 리더십의 구성 요소에 해당하는 것은?","opts":["지적 자극","개별적 배려","영감적 동기부여","조건적 보상"],"ans":3,"exp":"거래적 리더십은 성과에 따라 보상을 주는 조건적 보상과, 기준에서 벗어날 때 개입하는 예외 관리로 구성된다. 지적 자극, 개별적 배려, 영감적 동기부여, 카리스마(이상적 영향력)는 구성원의 가치와 욕구 수준을 높여 기대 이상의 성과를 이끄는 변혁적 리더십의 요소이다."},
{"id":"m54","subj":"간호관리","unit":"리더십","q":"심정지 환자가 발생하여 즉각적인 판단과 일사불란한 대처가 필요한 상황에서 가장 효과적인 리더십 유형은?","opts":["전제형","자유방임형","섬김형","민주형"],"ans":0,"exp":"전제형(권위형) 리더십은 리더가 혼자 결정하고 지시하므로 응급 상황처럼 신속한 결정과 통일된 행동이 필요할 때 효과적이다. 민주형은 구성원의 참여로 결정하여 시간이 걸리고, 자유방임형은 결정을 구성원에게 맡기며, 섬김형(서번트)은 구성원을 지원하고 성장을 돕는 데 초점을 둔다."},
{"id":"m55","subj":"간호관리","unit":"동기부여","q":"병원이 간호사에게 고용 보장, 산재 보험, 주사침 자상 예방 장비를 제공하는 것은 매슬로(Maslow)의 욕구 단계 중 어느 욕구를 충족시키는가?","opts":["소속과 애정의 욕구","생리적 욕구","안전 욕구","존경 욕구"],"ans":2,"exp":"안전 욕구는 신체적 위험과 경제적 불안에서 보호받으려는 욕구로 고용 안정, 보험, 안전한 작업 환경이 이를 충족시킨다. 생리적 욕구는 적정 임금, 휴식, 식사와 관련되고, 소속과 애정의 욕구는 동료 관계와 팀 소속감, 존경 욕구는 인정, 포상, 승진과 관련된다."},
{"id":"m56","subj":"간호관리","unit":"동기부여","q":"알더퍼(Alderfer)의 ERG 이론이 매슬로의 욕구단계 이론과 다른 점은?","opts":["인간의 욕구를 다섯 단계로 더 세분하였다","한 시점에는 한 가지 욕구만 작용한다고 본다","하위 욕구가 충족되어야만 상위 욕구가 나타난다고 본다","상위 욕구가 좌절되면 하위 욕구가 더 커진다고 본다"],"ans":3,"exp":"ERG 이론은 욕구를 존재, 관계, 성장의 세 가지로 줄였고, 상위 욕구가 충족되지 않으면 하위 욕구로 되돌아가는 좌절-퇴행과 여러 욕구가 동시에 작용할 수 있음을 인정한다. 다섯 단계로 나누고 하위 욕구가 채워져야 다음 욕구가 나타난다고 본 것은 매슬로의 이론이다."},
{"id":"m57","subj":"간호관리","unit":"동기부여","q":"브룸(Vroom)의 기대이론에서 \"성과를 달성하면 그에 따른 보상이 주어질 것\"이라는 주관적 믿음을 뜻하는 것은?","opts":["유의성","공정성","기대","수단성"],"ans":3,"exp":"수단성은 성과가 보상으로 이어질 것이라는 믿음이다. 기대는 노력하면 성과를 낼 수 있다는 믿음이고, 유의성은 보상이 자신에게 얼마나 가치 있는지에 대한 선호의 정도이다. 기대이론은 이 세 가지의 곱으로 동기의 강도가 정해진다고 본다. 공정성은 아담스의 공정성 이론의 개념이다."},
{"id":"m58","subj":"간호관리","unit":"동기부여","q":"간호사 A는 자신과 경력과 업무량이 비슷한 동료 B가 더 많은 성과급을 받은 것을 알고 의욕이 떨어져 업무에 들이는 노력을 줄였다. 이를 가장 잘 설명하는 동기부여 이론은?","opts":["허즈버그의 2요인 이론","맥클리랜드의 성취동기 이론","아담스의 공정성 이론","로크의 목표설정 이론"],"ans":2,"exp":"공정성 이론은 사람이 자신의 투입 대비 보상의 비율을 다른 사람과 비교하고, 불공정하다고 느끼면 노력을 줄이는 등의 방법으로 균형을 되찾으려 한다고 본다. 목표설정 이론은 구체적이고 도전적인 목표가 동기를 높인다는 것이고, 성취동기 이론은 성취, 권력, 친화 욕구를, 2요인 이론은 동기요인과 위생요인을 다룬다."},
{"id":"m59","subj":"간호관리","unit":"의사소통","q":"상향적 의사소통에 해당하는 것은?","opts":["제안 제도와 고충 처리","병원 정책의 게시판 공고","간호 부서 간 협의회","업무 지시와 직무 편람"],"ans":0,"exp":"상향적 의사소통은 하급자의 의견과 정보가 상급자에게 전달되는 것으로 보고, 제안 제도, 고충 처리, 면담이 해당한다. 업무 지시, 편람, 게시판 공고는 위에서 아래로 전달되는 하향적 의사소통이고, 부서 간 협의회는 같은 수준의 부서나 구성원 사이의 수평적 의사소통이다."},
{"id":"m60","subj":"간호관리","unit":"갈등관리","q":"두 간호사가 휴가 일정을 두고 갈등하자, 수간호사는 두 사람이 각자의 사정과 관심사를 터놓고 이야기하게 하여 양쪽 모두 만족하는 새로운 근무 일정을 함께 찾도록 하였다. 이 갈등 관리 방법은?","opts":["회피","타협","협력","수용"],"ans":2,"exp":"협력은 양쪽의 관심사를 모두 충족하는 해결책을 함께 찾는 방법으로 자기주장과 협조가 모두 높다. 타협은 서로 조금씩 양보하여 절충하는 것이라 양쪽 모두 완전히 만족하지는 못한다. 회피는 갈등을 다루지 않고 피하는 것이고, 수용은 자신의 관심사를 접고 상대의 요구를 들어주는 것이다."},
{"id":"m61","subj":"간호관리","unit":"의사소통","q":"동료가 자신의 야간 근무를 자주 대신 서 달라고 부탁하는 상황에서 주장행동에 해당하는 반응은?","opts":["대답하지 않고 자리를 피한 뒤 다른 동료에게 불만을 말한다.","\"……알겠어요. 제가 할게요.\"라고 내키지 않지만 받아들인다.","\"선생님은 왜 늘 남에게 일을 떠넘겨요? 정말 이기적이네요.\"","\"이번 주는 제가 대신 서기 어려워요. 다른 방법을 같이 찾아봐요.\""],"ans":3,"exp":"주장행동은 상대의 권리를 침해하지 않으면서 자신의 생각과 감정, 권리를 솔직하게 표현하는 것으로, '나'를 주어로 자신의 상태와 바라는 점을 말한다. 내키지 않는데 받아들이는 것은 소극적 행동이고, 상대를 비난하는 것은 공격적 행동이며, 직접 말하지 않고 뒤에서 불만을 드러내는 것은 수동공격적 행동이다."},
{"id":"m62","subj":"간호관리","unit":"리더십","q":"A 간호사는 상처 간호에 관한 지식과 기술이 뛰어나, 동료와 의사들이 상처 관리에 대해서는 그의 의견을 따른다. A 간호사가 가진 권력의 유형은?","opts":["보상적 권력","준거적 권력","합법적 권력","전문적 권력"],"ans":3,"exp":"전문적 권력은 특정 분야의 지식과 기술, 경험에서 나오는 권력이다. 합법적 권력은 조직이 부여한 직위에서, 보상적 권력은 승진이나 급여 같은 보상을 줄 수 있는 능력에서 나오며, 준거적 권력은 인격적 매력으로 다른 사람이 닮고 싶어 할 때 생긴다."},
{"id":"m63","subj":"간호관리","unit":"질 관리","q":"전통적인 질 보장(QA)과 비교한 총체적 질 관리(TQM)의 특성은?","opts":["표준에 미달한 개인을 찾아내어 교정하는 데 초점을 둔다","질 관리 부서의 전담 직원만 활동에 참여한다","문제가 없어도 과정을 지속적으로 개선하며 모든 직원이 참여한다","문제가 발견된 뒤에 사후적으로 해결하는 것이 목적이다"],"ans":2,"exp":"총체적 질 관리는 고객 중심으로 업무 과정과 시스템을 지속적으로 개선하며, 최고관리자에서 일선 직원까지 모두 참여한다. 표준 미달 사례와 개인을 찾아 교정하고, 전담 부서 중심으로 문제 발생 뒤에 해결하는 것은 전통적 질 보장의 특성이다."},
{"id":"m64","subj":"간호관리","unit":"질 관리","q":"낙상 발생의 원인을 사람, 환경, 장비, 절차 등 범주별로 생선 뼈 모양으로 정리하여, 결과와 원인의 관계를 한눈에 보여 주는 질 향상 도구는?","opts":["인과관계도","히스토그램","런 차트","파레토 차트"],"ans":0,"exp":"인과관계도(특성요인도, 어골도)는 결과를 머리에, 원인을 범주별 가지에 적어 문제의 원인을 체계적으로 찾는 도구이다. 파레토 차트는 원인을 빈도순 막대로 나열한 것이고, 런 차트는 시간의 흐름에 따른 변화를 꺾은선으로 그린 것이며, 히스토그램은 자료의 분포를 막대로 나타낸 것이다."},
{"id":"m65","subj":"간호관리","unit":"질 관리","q":"투약 오류의 원인을 발생 빈도가 높은 순서대로 막대그래프로 나열하고 누적 백분율을 꺾은선으로 함께 표시하여, 먼저 해결할 원인을 찾는 도구는?","opts":["관리도","산점도","파레토 차트","흐름도"],"ans":2,"exp":"파레토 차트는 소수의 주요 원인이 문제의 대부분을 차지한다는 원리에 따라 개선의 우선순위를 정하는 데 쓴다. 흐름도는 업무 과정의 단계를 순서대로 그린 것이고, 산점도는 두 변수의 관계를 점으로 나타낸 것이며, 관리도는 상한선과 하한선을 두고 시간에 따른 변동을 살피는 것이다."},
{"id":"m66","subj":"간호관리","unit":"질 관리","q":"병동의 욕창 발생을 줄이기 위해 PDCA 순환을 적용하였다. 다음 활동이 해당하는 단계는?\n\n새로 만든 체위 변경 프로토콜을 한 병실에서 2주 동안 시범 적용하였다.","opts":["계획(Plan)","실행(Do)","확인(Check)","조치(Act)"],"ans":1,"exp":"실행 단계는 계획한 개선안을 작은 규모로 시험 적용하고 자료를 모으는 단계이다. 계획 단계는 문제를 분석하고 개선안을 마련하는 단계, 확인 단계는 시범 적용 결과를 목표와 비교해 평가하는 단계, 조치 단계는 효과가 확인된 방법을 표준화하여 전체로 넓히거나 수정하는 단계이다."},
{"id":"m67","subj":"간호관리","unit":"환자안전","q":"아직 사고가 발생하지 않은 새 투약 절차에 대해, 발생할 수 있는 오류의 유형과 그 영향을 미리 예측하고 위험 우선순위를 정하여 예방하는 전향적 분석 방법은?","opts":["근본원인분석(RCA)","의무기록 감사","동료 심사","오류유형과 영향분석(FMEA)"],"ans":3,"exp":"오류유형과 영향분석은 사고가 나기 전에 과정의 단계별로 일어날 수 있는 오류와 그 심각도, 발생 가능성 등을 따져 미리 개선하는 전향적 방법이다. 근본원인분석은 적신호 사건 등이 이미 발생한 뒤에 근본 원인을 찾는 후향적 방법이다. 의무기록 감사와 동료 심사는 이미 제공된 진료와 간호를 평가하는 방법이다."},
{"id":"m68","subj":"간호관리","unit":"환자안전","q":"환자 확인 방법으로 옳은 것은?","opts":["\"김○○ 님 맞으시죠?\"라고 물어 \"예\"라는 대답으로 확인한다","병실 호수와 침상 번호를 지표로 삼아 확인한다","환자 이름과 등록번호처럼 두 가지 이상의 지표로 확인한다","의식이 없는 환자는 확인 절차를 생략한다"],"ans":2,"exp":"환자 확인은 이름, 등록번호, 생년월일 등 두 가지 이상의 지표로 하며, 병실 호수나 침상 번호는 바뀔 수 있으므로 지표로 쓰지 않는다. 환자가 직접 이름을 말하도록 개방형으로 물어야 하고, 의식이 없는 환자도 환자 인식 팔찌 등으로 반드시 확인한다."},
{"id":"m69","subj":"간호관리","unit":"환자안전","q":"구두 처방을 받은 간호사의 조치로 옳은 것은?","opts":["받아 적은 내용을 다시 읽어 주어 처방자의 확인을 받는다","수행한 뒤에는 서면 처방을 따로 받지 않아도 된다","응급 상황이 아니어도 편의를 위해 적극적으로 활용한다","받아 적지 않고 들은 내용을 기억하여 바로 수행한다"],"ans":0,"exp":"구두 처방은 받아 적고(write down), 적은 내용을 다시 읽어 주어(read back), 처방자의 확인을 받은 뒤 수행한다. 구두 처방은 응급 상황이나 시술 중처럼 직접 처방을 입력할 수 없을 때로 제한하고, 수행한 뒤에는 정해진 시간 안에 서면(전산) 처방을 받아야 한다."},
{"id":"m70","subj":"간호관리","unit":"질 관리","q":"「의료법」상 의료기관 인증에 대한 설명으로 옳은 것은?","opts":["의료기관 인증은 관할 시·도지사가 실시한다","모든 의원급 의료기관은 의무적으로 인증을 신청해야 한다","인증의 유효기간은 4년이고 조건부인증의 유효기간은 1년이다","인증 등급은 인증과 불인증의 두 가지로 구분한다"],"ans":2,"exp":"의료기관 인증의 등급은 인증, 조건부인증, 불인증의 세 가지이며, 유효기간은 인증 4년, 조건부인증 1년이다. 인증은 보건복지부장관이 병원급 의료기관을 대상으로 실시하고 그 업무를 의료기관평가인증원에 위탁하며, 원칙적으로 의료기관의 자율 신청에 따른다."},
{"id":"m71","subj":"간호관리","unit":"질 관리","q":"「의료법」에 따라 의료기관 인증을 의무적으로 신청해야 하는 의료기관은?","opts":["요양병원","치과병원","종합병원","한방병원"],"ans":0,"exp":"의료기관 인증은 병원급 의료기관의 자율 신청이 원칙이지만, 요양병원은 의료 서비스의 질과 환자 안전을 확보하기 위해 의무적으로 인증을 신청하도록 정해져 있다. 종합병원, 치과병원, 한방병원은 자율적으로 신청한다."},
{"id":"m72","subj":"간호관리","unit":"환자안전","q":"「환자안전법」에 따라 일정 규모 이상인 병원급 의료기관의 장이 보건복지부장관에게 지체 없이 보고해야 하는 환자안전사고는?","opts":["환자에게 아무런 손상이 생기지 않은 침상 낙상","투약 직전에 발견되어 환자에게 도달하지 않은 처방 오류","설명하고 동의받은 내용과 다른 수술로 환자가 사망한 사고","보호자가 복도에서 넘어져 가벼운 찰과상을 입은 사고"],"ans":2,"exp":"환자안전사고 보고는 자율 보고가 원칙이지만, 일정 규모 이상의 병원급 의료기관에서 환자가 사망하거나 심각한 신체적·정신적 손상을 입은 중대한 환자안전사고가 발생하면 의료기관의 장이 지체 없이 보고해야 한다. 동의받은 내용과 다른 수술, 수혈, 전신마취로 인한 사망이 대표적이다. 근접오류나 손상이 없는 사고는 자율 보고 대상이다."},
{"id":"m73","subj":"간호관리","unit":"간호단위관리","q":"사용 여부와 관계없이 정해진 시간에, 정해진 수량의 물품을 채운 카트를 통째로 바꾸어 주는 물품 공급 방식은?","opts":["정수보충 방식","정기 청구 방식","수시 청구 방식","정수교환 방식"],"ans":3,"exp":"정수교환 방식은 기준 수량을 채운 새 카트나 용기를 가져와 기존 것과 통째로 바꾸는 방식이다. 정수보충 방식은 정해진 시간에 사용한 수량만큼만 채워 기준 수량을 맞추는 방식이다. 청구 방식은 간호 단위에서 필요한 물품을 정기 또는 수시로 청구서를 내어 받는 방식이다."},
{"id":"m74","subj":"간호관리","unit":"감염관리","q":"공기주의(airborne precautions)를 적용해야 하는 질환은?","opts":["인플루엔자","백일해","MRSA 감염","활동성 폐결핵"],"ans":3,"exp":"활동성 폐결핵, 홍역, 수두는 작은 입자가 공기 중에 떠다니며 전파되므로 음압 격리실과 N95 마스크를 사용하는 공기주의를 적용한다. 인플루엔자와 백일해는 비말주의, MRSA 감염은 접촉주의 대상이다."},
{"id":"m75","subj":"간호관리","unit":"감염관리","q":"반코마이신 내성 장알균(VRE)이 분리된 환자에게 적용하는 격리 지침으로 옳은 것은?","opts":["수술용 마스크만 착용하면 되고 장갑과 가운은 필요하지 않다","음압 격리실에 입원시키고 병실에 들어갈 때 N95 마스크를 쓴다","병실에 들어갈 때 장갑과 가운을 착용하고 청진기 등은 환자 전용으로 쓴다","면역 저하 환자용 양압 보호 격리실에 입원시킨다"],"ans":2,"exp":"VRE, MRSA, CRE 같은 다제내성균은 직접 접촉이나 오염된 물품을 통해 전파되므로 접촉주의를 적용한다. 병실에 들어갈 때 장갑과 가운을 착용하고, 물품은 환자 전용으로 쓰며, 나올 때 보호구를 벗고 손위생을 한다. 음압 격리실과 N95 마스크는 공기주의, 수술용 마스크는 비말주의의 방법이다."},
{"id":"m76","subj":"간호관리","unit":"감염관리","q":"사용한 주삿바늘의 처리 방법으로 옳은 것은?","opts":["양손으로 뚜껑을 씌운 뒤 일반 의료폐기물 봉투에 버린다","바늘을 구부리거나 부러뜨려 부피를 줄인 뒤 버린다","뚜껑을 다시 씌우지 않고 손상성 폐기물 전용 용기에 바로 버린다","전용 용기가 가득 찰 때까지 눌러 담아 사용한다"],"ans":2,"exp":"주사침 자상을 막기 위해 사용한 바늘은 뚜껑을 다시 씌우거나 구부리지 않고, 뚫리지 않는 손상성 폐기물 전용 용기에 즉시 버린다. 전용 용기는 가득 차기 전에 교체하고 내용물을 손으로 누르지 않는다."},
{"id":"m77","subj":"간호관리","unit":"간호단위관리","q":"병동의 마약류 관리 방법으로 옳은 것은?","opts":["근무 교대 때의 재고 확인은 생략하고 월말에 한 번 대조한다","마약 금고의 열쇠는 금고 옆 서랍에 두어 누구나 쓸 수 있게 한다","사용하고 남은 마약은 간호사가 혼자 폐기하고 기록은 생략한다","마약은 다른 의약품과 구분하여 이중 잠금장치가 된 금고에 보관한다"],"ans":3,"exp":"마약은 다른 의약품과 구분하여 이중으로 잠금장치가 된 금고에 보관하고, 열쇠는 책임자가 관리한다. 근무 교대 때마다 재고량과 기록을 대조하여 인수인계하며, 사용하고 남은 잔량은 임의로 버리지 않고 기관의 규정에 따라 확인자와 함께 처리하고 기록한다."},
{"id":"m78","subj":"간호관리","unit":"간호기록","q":"간호기록 작성 원칙으로 옳은 것은?","opts":["간호를 수행한 뒤 바로 기록하고 관찰한 사실을 객관적으로 적는다","\"상태 양호함\"처럼 간호사의 인상을 포괄적으로 적는다","바쁠 때는 간호를 수행하기 전에 미리 기록해 둔다","잘못 적은 내용은 수정액으로 지우고 그 위에 다시 쓴다"],"ans":0,"exp":"간호기록은 수행한 직후에 적어야 하고(적시성), 관찰한 사실을 구체적이고 객관적으로 적어야 한다(정확성). 수행하기 전에 미리 기록해서는 안 되며, 막연한 표현은 피한다. 잘못 적은 내용은 원래 내용을 알아볼 수 있게 두고 기관의 규정에 따라 수정 사실을 남긴다."},
{"id":"m79","subj":"간호관리","unit":"간호기록","q":"문제중심기록에서 사용하는 SOAP 형식 중 'A'에 해당하는 것은?","opts":["환자가 말한 주관적 자료","관찰과 측정으로 얻은 객관적 자료","자료를 근거로 내린 사정(판단)","문제 해결을 위한 계획"],"ans":2,"exp":"SOAP는 주관적 자료(Subjective), 객관적 자료(Objective), 사정(Assessment), 계획(Plan)의 순서로 적는다. A는 주관적·객관적 자료를 분석하여 내린 판단으로, 간호 진단이나 문제의 진술이 여기에 해당한다."},
{"id":"m80","subj":"간호관리","unit":"의사소통","q":"SBAR 의사소통에서 다음 내용이 해당하는 단계는?\n\n\"환자는 3일 전에 위절제술을 받았고, 당뇨병 병력이 있어 현재 인슐린을 투여 중입니다.\"","opts":["상황(Situation)","배경(Background)","평가(Assessment)","제안(Recommendation)"],"ans":1,"exp":"배경 단계에서는 입원 사유, 수술 이력, 과거 병력, 현재 치료 등 상황을 이해하는 데 필요한 정보를 전달한다. 상황은 지금 일어나고 있는 문제를, 평가는 보고자가 판단한 환자의 상태를, 제안은 필요하다고 생각하는 조치나 요청을 말하는 단계이다."},
{"id":"m81","subj":"간호관리","unit":"간호기록","q":"표준화된 간호 용어 체계 중 간호 중재를 분류한 것은?","opts":["NOC","NIC","NANDA-I","ICD"],"ans":1,"exp":"NIC(Nursing Interventions Classification)는 간호 중재 분류 체계이다. NANDA-I는 간호 진단을, NOC(Nursing Outcomes Classification)는 간호 결과를 분류한 것이고, ICD는 세계보건기구의 국제질병분류로 간호 용어 체계가 아니다."},
{"id":"m82","subj":"간호관리","unit":"법적 의무","q":"간호사가 수혈 전에 혈액 주머니의 혈액형과 환자 정보를 대조하지 않아 다른 환자의 혈액이 수혈되었다. 이 간호사가 일차적으로 위반한 법적 의무는?","opts":["확인 의무","진료 거부 금지 의무","비밀유지 의무","설명 및 동의 의무"],"ans":0,"exp":"확인 의무는 간호의 내용과 대상이 정확한지 확인해야 할 의무로, 수혈 혈액과 환자 확인, 투약할 약품의 확인, 의료 장비의 점검, 보조 인력 업무의 확인이 포함된다. 비밀유지 의무는 업무 중 알게 된 환자 정보를 누설하지 않을 의무이고, 설명 및 동의 의무는 처치 전에 충분히 설명하고 동의를 받을 의무이다."},
{"id":"m83","subj":"간호관리","unit":"법적 의무","q":"간호사의 주의의무 가운데, 간호 행위로 환자에게 발생할 수 있는 위험을 미리 내다보아야 할 의무는?","opts":["설명 의무","결과 예견 의무","확인 의무","결과 회피 의무"],"ans":1,"exp":"주의의무는 결과 예견 의무와 결과 회피 의무로 이루어진다. 결과 예견 의무는 행위로 생길 수 있는 위험을 미리 인식할 의무이고, 결과 회피 의무는 예견한 위험이 실제로 일어나지 않도록 필요한 조치를 할 의무이다. 주의의무를 게을리하여 환자에게 손해가 생기면 과실이 된다."},
{"id":"m84","subj":"간호관리","unit":"의료법규","q":"「의료법」에 따라 의사가 환자에게 미리 설명하고 서면으로 동의를 받아야 하는 의료 행위로 명시된 것이 아닌 것은?","opts":["전신마취","수혈","근육 주사","수술"],"ans":2,"exp":"「의료법」은 사람의 생명이나 신체에 중대한 위해를 일으킬 우려가 있는 수술, 수혈, 전신마취를 할 때 환자(의사결정 능력이 없으면 법정대리인)에게 설명하고 서면으로 동의를 받도록 정하고 있다. 근육 주사는 이 조항에 명시된 행위가 아니다."},
{"id":"m85","subj":"간호관리","unit":"의료법규","q":"「의료법」상 의료인에 해당하지 않는 사람은?","opts":["간호사","조산사","한의사","간호조무사"],"ans":3,"exp":"「의료법」상 의료인은 보건복지부장관의 면허를 받은 의사, 치과의사, 한의사, 조산사, 간호사이다. 간호조무사는 보건복지부장관의 자격 인정을 받는 인력으로 의료인에 포함되지 않는다."},
{"id":"m86","subj":"간호관리","unit":"의료법규","q":"「의료법 시행규칙」에 따른 간호기록부의 보존 기간은?","opts":["2년","3년","5년","10년"],"ans":2,"exp":"간호기록부의 보존 기간은 5년이다. 환자 명부, 검사 소견 기록, 방사선 사진과 그 소견서, 조산기록부도 5년이다. 처방전은 2년, 진단서 등의 부본은 3년, 진료기록부와 수술기록은 10년 동안 보존한다."},
{"id":"m87","subj":"간호관리","unit":"의료법규","q":"「간호법」에 규정된 간호사의 업무에 해당하지 않는 것은?","opts":["의사, 치과의사, 한의사의 지도하에 시행하는 진료의 보조","의사의 지도 없이 독자적으로 하는 의약품 처방","환자의 간호 요구에 대한 관찰, 자료 수집, 간호 판단 및 요양을 위한 간호","간호조무사가 수행하는 업무 보조에 대한 지도"],"ans":1,"exp":"「간호법」은 간호사의 업무를 환자의 간호 요구에 대한 관찰·자료 수집·간호 판단 및 요양을 위한 간호, 의사 등의 지도하에 하는 진료의 보조, 간호 요구자에 대한 교육·상담 및 건강 증진 활동의 기획과 수행, 간호조무사의 업무 보조에 대한 지도로 정한다. 의약품 처방은 의사, 치과의사, 한의사의 업무로 간호사가 독자적으로 할 수 없다."},
{"id":"m88","subj":"간호관리","unit":"의료법규","q":"「간호법」에 대한 설명으로 옳은 것은?","opts":["간호조무사에 관한 규정은 이 법에 포함되지 않는다","2024년에 제정·공포되어 2025년 6월부터 시행되었다","이 법의 시행으로 간호사는 「의료법」상 의료인에서 제외되었다","간호사 면허는 대한간호협회장이 발급한다"],"ans":1,"exp":"「간호법」은 2024년 9월에 공포되어 2025년 6월 21일부터 시행되었다. 간호사 면허는 보건복지부장관이 발급하고, 간호사는 여전히 「의료법」상 의료인이다. 이 법은 간호사, 전문간호사와 함께 간호조무사의 자격과 업무에 관한 사항도 규정한다."},
{"id":"m89","subj":"간호관리","unit":"의료법규","q":"간호사가 최초로 면허를 받은 뒤 그 실태와 취업 상황 등을 보건복지부장관에게 신고해야 하는 주기는?","opts":["1년마다","2년마다","3년마다","5년마다"],"ans":2,"exp":"간호사는 최초로 면허를 받은 뒤부터 3년마다 실태와 취업 상황 등을 보건복지부장관에게 신고해야 한다. 이 신고 제도는 「의료법」에 있던 것이 「간호법」으로 옮겨졌으며, 보수교육을 이수하지 않으면 신고가 반려될 수 있다."},
{"id":"m90","subj":"간호관리","unit":"간호윤리","q":"한정된 중환자실 병상을 누구에게 먼저 배정할지 결정할 때, 의학적 필요에 따른 공정한 기준으로 자원을 나누어야 한다는 근거가 되는 윤리 원칙은?","opts":["정의의 원칙","선행의 원칙","악행금지의 원칙","자율성 존중의 원칙"],"ans":0,"exp":"정의의 원칙은 부족한 의료 자원과 부담을 공정한 기준에 따라 분배해야 한다는 원칙이다. 선행의 원칙은 환자에게 이익이 되는 행위를 하라는 것, 자율성 존중의 원칙은 환자 스스로의 결정을 존중하라는 것, 악행금지의 원칙은 해를 끼치지 말라는 것이다."},
{"id":"m91","subj":"간호관리","unit":"간호윤리","q":"환자에게 이익이 된다는 이유로 의료인이 환자의 뜻을 묻지 않거나 환자의 뜻에 반하여 결정을 내리는 것을 무엇이라 하는가?","opts":["선의의 간섭주의","사전 동의","이중효과의 원칙","공리주의"],"ans":0,"exp":"선의의 간섭주의(온정적 간섭주의)는 환자의 이익을 위한다는 선행의 원칙을 앞세워 환자의 자율성을 제한하는 것이다. 이중효과의 원칙은 좋은 결과를 의도한 행위에 예견된 나쁜 결과가 따르더라도 일정 조건에서 허용된다는 것이고, 사전 동의는 충분한 설명을 듣고 환자가 자발적으로 하는 동의이다."},
{"id":"m92","subj":"간호관리","unit":"간호윤리","q":"\"최대 다수의 최대 행복\"을 가져오는 행위가 옳다고 보며, 행위의 옳고 그름을 그 결과로 판단하는 윤리 이론은?","opts":["의무론","덕 윤리","공리주의","돌봄 윤리"],"ans":2,"exp":"공리주의는 행위의 결과로 생기는 이익과 행복의 총합이 가장 큰 행위를 옳다고 보는 결과주의 이론이다. 의무론은 결과와 관계없이 행위 자체가 도덕 법칙과 의무에 맞는지를 기준으로 삼는다. 덕 윤리는 행위자의 품성을, 돌봄 윤리는 관계와 배려를 중심에 둔다."},
{"id":"m93","subj":"간호관리","unit":"마케팅","q":"간호 서비스는 저장하거나 재고로 보관할 수 없어, 제공되지 않은 서비스는 그대로 사라진다. 이 서비스 특성은?","opts":["이질성","무형성","비분리성","소멸성"],"ans":3,"exp":"소멸성은 서비스를 저장할 수 없다는 특성으로, 수요와 공급을 맞추기 위한 예약 제도나 인력의 탄력적 배치가 필요하다. 무형성은 형태가 없어 미리 보거나 만질 수 없다는 것, 비분리성은 생산과 소비가 동시에 일어난다는 것, 이질성은 제공자와 상황에 따라 질이 달라진다는 것이다."},
{"id":"m94","subj":"간호관리","unit":"마케팅","q":"같은 간호 서비스라도 제공하는 간호사, 시간, 장소에 따라 질이 달라지는 서비스 특성에 대응하는 관리 전략은?","opts":["병원 시설과 유니폼 등 유형적 단서로 서비스를 가시화한다","간호 실무 표준과 지침을 마련하여 서비스를 표준화한다","예약 제도를 운영하여 수요와 공급을 조절한다","서비스 가격을 낮추어 이용 수요를 늘린다"],"ans":1,"exp":"제공자와 상황에 따라 질이 달라지는 특성은 이질성(변동성)이며, 실무 표준과 지침, 교육 훈련으로 서비스를 표준화하여 대응한다. 예약 제도로 수요와 공급을 맞추는 것은 소멸성에, 유형적 단서를 제공하는 것은 무형성에 대응하는 전략이다."},
{"id":"m95","subj":"간호관리","unit":"마케팅","q":"간호 서비스 마케팅 믹스(4P) 중 유통(place) 전략에 해당하는 것은?","opts":["병원 소식지와 건강 강좌로 간호 서비스를 알린다","가정간호와 야간·주말 진료로 서비스 이용 통로를 넓힌다","새로운 전문 간호 서비스 프로그램을 개발한다","간호 원가 분석을 근거로 간호 수가를 산정한다"],"ans":1,"exp":"유통 전략은 고객이 서비스를 쉽게 이용하도록 장소, 시간, 전달 경로의 접근성을 높이는 것으로 가정간호, 야간·주말 진료, 원격 상담 등이 해당한다. 새 서비스 개발은 제품 전략, 수가 산정은 가격 전략, 소식지와 건강 강좌는 촉진 전략이다."},
{"id":"m96","subj":"간호관리","unit":"마케팅","q":"전체 시장을 인구학적 특성이나 건강 요구 등이 비슷한 고객 집단으로 나누는 마케팅 활동은?","opts":["표적 시장 선정","마케팅 믹스","포지셔닝","시장 세분화"],"ans":3,"exp":"시장 세분화는 요구와 특성이 비슷한 고객끼리 묶어 시장을 여러 집단으로 나누는 것이다. 표적 시장 선정은 나눈 집단 중 집중할 대상을 고르는 것이고, 포지셔닝은 표적 고객의 마음속에 서비스의 차별적 위치를 심는 것이며, 마케팅 믹스는 제품, 가격, 유통, 촉진 전략을 조합하는 것이다."},
{"id":"m97","subj":"간호관리","unit":"간호전문직","q":"전문직의 특성으로 옳지 않은 것은?","opts":["자체 윤리강령과 전문직 단체가 있다","업무 수행의 기준을 외부 기관의 통제에만 의존한다","장기간의 체계적인 교육이 필요하다","고유한 지식 체계에 근거하여 실무를 수행한다"],"ans":1,"exp":"전문직은 스스로 업무의 기준을 정하고 통제하는 자율성을 가진다. 그 밖에 고유한 지식 체계, 장기간의 교육, 윤리강령, 전문직 단체, 사회에 대한 봉사가 전문직의 특성이다. 외부 통제에만 의존하는 것은 자율성과 어긋난다."},
{"id":"m98","subj":"간호관리","unit":"간호역사","q":"나이팅게일(Nightingale)의 업적으로 옳은 것은?","opts":["국제적십자를 창설하였다","성 토마스 병원에 간호학교를 세웠다","간호사 면허 시험 제도의 도입을 주도하였다","국제간호협의회(ICN)를 창립하였다"],"ans":1,"exp":"나이팅게일은 크림 전쟁에서의 간호 활동 뒤 1860년 성 토마스 병원에 나이팅게일 간호학교를 세웠다. 국제간호협의회는 펜위크가 주도하여 창립하였고, 국제적십자는 앙리 뒤낭이 창설하였다. 나이팅게일은 간호사 등록(면허) 제도에는 반대하였다."},
{"id":"m99","subj":"간호관리","unit":"간호역사","q":"1903년 우리나라 최초의 간호 교육 기관인 간호원 양성소가 설치된 곳은?","opts":["광혜원","세브란스 병원","보구여관","대한의원"],"ans":2,"exp":"1903년 선교 간호사 에드먼즈가 여성 전문 병원인 보구여관에 간호원 양성소를 세운 것이 우리나라 간호 교육의 시작이다. 세브란스 병원 간호원 양성소는 1906년 쉴즈가 세웠고, 대한의원은 1907년에 설립된 관립 의료 기관이며, 광혜원(제중원)은 1885년에 세워진 최초의 서양식 국립 병원이다."},
{"id":"m100","subj":"간호관리","unit":"간호역사","q":"대한간호협회가 국제간호협의회(ICN)의 정회원으로 가입한 해는?","opts":["1923년","1949년","1962년","1987년"],"ans":1,"exp":"대한간호협회는 1949년 국제간호협의회의 정회원이 되었다. 1923년은 조선간호부회가 창립된 해이고, 1962년은 「의료법」 개정으로 검정고시 제도가 없어지고 국가시험에 합격해야 면허를 받게 된 해이며, 1987년은 「의료법」 개정으로 간호원이 간호사로 명칭이 바뀐 해이다."},
{"id":"c01","subj":"지역사회간호","unit":"역학 연구","q":"질병이 없는 집단을 위험요인 노출 여부에 따라 나눈 뒤, 시간이 지나면서 질병 발생을 추적 관찰하는 연구 방법은?","opts":["단면조사 연구","환자-대조군 연구","코호트 연구","사례 연구"],"ans":2,"exp":"코호트 연구는 노출 여부로 집단을 나누어 앞으로 추적하므로 발생률과 상대위험비를 직접 구할 수 있다. 환자-대조군 연구는 이미 병이 있는 집단과 없는 집단의 과거 노출을 비교하고, 단면조사 연구는 한 시점에서 노출과 질병을 동시에 조사한다."},
{"id":"c02","subj":"지역사회간호","unit":"역학 지표","q":"흡연자 1,000명 중 30명, 비흡연자 1,000명 중 10명에게 폐질환이 발생하였다. 흡연의 상대위험비는?","opts":["0.33","2","3","20"],"ans":2,"exp":"상대위험비는 노출군 발생률을 비노출군 발생률로 나눈 값이다. (30/1,000) ÷ (10/1,000) = 3. 흡연자가 비흡연자보다 발생 위험이 3배 높다는 뜻이다. 두 발생률의 차이(1,000명당 20명)는 귀속위험도이다."},
{"id":"c03","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 제1급감염병에 해당하는 것은?","opts":["결핵","홍역","에볼라바이러스병","B형간염"],"ans":2,"exp":"제1급감염병은 치명률이 높거나 집단 발생 우려가 커서 발생 즉시 신고하고 음압격리 같은 높은 수준의 격리가 필요한 감염병으로, 에볼라바이러스병이 해당한다. 결핵과 홍역은 제2급, B형간염은 제3급이다. 감염병 분류는 법령 개정으로 바뀔 수 있으니 시험 전에 현행 법령을 확인한다."},
{"id":"c04","subj":"지역사회간호","unit":"보건교육 이론","q":"범이론적 모형(변화단계 이론)에서 \"앞으로 6개월 이내에 행동을 바꿀 의도가 있는\" 단계는?","opts":["계획 전 단계","계획 단계","준비 단계","행동 단계"],"ans":1,"exp":"계획 단계(숙고 단계)는 6개월 이내에 변화할 의도가 있는 단계이다. 계획 전 단계는 6개월 이내에 변화 의도가 없고, 준비 단계는 1개월 이내에 실천할 의도가 있으며, 행동 단계는 실천한 지 6개월 미만, 유지 단계는 6개월 이상 지속한 단계이다."},
{"id":"c05","subj":"지역사회간호","unit":"가족간호","q":"가족과 학교, 직장, 보건기관 등 외부 체계와의 상호작용을 그림으로 나타내는 가족사정도구는?","opts":["가계도","가족밀착도","외부체계도","사회지지도"],"ans":2,"exp":"외부체계도(생태도)는 가족을 둘러싼 외부 체계와의 관계와 에너지 흐름을 보여 준다. 가계도는 3세대 이상의 가족 구조를, 가족밀착도는 가족 구성원 사이의 애착 관계를, 사회지지도는 가장 취약한 구성원을 중심으로 한 지지 체계를 나타낸다."},
{"id":"c06","subj":"지역사회간호","unit":"인구","q":"한 명의 여성이 가임 기간(15~49세) 동안 낳을 것으로 예상되는 평균 출생아 수를 나타내는 지표는?","opts":["조출생률","일반출산율","합계출산율","순재생산율"],"ans":2,"exp":"합계출산율은 연령별 출산율을 모두 더해 구하며 국가 간 출산 수준 비교에 쓴다. 조출생률은 인구 1,000명당 출생아 수, 일반출산율은 가임 여성 1,000명당 출생아 수이다. 순재생산율은 여아만 세고 어머니의 사망률까지 고려한 지표이다."},
{"id":"c07","subj":"지역사회간호","unit":"일차보건의료","q":"세계보건기구가 제시한 일차보건의료의 접근 원칙(4A)에 해당하지 않는 것은?","opts":["접근성","수용 가능성","지불 부담 능력","전문성"],"ans":3,"exp":"4A는 접근성(Accessible), 수용 가능성(Acceptable), 주민 참여(Available), 지불 부담 능력(Affordable)이다. 일차보건의료는 주민이 쉽게 이용하고, 받아들일 수 있고, 참여하며, 부담할 수 있는 기본 보건의료를 강조한다."},
{"id":"c08","subj":"지역사회간호","unit":"산업보건","q":"근로자 건강진단 결과 건강관리구분 \"D1\"의 의미는?","opts":["건강한 근로자","직업병 요관찰자","일반 질병 요관찰자","직업병 유소견자"],"ans":3,"exp":"D1은 직업성 질병의 소견이 있어 사후관리가 필요한 근로자이다. A는 건강한 근로자, C1은 직업병 요관찰자, C2는 일반 질병 요관찰자, D2는 일반 질병 유소견자, R은 2차 건강진단 대상자이다. C는 관찰, D는 질병으로 기억하고 숫자 1은 직업성, 2는 일반 질병으로 구분한다."},
{"id":"c09","subj":"지역사회간호","unit":"보건의료체계","q":"의사에게 등록된 주민 수에 따라 일정액을 지급하는 진료비 지불제도는?","opts":["행위별수가제","포괄수가제","인두제","총액계약제"],"ans":2,"exp":"인두제는 등록 인원 수로 보수가 정해져 예방 활동에 힘쓰게 되지만 과소 진료나 상급기관 의뢰 증가의 우려가 있다. 행위별수가제는 제공한 서비스 항목마다 값을 치르고, 포괄수가제는 질병군별로 정해진 금액을, 총액계약제는 보험자와 의사단체가 계약한 총액을 지급한다."},
{"id":"c10","subj":"지역사회간호","unit":"건강증진","q":"질병 예방 수준 중 2차 예방에 해당하는 것은?","opts":["영유아 예방접종","청소년 금연 교육","자궁경부암 조기 검진","뇌졸중 환자 재활 간호"],"ans":2,"exp":"2차 예방은 조기 발견과 조기 치료로, 건강검진과 집단 검진이 대표적이다. 예방접종과 보건교육은 질병 발생 자체를 막는 1차 예방이고, 재활은 장애를 줄이고 기능을 회복시키는 3차 예방이다."},
{"id":"c11","subj":"지역사회간호","unit":"역학 지표","q":"실제로 질병이 있는 사람 중에서 검사 결과가 양성으로 나온 사람의 비율은?","opts":["민감도","특이도","양성예측도","음성예측도"],"ans":0,"exp":"민감도는 환자를 환자로 가려내는 능력이다. 특이도는 질병이 없는 사람 중 검사 음성인 비율이다. 양성예측도는 검사 양성인 사람 중 실제 환자의 비율로, 유병률의 영향을 받는다."},
{"id":"c12","subj":"지역사회간호","unit":"보건행정","q":"보건소 설치의 근거가 되는 법률은?","opts":["보건의료기본법","지역보건법","국민건강증진법","농어촌 등 보건의료를 위한 특별조치법"],"ans":1,"exp":"보건소와 보건지소는 지역보건법에 따라 설치한다. 보건진료소와 보건진료 전담공무원의 근거는 농어촌 등 보건의료를 위한 특별조치법이다. 두 법의 대상을 바꾸어 묻는 선지가 자주 나온다."},
{"id":"c13","subj":"지역사회간호","unit":"지역사회 개념","q":"지역사회의 유형 중 감정적 지역사회에 해당하는 것은?","opts":["소속 공동체","지정학적 공동체","자원 공동체","대면 공동체"],"ans":0,"exp":"감정적 지역사회는 공통의 감정과 유대감으로 묶인 것으로, 같은 고향이나 학교처럼 소속감으로 맺어진 소속 공동체와 특수 흥미 공동체가 있다. 지정학적 공동체와 대면 공동체는 구조적 지역사회이고, 자원 공동체는 기능적 지역사회이다."},
{"id":"c14","subj":"지역사회간호","unit":"지역사회 역사","q":"1893년 뉴욕 헨리가에 구제사업소를 세워 빈민을 대상으로 방문간호 사업을 펼치고, 지역사회 중심의 보건간호를 체계화한 사람은?","opts":["플로렌스 나이팅게일","윌리엄 라스본","릴리안 왈드","메리 브레킨리지"],"ans":2,"exp":"릴리안 왈드는 헨리가 구제사업소를 세워 방문간호와 학교간호 사업을 이끌었다. 라스본은 1859년 영국 리버풀에서 구역간호 사업을 시작하였고, 브레킨리지는 1925년 미국 켄터키에서 농촌 간호 사업을 조직하였다."},
{"id":"c15","subj":"지역사회간호","unit":"간호 이론","q":"뉴만(Neuman)의 건강관리체계이론에서 대상 체계의 가장 바깥에 있으며, 수시로 변하면서 스트레스원이 정상방어선에 닿지 않도록 완충 역할을 하는 것은?","opts":["저항선","기본 구조","유연방어선","정상방어선"],"ans":2,"exp":"유연방어선은 가장 바깥의 방어선으로 스트레스원을 일차로 막아 주며, 이를 강화하는 것이 1차 예방이다. 정상방어선은 대상자가 오랫동안 유지해 온 평소의 안녕 상태이고, 저항선은 기본 구조를 둘러싼 가장 안쪽의 방어선으로 정상방어선이 뚫렸을 때 작동한다."},
{"id":"c16","subj":"지역사회간호","unit":"간호 이론","q":"오렘(Orem)의 자가간호이론에 따를 때 다음 대상자에게 적용할 간호 체계는?\n\n뇌졸중으로 오른쪽 편마비가 있는 70세 노인이 식사는 혼자 하지만, 목욕과 옷 입기는 방문간호사와 가족의 도움을 받아서 한다.","opts":["전체적 보상 체계","부분적 보상 체계","교육지지적 체계","발달적 자가간호 체계"],"ans":1,"exp":"부분적 보상 체계는 대상자가 자가간호의 일부는 스스로 하고 나머지는 간호사가 도와 함께 수행하는 체계이다. 전체적 보상 체계는 대상자가 자가간호를 전혀 하지 못할 때, 교육지지적 체계는 할 능력은 있으나 지식과 기술, 지지가 필요할 때 적용한다. 발달적 자가간호는 간호 체계가 아니라 자가간호 요구의 한 종류이다."},
{"id":"c17","subj":"지역사회간호","unit":"간호 이론","q":"로이(Roy)의 적응이론에서 대상자가 지금 직접 마주하고 있어 적응 반응을 일으키는 데 가장 큰 영향을 주는 자극은?","opts":["초점자극","연관자극","잔여자극","인지자극"],"ans":0,"exp":"초점자극은 당면한 상황에서 대상자에게 직접 영향을 주는 자극이다. 연관자극은 초점자극 말고 그 상황에 함께 작용하는 다른 자극이고, 잔여자극은 신념이나 태도처럼 영향을 줄 수 있으나 측정하기 어려운 자극이다. 인지자극이라는 분류는 없다."},
{"id":"c18","subj":"지역사회간호","unit":"간호 이론","q":"체계이론에서 산출의 일부가 다시 체계로 되돌아가 투입과 변환 과정을 조절하게 하는 것은?","opts":["투입","변환","경계","회환"],"ans":3,"exp":"회환(환류, 피드백)은 산출 결과를 다시 투입에 반영하여 체계가 스스로를 조절하게 하는 과정이다. 투입은 체계로 들어오는 물질·에너지·정보이고, 변환은 투입을 산출로 바꾸는 과정이며, 경계는 체계를 환경과 구분하는 테두리이다."},
{"id":"c19","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 사례에서 지역사회 간호사가 수행한 역할은?\n\n외국인 근로자가 의료비 지원 제도를 몰라 치료를 받지 못하고 있었다. 간호사는 그가 누릴 수 있는 권리와 제도를 알려 주고, 관계 기관에 근로자의 처지를 대신 설명하여 지원을 받게 하였다.","opts":["교육자","대변자(옹호자)","연구자","관리자"],"ans":1,"exp":"대변자(옹호자)는 대상자가 자신의 권리를 찾을 수 있도록 정보를 주고, 대상자의 입장에 서서 의견을 대신 말해 주는 역할이다. 교육자는 건강 지식과 기술을 가르치는 역할, 관리자는 사업을 계획·조직·감독하는 역할이다."},
{"id":"c20","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정의 자료 수집 방법 중 자동차를 타거나 걸어서 지역을 두루 돌아보며 주거 상태, 생활 모습, 지역의 분위기 등을 빠르게 살피는 것은?","opts":["참여관찰","지역 시찰(차창 밖 조사)","정보원 면담","설문지 조사"],"ans":1,"exp":"지역 시찰은 지역을 돌아다니며 눈으로 살펴 전체 모습을 짧은 시간에 파악하는 방법이다. 참여관찰은 지역 행사 등에 직접 참여하면서 관찰하는 것이고, 정보원 면담은 지역 지도자 같은 주요 인물을 만나 묻는 것이며, 설문지 조사는 주민에게 직접 질문하여 자료를 얻는 것이다."},
{"id":"c21","subj":"지역사회간호","unit":"간호과정","q":"오마하(Omaha) 문제분류체계의 네 영역에 해당하지 않는 것은?","opts":["영적 영역","환경 영역","생리 영역","건강관련행위 영역"],"ans":0,"exp":"오마하 문제분류체계의 영역은 환경, 심리사회, 생리, 건강관련행위의 네 가지이다. 영적 영역이라는 영역은 따로 없으며, 영성에 관한 문제는 심리사회 영역 안의 문제로 다룬다."},
{"id":"c22","subj":"지역사회간호","unit":"간호과정","q":"어느 건강 문제를 평가한 점수가 다음과 같다. 공식 (A + 2B) × C 로 구한 BPRS 점수는?\n\nA(문제의 크기): 6점\nB(문제의 심각도): 7점\nC(사업의 추정 효과): 9점","opts":["117","171","180","270"],"ans":2,"exp":"BPRS는 (A + 2B) × C 로 구한다. (6 + 2 × 7) × 9 = 20 × 9 = 180점이다. 심각도 B에만 2를 곱한다는 점을 놓치면 (6 + 7) × 9 = 117처럼 잘못 계산하게 된다."},
{"id":"c23","subj":"지역사회간호","unit":"간호과정","q":"우선순위 결정 방법 중 PATCH가 쓰는 두 가지 기준은?","opts":["건강 문제의 크기와 심각도","건강 문제의 중요성과 변화 가능성","사업의 경제성과 수용성","주민의 관심도와 자원 동원 가능성"],"ans":1,"exp":"PATCH는 건강 문제의 중요성과 변화 가능성을 기준으로 삼아, 중요하고 변화 가능성도 높은 문제를 가장 먼저 다룬다. 문제의 크기와 심각도는 BPRS의 평가 항목이고, 경제성과 수용성은 PEARL의 항목이다."},
{"id":"c24","subj":"지역사회간호","unit":"간호과정","q":"우선순위 결정에 쓰는 PEARL에 대한 설명으로 옳은 것은?","opts":["건강 문제의 크기, 심각도, 사업 효과를 점수로 매겨 계산한다","건강 문제의 중요성과 변화 가능성을 기준으로 순위를 정한다","적절성, 경제성, 수용성, 자원, 적법성으로 사업의 실행 가능성을 판단한다","대상 집단의 취약성과 전문가의 해결 능력만으로 순위를 정한다"],"ans":2,"exp":"PEARL은 BPRS로 점수를 매긴 뒤 사업을 실제로 할 수 있는지 판단하는 기준으로, 적절성·경제성·수용성·자원·적법성 다섯 항목 가운데 하나라도 0이면 사업을 시행하지 않는다. 크기·심각도·효과는 BPRS, 중요성과 변화 가능성은 PATCH의 기준이다."},
{"id":"c25","subj":"지역사회간호","unit":"간호과정","q":"SMART 기준에 가장 잘 맞는 간호 목표는?","opts":["A동 주민 모두의 건강 수준을 지금보다 훨씬 높인다","보건소 간호사가 고혈압 관리 교육을 연중 열심히 실시한다","가능한 한 이른 시기에 A동 성인의 흡연율을 크게 낮춘다","사업 시작 1년 뒤까지 A동 성인 흡연율을 25%에서 20%로 낮춘다"],"ans":3,"exp":"SMART 목표는 구체적이고, 측정할 수 있으며, 달성 가능하고, 문제와 관련이 있고, 기한이 있어야 한다. 흡연율을 25%에서 20%로 낮춘다는 목표만 대상과 지표, 수치, 기한을 모두 밝혔다. 나머지는 수치와 기한이 없거나, 결과가 아닌 간호사의 활동을 적은 것이다."},
{"id":"c26","subj":"지역사회간호","unit":"간호과정","q":"보건사업 평가 범주 중 사업의 실적을 지역사회의 요구량과 비교하여 사업이 요구를 얼마나 충족하였는지 보는 것은?","opts":["사업의 적합성 평가","사업의 효율성 평가","사업 진행에 대한 평가","투입된 노력에 대한 평가"],"ans":0,"exp":"적합성 평가는 사업 실적이 지역사회 요구에 비추어 충분한지를 본다. 효율성 평가는 투입한 비용에 견준 성과를, 사업 진행 평가는 일정대로 진행되는지를, 투입된 노력 평가는 들어간 인력·시간·물자의 양을 본다."},
{"id":"c27","subj":"지역사회간호","unit":"간호과정","q":"보건소가 SWOT 분석을 한 결과가 다음과 같다. 이 상황에 맞는 전략은?\n\n내부: 방문간호 인력이 부족하고 직원의 사업 경험이 적다.\n외부: 정부가 방문건강관리 예산을 늘렸고 주민의 관심도 높아졌다.","opts":["SO 전략(공격적 전략)","ST 전략(다각화 전략)","WO 전략(국면전환 전략)","WT 전략(방어적 전략)"],"ans":2,"exp":"내부 요인은 약점(W), 외부 요인은 기회(O)이므로 WO 전략이다. 외부의 기회를 살려 내부의 약점을 보완하는 국면전환 전략을 쓴다. SO는 강점과 기회, ST는 강점과 위협, WT는 약점과 위협이 만날 때의 전략이다."},
{"id":"c28","subj":"지역사회간호","unit":"지역사회 간호수단","q":"간호사가 하루에 다음 네 가정을 모두 방문하려 한다. 가장 먼저 방문해야 할 가정은?","opts":["활동성 폐결핵 환자가 있는 가정","생후 2주 된 신생아가 있는 가정","옴 환자가 있는 가정","세균성이질 환자가 있는 가정"],"ans":1,"exp":"하루에 여러 가정을 방문할 때는 간호사가 감염을 옮기지 않도록 면역력이 약하고 감염성이 없는 대상부터 방문하고, 감염성 질환자는 뒤로 미룬다. 신생아 가정을 먼저 방문하고 결핵, 옴, 세균성이질 환자 가정은 그 뒤에 방문한다."},
{"id":"c29","subj":"지역사회간호","unit":"보건의료체계","q":"프라이(Fry)의 보건의료전달체계 유형 중 다음 특징을 가진 것은?\n\n국민이 의료기관을 자유롭게 고른다.\n의료의 질과 기술 수준이 높다.\n의료 자원이 지역에 고르게 분포하지 않고 의료비가 오르기 쉽다.","opts":["자유방임형","사회보장형","사회주의형","공공부조형"],"ans":0,"exp":"자유방임형은 의료를 주로 민간과 시장에 맡겨 선택의 자유와 의료의 질은 높지만, 자원의 지역 편중과 의료비 상승이 문제이다. 사회보장형은 정부가 주도하여 형평성이 높고, 사회주의형은 국가가 의료 자원을 모두 관리하고 배분한다. 프라이의 분류에 공공부조형은 없다."},
{"id":"c30","subj":"지역사회간호","unit":"사회보장","q":"우리나라 사회보장 제도 중 공공부조에 해당하는 것은?","opts":["의료급여","국민건강보험","산업재해보상보험","노인장기요양보험"],"ans":0,"exp":"공공부조는 생활이 어려운 국민에게 국가가 조세로 최저 생활을 보장하는 제도로, 의료급여와 국민기초생활보장이 해당한다. 국민건강보험, 산업재해보상보험, 노인장기요양보험은 보험료를 재원으로 하는 사회보험이다."},
{"id":"c31","subj":"지역사회간호","unit":"사회보장","q":"우리나라 국민건강보험의 특징으로 옳지 않은 것은?","opts":["법으로 정한 요건에 해당하면 가입이 강제된다","보험료를 많이 낸 사람일수록 더 많은 보험급여를 받는다","보험료는 소득 등 부담 능력에 따라 차등 부과한다","한 해 단위로 수입과 지출을 맞추는 단기 보험이다"],"ans":1,"exp":"건강보험은 보험료는 부담 능력에 따라 다르게 내지만 급여는 낸 보험료와 관계없이 필요에 따라 균등하게 받는다. 이로써 소득 재분배와 위험 분산이 이루어진다. 강제 가입, 부담 능력에 따른 보험료, 단기 보험은 모두 옳은 특징이다."},
{"id":"c32","subj":"지역사회간호","unit":"사회보장","q":"요양기관이 청구한 요양급여비용을 심사하고 요양급여의 적정성을 평가하는 기관은?","opts":["국민건강보험공단","건강보험심사평가원","보건복지부","건강보험정책심의위원회"],"ans":1,"exp":"건강보험심사평가원은 요양급여비용의 심사와 요양급여의 적정성 평가를 맡는다. 국민건강보험공단은 보험자로서 가입자 자격 관리, 보험료 부과·징수, 보험급여 비용 지급을 맡고, 보건복지부는 제도를 관장한다."},
{"id":"c33","subj":"지역사회간호","unit":"보건의료체계","q":"조세를 주된 재원으로 하여 국가가 모든 국민에게 보건의료서비스를 직접 제공하며, 영국이 대표적인 의료보장 유형은?","opts":["민간보험 방식","사회보험 방식(NHI)","의료저축계정 방식","국가보건서비스 방식(NHS)"],"ans":3,"exp":"국가보건서비스 방식은 조세로 재원을 마련해 국가가 의료를 직접 제공하는 방식으로 영국, 스웨덴 등이 채택하고 있다. 사회보험 방식은 가입자가 낸 보험료를 재원으로 하며 우리나라, 독일, 일본이 해당한다."},
{"id":"c34","subj":"지역사회간호","unit":"노인장기요양보험","q":"「노인장기요양보험법」상 장기요양인정을 신청할 수 있는 사람은?","opts":["알츠하이머병으로 혼자 생활하기 어려운 60세 건강보험 가입자","교통사고로 하반신이 마비된 45세 건강보험 가입자","혼자 살며 고혈압 약을 먹는 62세 의료급여 수급권자","지체장애로 휠체어를 쓰는 30세 건강보험 피부양자"],"ans":0,"exp":"장기요양인정은 65세 이상 노인이거나, 65세 미만이면서 치매·뇌혈관성 질환·파킨슨병 같은 노인성 질병을 가진 사람이 신청할 수 있다. 알츠하이머병은 노인성 질병이므로 60세라도 신청할 수 있다. 교통사고 후유증, 고혈압, 지체장애는 65세 미만인 사람의 신청 사유가 되지 않는다."},
{"id":"c35","subj":"지역사회간호","unit":"노인장기요양보험","q":"노인장기요양보험의 재가급여에 해당하지 않는 것은?","opts":["방문목욕","주·야간보호","단기보호","노인요양공동생활가정 입소"],"ans":3,"exp":"재가급여에는 방문요양, 방문목욕, 방문간호, 주·야간보호, 단기보호, 복지용구 같은 기타 재가급여가 있다. 노인요양시설이나 노인요양공동생활가정에 입소하여 받는 급여는 시설급여이다."},
{"id":"c36","subj":"지역사회간호","unit":"보건행정","q":"「지역보건법」상 지역보건의료계획에 대한 설명으로 옳은 것은?","opts":["보건복지부장관이 수립하여 시·도에 내려보낸다","시·도지사와 시장·군수·구청장이 4년마다 수립한다","연차별 시행계획은 2년마다 수립한다","주민의 의견은 듣지 않고 전문가가 작성한다"],"ans":1,"exp":"지역보건의료계획은 시·도지사와 시장·군수·구청장이 4년마다 수립하고, 그에 따른 연차별 시행계획은 해마다 수립한다. 지역 실정에 맞추어 아래에서 위로 올라가는 방식으로 세우며, 수립 과정에서 주민의 의견을 듣는다."},
{"id":"c37","subj":"지역사회간호","unit":"보건행정","q":"보건진료 전담공무원에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 따라 보건지소에 배치된다","도시 지역의 동마다 한 명씩 배치된다","의사의 지시가 있을 때에만 의료행위를 할 수 있다","간호사나 조산사 면허를 가지고 직무교육을 받은 사람이다"],"ans":3,"exp":"보건진료 전담공무원은 「농어촌 등 보건의료를 위한 특별조치법」에 따라 의료 취약 지역의 보건진료소에서 일하며, 간호사나 조산사 면허를 가진 사람이 정해진 직무교육을 받아야 한다. 법령이 정한 범위의 경미한 의료행위를 스스로 할 수 있다."},
{"id":"c38","subj":"지역사회간호","unit":"일차보건의료","q":"1978년 세계보건기구와 유니세프가 연 국제회의에서 \"2000년까지 모든 인류에게 건강을\"이라는 목표를 이루기 위한 전략으로 일차보건의료를 채택한 선언은?","opts":["알마아타 선언","오타와 헌장","방콕 헌장","리우 선언"],"ans":0,"exp":"1978년 알마아타 선언은 일차보건의료를 모든 인류의 건강을 실현하는 핵심 전략으로 채택하였다. 오타와 헌장(1986년)과 방콕 헌장(2005년)은 건강증진에 관한 국제회의의 결과물이고, 리우 선언(1992년)은 환경과 개발에 관한 선언이다."},
{"id":"c39","subj":"지역사회간호","unit":"일차보건의료","q":"알마아타 선언에서 제시한 일차보건의료의 필수 사업 내용에 해당하지 않는 것은?","opts":["안전한 식수 공급과 기본 환경위생","가족계획을 포함한 모자보건","주요 감염병에 대한 예방접종","희귀 질환에 대한 고도의 전문 치료"],"ans":3,"exp":"일차보건의료의 필수 내용은 보건교육, 영양 개선, 안전한 물과 기본 환경위생, 모자보건과 가족계획, 예방접종, 풍토병 관리, 흔한 질병과 상해의 치료, 필수 의약품 공급이다. 고도의 전문 치료는 지역사회에서 쉽게 이용할 수 있는 기본 의료가 아니므로 포함되지 않는다."},
{"id":"c40","subj":"지역사회간호","unit":"질병 발생 모형","q":"질병 발생 모형 중 숙주를 원의 중심에 두고, 숙주의 유전적 소인과 그를 둘러싼 생물학적·물리화학적·사회적 환경의 상호작용으로 질병 발생을 설명하는 것은?","opts":["역학적 삼각형 모형","수레바퀴 모형","거미줄 모형","건강신념 모형"],"ans":1,"exp":"수레바퀴 모형은 유전적 소인을 가진 숙주가 중심에 있고 환경이 이를 둘러싼 모양으로, 질병에 따라 각 부분의 크기가 달라진다. 역학적 삼각형 모형은 병원체·숙주·환경의 균형으로, 거미줄 모형은 여러 요인이 얽힌 관계로 질병을 설명한다. 건강신념 모형은 건강 행위를 설명하는 이론이다."},
{"id":"c41","subj":"지역사회간호","unit":"역학 지표","q":"어떤 감염병에 대한 자료가 다음과 같다. 이 감염병의 독력은?\n\n감염자: 100명\n감염자 가운데 증상이 나타난 사람(현성 감염자): 40명\n현성 감염자 가운데 중증 환자(사망자 제외): 8명\n현성 감염자 가운데 사망자: 2명","opts":["5%","10%","25%","40%"],"ans":2,"exp":"독력은 현성 감염자 가운데 중증 환자와 사망자가 차지하는 비율이다. (8 + 2) ÷ 40 × 100 = 25%. 40%는 감염자 중 현성 감염자의 비율인 병원력이고, 5%는 현성 감염자 중 사망자의 비율인 치명률이다."},
{"id":"c42","subj":"지역사회간호","unit":"역학 지표","q":"어떤 만성질환의 발생률은 변하지 않았는데 유병률이 높아졌다. 그 이유로 가장 알맞은 것은?","opts":["치료법이 발달하여 환자의 생존 기간이 길어졌다","치명률이 높아져 환자가 일찍 사망하였다","완치율이 높아져 앓는 기간이 짧아졌다","환자가 다른 지역으로 많이 옮겨 갔다"],"ans":0,"exp":"유병률은 대략 발생률에 이환 기간을 곱한 값이다. 발생률이 같아도 완치되지 않은 채 생존 기간이 길어지면 이환 기간이 늘어 유병률이 높아진다. 일찍 사망하거나 빨리 완치되거나 환자가 전출하면 유병률은 오히려 낮아진다."},
{"id":"c43","subj":"지역사회간호","unit":"역학 지표","q":"주민이 5,100명인 지역을 1년간 조사한 결과가 다음과 같다. 이 질병의 연간 발생률은? (단, 이 질병은 한 번 걸리면 완치되지 않고 다시 걸리지 않으며, 인구 이동과 사망은 없다.)\n\n연초에 이미 이 질병을 앓고 있던 사람: 100명\n1년 동안 새로 발생한 환자: 50명","opts":["인구 1,000명당 10명","인구 1,000명당 20명","인구 1,000명당 30명","인구 1,000명당 50명"],"ans":0,"exp":"발생률의 분모는 그 질병에 걸릴 위험이 있는 사람이므로 이미 앓고 있는 100명을 뺀다. 50 ÷ (5,100 − 100) × 1,000 = 인구 1,000명당 10명이다. 기존 환자까지 분자에 넣으면 150 ÷ 5,000 × 1,000 = 30으로 잘못 계산하게 된다."},
{"id":"c44","subj":"지역사회간호","unit":"역학 지표","q":"폐암과 흡연의 관계를 알아본 환자-대조군 연구의 결과가 다음과 같다. 교차비는?\n\n폐암 환자 100명: 흡연자 60명, 비흡연자 40명\n대조군 100명: 흡연자 30명, 비흡연자 70명","opts":["1.5","2","3.5","4.5"],"ans":2,"exp":"교차비는 환자군의 노출 대 비노출 비를 대조군의 노출 대 비노출 비로 나눈 값이다. (60 ÷ 40) ÷ (30 ÷ 70) = (60 × 70) ÷ (40 × 30) = 4,200 ÷ 1,200 = 3.5. 두 군의 흡연자 비율을 그대로 나눈 60 ÷ 30 = 2는 교차비가 아니다."},
{"id":"c45","subj":"지역사회간호","unit":"역학 연구","q":"발생률이 매우 낮은 희귀 질환의 위험 요인을 비교적 짧은 기간에 적은 비용으로 밝히려 할 때 가장 알맞은 연구 방법은?","opts":["단면조사 연구","실험 연구","코호트 연구","환자-대조군 연구"],"ans":3,"exp":"환자-대조군 연구는 이미 발생한 환자를 모아 과거의 노출을 조사하므로 희귀 질환이나 잠복기가 긴 질환을 적은 대상자로 빠르게 연구할 수 있다. 코호트 연구는 희귀 질환이면 매우 많은 대상자를 오래 추적해야 하고, 단면조사 연구는 원인과 결과의 선후 관계를 밝히기 어렵다."},
{"id":"c46","subj":"지역사회간호","unit":"역학 지표","q":"1,000명에게 선별검사를 한 결과가 다음과 같다. 이 검사의 양성예측도는?\n\n실제 환자 100명: 검사 양성 90명, 검사 음성 10명\n환자가 아닌 사람 900명: 검사 양성 90명, 검사 음성 810명","opts":["10%","50%","90%","약 99%"],"ans":1,"exp":"양성예측도는 검사 양성인 사람 가운데 실제 환자의 비율이다. 90 ÷ (90 + 90) × 100 = 50%. 90%는 민감도(90 ÷ 100)이자 특이도(810 ÷ 900)이고, 약 99%는 음성예측도(810 ÷ 820)이다."},
{"id":"c47","subj":"지역사회간호","unit":"역학 지표","q":"민감도와 특이도가 같은 선별검사를 유병률이 더 높은 집단에 적용할 때 나타나는 변화는?","opts":["양성예측도가 높아진다","음성예측도가 높아진다","민감도가 높아진다","특이도가 높아진다"],"ans":0,"exp":"유병률이 높아지면 검사 양성자 가운데 진짜 환자의 몫이 커져 양성예측도가 높아지고, 음성예측도는 낮아진다. 민감도와 특이도는 검사 자체의 성질이어서 유병률에 따라 달라지지 않는다."},
{"id":"c48","subj":"지역사회간호","unit":"감염병 관리","q":"기초감염재생산수(R0)가 5인 감염병의 유행을 막으려면 인구의 최소 몇 %가 면역을 가져야 하는가? (단, 집단면역 한계 밀도 = 1 − 1/R0 로 구한다.)","opts":["20%","50%","75%","80%"],"ans":3,"exp":"집단면역 한계 밀도는 1 − 1/R0 이다. 1 − 1/5 = 0.8 이므로 인구의 80% 이상이 면역을 가져야 유행이 일어나지 않는다. 20%는 면역이 없어도 되는 사람의 비율(1/R0)이다."},
{"id":"c49","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 의료기관의 장이 제2급감염병 환자의 발생을 보고받았을 때 관할 보건소장 등에게 신고해야 하는 시기는?","opts":["즉시","24시간 이내","3일 이내","7일 이내"],"ans":1,"exp":"제1급감염병은 즉시, 제2급과 제3급감염병은 24시간 이내, 제4급감염병은 7일 이내에 신고한다. 급수는 법령 개정으로 바뀔 수 있으나 급별 신고 시기의 틀은 이와 같다."},
{"id":"c50","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 제3급감염병에 해당하는 것은?","opts":["파상풍","홍역","디프테리아","인플루엔자"],"ans":0,"exp":"파상풍은 발생을 계속 감시할 필요가 있어 24시간 이내에 신고하는 제3급감염병이다. 홍역은 제2급, 디프테리아는 제1급, 인플루엔자는 표본감시 대상인 제4급감염병이다. 감염병 분류는 개정될 수 있으니 시험 전에 현행 법령을 확인한다."},
{"id":"c51","subj":"지역사회간호","unit":"감염병 관리","q":"B형간염 표면항원 양성인 산모에게서 태어난 신생아에게 출생 직후 B형간염 면역글로불린을 주사하였다. 이 면역글로불린으로 얻는 면역은?","opts":["자연능동면역","자연수동면역","인공능동면역","인공수동면역"],"ans":3,"exp":"다른 사람이나 동물이 만든 항체를 주사로 받아 얻는 면역은 인공수동면역으로, 효과가 빨리 나타나지만 오래가지 않는다. 백신 접종으로 얻는 면역은 인공능동면역, 태반이나 모유로 받는 면역은 자연수동면역, 감염된 뒤 얻는 면역은 자연능동면역이다."},
{"id":"c52","subj":"지역사회간호","unit":"감염병 관리","q":"약독화 생백신에 해당하는 것은?","opts":["DTaP 백신","MMR 백신","B형간염 백신","주사용 폴리오 백신(IPV)"],"ans":1,"exp":"MMR(홍역·유행성이하선염·풍진) 백신은 살아 있는 병원체의 독성을 약하게 만든 생백신이다. DTaP는 톡소이드와 불활성화 성분으로 만든 백신이고, B형간염 백신은 유전자 재조합 백신이며, 주사용 폴리오 백신은 불활성화 백신이다."},
{"id":"c53","subj":"지역사회간호","unit":"감염병 관리","q":"감염되었으나 처음부터 끝까지 증상이 없으면서 병원체를 배출하여 감염병 관리에서 가장 어려운 대상이 되는 사람은?","opts":["건강 보균자","잠복기 보균자","회복기 보균자","현성 감염자"],"ans":0,"exp":"건강 보균자는 증상이 전혀 없어 본인도 주위에서도 감염 사실을 모른 채 활동하므로 관리가 가장 어렵다. 잠복기 보균자는 증상이 나타나기 전에, 회복기 보균자는 증상이 사라진 뒤에 병원체를 배출하는 사람이다."},
{"id":"c54","subj":"지역사회간호","unit":"감염병 관리","q":"한 초등학교에서 급식을 먹은 다음 날 설사 환자가 한꺼번에 발생하였다. 환자 발생 곡선을 그려 보니 봉우리가 하나이고, 환자가 급격히 늘었다가 빠르게 줄어 모든 환자가 한 번의 잠복기 범위 안에 발생하였다. 이 유행의 양상은?","opts":["사람 간 전파에 의한 연쇄 유행","공통 감염원 지속 노출 유행","주기적으로 반복되는 계절 유행","공통 감염원 단일 노출 유행"],"ans":3,"exp":"같은 감염원에 한 번 함께 노출되면 환자가 짧은 기간에 몰려 발생하여 봉우리가 하나인 곡선이 된다. 지속 노출이면 봉우리가 뚜렷하지 않고 오래 이어지며, 사람 간 전파이면 봉우리가 여러 개 생기면서 유행 기간이 길어진다."},
{"id":"c55","subj":"지역사회간호","unit":"역학 지표","q":"A 사업장 근로자의 사망 수준을 표준 인구와 비교하려 한다. 표준화사망비(SMR)는?\n\nA 사업장에서 실제로 관찰된 사망자 수: 30명\n표준 인구의 연령별 사망률을 A 사업장 인구에 적용해 구한 기대 사망자 수: 20명","opts":["0.67","1.5","2","10"],"ans":1,"exp":"표준화사망비는 관찰 사망자 수를 기대 사망자 수로 나눈 값이다. 30 ÷ 20 = 1.5. 1보다 크므로 A 사업장의 사망 수준이 표준 인구보다 높다는 뜻이다. 연령별 사망률을 알 수 없거나 인구가 적을 때 쓰는 간접 표준화법의 지표이다."},
{"id":"c56","subj":"지역사회간호","unit":"건강증진","q":"오타와 헌장의 건강증진 5대 활동 전략 중 다음 사례에 해당하는 것은?\n\n공공장소를 금연구역으로 지정하는 법을 만들고 담배에 건강증진부담금을 매겼다.","opts":["건강한 공공정책 수립","개인의 기술 개발","지역사회 활동 강화","보건의료서비스의 방향 재설정"],"ans":0,"exp":"법률, 조세, 규제 등으로 건강에 이로운 선택을 쉽게 만드는 것은 건강한 공공정책 수립이다. 개인의 기술 개발은 보건교육으로 개인의 역량을 키우는 것, 지역사회 활동 강화는 주민 참여와 조직화, 보건의료서비스의 방향 재설정은 치료 중심에서 예방과 건강증진 중심으로 바꾸는 것이다."},
{"id":"c57","subj":"지역사회간호","unit":"건강증진","q":"국민건강증진종합계획(Health Plan 2030)의 총괄 목표 두 가지는?","opts":["평균수명 연장과 의료비 절감","건강수명 연장과 건강형평성 제고","질병 사망률 감소와 의료 접근성 향상","출산율 제고와 노인 부양 부담 완화"],"ans":1,"exp":"제5차 국민건강증진종합계획(2021~2030년)은 \"모든 사람이 평생 건강을 누리는 사회\"를 비전으로 하고, 건강수명 연장과 건강형평성 제고를 총괄 목표로 한다. 2026년 3월에 확정된 제6차 계획(2026~2030년)도 이 비전과 총괄 목표를 그대로 이어 간다. 단순히 오래 사는 평균수명이 아니라 건강하게 사는 기간과 집단 간 건강 격차 해소에 초점을 둔다."},
{"id":"c58","subj":"지역사회간호","unit":"건강증진","q":"「국민건강증진법」상 국민건강증진종합계획에 대한 설명으로 옳은 것은?","opts":["질병관리청장이 3년마다 수립한다","시·도지사가 4년마다 수립한다","국민건강보험공단 이사장이 해마다 수립한다","보건복지부장관이 5년마다 수립한다"],"ans":3,"exp":"국민건강증진종합계획은 보건복지부장관이 국민건강증진정책심의위원회의 심의를 거쳐 5년마다 수립한다. 4년마다 수립하는 것은 「지역보건법」의 지역보건의료계획으로, 시·도지사와 시장·군수·구청장이 세운다."},
{"id":"c59","subj":"지역사회간호","unit":"건강행위 이론","q":"건강신념모형의 구성 개념 중 다음 사례에 해당하는 것은?\n\n50세 여성이 유방암 검진이 필요하다고 생각하면서도 \"검사가 아프고 병원에 갈 시간도 없다\"며 검진을 미루고 있다.","opts":["지각된 민감성","지각된 심각성","지각된 유익성","지각된 장애성"],"ans":3,"exp":"지각된 장애성은 건강 행위를 하는 데 드는 비용, 불편, 통증, 시간 같은 부정적 측면에 대한 인식이다. 지각된 민감성은 자신이 병에 걸릴 가능성, 심각성은 병에 걸렸을 때 결과가 얼마나 나쁜지, 유익성은 행위를 하면 얻는 이득에 대한 인식이다."},
{"id":"c60","subj":"지역사회간호","unit":"건강행위 이론","q":"범이론적 모형의 변화 과정 중 다음 사례에 해당하는 것은?\n\n금연을 시작한 대상자가 집 안의 재떨이와 라이터를 모두 치우고, 담배를 피우게 되는 술자리를 피한다.","opts":["의식 고양","자극 통제","자기 재평가","사회적 해방"],"ans":1,"exp":"자극 통제는 문제 행동을 일으키는 자극을 없애거나 피하는 과정이다. 의식 고양은 문제에 대한 정보를 찾고 이해를 높이는 것, 자기 재평가는 문제 행동과 관련하여 자기 자신을 다시 평가하는 것, 사회적 해방은 사회가 건강한 행동을 지지하는 쪽으로 바뀌고 있음을 알아차리는 것이다."},
{"id":"c61","subj":"지역사회간호","unit":"건강행위 이론","q":"PRECEDE-PROCEED 모형의 교육·생태학적 진단에서 다음은 어떤 요인에 해당하는가?\n\n보건소 금연클리닉이 집에서 멀고 운영 시간이 근무 시간과 겹쳐 이용하기 어렵다.","opts":["촉진 요인(가능 요인)","강화 요인","성향 요인(소인 요인)","유전 요인"],"ans":0,"exp":"촉진 요인은 행위를 할 수 있게 하거나 가로막는 자원의 이용 가능성, 접근성, 기술 등이다. 성향 요인은 지식·태도·신념처럼 행위에 앞서 동기를 주는 요인이고, 강화 요인은 행위 뒤에 가족이나 동료에게서 받는 칭찬이나 보상 같은 요인이다."},
{"id":"c62","subj":"지역사회간호","unit":"건강행위 이론","q":"계획된 행위이론이 합리적 행위이론에 새로 더한 개념은?","opts":["행위에 대한 태도","주관적 규범","지각된 행위 통제","행위 의도"],"ans":2,"exp":"합리적 행위이론은 행위에 대한 태도와 주관적 규범이 행위 의도를 결정하고 의도가 행위로 이어진다고 본다. 계획된 행위이론은 여기에, 그 행위를 하기가 얼마나 쉽거나 어렵다고 느끼는지를 뜻하는 지각된 행위 통제를 더하였다."},
{"id":"c63","subj":"지역사회간호","unit":"보건교육 이론","q":"보건교사가 다음과 같이 교육하였다. 바탕이 된 학습 이론은?\n\n손 씻기를 실천한 학생에게 그때마다 칭찬 스티커를 주고, 스티커를 10장 모으면 상품을 주어 행동이 되풀이되게 하였다.","opts":["인지주의 학습이론","행동주의 학습이론","인본주의 학습이론","구성주의 학습이론"],"ans":1,"exp":"행동주의는 학습을 자극과 반응의 연결로 보고, 바람직한 행동에 보상(강화)을 주어 행동이 반복되게 한다. 인지주의는 학습자 내부의 사고 과정을, 인본주의는 학습자의 자발성과 자아실현을, 구성주의는 학습자가 경험으로 지식을 스스로 만들어 가는 것을 강조한다."},
{"id":"c64","subj":"지역사회간호","unit":"보건교육","q":"다음 학습 목표가 속하는 영역은?\n\n대상자는 인슐린 자가 주사를 정확한 순서에 따라 스스로 시행할 수 있다.","opts":["인지적 영역","정의적 영역","심리운동 영역","사회적 영역"],"ans":2,"exp":"심리운동 영역은 신체를 움직여 기술을 수행하는 능력에 관한 목표이다. 인지적 영역은 지식과 이해, 정의적 영역은 태도·가치·흥미에 관한 목표이다. 블룸의 학습 목표 분류에 사회적 영역은 없다."},
{"id":"c65","subj":"지역사회간호","unit":"보건교육","q":"한 가지 주제에 대해 전문가 2~5명이 저마다 다른 측면에서 준비한 내용을 차례로 발표한 다음, 사회자의 진행으로 청중과 질의응답을 하는 교육 방법은?","opts":["분단 토의","패널 토의","브레인스토밍","심포지엄"],"ans":3,"exp":"심포지엄은 전문가들이 각자 맡은 부분을 발표하고 이어서 청중과 질의응답을 한다. 패널 토의는 전문가 몇 명이 청중 앞에서 서로 의견을 주고받으며 토의하는 것이고, 분단 토의는 참가자를 소집단으로 나누어 토의한 뒤 전체가 모여 종합하는 것이다."},
{"id":"c66","subj":"지역사회간호","unit":"보건교육","q":"보건소 간호사가 처음 아기를 낳은 산모들에게 신생아 목욕시키는 방법을 가르치려 한다. 기술을 익히게 하는 데 가장 효과적인 교육 방법은?","opts":["강의","심포지엄","집단 토의","시범"],"ans":3,"exp":"시범은 교육자가 실제 동작을 보여 주고 학습자가 따라 해 보게 하는 방법으로, 기술을 익히는 심리운동 영역의 교육에 가장 알맞다. 강의와 심포지엄은 지식 전달에, 집단 토의는 의견 교환과 태도 변화에 알맞다."},
{"id":"c67","subj":"지역사회간호","unit":"보건교육","q":"보건교육 평가 중 교육이 진행되는 동안 학습자의 이해 정도를 확인하여 교육 내용과 방법을 고쳐 나가는 데 쓰는 것은?","opts":["진단평가","형성평가","총괄평가","상대평가"],"ans":1,"exp":"형성평가는 교육 도중에 실시하여 학습의 진행 정도를 확인하고 교육을 개선하는 평가이다. 진단평가는 교육 전에 학습자의 지식 수준과 준비도를 알아보는 평가이고, 총괄평가는 교육이 끝난 뒤 목표 달성 정도를 판단하는 평가이다. 상대평가는 평가 시기가 아니라 평가 기준에 따른 분류이다."},
{"id":"c68","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족 발달 단계 중 첫 자녀가 집을 떠나기 시작하여 막내 자녀가 집을 떠날 때까지의 시기는?","opts":["진수기 가족","청소년기 가족","중년기 가족","노년기 가족"],"ans":0,"exp":"진수기 가족은 자녀들이 독립하여 집을 떠나는 시기로, 자녀의 독립을 돕고 부부 관계를 다시 조정하는 것이 발달 과업이다. 청소년기 가족은 첫 자녀가 13~19세인 시기이고, 중년기 가족은 자녀가 모두 떠난 뒤부터 은퇴까지, 노년기 가족은 은퇴 뒤부터 사망까지이다."},
{"id":"c69","subj":"지역사회간호","unit":"가족간호","q":"가족을 서로 상호작용하는 인격체들의 단위로 보고, 구성원이 상황에 부여하는 의미와 역할 기대 같은 가족 내부의 과정에 초점을 두는 가족 이론은?","opts":["구조기능 이론","가족체계 이론","가족발달 이론","상징적 상호작용 이론"],"ans":3,"exp":"상징적 상호작용 이론은 가족 구성원 개인이 상황을 어떻게 해석하고 서로 어떤 역할을 기대하며 상호작용하는지에 초점을 둔다. 구조기능 이론은 가족 구조와 사회 속 기능을, 가족체계 이론은 가족을 하나의 열린 체계로, 가족발달 이론은 생활 주기에 따른 발달 과업을 중심으로 본다."},
{"id":"c70","subj":"지역사회간호","unit":"가족간호","q":"취약 가족의 분류 중 구조적 취약 가족에 해당하는 것은?","opts":["만성질환자 가족","한부모 가족","학대 가족","미숙아 가족"],"ans":1,"exp":"구조적 취약 가족은 가족 구조에 결손이 있는 가족으로 한부모 가족, 이혼 가족, 조손 가족, 독거 가구 등이 해당한다. 만성질환자 가족은 기능적 취약 가족, 학대 가족은 상호작용 취약 가족, 미숙아 가족은 발달 단계의 취약 가족이다."},
{"id":"c71","subj":"지역사회간호","unit":"가족간호","q":"가족 간호사정의 원칙으로 옳지 않은 것은?","opts":["가족의 문제뿐 아니라 강점도 함께 사정한다","가족 구성원 개인보다 가족 전체에 초점을 둔다","자료는 건강 문제가 있는 구성원 한 사람에게서만 수집한다","사정 과정에 가족이 참여하도록 한다"],"ans":2,"exp":"가족 사정에서는 한 사람의 말에만 기대지 않고 여러 구성원과 여러 방법으로 자료를 모아 서로 확인해야 한다. 강점까지 사정하고, 가족 전체에 초점을 두며, 가족이 사정에 참여하게 하는 것은 모두 옳은 원칙이다."},
{"id":"c72","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법 시행령」에서 정한 보건교사의 직무에 해당하지 않는 것은?","opts":["학교보건계획의 수립","학교 환경위생의 유지·관리 및 개선에 관한 사항","각종 질병의 예방 처치와 보건지도","학교에서 쓰는 의약품과 독극물의 실험·검사"],"ans":3,"exp":"학교에서 쓰는 의약품과 독극물의 실험·검사는 학교약사의 직무이다. 보건교사는 학교보건계획 수립, 환경위생 관리, 보건지도, 건강 관찰과 상담, 응급 처치와 그에 따르는 의약품 투여 등을 맡는다."},
{"id":"c73","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법」상 감염병에 감염되었거나 감염된 것으로 의심되는 학생의 등교를 중지시킬 수 있는 사람은?","opts":["학교의 장","보건교사","교육감","관할 보건소장"],"ans":0,"exp":"등교 중지는 학교의 장이 명할 수 있다. 보건교사는 감염병 발생을 확인하고 학교의 장에게 알려 조치를 돕는 역할을 하며, 등교 중지를 직접 명하는 주체는 아니다."},
{"id":"c74","subj":"지역사회간호","unit":"학교보건","q":"「교육환경 보호에 관한 법률」상 이미 설립된 학교의 절대보호구역 범위는?","opts":["학교 경계로부터 직선거리 50미터까지","학교 출입문으로부터 직선거리 50미터까지","학교 출입문으로부터 직선거리 200미터까지","학교 경계로부터 직선거리 300미터까지"],"ans":1,"exp":"절대보호구역은 학교 출입문으로부터 직선거리 50미터까지인 지역이다. 상대보호구역은 학교 경계로부터 직선거리 200미터까지인 지역 가운데 절대보호구역을 뺀 지역이다. 교육환경보호구역은 교육감이 설정하여 고시한다."},
{"id":"c75","subj":"지역사회간호","unit":"학교보건","q":"수두에 걸린 초등학생의 등교 중지 기간으로 옳은 것은?","opts":["열이 내린 뒤 24시간이 지날 때까지","발진이 나타난 뒤 4일까지","모든 수포에 딱지가 앉을 때까지","항생제 치료를 시작한 뒤 5일까지"],"ans":2,"exp":"수두는 수포가 생기기 직전부터 모든 수포에 딱지(가피)가 앉을 때까지 전염력이 있으므로 그때까지 등교를 중지한다. 발진이 나타난 뒤 4일까지는 홍역, 적절한 항생제 치료를 시작한 뒤 5일까지는 백일해의 격리 기준이다."},
{"id":"c76","subj":"지역사회간호","unit":"산업보건","q":"작업환경 관리의 기본 원칙 중 다음 사례에 해당하는 것은?\n\n소음이 심한 기계를 별도의 방에 설치하고, 근로자는 방 밖의 조작실에서 원격으로 기계를 조작한다.","opts":["대치","환기","격리","교육"],"ans":2,"exp":"격리는 근로자와 유해 인자 사이를 벽이나 거리로 떼어 놓는 것으로, 원격 조작과 방호벽 설치가 해당한다. 대치는 유해한 물질·공정·시설을 덜 해로운 것으로 바꾸는 것이고, 환기는 오염된 공기를 빼내거나 묽게 하는 것이다."},
{"id":"c77","subj":"지역사회간호","unit":"산업보건","q":"산업안전보건법령상 다음 근로자에게 실시하는 건강진단은?\n\n특수건강진단 대상 업무에 종사하는 근로자가 그 업무의 유해 인자 때문으로 의심되는 직업성 천식 증상을 호소하여, 정기 검진 시기와 관계없이 건강진단을 한다.","opts":["수시건강진단","임시건강진단","배치전건강진단","일반건강진단"],"ans":0,"exp":"수시건강진단은 특수건강진단 대상 업무로 직업성 천식이나 피부염 같은 건강 장해가 의심되는 증상을 보이는 근로자에게 주기와 관계없이 실시한다. 임시건강진단은 같은 부서에서 비슷한 증상이 여럿 생기는 등의 경우에 지방고용노동관서의 장의 명령으로 실시하고, 배치전건강진단은 해당 업무에 배치하기 전에 실시한다."},
{"id":"c78","subj":"지역사회간호","unit":"산업보건","q":"크롬 도금 작업을 오래 한 근로자에게 나타나는 특징적인 건강 장해는?","opts":["손목 처짐(신근 마비)","이타이이타이병","재생불량성 빈혈","비중격 천공"],"ans":3,"exp":"크롬은 코 점막을 헐게 하여 비중격에 구멍이 뚫리는 비중격 천공을 일으킨다. 손목 처짐은 납 중독, 이타이이타이병은 카드뮴 중독, 재생불량성 빈혈 같은 조혈 기능 장해는 벤젠 중독의 특징이다."},
{"id":"c79","subj":"지역사회간호","unit":"산업보건","q":"용광로 앞에서 일하며 땀을 많이 흘리고 물만 마신 근로자가 팔다리 근육에 통증이 따르는 경련을 일으켰다. 체온은 정상이고 의식은 또렷하다. 이 열중증과 우선 처치로 옳은 것은?","opts":["열사병: 얼음물에 담가 체온을 빠르게 내린다","열경련: 생리식염수 등으로 수분과 염분을 보충한다","열피로: 머리를 높게 하고 따뜻하게 보온한다","열쇠약: 고농도 산소를 공급한다"],"ans":1,"exp":"열경련은 땀으로 염분을 많이 잃은 상태에서 물만 마셔 생기는 근육 경련으로, 체온과 의식은 정상이며 수분과 염분을 함께 보충한다. 열사병은 체온 조절 중추의 장해로 체온이 매우 높고 의식 장해가 있어 체온을 급히 내려야 하므로 이 사례와 맞지 않는다."},
{"id":"c80","subj":"지역사회간호","unit":"산업보건","q":"어느 사업장의 1년간 자료가 다음과 같다. 강도율은?\n\n연 근로시간 수: 1,000,000시간\n재해 건수: 5건\n근로 손실 일수: 400일","opts":["0.4","5","80","400"],"ans":0,"exp":"강도율은 근로 손실 일수를 연 근로시간 수로 나누고 1,000을 곱한 값으로, 재해의 심한 정도를 나타낸다. 400 ÷ 1,000,000 × 1,000 = 0.4. 5는 재해 건수 ÷ 연 근로시간 수 × 1,000,000 으로 구한 도수율이고, 80은 재해 1건당 평균 손실 일수이다."},
{"id":"c81","subj":"지역사회간호","unit":"환경보건","q":"대기오염 물질이 흩어지지 못하고 지표면 가까이에 쌓여 스모그 피해가 커지는 기상 현상으로, 상층의 기온이 하층보다 높은 상태는?","opts":["열섬 현상","기온역전","엘니뇨","온실효과"],"ans":1,"exp":"보통은 위로 올라갈수록 기온이 낮아져 공기가 위아래로 섞이지만, 기온역전이 생기면 대기가 안정되어 오염 물질이 확산되지 못한다. 열섬 현상은 도심의 기온이 주변보다 높은 현상이고, 온실효과는 온실가스가 지구 복사열을 붙잡아 기온이 오르는 현상이다."},
{"id":"c82","subj":"지역사회간호","unit":"환경보건","q":"대기 중에서 질소산화물과 탄화수소가 자외선을 받아 광화학 반응을 일으켜 만들어지는 2차 오염 물질은?","opts":["일산화탄소","아황산가스","납","오존"],"ans":3,"exp":"오존은 배출원에서 바로 나오지 않고 질소산화물과 탄화수소가 햇빛과 반응하여 생기는 대표적인 2차 오염 물질이다. 일산화탄소, 아황산가스, 납은 배출원에서 직접 나오는 1차 오염 물질이다."},
{"id":"c83","subj":"지역사회간호","unit":"환경보건","q":"수질 오염 지표에 대한 설명으로 옳은 것은?","opts":["용존산소량(DO)이 높을수록 오염이 심한 물이다","수온이 높을수록 용존산소량이 늘어난다","생물화학적 산소요구량(BOD)이 높을수록 유기물 오염이 심하다","BOD가 높은 물은 DO도 함께 높다"],"ans":2,"exp":"BOD는 미생물이 물속 유기물을 분해하는 데 쓰는 산소의 양이므로 높을수록 유기물이 많은 오염된 물이다. DO는 물에 녹아 있는 산소의 양으로 높을수록 깨끗하며, 수온이 높거나 BOD가 높으면 DO는 낮아진다."},
{"id":"c84","subj":"지역사회간호","unit":"환경보건","q":"오존층 파괴 물질인 염화불화탄소(CFCs) 등의 생산과 사용을 규제하려고 맺은 국제 협약은?","opts":["몬트리올 의정서","교토 의정서","바젤 협약","람사르 협약"],"ans":0,"exp":"몬트리올 의정서는 오존층 파괴 물질의 생산과 사용을 규제한다. 교토 의정서는 온실가스 감축, 바젤 협약은 유해 폐기물의 국가 간 이동 규제, 람사르 협약은 습지 보전에 관한 협약이다."},
