{"id":"e83","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nNurses on night shifts must stay alert at hours when the body expects to sleep, and tiredness at such times can lead to errors. Hospitals that have looked into the problem report that short, planned naps are surprisingly effective. A nap of about twenty minutes during a break can restore attention for several hours, whereas a much longer nap may leave a person feeling heavy and slow on waking. Bright lighting in work areas and a light meal instead of a heavy one also help. So does a schedule that avoids too many night shifts in a row and allows enough time to recover between them. Telling tired staff simply to try harder, by contrast, achieves little. These findings suggest that fatigue on the night shift is not just a matter of willpower; it can be ______.","opts":["ignored by experienced nurses","cured with stronger medicine","managed through careful planning","blamed on individual workers"],"ans":2,"exp":"20분쯤의 계획된 낮잠, 밝은 조명, 가벼운 식사, 무리 없는 근무표가 야간 근무의 피로를 덜어 준다는 글이다. 피로는 의지력만의 문제가 아니라고 했으므로, 세심한 계획으로 관리할 수 있다는 말이 이어져야 한다. 더 노력하라고 말하는 것은 소용이 없다고 했으므로 개인 탓으로 돌린다는 선지는 글과 반대이고, 약 이야기는 없다."},
{"id":"e84","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWhen a new road is built to relieve traffic jams, drivers are usually pleased at first. Journeys that took an hour now take forty minutes. Within a few years, however, the new road is often as crowded as the old one. The reason is that easier driving encourages people to make trips they would not have made before, to move farther from their workplaces, and to give up buses and trains for their cars. Shops and housing also tend to spring up along the new route, bringing still more traffic. Economists call this \"induced demand.\" It explains why cities that keep adding roads rarely solve congestion: ______. For this reason, many planners now argue that money is better spent on public transportation and on bringing homes and workplaces closer together.","opts":["new roads cost too much to maintain","more road space attracts more cars","most drivers prefer the older roads","public transportation becomes faster"],"ans":1,"exp":"길이 넓어져 운전이 편해지면 사람들이 차를 더 많이 타게 되어 새 도로도 다시 막힌다는 \"유발 수요\"를 설명한 글이다. 따라서 도로가 늘면 차도 더 몰린다는 말이 알맞다. 유지비나 옛 도로에 대한 선호는 글에 나오지 않고, 대중교통은 빨라지는 것이 아니라 사람들이 버리는 것으로 나온다."},
{"id":"e85","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nHoneybees cannot speak, but they share information with remarkable precision. When a bee finds a rich patch of flowers, it returns to the hive and performs a dance on the comb, running in a straight line while shaking its body and then circling back to repeat the run. The direction of the straight run shows the direction of the flowers in relation to the sun, and the length of time it lasts indicates how far away they are. Other bees crowd around the dancer and follow its movements closely in the darkness of the hive. They also pick up the scent of the flowers that clings to its body. Then they fly out and are able to find the spot without ever having been there before. Through this dance, a single bee's discovery quickly becomes ______.","opts":["a secret kept from the other bees","a serious danger to the queen","a reason to leave the hive for good","knowledge shared by the whole hive"],"ans":3,"exp":"꿀벌은 춤으로 꽃이 있는 방향과 거리를 알리고, 다른 벌들이 그것을 따라 한 뒤 가 본 적 없는 그곳을 찾아간다는 글이다. 따라서 한 마리의 발견이 벌집 전체가 함께 아는 지식이 된다는 말이 알맞다. 첫 문장의 \"정보를 공유한다\"와도 이어진다."},
{"id":"e86","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMany offices have removed walls so that employees can work in one large open room. The idea is that people who can see one another will talk more and share ideas freely. Some studies, however, have found the opposite result. Surrounded by noise and aware of being watched, workers in open offices put on headphones and send messages instead of speaking. In the offices studied, face-to-face conversation actually decreased after the walls came down, while the number of emails and instant messages rose. People seem to need a certain amount of privacy before they feel free to speak openly, and when a room takes that privacy away, they build invisible walls of their own. An office designed to bring people together may, ironically, ______.","opts":["make them talk far too much","lower the cost of renting space","push them further apart","improve their concentration"],"ans":2,"exp":"벽을 없앤 사무실에서 오히려 직원들이 헤드폰을 쓰고 메시지로만 소통해 대면 대화가 줄었다는 글이다. ironically(역설적으로)로 보아 사람들을 모으려던 설계가 도리어 서로를 멀어지게 한다는 말이 알맞다. 말을 너무 많이 하게 한다는 선지는 글과 반대다."},
{"id":"e87","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nMost people think of dust as nothing more than a nuisance, something to be wiped from shelves and swept out of corners.\n\n(A) These tiny grains do not stay where they started. Strong winds lift them high into the air and can carry them across entire oceans, sometimes for thousands of kilometers.\n(B) Yet dust plays an important role in nature. Much of it consists of fine grains of minerals blown up from dry land such as deserts and empty lake beds.\n(C) When they finally settle after this long journey, the minerals they contain, such as iron and phosphorus, feed plants on land and tiny organisms in the sea. Dust from the Sahara, for example, is known to fertilize the rainforest of the Amazon.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":1,"exp":"먼지를 귀찮은 것으로만 여긴다는 주어진 글 뒤에, Yet으로 먼지의 중요한 역할을 꺼내는 (B)가 온다. (A)의 These tiny grains는 (B)의 광물 알갱이를 가리키고, (C)의 this long journey는 (A)에서 바람에 실려 바다를 건너는 이동을 가리키므로 (B)-(A)-(C)이다. (C)가 (A) 앞에 오면 \"이 긴 여행\"이 가리킬 내용이 없다."},
{"id":"e88","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nA patient arriving at an emergency room is not always treated in the order of arrival. Someone who came in an hour ago may still be sitting in the waiting area while a new arrival is taken straight in.\n\n(A) According to this level, those in the most serious condition, such as a person with chest pain or heavy bleeding, are seen immediately, while those with minor problems may wait for hours.\n(B) Sorting patients by urgency in this way may seem unfair to people who have waited a long time, but it saves lives by directing limited staff and equipment to where they are needed most.\n(C) Instead of following the order of arrival, a nurse first checks each patient's symptoms and vital signs, such as pulse and breathing, and assigns a level of urgency.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":3,"exp":"도착 순서대로 진료하지 않는다는 주어진 글 뒤에, 그 대신 간호사가 긴급도를 매긴다는 (C)가 온다. (A)의 this level은 (C)의 a level of urgency를 가리키고, (B)의 \"이렇게 긴급도에 따라 환자를 나누는 것\"은 (C)와 (A)의 내용 전체를 받아 평가하므로 마지막에 온다. (A)나 (B)가 먼저 오면 this level과 in this way가 가리킬 것이 없다."},
{"id":"e89","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nIn the 1840s, a young doctor working in a large hospital in Vienna noticed something puzzling about its two wards for women giving birth.\n\n(A) Looking for a difference between them, he realized that the doctors and students often came to the mothers straight from examining dead bodies, and he suspected that they were carrying something harmful on their hands.\n(B) Far more mothers died of fever in the ward where medical students were trained by doctors than in the ward run by midwives, although both belonged to the same hospital.\n(C) So he ordered them to wash their hands in a chlorine solution before seeing patients, and the death rate in their ward dropped sharply. Although many doctors of his day rejected his idea, hand washing is now the first rule of infection control.","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":0,"exp":"주어진 글의 \"이상한 점\"이 무엇인지 밝히는 (B)가 먼저 온다(의사 병동의 산모 사망이 훨씬 많음). 두 병동의 차이(a difference between them)를 찾다가 원인을 의사들의 손에서 짐작하는 (A)가 이어지고, 그래서(So) 손을 씻게 하자 사망률이 떨어졌다는 (C)가 결론이다. (C)의 So는 (A)의 추측이 앞에 있어야 성립한다."},
{"id":"e91","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nRecycling plastic is more complicated than most people imagine. Dropping a bottle into the right bin is only the beginning of a long and costly process that many items never complete.\n\n(A) Because the washing has to be done so thoroughly, a single dirty item, such as a container still greasy with food, can spoil a whole batch. This is why residents are asked to rinse containers before putting them out.\n(B) For one thing, there are many kinds of plastic, each with a different melting point, and they cannot simply be melted together into new material.\n(C) The collected items must therefore be sorted by type, partly by machine and partly by hand, and washed before processing, which takes a great deal of time and money.","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":1,"exp":"재활용이 복잡하다는 주어진 글 뒤에 첫 번째 이유(For one thing)로 플라스틱 종류가 많아 함께 녹일 수 없다는 (B)가 온다. 그래서(therefore) 종류별로 나누고 씻어야 한다는 (C)가 이어지고, (A)의 the washing은 (C)에서 말한 세척을 가리키므로 마지막에 온다."},
{"id":"e92","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nWalking is one of the easiest forms of exercise to begin, which is why doctors so often recommend it to people who have not been active for years. (A) It requires no special equipment other than a comfortable pair of shoes, and it can be done almost anywhere and at any time of day. (B) A brisk thirty-minute walk each day strengthens the heart, helps control weight, and puts far less strain on the knees than running does. (C) The price of running shoes has risen sharply in recent years because of higher material costs. (D) Walking also improves mood, since physical activity triggers the release of chemicals in the brain that reduce stress. Those who find thirty minutes too long can begin with ten and add a little each week, for what matters most is making the walk a daily habit.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"걷기는 시작하기 쉽고 심장, 체중, 기분에 좋다는 글이다. (C)는 신발이라는 낱말로 이어지는 듯하지만 운동화 가격이 올랐다는 내용이어서 걷기의 장점이라는 흐름에서 벗어난다. (A)는 준비물이 거의 필요 없다는 점, (B)와 (D)는 몸과 기분에 주는 효과를 말한다."},
{"id":"e93","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nMore and more government services are moving online. (A) Citizens can now obtain many certificates at home, at any hour, without visiting an office or waiting for it to open. (B) This saves travel time and shortens the lines for those who still need to come in person. (C) Some older residents, however, find the websites difficult to use, so offices keep staff available to assist them and offer classes on how to use the services. (D) Many young people today prefer shopping online to visiting stores, and delivery has become faster every year. People without a computer or a smartphone must not be forgotten either, which is why paper forms and telephone service are still provided. Making services digital while leaving no one behind remains the goal.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"행정 서비스의 온라인화가 주는 편리함과, 이용이 어려운 주민에 대한 배려를 다룬 글이다. (D)는 젊은 층의 온라인 쇼핑과 배송 이야기여서 행정 서비스와 관계가 없다. (C)는 however로 온라인 이용이 어려운 주민 문제를 꺼내고, 그 뒤의 문장이 either로 이를 이어받는다."},
{"id":"e94","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nBlood for transfusion cannot be manufactured; it can only come from volunteers who are willing to give it. (A) A person's blood type is determined by genes inherited from his or her parents, just as eye color is. (B) Because blood components can be stored for only a limited time, in some cases no more than a few days, hospitals need a steady supply throughout the year. (C) Supplies tend to fall during holidays and in winter, when fewer people come to donate, although accidents and operations do not stop. (D) For this reason, blood centers run special campaigns at these times to encourage donors, sending buses to schools, offices, and military bases. Giving blood takes about an hour in all, and the body replaces the lost fluid within a day or two.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"혈액은 헌혈로만 얻을 수 있고 오래 보관할 수 없어 꾸준한 공급이 필요하다는 글이다. (A)는 혈액형이 유전으로 정해진다는 내용이어서 헌혈과 혈액 수급이라는 흐름과 관계가 없다. (D)의 these times는 (C)의 연휴와 겨울을 가리킨다."},
{"id":"e95","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nNoise is often regarded as a mere annoyance, but a growing body of research indicates that it can harm health. (A) Studies have linked living near airports or busy roads with higher rates of high blood pressure and heart disease. (B) Airports have become important centers of trade as air travel has grown, and many cities compete to attract new routes. (C) Even when noise does not wake us, it can raise the level of stress hormones during sleep, so that the body never rests completely. (D) Children in noisy schools have also been reported to learn to read more slowly than those in quiet ones. In response, some cities now build sound barriers along highways, limit night flights, and require better windows in homes near busy roads. Quiet, it seems, is not a luxury but a part of public health.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"소음이 고혈압, 심장병, 스트레스 호르몬, 아이들의 학습에 나쁜 영향을 준다는 글이다. (B)는 공항이라는 낱말이 겹치지만 공항이 무역의 중심지가 되었다는 내용이어서 소음과 건강이라는 주제에서 벗어난다."},
{"id":"e96","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nReading aloud to young children brings benefits that last for years. (A) Many children's books are printed on thick paper so that they are not easily torn by small hands. (B) Children who are read to regularly hear many more words than those who are not, including words that rarely come up in everyday conversation, and their vocabulary grows faster. (C) They also learn to sit still and follow a story from beginning to end, a skill that helps them when they enter school. (D) Just as important, the shared time strengthens the bond between parent and child, since the child has the adult's full attention. Experts add that it is not necessary to read for long: ten or fifteen minutes at bedtime every night is worth more than an hour once a week.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"아이에게 책을 읽어 주면 어휘력, 집중해서 이야기를 따라가는 힘, 부모와의 유대가 자란다는 글이다. (A)는 어린이 책의 종이 두께에 관한 내용이어서 책 읽어 주기의 효과와 관계가 없다. (C)의 They는 (B)의 \"책을 읽어 주는 것을 듣는 아이들\"을 가리켜 (B)와 이어진다."},
{"id":"e97","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThat result was a forest floor piled high with dead branches and dry leaves, which small, regular fires would once have burned away.\n\nFor many decades, parks in the region put out every forest fire as quickly as possible. (A) Managers believed that fire only destroyed and that a healthy forest was one that never burned. (B) Over time, however, this policy produced an unexpected result. (C) When a fire finally did break out in a dry summer, this thick layer of fuel made it far larger and hotter than any natural fire, and even old trees that had survived many smaller fires were killed. (D) Having learned this lesson, managers today deliberately set small, controlled fires in cool, damp weather to clear away the fuel before it becomes dangerous. Some kinds of pine, they have also found, actually depend on occasional fire, because their cones stay tightly closed until the heat of a fire opens them and releases the seeds.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"주어진 문장은 불을 모두 끈 결과 마른 가지와 잎이 쌓였다는 내용이다. That result는 (B) 뒤 문장의 an unexpected result를 받아 그것을 구체적으로 풀어 주므로 그 문장보다 앞에 올 수 없고, (C) 뒤의 this thick layer of fuel이 바로 이 쌓인 가지와 잎을 가리키므로 (C)에 들어가야 한다."},
{"id":"e98","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nFor example, a nurse may notice that a patient is breathing a little faster than an hour ago.\n\nMachines in a modern hospital monitor patients around the clock, recording heart rate, blood pressure, and oxygen levels every few seconds. (A) Yet experienced nurses often detect trouble before any alarm sounds. (B) Such a small change may not be enough to trigger a monitor, which is set to react only when a figure crosses a fixed line, but it can be the first sign of a serious problem. (C) By reporting it early, the nurse gives doctors time to act before the patient's condition grows worse. (D) Some hospitals now encourage nurses to call for help on the strength of such concern alone, even when every number on the screen looks normal. Technology is valuable, but it cannot replace the trained eye of a person at the bedside.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장은 경험 많은 간호사가 경보보다 먼저 이상을 알아챈다는 말의 예(For example)이므로 그 문장 뒤인 (B)에 온다. 바로 뒤의 Such a small change가 \"호흡이 조금 빨라진 것\"을 가리킨다는 점도 단서다. (C)나 (D)에 넣으면 Such a small change와 it이 가리킬 내용이 앞에 없게 된다."},
{"id":"e99","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nIt continues to follow the time at home, so you feel sleepy at noon and wide awake at midnight.\n\nWhen you fly across several time zones, your body clock does not reset at once. (A) Fortunately, there are ways to help it adjust to the new schedule. (B) Light is the most powerful signal for resetting the clock, so spending time outdoors in daylight is especially useful during the first days after arrival. (C) Eating meals at local times and avoiding long daytime naps are also thought to help, since they tell the body when the day begins and ends. (D) Even so, most travelers need several days to recover completely, and the more time zones they have crossed, the longer it takes. Many people also find that flying east, which shortens the day, is harder on the body than flying west.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"주어진 문장의 It은 첫 문장의 your body clock을 가리키며, 체내 시계가 바로 맞춰지지 않는다는 말을 구체적으로 설명한다. 그 뒤에 Fortunately로 해결 방법이 이어지므로 (A)가 알맞다. (B) 이후는 모두 적응을 돕는 방법과 회복 기간이어서 증상을 말하는 문장이 들어갈 수 없다."},
{"id":"e100","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nUnlike the warning signs, this playful idea worked.\n\nA small town wanted to reduce litter in its central park, where wrappers and paper cups were left on the grass every weekend. (A) At first, officials put up signs warning that anyone caught littering would be fined. (B) Few people were ever caught, however, and the park remained as dirty as before. (C) Then the town tried a different approach: it painted bright green footprints on the ground leading to each trash can. (D) Within weeks, the amount of litter had fallen noticeably, without a single fine being issued. Children in particular enjoyed following the footprints, and their parents followed them. The experience suggests that people do not always need to be threatened into behaving well. Sometimes it is enough to make the right action easy to notice and a little bit fun.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장의 this playful idea는 쓰레기통으로 이어지는 초록 발자국을 그린 일을 가리키므로 그 내용이 나온 뒤인 (D)에 와야 한다. 효과가 있었다(worked)는 말 뒤에 쓰레기가 눈에 띄게 줄었다는 구체적인 결과가 이어진다. (C)에 넣으면 발자국 이야기가 아직 나오지 않아 this playful idea가 가리킬 것이 없다."},
{"id":"e101","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe pharmacist is so ______ that she checks every prescription twice and compares each label with the doctor's order before handing over any medicine.","opts":["meticulous","negligent","impulsive","generous"],"ans":0,"exp":"처방전을 두 번씩 확인하고 라벨을 의사의 지시와 하나하나 대조한다고 했으므로 \"꼼꼼한, 세심한\"(meticulous)이 알맞다. negligent(부주의한)와 impulsive(충동적인)는 반대되는 태도이고, generous(너그러운)는 확인하는 습관과 관계가 없다."},
{"id":"e103","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nOnce regarded mainly as a disease of middle and old age, type 2 diabetes is becoming increasingly ______ among young adults, largely because of poor diet and lack of exercise.","opts":["curable","scarce","harmless","prevalent"],"ans":3,"exp":"한때 주로 중년과 노년의 병으로 여겨졌지만(Once regarded ~) 나쁜 식습관과 운동 부족 때문에 젊은 성인 사이에서도 점점 \"널리 퍼지고\"(prevalent) 있다는 흐름이다. scarce(드문)는 반대 뜻이고, curable(치료할 수 있는)과 harmless(해롭지 않은)는 나쁜 식습관이라는 원인의 결과가 될 수 없다."},
{"id":"e107","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nTypewriters, which were once found in almost every office, became ______ within a few years after personal computers and printers became widely available.","opts":["essential","obsolete","popular","reliable"],"ans":1,"exp":"한때 거의 모든 사무실에 있던 타자기가 컴퓨터와 프린터가 보급된 뒤 어떻게 되었는지를 묻는다. 새 기계에 밀려 \"더는 쓰이지 않게 된, 구식의\"(obsolete)가 알맞다. essential(꼭 필요한), popular(인기 있는), reliable(믿을 만한)은 컴퓨터가 보급된 뒤의 타자기와 맞지 않는다."},
{"id":"e116","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWith so little rain this year and the reservoirs at their lowest levels in years, a water shortage seems ______ unless residents sharply reduce their daily consumption.","opts":["inevitable","unlikely","temporary","harmless"],"ans":0,"exp":"비가 거의 오지 않았고 저수지 수위도 매우 낮으므로, 주민들이 물 사용을 크게 줄이지 않는 한 물 부족은 \"피할 수 없어\"(inevitable) 보인다. unlikely(일어날 것 같지 않은)는 반대 뜻이고, temporary(일시적인)와 harmless(해롭지 않은)는 사용량을 줄이지 않으면 그렇다는 조건과 맞지 않는다."},
{"id":"e117","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThese two medicines should not be taken at the same time because they can ______ with each other and cause serious side effects such as dizziness.","opts":["negotiate","interact","agree","comply"],"ans":1,"exp":"두 약을 함께 먹으면 안 되는 이유이고 심각한 부작용이 생긴다고 했으므로 약이 서로 \"상호 작용하다\"(interact with)가 알맞다. negotiate(협상하다), agree(동의하다, 잘 맞다), comply(따르다)는 부작용의 원인이 되지 못한다."},
{"id":"e118","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nSince there was not ______ evidence to prove that he had been at the scene of the crime, the suspect was released after two days.","opts":["excessive","artificial","sufficient","generous"],"ans":2,"exp":"용의자가 풀려난 이유이므로 범행 현장에 있었음을 입증할 \"충분한\"(sufficient) 증거가 없었다는 뜻이다. excessive(지나친)는 증거가 지나치게 많지 않아서 풀려났다는 뜻이 되어 어색하고, artificial(인공의)과 generous(너그러운)는 증거를 꾸미는 말로 맞지 않는다."},
{"id":"e119","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe doctor told the worried parents that the rash was harmless and would ______ on its own within a few days without any special treatment.","opts":["spread","worsen","return","fade"],"ans":3,"exp":"발진이 해롭지 않고 특별한 치료 없이 며칠 안에 저절로 어떻게 된다는 말이므로 \"서서히 사라지다\"(fade)가 알맞다. spread(퍼지다)와 worsen(나빠지다)은 해롭지 않다는 말과 어긋나고, return(다시 나타나다)은 걱정하는 부모를 안심시키는 말이 되지 못한다."},
{"id":"e120","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThanks to the quick response of the local fire station, the firefighters managed to ______ the fire before it reached the nearby houses.","opts":["extinguish","ignite","conceal","neglect"],"ans":0,"exp":"소방관들이 불이 인근 주택에 닿기 전에 해낸 일이므로 불을 \"끄다\"(extinguish)가 알맞다. ignite(불을 붙이다)는 반대 뜻이고, conceal(숨기다)과 neglect(내버려 두다, 소홀히 하다)는 빠른 출동 덕분에 해낸 일이 될 수 없다."},
{"id":"e121","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nAlthough the new manager is strict about deadlines, she is quite ______ about working hours, allowing her staff to start any time between seven and ten in the morning.","opts":["rigid","flexible","curious","doubtful"],"ans":1,"exp":"마감에는 엄격하지만(Although) 근무 시간은 직원들이 7시에서 10시 사이 아무 때나 시작하게 해 준다고 했으므로 \"융통성 있는\"(flexible)이 알맞다. rigid(엄격한, 융통성 없는)는 반대 뜻이어서 Although의 대조와 맞지 않고, curious(궁금해하는)와 doubtful(의심스러워하는)은 출근 시간을 고르게 해 준다는 내용과 이어지지 않는다."},
{"id":"e122","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nTo encourage the use of renewable energy, the government offers a ______ to families who install solar panels, covering half of the installation cost.","opts":["penalty","tariff","subsidy","receipt"],"ans":2,"exp":"재생 에너지 사용을 장려하려고 정부가 설치비의 절반을 대 주는 것이므로 \"보조금\"(subsidy)이 알맞다. penalty(벌금)는 장려와 반대이고, tariff(관세)와 receipt(영수증)는 비용을 대 주는 돈이 아니다."},
{"id":"e135","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe city council (A) __has decided__ to build a new public library on the site of the old bus terminal. According to the plan, the three-story building will include a children's reading room and a quiet area (B) __where__ residents can study until late at night. The council will have the old terminal (C) __demolish__ this winter, and the new library is expected to open by the end of (D) __next year__. Until then, the mobile library will continue to visit each neighborhood twice a week.","opts":["(A) has decided","(B) where","(C) demolish","(D) next year"],"ans":2,"exp":"사역동사 have의 목적어 the old terminal은 \"철거되는\" 대상이므로 목적격 보어는 과거분사 demolished여야 한다(have + 목적어 + 과거분사). demolish는 목적어가 필요한 타동사인데 뒤에 목적어도 없다. (A)는 단수 주어 The city council에 맞춘 현재완료, (B)는 장소(a quiet area)를 선행사로 하고 뒤에 완전한 절이 오는 관계부사, (D)는 전치사 of 뒤의 명사구로 모두 옳다."},
{"id":"e136","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\n(A) __Walking__ along the river last Sunday, I saw a group of children (B) __playing__ soccer on the grass. They had made goals out of their backpacks and were arguing happily about the score. (C) __Their__ cheerful voices reminded me (D) __for__ my own childhood, when my friends and I used to play in the same park until it got dark. I sat down on a bench and watched them for a while, wishing that I could join the game.","opts":["(A) Walking","(B) playing","(C) Their","(D) for"],"ans":3,"exp":"\"remind A of B\"는 \"A에게 B를 떠올리게 하다\"라는 뜻이므로 for가 아니라 of를 써야 한다. (A)는 주어 I가 \"걷는\" 능동의 분사구문, (B)는 지각동사 saw의 목적격 보어로 쓰인 현재분사, (C)는 children을 받는 복수 소유격으로 모두 옳다."},
{"id":"e137","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThis medicine is commonly prescribed for patients with high blood pressure. (A) __Taken__ regularly at the same time each day, it (B) __lowers__ blood pressure (C) __effective__ and reduces the risk of heart disease. However, patients should avoid (D) __drinking__ alcohol while using it, because alcohol can make side effects such as dizziness worse. They should also tell their doctor about any other drugs they are taking and should never stop the treatment suddenly without medical advice.","opts":["(A) Taken","(B) lowers","(C) effective","(D) drinking"],"ans":2,"exp":"동사 lowers를 꾸미는 자리이므로 형용사 effective가 아니라 부사 effectively가 와야 한다. (A)는 약이 \"복용되는\" 것이므로 과거분사로 시작한 분사구문, (B)는 단수 주어 it에 맞춘 현재 동사, (D)는 avoid의 목적어인 동명사로 모두 옳다."},
{"id":"e138","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nLast January the temperature stayed below minus ten degrees for more than a week. It was (A) __such__ cold that the lake in the city park froze (B) __completely__ for the first time in twenty years. The city checked the thickness of the ice and then opened part of the lake to the public as a free skating rink. The children in the neighborhood, (C) __most__ of whom had never skated before, (D) __were__ excited to try, and the rink was crowded every afternoon.","opts":["(A) such","(B) completely","(C) most","(D) were"],"ans":0,"exp":"뒤에 명사 없이 형용사 cold만 있으므로 such가 아니라 so를 써서 \"so cold that ~\"으로 해야 한다. such는 \"such a cold day that\"처럼 명사가 있을 때 쓴다. (B)는 동사 froze를 꾸미는 부사, (C)는 \"most of whom\" 꼴의 대명사, (D)는 복수 주어 The children에 맞춘 동사로 모두 옳다."},
{"id":"e139","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nJiwon's team spent three months preparing for the national nursing skills competition, practicing every evening after their regular shifts. During that time she often complained that the schedule was too demanding. Not until the results (A) __were announced__ (B) __she realized__ how (C) __hard__ her team (D) __had worked__. When their name was called as the winner, several members burst into tears, and Jiwon finally understood why their leader had pushed them so much.","opts":["(A) were announced","(B) she realized","(C) hard","(D) had worked"],"ans":1,"exp":"부정어구 \"Not until ~\"이 문장 앞에 오면 주절의 주어와 조동사가 도치되므로 did she realize가 되어야 한다. (A)는 결과가 \"발표되는\" 것이므로 수동태, (C)는 \"열심히\"라는 뜻의 부사(hardly는 \"거의 ~않다\"), (D)는 깨달은 때보다 앞선 일을 나타내는 과거완료로 모두 옳다."},
{"id":"e144","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe elderly patient ______ in the crowded waiting room for nearly an hour when the doctor, delayed by an emergency operation, finally arrived to examine her.","opts":["has waited","is waiting","will have waited","had been waiting"],"ans":3,"exp":"의사가 도착한 과거 시점(arrived)까지 한 시간 가까이 계속 기다리고 있었다는 뜻이므로 과거완료진행 had been waiting이 알맞다. 현재완료 has waited, 현재진행 is waiting, 미래완료 will have waited는 과거 시점을 기준으로 하는 when절과 함께 쓸 수 없다."},
{"id":"e145","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Hi, I'd like to pick up my prescription. My name is Han Jiwoo.\nB: Just a moment, please. Here you are. Take one tablet three times a day.\nA: ______?\nB: Yes, right after meals would be best. It can upset an empty stomach.\nA: I see. And what if I forget to take one?\nB: Just take the next one at the usual time. Don't take two at once.\nA: Got it. Thank you for explaining.","opts":["Can I pay by credit card","Are there any side effects","Should I take it with food","How many days' worth is it"],"ans":2,"exp":"B가 \"네, 식사 직후가 가장 좋아요. 빈속에는 속이 불편할 수 있어요\"라고 답했으므로 음식과 함께 먹어야 하는지 묻는 말이 알맞다. 카드 결제, 부작용, 며칠 분인지를 묻는 말에는 식후에 먹으라는 대답이 이어지지 않는다."},
{"id":"e146","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Hello, this is the city bus lost and found center.\nB: Hi. I think I left my umbrella on a bus this morning.\nA: Which bus were you on, and around what time?\nB: The number 12, at about eight o'clock.\nA: ______?\nB: It's a black folding one with a wooden handle.\nA: Let me see. Yes, one like that was handed in an hour ago.\nB: Thank goodness! I'll come and pick it up this afternoon.","opts":["Where did you get off the bus","Can you describe it for me","Why didn't you call us earlier","Would you like to buy a new one"],"ans":1,"exp":"B가 \"나무 손잡이가 달린 검은색 접이식 우산\"이라고 생김새를 말했으므로 어떻게 생겼는지 설명해 달라는 말이 알맞다. 내린 곳, 늦게 연락한 이유, 새 우산을 살지 묻는 말에는 우산의 생김새로 답할 수 없다."},
{"id":"e147","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMs. Seo (1:50 pm): Have you finished the budget report?\nJunho (1:51 pm): Not yet. I still have the last two pages to write.\nMs. Seo (1:52 pm): The meeting is at three. Do you need any help? Mira is free right now.\nJunho (1:53 pm): ______. I can manage it by myself.\nMs. Seo (1:54 pm): All right. Can you send it to me by 2:40 so that I can print copies?\nJunho (1:54 pm): No problem. You'll have it by 2:30.\nMs. Seo (1:55 pm): Good. See you in the meeting room.","opts":["Thanks, but that's okay","I couldn't agree more","You can say that again","Yes, that would be great"],"ans":0,"exp":"뒤에 \"혼자 할 수 있다\"는 말이 이어지므로 도움을 정중하게 사양하는 Thanks, but that's okay가 알맞다. Yes, that would be great는 도움을 받겠다는 말이어서 뒤 문장과 어긋나고, I couldn't agree more와 You can say that again은 \"전적으로 동의한다\"는 뜻이어서 도움이 필요하냐는 물음의 답이 아니다."},
{"id":"e148","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nEunji (5:32 pm): I heard you're being transferred to the Busan office next month. Is that true?\nHyunwoo (5:33 pm): Yes, but please ______. It hasn't been officially announced yet.\nEunji (5:34 pm): Don't worry. My lips are sealed.\nHyunwoo (5:35 pm): Thanks. The manager will tell the team at Friday's meeting.\nEunji (5:36 pm): We'll miss you. How long will you be there?\nHyunwoo (5:37 pm): Two years. I'll be in charge of the new branch.\nEunji (5:37 pm): Congratulations! That sounds like a promotion. Let's have lunch before you go.","opts":["help yourself","suit yourself","keep it to yourself","make yourself at home"],"ans":2,"exp":"keep it to yourself는 \"혼자만 알고 있어라, 비밀로 해 달라\"는 뜻이다. 아직 공식 발표가 나지 않았다는 이유와 Eunji의 My lips are sealed(비밀을 지키겠다)가 단서다. help yourself는 \"마음껏 들어라\", suit yourself는 \"마음대로 해라\", make yourself at home은 \"편히 있어라\"라는 뜻이다."},
{"id":"e149","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Excuse me. I'm here to visit a patient, Kim Jisu, in room 502.\nB: I'm sorry, but visiting hours ended at eight o'clock.\nA: Oh, I didn't know that. I came straight from work.\nB: I understand, but we have to follow the rule so that patients can rest.\nA: ______?\nB: Any time from 2 p.m. to 8 p.m. Only two visitors are allowed at a time.\nA: All right. Could you give her this card for me?\nB: Certainly. I'll take it to her room.","opts":["Which floor is her room on","How is she feeling today","Is she allowed to eat fruit","When can I visit tomorrow"],"ans":3,"exp":"B가 \"오후 2시부터 8시 사이 아무 때나\"라고 시간으로 답했으므로 내일 언제 면회할 수 있는지 묻는 말이 알맞다. 병실의 층, 환자의 상태, 과일을 먹어도 되는지를 묻는 말에는 시간대로 답할 수 없다."},
{"id":"e150","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMina (11:05 am): Where should we hold the year-end team dinner? How about the new Italian restaurant near the station?\nJaewon (11:06 am): I went there last month. The food was good, but it ______.\nMina (11:07 am): Really? How much did you pay?\nJaewon (11:08 am): Over two hundred thousand won for two people.\nMina (11:08 am): Wow, that is a lot. Our budget is only thirty thousand won per person.\nJaewon (11:09 am): Then let's try the Korean barbecue place across the street.\nMina (11:10 am): Okay. I'll call and ask about a group reservation.","opts":["was a steal","hit the spot","was on the house","cost an arm and a leg"],"ans":3,"exp":"cost an arm and a leg는 \"돈이 엄청나게 들다\"라는 뜻이다. 음식은 좋았지만(but) 뒤에 좋지 않은 점이 와야 하고, Mina가 얼마를 냈는지 묻자 둘이서 20만 원 넘게 냈다고 답한다. a steal은 \"거저나 다름없이 싼 것\", hit the spot은 \"딱 원하던 맛이다\", on the house는 \"가게에서 무료로 주는\"이라는 뜻이어서 맞지 않는다."},
{"id":"e151","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Hello, this is the tax department of the district office.\nB: Hello. May I speak to Mr. Choi, please?\nA: I'm afraid he's in a meeting right now. ______?\nB: Yes, please. Could you tell him that Lee Mina called about the property tax notice?\nA: Lee Mina, about the property tax notice. Does he have your number?\nB: I don't think so. It's 555-0142.\nA: Got it. I'll make sure he calls you back this afternoon.\nB: Thank you very much.","opts":["Could you speak up a little","Is he expecting your call","Would you like to leave a message","Have you called him before"],"ans":2,"exp":"B가 \"네, 부탁합니다. ~라고 전해 주시겠어요?\"라고 했으므로 메시지를 남기겠느냐고 묻는 말이 알맞다. 크게 말해 달라는 부탁이나, 통화를 기다리고 있는지, 전에 전화한 적이 있는지를 묻는 말에는 Yes, please와 전할 말이 이어지지 않는다."},
{"id":"e152","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nBora (6:45 pm): Are you still at the office? You looked exhausted at lunch.\nSangmin (6:46 pm): Yes. I've been working overtime every day this week because of the audit.\nBora (6:47 pm): ______. You'll get sick if you keep this up.\nSangmin (6:48 pm): I know. The audit ends tomorrow morning, so I'm taking the afternoon off.\nBora (6:49 pm): Good. Is there anything I can do for you now?\nSangmin (6:50 pm): Could you check the figures on page three?\nBora (6:50 pm): Sure. Send me the file.","opts":["Keep up the good work","Better late than never","You should take it easy","That's a load off my mind"],"ans":2,"exp":"take it easy는 \"쉬엄쉬엄 하다, 무리하지 않다\"라는 뜻이다. 이렇게 계속하면 병난다는 걱정과, 알고 있다며 내일 오후에 쉬겠다는 Sangmin의 대답으로 보아 쉬라고 권하는 말이 알맞다. Keep up the good work는 \"계속 그렇게 잘해라\"여서 반대이고, Better late than never는 \"늦더라도 안 하는 것보다 낫다\", a load off my mind는 \"한시름 놓았다\"는 뜻이다."},
{"id":"e153","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: Hello. I'd like to renew my passport. Here are my application form and a photo.\nB: Thank you. When was this photo taken?\nA: About two years ago, I think. It's the one I used for my driver's license.\nB: ______. We need a photo that was taken recently.\nA: I see. Is there a photo studio nearby?\nB: There's one on the first floor of this building, next to the bank.\nA: Great. I'll be back in half an hour.","opts":["Then it's exactly the right size","Then I'm afraid we can't accept it","Then you don't need to fill out the form","Then your passport will be ready by Friday"],"ans":1,"exp":"최근에 찍은 사진이 필요하다고 했는데 2년 전 사진이라고 했으므로 받을 수 없다는 말이 알맞다. A가 근처에 사진관이 있는지 묻는 것도 사진을 새로 찍어야 하기 때문이다. 크기가 맞다는 말, 신청서를 안 써도 된다는 말, 금요일까지 된다는 말은 뒤의 설명과 이어지지 않는다."},
{"id":"e160","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nIn most cities, the budget is drawn up by officials and approved by the council, and residents learn about it only afterward. Some local governments, however, now set aside part of the budget for residents to decide. Neighbors gather to propose projects, such as repairing a playground or adding streetlights on a dark road. Officials then estimate the cost of each proposal, and residents vote on which ones should be funded. Supporters say the process directs money to needs that officials, who cannot walk every street, might never notice. It also gives residents a better understanding of how public money is spent and a stronger sense that the city belongs to them. Critics point out that the amounts involved are usually small and that people with free time are more likely to take part. Even so, the number of cities trying the approach continues to grow.","opts":["reasons for the rising cost of public facilities","ways to reduce crime on dark streets","conflicts between officials and city councils","letting residents decide how part of the budget is spent"],"ans":3,"exp":"예산의 일부를 주민이 직접 제안하고 투표로 정하게 하는 제도와 그 장점, 한계를 설명한 글이다. 가로등은 주민이 제안하는 사업의 예로 나올 뿐이고, 공공시설 비용의 증가나 공무원과 의회의 갈등은 언급되지 않는다."},
{"id":"e162","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nFor most of human history, the night sky was filled with thousands of stars. Today, people living in large cities can see only a handful, because the glow of streetlights and signs washes out the rest. The loss is not merely a matter of beauty. Artificial light at night confuses migrating birds, which may circle bright buildings until they are exhausted, and it leads newly hatched sea turtles away from the ocean and toward roads and parking lots. Much of this light, moreover, does no one any good: it shines upward or sideways into the sky instead of onto the ground where people walk. Fortunately, the solution is cheaper than for most kinds of pollution. Lamps that point downward and switch off when no one is near save energy and bring back the dark, and the effect is immediate.","opts":["How Birds Find Their Way by the Stars","Light Pollution: What We Lose and How to Fix It","Why Cities Need Brighter Streetlights","The Life Cycle of Sea Turtles"],"ans":1,"exp":"밤의 인공조명 때문에 별이 보이지 않고 철새와 새끼 바다거북이 피해를 입으며(잃는 것), 아래를 비추고 저절로 꺼지는 등으로 해결할 수 있다(고치는 법)는 글이다. 새와 거북은 피해의 예일 뿐이고, 가로등을 더 밝게 하자는 것은 글과 반대다."},
{"id":"e165","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nPeople usually volunteer in order to help others, but those who give their time often gain as much as they give. Serving meals at a shelter or reading to children in a hospital brings volunteers into contact with people they would otherwise never meet, and many form lasting friendships. Retired people in particular say that regular volunteer work gives their week a structure and a sense of purpose that they missed after leaving their jobs. Volunteers also pick up practical skills, from organizing events to speaking in public, that prove useful in their own careers. For young people who have not yet held a job, such experience can be a first chance to work in a team and to be relied on by others. None of this is the reason most people sign up. Still, helping others, it turns out, is also a way of helping oneself.","opts":["How to Recruit More Volunteers","Why Shelters Need Government Support","What Volunteers Receive in Return","The Decline of Volunteering among the Young"],"ans":2,"exp":"봉사자는 남을 돕는 동안 새로운 사람들과의 우정, 삶의 목적의식, 실용적인 기술과 협동의 경험을 얻는다는 글이다. 마지막 문장이 \"남을 돕는 것은 자신을 돕는 길\"이라고 정리한다. 봉사자 모집 방법, 쉼터에 대한 정부 지원, 청년 봉사의 감소는 다루지 않는다."},
{"id":"e166","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nMosquitoes lay their eggs in still water, and they need very little of it. A flowerpot saucer, an old tire, or a blocked gutter can produce hundreds of insects in a short time during warm weather. This is why health authorities, when they try to control diseases carried by mosquitoes, ask residents to do more than spray insecticide. Spraying kills only the adults that happen to be flying at the time, and new ones soon take their place. Emptying containers after rain, covering water tanks, and clearing drains, on the other hand, remove the places where the insects breed. Because a mosquito can grow from egg to adult in little more than a week in hot weather, this needs to be done regularly rather than once a season. A neighborhood that leaves no standing water stops the next generation from ever appearing, which no amount of spraying can achieve.","opts":["the health risks of using insecticide at home","the reasons mosquitoes prefer warm weather","the proper way to water flowerpots","the need to remove standing water to control mosquitoes"],"ans":3,"exp":"모기는 고인 물에 알을 낳으므로, 날아다니는 성충만 죽이는 살충제보다 고인 물을 없애는 것이 다음 세대의 모기를 막는 길이라는 글이다. 살충제가 건강에 해롭다는 말은 없고, 화분 받침은 모기가 생기는 곳의 예일 뿐이며, 더운 날씨는 모기가 빨리 자라는 조건으로만 나온다."},
{"id":"e167","subj":"영어","unit":"독해 주제","q":"다음 글의 요지로 가장 적절한 것은?\n\nA search for almost any symptom now returns thousands of pages within a second. Some are written by medical organizations and reviewed by experts; many others are produced by companies with something to sell or by individuals repeating what they have heard. The trouble is that all of them look equally convincing on a screen, and the page that appears first is not necessarily the most reliable. Before acting on health advice found online, readers should ask who wrote it, when it was last updated, and whether it points to evidence. Advice that promises a quick cure, relies on one person's story, or urges you to buy a product deserves particular suspicion. It is also wise to compare what several trustworthy sources say rather than to stop at the first answer. When doubt remains, the question is best taken to a doctor or a pharmacist.","opts":["증상이 있으면 병원에 가기 전에 먼저 인터넷으로 찾아보아야 한다.","인터넷의 건강 정보는 출처와 근거를 확인하고 받아들여야 한다.","의료 기관이 쓴 글은 너무 어려워서 쓸모가 없다.","건강 정보는 빨리 찾을 수 있는 것일수록 믿을 만하다."],"ans":1,"exp":"인터넷의 건강 정보는 전문가가 쓴 것과 물건을 팔려는 글이 섞여 있으므로 누가 썼는지, 언제 고쳤는지, 근거가 있는지를 확인하라는 글이다. 먼저 인터넷으로 찾아보라고 권하는 글이 아니고, 의료 기관의 글은 오히려 믿을 만한 쪽으로 제시되며, 맨 먼저 나오는 글이 가장 믿을 만한 것은 아니라고 했다."},
{"id":"e169","subj":"영어","unit":"독해 내용일치","q":"camel에 관한 다음 글의 내용과 일치하는 것은?\n\nCamels are well suited to life in the desert. Contrary to popular belief, their humps store fat, not water; the fat serves as a source of energy when food is scarce, and a hump may shrink and lean to one side after a long journey. A thirsty camel can drink about a hundred liters of water at one time, and it can then go for many days without drinking again. Its body loses very little water, partly because it does not begin to sweat until its body temperature has risen considerably. Long eyelashes and nostrils that can be closed keep out blowing sand, and wide feet prevent the animal from sinking into it. Thick fur on its back shields it from the sun by day and keeps it warm during cold desert nights. For thousands of years, these qualities have made the camel a valuable means of transport across dry regions.","opts":["Their humps are filled with water.","Their wide feet keep them from sinking into the sand.","They are unable to close their nostrils.","They must drink water every day."],"ans":1,"exp":"넓은 발 덕분에 모래에 빠지지 않는다고 했다. 혹에는 물이 아니라 지방이 들어 있고, 콧구멍을 닫아 모래를 막을 수 있으며, 한 번 물을 마시면 여러 날 동안 마시지 않고 지낼 수 있다."},
{"id":"e171","subj":"영어","unit":"독해 내용일치","q":"Dead Sea에 관한 다음 글의 내용과 일치하는 것은?\n\nThe Dead Sea in the Middle East is not really a sea but a lake. Its shore is the lowest point on the land surface of the earth, more than 400 meters below sea level. Water flows into the lake but has no way out except by evaporating in the heat, leaving its salt behind. As a result, the water is almost ten times as salty as the ocean, and no fish can live in it, which is how the lake got its name. The salt also makes the water so dense that swimmers float without effort, and visitors like to be photographed reading a newspaper while lying on the surface. In recent decades the lake has been shrinking, largely because much of the water of the Jordan River, its main source, is taken for farming and drinking before it arrives. Its surface now drops by roughly a meter every year.","opts":["People float easily in its water.","It lies more than 400 meters above sea level.","Many kinds of fish live in its salty water.","It has been growing larger in recent decades."],"ans":0,"exp":"소금 때문에 물의 밀도가 높아 사람이 힘들이지 않고 뜬다고 했다. 호숫가는 해수면보다 400미터 넘게 낮고(below), 물이 너무 짜서 물고기가 살지 못하며, 요르단강의 물이 도중에 쓰여서 호수는 줄어들고 있다."},
{"id":"e173","subj":"영어","unit":"독해 내용일치","q":"bamboo에 관한 다음 글의 내용과 일치하는 것은?\n\nBamboo is not a tree but a kind of grass. Some species are among the fastest-growing plants in the world and can grow close to a meter in a single day under favorable conditions. Its stem is hollow, yet strong enough to be used for building houses, bridges, and furniture in many parts of Asia, and it is light enough to be carried easily. Young shoots are eaten as a vegetable, and the leaves and stems of certain species are the main food of the giant panda. Because bamboo spreads through underground stems, new stalks keep rising after the old ones are cut, so a grove does not need to be replanted after each harvest. Many kinds of bamboo flower very rarely, some only once in several decades, and the plants often die after flowering.","opts":["Its young shoots are used as food.","It is classified as a kind of tree.","Its stem is solid and heavy.","Every species flowers once a year."],"ans":0,"exp":"어린 순(죽순)은 채소로 먹는다고 했다. 대나무는 나무가 아니라 풀의 한 종류이고, 줄기는 속이 비어 가벼우며, 꽃은 아주 드물게 피어 수십 년에 한 번 피는 종도 있다."},
{"id":"e176","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nVaccines protect not only the people who receive them. When most members of a community are immune to a disease, the germ has difficulty finding a new person to infect, and outbreaks die out quickly instead of spreading. This matters greatly to those who cannot be vaccinated, such as newborn babies who are still too young and people whose immune systems are weakened by illness or treatment. They are shielded because the people around them cannot pass the disease on. The protection weakens, however, when the share of vaccinated people falls. For a highly contagious disease such as measles, nearly everyone must be immune to keep the germ from spreading, and even a small drop can allow it to return. Getting vaccinated, therefore, is not just a personal choice; it is also ______.\n\n* measles: 홍역","opts":["a way of protecting one's neighbors","a danger to newborn babies","a waste of public money","a cure for those already ill"],"ans":0,"exp":"공동체의 대부분이 면역을 가지면 병이 퍼지지 못해, 접종을 받을 수 없는 신생아나 면역이 약한 사람도 보호받는다는 글이다. 따라서 접종은 개인의 선택일 뿐 아니라 이웃을 지키는 길이라는 말이 알맞다. 신생아에게 위험하다는 것은 글과 반대이고, 치료 이야기는 나오지 않는다."},
{"id":"e177","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIn the first half of the nineteenth century, cities such as London had no modern sewer system, and human waste often flowed into the same rivers from which people drew their drinking water. ______, diseases like cholera spread quickly and killed thousands of people in a single outbreak. At the time, most doctors blamed the foul smell of the air, not the water. It was only when a London doctor, John Snow, marked the homes of the dead on a map in 1854 and found them gathered around a single street pump that suspicion began to turn to the water supply. In the following decades, engineers built underground sewers and cities began to treat their water, and the death rate fell. Clean water and sewers are often said to have saved more lives than any medicine.\n\n* sewer: 하수도","opts":["In contrast","Nevertheless","As a result","Otherwise"],"ans":2,"exp":"앞 문장은 오물이 식수를 얻는 강으로 흘러들었다는 원인이고, 뒤 문장은 콜레라가 퍼져 수천 명이 죽었다는 결과이므로 As a result가 알맞다. In contrast는 대조, Nevertheless는 \"그럼에도 불구하고\", Otherwise는 \"그렇지 않으면\"이어서 원인과 결과를 잇지 못한다."},
{"id":"e178","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nPeople tend to stay with whatever option is already chosen for them. A well-known example comes from retirement savings plans at companies. Where new employees had to fill out a form in order to join the plan, many never got around to it, even though joining was clearly to their advantage. When the rule was changed so that employees were enrolled automatically unless they asked to leave, the great majority stayed in the plan. Nothing else had changed: the plan, the pay, and the kind of workers were the same, and everyone remained free to choose either way. Similar results have been reported for decisions as different as organ donation and the choice of an electricity supplier. Such examples show that ______ can have a powerful effect on what people end up doing.","opts":["how much workers are paid","the advice of older colleagues","the size of a company","what is set as the starting option"],"ans":3,"exp":"가입하려면 서류를 내야 할 때는 많은 사람이 가입하지 않았지만, 자동으로 가입되고 원하면 빠지게 하자 대부분이 남았다는 예다. 달라진 것은 처음에 정해 둔 선택지뿐이므로 그것이 사람들의 행동에 큰 영향을 준다는 말이 알맞다. 첫 문장의 \"이미 골라져 있는 선택지에 머문다\"와도 맞는다. 급여와 직원은 그대로였다고 했으므로 나머지는 맞지 않는다."},
{"id":"e179","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIf you collapse on a busy street, you might expect that the large number of passers-by guarantees quick help. Psychologists have found that this is not always so. When many people witness an emergency, each one tends to assume that someone else has already called for help or is better able to act. Each also looks at the others, sees that no one is moving, and concludes that the situation may not be serious after all. Responsibility is spread so thinly that no one feels it. A person who is the only witness, by contrast, knows that if he or she does nothing, nothing will be done. For this reason, first-aid instructors teach people not to shout \"Somebody call an ambulance!\" but to ______.","opts":["wait quietly until a doctor passes by","point at one person and tell that person to call","move the patient to a quieter street","ask the whole crowd to step back"],"ans":1,"exp":"보는 사람이 많으면 저마다 \"다른 누군가가 하겠지\"라고 생각해 아무도 책임을 느끼지 않고, 목격자가 혼자일 때는 자기가 해야 한다는 것을 안다는 글이다. 그래서 막연히 \"누가 좀\"이라고 외치지 말고 한 사람을 지목해 책임을 분명히 주라는 말이 알맞다. 나머지는 책임이 흩어지는 문제를 풀어 주지 못한다."},
{"id":"e180","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nGive a student a week to write a short essay, and it will take a week. Give the same student one evening, and the essay will be finished by midnight, often with little difference in quality. Work has a way of expanding to fill the time allowed for it. When time is plentiful, we check our messages, rearrange our notes, and polish details that do not matter, and we tell ourselves that there is no need to begin yet. A tight but realistic limit forces us to decide what is essential and to leave the rest. This does not mean that every job should be rushed; a limit that cannot be met only produces careless work and anxiety. But if you want a task done efficiently, the best thing you can do is to ______.","opts":["set a shorter deadline for it","allow as much time as possible","divide it among several people","polish every detail with care"],"ans":0,"exp":"일은 주어진 시간을 다 채우도록 늘어나고, 빠듯하지만 현실적인 기한이 있어야 꼭 필요한 것에 집중하게 된다는 글이다. 따라서 일을 효율적으로 하려면 기한을 짧게 잡으라는 말이 알맞다. 시간을 넉넉히 주거나 세부를 다듬는 것은 글에서 비효율의 원인으로 든 것이고, 여럿이 나누는 이야기는 없다."},
{"id":"e181","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA fever is unpleasant, and many parents rush to bring it down the moment a child feels warm. Yet a fever is not an illness in itself. It is ______: when viruses or bacteria enter, the body raises its own temperature because many germs multiply less well in the heat and the immune system works faster. For this reason, doctors often advise that a mild fever in an otherwise comfortable child need not be treated at once. Medicine may be given to help the child rest or drink, but the aim is comfort, not a particular number on the thermometer. What matters more is how the child looks and behaves, and whether he or she is drinking enough. A very young baby with a fever, a fever that lasts several days, or a child who is hard to wake, however, should be seen by a doctor without delay.","opts":["a side effect of taking too much medicine","a sign that the immune system has failed","the main cause of most childhood diseases","one of the body's defenses against infection"],"ans":3,"exp":"빈칸 뒤에서 병원체가 들어오면 몸이 스스로 체온을 올려 병원체의 증식을 막고 면역 작용을 빠르게 한다고 설명하므로, 열은 감염에 맞서는 몸의 방어 수단이라는 말이 알맞다. 열은 그 자체가 병이 아니라고 했으므로 병의 원인이라는 선지는 맞지 않고, 면역이 실패했다는 것은 글과 반대다."},
{"id":"e182","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nBanks and airports once had a separate line in front of each counter, and customers had to guess which one would move fastest. Most now use a single line that feeds all the counters. The average waiting time is about the same, but the experience is very different. In the old system, a customer stuck behind someone with a complicated problem watched people who had arrived later go ahead in other lines, and grew angrier with every minute. In a single line, everyone is served strictly in the order of arrival, and a slow transaction at one counter delays all customers a little instead of a few customers a lot. Although a single line often looks longer and may discourage people at first sight, customers tend to prefer it. People accept waiting far more readily when they feel that ______.","opts":["the counters are close together","they can change lines at any time","the system treats them fairly","the staff are working in silence"],"ans":2,"exp":"줄이 여럿일 때는 늦게 온 사람이 먼저 가는 것을 보게 되지만, 한 줄 서기에서는 온 순서대로 차례가 온다는 글이다. 평균 대기 시간은 비슷하다고 했으므로 사람들이 기다림을 받아들이는 이유는 공정하게 대우받는다는 느낌이다. 한 줄 서기에서는 줄을 바꿀 수 없으므로 줄을 바꿀 수 있다는 선지는 맞지 않는다."},
{"id":"e183","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe green of summer leaves comes from chlorophyll, the substance that plants use to turn sunlight into food. Leaves also contain yellow and orange pigments, the same kind that color carrots and corn, but in summer these are hidden by the much greater amount of green. As the days shorten and the nights grow cool in autumn, trees prepare for winter by ceasing to produce chlorophyll, and what remains in the leaves breaks down. With the green gone, the other colors can at last be seen. Before the leaves fall, the tree also draws useful nutrients back into its branches and trunk, where they are stored until spring. The yellow and orange of an autumn hillside, in other words, are not newly made in the fall; they ______.\n\n* chlorophyll: 엽록소  * pigment: 색소","opts":["are carried up from the roots","were there all along","appear only after the leaves fall","come from the cold night air"],"ans":1,"exp":"노란색과 주황색 색소는 여름에도 잎에 있었지만 초록색에 가려져 있었고, 가을에 엽록소가 분해되면서 드러난다는 글이다. 가을에 새로 만들어지는 것이 아니라고 했으므로 \"처음부터 줄곧 거기에 있었다\"는 말이 알맞다. 뿌리에서 올라온다거나 잎이 진 뒤에 나타난다는 내용은 글에 없다."},
{"id":"e184","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMost students review by reading their notes again and again. The pages soon look familiar, and this familiarity is easily mistaken for knowledge. Recognizing a sentence when it is in front of you, however, is very different from being able to produce it in an examination room. A more effective method is to close the book and try to recall the material: answer practice questions, or explain the topic aloud without looking. The effort of pulling information out of memory strengthens it far more than putting it in once more. It feels harder and less pleasant than rereading, which is one reason students tend to avoid it. Mistakes made along the way are useful, too, because they show exactly what has not yet been learned. In short, the best way to study is ______.","opts":["to read the notes one more time","to avoid making any mistakes","to memorize the pages in order","to test yourself"],"ans":3,"exp":"노트를 되풀이해 읽으면 익숙해질 뿐이고, 책을 덮고 문제를 풀거나 설명해 보며 기억에서 꺼내는 것이 더 효과적이라는 글이다. 따라서 가장 좋은 공부법은 스스로 시험해 보는 것이다. 다시 읽기는 글이 덜 효과적이라고 한 방법이고, 실수는 오히려 쓸모가 있다고 했다."},
{"id":"e185","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nSmallpox was once among the most feared diseases in the world. It killed a large share of those who caught it and left many survivors with deep scars.\n\n(A) He tested this idea in 1796 by scratching material from a cowpox sore into the arm of a young boy and later exposing him to smallpox; the boy stayed healthy.\n(B) An English doctor named Edward Jenner noticed, however, that milkmaids who had caught cowpox, a mild disease of cattle, did not seem to get smallpox. He guessed that cowpox somehow protected them.\n(C) This method, which came to be called vaccination, spread around the world, and in 1980 smallpox was declared wiped out, the first human disease ever to be eliminated in this way.\n\n* smallpox: 천연두  * cowpox: 우두","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":0,"exp":"천연두가 무서운 병이었다는 주어진 글 뒤에, however로 제너의 관찰과 추측을 소개하는 (B)가 온다. (A)의 this idea는 (B)의 \"우두가 보호해 준다\"는 추측을 가리키고, (C)의 This method는 (A)에서 한 접종을 가리키므로 (B)-(A)-(C)이다."},
{"id":"e186","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nWhen you step outside on a freezing day, your body immediately begins working to protect its vital organs. It does so in stages, saving its strongest measure for last.\n\n(A) If this first response is still not enough to keep the core warm, the muscles start to contract rapidly, a reaction we know as shivering, which produces heat but uses up a great deal of energy.\n(B) First, the blood vessels near the skin become narrower, so that less warm blood flows to the surface and less heat escapes into the air.\n(C) That is why your fingers and ears, which now receive less blood, turn pale and feel cold long before the rest of you does. For the same reason, they are the first parts to be injured by extreme cold.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":2,"exp":"몸이 단계적으로 반응한다는 주어진 글 뒤에 First로 첫 반응(혈관 수축)을 말하는 (B)가 온다. (C)의 That is why와 \"이제 피를 덜 받는\"은 (B)의 내용을 바로 받는다. (A)는 이 첫 반응으로 부족할 때 일어나는 다음 반응(떨림)이므로 마지막에 온다. (A)가 (C) 앞에 오면 That이 떨림을 가리키게 되어 맞지 않는다."},
{"id":"e187","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nLast winter, Minho lost his wallet on a crowded bus on his way home from work. He did not notice until he reached his front door and put his hand in his pocket.\n\n(A) The next morning, however, his phone rang, and an unfamiliar voice asked whether he had lost something on the bus the day before.\n(B) The caller turned out to be a high school student who had found the wallet under a seat and had seen his business card inside. When they met that afternoon, nothing was missing, and the student would accept no reward but a word of thanks.\n(C) He searched his coat and bag again and again that evening, called the bus company without success, and finally gave up, sure that he would never see it again.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":2,"exp":"지갑을 잃어버렸다는 주어진 글 뒤에, 그날 저녁 찾다가 포기했다는 (C)가 온다. 그런데(however) 다음 날 아침 전화가 왔다는 (A)가 이어지고, 그 전화를 건 사람(The caller)이 누구였는지와 그날 오후의 만남을 말하는 (B)가 마지막이다."},
{"id":"e188","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nAlmost everyone has shed tears while chopping an onion, even when there was nothing to be sad about. An onion does not affect the eyes until it is cut, so what happens at that moment?\n\n(A) The cause is a gas that is released when the knife breaks the onion's cells. The gas rises from the cutting board, and when it reaches the eyes, it irritates their sensitive surface.\n(B) These tears can be reduced, however, by chilling the onion before cutting it, since the cold slows the release of the gas. Using a sharp knife also helps, because it damages fewer cells than a dull one.\n(C) To wash this irritating substance away, the eyes produce tears, just as they do when dust or smoke gets into them.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":0,"exp":"양파를 썰 때 눈물이 난다는 주어진 글 뒤에 그 원인(The cause)인 기체를 설명하는 (A)가 온다. (C)의 this irritating substance는 (A)의 기체를 가리키며 그것을 씻어 내려고 눈물이 난다고 하고, 이 눈물(These tears)을 줄이는 방법을 말하는 (B)가 마지막이다. (B)의 the gas도 (A)에서 먼저 소개되어야 한다."},
{"id":"e189","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nAt regular intervals, usually every five or ten years, most governments count everyone living in the country in a survey known as a census. The practice is very old, but its purpose has grown far beyond the original aims of collecting taxes and finding soldiers.\n\n(A) Since such decisions depend on the results, residents are urged to answer every question accurately. In return, the law usually requires that individual answers be kept secret and used only for statistics.\n(B) With these detailed answers in hand, officials can see how the population is changing and decide where new schools, hospitals, and roads will be needed in the years ahead.\n(C) The count is not limited to the number of people. Households are also asked about matters such as age, occupation, education, and the kind of housing they live in.\n\n* census: 인구 조사","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":3,"exp":"인구 조사를 소개한 주어진 글 뒤에, 사람 수만 세는 것이 아니라 여러 가지를 묻는다는 (C)가 온다. (B)의 these detailed answers는 (C)의 질문에 대한 답을 가리키고, (A)의 such decisions는 (B)에서 말한 학교·병원·도로에 관한 결정을 가리키므로 (C)-(B)-(A)이다."},
{"id":"e190","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nIt is widely believed that the color red makes bulls angry. The belief is easy to understand, since the cape that a bullfighter holds out to the bull is traditionally bright red.\n\n(A) What provokes the animal, then, is most likely not the color of the cape but the way the bullfighter waves it sharply back and forth.\n(B) In fact, however, cattle do not see red as vividly as we do. Like many other mammals, they have only two kinds of color-sensing cells in their eyes and are thought to be poor at telling red from green, so a red cape does not stand out to them as it does to us.\n(C) Movement seems to have the same effect outside the bullring: bulls are said to charge at a waving cloth of any color and to pay little attention to a red one that is kept still.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":1,"exp":"빨간색이 소를 화나게 한다는 통념 뒤에, however로 소는 빨간색을 사람처럼 뚜렷하게 보지 못한다고 반박하는 (B)가 온다. 그렇다면(then) 소를 자극하는 것은 색이 아니라 천의 움직임일 것이라는 (A)가 이어지고, 투우장 밖에서도 움직임이 같은 효과(the same effect)를 내는 것으로 보인다는 (C)가 마지막이다. (C)는 움직임 이야기가 먼저 나온 (A) 뒤에만 올 수 있다."},
{"id":"e191","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nSunscreen works only when it is used properly, and many people do not use it that way. (A) It should be applied about fifteen to thirty minutes before going outdoors so that it has time to settle on the skin. (B) Most people use far too little; an adult needs roughly a shot glass of lotion to cover the whole body, and places such as the ears, the back of the neck, and the tops of the feet are often missed. (C) Tanned skin was once regarded as a sign of outdoor labor, but it later became fashionable among city dwellers. (D) Because sweat and water wash the lotion away, it must be put on again every two hours and after swimming. Sunscreen is needed on cloudy days as well, since much of the sun's ultraviolet light passes through clouds.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"자외선 차단제를 제대로 쓰는 방법(바르는 때, 양, 덧바르기, 흐린 날)을 설명하는 글이다. (C)는 햇볕에 그을린 피부에 대한 인식이 바뀌었다는 내용이어서 차단제의 올바른 사용법이라는 흐름에서 벗어난다."},
{"id":"e192","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nEmergency call centers receive many calls that are not emergencies at all. (A) People call to ask about bus schedules, to complain about noisy neighbors, or even to request help opening a locked door. (B) Mobile phones have replaced public telephones on most city streets, and few children today have ever used a phone booth. (C) Each needless call occupies an operator who might otherwise be answering someone in real danger, and in a fire or a heart attack a delay of even one minute can matter. (D) To keep the emergency line free, many cities have set up a separate number for everyday questions and complaints. Public campaigns also teach residents when to use each number: the emergency line when life or property is in immediate danger, and the other line for everything else.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"긴급 전화에 긴급하지 않은 전화가 많이 걸려 와 정작 위급한 사람의 전화를 받지 못할 수 있고, 그래서 따로 민원 번호를 둔다는 글이다. (B)는 전화라는 낱말로 이어지는 듯하지만 휴대 전화가 공중전화를 대신하게 되었다는 내용이어서 흐름과 관계가 없다. (C)의 Each needless call은 (A)에서 든 전화들을 받는다."},
{"id":"e193","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nCaffeine does not give the body new energy; it only hides tiredness. (A) It works by blocking the action of a chemical in the brain that builds up during the day and makes us feel sleepy. (B) When the caffeine wears off, the tiredness that was hidden returns, often all at once, which is why many people reach for a second or third cup. (C) Moreover, since caffeine stays in the body for many hours, a cup in the late afternoon can still disturb sleep at night, leaving us even more tired the next morning. (D) Coffee beans are grown mainly in warm regions near the equator and are shipped all over the world. A short nap or an earlier bedtime is a far better answer to tiredness than another cup.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"카페인은 피로를 없애는 것이 아니라 가릴 뿐이고 밤잠까지 방해하므로, 피곤하면 자는 것이 낫다는 글이다. (D)는 커피콩의 재배 지역과 수출에 관한 내용이어서 카페인과 피로라는 흐름에서 벗어난다."},
{"id":"e194","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nA school nurse does far more than put bandages on scraped knees. (A) Nursing uniforms have changed a great deal over the past hundred years, from long dresses and caps to simple, practical clothing. (B) The nurse looks after students with long-term conditions such as asthma or diabetes, making sure they take their medicine on time and know what to do if they feel unwell. (C) He or she also checks students' eyesight and hearing, so that problems are found before they affect learning. (D) When an infectious disease appears in a class, it is the nurse who reports it and advises teachers and parents on what to do. In addition, many school nurses teach lessons on topics such as nutrition, hand washing, and first aid. In all these ways, they help keep children healthy enough to learn.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"보건교사가 만성 질환 학생 돌보기, 시력·청력 검사, 감염병 대응, 보건 교육 등 여러 일을 한다는 글이다. (A)는 간호사 복장의 변화에 관한 내용이어서 보건교사가 하는 일이라는 흐름과 관계가 없다."},
{"id":"e195","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nStaring at a screen for hours tires the eyes, causing dryness, blurred vision, and sometimes headaches. (A) One reason is that we blink far less often than usual when we look at a screen, so the surface of the eye dries out. (B) Eye doctors suggest a simple habit: every twenty minutes, look at something about six meters away for twenty seconds, which lets the muscles that focus the eye relax. (C) Screens have become thinner and lighter every year as technology has advanced. (D) Adjusting the brightness of the screen to match the room and keeping it at arm's length can also reduce the strain. So can placing the screen slightly below eye level, because the eyes open less widely when looking down and therefore dry out more slowly. If discomfort continues in spite of these measures, an eye examination is advisable.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"화면을 오래 보면 눈이 피로해지는 이유와 이를 줄이는 방법을 다룬 글이다. (C)는 화면이라는 낱말이 겹치지만 화면이 해마다 얇고 가벼워졌다는 기술 발전 이야기여서 눈의 피로라는 흐름에서 벗어난다. (D)의 also는 (B)의 습관에 이어 또 다른 방법을 더하는 말이다."},
{"id":"e196","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThe reason lies in the way the two materials conduct heat.\n\nTouch a metal spoon and a wooden spoon that have been lying in the same drawer overnight. (A) The metal one will feel distinctly colder. (B) Yet both are at exactly the same temperature as the room, so why do they feel different? (C) Metal is a good conductor and carries heat away from your fingers quickly, while wood, a poor conductor, does so very slowly. (D) What your skin senses, therefore, is not the temperature of the object itself but how fast heat is leaving your hand. The same principle explains why a tiled bathroom floor feels colder to bare feet than a rug in the same room, and why a metal bench in winter seems far icier than a wooden one. It also explains why pots are made of metal while their handles are often made of wood or plastic.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"주어진 문장의 The reason은 \"온도가 같은데도 왜 다르게 느껴지는가\"라는 물음의 답을 꺼내는 말이므로, 그 물음 바로 뒤인 (C)에 와야 한다. 바로 뒤에 금속과 나무가 열을 전하는 방식의 차이가 구체적으로 이어진다. (B)에 넣으면 Yet으로 시작하는 문장이 앞 문장과 대조를 이루지 못하고, (D)에 넣으면 열전도 차이를 이미 설명한 뒤여서 같은 말을 되풀이하게 된다."},
{"id":"e197","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThis, however, is exactly the wrong thing to do.\n\nNosebleeds are common, especially in dry winter air, and are usually harmless. (A) When one starts, many people tilt their head back to keep the blood from dripping onto their clothes. (B) The reason is that, with the head back, the blood runs down the throat into the stomach, where it can cause nausea and vomiting. (C) Instead, you should sit up, lean slightly forward, and pinch the soft part of your nose firmly for about ten minutes, breathing through your mouth. (D) Resist the temptation to let go every minute to check, since the pressure must be continuous to work. If the bleeding still has not stopped after a second try, or if it follows a blow to the head, you should see a doctor.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장의 This는 고개를 뒤로 젖히는 행동을 가리키므로 그 내용이 나온 뒤인 (B)에 와야 한다. 바로 뒤의 The reason is ~가 왜 잘못인지(피가 목으로 넘어가 메스꺼움을 일으킴)를 설명하고, (C) 뒤의 Instead는 올바른 방법을 소개한다."},
{"id":"e198","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nEven so, the apps cannot be relied on for every conversation.\n\nTranslation apps have become a familiar sight in hospitals that treat foreign patients. (A) A nurse speaks into a phone, and a moment later the patient hears the question in his or her own language. (B) For simple matters such as meal times or directions to the X-ray room, the apps work well enough. (C) They are also available at any hour, unlike human interpreters, who must usually be booked in advance. (D) When a doctor has to explain a diagnosis or obtain consent for surgery, a small error in translation could have serious consequences, so a trained medical interpreter is still called in. An interpreter can also notice when a patient looks confused and ask the doctor to explain again, which no app can do.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장은 Even so(그렇다 하더라도)로 앞에 나온 번역 앱의 장점들과 반대되는 한계를 꺼낸다. (D) 앞까지는 장점(간단한 일에 쓸 만함, 언제든 쓸 수 있음)이 이어지고, (D) 뒤는 진단 설명이나 수술 동의에는 전문 통역사를 부른다는 한계의 구체적인 내용이므로 (D)가 알맞다. (C)에 넣으면 뒤 문장의 also가 이어지지 않는다."},
{"id":"e199","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThe rest lies hidden beneath the water, where it may extend far out to the sides.\n\nOnly about one-tenth of an iceberg can be seen above the surface of the sea. (A) A ship that keeps clear of the visible ice may therefore still strike the part it cannot see. (B) To reduce this danger, an international patrol has been tracking icebergs in the North Atlantic since shortly after the Titanic sank in 1912. (C) In its early years the patrol relied on ships that searched the foggy shipping lanes; today, aircraft and satellites do much of this work, and warnings are sent to ships every day. (D) Thanks to these efforts, collisions with icebergs have become rare. Even so, captains are still advised to slow down and keep a careful watch whenever they pass through waters where ice has been reported.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"주어진 문장의 The rest는 첫 문장의 \"10분의 1\"을 뺀 나머지를 가리키므로 첫 문장 바로 뒤인 (A)에 와야 한다. 그 뒤 문장의 therefore와 \"보이지 않는 부분\"도 나머지가 물속에서 옆으로 뻗어 있다는 말이 먼저 나와야 이어진다."},
{"id":"e200","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nBut in soil that is kept constantly wet in this way, the roots are starved of air and begin to rot.\n\nMore houseplants die from too much water than from too little. (A) Owners who see a drooping leaf often assume that the plant is thirsty and water it again. (B) A plant with rotting roots can no longer take up water, so its leaves droop even more, and the owner adds yet more water. (C) The way out of this cycle is to check the soil, not the leaves. (D) If the top few centimeters feel dry to the finger, it is time to water; if not, wait. It also helps to use a pot with holes in the bottom, so that extra water can drain away instead of collecting around the roots. Most plants recover from a few dry days far more easily than from a week of standing in water.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장의 in this way는 잎이 처질 때마다 물을 또 주는 행동을 가리키므로 그 문장 뒤인 (B)에 와야 한다. 바로 뒤의 \"뿌리가 썩은 식물\"은 주어진 문장에서 뿌리가 썩기 시작한다는 말이 먼저 나와야 이어진다."},
{"id":"e201","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nBrookvale Water Department\n\n(A) ______\n\nCrews will replace an aging water main under Linden Street next week. To complete the work safely, water service will be shut off for part of one day.\n\nDate: Wednesday, March 10\nTime: 9:00 a.m. – 4:00 p.m.\nAffected area: Linden Street between 2nd Avenue and 5th Avenue\n\nWhat you should do:\n■ Store enough water for drinking and cooking before 9:00 a.m.\n■ Keep all taps closed during the shutoff.\n■ When service returns, run the cold water tap for about five minutes until the water looks clear.\n\nA water truck will be parked in front of Linden Elementary School for residents who need drinking water.\n\nIf it rains heavily, the work will be moved to Thursday, March 11.\nQuestions? Call our customer line at 555-0142.","opts":["Water Shutoff on Linden Street","Linden Street Closed to All Traffic","How to Lower Your Monthly Water Bill","Free Water Quality Testing for Homes"],"ans":0,"exp":"낡은 수도관을 바꾸는 공사 때문에 Linden Street 일대의 수도 공급이 하루 중 일부 시간 동안 끊긴다는 것을 날짜, 시간, 대상 구역, 주민이 할 일과 함께 알리는 글이므로 'Linden Street 단수'가 제목으로 알맞다. 차량 통행 금지, 수도 요금 절약, 무료 수질 검사에 대한 내용은 없다."},
{"id":"e202","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nBrookvale Water Department\n\n(A) ______\n\nCrews will replace an aging water main under Linden Street next week. To complete the work safely, water service will be shut off for part of one day.\n\nDate: Wednesday, March 10\nTime: 9:00 a.m. – 4:00 p.m.\nAffected area: Linden Street between 2nd Avenue and 5th Avenue\n\nWhat you should do:\n■ Store enough water for drinking and cooking before 9:00 a.m.\n■ Keep all taps closed during the shutoff.\n■ When service returns, run the cold water tap for about five minutes until the water looks clear.\n\nA water truck will be parked in front of Linden Elementary School for residents who need drinking water.\n\nIf it rains heavily, the work will be moved to Thursday, March 11.\nQuestions? Call our customer line at 555-0142.","opts":["단수는 오전 9시부터 오후 6시까지 이어진다.","단수 중에는 수도꼭지를 열어 두어야 한다.","급수가 재개되면 찬물을 5분쯤 틀어 놓아야 한다.","비가 많이 오면 공사는 다음 주로 미뤄진다."],"ans":2,"exp":"\"When service returns, run the cold water tap for about five minutes\"라고 했으므로 급수가 다시 되면 찬물을 5분쯤 틀어 놓는다는 말이 일치한다. 단수 시간은 오후 4시까지이고, 단수 중에는 수도꼭지를 모두 잠가 두라고 했으며, 비가 많이 오면 공사는 다음 날인 3월 11일 목요일로 옮긴다."},
{"id":"e203","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nHarlow County Public Health Center\n\n(A) ______\n\nFlu season is coming. Protect yourself and your family by getting vaccinated at our walk-in clinic this fall.\n\nWho: Residents aged 65 and older, pregnant women, and children aged 6 months to 13 years\nWhen: October 4 – November 26, Monday to Friday, 9:00 a.m. – 5:00 p.m.\nWhere: Vaccination Room, 2nd floor\nCost: Free for the groups above\n\nPlease note:\n• No appointment is needed, but bring a photo ID or your child's health record booklet.\n• Stay in the waiting area for 20 minutes after your shot.\n• If you have a fever on the day of your visit, please come back after you recover.\n\nResidents who are not in the groups above may get the vaccine for a fee at local clinics.\n\nFor more information, call 555-0177.","opts":["Home Remedies for the Flu","Free Flu Shots Available This Fall","New Opening Hours for the Health Center","Flu Cases Drop Sharply Across the County"],"ans":1,"exp":"보건소가 올가을 65세 이상 주민, 임신부, 어린이에게 독감 예방접종을 무료로 해 준다는 것을 대상, 기간, 장소와 함께 알리는 글이므로 '올가을 무료 독감 예방접종'이 제목으로 알맞다. 집에서 독감을 다스리는 법, 보건소 운영 시간 변경, 독감 환자 감소는 글에 나오지 않는다."},
{"id":"e204","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nHarlow County Public Health Center\n\n(A) ______\n\nFlu season is coming. Protect yourself and your family by getting vaccinated at our walk-in clinic this fall.\n\nWho: Residents aged 65 and older, pregnant women, and children aged 6 months to 13 years\nWhen: October 4 – November 26, Monday to Friday, 9:00 a.m. – 5:00 p.m.\nWhere: Vaccination Room, 2nd floor\nCost: Free for the groups above\n\nPlease note:\n• No appointment is needed, but bring a photo ID or your child's health record booklet.\n• Stay in the waiting area for 20 minutes after your shot.\n• If you have a fever on the day of your visit, please come back after you recover.\n\nResidents who are not in the groups above may get the vaccine for a fee at local clinics.\n\nFor more information, call 555-0177.","opts":["임신부는 무료로 접종받을 수 있다.","접종은 월요일부터 금요일까지 한다.","예약하지 않고 방문해도 된다.","접종 당일에 열이 있어도 접종받을 수 있다."],"ans":3,"exp":"방문하는 날 열이 있으면 나은 뒤에 다시 오라고(\"please come back after you recover\") 했으므로 열이 있어도 접종받을 수 있다는 말은 글과 다르다. 임신부는 무료 대상에 들어 있고, 접종은 월요일부터 금요일까지이며, 예약은 필요 없다고 했다."},
{"id":"e205","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nRiverton Office of Emergency Management\n\n(A) ______\n\nA heat advisory is in effect for Riverton from Tuesday through Friday. Temperatures are expected to reach 36°C in the afternoon. The city has opened cooling centers where anyone can rest in air-conditioned rooms free of charge.\n\nLocations and hours:\n■ Riverton Senior Center: 10:00 a.m. – 8:00 p.m.\n■ Eastside Community Hall: 10:00 a.m. – 8:00 p.m.\n■ Central Library: 9:00 a.m. – 9:00 p.m.\n\nCold drinking water is provided at all centers. Pets are welcome only at Eastside Community Hall and must be kept on a leash.\n\nStay safe:\n■ Avoid outdoor work between noon and 5:00 p.m.\n■ Drink water often, even if you do not feel thirsty.\n■ Check on elderly neighbors who live alone.\n\nIf someone shows signs of heatstroke, call for emergency help immediately.","opts":["Senior Center Closed for Repairs","Energy-Saving Tips for Hot Summer Days","Cooling Centers Open During Heat Advisory","Summer Festival Schedule at Riverton Parks"],"ans":2,"exp":"폭염 주의보가 내려진 동안 누구나 쉴 수 있는 무더위 쉼터를 열었다는 것과 그 장소, 시간, 안전 수칙을 알리는 글이므로 '폭염 주의보 기간에 무더위 쉼터 운영'이 제목으로 알맞다. 노인 센터 휴관, 에너지 절약 요령, 여름 축제 일정은 글의 내용이 아니다."},
