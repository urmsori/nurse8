{"id":"c85","subj":"지역사회간호","unit":"환경보건","q":"다음 식중독의 원인으로 가장 가능성이 큰 것은?\n\n손에 곪은 상처가 있는 조리자가 만든 김밥을 먹고 3시간쯤 뒤에 여러 사람이 심한 구토와 복통을 일으켰다. 열은 거의 없었다.","opts":["살모넬라 식중독","장염비브리오 식중독","황색포도알균 식중독","보툴리누스 식중독"],"ans":2,"exp":"황색포도알균 식중독은 화농성 상처의 균이 음식에서 만든 장독소 때문에 생기는 독소형 식중독으로, 잠복기가 평균 3시간으로 짧고 구토가 심하며 열은 거의 없다. 살모넬라와 장염비브리오 식중독은 감염형으로 잠복기가 더 길고 열이 나며, 보툴리누스 식중독은 신경 마비 증상이 특징이다."},
{"id":"c86","subj":"지역사회간호","unit":"환경보건","q":"감각온도(실효온도)를 결정하는 세 가지 요소가 아닌 것은?","opts":["기온","기습","기류","복사열"],"ans":3,"exp":"감각온도는 기온, 기습(습도), 기류의 세 요소가 어우러져 사람이 느끼는 온도이다. 복사열은 여기에 더해 4대 온열 요소를 이루지만 감각온도의 요소는 아니다."},
{"id":"c87","subj":"지역사회간호","unit":"인구","q":"생산연령 인구가 많이 들어오는 도시 지역에서 나타나며, 15~49세 인구가 전체 인구의 50%를 넘는 인구 구조 유형은?","opts":["별형","호로형(표주박형)","종형","항아리형"],"ans":0,"exp":"별형은 생산연령 인구가 유입되는 도시형 인구 구조이다. 호로형은 생산연령 인구가 빠져나가는 농촌형이고, 종형은 출생률과 사망률이 모두 낮은 인구 정지형, 항아리형은 출생률이 사망률보다 낮은 인구 감퇴형이다."},
{"id":"c88","subj":"지역사회간호","unit":"인구","q":"어느 지역의 인구가 다음과 같다. 노령화지수는?\n\n0~14세: 200명\n15~64세: 1,000명\n65세 이상: 300명","opts":["30","50","약 67","150"],"ans":3,"exp":"노령화지수는 65세 이상 인구를 0~14세 인구로 나누고 100을 곱한 값이다. 300 ÷ 200 × 100 = 150. 30은 노년부양비(300 ÷ 1,000 × 100)이고, 50은 총부양비((200 + 300) ÷ 1,000 × 100)이다."},
{"id":"c89","subj":"지역사회간호","unit":"인구","q":"블래커(Blacker)의 인구 성장 5단계 중 사망률이 낮은 수준에 머무는 가운데 출생률이 떨어지기 시작하여 인구 증가 속도가 둔해지는 단계는?","opts":["고위정지기","초기확장기","후기확장기","저위정지기"],"ans":2,"exp":"후기확장기는 낮은 사망률에 출생률 감소가 더해져 인구 증가가 둔해지는 단계이다. 고위정지기는 출생률과 사망률이 모두 높은 단계, 초기확장기는 출생률은 높은데 사망률이 떨어져 인구가 빠르게 느는 단계, 저위정지기는 출생률과 사망률이 모두 가장 낮아 인구 증가가 멈추는 단계이다."},
{"id":"c90","subj":"지역사회간호","unit":"모자보건","q":"A 지역의 한 해 자료가 다음과 같다. 알파 인덱스(α-index)는?\n\n출생아 수: 2,000명\n영아 사망자 수: 20명\n신생아 사망자 수: 16명","opts":["0.8","1.25","8","10"],"ans":1,"exp":"알파 인덱스는 영아 사망자 수를 신생아 사망자 수로 나눈 값이다. 20 ÷ 16 = 1.25. 값이 1에 가까울수록 영아 사망의 대부분이 예방하기 어려운 신생아기 사망이라는 뜻이어서 보건 수준이 높다고 본다. 10은 출생아 1,000명당 영아사망률, 8은 신생아사망률이다."},
{"id":"c91","subj":"지역사회간호","unit":"모자보건","q":"모성사망비를 구할 때 분모로 쓰는 것은?","opts":["연간 출생아 수","가임기(15~49세) 여성 수","연간 임신 건수","연앙인구"],"ans":0,"exp":"모성사망비는 임신·분만·산욕 합병증으로 인한 모성 사망자 수를 그해 출생아 수로 나눈 값으로, 보통 출생아 10만 명당으로 나타낸다. 가임기 여성 수를 분모로 하면 모성사망률이 된다."},
{"id":"c92","subj":"지역사회간호","unit":"모자보건","q":"「모자보건법」상 \"임산부\"의 정의로 옳은 것은?","opts":["임신 중인 여성만을 말한다","임신 중이거나 분만 후 6주 미만인 여성","임신 중이거나 분만 후 6개월 미만인 여성","임신 중이거나 분만 후 1년 미만인 여성"],"ans":2,"exp":"「모자보건법」에서 임산부는 임신 중이거나 분만 후 6개월 미만인 여성을 말한다. 같은 법에서 영유아는 출생 후 6년 미만인 사람, 신생아는 출생 후 28일 이내의 영유아이다."},
{"id":"c93","subj":"지역사회간호","unit":"가정간호","q":"의료기관 가정간호 사업에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 근거하여 보건소가 직접 운영한다","장기요양 등급을 받은 노인만 이용할 수 있다","비용은 모두 노인장기요양보험에서 지급한다","의사나 한의사의 의뢰에 따라 가정전문간호사가 수행한다"],"ans":3,"exp":"의료기관 가정간호는 「의료법」에 근거하며, 의사나 한의사가 가정에서 계속 치료와 관리가 필요하다고 판단하여 의뢰한 환자에게 가정전문간호사가 제공하고 건강보험이 적용된다. 보건소가 운영하는 것은 방문건강관리 사업이고, 장기요양 등급자에게 장기요양보험으로 제공하는 것은 방문간호이다."},
{"id":"c94","subj":"지역사회간호","unit":"방문건강관리","q":"간호사가 대상자의 집을 찾아가는 가정방문 활동의 장점으로 옳은 것은?","opts":["대상자의 가정 환경과 생활 모습을 직접 보고 그 상황에 맞는 간호와 교육을 할 수 있다","같은 건강 문제를 가진 대상자들이 한자리에 모여 서로 경험을 나눌 수 있다","다른 간호 수단보다 간호사의 시간과 비용이 적게 든다","여러 전문 인력과 다양한 기구·시설을 한곳에서 활용하기 쉽다"],"ans":0,"exp":"가정방문은 대상자의 실제 생활 환경을 살펴 가족의 상황에 맞는 간호와 교육을 할 수 있고, 거동이 불편한 대상자도 서비스를 받을 수 있으며, 대상자가 편안한 분위기에서 이야기할 수 있다는 장점이 있다. 반면 시간과 비용이 많이 들고, 같은 문제를 가진 사람들과 경험을 나누기 어려우며, 전문 인력과 기구·시설을 활용하기 어렵다. 나머지 세 선지는 건강관리실(클리닉) 활동의 장점이다."},
{"id":"c95","subj":"지역사회간호","unit":"사례관리","q":"사례관리의 원칙 중 대상자의 요구 변화를 계속 점검하면서 서비스가 끊기지 않고 이어지도록 하는 것은?","opts":["개별성","포괄성","지속성","책임성"],"ans":2,"exp":"지속성은 한 번의 서비스로 끝내지 않고 점검과 재사정을 되풀이하며 서비스를 이어 가는 원칙이다. 개별성은 대상자마다 다른 요구에 맞추는 것, 포괄성은 대상자의 다양한 요구를 두루 충족하는 것, 책임성은 사례관리자가 서비스 전 과정을 책임지는 것이다."},
{"id":"c96","subj":"지역사회간호","unit":"노인보건","q":"노인의 수단적 일상생활 수행능력(IADL)을 사정하는 항목은?","opts":["목욕하기","옷 입기","화장실 사용하기","대중교통 이용하기"],"ans":3,"exp":"IADL은 지역사회에서 독립적으로 살아가는 데 필요한 좀 더 복잡한 활동으로 교통수단 이용, 물건 사기, 금전 관리, 전화 사용, 식사 준비 등이 해당한다. 목욕하기, 옷 입기, 화장실 사용하기는 기본적인 자기 돌봄 능력인 일상생활 수행능력(ADL) 항목이다."},
{"id":"c97","subj":"지역사회간호","unit":"재난간호","q":"재난 관리 단계 중 다음 활동이 이루어지는 단계는?\n\n재난 대응 계획을 세우고 비상 연락망을 정비한다.\n구호 물자를 비축하고 모의 훈련을 한다.","opts":["예방·완화 단계","대비 단계","대응 단계","복구 단계"],"ans":1,"exp":"대비 단계는 재난이 일어났을 때 곧바로 대응할 수 있도록 계획, 훈련, 물자, 연락 체계를 미리 갖추는 단계이다. 예방·완화 단계는 위험 요인을 찾아 줄이는 단계이고, 대응 단계는 재난 발생 뒤 구조와 중증도 분류, 응급 처치를 하는 단계, 복구 단계는 피해를 회복하는 단계이다."},
{"id":"c98","subj":"지역사회간호","unit":"재난간호","q":"다수 사상자가 발생한 재난 현장에서 다음 환자에게 붙일 중증도 분류표의 색은?\n\n의식이 흐리고 호흡이 분당 36회로 빠르며, 요골 맥박이 약하고 피부가 차고 축축하다. 즉시 처치하면 살 가능성이 높다.","opts":["적색","황색","녹색","흑색"],"ans":0,"exp":"쇼크와 호흡 곤란으로 생명이 위태롭지만 즉시 처치하면 살 수 있는 환자는 긴급 환자로 적색이다. 황색은 처치가 몇 시간 늦어져도 생명에 지장이 없는 응급 환자, 녹색은 걸을 수 있는 경상 환자, 흑색은 사망하였거나 생존 가능성이 없는 환자이다."},
{"id":"c99","subj":"지역사회간호","unit":"재난간호","q":"「재난 및 안전관리 기본법」상 사회재난에 해당하는 것은?","opts":["태풍","지진","황사","감염병의 확산"],"ans":3,"exp":"사회재난은 화재, 붕괴, 폭발, 교통사고, 환경오염 사고와 감염병·가축전염병의 확산 등으로 인한 피해를 말한다. 태풍, 지진, 황사는 자연 현상으로 생기는 자연재난이다."},
{"id":"c100","subj":"지역사회간호","unit":"국제보건","q":"유엔의 지속가능발전목표(SDGs)에 대한 설명으로 옳은 것은?","opts":["2000년부터 2015년까지 추진한 8개 목표이다","개발도상국에만 적용하는 목표이다","2030년까지 달성하려는 17개 목표로 이루어져 있다","보건 분야의 목표는 들어 있지 않다"],"ans":2,"exp":"지속가능발전목표는 2016년부터 2030년까지 모든 나라가 함께 추진하는 17개 목표이며, 세 번째 목표가 건강과 복지이다. 2000년부터 2015년까지 추진한 8개 목표는 새천년개발목표(MDGs)이다."},
{"id":"k01","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["__오랫만에__ 친구를 만났다.","__며칠__ 동안 푹 쉬었다.","저녁 먹고 __설겆이__를 했다.","__일찌기__ 길을 떠났다."],"ans":1,"exp":"\"며칠\"이 옳은 표기이다. \"몇 일\"로 적지 않는다. 나머지는 \"오랜만에\", \"설거지\", \"일찍이\"로 적어야 한다."},
{"id":"k02","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["먹을만큼 먹었다.","떠난 지 오래다.","나 만큼 해 봐라.","집에서 부터 걸었다."],"ans":1,"exp":"시간의 경과를 나타내는 \"지\"는 의존 명사이므로 \"떠난 지\"로 띄어 쓴다. 관형어 뒤의 \"만큼\"은 의존 명사라 \"먹을 만큼\"으로 띄어 쓰고, 체언 뒤의 \"만큼\"은 조사라 \"나만큼\"으로 붙여 쓴다. 조사는 겹쳐도 붙여 쓰므로 \"집에서부터\"가 옳다."},
{"id":"k03","subj":"국어","unit":"표준 발음","q":"\"밟다\"의 표준 발음은?","opts":["[발따]","[밥따]","[발다]","[밥다]"],"ans":1,"exp":"겹받침 ㄼ은 보통 [ㄹ]로 발음하지만(여덟[여덜], 넓다[널따]), \"밟-\"은 자음 앞에서 예외적으로 [밥]으로 발음한다. 따라서 밟다[밥따], 밟고[밥꼬], 밟지[밥찌]이다."},
{"id":"k04","subj":"국어","unit":"한자성어","q":"속담 \"쇠귀에 경 읽기\"와 뜻이 통하는 한자성어는?","opts":["우이독경(牛耳讀經)","새옹지마(塞翁之馬)","조삼모사(朝三暮四)","각주구검(刻舟求劍)"],"ans":0,"exp":"우이독경은 아무리 가르치고 일러 주어도 알아듣지 못함을 뜻한다. 새옹지마는 인생의 길흉화복은 예측하기 어렵다는 뜻, 조삼모사는 간사한 꾀로 남을 속임, 각주구검은 융통성 없이 낡은 생각을 고집함을 뜻한다."},
{"id":"k05","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["일이 뜻대로 __되서__ 기쁘다.","그럼 내일 다시 __뵈요__.","나갈 때 문을 꼭 __잠궈라__.","어제 김치를 __담가__ 두었다."],"ans":3,"exp":"\"담그다\"는 \"담가, 담가서\"로 활용하므로 \"담가\"가 옳다(\"담궈\"는 틀린 표기). \"되어서\"의 준말은 \"돼서\", \"뵈어요\"의 준말은 \"봬요\"이고, \"잠그다\"의 명령형은 \"잠가라\"이다."},
{"id":"k06","subj":"국어","unit":"맞춤법","q":"사이시옷의 표기가 옳은 것은?","opts":["등굣길","갯수","촛점","뒷풀이"],"ans":0,"exp":"\"등굣길\"은 한자어 \"등교\"와 고유어 \"길\"이 합쳐지고 뒷말이 된소리로 나므로 사이시옷을 적는다. 한자어끼리 합쳐진 말은 \"곳간, 셋방, 숫자, 찻간, 툇간, 횟수\" 여섯 개만 사이시옷을 적으므로 \"개수, 초점\"이 옳다. 뒷말의 첫소리가 본래 거센소리이면 사이시옷을 적지 않으므로 \"뒤풀이\"가 옳다."},
{"id":"k07","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["숨기지 말고 __솔직이__ 말해 줘.","__틈틈히__ 운동을 한다.","방을 __깨끗이__ 치웠다.","서류를 __꼼꼼이__ 살폈다."],"ans":2,"exp":"\"깨끗이\"처럼 \"-하다\"가 붙는 어근의 끝소리가 ㅅ이면 \"-이\"로 적는다. \"솔직히, 꼼꼼히\"는 끝소리가 분명히 [히]로 나므로 \"-히\"로 적고, \"틈틈이\"는 같은 말이 겹친 명사 뒤이므로 \"-이\"로 적는다."},
{"id":"k08","subj":"국어","unit":"맞춤법","q":"밑줄 친 부분이 어법에 맞는 것은?","opts":["얼마나 __춥든지__ 손이 다 얼었다.","__가든지 오든지__ 마음대로 해라.","학생__으로써__ 할 일을 다했다.","대화__로서__ 갈등을 풀었다."],"ans":1,"exp":"선택을 나타낼 때는 \"-든지\"를 쓰므로 \"가든지 오든지\"가 옳다. 지난 일을 돌이켜 말할 때는 \"-던지\"를 써서 \"춥던지\"로 적는다. 자격을 나타낼 때는 \"(으)로서\"(학생으로서), 수단이나 도구를 나타낼 때는 \"(으)로써\"(대화로써)를 쓴다."},
{"id":"k09","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 쓰임이 옳은 것은?","opts":["우체국에서 소포를 __부쳤다__.","퀴즈의 정답을 모두 __맞췄다__.","고무줄을 길게 __늘렸다__.","비가 와서 우산을 __받혀__ 들었다."],"ans":0,"exp":"편지나 물건을 보낼 때는 \"부치다\"를 쓴다. 정답을 골라낼 때는 \"맞히다\"(맞혔다), 길이를 길게 할 때는 \"늘이다\"(늘였다), 우산을 펴 들 때는 \"받치다\"(받쳐)가 옳다. \"늘리다\"는 수나 양을 많게 할 때, \"맞추다\"는 둘을 나란히 놓고 비교할 때 쓴다."},
{"id":"k10","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["올해 __합격율__이 크게 올랐다.","점수를 __백분률__로 나타냈다.","남녀의 __비률__이 비슷하다.","이번 달 __출석률__이 가장 높다."],"ans":3,"exp":"\"率\"은 모음이나 ㄴ 받침 뒤에서는 \"율\"로, 그 밖의 받침 뒤에서는 \"률\"로 적는다. 따라서 \"출석률, 합격률\"과 \"백분율, 비율\"이 옳다."},
{"id":"k11","subj":"국어","unit":"맞춤법","q":"준말의 표기가 옳지 않은 것은?","opts":["생각하건대 → 생각건대","간편하게 → 간편케","넉넉하지 않다 → 넉넉치 않다","연구하도록 → 연구토록"],"ans":2,"exp":"\"하\" 앞의 받침이 ㄱ, ㄷ, ㅂ처럼 안울림소리이면 \"하\"가 통째로 줄므로 \"넉넉지 않다\", \"생각건대\"로 적는다. \"하\" 앞이 모음이나 울림소리(ㄴ, ㄹ, ㅁ, ㅇ)이면 ㅏ만 줄고 ㅎ이 뒤의 소리와 어울려 거센소리가 되므로 \"간편케\", \"연구토록\"이 된다."},
{"id":"k12","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["그는 소문난 __멋장이__이다.","벽을 바르려고 __미장이__를 불렀다.","동생은 __욕심장이__이다.","__대장쟁이__가 쇠를 달군다."],"ans":1,"exp":"기술을 가진 사람에게는 \"-장이\"를, 그 밖의 경우에는 \"-쟁이\"를 붙인다. 벽에 흙이나 시멘트를 바르는 기술자는 \"미장이\", 쇠를 다루는 기술자는 \"대장장이\"이고, 기술과 관계없는 말은 \"멋쟁이\", \"욕심쟁이\"로 적는다."},
{"id":"k13","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["그럴 수 밖에 없었다.","믿을 사람은 너 뿐이다.","아는 대로 말해라.","집채 만한 파도가 인다."],"ans":2,"exp":"관형어 \"아는\" 뒤의 \"대로\"는 의존 명사이므로 띄어 쓴다. \"밖에\", \"뿐\"이 체언 뒤에 오면 조사이므로 \"수밖에\", \"너뿐이다\"로 붙여 쓴다. \"만\"은 조사, \"한\"은 \"하다\"의 활용형이므로 \"집채만 한\"으로 쓴다."},
{"id":"k14","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳지 않은 것은?","opts":["소 한 마리를 샀다.","나이가 스물 다섯 살이다.","삼천사백오십육만 원을 모았다.","차 두 대가 서 있다."],"ans":1,"exp":"수를 적을 때는 만 단위로 띄어 쓰므로 \"스물다섯\"은 붙여 써서 \"스물다섯 살\"로 적는다. 단위를 나타내는 의존 명사 \"마리, 원, 대, 살\"은 앞말과 띄어 쓴다."},
{"id":"k15","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["비가 오는데 우산이 없다.","그 일을 끝내는데 사흘이 걸렸다.","머리 아픈데 먹는 약이다.","이제는 갈데가 없다."],"ans":0,"exp":"\"-는데\"가 뒤 내용의 배경을 나타내는 연결 어미일 때는 붙여 쓴다. \"일, 경우, 곳\"을 뜻하는 \"데\"는 의존 명사이므로 \"끝내는 데\", \"아픈 데\", \"갈 데\"로 띄어 쓴다. 뒤에 조사 \"에\"를 넣어 말이 되면 의존 명사이다."},
{"id":"k16","subj":"국어","unit":"표준어","q":"표준어가 아닌 것은?","opts":["삐지다","이쁘다","찰지다","설레이다"],"ans":3,"exp":"\"설레다\"만 표준어이고 \"설레이다\"는 표준어가 아니다(명사형도 \"설렘\"). \"삐지다\"(2014년), \"이쁘다\"와 \"찰지다\"(2015년)는 각각 \"삐치다\", \"예쁘다\", \"차지다\"와 함께 쓰는 표준어로 인정되었다."},
{"id":"k17","subj":"국어","unit":"표준어","q":"밑줄 친 말이 표준어인 것은?","opts":["__윗어른__께 인사를 드렸다.","외양간에 __숫소__가 있다.","__수캉아지__ 한 마리를 얻었다.","토끼가 __깡총깡총__ 뛴다."],"ans":2,"exp":"\"수캉아지\"는 접두사 \"수-\" 뒤에서 거센소리를 인정한 표준어이다(수캐, 수탉, 수평아리 등). 위아래의 짝이 없는 말은 \"웃-\"을 쓰므로 \"웃어른\", 수컷은 \"수-\"로 통일하므로 \"수소\"(숫양, 숫염소, 숫쥐만 \"숫-\"), 모음조화가 깨진 형태가 굳어진 \"깡충깡충\"이 표준어이다."},
{"id":"k18","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["맑게[말께]","읊고[읍꼬]","닭을[다글]","넓죽하다[넙쭈카다]"],"ans":2,"exp":"겹받침 뒤에 모음으로 시작하는 조사가 오면 뒤의 자음을 다음 음절로 옮겨 발음하므로 \"닭을\"은 [달글]이다. ㄺ은 ㄱ 앞에서 [ㄹ]로 발음하여 맑게[말께], ㄿ은 [ㅂ]으로 발음하여 읊고[읍꼬]이고, \"넓죽하다\"는 예외적으로 [넙]으로 발음한다."},
{"id":"k19","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["난로[난노]","의견란[의견난]","대관령[대괄령]","생산량[생산냥]"],"ans":0,"exp":"ㄴ은 ㄹ의 앞이나 뒤에서 [ㄹ]로 발음하므로 \"난로\"는 [날로], \"대관령\"은 [대괄령]이다. 다만 \"의견란, 생산량\"처럼 ㄴ으로 끝나는 한자어에 ㄹ로 시작하는 말이 덧붙은 일부 낱말은 ㄹ을 [ㄴ]으로 발음한다."},
{"id":"k20","subj":"국어","unit":"표준 발음","q":"표준 발음으로 인정되지 않는 것은?","opts":["희망[히망]","의사[으사]","주의[주이]","우리의[우리에]"],"ans":1,"exp":"낱말의 첫음절 \"의\"는 반드시 [ㅢ]로 발음하므로 \"의사\"는 [의사]이다. 자음을 첫소리로 가진 \"ㅢ\"는 [ㅣ]로 발음하고(희망[히망]), 첫음절이 아닌 \"의\"는 [ㅣ]로, 조사 \"의\"는 [ㅔ]로 발음하는 것도 허용한다."},
{"id":"k21","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 옳은 것은?","opts":["메세지","악세사리","쥬스","리더십"],"ans":3,"exp":"\"리더십\"이 옳다. 영어의 [ʃ]는 낱말 끝에서 \"시\"로 적는다. 나머지는 \"메시지\", \"액세서리\", \"주스\"로 적는다. 외래어에서는 ㅈ, ㅊ 뒤에 \"ㅑ, ㅕ, ㅛ, ㅠ\"를 쓰지 않는다."},
{"id":"k22","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 옳지 않은 것은?","opts":["바베큐","초콜릿","소시지","케이크"],"ans":0,"exp":"\"barbecue\"는 \"바비큐\"로 적는다. \"초콜릿\", \"소시지\", \"케이크\"는 옳은 표기이며, 흔히 \"초콜렛\", \"소세지\", \"케익\"으로 잘못 적는다."},
{"id":"k23","subj":"국어","unit":"로마자 표기","q":"국어의 로마자 표기가 옳은 것은?","opts":["종로 Jongro","독립문 Dongnimmun","신라 Sinla","속리산 Sokrisan"],"ans":1,"exp":"로마자 표기는 표준 발음에 따라 적는다. 독립문[동님문]은 Dongnimmun이다. 종로[종노]는 Jongno, 신라[실라]는 Silla, 속리산[송니산]은 Songnisan으로 적는다."},
{"id":"k24","subj":"국어","unit":"로마자 표기","q":"국어의 로마자 표기가 옳지 않은 것은?","opts":["울릉 Ulleung","경복궁 Gyeongbokgung","묵호 Mukho","압구정 Apggujeong"],"ans":3,"exp":"된소리되기는 로마자 표기에 반영하지 않으므로 압구정[압꾸정]은 Apgujeong으로 적는다. ㄹㄹ은 ll로 적고(Ulleung), 체언에서 ㄱ, ㄷ, ㅂ 뒤에 ㅎ이 올 때는 ㅎ을 밝혀 적는다(Mukho)."},
{"id":"k25","subj":"국어","unit":"음운","q":"\"국물[궁물]\"과 같은 종류의 음운 변동이 일어나는 것은?","opts":["좋아[조아]","솜이불[솜니불]","밥만[밤만]","축하[추카]"],"ans":2,"exp":"\"국물\"은 ㄱ이 비음 ㅁ 앞에서 비음 ㅇ으로 바뀌는 비음화(교체)이다. \"밥만\"도 ㅂ이 ㅁ 앞에서 ㅁ으로 바뀌는 비음화이다. \"좋아\"는 ㅎ 탈락, \"솜이불\"은 ㄴ 첨가, \"축하\"는 ㄱ과 ㅎ이 ㅋ으로 줄어드는 축약이다."},
{"id":"k26","subj":"국어","unit":"음운","q":"\"꽃잎[꼰닙]\"을 발음할 때 일어나는 음운 변동이 아닌 것은?","opts":["음절의 끝소리 규칙","ㄴ 첨가","비음화","구개음화"],"ans":3,"exp":"\"꽃잎\"은 받침 ㅊ과 ㅍ이 각각 ㄷ, ㅂ으로 바뀌고(음절의 끝소리 규칙), \"잎\" 앞에 ㄴ이 덧나며(ㄴ 첨가), 그 ㄴ 앞에서 ㄷ이 ㄴ으로 바뀐다(비음화). 구개음화는 ㄷ, ㅌ이 모음 ㅣ 앞에서 ㅈ, ㅊ으로 바뀌는 현상으로 여기서는 일어나지 않는다."},
{"id":"k27","subj":"국어","unit":"음운","q":"소리 나는 위치가 같은 자음끼리 묶은 것은?","opts":["ㄱ, ㅋ, ㅇ","ㄴ, ㅁ, ㅇ","ㅂ, ㄷ, ㄱ","ㅅ, ㅈ, ㅎ"],"ans":0,"exp":"ㄱ, ㅋ, ㅇ은 모두 혀의 뒷부분과 여린입천장 사이에서 나는 여린입천장소리(연구개음)이다. ㄴ, ㅁ, ㅇ은 소리 내는 방법이 같은 비음이고 위치는 서로 다르다. ㅂ은 입술, ㄷ과 ㅅ은 잇몸, ㅈ은 센입천장, ㅎ은 목청에서 난다."},
{"id":"k28","subj":"국어","unit":"품사","q":"밑줄 친 단어의 품사가 나머지 셋과 다른 것은?","opts":["__새__ 옷을 입었다.","__예쁜__ 꽃이 피었다.","__옛__ 친구를 만났다.","__온갖__ 꽃이 피었다."],"ans":1,"exp":"\"예쁜\"은 형용사 \"예쁘다\"의 활용형으로, 관형어 구실을 하지만 품사는 형용사이다. \"새, 옛, 온갖\"은 형태가 바뀌지 않고 체언만 꾸미는 관형사이다."},
{"id":"k29","subj":"국어","unit":"품사","q":"밑줄 친 말이 수사인 것은?","opts":["__한__ 사람도 오지 않았다.","__세__ 번이나 전화했다.","__여러__ 나라를 다녔다.","학생 __둘__이 찾아왔다."],"ans":3,"exp":"\"둘\"은 뒤에 조사 \"이\"가 붙어 수량을 나타내는 수사이다. \"한, 세, 여러\"는 뒤에 오는 체언을 꾸미는 관형사이며 조사가 붙지 못한다."},
{"id":"k30","subj":"국어","unit":"단어 형성","q":"파생어인 것은?","opts":["풋사과","돌다리","밤낮","작은집"],"ans":0,"exp":"\"풋사과\"는 \"덜 익은\"의 뜻을 더하는 접두사 \"풋-\"과 어근 \"사과\"가 합쳐진 파생어이다. \"돌다리, 밤낮, 작은집\"은 어근과 어근이 합쳐진 합성어이다."},
{"id":"k31","subj":"국어","unit":"단어 형성","q":"비통사적 합성어인 것은?","opts":["큰집","첫사랑","돌아가다","덮밥"],"ans":3,"exp":"\"덮밥\"은 용언의 어간 \"덮-\"이 관형사형 어미 없이 명사에 바로 붙었으므로 우리말의 일반적인 문장 구성 방식과 다른 비통사적 합성어이다. \"큰집\"(관형사형+명사), \"첫사랑\"(관형사+명사), \"돌아가다\"(연결 어미로 이어진 용언)는 통사적 합성어이다."},
{"id":"k32","subj":"국어","unit":"형태소","q":"\"나는 밥을 먹었다.\"에서 실질 형태소이면서 의존 형태소인 것은?","opts":["나","밥","먹-","-었-"],"ans":2,"exp":"\"먹-\"은 구체적인 동작의 뜻을 가진 실질 형태소이지만 어미 없이 혼자 쓰이지 못하는 의존 형태소이다. \"나, 밥\"은 실질 형태소이면서 자립 형태소이고, \"-었-\"은 문법적 뜻만 가진 형식 형태소이면서 의존 형태소이다."},
{"id":"k33","subj":"국어","unit":"용언의 활용","q":"규칙 활용을 하는 용언은?","opts":["(짐을) 싣다","(옷을) 벗다","(병이) 낫다","(물이) 흐르다"],"ans":1,"exp":"\"벗다\"는 \"벗어, 벗으니\"처럼 어간과 어미의 모양이 바뀌지 않는 규칙 활용을 한다. \"싣다\"는 \"실어\"(ㄷ 불규칙), \"낫다\"는 \"나아\"(ㅅ 불규칙), \"흐르다\"는 \"흘러\"(르 불규칙)로 활용한다."},
{"id":"k34","subj":"국어","unit":"조사","q":"밑줄 친 조사의 쓰임이 나머지 셋과 다른 것은?","opts":["아침에 빵__과__ 우유를 먹었다.","봄에는 개나리__와__ 진달래가 핀다.","서점에서 책__과__ 공책을 샀다.","그는 아버지__와__ 많이 닮았다."],"ans":3,"exp":"\"아버지와 닮았다\"의 \"와\"는 비교의 대상을 나타내는 부사격 조사이다. 나머지의 \"와/과\"는 두 체언을 같은 자격으로 이어 주는 접속 조사이다."},
{"id":"k35","subj":"국어","unit":"문장 성분","q":"밑줄 친 부분의 문장 성분이 나머지 셋과 다른 것은?","opts":["물이 __얼음이__ 되었다.","물이 __얼음으로__ 되었다.","그는 __학생이__ 아니다.","동생이 벌써 __어른이__ 되었다."],"ans":1,"exp":"\"되다, 아니다\" 앞에서 조사 \"이/가\"가 붙어 뜻을 보충하는 말은 보어이다. \"얼음으로\"는 부사격 조사 \"으로\"가 붙은 부사어이다."},
{"id":"k36","subj":"국어","unit":"안은문장","q":"명사절을 안은 문장은?","opts":["나는 그가 오기를 기다렸다.","그가 읽은 책은 재미있다.","비가 소리도 없이 내린다.","토끼는 앞발이 짧다."],"ans":0,"exp":"\"그가 오기\"는 명사형 어미 \"-기\"가 붙어 목적어 구실을 하는 명사절이다. \"그가 읽은\"은 관형절, \"소리도 없이\"는 부사절, \"앞발이 짧다\"는 서술절이다."},
{"id":"k37","subj":"국어","unit":"피동 표현","q":"피동 표현이 바르게 쓰인 문장은?","opts":["그의 이름은 곧 잊혀졌다.","칠판에 글씨가 쓰여 있다.","그렇게 보여진다고 한다.","종이가 둘로 나뉘어졌다."],"ans":1,"exp":"\"쓰여\"는 \"쓰다\"에 피동 접미사 \"-이-\"가 한 번만 붙은 바른 표현이다. \"잊혀지다, 보여지다, 나뉘어지다\"는 피동 접미사가 붙은 말에 \"-어지다\"가 또 붙은 이중 피동이므로 \"잊혔다, 보인다고, 나뉘었다\"로 고쳐야 한다."},
{"id":"k38","subj":"국어","unit":"사동 표현","q":"사동 표현이 쓰이지 않은 문장은?","opts":["엄마가 아이에게 밥을 먹였다.","선생님이 학생에게 책을 읽혔다.","도둑이 경찰에게 잡혔다.","형이 동생을 울렸다."],"ans":2,"exp":"\"잡혔다\"는 주어가 남의 행동을 당하는 것을 나타내는 피동 표현이다. \"먹였다, 읽혔다, 울렸다\"는 주어가 남에게 어떤 행동을 하게 하는 사동 표현이다."},
{"id":"k39","subj":"국어","unit":"높임법","q":"높임 표현이 바르게 쓰인 문장은?","opts":["주문하신 커피 나오셨습니다.","궁금한 점은 저에게 여쭤 보세요.","할머니께서는 귀가 밝으시다.","교장 선생님의 말씀이 계시겠습니다."],"ans":2,"exp":"높일 대상의 신체 일부를 높여 그 사람을 높이는 간접 높임은 \"-시-\"를 쓰므로 \"귀가 밝으시다\"가 옳다. 커피는 높일 대상이 아니므로 \"나왔습니다\", \"여쭈다\"는 말하는 이가 윗사람에게 물을 때 쓰므로 \"물어보세요\", 간접 높임에는 \"계시다\"를 쓰지 않으므로 \"말씀이 있으시겠습니다\"가 옳다."},
{"id":"k40","subj":"국어","unit":"높임법","q":"객체 높임법이 쓰인 문장은?","opts":["나는 어머니를 모시고 갔다.","아버지께서 신문을 보신다.","선생님께서 교실에 계신다.","오늘 날씨가 참 좋습니다."],"ans":0,"exp":"객체 높임법은 목적어나 부사어가 가리키는 대상을 높이는 방법으로, \"모시다, 드리다, 여쭈다, 뵙다\" 같은 특수 어휘를 쓴다. \"보신다, 계신다\"는 주어를 높이는 주체 높임법이고, \"좋습니다\"는 듣는 이를 높이는 상대 높임법이다."},
{"id":"k41","subj":"국어","unit":"문장 고쳐 쓰기","q":"어법에 맞고 자연스러운 문장은?","opts":["내 꿈은 훌륭한 간호사가 되고 싶다.","우리는 자연을 보호하고 순응하며 살아야 한다.","그는 결코 약속을 지키는 사람이다.","비록 형편이 어렵더라도 꿈을 포기하지 않겠다."],"ans":3,"exp":"\"비록\"은 \"-더라도\"와 호응하므로 자연스럽다. \"내 꿈은\"으로 시작한 문장은 주어와 서술어가 호응하도록 \"내 꿈은 훌륭한 간호사가 되는 것이다\"로 고치고, \"순응하며\" 앞에는 빠진 부사어를 넣어 \"자연을 보호하고 자연에 순응하며\"로 고친다. \"결코\"는 부정 표현과 호응하므로 \"결코 약속을 어기지 않는 사람이다\"처럼 써야 한다."},
{"id":"k42","subj":"국어","unit":"문장 고쳐 쓰기","q":"중의적으로 해석되지 않는 문장은?","opts":["나는 어제 학교에서 친구를 만났다.","학생들이 다 오지 않았다.","나는 형과 누나를 만났다.","키가 큰 친구의 동생을 보았다."],"ans":0,"exp":"\"나는 어제 학교에서 친구를 만났다.\"는 한 가지 뜻으로만 읽힌다. \"다 오지 않았다\"는 한 명도 오지 않았다는 뜻과 일부만 왔다는 뜻으로, \"형과 누나를 만났다\"는 형과 함께 누나를 만났다는 뜻과 두 사람을 모두 만났다는 뜻으로 읽힌다. \"키가 큰\"은 친구를 꾸미는지 동생을 꾸미는지 분명하지 않다."},
{"id":"k43","subj":"국어","unit":"한자성어","q":"반딧불과 눈빛으로 글을 읽었다는 고사에서 나온 말로, 고생하면서 꾸준히 공부하여 얻은 보람을 뜻하는 한자성어는?","opts":["형설지공(螢雪之功)","와신상담(臥薪嘗膽)","절차탁마(切磋琢磨)","주경야독(晝耕夜讀)"],"ans":0,"exp":"형설지공은 기름 살 돈이 없어 반딧불과 눈빛에 비추어 글을 읽었다는 차윤과 손강의 고사에서 나왔다. 와신상담은 원수를 갚으려고 괴로움을 참고 견딤, 절차탁마는 학문이나 덕행을 부지런히 닦음, 주경야독은 낮에 농사짓고 밤에 글을 읽음을 뜻한다."},
{"id":"k44","subj":"국어","unit":"한자성어","q":"뜻이 비슷한 한자성어끼리 짝지은 것이 아닌 것은?","opts":["풍전등화(風前燈火) – 누란지위(累卵之危)","수주대토(守株待兔) – 각주구검(刻舟求劍)","금의환향(錦衣還鄕) – 금의야행(錦衣夜行)","막역지우(莫逆之友) – 관포지교(管鮑之交)"],"ans":2,"exp":"금의환향은 출세하여 고향에 돌아옴을 뜻하고, 금의야행은 비단옷을 입고 밤길을 간다는 말로 아무 보람이 없는 행동을 뜻하므로 서로 비슷하지 않다. 풍전등화와 누란지위는 매우 위태로운 형편, 수주대토와 각주구검은 융통성 없는 어리석음, 막역지우와 관포지교는 두터운 우정을 뜻한다."},
{"id":"k45","subj":"국어","unit":"한자성어","q":"빈칸에 들어갈 한자성어로 가장 적절한 것은?\n\n지난 대회에서 예선 탈락의 쓴맛을 본 그 팀은 한 해 동안 실력을 길러 다시 도전하겠다며 ______의 뜻을 다졌다.","opts":["자포자기(自暴自棄)","권토중래(捲土重來)","수수방관(袖手傍觀)","안분지족(安分知足)"],"ans":1,"exp":"권토중래는 한 번 실패한 뒤 힘을 길러 다시 도전함을 뜻한다. 자포자기는 절망하여 자신을 돌보지 않음, 수수방관은 팔짱을 끼고 보고만 있음, 안분지족은 제 분수를 지키며 만족함을 뜻하므로 다시 도전하는 상황에 맞지 않는다."},
{"id":"k46","subj":"국어","unit":"한자성어","q":"밑줄 친 한자성어의 쓰임이 적절하지 않은 것은?","opts":["두 사람은 __견원지간__이라 만나기만 하면 다툰다.","길이 막히는데 __설상가상__으로 눈까지 내렸다.","다른 회사의 실패를 __타산지석__으로 삼았다.","그는 서류를 __주마간산__으로 꼼꼼히 검토했다."],"ans":3,"exp":"주마간산(走馬看山)은 달리는 말 위에서 산을 본다는 뜻으로 자세히 살피지 않고 대충 보고 지나감을 이르므로 \"꼼꼼히 검토했다\"와 어울리지 않는다. 견원지간은 사이가 매우 나쁜 관계, 설상가상은 어려운 일이 겹침, 타산지석은 남의 잘못을 자신을 닦는 데 도움으로 삼음을 뜻한다."},
{"id":"k47","subj":"국어","unit":"속담","q":"\"원인이 없으면 결과가 있을 수 없음\"을 뜻하는 속담은?","opts":["가는 말이 고와야 오는 말이 곱다","소 잃고 외양간 고친다","아니 땐 굴뚝에 연기 날까","바늘 도둑이 소도둑 된다"],"ans":2,"exp":"\"아니 땐 굴뚝에 연기 날까\"는 원인이 있어야 결과가 생긴다는 뜻이다. \"가는 말이 고와야 오는 말이 곱다\"는 내가 남에게 잘해야 남도 내게 잘한다는 뜻, \"소 잃고 외양간 고친다\"는 일을 그르친 뒤에 뉘우쳐도 소용없다는 뜻, \"바늘 도둑이 소도둑 된다\"는 작은 나쁜 버릇이 큰 잘못으로 자란다는 뜻이다."},
{"id":"k48","subj":"국어","unit":"속담","q":"속담과 한자성어의 뜻이 서로 통하지 않는 것은?","opts":["소 잃고 외양간 고친다 – 망양보뢰(亡羊補牢)","달면 삼키고 쓰면 뱉는다 – 감탄고토(甘呑苦吐)","등잔 밑이 어둡다 – 등하불명(燈下不明)","고래 싸움에 새우 등 터진다 – 어부지리(漁夫之利)"],"ans":3,"exp":"어부지리는 둘이 다투는 사이에 제삼자가 힘들이지 않고 이익을 얻음을 뜻한다. 강한 자들의 싸움에 약한 자가 피해를 본다는 \"고래 싸움에 새우 등 터진다\"와 통하는 말은 경전하사(鯨戰蝦死)이다. 나머지는 뜻이 서로 통한다."},
{"id":"k49","subj":"국어","unit":"고유어","q":"고유어의 뜻풀이가 옳지 않은 것은?","opts":["톺아보다: 대강 훑어보다","시나브로: 모르는 사이에 조금씩 조금씩","미쁘다: 믿음성이 있다","곰살궂다: 성질이 부드럽고 친절하다"],"ans":0,"exp":"\"톺아보다\"는 샅샅이 더듬어 가며 살핀다는 뜻이므로 \"대강 훑어보다\"와는 반대에 가깝다. 나머지 뜻풀이는 옳다."},
{"id":"k50","subj":"국어","unit":"단위어","q":"물건을 세는 단위와 그 수량의 연결이 옳지 않은 것은?","opts":["북어 한 쾌: 스무 마리","마늘 한 접: 쉰 개","오징어 한 축: 스무 마리","바늘 한 쌈: 스물네 개"],"ans":1,"exp":"\"접\"은 채소나 과일 따위를 백 개씩 묶어 세는 단위이므로 마늘 한 접은 백 개이다. 쾌는 북어 스무 마리, 축은 오징어 스무 마리, 쌈은 바늘 스물네 개를 이른다."},
{"id":"k51","subj":"국어","unit":"어휘","q":"밑줄 친 \"손\"의 의미가 〈보기〉와 가장 가까운 것은?\n\n〈보기〉 어머니는 __손__이 커서 음식을 늘 넉넉하게 장만하신다.","opts":["__손__이 모자라서 일을 끝내지 못했다.","그 일은 이제 내 __손__을 떠났다.","__손__이 작은 그는 선물도 조금만 샀다.","아이의 __손__을 꼭 잡았다."],"ans":2,"exp":"〈보기〉의 \"손이 크다\"는 씀씀이가 후하다는 뜻이고, \"손이 작다\"는 씀씀이가 깐깐하고 작다는 뜻이므로 둘 다 \"손\"이 씀씀이를 가리킨다. \"손이 모자라다\"의 손은 일하는 사람, \"손을 떠나다\"의 손은 영향력이 미치는 범위, \"손을 잡았다\"의 손은 신체의 일부이다."},
{"id":"k52","subj":"국어","unit":"한자어","q":"밑줄 친 한자어의 쓰임이 옳은 것은?","opts":["카드로 물건값을 __결재__했다.","우리 모임은 회원끼리의 친목을 __지양__한다.","부장에게 서류 __결제__를 받았다.","기간이 끝난 운전면허를 __갱신__했다."],"ans":3,"exp":"계약이나 면허의 기간을 연장하는 일은 \"갱신(更新)\"이다. \"지양(止揚)\"은 어떤 것을 하지 않는다는 뜻이므로, 목표로 삼아 나아간다는 뜻의 \"지향(志向)\"을 써서 \"친목을 지향한다\"로 고쳐야 한다. 대금을 치르는 일은 \"결제(決濟)\", 윗사람이 안건을 승인하는 일은 \"결재(決裁)\"이므로 \"물건값을 결제했다\", \"서류 결재를 받았다\"가 옳다."},
{"id":"k53","subj":"국어","unit":"한자어","q":"밑줄 친 말을 바꿔 쓴 것이 적절하지 않은 것은?","opts":["주민의 의견을 __수렴하다__ → 모으다","사소한 문제를 __간과하다__ → 꿰뚫어 보다","새해 계획을 __수립하다__ → 세우다","교통 법규를 __준수하다__ → 지키다"],"ans":1,"exp":"\"간과(看過)하다\"는 큰 관심 없이 대강 보아 넘긴다는 뜻이므로 \"보아 넘기다\"로 바꿔 써야 한다. \"꿰뚫어 보다\"는 \"간파(看破)하다\"에 해당한다. 나머지는 뜻이 맞게 바꿔 쓴 것이다."},
{"id":"k54","subj":"국어","unit":"의미 관계","q":"두 단어의 의미 관계가 나머지 셋과 다른 것은?","opts":["길다 – 짧다","살다 – 죽다","출석 – 결석","참 – 거짓"],"ans":0,"exp":"\"길다 – 짧다\"는 중간 단계가 있어 둘 다 부정할 수 있는 정도 반의어이다(\"길지도 짧지도 않다\"). 나머지는 한쪽을 부정하면 곧 다른 쪽이 되고 중간 단계가 없는 상보 반의어이다."},
{"id":"k55","subj":"국어","unit":"관용 표현","q":"관용 표현의 뜻풀이가 옳지 않은 것은?","opts":["발이 넓다: 아는 사람이 많아 활동 범위가 넓다","귀가 얇다: 남의 말을 쉽게 받아들인다","입이 무겁다: 말이 많고 수다스럽다","손을 씻다: 나쁜 일에서 관계를 끊는다"],"ans":2,"exp":"\"입이 무겁다\"는 말수가 적거나 비밀을 잘 지킨다는 뜻이다. 말이 많거나 비밀을 잘 지키지 못하는 것은 \"입이 가볍다\"라고 한다. 나머지 뜻풀이는 옳다."},
{"id":"k56","subj":"국어","unit":"한자어","q":"나이를 이르는 말과 그 나이의 연결이 옳지 않은 것은?","opts":["지학(志學): 15세","이립(而立): 30세","불혹(不惑): 40세","이순(耳順): 50세"],"ans":3,"exp":"이순은 60세를 이르는 말이다. 50세는 하늘의 뜻을 안다는 지천명(知天命)이다. 모두 《논어》에서 공자가 자신의 삶을 돌아보며 한 말에서 나왔다."},
{"id":"k57","subj":"국어","unit":"논리","q":"다음 두 진술이 모두 참일 때 반드시 참인 것은?\n\n- 간호사는 모두 면허를 가지고 있다.\n- 면허를 가진 사람은 모두 보수 교육을 받는다.","opts":["보수 교육을 받는 사람은 모두 간호사이다.","보수 교육을 받지 않는 사람은 간호사가 아니다.","면허를 가진 사람은 모두 간호사이다.","간호사가 아닌 사람은 면허를 가지고 있지 않다."],"ans":1,"exp":"두 진술을 이으면 \"간호사는 모두 보수 교육을 받는다\"가 되고, 그 대우인 \"보수 교육을 받지 않는 사람은 간호사가 아니다\"도 반드시 참이다. 나머지는 주어진 진술의 역이나 이에 해당하므로 반드시 참이라고 할 수 없다."},
{"id":"k58","subj":"국어","unit":"논리","q":"갑, 을, 병 세 사람 가운데 한 명이 꽃병을 깼다. 세 사람의 말 가운데 하나만 참일 때, 꽃병을 깬 사람은?\n\n갑: \"을이 깼다.\"\n을: \"나는 깨지 않았다.\"\n병: \"나는 깨지 않았다.\"","opts":["갑","을","병","주어진 말만으로는 알 수 없다"],"ans":2,"exp":"병이 깼다면 갑의 말은 거짓, 을의 말은 참, 병의 말은 거짓이어서 참인 말이 하나뿐이다. 갑이 깼다면 을과 병의 말이 모두 참이 되고, 을이 깼다면 갑과 병의 말이 모두 참이 되어 조건에 맞지 않는다."},
{"id":"k59","subj":"국어","unit":"논리","q":"다음 전제에 하나를 더하여 결론이 반드시 참이 되게 하려고 한다. 더할 전제로 알맞은 것은?\n\n전제: 성실한 사람은 모두 신뢰를 얻는다.\n결론: 어떤 신입 사원은 신뢰를 얻는다.","opts":["어떤 신입 사원은 성실하다.","신뢰를 얻는 사람은 모두 성실하다.","어떤 신입 사원은 성실하지 않다.","성실하지 않은 사람은 모두 신입 사원이다."],"ans":0,"exp":"성실한 신입 사원이 한 명이라도 있으면, 성실한 사람은 모두 신뢰를 얻으므로 그 사람은 신뢰를 얻는다. 나머지 전제는 신입 사원 가운데 성실한 사람이 있다는 것을 보장하지 못하므로 결론을 이끌어 낼 수 없다."},
{"id":"k60","subj":"국어","unit":"논리","q":"A, B, C, D 네 사람이 달리기를 했다. 다음 조건에 따를 때 두 번째로 들어온 사람은? (동시에 들어온 사람은 없다.)\n\n- A는 B보다 먼저 들어왔다.\n- C는 A보다 먼저 들어왔다.\n- D는 B보다 늦게 들어왔다.","opts":["A","B","C","D"],"ans":0,"exp":"조건을 이으면 C가 A보다, A가 B보다, B가 D보다 먼저 들어왔으므로 순서는 C, A, B, D이다. 따라서 두 번째로 들어온 사람은 A이다."},
{"id":"k61","subj":"국어","unit":"논리","q":"다음 논증에 나타난 오류는?\n\n귀신이 없다는 것을 지금까지 아무도 증명하지 못했다. 그러므로 귀신은 있다.","opts":["성급한 일반화의 오류","무지에 호소하는 오류","인신공격의 오류","순환 논증의 오류"],"ans":1,"exp":"거짓이라고 증명되지 않았다는 것을 근거로 참이라고 주장하는 것은 무지에 호소하는 오류이다. 성급한 일반화는 몇몇 사례만으로 전체를 판단하는 것, 인신공격은 주장이 아니라 주장하는 사람을 공격하는 것, 순환 논증은 결론을 전제로 다시 쓰는 것이다."},
{"id":"k62","subj":"국어","unit":"논리","q":"다음 논증을 약화하는 것으로 가장 적절한 것은?\n\n스마트폰을 오래 쓰는 청소년일수록 잠자는 시간이 짧다는 조사 결과가 나왔다. 따라서 스마트폰 사용이 청소년의 수면 부족을 일으킨다.","opts":["스마트폰 사용 시간을 줄이게 한 청소년 집단의 수면 시간이 늘어났다.","스마트폰 화면의 빛이 잠을 부르는 호르몬의 분비를 줄인다.","다른 나라의 조사에서도 같은 결과가 나왔다.","잠이 오지 않는 청소년이 그 시간에 스마트폰을 쓰는 경우가 많았다."],"ans":3,"exp":"잠이 오지 않아서 스마트폰을 쓰는 것이라면 원인과 결과의 방향이 반대이므로, 스마트폰 사용이 수면 부족의 원인이라는 결론이 약해진다. 나머지는 스마트폰 사용이 수면을 줄인다는 주장을 뒷받침하거나 같은 조사 결과를 되풀이할 뿐이다."},
{"id":"k63","subj":"국어","unit":"논리","q":"타당한 추론은?","opts":["독감에 걸리면 열이 난다. 민수는 열이 난다. 따라서 민수는 독감에 걸렸다.","비가 오면 땅이 젖는다. 비가 오지 않았다. 따라서 땅이 젖지 않았다.","비가 오면 땅이 젖는다. 땅이 젖지 않았다. 따라서 비가 오지 않았다.","합격한 사람은 모두 원서를 냈다. 영희는 원서를 냈다. 따라서 영희는 합격했다."],"ans":2,"exp":"\"P이면 Q이다. Q가 아니다. 따라서 P가 아니다.\"는 대우를 이용한 타당한 추론이다. 결과가 참이라고 해서 조건이 참이라고 하거나(열이 난다, 원서를 냈다), 조건이 거짓이라고 해서 결과도 거짓이라고 하는 것(비가 오지 않았다)은 타당하지 않다. 열이나 젖은 땅에는 다른 원인이 있을 수 있기 때문이다."},
{"id":"k64","subj":"국어","unit":"논리","q":"다음 논증에 생략된 전제로 가장 적절한 것은?\n\n이 식당은 늘 손님이 많다. 그러므로 이 식당의 음식은 맛있을 것이다.","opts":["음식이 맛있는 식당은 손님이 많다.","손님이 많은 식당은 음식이 맛있다.","손님이 적은 식당은 음식값이 비싸다.","이 식당은 음식값이 싸다."],"ans":1,"exp":"\"손님이 많다\"에서 \"음식이 맛있다\"를 이끌어 내려면 \"손님이 많은 식당은 음식이 맛있다\"는 전제가 있어야 한다. \"음식이 맛있는 식당은 손님이 많다\"는 그 역이어서, 이것을 전제로 삼으면 손님이 많은 까닭이 다른 데 있을 수도 있으므로 결론이 따라 나오지 않는다."},
{"id":"k65","subj":"국어","unit":"문학","q":"향가에 대한 설명으로 옳지 않은 것은?","opts":["한자의 음과 뜻을 빌려 우리말을 적는 향찰로 기록되었다.","4구체, 8구체, 10구체의 형식이 있다.","《삼국유사》와 《균여전》에 모두 25수가 전한다.","조선 전기에 양반 사대부가 주로 지어 불렀다."],"ans":3,"exp":"향가는 신라 때부터 고려 초까지 지어진 노래로, 승려와 화랑 등이 주로 지었다. 향찰로 기록되었고 4구체, 8구체, 10구체가 있으며, 《삼국유사》에 14수, 《균여전》에 11수가 전한다."},
{"id":"k66","subj":"국어","unit":"문학","q":"평시조의 형식에 대한 설명으로 옳은 것은?","opts":["종장의 첫 음보는 3음절로 고정된다.","초장, 중장, 종장, 결장의 4장으로 이루어진다.","한 장을 세 번씩 끊어 읽는 3음보 율격이 기본이다.","중장이 다른 장보다 두 배 이상 길다."],"ans":0,"exp":"평시조는 초장, 중장, 종장의 3장 6구 45자 안팎으로 이루어지고, 한 장을 네 번씩 끊어 읽는 4음보 율격이며, 종장의 첫 음보는 3음절로 고정된다. 중장이 길어진 것은 사설시조이다."},
{"id":"k67","subj":"국어","unit":"문학","q":"작가와 작품의 연결이 옳지 않은 것은?","opts":["정철 – 「관동별곡」","윤선도 – 「어부사시사」","김만중 – 「홍길동전」","박지원 – 「양반전」"],"ans":2,"exp":"「홍길동전」은 허균이 지은 것으로 알려진 한글 소설이다. 김만중의 작품으로는 「구운몽」과 「사씨남정기」가 있다. 「관동별곡」은 정철의 가사, 「어부사시사」는 윤선도의 연시조, 「양반전」은 박지원의 한문 소설이다."},
{"id":"k68","subj":"국어","unit":"문학","q":"다음 시구에 쓰인 표현 방법으로 가장 적절한 것은?\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리우리다\n- 김소월, 「진달래꽃」에서","opts":["반어법","직유법","의인법","대구법"],"ans":0,"exp":"임이 떠나면 몹시 슬플 것이면서도 죽어도 눈물을 흘리지 않겠다고 속마음과 반대로 말하고 있으므로 반어법이다. 직유법은 \"같이, 처럼\"으로 빗대는 것, 의인법은 사람이 아닌 것을 사람처럼 나타내는 것, 대구법은 비슷한 짜임의 구절을 나란히 놓는 것으로 이 구절에는 쓰이지 않았다."},
{"id":"k69","subj":"국어","unit":"문학","q":"〈보기〉와 같은 표현 방법이 쓰인 것은?\n\n〈보기〉 찬란한 슬픔의 봄","opts":["쟁반같이 둥근 달","소리 없는 아우성","바람이 귓가에 속삭인다","내 마음은 호수요"],"ans":1,"exp":"〈보기〉는 \"찬란한\"과 \"슬픔\"처럼 서로 어울리지 않는 말을 묶어 겉으로는 모순되지만 그 속에 진실을 담는 역설법이다. \"소리 없는 아우성\"도 소리가 없는데 아우성이라고 하였으므로 역설법이다. \"쟁반같이\"는 직유법, \"바람이 속삭인다\"는 의인법, \"내 마음은 호수요\"는 은유법이다."},
{"id":"k70","subj":"국어","unit":"문학","q":"「춘향전」에 대한 설명으로 옳지 않은 것은?","opts":["판소리 사설이 소설로 정착한 판소리계 소설이다.","신분을 넘어선 사랑과 탐관오리에 대한 비판이 담겨 있다.","지은이와 지은 때가 분명하게 알려져 있지 않다.","한 가지 판본만 전하여 내용이 모두 같다."],"ans":3,"exp":"「춘향전」은 여러 사람의 입과 손을 거치며 전해져서 내용이 조금씩 다른 이본이 매우 많다. 판소리 「춘향가」가 소설로 정착한 판소리계 소설이고, 지은이는 알려져 있지 않으며, 신분을 넘어선 사랑과 탐관오리에 대한 비판을 담고 있다."},
{"id":"k71","subj":"국어","unit":"문학","q":"주요섭의 「사랑손님과 어머니」는 여섯 살 난 \"나\"(옥희)가 어머니와 사랑손님 사이의 일을 지켜보며 전하는 소설이다. 이 작품의 시점은?","opts":["1인칭 주인공 시점","1인칭 관찰자 시점","3인칭 관찰자 시점","전지적 작가 시점"],"ans":1,"exp":"작품 속 인물인 \"나\"가 주인공이 아니라 다른 인물(어머니와 사랑손님)의 이야기를 지켜보며 전하므로 1인칭 관찰자 시점이다. \"나\"가 자기 이야기를 하면 1인칭 주인공 시점이고, 작품 밖의 서술자가 겉모습만 전하면 3인칭 관찰자 시점, 인물의 속마음까지 전하면 전지적 작가 시점이다."},
{"id":"k72","subj":"국어","unit":"문학","q":"다음 시조에 대한 설명으로 옳지 않은 것은?\n\n동짓달 기나긴 밤을 한 허리를 베어 내어\n춘풍 이불 아래 서리서리 넣었다가\n어론 임 오신 날 밤이어든 굽이굽이 펴리라\n- 황진이","opts":["눈에 보이지 않는 시간을 베어 낼 수 있는 사물처럼 나타냈다.","\"서리서리\", \"굽이굽이\" 같은 말로 우리말의 느낌을 살렸다.","자연 속에서 한가롭게 지내는 삶의 즐거움을 노래했다.","임과 함께할 시간이 길기를 바라는 마음이 드러난다."],"ans":2,"exp":"이 시조는 임이 없는 긴 겨울밤을 잘라 두었다가 임이 오신 밤에 펼쳐 그 밤을 길게 하고 싶다는 그리움을 노래한 것이지, 자연 속의 한가로운 삶을 노래한 것이 아니다. 추상적인 시간(밤)을 구체적인 사물처럼 나타냈고, \"서리서리\", \"굽이굽이\" 같은 의태어로 우리말의 맛을 살렸다."},
{"id":"k73","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n병원에서 일어나는 감염의 상당수는 의료인의 손을 거쳐 퍼진다. 손에 묻은 세균은 눈에 보이지 않아서, 깨끗해 보이는 손으로 환자를 만지는 순간에도 옮겨 갈 수 있다. 그래서 감염 관리의 출발점은 비싼 장비나 새로운 약이 아니라 손 씻기이다. 환자와 접촉하기 전과 후에 비누와 물로 손을 씻거나 손 소독제를 쓰는 것만으로도 병원 감염을 크게 줄일 수 있다는 사실이 여러 연구에서 확인되었다. 가장 단순한 행동이 가장 큰 효과를 내는 셈이다.","opts":["병원 감염을 막으려면 새로운 장비에 먼저 투자해야 한다.","세균은 눈에 보이지 않으므로 병원 감염을 막을 방법이 없다.","손 씻기는 단순하지만 병원 감염을 줄이는 가장 기본적인 방법이다.","손 소독제는 비누와 물로 손을 씻는 것보다 효과가 크다."],"ans":2,"exp":"글은 감염 관리의 출발점이 손 씻기이며 단순한 행동이 큰 효과를 낸다는 점을 말한다. 장비나 약이 출발점이 아니라고 했고, 감염을 막을 방법이 없다고 하지도 않았으며, 손 소독제와 비누의 효과를 비교하지도 않았다."},
{"id":"k74","subj":"국어","unit":"주제 찾기","q":"다음 글에서 글쓴이가 말하고자 하는 바로 가장 적절한 것은?\n\n요즘은 긴 글을 끝까지 읽는 사람이 줄었다고 한다. 화면을 넘기며 필요한 정보만 골라 읽는 습관이 몸에 밴 탓이다. 이런 읽기는 빠르지만, 글쓴이의 생각을 따라가며 스스로 묻고 따지는 과정을 건너뛰게 한다. 천천히 읽을 때 우리는 문장 사이의 빈틈을 메우고, 자기 경험에 비추어 뜻을 새긴다. 정보는 훑어 읽기로도 얻을 수 있지만 생각하는 힘은 느린 읽기에서 자란다.","opts":["생각하는 힘을 기르려면 글을 천천히 깊이 읽어야 한다.","정보가 많은 시대에는 빨리 읽는 기술부터 익혀야 한다.","긴 글보다 짧은 글이 생각을 전하는 데 알맞다.","화면으로 읽는 글은 종이로 읽는 글보다 정확하지 않다."],"ans":0,"exp":"글쓴이는 훑어 읽기가 생각하는 과정을 건너뛰게 한다고 지적하고, 생각하는 힘은 느린 읽기에서 자란다고 마무리한다. 빨리 읽기를 권하지 않았고, 글의 길이나 화면과 종이의 정확성을 비교하지도 않았다."},
{"id":"k75","subj":"국어","unit":"주제 찾기","q":"다음 글의 주장으로 가장 적절한 것은?\n\n잠은 그저 쉬는 시간이 아니다. 자는 동안 뇌는 낮에 받아들인 정보를 정리하여 오래 남길 것과 버릴 것을 가른다. 몸에서는 손상된 조직을 고치고 면역 기능을 조절하는 물질이 나온다. 그래서 잠이 모자라면 기억력과 집중력이 떨어지고 감염에도 약해진다. 잠을 줄여 얻은 시간은 다음 날의 낮은 능률로 되갚아야 한다.","opts":["할 일이 많을 때는 잠을 줄여 시간을 벌어야 한다.","자는 동안에는 뇌와 몸이 모두 활동을 멈춘다.","잠이 모자라면 낮잠으로 채우면 된다.","잠은 뇌와 몸에 꼭 필요하므로 충분히 자야 한다."],"ans":3,"exp":"글은 잠자는 동안 뇌와 몸에서 중요한 일이 일어나며, 잠을 줄이면 오히려 손해라고 말한다. 잠을 줄이라는 것은 글의 주장과 반대이고, 자는 동안 뇌와 몸이 일한다고 했으며, 낮잠에 관한 내용은 없다."},
{"id":"k76","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n마을 사람 누구나 쓸 수 있는 풀밭이 있다고 하자. 각자는 소를 한 마리 더 풀어 놓으면 이익이 늘어난다. 풀이 줄어드는 손해는 모두가 나누어 지기 때문이다. 그러나 모든 사람이 똑같이 생각하여 소를 늘리면 풀밭은 금세 황폐해지고, 결국 아무도 소를 기를 수 없게 된다. 개인에게는 합리적인 선택이 모여 공동체 전체에는 손해가 되는 것이다. 그러므로 함께 쓰는 자원에는 이용을 조절하는 약속이 필요하다.","opts":["공동체의 이익을 위해 개인은 소를 기르지 말아야 한다.","함께 쓰는 자원에는 이용을 조절하는 규칙이 있어야 한다.","풀밭을 넓히면 자원 고갈 문제를 해결할 수 있다.","합리적인 개인이 모이면 공동체도 저절로 이익을 얻는다."],"ans":1,"exp":"글은 개인의 합리적인 선택이 모여 공동 자원을 망가뜨릴 수 있으므로 이용을 조절하는 약속이 필요하다고 결론짓는다. 소를 기르지 말라거나 풀밭을 넓히자는 내용은 없고, 합리적인 개인이 모이면 공동체도 저절로 이익을 얻는다는 것은 글의 내용과 반대이다."},
{"id":"k77","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n평균은 자료 전체를 숫자 하나로 요약해 주어 편리하다. 그러나 평균만 보면 속기 쉽다. 직원 아홉 명의 월급이 각각 200만 원이고 사장의 월급이 2,200만 원인 회사의 평균 월급은 400만 원이지만, 그만큼 받는 직원은 한 명도 없다. 값이 한쪽으로 크게 치우친 자료에서는 크기 순서로 늘어놓았을 때 한가운데에 오는 값인 중앙값이 실제 모습을 더 잘 보여 준다. 숫자를 읽을 때는 그 숫자가 어떻게 만들어졌는지를 함께 살펴야 한다.","opts":["평균은 계산하기 쉬우므로 어떤 자료에나 쓰는 것이 바람직하다.","월급의 차이가 큰 회사는 평균 월급을 공개하지 말아야 한다.","평균은 실제 모습을 가릴 수 있으므로 만들어진 방식을 따져야 한다.","중앙값은 어떤 자료에서나 평균보다 큰 값으로 나타난다."],"ans":2,"exp":"글은 평균이 치우친 자료의 실제 모습을 보여 주지 못할 수 있다는 예를 든 뒤, 숫자가 만들어진 방식을 살펴야 한다고 마무리한다. 평균이 어떤 자료에나 알맞다는 것은 글과 반대이고, 공개 여부나 중앙값과 평균의 크기 비교는 글에 없다(예로 든 회사에서는 중앙값이 200만 원으로 평균보다 작다)."},
{"id":"k78","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n좋은 대화는 말을 잘하는 데서가 아니라 잘 듣는 데서 시작한다. 상대가 말하는 동안 대꾸할 말을 준비하는 사람은 듣는 것처럼 보일 뿐 사실은 자기 생각에 머물러 있다. 공감하며 듣는 사람은 섣불리 판단하거나 조언하지 않고, 상대의 말을 자기 말로 다시 정리해 주며 그 마음을 헤아린다. 그럴 때 말하는 사람은 이해받았다고 느끼고 스스로 문제를 풀어 갈 힘을 얻는다.","opts":["대화에서는 상대보다 먼저 조언해 주는 것이 중요하다.","말을 잘하려면 상대가 말하는 동안 대꾸할 말을 준비해야 한다.","듣는 사람은 상대의 잘못을 정확히 판단해 주어야 한다.","판단을 미루고 마음을 헤아리며 듣는 것이 좋은 대화의 바탕이다."],"ans":3,"exp":"글은 좋은 대화가 잘 듣는 데서 시작하며, 판단이나 조언을 서두르지 않고 마음을 헤아리는 공감적 듣기가 상대에게 힘을 준다고 말한다. 먼저 조언하기, 대꾸할 말 준비하기, 판단해 주기는 모두 글에서 바람직하지 않다고 본 태도이다."},
{"id":"k79","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n훈민정음은 1443년에 세종이 만들고 1446년에 반포하였다. 자음의 기본 글자 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ은 소리를 낼 때의 발음 기관 모양을 본떠 만들었고, 나머지 자음은 여기에 획을 더하는 방식 등으로 만들었다. 모음의 기본 글자 ㆍ, ㅡ, ㅣ는 각각 하늘, 땅, 사람의 모양을 본떴다. 만든 사람과 만든 때, 만든 원리가 기록으로 분명히 전하는 문자는 세계에서도 드물다.","opts":["모음의 기본 글자는 발음 기관을 본떠 만들었다.","훈민정음은 만든 지 3년이 지난 뒤에 반포되었다.","자음의 기본 글자는 모두 다섯 자이다.","훈민정음은 만든 원리가 기록으로 전하고 있다."],"ans":0,"exp":"발음 기관의 모양을 본뜬 것은 자음의 기본 글자이고, 모음의 기본 글자는 하늘, 땅, 사람의 모양을 본떴다. 1443년에 만들어 1446년에 반포했으므로 3년 뒤이고, 자음의 기본 글자는 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ 다섯 자이며, 만든 원리가 기록으로 전한다고 했다."},
{"id":"k80","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n백신은 병을 일으키는 힘을 없애거나 약하게 만든 병원체, 또는 그 일부를 몸에 넣어 면역을 미리 만들어 두는 약이다. 우리 몸은 백신 속 물질을 침입자로 알아보고 항체를 만들며, 이 경험을 기억 세포에 저장한다. 나중에 진짜 병원체가 들어오면 기억 세포가 빠르게 반응하여 병에 걸리지 않거나 가볍게 앓고 지나가게 된다. 다만 면역이 유지되는 기간은 백신마다 달라서 어떤 백신은 여러 번 맞아야 한다.","opts":["백신에는 병을 일으키는 힘을 더 강하게 만든 병원체가 들어 있다.","어떤 백신이든 한 번 맞으면 면역이 평생 유지된다.","기억 세포는 진짜 병원체가 들어왔을 때 몸이 빠르게 반응하게 한다.","백신을 맞은 몸은 항체를 만들지 않고 병원체를 기억만 한다."],"ans":2,"exp":"진짜 병원체가 들어오면 기억 세포가 빠르게 반응한다고 했다. 백신은 병원체의 힘을 없애거나 약하게 만든 것이고, 면역이 유지되는 기간은 백신마다 다르며, 몸은 항체를 만들고 그 경험을 기억 세포에 저장한다."},
{"id":"k81","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n조선 후기 서울에는 돈을 받고 책을 빌려주는 세책점이 있었다. 책값이 비싸 사서 읽기 어려웠던 사람들은 이곳에서 소설을 빌려 보았다. 세책점 주인은 한 작품을 여러 권으로 나누어 손으로 베껴 썼는데, 권수가 많을수록 빌려주는 값을 더 받을 수 있었기 때문이다. 흥미로운 대목에서 권을 끊어 다음 권을 빌리게 만들기도 했다. 주요 독자는 한글을 읽을 줄 아는 여성들이었다고 전한다.","opts":["세책점은 책을 사기 어려운 사람들이 주로 이용했다.","한 작품을 여러 권으로 나눈 것은 수입을 늘리기 위해서였다.","세책점의 주요 독자는 여성이었다.","세책점의 책은 인쇄한 것이어서 값이 쌌다."],"ans":3,"exp":"세책점의 책은 주인이 손으로 베껴 쓴 것이라고 했고, 값이 쌌다는 내용도 없다. 책값이 비싸 사서 읽기 어려운 사람들이 이용했다는 것, 권수를 늘려 값을 더 받았다는 것, 주요 독자가 여성이었다는 것은 글의 내용과 일치한다."},
{"id":"k82","subj":"국어","unit":"내용 일치","q":"다음 안내문의 내용과 일치하는 것은?\n\n○○시 보건소 독감 무료 예방 접종 안내\n- 대상: ○○시에 주민 등록을 둔 만 65세 이상 어르신, 임신부, 생후 6개월~만 13세 어린이\n- 기간: 10월 15일~11월 30일(토요일, 일요일, 공휴일 제외)\n- 시간: 오전 9시~오후 5시(낮 12시~1시에는 접수하지 않음)\n- 준비물: 신분증. 임신부는 산모 수첩도 함께 가져오고, 어린이는 보호자와 함께 방문\n- 접종 뒤 20~30분 동안 보건소에 머물며 이상 반응이 없는지 살핀 다음 귀가","opts":["토요일 오전에도 접종을 받을 수 있다.","임신부는 신분증과 산모 수첩을 함께 가져가야 한다.","○○시에 사는 만 60세 주민은 무료 접종 대상이다.","접종을 받은 뒤에는 곧바로 집에 돌아가야 한다."],"ans":1,"exp":"준비물 항목에 임신부는 신분증과 함께 산모 수첩도 가져오라고 되어 있다. 토요일은 접종 기간에서 빠지고, 어르신은 만 65세 이상이 대상이며, 접종 뒤에는 20~30분 동안 보건소에 머물러야 한다."},
{"id":"k83","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n약효 성분이 전혀 없는 가짜 약을 먹고도 증상이 나아지는 현상을 위약 효과라고 한다. 나을 것이라는 환자의 기대가 실제로 통증이나 불안을 줄이는 것이다. 이 때문에 새 약의 효과를 시험할 때는 참가자를 두 집단으로 나누어 한쪽에는 진짜 약을, 다른 쪽에는 가짜 약을 준다. 진짜 약을 먹은 집단이 가짜 약을 먹은 집단보다 뚜렷이 더 나아져야 약효를 인정받는다. 이때 누가 어떤 약을 받았는지는 참가자도, 약을 주는 연구자도 모르게 한다.","opts":["위약 효과는 환자의 기대와 관련이 있다.","새 약은 가짜 약보다 효과가 뚜렷해야 약효를 인정받는다.","약을 주는 연구자는 누가 진짜 약을 받았는지 안다.","가짜 약에는 약효 성분이 들어 있지 않다."],"ans":2,"exp":"누가 어떤 약을 받았는지는 참가자뿐 아니라 약을 주는 연구자도 모르게 한다고 했다. 위약 효과가 환자의 기대에서 비롯한다는 것, 진짜 약이 가짜 약보다 뚜렷이 나아야 한다는 것, 가짜 약에 약효 성분이 없다는 것은 글의 내용과 일치한다."},
{"id":"k84","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n온돌은 아궁이에 불을 때어 생긴 열기가 방바닥 아래의 통로를 지나며 구들장을 데우는 난방 방식이다. 데워진 구들장은 불이 꺼진 뒤에도 오랫동안 열을 내놓는다. 열기가 처음 닿는 아궁이 쪽 바닥을 아랫목, 굴뚝에 가까운 쪽을 윗목이라 하는데, 아랫목이 더 따뜻하다. 온돌은 바닥을 직접 데우기 때문에 따뜻해진 공기가 아래에서 위로 올라가며 방 전체를 덥힌다. 다만 방을 데우는 데 시간이 걸리고 온도를 세밀하게 조절하기 어렵다.","opts":["구들장은 불이 꺼진 뒤에도 한동안 열을 낸다.","굴뚝에 가까운 윗목이 아랫목보다 따뜻하다.","온돌은 방 안의 공기를 먼저 데워 바닥을 덥힌다.","온돌은 방의 온도를 세밀하게 맞추기 쉽다."],"ans":0,"exp":"데워진 구들장은 불이 꺼진 뒤에도 오랫동안 열을 내놓는다고 했다. 더 따뜻한 쪽은 아궁이에 가까운 아랫목이고, 온돌은 바닥을 먼저 데워 그 열로 공기를 덥히며, 온도를 세밀하게 조절하기 어렵다고 했다."},
{"id":"k85","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n항생제는 세균을 죽이거나 자라지 못하게 하는 약이다. 감기나 독감 같은 바이러스 질환에는 효과가 없다. 항생제를 쓰면 대부분의 세균은 죽지만, 우연히 그 약에 견디는 성질을 지닌 세균은 살아남아 수를 늘린다. 항생제를 필요 이상으로 자주 쓰거나 처방받은 기간을 채우지 않고 중간에 끊으면 이런 내성균이 늘어날 기회가 커진다. 내성균이 퍼지면 전에는 쉽게 낫던 감염도 치료하기 어려워진다.","opts":["항생제를 쓴 뒤에도 일부 세균은 살아남을 수 있다.","처방받은 항생제를 중간에 끊으면 내성균이 늘어날 수 있다.","내성균이 퍼지면 감염을 치료하기가 어려워진다.","항생제는 바이러스가 일으키는 감기에도 효과가 있다."],"ans":3,"exp":"항생제는 세균에 작용하는 약이며 감기나 독감 같은 바이러스 질환에는 효과가 없다고 했다. 약에 견디는 세균이 살아남는다는 것, 복용을 중간에 끊으면 내성균이 늘 기회가 커진다는 것, 내성균이 퍼지면 치료가 어려워진다는 것은 글의 내용과 일치한다."},
{"id":"k86","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그러나 냉장고가 널리 쓰이면서 이런 저장법은 맛을 내는 방법으로 성격이 바뀌었다.\n(나) 냉장 기술이 없던 시절, 음식을 오래 두고 먹는 일은 살아남기 위한 과제였다.\n(다) 오늘날 우리가 김치나 젓갈을 먹는 까닭은 음식이 상할까 봐서가 아니라 그 맛을 즐기기 때문이다.\n(라) 사람들은 소금에 절이거나 말리거나 발효시키는 방법으로 이 과제를 풀었다.","opts":["(나) – (가) – (라) – (다)","(다) – (나) – (라) – (가)","(나) – (라) – (가) – (다)","(라) – (나) – (다) – (가)"],"ans":2,"exp":"과제를 내놓은 (나)가 맨 앞에 오고, \"이 과제\"를 푼 방법을 말하는 (라)가 이어진다. \"이런 저장법\"의 성격이 바뀌었다는 (가)는 (라) 뒤에 와야 하고, 그 변화를 오늘날의 예로 보여 주는 (다)가 마지막에 온다."},
{"id":"k87","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 이 때문에 열이 난다고 무조건 해열제부터 쓰는 것이 늘 좋은 것만은 아니다.\n(나) 체온이 오르면 병원체는 늘어나는 속도가 느려지고 면역 세포는 더 활발하게 움직인다.\n(다) 감염되었을 때 열이 나는 것은 몸이 고장 났다는 뜻이 아니라 몸이 싸우고 있다는 신호이다.\n(라) 다만 열이 너무 높거나 오래가면 몸에 부담이 되므로 그때는 열을 내려야 한다.","opts":["(다) – (나) – (가) – (라)","(나) – (다) – (라) – (가)","(다) – (라) – (가) – (나)","(가) – (다) – (나) – (라)"],"ans":0,"exp":"열이 몸이 싸우는 신호라는 (다)가 화제를 열고, 그 까닭을 설명하는 (나)가 이어진다. \"이 때문에\" 해열제를 무조건 쓸 일은 아니라는 (가)가 그 뒤에 오고, \"다만\"으로 예외를 덧붙이는 (라)가 마지막에 온다."},
{"id":"k88","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 예컨대 \"어리다\"는 본래 \"어리석다\"는 뜻이었으나 지금은 \"나이가 적다\"는 뜻으로 쓰인다.\n(나) 말의 뜻은 굳어 있지 않고 시간이 흐르면서 달라진다.\n(다) 이처럼 낱말의 뜻이 변하는 것은 언어가 그것을 쓰는 사회와 함께 살아 움직이기 때문이다.\n(라) 또 \"놈\"은 본래 평범한 사람을 두루 가리켰으나 지금은 남자를 낮잡아 이르는 말이 되었다.","opts":["(가) – (라) – (나) – (다)","(나) – (다) – (가) – (라)","(다) – (나) – (가) – (라)","(나) – (가) – (라) – (다)"],"ans":3,"exp":"말의 뜻이 달라진다는 일반적인 진술 (나)가 먼저 오고, \"예컨대\"로 시작하는 첫 번째 예 (가)와 \"또\"로 시작하는 두 번째 예 (라)가 이어진다. \"이처럼\"으로 두 예를 묶어 까닭을 밝히는 (다)가 마지막에 온다."},
{"id":"k89","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그 결과 도시 한가운데의 기온이 주변 지역보다 높아지는 열섬 현상이 나타난다.\n(나) 도시에는 아스팔트와 콘크리트로 덮인 땅이 많다.\n(다) 이 현상을 줄이려면 옥상과 길가에 나무를 심어 그늘과 수분을 늘려야 한다.\n(라) 이런 재료는 낮 동안 햇볕의 열을 많이 빨아들였다가 밤에 천천히 내보낸다.","opts":["(나) – (가) – (라) – (다)","(나) – (라) – (가) – (다)","(라) – (나) – (다) – (가)","(가) – (다) – (나) – (라)"],"ans":1,"exp":"도시의 땅을 덮은 재료를 소개하는 (나)가 먼저 오고, \"이런 재료\"의 성질을 말하는 (라)가 이어진다. \"그 결과\" 열섬 현상이 나타난다는 (가)가 그 뒤에 오고, \"이 현상\"을 줄이는 방법인 (다)가 마지막에 온다."},
{"id":"k90","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그래서 기자는 사실을 고르고 늘어놓는 단계에서부터 자신의 관점을 돌아보아야 한다.\n(나) 흔히 뉴스는 일어난 일을 있는 그대로 전한다고 생각한다.\n(다) 또 고른 사건 가운데 무엇을 머리기사로 올리느냐에 따라 같은 일도 전혀 다르게 보인다.\n(라) 하지만 수많은 사건 가운데 무엇을 보도할지 고르는 순간 이미 판단이 끼어든다.","opts":["(나) – (다) – (라) – (가)","(라) – (나) – (가) – (다)","(나) – (라) – (다) – (가)","(나) – (가) – (라) – (다)"],"ans":2,"exp":"일반적인 통념을 내놓은 (나)가 먼저 오고, \"하지만\"으로 이를 뒤집는 (라)가 이어진다. \"또 고른 사건 가운데\"로 시작하는 (다)는 사건을 고르는 일을 말한 (라) 뒤에 와야 하며, \"그래서\"로 결론을 내리는 (가)가 마지막에 온다."},
{"id":"k91","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n사람은 자기 생각과 맞는 정보는 쉽게 받아들이고, 맞지 않는 정보는 무시하거나 깎아내리는 경향이 있다. 이를 확증 편향이라고 한다. 인터넷의 추천 기능은 이용자가 좋아할 만한 글을 골라 보여 주므로 이 경향을 더 키운다. 그 결과 우리는 많은 정보를 접하면서도 ______. 그러므로 일부러 나와 다른 의견을 찾아 읽으려는 노력이 필요하다.","opts":["생각이 한쪽으로 치우치기 쉽다","여러 관점을 고루 갖추게 된다","정보가 모자란다고 느끼게 된다","자기 생각을 쉽게 바꾸게 된다"],"ans":0,"exp":"확증 편향과 추천 기능 때문에 자기 생각에 맞는 정보만 접하게 된다는 흐름이므로, 정보가 많아도 생각은 한쪽으로 치우친다는 내용이 들어가야 한다. 뒤 문장에서 다른 의견을 일부러 찾아 읽으라고 한 것과도 이어진다. 나머지는 앞 내용과 반대이거나 관계가 없다."},
{"id":"k92","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 접속어로 가장 적절한 것은?\n\n우리나라의 기대 수명은 빠르게 늘어 세계에서도 높은 편에 든다. ______ 아프지 않고 건강하게 사는 기간인 건강 수명은 그만큼 늘지 않았다. 기대 수명과 건강 수명의 차이는 병을 앓으며 보내는 기간을 뜻한다. 따라서 이제는 얼마나 오래 사느냐보다 얼마나 건강하게 사느냐가 더 중요한 과제가 되었다.","opts":["그래서","예컨대","왜냐하면","그러나"],"ans":3,"exp":"앞 문장은 기대 수명이 빠르게 늘었다는 내용이고 뒤 문장은 건강 수명은 그만큼 늘지 않았다는 내용이어서 서로 맞서므로 \"그러나\"가 알맞다. \"그래서\"는 원인과 결과, \"예컨대\"는 예시, \"왜냐하면\"은 이유를 이을 때 쓴다."},
{"id":"k93","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n경제학에서는 어떤 것을 선택하느라 포기한 것들 가운데 가장 가치가 큰 것을 기회비용이라고 한다. 주말에 영화를 보기로 했다면 그 시간에 아르바이트를 해서 벌 수 있었던 돈이 기회비용이 될 수 있다. 이 개념은 ______는 점을 일깨운다. 돈을 내지 않았더라도 시간과 기회를 썼다면 이미 값을 치른 것이다.","opts":["비용은 실제로 낸 돈만으로 계산해야 한다","공짜처럼 보이는 선택에도 대가가 따른다","선택의 가치는 누구에게나 똑같다","포기한 것이 많을수록 이익이 커진다"],"ans":1,"exp":"뒤 문장에서 돈을 내지 않았더라도 시간과 기회를 썼다면 값을 치른 것이라고 했으므로, 공짜처럼 보이는 선택에도 대가가 있다는 내용이 들어가야 한다. 실제로 낸 돈만 비용으로 보는 것은 기회비용의 개념과 반대이고, 나머지는 글에서 다루지 않은 내용이다."},
{"id":"k94","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n우리말에서 색을 나타내는 말은 매우 섬세하게 나뉜다. \"노랗다\" 하나만 해도 \"노르스름하다, 누렇다, 샛노랗다, 노릇노릇하다\"처럼 밝기와 짙기, 느낌에 따라 여러 낱말이 있다. 이런 낱말들은 다른 언어의 낱말 하나로 옮기기 어렵다. 번역이 어려운 까닭은 번역하는 사람의 솜씨가 모자라서가 아니라 ______ 때문이다.","opts":["색은 본래 말로 나타낼 수 없는 것이기","우리말에는 색을 나타내는 말이 적기","언어마다 세계를 나누어 이름 붙이는 방식이 다르기","다른 언어에는 색을 나타내는 말이 전혀 없기"],"ans":2,"exp":"우리말이 노란색을 여러 낱말로 잘게 나누어 부르는데 다른 언어에는 그에 딱 맞는 낱말이 없다는 내용이므로, 언어마다 대상을 나누어 이름 붙이는 방식이 다르다는 말이 들어가야 한다. 우리말에 색채어가 적다는 것은 글과 반대이고, 색을 말로 나타낼 수 없다거나 다른 언어에 색채어가 전혀 없다는 것은 지나친 말이다."},
{"id":"k95","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n습관은 굳은 의지보다 환경에서 만들어진다. 운동을 하겠다고 단단히 마음먹는 것보다 운동화를 현관에 꺼내 두는 편이 효과가 크다. 과자를 덜 먹고 싶다면 참으려고 애쓰기보다 과자를 눈에 띄지 않는 곳에 두면 된다. 요컨대 행동을 바꾸려면 ______.","opts":["그 행동을 둘러싼 환경부터 바꾸어야 한다","날마다 결심을 새롭게 다지는 일부터 해야 한다","실패한 까닭을 자신의 성격에서 찾아야 한다","여러 가지 습관을 한꺼번에 바꾸어야 한다"],"ans":0,"exp":"운동화를 꺼내 두는 것과 과자를 치워 두는 것은 모두 환경을 바꾼 예이므로, 행동을 둘러싼 환경부터 바꾸어야 한다는 말이 들어가야 한다. 결심을 다지는 것은 글에서 효과가 작다고 본 방법이고, 성격이나 여러 습관을 한꺼번에 바꾸는 일은 글에 없다."},
{"id":"k96","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n한 연구에서 병원 복도의 손 소독제 위에 사람의 눈 사진을 붙여 두었더니 손 소독제를 쓰는 사람이 늘었다. 꽃 사진을 붙였을 때는 변화가 없었다. 연구자들은 누군가 지켜본다는 느낌이 사람들로 하여금 규범에 맞게 행동하게 만든다고 설명했다. 실제로 지켜보는 사람이 없어도 그런 느낌만으로 행동이 달라진 것이다.","opts":["사진의 종류와 상관없이 사진을 붙이면 손 소독제 사용이 늘어난다.","손 소독제 사용을 늘리려면 실제로 지켜보는 사람이 꼭 있어야 한다.","꽃 사진은 사람들의 손 소독제 사용을 줄인다.","사람은 남의 눈길을 느낄 때 규범을 더 잘 지키는 경향이 있다."],"ans":3,"exp":"눈 사진만으로도 손 소독제 사용이 늘었다는 결과와 연구자들의 설명에서, 사람은 남의 눈길을 느끼면 규범을 더 잘 지킨다고 추론할 수 있다. 꽃 사진을 붙였을 때는 변화가 없었으므로 사진의 종류가 중요하고 꽃 사진이 사용을 줄인 것도 아니며, 실제로 지켜보는 사람이 없어도 행동이 달라졌다."},
{"id":"k97","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n\"엄마가\", \"아빠가\"라는 말을 익힌 아이는 한동안 \"선생님이가\", \"곰이가\"처럼 말하기도 한다. 어른에게서는 들어 본 적이 없는 말이다. 이는 아이가 들은 말을 그대로 흉내 내기만 하는 것이 아니라, 들은 말에서 나름대로 규칙을 찾아내어 새로운 말에 적용하고 있음을 보여 준다. 틀린 말이 오히려 배움이 진행되고 있다는 증거인 셈이다.","opts":["아이가 말을 배우는 과정은 흉내 내기만으로는 설명되지 않는다.","아이는 어른에게서 들은 말만 따라 한다.","틀린 말을 자주 하는 아이는 말을 배우는 속도가 느리다.","아이의 틀린 말은 어른이 곧바로 고쳐 주어야 없어진다."],"ans":0,"exp":"아이가 어른에게서 들어 본 적 없는 말을 스스로 만들어 낸다는 사실에서, 말 배우기가 단순한 흉내가 아니라는 점을 추론할 수 있다. 틀린 말은 배움이 진행된다는 증거라고 했으므로 느리다고 볼 수 없고, 어른이 고쳐 주어야 한다는 내용은 글에 없다."},
{"id":"k98","subj":"국어","unit":"추론","q":"밑줄 친 부분의 사례로 가장 적절한 것은?\n\n이미 써 버려서 되찾을 수 없는 비용을 매몰 비용이라고 한다. 합리적으로 판단하려면 앞으로 생길 이익과 손해만 따져야 한다. 그런데 사람들은 흔히 그동안 들인 돈과 시간이 아까워서 손해가 뻔한 일을 계속한다. 이를 __매몰 비용의 오류__라고 한다.","opts":["값이 오를 것 같아서 필요한 물건을 미리 사 두었다.","적성에 맞지 않아서 1년 동안 다닌 학원을 그만두었다.","영화가 재미없었지만 표를 산 돈이 아까워서 끝까지 보았다.","할인 기간을 기다렸다가 필요한 물건을 샀다."],"ans":2,"exp":"이미 표를 사는 데 쓴 돈은 되찾을 수 없는데도 그것이 아까워서 재미없는 영화를 계속 보는 것이 매몰 비용의 오류이다. 학원을 그만둔 것은 이미 들인 시간과 돈에 얽매이지 않은 판단이고, 미리 사 두거나 할인 기간을 기다리는 것은 앞으로의 이익을 따진 행동이다."},
{"id":"k99","subj":"국어","unit":"추론","q":"다음 글의 관점에서 볼 때 문제가 있는 추론은?\n\n아이스크림이 많이 팔리는 달에는 물놀이 사고도 늘어난다. 그렇다고 아이스크림이 사고를 일으킨다고 말할 수는 없다. 둘 다 더운 날씨라는 공통 원인 때문에 함께 늘어난 것이다. 이처럼 두 현상이 함께 변한다는 사실만으로는 한쪽이 다른 쪽의 원인이라고 단정할 수 없다. 인과 관계를 말하려면 제3의 요인이 없는지, 원인과 결과의 순서가 뒤바뀌지 않았는지를 따져 보아야 한다.","opts":["키가 큰 아이가 몸무게도 많이 나가지만, 키가 몸무게의 원인이라고 단정하기는 어렵다.","아침밥을 먹는 학생의 성적이 높게 나타났으므로, 아침밥을 먹으면 성적이 오른다.","소방차가 많이 출동한 화재일수록 피해가 컸는데, 이는 불의 크기라는 공통 원인 때문일 수 있다.","우산이 많이 팔린 날에 교통사고가 많았지만, 둘 다 비 때문일 수 있다."],"ans":1,"exp":"아침밥과 성적이 함께 나타난다는 사실만으로 아침밥이 성적을 올린다고 단정한 것이므로 글이 경계하는 추론이다. 가정 환경이나 생활 습관 같은 제3의 요인이 둘 모두에 영향을 주었을 수 있다. 나머지는 함께 변한다는 사실만으로 인과를 단정하지 않거나 공통 원인을 따지고 있다."},
{"id":"k100","subj":"국어","unit":"추론","q":"다음 글의 서술 방식으로 적절하지 않은 것은?\n\n단백질은 아미노산이 길게 이어져 만들어진 물질이다. 우리 몸은 스무 가지 아미노산을 쓰는데, 이 가운데 몸에서 만들지 못해 반드시 음식으로 얻어야 하는 것을 필수 아미노산이라 한다. 고기, 달걀, 우유 같은 동물성 식품에는 필수 아미노산이 고루 들어 있다. 반면 곡류나 콩류 같은 식물성 식품은 대개 한두 가지가 모자란다. 그래서 쌀밥에 콩을 섞어 먹듯 서로 모자란 것을 채워 주는 식품을 함께 먹는 것이 좋다.","opts":["용어의 뜻을 풀이하고 있다.","구체적인 예를 들고 있다.","두 대상의 차이를 견주고 있다.","전문가의 말을 인용하고 있다."],"ans":3,"exp":"글에는 전문가의 말을 따온 부분이 없다. 단백질과 필수 아미노산의 뜻을 풀이했고(정의), 고기, 달걀, 우유와 쌀밥에 콩을 섞어 먹는 예를 들었으며(예시), 동물성 식품과 식물성 식품의 차이를 \"반면\"으로 견주었다(대조)."},
{"id":"e01","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe nurse tried to __alleviate__ the patient's pain.","opts":["aggravate","relieve","ignore","measure"],"ans":1,"exp":"alleviate는 \"완화하다, 덜다\"라는 뜻으로 relieve, ease, lessen과 비슷하다. aggravate는 반대로 \"악화시키다\"이다."},
{"id":"e02","subj":"영어","unit":"문법","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nIf I ______ you, I would accept the offer.","opts":["am","was being","were","have been"],"ans":2,"exp":"현재 사실의 반대를 가정하는 가정법 과거이다. \"If + 주어 + 과거 동사, 주어 + would + 동사원형\" 구조이며, be동사는 주어와 관계없이 were를 쓴다."},
{"id":"e03","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe symptoms were so subtle that they were easily __overlooked__.","opts":["examined","missed","treated","recorded"],"ans":1,"exp":"overlook은 \"못 보고 지나치다, 간과하다\"라는 뜻으로 miss와 가깝다. 증상이 미묘해서(subtle) 쉽게 놓쳤다는 문맥이다."},
{"id":"e04","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["She suggested that he goes home.","I look forward to hear from you.","He is used to working at night.","The news were shocking."],"ans":2,"exp":"be used to는 \"~에 익숙하다\"라는 뜻이고 to가 전치사라 뒤에 동명사가 온다. suggest 뒤의 that절은 (should) go를 쓰고, look forward to 뒤에도 동명사 hearing이 와야 하며, news는 단수 취급하므로 was가 옳다."},
{"id":"e05","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe committee decided to __postpone__ the public hearing until next month.","opts":["delay","cancel","attend","announce"],"ans":0,"exp":"postpone은 \"연기하다, 미루다\"라는 뜻으로 delay, put off와 같다. cancel은 \"취소하다\"로, 다음 달까지(until next month) 미룬다는 문맥과 맞지 않는다."},
{"id":"e06","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nWearing a mask is __mandatory__ for all visitors to the intensive care unit.","opts":["optional","temporary","uncomfortable","compulsory"],"ans":3,"exp":"mandatory는 \"의무적인\"이라는 뜻으로 compulsory, obligatory, required와 같다. optional은 \"선택적인\"으로 반대말이다."},
{"id":"e07","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nHer explanation was so __lucid__ that even beginners understood the procedure at once.","opts":["lengthy","vague","clear","polite"],"ans":2,"exp":"lucid는 \"명쾌한, 알기 쉬운\"이라는 뜻으로 clear와 가깝다. 초보자도 바로 이해했다는 문맥이 단서다. vague는 \"모호한\"으로 반대말이다."},
{"id":"e08","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nMeasles is highly __contagious__, so infected children should stay home from school.","opts":["painful","infectious","rare","chronic"],"ans":1,"exp":"contagious는 \"전염성이 있는\"이라는 뜻으로 infectious와 가깝다. 감염된 아이는 집에 있어야 한다는 문맥이 단서다. chronic은 \"만성의\"라는 뜻이다."},
{"id":"e09","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe official refused to __disclose__ the names of the people who had filed complaints.","opts":["record","conceal","remember","reveal"],"ans":3,"exp":"disclose는 \"밝히다, 공개하다\"라는 뜻으로 reveal과 같다. conceal은 \"숨기다\"로 반대말이다."},
{"id":"e10","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe mayor gave a __candid__ answer to the reporter's question about the budget.","opts":["frank","brief","careless","written"],"ans":0,"exp":"candid는 \"솔직한, 숨김없는\"이라는 뜻으로 frank, honest와 가깝다. brief는 \"짧은\", careless는 \"부주의한\"이라는 뜻이다."},
{"id":"e11","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe volunteers worked __diligently__ to prepare meals for the flood victims.","opts":["carelessly","industriously","reluctantly","occasionally"],"ans":1,"exp":"diligently는 \"부지런히, 열심히\"라는 뜻으로 industriously와 같다. reluctantly는 \"마지못해\", occasionally는 \"가끔\"이라는 뜻이다."},
{"id":"e12","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe wording of the contract was __ambiguous__, so the two sides interpreted it differently.","opts":["convincing","illegal","unclear","outdated"],"ans":2,"exp":"ambiguous는 \"뜻이 분명하지 않은, 여러 가지로 해석되는\"이라는 뜻으로 unclear와 가깝다. 양측이 서로 다르게 해석했다는 내용이 단서다."},
{"id":"e13","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe government plans to __do away with__ the outdated regulation next year.","opts":["abolish","enforce","revise","propose"],"ans":0,"exp":"do away with는 \"없애다, 폐지하다\"라는 뜻으로 abolish, get rid of와 같다. enforce는 \"시행하다\", revise는 \"개정하다\"이다."},
{"id":"e14","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nI can't __put up with__ the noise from the construction site any longer.","opts":["avoid","tolerate","reduce","report"],"ans":1,"exp":"put up with는 \"참다, 견디다\"라는 뜻으로 tolerate, endure, bear와 같다. 더 이상 소음을 참을 수 없다는 뜻의 문장이다."},
{"id":"e15","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe outdoor concert was __called off__ because of the typhoon.","opts":["delayed","shortened","canceled","relocated"],"ans":2,"exp":"call off는 \"취소하다\"라는 뜻으로 cancel과 같다. \"연기하다\"는 put off이므로 delayed와 헷갈리지 않도록 한다."},
{"id":"e16","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nShe __came down with__ the flu just two days before the exam.","opts":["recovered from","was tested for","was warned about","became ill with"],"ans":3,"exp":"come down with는 \"(병에) 걸리다\"라는 뜻이므로 became ill with가 가장 가깝다. recover from은 \"~에서 회복하다\"로 반대 방향의 뜻이다."},
{"id":"e17","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nShe had practiced so much that the driving test was __a piece of cake__ for her.","opts":["very boring","very easy","quite risky","rather costly"],"ans":1,"exp":"a piece of cake는 \"아주 쉬운 일\"이라는 뜻의 관용 표현이다. 연습을 많이 했다는 앞부분이 단서다."},
{"id":"e18","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nThe ward __ran out of__ disposable gloves, so the head nurse placed an urgent order.","opts":["looked for","threw away","used up","handed out"],"ans":2,"exp":"run out of는 \"~을 다 써 버리다, ~이 떨어지다\"라는 뜻으로 use up과 같다. throw away는 \"버리다\", hand out은 \"나누어 주다\"이다."},
{"id":"e19","subj":"영어","unit":"어휘","q":"밑줄 친 부분과 의미가 가장 가까운 것은?\n\nPlease __fill out__ this form and hand it to the receptionist.","opts":["fold","copy","keep","complete"],"ans":3,"exp":"fill out은 \"(서식을) 작성하다, 빈칸을 채우다\"라는 뜻으로 complete와 같다. fill in도 같은 뜻으로 쓴다."},
{"id":"e20","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nBecause the patient was allergic to penicillin, the doctor prescribed a(n) ______ antibiotic.","opts":["alternative","identical","harmful","expired"],"ans":0,"exp":"페니실린 알레르기가 있으므로 \"다른, 대체할\" 항생제를 처방했다는 흐름이다. identical(똑같은)은 알레르기를 일으키는 약을 다시 주는 것이 되고, harmful(해로운)과 expired(기한이 지난)는 처방할 약이 될 수 없다."},
{"id":"e21","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nApplicants must submit all the required documents before the ______; late applications will not be accepted.","opts":["refund","ceremony","deadline","vacancy"],"ans":2,"exp":"\"늦게 낸 지원서는 받지 않는다\"는 뒷부분으로 보아 \"마감 기한(deadline)\" 전에 내야 한다는 뜻이다. refund는 \"환불\", vacancy는 \"빈자리, 결원\"이다."},
{"id":"e22","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nUnlike his talkative brother, Minsu is rather ______ and seldom speaks in class.","opts":["outgoing","noisy","humorous","reserved"],"ans":3,"exp":"Unlike로 말이 많은(talkative) 형과 대조하고, 수업 중에 거의 말하지 않는다고 했으므로 \"말수가 적은, 내성적인\"이라는 뜻의 reserved가 알맞다. outgoing은 \"외향적인\"이다."},
{"id":"e23","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nThe vaccine provides ______ against the virus for at least ten years.","opts":["exposure","immunity","infection","addiction"],"ans":1,"exp":"백신이 바이러스에 대해 제공하는 것은 \"면역(immunity)\"이다. exposure는 \"노출\", infection은 \"감염\", addiction은 \"중독\"이어서 문맥에 맞지 않는다."},
{"id":"e24","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nThe witness's statement was ______ with the security camera footage, so the police believed her.","opts":["consistent","concerned","crowded","confused"],"ans":0,"exp":"be consistent with는 \"~와 일치하다\"라는 뜻이다. 진술이 영상과 일치했기 때문에 경찰이 믿었다는 흐름이다. 나머지는 with와 함께 써도 \"~와 관련된\", \"~로 붐비는\", \"~와 혼동된\"이라는 뜻이어서 맞지 않는다."},
{"id":"e25","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nThe drought had a ______ effect on local agriculture; most farmers lost more than half of their crops.","opts":["beneficial","negligible","devastating","soothing"],"ans":2,"exp":"농민 대부분이 작물의 절반 넘게 잃었다고 했으므로 가뭄의 영향은 \"파괴적인(devastating)\" 것이다. beneficial은 \"이로운\", negligible은 \"무시해도 될 만큼 작은\", soothing은 \"달래 주는\"이다."},
{"id":"e26","subj":"영어","unit":"어휘","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nBecause of serious financial difficulties, the company had to ______ two hundred workers.","opts":["take on","look up to","bring up","lay off"],"ans":3,"exp":"재정난 때문에 직원을 \"해고하다(lay off)\"라는 흐름이다. take on은 \"고용하다\", look up to는 \"존경하다\", bring up은 \"기르다, (화제를) 꺼내다\"이다."},
{"id":"e27","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["The number of applicants have increased this year.","She has lived in Busan since ten years.","Not only did he apologize, but he also paid for the damage.","I wish I can speak English fluently."],"ans":2,"exp":"부정어 Not only가 문장 앞에 오면 주어와 조동사가 도치되어 did he apologize가 된다. the number of는 단수 취급하므로 has, 기간 앞에는 for(for ten years), I wish 뒤에는 가정법 과거 could가 와야 한다."},
{"id":"e28","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["The book is worth reading twice.","She made me to clean the room.","I am interested in learn Spanish.","He is enough old to vote."],"ans":0,"exp":"be worth 뒤에는 동명사가 온다. 사역동사 make는 목적격 보어로 동사원형(clean)을 쓰고, 전치사 in 뒤에는 동명사(learning)가 오며, enough는 형용사 뒤에 놓아 old enough라고 쓴다."},
{"id":"e29","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["Hardly I had sat down when the phone rang.","The report must submit by Friday.","Each of the students have a locker.","Had I known the truth, I would have told you."],"ans":3,"exp":"가정법 과거완료에서 if를 생략하면 Had + 주어 + 과거분사로 도치된다. Hardly가 문장 앞에 오면 had I sat으로 도치해야 하고, 보고서는 제출되는 것이므로 must be submitted, each of는 단수 취급하므로 has가 옳다."},
{"id":"e30","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["This is the hospital which my mother works.","The longer you wait, the more difficult it becomes.","He asked me where did I live.","She is one of the best nurse in the ward."],"ans":1,"exp":"\"the 비교급, the 비교급\"은 \"~할수록 더 …하다\"라는 뜻의 옳은 구문이다. 장소를 나타내는 관계사는 where(또는 at which), 간접의문문은 where I lived의 어순, one of 뒤에는 복수 명사 nurses가 와야 한다."},
{"id":"e31","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["He denied to steal the wallet.","The meeting has been held last Monday.","It is essential that every visitor wear a mask.","The patient was too weak to walking."],"ans":2,"exp":"essential처럼 필요·당위를 나타내는 형용사 뒤의 that절에는 (should) + 동사원형을 쓰므로 wear가 옳다. deny는 동명사(stealing)를 목적어로 취하고, last Monday처럼 분명한 과거 시점은 현재완료와 함께 쓰지 못하며(was held), too ~ to 뒤에는 동사원형(walk)이 온다."},
{"id":"e32","subj":"영어","unit":"문법","q":"어법상 옳은 것은?","opts":["Despite he was tired, he kept working.","The children were exciting about the trip.","I have never seen such beautiful a sunset.","Seldom does she complain about her workload."],"ans":3,"exp":"부정의 뜻을 가진 Seldom이 문장 앞에 오면 does she complain으로 도치된다. despite는 전치사라 절이 올 수 없고(Although), 감정을 느끼는 쪽은 excited로 쓰며, such는 such a beautiful sunset의 어순을 취한다."},
{"id":"e33","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["The patient is said to have recovered completely.","I would rather stay home than go out tonight.","She had her blood pressure check by a nurse.","It was not until midnight that he came home."],"ans":2,"exp":"have + 목적어 + 목적격 보어 구문에서 혈압은 \"측정되는\" 것이므로 과거분사 checked를 써야 한다. 나머지는 완료부정사, would rather A than B, It was not until ~ that 강조 구문이 바르게 쓰였다."},
{"id":"e34","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["The information you gave me were very useful.","Being sick, he stayed in bed all day.","He talks as if he knew everything.","What surprised me was his calm reaction."],"ans":0,"exp":"information은 셀 수 없는 명사로 단수 취급하므로 were가 아니라 was가 옳다. 나머지는 분사구문, as if 가정법 과거, 관계대명사 what이 이끄는 주어절이 바르게 쓰였다."},
{"id":"e35","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["I remember meeting her at the conference last year.","The police is looking for the missing child.","A third of the residents are over sixty-five.","Mathematics is my favorite subject."],"ans":1,"exp":"the police는 항상 복수 취급하므로 are looking이 옳다. remember + 동명사는 \"(과거에) ~한 것을 기억하다\", 분수 + of + 복수 명사는 복수 동사, 학과 이름 mathematics는 단수 취급이다."},
{"id":"e36","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["She is the woman whose son won the award.","He is taller than any other boy in his class.","The house needs repairing before winter.","You had better not to tell him the news."],"ans":3,"exp":"had better의 부정은 had better not + 동사원형이므로 not tell이 옳다. 나머지는 소유격 관계대명사 whose, 비교급 + than any other + 단수 명사, need + 동명사(수동의 뜻)가 바르게 쓰였다."},
{"id":"e37","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["When I arrived at the station, the train had already left.","I will call you as soon as I will arrive at the airport.","By next year, she will have worked here for a decade.","He has been waiting for two hours."],"ans":1,"exp":"시간을 나타내는 부사절(as soon as)에서는 미래의 일도 현재 시제로 쓰므로 as soon as I arrive가 옳다. 나머지는 과거완료, 미래완료, 현재완료진행이 알맞게 쓰였다."},
{"id":"e38","subj":"영어","unit":"문법","q":"어법상 옳지 않은 것은?","opts":["He was seen enter the building by a guard.","The man standing at the door is my uncle.","Written in simple English, the book is easy to read.","With his eyes closed, he listened to the music."],"ans":0,"exp":"지각동사의 목적격 보어로 쓰인 동사원형은 수동태가 되면 to부정사로 바뀌므로 was seen to enter(또는 entering)가 옳다. 나머지는 현재분사의 명사 수식, 과거분사 분사구문, with + 목적어 + 분사 구문이 바르게 쓰였다."},
{"id":"e39","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것은?\n\nThe hospital, (A) __which__ was built in 1990, (B) __is known__ for its emergency care, and most of its nurses (C) __has worked__ there for more than ten years, (D) __providing__ skilled care to patients.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"most of 뒤의 명사가 복수(its nurses)이므로 동사도 복수인 have worked가 되어야 한다. (A)는 콤마 뒤의 주격 관계대명사, (B)는 \"~로 알려져 있다\"는 수동태, (D)는 능동의 분사구문으로 모두 옳다."},
{"id":"e40","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것은?\n\n(A) __Although__ the weather was bad, the festival was not canceled, and thousands of visitors (B) __enjoyed__ (C) __themselves__ while (D) __listened__ to live music.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"접속사 while 뒤에 주어 없이 동사만 올 수 없다. 주어(they)와 be동사를 생략한 꼴인 while listening이 되어야 한다. (A)는 절을 이끄는 접속사, (B)는 과거 시제 동사, (C)는 enjoy oneself의 재귀대명사로 옳다."},
{"id":"e41","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것은?\n\nThe new policy requires that all employees (A) __complete__ the safety training, (B) __that__ is offered online, (C) __within__ thirty days of (D) __being hired__.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"관계대명사 that은 콤마 뒤의 계속적 용법으로 쓸 수 없으므로 which가 되어야 한다. (A)는 require that 뒤의 (should) 동사원형, (C)는 기한을 나타내는 전치사, (D)는 전치사 of 뒤의 수동형 동명사로 옳다."},
{"id":"e42","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것은?\n\n(A) __Surrounding__ by mountains, the village (B) __remained__ isolated for centuries, (C) __which__ helped its residents (D) __preserve__ their traditions.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"마을은 산에 \"둘러싸인\" 것이므로 수동의 뜻을 가진 과거분사 Surrounded로 분사구문을 시작해야 한다. (B)는 보어를 취하는 동사, (C)는 앞 절 전체를 받는 관계대명사, (D)는 help + 목적어 + 동사원형으로 옳다."},
{"id":"e43","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것은?\n\nResearchers have found that people (A) __who__ sleep less than six hours a night are (B) __more likely__ to catch a cold than (C) __those__ who sleep (D) __enough long__.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"enough가 부사나 형용사를 꾸밀 때는 뒤에 놓으므로 long enough가 옳다. (A)는 people을 받는 주격 관계대명사, (B)는 be likely to의 비교급, (C)는 people을 대신하는 지시대명사로 옳다."},
{"id":"e44","subj":"영어","unit":"문법","q":"우리말을 영어로 잘못 옮긴 것은?","opts":["그는 너무 피곤해서 더 이상 걸을 수 없었다. → He was so tired that he could not walk any longer.","그녀는 내가 만난 사람 중 가장 친절하다. → She is the kindest person that I have ever met.","비가 올 경우에 대비해 우산을 가져가라. → Take an umbrella in case it rains.","그는 어제 여기에 왔어야 했다. → He must have come here yesterday."],"ans":3,"exp":"must have + 과거분사는 \"~했음에 틀림없다\"라는 강한 추측이다. \"~했어야 했다(그런데 하지 않았다)\"는 should have come으로 써야 한다. 나머지는 so ~ that, 최상급 + that + 현재완료, in case + 현재 시제가 바르게 쓰였다."},
{"id":"e45","subj":"영어","unit":"문법","q":"우리말을 영어로 가장 잘 옮긴 것은?\n\n그 문제는 다음 회의에서 논의될 것이다.","opts":["The issue will discuss at the next meeting.","The issue will be discussed at the next meeting.","The issue will be discussed about at the next meeting.","The issue will be discussing at the next meeting."],"ans":1,"exp":"문제는 \"논의되는\" 대상이므로 수동태 will be discussed를 쓴다. discuss는 타동사여서 전치사 about을 붙이지 않으며, 능동형인 will discuss와 will be discussing은 주어가 논의를 하는 뜻이 되어 틀리다."},
{"id":"e46","subj":"영어","unit":"문법","q":"우리말을 영어로 잘못 옮긴 것은?","opts":["나는 어젯밤에 지갑을 도난당했다. → I was stolen my wallet last night.","그 약은 식사 후에 복용해야 한다. → The medicine should be taken after meals.","그가 정직하다는 것은 의심의 여지가 없다. → There is no doubt that he is honest.","날씨가 좋으면 우리는 소풍을 갈 것이다. → If the weather is nice, we will go on a picnic."],"ans":0,"exp":"steal의 목적어는 훔친 물건이므로 사람을 주어로 한 수동태를 만들 수 없다. I had my wallet stolen 또는 My wallet was stolen으로 써야 한다. 나머지는 조동사 수동태, 동격의 that절, 조건절의 현재 시제가 바르게 쓰였다."},
{"id":"e47","subj":"영어","unit":"문법","q":"우리말을 영어로 가장 잘 옮긴 것은?\n\n그녀는 그 소식을 듣자마자 울기 시작했다.","opts":["No sooner she had heard the news than she began to cry.","As soon as she will hear the news, she began to cry.","On hearing the news, she began to cry.","Hardly had she heard the news than she begins to cry."],"ans":2,"exp":"on + 동명사는 \"~하자마자\"라는 뜻이다. No sooner가 문장 앞에 오면 had she heard로 도치해야 하고, 과거의 일에 will hear를 쓸 수 없으며, Hardly는 when이나 before와 짝을 이루고 주절도 과거 시제(began)여야 한다."},
{"id":"e48","subj":"영어","unit":"문법","q":"우리말을 영어로 잘못 옮긴 것은?","opts":["나는 어렸을 때 이 강에서 수영하곤 했다. → I am used to swimming in this river when I was young.","이 방은 저 방보다 두 배 크다. → This room is twice as large as that one.","그는 나에게 문을 닫지 말라고 말했다. → He told me not to close the door.","나는 그가 오든 안 오든 상관하지 않는다. → I don't care whether he comes or not."],"ans":0,"exp":"be used to + 동명사는 \"~에 익숙하다\"라는 뜻이다. \"(과거에) ~하곤 했다\"는 used to + 동사원형이므로 I used to swim으로 써야 한다. 나머지는 배수사 + as ~ as, to부정사의 부정(not to), whether ~ or not이 바르게 쓰였다."},
{"id":"e49","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: Good morning. I'd like to see a doctor, please.\nB: Do you have an appointment?\nA: No, I don't. ______\nB: Let me check. Dr. Kim can see you at eleven.","opts":["Is there any chance I could be seen today?","I already saw the doctor yesterday.","I'd like to cancel my appointment.","How much do I owe you?"],"ans":0,"exp":"예약이 없다고 한 뒤 B가 \"확인해 보겠다, 11시에 진료받을 수 있다\"고 답했으므로, 오늘 진료를 받을 수 있는지 묻는 말이 알맞다. 예약이 없으므로 취소할 수 없고, 진료비를 묻는 말에는 B의 대답이 이어지지 않는다."},
{"id":"e50","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: Excuse me, I'd like to get a copy of my resident registration.\nB: Sure. May I see your ID card?\nA: Here you are. How long will it take?\nB: ______\nA: Great. I'll wait here, then.","opts":["It costs four hundred won per copy.","It'll be ready in just a few minutes.","You should have come yesterday.","The office closes at six on weekdays."],"ans":1,"exp":"얼마나 걸리는지(How long will it take?) 물었고, A가 \"그럼 여기서 기다리겠다\"고 했으므로 몇 분이면 된다는 대답이 알맞다. 나머지는 수수료, 방문 시기, 근무 시간에 대한 말이어서 질문과 맞지 않는다."},
{"id":"e51","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: You look pale. Are you feeling all right?\nB: Not really. I've had a headache since this morning.\nA: ______\nB: I did, but it didn't help much.","opts":["Shall I open the window for you?","How long have you had it?","Did you take any medicine?","Would you like a glass of water?"],"ans":2,"exp":"B가 \"I did(그렇게 했다), 하지만 별로 도움이 안 됐다\"라고 답했으므로 과거의 행동을 묻는 Did you ~? 질문이 와야 한다. 약을 먹었느냐는 질문만 이 대답과 이어진다."},
{"id":"e52","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: I'm thinking of applying for the job at the public health center.\nB: That's great! You've always wanted to work in the community.\nA: But I'm worried that I don't have enough experience.\nB: ______ You'll never know unless you try.","opts":["I told you so.","You'd better give up now.","That's out of the question.","Just give it a shot."],"ans":3,"exp":"give it a shot은 \"한번 해 보다\"라는 뜻이다. 뒤에 \"해 보지 않으면 모른다\"는 격려가 이어지므로 도전을 권하는 말이 알맞다. out of the question은 \"불가능한\", I told you so는 \"내가 그럴 거라고 했잖아\"라는 뜻이다."},
{"id":"e53","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: Hello, this is the City Hall information desk. How may I help you?\nB: Hi, I'm calling about the free flu vaccination. Who is eligible?\nA: ______\nB: Oh, my mother is seventy, so she qualifies. Thank you.","opts":["It is given at the community center.","Residents aged sixty-five and over are.","You need to bring your ID card.","It starts next Monday morning."],"ans":1,"exp":"eligible은 \"자격이 있는\"이라는 뜻이다. 누가 대상인지 물었고 B가 \"어머니가 일흔이니 해당된다\"고 했으므로 나이 기준을 알려 주는 대답이 알맞다. 나머지는 장소, 준비물, 시작 날짜에 대한 말이다."},
{"id":"e54","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: How was your trip to Jeju?\nB: It was fantastic, except for the last day.\nA: Why? What happened?\nB: ______\nA: Oh no. Did you get home all right?","opts":["The weather was perfect the whole time.","I visited a beautiful waterfall.","I'd love to go there again.","My flight was canceled because of strong winds."],"ans":3,"exp":"마지막 날만 빼고 좋았다고 했고, A가 \"저런, 집에는 잘 왔어?\"라고 걱정하므로 마지막 날에 생긴 문제를 말해야 한다. 비행기가 결항되었다는 말만 이 흐름에 맞고, 나머지는 모두 좋았던 일이다."},
{"id":"e55","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: Do you have time to help me with these files this afternoon?\nB: I'm afraid not. ______\nA: Oh, I see. Then I'll ask Jiho.","opts":["I'm all ears.","It's on the house.","I'm tied up all day.","Be my guest."],"ans":2,"exp":"be tied up은 \"(일로) 바빠서 꼼짝 못하다\"라는 뜻이다. I'm afraid not으로 거절한 뒤 그 이유를 말하는 자리다. I'm all ears는 \"잘 듣고 있다\", on the house는 \"가게에서 무료로 주는\", Be my guest는 \"그렇게 하세요\"라는 뜻이다."},
{"id":"e56","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: Excuse me, how can I get to the National Museum?\nB: Take bus number 7 from the stop across the street.\nA: ______\nB: About twenty minutes, depending on traffic.","opts":["How much is the fare?","Where should I get off?","How often does the bus run?","How long does it take to get there?"],"ans":3,"exp":"\"교통 상황에 따라 20분쯤\"이라는 대답은 걸리는 시간을 말한 것이므로 How long does it take ~?가 알맞다. 배차 간격을 묻는 How often ~?에는 Every twenty minutes처럼 답하고, 교통 상황에 따라 달라진다는 말과도 맞지 않는다."},
{"id":"e57","subj":"영어","unit":"생활영어","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\nA: This copier is out of order again.\nB: Again? It was repaired just last week.\nA: I know. ______\nB: I agree. It would cost less than fixing it over and over.","opts":["I think it's time we bought a new one.","Let's call the repairman again.","I'll make the copies later.","It seems to be working fine now."],"ans":0,"exp":"B가 동의하면서 \"계속 고치는 것보다 돈이 덜 들 것\"이라고 했으므로, A는 새 복사기를 사자고 제안한 것이다. it's time + 주어 + 과거 동사는 \"이제 ~할 때다\"라는 뜻이다. 수리 기사를 다시 부르자는 말은 B의 대답과 어긋난다."},
{"id":"e58","subj":"영어","unit":"생활영어","q":"두 사람의 대화 중 가장 어색한 것은?","opts":["A: Do you mind if I open the window? / B: Not at all. Go ahead.","A: How do you like your new job? / B: I got it through a friend.","A: Can I take a rain check on dinner? / B: Sure. Let's do it another time.","A: I'm sorry I'm late. / B: That's all right. We've just started."],"ans":1,"exp":"How do you like ~?는 \"~이 어때요, 마음에 들어요?\"라고 느낌을 묻는 말이다. 친구를 통해 얻었다는 대답은 방법(How did you get ~?)에 대한 답이어서 어색하다. take a rain check은 \"다음으로 미루다\"라는 뜻이다."},
{"id":"e59","subj":"영어","unit":"생활영어","q":"두 사람의 대화 중 가장 어색한 것은?","opts":["A: What do you do for a living? / B: I work as a nurse at a public hospital.","A: Could you give me a hand with this box? / B: Sure. Where do you want it?","A: Would you like some more coffee? / B: No, thanks. I've had enough.","A: How long have you been waiting? / B: I'll wait for you at the bus stop."],"ans":3,"exp":"얼마나 오래 기다렸는지 물었으므로 For about ten minutes처럼 기간으로 답해야 한다. 버스 정류장에서 기다리겠다는 말은 장소와 앞으로의 일을 말한 것이어서 어색하다. give me a hand는 \"도와주다\"라는 뜻이다."},
{"id":"e60","subj":"영어","unit":"생활영어","q":"두 사람의 대화 중 가장 어색한 것은?","opts":["A: I passed the civil service exam! / B: Congratulations! You deserve it.","A: What's the weather going to be like tomorrow? / B: It's supposed to rain in the afternoon.","A: May I ask who's calling, please? / B: Yes, you can call me anytime.","A: Let's split the bill. / B: No, it's on me this time."],"ans":2,"exp":"May I ask who's calling?은 전화에서 \"누구신지요?\"라고 묻는 말이므로 This is ~ 처럼 이름을 밝혀야 한다. 언제든 전화해도 된다는 대답은 질문과 맞지 않는다. It's on me는 \"내가 낼게\"라는 뜻이다."},
{"id":"e61","subj":"영어","unit":"생활영어","q":"두 사람의 대화 중 가장 어색한 것은?","opts":["A: Would you mind turning down the volume? / B: Yes, I would. I'll turn it down right away.","A: Have you ever been to Gyeongju? / B: Yes, I went there on a school trip.","A: I have a terrible toothache. / B: You'd better see a dentist right away.","A: When is the report due? / B: By this Friday at the latest."],"ans":0,"exp":"Would you mind ~?는 \"~하는 것을 꺼리십니까?\"라는 뜻이어서 Yes, I would는 \"싫다\"는 거절이 된다. 그런데 바로 소리를 줄이겠다고 했으므로 앞뒤가 맞지 않는다. 승낙하려면 Not at all이나 Of course not이라고 한다."},
{"id":"e62","subj":"영어","unit":"생활영어","q":"두 사람의 대화 중 가장 어색한 것은?","opts":["A: How often do you work out? / B: At the gym near my office.","A: Is this seat taken? / B: No, go ahead.","A: Thank you for helping me move. / B: Don't mention it.","A: What's wrong with your leg? / B: I sprained my ankle playing soccer."],"ans":0,"exp":"How often ~?은 빈도를 묻는 말이므로 Three times a week처럼 답해야 한다. 사무실 근처 체육관이라는 대답은 장소(Where)에 대한 답이어서 어색하다. Don't mention it은 \"천만에요\"라는 뜻이다."},
{"id":"e63","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nHand washing is one of the simplest ways to prevent the spread of infection, yet many people do it poorly. A quick rinse under running water removes very little. Experts recommend rubbing the hands with soap for at least twenty seconds, paying attention to the areas between the fingers and under the nails. Drying matters, too, because germs move more easily from wet hands than from dry ones. In hospitals, where patients are especially vulnerable, careful hand washing by staff and visitors has been shown to reduce infections considerably.","opts":["Proper Hand Washing: A Simple Shield against Infection","Why Hospitals Should Limit the Number of Visitors","The History of Soap and Its Manufacture","Dry Skin: Common Causes and Treatments"],"ans":0,"exp":"손 씻기는 감염을 막는 간단한 방법이지만 제대로 해야 효과가 있다는 글이다. 비누로 20초 이상 문지르고 잘 말려야 하며, 병원에서 특히 중요하다고 했다. 방문객 수 제한, 비누의 역사, 건조한 피부는 글에서 다루지 않는다."},
{"id":"e64","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nTrees in cities do far more than make streets look pleasant. Their leaves absorb pollutants and trap dust, improving the air that residents breathe. In summer, their shade can lower the temperature of streets and buildings by several degrees, which reduces the need for air conditioning. Their roots take in rainwater and so lessen the risk of flooding after heavy storms. Studies even suggest that people who live near green spaces report lower levels of stress. For these reasons, many city governments now treat trees as essential public facilities rather than as decoration.","opts":["difficulties of growing trees in crowded cities","ways to cut the cost of air conditioning","various benefits that trees bring to cities","major causes of flooding in urban areas"],"ans":2,"exp":"도시의 나무가 공기를 맑게 하고, 기온을 낮추고, 홍수 위험을 줄이고, 스트레스를 덜어 준다는 여러 이점을 나열한 글이다. 냉방비와 홍수는 그 예로 잠깐 나올 뿐이고, 나무를 기르기 어렵다는 내용은 없다."},
{"id":"e65","subj":"영어","unit":"독해 주제","q":"다음 글의 요지로 가장 적절한 것은?\n\nMany students believe that staying up all night before an exam is a sign of dedication. Research, however, tells a different story. During sleep, the brain sorts through what was learned during the day and stores it in long-term memory. Students who sleep after studying remember far more than those who stay awake for the same number of hours. Lack of sleep also weakens attention and judgment, so tired students make careless mistakes on questions they actually know. An extra hour of sleep may therefore be worth more than an extra hour with the textbook.","opts":["시험 전날에는 새로운 내용을 공부하지 말아야 한다.","충분한 수면은 학습 효과를 높이는 데 꼭 필요하다.","알맞은 수면 시간은 사람마다 다르다.","밤샘 공부는 집중력을 기르는 좋은 방법이다."],"ans":1,"exp":"잠을 자는 동안 뇌가 배운 것을 장기 기억으로 저장하고, 잠이 부족하면 주의력과 판단력이 떨어진다는 내용이다. 마지막 문장에서 한 시간 더 자는 것이 한 시간 더 공부하는 것보다 나을 수 있다고 정리한다. 밤샘이 좋다는 선지는 글과 반대다."},
{"id":"e66","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nGovernment documents are often filled with long sentences and technical terms that ordinary citizens find hard to follow. When people cannot understand a notice, they may miss a deadline, fill out a form incorrectly, or fail to receive a benefit they are entitled to. Offices then have to spend time answering the same questions by phone again and again. For this reason, a growing number of public agencies are training their employees to write in plain language: short sentences, familiar words, and the most important point first. Clear writing saves time and money for both the public and the government.","opts":["how citizens can apply for government benefits","the long history of government record keeping","the difficulty of learning technical terms","the need for plain language in public documents"],"ans":3,"exp":"공문서가 어려우면 시민은 기한을 놓치거나 혜택을 받지 못하고 기관은 같은 문의에 시간을 쓰게 되므로, 쉬운 말로 써야 한다는 글이다. 혜택 신청 방법이나 기록 관리의 역사는 다루지 않는다."},
{"id":"e67","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nAntibiotics have saved countless lives since they were first introduced, but their power is fading. Each time these drugs are used, a few bacteria that happen to resist them may survive and multiply. The more often antibiotics are taken unnecessarily, for example for a cold, which is caused by a virus, the faster such resistant bacteria spread. Infections that were once cured within a few days are becoming difficult to treat. Doctors therefore urge patients not to demand antibiotics for viral illnesses and to finish the full course when the drugs are truly needed.","opts":["The Discovery of the First Antibiotic","Antibiotic Overuse: Why the Drugs Are Losing Power","How to Cure a Cold within a Few Days","New Medicines That Will Replace Antibiotics"],"ans":1,"exp":"항생제를 불필요하게 자주 쓰면 내성균이 살아남아 퍼지고, 그래서 항생제의 효과가 약해지고 있다는 글이다. 항생제의 발견 과정이나 감기 치료법, 항생제를 대신할 새 약은 글의 내용이 아니다."},
{"id":"e68","subj":"영어","unit":"독해 주제","q":"다음 글의 요지로 가장 적절한 것은?\n\nWhen we think of good communicators, we usually picture people who speak well. Yet the most trusted colleagues are often those who listen well. A good listener does not plan a reply while the other person is still talking. Instead, he or she pays full attention, asks questions to check understanding, and waits before giving an opinion. People who feel heard are more willing to share problems early, which helps a team prevent small troubles from growing into large ones. Speaking skills may impress others, but it is careful listening that builds lasting trust.","opts":["신뢰를 쌓는 데에는 말솜씨보다 주의 깊게 듣는 태도가 중요하다.","회의에서는 자신의 의견을 먼저 분명하게 밝혀야 한다.","문제가 생기면 먼저 혼자 해결하려고 노력해야 한다.","말하기 능력은 꾸준히 훈련하면 누구나 기를 수 있다."],"ans":0,"exp":"가장 신뢰받는 동료는 말을 잘하는 사람이 아니라 잘 듣는 사람이라는 글이다. 마지막 문장의 \"it is careful listening that builds lasting trust\"가 요지다. 좋은 청자는 의견을 말하기 전에 기다린다고 했으므로 의견을 먼저 밝히라는 선지는 글과 맞지 않는다."},
{"id":"e69","subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nIn many countries the number of elderly people living alone is rising rapidly. Living alone is not a problem in itself, but it can become dangerous when no one notices that a person has fallen ill or has stopped eating properly. Some local governments have responded by asking mail carriers, meter readers, and delivery workers to report anything unusual at the homes they visit regularly. Others have installed sensors that send an alert when there has been no movement in a home for many hours. Such efforts aim to make sure that help arrives before a small problem turns into a tragedy.","opts":["reasons why elderly people prefer to live alone","poor working conditions of delivery workers","efforts to watch over elderly people living alone","privacy problems caused by sensors in homes"],"ans":2,"exp":"혼자 사는 노인이 늘어나자 지방정부가 집배원과 검침원 등의 신고, 움직임 감지 장치 같은 방법으로 이들을 살피려 한다는 글이다. 혼자 사는 이유, 배달 노동자의 근무 여건, 사생활 문제는 언급되지 않는다."},
{"id":"e70","subj":"영어","unit":"독해 주제","q":"다음 글의 제목으로 가장 적절한 것은?\n\nA large share of the food thrown away at home is still perfectly safe to eat. One reason is confusion about the dates printed on packages. Many shoppers assume that food becomes harmful the day after a \"sell-by\" date, although this date is only a guide for stores and says little about safety. Properly stored milk, eggs, and bread usually remain good for days beyond it. To reduce waste, some countries have replaced the sell-by date with a \"use-by\" date, which tells consumers how long a product can actually be eaten.","opts":["How to Store Milk and Eggs at Home","Why Fresh Food Costs More Than Before","The Dangers of Eating Expired Food","Misunderstood Date Labels and Food Waste"],"ans":3,"exp":"포장에 적힌 판매 기한을 먹을 수 있는 기한으로 오해해서 멀쩡한 음식을 버리게 되고, 이를 줄이려고 표시를 바꾸는 나라가 있다는 글이다. 기한이 지난 음식이 위험하다는 것은 글이 바로잡으려는 오해이고, 보관 방법이나 식품 가격은 중심 내용이 아니다."},
{"id":"e71","subj":"영어","unit":"독해 내용일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\nThe Hanbit Public Library will be closed from March 2 to March 15 for renovation of its reading rooms. During this period, books cannot be borrowed, but they may be returned at any time through the book drop beside the main entrance. Due dates that fall within the closure will be extended automatically to March 20, and no late fees will be charged. The online library, including e-books and audiobooks, will remain available as usual. The library will reopen on March 16 with longer weekend hours.","opts":["The library will be closed in order to renovate its reading rooms.","Books can be returned while the library is closed.","Late fees will be charged for books due during the closure.","E-books can still be used during the closure."],"ans":2,"exp":"휴관 기간에 반납 기한이 걸린 책은 3월 20일까지 자동 연장되고 연체료를 물리지 않는다(no late fees will be charged)고 했다. 열람실 보수를 위한 휴관이고, 무인 반납함으로 반납할 수 있으며, 전자책은 평소처럼 이용할 수 있다."},
{"id":"e72","subj":"영어","unit":"독해 내용일치","q":"sea otter에 관한 다음 글의 내용과 일치하는 것은?\n\nSea otters spend almost their entire lives in the cold coastal waters of the North Pacific. Unlike whales and seals, they have no layer of fat under the skin; instead, they are kept warm by the thickest fur of any animal. To maintain their body heat, they must eat about a quarter of their body weight every day. They often float on their backs and use a stone to crack open shellfish. When they sleep, they wrap themselves in seaweed so that they do not drift away.","opts":["They have a thick layer of fat like seals.","They eat about half of their body weight each day.","They sleep on rocks along the shore.","They use stones to open shellfish."],"ans":3,"exp":"해달은 배를 위로 하고 떠서 돌로 조개를 깨 먹는다고 했다. 고래나 물범과 달리 지방층이 없고 촘촘한 털로 체온을 지키며, 하루에 몸무게의 4분의 1쯤을 먹고, 잘 때는 떠내려가지 않도록 해초를 몸에 감는다."},
{"id":"e73","subj":"영어","unit":"독해 내용일치","q":"다음 안내문의 내용과 일치하지 않는 것은?\n\nThe Seowon Public Health Center will offer free flu vaccinations from October 10 to November 30. Residents aged 65 and over, pregnant women, and children under 13 are eligible. Vaccinations are given on weekdays from 9 a.m. to 5 p.m., and no reservation is needed. Please bring an ID card; children must be accompanied by a parent or guardian. Those who have a fever on the day of the visit will be asked to come back after they recover. After the shot, you should stay at the center for about twenty minutes so that staff can check for any reaction.","opts":["임신부는 무료 접종 대상이다.","접종을 받으려면 미리 예약해야 한다.","열이 있는 사람은 회복한 뒤에 다시 와야 한다.","접종 후 20분쯤 보건소에 머물러야 한다."],"ans":1,"exp":"no reservation is needed라고 했으므로 예약은 필요 없다. 대상은 65세 이상 주민, 임신부, 13세 미만 어린이이고, 당일 열이 있으면 회복 후 다시 오도록 하며, 접종 뒤에는 이상 반응을 살피기 위해 20분쯤 머문다."},
{"id":"e74","subj":"영어","unit":"독해 내용일치","q":"Clara Whitfield에 관한 다음 글의 내용과 일치하는 것은?\n\nClara Whitfield was born in 1902 in a small farming town. After losing her younger brother to an infection, she decided to become a nurse and entered nursing school at eighteen. She worked in a city hospital for six years before returning to her hometown, where there was no doctor within thirty miles. There she opened a small clinic in her own house and visited patients on horseback. She also taught mothers about hygiene and child nutrition. She never married, and she ran the clinic until she retired at seventy.","opts":["She became a nurse because her parents wanted her to.","She worked in a city hospital for sixteen years.","She opened a clinic in a building provided by the town.","She taught mothers about hygiene and nutrition."],"ans":3,"exp":"그녀는 어머니들에게 위생과 아이의 영양을 가르쳤다고 했다. 간호사가 된 계기는 남동생을 감염병으로 잃은 일이었고, 도시 병원에서 일한 기간은 6년이며, 진료소는 자기 집에 열었다."},
{"id":"e75","subj":"영어","unit":"독해 내용일치","q":"GreenWheel에 관한 다음 글의 내용과 일치하지 않는 것은?\n\nThe city's public bicycle service, GreenWheel, is open to anyone aged 15 or older. Users register through a mobile app and pay 1,000 won for one hour or 5,000 won for a one-day pass. Bicycles can be picked up and returned at any of the 240 stations across the city, not necessarily the one where the ride began. Helmets are not provided, so riders are advised to bring their own. A bicycle that is not returned within 24 hours is reported as lost, and the user is charged a penalty.","opts":["A bicycle must be returned to the station where it was picked up.","Users must be at least 15 years old.","A one-day pass costs 5,000 won.","Helmets are not provided to riders."],"ans":0,"exp":"자전거는 처음 빌린 곳이 아니어도 시내 240개 대여소 어디에나 반납할 수 있다고 했다. 이용 자격은 15세 이상, 1일권은 5,000원이며, 헬멧은 제공하지 않으므로 직접 가져오도록 권한다."},
