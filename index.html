{"id":"m177","subj":"간호관리","unit":"간호윤리","q":"말기 암 환자가 더 이상의 항암 치료를 받지 않겠다고 분명히 밝혔으나, 의료진은 치료를 계속하는 것이 환자에게 이롭다고 판단하고 있다. 이 상황에서 충돌하는 윤리 원칙은?","opts":["자율성 존중의 원칙과 정의의 원칙","선행의 원칙과 정의의 원칙","자율성 존중의 원칙과 선행의 원칙","악행금지의 원칙과 정의의 원칙"],"ans":2,"exp":"스스로 결정할 능력이 있는 환자의 치료 거부를 존중해야 한다는 것은 자율성 존중의 원칙이고, 환자에게 이로운 치료를 해야 한다는 것은 선행의 원칙이다. 두 원칙이 서로 다른 행동을 요구하여 윤리적 딜레마가 생긴다. 정의의 원칙은 자원과 부담을 공정하게 나누는 문제에 적용된다."},
{"id":"m178","subj":"간호관리","unit":"간호윤리","q":"환자가 \"제 검사 결과를 숨기지 말고 사실대로 말해 주세요\"라고 요청하였다. 환자에게 진실을 말해야 한다는 윤리 규칙은?","opts":["신의","정직","비밀유지","정의"],"ans":1,"exp":"정직(veracity)은 진실을 말하고 상대를 속이지 않아야 한다는 규칙이다. 신의(fidelity, 성실)는 환자와 한 약속을 지켜야 한다는 규칙이고, 비밀유지(confidentiality)는 알게 된 환자의 정보를 남에게 알리지 않아야 한다는 규칙이다. 정의는 공정한 분배에 관한 원칙이다."},
{"id":"m179","subj":"간호관리","unit":"간호윤리","q":"\"환자를 안심시키는 결과를 가져오더라도 거짓말은 그 자체로 옳지 않으므로 해서는 안 된다\"는 판단의 바탕이 되는 윤리 이론은?","opts":["공리주의","의무론","윤리적 상대주의","윤리적 이기주의"],"ans":1,"exp":"의무론은 행위의 옳고 그름이 결과가 아니라 행위 자체가 도덕적 의무와 규칙에 맞는지에 달려 있다고 본다. 공리주의는 결과가 최대 다수에게 최대의 행복을 주는지로 판단하므로, 결과가 좋다면 거짓말도 허용될 수 있다고 본다."},
{"id":"m180","subj":"간호관리","unit":"간호윤리","q":"말기 환자의 심한 통증을 줄이려고 모르핀을 투여하면 호흡 억제라는 나쁜 결과가 함께 생길 수 있다. 통증 완화라는 좋은 결과만을 의도하였다면 이 행위가 허용될 수 있다고 보는 원리는?","opts":["선의의 간섭주의","분배적 정의의 원리","대리 판단의 원리","이중효과의 원리"],"ans":3,"exp":"이중효과의 원리는 한 행위가 좋은 결과와 나쁜 결과를 함께 낳을 때, 행위 자체가 나쁘지 않고 좋은 결과만을 의도하였으며 나쁜 결과가 좋은 결과의 수단이 아니고 좋은 결과가 더 클 경우 그 행위가 허용된다고 본다. 선의의 간섭주의는 환자의 이익을 이유로 환자의 뜻과 관계없이 결정하는 것이다."},
{"id":"m181","subj":"간호관리","unit":"간호윤리","q":"한국간호사 윤리강령이 밝히는 간호사의 기본 책무에 해당하지 않는 것은?","opts":["의학적 진단","건강 증진","질병 예방","고통 경감"],"ans":0,"exp":"한국간호사 윤리강령은 간호의 근본 이념을 인간 생명의 존엄성과 기본권을 존중하고 옹호하는 것으로 밝히고, 간호사의 책무를 대상자의 건강 증진, 질병 예방, 건강 회복, 고통 경감을 돕는 것으로 제시한다. 의학적 진단은 의사의 업무이다."},
{"id":"m182","subj":"간호관리","unit":"간호윤리","q":"야간 근무 중 간호사 A는 동료 간호사에게서 술 냄새가 나고, 투약을 준비하며 비틀거리는 것을 보았다. A가 가장 먼저 취할 행동은?","opts":["동료가 환자 간호를 하지 않게 하고 관리자에게 알린다","동료의 사정을 생각하여 모른 척하고 자기 일을 한다","근무가 끝난 뒤에 동료를 따로 불러 조용히 충고한다","친한 동료들에게 먼저 알리고 어떻게 할지 상의한다"],"ans":0,"exp":"간호사의 가장 중요한 책임은 대상자의 안전을 지키는 것이다. 동료가 안전하게 간호할 수 없는 상태라면 먼저 환자에게서 떨어지게 하고 관리자에게 보고하여 적절한 조치가 이루어지게 해야 한다. 모른 척하거나 나중으로 미루면 환자가 위험에 놓인다."},
{"id":"m183","subj":"간호관리","unit":"간호역사","q":"1899년 국제간호협의회(ICN)의 창립을 이끌고 초대 회장을 지낸 영국의 간호 지도자는?","opts":["나이팅게일(Nightingale)","왈드(Wald)","뒤낭(Dunant)","펜윅(Fenwick)"],"ans":3,"exp":"영국의 펜윅은 간호사 면허 등록 제도를 주장하고 1899년 국제간호협의회 창립을 이끌어 초대 회장이 되었다. 나이팅게일은 근대 간호 교육의 기초를 세웠고, 왈드는 미국에서 헨리가 구제사업소를 세워 지역사회 간호를 발전시켰으며, 뒤낭은 국제적십자를 창설하였다."},
{"id":"m184","subj":"간호관리","unit":"간호역사","q":"종교개혁 뒤 수도원과 교회가 운영하던 병원이 문을 닫고, 훈련받지 않은 사람들이 간호를 맡으면서 간호의 질과 사회적 지위가 크게 떨어진 시기를 무엇이라 하는가?","opts":["간호의 암흑기","초기 기독교 시대","십자군 시대","근대 간호 시대"],"ans":0,"exp":"종교개혁으로 가톨릭 수도원이 폐쇄되면서 간호를 맡던 수도자들이 흩어지고, 교육받지 못한 사람들이 생계를 위해 간호하게 되어 간호가 크게 쇠퇴한 16세기부터 19세기 중반까지를 간호의 암흑기라 한다. 초기 기독교 시대에는 여집사들이 봉사로 간호하였고, 십자군 시대에는 기사간호단이 활동하였다."},
{"id":"m185","subj":"간호관리","unit":"간호역사","q":"1836년 독일 카이저스베르트에 여집사 간호사 양성소를 세워 체계적인 간호 교육을 하였고, 나이팅게일도 이곳에서 교육을 받았다. 이 양성소를 세운 사람은?","opts":["뒤낭(Dunant)","빈센트 드 폴(Vincent de Paul)","플리드너(Fliedner)","프라이(Fry)"],"ans":2,"exp":"독일의 플리드너 목사 부부는 1836년 카이저스베르트에 여집사 간호사 양성소를 세워 근대 간호 교육의 본보기를 만들었다. 뒤낭은 국제적십자를 창설하였고, 빈센트 드 폴은 17세기 프랑스에서 자선수녀단을 세웠으며, 프라이는 영국에서 교도소 개혁과 간호 활동을 하였다."},
{"id":"m186","subj":"간호관리","unit":"간호역사","q":"1923년에 창립되어 오늘날 대한간호협회의 모체가 된 단체는?","opts":["대한적십자사","조선간호부회","대한의원","보구여관"],"ans":1,"exp":"조선간호부회는 1923년에 한국인 간호사와 서양인 선교 간호사들이 함께 만든 단체로, 광복 뒤 조선간호협회를 거쳐 1948년 대한간호협회로 이름을 바꾸었다. 대한의원은 대한제국 때의 국립 병원이고, 보구여관은 1903년에 간호원 양성소가 설치된 여성 병원이다."},
{"id":"m187","subj":"간호관리","unit":"마케팅","q":"서비스 마케팅 믹스 7P 중 다음 활동이 해당하는 요소는?\n\n병동 입구의 안내 표지를 알아보기 쉽게 바꾸고 병실 인테리어와 간호사 유니폼을 새로 단장하여, 눈에 보이지 않는 간호 서비스의 질을 고객이 짐작할 수 있게 하였다.","opts":["과정","물리적 증거","사람","촉진"],"ans":1,"exp":"물리적 증거(physical evidence)는 시설, 인테리어, 표지, 유니폼처럼 무형의 서비스를 눈에 보이게 해 주는 단서이다. 과정(process)은 서비스가 전달되는 절차와 흐름, 사람(people)은 서비스를 제공하는 직원과 고객, 촉진(promotion)은 광고와 홍보로 서비스를 알리는 활동이다."},
{"id":"m188","subj":"간호관리","unit":"마케팅","q":"A 병원 간호부가 지역 주민을 대상으로 무료 건강 강좌를 열고, 병원 소식지와 누리소통망(SNS)으로 가정간호 서비스를 알렸다. 마케팅 믹스(4P) 중 어느 전략인가?","opts":["제품 전략","가격 전략","유통 전략","촉진 전략"],"ans":3,"exp":"촉진(promotion) 전략은 광고, 홍보, 건강 강좌, 인적 접촉으로 서비스를 고객에게 알리고 이용을 유도하는 활동이다. 제품 전략은 새로운 간호 서비스를 개발하고 질을 높이는 것, 가격 전략은 수가와 비용에 관한 것, 유통 전략은 서비스를 이용하는 장소와 시간, 경로를 넓히는 것이다."},
{"id":"m189","subj":"간호관리","unit":"마케팅","q":"STP 전략 중 포지셔닝(positioning)에 대한 설명으로 옳은 것은?","opts":["전체 시장을 비슷한 요구를 가진 집단으로 나눈다","나눈 시장 가운데 집중하여 공략할 시장을 고른다","표적 고객의 마음속에 경쟁자와 구별되는 위치를 잡는다","모든 고객에게 한 가지 서비스를 똑같이 제공한다"],"ans":2,"exp":"STP는 시장 세분화(segmentation), 표적시장 선정(targeting), 포지셔닝(positioning)의 순서로 진행한다. 포지셔닝은 표적 고객이 우리 서비스를 경쟁 서비스와 다르게 인식하도록 차별적인 위치를 심는 일이다. 시장을 나누는 것은 세분화, 공략할 시장을 고르는 것은 표적시장 선정이다."},
{"id":"m190","subj":"간호관리","unit":"마케팅","q":"병원이 간호사를 '내부 고객'으로 보고, 교육과 보상, 근무 환경 개선으로 간호사의 만족을 높여 환자에게 좋은 서비스를 제공하게 하려는 활동은?","opts":["외부 마케팅","내부 마케팅","상호작용 마케팅","사회 마케팅"],"ans":1,"exp":"내부 마케팅은 조직이 직원을 고객으로 보고 교육하고 동기를 부여하여 서비스의 질을 높이려는 활동이다. 외부 마케팅은 조직이 고객에게 서비스를 알리고 약속하는 활동이고, 상호작용 마케팅은 직원이 고객과 만나는 순간에 서비스를 제대로 전달하는 활동이다. 사회 마케팅은 금연처럼 사회에 이로운 행동 변화를 이끌려는 것이다."},
{"id":"m191","subj":"간호관리","unit":"리더십","q":"변혁적 리더십의 구성 요소 중 다음 사례에 해당하는 것은?\n\n수간호사는 간호사들에게 \"늘 해 오던 방식이 정말 최선일까요?\"라고 물으며, 기존의 인수인계 방식을 새로운 관점에서 다시 생각하고 창의적인 해결책을 내도록 격려한다.","opts":["개별적 배려","지적 자극","영감적 동기부여","예외 관리"],"ans":1,"exp":"지적 자극은 구성원이 기존의 가정과 방식에 의문을 품고 문제를 새로운 관점에서 보도록 북돋우는 것이다. 개별적 배려는 구성원 한 사람 한 사람의 요구에 관심을 두고 성장을 돕는 것, 영감적 동기부여는 비전을 제시하여 의욕을 불러일으키는 것이다. 예외 관리는 거래적 리더십의 요소이다."},
{"id":"m192","subj":"간호관리","unit":"리더십","q":"리더가 구성원 위에 서기보다 구성원의 말을 경청하고 공감하며, 구성원의 성장과 공동체 형성을 돕는 봉사자의 역할을 앞세우는 리더십은?","opts":["서번트 리더십","거래적 리더십","카리스마적 리더십","셀프 리더십"],"ans":0,"exp":"서번트 리더십은 리더가 구성원을 섬기는 자세로 경청, 공감, 치유, 구성원의 성장 지원, 공동체 형성에 힘쓰는 리더십이다. 거래적 리더십은 성과와 보상을 주고받는 것, 카리스마적 리더십은 리더의 비범한 매력과 비전으로 이끄는 것, 셀프 리더십은 자기 자신을 스스로 이끄는 것이다."},
{"id":"m193","subj":"간호관리","unit":"리더십","q":"자신의 가치관과 강점, 약점을 정확히 인식하고, 내면의 도덕적 기준에 따라 말과 행동을 일치시키며 구성원과 투명한 관계를 맺는 리더십은?","opts":["변혁적 리더십","서번트 리더십","슈퍼 리더십","진성 리더십"],"ans":3,"exp":"진성 리더십(authentic leadership)은 자기 인식, 내면화된 도덕적 관점, 균형 잡힌 정보 처리, 관계의 투명성을 요소로 하며, 리더의 진정성이 구성원의 신뢰를 낳는다고 본다. 변혁적 리더십은 비전으로 구성원의 변화를 이끄는 것, 서번트 리더십은 구성원을 섬기는 것, 슈퍼 리더십은 구성원을 셀프 리더로 키우는 것이다."},
{"id":"m194","subj":"간호관리","unit":"리더십","q":"슈퍼 리더십(super leadership)에 대한 설명으로 옳은 것은?","opts":["리더가 모든 결정을 내리고 구성원은 지시를 따른다","성과에 따른 보상과 처벌을 정확히 주고받게 한다","리더의 비범한 능력에 구성원이 의지하게 만든다","구성원이 스스로를 이끄는 셀프 리더가 되도록 돕는다"],"ans":3,"exp":"슈퍼 리더십은 리더가 셀프 리더십의 본보기가 되고 구성원에게 자율과 책임을 주어, 구성원 각자가 자신을 스스로 이끄는 셀프 리더가 되게 하는 리더십이다. 리더가 혼자 결정하는 것은 전제형, 보상과 처벌을 주고받는 것은 거래적 리더십, 리더의 비범함에 의지하게 하는 것은 카리스마적 리더십의 특징이다."},
{"id":"m195","subj":"간호관리","unit":"리더십","q":"피들러(Fiedler)의 상황적합 이론에 따를 때, 리더십 상황이 리더에게 매우 호의적이거나 매우 비호의적인 경우에 효과적인 리더는?","opts":["관계 지향적 리더","참여적 리더","과업 지향적 리더","자유방임적 리더"],"ans":2,"exp":"피들러는 리더-구성원 관계, 과업 구조, 직위 권력으로 정해지는 상황이 매우 호의적이거나 매우 비호의적일 때는 과업 지향적 리더가, 호의성이 중간 정도일 때는 관계 지향적 리더가 효과적이라고 하였다. 참여적 리더와 자유방임적 리더는 피들러 이론의 리더 유형이 아니다."},
{"id":"m196","subj":"간호관리","unit":"리더십","q":"하우스(House)의 경로-목표 이론에서 다음 사례에 해당하는 리더십 유형은?\n\n수간호사는 능력이 뛰어나고 성취 욕구가 강한 간호사들에게 \"올해 욕창 발생 0건\"이라는 도전적인 목표를 제시하고, 그들이 해낼 수 있다는 신뢰를 보인다.","opts":["지시적 리더십","성취지향적 리더십","지지적 리더십","참여적 리더십"],"ans":1,"exp":"성취지향적 리더십은 도전적인 목표를 세우고 구성원이 높은 수준의 성과를 낼 것이라는 기대와 신뢰를 보이는 유형이다. 지시적 리더십은 할 일과 방법을 구체적으로 알려 주는 것, 지지적 리더십은 구성원의 욕구와 복지에 관심을 보이는 것, 참여적 리더십은 결정에 구성원의 의견을 반영하는 것이다."},
{"id":"m197","subj":"간호관리","unit":"동기부여","q":"맥클리랜드(McClelland)의 성취동기 이론에서 성취 욕구가 높은 사람의 특성은?","opts":["다른 사람을 통제하고 영향력을 미치는 일을 좋아한다","적당히 어려운 목표를 택하고 결과에 대한 피드백을 원한다","다른 사람과 친밀한 관계를 맺는 일을 가장 중시한다","실패를 피하려고 누구나 할 수 있는 쉬운 목표만 택한다"],"ans":1,"exp":"성취 욕구가 높은 사람은 너무 쉽지도 불가능하지도 않은 적당히 어려운 목표를 택하고, 결과에 스스로 책임지려 하며, 자신이 얼마나 잘했는지 즉각적인 피드백을 원한다. 다른 사람을 통제하고 영향을 미치려는 것은 권력 욕구, 친밀한 관계를 중시하는 것은 친화 욕구이다."},
{"id":"m198","subj":"간호관리","unit":"동기부여","q":"로크(Locke)의 목표설정 이론에 따를 때 동기부여와 성과를 가장 높이는 목표는?","opts":["\"최선을 다하자\"와 같이 포괄적으로 정한 목표","누구나 쉽게 달성할 수 있도록 낮게 정한 목표","구체적이고 도전적이며 구성원이 받아들인 목표","구성원의 뜻과 관계없이 상급자가 내려보낸 목표"],"ans":2,"exp":"목표설정 이론은 구체적이고 어려운 목표가 막연하거나 쉬운 목표보다 높은 성과를 낳으며, 구성원이 목표를 받아들이고 진행 상황에 대한 피드백을 받을 때 효과가 커진다고 본다. \"최선을 다하자\" 같은 포괄적인 목표나 쉬운 목표, 구성원이 받아들이지 않은 목표는 동기를 높이기 어렵다."},
{"id":"m199","subj":"간호관리","unit":"동기부여","q":"간호사 A는 \"내가 아무리 노력해도 임상 경력 사다리 승급 심사가 요구하는 성과에는 이를 수 없다\"고 생각하여 준비를 포기하였다. 브룸(Vroom)의 기대이론에서 A가 낮게 지각한 요소는?","opts":["기대","수단성","유의성","공정성"],"ans":0,"exp":"기대(expectancy)는 노력하면 일정한 성과를 달성할 수 있다는 주관적 믿음으로, A는 이것을 낮게 보았다. 수단성은 성과를 내면 보상이 따를 것이라는 믿음이고, 유의성은 그 보상이 자신에게 얼마나 가치 있는지에 대한 선호이다. 공정성은 아담스의 공정성 이론의 개념이다."},
{"id":"m200","subj":"간호관리","unit":"관리이론","q":"민츠버그(Mintzberg)의 관리자 역할 중 다음 사례에 해당하는 것은?\n\n수간호사가 병동의 한정된 인력과 예산, 물품을 어느 업무에 얼마나 쓸지 정하고 그에 따라 근무표를 편성하였다.","opts":["대표자","자원분배자","대변인","섭외자"],"ans":1,"exp":"자원분배자는 인력, 예산, 물품, 시간 같은 자원을 누구에게 얼마나 줄지 결정하는 의사결정 역할이다. 대표자는 조직을 상징하여 의례적 업무를 하는 대인관계 역할, 섭외자(연결자)는 조직 밖의 사람들과 관계망을 유지하는 대인관계 역할, 대변인은 조직의 정보를 외부에 알리는 정보 역할이다."},
{"id":"c01","subj":"지역사회간호","unit":"역학 연구","q":"질병이 없는 집단을 위험요인 노출 여부에 따라 나눈 뒤, 시간이 지나면서 질병 발생을 추적 관찰하는 연구 방법은?","opts":["단면조사 연구","환자-대조군 연구","코호트 연구","사례 연구"],"ans":2,"exp":"코호트 연구는 노출 여부로 집단을 나누어 앞으로 추적하므로 발생률과 상대위험비를 직접 구할 수 있다. 환자-대조군 연구는 이미 병이 있는 집단과 없는 집단의 과거 노출을 비교하고, 단면조사 연구는 한 시점에서 노출과 질병을 동시에 조사한다."},
{"id":"c02","subj":"지역사회간호","unit":"역학 지표","q":"흡연자 1,000명 중 30명, 비흡연자 1,000명 중 10명에게 폐질환이 발생하였다. 흡연의 상대위험비는?","opts":["0.33","2","3","20"],"ans":2,"exp":"상대위험비는 노출군 발생률을 비노출군 발생률로 나눈 값이다. (30/1,000) ÷ (10/1,000) = 3. 흡연자가 비흡연자보다 발생 위험이 3배 높다는 뜻이다. 두 발생률의 차이(1,000명당 20명)는 귀속위험도이다."},
{"id":"c03","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 제1급감염병에 해당하는 것은?","opts":["결핵","홍역","에볼라바이러스병","B형간염"],"ans":2,"exp":"제1급감염병은 치명률이 높거나 집단 발생 우려가 커서 발생 즉시 신고하고 음압격리 같은 높은 수준의 격리가 필요한 감염병으로, 에볼라바이러스병이 해당한다. 결핵과 홍역은 제2급, B형간염은 제3급이다. 감염병 분류는 법령 개정으로 바뀔 수 있으니 시험 전에 현행 법령을 확인한다."},
{"id":"c04","subj":"지역사회간호","unit":"보건교육 이론","q":"범이론적 모형(변화단계 이론)에서 \"앞으로 6개월 이내에 행동을 바꿀 의도가 있는\" 단계는?","opts":["계획 전 단계","계획 단계","준비 단계","행동 단계"],"ans":1,"exp":"계획 단계(숙고 단계)는 6개월 이내에 변화할 의도가 있는 단계이다. 계획 전 단계는 6개월 이내에 변화 의도가 없고, 준비 단계는 1개월 이내에 실천할 의도가 있으며, 행동 단계는 실천한 지 6개월 미만, 유지 단계는 6개월 이상 지속한 단계이다."},
{"id":"c05","subj":"지역사회간호","unit":"가족간호","q":"가족과 학교, 직장, 보건기관 등 외부 체계와의 상호작용을 그림으로 나타내는 가족사정도구는?","opts":["가계도","가족밀착도","외부체계도","사회지지도"],"ans":2,"exp":"외부체계도(생태도)는 가족을 둘러싼 외부 체계와의 관계와 에너지 흐름을 보여 준다. 가계도는 3세대 이상의 가족 구조를, 가족밀착도는 가족 구성원 사이의 애착 관계를, 사회지지도는 가장 취약한 구성원을 중심으로 한 지지 체계를 나타낸다."},
{"id":"c06","subj":"지역사회간호","unit":"인구","q":"한 명의 여성이 가임 기간(15~49세) 동안 낳을 것으로 예상되는 평균 출생아 수를 나타내는 지표는?","opts":["조출생률","일반출산율","합계출산율","순재생산율"],"ans":2,"exp":"합계출산율은 연령별 출산율을 모두 더해 구하며 국가 간 출산 수준 비교에 쓴다. 조출생률은 인구 1,000명당 출생아 수, 일반출산율은 가임 여성 1,000명당 출생아 수이다. 순재생산율은 여아만 세고 어머니의 사망률까지 고려한 지표이다."},
{"id":"c07","subj":"지역사회간호","unit":"일차보건의료","q":"세계보건기구가 제시한 일차보건의료의 접근 원칙(4A)에 해당하지 않는 것은?","opts":["접근성","수용 가능성","지불 부담 능력","전문성"],"ans":3,"exp":"4A는 접근성(Accessible), 수용 가능성(Acceptable), 주민 참여(Available), 지불 부담 능력(Affordable)이다. 일차보건의료는 주민이 쉽게 이용하고, 받아들일 수 있고, 참여하며, 부담할 수 있는 기본 보건의료를 강조한다."},
{"id":"c08","subj":"지역사회간호","unit":"산업보건","q":"근로자 건강진단 결과 건강관리구분 \"D1\"의 의미는?","opts":["건강한 근로자","직업병 요관찰자","일반 질병 요관찰자","직업병 유소견자"],"ans":3,"exp":"D1은 직업성 질병의 소견이 있어 사후관리가 필요한 근로자이다. A는 건강한 근로자, C1은 직업병 요관찰자, C2는 일반 질병 요관찰자, D2는 일반 질병 유소견자, R은 2차 건강진단 대상자이다. C는 관찰, D는 질병으로 기억하고 숫자 1은 직업성, 2는 일반 질병으로 구분한다."},
{"id":"c09","subj":"지역사회간호","unit":"보건의료체계","q":"의사에게 등록된 주민 수에 따라 일정액을 지급하는 진료비 지불제도는?","opts":["행위별수가제","포괄수가제","인두제","총액계약제"],"ans":2,"exp":"인두제는 등록 인원 수로 보수가 정해져 예방 활동에 힘쓰게 되지만 과소 진료나 상급기관 의뢰 증가의 우려가 있다. 행위별수가제는 제공한 서비스 항목마다 값을 치르고, 포괄수가제는 질병군별로 정해진 금액을, 총액계약제는 보험자와 의사단체가 계약한 총액을 지급한다."},
{"id":"c10","subj":"지역사회간호","unit":"건강증진","q":"질병 예방 수준 중 2차 예방에 해당하는 것은?","opts":["영유아 예방접종","청소년 금연 교육","자궁경부암 조기 검진","뇌졸중 환자 재활 간호"],"ans":2,"exp":"2차 예방은 조기 발견과 조기 치료로, 건강검진과 집단 검진이 대표적이다. 예방접종과 보건교육은 질병 발생 자체를 막는 1차 예방이고, 재활은 장애를 줄이고 기능을 회복시키는 3차 예방이다."},
{"id":"c11","subj":"지역사회간호","unit":"역학 지표","q":"실제로 질병이 있는 사람 중에서 검사 결과가 양성으로 나온 사람의 비율은?","opts":["민감도","특이도","양성예측도","음성예측도"],"ans":0,"exp":"민감도는 환자를 환자로 가려내는 능력이다. 특이도는 질병이 없는 사람 중 검사 음성인 비율이다. 양성예측도는 검사 양성인 사람 중 실제 환자의 비율로, 유병률의 영향을 받는다."},
{"id":"c12","subj":"지역사회간호","unit":"보건행정","q":"보건소 설치의 근거가 되는 법률은?","opts":["보건의료기본법","지역보건법","국민건강증진법","농어촌 등 보건의료를 위한 특별조치법"],"ans":1,"exp":"보건소와 보건지소는 지역보건법에 따라 설치한다. 보건진료소와 보건진료 전담공무원의 근거는 농어촌 등 보건의료를 위한 특별조치법이다. 두 법의 대상을 바꾸어 묻는 선지가 자주 나온다."},
{"id":"c13","subj":"지역사회간호","unit":"지역사회 개념","q":"지역사회의 유형 중 감정적 지역사회에 해당하는 것은?","opts":["소속 공동체","지정학적 공동체","자원 공동체","대면 공동체"],"ans":0,"exp":"감정적 지역사회는 공통의 감정과 유대감으로 묶인 것으로, 같은 고향이나 학교처럼 소속감으로 맺어진 소속 공동체와 특수 흥미 공동체가 있다. 지정학적 공동체와 대면 공동체는 구조적 지역사회이고, 자원 공동체는 기능적 지역사회이다."},
{"id":"c14","subj":"지역사회간호","unit":"지역사회 역사","q":"1893년 뉴욕 헨리가에 구제사업소를 세워 빈민을 대상으로 방문간호 사업을 펼치고, 지역사회 중심의 보건간호를 체계화한 사람은?","opts":["플로렌스 나이팅게일","윌리엄 라스본","릴리안 왈드","메리 브레킨리지"],"ans":2,"exp":"릴리안 왈드는 헨리가 구제사업소를 세워 방문간호와 학교간호 사업을 이끌었다. 라스본은 1859년 영국 리버풀에서 구역간호 사업을 시작하였고, 브레킨리지는 1925년 미국 켄터키에서 농촌 간호 사업을 조직하였다."},
{"id":"c15","subj":"지역사회간호","unit":"간호 이론","q":"뉴만(Neuman)의 건강관리체계이론에서 대상 체계의 가장 바깥에 있으며, 수시로 변하면서 스트레스원이 정상방어선에 닿지 않도록 완충 역할을 하는 것은?","opts":["저항선","기본 구조","유연방어선","정상방어선"],"ans":2,"exp":"유연방어선은 가장 바깥의 방어선으로 스트레스원을 일차로 막아 주며, 이를 강화하는 것이 1차 예방이다. 정상방어선은 대상자가 오랫동안 유지해 온 평소의 안녕 상태이고, 저항선은 기본 구조를 둘러싼 가장 안쪽의 방어선으로 정상방어선이 뚫렸을 때 작동한다."},
{"id":"c16","subj":"지역사회간호","unit":"간호 이론","q":"오렘(Orem)의 자가간호이론에 따를 때 다음 대상자에게 적용할 간호 체계는?\n\n뇌졸중으로 오른쪽 편마비가 있는 70세 노인이 식사는 혼자 하지만, 목욕과 옷 입기는 방문간호사와 가족의 도움을 받아서 한다.","opts":["전체적 보상 체계","부분적 보상 체계","교육지지적 체계","발달적 자가간호 체계"],"ans":1,"exp":"부분적 보상 체계는 대상자가 자가간호의 일부는 스스로 하고 나머지는 간호사가 도와 함께 수행하는 체계이다. 전체적 보상 체계는 대상자가 자가간호를 전혀 하지 못할 때, 교육지지적 체계는 할 능력은 있으나 지식과 기술, 지지가 필요할 때 적용한다. 발달적 자가간호는 간호 체계가 아니라 자가간호 요구의 한 종류이다."},
{"id":"c17","subj":"지역사회간호","unit":"간호 이론","q":"로이(Roy)의 적응이론에서 대상자가 지금 직접 마주하고 있어 적응 반응을 일으키는 데 가장 큰 영향을 주는 자극은?","opts":["초점자극","연관자극","잔여자극","인지자극"],"ans":0,"exp":"초점자극은 당면한 상황에서 대상자에게 직접 영향을 주는 자극이다. 연관자극은 초점자극 말고 그 상황에 함께 작용하는 다른 자극이고, 잔여자극은 신념이나 태도처럼 영향을 줄 수 있으나 측정하기 어려운 자극이다. 인지자극이라는 분류는 없다."},
{"id":"c18","subj":"지역사회간호","unit":"간호 이론","q":"체계이론에서 산출의 일부가 다시 체계로 되돌아가 투입과 변환 과정을 조절하게 하는 것은?","opts":["투입","변환","경계","회환"],"ans":3,"exp":"회환(환류, 피드백)은 산출 결과를 다시 투입에 반영하여 체계가 스스로를 조절하게 하는 과정이다. 투입은 체계로 들어오는 물질·에너지·정보이고, 변환은 투입을 산출로 바꾸는 과정이며, 경계는 체계를 환경과 구분하는 테두리이다."},
{"id":"c19","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 사례에서 지역사회 간호사가 수행한 역할은?\n\n외국인 근로자가 의료비 지원 제도를 몰라 치료를 받지 못하고 있었다. 간호사는 그가 누릴 수 있는 권리와 제도를 알려 주고, 관계 기관에 근로자의 처지를 대신 설명하여 지원을 받게 하였다.","opts":["교육자","대변자(옹호자)","연구자","관리자"],"ans":1,"exp":"대변자(옹호자)는 대상자가 자신의 권리를 찾을 수 있도록 정보를 주고, 대상자의 입장에 서서 의견을 대신 말해 주는 역할이다. 교육자는 건강 지식과 기술을 가르치는 역할, 관리자는 사업을 계획·조직·감독하는 역할이다."},
{"id":"c20","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정의 자료 수집 방법 중 자동차를 타거나 걸어서 지역을 두루 돌아보며 주거 상태, 생활 모습, 지역의 분위기 등을 빠르게 살피는 것은?","opts":["참여관찰","지역 시찰(차창 밖 조사)","정보원 면담","설문지 조사"],"ans":1,"exp":"지역 시찰은 지역을 돌아다니며 눈으로 살펴 전체 모습을 짧은 시간에 파악하는 방법이다. 참여관찰은 지역 행사 등에 직접 참여하면서 관찰하는 것이고, 정보원 면담은 지역 지도자 같은 주요 인물을 만나 묻는 것이며, 설문지 조사는 주민에게 직접 질문하여 자료를 얻는 것이다."},
{"id":"c21","subj":"지역사회간호","unit":"간호과정","q":"오마하(Omaha) 문제분류체계의 네 영역에 해당하지 않는 것은?","opts":["영적 영역","환경 영역","생리 영역","건강관련행위 영역"],"ans":0,"exp":"오마하 문제분류체계의 영역은 환경, 심리사회, 생리, 건강관련행위의 네 가지이다. 영적 영역이라는 영역은 따로 없으며, 영성에 관한 문제는 심리사회 영역 안의 문제로 다룬다."},
{"id":"c22","subj":"지역사회간호","unit":"간호과정","q":"어느 건강 문제를 평가한 점수가 다음과 같다. 공식 (A + 2B) × C 로 구한 BPRS 점수는?\n\nA(문제의 크기): 6점\nB(문제의 심각도): 7점\nC(사업의 추정 효과): 9점","opts":["117","171","180","270"],"ans":2,"exp":"BPRS는 (A + 2B) × C 로 구한다. (6 + 2 × 7) × 9 = 20 × 9 = 180점이다. 심각도 B에만 2를 곱한다는 점을 놓치면 (6 + 7) × 9 = 117처럼 잘못 계산하게 된다."},
{"id":"c23","subj":"지역사회간호","unit":"간호과정","q":"우선순위 결정 방법 중 PATCH가 쓰는 두 가지 기준은?","opts":["건강 문제의 크기와 심각도","건강 문제의 중요성과 변화 가능성","사업의 경제성과 수용성","주민의 관심도와 자원 동원 가능성"],"ans":1,"exp":"PATCH는 건강 문제의 중요성과 변화 가능성을 기준으로 삼아, 중요하고 변화 가능성도 높은 문제를 가장 먼저 다룬다. 문제의 크기와 심각도는 BPRS의 평가 항목이고, 경제성과 수용성은 PEARL의 항목이다."},
{"id":"c24","subj":"지역사회간호","unit":"간호과정","q":"우선순위 결정에 쓰는 PEARL에 대한 설명으로 옳은 것은?","opts":["건강 문제의 크기, 심각도, 사업 효과를 점수로 매겨 계산한다","건강 문제의 중요성과 변화 가능성을 기준으로 순위를 정한다","적절성, 경제성, 수용성, 자원, 적법성으로 사업의 실행 가능성을 판단한다","대상 집단의 취약성과 전문가의 해결 능력만으로 순위를 정한다"],"ans":2,"exp":"PEARL은 BPRS로 점수를 매긴 뒤 사업을 실제로 할 수 있는지 판단하는 기준으로, 적절성·경제성·수용성·자원·적법성 다섯 항목 가운데 하나라도 0이면 사업을 시행하지 않는다. 크기·심각도·효과는 BPRS, 중요성과 변화 가능성은 PATCH의 기준이다."},
{"id":"c25","subj":"지역사회간호","unit":"간호과정","q":"SMART 기준에 가장 잘 맞는 간호 목표는?","opts":["A동 주민 모두의 건강 수준을 지금보다 훨씬 높인다","보건소 간호사가 고혈압 관리 교육을 연중 열심히 실시한다","가능한 한 이른 시기에 A동 성인의 흡연율을 크게 낮춘다","사업 시작 1년 뒤까지 A동 성인 흡연율을 25%에서 20%로 낮춘다"],"ans":3,"exp":"SMART 목표는 구체적이고, 측정할 수 있으며, 달성 가능하고, 문제와 관련이 있고, 기한이 있어야 한다. 흡연율을 25%에서 20%로 낮춘다는 목표만 대상과 지표, 수치, 기한을 모두 밝혔다. 나머지는 수치와 기한이 없거나, 결과가 아닌 간호사의 활동을 적은 것이다."},
{"id":"c26","subj":"지역사회간호","unit":"간호과정","q":"보건사업 평가 범주 중 사업의 실적을 지역사회의 요구량과 비교하여 사업이 요구를 얼마나 충족하였는지 보는 것은?","opts":["사업의 적합성 평가","사업의 효율성 평가","사업 진행에 대한 평가","투입된 노력에 대한 평가"],"ans":0,"exp":"적합성 평가는 사업 실적이 지역사회 요구에 비추어 충분한지를 본다. 효율성 평가는 투입한 비용에 견준 성과를, 사업 진행 평가는 일정대로 진행되는지를, 투입된 노력 평가는 들어간 인력·시간·물자의 양을 본다."},
{"id":"c27","subj":"지역사회간호","unit":"간호과정","q":"보건소가 SWOT 분석을 한 결과가 다음과 같다. 이 상황에 맞는 전략은?\n\n내부: 방문간호 인력이 부족하고 직원의 사업 경험이 적다.\n외부: 정부가 방문건강관리 예산을 늘렸고 주민의 관심도 높아졌다.","opts":["SO 전략(공격적 전략)","ST 전략(다각화 전략)","WO 전략(국면전환 전략)","WT 전략(방어적 전략)"],"ans":2,"exp":"내부 요인은 약점(W), 외부 요인은 기회(O)이므로 WO 전략이다. 외부의 기회를 살려 내부의 약점을 보완하는 국면전환 전략을 쓴다. SO는 강점과 기회, ST는 강점과 위협, WT는 약점과 위협이 만날 때의 전략이다."},
{"id":"c28","subj":"지역사회간호","unit":"지역사회 간호수단","q":"간호사가 하루에 다음 네 가정을 모두 방문하려 한다. 가장 먼저 방문해야 할 가정은?","opts":["활동성 폐결핵 환자가 있는 가정","생후 2주 된 신생아가 있는 가정","옴 환자가 있는 가정","세균성이질 환자가 있는 가정"],"ans":1,"exp":"하루에 여러 가정을 방문할 때는 간호사가 감염을 옮기지 않도록 면역력이 약하고 감염성이 없는 대상부터 방문하고, 감염성 질환자는 뒤로 미룬다. 신생아 가정을 먼저 방문하고 결핵, 옴, 세균성이질 환자 가정은 그 뒤에 방문한다."},
{"id":"c29","subj":"지역사회간호","unit":"보건의료체계","q":"프라이(Fry)의 보건의료전달체계 유형 중 다음 특징을 가진 것은?\n\n국민이 의료기관을 자유롭게 고른다.\n의료의 질과 기술 수준이 높다.\n의료 자원이 지역에 고르게 분포하지 않고 의료비가 오르기 쉽다.","opts":["자유방임형","사회보장형","사회주의형","공공부조형"],"ans":0,"exp":"자유방임형은 의료를 주로 민간과 시장에 맡겨 선택의 자유와 의료의 질은 높지만, 자원의 지역 편중과 의료비 상승이 문제이다. 사회보장형은 정부가 주도하여 형평성이 높고, 사회주의형은 국가가 의료 자원을 모두 관리하고 배분한다. 프라이의 분류에 공공부조형은 없다."},
{"id":"c30","subj":"지역사회간호","unit":"사회보장","q":"우리나라 사회보장 제도 중 공공부조에 해당하는 것은?","opts":["의료급여","국민건강보험","산업재해보상보험","노인장기요양보험"],"ans":0,"exp":"공공부조는 생활이 어려운 국민에게 국가가 조세로 최저 생활을 보장하는 제도로, 의료급여와 국민기초생활보장이 해당한다. 국민건강보험, 산업재해보상보험, 노인장기요양보험은 보험료를 재원으로 하는 사회보험이다."},
{"id":"c31","subj":"지역사회간호","unit":"사회보장","q":"우리나라 국민건강보험의 특징으로 옳지 않은 것은?","opts":["법으로 정한 요건에 해당하면 가입이 강제된다","보험료를 많이 낸 사람일수록 더 많은 보험급여를 받는다","보험료는 소득 등 부담 능력에 따라 차등 부과한다","한 해 단위로 수입과 지출을 맞추는 단기 보험이다"],"ans":1,"exp":"건강보험은 보험료는 부담 능력에 따라 다르게 내지만 급여는 낸 보험료와 관계없이 필요에 따라 균등하게 받는다. 이로써 소득 재분배와 위험 분산이 이루어진다. 강제 가입, 부담 능력에 따른 보험료, 단기 보험은 모두 옳은 특징이다."},
{"id":"c32","subj":"지역사회간호","unit":"사회보장","q":"요양기관이 청구한 요양급여비용을 심사하고 요양급여의 적정성을 평가하는 기관은?","opts":["국민건강보험공단","건강보험심사평가원","보건복지부","건강보험정책심의위원회"],"ans":1,"exp":"건강보험심사평가원은 요양급여비용의 심사와 요양급여의 적정성 평가를 맡는다. 국민건강보험공단은 보험자로서 가입자 자격 관리, 보험료 부과·징수, 보험급여 비용 지급을 맡고, 보건복지부는 제도를 관장한다."},
{"id":"c33","subj":"지역사회간호","unit":"보건의료체계","q":"조세를 주된 재원으로 하여 국가가 모든 국민에게 보건의료서비스를 직접 제공하며, 영국이 대표적인 의료보장 유형은?","opts":["민간보험 방식","사회보험 방식(NHI)","의료저축계정 방식","국가보건서비스 방식(NHS)"],"ans":3,"exp":"국가보건서비스 방식은 조세로 재원을 마련해 국가가 의료를 직접 제공하는 방식으로 영국, 스웨덴 등이 채택하고 있다. 사회보험 방식은 가입자가 낸 보험료를 재원으로 하며 우리나라, 독일, 일본이 해당한다."},
{"id":"c34","subj":"지역사회간호","unit":"노인장기요양보험","q":"「노인장기요양보험법」상 장기요양인정을 신청할 수 있는 사람은?","opts":["알츠하이머병으로 혼자 생활하기 어려운 60세 건강보험 가입자","교통사고로 하반신이 마비된 45세 건강보험 가입자","혼자 살며 고혈압 약을 먹는 62세 의료급여 수급권자","지체장애로 휠체어를 쓰는 30세 건강보험 피부양자"],"ans":0,"exp":"장기요양인정은 65세 이상 노인이거나, 65세 미만이면서 치매·뇌혈관성 질환·파킨슨병 같은 노인성 질병을 가진 사람이 신청할 수 있다. 알츠하이머병은 노인성 질병이므로 60세라도 신청할 수 있다. 교통사고 후유증, 고혈압, 지체장애는 65세 미만인 사람의 신청 사유가 되지 않는다."},
{"id":"c35","subj":"지역사회간호","unit":"노인장기요양보험","q":"노인장기요양보험의 재가급여에 해당하지 않는 것은?","opts":["방문목욕","주·야간보호","단기보호","노인요양공동생활가정 입소"],"ans":3,"exp":"재가급여에는 방문요양, 방문목욕, 방문간호, 주·야간보호, 단기보호, 복지용구 같은 기타 재가급여가 있다. 노인요양시설이나 노인요양공동생활가정에 입소하여 받는 급여는 시설급여이다."},
{"id":"c36","subj":"지역사회간호","unit":"보건행정","q":"「지역보건법」상 지역보건의료계획에 대한 설명으로 옳은 것은?","opts":["보건복지부장관이 수립하여 시·도에 내려보낸다","시·도지사와 시장·군수·구청장이 4년마다 수립한다","연차별 시행계획은 2년마다 수립한다","주민의 의견은 듣지 않고 전문가가 작성한다"],"ans":1,"exp":"지역보건의료계획은 시·도지사와 시장·군수·구청장이 4년마다 수립하고, 그에 따른 연차별 시행계획은 해마다 수립한다. 지역 실정에 맞추어 아래에서 위로 올라가는 방식으로 세우며, 수립 과정에서 주민의 의견을 듣는다."},
{"id":"c37","subj":"지역사회간호","unit":"보건행정","q":"보건진료 전담공무원에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 따라 보건지소에 배치된다","도시 지역의 동마다 한 명씩 배치된다","의사의 지시가 있을 때에만 의료행위를 할 수 있다","간호사나 조산사 면허를 가지고 직무교육을 받은 사람이다"],"ans":3,"exp":"보건진료 전담공무원은 「농어촌 등 보건의료를 위한 특별조치법」에 따라 의료 취약 지역의 보건진료소에서 일하며, 간호사나 조산사 면허를 가진 사람이 정해진 직무교육을 받아야 한다. 법령이 정한 범위의 경미한 의료행위를 스스로 할 수 있다."},
{"id":"c38","subj":"지역사회간호","unit":"일차보건의료","q":"1978년 세계보건기구와 유니세프가 연 국제회의에서 \"2000년까지 모든 인류에게 건강을\"이라는 목표를 이루기 위한 전략으로 일차보건의료를 채택한 선언은?","opts":["알마아타 선언","오타와 헌장","방콕 헌장","리우 선언"],"ans":0,"exp":"1978년 알마아타 선언은 일차보건의료를 모든 인류의 건강을 실현하는 핵심 전략으로 채택하였다. 오타와 헌장(1986년)과 방콕 헌장(2005년)은 건강증진에 관한 국제회의의 결과물이고, 리우 선언(1992년)은 환경과 개발에 관한 선언이다."},
{"id":"c39","subj":"지역사회간호","unit":"일차보건의료","q":"알마아타 선언에서 제시한 일차보건의료의 필수 사업 내용에 해당하지 않는 것은?","opts":["안전한 식수 공급과 기본 환경위생","가족계획을 포함한 모자보건","주요 감염병에 대한 예방접종","희귀 질환에 대한 고도의 전문 치료"],"ans":3,"exp":"일차보건의료의 필수 내용은 보건교육, 영양 개선, 안전한 물과 기본 환경위생, 모자보건과 가족계획, 예방접종, 풍토병 관리, 흔한 질병과 상해의 치료, 필수 의약품 공급이다. 고도의 전문 치료는 지역사회에서 쉽게 이용할 수 있는 기본 의료가 아니므로 포함되지 않는다."},
{"id":"c40","subj":"지역사회간호","unit":"질병 발생 모형","q":"질병 발생 모형 중 숙주를 원의 중심에 두고, 숙주의 유전적 소인과 그를 둘러싼 생물학적·물리화학적·사회적 환경의 상호작용으로 질병 발생을 설명하는 것은?","opts":["역학적 삼각형 모형","수레바퀴 모형","거미줄 모형","건강신념 모형"],"ans":1,"exp":"수레바퀴 모형은 유전적 소인을 가진 숙주가 중심에 있고 환경이 이를 둘러싼 모양으로, 질병에 따라 각 부분의 크기가 달라진다. 역학적 삼각형 모형은 병원체·숙주·환경의 균형으로, 거미줄 모형은 여러 요인이 얽힌 관계로 질병을 설명한다. 건강신념 모형은 건강 행위를 설명하는 이론이다."},
{"id":"c41","subj":"지역사회간호","unit":"역학 지표","q":"어떤 감염병에 대한 자료가 다음과 같다. 이 감염병의 독력은?\n\n감염자: 100명\n감염자 가운데 증상이 나타난 사람(현성 감염자): 40명\n현성 감염자 가운데 중증 환자(사망자 제외): 8명\n현성 감염자 가운데 사망자: 2명","opts":["5%","10%","25%","40%"],"ans":2,"exp":"독력은 현성 감염자 가운데 중증 환자와 사망자가 차지하는 비율이다. (8 + 2) ÷ 40 × 100 = 25%. 40%는 감염자 중 현성 감염자의 비율인 병원력이고, 5%는 현성 감염자 중 사망자의 비율인 치명률이다."},
{"id":"c42","subj":"지역사회간호","unit":"역학 지표","q":"어떤 만성질환의 발생률은 변하지 않았는데 유병률이 높아졌다. 그 이유로 가장 알맞은 것은?","opts":["치료법이 발달하여 환자의 생존 기간이 길어졌다","치명률이 높아져 환자가 일찍 사망하였다","완치율이 높아져 앓는 기간이 짧아졌다","환자가 다른 지역으로 많이 옮겨 갔다"],"ans":0,"exp":"유병률은 대략 발생률에 이환 기간을 곱한 값이다. 발생률이 같아도 완치되지 않은 채 생존 기간이 길어지면 이환 기간이 늘어 유병률이 높아진다. 일찍 사망하거나 빨리 완치되거나 환자가 전출하면 유병률은 오히려 낮아진다."},
{"id":"c43","subj":"지역사회간호","unit":"역학 지표","q":"주민이 5,100명인 지역을 1년간 조사한 결과가 다음과 같다. 이 질병의 연간 발생률은? (단, 이 질병은 한 번 걸리면 완치되지 않고 다시 걸리지 않으며, 인구 이동과 사망은 없다.)\n\n연초에 이미 이 질병을 앓고 있던 사람: 100명\n1년 동안 새로 발생한 환자: 50명","opts":["인구 1,000명당 10명","인구 1,000명당 20명","인구 1,000명당 30명","인구 1,000명당 50명"],"ans":0,"exp":"발생률의 분모는 그 질병에 걸릴 위험이 있는 사람이므로 이미 앓고 있는 100명을 뺀다. 50 ÷ (5,100 − 100) × 1,000 = 인구 1,000명당 10명이다. 기존 환자까지 분자에 넣으면 150 ÷ 5,000 × 1,000 = 30으로 잘못 계산하게 된다."},
{"id":"c44","subj":"지역사회간호","unit":"역학 지표","q":"폐암과 흡연의 관계를 알아본 환자-대조군 연구의 결과가 다음과 같다. 교차비는?\n\n폐암 환자 100명: 흡연자 60명, 비흡연자 40명\n대조군 100명: 흡연자 30명, 비흡연자 70명","opts":["1.5","2","3.5","4.5"],"ans":2,"exp":"교차비는 환자군의 노출 대 비노출 비를 대조군의 노출 대 비노출 비로 나눈 값이다. (60 ÷ 40) ÷ (30 ÷ 70) = (60 × 70) ÷ (40 × 30) = 4,200 ÷ 1,200 = 3.5. 두 군의 흡연자 비율을 그대로 나눈 60 ÷ 30 = 2는 교차비가 아니다."},
{"id":"c45","subj":"지역사회간호","unit":"역학 연구","q":"발생률이 매우 낮은 희귀 질환의 위험 요인을 비교적 짧은 기간에 적은 비용으로 밝히려 할 때 가장 알맞은 연구 방법은?","opts":["단면조사 연구","실험 연구","코호트 연구","환자-대조군 연구"],"ans":3,"exp":"환자-대조군 연구는 이미 발생한 환자를 모아 과거의 노출을 조사하므로 희귀 질환이나 잠복기가 긴 질환을 적은 대상자로 빠르게 연구할 수 있다. 코호트 연구는 희귀 질환이면 매우 많은 대상자를 오래 추적해야 하고, 단면조사 연구는 원인과 결과의 선후 관계를 밝히기 어렵다."},
{"id":"c46","subj":"지역사회간호","unit":"역학 지표","q":"1,000명에게 선별검사를 한 결과가 다음과 같다. 이 검사의 양성예측도는?\n\n실제 환자 100명: 검사 양성 90명, 검사 음성 10명\n환자가 아닌 사람 900명: 검사 양성 90명, 검사 음성 810명","opts":["10%","50%","90%","약 99%"],"ans":1,"exp":"양성예측도는 검사 양성인 사람 가운데 실제 환자의 비율이다. 90 ÷ (90 + 90) × 100 = 50%. 90%는 민감도(90 ÷ 100)이자 특이도(810 ÷ 900)이고, 약 99%는 음성예측도(810 ÷ 820)이다."},
{"id":"c47","subj":"지역사회간호","unit":"역학 지표","q":"민감도와 특이도가 같은 선별검사를 유병률이 더 높은 집단에 적용할 때 나타나는 변화는?","opts":["양성예측도가 높아진다","음성예측도가 높아진다","민감도가 높아진다","특이도가 높아진다"],"ans":0,"exp":"유병률이 높아지면 검사 양성자 가운데 진짜 환자의 몫이 커져 양성예측도가 높아지고, 음성예측도는 낮아진다. 민감도와 특이도는 검사 자체의 성질이어서 유병률에 따라 달라지지 않는다."},
{"id":"c48","subj":"지역사회간호","unit":"감염병 관리","q":"기초감염재생산수(R0)가 5인 감염병의 유행을 막으려면 인구의 최소 몇 %가 면역을 가져야 하는가? (단, 집단면역 한계 밀도 = 1 − 1/R0 로 구한다.)","opts":["20%","50%","75%","80%"],"ans":3,"exp":"집단면역 한계 밀도는 1 − 1/R0 이다. 1 − 1/5 = 0.8 이므로 인구의 80% 이상이 면역을 가져야 유행이 일어나지 않는다. 20%는 면역이 없어도 되는 사람의 비율(1/R0)이다."},
{"id":"c49","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 의료기관의 장이 제2급감염병 환자의 발생을 보고받았을 때 관할 보건소장 등에게 신고해야 하는 시기는?","opts":["즉시","24시간 이내","3일 이내","7일 이내"],"ans":1,"exp":"제1급감염병은 즉시, 제2급과 제3급감염병은 24시간 이내, 제4급감염병은 7일 이내에 신고한다. 급수는 법령 개정으로 바뀔 수 있으나 급별 신고 시기의 틀은 이와 같다."},
{"id":"c50","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 제3급감염병에 해당하는 것은?","opts":["파상풍","홍역","디프테리아","인플루엔자"],"ans":0,"exp":"파상풍은 발생을 계속 감시할 필요가 있어 24시간 이내에 신고하는 제3급감염병이다. 홍역은 제2급, 디프테리아는 제1급, 인플루엔자는 표본감시 대상인 제4급감염병이다. 감염병 분류는 개정될 수 있으니 시험 전에 현행 법령을 확인한다."},
{"id":"c51","subj":"지역사회간호","unit":"감염병 관리","q":"B형간염 표면항원 양성인 산모에게서 태어난 신생아에게 출생 직후 B형간염 면역글로불린을 주사하였다. 이 면역글로불린으로 얻는 면역은?","opts":["자연능동면역","자연수동면역","인공능동면역","인공수동면역"],"ans":3,"exp":"다른 사람이나 동물이 만든 항체를 주사로 받아 얻는 면역은 인공수동면역으로, 효과가 빨리 나타나지만 오래가지 않는다. 백신 접종으로 얻는 면역은 인공능동면역, 태반이나 모유로 받는 면역은 자연수동면역, 감염된 뒤 얻는 면역은 자연능동면역이다."},
{"id":"c52","subj":"지역사회간호","unit":"감염병 관리","q":"약독화 생백신에 해당하는 것은?","opts":["DTaP 백신","MMR 백신","B형간염 백신","주사용 폴리오 백신(IPV)"],"ans":1,"exp":"MMR(홍역·유행성이하선염·풍진) 백신은 살아 있는 병원체의 독성을 약하게 만든 생백신이다. DTaP는 톡소이드와 불활성화 성분으로 만든 백신이고, B형간염 백신은 유전자 재조합 백신이며, 주사용 폴리오 백신은 불활성화 백신이다."},
{"id":"c53","subj":"지역사회간호","unit":"감염병 관리","q":"감염되었으나 처음부터 끝까지 증상이 없으면서 병원체를 배출하여 감염병 관리에서 가장 어려운 대상이 되는 사람은?","opts":["건강 보균자","잠복기 보균자","회복기 보균자","현성 감염자"],"ans":0,"exp":"건강 보균자는 증상이 전혀 없어 본인도 주위에서도 감염 사실을 모른 채 활동하므로 관리가 가장 어렵다. 잠복기 보균자는 증상이 나타나기 전에, 회복기 보균자는 증상이 사라진 뒤에 병원체를 배출하는 사람이다."},
{"id":"c54","subj":"지역사회간호","unit":"감염병 관리","q":"한 초등학교에서 급식을 먹은 다음 날 설사 환자가 한꺼번에 발생하였다. 환자 발생 곡선을 그려 보니 봉우리가 하나이고, 환자가 급격히 늘었다가 빠르게 줄어 모든 환자가 한 번의 잠복기 범위 안에 발생하였다. 이 유행의 양상은?","opts":["사람 간 전파에 의한 연쇄 유행","공통 감염원 지속 노출 유행","주기적으로 반복되는 계절 유행","공통 감염원 단일 노출 유행"],"ans":3,"exp":"같은 감염원에 한 번 함께 노출되면 환자가 짧은 기간에 몰려 발생하여 봉우리가 하나인 곡선이 된다. 지속 노출이면 봉우리가 뚜렷하지 않고 오래 이어지며, 사람 간 전파이면 봉우리가 여러 개 생기면서 유행 기간이 길어진다."},
{"id":"c55","subj":"지역사회간호","unit":"역학 지표","q":"A 사업장 근로자의 사망 수준을 표준 인구와 비교하려 한다. 표준화사망비(SMR)는?\n\nA 사업장에서 실제로 관찰된 사망자 수: 30명\n표준 인구의 연령별 사망률을 A 사업장 인구에 적용해 구한 기대 사망자 수: 20명","opts":["0.67","1.5","2","10"],"ans":1,"exp":"표준화사망비는 관찰 사망자 수를 기대 사망자 수로 나눈 값이다. 30 ÷ 20 = 1.5. 1보다 크므로 A 사업장의 사망 수준이 표준 인구보다 높다는 뜻이다. 연령별 사망률을 알 수 없거나 인구가 적을 때 쓰는 간접 표준화법의 지표이다."},
{"id":"c56","subj":"지역사회간호","unit":"건강증진","q":"오타와 헌장의 건강증진 5대 활동 전략 중 다음 사례에 해당하는 것은?\n\n공공장소를 금연구역으로 지정하는 법을 만들고 담배에 건강증진부담금을 매겼다.","opts":["건강한 공공정책 수립","개인의 기술 개발","지역사회 활동 강화","보건의료서비스의 방향 재설정"],"ans":0,"exp":"법률, 조세, 규제 등으로 건강에 이로운 선택을 쉽게 만드는 것은 건강한 공공정책 수립이다. 개인의 기술 개발은 보건교육으로 개인의 역량을 키우는 것, 지역사회 활동 강화는 주민 참여와 조직화, 보건의료서비스의 방향 재설정은 치료 중심에서 예방과 건강증진 중심으로 바꾸는 것이다."},
{"id":"c57","subj":"지역사회간호","unit":"건강증진","q":"국민건강증진종합계획(Health Plan 2030)의 총괄 목표 두 가지는?","opts":["평균수명 연장과 의료비 절감","건강수명 연장과 건강형평성 제고","질병 사망률 감소와 의료 접근성 향상","출산율 제고와 노인 부양 부담 완화"],"ans":1,"exp":"제5차 국민건강증진종합계획(2021~2030년)은 \"모든 사람이 평생 건강을 누리는 사회\"를 비전으로 하고, 건강수명 연장과 건강형평성 제고를 총괄 목표로 한다. 2026년 3월에 확정된 제6차 계획(2026~2030년)도 이 비전과 총괄 목표를 그대로 이어 간다. 단순히 오래 사는 평균수명이 아니라 건강하게 사는 기간과 집단 간 건강 격차 해소에 초점을 둔다."},
{"id":"c58","subj":"지역사회간호","unit":"건강증진","q":"「국민건강증진법」상 국민건강증진종합계획에 대한 설명으로 옳은 것은?","opts":["질병관리청장이 3년마다 수립한다","시·도지사가 4년마다 수립한다","국민건강보험공단 이사장이 해마다 수립한다","보건복지부장관이 5년마다 수립한다"],"ans":3,"exp":"국민건강증진종합계획은 보건복지부장관이 국민건강증진정책심의위원회의 심의를 거쳐 5년마다 수립한다. 4년마다 수립하는 것은 「지역보건법」의 지역보건의료계획으로, 시·도지사와 시장·군수·구청장이 세운다."},
{"id":"c59","subj":"지역사회간호","unit":"건강행위 이론","q":"건강신념모형의 구성 개념 중 다음 사례에 해당하는 것은?\n\n50세 여성이 유방암 검진이 필요하다고 생각하면서도 \"검사가 아프고 병원에 갈 시간도 없다\"며 검진을 미루고 있다.","opts":["지각된 민감성","지각된 심각성","지각된 유익성","지각된 장애성"],"ans":3,"exp":"지각된 장애성은 건강 행위를 하는 데 드는 비용, 불편, 통증, 시간 같은 부정적 측면에 대한 인식이다. 지각된 민감성은 자신이 병에 걸릴 가능성, 심각성은 병에 걸렸을 때 결과가 얼마나 나쁜지, 유익성은 행위를 하면 얻는 이득에 대한 인식이다."},
{"id":"c60","subj":"지역사회간호","unit":"건강행위 이론","q":"범이론적 모형의 변화 과정 중 다음 사례에 해당하는 것은?\n\n금연을 시작한 대상자가 집 안의 재떨이와 라이터를 모두 치우고, 담배를 피우게 되는 술자리를 피한다.","opts":["의식 고양","자극 통제","자기 재평가","사회적 해방"],"ans":1,"exp":"자극 통제는 문제 행동을 일으키는 자극을 없애거나 피하는 과정이다. 의식 고양은 문제에 대한 정보를 찾고 이해를 높이는 것, 자기 재평가는 문제 행동과 관련하여 자기 자신을 다시 평가하는 것, 사회적 해방은 사회가 건강한 행동을 지지하는 쪽으로 바뀌고 있음을 알아차리는 것이다."},
{"id":"c61","subj":"지역사회간호","unit":"건강행위 이론","q":"PRECEDE-PROCEED 모형의 교육·생태학적 진단에서 다음은 어떤 요인에 해당하는가?\n\n보건소 금연클리닉이 집에서 멀고 운영 시간이 근무 시간과 겹쳐 이용하기 어렵다.","opts":["촉진 요인(가능 요인)","강화 요인","성향 요인(소인 요인)","유전 요인"],"ans":0,"exp":"촉진 요인은 행위를 할 수 있게 하거나 가로막는 자원의 이용 가능성, 접근성, 기술 등이다. 성향 요인은 지식·태도·신념처럼 행위에 앞서 동기를 주는 요인이고, 강화 요인은 행위 뒤에 가족이나 동료에게서 받는 칭찬이나 보상 같은 요인이다."},
{"id":"c62","subj":"지역사회간호","unit":"건강행위 이론","q":"계획된 행위이론이 합리적 행위이론에 새로 더한 개념은?","opts":["행위에 대한 태도","주관적 규범","지각된 행위 통제","행위 의도"],"ans":2,"exp":"합리적 행위이론은 행위에 대한 태도와 주관적 규범이 행위 의도를 결정하고 의도가 행위로 이어진다고 본다. 계획된 행위이론은 여기에, 그 행위를 하기가 얼마나 쉽거나 어렵다고 느끼는지를 뜻하는 지각된 행위 통제를 더하였다."},
{"id":"c63","subj":"지역사회간호","unit":"보건교육 이론","q":"보건교사가 다음과 같이 교육하였다. 바탕이 된 학습 이론은?\n\n손 씻기를 실천한 학생에게 그때마다 칭찬 스티커를 주고, 스티커를 10장 모으면 상품을 주어 행동이 되풀이되게 하였다.","opts":["인지주의 학습이론","행동주의 학습이론","인본주의 학습이론","구성주의 학습이론"],"ans":1,"exp":"행동주의는 학습을 자극과 반응의 연결로 보고, 바람직한 행동에 보상(강화)을 주어 행동이 반복되게 한다. 인지주의는 학습자 내부의 사고 과정을, 인본주의는 학습자의 자발성과 자아실현을, 구성주의는 학습자가 경험으로 지식을 스스로 만들어 가는 것을 강조한다."},
{"id":"c64","subj":"지역사회간호","unit":"보건교육","q":"다음 학습 목표가 속하는 영역은?\n\n대상자는 인슐린 자가 주사를 정확한 순서에 따라 스스로 시행할 수 있다.","opts":["인지적 영역","정의적 영역","심리운동 영역","사회적 영역"],"ans":2,"exp":"심리운동 영역은 신체를 움직여 기술을 수행하는 능력에 관한 목표이다. 인지적 영역은 지식과 이해, 정의적 영역은 태도·가치·흥미에 관한 목표이다. 블룸의 학습 목표 분류에 사회적 영역은 없다."},
{"id":"c65","subj":"지역사회간호","unit":"보건교육","q":"한 가지 주제에 대해 전문가 2~5명이 저마다 다른 측면에서 준비한 내용을 차례로 발표한 다음, 사회자의 진행으로 청중과 질의응답을 하는 교육 방법은?","opts":["분단 토의","패널 토의","브레인스토밍","심포지엄"],"ans":3,"exp":"심포지엄은 전문가들이 각자 맡은 부분을 발표하고 이어서 청중과 질의응답을 한다. 패널 토의는 전문가 몇 명이 청중 앞에서 서로 의견을 주고받으며 토의하는 것이고, 분단 토의는 참가자를 소집단으로 나누어 토의한 뒤 전체가 모여 종합하는 것이다."},
{"id":"c66","subj":"지역사회간호","unit":"보건교육","q":"보건소 간호사가 처음 아기를 낳은 산모들에게 신생아 목욕시키는 방법을 가르치려 한다. 기술을 익히게 하는 데 가장 효과적인 교육 방법은?","opts":["강의","심포지엄","집단 토의","시범"],"ans":3,"exp":"시범은 교육자가 실제 동작을 보여 주고 학습자가 따라 해 보게 하는 방법으로, 기술을 익히는 심리운동 영역의 교육에 가장 알맞다. 강의와 심포지엄은 지식 전달에, 집단 토의는 의견 교환과 태도 변화에 알맞다."},
{"id":"c67","subj":"지역사회간호","unit":"보건교육","q":"보건교육 평가 중 교육이 진행되는 동안 학습자의 이해 정도를 확인하여 교육 내용과 방법을 고쳐 나가는 데 쓰는 것은?","opts":["진단평가","형성평가","총괄평가","상대평가"],"ans":1,"exp":"형성평가는 교육 도중에 실시하여 학습의 진행 정도를 확인하고 교육을 개선하는 평가이다. 진단평가는 교육 전에 학습자의 지식 수준과 준비도를 알아보는 평가이고, 총괄평가는 교육이 끝난 뒤 목표 달성 정도를 판단하는 평가이다. 상대평가는 평가 시기가 아니라 평가 기준에 따른 분류이다."},
{"id":"c68","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족 발달 단계 중 첫 자녀가 집을 떠나기 시작하여 막내 자녀가 집을 떠날 때까지의 시기는?","opts":["진수기 가족","청소년기 가족","중년기 가족","노년기 가족"],"ans":0,"exp":"진수기 가족은 자녀들이 독립하여 집을 떠나는 시기로, 자녀의 독립을 돕고 부부 관계를 다시 조정하는 것이 발달 과업이다. 청소년기 가족은 첫 자녀가 13~19세인 시기이고, 중년기 가족은 자녀가 모두 떠난 뒤부터 은퇴까지, 노년기 가족은 은퇴 뒤부터 사망까지이다."},
{"id":"c69","subj":"지역사회간호","unit":"가족간호","q":"가족을 서로 상호작용하는 인격체들의 단위로 보고, 구성원이 상황에 부여하는 의미와 역할 기대 같은 가족 내부의 과정에 초점을 두는 가족 이론은?","opts":["구조기능 이론","가족체계 이론","가족발달 이론","상징적 상호작용 이론"],"ans":3,"exp":"상징적 상호작용 이론은 가족 구성원 개인이 상황을 어떻게 해석하고 서로 어떤 역할을 기대하며 상호작용하는지에 초점을 둔다. 구조기능 이론은 가족 구조와 사회 속 기능을, 가족체계 이론은 가족을 하나의 열린 체계로, 가족발달 이론은 생활 주기에 따른 발달 과업을 중심으로 본다."},
{"id":"c70","subj":"지역사회간호","unit":"가족간호","q":"취약 가족의 분류 중 구조적 취약 가족에 해당하는 것은?","opts":["만성질환자 가족","한부모 가족","학대 가족","미숙아 가족"],"ans":1,"exp":"구조적 취약 가족은 가족 구조에 결손이 있는 가족으로 한부모 가족, 이혼 가족, 조손 가족, 독거 가구 등이 해당한다. 만성질환자 가족은 기능적 취약 가족, 학대 가족은 상호작용 취약 가족, 미숙아 가족은 발달 단계의 취약 가족이다."},
{"id":"c71","subj":"지역사회간호","unit":"가족간호","q":"가족 간호사정의 원칙으로 옳지 않은 것은?","opts":["가족의 문제뿐 아니라 강점도 함께 사정한다","가족 구성원 개인보다 가족 전체에 초점을 둔다","자료는 건강 문제가 있는 구성원 한 사람에게서만 수집한다","사정 과정에 가족이 참여하도록 한다"],"ans":2,"exp":"가족 사정에서는 한 사람의 말에만 기대지 않고 여러 구성원과 여러 방법으로 자료를 모아 서로 확인해야 한다. 강점까지 사정하고, 가족 전체에 초점을 두며, 가족이 사정에 참여하게 하는 것은 모두 옳은 원칙이다."},
{"id":"c72","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법 시행령」에서 정한 보건교사의 직무에 해당하지 않는 것은?","opts":["학교보건계획의 수립","학교 환경위생의 유지·관리 및 개선에 관한 사항","각종 질병의 예방 처치와 보건지도","학교에서 쓰는 의약품과 독극물의 실험·검사"],"ans":3,"exp":"학교에서 쓰는 의약품과 독극물의 실험·검사는 학교약사의 직무이다. 보건교사는 학교보건계획 수립, 환경위생 관리, 보건지도, 건강 관찰과 상담, 응급 처치와 그에 따르는 의약품 투여 등을 맡는다."},
{"id":"c73","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법」상 감염병에 감염되었거나 감염된 것으로 의심되는 학생의 등교를 중지시킬 수 있는 사람은?","opts":["학교의 장","보건교사","교육감","관할 보건소장"],"ans":0,"exp":"등교 중지는 학교의 장이 명할 수 있다. 보건교사는 감염병 발생을 확인하고 학교의 장에게 알려 조치를 돕는 역할을 하며, 등교 중지를 직접 명하는 주체는 아니다."},
{"id":"c74","subj":"지역사회간호","unit":"학교보건","q":"「교육환경 보호에 관한 법률」상 이미 설립된 학교의 절대보호구역 범위는?","opts":["학교 경계로부터 직선거리 50미터까지","학교 출입문으로부터 직선거리 50미터까지","학교 출입문으로부터 직선거리 200미터까지","학교 경계로부터 직선거리 300미터까지"],"ans":1,"exp":"절대보호구역은 학교 출입문으로부터 직선거리 50미터까지인 지역이다. 상대보호구역은 학교 경계로부터 직선거리 200미터까지인 지역 가운데 절대보호구역을 뺀 지역이다. 교육환경보호구역은 교육감이 설정하여 고시한다."},
{"id":"c75","subj":"지역사회간호","unit":"학교보건","q":"수두에 걸린 초등학생의 등교 중지 기간으로 옳은 것은?","opts":["열이 내린 뒤 24시간이 지날 때까지","발진이 나타난 뒤 4일까지","모든 수포에 딱지가 앉을 때까지","항생제 치료를 시작한 뒤 5일까지"],"ans":2,"exp":"수두는 수포가 생기기 직전부터 모든 수포에 딱지(가피)가 앉을 때까지 전염력이 있으므로 그때까지 등교를 중지한다. 발진이 나타난 뒤 4일까지는 홍역, 적절한 항생제 치료를 시작한 뒤 5일까지는 백일해의 격리 기준이다."},
{"id":"c76","subj":"지역사회간호","unit":"산업보건","q":"작업환경 관리의 기본 원칙 중 다음 사례에 해당하는 것은?\n\n소음이 심한 기계를 별도의 방에 설치하고, 근로자는 방 밖의 조작실에서 원격으로 기계를 조작한다.","opts":["대치","환기","격리","교육"],"ans":2,"exp":"격리는 근로자와 유해 인자 사이를 벽이나 거리로 떼어 놓는 것으로, 원격 조작과 방호벽 설치가 해당한다. 대치는 유해한 물질·공정·시설을 덜 해로운 것으로 바꾸는 것이고, 환기는 오염된 공기를 빼내거나 묽게 하는 것이다."},
{"id":"c77","subj":"지역사회간호","unit":"산업보건","q":"산업안전보건법령상 다음 근로자에게 실시하는 건강진단은?\n\n특수건강진단 대상 업무에 종사하는 근로자가 그 업무의 유해 인자 때문으로 의심되는 직업성 천식 증상을 호소하여, 정기 검진 시기와 관계없이 건강진단을 한다.","opts":["수시건강진단","임시건강진단","배치전건강진단","일반건강진단"],"ans":0,"exp":"수시건강진단은 특수건강진단 대상 업무로 직업성 천식이나 피부염 같은 건강 장해가 의심되는 증상을 보이는 근로자에게 주기와 관계없이 실시한다. 임시건강진단은 같은 부서에서 비슷한 증상이 여럿 생기는 등의 경우에 지방고용노동관서의 장의 명령으로 실시하고, 배치전건강진단은 해당 업무에 배치하기 전에 실시한다."},
{"id":"c78","subj":"지역사회간호","unit":"산업보건","q":"크롬 도금 작업을 오래 한 근로자에게 나타나는 특징적인 건강 장해는?","opts":["손목 처짐(신근 마비)","이타이이타이병","재생불량성 빈혈","비중격 천공"],"ans":3,"exp":"크롬은 코 점막을 헐게 하여 비중격에 구멍이 뚫리는 비중격 천공을 일으킨다. 손목 처짐은 납 중독, 이타이이타이병은 카드뮴 중독, 재생불량성 빈혈 같은 조혈 기능 장해는 벤젠 중독의 특징이다."},
{"id":"c79","subj":"지역사회간호","unit":"산업보건","q":"용광로 앞에서 일하며 땀을 많이 흘리고 물만 마신 근로자가 팔다리 근육에 통증이 따르는 경련을 일으켰다. 체온은 정상이고 의식은 또렷하다. 이 열중증과 우선 처치로 옳은 것은?","opts":["열사병: 얼음물에 담가 체온을 빠르게 내린다","열경련: 생리식염수 등으로 수분과 염분을 보충한다","열피로: 머리를 높게 하고 따뜻하게 보온한다","열쇠약: 고농도 산소를 공급한다"],"ans":1,"exp":"열경련은 땀으로 염분을 많이 잃은 상태에서 물만 마셔 생기는 근육 경련으로, 체온과 의식은 정상이며 수분과 염분을 함께 보충한다. 열사병은 체온 조절 중추의 장해로 체온이 매우 높고 의식 장해가 있어 체온을 급히 내려야 하므로 이 사례와 맞지 않는다."},
{"id":"c80","subj":"지역사회간호","unit":"산업보건","q":"어느 사업장의 1년간 자료가 다음과 같다. 강도율은?\n\n연 근로시간 수: 1,000,000시간\n재해 건수: 5건\n근로 손실 일수: 400일","opts":["0.4","5","80","400"],"ans":0,"exp":"강도율은 근로 손실 일수를 연 근로시간 수로 나누고 1,000을 곱한 값으로, 재해의 심한 정도를 나타낸다. 400 ÷ 1,000,000 × 1,000 = 0.4. 5는 재해 건수 ÷ 연 근로시간 수 × 1,000,000 으로 구한 도수율이고, 80은 재해 1건당 평균 손실 일수이다."},
{"id":"c81","subj":"지역사회간호","unit":"환경보건","q":"대기오염 물질이 흩어지지 못하고 지표면 가까이에 쌓여 스모그 피해가 커지는 기상 현상으로, 상층의 기온이 하층보다 높은 상태는?","opts":["열섬 현상","기온역전","엘니뇨","온실효과"],"ans":1,"exp":"보통은 위로 올라갈수록 기온이 낮아져 공기가 위아래로 섞이지만, 기온역전이 생기면 대기가 안정되어 오염 물질이 확산되지 못한다. 열섬 현상은 도심의 기온이 주변보다 높은 현상이고, 온실효과는 온실가스가 지구 복사열을 붙잡아 기온이 오르는 현상이다."},
{"id":"c82","subj":"지역사회간호","unit":"환경보건","q":"대기 중에서 질소산화물과 탄화수소가 자외선을 받아 광화학 반응을 일으켜 만들어지는 2차 오염 물질은?","opts":["일산화탄소","아황산가스","납","오존"],"ans":3,"exp":"오존은 배출원에서 바로 나오지 않고 질소산화물과 탄화수소가 햇빛과 반응하여 생기는 대표적인 2차 오염 물질이다. 일산화탄소, 아황산가스, 납은 배출원에서 직접 나오는 1차 오염 물질이다."},
{"id":"c83","subj":"지역사회간호","unit":"환경보건","q":"수질 오염 지표에 대한 설명으로 옳은 것은?","opts":["용존산소량(DO)이 높을수록 오염이 심한 물이다","수온이 높을수록 용존산소량이 늘어난다","생물화학적 산소요구량(BOD)이 높을수록 유기물 오염이 심하다","BOD가 높은 물은 DO도 함께 높다"],"ans":2,"exp":"BOD는 미생물이 물속 유기물을 분해하는 데 쓰는 산소의 양이므로 높을수록 유기물이 많은 오염된 물이다. DO는 물에 녹아 있는 산소의 양으로 높을수록 깨끗하며, 수온이 높거나 BOD가 높으면 DO는 낮아진다."},
{"id":"c84","subj":"지역사회간호","unit":"환경보건","q":"오존층 파괴 물질인 염화불화탄소(CFCs) 등의 생산과 사용을 규제하려고 맺은 국제 협약은?","opts":["몬트리올 의정서","교토 의정서","바젤 협약","람사르 협약"],"ans":0,"exp":"몬트리올 의정서는 오존층 파괴 물질의 생산과 사용을 규제한다. 교토 의정서는 온실가스 감축, 바젤 협약은 유해 폐기물의 국가 간 이동 규제, 람사르 협약은 습지 보전에 관한 협약이다."},
{"id":"c85","subj":"지역사회간호","unit":"환경보건","q":"다음 식중독의 원인으로 가장 가능성이 큰 것은?\n\n손에 곪은 상처가 있는 조리자가 만든 김밥을 먹고 3시간쯤 뒤에 여러 사람이 심한 구토와 복통을 일으켰다. 열은 거의 없었다.","opts":["살모넬라 식중독","장염비브리오 식중독","황색포도알균 식중독","보툴리누스 식중독"],"ans":2,"exp":"황색포도알균 식중독은 화농성 상처의 균이 음식에서 만든 장독소 때문에 생기는 독소형 식중독으로, 잠복기가 평균 3시간으로 짧고 구토가 심하며 열은 거의 없다. 살모넬라와 장염비브리오 식중독은 감염형으로 잠복기가 더 길고 열이 나며, 보툴리누스 식중독은 신경 마비 증상이 특징이다."},
{"id":"c86","subj":"지역사회간호","unit":"환경보건","q":"감각온도(실효온도)를 결정하는 세 가지 요소가 아닌 것은?","opts":["기온","기습","기류","복사열"],"ans":3,"exp":"감각온도는 기온, 기습(습도), 기류의 세 요소가 어우러져 사람이 느끼는 온도이다. 복사열은 여기에 더해 4대 온열 요소를 이루지만 감각온도의 요소는 아니다."},
{"id":"c87","subj":"지역사회간호","unit":"인구","q":"생산연령 인구가 많이 들어오는 도시 지역에서 나타나며, 15~49세 인구가 전체 인구의 50%를 넘는 인구 구조 유형은?","opts":["별형","호로형(표주박형)","종형","항아리형"],"ans":0,"exp":"별형은 생산연령 인구가 유입되는 도시형 인구 구조이다. 호로형은 생산연령 인구가 빠져나가는 농촌형이고, 종형은 출생률과 사망률이 모두 낮은 인구 정지형, 항아리형은 출생률이 사망률보다 낮은 인구 감퇴형이다."},
{"id":"c88","subj":"지역사회간호","unit":"인구","q":"어느 지역의 인구가 다음과 같다. 노령화지수는?\n\n0~14세: 200명\n15~64세: 1,000명\n65세 이상: 300명","opts":["30","50","약 67","150"],"ans":3,"exp":"노령화지수는 65세 이상 인구를 0~14세 인구로 나누고 100을 곱한 값이다. 300 ÷ 200 × 100 = 150. 30은 노년부양비(300 ÷ 1,000 × 100)이고, 50은 총부양비((200 + 300) ÷ 1,000 × 100)이다."},
{"id":"c89","subj":"지역사회간호","unit":"인구","q":"블래커(Blacker)의 인구 성장 5단계 중 사망률이 낮은 수준에 머무는 가운데 출생률이 떨어지기 시작하여 인구 증가 속도가 둔해지는 단계는?","opts":["고위정지기","초기확장기","후기확장기","저위정지기"],"ans":2,"exp":"후기확장기는 낮은 사망률에 출생률 감소가 더해져 인구 증가가 둔해지는 단계이다. 고위정지기는 출생률과 사망률이 모두 높은 단계, 초기확장기는 출생률은 높은데 사망률이 떨어져 인구가 빠르게 느는 단계, 저위정지기는 출생률과 사망률이 모두 가장 낮아 인구 증가가 멈추는 단계이다."},
{"id":"c90","subj":"지역사회간호","unit":"모자보건","q":"A 지역의 한 해 자료가 다음과 같다. 알파 인덱스(α-index)는?\n\n출생아 수: 2,000명\n영아 사망자 수: 20명\n신생아 사망자 수: 16명","opts":["0.8","1.25","8","10"],"ans":1,"exp":"알파 인덱스는 영아 사망자 수를 신생아 사망자 수로 나눈 값이다. 20 ÷ 16 = 1.25. 값이 1에 가까울수록 영아 사망의 대부분이 예방하기 어려운 신생아기 사망이라는 뜻이어서 보건 수준이 높다고 본다. 10은 출생아 1,000명당 영아사망률, 8은 신생아사망률이다."},
{"id":"c91","subj":"지역사회간호","unit":"모자보건","q":"모성사망비를 구할 때 분모로 쓰는 것은?","opts":["연간 출생아 수","가임기(15~49세) 여성 수","연간 임신 건수","연앙인구"],"ans":0,"exp":"모성사망비는 임신·분만·산욕 합병증으로 인한 모성 사망자 수를 그해 출생아 수로 나눈 값으로, 보통 출생아 10만 명당으로 나타낸다. 가임기 여성 수를 분모로 하면 모성사망률이 된다."},
{"id":"c92","subj":"지역사회간호","unit":"모자보건","q":"「모자보건법」상 \"임산부\"의 정의로 옳은 것은?","opts":["임신 중인 여성만을 말한다","임신 중이거나 분만 후 6주 미만인 여성","임신 중이거나 분만 후 6개월 미만인 여성","임신 중이거나 분만 후 1년 미만인 여성"],"ans":2,"exp":"「모자보건법」에서 임산부는 임신 중이거나 분만 후 6개월 미만인 여성을 말한다. 같은 법에서 영유아는 출생 후 6년 미만인 사람, 신생아는 출생 후 28일 이내의 영유아이다."},
{"id":"c93","subj":"지역사회간호","unit":"가정간호","q":"의료기관 가정간호 사업에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 근거하여 보건소가 직접 운영한다","장기요양 등급을 받은 노인만 이용할 수 있다","비용은 모두 노인장기요양보험에서 지급한다","의사나 한의사의 의뢰에 따라 가정전문간호사가 수행한다"],"ans":3,"exp":"의료기관 가정간호는 「의료법」에 근거하며, 의사나 한의사가 가정에서 계속 치료와 관리가 필요하다고 판단하여 의뢰한 환자에게 가정전문간호사가 제공하고 건강보험이 적용된다. 보건소가 운영하는 것은 방문건강관리 사업이고, 장기요양 등급자에게 장기요양보험으로 제공하는 것은 방문간호이다."},
{"id":"c94","subj":"지역사회간호","unit":"방문건강관리","q":"간호사가 대상자의 집을 찾아가는 가정방문 활동의 장점으로 옳은 것은?","opts":["대상자의 가정 환경과 생활 모습을 직접 보고 그 상황에 맞는 간호와 교육을 할 수 있다","같은 건강 문제를 가진 대상자들이 한자리에 모여 서로 경험을 나눌 수 있다","다른 간호 수단보다 간호사의 시간과 비용이 적게 든다","여러 전문 인력과 다양한 기구·시설을 한곳에서 활용하기 쉽다"],"ans":0,"exp":"가정방문은 대상자의 실제 생활 환경을 살펴 가족의 상황에 맞는 간호와 교육을 할 수 있고, 거동이 불편한 대상자도 서비스를 받을 수 있으며, 대상자가 편안한 분위기에서 이야기할 수 있다는 장점이 있다. 반면 시간과 비용이 많이 들고, 같은 문제를 가진 사람들과 경험을 나누기 어려우며, 전문 인력과 기구·시설을 활용하기 어렵다. 나머지 세 선지는 건강관리실(클리닉) 활동의 장점이다."},
{"id":"c95","subj":"지역사회간호","unit":"사례관리","q":"사례관리의 원칙 중 대상자의 요구 변화를 계속 점검하면서 서비스가 끊기지 않고 이어지도록 하는 것은?","opts":["개별성","포괄성","지속성","책임성"],"ans":2,"exp":"지속성은 한 번의 서비스로 끝내지 않고 점검과 재사정을 되풀이하며 서비스를 이어 가는 원칙이다. 개별성은 대상자마다 다른 요구에 맞추는 것, 포괄성은 대상자의 다양한 요구를 두루 충족하는 것, 책임성은 사례관리자가 서비스 전 과정을 책임지는 것이다."},
{"id":"c96","subj":"지역사회간호","unit":"노인보건","q":"노인의 수단적 일상생활 수행능력(IADL)을 사정하는 항목은?","opts":["목욕하기","옷 입기","화장실 사용하기","대중교통 이용하기"],"ans":3,"exp":"IADL은 지역사회에서 독립적으로 살아가는 데 필요한 좀 더 복잡한 활동으로 교통수단 이용, 물건 사기, 금전 관리, 전화 사용, 식사 준비 등이 해당한다. 목욕하기, 옷 입기, 화장실 사용하기는 기본적인 자기 돌봄 능력인 일상생활 수행능력(ADL) 항목이다."},
{"id":"c97","subj":"지역사회간호","unit":"재난간호","q":"재난 관리 단계 중 다음 활동이 이루어지는 단계는?\n\n재난 대응 계획을 세우고 비상 연락망을 정비한다.\n구호 물자를 비축하고 모의 훈련을 한다.","opts":["예방·완화 단계","대비 단계","대응 단계","복구 단계"],"ans":1,"exp":"대비 단계는 재난이 일어났을 때 곧바로 대응할 수 있도록 계획, 훈련, 물자, 연락 체계를 미리 갖추는 단계이다. 예방·완화 단계는 위험 요인을 찾아 줄이는 단계이고, 대응 단계는 재난 발생 뒤 구조와 중증도 분류, 응급 처치를 하는 단계, 복구 단계는 피해를 회복하는 단계이다."},
{"id":"c98","subj":"지역사회간호","unit":"재난간호","q":"다수 사상자가 발생한 재난 현장에서 다음 환자에게 붙일 중증도 분류표의 색은?\n\n의식이 흐리고 호흡이 분당 36회로 빠르며, 요골 맥박이 약하고 피부가 차고 축축하다. 즉시 처치하면 살 가능성이 높다.","opts":["적색","황색","녹색","흑색"],"ans":0,"exp":"쇼크와 호흡 곤란으로 생명이 위태롭지만 즉시 처치하면 살 수 있는 환자는 긴급 환자로 적색이다. 황색은 처치가 몇 시간 늦어져도 생명에 지장이 없는 응급 환자, 녹색은 걸을 수 있는 경상 환자, 흑색은 사망하였거나 생존 가능성이 없는 환자이다."},
{"id":"c99","subj":"지역사회간호","unit":"재난간호","q":"「재난 및 안전관리 기본법」상 사회재난에 해당하는 것은?","opts":["태풍","지진","황사","감염병의 확산"],"ans":3,"exp":"사회재난은 화재, 붕괴, 폭발, 교통사고, 환경오염 사고와 감염병·가축전염병의 확산 등으로 인한 피해를 말한다. 태풍, 지진, 황사는 자연 현상으로 생기는 자연재난이다."},
{"id":"c100","subj":"지역사회간호","unit":"국제보건","q":"유엔의 지속가능발전목표(SDGs)에 대한 설명으로 옳은 것은?","opts":["2000년부터 2015년까지 추진한 8개 목표이다","개발도상국에만 적용하는 목표이다","2030년까지 달성하려는 17개 목표로 이루어져 있다","보건 분야의 목표는 들어 있지 않다"],"ans":2,"exp":"지속가능발전목표는 2016년부터 2030년까지 모든 나라가 함께 추진하는 17개 목표이며, 세 번째 목표가 건강과 복지이다. 2000년부터 2015년까지 추진한 8개 목표는 새천년개발목표(MDGs)이다."},
{"id":"c101","subj":"지역사회간호","unit":"역학 연구","q":"다음 연구의 설계 유형은?\n\n보건소 간호사가 어느 해 5월 한 달 동안 A군의 40세 이상 주민 2,000명의 혈압을 재고, 같은 날 설문지로 짠 음식을 먹는 습관을 조사하여 둘의 관련성을 분석하였다.","opts":["코호트 연구","단면조사 연구","환자-대조군 연구","지역사회 실험 연구"],"ans":1,"exp":"한 시점에 노출(식습관)과 질병(고혈압) 유무를 동시에 조사하였으므로 단면조사 연구이다. 유병률을 구할 수 있지만 원인과 결과의 시간적 선후를 밝히기 어렵다. 코호트 연구는 노출 여부로 나눈 집단을 추적하고, 환자-대조군 연구는 환자와 대조군의 과거 노출을 비교하며, 실험 연구는 연구자가 중재를 배정한다."},
{"id":"c102","subj":"지역사회간호","unit":"역학 연구","q":"다음 환자-대조군 연구에서 결과를 왜곡할 가능성이 가장 큰 바이어스는?\n\n선천성 기형아를 낳은 어머니와 건강한 아기를 낳은 어머니에게 임신 중 약물 복용 여부를 물었다. 기형아를 낳은 어머니는 원인을 찾으려고 지난 일을 여러 번 되짚어 본 터라 복용 사실을 더 자세히 기억해 냈다.","opts":["버크슨 바이어스","회상 바이어스","추적 탈락 바이어스","조기 발견 바이어스"],"ans":1,"exp":"환자군과 대조군이 과거 노출을 기억해 내는 정도가 달라 생기는 정보 바이어스가 회상 바이어스이며, 과거 노출을 면담으로 조사하는 환자-대조군 연구에서 흔하다. 버크슨 바이어스는 병원 환자를 대상으로 뽑을 때 생기는 선택 바이어스, 추적 탈락 바이어스는 코호트 연구의 문제, 조기 발견 바이어스는 선별검사 효과를 평가할 때의 문제이다."},
{"id":"c103","subj":"지역사회간호","unit":"역학 연구","q":"다음 상황에서 흡연과 같은 변수를 무엇이라 하는가?\n\n커피를 많이 마시는 사람에게 췌장암이 더 많다는 결과가 나왔다. 그런데 커피를 많이 마시는 사람 가운데 흡연자가 많았고, 흡연은 그 자체로 췌장암의 위험 요인이다. 흡연 여부로 나누어 다시 분석하자 커피와 췌장암의 관련성이 사라졌다.","opts":["매개변수","결과변수","교란변수","독립변수"],"ans":2,"exp":"교란변수는 노출(커피)과도 관련이 있고 질병(췌장암)의 위험 요인이기도 하여, 실제로는 없는 관련성을 있는 것처럼 보이게 하거나 관련성의 크기를 왜곡한다. 층화 분석, 짝짓기, 무작위 배정 등으로 통제한다. 매개변수는 노출이 질병을 일으키는 경로 가운데에 있는 변수이다."},
{"id":"c104","subj":"지역사회간호","unit":"역학 연구","q":"임상시험에서 연구 대상자를 실험군과 대조군에 무작위로 배정하는 주된 목적은?","opts":["연구 결과를 전체 인구에 일반화할 수 있게 한다","대상자와 연구자가 배정 결과를 모르게 한다","연구에 필요한 대상자 수를 줄인다","교란 요인이 두 군에 비슷하게 분포하도록 한다"],"ans":3,"exp":"무작위 배정을 하면 알려진 요인뿐 아니라 알려지지 않은 요인까지 두 군에 고르게 나뉘어 두 군이 비교 가능해진다. 결과를 일반화하는 데 필요한 것은 대상자의 무작위 추출이고, 배정 결과를 모르게 하는 것은 눈가림(맹검)이다."},
{"id":"c105","subj":"지역사회간호","unit":"역학 연구","q":"다음 연구의 설계 유형은?\n\n연구자가 한 조선소의 30년 전 인사 기록을 이용해 당시 근로자를 석면 취급 부서와 그 밖의 부서로 나누었다. 이어서 그때부터 현재까지 두 집단의 폐암 발생 기록을 찾아 발생률을 비교하였다.","opts":["전향적 코호트 연구","환자-대조군 연구","단면조사 연구","후향적 코호트 연구"],"ans":3,"exp":"노출 여부로 집단을 나누고 발생률을 비교하므로 코호트 연구이고, 연구를 시작할 때 이미 노출과 질병 발생이 끝난 과거 기록을 쓰므로 후향적 코호트 연구이다. 전향적 코호트 연구는 연구 시작 뒤 앞으로 추적한다. 환자-대조군 연구는 질병 유무로 집단을 나누어 과거 노출을 비교한다."},
{"id":"c106","subj":"지역사회간호","unit":"역학 연구","q":"다음 연구 결과가 뒷받침하는 인과관계 판단 기준은?\n\n하루 흡연량이 반 갑 미만인 군, 반 갑에서 한 갑인 군, 한 갑이 넘는 군으로 갈수록 폐암 발생률이 단계적으로 높아졌다.","opts":["시간적 선후 관계","용량-반응 관계","관련성의 특이성","관련성의 일관성"],"ans":1,"exp":"노출의 양이나 기간이 늘수록 질병 발생이 늘어나는 것이 용량-반응 관계(양-반응 관계)이다. 시간적 선후 관계는 원인이 결과보다 앞서는 것, 특이성은 한 요인이 특정 질병과만 관련되는 것, 일관성은 다른 집단과 다른 방법으로 연구해도 같은 결과가 나오는 것이다."},
{"id":"c107","subj":"지역사회간호","unit":"역학 연구","q":"한 화학 공장 근로자의 사망률을 일반 인구의 사망률과 비교하였더니 근로자의 사망률이 오히려 낮게 나왔다. 일할 수 있을 만큼 건강한 사람이 고용되고 계속 근무하기 때문에 나타나는 이 현상은?","opts":["호손 효과","위약 효과","건강근로자 효과","코호트 효과"],"ans":2,"exp":"근로자 집단은 일반 인구보다 원래 건강한 사람이 많아 유해 인자의 영향이 실제보다 작게 보이는데, 이를 건강근로자 효과라 하며 선택 바이어스의 하나이다. 호손 효과는 연구 대상이 된 사실을 알아 행동이 달라지는 것, 위약 효과는 약효가 없는 처치에도 좋아졌다고 느끼는 것이다."},
{"id":"c108","subj":"지역사회간호","unit":"역학 연구","q":"다음 연구에 대한 설명으로 옳은 것은?\n\n30개 나라의 1인당 평균 소금 섭취량과 위암 사망률 자료를 모아 나라별로 비교하였더니, 소금 섭취량이 많은 나라일수록 위암 사망률이 높았다.","opts":["집단 수준의 관련성을 개인에게 그대로 적용하면 오류가 생길 수 있다","개인별 노출과 질병 발생을 추적한 코호트 연구이다","이 결과만으로 소금이 위암의 원인이라고 확정할 수 있다","연구자가 노출 수준을 배정한 실험 연구이다"],"ans":0,"exp":"개인이 아닌 집단을 단위로 평균 노출과 질병 수준을 비교하는 생태학적 연구이다. 소금을 많이 먹은 바로 그 사람이 위암에 걸렸는지는 알 수 없으므로, 집단의 결과를 개인에게 적용하면 생태학적 오류가 생길 수 있다. 가설을 세우는 데는 쓸모 있지만 인과관계를 확정하지는 못한다."},
{"id":"c109","subj":"지역사회간호","unit":"역학 지표","q":"어느 코호트 연구의 결과가 다음과 같다. 음주의 기여위험도(귀속위험도)는?\n\n음주군 2,000명 중 간질환 발생 80명\n비음주군 4,000명 중 간질환 발생 40명","opts":["인구 1,000명당 10명","인구 1,000명당 30명","인구 1,000명당 40명","인구 1,000명당 50명"],"ans":1,"exp":"기여위험도는 노출군 발생률에서 비노출군 발생률을 뺀 값이다. 음주군 80/2,000 = 1,000명당 40명, 비음주군 40/4,000 = 1,000명당 10명이므로 40 − 10 = 1,000명당 30명이다. 두 발생률의 비(40 ÷ 10 = 4)는 상대위험비이다."},
{"id":"c110","subj":"지역사회간호","unit":"역학 지표","q":"고혈압이 있는 군의 뇌졸중 발생률은 인구 1,000명당 50명, 고혈압이 없는 군의 발생률은 인구 1,000명당 10명이다. 고혈압이 있는 군에서 발생한 뇌졸중 가운데 고혈압 때문에 생긴 것의 비율(기여위험분율)은?","opts":["20%","40%","50%","80%"],"ans":3,"exp":"기여위험분율 = (노출군 발생률 − 비노출군 발생률) ÷ 노출군 발생률 × 100 이다. (50 − 10) ÷ 50 × 100 = 80%. 고혈압을 없애면 고혈압이 있는 군의 뇌졸중 가운데 80%를 예방할 수 있다는 뜻이다. 상대위험비는 50 ÷ 10 = 5 이다."},
{"id":"c111","subj":"지역사회간호","unit":"역학 지표","q":"어느 감염병 유행에 대한 자료가 다음과 같다. 이차발병률은?\n\n처음 발병한 환자(초발 환자): 10명\n초발 환자와 함께 사는 가족(초발 환자 제외): 60명\n그 가족 가운데 이미 면역이 있는 사람: 10명\n최장 잠복기 안에 그 가족 가운데 새로 발병한 사람: 15명","opts":["15%","25%","30%","50%"],"ans":2,"exp":"이차발병률 = 초발 환자와 접촉한 감수성자 가운데 최장 잠복기 안에 발병한 사람 ÷ 접촉한 감수성자 × 100 이다. 분모에서 초발 환자와 면역이 있는 사람을 뺀다. 15 ÷ (60 − 10) × 100 = 30%. 면역자를 빼지 않으면 25%로 잘못 구하게 된다."},
{"id":"c112","subj":"지역사회간호","unit":"역학 지표","q":"인구 50,000명인 지역에서 1년 동안 어떤 감염병 환자가 250명 발생하였고, 그 가운데 20명이 사망하였다. 이 감염병의 치명률은?","opts":["0.04%","0.5%","8%","12.5%"],"ans":2,"exp":"치명률은 그 질병에 걸린 환자 가운데 그 질병으로 사망한 사람의 비율이다. 20 ÷ 250 × 100 = 8%. 사망자를 전체 인구로 나눈 0.04%는 이 질병의 사망률이고, 환자를 전체 인구로 나눈 0.5%는 발생률이다."},
{"id":"c113","subj":"지역사회간호","unit":"역학 지표","q":"1,000명에게 선별검사와 확진검사를 한 결과가 다음과 같다. 이 선별검사의 특이도는?\n\n확진검사에서 환자인 200명: 선별검사 양성 160명, 음성 40명\n환자가 아닌 800명: 선별검사 양성 80명, 음성 720명","opts":["약 67%","80%","90%","약 95%"],"ans":2,"exp":"특이도는 질병이 없는 사람 가운데 검사 결과가 음성인 사람의 비율이다. 720 ÷ 800 × 100 = 90%. 80%는 민감도(160 ÷ 200), 약 67%는 양성예측도(160 ÷ 240), 약 95%는 음성예측도(720 ÷ 760)이다."},
{"id":"c114","subj":"지역사회간호","unit":"역학 지표","q":"600명에게 선별검사를 한 결과가 다음과 같다. 이 검사의 음성예측도는?\n\n실제 환자 100명: 검사 양성 60명, 검사 음성 40명\n환자가 아닌 사람 500명: 검사 양성 140명, 검사 음성 360명","opts":["30%","60%","72%","90%"],"ans":3,"exp":"음성예측도는 검사 음성인 사람 가운데 실제로 질병이 없는 사람의 비율이다. 360 ÷ (40 + 360) × 100 = 90%. 30%는 양성예측도(60 ÷ 200), 60%는 민감도(60 ÷ 100), 72%는 특이도(360 ÷ 500)이다."},
{"id":"c115","subj":"지역사회간호","unit":"역학 지표","q":"당뇨병 선별검사에서 양성으로 판정하는 공복 혈당 기준치를 126mg/dL에서 110mg/dL로 낮추었다. 이때 나타나는 변화로 옳은 것은?","opts":["민감도는 낮아지고 특이도는 높아진다","민감도와 특이도가 모두 높아진다","민감도와 특이도가 모두 낮아진다","민감도는 높아지고 특이도는 낮아진다"],"ans":3,"exp":"기준치를 낮추면 더 많은 사람이 양성으로 판정된다. 환자를 놓치는 위음성이 줄어 민감도는 높아지지만, 환자가 아닌데 양성으로 나오는 위양성이 늘어 특이도는 낮아진다. 한 검사에서 민감도와 특이도는 기준치에 따라 서로 반대로 움직인다."},
{"id":"c116","subj":"지역사회간호","unit":"역학 지표","q":"다음에서 간호사가 확인하려는 측정 도구의 속성은?\n\n같은 대상자의 혈압을 같은 조건에서 두 간호사가 각각 재어 두 측정값이 얼마나 일치하는지 알아보았다.","opts":["타당도","신뢰도","민감도","예측도"],"ans":1,"exp":"신뢰도는 같은 대상을 되풀이하여 재거나 여러 사람이 재었을 때 결과가 일치하는 정도이며, 사례는 측정자 간 신뢰도를 본 것이다. 타당도는 재려는 것을 얼마나 정확하게 재는가를 뜻하고 민감도와 특이도로 나타낸다. 예측도는 검사 결과가 실제 질병 유무와 맞을 확률이다."},
{"id":"c117","subj":"지역사회간호","unit":"역학 지표","q":"어떤 만성질환의 발생률이 연간 인구 1,000명당 4명이고 평균 이환 기간이 5년이다. 발생률과 이환 기간이 일정하고 유병률이 낮다고 할 때, 이 질환의 유병률은?","opts":["인구 1,000명당 0.8명","인구 1,000명당 4명","인구 1,000명당 9명","인구 1,000명당 20명"],"ans":3,"exp":"유병률이 낮고 발생률과 이환 기간이 일정하면 유병률 ≒ 발생률 × 평균 이환 기간이다. 4 × 5 = 인구 1,000명당 20명. 이환 기간이 긴 만성질환은 발생률이 낮아도 유병률이 높아진다."},
{"id":"c118","subj":"지역사회간호","unit":"역학 지표","q":"질병이 없는 5명을 추적 관찰한 결과가 다음과 같다. 평균 발생률(발생 밀도)은?\n\n가: 2년 동안 관찰한 뒤 발병\n나: 4년 동안 관찰, 발병하지 않음\n다: 3년 동안 관찰한 뒤 발병\n라: 5년 동안 관찰, 발병하지 않음\n마: 6년 동안 관찰, 발병하지 않음","opts":["100인년당 2명","100인년당 10명","100인년당 20명","100인년당 40명"],"ans":1,"exp":"평균 발생률은 새로 발생한 환자 수를 관찰한 인년의 합으로 나눈 값이며, 발병한 사람은 발병할 때까지만 관찰 기간으로 센다. 관찰 인년 = 2 + 4 + 3 + 5 + 6 = 20인년, 발병자 2명이므로 2 ÷ 20 × 100 = 100인년당 10명이다. 2 ÷ 5 = 40%는 처음 인원을 분모로 한 누적 발생률이다."},
{"id":"c119","subj":"지역사회간호","unit":"역학 지표","q":"A군은 노인 인구 비율이 30%이고 B시는 10%이다. 두 지역의 인구 구조 차이가 미치는 영향을 없애고 사망 수준을 비교하려 할 때 쓰는 지표는?","opts":["조사망률","연령표준화 사망률","치명률","비례사망률"],"ans":1,"exp":"조사망률은 노인이 많은 지역에서 높게 나오므로 인구 구조가 다른 지역끼리 그대로 비교하면 안 된다. 표준 인구를 정해 두 지역의 연령 구조가 같다고 가정하고 다시 계산한 연령표준화 사망률로 비교한다. 치명률은 환자 가운데 사망자의 비율, 비례사망률은 전체 사망 가운데 특정 원인이 차지하는 비율이다."},
{"id":"c120","subj":"지역사회간호","unit":"건강증진","q":"리벨과 클라크(Leavell & Clark)가 나눈 질병의 자연사 5단계 중 다음 단계에 알맞은 예방 조치는?\n\n병원체의 자극으로 숙주에게 병리적 변화가 시작되었으나 아직 증상은 나타나지 않은 시기(불현성 질환기)","opts":["건강 증진과 환경 위생 개선","예방접종 같은 특수 예방","재활과 사회 복귀 훈련","조기 진단과 조기 치료"],"ans":3,"exp":"증상이 없는 불현성 질환기(3단계)에는 집단검진으로 일찍 찾아내어 치료하는 2차 예방이 알맞다. 건강 증진과 환경 위생은 비병원성기(1단계), 특수 예방은 초기 병원성기(2단계)의 1차 예방이고, 재활은 회복기(5단계)의 3차 예방이다."},
{"id":"c121","subj":"지역사회간호","unit":"건강증진","q":"보건소가 하는 다음 사업 중 1차 예방에 해당하는 것은?","opts":["50세 이상 주민 분변잠혈검사","당뇨병 환자 망막 합병증 검진","뇌졸중 환자 재활 운동 교실","초등학생 불소 용액 양치 사업"],"ans":3,"exp":"1차 예방은 질병이 생기기 전에 건강을 증진하고 특정 질병을 막는 것으로, 충치를 막는 불소 양치가 해당한다. 분변잠혈검사는 대장암을 일찍 찾는 2차 예방이다. 이미 병이 있는 사람의 합병증을 찾고 기능을 되찾게 하는 검진과 재활은 1차 예방이 아니다."},
{"id":"c122","subj":"지역사회간호","unit":"감염병 관리","q":"가을철 야외 활동 뒤에 발열과 발진이 나타나고 물린 자리에 검은 딱지(가피)가 생기는 쯔쯔가무시증을 매개하는 것은?","opts":["작은소피참진드기","작은빨간집모기","쥐벼룩","털진드기 유충"],"ans":3,"exp":"쯔쯔가무시증은 오리엔티아 쯔쯔가무시균에 감염된 털진드기 유충에 물려 걸린다. 작은소피참진드기는 중증열성혈소판감소증후군, 작은빨간집모기는 일본뇌염, 쥐벼룩은 페스트와 발진열을 매개한다."},
{"id":"c123","subj":"지역사회간호","unit":"감염병 관리","q":"말라리아 원충은 모기의 몸 안에서 수가 늘어나는 동시에 생활사의 한 단계를 거치며 발육한 뒤 사람에게 전파된다. 이와 같은 생물학적 전파 유형은?","opts":["증식형","발육형","발육증식형","경란형"],"ans":2,"exp":"병원체가 매개 곤충 안에서 발육과 증식을 함께 하는 것이 발육증식형이며 말라리아와 수면병이 해당한다. 증식형은 수만 늘어나는 것(페스트, 일본뇌염, 황열), 발육형은 수는 늘지 않고 발육만 하는 것(사상충증), 경란형은 병원체가 곤충의 알을 거쳐 다음 세대로 넘어가는 것(쯔쯔가무시증)이다."},
{"id":"c124","subj":"지역사회간호","unit":"감염병 관리","q":"어떤 감염병에 대한 자료가 다음과 같다. 이 병원체의 병원력은?\n\n감수성이 있는 접촉자: 500명\n접촉자 가운데 감염된 사람: 200명\n감염자 가운데 증상이 나타난 사람: 50명\n증상이 나타난 사람 가운데 사망자: 5명","opts":["10%","25%","40%","50%"],"ans":1,"exp":"병원력은 감염된 사람 가운데 증상이 나타난 사람(현성 감염자)의 비율이다. 50 ÷ 200 × 100 = 25%. 감염력은 접촉한 감수성자 가운데 감염된 사람의 비율로 200 ÷ 500 = 40%, 치명률은 5 ÷ 50 = 10%이다."},
{"id":"c125","subj":"지역사회간호","unit":"감염병 관리","q":"기초감염재생산수(R0)가 4인 감염병이 있다. 인구의 50%가 면역을 가지고 있을 때 환자 한 명이 실제로 감염시키는 평균 사람 수(감염재생산수)는? (단, 감염재생산수 = R0 × 감수성자의 비율로 구한다.)","opts":["0.5","1","2","4"],"ans":2,"exp":"R0는 모든 사람이 감수성자일 때 환자 한 명이 감염시키는 평균 사람 수이다. 인구의 50%가 면역이면 감수성자는 50%이므로 4 × 0.5 = 2 이다. 이 값이 1보다 크므로 유행은 계속 퍼지며, 1보다 작아지려면 면역 인구가 1 − 1/4 = 75%를 넘어야 한다."},
{"id":"c126","subj":"지역사회간호","unit":"감염병 관리","q":"병원체가 숙주에 침입한 때부터, 그 숙주가 병원체를 가장 많이 배출하여 감염력이 가장 높아지는 때까지의 기간은?","opts":["세대기","잠복기","잠재기","회복기"],"ans":0,"exp":"세대기는 감염된 때부터 병원체 배출이 가장 많아지는 때까지의 기간으로, 환자를 언제까지 격리해야 하는지 정하는 데 쓰인다. 잠복기는 침입한 때부터 증상이 나타날 때까지, 잠재기는 침입한 때부터 병원체 배출이 시작될 때까지의 기간이다."},
{"id":"c127","subj":"지역사회간호","unit":"감염병 관리","q":"세균이 만든 독소를 처리하여 독성은 없애고 면역을 일으키는 성질만 남긴 순화독소(톡소이드)로 예방접종하는 감염병은?","opts":["홍역","파상풍","일본뇌염","결핵"],"ans":1,"exp":"파상풍과 디프테리아는 균이 내는 독소가 병을 일으키므로 순화독소로 접종한다. 홍역 백신과 결핵 백신(BCG)은 약독화 생백신이고, 일본뇌염은 불활성화 백신 또는 약독화 생백신을 쓴다."},
{"id":"c128","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 유행 여부를 조사하기 위하여 표본감시 활동이 필요한 감염병으로, 표본감시기관이 7일 이내에 신고하는 것은?","opts":["제1급감염병","제2급감염병","제3급감염병","제4급감염병"],"ans":3,"exp":"제4급감염병은 제1급부터 제3급까지의 감염병 외에 유행 여부를 조사하기 위하여 표본감시 활동이 필요한 감염병이며 7일 이내에 신고한다. 제1급감염병은 즉시, 제2급과 제3급감염병은 24시간 이내에 신고하는 전수감시 대상이다."},
{"id":"c129","subj":"지역사회간호","unit":"감염병 관리","q":"감염병 유행 지역에서 입국한 사람 가운데 증상은 없지만 병원체에 노출되었을 가능성이 있는 사람을, 그 감염병의 최장 잠복기 동안 일정한 곳에 머물게 하며 발병 여부를 살피는 조치는?","opts":["환자 격리","보호 격리(역격리)","표본 감시","검역(건강 격리)"],"ans":3,"exp":"검역은 감염이 의심되는 건강한 사람의 이동을 최장 잠복기 동안 제한하는 것이다. 환자 격리는 이미 발병한 환자나 보균자를 감염력이 없어질 때까지 떼어 놓는 것이고, 보호 격리는 면역이 약한 사람을 병원체로부터 지키려고 따로 두는 것이다."},
{"id":"c130","subj":"지역사회간호","unit":"보건교육 이론","q":"다음 보건교육에 바탕이 된 학습 이론은?\n\n간호사는 학습자가 스스로 배우려는 욕구와 잠재력을 가진 존재라고 보고, 배울 내용과 방법을 학습자가 정하게 하였다. 간호사는 지시하지 않고 존중하는 분위기에서 학습을 돕는 촉진자 역할을 하였으며, 학습의 목적을 자아실현에 두었다.","opts":["행동주의 학습이론","인지주의 학습이론","인본주의 학습이론","사회학습이론"],"ans":2,"exp":"인본주의 학습이론은 학습자를 자율적인 존재로 보고 자기 주도 학습과 자아실현을 강조하며, 교육자는 조력자이자 촉진자가 된다. 행동주의는 자극과 반응, 강화로 행동을 바꾸는 데, 인지주의는 정보를 받아들여 처리하는 내적 사고 과정에, 사회학습이론은 다른 사람을 관찰하고 모방하는 데 초점을 둔다."},
{"id":"c131","subj":"지역사회간호","unit":"보건교육","q":"다음 학습 목표 중 정의적 영역에 해당하는 것은?","opts":["대상자는 금연 프로그램에 스스로 참여하겠다는 뜻을 밝힌다","대상자는 흡연이 폐에 미치는 영향을 세 가지 이상 말한다","대상자는 니코틴 패치를 올바른 순서로 붙인다","대상자는 금연 보조제의 종류를 구분하여 설명한다"],"ans":0,"exp":"정의적 영역은 태도, 가치, 흥미, 느낌의 변화를 다루므로 스스로 참여하려는 태도가 여기에 속한다. 영향을 말하거나 종류를 구분하여 설명하는 것은 지식과 이해를 다루는 인지적 영역이고, 패치를 순서대로 붙이는 것은 기술을 다루는 심리운동 영역이다."},
{"id":"c132","subj":"지역사회간호","unit":"보건교육","q":"어떤 주제에 대해 서로 다른 견해를 가진 전문가 4~7명이 사회자의 진행에 따라 청중 앞에서 서로 의견을 주고받으며 토론하는 교육 방법은?","opts":["심포지엄","분단 토의","패널 토의","시범"],"ans":2,"exp":"패널 토의(배심 토의)는 전문가들이 청중 앞에서 서로 토론하여 한 주제를 여러 각도에서 보게 하는 방법이다. 심포지엄은 전문가들이 서로 토론하지 않고 각자 준비한 내용을 차례로 발표한다. 분단 토의는 참가자를 여러 소집단으로 나누어 토의한 뒤 전체가 모여 종합한다."},
{"id":"c133","subj":"지역사회간호","unit":"보건교육","q":"보건교사가 중학생에게 다음과 같이 교육하였다. 이 교육 방법은?\n\n친구가 담배를 권하는 상황을 정해 주고, 학생들이 권하는 사람과 거절하는 사람을 맡아 직접 연기하게 한 뒤, 연기를 본 느낌과 거절하는 방법을 함께 이야기하였다.","opts":["시범","브레인스토밍","프로그램 학습","역할극"],"ans":3,"exp":"역할극은 실제와 비슷한 상황에서 학습자가 직접 역할을 맡아 연기해 보게 하는 방법으로, 태도를 바꾸고 대처 기술을 익히게 하는 데 효과적이다. 시범은 교육자가 기술을 직접 보여 주는 것, 브레인스토밍은 떠오르는 생각을 비판 없이 자유롭게 내놓게 하는 것이다."},
{"id":"c134","subj":"지역사회간호","unit":"보건교육","q":"보건교육 평가를 과정 평가, 영향 평가, 성과(결과) 평가로 나눌 때 영향 평가에 해당하는 것은?","opts":["교육이 계획한 일정과 횟수대로 진행되었는지 본다","교육을 마친 뒤 대상자의 지식과 태도가 달라졌는지 본다","교육 자료와 강사에 대한 참여자의 만족도를 본다","몇 해 뒤 지역의 심뇌혈관질환 사망률이 낮아졌는지 본다"],"ans":1,"exp":"영향 평가는 교육의 단기 효과인 지식, 태도, 기술, 행동의 변화를 본다. 일정과 횟수, 자료와 강사에 대한 만족도를 보는 것은 교육이 계획대로 잘 진행되었는지를 보는 과정 평가이다. 유병률과 사망률, 삶의 질 같은 장기 효과를 보는 것은 성과 평가이다."},
{"id":"c135","subj":"지역사회간호","unit":"보건교육","q":"브래드쇼(Bradshaw)가 나눈 교육 요구의 유형 중 다음에 해당하는 것은?\n\n주민들은 필요를 느끼지 못하고 있지만, 보건의료 전문가가 이 지역의 고혈압 조절률이 기준에 못 미친다고 판단하여 교육이 필요하다고 보았다.","opts":["규범적 요구","내면적 요구","외향적 요구","상대적 요구"],"ans":0,"exp":"규범적 요구는 전문가가 기준에 비추어 판단한 요구이다. 내면적 요구는 대상자가 스스로 필요하다고 느끼는 요구, 외향적 요구는 그 느낌을 말이나 행동으로 드러낸 요구, 상대적 요구는 다른 집단과 비교하여 드러난 요구이다."},
{"id":"c136","subj":"지역사회간호","unit":"건강행위 이론","q":"반두라(Bandura)가 제시한 자기효능감을 높이는 방법 중 다음 사례에 해당하는 것은?\n\n당뇨병 자조 모임에서 자신과 처지가 비슷한 환자가 식사 조절에 성공한 과정을 이야기하는 것을 듣고 \"나도 할 수 있겠다\"고 생각하였다.","opts":["대리 경험","성취 경험","언어적 설득","정서적 각성 조절"],"ans":0,"exp":"대리 경험은 자신과 비슷한 다른 사람이 성공하는 모습을 보거나 들으면서 자기효능감이 높아지는 것이다. 성취 경험은 자신이 직접 해 보아 성공한 경험이고, 언어적 설득은 다른 사람에게서 할 수 있다는 말을 듣는 것이며, 정서적 각성 조절은 불안과 긴장을 줄이는 것이다."},
{"id":"c137","subj":"지역사회간호","unit":"건강행위 이론","q":"건강신념모형의 구성 개념 중 다음 사례에 해당하는 것은?\n\n검진을 미루어 오던 55세 남성이 직장 동료가 대장암 진단을 받았다는 소식을 듣고, 보건소에서 보낸 검진 안내 문자를 받은 뒤 대장암 검진을 예약하였다.","opts":["지각된 장애성","행동의 계기","지각된 유익성","자기효능감"],"ans":1,"exp":"행동의 계기는 건강 행위를 하도록 자극하는 사건이나 정보로, 가까운 사람의 발병, 대중매체의 홍보, 의료인의 권고와 안내문 등이 있다. 지각된 장애성은 행위를 하는 데 드는 부담, 지각된 유익성은 행위로 얻는 이익에 대한 믿음, 자기효능감은 그 행위를 해낼 수 있다는 자신감이다."},
{"id":"c138","subj":"지역사회간호","unit":"건강행위 이론","q":"펜더(Pender)의 건강증진모형에서 '개인적 특성과 경험'에 속하는 개념은?","opts":["지각된 자기효능감","활동과 관련된 정서","이전의 관련 행위","대인 관계의 영향"],"ans":2,"exp":"펜더의 모형에서 개인적 특성과 경험은 이전의 관련 행위와 개인적 요인(생물학적, 심리적, 사회문화적 요인)으로 이루어진다. 지각된 자기효능감, 활동과 관련된 정서, 대인 관계의 영향은 지각된 유익성·장애성, 상황적 영향과 함께 '행위와 관련된 인지와 정서'에 속하며 간호 중재의 주된 대상이다."},
{"id":"c139","subj":"지역사회간호","unit":"건강행위 이론","q":"범이론적 모형(변화단계 이론)에 따를 때 다음 대상자가 속한 단계는?\n\n흡연자인 45세 남성이 다음 달 1일부터 담배를 끊기로 마음먹고, 보건소 금연클리닉에 등록하여 상담 날짜를 잡았다.","opts":["계획 전 단계","계획 단계","준비 단계","행동 단계"],"ans":2,"exp":"준비 단계는 한 달 이내에 행동을 바꿀 의도가 있고 그에 필요한 구체적인 준비를 하는 단계이다. 계획 단계는 6개월 이내에 바꿀 생각은 있으나 구체적인 계획이 없는 단계이고, 행동 단계는 행동을 바꾸어 실천한 지 6개월이 안 된 단계이다. 이 남성은 아직 금연을 시작하지 않았다."},
{"id":"c140","subj":"지역사회간호","unit":"건강행위 이론","q":"합리적 행위이론의 구성 개념 중 다음 사례에 해당하는 것은?\n\n30대 임부가 \"남편과 친정어머니는 내가 모유 수유를 하기를 바라고, 나도 그 기대에 따르고 싶다\"고 말하였다.","opts":["주관적 규범","행위에 대한 태도","행위 의도","결과에 대한 평가"],"ans":0,"exp":"주관적 규범은 자신에게 중요한 사람들이 그 행위를 어떻게 여긴다고 믿는지(규범적 신념)와 그 기대에 따르려는 동기로 이루어진다. 행위에 대한 태도는 행위의 결과에 대한 믿음과 그 결과에 대한 평가로 이루어지며, 태도와 주관적 규범이 행위 의도를 결정한다."},
{"id":"c141","subj":"지역사회간호","unit":"가족간호","q":"가족사정도구 중 함께 사는 가족 구성원 사이의 친밀감, 갈등, 단절 같은 관계의 질을 서로 다른 모양의 선으로 나타낸 것은?","opts":["가계도","외부체계도","가족연대기","가족밀착도"],"ans":3,"exp":"가족밀착도는 동거 가족 구성원 사이의 애정과 갈등 관계를 선으로 그려 가족 내부의 상호 관계를 한눈에 보여 준다. 가계도는 3세대 이상의 가족 구조와 질병력을, 외부체계도는 가족과 외부 체계의 관계를, 가족연대기는 가족에게 일어난 중요한 사건을 시간 순서로 보여 준다."},
{"id":"c142","subj":"지역사회간호","unit":"가족간호","q":"방문간호사가 다음과 같이 그린 가족사정도구는?\n\n혼자 지내는 시간이 많은 뇌졸중 노인을 원의 한가운데에 두고, 그를 둘러싼 동거 가족, 따로 사는 자녀와 친척, 이웃과 친구, 보건소와 복지관을 바깥쪽 원에 차례로 적은 뒤 노인과 주고받는 도움의 정도를 선으로 이었다.","opts":["외부체계도","가족밀착도","가계도","사회지지도"],"ans":3,"exp":"사회지지도는 가족 가운데 가장 취약한 구성원을 중심에 두고 가족 안팎의 지지 체계와 그 정도를 그린 것으로, 누구에게 도움을 받을 수 있는지 파악하는 데 쓴다. 외부체계도는 한 사람이 아니라 가족 전체를 가운데 원에 두고 외부 체계와의 관계를 그린다."},
{"id":"c143","subj":"지역사회간호","unit":"가족간호","q":"스밀크스타인(Smilkstein)의 가족기능 평가도구(Family APGAR)가 평가하는 다섯 항목에 해당하지 않는 것은?","opts":["적응 능력(Adaptation)","동반자 관계(Partnership)","역할 구조(Role)","애정(Affection)"],"ans":2,"exp":"Family APGAR는 적응 능력(Adaptation), 동반자 관계(Partnership), 성장(Growth), 애정(Affection), 친밀감 또는 문제 해결(Resolve)의 다섯 항목에 대한 가족 구성원의 만족도를 묻는다. 역할 구조는 이 도구의 항목이 아니다."},
{"id":"c144","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족 발달 단계에서 첫 자녀가 13~19세인 청소년기 가족이 이루어야 할 발달 과업은?","opts":["자녀의 자유와 책임 사이에 균형 맞추기","은퇴와 줄어든 수입에 적응하기","임신과 부모 됨에 대비하기","영아 양육에 맞추어 부부 역할 조정하기"],"ans":0,"exp":"청소년기 가족은 10대 자녀가 자유와 책임의 균형을 이루도록 돕고, 세대 간에 열린 의사소통을 유지하며, 자녀의 독립에 대비해야 한다. 은퇴에 적응하는 것은 노년기 가족, 임신과 부모 됨에 대비하는 것은 신혼기 가족, 영아 양육에 맞춘 역할 조정은 양육기 가족의 과업이다."},
{"id":"c145","subj":"지역사회간호","unit":"가족간호","q":"다음 관점으로 가족을 이해하는 이론은?\n\n가족은 구성원 한 사람 한 사람을 합한 것보다 큰 하나의 전체이다. 한 구성원에게 생긴 변화는 다른 구성원과 가족 전체에 영향을 미치며, 가족은 경계를 통해 외부 환경과 에너지를 주고받으면서 균형을 유지한다.","opts":["가족발달 이론","가족체계 이론","상징적 상호작용 이론","구조기능 이론"],"ans":1,"exp":"가족체계 이론은 가족을 부분의 합보다 큰 개방 체계로 보고 구성원 사이의 상호작용과 외부 환경과의 교류, 항상성에 주목한다. 가족발달 이론은 가족 생활 주기의 단계별 과업에, 상징적 상호작용 이론은 구성원이 부여하는 의미와 역할에, 구조기능 이론은 가족 구조가 기능을 얼마나 잘 수행하는지에 초점을 둔다."},
{"id":"c146","subj":"지역사회간호","unit":"학교보건","q":"유행성이하선염(볼거리)에 걸린 초등학생의 등교 중지 기간으로 옳은 것은?","opts":["침샘이 붓기 시작한 뒤 5일까지","모든 수포에 딱지가 앉을 때까지","발진이 나타난 뒤 4일까지","항결핵제 치료를 시작한 뒤 2주까지"],"ans":0,"exp":"유행성이하선염은 침샘(이하선)이 붓기 시작한 뒤 5일까지 감염력이 있으므로 그때까지 등교를 중지한다. 모든 수포에 딱지가 앉을 때까지는 수두, 발진이 나타난 뒤 4일까지는 홍역의 등교 중지 기간이다."},
{"id":"c147","subj":"지역사회간호","unit":"학교보건","q":"「교육환경 보호에 관한 법률」에 따라 교육환경보호구역을 설정·고시하는 사람은?","opts":["학교의 장","시장·군수·구청장","교육감","교육부장관"],"ans":2,"exp":"교육환경보호구역은 교육감이 학교 경계 또는 학교 설립 예정지 경계로부터 직선거리 200미터의 범위 안에서 절대보호구역과 상대보호구역으로 나누어 설정·고시한다. 학교의 장은 감염병에 걸린 학생의 등교 중지 등 학교 안의 보건 관리를 맡는다."},
{"id":"c148","subj":"지역사회간호","unit":"학교보건","q":"세계보건기구가 제시한 건강증진학교의 여섯 가지 구성 요소에 해당하지 않는 것은?","opts":["학교 보건 정책","학생의 학업 성취도 관리","학교의 물리적 환경","지역사회와의 연계"],"ans":1,"exp":"건강증진학교의 구성 요소는 학교 보건 정책, 학교의 물리적 환경, 학교의 사회적 환경, 지역사회와의 연계, 개인의 건강 기술과 활동 능력, 학교 보건 서비스의 여섯 가지이다. 학업 성취도 관리는 여기에 들어 있지 않다."},
{"id":"c149","subj":"지역사회간호","unit":"산업보건","q":"온도계와 형광등을 만드는 공장에서 오래 일한 근로자에게 잇몸과 입안의 염증, 손 떨림, 쉽게 흥분하는 정신 증상이 나타났다. 원인으로 가장 가능성이 큰 물질은?","opts":["납","카드뮴","벤젠","수은"],"ans":3,"exp":"수은 중독의 3대 증상은 구내염, 근육 진전(떨림), 정신 증상이다. 납 중독은 빈혈과 잇몸의 연선, 손목 처짐이, 카드뮴 중독은 신장 장애와 골연화증이, 벤젠 중독은 재생불량성 빈혈 같은 조혈 기능 장애가 특징이다."},
{"id":"c150","subj":"지역사회간호","unit":"산업보건","q":"건물 해체 작업이나 단열재를 다루는 과정에서 노출되며, 긴 잠복기를 거쳐 폐암과 악성 중피종을 일으키는 물질은?","opts":["석면","유리규산","석탄 분진","면 분진"],"ans":0,"exp":"석면은 석면폐증과 폐암, 흉막이나 복막의 악성 중피종을 일으키며 노출된 뒤 수십 년이 지나 발병하기도 한다. 유리규산은 규폐증을, 석탄 분진은 탄광부 진폐증을, 면 분진은 면폐증을 일으킨다."},
{"id":"c151","subj":"지역사회간호","unit":"산업보건","q":"소음성 난청에 대한 설명으로 옳은 것은?","opts":["초기에는 4,000Hz 부근의 높은 음부터 청력이 떨어진다","소음 작업을 그만두면 손상된 청력이 대부분 회복된다","외이와 중이의 장애로 생기는 전음성 난청이다","대개 한쪽 귀에만 나타난다"],"ans":0,"exp":"소음성 난청은 속귀의 코르티기관이 손상되어 생기는 감각신경성 난청으로, 초기에 4,000Hz 부근에서 청력 손실이 뚜렷하다(C5-dip). 대개 양쪽 귀에 함께 나타나고 한번 손상되면 회복되지 않으므로 예방이 가장 중요하다."},
{"id":"c152","subj":"지역사회간호","unit":"산업보건","q":"작업환경 관리 원칙인 대치(대체) 가운데 '공정의 변경'에 해당하는 사례는?","opts":["세척제로 쓰던 벤젠을 독성이 약한 톨루엔으로 바꾼다","유해 물질을 다루는 설비를 밀폐하고 원격으로 조작한다","분진이 생기는 곳에 국소 배기 장치를 단다","페인트를 뿌려서 칠하던 것을 담가서 칠하는 방식으로 바꾼다"],"ans":3,"exp":"대치는 공정의 변경, 시설의 변경, 물질의 변경으로 나뉜다. 분무 방식을 담금 방식으로 바꾸는 것은 작업 방법을 바꾸는 공정의 변경이다. 벤젠을 톨루엔으로 바꾸는 것은 물질의 변경이고, 설비를 밀폐하는 것은 격리, 국소 배기 장치를 다는 것은 환기이다."},
{"id":"c153","subj":"지역사회간호","unit":"산업보건","q":"다음 근로자의 건강관리구분은?\n\n소음 작업장에서 일하는 근로자가 특수건강진단을 받은 결과, 아직 소음성 난청은 아니지만 직업성 질병으로 진전될 우려가 있어 추적 검사 등 관찰이 필요하다고 판정되었다.","opts":["A","C1","C2","D1"],"ans":1,"exp":"C1은 직업성 질병으로 진전될 우려가 있어 추적 검사 등 관찰이 필요한 근로자(직업병 요관찰자)이다. A는 건강한 근로자, C2는 일반 질병으로 진전될 우려가 있는 근로자(일반 질병 요관찰자), D1은 직업성 질병의 소견을 보여 사후관리가 필요한 근로자(직업병 유소견자)이다."},
{"id":"c154","subj":"지역사회간호","unit":"산업보건","q":"산업안전보건법령상 다음 상황에서 실시하는 건강진단은?\n\n같은 부서에서 같은 유해 인자에 노출되는 근로자 여러 명에게 비슷한 증상이 나타나, 지방고용노동관서의 장이 중독 여부와 원인을 확인하도록 사업주에게 건강진단 실시를 명령하였다.","opts":["임시건강진단","수시건강진단","특수건강진단","배치전건강진단"],"ans":0,"exp":"임시건강진단은 같은 유해 인자에 노출되는 근로자들에게 비슷한 질병의 증상이 나타나는 등의 경우에 중독 여부와 질병의 원인을 확인하려고 지방고용노동관서의 장의 명령으로 실시한다. 수시건강진단은 개별 근로자가 직업성 천식이나 피부염 등의 증상을 보일 때 사업주가 실시하고, 특수건강진단은 유해 인자 노출 근로자에게 정해진 주기로 실시한다."},
{"id":"c155","subj":"지역사회간호","unit":"산업보건","q":"어느 사업장의 1년간 자료가 다음과 같다. 도수율은?\n\n평균 근로자 수: 800명\n연 근로시간 수: 1,600,000시간\n재해 건수: 8건\n근로 손실 일수: 320일","opts":["0.2","5","10","40"],"ans":1,"exp":"도수율 = 재해 건수 ÷ 연 근로시간 수 × 1,000,000 이다. 8 ÷ 1,600,000 × 1,000,000 = 5. 0.2는 강도율(320 ÷ 1,600,000 × 1,000), 10은 건수율(8 ÷ 800 × 1,000), 40은 재해 한 건당 평균 손실 일수(320 ÷ 8)이다."},
{"id":"c156","subj":"지역사회간호","unit":"산업보건","q":"어느 사업장의 1년간 자료가 다음과 같다. 건수율(발생률)은?\n\n평균 근로자 수: 2,500명\n연 근로시간 수: 5,000,000시간\n재해 건수: 20건\n근로 손실 일수: 1,000일","opts":["0.2","4","8","50"],"ans":2,"exp":"건수율 = 재해 건수 ÷ 평균 근로자 수 × 1,000 이다. 20 ÷ 2,500 × 1,000 = 8. 근로시간을 고려하지 않는 것이 단점이다. 4는 도수율(20 ÷ 5,000,000 × 1,000,000), 0.2는 강도율(1,000 ÷ 5,000,000 × 1,000), 50은 평균 손실 일수(1,000 ÷ 20)이다."},
{"id":"c157","subj":"지역사회간호","unit":"환경보건","q":"정수 과정의 급속여과법에 대한 설명으로 옳은 것은?","opts":["약품 침전을 거치며, 막힌 여과층은 역류 세척으로 씻는다","보통 침전을 거치며, 여과층 표면의 모래를 걷어 내어 씻는다","여과 속도가 하루 3~5m로 느려 넓은 터가 필요하다","탁도와 색도가 높은 물을 처리하기에는 알맞지 않다"],"ans":0,"exp":"급속여과법은 응집제를 넣는 약품 침전 뒤에 빠른 속도로 여과하고, 여과층이 막히면 물을 거꾸로 흘려 씻는다(역류 세척). 탁도와 색도가 높은 물에 알맞고 좁은 터에서도 할 수 있다. 보통 침전, 모래 걷어 내기(사면 대치), 하루 3~5m의 느린 여과 속도는 완속여과법의 특징이다."},
{"id":"c158","subj":"지역사회간호","unit":"환경보건","q":"암모니아성 질소가 들어 있는 물에 염소를 계속 넣으면 잔류염소가 늘다가 줄어 가장 낮아지는 점이 나타나고, 그 뒤부터는 유리잔류염소가 늘어난다. 이 점을 넘도록 염소를 넣어 소독하는 방법은?","opts":["전염소 처리","불연속점 염소 처리","클로라민 소독","오존 소독"],"ans":1,"exp":"염소가 암모니아와 결합하여 생긴 결합잔류염소(클로라민)가 분해되어 잔류염소가 가장 낮아지는 점이 불연속점(파괴점)이다. 이 점을 넘겨 염소를 넣으면 살균력이 강한 유리잔류염소가 남는다. 전염소 처리는 침전 전에 염소를 넣는 것이다."},
{"id":"c159","subj":"지역사회간호","unit":"환경보건","q":"런던형 스모그와 비교한 로스앤젤레스형 스모그의 특징으로 옳은 것은?","opts":["석탄을 태울 때 나오는 아황산가스와 매연이 주된 원인이다","기온이 낮은 겨울철 새벽에 주로 발생한다","지표면이 식어 생기는 복사성 역전과 관련이 깊다","자동차 배기가스가 햇빛을 받아 광화학 반응을 일으켜 생긴다"],"ans":3,"exp":"로스앤젤레스형 스모그는 자동차 배기가스의 질소산화물과 탄화수소가 강한 햇빛을 받아 생긴 오존 등 광화학 산화물이 원인이며, 여름철 낮에 침강성 역전과 함께 나타나 눈과 점막을 자극한다. 석탄 연소, 겨울철 새벽, 복사성 역전은 런던형 스모그의 특징이다."},
{"id":"c160","subj":"지역사회간호","unit":"환경보건","q":"2015년 제21차 유엔기후변화협약 당사국총회에서 채택되어, 선진국뿐 아니라 모든 당사국이 온실가스 감축 목표를 스스로 정해 이행하도록 한 국제 협약은?","opts":["교토 의정서","몬트리올 의정서","스톡홀름 협약","파리 협정"],"ans":3,"exp":"파리 협정은 지구 평균 기온 상승을 산업화 이전보다 2℃보다 훨씬 낮게, 나아가 1.5℃ 이내로 억제하는 것을 목표로 모든 당사국이 참여하는 체제이다. 1997년의 교토 의정서는 선진국에만 감축 의무를 지웠다. 몬트리올 의정서는 오존층 파괴 물질을, 스톡홀름 협약은 잔류성 유기 오염 물질을 규제한다."},
{"id":"c161","subj":"지역사회간호","unit":"환경보건","q":"세균이 음식물 안에서 증식하면서 만들어 낸 독소를 먹어서 생기는 독소형 식중독만 묶은 것은?","opts":["살모넬라 식중독, 장염비브리오 식중독","황색포도알균 식중독, 살모넬라 식중독","보툴리누스 식중독, 장염비브리오 식중독","황색포도알균 식중독, 보툴리누스 식중독"],"ans":3,"exp":"황색포도알균 식중독은 장독소, 보툴리누스 식중독은 신경독소가 원인인 독소형 식중독이다. 살모넬라 식중독과 장염비브리오 식중독은 음식과 함께 먹은 균이 장 안에서 증식하여 생기는 감염형 식중독으로, 잠복기가 더 길고 열이 나는 일이 많다."},
{"id":"c162","subj":"지역사회간호","unit":"환경보건","q":"먹는 물의 수질 검사에서 대장균군을 오염 지표로 쓰는 주된 이유는?","opts":["대장균군 자체가 사람에게 치명적인 질병을 일으킨다","분변 오염과 병원성 미생물이 있을 가능성을 알려 준다","물속에 녹아 있는 유기물의 양을 직접 나타낸다","물이 중금속에 오염된 정도를 알려 준다"],"ans":1,"exp":"대장균군은 사람과 동물의 장 안에 살므로 물에서 검출되면 분변에 오염되었고 수인성 병원균이 함께 있을 수 있음을 뜻한다. 검출 방법이 간편하고 정확한 것도 지표로 쓰는 이유이다. 대장균군 자체의 병원성 때문에 쓰는 것이 아니며, 유기물 오염은 BOD와 COD로 본다."},
{"id":"c163","subj":"지역사회간호","unit":"환경보건","q":"햇볕이 내리쬐는 옥외 작업장에서 잰 온도가 다음과 같다. 습구흑구온도지수(WBGT)는? (단, 옥외 WBGT = 0.7 × 자연습구온도 + 0.2 × 흑구온도 + 0.1 × 건구온도)\n\n자연습구온도: 20℃\n흑구온도: 40℃\n건구온도: 30℃","opts":["24℃","25℃","26℃","30℃"],"ans":1,"exp":"0.7 × 20 + 0.2 × 40 + 0.1 × 30 = 14 + 8 + 3 = 25℃이다. 습구흑구온도지수는 기온, 기습, 복사열을 함께 반영하여 고온 작업장의 노출 기준과 작업·휴식 시간 배분을 정하는 데 쓴다. 30℃는 세 온도를 단순히 평균한 값이다."},
{"id":"c164","subj":"지역사회간호","unit":"환경보건","q":"교토 의정서에서 감축 대상으로 정한 6대 온실가스에 해당하지 않는 것은?","opts":["이산화탄소","메탄","아황산가스","아산화질소"],"ans":2,"exp":"교토 의정서의 6대 온실가스는 이산화탄소, 메탄, 아산화질소, 수소불화탄소, 과불화탄소, 육불화황이다. 아황산가스는 석탄과 석유를 태울 때 나오는 대기오염 물질로 산성비의 원인이지만 온실가스는 아니다."},
{"id":"c165","subj":"지역사회간호","unit":"인구","q":"출생률이 사망률보다 낮아 인구가 줄어드는 유형으로, 0~14세 인구가 50세 이상 인구의 2배에 못 미치는 인구 구조는?","opts":["피라미드형","종형","항아리형","별형"],"ans":2,"exp":"항아리형(방추형)은 출생률이 사망률보다 낮은 인구 감소형으로 0~14세 인구가 50세 이상 인구의 2배에 못 미친다. 피라미드형은 다산다사의 인구 증가형으로 0~14세 인구가 50세 이상 인구의 2배를 넘고, 종형은 2배와 같은 인구 정지형이다. 별형은 생산연령 인구가 들어오는 도시형이다."},
{"id":"c166","subj":"지역사회간호","unit":"인구","q":"어느 지역의 인구가 다음과 같다. 노년부양비는?\n\n0~14세: 150명\n15~64세: 600명\n65세 이상: 90명","opts":["15","25","40","60"],"ans":0,"exp":"노년부양비 = 65세 이상 인구 ÷ 15~64세 인구 × 100 이다. 90 ÷ 600 × 100 = 15. 25는 유년부양비(150 ÷ 600 × 100), 40은 총부양비((150 + 90) ÷ 600 × 100), 60은 노령화지수(90 ÷ 150 × 100)이다."},
{"id":"c167","subj":"지역사회간호","unit":"인구","q":"어느 지역에서 한 해 동안 남아 525명, 여아 500명이 태어났다. 이 출생 성비의 종류와 값으로 옳은 것은?","opts":["1차 성비, 105","2차 성비, 약 95","2차 성비, 105","3차 성비, 105"],"ans":2,"exp":"성비는 여자 100명에 대한 남자의 수이다. 525 ÷ 500 × 100 = 105. 출생 때의 성비는 2차 성비이고, 1차 성비는 태아의 성비, 3차 성비는 현재 인구의 성비이다. 약 95는 남아를 분모에 놓아 거꾸로 계산한 값이다."},
{"id":"c168","subj":"지역사회간호","unit":"인구","q":"연앙인구가 100,000명인 지역의 한 해 자료가 다음과 같다. 자연증가율은?\n\n출생: 800명\n사망: 600명\n전입: 1,000명\n전출: 700명","opts":["인구 1,000명당 2명","인구 1,000명당 3명","인구 1,000명당 5명","인구 1,000명당 8명"],"ans":0,"exp":"자연증가는 출생에서 사망을 뺀 것이다. (800 − 600) ÷ 100,000 × 1,000 = 인구 1,000명당 2명. 전입에서 전출을 뺀 사회증가는 1,000명당 3명이고, 자연증가와 사회증가를 더한 인구증가율은 1,000명당 5명이다. 8명은 조출생률이다."},
{"id":"c169","subj":"지역사회간호","unit":"모자보건","q":"A 지역의 한 해 자료가 다음과 같다. 영아사망률은?\n\n출생아 수: 4,000명\n생후 28일 미만에 사망한 아기 수: 8명\n생후 28일부터 1년 미만 사이에 사망한 아기 수: 4명","opts":["출생아 1,000명당 1명","출생아 1,000명당 2명","출생아 1,000명당 3명","출생아 1,000명당 12명"],"ans":2,"exp":"영아사망률 = 생후 1년 미만 사망아 수 ÷ 출생아 수 × 1,000 이다. 영아 사망은 신생아 사망(28일 미만)과 그 뒤의 사망을 모두 더하므로 (8 + 4) ÷ 4,000 × 1,000 = 3 이다. 신생아사망률은 8 ÷ 4,000 × 1,000 = 2, 신생아 후기 사망률은 1 이다."},
{"id":"c170","subj":"지역사회간호","unit":"모자보건","q":"A 국가의 한 해 자료가 다음과 같다. 모성사망비는?\n\n15~49세 여성 인구: 5,000,000명\n출생아 수: 200,000명\n임신·분만·산욕과 관련된 합병증으로 사망한 여성 수: 20명","opts":["출생아 10만 명당 0.4명","출생아 10만 명당 10명","출생아 10만 명당 40명","출생아 10만 명당 100명"],"ans":1,"exp":"모성사망비 = 모성 사망자 수 ÷ 출생아 수 × 100,000 이다. 20 ÷ 200,000 × 100,000 = 10. 분모를 15~49세 여성 인구로 하면 모성사망률이 되며 20 ÷ 5,000,000 × 100,000 = 가임기 여성 10만 명당 0.4명이다."},
{"id":"c171","subj":"지역사회간호","unit":"모자보건","q":"어느 지역의 알파 인덱스(α-index)가 1.0에 가까워졌다. 이에 대한 해석으로 옳은 것은?","opts":["신생아기 이후의 영아 사망이 많아 환경 개선이 시급하다","영아 사망의 대부분이 신생아기에 일어나며 보건 수준이 높다","영아 사망자 수가 출생아 수와 비슷해졌다","신생아 사망은 거의 없고 영아 사망의 대부분이 감염 때문이다"],"ans":1,"exp":"알파 인덱스는 영아 사망자 수를 신생아 사망자 수로 나눈 값이다. 1.0에 가깝다는 것은 영아 사망의 거의 전부가 선천적 원인이 많은 신생아기에 일어나고, 감염이나 영양 같은 환경 요인으로 인한 신생아기 이후 사망은 적다는 뜻이므로 보건 수준이 높다고 본다. 값이 클수록 신생아기 이후 사망이 많다."},
{"id":"c172","subj":"지역사회간호","unit":"모자보건","q":"연앙인구가 100,000명인 지역의 한 해 자료가 다음과 같다. 일반출산율은?\n\n15~49세 여성 인구: 20,000명\n출생아 수: 600명","opts":["1,000명당 6명","1,000명당 30명","1,000명당 60명","1,000명당 300명"],"ans":1,"exp":"일반출산율 = 출생아 수 ÷ 15~49세 여성 인구 × 1,000 이다. 600 ÷ 20,000 × 1,000 = 30. 분모를 연앙인구로 하면 조출생률이 되며 600 ÷ 100,000 × 1,000 = 6 이다. 일반출산율은 실제로 아이를 낳을 수 있는 인구를 분모로 하므로 조출생률보다 출산 수준을 더 정확하게 나타낸다."},
{"id":"c173","subj":"지역사회간호","unit":"노인장기요양보험","q":"노인장기요양보험에서 감경이나 면제를 받지 않는 일반 수급자가 내는 본인부담금의 비율은?","opts":["재가급여 20%, 시설급여 15%","재가급여 10%, 시설급여 20%","재가급여 20%, 시설급여 30%","재가급여 15%, 시설급여 20%"],"ans":3,"exp":"일반 수급자는 장기요양급여비용 가운데 재가급여는 15%, 시설급여는 20%를 본인이 부담한다. 「국민기초생활 보장법」에 따른 의료급여 수급자는 본인부담금이 없고, 그 밖의 의료급여 수급권자와 소득·재산이 일정 기준 이하인 사람은 본인부담금을 감경받는다."},
{"id":"c174","subj":"지역사회간호","unit":"노인장기요양보험","q":"「노인장기요양보험법」상 다음 수급자에게 지급할 수 있는 급여는?\n\n장기요양기관이 현저히 부족한 섬 지역에 살아 방문요양 서비스를 이용할 수 없어, 함께 사는 딸에게서 방문요양에 해당하는 수발을 받고 있다.","opts":["방문간호","주·야간보호","가족요양비","단기보호"],"ans":2,"exp":"가족요양비는 장기요양기관이 현저히 부족한 도서·벽지에 살거나, 천재지변, 신체·정신·성격상의 사유로 가족 등에게서 방문요양에 상당하는 급여를 받아야 하는 수급자에게 지급하는 특별현금급여이다. 방문간호, 주·야간보호, 단기보호는 장기요양기관이 제공하는 재가급여이다."},
{"id":"c175","subj":"지역사회간호","unit":"노인보건","q":"다음 사례에 해당하는 노인 학대의 유형은?\n\n함께 사는 아들이 거동이 불편한 80세 어머니에게 며칠씩 식사를 챙겨 주지 않고, 처방받은 약도 먹이지 않은 채 방에 혼자 두었다.","opts":["신체적 학대","정서적 학대","방임","경제적 학대"],"ans":2,"exp":"방임은 부양 의무자가 식사, 투약, 위생 같은 기본적인 보호와 돌봄을 제공하지 않는 것이다. 신체적 학대는 때리거나 묶는 등 신체에 해를 입히는 것, 정서적 학대는 모욕과 위협으로 정신적 고통을 주는 것, 경제적 학대는 노인의 재산이나 돈을 동의 없이 쓰거나 빼앗는 것이다."},
{"id":"c176","subj":"지역사회간호","unit":"사례관리","q":"사례관리의 과정을 순서대로 나열한 것은?","opts":["사정 → 대상자 선정 → 계획 → 점검 → 수행 → 평가","대상자 선정 → 계획 → 사정 → 수행 → 평가 → 점검","대상자 선정 → 사정 → 계획 → 수행 → 점검 → 평가","계획 → 대상자 선정 → 사정 → 수행 → 점검 → 평가"],"ans":2,"exp":"사례관리는 대상자를 찾아 선정하고 등록한 뒤, 요구를 사정하고, 목표와 서비스 계획을 세우고, 서비스를 연계·조정하여 수행하고, 서비스가 제대로 제공되는지 점검한 다음, 평가하고 종결하는 순서로 진행한다. 사정이 계획보다 앞서고, 점검은 수행 뒤에 온다."},
{"id":"c177","subj":"지역사회간호","unit":"방문건강관리","q":"가정방문의 원칙으로 옳지 않은 것은?","opts":["방문 전에 대상자의 기록을 살펴 방문 목적을 분명히 한다","간호사의 신분과 방문 목적을 대상자에게 밝힌다","있는 그대로를 보려고 미리 알리지 않고 방문한다","방문하면서 알게 된 대상자의 비밀을 지킌다"],"ans":2,"exp":"가정방문은 대상자와 미리 날짜와 시간을 약속하고 하는 것이 원칙이다. 약속 없이 방문하면 대상자를 만나지 못하거나 신뢰 관계를 해칠 수 있다. 방문 전에 기록을 검토하여 목적을 분명히 하고, 신분과 목적을 밝히며, 비밀을 지키는 것은 모두 지켜야 할 원칙이다."},
{"id":"c178","subj":"지역사회간호","unit":"지역사회 간호수단","q":"방문 형태의 간호 사업과 그 법적 근거를 바르게 짝지은 것은?","opts":["장기요양 방문간호 – 「노인장기요양보험법」","보건소 방문건강관리 – 「의료법」","의료기관 가정간호 – 「지역보건법」","보건소 방문건강관리 – 「노인복지법」"],"ans":0,"exp":"장기요양 방문간호는 「노인장기요양보험법」의 재가급여로, 간호사 등이 의사·한의사·치과의사의 방문간호지시서에 따라 수급자의 가정을 방문한다. 보건소 방문건강관리의 근거는 「지역보건법」이고, 의료기관 가정간호의 근거는 「의료법」이다."},
{"id":"c179","subj":"지역사회간호","unit":"재난간호","q":"다수 사상자가 발생한 재난 현장에서 다음 환자에게 붙일 중증도 분류표의 색은?\n\n넓적다리뼈가 부러져 걷지 못하지만 의식이 또렷하다. 호흡은 분당 20회이고 요골 맥박이 잘 만져지며, 지시에 따라 손을 쥐었다 편다.","opts":["적색","황색","녹색","흑색"],"ans":1,"exp":"걷지 못하지만 호흡이 분당 30회 미만이고 요골 맥박이 만져지며 지시를 따르므로, 치료가 몇 시간 늦어져도 생명에 지장이 없는 지연 환자(황색)이다. 적색은 즉시 처치해야 하는 긴급 환자, 녹색은 걸을 수 있는 경상 환자, 흑색은 사망하였거나 생존 가능성이 없는 환자이다."},
{"id":"c180","subj":"지역사회간호","unit":"재난간호","q":"재난 관리 단계 중 대응 단계의 활동에 해당하는 것은?","opts":["위험 지도를 만들고 건축물의 내진 기준을 강화한다","현장에서 사상자를 중증도에 따라 분류하고 이송한다","비상 연락망을 정비하고 모의 훈련을 한다","이재민의 외상 후 스트레스를 장기적으로 관리한다"],"ans":1,"exp":"대응 단계는 재난이 일어난 직후 인명을 구조하고 피해를 줄이는 단계로, 중증도 분류와 응급 처치, 이송, 대피소 운영이 이루어진다. 위험 지도 작성과 내진 기준 강화는 예방·완화 단계, 연락망 정비와 훈련은 대비 단계, 이재민의 장기적인 심리 지원은 복구 단계의 활동이다."},
{"id":"c181","subj":"지역사회간호","unit":"국제보건","q":"세계보건기구(WHO)의 6개 지역사무소 가운데 우리나라가 속한 곳은?","opts":["동남아시아 지역사무소","동지중해 지역사무소","유럽 지역사무소","서태평양 지역사무소"],"ans":3,"exp":"우리나라는 필리핀 마닐라에 본부를 둔 서태평양 지역사무소에 속한다. 북한은 인도 뉴델리에 본부를 둔 동남아시아 지역사무소에 속한다. 세계보건기구에는 이 밖에 아프리카, 아메리카, 유럽, 동지중해 지역사무소가 있다."},
{"id":"c182","subj":"지역사회간호","unit":"국제보건","q":"「국제보건규칙(IHR)」에 따라 국제공중보건위기상황(PHEIC)을 선포하는 주체는?","opts":["유엔 사무총장","세계보건총회 의장","유엔 안전보장이사회","세계보건기구 사무총장"],"ans":3,"exp":"국제공중보건위기상황은 질병이 국제적으로 퍼져 다른 나라의 공중보건에 위험이 되고 국제적으로 공동 대응이 필요할 때, 세계보건기구 사무총장이 긴급위원회의 자문을 받아 선포한다. 유엔 사무총장이나 안전보장이사회의 권한이 아니다."},
{"id":"c183","subj":"지역사회간호","unit":"간호 이론","q":"뉴만(Neuman)의 건강관리체계이론에 따를 때 다음 간호 활동이 해당하는 예방 수준은?\n\n스트레스원이 정상방어선을 뚫고 들어와 증상이 나타난 대상자를 일찍 발견하여 치료하고, 저항선을 강화하여 기본 구조를 보호한다.","opts":["일차 예방","이차 예방","삼차 예방","재구성"],"ans":1,"exp":"이차 예방은 스트레스원이 정상방어선을 침범하여 반응(증상)이 나타났을 때 조기 발견과 치료로 저항선을 강화하는 것이다. 일차 예방은 스트레스원을 없애거나 유연방어선을 강화하여 침범을 막는 것이고, 삼차 예방은 치료 뒤 재적응과 재발 방지를 돕는 것이다. 재구성은 예방 수준이 아니라 체계가 안정을 되찾는 과정이다."},
{"id":"c184","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 사례에서 지역사회 간호사가 수행한 역할은?\n\n혼자 사는 노인에게 보건소, 복지관, 주민센터가 저마다 서비스를 제공하고 있었다. 간호사는 관계자 회의를 열어 겹치는 서비스는 정리하고 빠진 서비스는 채워, 필요한 서비스가 알맞은 순서로 제공되게 하였다.","opts":["조정자","교육자","연구자","직접 간호 제공자"],"ans":0,"exp":"조정자는 여러 기관과 인력이 제공하는 서비스가 겹치거나 빠지지 않도록 조직하고 조절하여 대상자에게 가장 알맞은 서비스가 제공되게 한다. 교육자는 건강 정보를 가르치는 역할, 직접 간호 제공자는 간호 문제를 사정하고 직접 간호를 수행하는 역할이다."},
{"id":"c185","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 사례에서 지역사회 간호사가 수행한 역할은?\n\n마을 주민들이 짜게 먹는 식습관을 스스로 바꾸려는 동기를 갖도록 돕고, 주민들이 스스로 결정을 내려 저염식 실천 모임을 꾸리고 이어 가도록 이끌었다.","opts":["대변자(옹호자)","의뢰자(알선자)","변화촉진자","연구자"],"ans":2,"exp":"변화촉진자는 대상자가 건강에 이로운 방향으로 바뀌려는 동기를 갖게 하고, 의사결정을 도와 변화를 일으키고 유지하게 하는 역할이다. 대변자는 대상자의 처지를 대신 말하고 권리를 찾도록 돕는 역할, 의뢰자는 필요한 기관이나 자원에 연결해 주는 역할이다."},
{"id":"c186","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정에서 쓰는 자료 가운데 이차 자료(기존 자료)에 해당하는 것은?","opts":["통계청의 사망 원인 통계","주민 대표와 면담한 내용","간호사가 지역을 돌아보며 관찰한 기록","주민에게 직접 받은 설문 응답"],"ans":0,"exp":"이차 자료는 다른 목적으로 이미 만들어져 있는 자료로, 인구 통계와 생정 통계, 공공 기관의 보고서, 의료 기관의 기록, 연구 논문 등이다. 면담, 지역 시찰, 설문 조사로 간호사가 직접 모은 자료는 일차 자료이다."},
{"id":"c187","subj":"지역사회간호","unit":"간호과정","q":"브라이언트(Bryant)가 제시한 보건 문제의 우선순위 결정 기준에 해당하지 않는 것은?","opts":["문제의 크기","사업의 적법성","문제의 심각도","주민의 관심도"],"ans":1,"exp":"브라이언트의 기준은 문제의 크기, 문제의 심각도, 사업의 기술적 해결 가능성, 주민의 관심도의 네 가지이다. 적법성은 BPRS로 순위를 정한 뒤 사업의 실행 가능성을 판단하는 PEARL의 항목이다."},
{"id":"c188","subj":"지역사회간호","unit":"간호과정","q":"두 보건소가 한 금연 사업의 결과가 다음과 같다. 이 비교가 해당하는 평가 범주는?\n\nA 보건소: 사업비 1,000만 원, 6개월 금연 성공자 50명\nB 보건소: 사업비 1,000만 원, 6개월 금연 성공자 25명\n금연 성공자 한 명당 들어간 비용을 구하여 두 사업을 비교하였다.","opts":["사업의 효율성 평가","사업의 적합성 평가","투입된 노력에 대한 평가","사업 진행에 대한 평가"],"ans":0,"exp":"효율성 평가는 투입한 비용과 인력에 견주어 얼마나 많은 성과를 냈는지, 곧 단위 성과당 비용을 본다. 성공자 한 명당 비용은 A 보건소 20만 원(1,000만 ÷ 50), B 보건소 40만 원(1,000만 ÷ 25)으로 A가 더 효율적이다. 투입된 노력에 대한 평가는 들인 자원의 양만 보고, 진행에 대한 평가는 일정대로 되었는지를 본다."},
{"id":"c189","subj":"지역사회간호","unit":"간호과정","q":"체계 모형에 따라 보건사업 평가를 구조 평가, 과정 평가, 결과 평가로 나눌 때 구조 평가에 해당하는 것은?","opts":["사업이 계획한 일정대로 진행되고 있는지 본다","대상자의 참여율과 프로그램 만족도를 본다","인력, 예산, 시설을 알맞게 확보하였는지 본다","사업 뒤 대상자의 혈압 조절률이 높아졌는지 본다"],"ans":2,"exp":"구조 평가는 사업에 투입되는 인력, 예산, 시설, 장비, 정보 같은 자원이 적절한지를 본다. 일정의 진행과 참여율, 만족도를 보는 것은 사업이 어떻게 수행되는지를 보는 과정 평가이고, 건강 수준의 변화처럼 목표를 이루었는지를 보는 것은 결과 평가이다."},
{"id":"c190","subj":"지역사회간호","unit":"보건의료체계","q":"진료비 지불제도 중 다음 특징을 가진 것은?\n\n환자가 받은 서비스의 양과 관계없이 질병군마다 미리 정해 놓은 금액을 지급한다.\n과잉 진료가 줄고 진료비 청구가 간편해지지만, 서비스를 줄여 의료의 질이 떨어질 우려가 있다.","opts":["포괄수가제","행위별수가제","봉급제","총액계약제"],"ans":0,"exp":"포괄수가제는 진단명 기준 질병군(DRG)별로 정해진 진료비를 지급하므로 의료기관이 스스로 비용을 줄이려 하고 행정이 간편하다. 행위별수가제는 서비스 항목마다 값을 매겨 과잉 진료를 부르기 쉽다. 총액계약제는 보험자와 의사 단체가 한 해의 진료비 총액을 미리 계약한다."},
{"id":"c191","subj":"지역사회간호","unit":"보건의료체계","q":"클레츠코프스키(Kleczkowski) 등이 제시한 국가보건의료체계의 구성 요소 중 다음에 해당하는 것은?\n\n의사와 간호사 같은 인력을 양성하고, 병원과 보건소 같은 시설, 장비와 물자, 보건의료 지식과 기술을 마련한다.","opts":["보건의료 자원의 개발","자원의 조직적 배치","보건의료서비스의 제공","경제적 지원"],"ans":0,"exp":"국가보건의료체계의 다섯 구성 요소는 자원의 개발, 자원의 조직적 배치, 보건의료서비스의 제공, 경제적 지원, 관리이다. 인력, 시설, 장비와 물자, 지식과 기술을 마련하는 것은 자원의 개발이다. 자원의 조직적 배치는 마련한 자원을 정부 기관, 건강보험 조직, 민간 부문 등으로 조직하는 것이다."},
{"id":"c192","subj":"지역사회간호","unit":"보건의료체계","q":"의료 이용자의 본인 일부 부담 방식 중, 의료비가 일정 금액에 이를 때까지는 이용자가 전액을 내고 그 금액을 넘는 부분만 보험에서 급여하는 것은?","opts":["정률 부담제","정액 부담제","급여 상한제","일정액 공제제"],"ans":3,"exp":"일정액 공제제는 정해진 금액까지는 본인이 모두 부담하게 하여 가벼운 질환으로 의료를 지나치게 이용하는 것을 줄인다. 정률 부담제는 의료비의 일정 비율을, 정액 부담제는 이용할 때마다 일정 금액을 본인이 내는 것이다. 급여 상한제는 보험이 일정 금액까지만 급여하고 넘는 부분을 본인이 내는 것이다."},
{"id":"c193","subj":"지역사회간호","unit":"사회보장","q":"사회보험과 비교한 공공부조의 특징으로 옳은 것은?","opts":["가입자가 낸 보험료를 주된 재원으로 한다","기여한 사람에게 급여를 받을 권리가 생긴다","법에서 정한 사람은 모두 강제로 가입한다","자산 조사를 거쳐 생활이 어려운 사람을 대상으로 한다"],"ans":3,"exp":"공공부조는 조세를 재원으로 하여, 자산 조사로 확인한 생활이 어려운 사람에게 최저 생활을 보장하는 제도이다. 보험료를 재원으로 하고, 기여에 따라 수급권이 생기며, 강제 가입을 원칙으로 하는 것은 사회보험의 특징이다."},
{"id":"c194","subj":"지역사회간호","unit":"사회보장","q":"산업재해보상보험에 대한 설명으로 옳은 것은?","opts":["보험료는 원칙적으로 사업주가 전액 부담한다","근로자에게 과실이 있으면 보상하지 않는다","업무와 관계없는 질병도 보상 대상에 넣는다","국민건강보험공단이 보험 사업을 맡아 한다"],"ans":0,"exp":"산업재해보상보험은 사업주의 보상 책임을 보험으로 만든 것이어서 보험료를 원칙적으로 사업주가 모두 부담하고, 근로자의 과실 여부와 관계없이 보상하는 무과실 책임주의를 따른다. 업무상 재해만 보상하며, 보험 사업은 고용노동부장관의 위탁을 받아 근로복지공단이 한다."},
{"id":"c195","subj":"지역사회간호","unit":"보건행정","q":"「지역보건법」상 보건소 가운데 「의료법」에 따른 병원의 요건을 갖춘 보건소가 쓸 수 있는 명칭은?","opts":["보건지소","건강생활지원센터","보건진료소","보건의료원"],"ans":3,"exp":"보건소 중 「의료법」에 따른 병원의 요건을 갖춘 보건소는 보건의료원이라는 명칭을 쓸 수 있다. 보건지소는 보건소의 업무를 돕기 위해 읍·면에 두는 기관이고, 건강생활지원센터는 만성질환 예방과 건강한 생활 습관 형성을 지원하는 기관이다. 보건진료소는 「농어촌 등 보건의료를 위한 특별조치법」에 따른 시설이다."},
{"id":"c196","subj":"지역사회간호","unit":"보건행정","q":"보건기관과 그 설치 근거 법률을 바르게 짝지은 것은?","opts":["보건진료소 – 「농어촌 등 보건의료를 위한 특별조치법」","보건지소 – 「농어촌 등 보건의료를 위한 특별조치법」","건강생활지원센터 – 「국민건강증진법」","보건진료소 – 「지역보건법」"],"ans":0,"exp":"보건진료소는 의사가 없는 의료 취약 지역에서 보건진료 전담공무원이 일차 진료를 하도록 「농어촌 등 보건의료를 위한 특별조치법」에 따라 설치한다. 보건소, 보건의료원, 보건지소, 건강생활지원센터는 모두 「지역보건법」에 따른 지역보건의료기관이다."},
{"id":"c197","subj":"지역사회간호","unit":"일차보건의료","q":"일차보건의료의 접근 원칙 중 다음 사례에 가장 잘 나타난 것은?\n\n보건진료소 운영협의회에 주민 대표가 참여하여 마을의 건강 문제를 함께 정하고, 주민이 마을건강원으로 활동하며 사업을 함께 꾸려 간다.","opts":["지리적 접근성","지불 부담 능력","주민 참여","수용 가능성"],"ans":2,"exp":"일차보건의료는 주민이 사업의 계획과 수행, 평가에 적극 참여할 때 성공할 수 있다. 지리적 접근성은 거리와 교통 면에서 쉽게 이용할 수 있는 것, 지불 부담 능력은 주민이 낼 수 있는 수준의 비용으로 제공하는 것, 수용 가능성은 주민이 받아들일 수 있는 방법으로 제공하는 것이다."},
{"id":"c198","subj":"지역사회간호","unit":"건강증진","q":"오타와 헌장이 제시한 건강증진의 3대 기본 전략 중 다음에 해당하는 것은?\n\n건강의 중요성을 널리 알리고, 건강에 이로운 정책이 만들어지도록 정책 결정자와 대중의 관심과 지지를 이끌어 낸다.","opts":["옹호","역량 강화","연합","규제"],"ans":0,"exp":"오타와 헌장의 3대 기본 전략은 옹호(advocate), 역량 강화(enable), 연합(mediate)이다. 옹호는 건강에 대한 관심을 불러일으키고 건강한 정책을 채택하도록 촉구하는 것이다. 역량 강화는 사람들이 자신의 건강을 스스로 관리할 수 있게 하는 것, 연합은 여러 분야가 서로 협력하도록 조정하는 것이다."},
{"id":"c199","subj":"지역사회간호","unit":"건강증진","q":"2005년 제6차 건강증진 국제회의에서 채택되어, 세계화 시대의 건강 결정 요인에 대처하는 전략으로 옹호, 투자, 역량 함양, 규제와 입법, 파트너십 구축을 제시한 것은?","opts":["방콕 헌장","오타와 헌장","애들레이드 권고","자카르타 선언"],"ans":0,"exp":"방콕 헌장은 2005년 태국 방콕에서 열린 제6차 회의에서 채택되었다. 오타와 헌장은 1986년 제1차 회의에서 건강증진의 개념과 5대 활동 영역을 제시하였고, 애들레이드 권고(제2차)는 건강한 공공정책을, 자카르타 선언(제4차)은 건강을 위한 파트너십과 민간 부문의 참여를 강조하였다."},
{"id":"c200","subj":"지역사회간호","unit":"다문화 간호","q":"캄핀하-바코트(Campinha-Bacote)의 문화적 역량 모형에서 다음 사례에 해당하는 구성 요소는?\n\n다문화 가정을 방문하기 전에 간호사가 다른 문화에 대해 자신이 지닌 편견과 선입견이 없는지 스스로 돌아보았다.","opts":["문화적 인식","문화적 지식","문화적 기술","문화적 만남"],"ans":0,"exp":"문화적 인식은 자신의 문화적 배경과 다른 문화에 대한 편견을 스스로 살피고 깨닫는 것이다. 문화적 지식은 다른 문화의 건강 신념과 관습을 배우는 것, 문화적 기술은 문화적 자료를 수집하고 사정하는 능력, 문화적 만남은 다른 문화권의 대상자와 직접 만나 교류하는 것이다."},
{"id":"k01","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["__오랫만에__ 친구를 만났다.","__며칠__ 동안 푹 쉬었다.","저녁 먹고 __설겆이__를 했다.","__일찌기__ 길을 떠났다."],"ans":1,"exp":"\"며칠\"이 옳은 표기이다. \"몇 일\"로 적지 않는다. 나머지는 \"오랜만에\", \"설거지\", \"일찍이\"로 적어야 한다."},
{"id":"k02","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["먹을만큼 먹었다.","떠난 지 오래다.","나 만큼 해 봐라.","집에서 부터 걸었다."],"ans":1,"exp":"시간의 경과를 나타내는 \"지\"는 의존 명사이므로 \"떠난 지\"로 띄어 쓴다. 관형어 뒤의 \"만큼\"은 의존 명사라 \"먹을 만큼\"으로 띄어 쓰고, 체언 뒤의 \"만큼\"은 조사라 \"나만큼\"으로 붙여 쓴다. 조사는 겹쳐도 붙여 쓰므로 \"집에서부터\"가 옳다."},
{"id":"k03","subj":"국어","unit":"표준 발음","q":"\"밟다\"의 표준 발음은?","opts":["[발따]","[밥따]","[발다]","[밥다]"],"ans":1,"exp":"겹받침 ㄼ은 보통 [ㄹ]로 발음하지만(여덟[여덜], 넓다[널따]), \"밟-\"은 자음 앞에서 예외적으로 [밥]으로 발음한다. 따라서 밟다[밥따], 밟고[밥꼬], 밟지[밥찌]이다."},
{"id":"k04","subj":"국어","unit":"한자성어","q":"속담 \"쇠귀에 경 읽기\"와 뜻이 통하는 한자성어는?","opts":["우이독경(牛耳讀經)","새옹지마(塞翁之馬)","조삼모사(朝三暮四)","각주구검(刻舟求劍)"],"ans":0,"exp":"우이독경은 아무리 가르치고 일러 주어도 알아듣지 못함을 뜻한다. 새옹지마는 인생의 길흉화복은 예측하기 어렵다는 뜻, 조삼모사는 간사한 꾀로 남을 속임, 각주구검은 융통성 없이 낡은 생각을 고집함을 뜻한다."},
{"id":"k05","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["일이 뜻대로 __되서__ 기쁘다.","그럼 내일 다시 __뵈요__.","나갈 때 문을 꼭 __잠궈라__.","어제 김치를 __담가__ 두었다."],"ans":3,"exp":"\"담그다\"는 \"담가, 담가서\"로 활용하므로 \"담가\"가 옳다(\"담궈\"는 틀린 표기). \"되어서\"의 준말은 \"돼서\", \"뵈어요\"의 준말은 \"봬요\"이고, \"잠그다\"의 명령형은 \"잠가라\"이다."},
{"id":"k06","subj":"국어","unit":"맞춤법","q":"사이시옷의 표기가 옳은 것은?","opts":["등굣길","갯수","촛점","뒷풀이"],"ans":0,"exp":"\"등굣길\"은 한자어 \"등교\"와 고유어 \"길\"이 합쳐지고 뒷말이 된소리로 나므로 사이시옷을 적는다. 한자어끼리 합쳐진 말은 \"곳간, 셋방, 숫자, 찻간, 툇간, 횟수\" 여섯 개만 사이시옷을 적으므로 \"개수, 초점\"이 옳다. 뒷말의 첫소리가 본래 거센소리이면 사이시옷을 적지 않으므로 \"뒤풀이\"가 옳다."},
{"id":"k07","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["숨기지 말고 __솔직이__ 말해 줘.","__틈틈히__ 운동을 한다.","방을 __깨끗이__ 치웠다.","서류를 __꼼꼼이__ 살폈다."],"ans":2,"exp":"\"깨끗이\"처럼 \"-하다\"가 붙는 어근의 끝소리가 ㅅ이면 \"-이\"로 적는다. \"솔직히, 꼼꼼히\"는 끝소리가 분명히 [히]로 나므로 \"-히\"로 적고, \"틈틈이\"는 같은 말이 겹친 명사 뒤이므로 \"-이\"로 적는다."},
{"id":"k08","subj":"국어","unit":"맞춤법","q":"밑줄 친 부분이 어법에 맞는 것은?","opts":["얼마나 __춥든지__ 손이 다 얼었다.","__가든지 오든지__ 마음대로 해라.","학생__으로써__ 할 일을 다했다.","대화__로서__ 갈등을 풀었다."],"ans":1,"exp":"선택을 나타낼 때는 \"-든지\"를 쓰므로 \"가든지 오든지\"가 옳다. 지난 일을 돌이켜 말할 때는 \"-던지\"를 써서 \"춥던지\"로 적는다. 자격을 나타낼 때는 \"(으)로서\"(학생으로서), 수단이나 도구를 나타낼 때는 \"(으)로써\"(대화로써)를 쓴다."},
