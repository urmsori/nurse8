{"id":"e181","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA fever is unpleasant, and many parents rush to bring it down the moment a child feels warm. Yet a fever is not an illness in itself. It is ______: when viruses or bacteria enter, the body raises its own temperature because many germs multiply less well in the heat and the immune system works faster. For this reason, doctors often advise that a mild fever in an otherwise comfortable child need not be treated at once. Medicine may be given to help the child rest or drink, but the aim is comfort, not a particular number on the thermometer. What matters more is how the child looks and behaves, and whether he or she is drinking enough. A very young baby with a fever, a fever that lasts several days, or a child who is hard to wake, however, should be seen by a doctor without delay.","opts":["a side effect of taking too much medicine","a sign that the immune system has failed","the main cause of most childhood diseases","one of the body's defenses against infection"],"ans":3,"exp":"빈칸 뒤에서 병원체가 들어오면 몸이 스스로 체온을 올려 병원체의 증식을 막고 면역 작용을 빠르게 한다고 설명하므로, 열은 감염에 맞서는 몸의 방어 수단이라는 말이 알맞다. 열은 그 자체가 병이 아니라고 했으므로 병의 원인이라는 선지는 맞지 않고, 면역이 실패했다는 것은 글과 반대다."},
{"id":"e182","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nBanks and airports once had a separate line in front of each counter, and customers had to guess which one would move fastest. Most now use a single line that feeds all the counters. The average waiting time is about the same, but the experience is very different. In the old system, a customer stuck behind someone with a complicated problem watched people who had arrived later go ahead in other lines, and grew angrier with every minute. In a single line, everyone is served strictly in the order of arrival, and a slow transaction at one counter delays all customers a little instead of a few customers a lot. Although a single line often looks longer and may discourage people at first sight, customers tend to prefer it. People accept waiting far more readily when they feel that ______.","opts":["the counters are close together","they can change lines at any time","the system treats them fairly","the staff are working in silence"],"ans":2,"exp":"줄이 여럿일 때는 늦게 온 사람이 먼저 가는 것을 보게 되지만, 한 줄 서기에서는 온 순서대로 차례가 온다는 글이다. 평균 대기 시간은 비슷하다고 했으므로 사람들이 기다림을 받아들이는 이유는 공정하게 대우받는다는 느낌이다. 한 줄 서기에서는 줄을 바꿀 수 없으므로 줄을 바꿀 수 있다는 선지는 맞지 않는다."},
{"id":"e183","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe green of summer leaves comes from chlorophyll, the substance that plants use to turn sunlight into food. Leaves also contain yellow and orange pigments, the same kind that color carrots and corn, but in summer these are hidden by the much greater amount of green. As the days shorten and the nights grow cool in autumn, trees prepare for winter by ceasing to produce chlorophyll, and what remains in the leaves breaks down. With the green gone, the other colors can at last be seen. Before the leaves fall, the tree also draws useful nutrients back into its branches and trunk, where they are stored until spring. The yellow and orange of an autumn hillside, in other words, are not newly made in the fall; they ______.\n\n* chlorophyll: 엽록소  * pigment: 색소","opts":["are carried up from the roots","were there all along","appear only after the leaves fall","come from the cold night air"],"ans":1,"exp":"노란색과 주황색 색소는 여름에도 잎에 있었지만 초록색에 가려져 있었고, 가을에 엽록소가 분해되면서 드러난다는 글이다. 가을에 새로 만들어지는 것이 아니라고 했으므로 \"처음부터 줄곧 거기에 있었다\"는 말이 알맞다. 뿌리에서 올라온다거나 잎이 진 뒤에 나타난다는 내용은 글에 없다."},
{"id":"e184","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMost students review by reading their notes again and again. The pages soon look familiar, and this familiarity is easily mistaken for knowledge. Recognizing a sentence when it is in front of you, however, is very different from being able to produce it in an examination room. A more effective method is to close the book and try to recall the material: answer practice questions, or explain the topic aloud without looking. The effort of pulling information out of memory strengthens it far more than putting it in once more. It feels harder and less pleasant than rereading, which is one reason students tend to avoid it. Mistakes made along the way are useful, too, because they show exactly what has not yet been learned. In short, the best way to study is ______.","opts":["to read the notes one more time","to avoid making any mistakes","to memorize the pages in order","to test yourself"],"ans":3,"exp":"노트를 되풀이해 읽으면 익숙해질 뿐이고, 책을 덮고 문제를 풀거나 설명해 보며 기억에서 꺼내는 것이 더 효과적이라는 글이다. 따라서 가장 좋은 공부법은 스스로 시험해 보는 것이다. 다시 읽기는 글이 덜 효과적이라고 한 방법이고, 실수는 오히려 쓸모가 있다고 했다."},
{"id":"e185","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nSmallpox was once among the most feared diseases in the world. It killed a large share of those who caught it and left many survivors with deep scars.\n\n(A) He tested this idea in 1796 by scratching material from a cowpox sore into the arm of a young boy and later exposing him to smallpox; the boy stayed healthy.\n(B) An English doctor named Edward Jenner noticed, however, that milkmaids who had caught cowpox, a mild disease of cattle, did not seem to get smallpox. He guessed that cowpox somehow protected them.\n(C) This method, which came to be called vaccination, spread around the world, and in 1980 smallpox was declared wiped out, the first human disease ever to be eliminated in this way.\n\n* smallpox: 천연두  * cowpox: 우두","opts":["(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":0,"exp":"천연두가 무서운 병이었다는 주어진 글 뒤에, however로 제너의 관찰과 추측을 소개하는 (B)가 온다. (A)의 this idea는 (B)의 \"우두가 보호해 준다\"는 추측을 가리키고, (C)의 This method는 (A)에서 한 접종을 가리키므로 (B)-(A)-(C)이다."},
{"id":"e186","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nWhen you step outside on a freezing day, your body immediately begins working to protect its vital organs. It does so in stages, saving its strongest measure for last.\n\n(A) If this first response is still not enough to keep the core warm, the muscles start to contract rapidly, a reaction we know as shivering, which produces heat but uses up a great deal of energy.\n(B) First, the blood vessels near the skin become narrower, so that less warm blood flows to the surface and less heat escapes into the air.\n(C) That is why your fingers and ears, which now receive less blood, turn pale and feel cold long before the rest of you does. For the same reason, they are the first parts to be injured by extreme cold.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":2,"exp":"몸이 단계적으로 반응한다는 주어진 글 뒤에 First로 첫 반응(혈관 수축)을 말하는 (B)가 온다. (C)의 That is why와 \"이제 피를 덜 받는\"은 (B)의 내용을 바로 받는다. (A)는 이 첫 반응으로 부족할 때 일어나는 다음 반응(떨림)이므로 마지막에 온다. (A)가 (C) 앞에 오면 That이 떨림을 가리키게 되어 맞지 않는다."},
{"id":"e187","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nLast winter, Minho lost his wallet on a crowded bus on his way home from work. He did not notice until he reached his front door and put his hand in his pocket.\n\n(A) The next morning, however, his phone rang, and an unfamiliar voice asked whether he had lost something on the bus the day before.\n(B) The caller turned out to be a high school student who had found the wallet under a seat and had seen his business card inside. When they met that afternoon, nothing was missing, and the student would accept no reward but a word of thanks.\n(C) He searched his coat and bag again and again that evening, called the bus company without success, and finally gave up, sure that he would never see it again.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":2,"exp":"지갑을 잃어버렸다는 주어진 글 뒤에, 그날 저녁 찾다가 포기했다는 (C)가 온다. 그런데(however) 다음 날 아침 전화가 왔다는 (A)가 이어지고, 그 전화를 건 사람(The caller)이 누구였는지와 그날 오후의 만남을 말하는 (B)가 마지막이다."},
{"id":"e188","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nAlmost everyone has shed tears while chopping an onion, even when there was nothing to be sad about. An onion does not affect the eyes until it is cut, so what happens at that moment?\n\n(A) The cause is a gas that is released when the knife breaks the onion's cells. The gas rises from the cutting board, and when it reaches the eyes, it irritates their sensitive surface.\n(B) These tears can be reduced, however, by chilling the onion before cutting it, since the cold slows the release of the gas. Using a sharp knife also helps, because it damages fewer cells than a dull one.\n(C) To wash this irritating substance away, the eyes produce tears, just as they do when dust or smoke gets into them.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":0,"exp":"양파를 썰 때 눈물이 난다는 주어진 글 뒤에 그 원인(The cause)인 기체를 설명하는 (A)가 온다. (C)의 this irritating substance는 (A)의 기체를 가리키며 그것을 씻어 내려고 눈물이 난다고 하고, 이 눈물(These tears)을 줄이는 방법을 말하는 (B)가 마지막이다. (B)의 the gas도 (A)에서 먼저 소개되어야 한다."},
{"id":"e189","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nAt regular intervals, usually every five or ten years, most governments count everyone living in the country in a survey known as a census. The practice is very old, but its purpose has grown far beyond the original aims of collecting taxes and finding soldiers.\n\n(A) Since such decisions depend on the results, residents are urged to answer every question accurately. In return, the law usually requires that individual answers be kept secret and used only for statistics.\n(B) With these detailed answers in hand, officials can see how the population is changing and decide where new schools, hospitals, and roads will be needed in the years ahead.\n(C) The count is not limited to the number of people. Households are also asked about matters such as age, occupation, education, and the kind of housing they live in.\n\n* census: 인구 조사","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(C)-(B)-(A)"],"ans":3,"exp":"인구 조사를 소개한 주어진 글 뒤에, 사람 수만 세는 것이 아니라 여러 가지를 묻는다는 (C)가 온다. (B)의 these detailed answers는 (C)의 질문에 대한 답을 가리키고, (A)의 such decisions는 (B)에서 말한 학교·병원·도로에 관한 결정을 가리키므로 (C)-(B)-(A)이다."},
{"id":"e190","subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nIt is widely believed that the color red makes bulls angry. The belief is easy to understand, since the cape that a bullfighter holds out to the bull is traditionally bright red.\n\n(A) What provokes the animal, then, is most likely not the color of the cape but the way the bullfighter waves it sharply back and forth.\n(B) In fact, however, cattle do not see red as vividly as we do. Like many other mammals, they have only two kinds of color-sensing cells in their eyes and are thought to be poor at telling red from green, so a red cape does not stand out to them as it does to us.\n(C) Movement seems to have the same effect outside the bullring: bulls are said to charge at a waving cloth of any color and to pay little attention to a red one that is kept still.","opts":["(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(A)-(B)"],"ans":1,"exp":"빨간색이 소를 화나게 한다는 통념 뒤에, however로 소는 빨간색을 사람처럼 뚜렷하게 보지 못한다고 반박하는 (B)가 온다. 그렇다면(then) 소를 자극하는 것은 색이 아니라 천의 움직임일 것이라는 (A)가 이어지고, 투우장 밖에서도 움직임이 같은 효과(the same effect)를 내는 것으로 보인다는 (C)가 마지막이다. (C)는 움직임 이야기가 먼저 나온 (A) 뒤에만 올 수 있다."},
{"id":"e191","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nSunscreen works only when it is used properly, and many people do not use it that way. (A) It should be applied about fifteen to thirty minutes before going outdoors so that it has time to settle on the skin. (B) Most people use far too little; an adult needs roughly a shot glass of lotion to cover the whole body, and places such as the ears, the back of the neck, and the tops of the feet are often missed. (C) Tanned skin was once regarded as a sign of outdoor labor, but it later became fashionable among city dwellers. (D) Because sweat and water wash the lotion away, it must be put on again every two hours and after swimming. Sunscreen is needed on cloudy days as well, since much of the sun's ultraviolet light passes through clouds.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"자외선 차단제를 제대로 쓰는 방법(바르는 때, 양, 덧바르기, 흐린 날)을 설명하는 글이다. (C)는 햇볕에 그을린 피부에 대한 인식이 바뀌었다는 내용이어서 차단제의 올바른 사용법이라는 흐름에서 벗어난다."},
{"id":"e192","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nEmergency call centers receive many calls that are not emergencies at all. (A) People call to ask about bus schedules, to complain about noisy neighbors, or even to request help opening a locked door. (B) Mobile phones have replaced public telephones on most city streets, and few children today have ever used a phone booth. (C) Each needless call occupies an operator who might otherwise be answering someone in real danger, and in a fire or a heart attack a delay of even one minute can matter. (D) To keep the emergency line free, many cities have set up a separate number for everyday questions and complaints. Public campaigns also teach residents when to use each number: the emergency line when life or property is in immediate danger, and the other line for everything else.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"긴급 전화에 긴급하지 않은 전화가 많이 걸려 와 정작 위급한 사람의 전화를 받지 못할 수 있고, 그래서 따로 민원 번호를 둔다는 글이다. (B)는 전화라는 낱말로 이어지는 듯하지만 휴대 전화가 공중전화를 대신하게 되었다는 내용이어서 흐름과 관계가 없다. (C)의 Each needless call은 (A)에서 든 전화들을 받는다."},
{"id":"e193","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nCaffeine does not give the body new energy; it only hides tiredness. (A) It works by blocking the action of a chemical in the brain that builds up during the day and makes us feel sleepy. (B) When the caffeine wears off, the tiredness that was hidden returns, often all at once, which is why many people reach for a second or third cup. (C) Moreover, since caffeine stays in the body for many hours, a cup in the late afternoon can still disturb sleep at night, leaving us even more tired the next morning. (D) Coffee beans are grown mainly in warm regions near the equator and are shipped all over the world. A short nap or an earlier bedtime is a far better answer to tiredness than another cup.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"카페인은 피로를 없애는 것이 아니라 가릴 뿐이고 밤잠까지 방해하므로, 피곤하면 자는 것이 낫다는 글이다. (D)는 커피콩의 재배 지역과 수출에 관한 내용이어서 카페인과 피로라는 흐름에서 벗어난다."},
{"id":"e194","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nA school nurse does far more than put bandages on scraped knees. (A) Nursing uniforms have changed a great deal over the past hundred years, from long dresses and caps to simple, practical clothing. (B) The nurse looks after students with long-term conditions such as asthma or diabetes, making sure they take their medicine on time and know what to do if they feel unwell. (C) He or she also checks students' eyesight and hearing, so that problems are found before they affect learning. (D) When an infectious disease appears in a class, it is the nurse who reports it and advises teachers and parents on what to do. In addition, many school nurses teach lessons on topics such as nutrition, hand washing, and first aid. In all these ways, they help keep children healthy enough to learn.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"보건교사가 만성 질환 학생 돌보기, 시력·청력 검사, 감염병 대응, 보건 교육 등 여러 일을 한다는 글이다. (A)는 간호사 복장의 변화에 관한 내용이어서 보건교사가 하는 일이라는 흐름과 관계가 없다."},
{"id":"e195","subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nStaring at a screen for hours tires the eyes, causing dryness, blurred vision, and sometimes headaches. (A) One reason is that we blink far less often than usual when we look at a screen, so the surface of the eye dries out. (B) Eye doctors suggest a simple habit: every twenty minutes, look at something about six meters away for twenty seconds, which lets the muscles that focus the eye relax. (C) Screens have become thinner and lighter every year as technology has advanced. (D) Adjusting the brightness of the screen to match the room and keeping it at arm's length can also reduce the strain. So can placing the screen slightly below eye level, because the eyes open less widely when looking down and therefore dry out more slowly. If discomfort continues in spite of these measures, an eye examination is advisable.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"화면을 오래 보면 눈이 피로해지는 이유와 이를 줄이는 방법을 다룬 글이다. (C)는 화면이라는 낱말이 겹치지만 화면이 해마다 얇고 가벼워졌다는 기술 발전 이야기여서 눈의 피로라는 흐름에서 벗어난다. (D)의 also는 (B)의 습관에 이어 또 다른 방법을 더하는 말이다."},
{"id":"e196","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThe reason lies in the way the two materials conduct heat.\n\nTouch a metal spoon and a wooden spoon that have been lying in the same drawer overnight. (A) The metal one will feel distinctly colder. (B) Yet both are at exactly the same temperature as the room, so why do they feel different? (C) Metal is a good conductor and carries heat away from your fingers quickly, while wood, a poor conductor, does so very slowly. (D) What your skin senses, therefore, is not the temperature of the object itself but how fast heat is leaving your hand. The same principle explains why a tiled bathroom floor feels colder to bare feet than a rug in the same room, and why a metal bench in winter seems far icier than a wooden one. It also explains why pots are made of metal while their handles are often made of wood or plastic.","opts":["(A)","(B)","(C)","(D)"],"ans":2,"exp":"주어진 문장의 The reason은 \"온도가 같은데도 왜 다르게 느껴지는가\"라는 물음의 답을 꺼내는 말이므로, 그 물음 바로 뒤인 (C)에 와야 한다. 바로 뒤에 금속과 나무가 열을 전하는 방식의 차이가 구체적으로 이어진다. (B)에 넣으면 Yet으로 시작하는 문장이 앞 문장과 대조를 이루지 못하고, (D)에 넣으면 열전도 차이를 이미 설명한 뒤여서 같은 말을 되풀이하게 된다."},
{"id":"e197","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThis, however, is exactly the wrong thing to do.\n\nNosebleeds are common, especially in dry winter air, and are usually harmless. (A) When one starts, many people tilt their head back to keep the blood from dripping onto their clothes. (B) The reason is that, with the head back, the blood runs down the throat into the stomach, where it can cause nausea and vomiting. (C) Instead, you should sit up, lean slightly forward, and pinch the soft part of your nose firmly for about ten minutes, breathing through your mouth. (D) Resist the temptation to let go every minute to check, since the pressure must be continuous to work. If the bleeding still has not stopped after a second try, or if it follows a blow to the head, you should see a doctor.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장의 This는 고개를 뒤로 젖히는 행동을 가리키므로 그 내용이 나온 뒤인 (B)에 와야 한다. 바로 뒤의 The reason is ~가 왜 잘못인지(피가 목으로 넘어가 메스꺼움을 일으킴)를 설명하고, (C) 뒤의 Instead는 올바른 방법을 소개한다."},
{"id":"e198","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nEven so, the apps cannot be relied on for every conversation.\n\nTranslation apps have become a familiar sight in hospitals that treat foreign patients. (A) A nurse speaks into a phone, and a moment later the patient hears the question in his or her own language. (B) For simple matters such as meal times or directions to the X-ray room, the apps work well enough. (C) They are also available at any hour, unlike human interpreters, who must usually be booked in advance. (D) When a doctor has to explain a diagnosis or obtain consent for surgery, a small error in translation could have serious consequences, so a trained medical interpreter is still called in. An interpreter can also notice when a patient looks confused and ask the doctor to explain again, which no app can do.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장은 Even so(그렇다 하더라도)로 앞에 나온 번역 앱의 장점들과 반대되는 한계를 꺼낸다. (D) 앞까지는 장점(간단한 일에 쓸 만함, 언제든 쓸 수 있음)이 이어지고, (D) 뒤는 진단 설명이나 수술 동의에는 전문 통역사를 부른다는 한계의 구체적인 내용이므로 (D)가 알맞다. (C)에 넣으면 뒤 문장의 also가 이어지지 않는다."},
{"id":"e199","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThe rest lies hidden beneath the water, where it may extend far out to the sides.\n\nOnly about one-tenth of an iceberg can be seen above the surface of the sea. (A) A ship that keeps clear of the visible ice may therefore still strike the part it cannot see. (B) To reduce this danger, an international patrol has been tracking icebergs in the North Atlantic since shortly after the Titanic sank in 1912. (C) In its early years the patrol relied on ships that searched the foggy shipping lanes; today, aircraft and satellites do much of this work, and warnings are sent to ships every day. (D) Thanks to these efforts, collisions with icebergs have become rare. Even so, captains are still advised to slow down and keep a careful watch whenever they pass through waters where ice has been reported.","opts":["(A)","(B)","(C)","(D)"],"ans":0,"exp":"주어진 문장의 The rest는 첫 문장의 \"10분의 1\"을 뺀 나머지를 가리키므로 첫 문장 바로 뒤인 (A)에 와야 한다. 그 뒤 문장의 therefore와 \"보이지 않는 부분\"도 나머지가 물속에서 옆으로 뻗어 있다는 말이 먼저 나와야 이어진다."},
{"id":"e200","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nBut in soil that is kept constantly wet in this way, the roots are starved of air and begin to rot.\n\nMore houseplants die from too much water than from too little. (A) Owners who see a drooping leaf often assume that the plant is thirsty and water it again. (B) A plant with rotting roots can no longer take up water, so its leaves droop even more, and the owner adds yet more water. (C) The way out of this cycle is to check the soil, not the leaves. (D) If the top few centimeters feel dry to the finger, it is time to water; if not, wait. It also helps to use a pot with holes in the bottom, so that extra water can drain away instead of collecting around the roots. Most plants recover from a few dry days far more easily than from a week of standing in water.","opts":["(A)","(B)","(C)","(D)"],"ans":1,"exp":"주어진 문장의 in this way는 잎이 처질 때마다 물을 또 주는 행동을 가리키므로 그 문장 뒤인 (B)에 와야 한다. 바로 뒤의 \"뿌리가 썩은 식물\"은 주어진 문장에서 뿌리가 썩기 시작한다는 말이 먼저 나와야 이어진다."},
{"id":"e201","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nBrookvale Water Department\n\n(A) ______\n\nCrews will replace an aging water main under Linden Street next week. To complete the work safely, water service will be shut off for part of one day.\n\nDate: Wednesday, March 10\nTime: 9:00 a.m. – 4:00 p.m.\nAffected area: Linden Street between 2nd Avenue and 5th Avenue\n\nWhat you should do:\n■ Store enough water for drinking and cooking before 9:00 a.m.\n■ Keep all taps closed during the shutoff.\n■ When service returns, run the cold water tap for about five minutes until the water looks clear.\n\nA water truck will be parked in front of Linden Elementary School for residents who need drinking water.\n\nIf it rains heavily, the work will be moved to Thursday, March 11.\nQuestions? Call our customer line at 555-0142.","opts":["Water Shutoff on Linden Street","Linden Street Closed to All Traffic","How to Lower Your Monthly Water Bill","Free Water Quality Testing for Homes"],"ans":0,"exp":"낡은 수도관을 바꾸는 공사 때문에 Linden Street 일대의 수도 공급이 하루 중 일부 시간 동안 끊긴다는 것을 날짜, 시간, 대상 구역, 주민이 할 일과 함께 알리는 글이므로 'Linden Street 단수'가 제목으로 알맞다. 차량 통행 금지, 수도 요금 절약, 무료 수질 검사에 대한 내용은 없다."},
{"id":"e202","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nBrookvale Water Department\n\n(A) ______\n\nCrews will replace an aging water main under Linden Street next week. To complete the work safely, water service will be shut off for part of one day.\n\nDate: Wednesday, March 10\nTime: 9:00 a.m. – 4:00 p.m.\nAffected area: Linden Street between 2nd Avenue and 5th Avenue\n\nWhat you should do:\n■ Store enough water for drinking and cooking before 9:00 a.m.\n■ Keep all taps closed during the shutoff.\n■ When service returns, run the cold water tap for about five minutes until the water looks clear.\n\nA water truck will be parked in front of Linden Elementary School for residents who need drinking water.\n\nIf it rains heavily, the work will be moved to Thursday, March 11.\nQuestions? Call our customer line at 555-0142.","opts":["단수는 오전 9시부터 오후 6시까지 이어진다.","단수 중에는 수도꼭지를 열어 두어야 한다.","급수가 재개되면 찬물을 5분쯤 틀어 놓아야 한다.","비가 많이 오면 공사는 다음 주로 미뤄진다."],"ans":2,"exp":"\"When service returns, run the cold water tap for about five minutes\"라고 했으므로 급수가 다시 되면 찬물을 5분쯤 틀어 놓는다는 말이 일치한다. 단수 시간은 오후 4시까지이고, 단수 중에는 수도꼭지를 모두 잠가 두라고 했으며, 비가 많이 오면 공사는 다음 날인 3월 11일 목요일로 옮긴다."},
{"id":"e203","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nHarlow County Public Health Center\n\n(A) ______\n\nFlu season is coming. Protect yourself and your family by getting vaccinated at our walk-in clinic this fall.\n\nWho: Residents aged 65 and older, pregnant women, and children aged 6 months to 13 years\nWhen: October 4 – November 26, Monday to Friday, 9:00 a.m. – 5:00 p.m.\nWhere: Vaccination Room, 2nd floor\nCost: Free for the groups above\n\nPlease note:\n• No appointment is needed, but bring a photo ID or your child's health record booklet.\n• Stay in the waiting area for 20 minutes after your shot.\n• If you have a fever on the day of your visit, please come back after you recover.\n\nResidents who are not in the groups above may get the vaccine for a fee at local clinics.\n\nFor more information, call 555-0177.","opts":["Home Remedies for the Flu","Free Flu Shots Available This Fall","New Opening Hours for the Health Center","Flu Cases Drop Sharply Across the County"],"ans":1,"exp":"보건소가 올가을 65세 이상 주민, 임신부, 어린이에게 독감 예방접종을 무료로 해 준다는 것을 대상, 기간, 장소와 함께 알리는 글이므로 '올가을 무료 독감 예방접종'이 제목으로 알맞다. 집에서 독감을 다스리는 법, 보건소 운영 시간 변경, 독감 환자 감소는 글에 나오지 않는다."},
{"id":"e204","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nHarlow County Public Health Center\n\n(A) ______\n\nFlu season is coming. Protect yourself and your family by getting vaccinated at our walk-in clinic this fall.\n\nWho: Residents aged 65 and older, pregnant women, and children aged 6 months to 13 years\nWhen: October 4 – November 26, Monday to Friday, 9:00 a.m. – 5:00 p.m.\nWhere: Vaccination Room, 2nd floor\nCost: Free for the groups above\n\nPlease note:\n• No appointment is needed, but bring a photo ID or your child's health record booklet.\n• Stay in the waiting area for 20 minutes after your shot.\n• If you have a fever on the day of your visit, please come back after you recover.\n\nResidents who are not in the groups above may get the vaccine for a fee at local clinics.\n\nFor more information, call 555-0177.","opts":["임신부는 무료로 접종받을 수 있다.","접종은 월요일부터 금요일까지 한다.","예약하지 않고 방문해도 된다.","접종 당일에 열이 있어도 접종받을 수 있다."],"ans":3,"exp":"방문하는 날 열이 있으면 나은 뒤에 다시 오라고(\"please come back after you recover\") 했으므로 열이 있어도 접종받을 수 있다는 말은 글과 다르다. 임신부는 무료 대상에 들어 있고, 접종은 월요일부터 금요일까지이며, 예약은 필요 없다고 했다."},
{"id":"e205","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nRiverton Office of Emergency Management\n\n(A) ______\n\nA heat advisory is in effect for Riverton from Tuesday through Friday. Temperatures are expected to reach 36°C in the afternoon. The city has opened cooling centers where anyone can rest in air-conditioned rooms free of charge.\n\nLocations and hours:\n■ Riverton Senior Center: 10:00 a.m. – 8:00 p.m.\n■ Eastside Community Hall: 10:00 a.m. – 8:00 p.m.\n■ Central Library: 9:00 a.m. – 9:00 p.m.\n\nCold drinking water is provided at all centers. Pets are welcome only at Eastside Community Hall and must be kept on a leash.\n\nStay safe:\n■ Avoid outdoor work between noon and 5:00 p.m.\n■ Drink water often, even if you do not feel thirsty.\n■ Check on elderly neighbors who live alone.\n\nIf someone shows signs of heatstroke, call for emergency help immediately.","opts":["Senior Center Closed for Repairs","Energy-Saving Tips for Hot Summer Days","Cooling Centers Open During Heat Advisory","Summer Festival Schedule at Riverton Parks"],"ans":2,"exp":"폭염 주의보가 내려진 동안 누구나 쉴 수 있는 무더위 쉼터를 열었다는 것과 그 장소, 시간, 안전 수칙을 알리는 글이므로 '폭염 주의보 기간에 무더위 쉼터 운영'이 제목으로 알맞다. 노인 센터 휴관, 에너지 절약 요령, 여름 축제 일정은 글의 내용이 아니다."},
{"id":"e206","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nRiverton Office of Emergency Management\n\n(A) ______\n\nA heat advisory is in effect for Riverton from Tuesday through Friday. Temperatures are expected to reach 36°C in the afternoon. The city has opened cooling centers where anyone can rest in air-conditioned rooms free of charge.\n\nLocations and hours:\n■ Riverton Senior Center: 10:00 a.m. – 8:00 p.m.\n■ Eastside Community Hall: 10:00 a.m. – 8:00 p.m.\n■ Central Library: 9:00 a.m. – 9:00 p.m.\n\nCold drinking water is provided at all centers. Pets are welcome only at Eastside Community Hall and must be kept on a leash.\n\nStay safe:\n■ Avoid outdoor work between noon and 5:00 p.m.\n■ Drink water often, even if you do not feel thirsty.\n■ Check on elderly neighbors who live alone.\n\nIf someone shows signs of heatstroke, call for emergency help immediately.","opts":["무더위 쉼터는 65세 이상만 이용할 수 있다.","Central Library 쉼터는 가장 일찍 문을 연다.","반려동물은 모든 쉼터에 데리고 들어갈 수 있다.","목이 마를 때에만 물을 마시라고 권한다."],"ans":1,"exp":"Central Library는 오전 9시에, 나머지 두 곳은 오전 10시에 문을 열므로 Central Library가 가장 일찍 연다는 말이 일치한다. 쉼터는 누구나(anyone) 이용할 수 있고, 반려동물은 Eastside Community Hall에만 데려갈 수 있으며, 물은 목이 마르지 않아도 자주 마시라고 했다."},
{"id":"e207","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nPinewood Public Library\n\n(A) ______\n\nThe main building of Pinewood Public Library will be closed for roof and heating repairs. During the repairs, we will continue to serve you from a temporary branch.\n\nMain building closed: June 1 – August 31\nTemporary branch: Pinewood Civic Center, Room 105\nTemporary hours: Tuesday – Saturday, 10:00 a.m. – 6:00 p.m.\n\nWhat will change:\n• Only about 5,000 popular titles will be kept at the temporary branch. Other books can be requested and will be ready for pickup two days later.\n• Study rooms and the children's story time will not be offered.\n• The book return box at the main building will stay open 24 hours a day.\n\nYour library card and due dates remain the same. Late fees will not be charged during the closure.\n\nThank you for your patience. Contact: 555-0119","opts":["New Study Rooms Open at the Library","Library Seeks Donations of Used Books","Summer Story Time for Children Returns","Library Moves to Temporary Site During Repairs"],"ans":3,"exp":"본관이 지붕과 난방 공사로 문을 닫는 동안 임시 분관에서 운영한다는 것과 그 기간, 장소, 달라지는 점을 알리는 글이므로 '공사 기간에 도서관 임시 이전'이 제목으로 알맞다. 스터디룸과 어린이 이야기 시간은 오히려 운영하지 않는다고 했고, 헌책 기증에 대한 말은 없다."},
{"id":"e208","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nPinewood Public Library\n\n(A) ______\n\nThe main building of Pinewood Public Library will be closed for roof and heating repairs. During the repairs, we will continue to serve you from a temporary branch.\n\nMain building closed: June 1 – August 31\nTemporary branch: Pinewood Civic Center, Room 105\nTemporary hours: Tuesday – Saturday, 10:00 a.m. – 6:00 p.m.\n\nWhat will change:\n• Only about 5,000 popular titles will be kept at the temporary branch. Other books can be requested and will be ready for pickup two days later.\n• Study rooms and the children's story time will not be offered.\n• The book return box at the main building will stay open 24 hours a day.\n\nYour library card and due dates remain the same. Late fees will not be charged during the closure.\n\nThank you for your patience. Contact: 555-0119","opts":["임시 분관은 일주일 내내 문을 연다.","임시 분관에 없는 책은 신청하고 이틀 뒤에 받을 수 있다.","본관의 도서 반납함은 휴관 중에도 이용할 수 있다.","휴관 기간에는 연체료를 받지 않는다."],"ans":0,"exp":"임시 분관의 운영일은 화요일부터 토요일까지이므로 일주일 내내 연다는 말은 글과 다르다. 임시 분관에 없는 책은 신청하면 이틀 뒤에 찾을 수 있고, 본관의 반납함은 24시간 열려 있으며, 휴관 기간에는 연체료를 받지 않는다고 했다."},
{"id":"e209","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nCalder City Transit\n\n(A) ______\n\nThe Calder City Half Marathon will be held on Sunday, April 18. Because several downtown streets will be closed to vehicles, some buses will run on different routes that morning.\n\nRoad closures: 7:00 a.m. – 12:00 p.m.\nAffected routes: Buses 12, 30, and 45\n\nChanges:\n■ Buses 12 and 30 will skip the four stops along River Road and travel on Hill Street instead.\n■ Bus 45 will not run until the roads reopen.\n■ Temporary bus stops will be marked with yellow signs.\n\nSubway lines will operate as usual, and two extra trains will be added on Line 1 between 6:00 a.m. and 1:00 p.m.\n\nNormal bus service will return at 12:30 p.m. Real-time bus locations can be checked on the Calder Transit app.\n\nWe apologize for the inconvenience.","opts":["Bus Fares to Rise from April","New Subway Line Opens Downtown","Sign Up Now for the Half Marathon","Bus Routes to Change on Marathon Morning"],"ans":3,"exp":"하프 마라톤으로 시내 도로가 통제되어 그날 오전 일부 버스가 다른 길로 다니거나 운행을 쉰다는 것을 알리는 글이므로 '마라톤 날 오전 버스 노선 변경'이 제목으로 알맞다. 버스 요금 인상, 지하철 노선 개통, 마라톤 참가 신청은 글에 나오지 않는다."},
{"id":"e210","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nCalder City Transit\n\n(A) ______\n\nThe Calder City Half Marathon will be held on Sunday, April 18. Because several downtown streets will be closed to vehicles, some buses will run on different routes that morning.\n\nRoad closures: 7:00 a.m. – 12:00 p.m.\nAffected routes: Buses 12, 30, and 45\n\nChanges:\n■ Buses 12 and 30 will skip the four stops along River Road and travel on Hill Street instead.\n■ Bus 45 will not run until the roads reopen.\n■ Temporary bus stops will be marked with yellow signs.\n\nSubway lines will operate as usual, and two extra trains will be added on Line 1 between 6:00 a.m. and 1:00 p.m.\n\nNormal bus service will return at 12:30 p.m. Real-time bus locations can be checked on the Calder Transit app.\n\nWe apologize for the inconvenience.","opts":["도로는 오전 7시부터 오후 1시까지 통제된다.","12번 버스는 Hill Street를 지나 운행한다.","45번 버스는 평소와 같은 노선으로 운행한다.","지하철 1호선은 운행 횟수가 줄어든다."],"ans":1,"exp":"12번과 30번 버스는 River Road의 정류장 네 곳을 지나지 않고 Hill Street로 다닌다고 했으므로 일치한다. 도로 통제는 낮 12시까지이고, 45번 버스는 도로가 다시 열릴 때까지 운행하지 않으며, 지하철 1호선은 열차를 두 편 늘린다고 했다."},
{"id":"e211","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nWestmere City Parks Division\n\n(A) ______\n\nThe Parks Division is looking for hard-working people to help keep our parks clean and green from spring through fall.\n\nPositions: 15 park maintenance workers\nPeriod: April 1 – October 31\nHours: Monday – Friday, 8:00 a.m. – 5:00 p.m. (weekend work once a month)\nPay: $18 per hour\n\nDuties:\n• Mowing lawns and watering trees and flowers\n• Collecting litter and cleaning restrooms\n• Making simple repairs to benches and fences\n\nRequirements:\n• Must be 18 or older\n• Must hold a valid driver's license\n• No previous experience is necessary; training will be provided in the first week.\n\nHow to apply: Submit an application form in person at City Hall, Room 204, by March 12. Online applications are not accepted. Interviews will be held on March 19.","opts":["New Rules for Park Visitors","Parks Closed for Spring Cleaning","Now Hiring Seasonal Park Workers","Volunteer Day at Westmere City Parks"],"ans":2,"exp":"봄부터 가을까지 공원을 관리할 직원 15명을 뽑는다는 것을 근무 기간, 시간, 급여, 업무, 자격, 지원 방법과 함께 알리는 글이므로 '계절 공원 관리 직원 모집'이 제목으로 알맞다. 시급을 주는 채용이므로 자원봉사가 아니며, 공원 이용 규칙이나 휴장에 대한 내용은 없다."},
{"id":"e212","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nWestmere City Parks Division\n\n(A) ______\n\nThe Parks Division is looking for hard-working people to help keep our parks clean and green from spring through fall.\n\nPositions: 15 park maintenance workers\nPeriod: April 1 – October 31\nHours: Monday – Friday, 8:00 a.m. – 5:00 p.m. (weekend work once a month)\nPay: $18 per hour\n\nDuties:\n• Mowing lawns and watering trees and flowers\n• Collecting litter and cleaning restrooms\n• Making simple repairs to benches and fences\n\nRequirements:\n• Must be 18 or older\n• Must hold a valid driver's license\n• No previous experience is necessary; training will be provided in the first week.\n\nHow to apply: Submit an application form in person at City Hall, Room 204, by March 12. Online applications are not accepted. Interviews will be held on March 19.","opts":["근무 기간은 4월부터 10월까지이다.","한 달에 한 번은 주말에 근무한다.","운전면허가 있어야 지원할 수 있다.","지원서는 온라인으로도 제출할 수 있다."],"ans":3,"exp":"지원서는 시청 204호에 직접 내야 하고 온라인 지원은 받지 않는다(\"Online applications are not accepted\")고 했으므로 온라인으로도 낼 수 있다는 말은 글과 다르다. 근무 기간은 4월 1일부터 10월 31일까지이고, 주말 근무가 한 달에 한 번 있으며, 유효한 운전면허가 자격 요건이다."},
{"id":"e213","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nAshford Sanitation Department\n\n(A) ______\n\nStarting July 1, large household items such as sofas, beds, and refrigerators will be collected by reservation only. Items left on the street without a reservation will not be picked up, and their owners may be fined.\n\nHow it works:\n1. Reserve a pickup date on the department's website or by phone at 555-0163.\n2. Pay the collection fee. Fees range from $3 to $15 depending on the size of the item.\n3. Print the confirmation sticker and attach it to the item.\n4. Place the item in front of your building after 8:00 p.m. on the evening before your pickup date.\n\nPlease remember:\n■ Each household may reserve up to five items at a time.\n■ Working appliances can be donated instead; our reuse center will collect them for free.\n■ A reservation can be canceled for a full refund until noon on the day before pickup.","opts":["Fines Cut for Illegal Dumping","Bulky Waste Pickup by Reservation Only","Free Furniture Giveaway for All Residents","Recycling Center Extends Its Opening Hours"],"ans":1,"exp":"7월 1일부터 소파, 침대 같은 대형 폐기물을 예약한 것만 수거한다는 것과 예약, 수수료 납부, 배출 방법을 알리는 글이므로 '대형 폐기물은 예약 수거만'이 제목으로 알맞다. 예약 없이 내놓으면 오히려 과태료를 물 수 있다고 했고, 가구 무료 나눔이나 재활용 센터 운영 시간에 대한 말은 없다."},
{"id":"e214","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nAshford Sanitation Department\n\n(A) ______\n\nStarting July 1, large household items such as sofas, beds, and refrigerators will be collected by reservation only. Items left on the street without a reservation will not be picked up, and their owners may be fined.\n\nHow it works:\n1. Reserve a pickup date on the department's website or by phone at 555-0163.\n2. Pay the collection fee. Fees range from $3 to $15 depending on the size of the item.\n3. Print the confirmation sticker and attach it to the item.\n4. Place the item in front of your building after 8:00 p.m. on the evening before your pickup date.\n\nPlease remember:\n■ Each household may reserve up to five items at a time.\n■ Working appliances can be donated instead; our reuse center will collect them for free.\n■ A reservation can be canceled for a full refund until noon on the day before pickup.","opts":["예약 없이 내놓은 물건은 수거하지 않는다.","수거 수수료는 물건의 크기와 관계없이 같다.","물건은 수거일 전날 오후 8시 이전에 내놓아야 한다.","한 가구가 한 번에 예약할 수 있는 물건의 수에는 제한이 없다."],"ans":0,"exp":"\"Items left on the street without a reservation will not be picked up\"라고 했으므로 예약 없이 내놓은 물건은 수거하지 않는다는 말이 일치한다. 수수료는 크기에 따라 3달러에서 15달러까지 다르고, 물건은 수거일 전날 저녁 8시 이후에 내놓으며, 한 가구가 한 번에 다섯 개까지만 예약할 수 있다."},
{"id":"e215","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nMorland District Office\n\n(A) ______\n\nMany residents have told us that it is hard to visit our office during working hours. To serve you better, the Civil Service Counter will stay open later one evening a week starting in May.\n\nNew evening hours: Every Thursday until 8:00 p.m. (regular closing time: 6:00 p.m.)\n\nServices available in the evening:\n• Passport applications and pickup\n• Resident registration certificates\n• Vehicle registration\n\nServices NOT available in the evening:\n• Tax consultations\n• Business permits\n\nTips for your visit:\n• Evening passport applications require an online reservation made at least one day in advance.\n• Certificates can be issued without a reservation.\n• The main entrance closes at 6:00 p.m., so please use the side entrance on Oak Street.\n\nFree parking is available after 6:00 p.m.","opts":["Evening Service Hours on Thursdays","District Office to Close on Thursdays","Online Tax Consultations Now Available","Passport Fees to Change Starting in May"],"ans":0,"exp":"5월부터 매주 목요일에는 민원 창구를 오후 8시까지 연다는 것과 그 시간에 볼 수 있는 업무, 방문 요령을 알리는 글이므로 '목요일 저녁 연장 운영'이 제목으로 알맞다. 목요일에 문을 닫는 것이 아니라 더 늦게까지 여는 것이고, 세무 상담은 저녁에 하지 않으며, 여권 수수료에 대한 말은 없다."},
{"id":"e216","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nMorland District Office\n\n(A) ______\n\nMany residents have told us that it is hard to visit our office during working hours. To serve you better, the Civil Service Counter will stay open later one evening a week starting in May.\n\nNew evening hours: Every Thursday until 8:00 p.m. (regular closing time: 6:00 p.m.)\n\nServices available in the evening:\n• Passport applications and pickup\n• Resident registration certificates\n• Vehicle registration\n\nServices NOT available in the evening:\n• Tax consultations\n• Business permits\n\nTips for your visit:\n• Evening passport applications require an online reservation made at least one day in advance.\n• Certificates can be issued without a reservation.\n• The main entrance closes at 6:00 p.m., so please use the side entrance on Oak Street.\n\nFree parking is available after 6:00 p.m.","opts":["목요일에는 민원 창구를 오후 8시까지 운영한다.","저녁 시간에는 세무 상담을 받을 수 없다.","저녁 시간에 증명서를 발급받으려면 미리 예약해야 한다.","오후 6시 이후에는 옆문으로 들어가야 한다."],"ans":2,"exp":"증명서는 예약 없이 발급받을 수 있다(\"Certificates can be issued without a reservation\")고 했으므로 미리 예약해야 한다는 말은 글과 다르다. 예약이 필요한 것은 저녁 시간의 여권 신청이다. 목요일 오후 8시까지 운영, 저녁 시간 세무 상담 불가, 오후 6시 이후 옆문 이용은 모두 글과 일치한다."},
{"id":"e217","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nGlenmore Lifelong Learning Center\n\n(A) ______\n\nDo you find smartphones and self-service kiosks confusing? Our friendly instructors will help you learn step by step.\n\nCourse: Smartphone Basics (6 weeks)\nDates: September 6 – October 13\nSchedule: Mondays and Wednesdays, 2:00 p.m. – 3:30 p.m.\nPlace: Computer Lab, 3rd floor\nClass size: 12 learners\n\nYou will learn how to:\n■ Send messages and photos\n■ Order food at a kiosk and buy train tickets online\n■ Recognize and avoid phone scams\n\nWho can join: Glenmore residents aged 60 or older. The course is free, but learners must bring their own smartphones.\n\nRegistration: Call 555-0128 or visit the front desk from August 16. Places are given in the order of registration. Learners who attend at least ten of the twelve classes will receive a certificate.","opts":["Computer Lab Closed in September","Evening Course Instructors Wanted","Free Smartphone Classes for Seniors","Used Smartphones Wanted for Donation"],"ans":2,"exp":"60세 이상 주민에게 스마트폰과 무인 주문기 사용법을 무료로 가르치는 6주 강좌의 일정, 내용, 신청 방법을 알리는 글이므로 '어르신을 위한 무료 스마트폰 강좌'가 제목으로 알맞다. 컴퓨터실 휴관, 강사 모집, 중고 스마트폰 기증은 글의 내용이 아니다."},
{"id":"e218","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하는 것은?\n\nGlenmore Lifelong Learning Center\n\n(A) ______\n\nDo you find smartphones and self-service kiosks confusing? Our friendly instructors will help you learn step by step.\n\nCourse: Smartphone Basics (6 weeks)\nDates: September 6 – October 13\nSchedule: Mondays and Wednesdays, 2:00 p.m. – 3:30 p.m.\nPlace: Computer Lab, 3rd floor\nClass size: 12 learners\n\nYou will learn how to:\n■ Send messages and photos\n■ Order food at a kiosk and buy train tickets online\n■ Recognize and avoid phone scams\n\nWho can join: Glenmore residents aged 60 or older. The course is free, but learners must bring their own smartphones.\n\nRegistration: Call 555-0128 or visit the front desk from August 16. Places are given in the order of registration. Learners who attend at least ten of the twelve classes will receive a certificate.","opts":["수업은 일주일에 세 번 열린다.","한 반의 정원은 20명이다.","스마트폰은 센터에서 빌려준다.","열 번 이상 출석하면 수료증을 받는다."],"ans":3,"exp":"열두 번의 수업 가운데 열 번 이상 출석한 사람에게 수료증을 준다고 했으므로 일치한다. 수업은 월요일과 수요일, 일주일에 두 번이고, 정원은 12명이며, 스마트폰은 수강생이 자기 것을 가져와야 한다."},
{"id":"e219","subj":"영어","unit":"업무 공지","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\nAlderwood General Hospital\n\n(A) ______\n\nTo protect our patients during the winter infection season, visiting rules will be tightened from December 1 until further notice.\n\nVisiting hours:\nGeneral wards (weekdays): 6:00 p.m. – 8:00 p.m.\nGeneral wards (weekends): 10:00 a.m. – 12:00 p.m. and 6:00 p.m. – 8:00 p.m.\nIntensive care unit: 30 minutes per day, starting at 1:00 p.m.\n\nRules for visitors:\n• Only two visitors are allowed per patient at one time.\n• Children under 12 may not enter the wards.\n• All visitors must wear a mask and clean their hands at the entrance.\n• Anyone with a cough or fever should not visit.\n\nFlowers and outside food may not be brought into patient rooms. Video calls can be arranged through the nursing station for families who cannot visit.\n\nThank you for helping us keep our patients safe.","opts":["Free Masks for All Patients","Winter Changes to Visiting Rules","Flower Shop Now Open in the Lobby","New Intensive Care Unit to Open Soon"],"ans":1,"exp":"겨울철 감염 유행기에 환자를 보호하려고 12월 1일부터 면회 시간과 면회객 수칙을 강화한다는 것을 알리는 글이므로 '겨울철 면회 규정 변경'이 제목으로 알맞다. 마스크 무료 배부, 꽃집 개점, 중환자실 신설은 글에 나오지 않는다."},
{"id":"e220","subj":"영어","unit":"업무 공지","q":"윗글의 내용과 일치하지 않는 것은?\n\nAlderwood General Hospital\n\n(A) ______\n\nTo protect our patients during the winter infection season, visiting rules will be tightened from December 1 until further notice.\n\nVisiting hours:\nGeneral wards (weekdays): 6:00 p.m. – 8:00 p.m.\nGeneral wards (weekends): 10:00 a.m. – 12:00 p.m. and 6:00 p.m. – 8:00 p.m.\nIntensive care unit: 30 minutes per day, starting at 1:00 p.m.\n\nRules for visitors:\n• Only two visitors are allowed per patient at one time.\n• Children under 12 may not enter the wards.\n• All visitors must wear a mask and clean their hands at the entrance.\n• Anyone with a cough or fever should not visit.\n\nFlowers and outside food may not be brought into patient rooms. Video calls can be arranged through the nursing station for families who cannot visit.\n\nThank you for helping us keep our patients safe.","opts":["일반 병동은 평일 오전에도 면회할 수 있다.","환자 한 명을 한 번에 두 명까지 면회할 수 있다.","12세 미만 어린이는 병동에 들어갈 수 없다.","환자 병실에 꽃을 가져갈 수 없다."],"ans":0,"exp":"일반 병동의 평일 면회 시간은 오후 6시부터 8시까지뿐이고, 오전 면회(오전 10시~낮 12시)는 주말에만 있으므로 평일 오전에도 면회할 수 있다는 말은 글과 다르다. 한 번에 두 명까지, 12세 미만 출입 금지, 꽃 반입 금지는 모두 글과 일치한다."},
{"id":"e221","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nCareLine 24 (Northgate Regional Health Authority)\n\nNot Sure Whether to See a Doctor?\n\nWhen you or a family member feels unwell late at night, it can be hard to decide what to do. CareLine 24 is a free telephone service that connects you with a registered nurse at any hour, every day of the year.\n\nOur nurses listen to your symptoms and give you __sound__ advice based on approved clinical guidelines. They can tell you whether to care for yourself at home, visit a clinic the next day, or go to an emergency room right away. They can also help you find the nearest pharmacy that is open.\n\nPlease note that our nurses cannot diagnose illnesses or prescribe medicine. CareLine 24 is not an emergency service. If someone has chest pain, trouble breathing, or severe bleeding, call an ambulance immediately.\n\nCall 555-0100. Interpretation is available in six languages.","opts":["간호사 전화 상담 서비스를 안내하려고","전화 상담을 맡을 간호사를 모집하려고","응급실 이용 절차의 변경을 알리려고","밤에 문을 여는 약국의 목록을 제공하려고"],"ans":0,"exp":"CareLine 24가 언제든 간호사와 연결해 주는 무료 전화 서비스라는 것과 간호사가 해 주는 일, 해 줄 수 없는 일을 알리는 글이므로 간호사 전화 상담 서비스를 안내하는 것이 목적이다. 간호사를 뽑는다는 말이나 응급실 절차 변경은 없고, 문을 연 약국을 찾아 주는 것은 서비스의 일부일 뿐이다."},
{"id":"e222","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 sound의 의미와 가장 가까운 것은?\n\nCareLine 24 (Northgate Regional Health Authority)\n\nNot Sure Whether to See a Doctor?\n\nWhen you or a family member feels unwell late at night, it can be hard to decide what to do. CareLine 24 is a free telephone service that connects you with a registered nurse at any hour, every day of the year.\n\nOur nurses listen to your symptoms and give you __sound__ advice based on approved clinical guidelines. They can tell you whether to care for yourself at home, visit a clinic the next day, or go to an emergency room right away. They can also help you find the nearest pharmacy that is open.\n\nPlease note that our nurses cannot diagnose illnesses or prescribe medicine. CareLine 24 is not an emergency service. If someone has chest pain, trouble breathing, or severe bleeding, call an ambulance immediately.\n\nCall 555-0100. Interpretation is available in six languages.","opts":["vocal","hasty","audible","reliable"],"ans":3,"exp":"승인된 임상 지침에 근거한 조언이라고 했으므로 sound는 '믿을 만한, 타당한'이라는 뜻이고 reliable과 가장 가깝다. vocal(목소리의)과 audible(들리는)은 '소리'라는 다른 뜻에서 떠올린 낱말이고, hasty(성급한)는 문맥과 반대된다."},
{"id":"e223","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nDocuGate (Seaborne City Online Service Portal)\n\nGet Your Documents Without the Wait\n\nSeaborne City has opened DocuGate so that residents no longer need to visit City Hall for simple paperwork. With DocuGate, you can request more than 40 kinds of official documents from your computer or phone, including residence certificates, tax payment records, and building permits.\n\nMost documents can be printed at home immediately, and about half of them are free of charge. Paper copies can also be mailed to you within three working days for a small postage fee.\n\nTo get started, create an account and verify your identity with your mobile phone. Please make sure that the address on your account is __current__, because mailed documents are sent only to the address we have on file.\n\nNeed help? Our chat assistants are online from 9:00 a.m. to 6:00 p.m. on weekdays.","opts":["to explain how to report a change of address","to promote an online service for city documents","to recruit chat assistants for the city's help desk","to announce new fees for documents issued at City Hall"],"ans":1,"exp":"시청에 가지 않고도 컴퓨터나 휴대전화로 공문서를 신청하고 받을 수 있는 DocuGate를 소개하고 이용을 권하는 글이므로 시의 온라인 문서 발급 서비스를 알리는 것이 목적이다. 주소 변경 신고 방법, 채팅 상담원 모집, 시청 발급 수수료 변경은 글의 내용이 아니다."},
{"id":"e224","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 current의 의미와 가장 가까운 것은?\n\nDocuGate (Seaborne City Online Service Portal)\n\nGet Your Documents Without the Wait\n\nSeaborne City has opened DocuGate so that residents no longer need to visit City Hall for simple paperwork. With DocuGate, you can request more than 40 kinds of official documents from your computer or phone, including residence certificates, tax payment records, and building permits.\n\nMost documents can be printed at home immediately, and about half of them are free of charge. Paper copies can also be mailed to you within three working days for a small postage fee.\n\nTo get started, create an account and verify your identity with your mobile phone. Please make sure that the address on your account is __current__, because mailed documents are sent only to the address we have on file.\n\nNeed help? Our chat assistants are online from 9:00 a.m. to 6:00 p.m. on weekdays.","opts":["up-to-date","flowing","electric","permanent"],"ans":0,"exp":"우편으로 보내는 문서는 등록된 주소로만 가므로 계정의 주소가 '지금 사는 곳과 맞는 최신 상태'인지 확인하라는 문맥이다. 따라서 current는 up-to-date(최신의)와 가장 가깝다. flowing(흐르는)과 electric(전기의)은 명사 current(흐름, 전류)에서 떠올린 낱말이고, permanent(영구적인)는 뜻이 다르다."},
{"id":"e225","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nRedvale Community Blood Center\n\nGive Blood, Give Life\n\nEvery day, hospitals in our region need about 300 units of blood for surgery patients, accident victims, and people being treated for cancer. Blood cannot be made in a factory; it can only come from donors like you. That is why regular donors play a __vital__ role in saving lives.\n\nDonating is simple and safe. The whole visit takes about an hour, and the donation itself lasts only ten minutes. Healthy adults who weigh at least 50 kilograms can usually give blood every eight weeks.\n\nOur center is open Monday through Saturday, and our blood bus visits workplaces and schools on request. After donating, you will receive a snack and a small gift.\n\nSupplies fall sharply during holiday seasons. Book your appointment today and bring a friend.","opts":["to thank donors for their past gifts","to announce the closing of a blood bus","to encourage readers to become blood donors","to explain how hospitals store donated blood"],"ans":2,"exp":"혈액은 헌혈로만 얻을 수 있고 헌혈은 간단하고 안전하다고 설명한 뒤 \"Book your appointment today and bring a friend.\"라고 권하므로 헌혈에 참여하도록 독려하는 것이 목적이다. 지난 헌혈에 대한 감사, 헌혈 버스 운행 중단, 병원의 혈액 보관 방법은 글에 나오지 않는다."},
{"id":"e226","subj":"영어","unit":"업무 웹페이지","q":"밑줄 친 vital의 의미와 가장 가까운 것은?\n\nRedvale Community Blood Center\n\nGive Blood, Give Life\n\nEvery day, hospitals in our region need about 300 units of blood for surgery patients, accident victims, and people being treated for cancer. Blood cannot be made in a factory; it can only come from donors like you. That is why regular donors play a __vital__ role in saving lives.\n\nDonating is simple and safe. The whole visit takes about an hour, and the donation itself lasts only ten minutes. Healthy adults who weigh at least 50 kilograms can usually give blood every eight weeks.\n\nOur center is open Monday through Saturday, and our blood bus visits workplaces and schools on request. After donating, you will receive a snack and a small gift.\n\nSupplies fall sharply during holiday seasons. Book your appointment today and bring a friend.","opts":["deadly","essential","lively","modest"],"ans":1,"exp":"혈액은 헌혈자에게서만 얻을 수 있으므로 정기 헌혈자가 생명을 구하는 데 '매우 중요한' 역할을 한다는 문맥이다. 따라서 vital은 essential(필수적인)과 가장 가깝다. lively(활기찬)는 vital의 다른 뜻이고, deadly(치명적인)와 modest(대단하지 않은)는 문맥에 맞지 않는다."},
{"id":"e227","subj":"영어","unit":"업무 웹페이지","q":"윗글의 내용과 일치하는 것은?\n\nToolShare Center (Fernhill District)\n\nBorrow It, Don't Buy It\n\nWhy buy a drill that you will use only twice a year? At the Fernhill ToolShare Center, residents can borrow more than 600 tools, from ladders and electric saws to sewing machines and camping tents.\n\nHow it works\n- Sign up at the center with proof of your Fernhill address. Membership costs $10 a year.\n- Borrow up to four items at a time for seven days.\n- Return items clean and on time. A late fee of $1 per item per day applies.\n\nMembers with __outstanding__ fees cannot borrow further items until the fees are paid.\n\nNot sure how to use a tool? Our volunteers offer free safety lessons every Saturday morning. We also welcome donations of tools in good working condition.\n\nOpen Tuesday to Saturday, 10:00 a.m. – 6:00 p.m.","opts":["Membership is free for Fernhill residents.","Members may keep borrowed items for two weeks.","Volunteers give safety lessons on Saturday mornings.","The center does not accept donated tools."],"ans":2,"exp":"\"Our volunteers offer free safety lessons every Saturday morning.\"이라고 했으므로 자원봉사자가 토요일 오전에 안전 교육을 한다는 말이 일치한다. 회비는 1년에 10달러이고, 대여 기간은 7일이며, 쓸 수 있는 상태의 공구는 기증받는다고 했다."},
{"id":"e228","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 outstanding의 의미와 가장 가까운 것은?\n\nToolShare Center (Fernhill District)\n\nBorrow It, Don't Buy It\n\nWhy buy a drill that you will use only twice a year? At the Fernhill ToolShare Center, residents can borrow more than 600 tools, from ladders and electric saws to sewing machines and camping tents.\n\nHow it works\n- Sign up at the center with proof of your Fernhill address. Membership costs $10 a year.\n- Borrow up to four items at a time for seven days.\n- Return items clean and on time. A late fee of $1 per item per day applies.\n\nMembers with __outstanding__ fees cannot borrow further items until the fees are paid.\n\nNot sure how to use a tool? Our volunteers offer free safety lessons every Saturday morning. We also welcome donations of tools in good working condition.\n\nOpen Tuesday to Saturday, 10:00 a.m. – 6:00 p.m.","opts":["excellent","prominent","reduced","unpaid"],"ans":3,"exp":"뒤에 '그 요금을 낼 때까지 더 빌릴 수 없다'는 말이 이어지므로 outstanding fees는 '아직 내지 않은' 요금이고 unpaid와 가장 가깝다. excellent(뛰어난)와 prominent(두드러진)는 outstanding의 다른 뜻이고, reduced(할인된)는 뜻이 다르다."},
{"id":"e229","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nPedalLink (Marston City Bike Share)\n\nA Faster, Greener Way to Get Around\n\nPedalLink is Marston City's public bike-sharing system. With 1,200 bicycles at 90 stations, a bike is never far away, whether you are going to work, school, or the riverside park.\n\nGetting started is easy. Download the PedalLink app, choose a pass, and scan the code on any bike to unlock it. A one-day pass costs $2, and a yearly pass costs $30. Each ride of up to 60 minutes is included in your pass; extra time costs 50 cents per 15 minutes.\n\nWhen you finish, return the bike to any station and wait for the green light, which shows that the bike is locked.\n\nFound a flat tire or a broken brake? Report it in the app. Our repair team makes a __prompt__ visit, usually within two hours.\n\nHelmets are strongly recommended.","opts":["자전거 수리 기사를 모집하려고","자전거 도로의 신설 계획을 알리려고","자전거 안전모 착용 의무화를 알리려고","시의 공공 자전거 대여 서비스를 소개하려고"],"ans":3,"exp":"PedalLink가 시의 공공 자전거 공유 시스템이라는 것과 이용권, 빌리고 반납하는 방법, 고장 신고 방법을 알리는 글이므로 공공 자전거 대여 서비스를 소개하는 것이 목적이다. 수리 기사 모집이나 자전거 도로 신설에 대한 말은 없고, 안전모는 의무가 아니라 권장 사항이다."},
{"id":"e230","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 prompt의 의미와 가장 가까운 것은?\n\nPedalLink (Marston City Bike Share)\n\nA Faster, Greener Way to Get Around\n\nPedalLink is Marston City's public bike-sharing system. With 1,200 bicycles at 90 stations, a bike is never far away, whether you are going to work, school, or the riverside park.\n\nGetting started is easy. Download the PedalLink app, choose a pass, and scan the code on any bike to unlock it. A one-day pass costs $2, and a yearly pass costs $30. Each ride of up to 60 minutes is included in your pass; extra time costs 50 cents per 15 minutes.\n\nWhen you finish, return the bike to any station and wait for the green light, which shows that the bike is locked.\n\nFound a flat tire or a broken brake? Report it in the app. Our repair team makes a __prompt__ visit, usually within two hours.\n\nHelmets are strongly recommended.","opts":["immediate","official","cautious","repeated"],"ans":0,"exp":"신고하면 보통 두 시간 안에 수리 팀이 온다고 했으므로 prompt는 '지체 없는, 신속한'이라는 뜻이고 immediate(즉각적인)와 가장 가깝다. official(공식적인), cautious(조심스러운), repeated(되풀이되는)는 뜻이 다르다."},
{"id":"e231","subj":"영어","unit":"업무 웹페이지","q":"윗글의 내용과 일치하지 않는 것은?\n\nLakemont Food Safety Office\n\nKeeping Your Meals Safe\n\nThe Lakemont Food Safety Office works to make sure that food sold in our city is safe to eat. Our inspectors __conduct__ unannounced checks at more than 2,000 restaurants, school kitchens, and markets each year. They look at how food is stored, how clean the kitchen is, and whether workers wash their hands properly.\n\nAfter each check, a restaurant receives a grade of A, B, or C, which must be posted at its entrance. Places that receive a C are checked again within 30 days. You can also look up any restaurant's grade on our website.\n\nIf you become sick after eating out or notice unclean conditions, please let us know. Reports can be made online or by phone, and your name will be kept private.\n\nTogether, we can keep Lakemont's tables safe.","opts":["점검은 미리 알리지 않고 실시한다.","식당은 받은 등급을 입구에 게시해야 한다.","C 등급을 받은 곳은 30일 안에 다시 점검받는다.","신고한 사람의 이름은 해당 식당에 알려 준다."],"ans":3,"exp":"신고는 온라인이나 전화로 할 수 있고 신고자의 이름은 비공개로 한다(\"your name will be kept private\")고 했으므로 식당에 알려 준다는 말은 글과 다르다. 점검은 예고 없이(unannounced) 하고, 등급은 입구에 붙여야 하며, C를 받은 곳은 30일 안에 다시 점검한다."},
{"id":"e232","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 conduct의 의미와 가장 가까운 것은?\n\nLakemont Food Safety Office\n\nKeeping Your Meals Safe\n\nThe Lakemont Food Safety Office works to make sure that food sold in our city is safe to eat. Our inspectors __conduct__ unannounced checks at more than 2,000 restaurants, school kitchens, and markets each year. They look at how food is stored, how clean the kitchen is, and whether workers wash their hands properly.\n\nAfter each check, a restaurant receives a grade of A, B, or C, which must be posted at its entrance. Places that receive a C are checked again within 30 days. You can also look up any restaurant's grade on our website.\n\nIf you become sick after eating out or notice unclean conditions, please let us know. Reports can be made online or by phone, and your name will be kept private.\n\nTogether, we can keep Lakemont's tables safe.","opts":["behave","cancel","perform","transmit"],"ans":2,"exp":"점검관이 식당과 급식소를 예고 없이 점검한다는 문맥이므로 conduct는 '실시하다, 수행하다'라는 뜻이고 perform과 가장 가깝다. behave(처신하다)와 transmit(전도하다)은 conduct의 다른 뜻에서 떠올린 낱말이고, cancel(취소하다)은 문맥과 반대된다."},
{"id":"e233","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nKingsley Job Center\n\nYour Next Job Starts Here\n\nLooking for work can be stressful, but you do not have to do it alone. The Kingsley Job Center is a public service that helps residents of all ages find employment at no cost.\n\nOur career counselors meet with you one-on-one to review your résumé, practice interview questions, and match your skills with local employers. Last year, more than 3,000 job seekers used our services, and many of them were able to __secure__ a full-time position within three months.\n\nWe also offer:\n- Free computer and language courses\n- Monthly job fairs with over 50 employers\n- Special support for people over 50 and those returning to work after raising children\n\nDrop in any weekday between 9:00 a.m. and 6:00 p.m., or book a counseling session online. Bring a photo ID on your first visit.","opts":["to invite employers to a job fair","to introduce free help for job seekers","to advertise job openings at the center","to report last year's local employment figures"],"ans":1,"exp":"Kingsley Job Center가 주민의 구직을 무료로 돕는 공공 서비스라는 것과 상담, 강좌, 채용 박람회 등 제공하는 도움을 알리는 글이므로 구직자를 위한 무료 지원을 소개하는 것이 목적이다. 기업에 박람회 참가를 권하거나 센터 직원을 뽑는 글이 아니며, 작년 이용자 수는 서비스를 소개하려고 든 예일 뿐이다."},
{"id":"e234","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 secure의 의미와 가장 가까운 것은?\n\nKingsley Job Center\n\nYour Next Job Starts Here\n\nLooking for work can be stressful, but you do not have to do it alone. The Kingsley Job Center is a public service that helps residents of all ages find employment at no cost.\n\nOur career counselors meet with you one-on-one to review your résumé, practice interview questions, and match your skills with local employers. Last year, more than 3,000 job seekers used our services, and many of them were able to __secure__ a full-time position within three months.\n\nWe also offer:\n- Free computer and language courses\n- Monthly job fairs with over 50 employers\n- Special support for people over 50 and those returning to work after raising children\n\nDrop in any weekday between 9:00 a.m. and 6:00 p.m., or book a counseling session online. Bring a photo ID on your first visit.","opts":["fasten","obtain","protect","decline"],"ans":1,"exp":"구직자들이 석 달 안에 정규직 일자리를 '얻었다'는 문맥이므로 secure는 obtain(얻다)과 가장 가깝다. fasten(단단히 고정하다)과 protect(보호하다)는 secure의 다른 뜻이고, decline(거절하다)은 문맥과 반대된다."},
{"id":"e235","subj":"영어","unit":"업무 웹페이지","q":"윗글의 내용과 일치하는 것은?\n\nOpen Door Evening School (Tavenhill Education Office)\n\nIt Is Never Too Late to Learn\n\nMany adults had to leave school early to work or care for their families. The Open Door Evening School gives them a second chance to finish their education.\n\nThe school __runs__ middle and high school courses for adults aged 18 and over. Classes meet on weekday evenings from 6:30 to 9:30, so students can keep their daytime jobs. Tuition and textbooks are free, and a light dinner is served before class.\n\nStudents who complete a course receive a diploma equal to that of a regular school. Our oldest graduate last year was 78 years old.\n\nNew students are accepted twice a year, in March and September. No entrance exam is required; a short interview helps us place you in the right class.\n\nTake the first step. Visit us or call 555-0155.","opts":["Classes are held on weekend mornings.","Students have to pay for their textbooks.","New students are accepted twice a year.","Applicants must pass an entrance exam."],"ans":2,"exp":"\"New students are accepted twice a year, in March and September.\"라고 했으므로 신입생을 한 해에 두 번 받는다는 말이 일치한다. 수업은 평일 저녁에 있고, 수업료와 교과서는 무료이며, 입학시험 없이 짧은 면담만 한다."},
{"id":"e236","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 runs의 의미와 가장 가까운 것은?\n\nOpen Door Evening School (Tavenhill Education Office)\n\nIt Is Never Too Late to Learn\n\nMany adults had to leave school early to work or care for their families. The Open Door Evening School gives them a second chance to finish their education.\n\nThe school __runs__ middle and high school courses for adults aged 18 and over. Classes meet on weekday evenings from 6:30 to 9:30, so students can keep their daytime jobs. Tuition and textbooks are free, and a light dinner is served before class.\n\nStudents who complete a course receive a diploma equal to that of a regular school. Our oldest graduate last year was 78 years old.\n\nNew students are accepted twice a year, in March and September. No entrance exam is required; a short interview helps us place you in the right class.\n\nTake the first step. Visit us or call 555-0155.","opts":["flows","races","operates","escapes"],"ans":2,"exp":"학교가 성인을 위한 중·고등학교 과정을 '운영한다'는 문맥이므로 runs는 operates와 가장 가깝다. flows(흐르다), races(경주하다), escapes(달아나다)는 run의 다른 뜻이거나 거기서 떠올린 낱말로 이 문맥에 맞지 않는다."},
{"id":"e237","subj":"영어","unit":"업무 웹페이지","q":"윗글의 목적으로 가장 적절한 것은?\n\nReadyOak Alerts (Oakhaven County Emergency Services)\n\nKnow First, Act Fast\n\nWhen __severe__ weather, a wildfire, or a major road closure threatens Oakhaven County, minutes matter. ReadyOak Alerts sends warnings directly to your phone so that you and your family can act in time.\n\nSigning up is free and takes less than two minutes. Enter your phone number and up to three addresses, such as your home, your workplace, and your child's school. You will receive alerts only for the areas you choose. Messages are available as texts, voice calls, or emails.\n\nEach alert tells you what is happening, what you should do, and where to find shelter. We never send advertisements, and your information is not shared with anyone.\n\nLandline phones in the county are registered automatically, but mobile phones are not. Sign up today at any county library or on our website.","opts":["재난 대피소의 위치 변경을 알리려고","재난 경보 알림 서비스 가입을 권하려고","휴대전화 요금 할인 제도를 소개하려고","최근 발생한 산불의 피해 상황을 알리려고"],"ans":1,"exp":"악천후나 산불 같은 위험이 닥칠 때 휴대전화로 경보를 보내 주는 ReadyOak Alerts를 소개하고 \"Sign up today\"라고 가입을 권하는 글이다. 대피소 위치 변경, 휴대전화 요금 할인, 실제로 일어난 산불의 피해 상황은 글에 나오지 않는다."},
{"id":"e238","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 severe의 의미와 가장 가까운 것은?\n\nReadyOak Alerts (Oakhaven County Emergency Services)\n\nKnow First, Act Fast\n\nWhen __severe__ weather, a wildfire, or a major road closure threatens Oakhaven County, minutes matter. ReadyOak Alerts sends warnings directly to your phone so that you and your family can act in time.\n\nSigning up is free and takes less than two minutes. Enter your phone number and up to three addresses, such as your home, your workplace, and your child's school. You will receive alerts only for the areas you choose. Messages are available as texts, voice calls, or emails.\n\nEach alert tells you what is happening, what you should do, and where to find shelter. We never send advertisements, and your information is not shared with anyone.\n\nLandline phones in the county are registered automatically, but mobile phones are not. Sign up today at any county library or on our website.","opts":["extreme","strict","plain","mild"],"ans":0,"exp":"산불, 큰 도로 통제와 함께 지역을 위협하는 날씨를 말하므로 severe는 '극심한'이라는 뜻이고 extreme과 가장 가깝다. strict(엄격한)와 plain(꾸밈없는)은 severe의 다른 뜻이고, mild(온화한)는 반대말이다."},
{"id":"e239","subj":"영어","unit":"업무 웹페이지","q":"윗글의 내용과 일치하지 않는 것은?\n\nHomeCare Visit Program (Elmsworth Public Health Center)\n\nHealth Care That Comes to Your Door\n\nFor older residents who live alone, a trip to a clinic can be difficult. Through the HomeCare Visit Program, nurses from the Elmsworth Public Health Center visit them at home.\n\nDuring each visit, a nurse checks blood pressure and blood sugar, reviews the medicines the resident is taking, and looks for safety risks such as slippery floors. Nurses also take time to listen. If a resident has concerns about memory loss, poor appetite, or loneliness, the nurse works with doctors and social workers to __address__ them.\n\nThe program is free for residents aged 65 or older who live alone or have a chronic illness. Visits are made once a month, or more often when needed.\n\nFamily members and neighbors may apply on a resident's behalf. To apply, call 555-0191 or ask at any community service center.","opts":["Blood pressure is checked only during the first visit.","Nurses cooperate with doctors and social workers.","Eligible residents do not pay for the program.","A neighbor can apply for a resident."],"ans":0,"exp":"간호사는 방문할 때마다(\"During each visit\") 혈압과 혈당을 잰다고 했으므로 첫 방문 때에만 혈압을 잰다는 말은 글과 다르다. 간호사가 의사, 사회복지사와 함께 문제를 다루고, 대상 주민에게 무료이며, 가족이나 이웃이 대신 신청할 수 있다는 것은 모두 글과 일치한다."},
{"id":"e240","subj":"영어","unit":"업무 웹페이지","q":"문맥상 밑줄 친 address의 의미와 가장 가까운 것은?\n\nHomeCare Visit Program (Elmsworth Public Health Center)\n\nHealth Care That Comes to Your Door\n\nFor older residents who live alone, a trip to a clinic can be difficult. Through the HomeCare Visit Program, nurses from the Elmsworth Public Health Center visit them at home.\n\nDuring each visit, a nurse checks blood pressure and blood sugar, reviews the medicines the resident is taking, and looks for safety risks such as slippery floors. Nurses also take time to listen. If a resident has concerns about memory loss, poor appetite, or loneliness, the nurse works with doctors and social workers to __address__ them.\n\nThe program is free for residents aged 65 or older who live alone or have a chronic illness. Visits are made once a month, or more often when needed.\n\nFamily members and neighbors may apply on a resident's behalf. To apply, call 555-0191 or ask at any community service center.","opts":["mail","greet","locate","handle"],"ans":3,"exp":"기억력 저하, 식욕 부진, 외로움 같은 걱정거리를 의사, 사회복지사와 함께 '다루어 해결한다'는 문맥이므로 address는 handle(처리하다)과 가장 가깝다. mail(우편으로 보내다)과 greet(말을 걸다, 인사하다)는 address의 다른 뜻에서 떠올린 낱말이고, locate(위치를 찾다)는 뜻이 다르다."},
{"id":"e241","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: streetcare@hartwellcity.org\nFrom: j.moreno@zipmail.net\nDate: October 12, 2027\nSubject: Broken streetlights on Cedar Lane\n\nDear Street Maintenance Team,\n\nI am a resident of Cedar Lane in the Northside district. I am writing about the two streetlights in front of the Cedar Lane bus stop, which have been out for more than two weeks.\n\nMany students and elderly residents walk along this road after dark, and the sidewalk there is narrow and uneven. Last Friday evening, a neighbor of mine tripped and hurt her ankle because she could not see the curb.\n\nI reported the problem through the city's mobile app on September 28, but I have not received any reply. I would be grateful if you could send someone to fix the lights as soon as possible.\n\nI have attached two photos of the location.\n\nSincerely,\nJulia Moreno","opts":["가로등 수리를 요청하려고","버스 정류장 이전을 건의하려고","모바일 앱의 오류를 신고하려고","보도 정비 공사의 일정을 문의하려고"],"ans":0,"exp":"버스 정류장 앞 가로등 두 개가 2주 넘게 꺼져 있다고 알린 뒤 \"I would be grateful if you could send someone to fix the lights as soon as possible.\"이라고 했으므로 가로등 수리를 요청하는 글이다. 버스 정류장을 옮겨 달라거나 앱에 오류가 있다는 말은 없고, 보도 공사 일정을 묻지도 않았다."},
{"id":"e242","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: daniel.osei@zipmail.net\nFrom: recruit@millbrookhealth.org\nDate: March 3, 2027\nSubject: Community Health Worker position\n\nDear Mr. Daniel Osei,\n\nThank you for applying for the Community Health Worker position at the Millbrook County Health Department. We were impressed by your application and would like to meet you in person.\n\nYour interview has been arranged as follows:\n\nDate: Thursday, March 11\nTime: 2:00 p.m.\nPlace: Meeting Room B, 4th floor, Millbrook County Office\n\nThe interview will last about 30 minutes. Please bring a photo ID and a copy of your nursing assistant certificate. Parking is available behind the building.\n\nIf you cannot attend at this time, please reply to this email by March 8 so that we can find another time.\n\nWe look forward to meeting you.\n\nBest regards,\nHannah Reyes\nHuman Resources Team","opts":["to cancel an arranged interview","to ask for a letter of recommendation","to inform an applicant of an interview schedule","to announce the final result of a job application"],"ans":2,"exp":"지원에 감사한다는 말에 이어 \"Your interview has been arranged as follows\"라며 면접 날짜, 시간, 장소, 준비물을 알리고 있으므로 지원자에게 면접 일정을 알리는 글이다. 면접을 취소하는 것이 아니고, 추천서를 요구하거나 최종 합격 여부를 알리는 내용도 없다."},
{"id":"e243","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: healthedu@dorvalephc.org\nFrom: director@sunnyhilldaycare.net\nDate: February 16, 2027\nSubject: Handwashing class for our children\n\nDear Health Education Team,\n\nMy name is Karen Whitfield, and I am the director of Sunny Hill Daycare Center, which cares for 45 children aged three to six.\n\nI learned from your newsletter that nurses from your center visit schools to teach children how to wash their hands properly. Several of our children caught colds and stomach flu this winter, so we believe such a lesson would be very helpful.\n\nWould it be possible for one of your nurses to visit us and give a class in March? Any weekday morning between 10:00 and 11:30 would suit us, and we can prepare a room with sinks.\n\nPlease let me know if there are any forms we need to fill out.\n\nSincerely,\nKaren Whitfield","opts":["보건소 소식지 구독을 신청하려고","어린이집 방문 손 씻기 교육을 요청하려고","어린이집의 감염병 집단 발생을 신고하려고","보건 교육을 맡을 강사 자리에 지원하려고"],"ans":1,"exp":"보건소 간호사가 학교를 찾아가 손 씻기를 가르친다는 것을 알게 되었다며 \"Would it be possible for one of your nurses to visit us and give a class in March?\"라고 묻고 있으므로 어린이집에 와서 손 씻기 교육을 해 달라고 요청하는 글이다. 소식지는 교육을 알게 된 경로일 뿐이고, 아이들이 감기와 장염에 걸렸다는 말은 교육이 필요한 이유이지 신고가 아니다."},
{"id":"e244","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: tours@clearbrookwater.org\nFrom: p.nakamura@eastfieldms.net\nDate: April 5, 2027\nSubject: Class visit in May\n\nDear Tour Coordinator,\n\nI teach science at Eastfield Middle School. My second-year students are studying how cities provide clean drinking water, and I would like them to see the process with their own eyes.\n\nI am writing to ask whether a group of 28 students and three teachers could tour the Clearbrook Water Treatment Plant in May. We would prefer a Tuesday or Thursday morning, but we can adjust our schedule to yours.\n\nI would also like to know how long the tour takes and whether the students need to wear any safety equipment.\n\nIf a tour is possible, I will send you the list of participants right away.\n\nThank you for considering our request. I look forward to your reply.\n\nBest regards,\nPaul Nakamura","opts":["to request a group tour of a facility","to change the date of a reserved tour","to invite a speaker to a science class","to complain about the quality of tap water"],"ans":0,"exp":"\"I am writing to ask whether a group of 28 students and three teachers could tour the Clearbrook Water Treatment Plant in May.\"에서 학생들의 정수장 단체 견학을 요청하는 목적이 드러난다. 아직 예약한 견학이 없으므로 날짜 변경이 아니고, 강사를 초청하거나 수돗물 품질에 불만을 말하는 내용도 없다."},
{"id":"e245","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: m.fischer@zipmail.net\nFrom: appointments@brightwellmc.org\nDate: June 14, 2027\nSubject: Your appointment on June 22\n\nDear Ms. Maria Fischer,\n\nThis message is about your appointment with Dr. Alan Pierce at the Eye Clinic of Brightwell Medical Center, which was scheduled for Tuesday, June 22, at 10:30 a.m.\n\nUnfortunately, Dr. Pierce will be away at a medical conference that week, and the clinic cannot see his patients on that day. We are sorry for the trouble this may cause.\n\nWe have moved your appointment to Tuesday, June 29, at the same time. If the new date does not suit you, please call us at 555-0134 or choose another time through our patient app.\n\nYour prescription remains valid until your next visit, so you do not need to do anything about your eye drops.\n\nKind regards,\nAppointment Desk","opts":["병원 예약 앱의 사용법을 안내하려고","새로 부임한 안과 의사를 소개하려고","처방전의 유효 기간이 끝났음을 알리려고","진료 예약 날짜가 변경되었음을 알리려고"],"ans":3,"exp":"담당 의사가 학회에 가서 6월 22일에 진료할 수 없으므로 \"We have moved your appointment to Tuesday, June 29\"라고 알리는 글이므로 진료 예약 날짜가 바뀌었음을 알리는 것이 목적이다. 예약 앱은 다른 시간을 고르는 방법으로 잠깐 나올 뿐이고, 새 의사 소개는 없으며, 처방전은 다음 진료 때까지 유효하다고 했다."},
{"id":"e246","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: complaints@penrosedistrict.org\nFrom: s.lindgren@zipmail.net\nDate: September 13, 2027\nSubject: Night noise from the Harbor Road site\n\nDear Environmental Affairs Officer,\n\nI live in Bayview Apartments, right across from the construction site on Harbor Road. For the past ten days, workers have been using heavy machines there until almost midnight.\n\nThe noise makes it impossible for my family to sleep. My two children have to get up early for school, and my elderly mother is recovering from surgery. I understand that the new building must be finished on schedule, but residents should not suffer every night.\n\nI am asking your office to visit the site, measure the noise level, and have the company stop work after 8:00 p.m. Twenty of my neighbors feel the same way and have signed the attached letter.\n\nYours faithfully,\nSofia Lindgren","opts":["to apply for a job at a construction site","to ask when a new building will be completed","to demand limits on late-night construction noise","to thank an officer for measuring noise at the site"],"ans":2,"exp":"공사장에서 자정 가까이 중장비를 써서 잠을 잘 수 없다고 호소한 뒤 현장을 찾아 소음을 재고 오후 8시 이후에는 작업을 멈추게 해 달라고 요구하므로 심야 공사 소음을 규제해 달라는 글이다. 공사장 일자리나 완공 시기를 묻는 내용은 없고, 소음 측정은 아직 이루어지지 않아 감사할 일이 아니다."},
{"id":"e247","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: All Staff\nFrom: Safety Office (safety@norhavencityhall.org)\nDate: May 17, 2027\nSubject: Fire safety training next week\n\nDear Colleagues,\n\nThis is a reminder that the annual fire safety training will take place next week. All employees, including part-time staff, are required to attend one session.\n\nSession 1: Tuesday, May 25, 10:00 a.m. – 11:30 a.m.\nSession 2: Thursday, May 27, 3:00 p.m. – 4:30 p.m.\nPlace: Main Auditorium, 1st floor\n\nThe training will cover how to use a fire extinguisher, how to help visitors leave the building, and where to gather outside. Firefighters from Norhaven Fire Station will lead a hands-on practice.\n\nPlease sign up for one of the sessions on the staff website by Friday, May 21. Those who cannot attend either session should contact our office.\n\nThank you for your cooperation.\n\nSafety Office","opts":["소화기 교체 작업 일정을 알리려고","소방 교육을 맡을 강사를 추천받으려고","직원 소방 안전 교육 참석을 안내하려고","청사에서 일어난 화재의 원인을 보고하려고"],"ans":2,"exp":"다음 주에 연례 소방 안전 교육이 있고 모든 직원이 두 회차 가운데 하나에 참석해야 한다며 일정, 장소, 신청 방법을 알리고 있으므로 직원에게 소방 안전 교육 참석을 안내하는 글이다. 소화기는 교육 내용(사용법)으로 나올 뿐이고, 강사는 소방서 소방관으로 이미 정해져 있으며, 실제 화재에 대한 말은 없다."},
{"id":"e248","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: help@cityhopcard.com\nFrom: t.alvarez@zipmail.net\nDate: January 21, 2027\nSubject: Charged twice on Bus 7\n\nDear Customer Service,\n\nI am writing about a problem with my CityHop transit card (card number ending in 4821).\n\nOn the morning of January 18, I took Bus 7 from Garden Square to City Hospital. When I tapped my card, the reader made an error sound, so the driver told me to tap again. Later, I checked my account and found that the fare of $1.50 had been taken twice, at 8:12 and 8:13 a.m.\n\nI believe the second payment was a mistake. Could you please check the record and return $1.50 to my card?\n\nI have attached a screenshot of my payment history. If you need any other information, please let me know.\n\nThank you for your help.\n\nSincerely,\nTomas Alvarez","opts":["to report a lost transit card","to request a refund of a double charge","to complain about a bus driver's attitude","to ask how to check one's payment history"],"ans":1,"exp":"버스 요금 1.50달러가 두 번 빠져나간 것을 확인했다며 \"Could you please check the record and return $1.50 to my card?\"라고 했으므로 이중으로 결제된 요금의 환불을 요청하는 글이다. 카드를 잃어버린 것이 아니고, 기사는 다시 대라고 안내했을 뿐 불만의 대상이 아니며, 결제 내역은 이미 확인해 화면을 첨부했다."},
