{"id":"e249","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: e.brandt@lakemerehospital.org\nFrom: wellness@fernbrooksenior.org\nDate: July 6, 2027\nSubject: Healthy Aging Seminar in September\n\nDear Ms. Elena Brandt,\n\nI am the program manager of the Fernbrook Senior Welfare Center. Several of our members attended your talk on preventing falls at Lakemere Hospital last spring, and they still speak highly of it.\n\nWe are planning a Healthy Aging Seminar on Friday, September 10, and we would be honored if you could speak to our members on the same topic. About 80 seniors are expected to attend. A talk of around 40 minutes, followed by questions, would be ideal.\n\nWe can offer a speaker's fee and will arrange transportation for you.\n\nCould you let us know by the end of July whether you are available? I would be happy to discuss the details by phone.\n\nWarm regards,\nOwen Gallagher","opts":["세미나에서 강연해 줄 것을 부탁하려고","낙상 예방 강연에 참석을 신청하려고","세미나 일정이 연기되었음을 알리려고","지난 강연의 강사료 지급을 문의하려고"],"ans":0,"exp":"9월 10일에 여는 세미나에서 낙상 예방을 주제로 강연해 주면 영광이겠다(\"we would be honored if you could speak to our members\")고 하고 가능한지 알려 달라고 했으므로 강연을 부탁하는 글이다. 강연을 들으려고 신청하는 것이 아니고, 일정 연기에 대한 말은 없으며, 강사료는 이번 강연에 드리겠다고 제안한 것이다."},
{"id":"e250","subj":"영어","unit":"업무 이메일","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: r.haddad@zipmail.net\nFrom: billing@silvermerewater.org\nDate: November 8, 2027\nSubject: Your October water bill\n\nDear Mr. Rami Haddad,\n\nWe are writing to let you know that the water bill we sent you on November 1 contained an error.\n\nBecause of a problem in our new meter-reading system, your October usage was recorded as 41 cubic meters instead of 14. As a result, you were charged $68.40 when the correct amount is $23.90. We sincerely apologize for this mistake.\n\nA corrected bill is attached to this email. If you have already paid the earlier amount, the difference of $44.50 will be taken off your next bill automatically. You do not need to contact us or fill out any form.\n\nThe same error affected about 300 households, and all of their bills have been corrected.\n\nSincerely,\nBilling Office","opts":["to announce an increase in water rates","to ask a customer to read the water meter","to remind a customer of an overdue payment","to inform a customer of a corrected water bill"],"ans":3,"exp":"11월 1일에 보낸 수도 요금 고지서에 오류가 있었다고 알리고 사과한 뒤 \"A corrected bill is attached to this email.\"이라고 했으므로 고지서를 바로잡았음을 알리는 글이다. 요금 인상을 알리는 것이 아니고, 계량기 검침을 부탁하거나 밀린 요금을 독촉하는 내용도 없다."},
{"id":"e251","subj":"영어","unit":"업무 안내문","q":"다음 글의 Stop Smoking Clinic에 대한 내용과 일치하지 않는 것은?\n\nStop Smoking Clinic\nCorbridge Public Health Center\n\nThinking about quitting? You are far more likely to succeed with support. Our Stop Smoking Clinic offers a free six-month program for anyone who lives or works in Corbridge.\n\nWhat we provide:\n■ A one-on-one meeting with a counselor on your first visit\n■ A breath test to measure carbon monoxide\n■ Nicotine patches or gum for up to twelve weeks\n■ Follow-up text messages and phone calls\n\nThose who stay smoke-free for six months receive a small gift.\n\nClinic hours: Monday – Friday, 9:00 a.m. – 6:00 p.m. (open until 8:00 p.m. on Wednesdays)\n\nNo appointment is needed for your first visit, but please bring a photo ID. Teenagers under 19 must come with a parent or guardian.\n\nOur counselors also visit workplaces with ten or more smokers on request.","opts":["Corbridge에서 일하는 사람도 이용할 수 있다.","니코틴 패치나 껌을 최대 12주 동안 제공한다.","수요일에는 오후 8시까지 운영한다.","첫 방문 때에는 반드시 예약해야 한다."],"ans":3,"exp":"\"No appointment is needed for your first visit\"라고 했으므로 첫 방문 때 반드시 예약해야 한다는 말은 글과 다르다. Corbridge에 살거나 일하는 사람이면 누구나 이용할 수 있고, 니코틴 패치나 껌은 최대 12주 동안 주며, 수요일에는 오후 8시까지 연다."},
{"id":"e252","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nRoad Resurfacing on Mill Avenue\n\nThe Thornbury Public Works Department will resurface Mill Avenue between Station Road and Park Lane.\n\nWork period: Monday, May 10 – Friday, May 21\nWork hours: 9:00 p.m. – 5:00 a.m. (no work on Saturdays and Sundays)\n\nWork will be done at night to reduce traffic delays. Please expect the following:\n■ One lane in each direction will remain open at all times.\n■ On-street parking on Mill Avenue will be prohibited from 8:00 p.m. during the work period. Vehicles left on the street will be towed.\n■ Bus stops will not be moved.\n■ There may be noise and a smell of fresh asphalt near the work area.\n\nDriveways to homes and shops will stay open, but short waits may occur.\n\nThe schedule may change in case of rain. Updates will be posted on the department's website.\n\nInquiries: 555-0186","opts":["The road work will be carried out during the night.","Mill Avenue will be closed to all traffic during work hours.","On-street parking is not allowed after 8:00 p.m. during the work period.","Rainy weather may lead to changes in the work schedule."],"ans":1,"exp":"공사 중에도 방향마다 한 차로는 항상 열어 둔다(\"One lane in each direction will remain open at all times\")고 했으므로 작업 시간에 모든 차량의 통행이 막힌다는 말은 글과 다르다. 작업은 밤 9시부터 새벽 5시까지 하고, 공사 기간에는 오후 8시부터 길가 주차가 금지되며, 비가 오면 일정이 바뀔 수 있다."},
{"id":"e253","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하는 것은?\n\nElevator Replacement Notice\nHalden Government Complex, Building A\n\nThe two passenger elevators in Building A are more than 25 years old and will be replaced with new, energy-saving models.\n\nSchedule:\nElevator 1: July 5 – July 30\nElevator 2: August 2 – August 27\n\nDuring the work, please note:\n• Waiting times will be longer, especially between 8:30 and 9:30 a.m. Visitors going to the 2nd or 3rd floor are asked to use the stairs.\n• Priority will be given to wheelchair users, older adults, and people with strollers.\n• The freight elevator at the back entrance is for deliveries only.\n• Counters for the most visited services will be moved to the 1st-floor lobby in July and August.\n\nStaff in yellow vests will be available in the lobby to guide you. We apologize for the inconvenience.","opts":["The two elevators will be replaced one after the other.","All visitors are asked to use the stairs during the work.","Visitors may use the freight elevator when lines are long.","The busiest service counters will be moved to the 2nd floor."],"ans":0,"exp":"1호기는 7월 5일부터 30일까지, 2호기는 8월 2일부터 27일까지 교체하므로 두 대를 차례로 바꾼다는 말이 일치한다. 계단을 이용해 달라는 요청은 2층이나 3층으로 가는 방문객에게만 한 것이고, 화물용 승강기는 배달 전용이며, 방문이 많은 창구는 1층 로비로 옮긴다."},
{"id":"e254","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nRiverside Night Market\n\nEnjoy food, music, and handmade goods under the stars!\n\nWhen: Every Friday and Saturday, June 4 – August 28, 6:00 p.m. – 11:00 p.m.\nWhere: Riverside Park, between Stone Bridge and the boat dock\n\nWhat to expect:\n• Over 60 food trucks and craft stalls\n• Live music on the main stage from 7:30 p.m.\n• A fireworks show on the opening and closing nights only\n\nAdmission is free. Most stalls accept cards, but some take cash only.\n\nGetting there: Parking is limited, so please use public transportation. A free shuttle bus runs every 15 minutes from Riverside Station.\n\nTo keep the park clean, bring your own cup and get $1 off any drink. Pets on a leash are welcome.\n\nThe market will be canceled in case of heavy rain. Check our social media page for updates.","opts":["The market is held two evenings a week.","Live music begins after the market opens.","Fireworks are set off every night of the market.","A free shuttle bus leaves from Riverside Station."],"ans":2,"exp":"불꽃놀이는 개장일과 폐장일 밤에만(\"on the opening and closing nights only\") 한다고 했으므로 장이 서는 날마다 한다는 말은 글과 다르다. 야시장은 매주 금요일과 토요일에 열리고, 장은 오후 6시에 열리며 공연은 7시 30분에 시작하고, 무료 셔틀버스가 Riverside Station에서 다닌다."},
{"id":"e255","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하는 것은?\n\nSchool Crossing Guards Wanted\nEllery City Education Office\n\nHelp children get to school safely! We are hiring crossing guards for twelve elementary schools for the new school year.\n\nWork period: March 2 – December 23 (no work during school holidays)\nHours: 8:00 – 9:00 a.m. and 1:30 – 3:30 p.m. on school days\nPay: $16 per hour\n\nWho can apply:\n■ Ellery residents aged 20 to 70\n■ Those able to stand outdoors for long periods\n■ Parents of children at the schools are welcome.\n\nA bright vest, a stop sign, and rain gear will be provided. All new guards must complete a four-hour safety course before starting.\n\nTo apply, send the application form by email (guards@elleryedu.org) by February 5. A health check certificate is required only from successful applicants.","opts":["학교 방학 기간에도 근무한다.","하루에 모두 세 시간 근무한다.","조끼와 정지 표지판은 본인이 준비해야 한다.","지원자는 모두 건강 검진 증명서를 내야 한다."],"ans":1,"exp":"근무 시간은 오전 8시부터 9시까지 한 시간과 오후 1시 30분부터 3시 30분까지 두 시간이므로 하루에 모두 세 시간이다. 방학에는 근무하지 않고, 조끼와 정지 표지판, 비옷은 지급하며, 건강 검진 증명서는 합격한 사람만 낸다."},
{"id":"e256","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nWelcome to Harborview Public Pool\n\nFor everyone's safety and comfort, please follow these rules.\n\nBefore you swim\n■ Take a shower before entering the water.\n■ Swim caps are required for all swimmers. Caps can be bought at the front desk for $2.\n■ Leave your shoes in a locker. Lockers need a $1 coin, which is returned after use.\n\nIn the pool\n■ Children under 8 must be with an adult in the water at all times.\n■ No running or pushing. Diving is allowed only in the deep pool during lessons.\n■ Lanes 1 and 2 are reserved for slow swimmers.\n■ Food and glass bottles are not allowed in the pool area. Water in plastic bottles is fine.\n\nAll swimmers must leave the water for a ten-minute safety break every hour.\n\nOpen daily 6:00 a.m. – 9:00 p.m. Closed on the second Monday of each month.","opts":["Swimmers without a cap can buy one at the front desk.","The coin put into a locker is given back after use.","Water in plastic bottles may be brought into the pool area.","The pool is closed to swimmers on every Monday of the month."],"ans":3,"exp":"수영장은 매일 열고 매달 둘째 월요일에만 쉰다고 했으므로 월요일마다 쉰다는 말은 글과 다르다. 수영모는 안내 데스크에서 2달러에 살 수 있고, 사물함에 넣은 1달러 동전은 쓰고 나면 돌려받으며, 플라스틱 병에 담은 물은 가지고 들어갈 수 있다."},
{"id":"e257","subj":"영어","unit":"업무 안내문","q":"다음 글에서 Maple Grove Animal Care Center에 대한 내용과 일치하는 것은?\n\nMaple Grove Animal Care Center\n\nThe Maple Grove Animal Care Center is the city's only public shelter for lost and abandoned animals. Each year we take in about 1,500 dogs and cats and work to return them to their owners or find them new homes.\n\nWhat we do\n- Lost and found: Animals brought to the center are kept for ten days while we search for their owners. Photos are posted on our website within 24 hours.\n- Adoption: Animals are examined by a veterinarian, vaccinated, and microchipped before adoption. The adoption fee is $40 for dogs and $25 for cats.\n- Education: We visit schools to teach children how to care for pets responsibly.\n\nAdopters must be at least 19 years old and attend a one-hour class before taking an animal home.\n\nVisiting hours: Tuesday – Sunday, 1:00 p.m. – 5:00 p.m.","opts":["It is one of several public animal shelters in the city.","It keeps lost animals for a month while looking for owners.","It charges the same adoption fee for dogs and cats.","It requires adopters to take a class before adoption."],"ans":3,"exp":"입양하려는 사람은 동물을 데려가기 전에 한 시간짜리 교육을 받아야 한다고 했으므로 입양 전 교육을 요구한다는 말이 일치한다. 이곳은 시에 하나뿐인(only) 공공 보호소이고, 들어온 동물은 주인을 찾는 열흘 동안 보호하며, 입양비는 개 40달러, 고양이 25달러로 다르다."},
{"id":"e258","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하는 것은?\n\nUsing the Reading Room\nWexmoor City Archives\n\nThe Wexmoor City Archives keeps the city's official records, maps, and photographs. Anyone may view them in the Reading Room free of charge.\n\nHours: Monday – Friday, 9:30 a.m. – 4:30 p.m.\n\nHow to use the Reading Room\n1. Register at the front desk with a photo ID. A visitor card is issued on the spot.\n2. Request materials using the computers in the lobby. Up to five items may be requested at a time, and requests close at 3:30 p.m.\n3. Put your bags and coats in a free locker. Only pencils, notebooks, and laptops may be taken inside.\n\nHandling the records\n■ Wear the gloves provided when touching photographs.\n■ Photos may be taken without flash for personal study.\n■ Copies cost 20 cents per page.\n\nMaterials may not be taken out of the room.","opts":["열람실은 주말에도 이용할 수 있다.","자료는 한 번에 다섯 점까지 신청할 수 있다.","열람실 안에서 펜으로 필기할 수 있다.","자료를 사진으로 찍는 것은 금지된다."],"ans":1,"exp":"\"Up to five items may be requested at a time\"이라고 했으므로 자료를 한 번에 다섯 점까지 신청할 수 있다는 말이 일치한다. 열람실은 월요일부터 금요일까지만 열고, 안에는 연필, 공책, 노트북만 가지고 들어갈 수 있어 펜은 쓸 수 없으며, 개인 연구를 위한 사진은 플래시 없이 찍을 수 있다."},
{"id":"e259","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nCitywide Earthquake Drill\n\nThe City of Verano will hold its annual earthquake drill so that everyone knows what to do when the ground shakes.\n\nDate: Wednesday, October 20\nTime: 2:00 p.m. – 2:20 p.m.\n\nWhat will happen:\n■ At 2:00 p.m., sirens will sound for one minute and a test alert will be sent to mobile phones.\n■ People indoors should get under a sturdy table and hold on until the siren stops.\n■ After the siren, walk to the nearest open space using the stairs. Do not use elevators.\n■ Drivers should pull over to the right side of the road for five minutes. Subway trains will run as usual.\n\nSchools and public offices must take part. Shops and private companies are encouraged to join. Hospitals will operate as usual.\n\nThis is only a drill. Please do not call the emergency number about the sirens.","opts":["사이렌은 오후 2시부터 1분 동안 울린다.","실내에서는 사이렌이 멈출 때까지 탁자 밑에 있어야 한다.","지하철은 훈련 시간 동안 운행을 멈춘다.","상점과 민간 기업은 반드시 참여해야 하는 것은 아니다."],"ans":2,"exp":"\"Subway trains will run as usual.\"이라고 했으므로 지하철이 훈련 시간에 운행을 멈춘다는 말은 글과 다르다. 사이렌은 1분 동안 울리고, 실내에서는 사이렌이 멈출 때까지 튼튼한 탁자 밑에서 버티며, 의무 참여 대상은 학교와 관공서이고 상점과 민간 기업은 참여를 권장할 뿐이다."},
{"id":"e260","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하는 것은?\n\nFree Legal Advice Day\nDunmore District Office\n\nDo you have a legal question but worry about the cost of a lawyer? Volunteer lawyers offer free advice to Dunmore residents.\n\nWhen: The first and third Wednesday of every month, 2:00 p.m. – 5:00 p.m.\nWhere: Consultation Room, 1st floor, Dunmore District Office\n\nTopics covered: housing contracts, unpaid wages, family matters, traffic accidents, and inheritance\n\nHow it works:\n• Each session lasts 20 minutes and is completely private.\n• Reservations are required. Book by phone (555-0170) or at the information desk at least two days ahead.\n• Each resident may have one session per month.\n• Bring any related papers, such as contracts or letters.\n\nPlease note that the lawyers give advice only. They do not write legal documents or represent you in court.\n\nSign language interpretation is available if requested when booking.","opts":["Legal advice is offered every Wednesday.","Residents can get advice without a reservation.","A resident may have one session a month.","The lawyers write legal documents on request."],"ans":2,"exp":"\"Each resident may have one session per month.\"이라고 했으므로 한 사람이 한 달에 한 번 상담받을 수 있다는 말이 일치한다. 상담은 매달 첫째와 셋째 수요일에만 있고, 예약이 꼭 필요하며, 변호사는 조언만 할 뿐 법률 문서를 써 주지 않는다."},
{"id":"e261","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nE-Waste Collection Day\n\nDon't throw old electronics in the trash! Bring them to our collection event, and we will recycle them safely.\n\nDate: Saturday, November 13\nTime: 9:00 a.m. – 2:00 p.m.\nPlace: North parking lot, Kelby City Stadium (enter from Grant Street)\n\nWe accept:\n■ Computers, monitors, and printers\n■ Mobile phones and chargers\n■ Small kitchen appliances such as toasters and microwaves\n\nWe do NOT accept:\n■ Refrigerators and air conditioners\n■ Light bulbs and loose batteries\n\nThe event is free for Kelby households, with a limit of ten items per car. Businesses may not use this service. Please stay in your car; our staff will unload the items for you.\n\nPersonal data on computers and phones should be erased beforehand. For a fee of $5, hard drives can be destroyed on site.\n\nHosted by Kelby City Environment Office","opts":["Microwaves can be dropped off at the event.","Loose batteries are not collected at the event.","Each car may bring up to ten items.","Hard drives are destroyed on site at no cost."],"ans":3,"exp":"하드 드라이브는 5달러를 내면 현장에서 파기해 준다(\"For a fee of $5\")고 했으므로 무료로 파기해 준다는 말은 글과 다르다. 전자레인지는 받는 품목에, 낱개 건전지는 받지 않는 품목에 들어 있고, 차 한 대에 열 개까지만 가져올 수 있다."},
{"id":"e262","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하는 것은?\n\nNight Owl Bus Service Begins\n\nStarting Friday, March 5, Tresco City Transit will operate two Night Owl bus routes for people who travel late at night.\n\nRoutes\nN1: Central Station – University Hospital – Eastgate Terminal\nN2: Central Station – Harbor Market – South Industrial Park\n\nService hours: 11:30 p.m. – 4:00 a.m., every 30 minutes\nOperating days: Daily, including public holidays\n\nFares: $2.00 with a transit card / $2.50 in cash\nTransfers to another Night Owl bus are free within 30 minutes; transfers to the subway are not free.\n\nFor your safety:\n■ Every bus has security cameras and an emergency button beside each door.\n■ Between stops, passengers may ask the driver to let them off at a safe place closer to home.\n\nNight Owl buses stop only at stops marked with a blue owl sign. See route maps in the Tresco Transit app.","opts":["Night Owl buses do not run on public holidays.","The buses run at 30-minute intervals.","Paying in cash is cheaper than using a transit card.","Passengers can transfer to the subway for free."],"ans":1,"exp":"운행 시간에 \"every 30 minutes\"라고 했으므로 30분 간격으로 다닌다는 말이 일치한다. 버스는 공휴일을 포함해 매일 다니고, 요금은 현금이 2.50달러로 교통카드(2.00달러)보다 비싸며, 무료 환승은 다른 Night Owl 버스로 갈아탈 때만 되고 지하철 환승은 무료가 아니다."},
{"id":"e263","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nWinter Coding Camp for Teens\nBrannock Youth Center\n\nSpend your winter break building your own game! No coding experience is needed.\n\nDates: January 10 – January 21 (Monday to Friday)\nTime: 10:00 a.m. – 1:00 p.m.\nPlace: Media Lab, Brannock Youth Center\nFor: Middle school students living in Brannock (24 places)\n\nProgram:\nWeek 1 – Learning the basics of coding with block-based tools\nWeek 2 – Designing and building a simple game in teams of four\n\nOn the last day, teams will present their games to parents, and the best team will receive a prize.\n\nFee: $20 (covers snacks and a camp T-shirt). Laptops are provided, so participants do not need to bring their own.\n\nApply online from December 6 to December 17. If more than 24 students apply, participants will be chosen by lottery.","opts":["코딩을 배운 적이 있는 학생만 참가할 수 있다.","둘째 주에는 네 명씩 팀을 이루어 게임을 만든다.","참가비에 간식과 티셔츠 값이 들어 있다.","신청자가 정원보다 많으면 추첨으로 참가자를 정한다."],"ans":0,"exp":"\"No coding experience is needed.\"라고 했으므로 코딩을 배운 적이 있는 학생만 참가할 수 있다는 말은 글과 다르다. 둘째 주에는 네 명이 한 팀이 되어 게임을 만들고, 참가비 20달러에 간식과 티셔츠가 포함되며, 신청자가 24명을 넘으면 추첨으로 뽑는다."},
{"id":"e264","subj":"영어","unit":"업무 안내문","q":"다음 글의 내용과 일치하지 않는 것은?\n\nInterpreter Services for Patients\nCalloway University Hospital\n\nClear communication is part of good care. Patients who are not comfortable speaking English can ask for a medical interpreter at no charge.\n\nLanguages: In-person interpreters are available in Spanish, Chinese, Vietnamese, and Arabic. For over 40 other languages, we use video interpretation on a tablet.\n\nHours: In-person interpreters work on weekdays from 8:00 a.m. to 6:00 p.m. Video interpretation is available 24 hours a day.\n\nHow to request:\n■ Tell the staff when you make an appointment, or ask at the International Desk on the 1st floor.\n■ For planned visits, please request an in-person interpreter at least three days in advance.\n\nFor your safety, family members under 18 should not interpret medical information. Interpreters keep everything they hear private. They help with consent forms and discharge instructions, but they cannot give medical advice.","opts":["Patients have to pay a small fee to use a medical interpreter.","Video interpretation is offered to patients at any hour of the day.","In-person interpreters for planned visits should be requested at least three days ahead.","Interpreters are not allowed to give patients medical advice."],"ans":0,"exp":"의료 통역은 무료로(\"at no charge\") 요청할 수 있다고 했으므로 통역을 쓰려면 요금을 내야 한다는 말은 글과 다르다. 영상 통역은 24시간 이용할 수 있고, 예정된 진료에 대면 통역이 필요하면 적어도 사흘 전에 요청해야 하며, 통역사는 의학적 조언을 할 수 없다."},
{"id":"e265","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe community health survey ______ by the city last spring, covering more than three thousand households, has revealed that nearly half of the elderly residents live alone.","opts":["conducts","conducted","conducting","was conducted"],"ans":1,"exp":"문장의 동사는 has revealed이므로 빈칸에는 주어 The community health survey를 뒤에서 꾸미는 말이 와야 한다. 조사는 시가 \"실시한\" 대상이므로 수동의 과거분사 conducted가 알맞다. conducts와 was conducted는 동사가 하나 더 생겨 틀리고, conducting은 능동이라 by the city와 맞지 않는다."},
{"id":"e266","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe number of residents who visit the public health center for free blood pressure checks ______ steadily since the new evening hours were introduced last year.","opts":["has increased","have increased","increasing","to increase"],"ans":0,"exp":"주어의 중심은 The number(~의 수)이므로 단수로 받고, \"since + 과거 시점\"이 있으므로 현재완료 has increased가 알맞다. have increased는 바로 앞의 복수 명사에 이끌린 꼴로 수가 맞지 않고, increasing과 to increase는 문장의 동사가 될 수 없다."},
{"id":"e267","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe city has opened a new counseling center ______ residents suffering from stress or depression can talk with trained professionals free of charge on weekday evenings.","opts":["which","what","where","whom"],"ans":2,"exp":"빈칸 뒤가 주어(residents), 동사(can talk), 전치사구를 다 갖춘 완전한 절이고 선행사가 장소(a new counseling center)이므로 관계부사 where가 알맞다. which와 whom은 뒤에 주어나 목적어가 빠진 절이 와야 하고, what은 선행사를 가질 수 없다."},
{"id":"e268","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMany residents are looking forward to ______ the new riverside park, which is scheduled to open next month after three years of construction and repeated delays.","opts":["visit","visiting","visited","be visited"],"ans":1,"exp":"look forward to의 to는 to부정사의 to가 아니라 전치사이므로 뒤에 동명사가 온다. 주민들이 공원을 \"방문하는\" 것이므로 능동의 visiting이 알맞다. visit과 be visited는 동사원형이어서 전치사 뒤에 올 수 없고, visited도 전치사의 목적어가 될 수 없다."},
{"id":"e269","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\n______ the new bus route has shortened commuting times considerably, many elderly residents in the district complain that the stops are now located too far from their homes.","opts":["Although","Because","Unless","Despite"],"ans":0,"exp":"통근 시간이 줄었다는 좋은 점과 정류장이 멀어졌다는 불만이 대조되므로 \"~이지만\"이라는 양보의 접속사 Although가 알맞다. Because(~ 때문에)와 Unless(~하지 않으면)는 뜻이 이어지지 않고, Despite는 뜻은 비슷해도 전치사여서 뒤에 절이 올 수 없다."},
{"id":"e270","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe accident could have been prevented if the driver ______ the warning signs that had been placed along the road several hundred meters before the construction site.","opts":["notices","noticed","had noticed","has noticed"],"ans":2,"exp":"주절이 \"could have + 과거분사\"(could have been prevented)이므로 과거 사실과 반대되는 일을 가정하는 가정법 과거완료이다. if절에는 \"had + 과거분사\"인 had noticed를 쓴다. noticed는 가정법 과거의 꼴이고, notices와 has noticed는 가정법의 if절에 쓰지 않는다."},
{"id":"e271","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nAccording to the notice, the old water pipes in the apartment complex need ______ before winter, and residents should expect several short interruptions in the water supply.","opts":["replace","to replace","being replaced","to be replaced"],"ans":3,"exp":"주어 the old water pipes는 \"교체되는\" 대상이므로 need 뒤에 수동의 to부정사 to be replaced가 와야 한다. to replace는 수도관이 무엇인가를 교체한다는 능동의 뜻이 되어 틀리고, 동사원형 replace는 일반동사 need 뒤에 바로 올 수 없다. need 뒤에 동명사를 쓸 때는 need replacing처럼 능동 꼴로 수동의 뜻을 나타내므로 being replaced도 쓰지 않는다."},
{"id":"e272","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe documents that the applicant submitted to the district office last Friday ______ several serious errors, so she was asked to correct them and apply again the following week.","opts":["contained","containing","to contain","was contained"],"ans":0,"exp":"that ~ last Friday는 주어 The documents를 꾸미는 관계절이고 so 앞 절에는 아직 동사가 없으므로 빈칸에는 문장의 동사가 필요하다. 서류가 오류를 \"담고 있었다\"는 능동이므로 contained가 알맞다. containing과 to contain은 동사가 될 수 없고, was contained는 수동인 데다 복수 주어와 수도 맞지 않는다."},
{"id":"e273","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nResidents (A) __interesting__ in volunteering at the Hanbit Community Center are invited to an information session this Saturday at 10 a.m. During the session, staff members will explain (B) __what__ volunteers do each week, from delivering lunch boxes to elderly neighbors to (C) __helping__ children with their homework. No special experience is required, but volunteers are asked to commit to at least two hours a week for three months. Those who cannot attend may sign up on the center's website, (D) __where__ a short introductory video is also available.","opts":["(A) interesting","(B) what","(C) helping","(D) where"],"ans":0,"exp":"사람이 \"관심을 느끼는\" 것은 과거분사 interested로 나타내므로 Residents (who are) interested in ~이 되어야 한다. interesting은 \"관심을 끄는\"이라는 뜻이다. (B)는 do의 목적어 구실을 하며 explain의 목적절을 이끄는 what, (C)는 \"from A to B\"에서 delivering과 짝을 이루는 동명사, (D)는 website를 선행사로 하는 계속적 용법의 관계부사로 모두 옳다."},
{"id":"e274","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\n(A) __Despite__ the Riverside Sports Center was completed only five years ago, its swimming pool has already needed major repairs twice. Engineers found that the pipes under the pool (B) __had been installed__ incorrectly, allowing water to leak into the basement. The city has now decided to close the pool for two months (C) __so that__ the entire system can be replaced. Members will be able to use the pool at the nearby youth center during this period, and their memberships (D) __will be extended__ by two months at no extra cost.","opts":["(A) Despite","(B) had been installed","(C) so that","(D) will be extended"],"ans":0,"exp":"Despite는 전치사여서 뒤에 명사(구)만 올 수 있다. 여기서는 \"주어 + 동사\"(the Riverside Sports Center was completed)가 이어지므로 접속사 Although나 Though를 써야 한다. (B)는 발견한 때보다 앞서 \"설치된\" 것을 나타내는 과거완료 수동태, (C)는 목적을 나타내는 so that ~ can, (D)는 회원권이 \"연장되는\" 수동태로 모두 옳다."},
{"id":"e275","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nSeparating household waste correctly (A) __take__ only a few minutes a day, yet it makes a great difference to the environment. Plastic bottles should be emptied and rinsed before they (B) __are placed__ in the recycling bin, and the labels should be removed. Paper that is stained with food or oil cannot be recycled, so it must be thrown away with general waste. If you are not sure (C) __how__ to dispose of a particular item, you can check the city's website or call the district office, (D) __whose__ staff will be glad to help.","opts":["(A) take","(B) are placed","(C) how","(D) whose"],"ans":0,"exp":"주어가 동명사구 Separating household waste correctly이고 동명사 주어는 단수로 받으므로 take가 아니라 takes여야 한다. 뒤의 it makes도 같은 주어를 단수로 받고 있다. (B)는 병이 \"놓이는\" 수동태, (C)는 \"how + to부정사\"(어떻게 ~할지), (D)는 the district office를 선행사로 하는 소유격 관계대명사로 모두 옳다."},
{"id":"e276","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe Saebom Senior Welfare Center is one of the busiest public facilities (A) __in__ the district. It (B) __has opened__ three years ago in a former elementary school building, and more than four hundred residents now visit it every day. In the morning, members can take classes in calligraphy, smartphone use, and table tennis, all of (C) __which__ are free of charge. In the afternoon, a team of nurses from the public health center checks blood pressure and gives advice on (D) __managing__ chronic diseases such as diabetes.","opts":["(A) in","(B) has opened","(C) which","(D) managing"],"ans":1,"exp":"three years ago처럼 분명한 과거 시점을 나타내는 말은 현재완료와 함께 쓸 수 없으므로 과거 시제 opened가 되어야 한다. (A)는 최상급 뒤에서 범위를 나타내는 전치사, (C)는 \"all of which\" 꼴로 앞의 수업들을 받는 관계대명사, (D)는 전치사 on의 목적어인 동명사로 모두 옳다."},
{"id":"e277","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nApplying for a library card at the city library is simple. First-time users are required (A) __to visit__ the information desk on the first floor with a valid photo ID. There they must fill out a short application form, show proof of their current address, and (B) __choosing__ a four-digit password for the self-checkout machines. The card is issued on the spot and can be used immediately. With it, members may borrow up to ten books at a time and keep (C) __them__ for two weeks. Books (D) __returned__ late cannot be renewed.","opts":["(A) to visit","(B) choosing","(C) them","(D) returned"],"ans":1,"exp":"조동사 must 뒤에 fill out, show가 동사원형으로 나열되고 and로 이어지므로 마지막도 같은 꼴인 choose여야 한다(병렬 구조). (A)는 \"be required to + 동사원형\", (C)는 복수 명사 books를 받는 대명사, (D)는 \"늦게 반납된\" 책이라는 뜻으로 Books를 꾸미는 과거분사로 모두 옳다."},
{"id":"e278","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nEvery April, the city holds a flower festival along the river. The festival began as a small event (A) __organized__ by local shop owners, but it has since grown into one of the region's main attractions. Its center is Riverside Park, (B) __which__ thousands of visitors gather each evening to watch the lantern parade. Because parking near the park is extremely (C) __limited__, visitors are encouraged to use the free shuttle buses that (D) __run__ from the subway station every ten minutes.","opts":["(A) organized","(B) which","(C) limited","(D) run"],"ans":1,"exp":"뒤에 주어(thousands of visitors)와 자동사(gather)를 갖춘 완전한 절이 오고 선행사가 장소(Riverside Park)이므로 which가 아니라 관계부사 where(또는 in which)가 되어야 한다. (A)는 event를 꾸미는 수동의 과거분사, (C)는 is의 보어로 쓰인 형용사, (D)는 복수 선행사 buses에 맞춘 동사로 모두 옳다."},
{"id":"e279","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nMany office workers spend more than eight hours a day (A) __sitting__ at a desk, which can lead to back pain and poor circulation. Health experts say that the problem is not sitting itself but staying in the same position for too long. They recommend standing up and stretching for a few minutes every hour, even (B) __if__ you feel perfectly comfortable. Those who cannot leave their desks often should consider (C) __to use__ a height-adjustable desk. Small changes like these are (D) __much__ easier to maintain than an ambitious exercise plan.","opts":["(A) sitting","(B) if","(C) to use","(D) much"],"ans":2,"exp":"consider는 동명사를 목적어로 취하는 동사이므로 to use가 아니라 using이어야 한다. (A)는 \"spend + 시간 + -ing\"(~하며 시간을 보내다), (B)는 even if(비록 ~하더라도)의 접속사, (D)는 비교급 easier를 강조하는 부사로 모두 옳다."},
{"id":"e280","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nEmergency calls should be made only when someone's life or safety is in danger. When you call, stay calm and tell the operator exactly (A) __where__ you are, since help cannot be sent without a location. Next, explain what happened and how many people (B) __are injured__. If the accident (C) __was occurred__ on a road, mention the direction of traffic and any nearby landmarks. Do not hang up until the operator tells you to, because he or she may need (D) __further__ information or may give you first-aid instructions over the phone.","opts":["(A) where","(B) are injured","(C) was occurred","(D) further"],"ans":2,"exp":"occur는 목적어를 취하지 않는 자동사여서 수동태로 쓸 수 없으므로 occurred가 되어야 한다. (A)는 tell의 직접목적어인 간접의문문을 이끄는 where, (B)는 사람이 \"다친\" 상태를 나타내는 be injured, (D)는 \"추가의\"라는 뜻으로 information을 꾸미는 형용사로 모두 옳다."},
{"id":"e281","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe public health center offers a free walking program for residents (A) __aged__ 50 and over. Participants meet at the entrance of the riverside trail at 7 a.m. on weekdays and walk for about an hour under the guidance of a trained instructor. Before joining, each participant (B) __has__ his or her blood pressure and blood sugar measured, and the same tests are repeated three months (C) __later__ to see how much progress has been made. Since it began, the walking class has become one of the most popular (D) __program__ run by the center.","opts":["(A) aged","(B) has","(C) later","(D) program"],"ans":3,"exp":"\"one of the + 최상급\" 뒤에는 복수 명사가 오므로 program이 아니라 programs여야 한다. (A)는 \"aged + 나이\"(~세의)로 residents를 꾸미는 말, (B)는 단수 주어 each participant에 맞춘 사역동사(have + 목적어 + 과거분사), (C)는 \"three months later\"(석 달 뒤에)의 부사로 모두 옳다."},
{"id":"e282","subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nPatients visiting the outpatient clinic for the first time often feel anxious because the procedures are (A) __unfamiliar__ to them. To make their visit easier, the hospital has placed volunteer guides near the main entrance. The guides help patients (B) __register__ at the reception desk and show them the way to the right department. They also explain (C) __how__ the electronic waiting board works, so that no one misses a turn. In addition, free tea is served to patients (D) __during__ they are waiting to see a doctor.","opts":["(A) unfamiliar","(B) register","(C) how","(D) during"],"ans":3,"exp":"during은 전치사여서 뒤에 명사(구)가 와야 한다. 여기서는 \"주어 + 동사\"(they are waiting)가 이어지므로 접속사 while을 써야 한다. (A)는 \"be unfamiliar to + 사람\"(~에게 낯설다)의 형용사, (B)는 \"help + 목적어 + 동사원형\", (C)는 explain의 목적절(간접의문문)을 이끄는 how로 모두 옳다."},
{"id":"e283","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: 119. What is your emergency?\nB: I smell gas in the hallway of my apartment building!\nA: What is the address?\nB: 25 Maple Street, Building C. I'm on the third floor.\nA: A fire engine is on its way. ______.\nB: Okay, I won't touch anything. Should I knock on my neighbors' doors?\nA: Yes, and tell everyone to go outside by the stairs, not the elevator.\nB: All right. We'll wait in the parking lot.","opts":["Please do not turn any switches on or off","Please check where the smell is coming from","Please bring your valuables when you leave","Please wait for the firefighters in your room"],"ans":0,"exp":"B가 \"알겠습니다. 아무것도 만지지 않을게요\"라고 답했으므로 빈칸은 무엇을 하지 말라는 지시여야 한다. 가스 냄새가 날 때는 불꽃이 튈 수 있어 전기 스위치를 켜거나 끄면 안 된다. 냄새가 나는 곳을 확인하라거나 귀중품을 챙기라는 말에는 만지지 않겠다는 대답이 맞지 않고, 방에서 기다리라는 말은 밖으로 나가라는 뒤의 지시와 어긋난다."},
{"id":"e284","subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nPaul Reed (2:05 pm): Hello. I'd like to book a seminar room at the community center for next Thursday.\nCenter Staff (2:06 pm): Sure. How many people will be attending?\nPaul Reed (2:07 pm): About twenty.\nCenter Staff (2:08 pm): Then Room B would be best. It seats twenty-five. ______?\nPaul Reed (2:09 pm): From 2 to 4 pm. Is a projector available?\nCenter Staff (2:10 pm): Yes, it's included at no extra charge.\nPaul Reed (2:11 pm): Perfect. How do I pay the rental fee?\nCenter Staff (2:12 pm): You can pay at the front desk on the day.","opts":["Would you prefer a larger room","What time would you like to use it","How did you hear about our center","Have you ever used our rooms before"],"ans":1,"exp":"빈칸 다음에 Paul이 \"오후 2시부터 4시까지\"라고 시간으로 답했으므로 몇 시에 쓰고 싶은지 묻는 말이 알맞다. 더 큰 방을 원하는지, 센터를 어떻게 알았는지, 전에 써 본 적이 있는지를 묻는 말에는 이용 시간으로 답할 수 없다."},
{"id":"e335","subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nTo end this confusion, the railroads of the United States and Canada agreed in 1883 to divide the continent into a small number of time zones.\n\nUntil the nineteenth century, every town kept its own time. (A) Noon was simply the moment when the sun stood highest in the sky, so a clock in one town might differ by several minutes from a clock in the next town to the east or west. (B) As long as people traveled on foot or by horse, these small differences did not matter. (C) The spread of the railroad, however, changed the situation, for a traveler crossing the country passed through dozens of local times, and timetables became almost impossible to read. (D) Within each zone, all clocks showed the same hour, whatever the position of the sun. The following year, an international conference chose the line passing through Greenwich, England, as the starting point for measuring time around the world.","opts":["(A)","(B)","(C)","(D)"],"ans":3,"exp":"주어진 문장의 this confusion은 (D) 앞 문장에서 말한, 지역 시간이 수십 개여서 열차 시간표를 읽기 어려웠던 혼란을 가리킨다. 또 (D) 뒤의 Within each zone은 주어진 문장의 time zones가 먼저 나와야 이어지므로 (D)가 알맞다. (C)에 넣으면 철도 때문에 생긴 혼란이 아직 나오지 않았고, 뒤 문장의 however가 가리키는 흐름도 끊긴다."},
{"id":"e336","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nSuppose you have paid for a ticket to a concert, and on the evening of the performance you feel ill and a heavy rain is falling. Many people would go anyway, reasoning that otherwise the money would be wasted. Yet the money is gone whether they go or not; the only real question is whether an evening in the hall will be more enjoyable than an evening at home. Economists call a cost of this kind, one that has already been paid and cannot be recovered, a \"sunk cost,\" and they point out that it has no bearing on which choice is better from now on. The same error appears on a larger scale when a company keeps pouring funds into a failing project because so much has already been spent on it. A sensible decision, in short, ______.","opts":["is based on how much has already been paid","follows what the majority would choose","depends only on future costs and benefits","avoids every possible risk of losing money"],"ans":2,"exp":"이미 내서 돌려받을 수 없는 돈(매몰 비용)은 가든 안 가든 사라진 것이므로 앞으로 어느 쪽이 더 나은지와 관계가 없다는 글이다. 따라서 현명한 결정은 앞으로의 비용과 이득만 따진다는 말이 알맞다. 이미 낸 돈을 기준으로 삼는 것은 글이 잘못이라고 한 바로 그 생각이고, 다수의 선택이나 위험 회피는 글에 나오지 않는다."},
{"id":"e337","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWe tend to think of the meaning of a word as something fixed, recorded once and for all in the dictionary. The history of English shows otherwise. Several centuries ago, \"nice\" meant foolish or ignorant, and to call someone nice was no compliment. \"Awful\" once described something that filled people with awe, so that a great cathedral could be praised as awful. \"Girl\" could refer to a young child of either sex. None of these changes was decided by a committee or announced on a particular day. Each came about gradually, as speakers began to use the word in slightly new situations and listeners followed them, until the older sense faded from memory. Dictionaries record such shifts after they have happened; they do not cause them. The meaning of a word, then, is ______.","opts":["fixed at the moment the word is first written down","decided by the scholars who compile dictionaries","shaped by the way people actually use it over time","kept unchanged as long as its spelling stays the same"],"ans":2,"exp":"nice, awful, girl의 뜻이 누가 정해서가 아니라 사람들이 조금씩 다르게 쓰면서 서서히 바뀌었다는 글이다. 따라서 낱말의 뜻은 사람들이 실제로 쓰는 방식에 따라 시간이 흐르며 만들어진다는 말이 알맞다. 사전은 변화를 뒤에 기록할 뿐 일으키지 않는다고 했으므로 사전 편찬자가 정한다는 선지는 맞지 않고, 뜻이 고정되어 있다는 것은 첫 문장에서 바로잡는 통념이다."},
{"id":"e338","subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nAsk people to picture a desert, and most will describe burning sand under a blazing sun. Scientists, however, define a desert by a different measure. A desert is a region that receives very little precipitation, usually less than about 250 millimeters a year, so that few plants can grow there. By this standard, the largest desert on earth is not the Sahara but Antarctica. Although the continent is covered with ice several kilometers thick in places, very little new snow falls on its interior in a year; the ice has simply built up over an immense span of time because almost none of it melts. Cold, dry regions such as the Gobi in Asia, where winter temperatures fall far below freezing, are deserts as well. What makes a place a desert, in other words, is ______.\n\n* precipitation: 강수량","opts":["how hot the ground becomes at noon","how far it lies from the nearest sea","how much of its surface is covered with sand","how little rain or snow falls on it"],"ans":3,"exp":"과학자들은 더위가 아니라 강수량이 아주 적은가로 사막을 정의하며, 그래서 얼음으로 덮인 남극이 지구에서 가장 큰 사막이라는 글이다. 따라서 사막을 사막으로 만드는 것은 비나 눈이 얼마나 적게 내리는가이다. 뜨거운 땅과 모래는 첫 문장에서 든 통념이고, 남극과 고비 사막의 예가 이를 반박한다. 바다에서 떨어진 거리는 글에 나오지 않는다."},
{"id":"h01","subj":"한국사","unit":"조선 후기","q":"조선 후기에 집집마다 토산물로 부과하던 공납을 토지 결수에 따라 쌀, 베, 동전 등으로 내게 한 제도는?","opts":["균역법","대동법","영정법","호포법"],"ans":1,"exp":"대동법은 광해군 때 경기도에서 처음 시행되어 점차 확대되었다. 토지를 기준으로 부과하여 농민 부담을 줄였고, 공인이 등장해 상품 화폐 경제가 발달하는 계기가 되었다. 균역법은 군포를 1필로 줄인 제도, 영정법은 전세를 1결당 4~6두로 고정한 제도이다."},
{"id":"h02","subj":"한국사","unit":"고려 전기","q":"고려 광종의 정책으로 옳은 것은?","opts":["노비안검법을 실시하였다.","12목에 지방관을 파견하였다.","훈요 10조를 남겼다.","전시과 제도를 처음 시행하였다."],"ans":0,"exp":"광종은 노비안검법으로 호족의 경제적, 군사적 기반을 약화하고 과거제를 실시해 왕권을 강화하였다. 12목에 지방관을 파견한 왕은 성종, 훈요 10조를 남긴 왕은 태조, 전시과를 처음 시행한 왕은 경종이다."},
{"id":"h03","subj":"한국사","unit":"일제 강점기","q":"3·1 운동을 계기로 일어난 일로 옳은 것은?","opts":["대한민국 임시 정부가 수립되었다.","독립 협회가 창립되었다.","신민회가 조직되었다.","국채 보상 운동이 시작되었다."],"ans":0,"exp":"1919년 3·1 운동을 계기로 독립운동을 체계적으로 이끌 지도부의 필요성이 커져 같은 해 상하이에서 대한민국 임시 정부가 수립되었다. 독립 협회는 1896년, 신민회와 국채 보상 운동은 1907년의 일이다."},
{"id":"h04","subj":"한국사","unit":"삼국 시대","q":"신라 진흥왕의 업적으로 옳은 것은?","opts":["화랑도를 국가적 조직으로 개편하였다.","율령을 반포하였다.","국학을 설립하였다.","우산국을 정벌하였다."],"ans":0,"exp":"진흥왕은 화랑도를 국가 조직으로 개편하고 한강 유역을 차지했으며 순수비를 세웠다. 율령 반포는 법흥왕, 국학 설립은 신문왕, 우산국 정벌은 지증왕 때의 일이다."},
{"id":"h05","subj":"한국사","unit":"선사·고조선","q":"신석기 시대의 생활 모습으로 옳은 것은?","opts":["빗살무늬 토기를 만들어 식량을 저장하였다.","고인돌을 만들어 지배자의 무덤으로 삼았다.","철제 농기구를 사용하여 농사를 지었다.","주먹도끼를 만들어 쓰며 동굴에서 살았다."],"ans":0,"exp":"신석기 시대에는 농경과 정착 생활이 시작되어 빗살무늬 토기에 식량을 저장하고 조리하였다. 고인돌은 청동기 시대, 철제 농기구는 철기 시대, 주먹도끼와 동굴 생활은 구석기 시대의 모습이다."},
{"id":"h06","subj":"한국사","unit":"선사·고조선","q":"비파형 동검과 민무늬 토기를 사용하던 시대에 대한 설명으로 옳은 것은?","opts":["가락바퀴와 뼈바늘을 처음 사용하였다.","사유 재산이 생기고 계급이 나타났다.","슴베찌르개를 만들어 사냥에 썼다.","명도전 같은 중국 화폐를 사용하였다."],"ans":1,"exp":"비파형 동검과 민무늬 토기는 청동기 시대의 대표 유물이다. 이 시대에는 농업 생산력이 늘어 사유 재산과 계급이 생기고 군장이 등장하였다. 가락바퀴와 뼈바늘은 신석기 시대, 슴베찌르개는 구석기 시대, 명도전은 철기 시대의 것이다."},
{"id":"h07","subj":"한국사","unit":"선사·고조선","q":"다음 법이 시행된 나라에 대한 설명으로 옳은 것은?\n\n사람을 죽인 자는 즉시 죽인다. 남에게 상처를 입힌 자는 곡식으로 갚는다. 도둑질한 자는 노비로 삼는데, 용서받으려면 한 사람당 50만 전을 내야 한다.","opts":["영고라는 제천 행사를 열었다.","위만이 준왕을 몰아내고 왕이 되었다.","소도라는 신성 지역을 두었다.","책화라는 풍습이 있었다."],"ans":1,"exp":"제시된 법은 고조선의 8조법 가운데 전해지는 세 조항이다. 고조선에서는 기원전 2세기에 위만이 준왕을 몰아내고 왕위를 차지하였다. 영고는 부여, 소도는 삼한, 책화는 동예의 것이다."},
{"id":"h08","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n은력 정월에 하늘에 제사를 지내는데, 온 나라 사람이 모여 날마다 먹고 마시며 노래하고 춤춘다. 이를 영고라 한다. 가뭄이나 장마가 이어져 곡식이 익지 않으면 그 허물을 왕에게 돌렸다.","opts":["민며느리제라는 혼인 풍습이 있었다.","무천이라는 제천 행사를 열었다.","도둑질한 자에게 물건값의 12배를 물게 하였다.","신지, 읍차 등의 군장이 다스렸다."],"ans":2,"exp":"영고는 부여의 제천 행사이다. 부여에는 남의 물건을 훔치면 12배로 갚게 하는 1책 12법이 있었다. 민며느리제는 옥저, 무천은 동예, 신지와 읍차는 삼한의 것이다."},
{"id":"h09","subj":"한국사","unit":"초기 국가","q":"동예에 대한 설명으로 옳은 것은?","opts":["다른 부족의 영역을 침범하면 노비나 소, 말로 갚게 하였다.","가족이 죽으면 뼈를 추려 큰 목곽에 함께 안치하였다.","제가 회의에서 나라의 중요한 일을 결정하였다.","천군이라는 제사장이 소도를 다스렸다."],"ans":0,"exp":"동예에는 다른 부족의 생활 영역을 침범하면 노비나 소, 말로 배상하게 하는 책화가 있었다. 가족 공동 무덤은 옥저, 제가 회의는 고구려, 천군과 소도는 삼한의 것이다."},
{"id":"h10","subj":"한국사","unit":"초기 국가","q":"삼한에 대한 설명으로 옳지 않은 것은?","opts":["5월과 10월에 계절제를 지냈다.","서옥제라는 혼인 풍습이 있었다.","변한은 철을 낙랑과 왜에 수출하였다.","신지, 읍차 등으로 불린 군장이 있었다."],"ans":1,"exp":"서옥제는 혼인 뒤 신랑이 신부 집 뒤꼍의 작은 집(서옥)에서 살던 고구려의 풍습이다. 삼한에서는 씨를 뿌린 5월과 추수를 마친 10월에 계절제를 지냈고, 변한은 철이 풍부하여 낙랑과 왜에 수출하였다. 신지와 읍차는 삼한의 군장이다."},
{"id":"h11","subj":"한국사","unit":"선사·고조선","q":"구석기 시대에 대한 설명으로 옳은 것은?","opts":["강가나 바닷가에 움집을 짓고 정착하였다.","거친무늬 거울을 의례에 사용하였다.","조, 피 등을 재배하는 농사를 시작하였다.","무리를 이루어 옮겨 다니며 사냥과 채집을 하였다."],"ans":3,"exp":"구석기 시대 사람들은 뗀석기를 쓰며 무리 지어 이동 생활을 하고 사냥과 채집으로 먹을거리를 얻었다. 움집에서의 정착 생활과 조, 피 농사는 신석기 시대, 거친무늬 거울은 청동기 시대의 것이다."},
{"id":"h12","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n혼인할 때에는 말로 미리 정하고, 여자의 집에서 큰 집 뒤에 작은 집을 짓는데 이를 서옥이라 한다. 10월에 하늘에 제사를 지내며 온 나라가 크게 모이는데, 이를 동맹이라 한다.","opts":["단궁, 과하마, 반어피가 특산물이었다.","대가들이 사자, 조의, 선인을 거느렸다.","철이 많이 나서 화폐처럼 사용하였다.","읍군, 삼로라는 군장이 읍락을 다스렸다."],"ans":1,"exp":"서옥제와 동맹은 고구려의 풍습과 제천 행사이다. 고구려에서는 왕 아래 상가, 고추가 등의 대가들이 저마다 사자, 조의, 선인이라는 관리를 거느렸다. 단궁, 과하마, 반어피는 동예의 특산물이고, 철을 화폐처럼 쓴 곳은 변한이며, 읍군과 삼로는 옥저와 동예의 군장이다."},
{"id":"h13","subj":"한국사","unit":"삼국 시대","q":"고구려 광개토 대왕의 업적으로 옳은 것은?","opts":["신라에 침입한 왜를 물리쳤다.","평양으로 도읍을 옮겼다.","율령을 반포하고 태학을 세웠다.","진대법을 실시하였다."],"ans":0,"exp":"광개토 대왕은 신라의 요청을 받아 군대를 보내 신라에 침입한 왜를 물리쳤고, 영락이라는 연호를 사용하였다. 평양 천도는 장수왕, 율령 반포와 태학 설립은 소수림왕, 진대법 실시는 고국천왕 때의 일이다."},
{"id":"h14","subj":"한국사","unit":"삼국 시대","q":"고구려 장수왕 때의 사실로 옳은 것은?","opts":["백제의 수도 한성을 함락하였다.","낙랑군을 몰아냈다.","살수에서 수의 군대를 크게 물리쳤다.","천리장성을 쌓기 시작하였다."],"ans":0,"exp":"장수왕은 평양으로 도읍을 옮기고 남진 정책을 펴 475년 백제의 한성을 함락하고 개로왕을 죽였다. 낙랑군 축출은 미천왕, 살수 대첩은 영양왕, 천리장성 축조 시작은 영류왕 때의 일이다."},
{"id":"h15","subj":"한국사","unit":"삼국 시대","q":"__이 왕__의 업적으로 옳은 것은?\n\n백제의 __이 왕__은 마한의 남은 세력을 정복하여 남해안까지 영토를 넓혔고, 고구려의 평양성을 공격하여 고국원왕을 전사시켰다.","opts":["사비로 도읍을 옮기고 국호를 남부여로 바꾸었다.","고흥에게 『서기』를 편찬하게 하였다.","22담로에 왕족을 파견하였다.","동진에서 불교를 받아들였다."],"ans":1,"exp":"밑줄 친 왕은 4세기 백제의 전성기를 이끈 근초고왕이다. 근초고왕 때 박사 고흥이 역사서 『서기』를 편찬하였다. 사비 천도와 남부여 개칭은 성왕, 22담로에 왕족을 파견한 왕은 무령왕, 불교 수용은 침류왕 때의 일이다."},
{"id":"h16","subj":"한국사","unit":"삼국 시대","q":"백제 성왕 때의 사실로 옳은 것은?","opts":["고구려의 공격을 받아 웅진으로 도읍을 옮겼다.","익산에 미륵사를 세웠다.","신라의 대야성을 빼앗았다.","신라와 연합하여 한강 하류 지역을 일시 되찾았다."],"ans":3,"exp":"성왕은 사비로 도읍을 옮기고 신라 진흥왕과 연합하여 한강 하류 지역을 되찾았으나, 곧 신라에 빼앗기고 관산성 전투에서 전사하였다. 웅진 천도는 문주왕, 미륵사 창건은 무왕, 대야성 함락은 의자왕 때의 일이다."},
{"id":"h17","subj":"한국사","unit":"삼국 시대","q":"신라 법흥왕 때의 사실로 옳은 것은?","opts":["이차돈의 순교를 계기로 불교를 공인하였다.","국호를 신라로 정하고 왕이라는 칭호를 썼다.","황룡사 9층 목탑을 세웠다.","대가야를 정복하였다."],"ans":0,"exp":"법흥왕은 병부를 설치하고 율령을 반포했으며, 이차돈의 순교를 계기로 불교를 공인하고 금관가야를 병합하였다. 국호 신라와 왕 칭호 사용은 지증왕, 황룡사 9층 목탑 건립은 선덕 여왕, 대가야 정복은 진흥왕 때의 일이다."},
{"id":"h18","subj":"한국사","unit":"삼국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 고구려가 평양으로 도읍을 옮겼다.\n(나) 백제가 웅진으로 도읍을 옮겼다.\n(다) 신라가 대가야를 정복하였다.\n(라) 고구려가 태학을 설립하였다.","opts":["(가) - (라) - (나) - (다)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)","(가) - (나) - (라) - (다)"],"ans":1,"exp":"태학 설립은 소수림왕 때인 372년, 평양 천도는 장수왕 때인 427년, 웅진 천도는 475년, 대가야 정복은 진흥왕 때인 562년이다. 백제의 웅진 천도는 장수왕의 남진으로 한성이 함락된 결과이므로 평양 천도보다 뒤이다."},
{"id":"h19","subj":"한국사","unit":"삼국 시대","q":"백제 부흥 운동에 대한 설명으로 옳은 것은?","opts":["검모잠이 안승을 왕으로 받들었다.","안시성에서 당 태종의 군대를 물리쳤다.","복신과 도침이 주류성에서 왕자 풍을 왕으로 맞이하였다.","계백의 결사대가 황산벌에서 싸웠다."],"ans":2,"exp":"백제가 멸망한 뒤 복신과 도침은 주류성에서, 흑치상지는 임존성에서 부흥 운동을 일으켰고, 왜에 있던 왕자 풍을 왕으로 맞이하였다. 검모잠과 안승은 고구려 부흥 운동, 안시성 싸움은 645년 고구려와 당의 전쟁, 황산벌 전투는 백제 멸망 직전의 일이다."},
{"id":"h20","subj":"한국사","unit":"삼국 시대","q":"금관가야에 대한 설명으로 옳은 것은?","opts":["진흥왕 때 신라에 병합되었다.","김해 지역에서 성장하여 전기 가야 연맹을 이끌었다.","고령 지산동 고분군을 남겼다.","후기 가야 연맹의 중심이었다."],"ans":1,"exp":"금관가야는 김해 지역에서 풍부한 철과 해상 교역을 바탕으로 전기 가야 연맹을 이끌었고, 법흥왕 때인 532년 신라에 병합되었다. 진흥왕 때 병합된 나라, 고령 지산동 고분군을 남긴 나라, 후기 가야 연맹의 중심은 모두 대가야이다."},
{"id":"h21","subj":"한국사","unit":"삼국 시대","q":"백제 무령왕릉에 대한 설명으로 옳은 것은?","opts":["도굴이 어려운 돌무지덧널무덤이다.","널방 벽에 사신도가 그려져 있다.","중국 남조의 영향을 받은 벽돌무덤이다.","돌을 계단식으로 쌓은 돌무지무덤이다."],"ans":2,"exp":"공주에 있는 무령왕릉은 중국 남조의 영향을 받아 벽돌을 쌓아 만든 무덤으로, 무덤 주인을 알려 주는 지석이 나왔다. 돌무지덧널무덤은 신라의 천마총 등이고, 사신도 벽화는 고구려 강서대묘가 대표적이며, 계단식 돌무지무덤은 고구려 장군총과 백제 석촌동 고분이다."},
{"id":"h22","subj":"한국사","unit":"삼국 시대","q":"삼국의 문화가 일본에 전해진 내용으로 옳은 것은?","opts":["백제의 혜자가 쇼토쿠 태자의 스승이 되었다.","신라의 왕인이 『천자문』과 『논어』를 전하였다.","고구려의 담징이 종이와 먹 만드는 법을 전하였다.","고구려의 노리사치계가 불경과 불상을 전하였다."],"ans":2,"exp":"『일본서기』에 따르면 고구려의 승려 담징은 610년 일본에 건너가 종이와 먹 만드는 법을 전하였다. 쇼토쿠 태자의 스승이 된 혜자는 고구려의 승려이고, 『천자문』과 『논어』를 전한 왕인과 불경, 불상을 전한 노리사치계는 백제 사람이다."},
{"id":"h23","subj":"한국사","unit":"삼국 시대","q":"다음 제도가 있던 나라의 사회 모습으로 옳은 것은?\n\n나라에 큰일이 있으면 반드시 여러 사람이 모여 의논하였다. 이를 화백이라 하는데, 한 사람이라도 반대하면 결정하지 못하였다.","opts":["정사암에 모여 재상을 뽑았다.","제가 회의에서 중대한 범죄자를 처벌하였다.","경당에서 청소년에게 글과 활쏘기를 가르쳤다.","골품에 따라 오를 수 있는 관등에 한계가 있었다."],"ans":3,"exp":"화백 회의는 신라의 귀족 회의로 만장일치로 나랏일을 결정하였다. 신라에서는 골품에 따라 관등 승진의 상한과 일상생활까지 제한을 받았다. 정사암 회의는 백제, 제가 회의와 경당은 고구려의 것이다."},
{"id":"h24","subj":"한국사","unit":"삼국 시대","q":"다음 시가 지어진 전쟁에 대한 설명으로 옳은 것은?\n\n신묘한 계책은 하늘의 이치를 다하였고, 기묘한 꾀는 땅의 이치를 꿰뚫었네. 싸움에 이겨 공이 이미 높으니, 만족함을 알고 그만두기를 바라노라.","opts":["안시성의 군민이 당의 군대를 물리쳤다.","당이 평양에 안동 도호부를 설치하였다.","위의 관구검이 환도성을 함락하였다.","수의 별동대가 살수에서 크게 패하였다."],"ans":3,"exp":"제시된 시는 을지문덕이 수의 장수 우중문에게 보낸 것이다. 612년 을지문덕은 평양성 가까이 쳐들어온 수의 별동대를 살수에서 크게 무찔렀다(살수 대첩). 안시성 싸움은 645년 당과의 전쟁, 안동 도호부 설치는 고구려 멸망 뒤, 관구검의 침입은 3세기 동천왕 때의 일이다."},
{"id":"h25","subj":"한국사","unit":"남북국 시대","q":"신라 신문왕의 정책으로 옳은 것은?","opts":["독서삼품과를 실시하였다.","청해진을 설치하였다.","백성에게 정전을 지급하였다.","관료전을 지급하고 녹읍을 폐지하였다."],"ans":3,"exp":"신문왕은 김흠돌의 난을 진압하고 왕권을 강화했으며, 관료전을 지급하고 녹읍을 폐지하여 귀족의 경제 기반을 약화하였다. 독서삼품과는 원성왕, 청해진 설치는 흥덕왕, 정전 지급은 성덕왕 때의 일이다."},
{"id":"h26","subj":"한국사","unit":"남북국 시대","q":"__이 왕__ 때의 사실로 옳은 것은?\n\n발해의 __이 왕__은 당이 흑수 말갈과 손잡고 발해를 압박하자, 장문휴를 보내 당의 등주를 공격하게 하였다.","opts":["상경 용천부로 도읍을 옮겼다.","인안이라는 연호를 사용하였다.","해동성국이라고 불렸다.","대흥이라는 연호를 사용하였다."],"ans":1,"exp":"밑줄 친 왕은 대조영의 뒤를 이은 무왕(대무예)으로, 인안이라는 독자 연호를 썼다. 상경 천도와 대흥 연호는 문왕, 해동성국이라 불릴 만큼 전성기를 이룬 것은 선왕 때의 일이다."},
{"id":"h27","subj":"한국사","unit":"남북국 시대","q":"발해에 대한 설명으로 옳은 것은?","opts":["상수리 제도로 지방 세력을 견제하였다.","9서당과 10정의 군사 조직을 두었다.","지방을 9주 5소경으로 정비하였다.","주자감을 두어 유학을 가르쳤다."],"ans":3,"exp":"발해는 중앙에 최고 교육 기관인 주자감을 두어 귀족 자제에게 유학을 가르쳤다. 상수리 제도, 9서당 10정, 9주 5소경은 모두 통일 신라의 제도이다. 발해의 지방은 5경 15부 62주로 조직되었다."},
{"id":"h28","subj":"한국사","unit":"남북국 시대","q":"원종과 애노의 난이 일어난 무렵 신라의 상황으로 옳은 것은?","opts":["6두품 일부가 골품제를 비판하며 호족과 손잡았다.","집사부 시중의 권한이 강해지고 상대등의 힘이 약해졌다.","녹읍이 폐지되어 귀족의 경제 기반이 약해졌다.","진골 출신이 처음으로 왕위에 올랐다."],"ans":0,"exp":"원종과 애노의 난은 신라 하대인 9세기 말 진성 여왕 때 일어났다. 이 시기에는 지방에서 호족이 성장하였고, 6두품 일부는 골품제를 비판하며 호족과 연계하였다. 시중 권한 강화와 녹읍 폐지는 신라 중대의 모습이고, 진골 출신으로 처음 왕이 된 사람은 중대를 연 무열왕이다."},
{"id":"h29","subj":"한국사","unit":"남북국 시대","q":"신라의 승려 의상에 대한 설명으로 옳은 것은?","opts":["무애가를 지어 불교의 대중화에 힘썼다.","인도를 다녀와 『왕오천축국전』을 썼다.","부석사를 세우고 화엄 사상을 정립하였다.","『십문화쟁론』을 지어 종파 간 대립을 풀려 하였다."],"ans":2,"exp":"의상은 당에서 화엄학을 공부하고 돌아와 부석사를 세우고 화엄 사상을 정립했으며, 「화엄일승법계도」를 지었다. 무애가와 『십문화쟁론』은 원효, 『왕오천축국전』은 혜초와 관련된 것이다."},
{"id":"h30","subj":"한국사","unit":"남북국 시대","q":"궁예에 대한 설명으로 옳은 것은?","opts":["완산주에 도읍을 정하고 나라를 세웠다.","신라에 쳐들어가 경애왕을 죽게 하였다.","후당과 오월에 사신을 보내 외교 관계를 맺었다.","국호를 마진으로 바꾸고 철원으로 도읍을 옮겼다."],"ans":3,"exp":"궁예는 송악에서 후고구려를 세운 뒤 국호를 마진으로 바꾸고 철원으로 도읍을 옮겼으며, 다시 국호를 태봉으로 고쳤다. 완산주에 도읍한 것, 경애왕을 죽게 한 것, 후당과 오월에 사신을 보낸 것은 모두 후백제 견훤의 활동이다."},
{"id":"h31","subj":"한국사","unit":"고려 전기","q":"고려 태조의 정책으로 옳은 것은?","opts":["과거제를 처음 실시하였다.","최승로의 시무 28조를 받아들였다.","사심관 제도와 기인 제도를 실시하였다.","전시과 제도를 처음 시행하였다."],"ans":2,"exp":"태조는 호족을 견제하고 지방을 통제하려고 사심관 제도와 기인 제도를 실시했으며, 혼인 정책과 사성 정책으로 호족을 포섭하였다. 과거제 실시는 광종, 시무 28조 수용은 성종, 전시과의 첫 시행은 경종 때의 일이다."},
{"id":"h32","subj":"한국사","unit":"고려 전기","q":"다음 건의를 받아들인 왕의 정책으로 옳은 것은?\n\n불교 행사에 드는 비용이 너무 많으니 줄이소서. 또 지방의 호족이 백성을 괴롭히고 있으니, 청컨대 지방관을 두소서.","opts":["광덕, 준풍 등의 연호를 사용하였다.","12목을 설치하고 지방관을 파견하였다.","북쪽 국경에 천리장성을 쌓았다.","흑창을 두어 가난한 백성을 구제하였다."],"ans":1,"exp":"제시된 글은 최승로가 성종에게 올린 시무 28조의 내용이다. 성종은 이를 받아들여 12목에 지방관을 파견하고 유교 정치 이념에 따라 제도를 정비하였다. 광덕, 준풍 연호는 광종, 천리장성 축조는 덕종에서 정종(靖宗) 때, 흑창 설치는 태조 때의 일이다."},
{"id":"h33","subj":"한국사","unit":"고려 전기","q":"고려의 정치 기구에 대한 설명으로 옳은 것은?","opts":["중추원은 화폐와 곡식의 출납과 회계를 맡았다.","어사대는 관리의 비리를 감찰하였다.","도병마사는 법과 제도를 논의하여 정하였다.","삼사는 왕의 잘못을 비판하는 언론 기구였다."],"ans":1,"exp":"어사대는 정치의 잘잘못을 논하고 관리의 비리를 감찰하였다. 화폐와 곡식의 출납, 회계는 삼사가 맡았고 중추원은 군사 기밀과 왕명 출납을 맡았다. 법과 제도를 논의한 기구는 식목도감이며 도병마사는 국방 문제를 다루었다. 삼사가 언론 기능을 맡은 것은 조선 시대이다."},
{"id":"h34","subj":"한국사","unit":"고려 전기","q":"거란의 1차 침입 때 서희가 외교 담판으로 얻은 결과로 옳은 것은?","opts":["동북 9성을 쌓았다.","귀주에서 큰 승리를 거두었다.","쌍성총관부를 되찾았다.","강동 6주를 확보하였다."],"ans":3,"exp":"993년 거란의 소손녕이 침입하자 서희는 담판을 벌여 거란과 교류할 것을 약속하고 압록강 동쪽의 강동 6주를 확보하였다. 동북 9성은 윤관이 여진을 정벌하고 쌓았고, 귀주 대첩은 거란의 3차 침입 때 강감찬이 거둔 승리이며, 쌍성총관부 수복은 공민왕 때의 일이다."},
{"id":"h35","subj":"한국사","unit":"고려 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 이자겸의 난\n(나) 무신 정변\n(다) 귀주 대첩\n(라) 묘청의 서경 천도 운동","opts":["(다) - (라) - (가) - (나)","(가) - (다) - (라) - (나)","(다) - (가) - (나) - (라)","(다) - (가) - (라) - (나)"],"ans":3,"exp":"귀주 대첩은 1019년, 이자겸의 난은 1126년, 묘청의 서경 천도 운동은 1135년, 무신 정변은 1170년이다. 이자겸의 난으로 개경의 궁궐이 불타고 왕권이 약해진 뒤 서경 천도 운동이 일어났고, 이후 문벌 사회의 모순이 깊어져 무신 정변으로 이어졌다."},
{"id":"h36","subj":"한국사","unit":"고려 전기","q":"다음 주장을 편 세력이 일으킨 사건에 대한 설명으로 옳은 것은?\n\n서경 임원역의 땅은 풍수에서 말하는 큰 명당입니다. 이곳에 궁궐을 짓고 옮겨 가시면 천하를 아우를 수 있고, 금이 스스로 항복할 것입니다. 황제를 칭하고 연호를 정하소서.","opts":["김부식이 이끄는 관군에게 진압되었다.","만적이 신분 해방을 내세워 봉기를 꾀하였다.","최충헌이 이의민을 없애고 권력을 잡았다.","이성계가 위화도에서 군대를 돌렸다."],"ans":0,"exp":"제시된 글은 묘청 등 서경 세력의 주장이다. 묘청은 서경 천도와 칭제 건원, 금 정벌을 주장하다가 1135년 서경에서 난을 일으켰으나 김부식이 이끈 관군에게 진압되었다. 만적의 봉기 시도와 최충헌의 집권은 무신 집권기, 위화도 회군은 고려 말의 일이다."},
{"id":"h37","subj":"한국사","unit":"고려 후기","q":"최우가 권력을 잡았던 시기의 사실로 옳은 것은?","opts":["교정도감을 처음 설치하였다.","정방을 설치하여 인사권을 장악하였다.","중방이 최고 권력 기구 역할을 하였다.","봉사 10조를 올려 개혁을 건의하였다."],"ans":1,"exp":"최우는 자기 집에 정방을 설치하여 인사권을 장악하고, 몽골이 침입하자 강화도로 도읍을 옮겼다. 교정도감 설치와 봉사 10조 건의는 최충헌이 한 일이고, 중방이 권력의 중심이던 때는 정중부 등 무신 정권 초기이다."},
{"id":"h38","subj":"한국사","unit":"고려 후기","q":"무신 집권기에 일어난 봉기에 대한 설명으로 옳은 것은?","opts":["김사미와 효심은 서경에서 봉기하였다.","만적은 전주의 관노비를 이끌고 봉기하였다.","조위총은 신라 부흥을 내세우며 봉기하였다.","망이·망소이는 공주 명학소에서 봉기하였다."],"ans":3,"exp":"망이·망소이는 특수 행정 구역인 공주 명학소에서 지나친 수탈에 저항하여 봉기하였다. 김사미와 효심은 경상도의 운문과 초전에서 봉기하였고, 만적은 개경에서 사노비들을 모아 봉기를 꾀하였다. 조위총은 서경 유수로서 무신 정권에 반대하여 군사를 일으켰다."},
{"id":"h39","subj":"한국사","unit":"고려 후기","q":"고려가 몽골의 침입에 맞서 싸우던 시기의 사실로 옳은 것은?","opts":["초조대장경을 새기기 시작하였다.","『직지심체요절』을 금속 활자로 찍었다.","팔만대장경을 새겼다.","최충이 9재 학당을 세웠다."],"ans":2,"exp":"고려는 몽골의 침입으로 초조대장경이 불타자 강화도에서 부처의 힘으로 몽골을 물리치기를 바라며 팔만대장경을 새겼다. 초조대장경은 거란의 침입 때 새기기 시작했고, 『직지심체요절』은 고려 말인 1377년에 간행되었으며, 9재 학당은 문종 때 세워졌다."},
{"id":"h40","subj":"한국사","unit":"고려 후기","q":"삼별초에 대한 설명으로 옳지 않은 것은?","opts":["윤관의 건의에 따라 여진 정벌을 위해 만들어졌다.","최우가 설치한 야별초에서 비롯되었다.","개경 환도에 반대하여 봉기하였다.","진도와 제주도로 근거지를 옮기며 싸웠다."],"ans":0,"exp":"윤관의 건의로 여진 정벌을 위해 만든 부대는 별무반이다. 삼별초는 최우가 만든 야별초에서 비롯된 좌별초, 우별초와 신의군으로 이루어졌으며, 고려 정부가 몽골과 강화하고 개경으로 돌아가자 이에 반대하여 진도와 제주도로 옮겨 가며 항쟁하였다."},
{"id":"h41","subj":"한국사","unit":"고려 후기","q":"원 간섭기 고려의 모습으로 옳은 것은?","opts":["2성 6부 체제가 처음 갖추어졌다.","왕의 묘호에 '조'와 '종'을 붙이기 시작하였다.","정동행성의 이문소가 내정에 간섭하였다.","거란의 침입에 대비하여 광군을 조직하였다."],"ans":2,"exp":"원 간섭기에는 일본 원정을 위해 설치한 정동행성이 남아 그 부속 기구인 이문소가 고려의 내정에 간섭하였다. 이 시기에 2성은 첨의부로, 6부는 4사로 격이 낮아졌고 왕의 호칭도 '충○왕'으로 낮추어졌다. 광군은 고려 초 정종(定宗) 때 조직되었다."},
{"id":"h42","subj":"한국사","unit":"고려 후기","q":"공민왕의 개혁 정책으로 옳은 것은?","opts":["과전법을 실시하였다.","정치도감을 설치하였다.","신돈을 등용하고 전민변정도감을 설치하였다.","사림원을 설치하였다."],"ans":2,"exp":"공민왕은 신돈을 등용하고 전민변정도감을 설치하여 권문세족이 빼앗은 토지와 노비를 본래대로 돌려놓으려 하였다. 과전법은 공양왕 때인 1391년에 실시되었고, 정치도감은 충목왕, 사림원은 충선왕 때 설치된 개혁 기구이다."},
{"id":"h43","subj":"한국사","unit":"고려 전기","q":"고려의 전시과에 대한 설명으로 옳은 것은?","opts":["지급 대상 토지를 경기 지방으로 한정하였다.","수신전, 휼양전의 이름으로 세습을 허용하였다.","관리에게 전지와 시지의 수조권을 지급하였다.","후삼국 통일에 공을 세운 사람에게 인품과 공로를 따져 지급하였다."],"ans":2,"exp":"전시과는 관리에게 등급에 따라 곡물을 거둘 수 있는 전지와 땔감을 얻을 수 있는 시지의 수조권을 준 제도이다. 경기 지방으로 한정한 것과 수신전, 휼양전은 과전법의 내용이고, 통일에 공을 세운 사람에게 인품과 공로에 따라 준 토지는 태조 때의 역분전이다."},
{"id":"h44","subj":"한국사","unit":"고려 전기","q":"고려 시대의 가족 제도와 풍속에 대한 설명으로 옳은 것은?","opts":["혼인 뒤 곧바로 남자 집에서 사는 것이 일반적이었다.","제사는 반드시 맏아들이 지냈다.","재혼한 여성의 자손은 벼슬길이 법으로 막혔다.","재산은 아들딸 구별 없이 고르게 상속되었다."],"ans":3,"exp":"고려 시대에는 재산을 자녀에게 고르게 나누어 주었고, 아들이 없으면 딸이 제사를 지냈으며, 혼인 뒤 남자가 여자 집에서 사는 일이 많았다. 남자 집에서 혼인 생활을 하는 친영과 맏아들 중심의 제사는 조선 후기에 자리 잡았고, 재혼한 여성의 자손에 대한 관직 제한은 조선 성종 때 법으로 정해졌다."},
{"id":"h45","subj":"한국사","unit":"고려 후기","q":"지눌에 대한 설명으로 옳은 것은?","opts":["해동 천태종을 창시하고 교관겸수를 주장하였다.","수선사 결사를 이끌며 정혜쌍수와 돈오점수를 주장하였다.","만덕사에서 백련 결사를 이끌며 참회 수행을 강조하였다.","유교와 불교가 다르지 않다는 유불 일치설을 주장하였다."],"ans":1,"exp":"지눌은 수선사 결사를 조직하여 불교 개혁에 힘썼고, 선과 교학을 함께 닦는 정혜쌍수와 깨달은 뒤에도 꾸준히 수행하는 돈오점수를 내세웠다. 해동 천태종과 교관겸수는 의천, 백련 결사는 요세, 유불 일치설은 혜심과 관련된 것이다."},
{"id":"h46","subj":"한국사","unit":"고려 후기","q":"『삼국유사』에 대한 설명으로 옳은 것은?","opts":["일연이 썼으며 단군의 건국 이야기를 실었다.","현재 전하는 우리나라의 가장 오래된 역사서이다.","동명왕의 업적을 서사시로 읊었다.","본기, 열전 등을 갖춘 기전체로 서술되었다."],"ans":0,"exp":"『삼국유사』는 원 간섭기에 승려 일연이 쓴 책으로, 불교사를 중심으로 설화와 전래 기록을 모았으며 단군의 건국 이야기를 실었다. 현존하는 가장 오래된 역사서이자 기전체로 쓰인 책은 김부식의 『삼국사기』이고, 동명왕의 업적을 서사시로 읊은 것은 이규보의 「동명왕편」이다."},
{"id":"h47","subj":"한국사","unit":"고려 후기","q":"고려 시대에 만들어진 문화유산으로 옳은 것은?","opts":["법주사 팔상전","부석사 무량수전","불국사 3층 석탑","원각사지 10층 석탑"],"ans":1,"exp":"영주 부석사 무량수전은 고려 시대의 대표적인 목조 건축으로 주심포 양식과 배흘림기둥으로 유명하다. 법주사 팔상전은 조선 후기, 불국사 3층 석탑은 통일 신라, 원각사지 10층 석탑은 조선 세조 때 만들어졌다."},
{"id":"h48","subj":"한국사","unit":"고려 후기","q":"고려 말 왜구의 침입에 맞선 활동으로 옳은 것은?","opts":["최무선이 화포를 써서 진포에서 왜구를 물리쳤다.","이종무가 쓰시마섬을 정벌하였다.","김종서가 6진을 개척하였다.","강감찬이 흥화진에서 적을 무찔렀다."],"ans":0,"exp":"고려 말 최무선은 화통도감에서 화약과 화포를 만들었고, 1380년 진포에서 화포로 왜구의 배를 불태웠다. 이종무의 쓰시마섬 정벌과 김종서의 6진 개척은 조선 세종 때의 일이고, 강감찬의 흥화진 전투는 거란의 3차 침입 때의 일이다."},
{"id":"h49","subj":"한국사","unit":"조선 전기","q":"조선 태종의 정책으로 옳은 것은?","opts":["『경국대전』을 완성하여 반포하였다.","6조 직계제를 실시하고 사병을 없앴다.","직전법을 실시하였다.","집현전을 설치하였다."],"ans":1,"exp":"태종은 6조가 의정부를 거치지 않고 왕에게 직접 보고하는 6조 직계제를 실시하고 사병을 없애 왕권을 강화했으며, 호패법을 시행하였다. 『경국대전』 완성은 성종, 직전법은 세조, 집현전 설치는 세종 때의 일이다."},
{"id":"h50","subj":"한국사","unit":"조선 전기","q":"조선 세종 때의 사실로 옳은 것은?","opts":["홍문관을 설치하였다.","전분 6등법과 연분 9등법을 시행하였다.","계미자를 주조하였다.","『동국통감』을 편찬하였다."],"ans":1,"exp":"세종은 토지의 비옥도에 따라 6등급, 그해 풍흉에 따라 9등급으로 나누어 전세를 거두는 공법을 마련하였다. 홍문관 설치와 『동국통감』 편찬은 성종, 계미자 주조는 태종 때의 일이다."},
{"id":"h51","subj":"한국사","unit":"조선 전기","q":"조선 세조의 정책으로 옳은 것은?","opts":["관청이 조세를 거두어 관리에게 나누어 주게 하였다.","의정부 서사제를 실시하였다.","현량과를 실시하여 사림을 등용하였다.","현직 관리에게만 수조권을 주는 직전법을 실시하였다."],"ans":3,"exp":"세조는 관리에게 줄 토지가 모자라자 현직 관리에게만 수조권을 주는 직전법을 실시하였고, 6조 직계제를 다시 시행하고 집현전을 없앴다. 관청이 조세를 거두어 나누어 주는 관수 관급제는 성종, 의정부 서사제는 세종, 현량과는 중종 때 조광조의 건의로 실시되었다."},
{"id":"h52","subj":"한국사","unit":"조선 전기","q":"조선의 통치 기구에 대한 설명으로 옳은 것은?","opts":["의금부는 수도의 행정과 치안을 맡았다.","춘추관은 외교 문서를 작성하였다.","사간원은 관리의 비리를 감찰하였다.","승정원은 왕명의 출납을 맡았다."],"ans":3,"exp":"승정원은 왕의 비서 기관으로 왕명의 출납을 맡았다. 수도의 행정과 치안은 한성부가 맡았고 의금부는 나라의 큰 죄인을 다스렸다. 춘추관은 역사서 편찬과 보관을, 외교 문서 작성은 승문원이 맡았다. 관리 감찰은 사헌부의 일이고 사간원은 왕에게 간쟁하는 일을 하였다."},
{"id":"h53","subj":"한국사","unit":"조선 전기","q":"김종직이 지은 「조의제문」을 김일손이 사초에 실은 것이 발단이 되어 일어난 사화는?","opts":["무오사화","갑자사화","기묘사화","을사사화"],"ans":0,"exp":"무오사화는 연산군 때인 1498년 「조의제문」이 사초에 실린 것을 빌미로 훈구 세력이 사림을 제거한 사건이다. 갑자사화는 연산군의 생모 윤씨 폐위 문제, 기묘사화는 중종 때 조광조의 개혁에 대한 훈구의 반발, 을사사화는 명종 때 외척 사이의 다툼으로 일어났다."},
{"id":"h54","subj":"한국사","unit":"조선 전기","q":"조광조의 활동으로 옳은 것은?","opts":["백운동 서원을 세웠다.","위훈 삭제를 주장하고 소격서를 없애자고 하였다.","『성학십도』를 지어 왕에게 올렸다.","『동호문답』에서 수미법을 주장하였다."],"ans":1,"exp":"조광조는 중종 때 등용되어 현량과 실시, 소격서 폐지, 위훈 삭제 등을 추진하다가 훈구 세력의 반발로 기묘사화 때 제거되었다. 백운동 서원은 주세붕이 세웠고, 『성학십도』는 이황, 『동호문답』은 이이의 저술이다."},
{"id":"h55","subj":"한국사","unit":"조선 전기","q":"이이에 대한 설명으로 옳은 것은?","opts":["『성학집요』를 지어 왕에게 올렸다.","『성학십도』를 지어 왕에게 올렸다.","예안 향약을 만들었다.","일본 성리학의 발전에 영향을 주었다."],"ans":0,"exp":"이이는 『성학집요』에서 현명한 신하가 왕에게 성학을 가르쳐 기질을 바꾸게 해야 한다고 하였고, 『동호문답』 등으로 개혁 방안을 제시하였다. 『성학십도』와 예안 향약은 이황의 것이며, 이황의 학문은 임진왜란 이후 일본 성리학에 영향을 주었다."},
{"id":"h56","subj":"한국사","unit":"조선 전기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 한산도 대첩\n(나) 행주 대첩\n(다) 명량 해전\n(라) 충주 탄금대 전투","opts":["(가) - (라) - (나) - (다)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)","(라) - (가) - (다) - (나)"],"ans":1,"exp":"1592년 4월 신립이 충주 탄금대에서 패하여 선조가 피란하였고, 같은 해 7월 이순신이 한산도에서 크게 이겼다. 행주 대첩은 1593년 2월 권율이 거둔 승리이고, 명량 해전은 정유재란 때인 1597년의 일이다."},
{"id":"h57","subj":"한국사","unit":"조선 전기","q":"조선 전기의 경제 상황으로 옳은 것은?","opts":["상평통보가 전국에서 널리 쓰였다.","모내기법이 전국으로 퍼져 벼와 보리의 이모작이 늘었다.","도고가 성장하여 물건을 매점하였다.","시전 상인이 관청에 물품을 대고 특정 상품의 독점 판매권을 얻었다."],"ans":3,"exp":"조선 전기에 정부는 한양 종로에 시전을 두고, 시전 상인에게 왕실과 관청에 물품을 공급하는 대신 특정 상품을 독점하여 팔 권리를 주었다. 상평통보의 전국적 유통, 모내기법의 전국 보급, 도고의 성장은 모두 조선 후기의 모습이다."},
{"id":"h58","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 편찬된 책에 대한 설명으로 옳은 것은?","opts":["『동의보감』: 전통 의학을 집대성하였다.","『동국여지승람』: 각 도의 지리와 풍속을 정리하였다.","『국조오례의』: 국가 행사의 의례를 정리하였다.","『농사직설』: 우리 풍토에 맞는 농사법을 정리하였다."],"ans":3,"exp":"『농사직설』은 세종 때 정초 등이 농민의 경험을 모아 우리 풍토에 맞는 농사법을 정리한 책이다. 『동의보감』은 허준이 광해군 때 완성하였고, 『동국여지승람』과 『국조오례의』는 성종 때 완성되었다."},
{"id":"h59","subj":"한국사","unit":"조선 전기","q":"조선 시대의 서원에 대한 설명으로 옳은 것은?","opts":["중앙에서 교수나 훈도를 보낸 지방의 관립 교육 기관이다.","생원과 진사에게 입학 자격을 준 최고 교육 기관이다.","선현에게 제사를 지내고 성리학을 가르친 사립 교육 기관이다.","유향소를 통제하려고 한양에 둔 기구이다."],"ans":2,"exp":"서원은 사림이 세운 사립 교육 기관으로 선현에 대한 제사와 성리학 교육을 맡았으며, 주세붕이 세운 백운동 서원이 시초이다. 교수나 훈도가 파견된 지방 관립 학교는 향교, 생원과 진사가 입학한 최고 교육 기관은 성균관, 유향소를 통제한 기구는 경재소이다."},
{"id":"h60","subj":"한국사","unit":"조선 전기","q":"조선 전기의 대외 관계에 대한 설명으로 옳은 것은?","opts":["청을 정벌하자는 북벌을 추진하였다.","기유약조를 맺어 일본과 무역을 다시 시작하였다.","3포를 열고 계해약조를 맺어 일본과의 무역을 제한하였다.","백두산정계비를 세워 국경을 정하였다."],"ans":2,"exp":"세종 때 조선은 부산포, 제포, 염포의 3포를 열어 주고 계해약조를 맺어 쓰시마섬과의 무역 규모를 제한하였다. 북벌 추진은 효종, 기유약조는 임진왜란 뒤 광해군, 백두산정계비 건립은 숙종 때의 일로 모두 조선 후기에 해당한다."},
{"id":"h61","subj":"한국사","unit":"조선 전기","q":"조선 세종 때 만들어진 것으로 옳지 않은 것은?","opts":["자격루","앙부일구","거중기","측우기"],"ans":2,"exp":"거중기는 정조 때 정약용이 만들어 수원 화성을 쌓는 데 쓴 기구이다. 물시계인 자격루, 해시계인 앙부일구, 강우량을 재는 측우기는 모두 세종 때 만들어졌다."},
{"id":"h62","subj":"한국사","unit":"조선 전기","q":"선조 때 사림이 동인과 서인으로 나뉜 직접적인 계기는?","opts":["효종의 정통성과 관련된 상복 문제","이조 전랑 임명을 둘러싼 대립","남인에 대한 처벌 수위를 둘러싼 대립","사도 세자의 죽음에 대한 입장 차이"],"ans":1,"exp":"선조 때 사림은 척신 정치의 청산 문제와 이조 전랑 임명 문제를 두고 김효원을 지지하는 동인과 심의겸을 지지하는 서인으로 나뉘었다. 상복 문제(예송)는 현종 때 서인과 남인의 대립이고, 남인 처벌 문제는 숙종 때 서인이 노론과 소론으로 갈린 계기이며, 사도 세자 문제는 시파와 벽파의 구분과 관련된다."},
{"id":"h63","subj":"한국사","unit":"조선 후기","q":"광해군 때의 사실로 옳은 것은?","opts":["이괄이 난을 일으켜 한양을 점령하였다.","청의 요청으로 나선 정벌에 조총 부대를 보냈다.","훈련도감을 처음 설치하였다.","강홍립의 부대를 명에 보내면서 상황에 따라 대처하게 하였다."],"ans":3,"exp":"광해군은 명과 후금 사이에서 중립 외교를 펴, 명의 요청으로 강홍립의 부대를 보내면서도 형세를 보아 대처하게 하였다. 이괄의 난은 인조, 나선 정벌은 효종, 훈련도감 설치는 임진왜란 중인 선조 때의 일이다."},
{"id":"h64","subj":"한국사","unit":"조선 후기","q":"병자호란에 대한 설명으로 옳은 것은?","opts":["인조가 남한산성에서 버티다가 삼전도에서 항복하였다.","형제 관계를 맺는 것으로 화의가 이루어졌다.","정봉수와 이립이 의병을 일으켜 싸웠다.","곽재우가 의령에서 의병을 일으켰다."],"ans":0,"exp":"1636년 청이 군신 관계를 요구하며 쳐들어오자 인조는 남한산성에서 항전하다가 이듬해 삼전도에서 항복하고 청과 군신 관계를 맺었다. 형제 관계를 맺은 화의와 정봉수, 이립의 의병 활동은 1627년 정묘호란 때의 일이고, 곽재우는 임진왜란 때의 의병장이다."},
{"id":"h65","subj":"한국사","unit":"조선 후기","q":"조선 숙종 때의 사실로 옳은 것은?","opts":["탕평비를 성균관 앞에 세웠다.","장용영을 설치하였다.","여러 차례 환국이 일어나 집권 붕당이 바뀌었다.","비변사를 처음 설치하였다."],"ans":2,"exp":"숙종 때에는 경신환국, 기사환국, 갑술환국이 잇달아 일어나 집권 붕당이 급격히 바뀌었고, 상대 붕당을 철저히 배제하는 일당 전제화 경향이 나타났다. 탕평비 건립은 영조, 장용영 설치는 정조, 비변사의 첫 설치는 중종 때의 일이다."},
{"id":"h66","subj":"한국사","unit":"조선 후기","q":"영조의 정책으로 옳은 것은?","opts":["균역법을 시행하여 군포 부담을 1필로 줄였다.","『대전회통』을 편찬하였다.","규장각을 설치하였다.","시전 상인의 금난전권을 대부분 없앴다."],"ans":0,"exp":"영조는 균역법을 시행하여 1년에 2필이던 군포를 1필로 줄였고, 『속대전』을 편찬하고 탕평책을 폈다. 『대전회통』은 고종 때 편찬되었고, 규장각 설치와 육의전을 뺀 시전의 금난전권 폐지(신해통공)는 정조 때의 일이다."},
{"id":"h67","subj":"한국사","unit":"조선 후기","q":"__이 왕__의 정책으로 옳은 것은?\n\n__이 왕__은 아버지 사도 세자의 묘를 수원으로 옮기고 화성을 쌓았으며, 국왕 친위 부대인 장용영을 두었다.","opts":["『속대전』을 편찬하여 법전을 정비하였다.","청계천을 준설하여 홍수에 대비하였다.","서원을 47곳만 남기고 정리하였다.","초계문신제를 시행하여 젊은 관리를 다시 교육하였다."],"ans":3,"exp":"밑줄 친 왕은 정조이다. 정조는 규장각을 설치하고 초계문신제를 시행하여 젊고 유능한 관리를 뽑아 재교육하였다. 『속대전』 편찬과 청계천 준설은 영조, 서원을 47곳만 남기고 정리한 것은 고종 때 흥선 대원군이 한 일이다."},
{"id":"h68","subj":"한국사","unit":"조선 후기","q":"홍경래의 난에 대한 설명으로 옳은 것은?","opts":["경상 우병사 백낙신의 수탈이 계기가 되었다.","서북 지역에 대한 차별에 반발하여 일어났다.","수습책으로 삼정이정청이 설치되었다.","고부 군수의 횡포에 맞서 전봉준이 이끌었다."],"ans":1,"exp":"홍경래의 난은 1811년 평안도에서 세도 정권의 수탈과 서북 지역에 대한 차별에 반발하여 일어났다. 백낙신의 수탈이 계기가 되고 삼정이정청이 설치된 것은 1862년 임술 농민 봉기와 관련되며, 전봉준이 이끈 고부 봉기는 1894년 동학 농민 운동의 시작이다."},
{"id":"h69","subj":"한국사","unit":"조선 후기","q":"조선 후기의 경제 변화에 대한 설명으로 옳지 않은 것은?","opts":["관영 수공업이 발달하고 민영 수공업은 쇠퇴하였다.","모내기법이 퍼지면서 넓은 땅을 경작하는 농민이 나타났다.","담배, 인삼 같은 상품 작물의 재배가 늘었다.","송상, 만상 등 사상의 활동이 활발해졌다."],"ans":0,"exp":"조선 후기에는 장인 등록제가 폐지되는 등 관영 수공업이 쇠퇴하고 민영 수공업이 발달하였다. 모내기법 확산으로 광작이 가능해졌고, 상품 작물 재배가 늘었으며, 개성의 송상과 의주의 만상 같은 사상이 성장하였다."},
{"id":"h70","subj":"한국사","unit":"조선 후기","q":"균역법 시행으로 줄어든 재정 수입을 메우기 위한 방법으로 옳지 않은 것은?","opts":["토지 1결당 쌀 2두의 결작을 거두었다.","일부 상류층에게 선무군관이라는 칭호를 주고 군포를 거두었다.","어장세, 염세, 선박세를 국가 재정으로 돌렸다.","공인에게 공가를 미리 주고 필요한 물품을 사들이게 하였다."],"ans":3,"exp":"공인에게 공가를 주고 물품을 사들이게 한 것은 대동법의 운영 방식이다. 균역법으로 군포가 1필로 줄자 정부는 지주에게 결작을 거두고, 일부 상류층에게 선무군관포를 받았으며, 어장세와 염세, 선박세를 재정에 보탰다."},
{"id":"h71","subj":"한국사","unit":"조선 후기","q":"정약용에 대한 설명으로 옳은 것은?","opts":["신분에 따라 토지를 차등 있게 나누어 주는 균전론을 주장하였다.","영업전의 매매를 금지하는 한전론을 주장하였다.","마을 단위로 토지를 함께 경작하고 일한 만큼 나누는 여전론을 주장하였다.","『북학의』에서 소비를 권장해야 생산이 늘어난다고 하였다."],"ans":2,"exp":"정약용은 한 마을이 토지를 공동으로 소유하고 경작하여 노동량에 따라 수확을 나누는 여전론을 내놓았고, 뒤에 정전제를 주장하였다. 균전론은 유형원, 한전론은 이익, 『북학의』는 박제가의 것이다."},
{"id":"h72","subj":"한국사","unit":"조선 후기","q":"박지원에 대한 설명으로 옳은 것은?","opts":["『의산문답』에서 지구가 돈다고 주장하였다.","『우서』에서 사농공상의 직업 평등을 주장하였다.","『열하일기』를 쓰고 수레와 선박의 이용을 강조하였다.","『발해고』에서 남북국이라는 말을 썼다."],"ans":2,"exp":"박지원은 청에 다녀와 『열하일기』를 쓰고 수레와 선박의 이용, 화폐 유통의 필요성을 강조했으며 「양반전」 등으로 양반의 무능을 비판하였다. 『의산문답』은 홍대용, 『우서』는 유수원, 『발해고』는 유득공의 저술이다."},
{"id":"h73","subj":"한국사","unit":"조선 후기","q":"조선 후기의 국학 연구에 대한 설명으로 옳은 것은?","opts":["안정복은 『발해고』에서 발해를 우리 역사로 다루었다.","이긍익은 『동사강목』에서 독자적인 정통론을 세웠다.","이중환은 『택리지』에서 각 지방의 자연환경과 풍속을 서술하였다.","정상기는 목판으로 「대동여지도」를 만들었다."],"ans":2,"exp":"이중환의 『택리지』는 각 지방의 자연환경, 경제, 풍속, 인심을 서술한 인문 지리서이다. 『발해고』는 유득공, 『동사강목』은 안정복, 「대동여지도」는 김정호가 만들었다. 이긍익은 『연려실기술』을 썼고 정상기는 「동국지도」를 만들었다."},
{"id":"h74","subj":"한국사","unit":"조선 후기","q":"조선 후기의 문화에 대한 설명으로 옳지 않은 것은?","opts":["『춘향전』 같은 한글 소설이 널리 읽혔다.","안견이 「몽유도원도」를 그렸다.","김홍도와 신윤복이 풍속화를 그렸다.","백자가 민간에까지 널리 쓰이고 청화 백자가 유행하였다."],"ans":1,"exp":"「몽유도원도」는 조선 전기 세종 때 안견이 안평 대군의 꿈 이야기를 듣고 그린 그림이다. 조선 후기에는 서민 문화가 발달하여 한글 소설, 판소리, 탈춤이 유행하고 풍속화와 민화가 그려졌으며, 백자가 민간에까지 널리 쓰이면서 청화 백자가 유행하였다."},
{"id":"h75","subj":"한국사","unit":"조선 후기","q":"조선 후기 신분제의 변화에 대한 설명으로 옳지 않은 것은?","opts":["영조 때 아버지가 노비이면 어머니가 양인이어도 자식을 노비로 삼도록 법을 정하였다.","공명첩 발급과 납속으로 양반의 수가 늘었다.","순조 때 중앙 관청에 속한 공노비가 해방되었다.","서얼이 규장각 검서관으로 등용되었다."],"ans":0,"exp":"조선 후기에는 노비를 줄이고 양인을 늘리기 위해 어머니가 양인이면 자식도 양인이 되게 하는 노비종모법을 영조 때(1731) 확정하였다. 따라서 아버지가 노비여도 어머니가 양인이면 자식은 양인이 되었다. 공명첩과 납속으로 양반이 늘었고, 1801년 순조 때 공노비 6만 6천여 명이 해방되었으며, 정조 때 박제가, 유득공 등 서얼이 규장각 검서관이 되었다."},
{"id":"h76","subj":"한국사","unit":"조선 후기","q":"동학에 대한 설명으로 옳은 것은?","opts":["처음에는 서학이라는 학문으로 받아들여졌다.","신유박해로 큰 탄압을 받았다.","청을 오가던 사신들이 들여왔다.","시천주와 후천개벽 사상을 내세웠다."],"ans":3,"exp":"동학은 1860년 경주의 몰락 양반 최제우가 창시한 종교로, 마음속에 한울님을 모신다는 시천주와 새 세상이 온다는 후천개벽을 내세웠다. 서학으로 수용된 것, 신유박해로 탄압받은 것, 청을 오가던 사신을 통해 들어온 것은 모두 천주교에 대한 설명이다."},
{"id":"h77","subj":"한국사","unit":"개항기","q":"흥선 대원군의 정책으로 옳은 것은?","opts":["통리기무아문을 설치하였다.","토지 소유자에게 지계를 발급하였다.","신식 군대인 별기군을 창설하였다.","호포제를 실시하여 양반에게도 군포를 거두었다."],"ans":3,"exp":"흥선 대원군은 호포제를 실시하여 양반에게도 군포를 거두고, 사창제를 실시하여 환곡의 폐단을 줄이려 하였다. 통리기무아문 설치(1880)와 별기군 창설(1881)은 개항 이후 고종의 개화 정책이고, 지계 발급은 대한 제국의 광무개혁 때 이루어졌다."},
{"id":"h78","subj":"한국사","unit":"개항기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 오페르트가 남연군의 묘를 도굴하려 하였다.\n(나) 프랑스군이 강화도를 침입하였다.\n(다) 미군이 광성보를 공격하였다.\n(라) 전국 각지에 척화비가 세워졌다.","opts":["(나) - (가) - (다) - (라)","(가) - (나) - (다) - (라)","(나) - (다) - (가) - (라)","(나) - (가) - (라) - (다)"],"ans":0,"exp":"프랑스군이 강화도를 침입한 병인양요는 1866년, 오페르트 도굴 사건은 1868년, 미군이 광성보를 공격한 신미양요는 1871년이다. 흥선 대원군은 1871년 광성보가 함락된 직후 서울 종로와 전국 각지에 척화비를 세워 통상 수교 거부 의지를 밝혔다."},
{"id":"h79","subj":"한국사","unit":"개항기","q":"강화도 조약(조일 수호 조규)에 대한 설명으로 옳지 않은 것은?","opts":["조선이 자주국임을 밝혔다.","일본에 조선 해안을 측량할 권리를 주었다.","개항장에서 죄를 지은 일본인은 일본 관리가 재판하게 하였다.","최혜국 대우를 처음으로 규정하였다."],"ans":3,"exp":"최혜국 대우는 1882년 조미 수호 통상 조약에서 처음 규정되었다. 1876년 강화도 조약은 조선이 자주국임을 밝혀 청의 간섭을 막으려 하였고, 해안 측량권과 영사 재판권(치외 법권)을 인정한 불평등 조약이었다."},
{"id":"h80","subj":"한국사","unit":"개항기","q":"임오군란의 결과로 옳은 것은?","opts":["청과 일본이 톈진 조약을 맺었다.","군국기무처가 설치되었다.","고종이 러시아 공사관으로 거처를 옮겼다.","조청 상민 수륙 무역 장정이 맺어졌다."],"ans":3,"exp":"1882년 임오군란을 진압한 청은 군대를 조선에 머물게 하고 조청 상민 수륙 무역 장정을 맺어 청 상인의 내륙 진출 길을 열었다. 톈진 조약은 갑신정변, 군국기무처 설치는 제1차 갑오개혁, 고종의 러시아 공사관 이동은 1896년 아관 파천이다."},
{"id":"h81","subj":"한국사","unit":"개항기","q":"다음 개혁안을 발표한 세력에 대한 설명으로 옳은 것은?\n\n1. 청에 잡혀간 흥선 대원군을 곧 돌아오게 하고, 조공하는 허례를 폐지할 것\n2. 문벌을 폐지하여 인민 평등의 권리를 세울 것\n3. 지조법을 개혁할 것","opts":["전라도 각지에 집강소를 설치하였다.","만민 공동회를 열어 민권 신장을 주장하였다.","13도 창의군을 꾸려 서울 진공 작전을 폈다.","우정총국 개국 축하연을 이용하여 정변을 일으켰다."],"ans":3,"exp":"제시된 자료는 1884년 갑신정변 때 급진 개화파가 발표한 개혁 정강이다. 김옥균 등은 우정총국 개국 축하연을 틈타 정변을 일으켰으나 청군의 개입으로 3일 만에 실패하였다. 집강소는 동학 농민군, 만민 공동회는 독립 협회, 13도 창의군은 정미의병과 관련된다."},
{"id":"h82","subj":"한국사","unit":"개항기","q":"동학 농민 운동에서 전주 화약 체결과 우금치 전투 사이에 있었던 사실로 옳은 것은?","opts":["농민군이 황토현에서 관군을 이겼다.","농민군이 백산에 모여 4대 강령을 발표하였다.","일본군이 경복궁을 점령하였다.","전봉준이 체포되어 재판을 받았다."],"ans":2,"exp":"농민군과 정부가 전주 화약을 맺은 뒤에도 일본군은 물러가지 않고 경복궁을 점령하였고, 이에 농민군이 다시 봉기하여 우금치에서 싸웠다. 백산 봉기와 황토현 전투는 전주 화약 이전이고, 전봉준 체포는 우금치 전투에서 패한 뒤의 일이다."},
{"id":"h83","subj":"한국사","unit":"개항기","q":"갑오·을미개혁의 내용으로 옳지 않은 것은?","opts":["공사 노비법을 없앴다.","과거제를 폐지하였다.","대한국 국제를 반포하였다.","태양력을 쓰고 단발령을 내렸다."],"ans":2,"exp":"대한국 국제는 대한 제국이 1899년에 반포한 것으로 황제의 무한한 권한을 밝혔다. 공사 노비법 혁파와 과거제 폐지는 1894년 제1차 갑오개혁, 태양력 사용과 단발령은 1895년 을미개혁의 내용이다."},
{"id":"h84","subj":"한국사","unit":"개항기","q":"독립 협회의 활동으로 옳은 것은?","opts":["고종의 강제 퇴위에 반대하는 운동을 벌였다.","대성 학교와 오산 학교를 세웠다.","일본의 황무지 개간권 요구를 막아 냈다.","관민 공동회를 열어 헌의 6조를 결의하였다."],"ans":3,"exp":"독립 협회는 1898년 관민 공동회를 열어 헌의 6조를 결의하고 의회 설립을 추진하였다. 고종 강제 퇴위 반대 운동은 대한 자강회, 대성 학교와 오산 학교 설립은 신민회, 황무지 개간권 요구 저지는 보안회의 활동이다."},
{"id":"h85","subj":"한국사","unit":"개항기","q":"을사늑약에 대한 설명으로 옳은 것은?","opts":["대한 제국의 군대를 해산하는 근거가 되었다.","일본이 추천하는 재정 고문과 외교 고문을 두게 하였다.","대한 제국의 외교권을 빼앗고 통감부를 두게 하였다.","일본이 군사상 필요한 곳을 쓸 수 있게 하였다."],"ans":2,"exp":"1905년 을사늑약으로 일본은 대한 제국의 외교권을 빼앗고 통감부를 설치하였다. 군대 해산은 1907년 한일 신협약의 부속 각서에 따른 것이고, 고문을 두게 한 것은 1904년 제1차 한일 협약, 군사 요충지 사용은 1904년 한일 의정서의 내용이다."},
{"id":"h86","subj":"한국사","unit":"개항기","q":"신민회에 대한 설명으로 옳은 것은?","opts":["헌정 연구회를 이어받아 조직되었다.","러시아의 절영도 조차 요구를 막아 냈다.","남만주 삼원보에 독립운동 기지를 세웠다.","대구에서 국채 보상 운동을 처음 시작하였다."],"ans":2,"exp":"신민회는 1907년 안창호, 양기탁 등이 만든 비밀 결사로 공화정 수립을 목표로 하였고, 남만주 삼원보에 독립운동 기지를 세웠다. 헌정 연구회를 이은 단체는 대한 자강회이고, 절영도 조차 요구 저지는 독립 협회의 활동이며, 국채 보상 운동은 대구에서 서상돈 등의 제안으로 시작되었다."},
{"id":"h87","subj":"한국사","unit":"일제 강점기","q":"1910년대 일제의 식민 통치 정책으로 옳은 것은?","opts":["회사를 세울 때 총독의 허가를 받게 하였다.","치안 유지법을 만들었다.","국가 총동원법을 적용하였다.","산미 증식 계획을 추진하였다."],"ans":0,"exp":"1910년대 일제는 회사령을 만들어 회사를 세울 때 총독의 허가를 받게 하여 한국인의 기업 활동을 억눌렀고, 헌병 경찰 제도와 토지 조사 사업을 실시하였다. 산미 증식 계획은 1920년부터, 치안 유지법은 1925년, 국가 총동원법은 1938년의 일이다."},
{"id":"h88","subj":"한국사","unit":"일제 강점기","q":"산미 증식 계획에 대한 설명으로 옳은 것은?","opts":["정해진 기간 안에 토지 소유권을 신고하게 하였다.","놋그릇과 수저까지 공출하였다.","남부에 면화, 북부에 양을 기르게 하였다.","늘어난 생산량보다 더 많은 쌀이 일본으로 실려 나갔다."],"ans":3,"exp":"일제는 1920년부터 일본의 식량 부족을 해결하려고 산미 증식 계획을 추진하였는데, 증산량보다 많은 쌀을 가져가 한국의 식량 사정이 나빠졌다. 기한 내 신고는 1910년대 토지 조사 사업, 금속 공출은 전시 동원 체제, 면화와 양 사육 강요는 1930년대 남면북양 정책이다."},
{"id":"h89","subj":"한국사","unit":"일제 강점기","q":"중일 전쟁 이후 일제가 실시한 정책으로 옳지 않은 것은?","opts":["황국 신민 서사를 외우게 하였다.","성과 이름을 일본식으로 바꾸게 하였다.","조선 태형령을 만들어 한국인에게만 태형을 가하였다.","국가 총동원법을 적용하여 인력과 물자를 수탈하였다."],"ans":2,"exp":"조선 태형령은 1912년에 만들어져 1910년대 무단 통치 시기에 시행되다가 3·1 운동 뒤 폐지되었다. 1937년 중일 전쟁 이후 일제는 황국 신민 서사 암송과 창씨개명을 강요하고, 1938년 국가 총동원법으로 인력과 물자를 수탈하였다."},
{"id":"h90","subj":"한국사","unit":"일제 강점기","q":"대한민국 임시 정부의 활동으로 옳지 않은 것은?","opts":["독립 공채를 발행하였다.","신흥 무관 학교를 세웠다.","구미 위원부를 설치하였다.","한국 광복군을 창설하였다."],"ans":1,"exp":"신흥 무관 학교는 이회영 등 신민회 인사들이 남만주에 세운 신흥 강습소가 발전한 것이다. 대한민국 임시 정부는 독립 공채를 발행하여 자금을 모으고, 미국에 구미 위원부를 두어 외교 활동을 폈으며, 1940년 충칭에서 한국 광복군을 창설하였다."},
{"id":"h91","subj":"한국사","unit":"일제 강점기","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 자유시 참변\n(나) 봉오동 전투\n(다) 청산리 대첩\n(라) 미쓰야 협정 체결","opts":["(나) - (가) - (다) - (라)","(다) - (나) - (가) - (라)","(나) - (다) - (가) - (라)","(나) - (다) - (라) - (가)"],"ans":2,"exp":"봉오동 전투는 1920년 6월, 청산리 대첩은 1920년 10월이다. 이후 일제의 보복을 피해 이동한 독립군은 1921년 자유시 참변을 겪었고, 만주로 돌아와 3부를 조직하였다. 미쓰야 협정은 1925년 일제와 만주 군벌이 독립군 탄압을 위해 맺었다."},
{"id":"h92","subj":"한국사","unit":"일제 강점기","q":"한인 애국단에 대한 설명으로 옳은 것은?","opts":["김원봉이 만주 지린에서 조직하였다.","윤봉길이 상하이 훙커우 공원에서 의거를 일으켰다.","「조선 혁명 선언」을 활동 지침으로 삼았다.","김상옥이 종로 경찰서에 폭탄을 던졌다."],"ans":1,"exp":"한인 애국단은 1931년 김구가 임시 정부의 활로를 찾으려고 상하이에서 조직하였고, 단원 이봉창과 윤봉길이 1932년에 의거를 일으켰다. 김원봉이 지린에서 조직한 단체, 「조선 혁명 선언」을 지침으로 삼은 단체, 김상옥이 속한 단체는 모두 의열단이다."},
{"id":"h93","subj":"한국사","unit":"일제 강점기","q":"신간회에 대한 설명으로 옳은 것은?","opts":["광주 학생 항일 운동에 진상 조사단을 보냈다.","평양에서 물산 장려 운동을 시작하였다.","민립 대학 설립 운동을 이끌었다.","6·10 만세 운동을 계획하였다."],"ans":0,"exp":"신간회는 1927년 비타협적 민족주의 세력과 사회주의 세력이 함께 만든 단체로, 1929년 광주 학생 항일 운동이 일어나자 진상 조사단을 보내고 민중 대회를 열려 하였다. 물산 장려 운동은 1920년 조선 물산 장려회, 민립 대학 설립 운동은 1923년 민립 대학 기성회가 이끌었고, 6·10 만세 운동은 신간회 창립 전인 1926년의 일이다."},
{"id":"h94","subj":"한국사","unit":"일제 강점기","q":"물산 장려 운동에 대한 설명으로 옳은 것은?","opts":["'내 살림 내 것으로'라는 구호를 내세웠다.","'배우자, 가르치자, 다 함께 브나로드'라는 구호를 내세웠다.","'한민족 1천만이 한 사람 1원씩'이라는 구호를 내세웠다.","백정에 대한 차별을 없애려고 진주에서 시작되었다."],"ans":0,"exp":"물산 장려 운동은 조만식 등이 평양에서 시작한 운동으로 '내 살림 내 것으로', '조선 사람 조선 것'을 구호로 토산품 애용을 호소하였다. 브나로드 운동은 동아일보의 농촌 계몽 운동, '1천만이 1원씩'은 민립 대학 설립 운동의 구호이고, 진주에서 시작된 백정 차별 철폐 운동은 형평 운동이다."},
{"id":"h95","subj":"한국사","unit":"일제 강점기","q":"한국 광복군에 대한 설명으로 옳은 것은?","opts":["미국 전략 정보국(OSS)과 함께 국내 진공 작전을 준비하였다.","쌍성보와 대전자령에서 일본군을 물리쳤다.","영릉가와 흥경성에서 일본군을 물리쳤다.","중국 관내에서 만들어진 첫 한인 무장 부대였다."],"ans":0,"exp":"한국 광복군은 1940년 충칭에서 대한민국 임시 정부의 군대로 창설되어 인도·미얀마 전선에 대원을 보냈고, 미국 전략 정보국과 협력하여 국내 진공 작전을 준비하였다. 쌍성보, 대전자령 전투는 한국 독립군, 영릉가, 흥경성 전투는 조선 혁명군의 활동이고, 중국 관내 최초의 한인 무장 부대는 1938년에 만들어진 조선 의용대이다."},
{"id":"h96","subj":"한국사","unit":"일제 강점기","q":"박은식에 대한 설명으로 옳은 것은?","opts":["『조선사회경제사』에서 한국사를 세계사의 보편 법칙으로 설명하였다.","『한국통사』를 쓰고 국혼을 강조하였다.","진단 학회를 만들어 실증적 연구를 이끌었다.","『조선상고사』에서 역사를 아와 비아의 투쟁으로 보았다."],"ans":1,"exp":"박은식은 『한국통사』와 『한국독립운동지혈사』를 쓰고, 나라의 형체는 잃어도 정신인 국혼을 지키면 나라를 되찾을 수 있다고 하였다. 『조선사회경제사』는 백남운, 『조선상고사』는 신채호의 저술이고, 진단 학회는 1934년 이병도, 손진태 등이 만들었다."},
{"id":"h97","subj":"한국사","unit":"현대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 5·10 총선거 실시\n(나) 모스크바 3국 외상 회의 개최\n(다) 좌우 합작 7원칙 발표\n(라) 제1차 미소 공동 위원회 개최","opts":["(나) - (라) - (다) - (가)","(나) - (다) - (라) - (가)","(라) - (나) - (다) - (가)","(나) - (라) - (가) - (다)"],"ans":0,"exp":"모스크바 3국 외상 회의는 1945년 12월, 그 결정에 따른 제1차 미소 공동 위원회는 1946년 3월에 열렸다. 미소 공동 위원회가 결렬된 뒤 좌우 합작 위원회가 1946년 10월 좌우 합작 7원칙을 발표하였고, 5·10 총선거는 1948년 5월에 실시되었다."},
{"id":"h98","subj":"한국사","unit":"현대","q":"제헌 국회의 활동으로 옳은 것은?","opts":["발췌 개헌안을 통과시켰다.","사사오입 개헌안을 통과시켰다.","반민족 행위 처벌법을 만들었다.","한일 협정을 비준하였다."],"ans":2,"exp":"1948년 5·10 총선거로 구성된 제헌 국회는 헌법을 만들고, 반민족 행위 처벌법과 농지 개혁법을 제정하였다. 발췌 개헌은 1952년, 사사오입 개헌은 1954년, 한일 협정 비준은 1965년의 일로 모두 그 뒤의 국회에서 이루어졌다."},
{"id":"h99","subj":"한국사","unit":"현대","q":"4·19 혁명의 결과로 옳은 것은?","opts":["5년 단임의 대통령 직선제 개헌이 이루어졌다.","대통령에게 긴급 조치권을 준 유신 헌법이 만들어졌다.","내각 책임제와 국회 양원제를 담은 개헌이 이루어졌다.","통일 주체 국민 회의에서 대통령을 뽑게 되었다."],"ans":2,"exp":"1960년 3·15 부정 선거에 항의하여 일어난 4·19 혁명으로 이승만 대통령이 물러났고, 내각 책임제와 양원제 국회를 내용으로 헌법이 바뀌어 장면 내각이 들어섰다. 5년 단임 대통령 직선제 개헌은 1987년 6월 민주 항쟁의 결과이고, 긴급 조치권과 통일 주체 국민 회의는 1972년 유신 헌법의 내용이다."},
{"id":"h100","subj":"한국사","unit":"현대","q":"7·4 남북 공동 성명에 대한 설명으로 옳은 것은?","opts":["남북한이 유엔에 동시 가입한 뒤에 발표되었다.","자주, 평화, 민족 대단결의 통일 3대 원칙에 합의하였다.","첫 남북 정상 회담의 결과로 발표되었다.","한반도 비핵화에 관한 내용을 담았다."],"ans":1,"exp":"1972년 7·4 남북 공동 성명에서 남북은 자주, 평화, 민족 대단결의 통일 3대 원칙에 합의하고 남북 조절 위원회를 두기로 하였다. 남북한 유엔 동시 가입은 1991년이고, 첫 남북 정상 회담의 결과는 2000년 6·15 남북 공동 선언이며, 한반도 비핵화 공동 선언은 1991년 말에 합의되었다."},
{"id":"h101","subj":"한국사","unit":"선사·고조선","q":"신석기 시대의 대표적인 유적으로 옳은 것은?","opts":["서울 암사동 유적","연천 전곡리 유적","부여 송국리 유적","공주 석장리 유적"],"ans":0,"exp":"서울 암사동 유적에서는 신석기 시대의 움집터와 빗살무늬 토기가 나왔다. 연천 전곡리와 공주 석장리는 구석기 시대 유적이고, 부여 송국리는 청동기 시대의 마을 유적이다."},
{"id":"h102","subj":"한국사","unit":"선사·고조선","q":"고조선에 대한 설명으로 옳지 않은 것은?","opts":["천군이 소도라는 신성 지역을 다스렸다.","왕 아래에 상, 대부, 장군 등의 관직을 두었다.","위만 조선은 한과 주변 나라 사이에서 중계 무역으로 이익을 얻었다.","한 무제가 보낸 군대의 공격으로 왕검성이 함락되었다."],"ans":0,"exp":"천군과 소도는 삼한의 제도이다. 고조선은 왕 아래에 상, 대부, 장군 등의 관직을 두었고, 위만 조선은 철기 문화를 바탕으로 세력을 넓히며 중계 무역으로 이익을 얻었다. 이에 한 무제가 군대를 보내 기원전 108년에 왕검성을 함락하였다."},
{"id":"h103","subj":"한국사","unit":"선사·고조선","q":"세형 동검과 잔무늬 거울이 만들어지던 시기의 모습으로 옳은 것은?","opts":["명도전, 반량전 같은 중국 화폐가 쓰였다.","조, 피 등을 기르는 농경이 처음 시작되었다.","주먹도끼와 찍개 같은 뗀석기를 주로 썼다.","빗살무늬 토기를 처음 만들어 쓰기 시작하였다."],"ans":0,"exp":"세형 동검과 잔무늬 거울은 철기가 보급되던 시기에 한반도에서 독자적으로 발전한 청동기이다. 이 시기 유적에서는 명도전, 반량전, 오수전 같은 중국 화폐가 나와 중국과 교류하였음을 알 수 있다. 농경의 시작과 빗살무늬 토기는 신석기 시대, 주먹도끼와 찍개는 구석기 시대의 것이다."},
{"id":"h104","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n여자가 열 살이 되면 혼인을 약속하고 신랑 집에서 맞아들여 기른다. 어른이 되면 여자 집으로 돌려보내는데, 여자 집에서 돈을 요구하고, 돈을 치른 뒤에 다시 신랑 집으로 온다.","opts":["12월에 영고라는 제천 행사를 열었다.","천군이 소도에서 제사를 주관하였다.","다른 부족의 영역을 침범하면 노비나 소, 말로 갚게 하였다.","소금과 해산물을 고구려에 공물로 바쳤다."],"ans":3,"exp":"자료는 옥저의 민며느리제이다. 옥저는 왕이 없이 읍군, 삼로 같은 군장이 다스렸고, 고구려의 압력을 받아 소금과 해산물 등을 공물로 바쳤다. 영고는 부여, 천군과 소도는 삼한, 영역 침범을 배상하게 한 책화는 동예의 풍습이다."},
{"id":"h105","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n왕이 죽으면 사람을 함께 묻는데 많을 때는 백 명에 이른다. 전쟁을 하게 되면 하늘에 제사를 지내고, 소를 잡아 그 굽을 보고 길흉을 점친다.","opts":["10월에 무천이라는 제천 행사를 열었다.","신지, 읍차 등으로 불린 군장이 있었다.","가족이 죽으면 뼈를 추려 큰 목곽에 함께 묻었다.","마가, 우가, 저가, 구가가 사출도를 다스렸다."],"ans":3,"exp":"순장과 소의 굽으로 점을 치는 풍습(우제점법)은 부여의 것이다. 부여에서는 왕이 중앙을 다스리고 마가, 우가, 저가, 구가가 사출도를 따로 다스렸다. 무천은 동예, 신지와 읍차는 삼한, 가족 공동 무덤은 옥저에 해당한다."},
{"id":"h106","subj":"한국사","unit":"초기 국가","q":"다음 자료에 해당하는 나라에 대한 설명으로 옳은 것은?\n\n국읍마다 한 사람을 세워 하늘에 지내는 제사를 주관하게 하는데, 이를 천군이라 한다. 또 나라마다 별읍이 있어 소도라 하는데, 죄를 짓고 도망한 사람이 그 안으로 들어가면 잡아가지 못하였다.","opts":["10월에 동맹이라는 제천 행사를 열었다.","도둑질한 자에게 물건값의 12배를 물게 하였다.","읍군, 삼로라는 군장이 읍락을 다스렸다.","씨를 뿌린 5월과 추수를 마친 10월에 제사를 지냈다."],"ans":3,"exp":"천군과 소도는 삼한이 제사와 정치가 나뉜 사회였음을 보여 준다. 삼한은 벼농사가 발달하여 5월과 10월에 계절제를 지냈다. 동맹은 고구려의 제천 행사, 1책 12법은 부여와 고구려의 법, 읍군과 삼로는 옥저와 동예의 군장이다."},
{"id":"h107","subj":"한국사","unit":"삼국 시대","q":"고구려 소수림왕 때의 사실로 옳은 것은?","opts":["서안평을 차지하고 낙랑군을 몰아냈다.","전진에서 불교를 받아들였다.","평양으로 도읍을 옮겼다.","신라에 침입한 왜를 물리쳤다."],"ans":1,"exp":"소수림왕은 372년 전진에서 불교를 받아들이고 태학을 세웠으며 율령을 반포하여 나라의 체제를 정비하였다. 서안평 점령과 낙랑군 축출은 미천왕, 평양 천도는 장수왕, 신라에 침입한 왜를 물리친 것은 광개토 대왕 때의 일이다."},
{"id":"h108","subj":"한국사","unit":"삼국 시대","q":"__이 왕__ 때의 사실로 옳은 것은?\n\n고구려의 __이 왕__은 사냥을 나갔다가 길에서 우는 사람을 만나 까닭을 물었다. 흉년이 들어 어머니를 모실 수 없다는 말을 듣고, 해마다 봄에 관청의 곡식을 빌려주고 가을에 갚게 하는 법을 만들었다.","opts":["을파소를 국상으로 등용하였다.","옥저를 정복하였다.","율령을 반포하였다.","백제의 한성을 함락하였다."],"ans":0,"exp":"자료는 고국천왕 때 실시한 진대법이다. 고국천왕은 을파소를 국상으로 등용하였고, 그의 건의로 진대법을 시행하였다. 옥저 정복은 태조왕, 율령 반포는 소수림왕, 한성 함락은 장수왕 때의 일이다."},
{"id":"h109","subj":"한국사","unit":"삼국 시대","q":"__이 왕__ 때의 사실로 옳은 것은?\n\n백제의 __이 왕__은 중국 남조의 양에 사신을 보내 '여러 차례 고구려를 깨뜨려 다시 강한 나라가 되었다'고 알렸다. 1971년 공주에서 발견된 그의 무덤에서는 무덤의 주인을 알려 주는 지석이 나왔다.","opts":["사비로 도읍을 옮겼다.","지방의 22담로에 왕족을 보냈다.","동진에서 불교를 받아들였다.","익산에 미륵사를 세웠다."],"ans":1,"exp":"자료의 왕은 무령왕이다. 무령왕은 지방의 22담로에 왕족을 보내 지방 통제를 강화하고, 양과 교류하며 나라의 힘을 되찾았다. 사비 천도는 성왕, 불교 수용은 침류왕, 미륵사 창건은 무왕 때의 일이다."},
{"id":"h110","subj":"한국사","unit":"삼국 시대","q":"신라 지증왕 때의 사실로 옳은 것은?","opts":["시장을 감독하는 동시전을 설치하였다.","군사 업무를 맡는 병부를 설치하였다.","황룡사를 짓기 시작하였다.","천문을 관측하는 첨성대를 세웠다."],"ans":0,"exp":"지증왕은 국호를 신라로 정하고 왕이라는 칭호를 썼으며, 우산국을 복속하고 수도에 동시와 이를 감독하는 동시전을 두었다. 병부 설치는 법흥왕, 황룡사 창건은 진흥왕, 첨성대 건립은 선덕 여왕 때의 일이다."},
{"id":"h111","subj":"한국사","unit":"삼국 시대","q":"(가)~(라)를 일어난 순서대로 바르게 나열한 것은?\n\n(가) 사비성이 함락되고 백제가 멸망하였다.\n(나) 평양성이 함락되고 고구려가 멸망하였다.\n(다) 신라가 매소성에서 당의 군대를 물리쳤다.\n(라) 백제 부흥군과 왜의 수군이 백강에서 패하였다.","opts":["(가) - (나) - (라) - (다)","(가) - (라) - (나) - (다)","(가) - (라) - (다) - (나)","(라) - (가) - (나) - (다)"],"ans":1,"exp":"백제 멸망(660) → 백강 전투(663) → 고구려 멸망(668) → 매소성 전투(675)의 순서이다. 백강 전투는 백제가 멸망한 뒤 부흥 운동 과정에서 일어났고, 매소성 전투는 고구려가 멸망한 뒤 신라가 당을 몰아내는 전쟁 중에 일어났다."},
{"id":"h112","subj":"한국사","unit":"삼국 시대","q":"백제의 문화유산으로 옳지 않은 것은?","opts":["미륵사지 석탑","분황사 모전 석탑","정림사지 5층 석탑","서산 용현리 마애 여래 삼존상"],"ans":1,"exp":"분황사 모전 석탑은 신라 선덕 여왕 때 돌을 벽돌 모양으로 다듬어 쌓은 탑이다. 익산 미륵사지 석탑과 부여 정림사지 5층 석탑은 백제의 석탑이고, 서산 용현리 마애 여래 삼존상은 '백제의 미소'로 불리는 백제의 불상이다."},
{"id":"h113","subj":"한국사","unit":"삼국 시대","q":"신라의 돌무지덧널무덤에 대한 설명으로 옳은 것은?","opts":["널방의 벽과 천장에 벽화를 그렸다.","천마총과 황남대총이 대표적이다.","벽돌을 쌓아 널방을 만들었다.","무덤의 둘레돌에 12지 신상을 새겼다."],"ans":1,"exp":"돌무지덧널무덤은 나무 덧널 위에 돌을 쌓고 흙으로 덮은 무덤으로, 경주의 천마총과 황남대총이 대표적이다. 널방이 없어 벽화를 그릴 수 없고 도굴이 어려워 껴묻거리가 많이 남았다. 벽화는 굴식 돌방무덤, 벽돌로 쌓은 널방은 무령왕릉 같은 벽돌무덤, 12지 신상을 새긴 둘레돌은 통일 신라 무덤의 특징이다."},
{"id":"h114","subj":"한국사","unit":"삼국 시대","q":"__그__가 권력을 잡고 있던 시기의 사실로 옳은 것은?\n\n__그__는 천리장성을 쌓는 일을 감독하다가 정변을 일으켜 영류왕을 죽이고 보장왕을 세웠다. 그 뒤 스스로 대막리지가 되어 나라의 정치와 군사를 모두 쥐었다.","opts":["살수에서 수의 군대를 물리쳤다.","백제의 한성을 함락하였다.","위의 관구검에게 환도성을 빼앗겼다.","안시성에서 당의 군대를 물리쳤다."],"ans":3,"exp":"자료의 인물은 642년에 정변을 일으킨 연개소문이다. 당 태종은 이를 구실로 고구려에 쳐들어왔으나 645년 안시성에서 물러났다. 살수 대첩은 612년 영양왕 때, 한성 함락은 475년 장수왕 때, 관구검의 침입은 3세기 동천왕 때의 일이다."},
{"id":"h115","subj":"한국사","unit":"삼국 시대","q":"삼국의 통치 체제에 대한 설명으로 옳은 것은?","opts":["고구려에서는 상대등이 귀족 회의를 이끌었다.","백제는 6좌평과 16관등의 제도를 두었다.","신라는 지방에 욕살과 처려근지를 보냈다.","고구려는 지방을 5방으로 나누고 방령을 두었다."],"ans":1,"exp":"백제는 6좌평과 16관등의 제도를 갖추었고, 지방을 5방으로 나누어 방령을 두었다. 상대등은 신라에서 화백 회의를 이끈 귀족의 대표이고, 욕살과 처려근지는 고구려의 지방관이다. 고구려의 귀족 회의는 대대로가 이끌었다."},
{"id":"h116","subj":"한국사","unit":"삼국 시대","q":"삼국의 역사서 편찬에 대한 설명으로 옳은 것은?","opts":["신라에서는 진흥왕 때 거칠부가 『국사』를 편찬하였다.","고구려에서는 소수림왕 때 고흥이 『서기』를 편찬하였다.","백제에서는 무령왕 때 이문진이 『신집』을 편찬하였다.","신라에서는 법흥왕 때 김대문이 『유기』를 편찬하였다."],"ans":0,"exp":"신라는 진흥왕 때 거칠부가 『국사』를 편찬하였다. 『서기』는 백제 근초고왕 때 고흥이 편찬하였고, 『신집』 5권은 고구려 영양왕 때 이문진이 예부터 전하던 『유기』를 간추려 만든 것이다. 김대문은 통일 신라 때 『화랑세기』 등을 쓴 인물이다."},
