{"id":"p26e09","no":9,"subj":"영어","unit":"어휘","q":"문맥상 밑줄 친 regular의 의미와 가장 가까운 것은?\n\nHHWnever (https://hhwnever.com)\n\nHousehold Hazardous Waste\n\nLeftover household products that can catch fire or explode under certain circumstances are considered household hazardous waste (HHW). Although it depends on your local solid waste agency or recycling facility, some examples include pesticides, paints, light bulbs, batteries, and nail polish. These products require special care when you dispose of them. HHW may be dangerous to people and bad for the environment if they are poured down the drain, dumped on the ground, or thrown out with __regular__ trash.\n\nWhat you can do:\n▪ Try to reduce your purchases of these products, and look for alternative, non-hazardous products.\n▪ When you need to dispose of these products, look for special collection events in your community or permanent collection centers.\n▪ If you have to dispose of HHW, first check with your local waste management agency to learn what rules apply in your community.","opts":["recyclable","regional","ordinary","burnable"],"ans":2,"exp":"regular trash는 유해 폐기물과 구별되는 \"보통의, 일반\" 쓰레기를 뜻하므로 ordinary가 가장 가깝다. recyclable(재활용할 수 있는), regional(지역의), burnable(태울 수 있는)은 뜻이 다르다.","past":true,"paper":"2026-e","src":"2026 기출 9번"},
{"id":"p26e10","no":10,"subj":"영어","unit":"독해 주제","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: dirpvlibrary@cgmail.com\nFrom: mtsmith@cgmail.com\nDate: May 20, 2026\nSubject: Research project on local communities\n\nDear Director of Pennville Library,\n\nI hope this email finds you well.\nI am currently working on a research project on developing local communities and believe the resources available at your library would greatly benefit my work.\n\nIt is my understanding that using the library facilities requires proper authorization, and I would be more than happy to provide any documentation or information required to obtain this authorization. I would also be willing to comply with any rules and regulations that come with using the library facilities.\n\nI would greatly appreciate it if you could grant me permission to use the library facilities. I look forward to hearing from you soon.\n\nThank you for your time and consideration.\n\nSincerely,\nMatt Smith","opts":["도서관 자료를 사용할 수 있는 권한을 요청하려고","연구 자료 분석 방법에 관해 도움을 요청하려고","도서관 대출 자료의 반납일 연장을 요청하려고","연구 자료 수집 방법에 관해 문의하려고"],"ans":0,"exp":"\"I would greatly appreciate it if you could grant me permission to use the library facilities.\"에서 연구를 위해 도서관 시설과 자료를 쓸 수 있게 허가해 달라는 목적이 드러난다. 자료 분석 방법, 반납일 연장, 자료 수집 방법에 대한 말은 없다.","past":true,"paper":"2026-e","src":"2026 기출 10번"},
{"id":"p26e11","no":11,"subj":"영어","unit":"독해 내용일치","q":"다음 글의 Volunteer Program에 대한 내용과 일치하지 않는 것은?\n\nKingston National Park\nVolunteer Program\n\nAre you passionate about connecting with visitors to Kingston National Park? Join us as a tour guide or visitor services host. Volunteering as a tour guide can be a rewarding experience, both personally and for the visitors you’ll welcome. You’ll connect with them to share the beauty and importance of our national park.\n\nYour role includes:\n■ Warmly greeting and assisting visitors\n■ Leading or supporting guided tours\n\nWhether you prefer regular commitments or occasional volunteering during weekends, school holidays or special events, we have opportunities to suit your availability. We provide comprehensive support, including first aid training, guiding resources and a uniform.\n\nTo sign up, please visit our website (www.goktnp.org) and complete the application form. Join Kingston National Park today!","opts":["자원봉사자는 방문객을 환영하는 역할을 한다.","자원봉사자는 정기적으로 활동할 수 있다.","자원봉사 신청 전 응급처치 교육을 받아야 한다.","자원봉사 신청은 온라인으로 해야 한다."],"ans":2,"exp":"응급처치 교육(first aid training)은 공원이 자원봉사자에게 제공하는 지원의 하나이지, 신청하기 전에 받아야 하는 조건이 아니다. 방문객을 따뜻하게 맞이하는 역할, 정기적인 활동(regular commitments) 가능, 웹사이트에서 신청서 작성은 모두 글과 일치한다.","past":true,"paper":"2026-e","src":"2026 기출 11번"},
{"id":"p26e12","no":12,"subj":"영어","unit":"독해 내용일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\nChemBioPhys Campus\nConstruction Projects\n\nWe’re enhancing our campuses with new facilities and collaborations to advance energy systems research and development.\n\nOur construction and renovation projects will enable more cross-disciplinary research and partnership opportunities and new ways to scale up global technologies for the marketplace.\n\nConstruction began in January 2026 and is anticipated to be completed in 2027.\n\nHere’s what our neighbors can expect:\n■ Construction will take place 7:00 a.m.–3:30 p.m. Monday–Friday. There may be occasional work on evenings or weekends due to unexpected circumstances.\n■ There are no anticipated road closures in the community.\n■ There are no anticipated impacts to utilities (water, gas, electricity) in the surrounding neighborhoods.\n■ Expect increased worker vehicle traffic via the east entrance along West Parkway, with peak activity 6:00 a.m.–7:30 a.m. and 3:30 p.m.–4:00 p.m.","opts":["The construction projects will expand research collaborations among different disciplines.","The construction schedule may be adjusted when necessary.","The construction is not expected to affect utilities in the nearby neighborhoods.","The traffic via the east entrance along West Parkway will increase only in the morning."],"ans":3,"exp":"동쪽 출입구의 작업자 차량 통행은 오전 6:00~7:30뿐 아니라 오후 3:30~4:00에도 몰린다고 했으므로 \"아침에만 늘어난다\"는 말은 틀리다. 학제 간 연구 확대(cross-disciplinary research), 예상치 못한 상황에 따른 저녁·주말 작업, 수도·가스·전기에 영향이 없다는 내용은 글과 일치한다.","past":true,"paper":"2026-e","src":"2026 기출 12번"},
{"id":"p26e13","no":13,"subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nPersonality typing is a system of categorizing people (1) __depending__ on how they think and act in certain situations―but there are clear differences between different personality type systems and what they can tell you about yourself. The Myers and Briggs personality system and the Enneagram of Personality are two leading personality typing systems (2) __that__ are used around the world. Both systems help people (3) __gains__ a better insight into their career possibilities, the dynamics of their relationships, the working patterns of their employees and even their own thought patterns. Some personality typologists prefer (4) __to use__ one system over the other but the two systems are often used together. Each has their own strengths and weaknesses.","opts":["(1) depending","(2) that","(3) gains","(4) to use"],"ans":2,"exp":"help는 \"help + 목적어 + (to) 동사원형\" 꼴로 쓰므로 gains가 아니라 gain 또는 to gain이어야 한다. depending on은 \"~에 따라\"라는 뜻의 분사 표현, that은 systems를 선행사로 하는 주격 관계대명사, prefer to use는 to부정사를 목적어로 취한 것이어서 모두 옳다.","past":true,"paper":"2026-e","src":"2026 기출 13번"},
{"id":"p26e14","no":14,"subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nMoltbook is a site (1) __where__ the AI agents―bots built by humans―can post and interact with each other. It is designed to look like Reddit, (2) __with__ subreddits on different topics and upvoting*. On 2 February the platform stated it had more than 1.5 million AI agents signed up to the service. Humans are allowed, but only (3) __as__ observers. Moltbook was developed in the wake of Moltbot, a free and open-source AI bot that can act as an automated agent for users―doing the mundane tasks assigned to it such as reading, summarising and responding to emails, organising a calendar or (4) __book__ a table at a restaurant.\n\n* upvoting: ‘좋아요’ 누르기","opts":["(1) where","(2) with","(3) as","(4) book"],"ans":3,"exp":"such as 뒤에 reading, summarising and responding, organising이 동명사로 나열되고 or로 이어지므로 마지막도 같은 꼴인 booking이어야 한다(병렬 구조). where는 a site를 선행사로 하고 뒤에 완전한 절이 오는 관계부사, with는 \"~을 갖춘\"이라는 전치사, as는 \"~로서\"라는 전치사로 모두 옳다.","past":true,"paper":"2026-e","src":"2026 기출 14번"},
{"id":"p26e15","no":15,"subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nGiraffes may all look identical to us. But none has exactly the same markings―and certain patterns, especially large, round patches, can boost their chances of survival before they turn 4 months old. Biologists can’t decide why giraffes evolved patches. David Lee at the Nature Institute in South Carolina and his colleagues examined 258 wild baby Masai giraffes in Tanzania for clues to the impact of patches on the animals. They found that calves with fewer, larger spots had a 17 percent higher chance of survival than those with more, smaller spots. They also found that those with more round spots had a 27 percent higher survival rate than those with elliptical* spots.\n\n* elliptical: 타원형의","opts":["the unique ways to raise baby giraffes in Tanzania","different survival rates of baby giraffes by region","the relationship between baby giraffes’ spots and survival rates","scientific methods to conduct research on giraffes’ calves"],"ans":2,"exp":"무늬가 적고 크거나 둥근 새끼 기린의 생존율이 더 높았다는 연구 결과를 소개하므로 주제는 \"새끼 기린의 무늬와 생존율의 관계\"이다. 기린을 기르는 방법, 지역별 생존율 차이, 연구 방법 자체는 글의 중심 내용이 아니다.","past":true,"paper":"2026-e","src":"2026 기출 15번"},
{"id":"p26e16","no":16,"subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nIn the face of significant education policy challenges such as emerging skills shortages and the need for teaching and learning innovation, schools are seeking ways to enhance school effectiveness.\n\n(A) By assisting teachers to better understand student learning processes and education policies, schools can improve teacher effectiveness and address the looming teacher shortage resulting from retiring baby-boomers and staff who leave when their term contracts end.\n(B) Schools should then effectively and efficiently convey this vital information to teachers in a way that maintains the teaching quality.\n(C) To survive these shortages, schools must put processes in place before teachers leave and their pedagogical knowledge leaves with them. Because of the ageing workforce, it is critical to have effective succession planning in place to capture this knowledge.","opts":["(A) － (B) － (C)","(A) － (C) － (B)","(B) － (C) － (A)","(B) － (A) － (C)"],"ans":1,"exp":"주어진 글의 \"학교 효과성을 높일 방법\"을 (A)가 교사 지원과 다가오는 교사 부족 문제로 이어 받는다. (C)의 these shortages는 (A)의 teacher shortage를 가리키고, (B)의 this vital information은 (C)에서 붙잡아 두어야 한다고 한 지식(this knowledge)을 가리키므로 (A)－(C)－(B) 순서이다.","past":true,"paper":"2026-e","src":"2026 기출 16번"},
{"id":"p26e17","no":17,"subj":"영어","unit":"독해 삽입","q":"주어진 문장이 들어갈 위치로 가장 적절한 것은?\n\nThe gap probably had more to do with each school’s resources than with a student’s daily ration of chocolate cereal.\n\nWe’ve all heard that kids who eat breakfast do better in school. (1) It makes sense; it’s hard to focus on an empty stomach. (2) But despite their best attempts, researchers haven’t been able to pinpoint why breakfast aids learning―if that’s even the case. (3) A study of elementary school students found that, in some schools, kids behaved better after they ate breakfast; in other schools, they acted worse. (4) Students at well-equipped schools behave better regardless of their diet.","opts":["(1)","(2)","(3)","(4)"],"ans":3,"exp":"주어진 문장의 The gap(그 차이)은 어떤 학교에서는 아침을 먹은 뒤 행동이 좋아지고 다른 학교에서는 나빠졌다는 연구 결과를 가리키므로 그 바로 뒤인 (4)에 들어가야 한다. 또 \"학교의 자원과 더 관련이 있다\"는 내용이 마지막 문장의 \"시설이 잘 갖춰진 학교의 학생들은 식사와 상관없이 더 잘 행동한다\"로 자연스럽게 이어진다.","past":true,"paper":"2026-e","src":"2026 기출 17번"},
{"id":"p26e18","no":18,"subj":"영어","unit":"독해 흐름","q":"다음 글의 흐름상 어색한 문장은?\n\nFilms, like literary works, are powerful instruments of education. (1) __On a simpler level, English language movies can be used in classrooms as a vehicle for teaching the English language.__ (2) __However, the animated film Future Galaxy deals with social issues from a historical perspective.__ (3) __But on a higher level, movies can be used as prisms through which one can learn how to understand, analyze and “read” complex aspects of the world humans have constructed and deconstructed in diverse issues in cultural, social, political, and economic spheres.__ (4) __Perhaps not most, but many Hollywood movies can be an insightful source to teach not only American culture, but also socio-economic-political-historical facets in content-based classes.__","opts":["(1)","(2)","(3)","(4)"],"ans":1,"exp":"글은 영화가 교육 도구로 쓰이는 방식을 \"단순한 수준(영어 교육)\"과 \"더 높은 수준(세상을 이해하고 분석하는 틀)\"으로 나누어 설명한다. (2)는 특정 애니메이션 영화가 무엇을 다루는지 말할 뿐이어서, On a simpler level과 But on a higher level로 이어지는 대비의 흐름을 끊는다.","past":true,"paper":"2026-e","src":"2026 기출 18번"},
{"id":"p26e19","no":19,"subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nRecently, it has been demonstrated in a series of ingenious experiments that we even perceive colors through ______. There are radical variations in the way languages carve up the spectrum of visible light; for example, green and blue are distinct colors in English but are considered shades of the same color in many languages. And it turns out that the colors that our language routinely obliges us to treat as distinct can refine our purely visual sensitivity to certain color differences in reality, so that our brains are trained to exaggerate the distance between shades of color if these have different names in our language. As strange as it may sound, our experience of a Chagall painting actually depends to some extent on whether our language has a word for blue.","opts":["the reflection of visible light","the comparison of various shades","the lens of our mother tongue","communication among diverse language speakers"],"ans":2,"exp":"언어가 색을 어떻게 나누어 부르느냐에 따라 실제 색 차이에 대한 시각적 민감도까지 달라진다는 내용이므로, 우리는 \"모국어라는 렌즈\"를 통해 색을 지각한다는 말이 알맞다. 가시광선의 반사, 색조의 비교, 여러 언어 사용자 사이의 의사소통은 글의 요지와 관계가 없다.","past":true,"paper":"2026-e","src":"2026 기출 19번"},
{"id":"p26e20","no":20,"subj":"영어","unit":"독해 빈칸","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nMost of us put a lot of stock in what scientists tell us because we know that scientists reach their conclusions by gathering and analyzing facts. If someone asked you why you believe that smoking is bad and jogging is good, or that the earth is round and the galaxy is flat, you would point to the facts. You might need to explain that you do not personally know the facts to which you are pointing, but that you do know that at some time in the past, a bunch of very earnest people in white lab coats went out and watched the world, wrote down what they looked into, analyzed what they wrote down, and then told the rest of us what to believe. Scientists are credible because they draw conclusions from ______, and ever since the empiricists trumped the dogmatists* and became the kings of ancient Greek medicine, westerners have had a special reverence for conclusions that are based on things they can see.\n\n* dogmatist: 교조주의자","opts":["intuition","inspiration","observation","speculation"],"ans":2,"exp":"과학자들은 세상을 지켜보고(watched the world) 기록하고 분석해 결론을 내리며, 서양인은 \"볼 수 있는 것에 바탕을 둔 결론\"을 존중해 왔다고 했으므로 빈칸에는 observation(관찰)이 알맞다. intuition(직관), inspiration(영감), speculation(추측)은 사실을 모으고 본다는 내용과 반대된다.","past":true,"paper":"2026-e","src":"2026 기출 20번"},
{"id":"p26c01","no":1,"subj":"지역사회간호","unit":"간호사의 역할","q":"다음 설명에 해당하는 지역사회간호사의 역할은?\n\n지역사회간호사의 역할 중 가장 오래된 것으로, 기본간호술부터 전문적 간호기술까지 요구되며 동시에 면담, 상담기술, 의사소통, 관찰과 경청기법, 교육기법 등의 기술이 필요하다.","opts":["협력자","변화촉진자","사례관리자","직접간호제공자"],"ans":3,"exp":"가장 오래된 역할이며 기본간호술부터 전문 간호기술까지 써서 대상자를 직접 돌보는 것은 직접간호제공자이다. 협력자는 다른 전문 인력과 함께 일하는 역할, 변화촉진자는 대상자가 바람직한 방향으로 바뀌도록 동기를 주는 역할, 사례관리자는 대상자의 요구에 맞게 서비스를 연결하고 조정하는 역할이다.","past":true,"paper":"2026-c","src":"2026 기출 1번"},
{"id":"p26c02","no":2,"subj":"지역사회간호","unit":"간호과정","q":"지역사회 금연사업의 목표를 ‘금연교실을 매주 1회 실시한다’고 설정하였을 때, 투입－산출모형의 목표분류에 해당하는 것은?","opts":["산출목표","투입목표","결과목표","영향목표"],"ans":0,"exp":"금연교실을 몇 번 열었는지는 사업 활동으로 바로 나오는 실적이므로 산출목표이다. 투입목표는 인력·예산·시설 같은 자원에 관한 목표이고, 결과(영향)목표는 흡연율 감소나 지식·태도 변화처럼 사업으로 대상자에게 나타난 변화에 관한 목표이다.","past":true,"paper":"2026-c","src":"2026 기출 2번"},
{"id":"p26c03","no":3,"subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정 자료분석에서 자료를 표나 그림, 그래프 등으로 작성하는 단계는?","opts":["분류단계","확인단계","요약단계","결론단계"],"ans":2,"exp":"자료분석은 분류 → 요약 → 확인(비교) → 결론 순으로 하며, 분류한 자료를 비율로 계산하고 표·그림·그래프로 정리하는 것은 요약단계이다. 분류단계는 자료를 범주별로 나누는 것, 확인단계는 다른 지역이나 과거 자료와 비교해 빠지거나 맞지 않는 것을 살피는 것, 결론단계는 건강문제를 찾아내는 것이다.","past":true,"paper":"2026-c","src":"2026 기출 3번"},
{"id":"p26c04","no":4,"subj":"지역사회간호","unit":"보건행정","q":"‘보건진료 전담공무원’의 자격을 규정하고 있는 법률은?","opts":["의료법","지역보건법","국민건강증진법","농어촌 등 보건의료를 위한 특별조치법"],"ans":3,"exp":"보건진료 전담공무원의 자격(간호사·조산사 면허를 가지고 정해진 직무교육을 받은 사람)과 보건진료소 설치는 「농어촌 등 보건의료를 위한 특별조치법」에서 정한다. 지역보건법은 보건소와 지역보건의료계획, 국민건강증진법은 건강증진사업, 의료법은 의료인과 의료기관을 다룬다.","past":true,"paper":"2026-c","src":"2026 기출 4번"},
{"id":"p26c05","no":5,"subj":"지역사회간호","unit":"보건교육","q":"브래드쇼(Bradshaw)의 교육 요구 유형에서 전문가에 의해 규정되는 요구는?","opts":["규범적 요구","내면적 요구","외향적 요구","상대적 요구"],"ans":0,"exp":"규범적 요구는 보건의료 전문가가 전문적 기준에 비추어 필요하다고 판단한 요구이다. 내면적 요구는 대상자가 마음속으로 느끼는 요구, 외향적 요구는 그것을 말이나 행동으로 드러낸 요구, 상대적 요구는 다른 집단과 비교해서 드러나는 요구이다.","past":true,"paper":"2026-c","src":"2026 기출 5번"},
{"id":"p26c06","no":6,"subj":"지역사회간호","unit":"사회보장","q":"우리나라 건강보험제도에 대한 설명으로 옳은 것은?","opts":["보험료는 건강수준에 따라 책정된다.","가입자는 직장가입자와 지역가입자로 구분된다.","보험 가입 여부는 본인이 자율적으로 결정한다.","건강보험의 보험자는 건강보험심사평가원이다."],"ans":1,"exp":"건강보험 가입자는 직장가입자와 지역가입자로 나뉜다. 보험료는 건강수준이 아니라 소득 등 부담능력에 따라 매기고, 가입은 법으로 정한 강제 가입이며, 보험자는 국민건강보험공단이다(건강보험심사평가원은 요양급여비용의 심사와 평가를 맡는다).","past":true,"paper":"2026-c","src":"2026 기출 6번"},
{"id":"p26c07","no":7,"subj":"지역사회간호","unit":"산업보건","q":"「근로자 건강진단 실시기준」상 근로자의 건강관리구분 판정에서 ‘C₁’에 해당하는 것은?","opts":["일반 질병의 소견을 보여 사후관리가 필요한 자","직업성 질병의 소견을 보여 사후관리가 필요한 자","일반 질병으로 진전될 우려가 있어 추적관찰이 필요한 자","직업성 질병으로 진전될 우려가 있어 추적검사 등 관찰이 필요한 자"],"ans":3,"exp":"C₁은 직업성 질병으로 진전될 우려가 있어 추적검사 등 관찰이 필요한 근로자(직업병 요관찰자)이다. 일반 질병으로 진전될 우려가 있는 사람은 C₂, 직업성 질병의 소견이 있는 사람은 D₁, 일반 질병의 소견이 있는 사람은 D₂이다.","past":true,"paper":"2026-c","src":"2026 기출 7번"},
{"id":"p26c08","no":8,"subj":"지역사회간호","unit":"간호 이론","q":"베티 뉴만(Betty Neuman)의 건강관리체계 이론 중 다음에서 설명하는 것은?\n\n대상자의 생존에 필요한 에너지 자원으로 생리적, 심리적, 사회ㆍ문화적, 발달적, 영적 변수들이 역동적으로 구성되어 개인의 고유한 특성을 나타낸다.","opts":["저항선","삼차예방","기본구조","스트레스원"],"ans":2,"exp":"뉴만 이론에서 기본구조는 체계의 가장 안쪽에 있는, 생존에 필요한 에너지 자원으로 다섯 가지 변수로 이루어진다. 저항선은 기본구조를 둘러싸고 스트레스원에 맞서는 내적 방어선, 스트레스원은 체계를 흔드는 자극, 삼차예방은 반응이 나타난 뒤 재적응과 안정을 돕는 중재이다.","past":true,"paper":"2026-c","src":"2026 기출 8번"},
{"id":"p26c09","no":9,"subj":"지역사회간호","unit":"감염병 관리","q":"BCG 백신 예방접종을 통해 신생아가 면역을 획득하는 방법은?","opts":["자연능동면역","인공능동면역","자연수동면역","인공수동면역"],"ans":1,"exp":"백신(항원)을 맞고 몸이 스스로 항체를 만들어 얻는 면역은 인공능동면역이다. 자연능동면역은 병을 앓고 난 뒤에, 자연수동면역은 태반이나 모유로 어머니의 항체를 받아서, 인공수동면역은 면역글로불린이나 항독소를 주사로 맞아서 얻는다.","past":true,"paper":"2026-c","src":"2026 기출 9번"},
{"id":"p26c10","no":10,"subj":"지역사회간호","unit":"가족간호","q":"다음 설명에 해당하는 가족이론은?\n\n○ 가족구성원 개인 간의 관계를 고찰하는 방식이다.\n○ 각 개인은 할당된 역할을 인식하며 가족구성원은 그 역할에 대한 기대가 있다.\n○ 가족현상을 가족의 역할, 가족의 갈등, 의사소통, 의사결정 등 가족의 내적인 과정에 초점을 둔다.","opts":["체계이론","가족발달이론","구조－기능주의 이론","상징적 상호작용이론"],"ans":3,"exp":"상징적 상호작용이론은 가족구성원 사이의 상호작용과 역할, 의사소통 같은 가족 내부 과정을 본다. 체계이론은 가족을 하위체계와 환경이 서로 영향을 주고받는 개방체계로, 가족발달이론은 생활주기 단계별 발달과업으로, 구조－기능주의 이론은 가족의 구조와 사회 속에서 맡는 기능으로 가족을 설명한다.","past":true,"paper":"2026-c","src":"2026 기출 10번"},
{"id":"p26c11","no":11,"subj":"지역사회간호","unit":"감염병 관리","q":"감염성 질환의 발생 단계를 순서대로 바르게 나열한 것은?\n\n(가) 병원소\n(나) 병원체\n(다) 병원소로부터의 병원체 탈출\n(라) 새로운 숙주로의 침입\n(마) 전파\n(바) 숙주의 감수성","opts":["(가) → (다) → (나) → (라) → (마) → (바)","(나) → (가) → (다) → (마) → (라) → (바)","(나) → (다) → (가) → (마) → (라) → (바)","(바) → (나) → (다) → (가) → (라) → (마)"],"ans":1,"exp":"감염병 발생의 여섯 고리는 병원체 → 병원소 → 병원소로부터의 탈출 → 전파 → 새로운 숙주로의 침입 → 숙주의 감수성 순이다. 병원체가 병원소에서 살다가 빠져나와 옮겨지고, 새 숙주에 들어간 뒤 그 숙주의 감수성(면역)에 따라 발병이 정해진다. 이 고리 가운데 하나만 끊어도 유행을 막을 수 있다.","past":true,"paper":"2026-c","src":"2026 기출 11번"},
{"id":"p26c12","no":12,"subj":"지역사회간호","unit":"보건교육","q":"시뮬레이션 교육방법에 대한 설명으로 옳지 않은 것은?","opts":["윤리적 문제가 발생할 소지가 많다.","학습자의 능동적인 참여를 촉진한다.","학습자에게 흥미를 유발하고 학습 동기를 촉진한다.","모의상황을 준비하는 데 시간ㆍ노력 및 비용이 많이 든다."],"ans":0,"exp":"시뮬레이션은 실제와 비슷한 모의상황에서 연습하므로 실제 대상자에게 해를 끼칠 위험이 없어 윤리적 문제가 생길 소지가 적다. 학습자가 직접 참여해 흥미와 동기가 높아지는 것은 장점이고, 준비에 시간·노력·비용이 많이 드는 것은 단점으로 모두 옳은 설명이다.","past":true,"paper":"2026-c","src":"2026 기출 12번"},
{"id":"p26c13","no":13,"subj":"지역사회간호","unit":"역학 연구","q":"다음 설명에 해당하는 역학적 연구 방법은?\n\n○ 위험요인과 질병 간의 시간적 선후관계가 비교적 명확하다.\n○ 질병의 발생률과 비교위험도(상대위험도)를 구할 수 있다.\n○ 질병발생의 요인에 폭로된 집단과 폭로되지 않은 집단 간의 질병발생률을 비교 분석한다.","opts":["단면연구","실험연구","코호트연구","환자－대조군연구"],"ans":2,"exp":"요인에 폭로된 집단과 폭로되지 않은 집단을 추적해 발생률을 비교하고 상대위험도를 구하는 것은 코호트연구이다. 단면연구는 한 시점에 요인과 질병을 함께 조사해 선후관계를 알기 어렵고, 환자－대조군연구는 환자와 대조군의 과거 노출을 비교해 교차비를 구한다. 실험연구는 연구자가 요인을 직접 배정한다.","past":true,"paper":"2026-c","src":"2026 기출 13번"},
{"id":"p26c14","no":14,"subj":"지역사회간호","unit":"가족간호","q":"가족간호사업에서 구조평가에 해당하는 것은?","opts":["사업이 계획대로 진행되었는가","사업에 투입된 인력이 적절하였는가","간호수행방법이나 수단이 적합하였는가","제공된 중재내용이 대상자 가족에게 적절하였는가"],"ans":1,"exp":"구조평가는 사업에 들어간 인력·시설·장비·예산 같은 자원이 적절했는지를 본다. 계획대로 진행되었는지, 수행방법이나 수단이 적합했는지, 중재내용이 대상자에게 맞았는지는 사업을 하는 과정을 보는 과정평가이다.","past":true,"paper":"2026-c","src":"2026 기출 14번"},
{"id":"p26c15","no":15,"subj":"지역사회간호","unit":"건강증진","q":"건강증진의 기본원칙 중 ‘옹호(advocate)’에 해당하는 것은?","opts":["보건의료 인력 및 관련 전문가 집단 간의 연합이 필요하다.","건강수준 향상을 위한 활동들에는 여러 수준과 분야 간에 통합 및 조정이 필요하다.","자신과 가족의 건강유지 능력과 권리를 인정하고 스스로 건강관리에 적극 참여하여 자신의 행동에 책임지는 것이 필요하다.","건강의 중요성에 대하여 대중의 관심을 불러일으키고, 보건의료 수요를 충족시킬 수 있는 건강한 보건정책수립의 필요성에 대한 촉구가 필요하다."],"ans":3,"exp":"오타와 헌장의 세 가지 기본 전략 가운데 옹호는 건강의 중요성을 널리 알려 관심을 일으키고 건강에 이로운 정책을 세우도록 촉구하는 것이다. 스스로 건강관리에 참여하고 책임지게 하는 것은 역량강화(enable), 전문가 집단의 연합과 여러 분야의 통합·조정은 연합·중재(mediate)에 해당한다.","past":true,"paper":"2026-c","src":"2026 기출 15번"},
{"id":"p26c16","no":16,"subj":"지역사회간호","unit":"재난간호","q":"재난현장에서 환자 중증도 분류(triage)를 할 때, ‘흑색’에 해당하는 것은?","opts":["생존에 영향을 주지 않는 범위에서 치료가 지연되어도 안전한 환자","생명을 위협하는 부상을 갖고 있으며, 즉각적인 치료가 필요한 환자","생존해 있으나 사용가능한 자원으로는 생존이 거의 불가능하다고 판단되는 환자","치료가 필요한 손상이 있으나 치료 여부와 상관없이 생존이 예상되는 환자"],"ans":2,"exp":"흑색은 사망했거나, 살아 있어도 쓸 수 있는 자원으로는 생존이 거의 불가능한 환자이다. 즉각적인 치료가 필요한 환자는 적색(긴급), 치료가 늦어져도 생존에 지장이 없는 환자는 황색(응급), 치료 여부와 관계없이 생존이 예상되는 가벼운 손상은 녹색(비응급)이다.","past":true,"paper":"2026-c","src":"2026 기출 16번"},
{"id":"p26c17","no":17,"subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 보건사업기획 모형은?\n\n○ 기획단계는 목적설정, 중재계획, 프로그램개발, 실행 준비, 평가로 구성된다.\n○ 질병이나 사고에 대한 위험요인과 예방방법이 알려져 있고, 우선순위가 정해져 있을 때 실제 수행을 위한 보건사업 개발에 적합한 방법이다.","opts":["NIBP(Needs Impact Based Planning)","PATCH(Planned Approach to Community Health)","MATCH(Multilevel Approach to Community Health)","MAPP(Mobilizing for Action through Planning and Partnerships)"],"ans":2,"exp":"MATCH는 목적설정 → 중재계획 → 프로그램개발 → 실행 준비 → 평가의 다섯 단계이며, 위험요인과 예방방법이 이미 알려져 있고 우선순위가 정해진 문제의 사업 개발에 알맞다. PATCH는 지역사회 조직화와 자료수집에서 시작하는 모형, MAPP은 지역사회 전략기획 모형, NIBP는 건강문제의 크기와 해결방법의 효과를 기준으로 요구를 평가하는 모형이다.","past":true,"paper":"2026-c","src":"2026 기출 17번"},
{"id":"p26c18","no":18,"subj":"지역사회간호","unit":"건강행위 이론","q":"사회생태학적 모형에서 개인 간 요인(interpersonal factor) 전략에 해당하는 것은?","opts":["조례나 법 제정","사회적 네트워크 강화","각종 유인 및 규제 조치","개인의 지식, 태도, 신념 변화를 위한 교육"],"ans":1,"exp":"개인 간 요인은 가족·친구·동료 같은 사회적 관계이므로 사회적 네트워크와 사회적 지지를 강화하는 전략이 해당한다. 지식·태도·신념을 바꾸는 교육은 개인 요인, 조례나 법 제정은 정책 요인 전략이고, 유인과 규제 조치는 조직 요인 수준의 전략으로 분류된다.","past":true,"paper":"2026-c","src":"2026 기출 18번"},
{"id":"p26c19","no":19,"subj":"지역사회간호","unit":"역학 지표","q":"보건지표에서 특정 연도의 전체 사망자 수 중 50세 이상의 사망자가 차지하는 분율은?","opts":["조사망률","표준화사망비","비례사망지수","비례사망률"],"ans":2,"exp":"비례사망지수(PMI)는 전체 사망자 가운데 50세 이상 사망자의 비율로, 높을수록 건강수준이 높다. 비례사망률은 전체 사망자 가운데 특정 원인으로 죽은 사람의 비율, 조사망률은 인구 1,000명당 사망자 수, 표준화사망비는 기대 사망자 수에 대한 실제 사망자 수의 비이다.","past":true,"paper":"2026-c","src":"2026 기출 19번"},
{"id":"p26c20","no":20,"subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 특별자치시장ㆍ특별자치도지사 또는 시장ㆍ군수ㆍ구청장이 필수예방접종을 실시하여야 하는 질병만을 모두 고르면?\n\nㄱ. 황열\nㄴ. 홍역\nㄷ. 결핵\nㄹ. 폐렴구균","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"ans":3,"exp":"법 제24조의 필수예방접종 대상에는 홍역, 결핵, 폐렴구균이 들어 있다. 황열은 필수예방접종 대상이 아니며, 유행 지역으로 가는 여행자가 맞는 접종이다.","past":true,"paper":"2026-c","src":"2026 기출 20번"},
{"id":"p25m01","no":1,"subj":"간호관리","unit":"마케팅","q":"다음에서 설명하는 서비스의 특성은?\n\n서비스는 제공하는 사람에 따라 서비스의 질이 달라질 수 있으므로 표준화 작업이 필요하다.","opts":["소멸성","무형성","이질성","비분리성"],"ans":2,"exp":"제공하는 사람·시간·장소에 따라 질이 달라지는 특성은 이질성(가변성)이고, 그래서 표준화와 교육이 필요하다. 소멸성은 저장할 수 없다는 것, 무형성은 눈에 보이거나 만질 수 없다는 것, 비분리성은 생산과 소비가 동시에 일어난다는 것이다.","past":true,"paper":"2025-m","src":"2025 기출 1번"},
{"id":"p25m02","no":2,"subj":"간호관리","unit":"간호기록","q":"간호기록 작성에 대한 설명으로 옳은 것은?","opts":["간호처치를 수행하기 전에 기록한다.","공인되지 않은 약어를 사용하여 기록한다.","다른 간호사가 수행한 것을 대신 기록하지 않는다.","환자의 주관적 호소를 제외하고 객관적 사실만 기록한다."],"ans":2,"exp":"간호기록은 간호를 직접 수행한 사람이 자기 이름으로 적어야 하므로 남이 한 일을 대신 기록하지 않는다. 기록은 수행한 뒤에 하고, 기관이 인정한 약어만 쓴다. 환자의 주관적 호소도 환자가 말한 그대로 기록에 포함한다.","past":true,"paper":"2025-m","src":"2025 기출 2번"},
{"id":"p25m03","no":3,"subj":"간호관리","unit":"환자안전","q":"다음에서 설명하는 환자안전 접근방법은?\n\n환자 안전사고의 가시적 오류와 잠재적 오류를 규명하기 위해 사고 발생 후 후향적으로 조사한다.","opts":["균형성과표(BSC)","6시그마(6sigma)","근본원인분석(RCA)","오류유형과 영향분석(FMEA)"],"ans":2,"exp":"사고가 난 뒤에 거슬러 올라가며 겉으로 드러난 오류와 그 밑에 깔린 시스템의 잠재적 오류를 찾는 방법은 근본원인분석(RCA)이다. 오류유형과 영향분석(FMEA)은 사고가 나기 전에 위험을 미리 찾는 전향적 방법이다. 균형성과표는 성과 평가 도구, 6시그마는 변이와 결함을 줄이는 질 관리 기법이다.","past":true,"paper":"2025-m","src":"2025 기출 3번"},
{"id":"p25m04","no":4,"subj":"간호관리","unit":"동기부여","q":"다음에 해당하는 동기부여 이론은?\n\n○ 자신이 받은 보상이 비교 대상보다 과다하다고 지각하여 더 많은 업무를 맡으려고 한다.\n○ 자신이 받은 보상이 비교 대상보다 과소하다고 지각하여 추가적인 보상 기회를 찾는다.","opts":["브룸(Vroom)의 기대이론","아담스(Adams)의 공정성이론","로크(Locke)의 목표설정이론","맥클리랜드(McClelland)의 성취동기이론"],"ans":1,"exp":"자기의 투입 대비 보상을 남과 비교해 불공정하다고 느끼면 투입이나 보상을 바꿔 균형을 맞추려 한다는 것은 아담스의 공정성이론이다. 기대이론은 기대·수단성·유의성으로 노력을 설명하고, 목표설정이론은 구체적이고 어려운 목표가 성과를 높인다고 보며, 성취동기이론은 성취·권력·친화 욕구를 다룬다.","past":true,"paper":"2025-m","src":"2025 기출 4번"},
{"id":"p25m05","no":5,"subj":"간호관리","unit":"인사고과","q":"직무수행평가 시 피평가자의 우수한 요소에 영향을 받아 다른 요소도 높게 평가하는 오류는?","opts":["혼 효과(horn effect)","후광 효과(halo effect)","근접 착오(recency error)","중심화 경향(central tendency)"],"ans":1,"exp":"한 가지 좋은 점이 다른 요소의 평가까지 끌어올리는 것은 후광 효과다. 혼 효과는 반대로 한 가지 나쁜 점 때문에 다른 요소도 낮게 평가하는 것이다. 근접 착오는 최근의 일에 치우쳐 평가하는 것, 중심화 경향은 평점을 중간에 몰아 주는 것이다.","past":true,"paper":"2025-m","src":"2025 기출 5번"},
{"id":"p25m06","no":6,"subj":"간호관리","unit":"인적자원관리","q":"다음을 포함하는 인적자원관리 활동은?\n\n○ 간호인력 산정\n○ 인력 모집 및 선발\n○ 인력 배치","opts":["직무관리","확보관리","개발관리","유지관리"],"ans":1,"exp":"필요한 인력을 산정하고 모집·선발해 배치하는 것은 확보관리다. 직무관리는 직무설계·직무분석·직무평가, 개발관리는 교육훈련·경력개발·인사고과, 유지관리는 인간관계·노사관계·이직 관리 등을 다룬다.","past":true,"paper":"2025-m","src":"2025 기출 6번"},
{"id":"p25m07","no":7,"subj":"간호관리","unit":"관리이론","q":"관리이론 중 인간관계론에 대한 내용으로 옳은 것은?","opts":["행동과 의사결정에 대한 규칙과 절차를 문서화한다.","구성원의 생산성에 비례하여 보수를 지급한다.","자원은 변환과정을 통해 제품 및 서비스로 산출된다.","구성원에 대한 관리자의 관심이 생산성을 높인다."],"ans":3,"exp":"인간관계론은 호손 연구에서 나온 이론으로, 관리자의 관심과 인간관계, 비공식 집단 같은 사회·심리적 요인이 생산성을 좌우한다고 본다. 규칙과 절차의 문서화는 관료제론, 생산성에 따른 보수(차별성과급)는 과학적 관리론, 투입이 변환과정을 거쳐 산출된다는 것은 체계이론이다.","past":true,"paper":"2025-m","src":"2025 기출 7번"},
{"id":"p25m08","no":8,"subj":"간호관리","unit":"간호윤리","q":"생명의료윤리 원칙에 대한 개념 설명으로 옳지 않은 것은?","opts":["자율성 존중의 원칙 － 환자가 자신의 생각에 따라 선택하고 행동할 권리를 존중한다.","악행금지의 원칙 － 의도적으로 해를 입히는 것과 해를 입히는 위험을 초래하는 것을 금한다.","선행의 원칙 － 해악을 제거하고 적극적으로 선을 실행한다.","정의의 원칙 － 환자에게 성실하게 간호를 제공하겠다는 약속을 이행한다."],"ans":3,"exp":"정의의 원칙은 부담과 혜택을 공정하게 나누는 것, 곧 같은 것은 같게 대하는 분배의 원칙이다. 약속을 지키는 것은 성실(신의)의 규칙에 해당한다. 자율성 존중, 악행금지, 선행의 원칙에 대한 설명은 옳다.","past":true,"paper":"2025-m","src":"2025 기출 8번"},
{"id":"p25m09","no":9,"subj":"간호관리","unit":"간호단위관리","q":"간호단위 환경관리에 대한 설명으로 옳은 것은?","opts":["입원실은 300럭스(lux) 이상의 조도를 유지한다.","다인실에는 사생활 보호를 위해 커튼이나 칸막이를 설치한다.","격리실은 전실을 두어 이중문을 설치하고 항상 양압을 유지한다.","간호사실은 원활한 업무를 위해 70데시벨(decibel) 정도가 적절하다."],"ans":1,"exp":"여러 환자가 함께 쓰는 병실에서는 커튼이나 칸막이로 사생활을 보호한다. 입원실은 쉬는 곳이므로 조도를 100~200럭스 정도로 낮게 두고, 병동의 소음은 40데시벨 안팎 이하로 조용하게 관리한다(70데시벨은 시끄러운 수준이다). 격리실은 방 종류에 따라 다르며 감염병 환자 격리실은 음압, 면역저하 환자를 위한 보호 격리실은 양압이므로 '항상 양압'은 틀리다.","past":true,"paper":"2025-m","src":"2025 기출 9번"},
{"id":"p25m10","no":10,"subj":"간호관리","unit":"기획","q":"다음 중 집단의사결정에 비해 개인의사결정이 효과적인 경우만을 모두 고르면?\n\nㄱ. 신속한 의사결정을 해야 하는 경우\nㄴ. 의사결정의 수용성이 중요한 경우\nㄷ. 다양한 지식을 활용해야 하는 경우\nㄹ. 의사결정의 명료한 책임소재가 필요한 경우","opts":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":1,"exp":"개인의사결정은 빠르고 누가 책임지는지가 분명하다는 장점이 있으므로 ㄱ과 ㄹ이 해당한다. 결정을 구성원이 잘 받아들이게 해야 하거나 여러 사람의 지식과 관점이 필요한 경우(ㄴ, ㄷ)에는 집단의사결정이 더 효과적이다.","past":true,"paper":"2025-m","src":"2025 기출 10번"},
{"id":"p25m11","no":11,"subj":"간호관리","unit":"리더십","q":"카츠(Katz)의 관리기술에 대한 설명으로 옳은 것은?","opts":["인간적 기술은 구성원의 업무 수행과 관련된 지식ㆍ방법ㆍ장비 등을 사용하는 능력이다.","실무적 기술은 상위 관리계층으로 올라갈수록 요구도가 높아진다.","개념적 기술은 조직을 전체로 보고 구성원의 활동을 조직 목표와 연결하여 이해하는 능력이다.","실무적 기술은 구성원과 함께 일할 수 있는 인간관계 능력이다."],"ans":2,"exp":"개념적 기술은 조직을 전체로 보고 각 부분의 활동을 목표와 연결해 이해하는 능력으로 최고관리자에게 가장 많이 요구된다. 지식·방법·장비를 쓰는 능력은 실무적 기술이고 일선 관리자에게 많이 필요하며 위로 갈수록 요구도가 낮아진다. 구성원과 함께 일하는 인간관계 능력은 인간적 기술이다.","past":true,"paper":"2025-m","src":"2025 기출 11번"},
{"id":"p25m12","no":12,"subj":"간호관리","unit":"인적자원관리","q":"다음 중 인력 충원을 위한 내부 모집의 장점은?","opts":["인력 충원 비용이 절감된다.","기관에 대한 홍보 효과가 있다.","조직 내 과도한 경쟁을 예방한다.","유능한 전문가의 영입 가능성이 높아진다."],"ans":0,"exp":"내부 모집은 조직 안에서 사람을 찾으므로 모집 비용과 시간이 적게 들고 구성원의 사기를 높인다. 기관 홍보 효과와 유능한 전문가의 영입은 외부 모집의 장점이다. 내부 모집은 승진을 둘러싼 경쟁과 파벌을 오히려 키울 수 있다.","past":true,"paper":"2025-m","src":"2025 기출 12번"},
{"id":"p25m13","no":13,"subj":"간호관리","unit":"재무관리","q":"재무상태표(대차대조표)에 대한 설명으로 옳은 것은?","opts":["기업 재무구조의 건전성을 알 수 있다.","기본 요소는 수익, 비용, 당기순이익 등이다.","일정 기간 기업활동을 통해 얻어진 손익을 나타낸다.","현금의 유입과 유출을 영업ㆍ투자ㆍ재무 활동으로 표시한다."],"ans":0,"exp":"재무상태표는 일정 시점의 자산, 부채, 자본을 보여 주어 재무구조가 건전한지 알 수 있게 한다. 수익·비용·당기순이익을 요소로 일정 기간의 손익을 나타내는 것은 손익계산서이고, 현금의 유입과 유출을 영업ㆍ투자ㆍ재무 활동으로 나눠 보여 주는 것은 현금흐름표다.","past":true,"paper":"2025-m","src":"2025 기출 13번"},
{"id":"p25m14","no":14,"subj":"간호관리","unit":"의사소통","q":"다음 사례에 나타난 의사소통 네트워크 유형은?\n\n○ 간호부는 ‘환자경험평가’에 대비하여 각 병동 파트장이 참여하는 팀을 구성하였다.\n○ 팀원 모두가 자유롭게 정보를 교환하고 의사소통하고 있다.","opts":["Y형","사슬형","수레바퀴형","완전연결형"],"ans":3,"exp":"구성원 모두가 서로 자유롭게 정보를 주고받는 형태는 완전연결형(개방형)이다. 사슬형은 위아래로만 전달되는 형태, 수레바퀴형은 중심의 한 사람에게 정보가 모이는 형태, Y형은 사슬형과 수레바퀴형이 섞여 조정자를 거치는 형태다.","past":true,"paper":"2025-m","src":"2025 기출 14번"},
{"id":"p25m15","no":15,"subj":"간호관리","unit":"간호단위관리","q":"간호단위 물품관리에 대한 설명으로 옳은 것은?","opts":["멸균물품은 선입선출이 가능하도록 정리한다.","재고관리 시 품목별 수량 확인을 생략한다.","리넨의 1일 정수량은 사용량의 3배 이상으로 한다.","유효기간이 경과하지 않았어도 사용하지 않는 물품은 폐기한다."],"ans":0,"exp":"멸균물품은 유효기간이 있으므로 먼저 들어온 것을 먼저 쓰도록(선입선출) 정리한다. 재고관리에서는 품목별 수량을 반드시 확인한다. 정수량은 사용량에 맞춰 정한 기준량이어서 많이 쌓아 둘수록 좋은 것이 아니고, 유효기간이 남은 물품은 버리지 않고 반납하거나 필요한 부서에서 쓰게 한다.","past":true,"paper":"2025-m","src":"2025 기출 15번"},
{"id":"p25m16","no":16,"subj":"간호관리","unit":"환자안전","q":"다음 중 환자 안전사고의 예방 및 감소 방안에 해당하는 것만을 모두 고르면?\n\nㄱ. 사건보고 및 의사소통체계를 마련한다.\nㄴ. 간호실무표준을 기초로 최선의 간호를 수행한다.\nㄷ. 기관의 정책, 규정, 지침 등을 정기적으로 숙지한다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":3,"exp":"세 가지 모두 환자 안전사고를 예방하고 줄이는 방안이다. 사건보고와 의사소통체계는 오류를 드러내 배우게 하는 조직 차원의 장치이고, 실무표준에 따른 간호와 기관의 정책·규정·지침 숙지는 간호사 개인이 지켜야 할 기본이다.","past":true,"paper":"2025-m","src":"2025 기출 16번"},
{"id":"p25m17","no":17,"subj":"간호관리","unit":"예산","q":"영기준 예산제(zero-based budgeting)에 대한 설명으로 옳지 않은 것은?","opts":["전년도 예산에 근거하지 않고 새롭게 예산을 책정한다.","비용과 성과를 연계함으로써 예산 낭비를 줄일 수 있다.","물가상승률 등 전년 대비 증감률을 반영하여 예산을 책정한다.","기존 사업의 타당성을 재평가하므로 시간이 걸리고 복잡하다."],"ans":2,"exp":"전년도 예산을 바탕으로 물가상승률 같은 증감률을 반영해 정하는 것은 점진적(증분) 예산제다. 영기준 예산제는 전년도 예산을 무시하고 모든 사업을 처음부터 다시 따져 정하므로 낭비를 줄일 수 있지만 시간과 노력이 많이 든다.","past":true,"paper":"2025-m","src":"2025 기출 17번"},
{"id":"p25m18","no":18,"subj":"간호관리","unit":"의료법규","q":"의료법령상 간호ㆍ간병통합서비스를 제공할 수 있는 의료기관이 아닌 것은?","opts":["치과병원","한방병원","요양병원","종합병원"],"ans":2,"exp":"의료법 시행규칙은 간호ㆍ간병통합서비스를 제공할 수 있는 병원급 의료기관을 병원, 치과병원, 한방병원, 종합병원으로 정한다. 요양병원과 정신병원은 여기에 들어 있지 않다.","past":true,"paper":"2025-m","src":"2025 기출 18번"},
{"id":"p25m19","no":19,"subj":"간호관리","unit":"질 관리","q":"다음에서 설명하는 데밍(Deming)의 PDCA 단계는?\n\n문제를 규명하고 개선 가능 분야를 검토한 후 해결 방안을 모색하고 선택한다.","opts":["Plan(계획)","Do(실행)","Check(검증)","Act(개선)"],"ans":0,"exp":"문제를 찾고 개선할 곳을 살펴 해결 방안을 고르는 것은 Plan(계획) 단계다. Do는 고른 방안을 작은 규모로 실행해 보는 단계, Check는 결과를 측정해 효과를 확인하는 단계, Act는 효과가 있으면 표준으로 삼아 넓히고 없으면 고쳐 다시 도는 단계다.","past":true,"paper":"2025-m","src":"2025 기출 19번"},
{"id":"p25m20","no":20,"subj":"간호관리","unit":"리더십","q":"피들러(Fiedler)의 상황적합성 이론에 근거할 때, 다음 설명에서 상황 호의성과 효과적인 리더를 바르게 연결한 것은?\n\n○ 간호관리자와 구성원 간의 관계는 좋다.\n○ 간호업무의 구조화 정도가 높다.\n○ 간호관리자의 직위 권한이 약하다.","opts":["상황 호의성: 비호의적 상황, 효과적인 리더: 과업지향적 리더","상황 호의성: 비호의적 상황, 효과적인 리더: 관계지향적 리더","상황 호의성: 호의적 상황, 효과적인 리더: 과업지향적 리더","상황 호의성: 호의적 상황, 효과적인 리더: 관계지향적 리더"],"ans":2,"exp":"피들러는 리더-구성원 관계, 과업 구조, 직위 권한의 순서로 상황을 판단한다. 가장 중요한 관계가 좋고 과업 구조화도 높으면 직위 권한이 약해도 호의적인 상황이다. 상황이 아주 호의적이거나 아주 비호의적일 때는 과업지향적 리더가, 중간 정도일 때는 관계지향적 리더가 효과적이다.","past":true,"paper":"2025-m","src":"2025 기출 20번"},
{"id":"p25k01","no":1,"subj":"국어","unit":"문장 고쳐 쓰기","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 표현의 정확성\n㉠ __의미에 맞는 정확한 단어 쓰기__.\n㉡ __부적절한 피ㆍ사동 표현에 유의함__.\n○ 여러 뜻으로 해석되는 표현 삼가기\n㉢ __하나의 뜻으로 해석되는 문장을 사용함__.\n○ 대등한 것끼리 접속\n㉣ __‘－고’, ‘－(으)며’, ‘와/과’ 등으로 접속되는 말에는 구조가 같은 표현을 사용함__.","opts":["“납세자의 결정세액이 기납부세액보다 적은 경우 그 차이만큼 납세자에게 환급할 예정이다.”를 ㉠에 따라 “납세자의 결정세액이 기납부세액보다 적은 경우 그 차이만큼 납세자에게 환수할 예정이다.”로 수정한다.","“경제 성장에 방해가 되는 요소를 배제시켜야 한다.”를 ㉡에 따라 “경제 성장에 방해가 되는 요소를 배제해야 한다.”로 수정한다.","“시의회는 관련 단체와 시민들을 초청하기로 결정하였다.”를 ㉢에 따라 “시의회는 관련 단체와 협의하여 시민들을 초청하기로 결정하였다.”로 수정한다.","“사업 전체 목표 수립과 세부 사업별 추진 전략을 제시한다.”를 ㉣에 따라 “사업 전체 목표를 수립하고 세부 사업별 추진 전략을 제시한다.”로 수정한다."],"ans":0,"exp":"결정세액이 이미 낸 세액보다 적으면 더 낸 만큼을 납세자에게 돌려주어야 하므로 '환급'이 맞는 단어이다. '환수'는 도로 거두어들인다는 뜻이어서 ①처럼 고치면 오히려 ㉠(의미에 맞는 정확한 단어 쓰기)에 어긋난다. ②는 불필요한 사동 '배제시키다'를 '배제하다'로, ③은 '관련 단체와'가 두 가지로 해석되는 문장을 한 가지 뜻으로, ④는 '와'로 이어지는 앞뒤를 같은 구조로 바로잡았다.","past":true,"paper":"2025-k","src":"2025 기출 1번"},
{"id":"p25k02","no":2,"subj":"국어","unit":"내용 일치","q":"다음 글을 이해한 내용으로 가장 적절한 것은?\n\n김삿갓으로 알려진 김병연의 집안은 그의 할아버지인 김익순이 죄를 짓고 사형당하기 전까지 괜찮은 편이었다. 김병연의 5대조 할아버지 김시태가 경종 초에 신임사화에 연루되었지만, 영조가 즉위한 뒤 그것이 조작된 것임이 밝혀지고 명예가 회복되었다. 김익순은 김시태의 후광을 입어 여러 관직에 나아갔다. 1811년 그가 선천 부사로 재직 중일 때 홍경래의 난이 일어났다. 이때 그는 반란군에게 항복했을 뿐만 아니라, 반란이 수습될 무렵에는 반란군 장수의 목을 베어 왔다는 거짓 보고까지 했다. 김익순의 이러한 행적이 드러나 결국 그는 모든 재산이 몰수되고 사형을 당했다. 이후 김병연은 대역죄로 사형당한 인물의 후손이라는 오명을 쓰고 살아갈 수밖에 없었다. 그가 당대의 주류 세력과 관계를 맺지 못한 것도 이 때문이었다. 그는 20세 전후로 부모가 모두 숨지자 자신의 신세를 한탄하며 세상을 떠돌게 되었다.","opts":["김시태의 후손은 아무도 관직에 나아가지 못했다.","김익순은 김시태의 죄상이 드러나 재산이 몰수되었다.","김병연은 자신의 조상이 신임사화에 연루되어 세상을 떠돌게 되었다.","김병연은 대역죄인의 후손이어서 당대 주류 세력과 관계를 맺을 수 없었다."],"ans":3,"exp":"김병연은 대역죄로 사형당한 김익순의 후손이라는 오명 때문에 당대의 주류 세력과 관계를 맺지 못했다고 했으므로 ④가 적절하다. 김시태의 후손인 김익순은 여러 관직에 나아갔고(①), 김익순의 재산이 몰수된 것은 김시태의 죄가 아니라 자신이 홍경래의 난 때 항복하고 거짓 보고를 한 행적 때문이다(②). 김병연이 세상을 떠돌게 된 것은 부모가 모두 숨진 뒤 신세를 한탄해서이지 신임사화 때문이 아니다(③).","past":true,"paper":"2025-k","src":"2025 기출 2번"},
{"id":"p25k03","no":3,"subj":"국어","unit":"품사","q":"다음 중 ㉠에 해당하는 사례로 적절한 것은?\n\n하나의 단어는 하나의 품사에 속하는 것이 일반적이지만 어떤 단어는 두 가지 이상의 품사에 속할 수 있다. 예를 들어 ‘밝다’의 경우 ‘날이 밝았다.’에서는 ‘밤이 지나고 환해지며 새날이 오다’라는 의미의 동사이지만, ‘햇살이 밝은 날’에서는 ‘불빛 따위가 환하다’라는 의미의 형용사이다. 이렇듯 하나의 단어가 둘 이상의 품사로 사용되는 것을 품사 통용이라고 한다. 품사 통용은 동음이의 현상과 구별된다. 즉 품사 통용은 서로 관련된 두 의미가 같은 형태로 나타난 것인 반면, ㉠ __동음이의 현상__은 먹는 ‘배’와 타는 ‘배’가 구별되는 것과 같이 서로 무관한 두 의미가 우연히 같은 형태로 나타난 것이다.","opts":["그는 여러 문화를 __비교적__ 관점에서 연구했다. / 삼촌은 교통이 __비교적__ 편리한 곳에 산다.","내가 언니보다 키가 더 __크다__. / 이번 여름에는 비가 많이 와서 마당의 풀이 잘 __큰다__.","__오늘__이 드디어 기다리던 시험일이다. / 친구는 국립 박물관에 __오늘__ 갈 것이라 한다.","나는 어제 산 모자를 __쓰고__ 나갔다. / 형님은 시를 __쓰고__ 누님은 그림을 그렸다."],"ans":3,"exp":"모자를 '쓰다'(머리에 얹어 덮다)와 시를 '쓰다'(글을 짓다)는 둘 다 동사이고 뜻이 서로 무관한데 형태만 같으므로 동음이의 현상이다. ①의 '비교적'은 관형사(명사)와 부사, ②의 '크다'는 형용사와 동사, ③의 '오늘'은 명사와 부사로 쓰였고 뜻이 서로 관련되므로 품사 통용의 사례이다.","past":true,"paper":"2025-k","src":"2025 기출 3번"},
{"id":"p25k04","no":4,"subj":"국어","unit":"작문","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 보고서 작성의 배경과 필요성을 포함할 것.\n○ 본론은 제목에서 밝힌 내용을 2개의 장으로 구성하되, 2장의 하위 항목이 3장의 하위 항목과 서로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 국내 방송 산업의 친환경 제작 현황과 그 확산을 위한 정책 지원 방안\n1장 서론\n1. 환경 위기에 대응하기 위한 해외 방송 산업의 정책 변화\n2. (가) ______\n2장 국내 방송 산업의 친환경 제작 현황\n1. (나) ______\n2. 국내 친환경 방송 제작 관련 전문 인력 부재\n3장 국내 방송 산업의 친환경 제작 확산을 위한 정책 지원 방안\n1. 국내 방송 산업의 특성을 반영한 친환경 제작 지침의 마련\n2. (다) ______\n4장 결론\n1. (라) ______\n2. 현장 적용을 위한 정책 실행의 단계적 평가 및 개선","opts":["(가): 국내 방송 산업의 친환경 제작 전략의 필요성","(나): 국내 방송 산업 내 친환경 제작을 위한 지침 부재","(다): 국내 친환경 방송 제작 관련 전문 인력 채용의 제도화","(라): 친환경 방송 제작을 위한 세부 지침과 인력 채용 방안 제시"],"ans":3,"exp":"\u003c지침>에 따르면 결론은 기대 효과와 향후 과제를 순서대로 제시해야 한다. 4장의 2가 향후 과제이므로 (라)에는 기대 효과가 와야 하는데, ④ '세부 지침과 인력 채용 방안 제시'는 본론(3장)에서 다룰 정책 방안이지 기대 효과가 아니다. ①은 서론의 필요성, ②는 3장 1의 '지침 마련'에 대응하는 현황, ③은 2장 2의 '전문 인력 부재'에 대응하는 방안이어서 적절하다.","past":true,"paper":"2025-k","src":"2025 기출 4번"},
{"id":"p25k05","no":5,"subj":"국어","unit":"문장 고쳐 쓰기","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n면역반응에는 ‘자연면역’과 ‘획득면역’이 있다. 먼저, 자연면역이란 외부 이물질에 대해 내 몸이 태어날 때부터 지니게 된 저항 능력을 가리킨다. 자연면역에서는 항원과 항체 사이의 ㉠ __직접적인 일대일 반응 관계가 존재하지 않는다__. 외부에서 들어온 특정 항원에만 반응하는 유일의 항체가 별도로 존재하지 않는다는 것이다. 자연면역은 세균과 같은 미생물 등을 외부 이물질로 인식하여 제거한다. 예컨대 코나 폐에는 점막조직이 발달해 있어 외부 이물질을 걸러 낸다. 세포 차원에서는 대식 세포의 기능이 자연면역인데, 이 세포는 ㉡ __외부 미생물이 어떤 종류인지에 관계없이 대상을 제거한다__.\n특정 항원에만 반응하는 유일의 항체를 생성하는 면역반응을 획득면역이라고 한다. 획득면역에서는 자연면역과 달리 ㉢ __항원의 종류와 무관하게 특정 항원에 대해 여러 종류의 항체가 반응한다__. 일례로 B림프구의 세포 표면에는 특정 항원을 인식하고 그 특정 항원에 결합하는 부위가 있는데, 이를 ‘항원 수용체’라고 한다. ㉣ __항원 수용체는 세포 표면에 형성되는 단백질의 일종으로, 항원에 의해 자극된다__. 이 수용체가 림프구 세포로부터 떨어져 나와 혈액 안으로 들어간 단백질 단위를 항체라고 부른다.","opts":["㉠: 직접적인 일대일 반응 관계가 존재한다","㉡: 특정한 외부 미생물에 유일하게 반응하며 그 외의 대상은 제거하지 않는다","㉢: 특정 항체가 특정 항원에 대해서만 반응한다","㉣: 항원 수용체는 세포 내부에 형성되는 단백질의 일종으로, 항체에 의해 자극된다"],"ans":2,"exp":"획득면역은 '특정 항원에만 반응하는 유일의 항체를 생성하는 면역반응'이고 '자연면역과 달리'라고 했으므로, ㉢은 '특정 항체가 특정 항원에 대해서만 반응한다'로 고쳐야 앞뒤가 맞는다. ㉠과 ㉡은 특정 항원에만 반응하는 항체가 따로 없다는 자연면역의 설명과 맞고, ㉣은 수용체가 세포 표면에 있어 항원을 인식하고 결합한다는 앞 문장과 맞으므로 고칠 필요가 없다.","past":true,"paper":"2025-k","src":"2025 기출 5번"},
{"id":"p25k06","no":6,"subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 픽셀 단위로 수치화된 이미지 데이터는 하나의 긴 데이터 형태로 컴퓨터에 저장된다. 초기 컴퓨터의 경우 흑백만 표현할 수 있었기 때문에 이미지는 하나의 픽셀에 대해 흑과 백이 0과 1로 표현되는 1비트로 저장되었다.\n(나) 높은 해상도의 구현은 데이터 저장 용량의 문제를 일으켰고, 용량을 줄이기 위한 여러 방법도 함께 고안되었다. 이를 통해 고해상도의 이미지도 웹사이트를 비롯한 다양한 분야에서 활발하게 사용할 수 있게 되었다.\n(다) 컴퓨터에서 이미지를 처리하기 위해서는 아날로그 영상 신호를 디지털로 변환하는 과정을 거쳐야 한다. 이미지를 디지털로 저장하는 가장 기본적인 방법은 픽셀 단위로 수치화하여 저장하는 것이다.\n(라) 하지만 현재는 컴퓨터 비전 기술이 발달하면서 하나의 픽셀에 여러 색상의 정보를 담게 되었다. 초기 색상 표현은 하나의 픽셀이 흑과 백의 1비트였으나, 최근에는 높은 해상도를 구현하기 위해 픽셀 하나에 32비트까지 사용한다.","opts":["(나) － (가) － (라) － (다)","(나) － (다) － (가) － (라)","(다) － (가) － (라) － (나)","(다) － (라) － (가) － (나)"],"ans":2,"exp":"(다)가 이미지를 픽셀 단위로 수치화해 저장한다는 기본 방법을 소개하고, (가)가 그 데이터의 저장 방식과 초기 컴퓨터의 1비트 표현을 설명한다. (라)는 '하지만 현재는'으로 받아 픽셀 하나에 32비트까지 쓰는 높은 해상도를 말하고, (나)가 높은 해상도 때문에 생긴 저장 용량 문제와 그 해결로 마무리한다. 따라서 (다)－(가)－(라)－(나)이다.","past":true,"paper":"2025-k","src":"2025 기출 6번"},
{"id":"p25k07","no":7,"subj":"국어","unit":"내용 일치","q":"윗글을 이해한 내용으로 적절하지 않은 것은?\n\n천상계와 지상계로 나누어진 영웅 소설의 세계 구조에서 서사적으로 중요한 것은 지상계의 일이지만 인과론적 구도로는 천상계가 우위에 있다. 천상계의 의지나 그 대리자의 개입에 의해서 지상계의 서사가 결정되기 때문이다. 천상계는 지상에서 ㉠ __일어나는__ 모든 사건의 발생과 귀결을 지배하는 초월적 세계로서, 일시적으로 고난에 빠졌던 주인공이 세상에 창궐한 악을 물리치고 승리하도록 해 주는 근거로 작용한다. 지상의 혼란이나 세계 질서의 모순은 일시적인 것일 뿐 현실의 구체적 갈등에 뿌리를 둔 것이 아니어서 초월적 세계가 이미 설계한 바에 따라 쉽사리 해소된다. 이런 모습의 세계 구조를 ‘이원적 세계상’이라고 부른다.\n반면에 판소리계 소설의 세계상은 대체로 일원적이고 경험적이다. 판소리계 소설에는 초월적 세계가 지배적 장치로 나타나는 경우가 극히 드물며, 현실의 경험적 인과 관계에 의해 서사가 전개된다. 예컨대 변학도의 횡포로 인한 춘향의 수난, 흥부의 가난과 고난, 심청과 심봉사의 불행, 유혹에 넘어간 토끼의 위기 탈출, 배비장의 욕망과 봉변, 장끼의 죽음 등은 초월적 세계의 의지나 그 대리자의 개입 없이 현실적 삶의 인과에 따라 이루어지는 것이다.","opts":["영웅 소설은 이원적 세계상을 잘 보여 주는 문학적 갈래이다.","판소리계 소설에서 서사의 인과 관계는 경험적 현실에 바탕을 둔 경우가 많다.","천상계의 대리자가 지상계의 서사를 결정하는 작품에서는 이원적 세계상이 발견된다.","영웅 소설에 비해 판소리계 소설에서는 초월적 세계가 현실의 문제를 해결하는 양상이 두드러진다."],"ans":3,"exp":"판소리계 소설에는 초월적 세계가 지배적 장치로 나타나는 경우가 극히 드물고 현실의 경험적 인과 관계에 따라 서사가 전개된다고 했으므로 ④는 글과 반대이다. 초월적 세계가 문제를 해결하는 것은 영웅 소설 쪽이다. 영웅 소설의 세계 구조를 이원적 세계상이라 부르고(①, ③), 판소리계 소설의 서사는 경험적 인과에 바탕을 둔다(②).","past":true,"paper":"2025-k","src":"2025 기출 7번"},
{"id":"p25k08","no":8,"subj":"국어","unit":"어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n천상계와 지상계로 나누어진 영웅 소설의 세계 구조에서 서사적으로 중요한 것은 지상계의 일이지만 인과론적 구도로는 천상계가 우위에 있다. 천상계의 의지나 그 대리자의 개입에 의해서 지상계의 서사가 결정되기 때문이다. 천상계는 지상에서 ㉠ __일어나는__ 모든 사건의 발생과 귀결을 지배하는 초월적 세계로서, 일시적으로 고난에 빠졌던 주인공이 세상에 창궐한 악을 물리치고 승리하도록 해 주는 근거로 작용한다. 지상의 혼란이나 세계 질서의 모순은 일시적인 것일 뿐 현실의 구체적 갈등에 뿌리를 둔 것이 아니어서 초월적 세계가 이미 설계한 바에 따라 쉽사리 해소된다. 이런 모습의 세계 구조를 ‘이원적 세계상’이라고 부른다.\n반면에 판소리계 소설의 세계상은 대체로 일원적이고 경험적이다. 판소리계 소설에는 초월적 세계가 지배적 장치로 나타나는 경우가 극히 드물며, 현실의 경험적 인과 관계에 의해 서사가 전개된다. 예컨대 변학도의 횡포로 인한 춘향의 수난, 흥부의 가난과 고난, 심청과 심봉사의 불행, 유혹에 넘어간 토끼의 위기 탈출, 배비장의 욕망과 봉변, 장끼의 죽음 등은 초월적 세계의 의지나 그 대리자의 개입 없이 현실적 삶의 인과에 따라 이루어지는 것이다.","opts":["언니는 뽀얗게 __일어나는__ 물보라에 손을 대었다.","그는 가까스로 __일어나는__ 불꽃을 바라보고 있었다.","아침 일찍 __일어나는__ 습관을 들이는 것이 중요하다.","싸움이 __일어나는__ 동안 그는 숨어 있을 수밖에 없었다."],"ans":3,"exp":"㉠의 '일어나다'는 '어떤 일이 생기다'라는 뜻이고, ④ '싸움이 일어나는'이 같은 뜻이다. ①은 '물보라 따위가 위로 솟거나 부풀어 오르다', ②는 '약하거나 희미하던 것이 성하여지다', ③은 '잠에서 깨어나다'의 뜻이다.","past":true,"paper":"2025-k","src":"2025 기출 8번"},
{"id":"p25k09","no":9,"subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 영희가 친구 혹은 선생님을 만났다면, 영희는 커피를 마셨다.\n○ 영희는 친구 혹은 선배를 만났다.\n○ 영희는 커피를 마신 적이 없다.","opts":["영희는 선배를 만났다.","영희는 친구를 만났다.","영희는 선생님을 만났다.","영희는 선배와 선생님을 모두 만났다."],"ans":0,"exp":"영희가 커피를 마신 적이 없으므로 첫째 진술의 대우에 따라 영희는 친구도 선생님도 만나지 않았다. 둘째 진술에서 친구 혹은 선배를 만났는데 친구는 만나지 않았으므로 선배를 만났다. 따라서 ①이 반드시 참이고, 친구나 선생님을 만났다는 ②, ③, ④는 거짓이다.","past":true,"paper":"2025-k","src":"2025 기출 9번"},
{"id":"p25k10","no":10,"subj":"국어","unit":"내용 일치","q":"윗글을 이해한 내용으로 가장 적절한 것은?\n\n이광수와 김동인은 한국 근대 문학 초기의 대표적인 소설가로, 이 둘의 작품은 표준어와 사투리의 사용에서 두드러진 차이를 보인다. 이광수의 대표작 「무정」에서는 작중 배경과 등장인물의 출신지가 서울이 아닌데도 인물들이 주고받는 대화가 표준어로 되어 있다. 반면 김동인의 대표작 「배따라기」에서 인물들의 대화는 출신지와 작중 배경에 ㉠ __맞는__ 사투리로 이루어진다. 작품의 리얼리티를 얼마나 잘 구현했는가를 기준으로 본다면, 「무정」보다 「배따라기」가 더 뛰어나다고 볼 수 있다.\n그러나 이광수의 「무정」을 리얼리티의 구현 정도를 기준으로 낮잡아 평가하는 것은 곤란하다. 근대 국민국가 형성 과정에서 다양한 지방의 사투리를 통일하는 것은 중요한 화두였다. 이로 인해 표준어와 사투리의 위계가 공고해졌다. 당대의 지식인들은 표준어가 교양, 문화, 지식, 과학, 공적 영역 등의 근대적 가치를 나타내는 것으로, 사투리는 야만, 비문화, 무지, 비과학, 사적 영역 등의 전근대적인 가치를 ㉡ __나타내는__ 것으로 인식하였다. 이광수가 계몽주의의 신봉자였음을 ㉢ __떠올리면__, 그가 「무정」에서 표준어를 사용한 것은 근대적 가치를 실현하기 위한 의도적인 선택이었다.\n이처럼 표준어의 사용은 작가의 의도를 드러내는 기능을 한다. 이는 현대 문학 안에서도 찾아볼 수 있다. 박경리의 「토지」에서 대부분의 인물들은 경상도나 함경도 사투리를 사용한다. 하지만 주인공 ‘서희’는 사투리를 구사하지 않는다. 이는 작품의 리얼리티 형성에 방해가 되지만 해당 인물의 고고함과 차가움을 드러내는 데에 더할 수 없이 적절한 기능을 한다. 「토지」에 사용된 표준어는 인물의 성격을 ㉣ __뚜렷하게__ 보여 주는 효과를 지닌다.","opts":["「배따라기」는 표준어를 사용하여 작품의 리얼리티를 확보하였다.","「무정」에는 근대적 가치의 실현과 관련된 작가의 의도가 담겨 있다.","「토지」는 ‘서희’의 사투리 사용을 통해 작품의 리얼리티를 구현하였다.","작품의 리얼리티를 기준으로 할 때, 「무정」이 「배따라기」보다 더 뛰어나다."],"ans":1,"exp":"이광수가 「무정」에서 표준어를 쓴 것은 근대적 가치를 실현하기 위한 의도적인 선택이었다고 했으므로 ②가 적절하다. 「배따라기」는 사투리로 리얼리티를 구현했고(①), 「토지」의 '서희'는 사투리를 쓰지 않으며 이는 리얼리티 형성에 방해가 된다(③). 리얼리티를 기준으로 하면 「배따라기」가 「무정」보다 뛰어나다(④).","past":true,"paper":"2025-k","src":"2025 기출 10번"},
{"id":"p25k11","no":11,"subj":"국어","unit":"한자어","q":"윗글의 ㉠～㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n이광수와 김동인은 한국 근대 문학 초기의 대표적인 소설가로, 이 둘의 작품은 표준어와 사투리의 사용에서 두드러진 차이를 보인다. 이광수의 대표작 「무정」에서는 작중 배경과 등장인물의 출신지가 서울이 아닌데도 인물들이 주고받는 대화가 표준어로 되어 있다. 반면 김동인의 대표작 「배따라기」에서 인물들의 대화는 출신지와 작중 배경에 ㉠ __맞는__ 사투리로 이루어진다. 작품의 리얼리티를 얼마나 잘 구현했는가를 기준으로 본다면, 「무정」보다 「배따라기」가 더 뛰어나다고 볼 수 있다.\n그러나 이광수의 「무정」을 리얼리티의 구현 정도를 기준으로 낮잡아 평가하는 것은 곤란하다. 근대 국민국가 형성 과정에서 다양한 지방의 사투리를 통일하는 것은 중요한 화두였다. 이로 인해 표준어와 사투리의 위계가 공고해졌다. 당대의 지식인들은 표준어가 교양, 문화, 지식, 과학, 공적 영역 등의 근대적 가치를 나타내는 것으로, 사투리는 야만, 비문화, 무지, 비과학, 사적 영역 등의 전근대적인 가치를 ㉡ __나타내는__ 것으로 인식하였다. 이광수가 계몽주의의 신봉자였음을 ㉢ __떠올리면__, 그가 「무정」에서 표준어를 사용한 것은 근대적 가치를 실현하기 위한 의도적인 선택이었다.\n이처럼 표준어의 사용은 작가의 의도를 드러내는 기능을 한다. 이는 현대 문학 안에서도 찾아볼 수 있다. 박경리의 「토지」에서 대부분의 인물들은 경상도나 함경도 사투리를 사용한다. 하지만 주인공 ‘서희’는 사투리를 구사하지 않는다. 이는 작품의 리얼리티 형성에 방해가 되지만 해당 인물의 고고함과 차가움을 드러내는 데에 더할 수 없이 적절한 기능을 한다. 「토지」에 사용된 표준어는 인물의 성격을 ㉣ __뚜렷하게__ 보여 주는 효과를 지닌다.","opts":["㉠: 영합(迎合)하는","㉡: 표상(表象)하는","㉢: 상기(想起)하면","㉣: 분명(分明)하게"],"ans":0,"exp":"'영합(迎合)하다'는 사사로운 이익을 위해 아첨하며 좇거나 서로 뜻이 맞는다는 뜻이어서, 출신지와 배경에 '어울리는, 들어맞는'이라는 뜻의 ㉠ '맞는'과 바꿔 쓸 수 없다. '부합(符合)하는' 정도가 알맞다. '나타내는'은 '표상하는', '떠올리면'은 '상기하면', '뚜렷하게'는 '분명하게'와 뜻이 통한다.","past":true,"paper":"2025-k","src":"2025 기출 11번"},
{"id":"p25k12","no":12,"subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n경제적으로 보면 우리의 삶은 끊임없이 무언가를 소비한다. 의식주 같은 기본 생활에 더해 문화생활과 사회 활동도 소비를 떼어 놓고 생각할 수 없다. 소비되는 것을 흔히 ‘상품’이라고 부르지만 실은 ‘재화’라고 해야 하는데, 재화는 소비를 목적으로 하고 상품은 시장에서의 판매를 목적으로 한다는 점에서 구분되기 때문이다. 이렇게 볼 때 재화는 인류 역사상 늘 있었지만, 상품은 자본주의 시대에 이르러 출현하였다.\n냉전 시대에는 다음과 같은 말이 있었다. “자본주의에서는 상인이 최고이고, 사회주의에서는 공직자가 최고이다.” 자본주의는 자유경쟁을 기본으로 하기에 ㉠ __물건__을 싸게 사서 비싸게 파는 상인이 돈을 가장 많이 벌 수 있으며, 사회주의는 관료제의 폐해로 국가 기관이 부패해서 고위 관료라든가 고급 당원이 배불리 먹고산다는 의미이다.\n자본주의의 역사를 볼 때 이 말은 사실에 가깝다. 자본주의는 애초부터 상업의 발달과 밀접한 관계가 있었다. 중세의 상인들이 물건을 시장에 팔아 이윤을 얻기 위해 수공업자들을 조직하여 그들에게 자본과 도구를 빌려주고 물건을 대신 생산하게 한 데에서 자본주의가 출발하였다. 이처럼 자본주의는 ㉡ __상품__에 기초한 사회로, 상품은 그것이 판매될 수 있는 시장을 전제로 생산되는 것이기 때문에 시장이 형성되어 있지 않다면 상품도 존재할 수 없다. 목수가 ㉢ __집에서 쓰기 위해 만든 의자__와 시장에 팔기 위해 만든 의자는 동일한 의자임에도 재화와 상품의 관점에서 볼 때 서로 다르다.\n이와 같이 상품에는 생산과 유통이라는 두 가지 측면이 있다. ㉣ __자본주의 사회에서 생산되는 물품__의 유통을 맡은 사람이 바로 상인이다. “자본주의에서는 상인이 최고이다.”라는 말은 만드는 이에 비해서 파는 이가 더 많은 이익을 남긴다는 뜻이다. 자본주의화가 진행될수록 전자와 후자 사이의 차이는 더 커진다. 기술혁신이 이루어져 상품을 생산하는 과정은 갈수록 단순해지고 상품의 대량생산은 쉬워지는 반면, 유통의 경우 상품과 최종 소비자 사이의 관계가 갈수록 복잡해지므로 생산에 비해 우회로를 더 많이 거치게 된다. 따라서 자본주의가 성숙할수록 제조업의 이윤은 적어지고 유통업의 이윤은 많아진다.","opts":["사회주의에서는 유통이 생산보다 중요하다.","상품이 존재한다는 것은 시장이 형성되어 있다는 것이다.","자본주의가 성숙할수록 제조업과 유통업의 이윤 차이는 줄어든다.","중세의 상인들은 물건의 생산 단가를 낮추기 위해 시장에 팔 물건을 손수 생산하였다."],"ans":1,"exp":"시장이 형성되어 있지 않다면 상품도 존재할 수 없다고 했으므로, 그 대우인 '상품이 존재한다면 시장이 형성되어 있다'는 ②가 적절하다. 사회주의에서 유통이 더 중요하다는 내용은 없고(①), 자본주의가 성숙할수록 제조업 이윤은 줄고 유통업 이윤은 늘어 차이가 커지며(③), 중세의 상인들은 손수 만들지 않고 수공업자들에게 대신 생산하게 했다(④).","past":true,"paper":"2025-k","src":"2025 기출 12번"},
{"id":"p25k13","no":13,"subj":"국어","unit":"어휘","q":"윗글의 ㉠ ～ ㉣ 중 문맥상 의미가 나머지와 다른 하나는?\n\n경제적으로 보면 우리의 삶은 끊임없이 무언가를 소비한다. 의식주 같은 기본 생활에 더해 문화생활과 사회 활동도 소비를 떼어 놓고 생각할 수 없다. 소비되는 것을 흔히 ‘상품’이라고 부르지만 실은 ‘재화’라고 해야 하는데, 재화는 소비를 목적으로 하고 상품은 시장에서의 판매를 목적으로 한다는 점에서 구분되기 때문이다. 이렇게 볼 때 재화는 인류 역사상 늘 있었지만, 상품은 자본주의 시대에 이르러 출현하였다.\n냉전 시대에는 다음과 같은 말이 있었다. “자본주의에서는 상인이 최고이고, 사회주의에서는 공직자가 최고이다.” 자본주의는 자유경쟁을 기본으로 하기에 ㉠ __물건__을 싸게 사서 비싸게 파는 상인이 돈을 가장 많이 벌 수 있으며, 사회주의는 관료제의 폐해로 국가 기관이 부패해서 고위 관료라든가 고급 당원이 배불리 먹고산다는 의미이다.\n자본주의의 역사를 볼 때 이 말은 사실에 가깝다. 자본주의는 애초부터 상업의 발달과 밀접한 관계가 있었다. 중세의 상인들이 물건을 시장에 팔아 이윤을 얻기 위해 수공업자들을 조직하여 그들에게 자본과 도구를 빌려주고 물건을 대신 생산하게 한 데에서 자본주의가 출발하였다. 이처럼 자본주의는 ㉡ __상품__에 기초한 사회로, 상품은 그것이 판매될 수 있는 시장을 전제로 생산되는 것이기 때문에 시장이 형성되어 있지 않다면 상품도 존재할 수 없다. 목수가 ㉢ __집에서 쓰기 위해 만든 의자__와 시장에 팔기 위해 만든 의자는 동일한 의자임에도 재화와 상품의 관점에서 볼 때 서로 다르다.\n이와 같이 상품에는 생산과 유통이라는 두 가지 측면이 있다. ㉣ __자본주의 사회에서 생산되는 물품__의 유통을 맡은 사람이 바로 상인이다. “자본주의에서는 상인이 최고이다.”라는 말은 만드는 이에 비해서 파는 이가 더 많은 이익을 남긴다는 뜻이다. 자본주의화가 진행될수록 전자와 후자 사이의 차이는 더 커진다. 기술혁신이 이루어져 상품을 생산하는 과정은 갈수록 단순해지고 상품의 대량생산은 쉬워지는 반면, 유통의 경우 상품과 최종 소비자 사이의 관계가 갈수록 복잡해지므로 생산에 비해 우회로를 더 많이 거치게 된다. 따라서 자본주의가 성숙할수록 제조업의 이윤은 적어지고 유통업의 이윤은 많아진다.","opts":["㉠","㉡","㉢","㉣"],"ans":2,"exp":"글은 소비를 목적으로 하는 '재화'와 시장에서의 판매를 목적으로 하는 '상품'을 구분한다. ㉠(상인이 사고파는 물건), ㉡, ㉣(유통되는 물품)은 모두 판매를 위한 '상품'이지만, ㉢ '집에서 쓰기 위해 만든 의자'는 소비를 목적으로 한 '재화'이다.","past":true,"paper":"2025-k","src":"2025 기출 13번"},
{"id":"p25k14","no":14,"subj":"국어","unit":"추론","q":"다음 글에서 추론한 내용으로 적절하지 않은 것은?\n\n모든 기호에는 정보성, 즉 의미가 있다. 다시 말해 정보성은 기호가 가진 필수 조건이다. 그런데 기호에는 정보성뿐 아니라 의사소통의 의도를 가지는 것도 있다. 즉 기호는 정보성만 가진 기호와 정보성도 가진 의사소통적 기호로 구분된다. 가령 개나리가 피는 것은 봄이 왔다는 신호이고 낙엽이 지는 것은 가을이 왔음을 의미한다. 그러나 계절을 알리기 위해 개나리가 피고 낙엽이 지는 것은 아니기 때문에 그러한 자연적 기호들은 의사소통적 기호로 볼 수 없다. 개인의 지문이나 필체 역시 사람을 식별하는 기호가 될 수 있다. 하지만 지문과 필체가 사람을 식별하기 위해 존재하는 것은 아니므로 이들은 정보성을 가진 기호일 뿐이다. 코넌 도일의 소설에서 셜록 홈스는 상대의 손톱, 코트의 소매, 표정 등을 근거로 그 사람의 직업이나 성격을 추리해 낸다. 홈스에게는 이런 것들이 모두 정보를 제공하는 기호들이다. 그러나 이들을 의사소통적 기호라고는 할 수 없다. 반면 인간이 관습적으로 사용하는 기호인 봉화, 교통 신호등, 모스 부호 등은 정보성뿐만 아니라 의사소통의 의도를 명백히 가진다. 모든 기호를 통틀어 인간의 언어는 가장 복잡하고 체계적인 관습적 기호이며 의사소통적 기호이다.","opts":["전쟁 중에 군대에서 사용하는 암호는 관습적 기호이다.","일기예보에서 흐린 날씨를 표시하는 구름 모양의 아이콘은 자연적 기호이다.","특정 질병에 걸렸을 때 나타나는 얼굴색은 정보성만을 가진 기호이다.","이웃 마을과 구별하기 위해 마을의 명칭을 본떠 만든 상징탑은 의사소통적 기호이다."],"ans":1,"exp":"일기예보의 구름 아이콘은 날씨를 알리려는 의도로 사람들이 약속해 쓰는 것이므로 관습적 기호이자 의사소통적 기호이지, 개나리나 낙엽 같은 자연적 기호가 아니다. 암호는 봉화나 모스 부호처럼 관습적 기호이고(①), 질병에 따른 얼굴색은 알리려는 의도가 없어 정보성만 가지며(③), 구별하려는 의도로 만든 상징탑은 의사소통적 기호이다(④).","past":true,"paper":"2025-k","src":"2025 기출 14번"},
{"id":"p25k15","no":15,"subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n자아 개념이란 자신에 대한 주관적 견해로서 개인이 가지고 있는 능력, 성격, 태도, 느낌 등을 모두 포괄한다. 자아의 형성에 영향을 미치는 요인 중 하나로 타인에게서 듣게 되는 나와 관련된 메시지를 들 수 있다. 물론 타인 중에는 자신이 느끼기에 나에게 관련이 적은 사람도 있고 중요한 사람도 있다. 예를 들어 “너의 글은 인상적이야. 앞으로 좋은 작품을 쓸 수 있을 것 같아.”라는 말을 누군가에게 들었을 때, 그 사람이 나에게 중요하다면 그 평가는 자아 개념 형성에 큰 영향을 미칠 수 있다. 그런 범주에 들어갈 수 있는 사람들로는 부모, 친구, 선생님 등이 있을 것이다. 나에게 (가) ______의 말은 기억에 오래 남기 마련이다.\n한편, 타인에게 영향을 받는 자아를 설명하는 개념 중에는 (나) ______라는 것도 있다. 이 개념에 따르면 우리는 타인과 상호 작용하는 과정에서 단순히 타인을 모범으로 삼아 따라 하거나 타인의 훈육을 통해 자아를 형성한다기보다는 타인에게 비치는 나의 모습을 상상하고 그 모습에 대한 타인의 판단을 추정한다. 그러한 추정을 통해 자기에게 생겨난 감정을 알아 가는 과정에서 성숙한 자아를 형성해 나간다.","opts":["(가) 관련이 적은 타인, (나) 거울에 비친 자아","(가) 중요한 타인, (나) 모범적인 타인을 따르는 자아","(가) 관련이 적은 타인, (나) 모범적인 타인을 따르는 자아","(가) 중요한 타인, (나) 거울에 비친 자아"],"ans":3,"exp":"말한 사람이 나에게 중요하다면 그 평가가 자아 개념 형성에 큰 영향을 미친다고 했으므로 (가)는 '중요한 타인'이다. (나)의 개념은 타인을 모범으로 삼아 따라 하는 것이 아니라 타인에게 비치는 나의 모습을 상상하고 그에 대한 타인의 판단을 추정하는 것이므로 '거울에 비친 자아'이다.","past":true,"paper":"2025-k","src":"2025 기출 15번"},
{"id":"p25k16","no":16,"subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n마라톤을 하는 사람은 모두 식단을 조절하거나 근력 운동을 한다. 근력 운동을 하는 사람은 모두 건강하다. 따라서 __마라톤을 하는 사람은 모두 건강하다__.","opts":["건강한 사람은 모두 식단을 조절한다.","식단을 조절하는 사람은 모두 건강하다.","식단을 조절하는 사람 중에 근력 운동을 하는 사람은 없다.","식단 조절과 근력 운동을 병행하는 사람 중에 건강하지 않은 사람은 없다."],"ans":1,"exp":"마라톤을 하는 사람은 식단을 조절하거나 근력 운동을 하고, 근력 운동을 하는 사람은 모두 건강하다. 결론이 나오려면 나머지 경우인 식단을 조절하는 사람도 모두 건강해야 하므로 ②를 추가해야 한다. ①은 방향이 거꾸로이고, ③은 건강과 관계가 없으며, ④는 식단 조절만 하는 사람이 건강한지 알려 주지 않는다.","past":true,"paper":"2025-k","src":"2025 기출 16번"},
{"id":"p25k17","no":17,"subj":"국어","unit":"화법","q":"다음 대화를 분석한 내용으로 적절하지 않은 것은?\n\n갑: 언어는 인간의 지각과 사고, 세계관 등을 결정해. 인간 사고의 내용과 구조는 언어에 의해 형성되며, 이 때문에 동일한 언어를 쓰는 민족은 그 언어에 의해 형성된 공통의 세계관을 갖게 되지. 사고가 언어에 영향을 미치는 것이 아니라 실은 그 반대야.\n을: 나는 동의할 수 없어. 언어는 인간의 사고를 표현하는 도구에 불과해서 사고가 언어에 영향을 미친다고 봐야 해. 따라서 사고의 차이가 언어의 차이를 낳지.\n병: 그렇긴 하지. 사고의 깊이가 깊은 사람은 그렇지 않은 사람에 비해 구사하는 언어의 수준이 높아. 하지만 나는 언어가 사고에 영향을 미친다는 것도 동의해. 남미의 어떤 부족은 방향을 표현할 때 ‘왼쪽’이나 ‘오른쪽’이 아니라 ‘북서쪽’과 같이 절대 방위로 표현하는데, 이 언어를 쓰는 사람들의 공간 감각은 이 언어를 쓰지 않는 사람들보다 더 뛰어나다고 하거든.\n갑: 언어가 다르면 세계를 다르게 인식해. 어떤 언어의 화자가 자기 언어의 색채어에 맞추어 색깔을 구별하는 것을 그 사례로 들 수 있어. 이런 점에서 언어가 없다면 인식하고 사고할 수 없다는 말도 성립해.\n을: 언어가 미숙한 유아라든지 언어가 없는 동물들도 자신들이 직면한 문제에 대해 사고하고 판단하잖아. 이건 언어가 사고에 영향을 미치지 못한다는 증거이지.\n병: 나는 언어와 사고의 관계가 어느 한쪽이 일방적으로 영향을 주는 게 아니라 서로 영향을 주고받으면서 발전한다고 생각해.","opts":["언어와 사고가 서로 영향을 주고받는 관계라는 점에 대해 갑과 을은 동의하지 않지만 병은 동의한다.","사고가 언어에 영향을 미친다는 점에 대해 갑은 동의하지만 을은 동의하지 않는다.","언어가 다르면 세계를 다르게 인식한다는 점에 대해 갑과 병은 동의한다.","사고의 차이가 언어의 차이를 낳는다는 점에 대해 을과 병은 동의한다."],"ans":1,"exp":"갑은 '사고가 언어에 영향을 미치는 것이 아니라 실은 그 반대'라고 했고, 을은 '사고가 언어에 영향을 미친다고 봐야 해'라고 했으므로 ②는 두 사람의 입장을 거꾸로 말했다. 서로 영향을 주고받는다는 것은 병만의 생각이고(①), 병은 절대 방위를 쓰는 부족의 예로 언어가 인식에 영향을 준다는 데 동의했으며(③), 병은 을의 말에 '그렇긴 하지'라고 동의했다(④).","past":true,"paper":"2025-k","src":"2025 기출 17번"},
{"id":"p25k18","no":18,"subj":"국어","unit":"논리","q":"다음 대화에 대한 평가로 적절한 것만을 모두 고르면?\n\n갑: 친구에게 보내는 감사 메일에 건강하기를 기원하는 의미로 “건강해라.”라고 적었는데, 다른 친구가 그건 잘못된 표현이니까 쓰면 안 된다고 하더라고. 널리 쓰이는 표현인데 왜 쓰면 안 된다는 거야?\n을: 문법 규범에 어긋난 표현이 자주 쓰인다는 이유로 문법 규범으로 인정되어서는 안 돼. 문맥상 “건강해라.”는 상대방에게 명령하는 의미를 지니는데 건강한 상태를 명령할 수는 없잖아? 그래서 형용사의 명령형은 문법 규범에 어긋난 거니까 사용하면 안 돼. 마찬가지로 어휘도 사람들이 자주 쓴다고 해서 비표준어가 표준어가 되는 것은 아니잖아.\n갑: 문법 규범에 맞게 쓰거나 표준어를 사용하는 것이 권장되어야 하는 것은 옳지만, 문법 규범에 맞지 않거나 비표준어라고 해서 사용하지 말아야 하는 것은 아니라고 생각해. 문법 규범이나 표준어는 공통의 언어 사용을 유도하기 위한 정책으로 제시된 것일 뿐이거든. “건강해라.”는 언중에게 널리 쓰인다는 점에서 사용에 문제가 없어.\n\nㄱ. ‘쓰여지다’, ‘잊혀지다’와 같은 이중 피동은 사람들에게 널리 쓰이는 표현이지만 문법 규범에 맞지 않으니까 사용하지 말아야 한다는 주장은 갑과 을의 입장을 모두 강화한다.\nㄴ. 명령문 “행복해라.”가 문법 규범에 맞지 않지만 상대방이 행복하기를 바라는 기원의 의미로 널리 쓰이기 때문에 써도 된다는 주장은 갑의 입장을 약화한다.\nㄷ. 언중이 비표준어이던 ‘맨날’을 자주 사용하는 현실에 따라 표준어 ‘만날’과 함께 ‘맨날’도 표준어로 인정되었다는 사실은 을의 입장을 약화한다.","opts":["ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":0,"exp":"을은 규범에 어긋난 표현은 널리 쓰여도 쓰면 안 되고 자주 쓴다고 표준어가 되는 것도 아니라는 입장이고, 갑은 널리 쓰이면 써도 된다는 입장이다. ㄱ의 주장은 을만 강화하고 갑은 약화하므로 틀렸고, ㄴ의 주장은 갑의 입장을 강화하므로 틀렸다. ㄷ은 자주 쓰여서 비표준어가 표준어로 인정된 사례이므로 을의 입장을 약화한다. 따라서 ㄷ만 적절하다.","past":true,"paper":"2025-k","src":"2025 기출 18번"},
{"id":"p25k19","no":19,"subj":"국어","unit":"논리","q":"다음 대화의 (가)에 들어갈 말로 적절한 것은?\n\n갑: 공무원은 공직자이고 공직자는 그 직책만으로 국가나 사회에 영향을 미치는 공인이야. 모든 공무원은 공인이니까 공인으로서의 사명감을 가질 의무가 있어. 하지만 공무원이 아닌 사람이라면 그게 누구든 그런 사명감을 가질 의무는 없지.\n을: 모든 사람이 죽는다고 죽는 것들이 모두 사람인 것은 아니잖아. 네가 “공무원이 아닌 모든 사람은 공인으로서의 사명감을 가질 의무가 없다.”라는 주장을 하려면 “(가) ______.”가 참이어야 해.","opts":["몇몇 공인은 공인으로서의 사명감을 가질 의무가 없다","모든 공무원은 공인으로서의 사명감을 가질 의무가 없다","공인으로서의 사명감을 가질 의무가 있는 사람은 모두 공무원이다","공인으로서의 사명감을 가질 의무가 없는 사람은 모두 공무원이 아니다"],"ans":2,"exp":"갑은 '모든 공무원은 의무가 있다'에서 '공무원이 아닌 사람은 의무가 없다'를 이끌어 냈는데, 이는 을의 지적대로 그대로는 따라 나오지 않는다. '공무원이 아니면 의무가 없다'는 그 대우인 '의무가 있는 사람은 모두 공무원이다'와 같은 말이므로 ③이 참이어야 한다. ④는 '공무원은 모두 의무가 있다'와 같은 말이어서 갑이 이미 한 말일 뿐이고, ①과 ②는 갑의 주장과 어긋난다.","past":true,"paper":"2025-k","src":"2025 기출 19번"},
{"id":"p25k20","no":20,"subj":"국어","unit":"논리","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n인간이 지닌 대부분의 지적 능력을 상회하는 기능을 발휘하는 인공지능 컴퓨터 프로그램이나 이 프로그램을 사용해 작동하는 기계 장치를 ‘인공일반지능’이라고 부른다. 이론적으로 인공일반지능은 현재까지 개발된 모든 인공지능 프로그램의 기능을 전부 갖게 될 것이다. 인공일반지능의 등장이 인간의 본질적 가치를 훼손할 것이라고 우려하는 사람들이 있다. 그렇다면 인공일반지능의 개발은 허용되어야 하는가?\n인공일반지능의 개발이 허용된다면 머지않아 인공일반지능은 개발된다. 이로 인해, 인공일반지능은 대부분의 직업 영역에서 인간을 대신해 업무를 수행할 것이고 많은 사람들이 직업을 잃고 소외감을 느낌으로써 인간의 본질적 가치가 훼손된다. 또한 인공일반지능이 개발된다면 인간은 더 이상 지구상에서 특별하고 우월한 존재가 아니게 된다. 이는 인간이 지닌 특별하고 우월한 존재론적 지위, 즉 인간의 본질적 가치가 훼손된다는 것이다. 인간의 본질적 가치는 어떠한 경우에도 훼손되어서는 안 되므로 인공일반지능의 개발은 허용될 수 없다.","opts":["인공일반지능의 수준에 미치지 못하는 특정 분야에 특화된 인공지능 프로그램만으로도 많은 사람이 일자리를 잃고 소외감을 느끼고 있다.","인공지능 연구로 노벨 물리학상을 받은 H는 인공지능 기술이 인간의 존재론적 지위에 위협이 될 것이라며 인공지능 개발 연구를 멈춰야 한다고 주장한다.","현재 상용화되어 있는 대화형 인공지능은 마음의 상처를 입은 사람들에게 위안을 주어 사람들이 본질적 가치를 회복하는 데 도움을 주고 있음이 입증되었다.","유관 학회 전문가들을 대상으로 한 설문에서, 인공일반지능의 개발이 인간의 본질적 가치를 훼손할 가능성이 높아 개발을 허용해서는 안 된다고 응답한 사람들이 그렇지 않은 사람들보다 압도적으로 많았다."],"ans":2,"exp":"글은 인공일반지능이 인간의 본질적 가치를 훼손하므로 개발을 허용할 수 없다고 주장한다. 인공일반지능은 지금까지 개발된 모든 인공지능 프로그램의 기능을 갖게 되는데, ③처럼 인공지능이 오히려 사람들의 본질적 가치 회복을 돕는다면 '가치를 훼손한다'는 전제가 흔들려 논지가 약화된다. ①, ②, ④는 일자리 상실과 소외감, 존재론적 지위에 대한 위협, 훼손 가능성을 말해 논지를 뒷받침하는 쪽이다.","past":true,"paper":"2025-k","src":"2025 기출 20번"},
{"id":"p25h01","no":1,"subj":"한국사","unit":"선사·고조선","q":"신석기시대에 대한 설명으로 옳은 것만을 모두 고르면?\n\nㄱ. 갈돌과 갈판을 사용하여 곡물이나 열매를 갈았다.\nㄴ. 반달돌칼을 사용하여 농작물을 수확하였다.\nㄷ. 뼈바늘을 사용하여 옷이나 그물을 만들었다.\nㄹ. 벼농사를 널리 짓게 되었다.","opts":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":0,"exp":"신석기 시대에는 갈돌과 갈판으로 곡물과 열매를 갈았고, 가락바퀴와 뼈바늘로 옷과 그물을 만들었다(ㄱ, ㄷ). 반달돌칼로 이삭을 수확한 것(ㄴ)은 청동기 시대이고, 벼농사가 널리 보급된 것(ㄹ)은 청동기 시대에 시작되어 철기 시대 이후의 일이다.","past":true,"paper":"2025-h","src":"2025 기출 1번"},
{"id":"p25h02","no":2,"subj":"한국사","unit":"초기 국가","q":"(가) 나라에 대한 설명으로 옳은 것은?\n\n옛 (가) ______의 풍속에는 비가 오는 것이 고르지 않아 곡식이 익지 않으면, 문득 왕에게 그 잘못을 돌려 “마땅히 바꾸어야 한다.” 또는 “마땅히 죽여야 한다.”라고 말하였다.\n－『삼국지』 위서 동이전－","opts":["읍락의 우두머리들이 스스로 ‘삼로(三老)’라고 불렀다.","마가(馬加)와 우가(牛加) 등 가축의 이름을 딴 관리가 있었다.","사람이 질병으로 죽으면 살던 집을 버리고 다시 새집을 지었다.","다른 읍락의 산천을 침범하면 노비와 소, 말 등으로 배상하게 하였다."],"ans":1,"exp":"흉년이 들면 왕에게 책임을 물어 바꾸거나 죽이자고 한 나라는 부여이다. 부여에는 마가, 우가, 저가, 구가 등 가축 이름을 딴 관리가 있어 사출도를 다스렸다. 우두머리를 삼로라 부른 것은 옥저와 동예이고, 병으로 죽으면 집을 버린 풍습과 책화(산천 침범 시 배상)는 동예의 풍속이다.","past":true,"paper":"2025-h","src":"2025 기출 2번"},
{"id":"p25h03","no":3,"subj":"한국사","unit":"남북국 시대","q":"다음 외교문서를 작성한 나라에 대한 설명으로 옳지 않은 것은?\n\n무예가 알립니다. “고(구)려의 옛 터전을 회복하고, 부여의 유속(遺俗)을 가지게 되었습니다.”","opts":["당의 등주를 공격하였다.","행정구역을 5경 15부 62주로 나누었다.","집사부 장관인 시중이 왕명을 받들어 행정을 총괄하였다.","‘인안’ 등의 연호를 사용하고 국왕을 ‘황상’이라고 부르기도 하였다."],"ans":2,"exp":"무예는 발해 무왕(대무예)의 이름으로, 일본에 보낸 국서에서 고구려 계승을 밝힌 것이다. 집사부와 그 장관인 시중은 신라의 제도이므로 옳지 않다(발해는 정당성의 대내상이 국정을 총괄하였다). 등주 공격, 5경 15부 62주, 인안 연호와 황상 칭호는 모두 발해에 해당한다.","past":true,"paper":"2025-h","src":"2025 기출 3번"},
{"id":"p25h04","no":4,"subj":"한국사","unit":"삼국 시대","q":"밑줄 친 ‘국왕’의 업적으로 옳지 않은 것은?\n\n이차돈이 __국왕__에게 아뢰기를 “신이 거짓으로 왕명을 전하였다고 문책하여 신의 머리를 베시면 만민이 모두 굴복하고 감히 왕명을 어기지 못할 것입니다.”라고 하였다. … (중략) … 옥리(獄吏)가 이차돈의 머리를 베니 하얀 젖이 한 길이나 솟았다.","opts":["율령을 반포하고 상대등을 설치하였다.","병부를 설치하고 금관가야를 병합하였다.","‘건원’이라는 독자적인 연호를 사용하였다.","국호를 ‘신라’로 정하고 우산국을 정벌하였다."],"ans":3,"exp":"이차돈의 순교를 계기로 불교를 공인한 왕은 신라 법흥왕이다. 국호를 신라로 정하고 이사부를 보내 우산국을 정벌한 것은 지증왕의 업적이므로 옳지 않다. 율령 반포, 상대등과 병부 설치, 금관가야 병합, 건원 연호 사용은 모두 법흥왕의 업적이다.","past":true,"paper":"2025-h","src":"2025 기출 4번"},
{"id":"p25h05","no":5,"subj":"한국사","unit":"삼국 시대","q":"(가) 시기에 일어난 고구려 관련 사건은?\n\n태학 설립 → (가) → 평양 천도","opts":["동옥저를 정벌하였다.","전연의 침입으로 도성이 함락되었다.","후연을 격파하고 요동지역을 차지하였다.","백제의 수도 한성을 함락하고 개로왕을 살해하였다."],"ans":2,"exp":"태학 설립은 소수림왕 때(372), 평양 천도는 장수왕 때(427)이므로 (가)는 그 사이이다. 광개토 대왕이 후연을 격파하고 요동 지역을 차지한 것이 이 시기에 해당한다. 동옥저 정벌은 태조왕(1세기), 전연의 침입은 고국원왕(342) 때로 태학 설립 이전이고, 한성 함락(475)은 평양 천도 이후이다.","past":true,"paper":"2025-h","src":"2025 기출 5번"},
{"id":"p25h06","no":6,"subj":"한국사","unit":"고려 전기","q":"(가) 국왕의 업적으로 옳지 않은 것은?\n\n(가) ______은/는 김부(金傅)를 경주의 사심관으로 임명하여 부호장(副戶長) 이하의 관직 등에 관한 일을 맡게 하였다. 이에 여러 공신들 역시 이를 본받아 자기 주(州)의 사심이 되었으니, 사심관이 이로부터 비롯되었다.","opts":["기인제도를 시행하였다.","발해 유민을 받아들였다.","개경을 ‘황도’라고 불렀다.","훈요10조를 남겼다."],"ans":2,"exp":"신라의 마지막 왕 김부(경순왕)를 경주의 사심관으로 삼은 왕은 고려 태조이다. 개경을 황도, 서경을 서도라 부르고 광덕ㆍ준풍 연호를 쓴 왕은 광종이므로 옳지 않다. 기인 제도 시행, 발해 유민 포용, 훈요 10조는 모두 태조의 업적이다.","past":true,"paper":"2025-h","src":"2025 기출 6번"},
{"id":"p25h07","no":7,"subj":"한국사","unit":"고려 전기","q":"다음 대화가 오고 간 시기는?\n\n소손녕: 그대 나라는 신라 땅에서 일어났고, 고구려 땅은 우리 땅인데 너희들이 쳐들어와 차지하였다.\n서 희: 우리는 고구려를 계승하여 나라 이름을 고려라 하였다. 땅의 경계를 논한다면 그대 나라의 동경도 모두 우리 땅이다.\n\n[연표]\n(가) 시기: 고려 건국 ~ 귀주대첩\n(나) 시기: 귀주대첩 ~ 무신정변\n(다) 시기: 무신정변 ~ 개경 환도\n(라) 시기: 개경 환도 ~ 위화도 회군","opts":["(가)","(나)","(다)","(라)"],"ans":0,"exp":"서희와 소손녕의 담판은 거란의 1차 침입(993, 성종) 때의 일로, 그 결과 고려는 강동 6주를 확보하였다. 고려 건국(918)과 거란의 3차 침입 때의 귀주대첩(1019) 사이이므로 (가) 시기이다. 무신정변은 1170년, 개경 환도는 1270년, 위화도 회군은 1388년이다.","past":true,"paper":"2025-h","src":"2025 기출 7번"},
{"id":"p25h08","no":8,"subj":"한국사","unit":"조선 전기","q":"밑줄 친 ‘국왕’에 대한 설명으로 옳은 것은?\n\n이달에 __국왕__이 친히 언문 28자를 지었는데, 그 글자는 옛 글자를 모방하였고, 초성ㆍ중성ㆍ종성으로 조합해야 한 음절이 이루어졌다. 무릇 문자로 기록한 것과 말로만 전해지는 것을 모두 쓸 수 있으며, 글자는 비록 쉽고 간단하지만 무궁무진한 표현이 가능하니, 이를 ‘훈민정음’이라고 한다.","opts":["『경국대전』을 반포하였다.","『삼강행실도』를 편찬하였다.","『국조오례의』를 간행하였다.","『동국여지승람』을 편찬하였다."],"ans":1,"exp":"훈민정음을 창제한 국왕은 세종이며, 세종 때 충신ㆍ효자ㆍ열녀의 행적을 그림과 글로 엮은 『삼강행실도』가 편찬되었다. 『경국대전』 반포, 『국조오례의』 간행, 『동국여지승람』 편찬은 모두 성종 때의 일이다.","past":true,"paper":"2025-h","src":"2025 기출 8번"},
{"id":"p25h09","no":9,"subj":"한국사","unit":"고려 후기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 무신집권기 불교의 세속화를 비판하면서 불교 본연의 정신을 확립하자는 결사 운동을 주도하여 수선사를 결성하였다. 그는 깨달음을 얻은 뒤에도 수행을 게을리하지 않아야 한다는 돈오점수를 내세웠다.","opts":["천태종을 창시하였다.","임제종을 도입하였다.","교종의 입장에서 선종을 통합하려 하였다.","정혜쌍수라는 실천 수행 방법을 제시하였다."],"ans":3,"exp":"수선사 결사를 이끌고 돈오점수를 내세운 인물은 지눌이다. 지눌은 선과 교학을 함께 닦는 정혜쌍수를 수행 방법으로 제시하여 선종 중심으로 교종을 포용하려 하였다. 천태종을 창시하고 교종의 입장에서 선종을 통합하려 한 인물은 의천이고, 임제종은 고려 말 보우 등이 들여왔다.","past":true,"paper":"2025-h","src":"2025 기출 9번"},
{"id":"p25h10","no":10,"subj":"한국사","unit":"조선 후기","q":"밑줄 친 ‘국왕’의 정책으로 옳은 것은?\n\n__국왕__은 성균관 앞에 “두루 사귀되 편당을 짓지 않는 것이 군자의 공정한 마음이요, 편당을 짓고 두루 사귀지 않는 것은 소인의 사사로운 마음이다.”라는 내용을 새긴 탕평비를 세웠다.","opts":["균역법을 실시하였다.","수원 화성을 건설하였다.","초계문신제를 시행하였다.","『대전회통』을 편찬하였다."],"ans":0,"exp":"성균관 앞에 탕평비를 세운 국왕은 영조이며, 영조는 군포 부담을 1필로 줄이는 균역법을 실시하였다. 수원 화성 건설과 초계문신제 시행은 정조의 정책이고, 『대전회통』은 고종 때 흥선 대원군 집권기에 편찬되었다(영조 때의 법전은 『속대전』이다).","past":true,"paper":"2025-h","src":"2025 기출 10번"},
{"id":"p25h11","no":11,"subj":"한국사","unit":"조선 전기","q":"(가) 인물에 대한 설명으로 옳은 것은?\n\n(가) ______은/는 삼가 두 번 절하고 아뢰옵니다. … (중략) … 성학(聖學)에는 강령이 있고, 심법(心法)에는 지극히 요긴한 것이 있습니다. … (중략) … 이것을 합하여 『성학십도』를 만들어서 각 그림 아래에 또한 외람되게 신의 의견을 덧붙여서 조심스럽게 꾸며 올립니다.","opts":["한전론을 주장하여 토지 소유를 균등하게 하려고 하였다.","(가)의 학문은 김장생 등에게 이어져 기호학파가 형성되었다.","(가)의 학문은 유성룡 등에게 이어져 영남학파가 형성되었다.","여전제를 주장하여 토지를 마을 단위로 공동소유하게 하였다."],"ans":2,"exp":"『성학십도』를 지어 선조에게 올린 인물은 이황이며, 그의 학문은 유성룡, 김성일 등에게 이어져 영남학파를 이루었다. 김장생 등으로 이어져 기호학파를 이룬 것은 이이의 학문이다. 한전론은 이익, 여전제는 정약용의 토지 개혁론이다.","past":true,"paper":"2025-h","src":"2025 기출 11번"},
{"id":"p25h12","no":12,"subj":"한국사","unit":"개항기","q":"다음 조약이 체결된 이후에 있었던 사실이 아닌 것은?\n\n제1조 한국 정부는 시정개선(施政改善)에 관하여 통감의 지도를 받을 것.\n제4조 한국 고등관리의 임면(任免)은 통감의 동의를 받아 이를 집행할 것.\n제5조 한국 정부는 통감이 추천한 일본인을 한국 관리로 임명할 것.","opts":["고종이 강제 퇴위당하였다.","대한제국의 군대가 해산되었다.","안중근이 이토 히로부미를 저격하였다.","이른바 ‘남한 대토벌 작전’이 전개되었다."],"ans":0,"exp":"제시된 조약은 1907년 7월 24일에 체결된 한일 신협약(정미 7조약)이다. 고종은 헤이그 특사 사건을 구실로 그 직전인 1907년 7월 20일에 강제 퇴위당했으므로 조약 체결 이전의 일이다. 군대 해산(1907년 8월), 안중근의 이토 히로부미 저격(1909년 10월), 남한 대토벌 작전(1909년 9월~)은 모두 그 이후이다.","past":true,"paper":"2025-h","src":"2025 기출 12번"},
{"id":"p25h13","no":13,"subj":"한국사","unit":"개항기","q":"다음 조약에 대한 설명으로 옳은 것은?\n\n제9관 수입 또는 수출되는 각 화물이 해관을 통과할 때는 응당 본 조약에 첨부된 세칙에 따라 관세를 납부해야 한다.\n제37관 조선국에서 가뭄과 홍수, 전쟁 등으로 인하여 국내에 양식이 결핍할 것을 우려하여 일시 쌀 수출을 금지하려고 할 때에는 1개월 전에 지방관이 일본 영사관에게 통지하여 미리 그 기간을 항구에 있는 일본 상인들에게 전달하여 일률적으로 준수하는 데 편리하게 한다.","opts":["갑신정변의 영향으로 체결되었다.","최혜국 대우에 관한 내용을 담고 있다.","일본 경비병의 공사관 주둔을 명시하였다.","부산 외 2곳에 개항장이 설치되는 결과를 가져왔다."],"ans":1,"exp":"관세 납부와 방곡령 선포(1개월 전 통지) 규정을 담은 조약은 1883년의 조일 통상 장정이며, 이 조약에는 일본에 대한 최혜국 대우 조항도 들어 있다. 갑신정변의 영향으로 맺은 것은 한성 조약과 톈진 조약, 일본 경비병의 공사관 주둔은 제물포 조약, 부산 외 2곳의 개항은 강화도 조약(조일 수호 조규)의 내용이다.","past":true,"paper":"2025-h","src":"2025 기출 13번"},
{"id":"p25h14","no":14,"subj":"한국사","unit":"일제 강점기","q":"밑줄 친 ‘내’에 대한 설명으로 옳은 것만을 모두 고르면?\n\n__내__가 원하는 우리 민족의 사업은 결코 세계를 무력으로 정복하거나 경제력으로 지배하려는 것이 아니다. 오직 사랑의 문화, 평화의 문화로 우리 스스로 잘 살고 인류 전체가 의좋게 즐겁게 살도록 하는 일을 하자는 것이다. 어느 민족도 일찍이 그러한 일을 한 이가 없었으니 그것은 공상이라고 하지 말라.\n\nㄱ. 대한민국 임시정부 주석을 지냈다.\nㄴ. 상하이에서 한인 애국단을 조직하였다.\nㄷ. 조선 의용대를 창설하여 항일 무장 투쟁을 전개하였다.\nㄹ. 조선 혁명군을 지휘하여 영릉가 전투를 승리로 이끌었다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":0,"exp":"제시된 글은 김구의 「나의 소원」 가운데 문화 국가를 바라는 대목이다. 김구는 1931년 상하이에서 한인 애국단을 조직하였고(ㄴ), 1940년부터 대한민국 임시 정부 주석을 지냈다(ㄱ). 조선 의용대를 창설한 인물은 김원봉(ㄷ), 조선 혁명군을 이끌고 영릉가 전투에서 승리한 인물은 양세봉(ㄹ)이다.","past":true,"paper":"2025-h","src":"2025 기출 14번"},
{"id":"p25h15","no":15,"subj":"한국사","unit":"일제 강점기","q":"다음 선언으로 시작된 운동에 대한 설명으로 옳은 것은?\n\n우리는 지금 우리 조선이 독립국이고 조선인이 자주민임을 선언하노라. 이를 세계 여러 나라에 알려 인류 평등의 대의를 분명히 밝히고, 이를 후손에게 대대로 전하여 민족 자존의 정당한 권리를 영원히 누릴 수 있도록 하노라.","opts":["형평 운동과 같은 연도에 발생하였다.","신간회에서 진상 조사단을 파견하였다.","이 운동 이후 일제는 이른바 ‘문화 통치’로 통치 방식을 바꾸었다.","운동 준비 과정에서 민족주의 세력과 사회주의 세력이 연대하였다."],"ans":2,"exp":"제시된 글은 기미 독립 선언서로, 1919년 3ㆍ1 운동의 시작을 알렸다. 3ㆍ1 운동에 놀란 일제는 무단 통치를 이른바 문화 통치로 바꾸었다. 형평 운동은 1923년에 시작되었고, 신간회의 진상 조사단 파견은 1929년 광주 학생 항일 운동, 민족주의와 사회주의 세력의 연대는 1926년 6ㆍ10 만세 운동의 준비 과정에 해당한다.","past":true,"paper":"2025-h","src":"2025 기출 15번"},
{"id":"p25h16","no":16,"subj":"한국사","unit":"문화유산","q":"유네스코 세계문화유산으로 등재된 것만을 모두 고르면?\n\nㄱ. 경복궁\nㄴ. 남한산성\nㄷ. 석촌동 고분군\nㄹ. 가야 고분군","opts":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":3,"exp":"남한산성은 2014년, 가야 고분군은 2023년에 유네스코 세계유산으로 등재되었다(ㄴ, ㄹ). 궁궐 가운데 세계유산은 창덕궁이며 경복궁은 등재되지 않았다. 서울 석촌동 고분군은 백제 역사 유적 지구(공주ㆍ부여ㆍ익산)에 포함되지 않아 등재되지 않았다.","past":true,"paper":"2025-h","src":"2025 기출 16번"},
{"id":"p25h17","no":17,"subj":"한국사","unit":"일제 강점기","q":"(가)에 대한 설명으로 옳지 않은 것은?\n\n대한민국 임시 정부는 대한민국 원년에 정부가 공포한 군사 조직법에 의거하여 … (중략) … (가) ______을/를 조직하고 … (중략) … 공동의 적인 일본 제국주의자들을 타도하기 위해 연합군의 일원으로 항전을 계속한다.","opts":["중국군과 연합하여 쌍성보 전투에서 승리했다.","조선 의용대가 합류하여 군사력이 한층 더 강화되었다.","중국 충칭에서 국민당 정부의 지원을 받아 창설되었다.","영국군의 협조 요청으로 미얀마, 인도 전선에 파견되었다."],"ans":0,"exp":"대한민국 임시 정부가 조직한 군대는 한국 광복군(1940)이다. 쌍성보 전투(1932)는 지청천의 한국 독립군이 중국 호로군과 연합하여 승리한 전투이므로 옳지 않다. 한국 광복군은 충칭에서 중국 국민당 정부의 지원으로 창설되었고, 1942년 조선 의용대 일부가 합류하였으며, 영국군의 요청으로 인도ㆍ미얀마 전선에 대원을 파견하였다.","past":true,"paper":"2025-h","src":"2025 기출 17번"},
{"id":"p25h18","no":18,"subj":"한국사","unit":"현대","q":"다음 조약이 체결되고 난 이후에 일어난 일은?\n\n제2조 당사국 중 어느 한 나라의 정치적 독립 또는 안전이 외부로부터의 무력 공격에 의하여 위협을 받고 있다고 어느 당사국이든지 인정할 때에는 언제든지 당사국은 서로 협의한다.\n제4조 상호적 합의에 의하여 미합중국의 육군, 해군, 공군을 대한민국의 영토 내와 그 부근에 배치하는 권리를 대한민국은 이를 허가하고 미합중국은 이를 수락한다.","opts":["판문점에서 정전협정이 체결되었다.","베트남에 한국군 전투 부대가 파견되었다.","이승만 대통령이 반공 포로를 석방하였다.","유엔군 총사령관 맥아더가 인천 상륙 작전을 감행하였다."],"ans":1,"exp":"제시된 조약은 정전 협정 직후인 1953년 10월에 체결된 한미 상호 방위 조약이다. 베트남에 한국군 전투 부대가 파견된 것은 1965년으로 그 이후의 일이다. 인천 상륙 작전(1950년 9월), 반공 포로 석방(1953년 6월), 정전 협정 체결(1953년 7월)은 모두 조약 체결 이전이다.","past":true,"paper":"2025-h","src":"2025 기출 18번"},
{"id":"p25h19","no":19,"subj":"한국사","unit":"개항기","q":"(가) 국가에 대한 설명으로 옳지 않은 것은?\n\n제1조 지계아문은 한성부와 13도 각 부ㆍ군의 산림, 토지, 전답, 가옥의 계권(契券)을 바로잡기 위해 임시로 설치할 것.\n제10조 산림, 토지, 전답, 가옥은 (가) ______인(人) 이외에는 소유주가 될 수 없을 것임. 단, 각 개항장 내에서는 이러한 제한이 없을 것임.","opts":["‘광무’라는 연호를 사용하였다.","교육 입국의 조서를 반포하였다.","구본신참의 원칙하에 개혁을 추진하였다.","서대문과 청량리 사이에 전차를 부설하였다."],"ans":1,"exp":"지계아문을 두어 지계를 발급한 나라는 대한 제국(1897~1910)이다. 교육 입국 조서는 대한 제국 선포 이전인 1895년 제2차 갑오개혁 때 고종이 반포하였으므로 옳지 않다. 광무 연호 사용, 구본신참 원칙의 광무개혁, 서대문~청량리 전차 부설(1899)은 대한 제국 시기의 일이다.","past":true,"paper":"2025-h","src":"2025 기출 19번"},
{"id":"p25h20","no":20,"subj":"한국사","unit":"개항기","q":"(가) ～ (라)를 시기가 이른 것부터 바르게 나열한 것은?\n\n(가) 어재연의 부대가 광성보에서 미국군에게 패하였다.\n(나) 양헌수의 부대가 정족산성에서 프랑스군을 물리쳤다.\n(다) 독일인 오페르트가 남연군의 묘를 도굴하려다 실패하였다.\n(라) 미국 상선 제너럴셔먼호가 평양 부근까지 들어와 통상을 요구하였다.","opts":["(가) → (나) → (다) → (라)","(나) → (라) → (가) → (다)","(다) → (나) → (가) → (라)","(라) → (나) → (다) → (가)"],"ans":3,"exp":"제너럴셔먼호 사건(1866년 7월)이 먼저 일어났고, 같은 해 병인양요 때 양헌수 부대가 정족산성에서 프랑스군을 물리쳤다(1866년 10~11월). 이어 오페르트 도굴 사건(1868)이 있었고, 제너럴셔먼호 사건을 구실로 일어난 신미양요(1871) 때 어재연 부대가 광성보에서 싸웠다. 따라서 (라) → (나) → (다) → (가) 순이다.","past":true,"paper":"2025-h","src":"2025 기출 20번"},
{"id":"p25e01","no":1,"subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nSome plant diseases are indeed difficult to ______ because they can spread rapidly and easily, impacting multiple plants in a vast area.","opts":["nourish","eradicate","proliferate","detect"],"ans":1,"exp":"빠르고 쉽게 퍼져 넓은 지역의 식물에 영향을 준다는 이유가 이어지므로, 그런 병은 \"뿌리 뽑기\"(eradicate) 어렵다는 말이 알맞다. nourish(영양분을 주다)와 proliferate(급증하다)는 병을 없앤다는 문맥과 맞지 않고, 널리 퍼지는 병은 오히려 눈에 띄므로 detect(발견하다)도 이유와 어울리지 않는다.","past":true,"paper":"2025-e","src":"2025 기출 1번"},
{"id":"p25e02","no":2,"subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIn the business world, ______ is highly valued as it showcases a person’s commitment to meeting deadlines and respecting others’ time.","opts":["humility","sincerity","frugality","punctuality"],"ans":3,"exp":"마감을 지키고 다른 사람의 시간을 존중하는 태도를 보여 주는 것은 punctuality(시간 엄수)이다. humility(겸손), sincerity(성실·진실함), frugality(검소)는 시간과 직접 관련이 없다.","past":true,"paper":"2025-e","src":"2025 기출 2번"},
{"id":"p25e03","no":3,"subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nPreliminary investigations indicate that some, if not all, of the clients’ money, ______ to be $6 million in total, has found its way into unquoted companies and property purchases.","opts":["believe","believing","believed","believes"],"ans":2,"exp":"that절의 동사는 has found이므로 쉼표 사이의 빈칸은 the clients’ money를 꾸미는 삽입구이다. 돈은 총 600만 달러로 \"여겨지는\" 대상이므로 (which is) believed to be의 과거분사 believed가 알맞다. believe와 believes는 동사가 겹치고, believing은 능동이라 뜻이 맞지 않는다.","past":true,"paper":"2025-e","src":"2025 기출 3번"},
{"id":"p25e04","no":4,"subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nYuna (10:30 am): Hi Jenny, I need your advice on buying a car.\nJenny (10:31 am): Hi, do you want to buy a car? What kind of car?\nYuna (10:32 am): Maybe a mid-sized sedan or an SUV.\nJenny (10:32 am): An SUV is more practical.\nYuna (10:33 am): SUVs are more expensive than sedans. ______.\nJenny (10:34 am): One of my friends is a used car dealer. He can give you a good deal.\nYuna (10:34 am): Really? That would be nice.\nJenny (10:35 am): Do you want his number?\nYuna (10:35 am): Sure.\nJenny (10:35 am): Just one second.\nJenny (10:36 am): 707-123-5678\nYuna (10:36 am): Thanks!","opts":["I’m on a tight budget","I need to get in shape","It should clear up soon","I can pick you up later"],"ans":0,"exp":"SUV가 세단보다 비싸다는 말에 이어지고, Jenny가 싸게 해 줄 수 있는 중고차 딜러 친구를 소개하므로 \"예산이 빠듯하다\"(I’m on a tight budget)가 알맞다. 몸매 관리, 날씨가 곧 갤 것이라는 말, 나중에 태우러 가겠다는 말은 차 값 이야기와 이어지지 않는다.","past":true,"paper":"2025-e","src":"2025 기출 4번"},
{"id":"p25e05","no":5,"subj":"영어","unit":"생활영어","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nA: How many copies of the presentation materials do you think we’ll need?\nB: 60 should be enough, but it’s always good to have extras.\nA: True. Better safe than sorry. How many would you recommend then?\nB: Let’s make it 75 just in case we have more attendees than expected like last time.\nA: Good idea. ______?\nB: Absolutely. We are going to have people asking for the presentation materials after the presentation.\nA: Sure, that way everyone can easily have it whenever needed.","opts":["How early do we need to distribute the materials","Should we also have a digital version for sharing","Will the materials be printed in color or black and white","Are there any specific materials we should avoid including"],"ans":1,"exp":"B가 \"물론이죠. 발표가 끝난 뒤 자료를 달라는 사람들이 있을 거예요\"라고 답하고 A가 \"그러면 누구나 필요할 때 쉽게 가질 수 있겠다\"고 하므로, 빈칸은 공유용 디지털 자료도 준비할지를 묻는 말이다. 나머지는 Absolutely로 답할 수 없거나(시기, 컬러 여부) 뒤 내용과 이어지지 않는다.","past":true,"paper":"2025-e","src":"2025 기출 5번"},
{"id":"p25e06","no":6,"subj":"영어","unit":"독해 주제","q":"(A)에 들어갈 윗글의 제목으로 가장 적절한 것은?\n\n(A) ______\n\nWe have been notified of a scam targeting people through text messages requesting they pay an overdue parking ticket.\n• These text messages are not from us.\n• Do not click the link or provide payment details.\n• Report these messages to your cell phone provider and then delete them.\n• We do not notify the public of fines through texting, media, or social media.\n\nCity-approved notification methods for parking tickets:\n• Ticket served to vehicle\n• Ticket sent by post to registered owner of vehicle","opts":["City Parking Ticket Payment Methods","How to Avoid Getting Parking Tickets","Save Time and Money! Helpful Parking Tips","Alert! Fake Parking Ticket Payment Text Messages"],"ans":3,"exp":"밀린 주차 위반 과태료를 내라는 문자 사기가 있으니 링크를 누르지 말고 신고한 뒤 지우라고 알리는 글이므로 \"주의! 가짜 주차 위반 과태료 납부 문자\"가 제목으로 알맞다. 납부 방법, 주차 위반을 피하는 법, 주차 요령을 설명하는 글이 아니다.","past":true,"paper":"2025-e","src":"2025 기출 6번"},
{"id":"p25e07","no":7,"subj":"영어","unit":"독해 내용일치","q":"윗글의 내용과 일치하는 것은?\n\n(A) ______\n\nWe have been notified of a scam targeting people through text messages requesting they pay an overdue parking ticket.\n• These text messages are not from us.\n• Do not click the link or provide payment details.\n• Report these messages to your cell phone provider and then delete them.\n• We do not notify the public of fines through texting, media, or social media.\n\nCity-approved notification methods for parking tickets:\n• Ticket served to vehicle\n• Ticket sent by post to registered owner of vehicle","opts":["전달된 링크에 결제 세부 정보를 입력해야 한다.","수신한 문자는 삭제하면 안 된다.","시에서는 벌금을 문자로 통보한다.","고지서는 등록된 차량 소유주에게 우편으로 발송된다."],"ans":3,"exp":"시가 승인한 통지 방법으로 \"Ticket sent by post to registered owner of vehicle\"이 있으므로 등록된 차량 소유주에게 우편으로 보낸다는 말이 일치한다. 링크를 누르거나 결제 정보를 주지 말라고 했고, 문자는 신고한 뒤 삭제하라고 했으며, 시는 문자로 벌금을 알리지 않는다고 했으므로 나머지는 틀리다.","past":true,"paper":"2025-e","src":"2025 기출 7번"},
{"id":"p25e08","no":8,"subj":"영어","unit":"어휘","q":"밑줄 친 critical의 의미와 가장 가까운 것은?\n\nHealth for People (https://healthforpeople.or.kr)\n\nHealth for People\n\nPeople should be able to live a happy, healthy, and prosperous life. Health is a substantial part of human right, and makes a __critical__ contribution to societal well-being, economic growth, and peace.\n\nBut access to health is not equitable.\n\nThe National Health Center Foundation (NHC Foundation) is here to support the National Health Center (NHC) to achieve its vision of a nation in which all people attain the highest level of health. The NHC aims to promote health and serve the vulnerable. The NHC Foundation is committed to helping the NHC by partnering with diverse actors, including businesses, philanthropists, and the general public.","opts":["pivotal","perilous","analytical","judgmental"],"ans":0,"exp":"건강이 사회의 안녕, 경제 성장, 평화에 \"매우 중요한\" 기여를 한다는 문맥이므로 critical은 pivotal(중추적인, 아주 중요한)과 뜻이 가깝다. perilous(위험한), analytical(분석적인), judgmental(비판적인)은 critical의 다른 뜻이거나 관계없는 뜻이다.","past":true,"paper":"2025-e","src":"2025 기출 8번"},
{"id":"p25e09","no":9,"subj":"영어","unit":"독해 주제","q":"윗글의 목적으로 가장 적절한 것은?\n\nHealth for People (https://healthforpeople.or.kr)\n\nHealth for People\n\nPeople should be able to live a happy, healthy, and prosperous life. Health is a substantial part of human right, and makes a __critical__ contribution to societal well-being, economic growth, and peace.\n\nBut access to health is not equitable.\n\nThe National Health Center Foundation (NHC Foundation) is here to support the National Health Center (NHC) to achieve its vision of a nation in which all people attain the highest level of health. The NHC aims to promote health and serve the vulnerable. The NHC Foundation is committed to helping the NHC by partnering with diverse actors, including businesses, philanthropists, and the general public.","opts":["의료비 지원이 필요한 사람들을 위한 기부를 독려하려고","행복하고 건강한 삶을 위한 캠페인을 제안하려고","NHC를 지원하는 기관을 소개하려고","NHC의 파트너를 선정하려고"],"ans":2,"exp":"글의 중심은 NHC가 비전을 이루도록 돕는 NHC Foundation이 무엇을 하는 곳인지 알리는 것이므로 NHC를 지원하는 기관을 소개하는 글이다. 기부를 직접 권하거나, 캠페인을 제안하거나, 파트너를 뽑는다는 내용은 없다.","past":true,"paper":"2025-e","src":"2025 기출 9번"},
{"id":"p25e10","no":10,"subj":"영어","unit":"독해 주제","q":"다음 글의 목적으로 가장 적절한 것은?\n\nTo: chlsbrown@cbsys.com\nFrom: tomsmith@boogle.com\nDate: June 21, 2025\nSubject: Thank you for the interview\n\nDear Mr. Charles Brown,\n\nI am writing to thank you for the interview last week. I truly enjoyed our conversation. The information you shared about your new Account Management System was very valuable.\n\nI would like to follow up now to see if there are any updates regarding the status of my application.\n\nThis position looks like a great fit for me and my career goals. Anything you can share about your decision timeline or any next steps would be greatly appreciated.\n\nI would gladly provide any additional information if needed. Thank you again.\n\nSincerely,\n\nTom Smith","opts":["to submit an application form","to set up an interview appointment","to inquire about updates on the decision process","to request more information about the company’s business"],"ans":2,"exp":"면접에 대한 감사 인사에 이어 \"any updates regarding the status of my application\", \"your decision timeline or any next steps\"를 묻고 있으므로 채용 결정 진행 상황을 문의하는 글이다. 지원서는 이미 냈고 면접도 지난주에 보았으며, 회사 사업에 대한 정보를 더 달라는 말은 없다.","past":true,"paper":"2025-e","src":"2025 기출 10번"},
{"id":"p25e11","no":11,"subj":"영어","unit":"독해 내용일치","q":"다음 글에서 The National Independence Museum에 대한 내용과 일치하는 것은?\n\nNIM (https://nim.memorial.or.kr)\n\nThe National Independence Museum\n\nThe National Independence Museum preserves the national history through exhibitions, research, and educational programs, while fostering national pride. We invite you to experience this legacy and hear the enduring calls for peace in a scenic rural setting.\n\nMajor Projects\n－ Exhibitions & Collection Management: A total of 150,000 relics of the independence movement are displayed in eight exhibition halls.\n－ Research: Dedicated to the study of the independence movement, the Museum supports scholarly work on related historical topics.\n－ Education: Through educational programs, the Museum promotes the national identity and deepens historical understanding among citizens.\n－ Cultural Events: Regular cultural events are held to provide visitors with insights into the national history and culture.","opts":["It is located in an urban environment surrounded by many skyscrapers.","It displays more than a million artifacts related to the independence movement.","It supports educational activities instead of scholarly projects.","It offers visitors cultural events on a regular basis."],"ans":3,"exp":"\"Regular cultural events are held\"라고 했으므로 정기적으로 문화 행사를 연다는 말이 일치한다. 박물관은 경치 좋은 시골(a scenic rural setting)에 있고, 전시 유물은 15만 점이며, 교육뿐 아니라 학술 연구(scholarly work)도 지원하므로 나머지는 틀리다.","past":true,"paper":"2025-e","src":"2025 기출 11번"},
{"id":"p25e12","no":12,"subj":"영어","unit":"독해 내용일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\nTHE LARGEST AVIATION COLLECTIBLES SHOW IN THE EAST COAST\n\nWhen\nSaturday, September 6, 2025\n10 a.m. – 6 p.m.\n\nWhere\nGrand Exposition Center\n160 Airport Avenue\n\n• $10 Admission\n• Children under 12 Free\n\nHourly Door Prizes\n\nOver 90 Tables of Hard-to-find Airline and Transportation Collectibles!\n\nDiscover and Buy Sensational Domestic and Foreign Airline Collectibles such as:\nAirline & Travel Posters,\nDiecast Models,\nThousands of Other Historic Airline & Transportation Artifacts and Much More!","opts":["The East Coast’s biggest aviation collectibles show will take place in September.","Door prizes are exclusively for children under 12.","Rare airline and transportation collectibles will be displayed at the show.","Visitors can see both national and international collectibles."],"ans":1,"exp":"12세 미만 어린이에게 해당하는 것은 무료 입장(Children under 12 Free)이고, 경품(Door Prizes)은 매시간 있다고만 했을 뿐 어린이 전용이라는 말은 없다. 9월 6일 개최, 구하기 힘든(Hard-to-find) 항공·교통 수집품 전시, 국내외(Domestic and Foreign) 수집품은 모두 글과 일치한다.","past":true,"paper":"2025-e","src":"2025 기출 12번"},
{"id":"p25e13","no":13,"subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nWe tend (1) __to imagine__ Robin Hood and outlaws in general as fugitives because they defied the king’s officials and operated (2) __outside the law__ in the great forests of the kingdom. What we forget is that there (3) __were__ an established process behind the creation of outlaws. On the whole, men did not choose to become outlaws; they (4) __were made__ outlaws.","opts":["(1) to imagine","(2) outside the law","(3) were","(4) were made"],"ans":2,"exp":"there 구문의 동사는 뒤에 오는 주어에 수를 맞추는데, 주어가 단수인 an established process이므로 were가 아니라 was여야 한다. tend to imagine은 tend가 to부정사를 취한 것, outside the law는 \"법 밖에서\"라는 전치사구, were made outlaws는 \"make + 목적어 + 보어\"의 수동태로 모두 옳다.","past":true,"paper":"2025-e","src":"2025 기출 13번"},
{"id":"p25e14","no":14,"subj":"영어","unit":"문법","q":"밑줄 친 부분 중 어법상 옳지 않은 것을 고르시오.\n\nThe olive tree was (1) __such a driving force__ in the economies of the Ancient Greek city-states (2) __that__ it was believed (3) __to have been__ a gift of gods―namely from Athena, the goddess of wisdom, (4) __whom__ Athens took its name.","opts":["(1) such a driving force","(2) that","(3) to have been","(4) whom"],"ans":3,"exp":"\"Athens took its name from Athena\"에서 온 관계절이므로 전치사 from이 필요해 from whom이어야 한다. whom만 쓰면 뒤가 완전한 절이라 맞지 않는다. \"such a + 명사 ... that\"은 \"매우 ~해서 …하다\"의 구문이고, to have been은 믿어진 시점보다 앞선 일을 나타내는 완료부정사로 모두 옳다.","past":true,"paper":"2025-e","src":"2025 기출 14번"},
{"id":"p25e15","no":15,"subj":"영어","unit":"독해 주제","q":"다음 글의 주제로 가장 적절한 것은?\n\nThe reason artificial blue light in devices can be so harmful in the evening is that it mimics the sun’s natural blue light―which confuses the body’s circadian clock. A study showed that viewing artificial blue light in the evening will push sleep-inducing melatonin hormones down drastically, disrupting bedtimes and affecting daytime behavior. But getting that same blue light from the sun, which contains a health-boosting full spectrum of light, does the opposite. According to the study, the more daytime blue light a person gets, the better defense they have against the harms of evening blue light from screens. Thus, packing the day with sunshine creates a blue-light build-up that helps counteract the consequences of that artificial light at night. In other words, the more sunlight exposure a child gets during the day, the better their brain can build a wall against the harms of artificial blue light later.","opts":["Sunlight’s help in fighting artificial blue light effects","The dangers of using devices during the day","How screens affect children’s sleep cycles","Why melatonin levels drop in the evening"],"ans":0,"exp":"낮에 햇빛을 많이 쬘수록 저녁에 화면에서 나오는 인공 블루라이트의 해로움을 더 잘 막는다는 것이 글의 결론이므로 \"인공 블루라이트의 영향에 맞서는 데 햇빛이 주는 도움\"이 주제이다. 낮의 기기 사용 위험은 언급되지 않고, 화면이 수면에 미치는 영향과 멜라토닌 감소는 도입부의 일부 내용일 뿐이다.","past":true,"paper":"2025-e","src":"2025 기출 15번"},
{"id":"p25e16","no":16,"subj":"영어","unit":"독해 순서","q":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?\n\nUsually toddlers picking things up from the ground means trouble.\n\n(A) The family reported the find to the Israel Antiquities Authority, which determined it is a beetle-shaped seal from the Middle Bronze Age.\n(B) But as 3-year-old Ziv Nitzan of Israel brushed away the sand on what seemed to be a rock, she revealed a nearly 4,000-year-old Egyptian artifact.\n(C) Ziv was awarded a certificate for good citizenship, and the Heritage Minister of Israel said the seal “connects us to a grand story,” and that “even children can be a part of discovering history.”","opts":["(A) － (C) － (B)","(B) － (A) － (C)","(B) － (C) － (A)","(C) － (B) － (A)"],"ans":1,"exp":"\"아기가 땅에서 뭔가 줍는 것은 보통 골칫거리\"라는 말 뒤에 But으로 시작해 Ziv가 유물을 발견한 일을 소개하는 (B)가 온다. 그 발견물(the find)을 가족이 신고해 인장으로 판정받는 (A)가 이어지고, 그 결과 Ziv가 표창을 받고 장관이 the seal을 언급하는 (C)가 마지막이다.","past":true,"paper":"2025-e","src":"2025 기출 16번"},
