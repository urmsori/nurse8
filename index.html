{"id":"c312","subj":"지역사회간호","unit":"역학 연구","q":"코호트 연구와 비교한 환자－대조군 연구의 특징으로 옳지 않은 것은?","opts":["희귀한 질병의 위험 요인을 연구하는 데 적합하다.","질병 발생률과 비교위험도를 직접 산출할 수 있다.","연구 기간이 비교적 짧고 비용이 적게 든다.","과거 노출에 대한 정보가 부정확할 수 있다."],"ans":1,"exp":"환자－대조군 연구는 이미 질병이 있는 환자군과 질병이 없는 대조군의 과거 노출을 비교하므로 발생률을 구할 수 없고, 비교위험도 대신 교차비를 산출한다. 적은 대상자로 짧은 기간에 할 수 있어 희귀 질환이나 잠복기가 긴 질환에 적합하지만, 과거 노출을 기억에 의존하여 조사하므로 정보가 부정확할 수 있다."},
{"id":"c313","subj":"지역사회간호","unit":"인구","q":"인구 통계 중 인구 동태 통계에 해당하는 것만을 모두 고르면?\n\nㄱ. 출생\nㄴ. 성별·연령별 인구 구성\nㄷ. 혼인\nㄹ. 전입과 전출","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"ans":3,"exp":"인구 동태는 일정 기간에 일어나는 인구의 변동으로 출생, 사망, 혼인, 이혼, 전입, 전출이 해당한다. 성별·연령별 인구 구성은 일정 시점의 인구 상태를 나타내는 인구 정태 통계이며, 인구 크기와 분포, 밀도도 인구 정태에 속한다."},
{"id":"c314","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법」상 예방접종 완료 여부의 검사에 대한 설명으로 옳은 것은?","opts":["초등학교와 중학교의 장이 실시한다.","학생이 입학한 날부터 30일 이내에 실시한다.","교육감에게 예방접종증명서를 발급받아 확인한다.","접종을 마치지 않은 학생은 입학을 허가하지 않는다."],"ans":0,"exp":"초등학교와 중학교의 장은 학생이 새로 입학한 날부터 90일 이내에 시장·군수·구청장에게 예방접종증명서를 발급받아 예방접종을 모두 받았는지 검사한다. 접종을 모두 받지 못한 학생에게는 필요한 예방접종을 받도록 지도하고, 필요하면 관할 보건소장에게 협조를 요청할 수 있다. 입학을 막는 규정은 없다."},
{"id":"c315","subj":"지역사회간호","unit":"학교보건","q":"학교보건법령상 교실의 환경위생 기준으로 옳지 않은 것은?","opts":["조도는 책상면을 기준으로 300럭스 이상으로 한다.","비교습도는 30% 이상 80% 이하로 한다.","교사 안의 소음은 55 dB(A) 이하로 한다.","실내온도는 섭씨 10도 이상 20도 이하로 한다."],"ans":3,"exp":"교실의 실내온도는 섭씨 18도 이상 28도 이하로 하되, 난방온도는 18도 이상 20도 이하, 냉방온도는 26도 이상 28도 이하로 한다. 조도는 책상면 기준 300럭스 이상, 비교습도는 30% 이상 80% 이하, 교사 안의 소음은 55 dB(A) 이하가 기준이다."},
{"id":"c316","subj":"지역사회간호","unit":"환경보건","q":"식중독 중 다음 설명에 해당하는 것은?\n\n○ 여름철에 어패류를 날로 먹은 뒤 주로 발생한다.\n○ 원인균은 염분이 있는 환경에서 잘 자라는 호염성 세균이다.\n○ 감염형 식중독이며 충분히 가열하면 예방할 수 있다.","opts":["캠필로박터 식중독","노로바이러스 식중독","황색포도상구균 식중독","장염 비브리오 식중독"],"ans":3,"exp":"장염 비브리오균은 바닷물에 사는 호염성 세균으로, 수온이 오르는 여름철에 어패류를 날로 먹어 감염되는 감염형 식중독을 일으킨다. 열에 약하므로 충분히 가열하면 예방할 수 있다. 캠필로박터 식중독은 주로 닭고기 등 육류가 원인이고, 노로바이러스 식중독은 겨울철에 많으며, 황색포도상구균 식중독은 독소형이다."},
{"id":"c317","subj":"지역사회간호","unit":"질병 예방","q":"고혈압 관리 사업에서 이차예방 활동에 해당하지 않는 것은?","opts":["지역주민 대상 혈압 선별검사","고혈압 조기 발견을 위한 건강검진","고혈압으로 진단된 주민의 조기 치료 연계","뇌졸중 후유증 환자의 재활 운동 지도"],"ans":3,"exp":"이차예방은 질병을 조기에 발견하고 조기에 치료하여 진행을 막는 것으로 선별검사, 건강검진, 조기 치료가 해당한다. 합병증으로 생긴 장애를 줄이고 기능을 회복시키는 재활은 삼차예방이다. 일차예방은 질병이 생기기 전에 하는 건강증진과 예방접종 등이다."},
{"id":"c318","subj":"지역사회간호","unit":"질병 예방","q":"질병의 예방 수준 중 일차예방 활동에 해당하는 것만을 모두 고르면?\n\nㄱ. 영유아 예방접종\nㄴ. 유방암 조기 검진\nㄷ. 청소년 흡연 예방 교육\nㄹ. 뇌졸중 환자의 재활 운동","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"ans":0,"exp":"일차예방은 질병이 발생하기 전에 건강을 증진하고 질병을 막는 활동으로 예방접종과 보건교육이 해당한다. 암 조기 검진은 질병을 일찍 찾아내는 이차예방이고, 뇌졸중 환자의 재활 운동은 장애를 줄이고 기능을 회복시키는 삼차예방이다."},
{"id":"c319","subj":"지역사회간호","unit":"질병 예방","q":"리벨과 클라크(Leavell & Clark)의 질병 자연사 중 다음에 해당하는 단계는?\n\n○ 병인의 자극이 시작되는 질병 전기이다.\n○ 예방접종 같은 특수예방으로 숙주의 저항력을 높인다.","opts":["비병원성기","초기 병원성기","불현성 감염기","발현성 감염기"],"ans":1,"exp":"초기 병원성기는 병인의 자극이 시작되는 질병 전기로, 예방접종 같은 특수예방이 필요한 단계이다. 비병원성기에는 환경위생과 보건교육 같은 건강증진 활동을, 불현성 감염기에는 조기 진단과 조기 치료를, 발현성 감염기에는 악화 방지를 위한 치료를 한다. 마지막 회복기에는 재활과 사회 복귀를 돕는다."},
{"id":"c320","subj":"지역사회간호","unit":"모자보건","q":"모자보건법령상 임산부의 정기 건강진단 실시기준으로 옳은 것은?","opts":["임신 28주까지: 4주마다 1회","임신 29주에서 36주까지: 4주마다 1회","임신 37주 이후: 2주마다 1회","임신 전 기간: 1주마다 1회"],"ans":0,"exp":"「모자보건법 시행규칙」이 정한 임산부의 정기 건강진단 실시기준은 임신 28주까지 4주마다 1회, 임신 29주에서 36주까지 2주마다 1회, 임신 37주 이후 1주마다 1회이다. 분만이 가까워질수록 간격이 짧아진다."},
{"id":"k57","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 간호사는 모두 면허를 가지고 있다.\n○ 면허를 가진 사람은 모두 보수 교육을 받는다.\n○ 보건소 직원 중에는 면허를 가지지 않은 사람이 있다.","opts":["보수 교육을 받는 사람은 모두 간호사이다.","보수 교육을 받지 않는 사람은 간호사가 아니다.","보건소 직원 중에는 보수 교육을 받지 않는 사람이 있다.","면허를 가지지 않은 사람은 모두 보수 교육을 받지 않는다."],"ans":1,"exp":"첫째와 둘째 진술을 이으면 '간호사는 모두 보수 교육을 받는다'가 되고, 그 대우인 '보수 교육을 받지 않는 사람은 간호사가 아니다'도 반드시 참이다. '보수 교육을 받는 사람은 모두 간호사이다'는 역이어서 반드시 참이 아니다. 면허가 없는 사람이 보수 교육을 받는지는 주어진 진술로 알 수 없으므로, 면허가 없는 보건소 직원이 보수 교육을 받지 않는다고도 단정할 수 없다."},
{"id":"k59","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n성실한 사람은 모두 책임감이 강하다. 책임감이 강한 사람 중에 신뢰를 얻지 못하는 사람은 없다. 따라서 __어떤 신입 사원은 신뢰를 얻는다__.","opts":["어떤 신입 사원은 성실하다.","어떤 신입 사원은 성실하지 않다.","신뢰를 얻는 사람은 모두 책임감이 강하다.","책임감이 강하지 않은 사람은 모두 신입 사원이다."],"ans":0,"exp":"두 전제를 이으면 '성실한 사람은 모두 신뢰를 얻는다'가 된다. 성실한 신입 사원이 한 명이라도 있으면 그 사람은 신뢰를 얻는 신입 사원이므로 '어떤 신입 사원은 성실하다'를 추가해야 한다. 성실하지 않은 신입 사원이 있다는 것으로는 그 사람이 신뢰를 얻는지 알 수 없고, '신뢰를 얻는 사람은 모두 책임감이 강하다'는 둘째 전제를 거꾸로 읽은 것이다. 책임감이 강하지 않은 사람이 모두 신입 사원이라는 것도 신뢰를 얻는 신입 사원이 있음을 보장하지 못한다."},
{"id":"k62","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 약화하는 것으로 가장 적절한 것은?\n\n청소년의 수면 부족은 낮 동안의 집중력과 정서 조절을 떨어뜨리는 문제로 꼽힌다. 그 원인으로 흔히 학업 부담이 거론되지만, 필자가 보기에 더 직접적인 원인은 스마트폰 사용이다. 어느 도시의 중고등학생을 대상으로 한 가상의 설문 조사를 생각해 보자. 조사 결과 하루 스마트폰 사용 시간이 긴 학생일수록 평균 수면 시간이 짧았다고 하자. 사용 시간이 가장 긴 집단은 가장 짧은 집단보다 한 시간 넘게 덜 잤고, 이 경향은 학년과 성별을 나누어 보아도 달라지지 않았다. 이러한 결과는 스마트폰 사용이 수면 시간을 줄인다는 것을 보여 준다. 수면 시간이 줄어든 학생은 다음 날 수업에 집중하지 못하고, 그렇게 밀린 공부는 다시 잠을 줄이는 악순환으로 이어진다. 스마트폰은 손만 뻗으면 닿는 곳에 있고, 한번 화면을 켜면 영상과 대화가 끝없이 이어져 잠자리에 드는 시각을 늦춘다. 잠들기 직전까지 이어지는 자극은 몸이 쉴 준비를 하는 것도 방해한다. 그러므로 청소년의 수면 부족을 해결하려면 무엇보다 스마트폰 사용 시간을 줄여야 한다. 밤 시간대의 사용을 제한하는 규칙을 가정에서 만들고 학교에서도 이를 교육한다면 청소년의 수면 시간은 늘어날 것이다.","opts":["다른 도시의 학생들을 조사했을 때에도 스마트폰 사용 시간이 긴 학생일수록 평균 수면 시간이 짧았다.","밤 시간대의 스마트폰 사용을 제한한 가정의 학생들은 제한하기 전보다 잠자리에 드는 시각이 빨라졌다.","스마트폰 사용 시간이 긴 학생들은 대부분 원래 잠이 오지 않아 누워서 뒤척이는 시간에 스마트폰을 켠 것이었다.","스마트폰 사용 시간이 긴 학생들은 사용 시간이 짧은 학생들보다 잠들기 직전까지 화면을 보는 비율이 높았다."],"ans":2,"exp":"글은 스마트폰 사용 시간이 길수록 수면 시간이 짧다는 조사 결과를 근거로 스마트폰 사용이 수면 부족의 원인이라고 주장한다. 잠이 오지 않아서 그 시간에 스마트폰을 켠 것이라면 원인과 결과의 방향이 반대이므로 이 논지가 약화된다. 다른 도시에서도 같은 결과가 나왔다는 것, 사용을 제한하자 잠자리에 드는 시각이 빨라졌다는 것, 잠들기 직전까지 화면을 보는 비율이 높았다는 것은 모두 스마트폰 사용이 수면을 줄인다는 주장을 뒷받침한다."},
{"id":"k64","subj":"국어","unit":"논리","q":"다음 글의 밑줄 친 결론을 이끌어 내기 위해 추가해야 할 것은?\n\n구청 앞 식당은 값이 싸거나 양이 푸짐하다. 값이 싼 식당은 모두 손님이 많고, 양이 푸짐한 식당도 모두 손님이 많다. 따라서 __구청 앞 식당은 음식이 맛있다__.","opts":["음식이 맛있는 식당은 모두 손님이 많다.","손님이 많은 식당은 모두 음식이 맛있다.","값이 싸고 양이 푸짐한 식당은 모두 음식이 맛있다.","손님이 많지 않은 식당은 모두 음식이 맛있지 않다."],"ans":1,"exp":"구청 앞 식당은 값이 싸거나 양이 푸짐한데, 어느 쪽이든 손님이 많으므로 구청 앞 식당은 손님이 많다. 여기에서 '음식이 맛있다'를 이끌어 내려면 '손님이 많은 식당은 모두 음식이 맛있다'가 있어야 한다. '음식이 맛있는 식당은 모두 손님이 많다'는 그 역이고 '손님이 많지 않은 식당은 모두 음식이 맛있지 않다'는 그 역의 대우여서 결론을 보장하지 못한다. 값이 싸고 양도 푸짐한 식당이 모두 맛있다는 전제는 구청 앞 식당이 둘 가운데 하나에만 해당하는 경우를 막지 못한다."},
{"id":"k184","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 점검표에는 “우리 과의 모든 직원이 개인 정보 보호 교육을 받았다.”라고 적혀 있네요.\n을: 이수 명단과 대조해 보았는데, 그 문장은 거짓입니다.\n갑: 그러면 우리 과에는 교육을 받은 직원이 한 명도 없다는 말인가요?\n을: 그렇게까지 말할 수는 없습니다. 그 문장이 거짓일 때 반드시 참이라고 할 수 있는 것은 “______.”입니다.","opts":["교육을 받은 직원은 한 명도 없다","교육을 받지 않은 직원이 적어도 한 명 있다","교육을 받은 직원이 적어도 한 명 있다","교육을 받지 않은 직원이 절반을 넘는다"],"ans":1,"exp":"'모든 직원이 교육을 받았다'의 부정은 '교육을 받지 않은 직원이 적어도 한 명 있다'이다. 따라서 그 문장이 거짓일 때 반드시 참인 것은 이것뿐이다. 아무도 받지 않았는지, 받은 직원이 있는지, 받지 않은 직원이 절반을 넘는지는 그 문장이 거짓이라는 사실만으로는 알 수 없다."},
{"id":"k187","subj":"국어","unit":"강화 약화","q":"다음 글의 논지를 강화하는 것으로 가장 적절한 것은?\n\n밤 근무는 몸이 쉬도록 맞추어진 시간에 깨어 일하는 것이어서, 근무자는 새벽으로 갈수록 졸음과 싸워야 한다. 병원의 야간 근무도 예외가 아니다. 환자의 상태를 살피고 정해진 시각에 약을 주는 일은 밤에도 낮과 똑같은 정확성을 요구한다. 야간 병동에서 일어나는 투약 실수를 두고 흔히 개인의 부주의나 숙련도 부족을 탓하지만, 이런 진단으로는 문제를 풀기 어렵다. 숙련된 간호사도 새벽 시간대에는 실수를 하기 때문이다. 야간 투약 실수의 주된 원인은 졸음이다. 졸음은 주의력을 떨어뜨려 약의 이름과 용량을 확인하는 단계를 건너뛰게 하고, 평소라면 곧바로 알아차렸을 이상한 점도 지나치게 만든다. 그렇다면 해법은 근무자를 다그치는 것이 아니라 졸음 자체를 줄이는 데에서 찾아야 한다. 야간 근무 중에 20분가량 눈을 붙일 시간을 공식적으로 보장하자는 제안이 그것이다. 짧은 잠은 떨어진 주의력을 회복시키므로, 눈을 붙일 시간을 보장하면 야간 투약 실수는 줄어들 것이다. 근무 중의 짧은 잠을 태만으로 보는 시각을 버리고, 교대로 쉴 수 있도록 인력과 공간을 마련하는 것이 환자 안전을 위한 길이다.","opts":["낮 근무를 하는 간호사도 업무가 몰리는 시간대에는 투약 실수를 하는 일이 있다.","야간 투약 실수는 졸음이 심할 때보다 한 사람이 맡은 환자 수가 많을 때 더 자주 일어난다.","20분가량 자고 일어난 직후에는 한동안 머리가 멍해져 평소보다 판단이 느려지는 사람이 많다.","야간 근무 중 눈을 붙일 시간을 준 병동에서 인력과 환자 수가 그대로인데도 야간 투약 실수가 줄었다."],"ans":3,"exp":"글의 논지는 야간 투약 실수의 주된 원인이 졸음이므로 눈을 붙일 시간을 보장하면 실수가 줄어든다는 것이다. 다른 조건이 같은데 눈을 붙일 시간을 준 병동에서 실제로 실수가 줄었다는 사실은 이 논지를 직접 뒷받침한다. 실수가 졸음보다 맡은 환자 수에 좌우된다는 것과 자고 난 직후에 판단이 느려진다는 것은 논지를 약화하고, 낮 근무자의 실수는 야간 근무의 졸음에 관한 이 논증과 관련이 없다."},
{"id":"k188","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n○ 갑이 정책 조정 회의에 참석하면 을도 참석한다.\n○ 을이 참석하면 병은 참석하지 않거나 정이 참석한다.\n○ 병은 참석하고 정은 참석하지 않는다.","opts":["갑과 을은 모두 참석한다.","갑은 참석하고 을은 참석하지 않는다.","갑과 을은 모두 참석하지 않는다.","갑은 참석하지 않고 을은 참석한다."],"ans":2,"exp":"셋째 진술에 따라 병은 참석하고 정은 참석하지 않으므로 '병은 참석하지 않거나 정이 참석한다'는 거짓이다. 그러면 둘째 진술의 대우에 따라 을은 참석하지 않고, 첫째 진술의 대우(을이 참석하지 않으면 갑도 참석하지 않는다)에 따라 갑도 참석하지 않는다. 따라서 갑과 을은 모두 참석하지 않으며, 둘 중 누구라도 참석한다는 진술은 거짓이다."},
{"id":"k189","subj":"국어","unit":"논리","q":"다음 대화의 빈칸에 들어갈 말로 가장 적절한 것은?\n\n갑: 공용 차량 운영 규정에 “운전면허가 있는 직원만 공용 차량을 빌릴 수 있다.”라고 되어 있네.\n을: 그러면 운전면허가 있는 직원은 누구나 공용 차량을 빌릴 수 있다는 뜻이구나.\n갑: 그렇지는 않아. 운전면허 말고 다른 요건이 더 있을 수도 있으니까. 그 규정에서 반드시 따라 나오는 것은 “______.”야.","opts":["운전면허가 있는 직원은 누구나 공용 차량을 빌릴 수 있다","공용 차량을 빌릴 수 있는 직원은 모두 운전면허가 있다","공용 차량을 빌릴 수 없는 직원은 모두 운전면허가 없다","운전면허가 없어도 공용 차량을 빌릴 수 있는 경우가 있다"],"ans":1,"exp":"'A인 사람만 B할 수 있다'는 'B할 수 있는 사람은 모두 A이다'와 같은 뜻이다. 따라서 공용 차량을 빌릴 수 있는 직원은 모두 운전면허가 있다. 운전면허는 필요한 조건일 뿐이어서 면허가 있다고 누구나 빌릴 수 있는 것은 아니고, 빌릴 수 없는 직원 가운데에도 면허가 있는 직원이 있을 수 있다. 면허 없이 빌릴 수 있는 경우가 있다는 것은 규정과 어긋난다."},
{"id":"k201","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 의미가 중복되는 표현을 쓰지 말 것.\n○ 주어와 서술어가 호응하도록 할 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n○ 불필요한 사동 표현을 쓰지 말 것.\n\n\u003c공문서>\n△△군보건소\n수신 관내 경로당 및 노인복지시설의 장\n제목 2026년 어르신 독감 예방접종 안내\n1. 우리 보건소는 10월 한 달간 관내 65세 이상 어르신 ㉠ __약 3천여 명에게__ 독감 예방접종을 무료로 실시합니다.\n2. 이번 접종의 목적은 ㉡ __어르신의 중증 질환을 예방하고 지역 사회의 감염 확산을 막고자 합니다__.\n3. 접종 당일에 어르신께서는 ㉢ __신분증 지참과 예진표를 작성하셔야__ 합니다.\n4. 각 시설에서는 종사자에게 접종 후 주의 사항을 ㉣ __미리 교육시켜__ 주시기 바랍니다.","opts":["㉠: 3천여 명에게","㉡: 어르신의 중증 질환을 예방하고 지역 사회의 감염 확산을 막는 것입니다","㉢: 신분증 지참 및 예진표를 작성하셔야","㉣: 미리 교육해"],"ans":2,"exp":"㉢은 '와/과'로 이어진 앞뒤의 구조가 달라서 고쳐야 하는데, '신분증 지참 및 예진표를 작성하셔야'는 '과'를 '및'으로 바꾸었을 뿐 명사구와 절이 이어진 구조가 그대로이다. '신분증을 지참하고 예진표를 작성하셔야'로 고쳐야 한다. ㉠은 뜻이 겹치는 '약'과 '-여' 가운데 하나를 뺐고, ㉡은 주어 '목적은'에 맞게 서술어를 '막는 것입니다'로 바꾸었으며, ㉣은 시설이 직접 교육하는 것이므로 불필요한 사동 '교육시켜'를 '교육해'로 바로잡았다."},
{"id":"k202","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 명사의 반복된 나열을 피하고 적절한 조사나 어미를 사용할 것.\n○ 어려운 한자어는 쉬운 말로 다듬어 쓸 것.\n○ 올바른 피동 표현을 사용할 것.\n○ 의미가 중복되는 표현을 쓰지 말 것.\n\n\u003c공문서>\n◇◇구청\n수신 각 동 주민자치회장\n제목 2027년 주민참여예산 제안 사업 공모 안내\n1. 우리 구는 ㉠ __주민 생활 불편 해소 사업 제안을__ 받고자 합니다.\n2. 제안서는 ㉡ __금년 11월 30일까지__ 구청 누리집으로 제출하시기 바랍니다.\n3. 접수된 제안은 주민참여예산위원회의 심사를 거치며, 심사 결과는 ㉢ __12월 중에 공개되어질 예정입니다__.\n4. 선정된 사업은 내년도 예산에 ㉣ __미리 사전 반영하여__ 추진합니다.","opts":["㉠: 주민 생활 불편 해소 관련 사업 제안을","㉡: 올해 11월 30일까지","㉢: 12월 중에 공개될 예정입니다","㉣: 미리 반영하여"],"ans":0,"exp":"㉠은 명사 여섯 개가 조사 없이 이어져 있으므로 '주민의 생활 불편을 해소하기 위한 사업 제안을'처럼 조사와 어미를 넣어 풀어야 한다. '주민 생활 불편 해소 관련 사업 제안을'은 명사를 하나 더 보탰을 뿐 나열이 그대로이다. ㉡은 한자어 '금년'을 '올해'로 다듬었고, ㉢은 '-되다'에 '-어지다'가 겹친 이중 피동을 바로잡았으며, ㉣은 뜻이 겹치는 '미리'와 '사전' 가운데 하나를 뺐다."},
{"id":"k203","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 가장 적절한 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 주어와 서술어가 호응하도록 할 것.\n○ 조사를 정확하게 사용할 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n○ 외래어나 외국어는 쉬운 우리말로 다듬어 쓸 것.\n\n\u003c공문서>\n□□교육지원청\n수신 관내 초·중학교장\n제목 2026년 하반기 학교 안전 담당자 연수 안내\n1. 이번 연수의 ㉠ __특징은 실제 사고 사례를 중심으로 진행합니다__.\n2. 연수 신청서는 10월 16일까지 ㉡ __우리 교육지원청에게 공문으로__ 제출해 주십시오.\n3. 연수는 ㉢ __응급 처치를 실습하고 대피 훈련 계획 수립__ 순으로 진행합니다.\n4. 연수 자료는 ㉣ __학교 안전 매뉴얼__과 함께 당일에 나누어 드립니다.","opts":["㉠: 특징은 실제 사고 사례를 중심으로 진행하겠습니다","㉡: 우리 교육지원청에 공문으로","㉢: 응급 처치 실습과 대피 훈련 계획을 수립하는","㉣: 학교 안전 가이드북"],"ans":1,"exp":"'에게'는 사람이나 동물에 쓰는 조사이고 기관이나 단체에는 '에'를 쓰므로 ㉡을 '우리 교육지원청에 공문으로'로 고친 것이 적절하다. ㉠은 주어 '특징은'에 맞게 '진행한다는 점입니다'로 고쳐야 하는데 '진행하겠습니다'는 여전히 호응하지 않는다. ㉢은 '응급 처치 실습과 대피 훈련 계획 수립'처럼 앞뒤를 같은 구조로 맞추어야 하는데 명사구와 절이 이어져 있다. ㉣은 '매뉴얼'을 또 다른 외래어 '가이드북'으로 바꾸었을 뿐이어서 '지침서'나 '안내서'로 다듬어야 한다."},
{"id":"k204","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 여러 뜻으로 해석되지 않도록 수식 관계를 분명히 할 것.\n○ 의미가 중복되는 표현을 쓰지 말 것.\n○ 올바른 피동 표현을 사용할 것.\n○ 주어와 서술어가 호응하도록 할 것.\n\n\u003c공문서>\n○○소방서\n수신 관내 공동주택 관리사무소장\n제목 겨울철 화재 예방 안전 교육 실시 안내\n1. 우리 소방서는 ㉠ __노후한 공동주택의 소화 설비__를 점검하고 입주민 안전 교육을 실시합니다.\n2. 교육은 12월 한 달간 ㉡ __매주 수요일마다__ 단지 안 회의실에서 진행합니다.\n3. 겨울철 주택 화재는 대부분 ㉢ __전기 기기의 과열 때문인 것으로 보여집니다__.\n4. 이번 교육의 주요 내용은 ㉣ __소화기 사용법과 대피 요령을 실습합니다__.","opts":["㉠: 공동주택의 노후한 소화 설비","㉡: 매주 수요일에","㉢: 전기 기기의 과열 때문인 것으로 보입니다","㉣: 소화기 사용법과 대피 요령을 실습하게 됩니다"],"ans":3,"exp":"㉣은 주어 '주요 내용은'과 서술어 '실습합니다'가 호응하지 않는 문장이다. '실습하게 됩니다'로 바꾸어도 서술어가 여전히 동작을 나타내므로 호응하지 않는다. '소화기 사용법과 대피 요령의 실습입니다'처럼 고쳐야 한다. ㉠은 '노후한'이 공동주택과 소화 설비 가운데 무엇을 꾸미는지 분명하게 했고, ㉡은 뜻이 겹치는 '매-'와 '마다' 가운데 하나를 뺐으며, ㉢은 '보이다'에 '-어지다'가 겹친 이중 피동을 바로잡았다."},
{"id":"k205","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 어려운 한자어는 쉬운 말로 다듬어 쓸 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n○ 명사의 반복된 나열을 피하고 적절한 조사나 어미를 사용할 것.\n○ 의미가 중복되는 표현을 쓰지 말 것.\n\n\u003c공문서>\n□□시 상수도사업소\n수신 ○○동 주민 여러분\n제목 낡은 상수도관 교체 공사에 따른 단수 안내\n1. 상수도관 교체 공사로 11월 18일 09시부터 ㉠ __익일 06시까지__ 수돗물 공급이 중단됩니다.\n2. 단수 시간에는 ㉡ __수도꼭지 잠금과 보일러 가동을 중지해__ 주시기 바랍니다.\n3. 공사가 끝나면 우리 사업소가 ㉢ __수돗물 수질 안전 확인 검사__를 실시합니다.\n4. 수돗물이 다시 나오면 ㉣ __먼저 물을 2~3분간 미리 흘려보낸 뒤에__ 사용하시기 바랍니다.","opts":["㉠: 당일 06시까지","㉡: 수도꼭지를 잠그고 보일러 가동을 중지해","㉢: 수돗물의 수질이 안전한지 확인하는 검사","㉣: 먼저 물을 2~3분간 흘려보낸 뒤에"],"ans":0,"exp":"'익일'은 '다음 날'을 뜻하는 한자어이므로 ㉠은 '다음 날 06시까지'로 다듬어야 한다. '당일 06시까지'로 바꾸면 뜻이 달라져 단수가 끝나는 때가 시작하는 때보다 앞서게 된다. ㉡은 '과'로 이어진 앞뒤를 같은 구조의 절로 맞추었고, ㉢은 명사의 나열을 조사와 어미로 풀었으며, ㉣은 뜻이 겹치는 '먼저'와 '미리' 가운데 하나를 뺐다."},
{"id":"k206","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 가장 적절한 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 번역 투 표현을 피하고 우리말다운 표현을 쓸 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n○ 불필요한 사동 표현을 쓰지 말 것.\n○ 의미가 중복되는 표현을 쓰지 말 것.\n\n\u003c공문서>\n△△시청\n수신 관내 문화예술 단체장\n제목 2027년 지역 예술인 창작 활동 지원 사업 공모\n1. 우리 시는 ㉠ __지역 문화의 발전에 있어서__ 예술인의 역할이 크다고 보고 창작 활동을 지원합니다.\n2. 지원 대상은 내년에 ㉡ __공연 기획이나 전시를 개최하는__ 단체입니다.\n3. 선정된 단체는 ㉢ __지원금 집행 내역을 시민에게 공개시켜야__ 합니다.\n4. 신청 서류는 ㉣ __접수 기간 동안에__ 방문 또는 우편으로 제출하시기 바랍니다.","opts":["㉠: 지역 문화의 발전을 함에 있어","㉡: 공연의 기획이나 전시를 개최하려는","㉢: 지원금 집행 내역을 시민에게 공개해야","㉣: 정해진 접수 기간 동안에"],"ans":2,"exp":"내역을 공개하는 주체가 선정된 단체 자신이므로 ㉢의 '공개시켜야'는 불필요한 사동 표현이고, '공개해야'로 고친 것이 적절하다. ㉠은 번역 투 '~에 있어서'가 '~함에 있어'로 남아 있어 '지역 문화의 발전에'로 고쳐야 한다. ㉡은 '공연을 기획하거나 전시를 개최하는'처럼 구조를 맞추어야 하는데 여전히 명사구와 절이 이어져 있다. ㉣은 뜻이 겹치는 '기간'과 '동안'이 그대로이므로 '접수 기간에'로 고쳐야 한다."},
{"id":"k207","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 어려운 한자어는 쉬운 말로 다듬어 쓸 것.\n○ 목적어와 서술어가 호응하도록 할 것.\n○ 올바른 피동 표현을 사용할 것.\n○ 조사를 정확하게 사용할 것.\n\n\u003c공문서>\n○○군청\n수신 군민 여러분\n제목 지방세 전자 고지 신청 안내\n1. 우리 군은 ㉠ __관련 조례에 의거하여__ 지방세 고지서를 전자 우편이나 휴대 전화로 보내 드리고 있으니, 받으려는 분은 12월 20일까지 신청하시기 바랍니다.\n2. 우리 군은 전자 고지를 확대하여 ㉡ __종이 사용량과 납세 편의를 높이고자__ 합니다.\n3. 신청 결과는 접수한 날부터 3일 안에 ㉢ __문자 메시지로 통보되어집니다__.\n4. 궁금한 사항은 ㉣ __군청 세무과에게 문의하시기__ 바랍니다.","opts":["㉠: 관련 조례에 따라","㉡: 종이 사용량 및 납세 편의를 높이고자","㉢: 문자 메시지로 통보됩니다","㉣: 군청 세무과에 문의하시기"],"ans":1,"exp":"㉡은 목적어 '종이 사용량'이 서술어 '높이고자'와 호응하지 않는다. 전자 고지를 확대하면 종이 사용량은 줄어드는 것이므로 '종이 사용량을 줄이고 납세 편의를 높이고자'로 고쳐야 하는데, '과'를 '및'으로 바꾼 것만으로는 '종이 사용량을 높이다'라는 어색한 호응이 그대로 남는다. ㉠은 한자어 '의거하여'를 쉬운 말 '따라'로 다듬었고, ㉢은 '-되다'에 '-어지다'가 겹친 이중 피동을 바로잡았으며, ㉣은 기관에 쓰는 조사 '에'로 고쳤다."},
{"id":"k208","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 가장 적절한 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 명사의 반복된 나열을 피하고 적절한 조사나 어미를 사용할 것.\n○ 외래어나 외국어는 쉬운 우리말로 다듬어 쓸 것.\n○ 불필요한 사동 표현을 쓰지 말 것.\n○ 여러 뜻으로 해석되지 않도록 수식 관계를 분명히 할 것.\n\n\u003c공문서>\n◇◇시청\n수신 관내 공동주택 관리사무소장\n제목 투명 페트병 분리배출 시범 사업 안내\n1. 우리 시는 ㉠ __시범 사업 참여 단지 주민 편의 지원을__ 위해 전용 수거함을 무상으로 설치합니다.\n2. 각 단지에서는 ㉡ __분리배출 가이드라인__을 게시판에 붙여 주시기 바랍니다.\n3. 수거 업체는 모은 페트병을 ㉢ __선별장에서 종류별로 분류시킨 뒤__ 재활용 공장으로 보냅니다.\n4. 우리 시는 연말에 ㉣ __우수한 단지의 관리 직원__을 표창할 예정입니다.","opts":["㉠: 시범 사업에 참여하는 단지의 주민 편의를 지원하기","㉡: 분리배출 매뉴얼","㉢: 선별장에서 종류별로 분류시키고 나서","㉣: 우수한 단지 관리 직원"],"ans":0,"exp":"㉠은 명사 일곱 개가 조사 없이 이어져 있는데, '시범 사업에 참여하는 단지의 주민 편의를 지원하기'는 조사와 어미를 넣어 관계를 분명하게 풀었으므로 적절하다. ㉡은 '가이드라인'을 또 다른 외래어 '매뉴얼'로 바꾸었을 뿐이어서 '지침'으로 다듬어야 한다. ㉢은 수거 업체가 직접 분류하는 것이므로 '종류별로 분류한 뒤'로 고쳐야 하는데 사동 표현이 그대로이다. ㉣은 '우수한'이 단지를 꾸미는지 직원을 꾸미는지 여전히 분명하지 않아 '단지의 우수한 관리 직원'처럼 고쳐야 한다."},
{"id":"k209","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 올바른 피동 표현을 사용할 것.\n○ 높임 표현을 알맞게 사용할 것.\n○ 의미가 중복되는 표현을 쓰지 말 것.\n○ 대등한 것끼리 연결할 때는 구조가 같은 표현을 사용할 것.\n\n\u003c공문서>\n○○시 평생학습관\n수신 시민 여러분\n제목 2027년 상반기 시민 강좌 수강생 모집\n1. 이번 학기 강좌는 시민 설문 조사 결과를 반영하여 ㉠ __모두 12개 과정으로 짜여졌습니다__.\n2. 강좌 일정에 관하여 ㉡ __궁금한 점이 계시면__ 학습관 누리집의 묻고 답하기를 이용하시기 바랍니다.\n3. 수강 인원이 적은 강좌는 ㉢ __조기에 일찍 마감될__ 수 있으니 서둘러 신청하시기 바랍니다.\n4. 수강생은 ㉣ __강의 계획 확인과 준비물을 지참하여__ 첫 수업에 참석하시기 바랍니다.","opts":["㉠: 모두 12개 과정으로 짜였습니다","㉡: 궁금한 점이 있으시면","㉢: 빨리 조기 마감될","㉣: 강의 계획을 확인하고 준비물을 지참하여"],"ans":2,"exp":"㉢은 '조기'와 '일찍'의 뜻이 겹치므로 '일찍 마감될'이나 '조기에 마감될'로 고쳐야 한다. '빨리 조기 마감될'은 '일찍'을 '빨리'로 바꾸었을 뿐 뜻이 겹치는 것은 그대로이다. ㉠은 피동사 '짜이다'에 '-어지다'가 겹친 이중 피동을 바로잡았고, ㉡은 높일 대상이 아닌 '궁금한 점'에 쓴 '계시다'를 '있으시다'로 고쳤으며, ㉣은 '과'로 이어진 앞뒤를 같은 구조의 절로 맞추었다."},
{"id":"k210","subj":"국어","unit":"공공언어","q":"\u003c공공언어 바로 쓰기 원칙>에 따라 \u003c공문서>의 ㉠ ～ ㉣을 수정한 것으로 적절하지 않은 것은?\n\n\u003c공공언어 바로 쓰기 원칙>\n○ 번역 투 표현을 피하고 우리말다운 표현을 쓸 것.\n○ 주어와 서술어가 호응하도록 할 것.\n○ 어려운 한자어는 쉬운 말로 다듬어 쓸 것.\n○ 여러 뜻으로 해석되지 않도록 표현할 것.\n\n\u003c공문서>\n△△군 농업기술센터\n수신 관내 과수 재배 농가\n제목 봄철 과수 저온 피해 예방 교육 안내\n1. ㉠ __과수 재배에 있어서__ 가장 큰 위험인 봄철 저온 피해를 줄이고자 우리 센터는 4월 2일에 예방 교육을 엽니다.\n2. 이번 교육의 목표는 ㉡ __농가가 피해 예방 장비를 스스로 점검합니다__.\n3. 교육 자료는 ㉢ __별첨과 같이__ 미리 보내 드리니 참고하시기 바랍니다.\n4. 교육이 끝난 뒤 센터장은 ㉣ __직원들과 농가를 방문하여__ 과수원의 상태를 살필 예정입니다.","opts":["㉠: 과수 재배에서","㉡: 농가가 피해 예방 장비를 스스로 점검하게 하는 것입니다","㉢: 붙임과 같이","㉣: 직원들과 농가를 직접 방문하여"],"ans":3,"exp":"㉣은 센터장이 직원들과 함께 농가를 방문한다는 뜻으로도, 센터장이 직원들과 농가를 모두 방문한다는 뜻으로도 읽힌다. '직접'을 넣어도 두 가지 해석이 그대로 남으므로 '직원들과 함께 농가를 방문하여'처럼 고쳐야 한다. ㉠은 번역 투 표현 '~에 있어서'를 '~에서'로 고쳤고, ㉡은 주어 '목표는'에 맞게 서술어를 '~하는 것입니다'로 바꾸었으며, ㉢은 한자어 '별첨'을 '붙임'으로 다듬었다."},
{"id":"k211","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 중심 소재의 개념을 밝힌 뒤 문제를 제기할 것.\n○ 본론은 원인과 해결 방안을 각각 하나의 장으로 구성하되, 2장의 하위 항목이 3장의 하위 항목과 순서대로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 중장년 1인 가구의 사회적 고립 원인과 해결 방안\n1장 서론\n1. 사회적 고립의 개념\n2. (가) ______\n2장 중장년 1인 가구의 사회적 고립 원인\n1. 실직과 은퇴에 따른 사회적 관계망의 축소\n2. (나) ______\n3장 중장년 1인 가구의 사회적 고립 해결 방안\n1. (다) ______\n2. 고립 위험 가구를 찾아내는 지역 단위 발굴 체계 구축\n4장 결론\n1. (라) ______\n2. 지원 대상을 넓히기 위한 관련 조례 정비","opts":["(가): 중장년 1인 가구의 사회적 고립 증가에 대한 문제 제기","(나): 청년 1인 가구의 주거비 부담 증가","(다): 재취업 지원과 지역 모임 연계를 통한 관계망 회복","(라): 중장년 1인 가구의 사회적 고립 완화와 삶의 질 향상"],"ans":1,"exp":"\u003c지침>에 따르면 2장의 하위 항목은 3장의 하위 항목과 순서대로 대응해야 하므로, (나)에는 3장 2의 '고립 위험 가구 발굴 체계 구축'에 대응하는 원인, 예컨대 '고립 위험 가구를 일찍 찾아낼 체계의 미비'가 와야 한다. '청년 1인 가구의 주거비 부담 증가'는 대상이 중장년이 아니고 발굴 체계와도 대응하지 않는다. (가)는 서론의 문제 제기, (다)는 2장 1의 관계망 축소에 대응하는 해결 방안, (라)는 결론의 기대 효과에 해당하여 적절하다."},
{"id":"k212","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 보고서 작성의 배경과 목적을 포함할 것.\n○ 본론은 제목에서 밝힌 내용을 2개의 장으로 구성하되, 2장의 하위 항목이 3장의 하위 항목과 순서대로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 농어촌 지역의 응급 의료 공백 실태와 개선 방안\n1장 서론\n1. (가) ______\n2. 농어촌 응급 의료 공백의 실태 파악과 개선 방안 제시\n2장 농어촌 지역의 응급 의료 공백 실태\n1. 응급 의료 기관까지의 긴 이송 시간\n2. (나) ______\n3장 농어촌 지역의 응급 의료 공백 개선 방안\n1. (다) ______\n2. 야간·휴일 응급 진료 인력의 확충\n4장 결론\n1. 농어촌 주민의 응급 의료 접근성 향상\n2. (라) ______","opts":["(가): 농어촌 응급 환자의 치료 지연에 대한 사회적 우려","(나): 야간과 휴일에 응급 진료를 맡을 인력의 부족","(다): 이송 시간을 줄이기 위한 응급 환자 이송 체계 개편","(라): 농어촌 지역 응급 환자의 이송 시간 조사 결과"],"ans":3,"exp":"\u003c지침>에 따르면 결론은 기대 효과와 향후 과제를 순서대로 제시해야 한다. 4장의 1이 기대 효과이므로 (라)에는 향후 과제가 와야 하는데, '응급 환자의 이송 시간 조사 결과'는 2장에서 다룰 실태에 해당한다. (가)는 서론의 배경, (나)는 3장 2의 '인력 확충'에 대응하는 실태, (다)는 2장 1의 '긴 이송 시간'에 대응하는 개선 방안이어서 적절하다."},
{"id":"k213","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 현황을 제시한 뒤 보고서의 목적을 밝힐 것.\n○ 본론은 2개의 장으로 구성하고, 하위 항목은 각 장의 제목에 맞추어 통일성 있게 구성할 것.\n○ 결론은 본론을 요약한 뒤 향후 과제를 제시할 것.\n\n\u003c개요>\n○ 제목: 전통 시장 활성화를 위한 시설 개선과 운영 지원 방안\n1장 서론\n1. (가) ______\n2. 전통 시장 활성화를 위한 지원 방안 모색\n2장 전통 시장의 시설 개선 방안\n1. 비와 햇빛을 막는 통로 지붕 설치\n2. (나) ______\n3장 전통 시장의 운영 지원 방안\n1. (다) ______\n2. 상인을 대상으로 한 온라인 판매 교육 실시\n4장 결론\n1. 시설 개선과 운영 지원을 아우르는 활성화 방안 요약\n2. (라) ______","opts":["(가): 전통 시장 지원 사업이 가져올 지역 경제 활성화 효과","(나): 고객 주차장과 공동 화장실 정비","(다): 시장 공동 배송 서비스의 운영비 지원","(라): 지원 사업을 이어 가기 위한 재원 확보 방안 마련"],"ans":0,"exp":"\u003c지침>에 따르면 서론은 현황을 제시한 뒤 목적을 밝혀야 한다. 1장의 2가 목적이므로 (가)에는 '전통 시장 이용객 감소 현황'과 같은 현황이 와야 하는데, '지원 사업이 가져올 지역 경제 활성화 효과'는 현황이 아니라 기대 효과이다. (나)는 2장의 시설 개선, (다)는 3장의 운영 지원에 맞고, (라)는 결론의 향후 과제에 해당하여 적절하다."},
{"id":"k214","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 핵심 개념과 논의의 필요성을 제시할 것.\n○ 본론은 문제점과 개선 방안을 각각 하나의 장으로 구성하고, 문제점과 개선 방안이 항목별로 순서대로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 공공 데이터 개방의 문제점과 개선 방안\n1장 서론\n1. 공공 데이터의 개념\n2. (가) ______\n2장 공공 데이터 개방의 문제점\n1. (나) ______\n2. 기관마다 다른 자료 형식으로 인한 활용의 어려움\n3장 공공 데이터 개방의 개선 방안\n1. 수요 조사에 바탕을 둔 개방 대상 자료 선정\n2. (다) ______\n4장 결론\n1. (라) ______\n2. 개방한 데이터의 품질을 점검하는 평가 제도 도입","opts":["(가): 공공 데이터 개방을 확대하기 위한 논의의 필요성","(나): 국민의 수요를 반영하지 못한 개방 자료 선정","(다): 공공 데이터 담당 공무원의 근무 여건 개선","(라): 공공 데이터를 활용한 민간 서비스 개발의 활성화"],"ans":2,"exp":"\u003c지침>에 따르면 문제점과 개선 방안은 항목별로 대응해야 한다. (다)는 2장 2의 '기관마다 다른 자료 형식'에 대응해야 하므로 '기관 간 자료 형식의 표준화'와 같은 내용이 와야 하는데, '담당 공무원의 근무 여건 개선'은 자료 형식의 문제와 관계가 없다. (가)는 서론의 필요성, (나)는 3장 1의 '수요 조사에 바탕을 둔 선정'에 대응하는 문제점, (라)는 결론의 기대 효과여서 적절하다."},
{"id":"k215","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 실태를 제시하고 문제를 제기할 것.\n○ 본론의 2장은 원인을 개인 차원과 사회 차원으로 나누어 다루고, 3장은 2장의 각 원인에 대응하는 해결 방안을 제시할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 청소년 스마트폰 과의존의 원인과 해결 방안\n1장 서론\n1. 청소년 스마트폰 과의존 실태\n2. (가) ______\n2장 청소년 스마트폰 과의존의 원인\n1. 개인 차원: (나) ______\n2. 사회 차원: 청소년이 즐길 여가 시설과 프로그램의 부족\n3장 청소년 스마트폰 과의존의 해결 방안\n1. 개인 차원: 사용 시간을 스스로 점검하는 자기 조절 훈련 실시\n2. 사회 차원: (다) ______\n4장 결론\n1. (라) ______\n2. 해결 방안의 효과를 확인하기 위한 장기 추적 조사 실시","opts":["(가): 스마트폰 과의존이 청소년의 학습과 건강에 미치는 악영향","(나): 청소년 여가 프로그램의 지역 간 격차","(다): 지역 청소년 시설 확충과 체험 프로그램 운영","(라): 청소년의 건강한 스마트폰 사용 습관 형성"],"ans":1,"exp":"\u003c지침>에 따르면 2장의 1은 개인 차원의 원인이어야 하고 3장 1의 '자기 조절 훈련'과 대응해야 하므로, (나)에는 '사용 시간을 스스로 조절하는 능력의 부족'과 같은 내용이 와야 한다. '여가 프로그램의 지역 간 격차'는 사회 차원의 원인이어서 맞지 않는다. (가)는 서론의 문제 제기, (다)는 2장 2의 '여가 시설과 프로그램 부족'에 대응하는 해결 방안, (라)는 결론의 기대 효과여서 적절하다."},
{"id":"k216","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 가장 적절한 것은?\n\n\u003c지침>\n○ 서론은 정책의 추진 배경과 보고서의 목적을 순서대로 제시할 것.\n○ 본론은 2개의 장으로 구성하고, 하위 항목은 각 장의 제목에 맞추어 구성할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 폭염 취약 계층 보호를 위한 시설 확충과 돌봄 강화 방안\n1장 서론\n1. (가) ______\n2. 폭염 취약 계층을 보호할 방안의 제시\n2장 폭염 대비 시설의 확충 방안\n1. 무더위 쉼터의 추가 지정과 운영 시간 연장\n2. (나) ______\n3장 폭염 취약 계층 돌봄의 강화 방안\n1. (다) ______\n2. 거동이 불편한 주민을 위한 방문 건강 관리 확대\n4장 결론\n1. 폭염으로 인한 온열 질환 피해의 감소\n2. (라) ______","opts":["(가): 폭염 취약 계층 보호 대책의 기대 효과","(나): 홀몸 어르신 안부 확인 전화의 확대","(다): 횡단보도 그늘막과 도로 물 분사 장치 설치","(라): 폭염 대응 사업을 이어 가기 위한 예산 확보"],"ans":3,"exp":"결론은 기대 효과와 향후 과제를 순서대로 제시해야 하고 4장의 1이 기대 효과이므로, (라)에는 향후 과제인 '폭염 대응 사업을 이어 가기 위한 예산 확보'가 들어갈 수 있다. (가)에는 추진 배경이 와야 하는데 기대 효과를 넣었다. '안부 확인 전화의 확대'는 시설 확충이 아니라 돌봄에 해당하여 2장의 제목과 맞지 않고, '그늘막과 물 분사 장치 설치'는 돌봄이 아니라 시설 확충에 해당하여 3장의 제목과 맞지 않는다."},
{"id":"k217","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 논의의 배경을 밝히고 보고서의 목적을 제시할 것.\n○ 본론은 제목에서 밝힌 내용을 2개의 장으로 구성하되, 3장의 하위 항목이 2장의 하위 항목과 순서대로 대응하도록 할 것.\n○ 결론은 본론을 요약하고 향후 과제를 제시할 것.\n\n\u003c개요>\n○ 제목: 폐교 시설의 활용 실태와 활성화 방안\n1장 서론\n1. (가) ______\n2. 폐교 시설의 활용을 활성화할 방안 모색\n2장 폐교 시설의 활용 실태\n1. 활용 계획 없이 방치된 폐교의 증가\n2. (나) ______\n3장 폐교 시설의 활용 활성화 방안\n1. (다) ______\n2. 주민 의견을 반영하는 활용 계획 수립 절차 마련\n4장 결론\n1. 폐교 시설의 활용 실태와 활성화 방안 요약\n2. (라) ______","opts":["(가): 폐교 활용 사업의 성과를 점검할 평가 지표 개발","(나): 지역 주민의 요구와 동떨어진 활용 사례","(다): 방치된 폐교의 새로운 용도 발굴과 재정 지원","(라): 폐교 활용을 뒷받침하기 위한 관련 조례 정비"],"ans":0,"exp":"\u003c지침>에 따르면 서론은 논의의 배경과 목적을 제시해야 한다. 1장의 2가 목적이므로 (가)에는 '학생 수 감소에 따른 폐교의 증가'와 같은 배경이 와야 하는데, '성과를 점검할 평가 지표 개발'은 앞으로 할 일이어서 배경이 될 수 없다. (나)는 3장 2의 '주민 의견 반영 절차'에 대응하는 실태, (다)는 2장 1의 '방치된 폐교'에 대응하는 방안, (라)는 결론의 향후 과제여서 적절하다."},
{"id":"k218","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 현황과 보고서의 목표를 순서대로 제시할 것.\n○ 본론은 2개의 장으로 구성하고, 하위 항목은 각 장의 제목에 맞추어 통일성 있게 구성할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 노인 보행자 교통사고 예방을 위한 환경 개선과 교육 강화 방안\n1장 서론\n1. 노인 보행자 교통사고의 발생 현황\n2. (가) ______\n2장 노인 보행 환경의 개선 방안\n1. 횡단보도 보행 신호 시간의 연장\n2. (나) ______\n3장 노인 대상 교통안전 교육의 강화 방안\n1. 경로당을 찾아가는 교통안전 교육 확대\n2. (다) ______\n4장 결론\n1. (라) ______\n2. 노인 보호 구역을 넓히기 위한 관계 기관 협의","opts":["(가): 노인 보행자 교통사고를 줄일 방안의 모색","(나): 노인 통행이 잦은 구간의 보도 턱 낮추기와 조명 보강","(다): 무단 횡단을 막는 도로변 울타리 설치","(라): 노인 보행자 교통사고 감소와 이동권 보장"],"ans":2,"exp":"\u003c지침>에 따르면 본론의 하위 항목은 각 장의 제목에 맞아야 한다. 3장은 '교통안전 교육의 강화 방안'인데 '도로변 울타리 설치'는 교육이 아니라 2장에서 다룰 보행 환경 개선에 해당하여 통일성을 해친다. (가)는 서론의 목표, (나)는 2장의 보행 환경 개선, (라)는 결론의 기대 효과에 해당하므로 적절하다."},
{"id":"k219","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 가장 적절한 것은?\n\n\u003c지침>\n○ 서론은 논의의 배경과 필요성을 순서대로 제시할 것.\n○ 본론은 문제점과 개선 방안을 각각 하나의 장으로 구성하고, 3장의 하위 항목이 2장의 하위 항목과 순서대로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 지역 축제의 문제점과 개선 방안\n1장 서론\n1. 지역 축제의 양적 증가\n2. (가) ______\n2장 지역 축제의 문제점\n1. (나) ______\n2. 일회용품 사용에 따른 쓰레기의 대량 발생\n3장 지역 축제의 개선 방안\n1. 지역의 역사와 특산물을 살린 고유 프로그램 개발\n2. (다) ______\n4장 결론\n1. (라) ______\n2. 축제의 성과를 객관적으로 측정할 평가 체계 마련","opts":["(가): 지역 축제 평가 체계의 단계적 도입 계획","(나): 지역 특색이 없는 비슷한 프로그램의 반복","(다): 축제 기간에 운영할 임시 주차장 확보","(라): 축제 개선에 필요한 예산의 추가 확보 방안 검토"],"ans":1,"exp":"3장의 1 '지역의 역사와 특산물을 살린 고유 프로그램 개발'에 대응하는 문제점은 '지역 특색이 없는 비슷한 프로그램의 반복'이므로 (나)가 적절하다. (가)에는 논의의 필요성이 와야 하는데 평가 체계 도입 계획을 넣었고, (다)는 2장 2의 쓰레기 문제에 대응해야 하는데 주차장 확보는 그와 관계가 없다. (라)에는 기대 효과가 와야 하는데 예산 확보 방안 검토는 앞으로 할 과제에 해당한다."},
{"id":"k220","subj":"국어","unit":"개요 작성","q":"\u003c지침>에 따라 \u003c개요>를 작성할 때 (가) ～ (라)에 들어갈 내용으로 적절하지 않은 것은?\n\n\u003c지침>\n○ 서론은 문제 상황을 제시하고 보고서의 목적을 밝힐 것.\n○ 본론은 제목에서 밝힌 내용을 2개의 장으로 구성하되, 2장의 하위 항목이 3장의 하위 항목과 순서대로 대응하도록 할 것.\n○ 결론은 기대 효과와 향후 과제를 순서대로 제시할 것.\n\n\u003c개요>\n○ 제목: 가정 내 폐의약품 수거 체계의 현황과 개선 방안\n1장 서론\n1. 함부로 버려진 폐의약품으로 인한 환경 오염 우려\n2. (가) ______\n2장 가정 내 폐의약품 수거 체계의 현황\n1. (나) ______\n2. 올바른 배출 방법에 대한 주민의 낮은 인지도\n3장 가정 내 폐의약품 수거 체계의 개선 방안\n1. 주민센터와 약국 등 수거 장소의 확대\n2. (다) ______\n4장 결론\n1. (라) ______\n2. 수거 실적을 관리하는 통합 전산 체계 구축","opts":["(가): 폐의약품 수거 체계의 현황 분석과 개선 방안 제시","(나): 폐의약품을 버릴 수 있는 수거 장소의 부족","(다): 폐의약품 배출 방법에 대한 주민 홍보 강화","(라): 폐의약품 수거함 설치 현황과 주민 인지도 조사 결과"],"ans":3,"exp":"\u003c지침>에 따르면 결론은 기대 효과와 향후 과제를 순서대로 제시해야 한다. 4장의 2가 향후 과제이므로 (라)에는 '폐의약품의 안전한 처리를 통한 환경 오염 예방'과 같은 기대 효과가 와야 하는데, '수거함 설치 현황과 주민 인지도 조사 결과'는 2장에서 다룰 현황이다. (가)는 서론의 목적, (나)는 3장 1의 '수거 장소 확대'에 대응하는 현황, (다)는 2장 2의 '낮은 인지도'에 대응하는 개선 방안이어서 적절하다."},
{"id":"k221","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n삼투는 농도가 다른 두 용액이 반투과성 막을 사이에 두고 있을 때, 용매인 물이 막을 지나 이동하는 현상이다. 이때 물은 ㉠ __농도가 낮은 쪽에서 높은 쪽으로__ 이동한다. 반투과성 막은 물처럼 작은 분자는 통과시키지만 소금이나 설탕처럼 물에 녹아 있는 물질은 잘 통과시키지 않으므로, 양쪽의 농도 차이를 줄이는 방향으로 물만 움직이는 것이다.\n채소를 소금물에 절이는 것은 삼투를 이용한 조리법이다. 채소의 세포막은 반투과성 막의 구실을 한다. 오이를 진한 소금물에 담그면 세포 안보다 바깥의 농도가 높으므로 ㉡ __소금물의 물이 세포 안으로 들어간다__. 그 결과 빳빳하던 오이는 ㉢ __부피가 줄고 쭈글쭈글해진다__. 반대로 시든 채소를 맑은 물에 담가 두면 다시 싱싱해지는데, 이는 세포 안의 농도가 바깥보다 높아 ㉣ __물이 세포 안으로 들어가기__ 때문이다. 식물의 뿌리털이 흙 속의 물을 빨아들이는 것도 같은 원리로 설명할 수 있다.","opts":["㉠: 농도가 높은 쪽에서 낮은 쪽으로","㉡: 세포 안의 물이 바깥으로 빠져나온다","㉢: 부피가 늘고 더 단단해진다","㉣: 물이 세포 바깥으로 빠져나가기"],"ans":1,"exp":"물은 농도가 낮은 쪽에서 높은 쪽으로 이동한다고 했다. 오이를 진한 소금물에 담그면 세포 바깥의 농도가 더 높으므로 물은 세포 안에서 바깥으로 빠져나와야 하고, 그래야 뒤의 '부피가 줄고 쭈글쭈글해진다'와도 이어진다. 따라서 ㉡을 고쳐야 한다. ㉠은 농도 차이를 줄이는 방향이라는 설명과 맞고, ㉢은 물이 빠져나간 결과로 알맞으며, ㉣은 세포 안의 농도가 더 높은 경우여서 물이 안으로 들어간다는 것이 맞다."},
{"id":"k222","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n정부는 서민의 생활을 보호하려고 어떤 상품의 가격이 일정한 수준을 넘지 못하도록 묶어 두기도 한다. 이를 최고 가격제라고 한다. 이 제도가 효과를 내려면 최고 가격을 ㉠ __시장의 균형 가격보다 높게__ 정해야 한다. 균형 가격보다 높은 수준에 상한을 두면 시장 가격이 상한에 닿지 않아 규제가 아무런 영향을 주지 못하기 때문이다.\n그런데 가격을 균형 가격보다 낮게 묶어 두면 새로운 문제가 생긴다. 가격이 내려가면 소비자는 그 상품을 더 많이 사려고 하고, 생산자는 ㉡ __공급량을 줄인다__. 그 결과 사려는 양이 팔려는 양보다 많은 ㉢ __초과 수요가 발생한다__. 상품을 구하지 못한 소비자 가운데에는 웃돈을 주고라도 사려는 사람이 있게 마련이어서, 정해진 가격보다 ㉣ __비싼 값에 몰래 거래되는__ 암시장이 나타나기도 한다. 따라서 최고 가격제를 시행할 때에는 먼저 온 순서대로 팔거나 배급표를 나누어 주는 것과 같이, 모자란 상품을 나눌 방법을 함께 마련해야 한다.","opts":["㉠: 시장의 균형 가격보다 낮게","㉡: 공급량을 늘린다","㉢: 초과 공급이 발생한다","㉣: 싼값에 공개적으로 거래되는"],"ans":0,"exp":"바로 뒤에서 균형 가격보다 높은 수준에 상한을 두면 규제가 아무런 영향을 주지 못한다고 했으므로, 효과를 내려면 최고 가격을 균형 가격보다 낮게 정해야 한다. 따라서 ㉠을 고쳐야 한다. 가격이 내려가면 생산자는 공급량을 줄이므로 ㉡은 맞고, 사려는 양이 팔려는 양보다 많은 상태는 초과 수요이므로 ㉢도 맞다. ㉣은 웃돈을 주고라도 사려는 사람이 있다는 앞 내용과 이어지므로 고칠 필요가 없다."},
{"id":"k223","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n바닷가에서는 낮과 밤에 바람의 방향이 바뀐다. 육지와 바다가 데워지고 식는 빠르기가 다르기 때문이다. 육지는 바다보다 ㉠ __빨리 데워지고 빨리 식는다__. 그래서 햇볕이 내리쬐는 낮에는 육지의 온도가 바다보다 높아진다. 공기는 데워지면 가벼워져 위로 올라가므로, 낮에는 육지 위의 공기가 상승하고 ㉡ __그 빈자리를 채우려고 바다 위의 공기가 육지로__ 밀려든다. 이렇게 바다에서 육지로 부는 바람을 해풍이라고 한다.\n해가 지면 사정이 달라진다. 육지는 빠르게 식지만 바다는 낮 동안 받은 열을 오래 간직하므로, 밤에는 ㉢ __육지의 온도가 바다보다 높아진다__. 이번에는 바다 위의 공기가 상승하고 육지의 공기가 바다 쪽으로 이동하는데, 이 바람을 육풍이라고 한다. 돛단배로 고기를 잡던 시절의 어부들은 이 바람을 이용하여 ㉣ __새벽에는 육풍을 타고 바다로 나갔다가__ 낮에는 해풍을 타고 돌아왔다. 두 바람이 바뀌는 아침과 저녁 무렵에는 바람이 잠시 잦아들기도 한다.","opts":["㉠: 천천히 데워지고 천천히 식는다","㉡: 그 빈자리를 채우려고 육지 위의 공기가 바다로","㉢: 바다의 온도가 육지보다 높아진다","㉣: 새벽에는 해풍을 타고 바다로 나갔다가"],"ans":2,"exp":"밤에는 육지가 빠르게 식고 바다는 열을 오래 간직한다고 했고, 이어서 바다 위의 공기가 상승한다고 했으므로 밤에는 바다의 온도가 육지보다 높아야 한다. 따라서 ㉢을 고쳐야 한다. ㉠은 낮에 육지의 온도가 더 높아진다는 내용과 맞고, ㉡은 바다에서 육지로 부는 해풍의 설명과 맞는다. 육풍은 육지에서 바다로 부는 바람이므로 바다로 나갈 때 육풍을 탄다는 ㉣도 고칠 필요가 없다."},
{"id":"k224","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n감염병은 면역이 없는 사람들 사이에서 퍼진다. 그런데 한 집단에서 면역을 가진 사람의 비율이 충분히 높아지면, 감염자가 생기더라도 병원체가 ㉠ __다음 사람에게 옮겨 갈 기회가 줄어든다__. 감염자가 만나는 사람 대부분이 이미 면역을 가지고 있기 때문이다. 이렇게 되면 면역이 없는 사람도 ㉡ __간접적으로 보호를 받게__ 되는데, 이를 집단 면역이라고 한다.\n집단 면역은 예방 접종을 받을 수 없는 사람들에게 특히 중요하다. 너무 어린 영아나 면역 기능이 크게 떨어진 환자는 일부 백신을 맞을 수 없다. 이들은 스스로 면역을 얻기 어려우므로 ㉢ __주변 사람들의 면역에 기대어__ 감염을 피한다. 집단 면역에 필요한 접종률은 감염병마다 다르다. 감염자 한 명이 여러 사람에게 병을 옮기는, 전파력이 강한 감염병일수록 ㉣ __더 낮은 접종률로도 집단 면역이 유지된다__. 전파력이 매우 강한 홍역이 접종률이 조금만 떨어져도 다시 유행하는 것은 이 때문이다.","opts":["㉠: 다음 사람에게 옮겨 갈 기회가 늘어난다","㉡: 스스로 항체를 만들어 내게","㉢: 주변 사람들과의 접촉을 늘려","㉣: 더 높은 접종률이 유지되어야 집단 면역이 이루어진다"],"ans":3,"exp":"마지막 문장에서 전파력이 매우 강한 홍역은 접종률이 조금만 떨어져도 다시 유행한다고 했으므로, 전파력이 강한 감염병일수록 더 높은 접종률이 필요하다고 해야 앞뒤가 맞는다. 따라서 ㉣을 고쳐야 한다. ㉠은 감염자가 만나는 사람 대부분이 면역을 가졌다는 설명과 맞고, ㉡은 면역이 없는 사람이 남의 면역 덕을 본다는 뜻이어서 맞으며, ㉢은 스스로 면역을 얻기 어려운 사람들에 대한 설명으로 알맞다."},
{"id":"k225","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n농업이 중심이던 전근대 사회에서 곡식의 값은 해마다 크게 출렁였다. 풍년이 들면 곡식이 넘쳐 값이 떨어지고, 흉년이 들면 곡식이 모자라 값이 치솟았다. 값이 떨어지면 농민이 손해를 보고, 값이 치솟으면 곡식을 사 먹어야 하는 사람들이 고통을 받았다. 고려 성종 때 설치된 상평창은 이 문제를 풀기 위한 기구였다.\n상평창의 운영 원리는 단순하다. 풍년이 들어 곡식 값이 떨어지면 나라에서 ㉠ __시세보다 싼값에 곡식을 내다 팔았다__. 이렇게 하면 시장에 도는 곡식이 줄어 ㉡ __값이 지나치게 떨어지는 것을 막을 수 있었다__. 반대로 흉년이 들어 곡식 값이 오르면 창고에 쌓아 둔 곡식을 ㉢ __시세보다 싼값에 풀었다__. 시장에 곡식이 늘어나니 값은 차츰 안정되었다. 상평창은 곡식을 사고파는 방식으로 값을 조절했다는 점에서, ㉣ __곡식을 빌려주어 굶주린 백성을 구제하던__ 의창과는 성격이 달랐다. '상평'이라는 이름에도 값을 늘 고르게 한다는 뜻이 담겨 있다.","opts":["㉠: 시세보다 비싼 값에 곡식을 사들였다","㉡: 값이 지나치게 오르는 것을 막을 수 있었다","㉢: 시세보다 비싼 값에 사들였다","㉣: 곡식을 사고팔아 값을 조절하던"],"ans":0,"exp":"㉠ 뒤에서 '이렇게 하면 시장에 도는 곡식이 줄어' 값이 떨어지는 것을 막는다고 했으므로, 풍년에는 나라가 곡식을 내다 판 것이 아니라 사들였다고 해야 한다. 따라서 ㉠을 고쳐야 한다. ㉡은 풍년에 값이 떨어지는 문제를 다루는 문맥과 맞고, ㉢은 흉년에 시장에 곡식이 늘어난다는 뒤 문장과 맞는다. ㉣은 상평창과 성격이 다른 기구를 설명하는 부분이므로 사고파는 방식이라고 고치면 대비가 사라진다."},
{"id":"k226","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n단어의 의미는 시간이 흐르면서 달라지기도 한다. 의미 변화는 그 결과에 따라 크게 세 가지로 나뉜다. 첫째는 의미의 확대로, 단어가 가리키는 범위가 ㉠ __이전보다 넓어지는 것이다__. '다리'는 본래 사람이나 짐승의 몸에 붙은 것만 가리켰으나 지금은 책상이나 안경의 다리처럼 물건의 일부를 가리키는 데에도 쓰인다. 둘째는 의미의 축소로, 가리키는 범위가 좁아지는 것이다. 중세 국어에서 '얼굴'은 몸 전체의 모습, 곧 형체를 뜻했으나 지금은 ㉡ __머리의 앞면만을 가리킨다__.\n셋째는 의미의 이동으로, 가리키는 범위가 넓어지거나 좁아진 것이 아니라 ㉢ __본래의 뜻을 그대로 지닌 채 새로운 뜻이 덧붙는 것이다__. '어리다'는 중세 국어에서 '어리석다'를 뜻했지만 지금은 '나이가 적다'를 뜻한다. 오늘날 '어리다'를 '어리석다'의 뜻으로 쓰는 사람은 없으니, ㉣ __옛 의미는 사라지고 새 의미만 남은 셈이다__. 이러한 의미 변화의 유형을 알아 두면 옛 문헌의 단어를 오늘날의 뜻으로 잘못 읽는 일을 줄일 수 있다.","opts":["㉠: 이전보다 좁아지는 것이다","㉡: 몸 전체의 생김새를 가리킨다","㉢: 본래의 뜻과는 다른 뜻으로 바뀌는 것이다","㉣: 옛 의미와 새 의미가 함께 쓰이는 셈이다"],"ans":2,"exp":"의미의 이동의 예로 든 '어리다'는 '어리석다'라는 옛 의미가 사라지고 '나이가 적다'라는 새 의미만 남았다고 했다. 본래의 뜻을 지닌 채 새 뜻이 덧붙는 것은 범위가 넓어지는 확대에 가까우므로, ㉢은 '본래의 뜻과는 다른 뜻으로 바뀌는 것이다'로 고쳐야 한다. ㉠은 '다리'가 물건에까지 쓰이게 된 예와 맞고, ㉡은 범위가 좁아진 축소의 예로 알맞으며, ㉣은 오늘날 '어리석다'의 뜻으로 쓰는 사람이 없다는 앞 내용과 맞는다."},
{"id":"k227","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n사람은 자신이 이미 믿고 있는 바를 뒷받침하는 정보는 쉽게 받아들이고, 그에 어긋나는 정보는 ㉠ __가볍게 여기거나 외면하는__ 경향이 있다. 심리학에서는 이를 확증 편향이라고 부른다. 확증 편향에 빠진 사람은 정보를 찾을 때부터 한쪽으로 기운다. 어떤 건강식품이 몸에 좋다고 믿는 사람은 ㉡ __효과가 없었다는 사례부터 찾아보고__, 효과를 의심하는 글은 끝까지 읽지 않는다.\n같은 정보를 해석할 때에도 편향은 작동한다. 결과가 분명하지 않은 자료를 보면 사람들은 대개 ㉢ __자기 생각에 유리한 쪽으로 풀이한다__. 그래서 서로 반대되는 믿음을 가진 두 사람이 똑같은 자료를 읽고도 저마다 자기 생각이 옳다는 확신을 더 굳히는 일이 벌어진다.\n확증 편향을 줄이려면 의식적인 노력이 필요하다. 중요한 결정을 내리기 전에 ㉣ __자기 생각이 틀렸음을 보여 줄 증거가 무엇인지__ 스스로 물어보는 것이 한 방법이다. 회의에서 일부러 반대 의견을 내는 역할을 정해 두는 조직이 있는 것도 같은 까닭에서이다.","opts":["㉠: 꼼꼼히 따져 본 뒤 받아들이는","㉡: 효과를 보았다는 사례만 골라 찾아보고","㉢: 자기 생각에 불리한 쪽으로 풀이한다","㉣: 자기 생각이 옳음을 보여 줄 증거가 무엇인지"],"ans":1,"exp":"확증 편향은 자신의 믿음을 뒷받침하는 정보를 쉽게 받아들이는 경향이므로, 건강식품이 몸에 좋다고 믿는 사람은 효과를 보았다는 사례를 골라 찾아본다고 해야 '효과를 의심하는 글은 끝까지 읽지 않는다'와 이어진다. 따라서 ㉡을 고쳐야 한다. ㉠은 믿음에 어긋나는 정보를 대하는 태도로 알맞고, ㉢은 두 사람이 저마다 확신을 굳힌다는 뒤 내용과 맞으며, ㉣은 일부러 반대 의견을 내게 하는 것과 같은 취지여서 고칠 필요가 없다."},
{"id":"k228","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n관료제는 많은 사람이 함께 일하는 큰 조직을 효율적으로 움직이기 위한 장치이다. 업무를 잘게 나누어 맡기고, 누가 맡더라도 같은 결과가 나오도록 일하는 방법을 규칙으로 정해 둔다. 규칙에 따라 일을 처리하면 담당자의 기분이나 민원인과의 친분에 따라 결과가 달라지는 일이 줄어들므로, 관료제는 ㉠ __행정의 자의성을 키우는 구실을 한다__.\n그러나 규칙이 늘 좋은 결과만 낳는 것은 아니다. 규칙은 본래 조직의 목표를 이루기 위한 수단인데, 규칙을 지키는 일 자체가 목표처럼 되어 버리는 경우가 있다. 이를 목표 대치라고 한다. 목표 대치가 일어나면 담당자는 ㉡ __민원인의 사정보다 절차를 어기지 않는 데에 더 마음을 쓴다__. 급한 도움이 필요한 사람이 서류 한 장이 빠졌다는 이유로 지원을 받지 못하는 일은 이렇게 생긴다. 또 규칙은 과거의 경험을 바탕으로 만들어지므로 ㉢ __미처 예상하지 못한 새로운 상황에는 잘 들어맞지 않을 수 있다__. 그래서 규칙을 지키되 그 취지를 살려 판단할 수 있도록 담당자에게 ㉣ __일정한 재량을 주어야 한다는__ 주장이 나온다.","opts":["㉠: 행정의 공정성을 높이는 구실을 한다","㉡: 절차보다 민원인의 사정을 헤아리는 데에 더 마음을 쓴다","㉢: 처음 겪는 새로운 상황에도 빈틈없이 들어맞는다","㉣: 재량을 모두 거두어들여야 한다는"],"ans":0,"exp":"규칙에 따라 일을 처리하면 담당자의 기분이나 친분에 따라 결과가 달라지는 일이 줄어든다고 했으므로, 관료제는 행정의 자의성을 키우는 것이 아니라 줄이고 공정성을 높인다고 해야 한다. 따라서 ㉠을 고쳐야 한다. ㉡은 규칙을 지키는 일 자체가 목표가 된 상황의 설명으로 알맞고, ㉢은 규칙이 과거의 경험에서 나왔다는 이유와 맞으며, ㉣은 규칙의 취지를 살려 판단하게 하자는 문맥과 맞는다."},
{"id":"k229","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 내용으로 가장 적절한 것은?\n\n항생제는 세균을 죽이거나 세균이 늘어나는 것을 막는 약이다. 세균과 바이러스는 구조와 증식 방식이 전혀 다르므로, 항생제는 ㉠ __바이러스가 일으키는 감기나 독감에는 효과가 없다__. 그런데도 감기에 걸리면 항생제를 찾는 사람이 적지 않다.\n항생제를 필요 이상으로 쓰면 내성균이 늘어난다. 세균 집단에는 돌연변이로 항생제에 견디는 힘을 얻은 세균이 드물게 섞여 있다. 항생제를 쓰면 ㉡ __약에 약한 세균은 죽고 견디는 세균만 살아남는다__. 살아남은 세균이 경쟁자가 사라진 자리에서 빠르게 늘어나면, 그 집단은 ㉢ __같은 항생제가 잘 듣지 않는 세균으로 채워진다__. 항생제가 내성을 가진 세균을 골라 남기는 셈이다.\n내성균의 확산을 늦추려면 항생제를 꼭 필요한 때에만 써야 한다. 또 처방받은 항생제는 증상이 나아졌다고 해서 마음대로 끊지 말고 ㉣ __남겨 두었다가 비슷한 증상이 생길 때 다시 먹어야 한다__. 중간에 복용을 멈추면 살아남은 세균이 다시 늘어날 수 있고, 남은 약을 스스로 판단하여 먹으면 불필요한 사용으로 이어지기 때문이다.","opts":["㉠: 바이러스가 일으키는 감기나 독감에 특히 효과가 크다","㉡: 약에 견디는 세균은 죽고 약한 세균만 살아남는다","㉢: 같은 항생제에 쉽게 죽는 세균으로 채워진다","㉣: 의사가 정해 준 기간과 용량을 지켜 끝까지 먹어야 한다"],"ans":3,"exp":"㉣의 앞에서는 마음대로 끊지 말라고 했고, 뒤에서는 남은 약을 스스로 판단하여 먹으면 불필요한 사용으로 이어진다고 했다. 약을 남겨 두었다가 다시 먹으라는 것은 이 둘과 모두 어긋나므로, ㉣을 '의사가 정해 준 기간과 용량을 지켜 끝까지 먹어야 한다'로 고쳐야 한다. ㉠은 세균과 바이러스가 전혀 다르다는 설명과 맞고, ㉡과 ㉢은 항생제가 내성을 가진 세균을 골라 남긴다는 정리와 맞는다."},
{"id":"k230","subj":"국어","unit":"문맥 수정","q":"다음 글의 ㉠ ～ ㉣ 중 문맥상 어색한 곳을 수정한 것으로 가장 적절한 것은?\n\n물이 언제나 100℃에서 끓는 것은 아니다. 액체가 끓는 온도는 그 액체를 누르는 기압에 따라 달라진다. 물이 끓으려면 물속에서 생긴 수증기 방울이 바깥에서 누르는 압력을 이겨 내야 하므로, 기압이 높을수록 ㉠ __끓는점도 높아진다__. 우리가 물의 끓는점을 100℃라고 말하는 것은 1기압을 기준으로 한 것이다.\n높은 산에 오르면 위에서 누르는 공기의 양이 줄어 ㉡ __기압이 평지보다 낮다__. 그래서 높은 산에서는 물이 ㉢ __100℃보다 높은 온도에서 끓는다__. 이런 곳에서 밥을 지으면 물이 끓어도 온도가 충분히 오르지 않아 쌀이 설익는다. 산에서 밥을 지을 때 냄비 뚜껑 위에 돌을 올려놓는 것은 수증기가 빠져나가지 못하게 하여 냄비 안의 압력을 조금이라도 높이려는 것이다.\n압력솥은 이 원리를 이용한 조리 기구이다. 뚜껑을 단단히 잠가 수증기를 가두면 솥 안의 압력이 1기압보다 높아지고, 물은 ㉣ __100℃를 넘는 온도에서 끓게 된다__. 온도가 높으니 음식이 빨리 익고 조리 시간과 연료도 줄어든다.","opts":["㉠: 끓는점은 낮아진다","㉡: 기압이 평지보다 높다","㉢: 100℃보다 낮은 온도에서 끓는다","㉣: 100℃에 못 미치는 온도에서 끓게 된다"],"ans":2,"exp":"기압이 높을수록 끓는점이 높아진다고 했고 높은 산은 기압이 평지보다 낮으므로, 높은 산에서는 물이 100℃보다 낮은 온도에서 끓는다. 그래야 '물이 끓어도 온도가 충분히 오르지 않아 쌀이 설익는다'는 뒤 문장과도 맞는다. 따라서 ㉢을 고쳐야 한다. ㉠은 수증기 방울이 바깥 압력을 이겨 내야 한다는 설명과 맞고, ㉡은 누르는 공기의 양이 준다는 이유와 맞으며, ㉣은 압력이 1기압보다 높아진 경우여서 고칠 필요가 없다."},
{"id":"k231","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 덕분에 항해사들은 지도 위에 출발지와 목적지를 잇는 직선을 긋고 그 각도대로 배를 몰기만 하면 목적지에 닿을 수 있었다. 그러나 이 편리함에는 대가가 따랐다.\n(나) 둥근 지구의 표면을 평평한 종이에 옮기려면 어딘가를 늘이거나 줄일 수밖에 없다. 그래서 모든 지도에는 면적, 방향, 거리 가운데 적어도 하나가 실제와 다르게 그려지는 왜곡이 생긴다.\n(다) 그 대가란 극지방에 가까울수록 땅이 실제보다 크게 그려진다는 점이다. 이 지도에서 그린란드가 아프리카만큼 커 보이는 것은 그 때문인데, 실제로는 아프리카가 열네 배쯤 더 넓다.\n(라) 이러한 왜곡을 받아들이면서 방향만큼은 정확하게 나타내려 한 것이 16세기에 나온 메르카토르 도법이다. 이 도법으로 그린 지도에서는 두 지점을 이은 직선을 따라가면 나침반이 가리키는 방향이 줄곧 일정하게 유지된다.","opts":["(나) - (가) - (라) - (다)","(나) - (라) - (가) - (다)","(라) - (가) - (다) - (나)","(라) - (나) - (가) - (다)"],"ans":1,"exp":"(나)가 모든 지도에는 왜곡이 생긴다는 화제를 열고, (라)가 '이러한 왜곡'으로 받아 방향을 정확하게 나타내는 메르카토르 도법을 소개한다. (가)는 '덕분에'로 그 도법의 쓸모를 말한 뒤 '대가가 따랐다'고 하고, (다)가 '그 대가란'으로 받아 면적의 왜곡을 설명한다. 따라서 (나) - (라) - (가) - (다)이다."},
{"id":"k232","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 그런데 철도가 놓이면서 이 어긋남이 문제가 되기 시작했다. 도시마다 시각이 다르다 보니 열차 시간표를 짜기가 어려웠고, 같은 선로를 달리는 열차끼리 부딪칠 위험도 커졌다.\n(나) 나아가 1884년에는 여러 나라의 대표가 모여 그리니치를 지나는 경선을 세계 경도의 기준으로 정했다. 오늘날 각 나라의 표준시는 이 기준선에서 얼마나 떨어져 있는지에 따라 정해진다.\n(다) 19세기 중반까지 사람들은 해가 가장 높이 뜨는 때를 정오로 삼아 지역마다 다른 시각을 썼다. 걸어서 다니던 시절에는 이웃 도시와 시계가 몇 분 어긋나도 불편할 것이 없었다.\n(라) 이 문제를 풀기 위해 철도 회사들은 노선 전체에 하나의 시각을 적용하기 시작했다. 영국의 철도는 런던 그리니치 천문대의 시각을 기준으로 삼았고, 이 '철도 시간'은 점차 일상생활의 기준으로 퍼져 나갔다.","opts":["(가) - (다) - (라) - (나)","(다) - (가) - (나) - (라)","(다) - (가) - (라) - (나)","(다) - (라) - (가) - (나)"],"ans":2,"exp":"(다)가 지역마다 다른 시각을 쓰던 때에는 시계가 어긋나도 불편하지 않았다고 화제를 열고, (가)가 '이 어긋남'이 철도 때문에 문제가 되었다고 잇는다. (라)는 '이 문제를 풀기 위해' 철도 회사들이 그리니치 시각을 기준으로 삼았다고 하고, (나)가 '나아가'로 받아 그리니치 경선이 세계의 기준이 되었다고 마무리한다. 따라서 (다) - (가) - (라) - (나)이다."},
{"id":"k233","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 미생물이 유기물을 분해하는 현상이라는 점에서 발효와 부패는 본질적으로 같다. 둘을 가르는 기준은 그 결과가 사람에게 이로운가 해로운가 하는 것이다.\n(나) 이를 위해 사람들은 원하는 미생물이 좋아하는 환경을 만들어 주는 방법을 터득했다. 장을 담글 때 진한 소금물을 쓰는 것이 그 예로, 소금기에 약한 잡균은 자라지 못하고 소금기에 잘 견디는 이로운 미생물이 자리를 잡는다.\n(다) 이 기준에 따르면 우유에 젖산균이 자라 요구르트가 되는 것은 발효이고, 같은 우유에 다른 세균이 자라 악취가 나는 것은 부패이다. 그러니 발효 식품을 만드는 일은 이로운 미생물만 골라 키우는 일이라 할 수 있다.\n(라) 이렇게 자리 잡은 미생물은 산이나 알코올 같은 물질을 만들어 다른 세균이 자라기 어렵게 한다. 발효 식품이 날것보다 오래 보관되는 까닭이 여기에 있다.","opts":["(가) - (나) - (다) - (라)","(가) - (다) - (나) - (라)","(다) - (가) - (라) - (나)","(다) - (나) - (가) - (라)"],"ans":1,"exp":"(가)가 발효와 부패를 가르는 기준을 제시하고, (다)가 '이 기준에 따르면'으로 받아 예를 든 뒤 발효 식품을 만드는 일은 이로운 미생물만 골라 키우는 일이라고 한다. (나)는 '이를 위해' 터득한 방법과 미생물이 '자리를 잡는다'는 내용을 말하고, (라)가 '이렇게 자리 잡은 미생물'로 받아 발효 식품이 오래 보관되는 까닭을 밝힌다. 따라서 (가) - (다) - (나) - (라)이다."},
{"id":"k234","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 예컨대 구내식당에서 채소 반찬을 눈높이에, 튀김을 손이 덜 가는 곳에 놓는 것이 그러한 개입이다. 어떤 음식도 금지하지 않았지만 사람들은 채소를 더 많이 집게 된다.\n(나) 이 주장을 대표하는 개념이 '넛지'이다. 넛지는 본래 팔꿈치로 슬쩍 찌른다는 뜻으로, 선택의 자유는 그대로 두면서 더 나은 쪽을 고르도록 부드럽게 이끄는 개입을 가리킨다.\n(다) 다만 이런 방식에는 비판도 따른다. 당사자가 알아차리지 못하는 사이에 선택을 이끈다는 점에서, 좋은 뜻으로 한 일이라도 누가 무엇을 '더 나은 선택'으로 정하는지 따져 보아야 한다는 것이다.\n(라) 사람들의 행동을 바꾸려 할 때 흔히 쓰는 수단은 금지와 처벌, 또는 금전적 보상이다. 그런데 이런 수단을 쓰지 않고도 선택의 상황을 조금 바꾸는 것만으로 행동을 바꿀 수 있다는 주장이 있다.","opts":["(가) - (라) - (나) - (다)","(나) - (라) - (가) - (다)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)"],"ans":3,"exp":"(라)가 금지나 보상 없이도 행동을 바꿀 수 있다는 주장을 소개하고, (나)가 '이 주장을 대표하는 개념'으로 넛지를 정의하며 '부드럽게 이끄는 개입'이라고 한다. (가)는 '그러한 개입'의 예를 들고, (다)가 '다만 이런 방식에는 비판도 따른다'로 마무리한다. 따라서 (라) - (나) - (가) - (다)이다."},
{"id":"k235","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 점자는 손끝으로 읽는 글자이다. 오늘날 널리 쓰이는 점자는 세로 석 점, 가로 두 점으로 놓인 여섯 개의 점 가운데 어느 것을 도드라지게 하느냐에 따라 글자를 구별한다.\n(나) 이 어려움을 푼 사람이 시각 장애 학생을 가르치던 교사 박두성이다. 그는 제자들과 여러 해 연구한 끝에 1926년에 한글 점자를 내놓았고, 훈민정음에 빗대어 '훈맹정음'이라는 이름을 붙였다.\n(다) 훈맹정음의 특징은 같은 자음이라도 첫소리와 받침의 점 모양을 달리한 데 있다. 덕분에 글자를 풀어서 한 줄로 적어도 어느 것이 받침인지 손끝으로 가려 읽을 수 있다.\n(라) 이 여섯 점 방식은 19세기 프랑스의 루이 브라유가 고안한 것이다. 그러나 알파벳에 맞추어 만든 것이어서, 첫소리·가운뎃소리·받침을 모아 쓰는 한글을 적는 데에는 그대로 쓸 수 없었다.","opts":["(가) - (라) - (나) - (다)","(가) - (라) - (다) - (나)","(라) - (가) - (나) - (다)","(라) - (나) - (가) - (다)"],"ans":0,"exp":"(가)가 여섯 개의 점으로 글자를 구별하는 점자를 소개하고, (라)가 '이 여섯 점 방식'으로 받아 그것이 한글을 적는 데에는 그대로 쓸 수 없었다고 한다. (나)는 '이 어려움을 푼 사람'으로 박두성과 훈맹정음을 소개하고, (다)가 훈맹정음의 특징을 설명한다. 따라서 (가) - (라) - (나) - (다)이다."},
{"id":"k236","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 이 회사의 평균 월급은 600만 원이지만, 실제로 그만큼 받는 사람은 한 명도 없다. 열 명 가운데 아홉 명이 평균의 절반밖에 받지 못하는 것이다.\n(나) 이럴 때에는 값을 크기순으로 늘어놓았을 때 한가운데에 오는 중앙값이 집단의 모습을 더 잘 보여 준다. 위 회사의 중앙값은 300만 원으로, 대다수 직원의 형편과 일치한다.\n(다) 어떤 집단의 특성을 숫자 하나로 나타낼 때 가장 흔히 쓰는 것이 평균이다. 값을 모두 더해 개수로 나누면 되니 계산이 쉽고, 누구나 그 뜻을 안다. 그래서 소득이나 성적을 이야기할 때 사람들은 으레 평균부터 찾는다.\n(라) 하지만 평균은 유난히 크거나 작은 값 하나에 크게 흔들린다는 약점이 있다. 예를 들어 직원 아홉 명의 월급이 저마다 300만 원이고 사장의 월급이 3,300만 원인 회사가 있다고 하자.","opts":["(가) - (다) - (라) - (나)","(다) - (가) - (라) - (나)","(다) - (나) - (가) - (라)","(다) - (라) - (가) - (나)"],"ans":3,"exp":"(다)가 평균을 소개하고, (라)가 '하지만'으로 받아 평균의 약점을 말하며 한 회사를 예로 든다. (가)는 '이 회사'의 평균 월급이 실제 형편과 다름을 보이고, (나)가 '이럴 때에는' 중앙값이 더 알맞다고 하며 '위 회사'의 중앙값을 든다. 따라서 (다) - (라) - (가) - (나)이다."},
{"id":"k237","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 이러한 위험은 조선 후기에 저수지와 보 같은 수리 시설이 늘어나면서 줄어들었다. 물 걱정을 던 농민들이 앞다투어 받아들이면서 모내기법은 전국으로 퍼져 나갔다.\n(나) 모내기법은 못자리에서 모를 따로 길렀다가 논에 옮겨 심는 농사법이다. 볍씨를 논에 바로 뿌리는 방법에 견주어 잡초를 뽑는 일손이 크게 줄고, 벼를 거둔 논에 보리를 심는 이모작도 할 수 있었다. 같은 땅에서 더 적은 일손으로 더 많이 거둘 수 있는 방법이었던 셈이다.\n(다) 그런데도 조선 전기의 정부는 이 농사법을 금지하곤 했다. 모를 옮겨 심을 무렵에 비가 오지 않으면 모가 말라 죽어 한 해 농사를 통째로 망칠 수 있었기 때문이다.\n(라) 그 결과 한 사람이 지을 수 있는 논의 넓이가 늘어나, 넓은 땅을 경작하여 부를 쌓는 농민이 나타났다. 반면에 일손이 덜 필요해지면서 소작지를 잃고 농촌을 떠나는 농민도 생겨났다.","opts":["(가) - (나) - (다) - (라)","(나) - (가) - (다) - (라)","(나) - (다) - (가) - (라)","(다) - (나) - (라) - (가)"],"ans":2,"exp":"(나)가 모내기법과 그 장점을 소개하고, (다)가 '그런데도'로 받아 조선 전기의 정부가 이를 금지한 까닭, 곧 가뭄에 농사를 망칠 위험을 말한다. (가)는 '이러한 위험'이 수리 시설의 확충으로 줄어 모내기법이 전국으로 퍼졌다고 하고, (라)가 '그 결과' 농촌 사회에 일어난 변화를 말한다. 따라서 (나) - (다) - (가) - (라)이다."},
{"id":"k238","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 수어는 손의 모양과 움직임, 얼굴 표정 등으로 뜻을 나타내는 언어이다. 흔히 수어를 음성 언어의 낱말을 손짓으로 하나씩 옮긴 것으로 여기지만, 이는 오해이다.\n(나) 이처럼 음성 언어와 별개의 체계이므로, 같은 음성 언어를 쓰는 나라끼리도 수어는 다를 수 있다. 똑같이 영어를 쓰지만 미국의 수어와 영국의 수어는 서로 통하지 않을 만큼 다르다.\n(다) 수어는 음성 언어와는 다른 고유한 문법을 갖추고 있기 때문이다. 낱말을 늘어놓는 순서가 그 나라의 음성 언어와 다르고, 얼굴 표정이 문장의 종류를 구별하는 구실을 하기도 한다.\n(라) 두 나라의 수어가 영어와 별개의 언어이듯 한국수어 역시 한국어와 구별되는 하나의 언어이며, 우리나라는 그 지위를 법으로 분명히 하였다. 2016년에 제정된 한국수화언어법은 한국수어가 국어와 동등한 자격을 가진 농인의 고유한 언어임을 밝히고 있다.","opts":["(가) - (다) - (나) - (라)","(가) - (라) - (나) - (다)","(다) - (가) - (나) - (라)","(다) - (나) - (라) - (가)"],"ans":0,"exp":"(가)가 수어를 음성 언어의 낱말을 옮긴 것으로 여기는 것은 오해라고 하고, (다)가 '~기 때문이다'로 그 까닭인 고유한 문법을 든다. (나)는 '이처럼 음성 언어와 별개의 체계이므로'로 받아 미국과 영국의 수어가 다르다고 하고, (라)가 '두 나라의 수어가 … 한국수어 역시'로 (나)의 미국과 영국을 받아 한국수어의 법적 지위를 말한다. 따라서 (가) - (다) - (나) - (라)이다."},
{"id":"k239","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 그러나 동네가 유명해질수록 건물주는 임대료를 올리고, 높은 임대료를 감당할 수 있는 대형 프랜차이즈가 그 자리를 차지한다. 이처럼 낙후된 지역이 활성화되면서 원래 있던 주민과 상인이 밀려나는 현상을 젠트리피케이션이라고 한다.\n(나) 젠트리피케이션의 역설은 동네를 살린 사람들이 가장 먼저 쫓겨난다는 데 있다. 게다가 개성 있는 가게들이 떠난 동네는 다른 번화가와 다를 바 없어져 결국 방문객의 발길도 줄어든다.\n(다) 낡고 임대료가 싼 동네에 예술가의 작업실이나 개성 있는 작은 가게가 하나둘 들어서는 일이 있다. 독특한 분위기가 입소문을 타면 그 동네를 찾는 사람이 늘고 상권이 살아난다.\n(라) 이런 결과를 막으려고 건물주와 임차인이 임대료 인상을 자제하기로 약속하는 상생 협약을 맺기도 한다. 지역의 활력과 구성원의 삶을 함께 지키려는 시도이다.","opts":["(가) - (다) - (나) - (라)","(다) - (가) - (나) - (라)","(다) - (나) - (가) - (라)","(라) - (다) - (가) - (나)"],"ans":1,"exp":"(다)가 낡은 동네에 작은 가게들이 들어서 상권이 살아나는 과정을 말하고, (가)가 '그러나'로 받아 임대료가 올라 원래의 주민과 상인이 밀려나는 현상을 젠트리피케이션이라고 정의한다. (나)는 정의된 말을 써서 그 역설과 방문객 감소를 말하고, (라)가 '이런 결과를 막으려고' 맺는 상생 협약을 소개한다. 따라서 (다) - (가) - (나) - (라)이다."},
{"id":"k240","subj":"국어","unit":"문장 순서","q":"(가) ～ (라)를 맥락에 맞추어 가장 적절하게 나열한 것은?\n\n(가) 이 병의 치료법을 찾으려고 영국 해군의 군의관 제임스 린드는 1747년에 한 가지 시험을 했다. 병든 선원들을 여러 무리로 나누어 저마다 다른 음식을 더 먹였더니, 오렌지와 레몬을 먹은 무리만 빠르게 회복한 것이다.\n(나) 더구나 감귤류가 왜 효과가 있는지는 그때까지도 알지 못했다. 괴혈병이 비타민 시(C)가 모자라서 생긴다는 사실은 20세기에 들어와서야 밝혀졌다. 효과가 있는 방법을 찾는 일과 그 까닭을 아는 일 사이에는 이처럼 긴 시간이 놓이기도 한다.\n(다) 그러나 이 발견이 곧바로 받아들여진 것은 아니었다. 영국 해군이 모든 함정의 선원에게 레몬즙을 지급하도록 한 것은 그로부터 40여 년이 지난 뒤였다.\n(라) 먼바다를 항해하던 옛 선원들에게 가장 무서운 병은 괴혈병이었다. 잇몸에서 피가 나고 상처가 아물지 않다가 끝내 목숨을 잃는 이 병으로 긴 항해에서는 많은 선원이 쓰러졌고, 원인을 몰라 손쓸 방법도 없었다.","opts":["(가) - (라) - (다) - (나)","(다) - (가) - (라) - (나)","(라) - (가) - (나) - (다)","(라) - (가) - (다) - (나)"],"ans":3,"exp":"(라)가 괴혈병을 소개하고, (가)가 '이 병의 치료법'을 찾으려 한 린드의 시험과 그 결과를 말한다. (다)는 '그러나 이 발견'이 40여 년 뒤에야 받아들여졌다고 하고, (나)가 '더구나 … 그때까지도'로 받아 원인은 20세기에야 밝혀졌다고 덧붙인다. (나)의 '그때'는 (다)의 40여 년 뒤를 가리키므로 (나)가 (다)보다 앞설 수 없다. 따라서 (라) - (가) - (다) - (나)이다."},
{"id":"k241","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n추론은 이미 알고 있는 사실을 근거로 새로운 판단을 이끌어 내는 사고 과정이다. 추론은 전제와 결론의 관계에 따라 크게 둘로 나뉜다. 연역 추론은 전제가 모두 참이면 결론도 반드시 참이 되는 추론이다. 연역 추론의 결론은 확실하지만 지식의 범위를 넓혀 주지는 못한다. 반면 귀납 추론은 개별 사례들을 관찰하여 일반적인 결론이나 앞으로의 일에 대한 판단을 이끌어 내는 추론이다. 귀납 추론은 새로운 지식을 얻게 해 주지만, 전제가 모두 참이어도 결론이 거짓일 가능성이 남는다.\n어느 보건소 직원이 지난 5년 동안의 기록을 살펴보니 해마다 11월에 독감 환자가 늘기 시작했다. 그는 이를 근거로 '올해도 11월에 독감 환자가 늘기 시작할 것이다.'라고 판단했다. 이는 (가) ______에 해당한다. 지난 기록이 모두 사실이라 해도 올해는 유행이 늦어질 수 있기 때문이다. 한편 그는 '어르신 무료 접종 대상자는 모두 65세 이상이다.'와 '김 씨는 어르신 무료 접종 대상자이다.'라는 두 사실에서 '김 씨는 65세 이상이다.'라는 판단을 이끌어 냈다. 이는 (나) ______에 해당한다. 두 사실이 참인 한 이 판단이 거짓일 수는 없기 때문이다.","opts":["(가) 귀납 추론, (나) 귀납 추론","(가) 귀납 추론, (나) 연역 추론","(가) 연역 추론, (나) 귀납 추론","(가) 연역 추론, (나) 연역 추론"],"ans":1,"exp":"지난 5년의 사례를 근거로 올해의 일을 판단한 것은 개별 사례의 관찰에서 판단을 이끌어 낸 것이고, 기록이 모두 사실이어도 결론이 거짓일 수 있으므로 (가)는 귀납 추론이다. 두 사실이 참이면 '김 씨는 65세 이상이다.'가 거짓일 수 없으므로, 전제가 참이면 결론도 반드시 참이 되는 (나)는 연역 추론이다."},
{"id":"k242","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n어떤 사람의 경제 활동이 대가를 주고받지 않은 채 다른 사람에게 이익이나 손해를 끼치는 것을 외부 효과라고 한다. 다른 사람에게 이익을 주는 경우를 긍정적 외부 효과, 손해를 끼치는 경우를 부정적 외부 효과라고 부른다. 외부 효과가 있으면 시장은 사회에 가장 바람직한 양을 만들어 내지 못한다. 당사자는 자신이 치르는 비용과 자신이 얻는 이익만 따져서 행동하기 때문이다.\n공장이 물건을 만들면서 강물을 더럽히는 경우를 보자. 공장 주인은 하류의 주민이 입는 피해를 비용으로 치지 않으므로, 물건은 사회적으로 바람직한 수준보다 (가) ______ 생산된다. 반대로 예방 접종은 접종한 사람뿐 아니라 주변 사람이 감염될 위험까지 낮추어 준다. 그러나 개인은 자신이 얻는 이익만 생각하므로, 접종은 사회적으로 바람직한 수준에 못 미치게 된다.\n정부는 이런 어긋남을 바로잡으려고 한다. 오염 물질을 내보내는 공장에 부담금을 물리는 것은 남에게 끼친 손해를 당사자의 비용으로 돌려놓으려는 것이다. 한편 예방 접종 비용을 정부가 대신 내 주는 것은 (나) ______를 일으키는 활동이 더 많이 이루어지게 하려는 것이다.","opts":["(가) 많이, (나) 긍정적 외부 효과","(가) 많이, (나) 부정적 외부 효과","(가) 적게, (나) 긍정적 외부 효과","(가) 적게, (나) 부정적 외부 효과"],"ans":0,"exp":"공장 주인은 하류 주민의 피해를 비용으로 치지 않으므로 자신이 느끼는 비용이 사회 전체의 비용보다 작고, 그만큼 물건을 사회적으로 바람직한 수준보다 많이 만든다. 따라서 (가)는 '많이'이다. 예방 접종은 주변 사람이 감염될 위험까지 낮추어 남에게 이익을 주는 활동이므로 (나)는 '긍정적 외부 효과'이다."},
{"id":"k243","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n질병의 예방은 병에 걸리지 않게 하는 일만을 뜻하지 않는다. 보건학에서는 질병이 진행되는 단계에 맞추어 예방을 세 수준으로 나눈다. 일차 예방은 질병이 생기기 전에 그 원인을 없애거나 몸의 저항력을 길러 발병 자체를 막는 활동이다. 이차 예방은 이미 시작된 질병을 증상이 뚜렷해지기 전에 일찍 찾아내어 치료함으로써 병이 깊어지는 것을 막는 활동이다. 삼차 예방은 질병을 앓은 뒤에 남는 장애를 줄이고 일상으로 돌아가도록 돕는 활동이다.\n이 구분을 어느 보건소의 사업에 적용해 보자. 이 보건소는 주민을 대상으로 금연 교실과 영유아 예방 접종 사업을 운영한다. 두 사업은 병이 생기기 전에 원인을 줄이거나 저항력을 기르는 것이므로 (가) ______에 해당한다. 이 보건소는 또 마흔 살 이상의 주민에게 혈압과 혈당을 재어 주고, 수치가 높게 나온 사람을 병원 진료로 이어 준다. 본인도 모르던 고혈압과 당뇨병을 일찍 찾아내려는 것이므로 이는 (나) ______에 해당한다. 뇌졸중을 앓은 주민에게 재활 운동을 지도하는 사업까지 더하면, 이 보건소는 세 수준의 예방을 모두 수행하는 셈이다.","opts":["(가) 이차 예방, (나) 일차 예방","(가) 이차 예방, (나) 삼차 예방","(가) 일차 예방, (나) 이차 예방","(가) 일차 예방, (나) 삼차 예방"],"ans":2,"exp":"금연 교실과 예방 접종은 질병이 생기기 전에 원인을 줄이거나 저항력을 길러 발병 자체를 막는 활동이므로 (가)는 일차 예방이다. 혈압과 혈당을 재어 본인도 모르던 병을 일찍 찾아내고 진료로 이어 주는 것은 이미 시작된 질병을 일찍 찾아내어 치료하는 활동이므로 (나)는 이차 예방이다. 삼차 예방은 글의 끝에 나온 재활 운동 지도에 해당한다."},
{"id":"k244","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n문자는 무엇을 적느냐에 따라 표의 문자와 표음 문자로 나뉜다. 표의 문자는 글자 하나하나가 뜻을 나타내는 문자이고, 표음 문자는 글자가 뜻과 관계없이 소리만을 나타내는 문자이다. 표음 문자는 다시 글자 하나가 한 음절을 나타내는 음절 문자와, 글자 하나가 자음이나 모음 하나를 나타내는 음소 문자로 나뉜다. 음절 문자는 그 언어에 있는 음절의 수만큼 글자가 필요하지만, 음소 문자는 수십 개의 글자만으로 모든 소리를 적을 수 있다.\n한자 '山'은 '산'이라는 소리와 함께 '높이 솟은 땅'이라는 뜻을 나타내므로 표의 문자이다. 일본의 가나는 'か'라는 글자 하나가 [ka]라는 소리 덩어리를 통째로 나타내며, 이 글자를 자음을 나타내는 부분과 모음을 나타내는 부분으로 쪼갤 수 없다. 따라서 가나는 (가) ______에 속한다. 한글은 'ㄱ', 'ㅏ'처럼 자음과 모음을 나타내는 글자가 따로 있으므로 (나) ______이다. 다만 한글은 이 글자들을 '가', '강'처럼 음절 단위로 모아서 쓴다. 그래서 한글은 낱글자의 수가 적어 배우기 쉽다는 장점과, 음절의 경계가 눈에 잘 들어와 읽기 편하다는 장점을 함께 지닌다.","opts":["(가) 음소 문자, (나) 음절 문자","(가) 음소 문자, (나) 표의 문자","(가) 음절 문자, (나) 표의 문자","(가) 음절 문자, (나) 음소 문자"],"ans":3,"exp":"가나는 글자 하나가 [ka]와 같은 소리 덩어리, 곧 한 음절을 통째로 나타내고 자음과 모음으로 쪼갤 수 없으므로 (가)는 음절 문자이다. 한글은 자음과 모음을 나타내는 글자가 따로 있어 글자 하나가 자음이나 모음 하나를 나타내므로 (나)는 음소 문자이다. 음절 단위로 모아 쓰는 것은 적는 방식일 뿐이고, 한글의 글자는 뜻이 아니라 소리를 나타내므로 표의 문자도 아니다."},
{"id":"k245","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n합리적인 선택을 하려면 비용을 제대로 따져야 한다. 경제학에서 말하는 비용에는 실제로 치른 돈만 들어가는 것이 아니다. 어떤 것을 선택함으로써 포기하게 되는 것 가운데 가장 가치가 큰 것을 기회비용이라고 하는데, 선택을 할 때에는 이것까지 비용에 넣어야 한다. 반대로 이미 써 버려서 어떤 선택을 하든 되찾을 수 없는 비용은 매몰 비용이라고 한다. 매몰 비용은 앞으로의 선택에 따라 달라지지 않으므로 선택을 할 때 고려해서는 안 된다.\n직장인 갑은 주말에 열리는 유료 강좌를 들을지 고민하고 있다. 수강료는 5만 원인데, 강좌를 듣지 않으면 그 시간에 아르바이트를 하여 8만 원을 벌 수 있다. 이때 갑이 포기하는 8만 원은 강좌를 듣는 선택의 (가) ______에 들어간다. 한편 을은 3만 원을 주고 환불이 되지 않는 공연 표를 샀는데, 공연 당일에 몸살이 났다. 을이 '표 값이 아까우니 아파도 가야 한다.'라고 생각한다면 (나) ______에 얽매여 판단을 그르치는 것이다. 표 값은 공연을 보든 안 보든 돌아오지 않으므로, 지금 따질 것은 공연을 보는 즐거움과 집에서 쉬는 편안함 가운데 어느 쪽이 더 큰가 하는 점뿐이다.","opts":["(가) 기회비용, (나) 매몰 비용","(가) 기회비용, (나) 기회비용","(가) 매몰 비용, (나) 매몰 비용","(가) 매몰 비용, (나) 기회비용"],"ans":0,"exp":"갑이 강좌를 들으면 아르바이트로 벌 수 있었던 8만 원을 포기하게 되므로, 이 8만 원은 선택 때문에 포기하는 것의 가치인 기회비용이다. 을의 표 값 3만 원은 환불이 되지 않아 공연을 보든 안 보든 되찾을 수 없으므로 매몰 비용이다. 따라서 (가)는 기회비용, (나)는 매몰 비용이다."},
{"id":"k246","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n질병을 가려내는 검사가 얼마나 정확한지는 두 가지 지표로 나타낸다. 민감도는 실제로 병이 있는 사람 가운데 검사에서 양성으로 나오는 사람의 비율이다. 민감도가 낮은 검사는 병이 있는데도 음성으로 나오는 사람, 곧 '거짓 음성'을 많이 만들어 낸다. 특이도는 실제로 병이 없는 사람 가운데 검사에서 음성으로 나오는 사람의 비율이다. 특이도가 낮은 검사는 병이 없는데도 양성으로 나오는 사람, 곧 '거짓 양성'을 많이 만들어 낸다. 두 지표가 모두 높으면 좋겠지만, 양성으로 판정하는 기준을 느슨하게 잡으면 민감도는 오르고 특이도는 내려가는 것이 보통이다.\n어떤 지표를 더 중시할지는 검사의 목적에 따라 다르다. 전파력이 강한 감염병이 유행할 때에는 환자를 한 명이라도 놓치면 피해가 커진다. 그래서 이런 때에 많은 사람을 대상으로 하는 선별 검사에는 (가) ______가 높은 검사가 알맞다. 반면 양성 판정이 곧바로 위험 부담이 큰 수술로 이어지는 경우라면, 병이 없는 사람이 양성으로 잘못 판정되는 일을 줄여야 한다. 그래서 수술을 결정하기 전에 (나) ______가 높은 검사로 다시 확인하는 절차를 둔다.","opts":["(가) 민감도, (나) 민감도","(가) 민감도, (나) 특이도","(가) 특이도, (나) 민감도","(가) 특이도, (나) 특이도"],"ans":1,"exp":"환자를 한 명이라도 놓치지 않으려면 병이 있는데도 음성으로 나오는 거짓 음성이 적어야 하므로 (가)는 민감도이다. 병이 없는 사람이 양성으로 잘못 판정되는 거짓 양성을 줄이려면 병이 없는 사람을 음성으로 가려내는 비율이 높아야 하므로 (나)는 특이도이다."},
{"id":"k247","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n거래의 한쪽이 다른 쪽보다 더 많은 정보를 가진 상황을 정보의 비대칭이라고 한다. 정보의 비대칭은 두 가지 문제를 낳는다. 하나는 역선택이다. 이는 계약을 맺기 전에 상대의 숨겨진 특성을 알 수 없어서, 정보가 부족한 쪽이 바람직하지 않은 상대와 거래하게 되는 현상이다. 다른 하나는 도덕적 해이이다. 이는 계약을 맺은 뒤에 상대의 행동을 일일이 지켜볼 수 없어서, 정보를 가진 쪽이 계약 전보다 주의를 덜 기울이게 되는 현상이다.\n보험 시장은 두 문제가 함께 나타나는 대표적인 곳이다. 보험 회사는 가입하려는 사람의 건강 상태를 정확히 알기 어렵다. 그래서 누구에게나 같은 보험료를 받으면 자신의 건강이 나쁘다는 것을 아는 사람일수록 더 적극적으로 가입한다. 이는 (가) ______의 사례이다. 보험 회사가 가입 전에 건강 검진 결과를 요구하는 것은 이 때문이다. 한편 자동차 보험에 든 운전자가 사고가 나도 보험으로 처리하면 된다고 여겨 운전을 덜 조심하게 된다면 이는 (나) ______의 사례이다. 사고를 낸 가입자의 보험료를 올리거나 손해액의 일부를 가입자가 부담하게 하는 것은 이를 막기 위한 장치이다.","opts":["(가) 도덕적 해이, (나) 도덕적 해이","(가) 도덕적 해이, (나) 역선택","(가) 역선택, (나) 도덕적 해이","(가) 역선택, (나) 역선택"],"ans":2,"exp":"건강이 나쁜 사람일수록 더 적극적으로 가입하는 것은 계약을 맺기 전에 가입자의 숨겨진 특성을 알 수 없어서 보험 회사가 바람직하지 않은 상대와 거래하게 되는 것이므로 (가)는 역선택이다. 보험에 든 뒤에 운전을 덜 조심하는 것은 계약을 맺은 뒤에 주의를 덜 기울이게 되는 것이므로 (나)는 도덕적 해이이다."},
{"id":"k248","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n행동주의 심리학은 학습을 경험에 따라 행동이 달라지는 과정으로 본다. 학습이 이루어지는 방식은 두 가지로 설명된다. 고전적 조건 형성은 본래 아무 반응도 일으키지 않던 자극이, 반응을 저절로 일으키는 자극과 되풀이하여 함께 주어진 결과 그 자극만으로도 반응을 일으키게 되는 것이다. 먹이를 줄 때마다 종소리를 들려주면 개가 나중에는 종소리만 듣고도 침을 흘리게 되는 것이 그 예이다. 여기에서 학습되는 것은 침 흘리기처럼 의지와 관계없이 일어나는 반응이다. 조작적 조건 형성은 스스로 한 행동에 어떤 결과가 뒤따르느냐에 따라 그 행동의 빈도가 달라지는 것이다. 좋은 결과가 따르는 행동은 늘어나고, 나쁜 결과가 따르는 행동은 줄어든다.\n주사를 몇 차례 맞아 본 아이가 흰 가운을 입은 사람만 보아도 울음을 터뜨리는 것은 (가) ______으로 설명할 수 있다. 가운 자체는 아픔을 주지 않지만 주사의 아픔과 여러 번 함께 나타났기 때문이다. 한편 주사를 잘 맞을 때마다 칭찬 딱지를 받은 아이가 점점 의젓하게 팔을 내밀게 되는 것은 (나) ______으로 설명할 수 있다.","opts":["(가) 조작적 조건 형성, (나) 조작적 조건 형성","(가) 조작적 조건 형성, (나) 고전적 조건 형성","(가) 고전적 조건 형성, (나) 고전적 조건 형성","(가) 고전적 조건 형성, (나) 조작적 조건 형성"],"ans":3,"exp":"흰 가운은 본래 아픔을 주지 않지만 주사의 아픔과 여러 번 함께 나타난 결과 가운만 보아도 울음이 나오게 된 것이므로, 종소리와 침의 예와 같은 고전적 조건 형성이 (가)에 들어간다. 주사를 잘 맞는 행동에 칭찬 딱지라는 좋은 결과가 따라 그 행동이 늘어난 것은 행동의 결과에 따라 빈도가 달라지는 것이므로 (나)는 조작적 조건 형성이다."},
{"id":"k249","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n역사가는 과거를 직접 볼 수 없으므로 과거가 남긴 흔적인 사료를 통해 과거에 다가간다. 사료는 흔히 일차 사료와 이차 사료로 나뉜다. 일차 사료는 사건이 일어난 당시에 그 사건을 직접 겪거나 본 사람이 남긴 기록이나 유물이다. 일기, 편지, 관청의 문서, 당시의 신문 기사 등이 여기에 든다. 이차 사료는 후대 사람이 일차 사료를 바탕으로 정리하거나 해석하여 쓴 것으로, 역사책과 연구 논문이 대표적이다.\n같은 자료라도 무엇을 알아보려 하느냐에 따라 구분이 달라질 수 있다. 임진왜란 때 이순신이 진중에서 적은 『난중일기』는 임진왜란을 연구하는 사람에게 (가) ______이다. 20세기의 어느 학자가 여러 기록을 모아 쓴 임진왜란 개설서는 같은 연구자에게 이차 사료이다. 그런데 누군가 '20세기의 학자들은 임진왜란을 어떻게 바라보았는가'를 연구한다면, 그 개설서는 당시 학자의 생각을 직접 보여 주는 자료이므로 이 연구에서는 (나) ______의 구실을 한다.\n물론 일차 사료라고 해서 그대로 믿을 수 있는 것은 아니다. 기록한 사람의 처지와 의도에 따라 사실이 부풀려지거나 빠질 수 있으므로, 역사가는 사료가 믿을 만한지를 먼저 따진다.","opts":["(가) 일차 사료, (나) 일차 사료","(가) 일차 사료, (나) 이차 사료","(가) 이차 사료, (나) 일차 사료","(가) 이차 사료, (나) 이차 사료"],"ans":0,"exp":"『난중일기』는 임진왜란을 직접 겪은 사람이 당시에 남긴 기록이므로 임진왜란 연구에서 일차 사료이다. 20세기의 개설서는 임진왜란 연구에서는 이차 사료이지만, '20세기의 학자들이 임진왜란을 어떻게 바라보았는가'를 연구할 때에는 연구 대상인 당시 학자의 생각을 직접 보여 주는 자료이므로 일차 사료의 구실을 한다. 따라서 (가)와 (나)는 모두 일차 사료이다."},
{"id":"k250","subj":"국어","unit":"빈칸 추론","q":"다음 글의 (가), (나)에 들어갈 말을 적절하게 나열한 것은?\n\n열은 온도가 높은 곳에서 낮은 곳으로 이동하며, 그 방식에는 세 가지가 있다. 전도는 서로 닿아 있는 물체 사이에서, 또는 한 물체 안에서 입자의 움직임이 이웃 입자로 차례차례 전해지며 열이 이동하는 방식이다. 대류는 액체나 기체가 직접 움직이면서 열을 실어 나르는 방식이다. 데워진 부분은 가벼워져 위로 올라가고 차가운 부분은 내려오면서 전체가 고루 데워진다. 복사는 물질의 도움 없이 열이 빛과 같은 전자기파의 형태로 직접 전달되는 방식이다.\n보온병에는 이 세 가지 이동을 모두 막는 장치가 들어 있다. 보온병의 벽은 이중으로 되어 있고 그 사이는 공기를 빼낸 진공 상태이다. 진공에는 열을 전하거나 실어 나를 물질이 없어 전도와 대류가 일어나지 않는다. 그러나 (가) ______는 진공에서도 일어난다. 태양의 열이 텅 빈 우주 공간을 지나 지구에 닿는 것이 바로 이 방식이다. 그래서 보온병의 안쪽 벽은 거울처럼 은빛으로 도금하여 열을 되비추게 한다. 한편 병의 마개를 열이 잘 전해지지 않는 플라스틱으로 만드는 것은, 내용물의 열이 마개를 타고 바깥으로 빠져나가는 (나) ______를 줄이기 위한 것이다.","opts":["(가) 대류, (나) 전도","(가) 복사, (나) 전도","(가) 대류, (나) 복사","(가) 복사, (나) 대류"],"ans":1,"exp":"복사는 물질의 도움 없이 열이 전자기파의 형태로 직접 전달되는 방식이므로 물질이 없는 진공에서도 일어난다. 따라서 (가)는 복사이다. 열이 마개라는 물체를 타고 전해지는 것은 한 물체 안에서 입자의 움직임이 이웃 입자로 전해지는 방식이므로 (나)는 전도이다. 대류는 액체나 기체가 직접 움직여야 하므로 진공에서도, 고체인 마개 안에서도 일어나지 않는다."},
{"id":"k251","subj":"국어","unit":"내용 이해","q":"윗글을 이해한 내용으로 가장 적절한 것은?\n\n조선 시대에는 임금이 세상을 떠나면 다음 임금 때 실록청을 임시로 두어 앞선 임금 대의 역사를 실록으로 엮었다. 편찬의 바탕이 된 자료 가운데 으뜸은 사초였다. 사초는 사관이 임금 곁에서 나랏일이 논의되는 과정을 받아 적은 기록인데, 크게 두 가지로 나뉜다. 하나는 사관이 그날그날 적어 춘추관에 낸 것으로, 춘추관은 이것과 각 관청의 업무 기록을 모아 시정기를 만들었다. 다른 하나는 사관이 보고 들은 일에 인물에 대한 평가나 자신의 의견을 덧붙여 집에 간직해 둔 것으로, 이를 가장사초라고 한다. 가장사초는 평소에는 내지 않다가 실록청이 설치되면 정해진 기한 안에 제출하였다.\n사초에는 임금과 대신의 잘잘못이 그대로 적혔으므로 그 내용이 새어 나가면 사관이 화를 입을 수 있었다. 그래서 조선은 사초를 사관 말고는 누구도 보지 못하게 하였고, 임금이라도 예외를 두지 않았다. 사관이 사초의 내용을 고치거나 지우는 일, 남에게 알리는 일도 엄하게 벌하였다. 실록이 완성된 뒤에는 편찬에 쓴 사초와 초고를 물에 씻어 글자를 없앴는데, 이를 세초라고 한다. 세초는 기록이 밖으로 흘러나가 시비가 ㉠ __이는__ 것을 막는 한편, 귀한 종이를 다시 쓰기 위한 것이기도 하였다.\n완성된 실록 역시 임금이 마음대로 꺼내 볼 수 없었다. 나랏일에 참고할 일이 생기면 사관이 사고에 가서 필요한 대목만 베껴 와 아뢰었다. 임금이 자기 대의 사초는 물론 앞선 임금의 실록도 직접 볼 수 없게 한 것은, 훗날 읽힐 것을 의식한 사관이 붓을 굽히는 일을 막기 위해서였다.","opts":["시정기는 사관이 집에 간직해 두었다가 낸 기록이다.","실록을 엮은 뒤 사초를 없앤 데에는 실용적인 까닭도 있었다.","임금은 앞선 임금의 실록에 한하여 직접 꺼내어 볼 수 있었다.","가장사초에는 사관의 의견을 빼고 보고 들은 사실만을 적게 하였다."],"ans":1,"exp":"세초는 기록이 새어 나가 시비가 이는 것을 막는 한편 귀한 종이를 다시 쓰기 위한 것이기도 했다고 하였으므로, 사초를 없앤 데에 실용적인 까닭도 있었다는 진술이 적절하다. 집에 간직해 두었다가 실록청에 낸 것은 시정기가 아니라 가장사초이고, 가장사초에는 인물에 대한 평가와 사관의 의견이 덧붙었다. 임금은 앞선 임금의 실록도 직접 볼 수 없었고 사관이 필요한 대목만 베껴 와 아뢰었다."},
{"id":"k252","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n조선 시대에는 임금이 세상을 떠나면 다음 임금 때 실록청을 임시로 두어 앞선 임금 대의 역사를 실록으로 엮었다. 편찬의 바탕이 된 자료 가운데 으뜸은 사초였다. 사초는 사관이 임금 곁에서 나랏일이 논의되는 과정을 받아 적은 기록인데, 크게 두 가지로 나뉜다. 하나는 사관이 그날그날 적어 춘추관에 낸 것으로, 춘추관은 이것과 각 관청의 업무 기록을 모아 시정기를 만들었다. 다른 하나는 사관이 보고 들은 일에 인물에 대한 평가나 자신의 의견을 덧붙여 집에 간직해 둔 것으로, 이를 가장사초라고 한다. 가장사초는 평소에는 내지 않다가 실록청이 설치되면 정해진 기한 안에 제출하였다.\n사초에는 임금과 대신의 잘잘못이 그대로 적혔으므로 그 내용이 새어 나가면 사관이 화를 입을 수 있었다. 그래서 조선은 사초를 사관 말고는 누구도 보지 못하게 하였고, 임금이라도 예외를 두지 않았다. 사관이 사초의 내용을 고치거나 지우는 일, 남에게 알리는 일도 엄하게 벌하였다. 실록이 완성된 뒤에는 편찬에 쓴 사초와 초고를 물에 씻어 글자를 없앴는데, 이를 세초라고 한다. 세초는 기록이 밖으로 흘러나가 시비가 ㉠ __이는__ 것을 막는 한편, 귀한 종이를 다시 쓰기 위한 것이기도 하였다.\n완성된 실록 역시 임금이 마음대로 꺼내 볼 수 없었다. 나랏일에 참고할 일이 생기면 사관이 사고에 가서 필요한 대목만 베껴 와 아뢰었다. 임금이 자기 대의 사초는 물론 앞선 임금의 실록도 직접 볼 수 없게 한 것은, 훗날 읽힐 것을 의식한 사관이 붓을 굽히는 일을 막기 위해서였다.","opts":["어머니는 밥을 지으려고 쌀을 __일었다__.","오래 입은 스웨터에 보풀이 잔뜩 __일었다__.","꺼져 가던 숯불이 부채질에 다시 __일기__ 시작했다.","새 제도의 시행을 앞두고 곳곳에서 논란이 __일고__ 있다."],"ans":3,"exp":"㉠의 '일다'는 '없던 현상이 생기다'라는 뜻이고, '논란이 일고 있다'의 '일다'가 같은 뜻이다. '쌀을 일다'는 곡식을 물에 흔들어 쓸 것과 못 쓸 것을 가려낸다는 뜻의 다른 단어이다. '보풀이 일다'는 '겉으로 부풀거나 위로 솟아오르다', '숯불이 일다'는 '약하던 것이 왕성하여지다'의 뜻이다."},
{"id":"k253","subj":"국어","unit":"내용 이해","q":"윗글을 이해한 내용으로 적절하지 않은 것은?\n\n판소리는 소리꾼 한 사람이 북을 치는 고수의 장단에 맞추어 긴 이야기를 엮어 가는 공연 예술이다. 소리꾼이 이야기를 전하는 방식은 셋으로 나뉜다. 가락에 얹어 부르는 대목을 창이라 하고, 가락 없이 말로 풀어 가는 대목을 아니리라 하며, 부채를 펴거나 몸을 움직여 장면을 그려 보이는 동작을 발림이라 한다. 창이 인물의 감정이 고조되는 장면을 ㉠ __맡는다면__, 아니리는 시간과 장소가 바뀌는 사정을 알리거나 인물들의 대화를 전하는 데 주로 쓰인다. 소리꾼은 창을 길게 이어 가다가 아니리에 이르러 숨을 고르고, 청중도 팽팽하던 긴장을 풀며 웃음을 터뜨린다. 판소리가 창과 아니리를 번갈아 ㉡ __두는__ 까닭이 여기에 있다.\n고수는 반주자에 그치지 않는다. 북으로 장단을 짚어 소리의 빠르기를 이끌고, ‘얼씨구’, ‘좋다’ 같은 추임새를 넣어 소리꾼의 흥을 ㉢ __돋운다__. 소리꾼이 아니리로 말을 건네면 고수가 상대역이 되어 받아 주기도 한다. 추임새는 고수만 하는 것이 아니어서 청중도 마음이 움직이는 대목에서 추임새를 넣는다. 서양의 음악회에서는 연주 도중에 소리를 내는 일이 예의에 어긋난다고 여겨지지만, 판소리에서는 청중의 추임새가 없으면 오히려 판이 식는다고 여긴다.\n판소리는 정해진 대본을 그대로 옮기는 예술도 아니다. 소리꾼은 스승에게서 배운 사설과 가락을 바탕으로 삼되, 그날 판의 분위기와 청중의 반응을 ㉣ __살펴__ 어떤 대목은 늘이고 어떤 대목은 줄인다. 그러므로 같은 소리꾼이 같은 작품을 불러도 판마다 길이와 맛이 달라진다. 판소리는 무대에서 객석으로 건네는 예술이라기보다 판에 모인 이들이 함께 만들어 가는 예술이라고 할 수 있다.","opts":["추임새는 고수와 청중이 모두 넣을 수 있다.","아니리는 청중이 긴장을 풀 틈을 마련해 준다.","발림은 가락 없이 말로 장면을 풀어 가는 대목이다.","같은 작품이라도 판에 따라 공연의 길이가 달라질 수 있다."],"ans":2,"exp":"가락 없이 말로 풀어 가는 대목은 아니리이고, 발림은 부채를 펴거나 몸을 움직여 장면을 그려 보이는 동작이므로 발림을 말로 풀어 가는 대목이라고 한 진술은 적절하지 않다. 추임새는 고수뿐 아니라 청중도 넣고, 아니리에 이르면 청중이 긴장을 풀며 웃음을 터뜨린다. 소리꾼이 판의 분위기에 따라 대목을 늘이고 줄이므로 판마다 길이가 달라진다."},
{"id":"k254","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n판소리는 소리꾼 한 사람이 북을 치는 고수의 장단에 맞추어 긴 이야기를 엮어 가는 공연 예술이다. 소리꾼이 이야기를 전하는 방식은 셋으로 나뉜다. 가락에 얹어 부르는 대목을 창이라 하고, 가락 없이 말로 풀어 가는 대목을 아니리라 하며, 부채를 펴거나 몸을 움직여 장면을 그려 보이는 동작을 발림이라 한다. 창이 인물의 감정이 고조되는 장면을 ㉠ __맡는다면__, 아니리는 시간과 장소가 바뀌는 사정을 알리거나 인물들의 대화를 전하는 데 주로 쓰인다. 소리꾼은 창을 길게 이어 가다가 아니리에 이르러 숨을 고르고, 청중도 팽팽하던 긴장을 풀며 웃음을 터뜨린다. 판소리가 창과 아니리를 번갈아 ㉡ __두는__ 까닭이 여기에 있다.\n고수는 반주자에 그치지 않는다. 북으로 장단을 짚어 소리의 빠르기를 이끌고, ‘얼씨구’, ‘좋다’ 같은 추임새를 넣어 소리꾼의 흥을 ㉢ __돋운다__. 소리꾼이 아니리로 말을 건네면 고수가 상대역이 되어 받아 주기도 한다. 추임새는 고수만 하는 것이 아니어서 청중도 마음이 움직이는 대목에서 추임새를 넣는다. 서양의 음악회에서는 연주 도중에 소리를 내는 일이 예의에 어긋난다고 여겨지지만, 판소리에서는 청중의 추임새가 없으면 오히려 판이 식는다고 여긴다.\n판소리는 정해진 대본을 그대로 옮기는 예술도 아니다. 소리꾼은 스승에게서 배운 사설과 가락을 바탕으로 삼되, 그날 판의 분위기와 청중의 반응을 ㉣ __살펴__ 어떤 대목은 늘이고 어떤 대목은 줄인다. 그러므로 같은 소리꾼이 같은 작품을 불러도 판마다 길이와 맛이 달라진다. 판소리는 무대에서 객석으로 건네는 예술이라기보다 판에 모인 이들이 함께 만들어 가는 예술이라고 할 수 있다.","opts":["㉠: 맡긴다면","㉡: 배치하는","㉢: 북돋운다","㉣: 헤아려"],"ans":0,"exp":"㉠은 창이 그 장면을 스스로 담당한다는 뜻이므로 '담당한다면' 정도로 바꿀 수 있다. '맡긴다면'은 남에게 담당하게 한다는 뜻이어서 창이 장면을 다른 것에 넘긴다는 말이 되므로 바꿔 쓸 수 없다. '두는'은 '배치하는', '돋운다'는 '북돋운다', '살펴'는 '헤아려'와 뜻이 통한다."},
{"id":"k255","subj":"국어","unit":"내용 이해","q":"윗글을 이해한 내용으로 가장 적절한 것은?\n\n정책을 결정하는 사람은 어떻게 대안을 고르는가. 합리 모형은 결정자가 문제를 빠짐없이 파악하고, 가능한 대안을 모두 찾아 각각의 결과를 예측한 뒤, 목표를 가장 잘 이루는 대안을 고른다고 가정한다. 이 모형은 결정이 따라야 할 이상을 보여 주지만, 현실의 결정자가 그만한 정보와 시간과 계산 능력을 갖추기는 어렵다.\n사이먼은 이 점에 주목하여 만족 모형을 내놓았다. 사람의 합리성에는 한계가 있으므로, 결정자는 모든 대안을 견주지 않고 대안을 하나씩 차례로 살피다가 미리 ㉠ __잡아__ 둔 기준을 넘는 대안을 만나면 거기에서 탐색을 멈춘다는 것이다. 이때 선택되는 것은 가장 좋은 대안이 아니라 그만하면 됐다 싶은 대안이다.\n린드블롬의 점증 모형은 여기에 정치의 현실을 더하였다. 정책은 백지에서 새로 그려지지 않는다. 결정자는 지금 시행되는 정책을 출발점으로 삼아 그것을 조금 고친 대안 몇 가지만을 살피고, 이해관계가 다른 집단들이 받아들일 수 있는 선에서 타협한다. 올해 예산이 지난해 예산에서 조금 늘거나 줄어든 꼴로 짜이는 것이 좋은 예이다. 점증 모형은 실제 결정 과정을 잘 설명하고, 한꺼번에 크게 바꾸었다가 실패할 위험을 ㉡ __덜어__ 준다는 장점이 있다. 잘못되더라도 고치기 쉽기 때문이다.\n그러나 점증 모형에도 약점이 있다. 기존 정책이 잘못된 방향으로 가고 있을 때에는 조금씩 고치는 것으로 문제를 ㉢ __풀__ 수 없다. 사회가 급하게 변하여 과감한 전환이 필요한 때에도 알맞지 않다. 또 타협에 참여할 힘이 있는 집단의 이익만 반영되어, 목소리가 약한 집단은 계속 밀려날 수 있다. 그래서 큰 방향을 정하는 근본적인 결정에는 넓게 살피는 합리 모형의 방식을, 그 뒤의 세부 결정에는 점증 모형의 방식을 쓰자는 절충안이 ㉣ __나오기도__ 하였다.","opts":["합리 모형은 현실의 결정 과정을 가장 잘 설명하는 모형이다.","만족 모형에서 결정자는 모든 대안을 견준 뒤에 하나를 고른다.","점증 모형에 따르면 새 정책은 기존 정책과 크게 다르지 않게 된다.","점증 모형은 사회가 급변하여 과감한 전환이 필요할 때에 잘 들어맞는다."],"ans":2,"exp":"점증 모형에서 결정자는 지금 시행되는 정책을 출발점으로 삼아 그것을 조금 고친 대안만 살피므로, 새 정책은 기존 정책과 크게 다르지 않게 된다. 합리 모형은 이상을 보여 줄 뿐 현실의 결정자가 따르기 어렵고, 실제 결정 과정을 잘 설명하는 것은 점증 모형이다. 만족 모형의 결정자는 모든 대안을 견주지 않고 기준을 넘는 대안을 만나면 탐색을 멈추며, 점증 모형은 과감한 전환이 필요한 때에는 알맞지 않다."},
{"id":"k256","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n정책을 결정하는 사람은 어떻게 대안을 고르는가. 합리 모형은 결정자가 문제를 빠짐없이 파악하고, 가능한 대안을 모두 찾아 각각의 결과를 예측한 뒤, 목표를 가장 잘 이루는 대안을 고른다고 가정한다. 이 모형은 결정이 따라야 할 이상을 보여 주지만, 현실의 결정자가 그만한 정보와 시간과 계산 능력을 갖추기는 어렵다.\n사이먼은 이 점에 주목하여 만족 모형을 내놓았다. 사람의 합리성에는 한계가 있으므로, 결정자는 모든 대안을 견주지 않고 대안을 하나씩 차례로 살피다가 미리 ㉠ __잡아__ 둔 기준을 넘는 대안을 만나면 거기에서 탐색을 멈춘다는 것이다. 이때 선택되는 것은 가장 좋은 대안이 아니라 그만하면 됐다 싶은 대안이다.\n린드블롬의 점증 모형은 여기에 정치의 현실을 더하였다. 정책은 백지에서 새로 그려지지 않는다. 결정자는 지금 시행되는 정책을 출발점으로 삼아 그것을 조금 고친 대안 몇 가지만을 살피고, 이해관계가 다른 집단들이 받아들일 수 있는 선에서 타협한다. 올해 예산이 지난해 예산에서 조금 늘거나 줄어든 꼴로 짜이는 것이 좋은 예이다. 점증 모형은 실제 결정 과정을 잘 설명하고, 한꺼번에 크게 바꾸었다가 실패할 위험을 ㉡ __덜어__ 준다는 장점이 있다. 잘못되더라도 고치기 쉽기 때문이다.\n그러나 점증 모형에도 약점이 있다. 기존 정책이 잘못된 방향으로 가고 있을 때에는 조금씩 고치는 것으로 문제를 ㉢ __풀__ 수 없다. 사회가 급하게 변하여 과감한 전환이 필요한 때에도 알맞지 않다. 또 타협에 참여할 힘이 있는 집단의 이익만 반영되어, 목소리가 약한 집단은 계속 밀려날 수 있다. 그래서 큰 방향을 정하는 근본적인 결정에는 넓게 살피는 합리 모형의 방식을, 그 뒤의 세부 결정에는 점증 모형의 방식을 쓰자는 절충안이 ㉣ __나오기도__ 하였다.","opts":["㉠: 설정(設定)해","㉡: 경감(輕減)해","㉢: 해제(解除)할","㉣: 제기(提起)되기도"],"ans":2,"exp":"㉢의 '풀다'는 문제를 해결한다는 뜻이므로 '해결(解決)할'로 바꿀 수 있다. '해제(解除)하다'는 묶인 것이나 금지한 것을 풀어 자유롭게 한다는 뜻이어서 '문제를 해제하다'라고 쓸 수 없다. 기준을 '잡다'는 '설정하다', 위험을 '덜다'는 '경감하다', 절충안이 '나오다'는 '제기되다'와 뜻이 통한다."},
{"id":"k257","subj":"국어","unit":"내용 이해","q":"윗글을 이해한 내용으로 가장 적절한 것은?\n\n르네상스 시대의 화가들은 평평한 화면에 깊이를 만들어 내려고 선 원근법을 다듬었다. 선 원근법에서 화가는 한자리에 서서 한쪽 눈으로 세계를 본다고 가정한다. 화면 속의 평행선들은 멀어질수록 가까워지다가 한 점에서 만나는데, ㉠ __이 점__을 소실점이라 한다. 같은 크기의 사물도 화가에게서 멀수록 작게 그려지므로, 그림을 보는 사람은 화가가 섰던 ㉡ __그 자리__에 서서 창밖을 내다보듯 화면 속 공간을 들여다보게 된다. 선 원근법으로 그린 그림이 흔히 ‘창’에 비유되는 까닭이다.\n동아시아의 산수화는 다른 길을 걸었다. 북송의 화가 곽희는 산을 그리는 세 가지 방법을 말하였다. 산 아래에서 꼭대기를 올려다보는 고원, 산 앞에서 산 뒤쪽을 넘겨다보는 심원, 가까운 산에서 먼 산을 바라보는 평원이 그것이다. 눈여겨볼 것은 이 셋이 한 폭 안에 함께 쓰인다는 점이다. 이를테면 화면 아래쪽의 계곡은 내려다본 모습으로, 가운데의 봉우리는 올려다본 모습으로, 그 너머의 먼 산은 멀리 바라본 모습으로 그려진다. 산수화에는 화면 전체를 다스리는 ㉢ __하나의 시점__이 없는 셈이다.\n이 차이는 그림을 보는 방식의 차이로 이어진다. 선 원근법의 그림 앞에서 감상자는 ㉣ __정해진 한 지점__에 머물러 있지만, 산수화 앞에서는 화면 속으로 들어가 골짜기를 거닐고 봉우리에 오르며 시선을 옮겨 간다. 곽희가 좋은 산수의 조건으로 ‘노닐 만하고 머물러 살 만한 곳’을 든 것도 이와 무관하지 않다. 서양의 풍경화가 어느 한순간 어느 한자리에서 본 세계를 붙잡으려 했다면, 산수화는 산을 오르내리며 겪은 여러 순간을 한 화면에 포개어 놓으려 한 것이다.","opts":["곽희가 말한 세 가지 방법은 한 폭에 섞어 쓰지 않는다.","선 원근법에서 사물의 크기는 화가와의 거리에 따라 달라진다.","심원은 산 아래에서 산꼭대기를 올려다보는 시선으로 그리는 방법이다.","산수화를 보는 사람은 화가가 정해 둔 한자리에 머물러 화면을 바라본다."],"ans":1,"exp":"선 원근법에서는 같은 크기의 사물도 화가에게서 멀수록 작게 그려진다고 하였으므로, 사물의 크기가 화가와의 거리에 따라 달라진다는 진술이 적절하다. 고원·심원·평원은 한 폭 안에 함께 쓰이고, 산 아래에서 꼭대기를 올려다보는 것은 심원이 아니라 고원이다. 한 지점에 머무는 것은 선 원근법 그림의 감상자이고, 산수화의 감상자는 화면 속을 거닐며 시선을 옮긴다."},
{"id":"k258","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 문맥상 가리키는 대상이 나머지와 다른 하나는?\n\n르네상스 시대의 화가들은 평평한 화면에 깊이를 만들어 내려고 선 원근법을 다듬었다. 선 원근법에서 화가는 한자리에 서서 한쪽 눈으로 세계를 본다고 가정한다. 화면 속의 평행선들은 멀어질수록 가까워지다가 한 점에서 만나는데, ㉠ __이 점__을 소실점이라 한다. 같은 크기의 사물도 화가에게서 멀수록 작게 그려지므로, 그림을 보는 사람은 화가가 섰던 ㉡ __그 자리__에 서서 창밖을 내다보듯 화면 속 공간을 들여다보게 된다. 선 원근법으로 그린 그림이 흔히 ‘창’에 비유되는 까닭이다.\n동아시아의 산수화는 다른 길을 걸었다. 북송의 화가 곽희는 산을 그리는 세 가지 방법을 말하였다. 산 아래에서 꼭대기를 올려다보는 고원, 산 앞에서 산 뒤쪽을 넘겨다보는 심원, 가까운 산에서 먼 산을 바라보는 평원이 그것이다. 눈여겨볼 것은 이 셋이 한 폭 안에 함께 쓰인다는 점이다. 이를테면 화면 아래쪽의 계곡은 내려다본 모습으로, 가운데의 봉우리는 올려다본 모습으로, 그 너머의 먼 산은 멀리 바라본 모습으로 그려진다. 산수화에는 화면 전체를 다스리는 ㉢ __하나의 시점__이 없는 셈이다.\n이 차이는 그림을 보는 방식의 차이로 이어진다. 선 원근법의 그림 앞에서 감상자는 ㉣ __정해진 한 지점__에 머물러 있지만, 산수화 앞에서는 화면 속으로 들어가 골짜기를 거닐고 봉우리에 오르며 시선을 옮겨 간다. 곽희가 좋은 산수의 조건으로 ‘노닐 만하고 머물러 살 만한 곳’을 든 것도 이와 무관하지 않다. 서양의 풍경화가 어느 한순간 어느 한자리에서 본 세계를 붙잡으려 했다면, 산수화는 산을 오르내리며 겪은 여러 순간을 한 화면에 포개어 놓으려 한 것이다.","opts":["㉠","㉡","㉢","㉣"],"ans":0,"exp":"㉡ '그 자리', ㉢ '하나의 시점', ㉣ '정해진 한 지점'은 모두 선 원근법에서 화가가 서서 세계를 바라보는 고정된 위치, 곧 그림을 보는 자리를 가리킨다. ㉠ '이 점'은 화면 속에서 평행선들이 만나는 소실점으로, 보는 사람의 위치가 아니라 화면 안의 한 점이다."},
{"id":"k259","subj":"국어","unit":"내용 이해","q":"윗글을 이해한 내용으로 적절하지 않은 것은?\n\n조선 후기에 한글 소설이 널리 읽힌 데에는 책을 대는 새로운 방식이 큰 몫을 하였다. 그 이전에 소설은 주로 손으로 베낀 책으로 아는 이들 사이에서 돌려 읽혔다. 그러다 18세기 무렵 서울에 돈을 받고 책을 빌려주는 세책집이 나타났다. 세책집은 소설을 손으로 베껴 여러 권으로 묶어 두고 한 권씩 빌려주었는데, 빌리는 값을 권마다 받았으므로 권수가 많을수록 벌이가 늘었다. 그래서 세책본은 한 장에 들어가는 글자 수를 줄이고 이야기를 길게 늘이는 일이 많았으며, 권의 끝을 궁금증이 이는 대목에서 끊어 다음 권을 빌리게 하였다. 여러 사람의 손을 거치므로 책장이 쉽게 해지지 않도록 두꺼운 종이에 기름을 먹이기도 하였다.\n방각본은 사정이 달랐다. 방각본은 민간 업자가 팔려고 나무판에 새겨 찍어 낸 책이다. 판을 새기는 데 품과 돈이 많이 ㉠ __들었으므로__ 업자는 판의 수를 줄이려 하였고, 그 결과 방각본 소설은 같은 작품의 세책본보다 분량이 짧은 경우가 많았다. 줄거리에 꼭 필요하지 않은 묘사나 대화가 먼저 잘려 나갔다. 대신 한번 판을 새겨 두면 같은 책을 여러 벌 찍을 수 있었으므로 책값이 내려갔고, 서울뿐 아니라 전주와 안성에서도 방각본이 나와 지방의 독자에게까지 소설이 닿았다.\n글을 읽지 못하는 사람들에게는 전기수가 있었다. 전기수는 사람이 모이는 거리에서 소설을 소리 내어 읽어 주고 돈을 받던 직업적인 낭독자였다. 그는 이야기가 가장 아슬아슬한 대목에 이르면 읽기를 멈추었고, 뒷이야기가 궁금한 청중이 돈을 던지면 그제야 다시 읽어 나갔다.","opts":["세책집은 빌려주는 책의 권수가 많을수록 이익이 컸다.","방각본은 판을 한번 새기면 여러 벌을 찍어 낼 수 있었다.","전기수 덕분에 글을 모르는 사람도 소설을 즐길 수 있었다.","방각본 업자는 책값을 올리려고 묘사와 대화를 늘려 판에 새겼다."],"ans":3,"exp":"방각본 업자는 판을 새기는 데 품과 돈이 많이 들어 판의 수를 줄이려 하였고, 그래서 줄거리에 꼭 필요하지 않은 묘사나 대화가 먼저 잘려 나갔다. 묘사와 대화를 늘렸다는 진술은 이와 반대이다. 세책집은 빌리는 값을 권마다 받았으므로 권수가 많을수록 벌이가 늘었고, 방각본은 한번 새긴 판으로 같은 책을 여러 벌 찍었으며, 전기수는 글을 읽지 못하는 사람들에게 소설을 읽어 주었다."},
{"id":"k260","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n조선 후기에 한글 소설이 널리 읽힌 데에는 책을 대는 새로운 방식이 큰 몫을 하였다. 그 이전에 소설은 주로 손으로 베낀 책으로 아는 이들 사이에서 돌려 읽혔다. 그러다 18세기 무렵 서울에 돈을 받고 책을 빌려주는 세책집이 나타났다. 세책집은 소설을 손으로 베껴 여러 권으로 묶어 두고 한 권씩 빌려주었는데, 빌리는 값을 권마다 받았으므로 권수가 많을수록 벌이가 늘었다. 그래서 세책본은 한 장에 들어가는 글자 수를 줄이고 이야기를 길게 늘이는 일이 많았으며, 권의 끝을 궁금증이 이는 대목에서 끊어 다음 권을 빌리게 하였다. 여러 사람의 손을 거치므로 책장이 쉽게 해지지 않도록 두꺼운 종이에 기름을 먹이기도 하였다.\n방각본은 사정이 달랐다. 방각본은 민간 업자가 팔려고 나무판에 새겨 찍어 낸 책이다. 판을 새기는 데 품과 돈이 많이 ㉠ __들었으므로__ 업자는 판의 수를 줄이려 하였고, 그 결과 방각본 소설은 같은 작품의 세책본보다 분량이 짧은 경우가 많았다. 줄거리에 꼭 필요하지 않은 묘사나 대화가 먼저 잘려 나갔다. 대신 한번 판을 새겨 두면 같은 책을 여러 벌 찍을 수 있었으므로 책값이 내려갔고, 서울뿐 아니라 전주와 안성에서도 방각본이 나와 지방의 독자에게까지 소설이 닿았다.\n글을 읽지 못하는 사람들에게는 전기수가 있었다. 전기수는 사람이 모이는 거리에서 소설을 소리 내어 읽어 주고 돈을 받던 직업적인 낭독자였다. 그는 이야기가 가장 아슬아슬한 대목에 이르면 읽기를 멈추었고, 뒷이야기가 궁금한 청중이 돈을 던지면 그제야 다시 읽어 나갔다.","opts":["이 다리를 놓는 데 삼 년이 __들었다__.","그는 지난달에 동네 산악회에 __들었다__.","올해는 봄부터 가뭄이 __들어__ 농사를 망쳤다.","해가 지자 우리는 서둘러 숙소에 __들어__ 짐을 풀었다."],"ans":0,"exp":"㉠의 '들다'는 '어떤 일에 돈, 시간, 노력 따위가 쓰이다'라는 뜻이고, '다리를 놓는 데 삼 년이 들었다'의 '들다'가 같은 뜻이다. '산악회에 들다'는 '조직체에 가입하다', '가뭄이 들다'는 '어떤 일이나 기상 현상이 일어나다', '숙소에 들다'는 '밖에서 안으로 가거나 거처를 정해 머무르다'의 뜻이다."},
{"id":"k261","subj":"국어","unit":"내용 이해","q":"윗글의 중심 내용으로 가장 적절한 것은?\n\n민주주의에서 결정을 내리는 방식을 설명하는 데에는 크게 두 갈래의 생각이 있다. 하나는 시민 각자가 이미 가지고 있는 선호를 정확히 세어 더하는 것이 민주주의의 핵심이라고 본다. 이 관점에서 투표는 ㉠ __저마다 미리 정해 둔 뜻__을 드러내는 절차이며, 좋은 제도란 한 사람의 뜻도 빠뜨리지 않고 같은 무게로 세는 제도이다. 다수결은 가장 많은 사람이 바라는 것을 찾아내는 방법으로서 정당성을 얻는다.\n다른 하나는 숙의를 강조한다. 숙의 민주주의를 내세우는 이들은 시민의 선호가 고정된 것이 아니라고 본다. 사람들은 충분한 정보를 얻지 못한 채, 또는 자기와 처지가 다른 사람의 사정을 들어 보지 못한 채 의견을 정하는 일이 많다. 그런 ㉡ __다듬어지지 않은 의견__을 더한 값이 곧 공동체의 뜻이라고 하기는 어렵다는 것이다. 이들이 보기에 결정의 정당성은 표의 수보다 결정에 이르는 과정에서 나온다. 서로 이유를 대며 토론하고, 더 나은 이유 앞에서 생각을 고칠 수 있어야 한다. 그렇게 해서 얻은 ㉢ __토론을 거쳐 바뀐 판단__이야말로 존중받을 만한 시민의 뜻이라는 것이다. 무작위로 뽑은 시민들에게 자료를 주고 전문가의 설명과 모둠 토의를 거치게 한 뒤 의견을 묻는 공론 조사는 이 생각을 제도로 옮긴 것이다. 보통의 여론 조사가 ㉣ __질문을 받은 그 순간의 생각__을 잰다면, 공론 조사는 사람들이 충분히 알고 따져 본 뒤에 어떤 판단에 이르는지를 잰다.\n물론 숙의에도 한계가 있다. 토론에는 시간과 비용이 들고, 말을 잘하는 사람의 의견이 실제보다 크게 반영될 수 있다. 토론이 끝나도 의견이 하나로 모이지 않으면 결국 표결로 매듭을 지어야 한다. 그래서 두 생각은 어느 하나를 고르는 문제라기보다, 표를 세기 전에 어떤 과정을 둘 것인가를 놓고 서로 보완하는 관계로 이해된다.","opts":["다수결은 소수의 의견을 묵살하므로 민주적인 절차가 아니다.","공론 조사는 비용이 많이 들어 여론 조사를 대신하기 어렵다.","선호를 세는 일과 숙의하는 일은 민주적 결정에서 서로를 보완한다.","시민의 선호는 고정되어 있으므로 토론보다 정확한 집계가 더 중요하다."],"ans":2,"exp":"글은 선호를 세어 더하는 관점과 숙의를 강조하는 관점을 차례로 소개한 뒤, 숙의에도 한계가 있어 결국 표결이 필요하므로 두 생각이 서로 보완하는 관계라고 맺는다. 다수결이 민주적이지 않다는 내용은 글에 없고, 공론 조사의 비용은 숙의의 한계를 말하는 한 부분일 뿐이다. 선호가 고정되어 있다는 것은 글이 소개한 한쪽 관점의 전제이지 글 전체의 결론이 아니다."},

{"id":"k263","subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n어떤 행위가 옳은지를 가리는 기준에 관해 윤리학에는 오래된 두 입장이 있다. 결과주의는 행위의 옳고 그름이 그 행위가 낳는 결과에 달려 있다고 본다. 결과주의의 대표 격인 공리주의에 따르면, 할 수 있는 여러 행위 가운데 관련된 모든 사람의 행복을 가장 크게 늘리는 행위가 옳은 행위이다. 이때 행위자 자신의 행복은 다른 사람의 행복보다 더 무겁게 계산되지 않는다. 이에 비해 의무론은 결과와 상관없이 그 자체로 해야 하는 행위와 해서는 안 되는 행위가 있다고 본다. 칸트는 행위의 도덕적 가치가 결과가 아니라 행위자가 어떤 원칙에 따라 행위했는가에 달려 있다고 하였다. 그에게 옳은 행위란 모든 사람이 따르기를 바랄 수 있는 원칙에서 나온 행위이며, 그것도 이익을 바라서가 아니라 그것이 의무이기 때문에 한 행위이다.\n두 입장의 차이는 거짓말을 두고 뚜렷이 드러난다. 공리주의자에게 거짓말은 그 자체로 나쁜 것이 아니다. 거짓말이 진실을 말하는 것보다 더 큰 행복을 가져온다면 거짓말을 하는 것이 옳다. 반면 칸트는 거짓말을 해서 좋은 결과를 얻을 수 있는 경우에도 거짓말은 허용되지 않는다고 보았다. 필요하면 거짓말을 해도 된다는 원칙을 모두가 따른다면 누구의 말도 믿을 수 없게 되어, 거짓말로 남을 속이는 일 자체가 성립하지 않기 때문이다.\n두 입장은 서로의 약점을 겨눈다. 의무론자는 공리주의가 다수의 행복을 위해서라면 죄 없는 한 사람을 희생시키는 일도 옳다고 해야 하는 처지에 놓인다고 비판한다. 공리주의자는 의무론이 의무들이 서로 부딪칠 때 무엇을 따라야 하는지 알려 주지 못하며, 뻔히 보이는 불행 앞에서도 원칙만 ㉠ __지키라고__ 요구한다고 맞선다.","opts":["공리주의자는 행위자 자신에게 손해가 되는 행위도 옳다고 판단할 수 있다.","공리주의자는 환자를 안심시켜 회복을 돕는 거짓말도 그 자체로 그르다고 볼 것이다.","칸트는 손님을 잃을까 봐 정직하게 장사한 상인의 행위에 도덕적 가치가 있다고 볼 것이다.","칸트는 거짓 약속으로 친구를 위기에서 구한 사람의 행위가 결과가 좋았으므로 옳다고 볼 것이다."],"ans":0,"exp":"공리주의에서는 관련된 모든 사람의 행복을 가장 크게 늘리는 행위가 옳고 행위자 자신의 행복을 더 무겁게 계산하지 않으므로, 자신에게 손해라도 전체의 행복을 가장 크게 늘린다면 옳은 행위가 된다. 공리주의자에게 거짓말은 그 자체로 나쁜 것이 아니다. 칸트에게 도덕적 가치는 이익을 바라서가 아니라 의무이기 때문에 한 행위에 있으므로 손님을 잃을까 봐 정직한 상인의 행위는 해당하지 않고, 결과가 좋아도 거짓말은 허용되지 않는다."},
{"id":"k264","subj":"국어","unit":"지문 속 어휘","q":"윗글의 문맥상 ㉠의 의미와 가장 가까운 것은?\n\n어떤 행위가 옳은지를 가리는 기준에 관해 윤리학에는 오래된 두 입장이 있다. 결과주의는 행위의 옳고 그름이 그 행위가 낳는 결과에 달려 있다고 본다. 결과주의의 대표 격인 공리주의에 따르면, 할 수 있는 여러 행위 가운데 관련된 모든 사람의 행복을 가장 크게 늘리는 행위가 옳은 행위이다. 이때 행위자 자신의 행복은 다른 사람의 행복보다 더 무겁게 계산되지 않는다. 이에 비해 의무론은 결과와 상관없이 그 자체로 해야 하는 행위와 해서는 안 되는 행위가 있다고 본다. 칸트는 행위의 도덕적 가치가 결과가 아니라 행위자가 어떤 원칙에 따라 행위했는가에 달려 있다고 하였다. 그에게 옳은 행위란 모든 사람이 따르기를 바랄 수 있는 원칙에서 나온 행위이며, 그것도 이익을 바라서가 아니라 그것이 의무이기 때문에 한 행위이다.\n두 입장의 차이는 거짓말을 두고 뚜렷이 드러난다. 공리주의자에게 거짓말은 그 자체로 나쁜 것이 아니다. 거짓말이 진실을 말하는 것보다 더 큰 행복을 가져온다면 거짓말을 하는 것이 옳다. 반면 칸트는 거짓말을 해서 좋은 결과를 얻을 수 있는 경우에도 거짓말은 허용되지 않는다고 보았다. 필요하면 거짓말을 해도 된다는 원칙을 모두가 따른다면 누구의 말도 믿을 수 없게 되어, 거짓말로 남을 속이는 일 자체가 성립하지 않기 때문이다.\n두 입장은 서로의 약점을 겨눈다. 의무론자는 공리주의가 다수의 행복을 위해서라면 죄 없는 한 사람을 희생시키는 일도 옳다고 해야 하는 처지에 놓인다고 비판한다. 공리주의자는 의무론이 의무들이 서로 부딪칠 때 무엇을 따라야 하는지 알려 주지 못하며, 뻔히 보이는 불행 앞에서도 원칙만 ㉠ __지키라고__ 요구한다고 맞선다.","opts":["병사들이 밤새 성문을 __지켰다__.","운전자는 교통 법규를 __지켜야__ 한다.","그는 회의가 끝날 때까지 침묵을 __지켰다__.","경찰이 골목 어귀를 __지키고__ 있다가 범인을 잡았다."],"ans":1,"exp":"㉠의 '지키다'는 '규정, 약속, 법 따위를 어기지 않고 그대로 실행하다'라는 뜻이고, '교통 법규를 지켜야 한다'의 '지키다'가 같은 뜻이다. '성문을 지키다'는 '침해당하지 않도록 보호하거나 감시하여 막다', '침묵을 지키다'는 '어떠한 상태나 태도를 그대로 유지하다', '골목 어귀를 지키다'는 '길목 따위를 주의를 기울여 살피다'의 뜻이다."},
{"id":"k265","subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 적절하지 않은 것은?\n\n역사가는 과거를 있는 그대로 되살릴 수 있는가. 19세기 독일의 역사가 랑케는 역사가의 임무가 과거를 심판하거나 후세를 가르치는 것이 아니라 ‘그것이 본래 어떠했는가’를 보여 주는 데 있다고 하였다. 그를 따른 역사가들은 믿을 만한 사료를 엄밀하게 ㉠ __가려__ 사실을 확정하면, 역사가는 자신의 견해를 지우고 사실이 스스로 말하게 할 수 있다고 믿었다. 이들에게 사실은 역사가의 해석보다 먼저, 해석과 따로 존재하는 것이었다.\n20세기의 역사가 카는 이 믿음을 비판하였다. 그에 따르면 과거에 일어난 일이 모두 역사적 사실이 되는 것은 아니다. 수많은 사람이 루비콘강을 건넜지만 카이사르가 그 강을 건넌 일만이 역사적 사실로 다루어진다. 지난날의 숱한 일 가운데 어떤 것을 의미 있다고 보아 ㉡ __골라내는__ 것은 역사가이며, 그 선택에는 역사가가 사는 시대의 관심이 배어 있다. 사실은 스스로 말하지 않으며 역사가가 불러낼 때에만 말한다는 것이다.\n그렇다고 카가 역사를 역사가 마음대로 지어내는 이야기로 본 것은 아니다. 그는 사실을 ㉢ __떠받들어__ 해석을 버리는 태도와 함께, 해석만 앞세워 사실을 입맛대로 주무르는 태도도 물리쳤다. 사실 없는 역사가는 뿌리가 없고, 역사가 없는 사실은 생명이 없다. 역사가는 잠정적인 해석을 가지고 사실을 고르고, 고른 사실에 비추어 다시 해석을 ㉣ __고친다__. 카가 역사를 ‘현재와 과거 사이의 끊임없는 대화’라고 부른 것은 이 오고 감을 가리킨다. 그러므로 시대가 바뀌어 새로운 물음이 생기면 같은 과거에 대해서도 역사는 다시 쓰일 수 있다.","opts":["랑케를 따른 역사가들은 사료를 엄밀히 검토하는 일을 중요하게 여겼을 것이다.","카는 어떤 일이 역사적 사실로 다루어지는 데에 역사가의 판단이 개입한다고 볼 것이다.","카는 역사가의 해석이 사실과 어긋나더라도 시대의 관심에 맞으면 받아들일 만하다고 볼 것이다.","랑케를 따른 역사가들은 역사가의 견해가 서술에 드러나지 않을수록 바람직한 역사 서술이라고 볼 것이다."],"ans":2,"exp":"카는 해석만 앞세워 사실을 입맛대로 주무르는 태도도 물리쳤고, 고른 사실에 비추어 해석을 다시 고쳐야 한다고 보았다. 따라서 사실과 어긋나는 해석을 받아들일 만하다고 볼 것이라는 추론은 적절하지 않다. 랑케를 따른 역사가들은 사료를 엄밀하게 가려 사실을 확정하고 역사가의 견해를 지우려 하였으며, 카는 어떤 일을 의미 있다고 보아 골라내는 것이 역사가라고 하였다."},
{"id":"k266","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n역사가는 과거를 있는 그대로 되살릴 수 있는가. 19세기 독일의 역사가 랑케는 역사가의 임무가 과거를 심판하거나 후세를 가르치는 것이 아니라 ‘그것이 본래 어떠했는가’를 보여 주는 데 있다고 하였다. 그를 따른 역사가들은 믿을 만한 사료를 엄밀하게 ㉠ __가려__ 사실을 확정하면, 역사가는 자신의 견해를 지우고 사실이 스스로 말하게 할 수 있다고 믿었다. 이들에게 사실은 역사가의 해석보다 먼저, 해석과 따로 존재하는 것이었다.\n20세기의 역사가 카는 이 믿음을 비판하였다. 그에 따르면 과거에 일어난 일이 모두 역사적 사실이 되는 것은 아니다. 수많은 사람이 루비콘강을 건넜지만 카이사르가 그 강을 건넌 일만이 역사적 사실로 다루어진다. 지난날의 숱한 일 가운데 어떤 것을 의미 있다고 보아 ㉡ __골라내는__ 것은 역사가이며, 그 선택에는 역사가가 사는 시대의 관심이 배어 있다. 사실은 스스로 말하지 않으며 역사가가 불러낼 때에만 말한다는 것이다.\n그렇다고 카가 역사를 역사가 마음대로 지어내는 이야기로 본 것은 아니다. 그는 사실을 ㉢ __떠받들어__ 해석을 버리는 태도와 함께, 해석만 앞세워 사실을 입맛대로 주무르는 태도도 물리쳤다. 사실 없는 역사가는 뿌리가 없고, 역사가 없는 사실은 생명이 없다. 역사가는 잠정적인 해석을 가지고 사실을 고르고, 고른 사실에 비추어 다시 해석을 ㉣ __고친다__. 카가 역사를 ‘현재와 과거 사이의 끊임없는 대화’라고 부른 것은 이 오고 감을 가리킨다. 그러므로 시대가 바뀌어 새로운 물음이 생기면 같은 과거에 대해서도 역사는 다시 쓰일 수 있다.","opts":["㉠: 선별(選別)하여","㉡: 선택(選擇)하는","㉢: 숭상(崇尙)하여","㉣: 수리(修理)한다"],"ans":3,"exp":"㉣의 '고치다'는 잘못되거나 틀린 것을 바로잡는다는 뜻이므로 '수정(修正)한다'로 바꿀 수 있다. '수리(修理)하다'는 고장 나거나 허름한 데를 손보아 고친다는 뜻이어서 해석을 대상으로 쓸 수 없다. 사료를 '가리다'는 '선별하다', '골라내다'는 '선택하다', '떠받들다'는 '숭상하다'와 뜻이 통한다."},
{"id":"k267","subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n사회학자 고프먼은 사람들이 일상에서 만나 주고받는 행동을 연극에 빗대어 설명하였다. 그에 따르면 사람은 다른 사람 앞에 설 때 상대가 자신을 어떻게 볼지를 헤아려 말과 몸짓, 옷차림을 고른다. 고프먼은 이를 인상 관리라고 불렀다. 인상 관리는 남을 속이려는 꾀가 아니라, 그 자리에서 자신에게 기대되는 역할을 해내려는 노력이다.\n연극에 무대와 분장실이 있듯이 일상의 공간도 둘로 나뉜다. 식당의 종업원은 홀에서 손님에게 깍듯하고 상냥하다. 그러나 ㉠ __주방 문 안쪽__에 들어서면 다리를 주무르며 까다로운 손님의 흉을 보기도 한다. 고프먼은 홀처럼 관객이 지켜보는 곳을 앞무대, 주방처럼 ㉡ __관객의 눈길이 닿지 않는 곳__을 뒷무대라고 불렀다. 뒷무대는 앞무대의 연기를 준비하고, 연기하느라 눌러 두었던 모습을 풀어놓는 곳이다. 뒷무대가 관객에게 드러나면 앞무대에서 쌓은 인상이 무너지므로, 사람들은 ㉢ __그 경계의 안쪽__을 남이 함부로 들여다보지 못하게 막는다.\n앞무대와 뒷무대는 장소 자체의 성질로 정해지는 것이 아니다. 같은 장소도 누가 보고 있느냐에 따라 달라진다. 교무실은 교사들끼리 있을 때에는 뒷무대이지만, 학생이 들어서는 순간 ㉣ __역할에 맞는 모습만 내보여야 하는 곳__이 된다.\n인상 관리는 혼자 하는 일도 아니다. 종업원들이 손님 앞에서는 서로의 실수를 모른 척 덮어 주듯, 같은 역할을 하는 사람들은 한 팀이 되어 공연을 지킨다. 관객도 한몫을 한다. 발표자가 말을 더듬을 때 청중이 못 들은 척 넘어가 주는 것은 공연이 깨지지 않도록 돕는 일이다. 고프먼이 보기에 일상의 질서는 연기하는 쪽과 지켜보는 쪽이 이렇게 서로의 체면을 지켜 주는 데에서 유지된다.","opts":["면접관이 지원자의 말실수를 못 들은 척하는 것은 공연의 유지를 돕는 일이다.","혼자 사는 사람의 집은 손님이 찾아와 머무는 동안에도 뒷무대로 남아 있게 된다.","인상 관리는 상대를 속여 이익을 얻으려는 꾀에서 나온 행동으로 이해하는 것이 옳다.","종업원이 손님 앞에서 동료의 실수를 큰 소리로 나무라는 것은 팀의 공연을 지키는 일이다."],"ans":0,"exp":"발표자가 말을 더듬을 때 청중이 못 들은 척 넘어가 주는 것이 공연이 깨지지 않도록 돕는 일이라고 하였으므로, 면접관이 지원자의 말실수를 못 들은 척하는 것도 같은 일로 볼 수 있다. 앞무대와 뒷무대는 누가 보고 있느냐에 따라 달라지므로 손님이 온 집은 앞무대가 되고, 인상 관리는 남을 속이려는 꾀가 아니라고 하였다. 팀은 손님 앞에서 서로의 실수를 모른 척 덮어 줌으로써 공연을 지킨다."},
{"id":"k268","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 문맥상 가리키는 대상이 나머지와 다른 하나는?\n\n사회학자 고프먼은 사람들이 일상에서 만나 주고받는 행동을 연극에 빗대어 설명하였다. 그에 따르면 사람은 다른 사람 앞에 설 때 상대가 자신을 어떻게 볼지를 헤아려 말과 몸짓, 옷차림을 고른다. 고프먼은 이를 인상 관리라고 불렀다. 인상 관리는 남을 속이려는 꾀가 아니라, 그 자리에서 자신에게 기대되는 역할을 해내려는 노력이다.\n연극에 무대와 분장실이 있듯이 일상의 공간도 둘로 나뉜다. 식당의 종업원은 홀에서 손님에게 깍듯하고 상냥하다. 그러나 ㉠ __주방 문 안쪽__에 들어서면 다리를 주무르며 까다로운 손님의 흉을 보기도 한다. 고프먼은 홀처럼 관객이 지켜보는 곳을 앞무대, 주방처럼 ㉡ __관객의 눈길이 닿지 않는 곳__을 뒷무대라고 불렀다. 뒷무대는 앞무대의 연기를 준비하고, 연기하느라 눌러 두었던 모습을 풀어놓는 곳이다. 뒷무대가 관객에게 드러나면 앞무대에서 쌓은 인상이 무너지므로, 사람들은 ㉢ __그 경계의 안쪽__을 남이 함부로 들여다보지 못하게 막는다.\n앞무대와 뒷무대는 장소 자체의 성질로 정해지는 것이 아니다. 같은 장소도 누가 보고 있느냐에 따라 달라진다. 교무실은 교사들끼리 있을 때에는 뒷무대이지만, 학생이 들어서는 순간 ㉣ __역할에 맞는 모습만 내보여야 하는 곳__이 된다.\n인상 관리는 혼자 하는 일도 아니다. 종업원들이 손님 앞에서는 서로의 실수를 모른 척 덮어 주듯, 같은 역할을 하는 사람들은 한 팀이 되어 공연을 지킨다. 관객도 한몫을 한다. 발표자가 말을 더듬을 때 청중이 못 들은 척 넘어가 주는 것은 공연이 깨지지 않도록 돕는 일이다. 고프먼이 보기에 일상의 질서는 연기하는 쪽과 지켜보는 쪽이 이렇게 서로의 체면을 지켜 주는 데에서 유지된다.","opts":["㉠","㉡","㉢","㉣"],"ans":3,"exp":"㉠ '주방 문 안쪽', ㉡ '관객의 눈길이 닿지 않는 곳', ㉢ '그 경계의 안쪽'은 모두 연기를 준비하고 눌러 두었던 모습을 풀어놓는 뒷무대를 가리킨다. ㉣ '역할에 맞는 모습만 내보여야 하는 곳'은 학생이 들어선 뒤의 교무실, 곧 관객이 지켜보는 앞무대를 가리킨다."},
{"id":"k269","subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 적절하지 않은 것은?\n\n발터 벤야민은 사진과 영화가 퍼지던 20세기 전반에 예술 작품이 겪는 변화를 ‘아우라의 붕괴’라는 말로 설명하였다. 아우라는 예술 작품이 ‘지금, 여기’에 단 하나뿐인 것으로 있다는 데에서 나오는 분위기이다. 성당의 벽화는 그 성당에 가야만 볼 수 있고, 그 앞에 선 사람은 ㉠ __그 그림__이 지나온 세월과 그것이 놓인 장소의 무게를 함께 느낀다. 벤야민은 이런 경험을 ‘아무리 가까이 있어도 멀게 느껴지는 것’이라고 표현하였다.\n사진과 영화 같은 기술적 복제는 이 조건을 바꾸어 놓았다. 벽화를 찍은 ㉡ __사진__은 성당을 떠나 누구의 방에나 걸릴 수 있다. 예전에도 복제는 있었지만, 손으로 베낀 것은 진품에 견주어 가짜로 취급되었다. 그러나 필름에서 인화한 여러 장의 사진을 두고 어느 것이 진품이냐고 묻는 일은 의미가 없다. 영화에는 처음부터 ㉢ __복제의 바탕이 되는 단 하나의 작품__이 없다.\n벤야민은 이 변화를 예술의 쓰임이 바뀌는 과정으로 읽었다. 예술은 본디 주술과 종교 의식에 쓰이는 물건으로 출발하였고, 그때 중요한 것은 작품이 ‘보이는가’가 아니라 ‘있는가’였다. 신전 깊숙한 곳의 신상은 사제만 볼 수 있어도 제 구실을 하였다. 그는 이를 제의 가치라 부르고, 작품이 많은 사람에게 보임으로써 얻는 가치를 전시 가치라 불렀다. 복제 기술은 전시 가치를 크게 키우고 제의 가치를 뒤로 밀어낸다.\n벤야민은 아우라의 붕괴를 아쉬워하기만 하지 않았다. ㉣ __유일한 원본__에 다가갈 수 있었던 소수만이 누리던 예술이 대중에게 열리고, 대중이 작품 앞에서 조아리는 대신 따져 보며 즐길 수 있게 되었다고 보았기 때문이다.","opts":["미술관에 걸린 단 한 점뿐인 유화는 아우라를 지닌 작품일 것이다.","아무도 들어갈 수 없는 무덤 속의 벽화는 제의 가치가 큰 작품일 것이다.","인화한 사진들 사이에서는 손으로 베낀 그림과 달리 진품을 가리는 일이 무의미할 것이다.","벤야민은 영화를 단 한 편뿐인 원본 필름의 아우라가 관객에게 전해지는 예술로 볼 것이다."],"ans":3,"exp":"영화에는 처음부터 복제의 바탕이 되는 단 하나의 작품이 없다고 하였고, 아우라는 단 하나뿐인 것으로 있다는 데에서 나오므로 영화를 원본의 아우라가 전해지는 예술로 볼 것이라는 추론은 적절하지 않다. 단 하나뿐인 유화는 아우라를 지니고, 보이지 않아도 있는 것만으로 구실을 하는 작품은 제의 가치가 크다. 손으로 베낀 것은 가짜로 취급되었지만 인화한 사진들 사이에서 진품을 묻는 일은 의미가 없다."},
{"id":"k270","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣ 중 문맥상 가리키는 대상이 나머지와 다른 하나는?\n\n발터 벤야민은 사진과 영화가 퍼지던 20세기 전반에 예술 작품이 겪는 변화를 ‘아우라의 붕괴’라는 말로 설명하였다. 아우라는 예술 작품이 ‘지금, 여기’에 단 하나뿐인 것으로 있다는 데에서 나오는 분위기이다. 성당의 벽화는 그 성당에 가야만 볼 수 있고, 그 앞에 선 사람은 ㉠ __그 그림__이 지나온 세월과 그것이 놓인 장소의 무게를 함께 느낀다. 벤야민은 이런 경험을 ‘아무리 가까이 있어도 멀게 느껴지는 것’이라고 표현하였다.\n사진과 영화 같은 기술적 복제는 이 조건을 바꾸어 놓았다. 벽화를 찍은 ㉡ __사진__은 성당을 떠나 누구의 방에나 걸릴 수 있다. 예전에도 복제는 있었지만, 손으로 베낀 것은 진품에 견주어 가짜로 취급되었다. 그러나 필름에서 인화한 여러 장의 사진을 두고 어느 것이 진품이냐고 묻는 일은 의미가 없다. 영화에는 처음부터 ㉢ __복제의 바탕이 되는 단 하나의 작품__이 없다.\n벤야민은 이 변화를 예술의 쓰임이 바뀌는 과정으로 읽었다. 예술은 본디 주술과 종교 의식에 쓰이는 물건으로 출발하였고, 그때 중요한 것은 작품이 ‘보이는가’가 아니라 ‘있는가’였다. 신전 깊숙한 곳의 신상은 사제만 볼 수 있어도 제 구실을 하였다. 그는 이를 제의 가치라 부르고, 작품이 많은 사람에게 보임으로써 얻는 가치를 전시 가치라 불렀다. 복제 기술은 전시 가치를 크게 키우고 제의 가치를 뒤로 밀어낸다.\n벤야민은 아우라의 붕괴를 아쉬워하기만 하지 않았다. ㉣ __유일한 원본__에 다가갈 수 있었던 소수만이 누리던 예술이 대중에게 열리고, 대중이 작품 앞에서 조아리는 대신 따져 보며 즐길 수 있게 되었다고 보았기 때문이다.","opts":["㉠","㉡","㉢","㉣"],"ans":1,"exp":"㉠ '그 그림'(성당의 벽화), ㉢ '복제의 바탕이 되는 단 하나의 작품', ㉣ '유일한 원본'은 모두 단 하나뿐인 원본을 가리킨다. ㉡ '사진'은 벽화를 찍어 어디에나 걸 수 있게 된 복제물이므로 나머지와 다르다."},
{"id":"k271","subj":"국어","unit":"추론","q":"윗글에서 추론한 내용으로 가장 적절한 것은?\n\n정부가 어떤 활동을 규제할 때 법령을 짜는 방식은 크게 둘로 나뉜다. 하나는 할 수 있는 것을 법령에 하나하나 적어 두고 거기에 없는 것은 모두 금지하는 방식이다. 허용되는 것을 ㉠ __늘어놓는다__ 하여 이를 허용 목록 방식이라고 한다. 다른 하나는 해서는 안 되는 것만 적어 두고 나머지는 모두 허용하는 방식으로, 금지 목록 방식이라고 한다. 앞의 것은 ‘원칙 금지, 예외 허용’이고 뒤의 것은 ‘원칙 허용, 예외 금지’인 셈이다.\n허용 목록 방식에서는 무엇이 허용되는지가 분명하므로 규제를 받는 쪽도 집행하는 쪽도 판단하기 쉽고, 위험이 확인되지 않은 활동이 시장에 나오는 것을 미리 막을 수 있다. 그러나 법령을 만들 때 미처 ㉡ __내다보지__ 못한 새로운 방식의 사업은 해롭지 않더라도 목록에 없다는 이유만으로 금지된다. 목록을 고치려면 법령을 고쳐야 하므로 시간이 걸리고, 그사이 새로운 시도는 멈춰 선다.\n금지 목록 방식은 그 반대이다. 금지 목록에 없는 한 새로운 시도를 먼저 해 볼 수 있으므로 변화가 빠른 분야에 ㉢ __걸맞다__. 대신 금지 목록을 만들 때 예상하지 못한 위험이 걸러지지 않고 통과할 수 있다. 그래서 금지 목록 방식을 택할 때에는 사후에 문제를 찾아내는 감독과, 피해가 생겼을 때 책임을 무겁게 묻는 장치가 함께 ㉣ __따라야__ 한다. 사전에 문을 좁히는 대신 사후에 책임을 묻는 쪽으로 규제의 무게를 옮기는 것이다.\n그러므로 어느 방식이 언제나 낫다고 할 수는 없다. 한번 피해가 생기면 되돌리기 어려운 분야에서는 허용 목록 방식이, 피해가 크지 않고 되돌릴 수 있는 분야에서는 금지 목록 방식이 알맞다.","opts":["한번 사고가 나면 피해를 되돌리기 어려운 분야에는 금지 목록 방식이 더 알맞다.","금지 목록에 없는 새 배달 수단으로 사고를 낸 업체에 무거운 배상 책임을 묻는 것은 금지 목록 방식과 어울린다.","허용 목록 방식에서는 목록에 없는 사업이라도 해롭지 않다는 점이 확인되면 법령을 고치지 않고 바로 할 수 있다.","법령에 적힌 방식이 아니라는 이유만으로 새 서비스를 내놓지 못하였다면 그 분야는 금지 목록 방식을 따르고 있는 것이다."],"ans":1,"exp":"금지 목록 방식을 택할 때에는 피해가 생겼을 때 책임을 무겁게 묻는 장치가 함께 따라야 한다고 하였으므로, 금지 목록에 없어 허용된 새 수단으로 사고를 낸 업체에 무거운 배상 책임을 묻는 것은 이 방식과 어울린다. 피해를 되돌리기 어려운 분야에는 허용 목록 방식이 알맞다. 허용 목록 방식에서는 해롭지 않아도 목록에 없으면 금지되고 목록을 고치려면 법령을 고쳐야 하며, 법령에 적힌 방식이 아니라는 이유로 막히는 것은 허용 목록 방식의 모습이다."},
{"id":"k272","subj":"국어","unit":"지문 속 어휘","q":"윗글의 ㉠ ～ ㉣과 바꿔 쓸 수 있는 유사한 표현으로 적절하지 않은 것은?\n\n정부가 어떤 활동을 규제할 때 법령을 짜는 방식은 크게 둘로 나뉜다. 하나는 할 수 있는 것을 법령에 하나하나 적어 두고 거기에 없는 것은 모두 금지하는 방식이다. 허용되는 것을 ㉠ __늘어놓는다__ 하여 이를 허용 목록 방식이라고 한다. 다른 하나는 해서는 안 되는 것만 적어 두고 나머지는 모두 허용하는 방식으로, 금지 목록 방식이라고 한다. 앞의 것은 ‘원칙 금지, 예외 허용’이고 뒤의 것은 ‘원칙 허용, 예외 금지’인 셈이다.\n허용 목록 방식에서는 무엇이 허용되는지가 분명하므로 규제를 받는 쪽도 집행하는 쪽도 판단하기 쉽고, 위험이 확인되지 않은 활동이 시장에 나오는 것을 미리 막을 수 있다. 그러나 법령을 만들 때 미처 ㉡ __내다보지__ 못한 새로운 방식의 사업은 해롭지 않더라도 목록에 없다는 이유만으로 금지된다. 목록을 고치려면 법령을 고쳐야 하므로 시간이 걸리고, 그사이 새로운 시도는 멈춰 선다.\n금지 목록 방식은 그 반대이다. 금지 목록에 없는 한 새로운 시도를 먼저 해 볼 수 있으므로 변화가 빠른 분야에 ㉢ __걸맞다__. 대신 금지 목록을 만들 때 예상하지 못한 위험이 걸러지지 않고 통과할 수 있다. 그래서 금지 목록 방식을 택할 때에는 사후에 문제를 찾아내는 감독과, 피해가 생겼을 때 책임을 무겁게 묻는 장치가 함께 ㉣ __따라야__ 한다. 사전에 문을 좁히는 대신 사후에 책임을 묻는 쪽으로 규제의 무게를 옮기는 것이다.\n그러므로 어느 방식이 언제나 낫다고 할 수는 없다. 한번 피해가 생기면 되돌리기 어려운 분야에서는 허용 목록 방식이, 피해가 크지 않고 되돌릴 수 있는 분야에서는 금지 목록 방식이 알맞다.","opts":["㉠: 나열(羅列)한다","㉡: 관망(觀望)하지","㉢: 적합(適合)하다","㉣: 수반(隨伴)되어야"],"ans":1,"exp":"㉡의 '내다보다'는 앞일을 미리 헤아린다는 뜻이므로 '예견(豫見)하지'나 '예측(豫測)하지'로 바꿀 수 있다. '관망(觀望)하다'는 한발 물러나서 일이 되어 가는 형편을 바라본다는 뜻이어서 이 문맥에 맞지 않는다. '늘어놓다'는 '나열하다', '걸맞다'는 '적합하다', '따르다'는 '수반되다'와 뜻이 통한다."},
