{"id":"m238","subj":"간호관리","unit":"간호기록","q":"다음 설명에 해당하는 간호기록 방법은?\n\n정상 범위나 기대되는 결과에서 벗어난 소견만 기록하여 기록 시간을 줄이며, 표준 지침과 흐름표를 함께 사용한다.","opts":["서술기록","초점기록","예외기록","문제중심기록"],"ans":2,"exp":"예외기록(charting by exception)은 미리 정한 표준과 정상 범위를 벗어난 사항만 적는 방법으로, 기록의 중복과 시간을 줄여 준다. 서술기록은 시간 순서대로 줄글로 적는 방법, 초점기록은 환자의 관심사를 초점으로 DAR 형식으로 적는 방법, 문제중심기록은 문제 목록에 따라 SOAP 형식으로 적는 방법이다."},
{"id":"m301","subj":"간호관리","unit":"환자안전","q":"리즌(Reason)의 스위스 치즈 모형에서 잠재적 오류에 해당하는 것만을 모두 고르면?\n\nㄱ. 간호 인력이 부족하게 짜인 근무 체계\nㄴ. 모양과 이름이 비슷한 약품을 나란히 두게 한 보관 방식\nㄷ. 간호사가 주입 펌프의 속도를 잘못 입력한 일\nㄹ. 의사가 처방 용량의 단위를 잘못 적은 일","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":0,"exp":"잠재적 오류는 인력 부족, 부적절한 설계와 절차, 교육 부족처럼 조직과 시스템 안에 숨어 있다가 사고의 바탕이 되는 조건이므로 ㄱ과 ㄴ이 해당한다. 펌프 입력 실수(ㄷ)와 처방 기재 실수(ㄹ)는 환자와 맞닿은 현장에서 사람이 저지르는 가시적 오류(활동적 오류)이다."},
{"id":"m302","subj":"간호관리","unit":"환자안전","q":"환자 확인 방법으로 옳지 않은 것은?","opts":["환자 이름과 등록번호 등 두 가지 이상의 지표로 확인한다.","환자가 자신의 이름을 직접 말하도록 개방형으로 묻는다.","병실 호수와 침상 번호를 지표로 삼아 확인한다.","의식이 없는 환자는 환자 인식 팔찌로 확인한다."],"ans":2,"exp":"병실 호수나 침상 번호는 환자가 옮기면 바뀔 수 있으므로 환자 확인 지표로 쓰지 않는다. 환자 확인은 이름, 등록번호, 생년월일 등 두 가지 이상의 지표로 하고, \"성함이 어떻게 되세요?\"처럼 환자가 직접 말하게 하는 개방형 질문을 쓰며, 의식이 없는 환자도 인식 팔찌 등으로 반드시 확인한다."},
{"id":"m303","subj":"간호관리","unit":"환자안전","q":"수술 직전 타임아웃(time-out)에서 수술팀이 함께 확인하는 사항만을 모두 고르면?\n\nㄱ. 환자\nㄴ. 수술 부위\nㄷ. 수술명\nㄹ. 예상 진료비","opts":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"ans":2,"exp":"타임아웃은 수술을 시작하기 직전에 수술팀 전원이 하던 일을 멈추고 정확한 환자, 정확한 수술 부위, 정확한 수술명을 함께 확인하는 절차이다. 다른 환자나 다른 부위를 수술하는 사고를 막기 위한 것이므로 진료비는 확인 사항이 아니다."},
{"id":"m304","subj":"간호관리","unit":"환자안전","q":"다른 환자의 약을 투여한 사실을 알게 된 간호사가 가장 먼저 해야 할 행동은?","opts":["환자안전사고 보고서를 작성한다.","환자의 상태와 활력징후를 확인한다.","담당 의사에게 알리고 처방을 받는다.","수간호사에게 사고 경위를 보고한다."],"ans":1,"exp":"투약 오류를 발견하면 가장 먼저 환자의 상태를 사정하여 위해가 생겼는지 확인한다. 그다음 담당 의사에게 알려 필요한 처치를 하고, 관리자에게 보고한 뒤 환자안전사고 보고서를 사실대로 작성한다. 환자의 안전을 확보하는 일이 보고와 기록보다 앞선다."},
{"id":"m305","subj":"간호관리","unit":"질 관리","q":"도나베디안(Donabedian)의 질 평가 접근법 중 결과적 평가의 지표만을 모두 고르면?\n\nㄱ. 간호 직원의 교육 이수 현황\nㄴ. 퇴원 환자의 간호 만족도\nㄷ. 투약 시 환자 확인 수행률\nㄹ. 욕창 발생률","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":2,"exp":"결과적 평가는 간호를 받은 뒤 환자에게 나타난 건강 상태의 변화와 만족도를 평가하므로 환자 만족도(ㄴ)와 욕창 발생률(ㄹ)이 지표가 된다. 직원 교육 이수 현황(ㄱ)은 간호가 제공되는 여건을 보는 구조적 평가이고, 환자 확인 수행률(ㄷ)은 간호 활동 자체를 보는 과정적 평가이다."},
{"id":"m306","subj":"간호관리","unit":"질 관리","q":"의료기관평가인증원의 급성기병원 인증기준에서 다음 내용과 같은 영역에 속하는 것은?\n\n○ 감염관리\n○ 인적자원관리\n○ 시설 및 환경관리","opts":["환자안전 보장활동","의약품관리","의료정보/의무기록관리","수술 및 마취진정관리"],"ans":2,"exp":"급성기병원 인증기준은 기본가치체계, 환자진료체계, 조직관리체계, 성과관리체계의 네 영역으로 이루어진다. 제시된 감염관리, 인적자원관리, 시설 및 환경관리는 조직관리체계에 속하며, 이 영역에는 질 향상 및 환자안전 활동, 경영 및 조직운영, 의료정보/의무기록관리도 들어 있다. 환자안전 보장활동은 기본가치체계에, 의약품관리와 수술 및 마취진정관리는 환자진료체계에 속한다."},
{"id":"m307","subj":"간호관리","unit":"질 관리","q":"A 병동의 지난달 자료가 다음과 같을 때, 재원일수 1,000일당 낙상 발생률은?\n\n○ 낙상 발생 건수: 6건\n○ 총 재원일수: 2,400일","opts":["0.4건","2.5건","4.0건","25건"],"ans":1,"exp":"재원일수 1,000일당 낙상 발생률은 낙상 발생 건수를 총 재원일수로 나누고 1,000을 곱하여 구한다. 6 ÷ 2,400 × 1,000 = 2.5이므로 1,000일당 2.5건이다. 재원일수가 다른 병동이나 기간을 견줄 수 있도록 같은 분모로 맞춘 결과 지표이다."},
{"id":"m308","subj":"간호관리","unit":"간호윤리","q":"한국간호사 윤리강령의 ‘간호사와 대상자’ 영역에 속하는 항목만을 모두 고르면?\n\nㄱ. 평등한 간호 제공\nㄴ. 간호표준 준수\nㄷ. 사생활 보호 및 비밀유지\nㄹ. 관계윤리 준수","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":1,"exp":"한국간호사 윤리강령은 ‘간호사와 대상자’, ‘전문인으로서 간호사의 의무’, ‘간호사와 협력자’의 세 영역으로 이루어진다. 평등한 간호 제공(ㄱ)과 사생활 보호 및 비밀유지(ㄷ)는 ‘간호사와 대상자’ 영역이다. 간호표준 준수(ㄴ)는 ‘전문인으로서 간호사의 의무’, 관계윤리 준수(ㄹ)는 ‘간호사와 협력자’ 영역에 속한다."},
{"id":"m309","subj":"간호관리","unit":"간호윤리","q":"연명의료결정법령상 연명의료에 해당하는 의학적 시술만을 모두 고르면?\n\nㄱ. 영양분과 물의 공급\nㄴ. 심폐소생술\nㄷ. 혈액투석\nㄹ. 인공호흡기 착용","opts":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"ans":3,"exp":"연명의료는 임종과정에 있는 환자에게 하는 심폐소생술, 혈액투석, 항암제 투여, 인공호흡기 착용, 체외생명유지술, 수혈, 혈압상승제 투여 등 치료 효과 없이 임종과정의 기간만 늘리는 의학적 시술이다. 영양분과 물의 공급, 산소의 단순 공급, 통증 완화를 위한 의료행위는 연명의료가 아니며 연명의료를 중단하더라도 계속해야 한다."},
{"id":"m310","subj":"간호관리","unit":"간호단위관리","q":"간호단위 환경관리에 대한 설명으로 옳지 않은 것은?","opts":["야간에는 발밑을 볼 수 있는 간접 조명을 켜 둔다.","면역 저하 환자의 보호 격리실은 음압을 유지한다.","환기할 때 바람이 환자에게 직접 닿지 않게 한다.","바닥의 물기는 발견하는 즉시 닦아 미끄럼을 막는다."],"ans":1,"exp":"면역이 떨어진 환자를 보호하는 격리실은 바깥의 오염된 공기가 들어오지 않도록 양압을 유지한다. 음압은 결핵처럼 공기로 전파되는 감염병 환자의 병실 공기가 밖으로 나가지 않게 할 때 쓴다. 야간 간접 조명, 직접 바람을 피한 환기, 바닥 물기 제거는 모두 알맞은 환경관리이다."},
{"id":"m311","subj":"간호관리","unit":"간호단위관리","q":"분말 소화기의 사용 순서를 바르게 나열한 것은?\n\n(가) 손잡이를 힘껏 움켜쥔다.\n(나) 안전핀을 뽑는다.\n(다) 빗자루로 쓸듯이 골고루 뿌린다.\n(라) 바람을 등지고 노즐을 불 쪽으로 향하게 한다.","opts":["(가) → (나) → (라) → (다)","(나) → (가) → (라) → (다)","(나) → (라) → (가) → (다)","(라) → (가) → (나) → (다)"],"ans":2,"exp":"소화기는 먼저 안전핀을 뽑고, 바람을 등진 채 노즐을 불 쪽으로 향하게 한 다음, 손잡이를 힘껏 움켜쥐고 빗자루로 쓸듯이 골고루 뿌린다. 안전핀을 뽑지 않으면 손잡이가 눌리지 않고, 노즐을 불 쪽으로 향하기 전에 손잡이를 쥐면 약제가 엉뚱한 곳에 뿌려진다."},
{"id":"m312","subj":"간호관리","unit":"간호단위관리","q":"병동에서 화재가 발생했을 때의 대처로 옳지 않은 것은?","opts":["거동이 불편한 환자는 승강기를 이용하여 대피시킨다.","불이 난 곳에서 가까운 환자부터 대피시킨다.","병실 문과 방화문을 닫아 연기가 퍼지는 것을 막는다.","젖은 수건으로 코와 입을 막고 낮은 자세로 이동하게 한다."],"ans":0,"exp":"화재 때 승강기는 정전으로 멈추거나 연기가 들어찰 수 있으므로 이용하지 않고 비상계단으로 대피한다. 불이 난 곳에서 가까운 환자부터 옮기고, 문과 방화문을 닫아 불과 연기의 확산을 막으며, 젖은 수건으로 코와 입을 막고 낮은 자세로 이동하게 하는 것은 옳은 대처이다."},
{"id":"m313","subj":"간호관리","unit":"간호단위관리","q":"간호단위의 약품 관리 방법으로 옳은 것만을 모두 고르면?\n\nㄱ. 고위험 약품은 다른 약품과 분리하여 보관하고 경고 표시를 붙인다.\nㄴ. 유효기간이 많이 남은 약품을 앞쪽에 두어 먼저 쓰게 한다.\nㄷ. 냉장 보관 약품은 냉장고의 온도를 정기적으로 점검하고 기록한다.\nㄹ. 개봉한 다회 용량 약품에는 개봉 일자를 적어 둔다.","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"ans":3,"exp":"약품은 선입선출 원칙에 따라 유효기간이 가까운 것을 앞쪽에 두어 먼저 쓰므로 ㄴ은 옳지 않다. 고위험 약품의 분리 보관과 경고 표시(ㄱ), 냉장고 온도의 정기 점검과 기록(ㄷ), 개봉한 다회 용량 약품의 개봉 일자 표시(ㄹ)는 모두 옳은 관리 방법이다."},
{"id":"m314","subj":"간호관리","unit":"간호단위관리","q":"간호단위 응급 카트(emergency cart)의 관리 방법으로 옳지 않은 것은?","opts":["정해진 위치에 두어 누구나 바로 찾을 수 있게 한다.","제세동기는 고장을 막기 위해 사용할 때에만 작동해 본다.","약품과 물품의 목록, 수량, 유효기간을 정기적으로 점검한다.","사용한 약품과 물품은 사용 후 곧바로 보충한다."],"ans":1,"exp":"응급 카트의 제세동기는 응급 상황에서 바로 쓸 수 있도록 평소에 정기적으로 작동 상태와 충전 상태를 점검해야 한다. 응급 카트는 정해진 위치에 두고, 약품과 물품의 목록·수량·유효기간을 정기적으로 점검하며, 사용한 뒤에는 곧바로 보충하여 언제든 쓸 수 있는 상태로 유지한다."},
{"id":"m315","subj":"간호관리","unit":"리더십","q":"거래적 리더십과 비교한 변혁적 리더십의 특징으로 옳지 않은 것은?","opts":["기준에서 벗어난 경우에만 개입하고 성과에 따라 보상한다.","구성원이 기존 방식에 의문을 품고 새롭게 생각하도록 자극한다.","비전을 제시하여 구성원이 기대 이상의 성과를 내도록 이끈다.","구성원 한 사람 한 사람의 요구에 관심을 두고 성장을 돕는다."],"ans":0,"exp":"기준에서 벗어날 때만 개입하는 예외 관리와 성과에 따라 보상하는 조건적 보상은 거래적 리더십의 구성요소이다. 변혁적 리더십은 지적 자극, 영감적 동기부여(비전 제시), 개별적 배려, 카리스마(이상적 영향력)로 구성원의 가치와 욕구 수준을 높여 기대 이상의 성과를 이끈다."},
{"id":"m316","subj":"간호관리","unit":"리더십","q":"조직이 부여한 공식적 지위에서 나오는 권력만을 모두 고르면?\n\nㄱ. 준거적 권력\nㄴ. 합법적 권력\nㄷ. 전문적 권력\nㄹ. 강압적 권력","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":2,"exp":"합법적 권력(ㄴ), 보상적 권력, 강압적 권력(ㄹ)은 조직이 준 직위와 그에 딸린 보상·처벌 권한에서 나오는 직위 권력이다. 준거적 권력(ㄱ)은 존경과 호감에서, 전문적 권력(ㄷ)은 지식과 기술에서 나오는 개인적 권력으로, 직위를 떠나도 유지된다."},
{"id":"m317","subj":"간호관리","unit":"동기부여","q":"허츠버그(Herzberg)의 동기－위생이론에서 동기요인만을 모두 고르면?\n\nㄱ. 임금\nㄴ. 성취감\nㄷ. 작업 조건\nㄹ. 책임","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":3,"exp":"동기요인은 일 자체에서 오는 만족으로 성취감(ㄴ), 인정, 책임(ㄹ), 승진, 성장이 해당한다. 임금(ㄱ), 작업 조건(ㄷ), 대인관계, 감독, 회사 정책은 위생요인이다. 위생요인은 부족하면 불만을 낳지만 채워져도 동기를 높이지는 않는다."},
{"id":"m318","subj":"간호관리","unit":"동기부여","q":"로크(Locke)의 목표설정이론에서 성과를 높이는 목표의 특성이 아닌 것은?","opts":["무엇을 언제까지 할지 구체적으로 정한 목표","쉽지 않지만 노력하면 이룰 수 있는 도전적인 목표","“최선을 다하자”처럼 포괄적으로 정한 목표","구성원이 자신의 목표로 받아들인 목표"],"ans":2,"exp":"목표설정이론은 구체적이고 어려운 목표가 막연하거나 쉬운 목표보다 높은 성과를 낳으며, 구성원이 목표를 받아들이고 진행 상황에 대한 피드백을 받을 때 효과가 커진다고 본다. “최선을 다하자” 같은 포괄적인 목표는 달성 기준이 뚜렷하지 않아 동기를 높이기 어렵다."},
{"id":"m319","subj":"간호관리","unit":"동기부여","q":"동기부여 이론 중 과정이론만을 모두 고르면?\n\nㄱ. 브룸(Vroom)의 기대이론\nㄴ. 허츠버그(Herzberg)의 동기－위생이론\nㄷ. 아담스(Adams)의 공정성이론\nㄹ. 맥클리랜드(McClelland)의 성취동기이론","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":1,"exp":"과정이론은 동기가 어떤 과정을 거쳐 생기는지를 설명하며 기대이론(ㄱ), 공정성이론(ㄷ), 목표설정이론, 강화이론이 속한다. 동기－위생이론(ㄴ)과 성취동기이론(ㄹ)은 매슬로의 욕구단계이론, 알더퍼의 ERG이론과 함께 무엇이 동기를 일으키는지를 다루는 내용이론이다."},
{"id":"m320","subj":"간호관리","unit":"동기부여","q":"맥그리거(McGregor)의 Y이론에 근거한 관리 방식이 아닌 것은?","opts":["구성원에게 의사결정에 참여할 기회를 준다.","권한을 위임하여 자율적으로 일하게 한다.","직무를 통해 성장하고 자아를 실현하도록 돕는다.","엄격한 감독과 처벌로 구성원을 통제한다."],"ans":3,"exp":"Y이론은 인간이 일을 싫어하지 않고 스스로 책임지며 자기 통제를 할 수 있다고 보므로, 참여, 권한 위임, 자율, 성장 기회를 강조하는 관리 방식을 택한다. 엄격한 감독과 처벌로 통제하는 것은 인간이 본래 일을 싫어하고 책임을 피하려 한다고 보는 X이론의 관리 방식이다."},
{"id":"m321","subj":"간호관리","unit":"의사소통","q":"다음 설명에 해당하는 의사소통 네트워크 유형은?\n\n○ 집단의 중심에 있는 한 사람에게 정보가 집중된다.\n○ 단순한 과업에서는 정보 전달이 빠르지만 구성원의 만족도는 낮다.","opts":["사슬형","원형","수레바퀴형","완전연결형"],"ans":2,"exp":"수레바퀴형은 중심 인물 한 명을 거쳐 정보가 오가므로 단순한 과업에서는 빠르고 정확하지만, 중심 인물 말고는 만족도가 낮다. 사슬형은 공식 명령 계통을 따라 위아래로만 흐르고, 완전연결형은 모든 구성원이 자유롭게 소통하여 만족도가 높다. 원형은 뚜렷한 중심 인물 없이 가까운 구성원끼리 정보를 주고받는다."},
{"id":"m322","subj":"간호관리","unit":"의사소통","q":"상향적 의사소통에 해당하는 것만을 모두 고르면?\n\nㄱ. 업무 지시\nㄴ. 제안 제도\nㄷ. 직무 편람\nㄹ. 고충 처리","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ"],"ans":3,"exp":"상향적 의사소통은 하급자의 의견과 정보가 상급자에게 전달되는 것으로 보고, 제안 제도(ㄴ), 고충 처리(ㄹ), 면담이 해당한다. 업무 지시(ㄱ)와 직무 편람(ㄷ), 게시판 공고는 위에서 아래로 전달되는 하향적 의사소통이다."},
{"id":"m323","subj":"간호관리","unit":"의사소통","q":"SBAR 의사소통에서 (가), (나)에 해당하는 단계를 옳게 짝 지은 것은?\n\n(가) \"수술 부위 출혈로 인한 저혈량 상태로 판단됩니다.\"\n(나) \"지금 오셔서 환자를 봐 주시고, 수액 처방을 부탁드립니다.\"","opts":["(가) Situation(상황), (나) Background(배경)","(가) Situation(상황), (나) Recommendation(권고)","(가) Assessment(사정), (나) Background(배경)","(가) Assessment(사정), (나) Recommendation(권고)"],"ans":3,"exp":"(가)는 보고자가 환자의 상태를 어떻게 판단하는지를 말하므로 Assessment(사정)이고, (나)는 필요한 조치를 요청하므로 Recommendation(권고)이다. Situation(상황)은 \"환자의 혈압이 80/50 mmHg로 떨어졌습니다\"처럼 지금 일어난 문제를, Background(배경)는 진단명·수술 이력 같은 관련 정보를 전하는 단계이다."},
{"id":"m324","subj":"간호관리","unit":"의사소통","q":"의사소통 네트워크 유형에 대한 설명으로 옳지 않은 것은?","opts":["Y형 － 모든 구성원이 서로 자유롭게 정보를 주고받는다.","사슬형 － 공식적인 명령 계통에 따라 위아래로 정보가 전달된다.","수레바퀴형 － 중심에 있는 한 사람에게 정보가 집중된다.","원형 － 뚜렷한 서열 없이 가까운 구성원끼리 정보를 주고받는다."],"ans":0,"exp":"모든 구성원이 서로 자유롭게 정보를 주고받는 것은 완전연결형이다. Y형은 뚜렷한 중심 인물은 없지만 다수를 대표하는 조정자를 거쳐 정보가 전달되는 유형으로, 라인과 스태프가 섞인 조직에서 볼 수 있다. 사슬형, 수레바퀴형, 원형의 설명은 옳다."},
{"id":"m325","subj":"간호관리","unit":"의사소통","q":"비공식적 의사소통(grapevine)에 대한 설명으로 옳지 않은 것은?","opts":["공식적 의사소통보다 전달 속도가 빠르다.","정보가 왜곡되거나 소문으로 번질 수 있다.","조직도에 나타난 공식 경로를 따라 전달된다.","구성원의 감정과 태도를 파악하는 데 도움이 된다."],"ans":2,"exp":"그레이프바인은 조직도의 공식 경로와 관계없이 구성원 사이의 인간관계를 따라 포도 넝쿨처럼 퍼지는 비공식적 의사소통이다. 전달 속도가 빠르고 구성원의 감정과 태도를 알 수 있게 해 주지만, 정보가 왜곡되거나 소문으로 번질 수 있고 책임 소재가 분명하지 않다."},
{"id":"m326","subj":"간호관리","unit":"의료법규","q":"「의료법 시행규칙」상 5년간 보존해야 하는 기록만을 모두 고르면?\n\nㄱ. 간호기록부\nㄴ. 처방전\nㄷ. 환자 명부\nㄹ. 진료기록부","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"ans":1,"exp":"간호기록부(ㄱ)와 환자 명부(ㄷ)의 보존 기간은 5년이다. 검사내용 및 검사소견기록, 방사선 사진과 그 소견서, 조산기록부도 5년이다. 처방전(ㄴ)은 2년, 진단서 등의 부본은 3년, 진료기록부(ㄹ)와 수술기록은 10년 동안 보존한다."},
{"id":"m327","subj":"간호관리","unit":"감염관리","q":"공기주의(airborne precautions)를 적용해야 하는 질환만을 모두 고르면?\n\nㄱ. 홍역\nㄴ. 인플루엔자\nㄷ. 수두\nㄹ. 활동성 폐결핵","opts":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"ans":3,"exp":"홍역(ㄱ), 수두(ㄷ), 활동성 폐결핵(ㄹ)은 작은 입자가 공기 중에 떠다니며 전파되므로 음압 격리실과 N95 마스크를 사용하는 공기주의를 적용한다. 인플루엔자(ㄴ)는 큰 비말이 가까운 거리에서 전파되므로 수술용 마스크를 쓰는 비말주의 대상이다."},
{"id":"m328","subj":"간호관리","unit":"법적 의무","q":"「의료법 시행규칙」상 의료기관에 게시해야 하는 환자의 권리에 해당하지 않는 것은?","opts":["진료받을 권리","비밀을 보호받을 권리","상담·조정을 신청할 권리","진료비를 감면받을 권리"],"ans":3,"exp":"「의료법 시행규칙」은 의료기관에 게시해야 하는 환자의 권리로 진료받을 권리, 알권리 및 자기결정권, 비밀을 보호받을 권리, 상담·조정을 신청할 권리를 정하고 있다. 환자의 의무로는 의료인에 대한 신뢰·존중 의무와 부정한 방법으로 진료를 받지 않을 의무가 있다. 진료비를 감면받을 권리는 여기에 없다."},
{"id":"c02","subj":"지역사회간호","unit":"역학 지표","q":"코호트 연구에서 구하는 상대위험비(비교위험도)의 산출식은?","opts":["노출군의 발생률 － 비노출군의 발생률","노출군의 발생률 / 비노출군의 발생률","비노출군의 발생률 / 노출군의 발생률","환자군의 노출 오즈 / 대조군의 노출 오즈"],"ans":1,"exp":"상대위험비는 노출군의 발생률을 비노출군의 발생률로 나눈 값으로, 노출된 사람이 노출되지 않은 사람보다 질병에 걸릴 위험이 몇 배인지를 나타낸다. 두 발생률의 차이는 기여위험도(귀속위험도)이고, 환자군과 대조군의 노출 오즈의 비는 환자－대조군 연구에서 구하는 교차비이다."},
{"id":"c03","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 제1급감염병에 해당하는 것은?","opts":["결핵","에볼라바이러스병","홍역","B형간염"],"ans":1,"exp":"제1급감염병은 치명률이 높거나 집단 발생 우려가 커서 발생 즉시 신고하고 음압격리 같은 높은 수준의 격리가 필요한 감염병으로, 에볼라바이러스병이 해당한다. 결핵과 홍역은 제2급, B형간염은 제3급이다. 감염병 분류는 법령 개정으로 바뀔 수 있으니 시험 전에 현행 법령을 확인한다."},
{"id":"c04","subj":"지역사회간호","unit":"건강행위 이론","q":"범이론적 모형에서 6개월 이내에 행동을 바꿀 의도가 있는 변화 단계는?","opts":["계획 전 단계","계획 단계","준비 단계","행동 단계"],"ans":1,"exp":"계획 단계(숙고 단계)는 6개월 이내에 변화할 의도가 있는 단계이다. 계획 전 단계는 6개월 이내에 변화 의도가 없고, 준비 단계는 1개월 이내에 실천할 의도가 있으며, 행동 단계는 실천한 지 6개월 미만, 유지 단계는 6개월 이상 지속한 단계이다."},
{"id":"c05","subj":"지역사회간호","unit":"가족간호","q":"다음 설명에 해당하는 가족사정 도구는?\n\n○ 가족을 가운데 원에 두고 학교, 직장, 보건기관 등을 둘레의 원으로 그린다.\n○ 가족과 외부 체계 사이의 지지, 갈등, 에너지의 흐름을 선으로 나타낸다.","opts":["가계도","가족연대기","외부체계도","사회지지도"],"ans":2,"exp":"외부체계도(생태도)는 가족을 둘러싼 외부 체계와의 관계와 에너지 흐름을 보여 준다. 가계도는 3세대 이상의 가족 구조를, 가족연대기는 가족에게 일어난 중요한 사건을 시간 순서대로, 사회지지도는 가장 취약한 구성원을 중심으로 한 지지 체계를 나타낸다."},
{"id":"c06","subj":"지역사회간호","unit":"인구","q":"출산 수준을 나타내는 지표 중 다음 설명에 해당하는 것은?\n\n한 여성이 가임 기간(15～49세)에 낳을 것으로 예상되는 평균 출생아 수로, 연령별 출산율을 모두 더하여 구한다.","opts":["조출생률","일반출산율","합계출산율","순재생산율"],"ans":2,"exp":"합계출산율은 연령별 출산율을 모두 더해 구하며 국가 간 출산 수준 비교에 쓴다. 조출생률은 인구 1,000명당 출생아 수, 일반출산율은 가임 여성 1,000명당 출생아 수이다. 순재생산율은 여아만 세고 어머니의 사망률까지 고려한 지표이다."},
{"id":"c07","subj":"지역사회간호","unit":"일차보건의료","q":"세계보건기구(WHO)가 제시한 일차보건의료의 접근 원칙(4A)이 아닌 것은?","opts":["접근성","전문성","수용 가능성","지불 부담 능력"],"ans":1,"exp":"4A는 접근성(Accessible), 수용 가능성(Acceptable), 주민 참여(Available), 지불 부담 능력(Affordable)이다. 일차보건의료는 주민이 쉽게 이용하고, 받아들일 수 있고, 참여하며, 부담할 수 있는 기본 보건의료를 강조한다."},
{"id":"c08","subj":"지역사회간호","unit":"산업보건","q":"「근로자 건강진단 실시기준」상 다음 근로자에게 해당하는 건강관리구분은?\n\nA 씨는 특수건강진단 결과 직업성 질병의 소견을 보여 사후관리가 필요하다는 판정을 받았다.","opts":["A","C₁","D₁","D₂"],"ans":2,"exp":"D₁은 직업성 질병의 소견을 보여 사후관리가 필요한 근로자(직업병 유소견자)이다. A는 건강한 근로자, C₁은 직업성 질병으로 진전될 우려가 있어 추적 검사 등 관찰이 필요한 근로자, D₂는 일반 질병의 소견을 보여 사후관리가 필요한 근로자이다. C는 관찰, D는 질병이고 숫자 1은 직업성, 2는 일반 질병으로 구분한다."},
{"id":"c09","subj":"지역사회간호","unit":"보건의료체계","q":"등록된 주민 수에 따라 의사에게 일정액을 지급하는 진료비 지불제도는?","opts":["행위별수가제","포괄수가제","인두제","총액계약제"],"ans":2,"exp":"인두제는 등록 인원 수로 보수가 정해져 예방 활동에 힘쓰게 되지만 과소 진료나 상급기관 의뢰 증가의 우려가 있다. 행위별수가제는 제공한 서비스 항목마다 값을 치르고, 포괄수가제는 질병군별로 정해진 금액을, 총액계약제는 보험자와 의사단체가 계약한 총액을 지급한다."},
{"id":"c12","subj":"지역사회간호","unit":"보건행정","q":"우리나라에서 보건소의 설치와 운영에 관한 사항을 규정한 법률은?","opts":["보건의료기본법","지역보건법","국민건강증진법","농어촌 등 보건의료를 위한 특별조치법"],"ans":1,"exp":"보건소와 보건지소, 건강생활지원센터는 「지역보건법」에 따라 설치한다. 보건진료소와 보건진료 전담공무원의 근거는 「농어촌 등 보건의료를 위한 특별조치법」이다. 두 법의 대상을 바꾸어 묻는 선지가 자주 나온다."},
{"id":"c13","subj":"지역사회간호","unit":"지역사회 개념","q":"지역사회 유형 중 감정적 지역사회에 해당하는 것은?","opts":["소속 공동체","지정학적 공동체","자원 공동체","대면 공동체"],"ans":0,"exp":"감정적 지역사회는 공통의 감정과 유대감으로 묶인 것으로, 같은 고향이나 학교처럼 소속감으로 맺어진 소속 공동체와 특수 흥미 공동체가 있다. 지정학적 공동체와 대면 공동체는 구조적 지역사회이고, 자원 공동체는 기능적 지역사회이다."},
{"id":"c15","subj":"지역사회간호","unit":"간호 이론","q":"다음 설명에 해당하는 뉴만(Neuman) 건강관리체계이론의 개념은?\n\n○ 대상 체계의 가장 바깥에 있으며 수시로 변한다.\n○ 스트레스원이 정상방어선에 닿지 않도록 완충 역할을 한다.","opts":["저항선","기본 구조","유연방어선","정상방어선"],"ans":2,"exp":"유연방어선은 가장 바깥의 방어선으로 스트레스원을 일차로 막아 주며, 이를 강화하는 것이 일차 예방이다. 정상방어선은 대상자가 오랫동안 유지해 온 평소의 안녕 상태이고, 저항선은 기본 구조를 둘러싼 가장 안쪽의 방어선으로 정상방어선이 뚫렸을 때 작동한다."},
{"id":"c16","subj":"지역사회간호","unit":"간호 이론","q":"다음 사례의 대상자에게 적용할 오렘(Orem) 이론의 간호체계는?\n\n뇌졸중으로 편마비가 있는 A 씨는 식사는 혼자 하지만, 목욕과 옷 입기는 방문간호사의 도움을 받아서 한다.","opts":["전체적 보상체계","부분적 보상체계","교육지지적 체계","발달적 자가간호체계"],"ans":1,"exp":"부분적 보상체계는 대상자가 자가간호의 일부는 스스로 하고 나머지는 간호사가 도와 함께 수행하는 체계이다. 전체적 보상체계는 대상자가 자가간호를 전혀 하지 못할 때, 교육지지적 체계는 할 능력은 있으나 지식과 기술, 지지가 필요할 때 적용한다. 발달적 자가간호는 간호체계가 아니라 자가간호요구의 한 종류이다."},
{"id":"c17","subj":"지역사회간호","unit":"간호 이론","q":"로이(Roy)의 적응이론에서 대상자가 지금 직접 마주하고 있는 자극은?","opts":["초점자극","연관자극","잔여자극","인지자극"],"ans":0,"exp":"초점자극은 당면한 상황에서 대상자에게 직접 영향을 주는 자극이다. 연관자극은 초점자극 말고 그 상황에 함께 작용하는 다른 자극이고, 잔여자극은 신념이나 태도처럼 영향을 줄 수 있으나 측정하기 어려운 자극이다. 인지자극이라는 분류는 없다."},
{"id":"c18","subj":"지역사회간호","unit":"간호 이론","q":"체계이론에서 산출의 일부가 체계로 되돌아가 투입과 변환을 조절하는 과정은?","opts":["투입","변환","경계","회환"],"ans":3,"exp":"회환(환류, 피드백)은 산출 결과를 다시 투입에 반영하여 체계가 스스로를 조절하게 하는 과정이다. 투입은 체계로 들어오는 물질·에너지·정보이고, 변환은 투입을 산출로 바꾸는 과정이며, 경계는 체계를 환경과 구분하는 테두리이다."},
{"id":"c19","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 사례에서 지역사회간호사가 수행한 역할은?\n\nA 간호사는 의료비 지원 제도를 몰라 치료를 받지 못하던 외국인 근로자에게 그의 권리를 알려 주고, 관계 기관에 근로자의 처지를 대신 설명하여 지원을 받게 하였다.","opts":["교육자","대변자(옹호자)","연구자","관리자"],"ans":1,"exp":"대변자(옹호자)는 대상자가 자신의 권리를 찾을 수 있도록 정보를 주고, 대상자의 입장에 서서 의견을 대신 말해 주는 역할이다. 교육자는 건강 지식과 기술을 가르치는 역할, 관리자는 사업을 계획·조직·감독하는 역할이다."},
{"id":"c20","subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 지역사회 자료수집 방법은?\n\n자동차를 타거나 걸어서 지역을 두루 돌아보며 주거 상태, 생활 모습, 지역의 분위기 등을 짧은 시간에 살핀다.","opts":["참여관찰","차창 밖 조사","정보원 면담","설문지 조사"],"ans":1,"exp":"차창 밖 조사(지역 시찰)는 지역을 돌아다니며 눈으로 살펴 전체 모습을 짧은 시간에 파악하는 방법이다. 참여관찰은 지역 행사 등에 직접 참여하면서 관찰하는 것이고, 정보원 면담은 지역 지도자 같은 주요 인물을 만나 묻는 것이며, 설문지 조사는 주민에게 구조화된 질문을 하여 자료를 얻는 것이다."},
{"id":"c21","subj":"지역사회간호","unit":"간호과정","q":"오마하(Omaha) 문제분류체계의 영역에 해당하지 않는 것은?","opts":["환경 영역","영적 영역","생리 영역","건강관련행위 영역"],"ans":1,"exp":"오마하 문제분류체계의 영역은 환경, 심리사회, 생리, 건강관련행위의 네 가지이다. 영적 영역이라는 영역은 따로 없으며, 영성에 관한 문제는 심리사회 영역 안의 문제로 다룬다."},
{"id":"c22","subj":"지역사회간호","unit":"간호과정","q":"다음 건강문제의 BPRS 점수는? (단, BPRS ＝ (A ＋ 2B) × C로 계산한다)\n\n○ A(문제의 크기): 6점\n○ B(문제의 심각도): 7점\n○ C(사업의 추정 효과): 9점","opts":["117","171","180","270"],"ans":2,"exp":"BPRS는 (A ＋ 2B) × C로 구한다. (6 ＋ 2 × 7) × 9 ＝ 20 × 9 ＝ 180점이다. 심각도 B에만 2를 곱한다는 점을 놓치면 (6 ＋ 7) × 9 ＝ 117처럼 잘못 계산하게 된다."},
{"id":"c23","subj":"지역사회간호","unit":"간호과정","q":"PATCH 모형에서 건강문제의 우선순위를 정하는 기준은?","opts":["건강문제의 크기와 심각도","건강문제의 중요성과 변화 가능성","사업의 경제성과 수용성","주민의 관심도와 자원 동원 가능성"],"ans":1,"exp":"PATCH는 건강문제의 중요성과 변화 가능성을 기준으로 삼아, 중요하고 변화 가능성도 높은 문제를 가장 먼저 다룬다. 문제의 크기와 심각도는 BPRS의 평가 항목이고, 경제성과 수용성은 PEARL의 항목이다."},
{"id":"c24","subj":"지역사회간호","unit":"간호과정","q":"우선순위 결정에 쓰는 PEARL에 대한 설명으로 옳은 것은?","opts":["건강문제의 크기, 심각도, 사업 효과를 점수로 매긴다.","건강문제의 중요성과 변화 가능성을 기준으로 삼는다.","적절성, 경제성, 수용성, 자원, 적법성으로 실행 가능성을 판단한다.","주요 보건지표의 상대적 크기와 변화 추세를 기준으로 삼는다."],"ans":2,"exp":"PEARL은 BPRS로 점수를 매긴 뒤 사업을 실제로 할 수 있는지 판단하는 기준으로, 적절성·경제성·수용성·자원·적법성 다섯 항목 가운데 하나라도 0이면 사업을 시행하지 않는다. 크기·심각도·효과는 BPRS, 중요성과 변화 가능성은 PATCH, 상대적 크기와 변화 추세는 황금다이아몬드 방식의 기준이다."},
{"id":"c25","subj":"지역사회간호","unit":"간호과정","q":"SMART 기준에 따라 기술한 지역사회 간호사업 목표는?","opts":["A 동 주민 모두의 건강 수준을 지금보다 높인다.","보건소 간호사가 고혈압 관리 교육을 열심히 실시한다.","가능한 한 이른 시기에 A 동 성인의 흡연율을 낮춘다.","1년 뒤까지 A 동 성인의 흡연율을 25%에서 20%로 낮춘다."],"ans":3,"exp":"SMART 목표는 구체적이고, 측정할 수 있으며, 달성 가능하고, 문제와 관련이 있고, 기한이 있어야 한다. 흡연율을 25%에서 20%로 낮춘다는 목표만 대상과 지표, 수치, 기한을 모두 밝혔다. 나머지는 수치와 기한이 없거나, 결과가 아닌 간호사의 활동을 적은 것이다."},
{"id":"c26","subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 보건사업 평가 범주는?\n\n사업의 실적을 지역사회의 요구량과 비교하여, 사업이 요구를 얼마나 충족하였는지 본다.","opts":["사업의 적합성 평가","사업의 효율성 평가","사업 진행에 대한 평가","투입된 노력에 대한 평가"],"ans":0,"exp":"적합성 평가는 사업 실적이 지역사회 요구에 비추어 충분한지를 본다. 효율성 평가는 투입한 비용에 견준 성과를, 사업 진행 평가는 일정대로 진행되는지를, 투입된 노력 평가는 들어간 인력·시간·물자의 양을 본다."},
{"id":"c27","subj":"지역사회간호","unit":"간호과정","q":"보건소가 다음 SWOT 분석 결과를 근거로 수립할 전략은?\n\n○ 방문간호 인력이 부족하다.\n○ 직원의 사업 경험이 적다.\n○ 정부가 방문건강관리 예산을 늘렸다.\n○ 건강관리에 대한 주민의 관심이 높아졌다.","opts":["SO 전략(강점－기회)","ST 전략(강점－위협)","WO 전략(약점－기회)","WT 전략(약점－위협)"],"ans":2,"exp":"인력 부족과 적은 사업 경험은 내부의 약점(W)이고, 예산 확대와 주민의 관심 증가는 외부의 기회(O)이므로 WO 전략이다. 외부의 기회를 살려 내부의 약점을 보완하는 국면전환 전략을 쓴다. SO는 강점과 기회, ST는 강점과 위협, WT는 약점과 위협이 만날 때의 전략이다."},
{"id":"c28","subj":"지역사회간호","unit":"가정간호·방문·사례관리","q":"간호사가 하루에 여러 가정을 방문할 때 가장 먼저 방문해야 할 가정은?","opts":["활동성 폐결핵 환자가 있는 가정","생후 2주 된 신생아가 있는 가정","옴 환자가 있는 가정","세균성이질 환자가 있는 가정"],"ans":1,"exp":"하루에 여러 가정을 방문할 때는 간호사가 감염을 옮기지 않도록 면역력이 약하고 감염성이 없는 대상부터 방문하고, 감염성 질환자는 뒤로 미룬다. 신생아 가정을 먼저 방문하고 결핵, 옴, 세균성이질 환자 가정은 그 뒤에 방문한다."},
{"id":"c30","subj":"지역사회간호","unit":"사회보장","q":"우리나라 사회보장제도 중 공공부조에 해당하는 것은?","opts":["의료급여","국민건강보험","산업재해보상보험","노인장기요양보험"],"ans":0,"exp":"공공부조는 생활이 어려운 국민에게 국가가 조세로 최저 생활을 보장하는 제도로, 의료급여와 국민기초생활보장이 해당한다. 국민건강보험, 산업재해보상보험, 노인장기요양보험은 보험료를 재원으로 하는 사회보험이다."},
{"id":"c31","subj":"지역사회간호","unit":"사회보장","q":"우리나라 국민건강보험의 특징으로 옳지 않은 것은?","opts":["법률이 정한 요건에 해당하면 가입이 강제된다.","보험료는 소득 등 부담 능력에 따라 차등 부과한다.","보험료를 많이 낸 사람일수록 더 많은 급여를 받는다.","1년 단위로 수입과 지출을 맞추는 단기 보험이다."],"ans":2,"exp":"건강보험은 보험료는 부담 능력에 따라 다르게 내지만 급여는 낸 보험료와 관계없이 필요에 따라 균등하게 받는다. 이로써 소득 재분배와 위험 분산이 이루어진다. 강제 가입, 부담 능력에 따른 보험료, 단기 보험은 모두 옳은 특징이다."},
{"id":"c32","subj":"지역사회간호","unit":"사회보장","q":"요양급여비용을 심사하고 요양급여의 적정성을 평가하는 기관은?","opts":["국민건강보험공단","건강보험심사평가원","보건복지부","건강보험정책심의위원회"],"ans":1,"exp":"건강보험심사평가원은 요양급여비용의 심사와 요양급여의 적정성 평가를 맡는다. 국민건강보험공단은 보험자로서 가입자 자격 관리, 보험료 부과·징수, 보험급여 비용 지급을 맡고, 보건복지부는 제도를 관장한다."},
{"id":"c33","subj":"지역사회간호","unit":"보건의료체계","q":"조세를 재원으로 국가가 국민에게 의료를 직접 제공하는 의료보장 유형은?","opts":["민간보험 방식","사회보험 방식(NHI)","의료저축계정 방식","국가보건서비스 방식(NHS)"],"ans":3,"exp":"국가보건서비스 방식은 조세로 재원을 마련해 국가가 의료를 직접 제공하는 방식으로 영국, 스웨덴 등이 채택하고 있다. 사회보험 방식은 가입자가 낸 보험료를 재원으로 하며 우리나라, 독일, 일본이 해당한다."},
{"id":"c34","subj":"지역사회간호","unit":"노인보건·장기요양","q":"노인장기요양보험법령상 장기요양인정을 신청할 수 있는 사람은?","opts":["알츠하이머병으로 혼자 생활하기 어려운 60세 건강보험 가입자","교통사고로 하반신이 마비된 45세 건강보험 가입자","고혈압 약을 복용하며 혼자 사는 62세 의료급여 수급권자","지체장애로 휠체어를 사용하는 30세 건강보험 피부양자"],"ans":0,"exp":"장기요양인정은 65세 이상 노인이거나, 65세 미만이면서 치매·뇌혈관성 질환·파킨슨병 같은 노인성 질병을 가진 사람이 신청할 수 있다. 알츠하이머병은 노인성 질병이므로 60세라도 신청할 수 있다. 교통사고 후유증, 고혈압, 지체장애는 65세 미만인 사람의 신청 사유가 되지 않는다."},
{"id":"c35","subj":"지역사회간호","unit":"노인보건·장기요양","q":"노인장기요양보험의 재가급여에 해당하지 않는 것은?","opts":["방문목욕","주·야간보호","단기보호","노인요양시설 입소"],"ans":3,"exp":"재가급여에는 방문요양, 방문목욕, 방문간호, 주·야간보호, 단기보호, 복지용구 같은 기타 재가급여가 있다. 노인요양시설이나 노인요양공동생활가정에 입소하여 받는 급여는 시설급여이다."},
{"id":"c36","subj":"지역사회간호","unit":"보건행정","q":"지역보건법령상 지역보건의료계획에 대한 설명으로 옳은 것은?","opts":["보건복지부장관이 수립하여 시·도지사에게 통보한다.","연차별 시행계획은 2년마다 수립한다.","시·도지사와 시장·군수·구청장이 4년마다 수립한다.","수립 과정에서 지역주민의 의견은 수렴하지 않는다."],"ans":2,"exp":"지역보건의료계획은 시·도지사와 시장·군수·구청장이 4년마다 수립하고, 그에 따른 연차별 시행계획은 해마다 수립한다. 지역 실정에 맞추어 아래에서 위로 올라가는 방식으로 세우며, 수립 과정에서 주민의 의견을 듣는다."},
{"id":"c37","subj":"지역사회간호","unit":"보건행정","q":"보건진료 전담공무원에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 따라 보건지소에 배치된다.","도시 지역의 동마다 1명씩 배치된다.","의사의 지시가 있을 때에만 의료행위를 할 수 있다.","간호사·조산사 면허를 가지고 직무교육을 받은 사람이다."],"ans":3,"exp":"보건진료 전담공무원은 「농어촌 등 보건의료를 위한 특별조치법」에 따라 의료 취약지역의 보건진료소에서 근무하며, 간호사나 조산사 면허를 가진 사람이 보건복지부장관이 실시하는 24주 이상의 직무교육을 받아야 한다. 법령이 정한 범위의 경미한 의료행위를 스스로 할 수 있다."},
{"id":"c38","subj":"지역사회간호","unit":"일차보건의료","q":"다음 설명에 해당하는 것은?\n\n○ 1978년 세계보건기구와 유니세프가 연 국제회의에서 채택되었다.\n○ ‘2000년까지 모든 인류에게 건강을’이라는 목표를 이루기 위한 전략으로 일차보건의료를 제시하였다.","opts":["알마아타 선언","오타와 헌장","방콕 헌장","리우 선언"],"ans":0,"exp":"1978년 알마아타 선언은 일차보건의료를 모든 인류의 건강을 실현하는 핵심 전략으로 채택하였다. 오타와 헌장(1986년)과 방콕 헌장(2005년)은 건강증진에 관한 국제회의의 결과물이고, 리우 선언(1992년)은 환경과 개발에 관한 선언이다."},
{"id":"c39","subj":"지역사회간호","unit":"일차보건의료","q":"알마아타 선언에서 제시한 일차보건의료의 필수 사업 내용이 아닌 것은?","opts":["안전한 식수 공급과 기본 환경위생","가족계획을 포함한 모자보건","희귀 질환에 대한 전문 치료","주요 감염병에 대한 예방접종"],"ans":2,"exp":"일차보건의료의 필수 내용은 보건교육, 영양 개선, 안전한 물과 기본 환경위생, 모자보건과 가족계획, 예방접종, 풍토병 관리, 흔한 질병과 상해의 치료, 필수 의약품 공급이다. 고도의 전문 치료는 지역사회에서 쉽게 이용할 수 있는 기본 의료가 아니므로 포함되지 않는다."},
{"id":"c40","subj":"지역사회간호","unit":"질병 예방","q":"질병 발생을 설명하는 역학 모형 중 다음 설명에 해당하는 것은?\n\n유전적 소인을 가진 숙주가 중심에 있고, 그를 둘러싼 생물학적·물리화학적·사회적 환경과의 상호작용으로 질병이 발생한다고 본다.","opts":["역학적 삼각형 모형","거미줄 모형","건강신념 모형","수레바퀴 모형"],"ans":3,"exp":"수레바퀴 모형은 유전적 소인을 가진 숙주가 중심에 있고 환경이 이를 둘러싼 모양으로, 질병에 따라 각 부분의 크기가 달라진다. 역학적 삼각형 모형은 병원체·숙주·환경의 균형으로, 거미줄 모형은 여러 요인이 얽힌 관계로 질병을 설명한다. 건강신념 모형은 건강 행위를 설명하는 이론이다."},
{"id":"c42","subj":"지역사회간호","unit":"역학 지표","q":"발생률이 일정한 만성질환의 유병률이 높아지는 경우는?","opts":["치명률이 높아져 환자가 일찍 사망하였다.","완치율이 높아져 이환 기간이 짧아졌다.","환자가 다른 지역으로 많이 전출하였다.","완치되지는 않으나 환자의 생존 기간이 길어졌다."],"ans":3,"exp":"유병률은 대략 발생률에 이환 기간을 곱한 값이다. 발생률이 같아도 완치되지 않은 채 생존 기간이 길어지면 이환 기간이 늘어 유병률이 높아진다. 일찍 사망하거나 빨리 완치되거나 환자가 전출하면 유병률은 오히려 낮아진다."},
{"id":"c43","subj":"지역사회간호","unit":"역학 지표","q":"어떤 질병의 발생률을 산출할 때 분모에서 제외해야 하는 사람은?","opts":["관찰 시작 시점에 이미 그 질병을 앓고 있는 사람","관찰 기간에 그 질병이 새로 발생한 사람","그 질병의 위험 요인에 노출된 적이 있는 사람","그 질병에 대한 면역이 없는 건강한 사람"],"ans":0,"exp":"발생률의 분모는 그 질병에 걸릴 위험이 있는 인구(위험 인구)이다. 관찰을 시작할 때 이미 그 질병을 앓고 있는 사람과 면역이 있어 걸릴 수 없는 사람은 새로 발병할 수 없으므로 분모에서 뺀다. 관찰 기간에 새로 발병한 사람은 관찰을 시작할 때 위험 인구였으므로 분모와 분자에 모두 들어간다."},
{"id":"c46","subj":"지역사회간호","unit":"역학 지표","q":"다음 선별검사 결과로 산출한 양성예측도[%]는?\n\n○ 검사 양성: 환자 90명, 비환자 90명\n○ 검사 음성: 환자 10명, 비환자 810명","opts":["10","50","90","99"],"ans":1,"exp":"양성예측도는 검사 양성인 사람 가운데 실제 환자의 비율이다. 90 ÷ (90 + 90) × 100 = 50%. 90%는 민감도(90 ÷ 100)이자 특이도(810 ÷ 900)이고, 약 99%는 음성예측도(810 ÷ 820)이다. 10%는 위음성률(10 ÷ 100)이다."},
{"id":"c47","subj":"지역사회간호","unit":"역학 지표","q":"민감도와 특이도가 일정한 검사를 유병률이 높은 집단에 적용할 때의 변화는?","opts":["양성예측도가 높아진다.","음성예측도가 높아진다.","민감도가 높아진다.","특이도가 높아진다."],"ans":0,"exp":"유병률이 높아지면 검사 양성자 가운데 진짜 환자의 몫이 커져 양성예측도가 높아지고, 음성예측도는 낮아진다. 민감도와 특이도는 검사 자체의 성질이어서 유병률에 따라 달라지지 않는다."},
{"id":"c51","subj":"지역사회간호","unit":"감염병 관리","q":"다음 사례에서 신생아가 획득한 면역의 종류는?\n\nB형간염 표면항원 양성인 산모에게서 태어난 신생아에게 출생 직후 B형간염 면역글로불린을 주사하였다.","opts":["자연능동면역","인공능동면역","자연수동면역","인공수동면역"],"ans":3,"exp":"다른 사람이나 동물이 만든 항체를 주사로 받아 얻는 면역은 인공수동면역으로, 효과가 빨리 나타나지만 오래가지 않는다. 백신 접종으로 얻는 면역은 인공능동면역, 태반이나 모유로 받는 면역은 자연수동면역, 감염된 뒤 얻는 면역은 자연능동면역이다."},
{"id":"c53","subj":"지역사회간호","unit":"감염병 관리","q":"감염병 관리에서 다음 설명에 해당하는 사람은?\n\n○ 감염되었으나 처음부터 끝까지 증상이 나타나지 않는다.\n○ 병원체를 배출하면서 자유롭게 활동하여 감염병 관리가 가장 어렵다.","opts":["건강 보균자","잠복기 보균자","회복기 보균자","현성 감염자"],"ans":0,"exp":"건강 보균자는 증상이 전혀 없어 본인도 주위에서도 감염 사실을 모른 채 활동하므로 관리가 가장 어렵다. 잠복기 보균자는 증상이 나타나기 전에, 회복기 보균자는 증상이 사라진 뒤에 병원체를 배출하는 사람이다. 현성 감염자는 증상이 드러난 환자이다."},
{"id":"c54","subj":"지역사회간호","unit":"감염병 관리","q":"다음 사례의 유행 곡선으로 알 수 있는 감염병 유행 양상은?\n\nA 초등학교에서 급식을 먹은 다음 날 설사 환자가 한꺼번에 발생하였다. 유행 곡선은 봉우리가 하나이고, 모든 환자가 한 번의 잠복기 범위 안에 발생하였다.","opts":["공통 감염원 지속 노출 유행","사람 간 전파에 의한 연쇄 유행","공통 감염원 단일 노출 유행","주기적으로 반복되는 계절 유행"],"ans":2,"exp":"같은 감염원에 한 번 함께 노출되면 환자가 짧은 기간에 몰려 발생하여 봉우리가 하나인 곡선이 된다. 지속 노출이면 봉우리가 뚜렷하지 않고 오래 이어지며, 사람 간 전파이면 봉우리가 여러 개 생기면서 유행 기간이 길어진다."},
{"id":"c56","subj":"지역사회간호","unit":"건강증진","q":"다음 사례에 해당하는 오타와 헌장의 건강증진 활동 영역은?\n\nA 국가는 공공장소를 금연구역으로 지정하는 법을 만들고 담배에 건강증진부담금을 매겼다.","opts":["건강한 공공정책 수립","개인의 기술 개발","지역사회 활동 강화","보건의료서비스의 방향 재설정"],"ans":0,"exp":"법률, 조세, 규제 등으로 건강에 이로운 선택을 쉽게 만드는 것은 건강한 공공정책 수립이다. 개인의 기술 개발은 보건교육으로 개인의 역량을 키우는 것, 지역사회 활동 강화는 주민 참여와 조직화, 보건의료서비스의 방향 재설정은 치료 중심에서 예방과 건강증진 중심으로 바꾸는 것이다."},
{"id":"c57","subj":"지역사회간호","unit":"건강증진","q":"제6차 국민건강증진종합계획(2026～2030)의 총괄 목표는?","opts":["평균수명 연장과 의료비 절감","건강수명 연장과 건강형평성 제고","질병 사망률 감소와 의료 접근성 향상","출산율 제고와 노인 부양 부담 완화"],"ans":1,"exp":"국민건강증진종합계획(Health Plan 2030)은 ‘모든 사람이 평생 건강을 누리는 사회’를 비전으로 하고, 건강수명 연장과 건강형평성 제고를 총괄 목표로 한다. 2026년 3월에 확정된 제6차 계획(2026～2030년)도 제5차 계획의 비전과 총괄 목표를 그대로 이어 간다. 단순히 오래 사는 평균수명이 아니라 건강하게 사는 기간과 집단 간 건강 격차 해소에 초점을 둔다."},
{"id":"c58","subj":"지역사회간호","unit":"건강증진","q":"「국민건강증진법」상 국민건강증진종합계획에 대한 설명으로 옳은 것은?","opts":["질병관리청장이 3년마다 수립한다.","시·도지사가 4년마다 수립한다.","국민건강보험공단 이사장이 해마다 수립한다.","보건복지부장관이 5년마다 수립한다."],"ans":3,"exp":"국민건강증진종합계획은 보건복지부장관이 국민건강증진정책심의위원회의 심의를 거쳐 5년마다 수립한다. 4년마다 수립하는 것은 「지역보건법」의 지역보건의료계획으로, 시·도지사와 시장·군수·구청장이 세운다."},
{"id":"c59","subj":"지역사회간호","unit":"건강행위 이론","q":"다음 사례에 해당하는 건강신념모형의 구성 개념은?\n\nA 씨는 유방암 검진이 필요하다고 생각하면서도 “검사가 아프고 병원에 갈 시간도 없다.”라며 검진을 미루고 있다.","opts":["지각된 민감성","지각된 심각성","지각된 유익성","지각된 장애성"],"ans":3,"exp":"지각된 장애성은 건강 행위를 하는 데 드는 비용, 불편, 통증, 시간 같은 부정적 측면에 대한 인식이다. 지각된 민감성은 자신이 병에 걸릴 가능성, 심각성은 병에 걸렸을 때 결과가 얼마나 나쁜지, 유익성은 행위를 하면 얻는 이득에 대한 인식이다."},
{"id":"c60","subj":"지역사회간호","unit":"건강행위 이론","q":"범이론적 모형의 변화 과정 중 ‘자극 통제’에 해당하는 것은?","opts":["흡연의 해로움에 관한 정보를 찾아 읽는다.","담배를 피우는 자신의 모습에 실망을 느낀다.","집 안의 재떨이와 라이터를 모두 치운다.","가족에게 금연을 시작하겠다고 선언한다."],"ans":2,"exp":"자극 통제는 문제 행동을 일으키는 자극을 없애거나 피하는 과정이다. 정보를 찾아 읽는 것은 의식 고양, 문제 행동과 관련하여 자기 자신을 다시 평가하는 것은 자기 재평가, 변화하겠다고 결심하고 주변에 알리는 것은 자기 해방이다."},
{"id":"c61","subj":"지역사회간호","unit":"건강행위 이론","q":"PRECEDE-PROCEED 모형의 교육·생태학적 진단에서 촉진 요인에 해당하는 것은?","opts":["흡연의 해로움에 대한 지식","금연이 건강에 이롭다고 믿는 태도","금연에 성공했을 때 받는 가족의 칭찬","금연클리닉의 위치와 운영 시간"],"ans":3,"exp":"촉진 요인(가능 요인)은 행위를 할 수 있게 하거나 가로막는 자원의 이용 가능성, 접근성, 기술 등이므로 금연클리닉의 위치와 운영 시간이 해당한다. 지식과 태도, 신념은 행위에 앞서 동기를 주는 성향 요인이고, 가족이나 동료의 칭찬과 보상은 행위 뒤에 작용하는 강화 요인이다."},
{"id":"c62","subj":"지역사회간호","unit":"건강행위 이론","q":"계획된 행위이론이 합리적 행위이론에 추가한 개념은?","opts":["행위에 대한 태도","주관적 규범","지각된 행위 통제","행위 의도"],"ans":2,"exp":"합리적 행위이론은 행위에 대한 태도와 주관적 규범이 행위 의도를 결정하고 의도가 행위로 이어진다고 본다. 계획된 행위이론은 여기에, 그 행위를 하기가 얼마나 쉽거나 어렵다고 느끼는지를 뜻하는 지각된 행위 통제를 더하였다."},
{"id":"c63","subj":"지역사회간호","unit":"보건교육","q":"다음 사례에 적용된 학습 이론은?\n\nA 보건교사는 손 씻기를 실천한 학생에게 그때마다 칭찬 스티커를 주어 행동이 되풀이되게 하였다.","opts":["행동주의 학습이론","인지주의 학습이론","인본주의 학습이론","구성주의 학습이론"],"ans":0,"exp":"행동주의는 학습을 자극과 반응의 연결로 보고, 바람직한 행동에 보상(강화)을 주어 행동이 반복되게 한다. 인지주의는 학습자 내부의 사고 과정을, 인본주의는 학습자의 자발성과 자아실현을, 구성주의는 학습자가 경험으로 지식을 스스로 만들어 가는 것을 강조한다."},
{"id":"c64","subj":"지역사회간호","unit":"보건교육","q":"‘대상자는 인슐린 자가 주사를 정확한 순서로 시행한다’는 학습목표가 속하는 영역은?","opts":["인지적 영역","정의적 영역","사회적 영역","심리운동 영역"],"ans":3,"exp":"심리운동 영역은 신체를 움직여 기술을 수행하는 능력에 관한 목표이다. 인지적 영역은 지식과 이해, 정의적 영역은 태도·가치·흥미에 관한 목표이다. 블룸(Bloom)의 학습목표 분류에 사회적 영역은 없다."},
{"id":"c65","subj":"지역사회간호","unit":"보건교육","q":"다음 설명에 해당하는 보건교육 방법은?\n\n○ 한 주제에 대해 전문가 2～5명이 각자 다른 측면에서 준비한 내용을 차례로 발표한다.\n○ 발표가 끝나면 사회자의 진행으로 청중과 질의응답을 한다.","opts":["분단 토의","패널 토의","브레인스토밍","심포지엄"],"ans":3,"exp":"심포지엄은 전문가들이 각자 맡은 부분을 발표하고 이어서 청중과 질의응답을 한다. 패널 토의는 전문가 몇 명이 청중 앞에서 서로 의견을 주고받으며 토의하는 것이고, 분단 토의는 참가자를 소집단으로 나누어 토의한 뒤 전체가 모여 종합하는 것이다."},
{"id":"c67","subj":"지역사회간호","unit":"보건교육","q":"교육 도중에 학습자의 이해 정도를 확인하여 교육 방법을 고쳐 나가는 평가는?","opts":["진단평가","총괄평가","형성평가","상대평가"],"ans":2,"exp":"형성평가는 교육 도중에 실시하여 학습의 진행 정도를 확인하고 교육을 개선하는 평가이다. 진단평가는 교육 전에 학습자의 지식 수준과 준비도를 알아보는 평가이고, 총괄평가는 교육이 끝난 뒤 목표 달성 정도를 판단하는 평가이다. 상대평가는 평가 시기가 아니라 평가 기준에 따른 분류이다."},
{"id":"c68","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족생활주기 중 첫 자녀 독립부터 막내 자녀 독립까지의 시기는?","opts":["청소년기 가족","진수기 가족","중년기 가족","노년기 가족"],"ans":1,"exp":"진수기 가족은 자녀들이 독립하여 집을 떠나는 시기로, 자녀의 독립을 돕고 부부 관계를 다시 조정하는 것이 발달과업이다. 청소년기 가족은 첫 자녀가 13～19세인 시기이고, 중년기 가족은 자녀가 모두 떠난 뒤부터 은퇴까지, 노년기 가족은 은퇴 뒤부터 사망까지이다."},
{"id":"c69","subj":"지역사회간호","unit":"가족간호","q":"다음 설명에 해당하는 가족 이론은?\n\n○ 가족을 서로 상호작용하는 인격체들의 단위로 본다.\n○ 구성원이 상황에 부여하는 의미와 서로에 대한 역할 기대에 초점을 둔다.\n○ 가족 내부의 과정을 중시하고 외부 사회와의 관계는 덜 다룬다.","opts":["구조기능 이론","가족체계 이론","사회교환 이론","상징적 상호작용 이론"],"ans":3,"exp":"상징적 상호작용 이론은 가족 구성원 개인이 상황을 어떻게 해석하고 서로 어떤 역할을 기대하며 상호작용하는지에 초점을 둔다. 구조기능 이론은 가족 구조와 사회 속 기능을, 가족체계 이론은 가족을 하나의 열린 체계로 보며, 사회교환 이론은 구성원이 주고받는 보상과 비용의 균형으로 가족 관계를 설명한다."},
{"id":"c70","subj":"지역사회간호","unit":"가족간호","q":"취약가족의 분류에서 구조적 취약가족에 해당하는 것은?","opts":["한부모 가족","만성질환자 가족","학대 가족","미숙아 가족"],"ans":0,"exp":"구조적 취약가족은 가족 구조에 결손이 있는 가족으로 한부모 가족, 이혼 가족, 조손 가족, 독거 가구 등이 해당한다. 만성질환자 가족은 기능적 취약가족, 학대 가족은 상호작용 취약가족, 미숙아 가족은 발달단계의 취약가족이다."},
{"id":"c71","subj":"지역사회간호","unit":"가족간호","q":"가족 사정의 원칙으로 옳지 않은 것은?","opts":["가족의 문제뿐 아니라 강점도 함께 사정한다.","가족 구성원 개인보다 가족 전체에 초점을 둔다.","자료는 건강문제가 있는 구성원 한 사람에게서만 수집한다.","사정 과정에 가족이 참여하도록 한다."],"ans":2,"exp":"가족 사정에서는 한 사람의 말에만 기대지 않고 여러 구성원과 여러 방법으로 자료를 모아 서로 확인해야 한다. 강점까지 사정하고, 가족 전체에 초점을 두며, 가족이 사정에 참여하게 하는 것은 모두 옳은 원칙이다."},
{"id":"c72","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법 시행령」상 보건교사의 직무에 해당하지 않는 것은?","opts":["학교보건계획의 수립","학교 환경위생의 유지·관리 및 개선에 관한 사항","각종 질병의 예방처치 및 보건지도","학교에서 사용하는 의약품과 독극물의 실험·검사"],"ans":3,"exp":"학교에서 사용하는 의약품과 독극물의 실험·검사는 학교약사의 직무이다. 보건교사는 학교보건계획의 수립, 환경위생의 유지·관리, 질병의 예방처치와 보건지도, 건강 관찰과 상담 협조, 응급 처치와 그에 따르는 의약품 투여 등을 맡는다."},
{"id":"c73","subj":"지역사회간호","unit":"학교보건","q":"「학교보건법」상 감염병에 감염된 학생의 등교를 중지시킬 수 있는 사람은?","opts":["학교의 장","보건교사","교육감","관할 보건소장"],"ans":0,"exp":"학교의 장은 감염병에 감염되었거나 감염된 것으로 의심되는 학생과 교직원의 등교를 중지시킬 수 있다. 보건교사는 감염병 발생을 확인하고 학교의 장에게 알려 조치를 돕는 역할을 하며, 등교 중지를 직접 명하는 주체는 아니다."},
{"id":"c74","subj":"지역사회간호","unit":"학교보건","q":"「교육환경 보호에 관한 법률」상 이미 설립된 학교의 절대보호구역 범위는?","opts":["학교 경계로부터 직선거리 50미터까지인 지역","학교 출입문으로부터 직선거리 50미터까지인 지역","학교 출입문으로부터 직선거리 200미터까지인 지역","학교 경계로부터 직선거리 300미터까지인 지역"],"ans":1,"exp":"절대보호구역은 학교 출입문으로부터 직선거리 50미터까지인 지역이다. 상대보호구역은 학교 경계로부터 직선거리 200미터까지인 지역 가운데 절대보호구역을 뺀 지역이다. 교육환경보호구역은 교육감이 설정하여 고시한다."},
{"id":"c75","subj":"지역사회간호","unit":"학교보건","q":"수두에 걸린 초등학생의 등교 중지 기간으로 옳은 것은?","opts":["열이 내린 뒤 24시간이 지날 때까지","발진이 나타난 뒤 4일까지","모든 수포에 딱지가 앉을 때까지","항생제 치료를 시작한 뒤 5일까지"],"ans":2,"exp":"수두는 수포가 생기기 직전부터 모든 수포에 딱지(가피)가 앉을 때까지 전염력이 있으므로 그때까지 등교를 중지한다. 발진이 나타난 뒤 4일까지는 홍역, 적절한 항생제 치료를 시작한 뒤 5일까지는 백일해의 격리 기준이다."},
{"id":"c76","subj":"지역사회간호","unit":"산업보건","q":"다음 사례에 해당하는 작업환경 관리 방법은?\n\nA 사업장은 소음이 심한 기계를 별도의 방에 설치하고, 근로자가 방 밖의 조작실에서 원격으로 기계를 조작하게 하였다.","opts":["대치","격리","환기","교육"],"ans":1,"exp":"격리는 근로자와 유해 인자 사이를 벽이나 거리로 떼어 놓는 것으로, 원격 조작과 방호벽 설치가 해당한다. 대치는 유해한 물질·공정·시설을 덜 해로운 것으로 바꾸는 것이고, 환기는 오염된 공기를 빼내거나 묽게 하는 것이다."},
{"id":"c77","subj":"지역사회간호","unit":"산업보건","q":"산업안전보건법령상 다음 설명에 해당하는 건강진단은?\n\n특수건강진단 대상 업무로 인하여 직업성 천식, 직업성 피부염 등 건강 장해를 의심하게 하는 증상을 보이는 근로자에게 정기 검진 시기와 관계없이 실시한다.","opts":["수시건강진단","임시건강진단","배치전건강진단","일반건강진단"],"ans":0,"exp":"수시건강진단은 특수건강진단 대상 업무의 유해 인자 때문으로 의심되는 직업성 천식이나 피부염 같은 증상을 보이는 근로자에게 주기와 관계없이 실시한다. 임시건강진단은 같은 유해 인자에 노출된 근로자들에게 비슷한 증상이 생기는 등의 경우에 명령에 따라 실시하고, 배치전건강진단은 해당 업무에 배치하기 전에 실시한다."},
{"id":"c79","subj":"지역사회간호","unit":"산업보건","q":"고열 작업장에서 발생하는 열중증에 대한 설명으로 옳은 것은?","opts":["열사병은 체온이 정상 범위이므로 몸을 따뜻하게 보온한다.","열피로(열탈진)는 체온조절 중추의 기능 장애로 발생한다.","열경련은 땀으로 염분을 많이 잃어 발생하므로 수분과 염분을 보충한다.","열쇠약은 고온 환경에 처음 노출된 직후 급성으로 나타난다."],"ans":2,"exp":"열경련은 땀으로 염분을 많이 잃은 상태에서 물만 마셔 생기는 근육 경련으로, 체온과 의식은 정상이며 수분과 염분을 함께 보충한다. 체온조절 중추의 장애로 체온이 매우 높아지는 것은 열사병이며 체온을 급히 내려야 한다. 열피로는 말초 순환 부전으로 생기고, 열쇠약은 고열 작업을 오래 하여 생기는 만성 건강 장해이다."},
{"id":"c80","subj":"지역사회간호","unit":"산업보건","q":"산업재해 지표 중 재해의 심한 정도를 나타내는 강도율의 산출식은?","opts":["(재해 건수 / 연 근로시간 수) × 1,000,000","(재해 건수 / 평균 근로자 수) × 1,000","(근로 손실 일수 / 재해 건수) × 100","(근로 손실 일수 / 연 근로시간 수) × 1,000"],"ans":3,"exp":"강도율은 근로 손실 일수를 연 근로시간 수로 나누고 1,000을 곱한 값으로, 재해의 심한 정도를 나타낸다. 재해 건수를 연 근로시간 수로 나누고 1,000,000을 곱한 것은 도수율, 재해 건수를 평균 근로자 수로 나누고 1,000을 곱한 것은 건수율이다. 근로 손실 일수를 재해 건수로 나눈 값은 재해 한 건당 평균 손실 일수이다."},
{"id":"c81","subj":"지역사회간호","unit":"환경보건","q":"대기오염 피해와 관련하여 다음 설명에 해당하는 기상 현상은?\n\n상층의 기온이 하층보다 높아 대기가 안정되고, 오염 물질이 확산되지 못한 채 지표면 가까이에 쌓여 대기오염 피해가 커진다.","opts":["열섬 현상","기온역전","엘니뇨","온실효과"],"ans":1,"exp":"보통은 위로 올라갈수록 기온이 낮아져 공기가 위아래로 섞이지만, 기온역전이 생기면 대기가 안정되어 오염 물질이 확산되지 못한다. 열섬 현상은 도심의 기온이 주변보다 높은 현상이고, 온실효과는 온실가스가 지구 복사열을 붙잡아 기온이 오르는 현상이다."},
{"id":"c82","subj":"지역사회간호","unit":"환경보건","q":"질소산화물과 탄화수소가 자외선과 반응하여 생성되는 2차 오염 물질은?","opts":["오존","일산화탄소","아황산가스","납"],"ans":0,"exp":"오존은 배출원에서 바로 나오지 않고 질소산화물과 탄화수소가 햇빛과 광화학 반응을 일으켜 생기는 대표적인 2차 오염 물질이다. 일산화탄소, 아황산가스, 납은 배출원에서 직접 나오는 1차 오염 물질이다."},
{"id":"c83","subj":"지역사회간호","unit":"환경보건","q":"수질 오염 지표에 대한 설명으로 옳은 것은?","opts":["용존산소량(DO)이 높을수록 오염이 심한 물이다.","수온이 높을수록 용존산소량(DO)이 증가한다.","생물화학적 산소요구량(BOD)이 높을수록 유기물 오염이 심하다.","생물화학적 산소요구량(BOD)이 높은 물은 용존산소량(DO)도 높다."],"ans":2,"exp":"BOD는 미생물이 물속 유기물을 분해하는 데 쓰는 산소의 양이므로 높을수록 유기물이 많은 오염된 물이다. DO는 물에 녹아 있는 산소의 양으로 높을수록 깨끗하며, 수온이 높거나 BOD가 높으면 DO는 낮아진다."},
{"id":"c85","subj":"지역사회간호","unit":"환경보건","q":"다음 집단 식중독 사례에서 원인으로 의심되는 식중독의 종류는?\n\n손에 화농성 상처가 있는 조리자가 만든 김밥을 먹고 3시간쯤 뒤에 여러 사람이 심한 구토와 복통을 보였으며, 열은 거의 없었다.","opts":["황색포도상구균 식중독","살모넬라 식중독","장염 비브리오 식중독","보툴리누스 식중독"],"ans":0,"exp":"황색포도상구균 식중독은 화농성 상처의 균이 음식에서 만든 장독소 때문에 생기는 독소형 식중독으로, 잠복기가 평균 3시간으로 짧고 구토가 심하며 열은 거의 없다. 살모넬라와 장염 비브리오 식중독은 감염형으로 잠복기가 더 길고 열이 나며, 보툴리누스 식중독은 신경 마비 증상이 특징이다."},
{"id":"c86","subj":"지역사회간호","unit":"환경보건","q":"감각온도(실효온도)를 결정하는 요소가 아닌 것은?","opts":["기온","기습","기류","복사열"],"ans":3,"exp":"감각온도는 기온, 기습(습도), 기류의 세 요소가 어우러져 사람이 느끼는 온도이다. 복사열은 여기에 더해 4대 온열 요소를 이루지만 감각온도의 요소는 아니다."},
{"id":"c87","subj":"지역사회간호","unit":"인구","q":"인구 피라미드로 나타낸 인구 구조 유형 중 다음 설명에 해당하는 것은?\n\n○ 생산연령 인구가 많이 유입되는 도시 지역에서 나타난다.\n○ 15～49세 인구가 전체 인구의 50%를 넘는다.","opts":["별형","호로형","종형","항아리형"],"ans":0,"exp":"별형은 생산연령 인구가 유입되는 도시형 인구 구조이다. 호로형(표주박형)은 생산연령 인구가 빠져나가는 농촌형이고, 종형은 출생률과 사망률이 모두 낮은 인구 정지형, 항아리형은 출생률이 사망률보다 낮은 인구 감퇴형이다."},
{"id":"c88","subj":"지역사회간호","unit":"인구","q":"다음 A 지역의 인구 자료로 산출한 노령화지수는?\n\n○ 0～14세 인구: 200명\n○ 15～64세 인구: 1,000명\n○ 65세 이상 인구: 300명","opts":["30","50","67","150"],"ans":3,"exp":"노령화지수는 65세 이상 인구를 0～14세 인구로 나누고 100을 곱한 값이다. 300 ÷ 200 × 100 = 150. 30은 노년부양비(300 ÷ 1,000 × 100)이고, 50은 총부양비((200 + 300) ÷ 1,000 × 100)이다. 67은 분자와 분모를 바꾸어 계산한 값이다."},
{"id":"c89","subj":"지역사회간호","unit":"인구","q":"블래커(Blacker)의 인구 성장 단계 중 다음 설명에 해당하는 것은?\n\n○ 사망률이 낮은 수준에 머무는 가운데 출생률이 낮아지기 시작한다.\n○ 인구 증가 속도가 둔해진다.","opts":["고위정지기","초기확장기","후기확장기","저위정지기"],"ans":2,"exp":"후기확장기는 낮은 사망률에 출생률 감소가 더해져 인구 증가가 둔해지는 단계이다. 고위정지기는 출생률과 사망률이 모두 높은 단계, 초기확장기는 출생률은 높은데 사망률이 떨어져 인구가 빠르게 느는 단계, 저위정지기는 출생률과 사망률이 모두 가장 낮아 인구 증가가 멈추는 단계이다."},
{"id":"c92","subj":"지역사회간호","unit":"모자보건","q":"「모자보건법」상 ‘임산부’의 정의로 옳은 것은?","opts":["임신 중인 여성","임신 중이거나 분만 후 6주 미만인 여성","임신 중이거나 분만 후 6개월 미만인 여성","임신 중이거나 분만 후 1년 미만인 여성"],"ans":2,"exp":"「모자보건법」에서 임산부는 임신 중이거나 분만 후 6개월 미만인 여성을 말한다. 같은 법에서 영유아는 출생 후 6년 미만인 사람, 신생아는 출생 후 28일 이내의 영유아이다."},
{"id":"c93","subj":"지역사회간호","unit":"가정간호·방문·사례관리","q":"의료기관 가정간호에 대한 설명으로 옳은 것은?","opts":["「지역보건법」에 근거하여 보건소가 운영한다.","장기요양 등급을 받은 노인만 이용할 수 있다.","비용은 모두 노인장기요양보험에서 지급한다.","의사나 한의사가 의뢰한 환자에게 가정전문간호사가 제공한다."],"ans":3,"exp":"의료기관 가정간호는 「의료법」에 근거하며, 의사나 한의사가 가정에서 계속 치료와 관리가 필요하다고 판단하여 의뢰한 환자에게 가정전문간호사가 제공하고 건강보험이 적용된다. 보건소가 운영하는 것은 방문건강관리 사업이고, 장기요양 등급자에게 장기요양보험으로 제공하는 것은 방문간호이다."},
{"id":"c95","subj":"지역사회간호","unit":"가정간호·방문·사례관리","q":"다음 설명에 해당하는 사례관리의 원칙은?\n\n대상자의 요구 변화를 계속 점검하면서 서비스가 끊기지 않고 이어지도록 한다.","opts":["개별성","포괄성","지속성","책임성"],"ans":2,"exp":"지속성은 한 번의 서비스로 끝내지 않고 점검과 재사정을 되풀이하며 서비스를 이어 가는 원칙이다. 개별성은 대상자마다 다른 요구에 맞추는 것, 포괄성은 대상자의 다양한 요구를 두루 충족하는 것, 책임성은 사례관리자가 서비스 전 과정을 책임지는 것이다."},
{"id":"c96","subj":"지역사회간호","unit":"노인보건·장기요양","q":"노인의 수단적 일상생활 수행능력(IADL) 사정 항목에 해당하는 것은?","opts":["목욕하기","옷 입기","대중교통 이용하기","화장실 사용하기"],"ans":2,"exp":"IADL은 지역사회에서 독립적으로 살아가는 데 필요한 좀 더 복잡한 활동으로 교통수단 이용, 물건 사기, 금전 관리, 전화 사용, 식사 준비 등이 해당한다. 목욕하기, 옷 입기, 화장실 사용하기는 기본적인 자기 돌봄 능력인 일상생활 수행능력(ADL) 항목이다."},
{"id":"c97","subj":"지역사회간호","unit":"재난간호","q":"재난 관리 단계 중 다음 활동이 이루어지는 단계는?\n\n○ 재난 대응 계획을 수립하고 비상 연락망을 정비한다.\n○ 구호 물자를 비축하고 모의 훈련을 실시한다.","opts":["예방·완화 단계","대비 단계","대응 단계","복구 단계"],"ans":1,"exp":"대비 단계는 재난이 일어났을 때 곧바로 대응할 수 있도록 계획, 훈련, 물자, 연락 체계를 미리 갖추는 단계이다. 예방·완화 단계는 위험 요인을 찾아 줄이는 단계이고, 대응 단계는 재난 발생 뒤 구조와 중증도 분류, 응급 처치를 하는 단계, 복구 단계는 피해를 회복하는 단계이다."},
{"id":"c98","subj":"지역사회간호","unit":"재난간호","q":"재난 현장에서 다음 환자에게 부여할 중증도 분류 색은?\n\n의식이 흐리고 호흡이 분당 36회로 빠르며, 요골 맥박이 약하고 피부가 차고 축축하다.","opts":["적색","황색","녹색","흑색"],"ans":0,"exp":"쇼크와 호흡 곤란으로 생명이 위태롭지만 즉시 처치하면 살 수 있는 환자는 긴급 환자로 적색이다. 황색은 처치가 몇 시간 늦어져도 생명에 지장이 없는 응급 환자, 녹색은 걸을 수 있는 경상 환자, 흑색은 사망하였거나 생존 가능성이 없는 환자이다."},
{"id":"c99","subj":"지역사회간호","unit":"재난간호","q":"「재난 및 안전관리 기본법」상 사회재난에 해당하는 것은?","opts":["태풍","지진","황사","감염병의 확산"],"ans":3,"exp":"사회재난은 화재, 붕괴, 폭발, 교통사고, 환경오염 사고와 감염병·가축전염병의 확산 등으로 인한 피해를 말한다. 태풍, 지진, 황사는 자연 현상으로 생기는 자연재난이다."},
{"id":"c100","subj":"지역사회간호","unit":"국제보건","q":"유엔이 채택한 지속가능발전목표(SDGs)에 대한 설명으로 옳은 것은?","opts":["2000년부터 2015년까지 추진한 8개 목표이다.","개발도상국에만 적용하는 목표이다.","2030년까지 달성하려는 17개 목표로 구성된다.","보건 분야의 목표는 포함하지 않는다."],"ans":2,"exp":"지속가능발전목표는 2016년부터 2030년까지 모든 나라가 함께 추진하는 17개 목표이며, 그 가운데 3번 목표가 건강과 복지이다. 2000년부터 2015년까지 추진한 8개 목표는 새천년개발목표(MDGs)이다."},
{"id":"c101","subj":"지역사회간호","unit":"역학 연구","q":"다음 사례에 해당하는 역학 연구 방법은?\n\nA 지역 보건소 간호사는 5월 한 달 동안 40세 이상 주민 2,000명의 혈압을 측정하고, 같은 날 설문지로 짠 음식 섭취 습관을 조사하여 둘의 관련성을 분석하였다.","opts":["코호트 연구","단면조사 연구","환자－대조군 연구","지역사회 실험 연구"],"ans":1,"exp":"한 시점에 노출(식습관)과 질병(고혈압) 유무를 동시에 조사하였으므로 단면조사 연구이다. 유병률을 구할 수 있지만 원인과 결과의 시간적 선후를 밝히기 어렵다. 코호트 연구는 노출 여부로 나눈 집단을 추적하고, 환자－대조군 연구는 환자와 대조군의 과거 노출을 비교하며, 실험 연구는 연구자가 중재를 배정한다."},
{"id":"c102","subj":"지역사회간호","unit":"역학 연구","q":"다음 사례에서 연구 결과를 왜곡할 수 있는 바이어스는?\n\n선천성 기형아를 출산한 어머니와 건강한 아기를 출산한 어머니에게 임신 중 약물 복용 여부를 물었더니, 기형아를 출산한 어머니가 복용 사실을 더 자세히 기억해 냈다.","opts":["버크슨 바이어스","추적 탈락 바이어스","회상 바이어스","조기 발견 바이어스"],"ans":2,"exp":"환자군과 대조군이 과거 노출을 기억해 내는 정도가 달라 생기는 정보 바이어스가 회상 바이어스이며, 과거 노출을 면담으로 조사하는 환자－대조군 연구에서 흔하다. 버크슨 바이어스는 병원 환자를 대상으로 뽑을 때 생기는 선택 바이어스, 추적 탈락 바이어스는 코호트 연구의 문제, 조기 발견 바이어스는 선별검사 효과를 평가할 때의 문제이다."},
{"id":"c103","subj":"지역사회간호","unit":"역학 연구","q":"다음 역학 연구 사례에서 흡연에 해당하는 변수의 종류는?\n\n커피를 많이 마시는 사람에게 췌장암이 많다는 결과가 나왔으나, 커피를 많이 마시는 사람 중에 흡연자가 많았다. 흡연 여부로 층화하여 분석하자 커피와 췌장암의 관련성이 사라졌다.","opts":["교란변수","매개변수","결과변수","독립변수"],"ans":0,"exp":"교란변수는 노출(커피)과도 관련이 있고 질병(췌장암)의 위험 요인이기도 하여, 실제로는 없는 관련성을 있는 것처럼 보이게 하거나 관련성의 크기를 왜곡한다. 층화 분석, 짝짓기, 무작위 배정 등으로 통제한다. 매개변수는 노출이 질병을 일으키는 경로 가운데에 있는 변수이다."},
{"id":"c104","subj":"지역사회간호","unit":"역학 연구","q":"임상시험에서 대상자를 실험군과 대조군에 무작위로 배정하는 목적은?","opts":["연구 결과를 전체 인구에 일반화할 수 있게 한다.","대상자와 연구자가 배정 결과를 알지 못하게 한다.","연구에 필요한 대상자 수를 줄일 수 있게 한다.","교란 요인이 두 군에 비슷하게 분포하게 한다."],"ans":3,"exp":"무작위 배정을 하면 알려진 요인뿐 아니라 알려지지 않은 요인까지 두 군에 고르게 나뉘어 두 군이 비교 가능해진다. 결과를 일반화하는 데 필요한 것은 대상자의 무작위 추출이고, 배정 결과를 모르게 하는 것은 눈가림(맹검)이다."},
{"id":"c106","subj":"지역사회간호","unit":"역학 연구","q":"다음 연구 결과가 뒷받침하는 인과관계 판단 기준은?\n\n하루 흡연량이 반 갑 미만인 군, 반 갑에서 한 갑인 군, 한 갑을 넘는 군으로 갈수록 폐암 발생률이 단계적으로 높아졌다.","opts":["시간적 선후 관계","용량－반응 관계","관련성의 특이성","관련성의 일관성"],"ans":1,"exp":"노출의 양이나 기간이 늘수록 질병 발생이 늘어나는 것이 용량－반응 관계(양－반응 관계)이다. 시간적 선후 관계는 원인이 결과보다 앞서는 것, 특이성은 한 요인이 특정 질병과만 관련되는 것, 일관성은 다른 집단과 다른 방법으로 연구해도 같은 결과가 나오는 것이다."},
{"id":"c107","subj":"지역사회간호","unit":"역학 연구","q":"산업장 근로자를 대상으로 한 역학 연구에서 다음 설명에 해당하는 현상은?\n\n일할 수 있을 만큼 건강한 사람이 고용되고 계속 근무하기 때문에, 근로자 집단의 사망률이 일반 인구보다 낮게 나타난다.","opts":["호손 효과","위약 효과","코호트 효과","건강근로자 효과"],"ans":3,"exp":"근로자 집단은 일반 인구보다 원래 건강한 사람이 많아 유해 인자의 영향이 실제보다 작게 보이는데, 이를 건강근로자 효과라 하며 선택 바이어스의 하나이다. 호손 효과는 연구 대상이 된 사실을 알아 행동이 달라지는 것, 위약 효과는 약효가 없는 처치에도 좋아졌다고 느끼는 것이다."},
{"id":"c108","subj":"지역사회간호","unit":"역학 연구","q":"역학 연구 방법 중 생태학적 연구에 대한 설명으로 옳은 것은?","opts":["집단 수준의 관련성을 개인에게 적용하면 오류가 생길 수 있다.","개인별 노출과 질병 발생을 추적하여 발생률을 산출한다.","연구자가 대상 집단의 노출 수준을 무작위로 배정한다.","한 번의 연구로 요인과 질병의 인과관계를 확정할 수 있다."],"ans":0,"exp":"생태학적 연구는 개인이 아닌 집단(나라, 지역)을 단위로 평균 노출 수준과 질병 수준을 비교한다. 노출된 바로 그 사람이 질병에 걸렸는지는 알 수 없으므로, 집단의 결과를 개인에게 적용하면 생태학적 오류가 생길 수 있다. 가설을 세우는 데는 쓸모 있지만 인과관계를 확정하지는 못한다."},
{"id":"c109","subj":"지역사회간호","unit":"역학 지표","q":"기여위험도(귀속위험도)에 대한 설명으로 옳은 것은?","opts":["노출군의 발생률을 비노출군의 발생률로 나눈 값이다.","환자－대조군 연구에서 직접 산출할 수 있는 값이다.","노출군의 발생률에서 비노출군의 발생률을 뺀 값이다.","값이 0이면 위험 요인과 질병의 관련성이 매우 크다."],"ans":2,"exp":"기여위험도는 노출군의 발생률에서 비노출군의 발생률을 뺀 값으로, 노출군의 질병 발생 가운데 그 위험 요인 때문에 생긴 부분을 나타낸다. 두 발생률의 비는 상대위험비이다. 발생률이 있어야 구할 수 있으므로 환자－대조군 연구에서는 직접 산출할 수 없고, 값이 0이면 노출에 따른 초과 위험이 없다는 뜻이다."},
{"id":"c111","subj":"지역사회간호","unit":"역학 지표","q":"감염병의 전파력을 나타내는 이차발병률을 산출할 때 분모로 옳은 것은?","opts":["초발 환자가 발생한 지역의 연앙인구","환자와 접촉한 사람 중 면역이 있는 사람 수","유행 기간에 그 지역에서 발생한 전체 환자 수","초발 환자를 제외한, 환자와 접촉한 감수성자 수"],"ans":3,"exp":"이차발병률은 초발 환자와 접촉한 감수성자 가운데 최장 잠복기 안에 발병한 사람의 비율이다. 분모에서는 초발 환자와 이미 면역이 있는 사람을 제외한다. 감염병의 전파력을 나타내는 지표로 쓴다."},
{"id":"c112","subj":"지역사회간호","unit":"역학 지표","q":"질병의 발생과 사망 수준을 나타내는 지표 중 다음 설명에 해당하는 것은?\n\n어떤 질병에 걸린 환자 중에서 그 질병으로 사망한 사람의 비율로, 질병의 심각한 정도를 나타낸다.","opts":["원인별 사망률","치명률","비례사망률","이차발병률"],"ans":1,"exp":"치명률은 그 질병에 걸린 환자 가운데 그 질병으로 사망한 사람의 비율이다. 원인별 사망률은 특정 원인으로 사망한 사람을 전체 인구로 나눈 값이고, 비례사망률은 전체 사망자 가운데 특정 원인으로 사망한 사람의 비율이다."},
{"id":"c119","subj":"지역사회간호","unit":"역학 지표","q":"연령 구조가 다른 두 지역의 사망 수준을 비교할 때 사용하는 지표는?","opts":["조사망률","치명률","비례사망률","연령표준화 사망률"],"ans":3,"exp":"조사망률은 노인이 많은 지역에서 높게 나오므로 인구 구조가 다른 지역끼리 그대로 비교하면 안 된다. 표준 인구를 정해 두 지역의 연령 구조가 같다고 가정하고 다시 계산한 연령표준화 사망률로 비교한다. 치명률은 환자 가운데 사망자의 비율, 비례사망률은 전체 사망 가운데 특정 원인이 차지하는 비율이다."},
{"id":"c123","subj":"지역사회간호","unit":"감염병 관리","q":"말라리아 원충이 모기의 몸 안에서 거치는 생물학적 전파 유형은?","opts":["증식형","발육형","발육증식형","경란형"],"ans":2,"exp":"병원체가 매개 곤충 안에서 발육과 증식을 함께 하는 것이 발육증식형이며 말라리아와 수면병이 해당한다. 증식형은 수만 늘어나는 것(페스트, 일본뇌염, 황열), 발육형은 수는 늘지 않고 발육만 하는 것(사상충증), 경란형은 병원체가 곤충의 알을 거쳐 다음 세대로 넘어가는 것(쯔쯔가무시증)이다."},
{"id":"c128","subj":"지역사회간호","unit":"감염병 관리","q":"「감염병의 예방 및 관리에 관한 법률」상 다음 설명에 해당하는 감염병은?\n\n○ 유행 여부를 조사하기 위하여 표본감시 활동이 필요하다.\n○ 표본감시기관이 7일 이내에 신고한다.","opts":["제1급감염병","제2급감염병","제3급감염병","제4급감염병"],"ans":3,"exp":"제4급감염병은 제1급부터 제3급까지의 감염병 외에 유행 여부를 조사하기 위하여 표본감시 활동이 필요한 감염병이며 7일 이내에 신고한다. 제1급감염병은 즉시, 제2급과 제3급감염병은 24시간 이내에 신고하는 전수감시 대상이다."},
{"id":"c129","subj":"지역사회간호","unit":"감염병 관리","q":"외래 감염병의 유입을 막기 위한 조치 중 다음 설명에 해당하는 것은?\n\n감염병 유행 지역에서 입국한 사람 중 증상은 없지만 병원체에 노출되었을 가능성이 있는 사람을, 그 감염병의 최장 잠복기 동안 일정한 곳에 머물게 하며 발병 여부를 관찰한다.","opts":["환자 격리","보호 격리(역격리)","검역(건강 격리)","표본 감시"],"ans":2,"exp":"검역은 감염이 의심되는 건강한 사람의 이동을 최장 잠복기 동안 제한하는 것이다. 환자 격리는 이미 발병한 환자나 보균자를 감염력이 없어질 때까지 떼어 놓는 것이고, 보호 격리는 면역이 약한 사람을 병원체로부터 지키려고 따로 두는 것이다."},
{"id":"c130","subj":"지역사회간호","unit":"보건교육","q":"다음 설명에 해당하는 학습 이론은?\n\n○ 학습자를 스스로 배우려는 욕구와 잠재력을 가진 존재로 본다.\n○ 교육자는 지시하지 않고 학습을 돕는 촉진자 역할을 한다.\n○ 학습의 목적을 자아실현에 둔다.","opts":["행동주의 학습이론","인지주의 학습이론","인본주의 학습이론","사회학습이론"],"ans":2,"exp":"인본주의 학습이론은 학습자를 자율적인 존재로 보고 자기 주도 학습과 자아실현을 강조하며, 교육자는 조력자이자 촉진자가 된다. 행동주의는 자극과 반응, 강화로 행동을 바꾸는 데, 인지주의는 정보를 받아들여 처리하는 내적 사고 과정에, 사회학습이론은 다른 사람을 관찰하고 모방하는 데 초점을 둔다."},
{"id":"c131","subj":"지역사회간호","unit":"보건교육","q":"블룸(Bloom)의 학습목표 분류에서 정의적 영역에 해당하는 것은?","opts":["금연 프로그램에 스스로 참여하겠다는 뜻을 밝힌다.","흡연이 폐에 미치는 영향을 세 가지 이상 말한다.","니코틴 패치를 올바른 순서로 붙인다.","금연 보조제의 종류를 구분하여 설명한다."],"ans":0,"exp":"정의적 영역은 태도, 가치, 흥미, 느낌의 변화를 다루므로 스스로 참여하려는 태도가 여기에 속한다. 영향을 말하거나 종류를 구분하여 설명하는 것은 지식과 이해를 다루는 인지적 영역이고, 패치를 순서대로 붙이는 것은 기술을 다루는 심리운동 영역이다."},
{"id":"c132","subj":"지역사회간호","unit":"보건교육","q":"패널 토의(배심 토의)에 대한 설명으로 옳은 것은?","opts":["전문가들이 사회자의 진행에 따라 청중 앞에서 서로 토론한다.","참가자를 소집단으로 나누어 토의한 뒤 전체가 모여 종합한다.","전문가들이 각자 맡은 내용을 서로 토론 없이 차례로 발표한다.","참가자 모두가 떠오르는 생각을 비판 없이 자유롭게 내놓는다."],"ans":0,"exp":"패널 토의(배심 토의)는 서로 다른 견해를 가진 전문가 4～7명이 청중 앞에서 서로 토론하여 한 주제를 여러 각도에서 보게 하는 방법이다. 소집단으로 나누어 토의한 뒤 종합하는 것은 분단 토의, 토론 없이 차례로 발표하는 것은 심포지엄, 생각을 자유롭게 내놓는 것은 브레인스토밍이다."},
{"id":"c133","subj":"지역사회간호","unit":"보건교육","q":"다음 사례에 해당하는 보건교육 방법은?\n\nA 보건교사는 친구가 담배를 권하는 상황을 정해 주고, 학생들이 권하는 사람과 거절하는 사람을 맡아 직접 연기하게 한 뒤 느낌을 나누게 하였다.","opts":["시범","브레인스토밍","프로그램 학습","역할극"],"ans":3,"exp":"역할극은 실제와 비슷한 상황에서 학습자가 직접 역할을 맡아 연기해 보게 하는 방법으로, 태도를 바꾸고 대처 기술을 익히게 하는 데 효과적이다. 시범은 교육자가 기술을 직접 보여 주는 것, 브레인스토밍은 떠오르는 생각을 비판 없이 자유롭게 내놓게 하는 것이다."},
{"id":"c134","subj":"지역사회간호","unit":"보건교육","q":"보건교육 평가를 과정·영향·성과 평가로 나눌 때 영향 평가에 해당하는 것은?","opts":["교육이 계획한 일정과 횟수대로 진행되었는지 본다.","교육 자료와 강사에 대한 참여자의 만족도를 본다.","몇 해 뒤 지역의 심뇌혈관질환 사망률이 낮아졌는지 본다.","교육 뒤 대상자의 지식과 태도가 달라졌는지 본다."],"ans":3,"exp":"영향 평가는 교육의 단기 효과인 지식, 태도, 기술, 행동의 변화를 본다. 일정과 횟수, 자료와 강사에 대한 만족도를 보는 것은 교육이 계획대로 잘 진행되었는지를 보는 과정 평가이다. 유병률과 사망률, 삶의 질 같은 장기 효과를 보는 것은 성과 평가이다."},
{"id":"c136","subj":"지역사회간호","unit":"건강행위 이론","q":"다음 사례에 해당하는 반두라(Bandura)의 자기효능감 증진 방법은?\n\nA 씨는 당뇨병 자조 모임에서 처지가 비슷한 환자가 식사 조절에 성공한 이야기를 듣고 “나도 할 수 있겠다.”라고 생각하였다.","opts":["성취 경험","대리 경험","언어적 설득","정서적 각성 조절"],"ans":1,"exp":"대리 경험은 자신과 비슷한 다른 사람이 성공하는 모습을 보거나 들으면서 자기효능감이 높아지는 것이다. 성취 경험은 자신이 직접 해 보아 성공한 경험이고, 언어적 설득은 다른 사람에게서 할 수 있다는 말을 듣는 것이며, 정서적 각성 조절은 불안과 긴장을 줄이는 것이다."},
{"id":"c137","subj":"지역사회간호","unit":"건강행위 이론","q":"건강신념모형에서 ‘행동의 계기’에 해당하는 것은?","opts":["자신이 대장암에 걸릴 가능성이 높다고 생각한다.","대장암 검진을 받으라는 보건소의 안내 문자를 받았다.","대장암에 걸리면 일을 그만두어야 한다고 생각한다.","검진을 받으면 암을 일찍 찾을 수 있다고 생각한다."],"ans":1,"exp":"행동의 계기는 건강 행위를 하도록 자극하는 사건이나 정보로, 가까운 사람의 발병, 대중매체의 홍보, 의료인의 권고와 안내문 등이 있다. 병에 걸릴 가능성에 대한 생각은 지각된 민감성, 병의 결과가 나쁘다는 생각은 지각된 심각성, 행위로 얻는 이익에 대한 믿음은 지각된 유익성이다."},
{"id":"c138","subj":"지역사회간호","unit":"건강행위 이론","q":"펜더(Pender)의 건강증진모형에서 ‘개인적 특성과 경험’에 속하는 것은?","opts":["이전의 관련 행위","지각된 자기효능감","활동과 관련된 정서","대인 관계의 영향"],"ans":0,"exp":"펜더의 모형에서 개인적 특성과 경험은 이전의 관련 행위와 개인적 요인(생물학적, 심리적, 사회문화적 요인)으로 이루어진다. 지각된 자기효능감, 활동과 관련된 정서, 대인 관계의 영향은 지각된 유익성·장애성, 상황적 영향과 함께 ‘행위와 관련된 인지와 정서’에 속하며 간호 중재의 주된 대상이다."},
{"id":"c141","subj":"지역사회간호","unit":"가족간호","q":"동거 가족 구성원 간의 친밀감과 갈등 관계를 선으로 나타낸 가족사정 도구는?","opts":["가계도","외부체계도","가족연대기","가족밀착도"],"ans":3,"exp":"가족밀착도는 동거 가족 구성원 사이의 애정과 갈등 관계를 선으로 그려 가족 내부의 상호 관계를 한눈에 보여 준다. 가계도는 3세대 이상의 가족 구조와 질병력을, 외부체계도는 가족과 외부 체계의 관계를, 가족연대기는 가족에게 일어난 중요한 사건을 시간 순서로 보여 준다."},
{"id":"c142","subj":"지역사회간호","unit":"가족간호","q":"다음 설명에 해당하는 가족사정 도구는?\n\n○ 가족 중 가장 취약한 구성원을 원의 한가운데에 둔다.\n○ 동거 가족, 친척, 이웃과 친구, 지역사회 기관을 바깥쪽 원에 차례로 적는다.\n○ 가운데의 구성원과 주고받는 지지의 정도를 선으로 잇는다.","opts":["사회지지도","외부체계도","가족밀착도","가족연대기"],"ans":0,"exp":"사회지지도는 가족 가운데 가장 취약한 구성원을 중심에 두고 가족 안팎의 지지 체계와 그 정도를 그린 것으로, 누구에게 도움을 받을 수 있는지 파악하는 데 쓴다. 외부체계도는 한 사람이 아니라 가족 전체를 가운데 원에 두고 외부 체계와의 관계를 그리고, 가족밀착도는 동거 가족 구성원 사이의 관계만 나타낸다. 가족연대기는 가족의 중요한 사건을 시간 순서대로 적은 것이다."},
{"id":"c143","subj":"지역사회간호","unit":"가족간호","q":"스밀크스타인(Smilkstein)의 가족기능 평가도구(Family APGAR)의 항목이 아닌 것은?","opts":["적응 능력(Adaptation)","동반자 관계(Partnership)","역할 구조(Role)","애정(Affection)"],"ans":2,"exp":"Family APGAR는 적응 능력(Adaptation), 동반자 관계(Partnership), 성장(Growth), 애정(Affection), 친밀감 또는 문제 해결(Resolve)의 다섯 항목에 대한 가족 구성원의 만족도를 묻는다. 역할 구조는 이 도구의 항목이 아니다."},
{"id":"c144","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족생활주기에서 청소년기 가족의 발달과업은?","opts":["은퇴와 줄어든 수입에 적응하기","임신과 부모 됨에 대비하기","영아 양육에 맞추어 부부 역할 조정하기","자녀의 자유와 책임 사이의 균형 맞추기"],"ans":3,"exp":"청소년기 가족은 10대 자녀가 자유와 책임의 균형을 이루도록 돕고, 세대 간에 열린 의사소통을 유지하며, 자녀의 독립에 대비해야 한다. 은퇴에 적응하는 것은 노년기 가족, 임신과 부모 됨에 대비하는 것은 신혼기 가족, 영아 양육에 맞춘 역할 조정은 양육기 가족의 과업이다."},
{"id":"c145","subj":"지역사회간호","unit":"가족간호","q":"다음 설명에 해당하는 가족 이론은?\n\n가족은 구성원을 합한 것보다 큰 하나의 전체이다. 한 구성원의 변화는 가족 전체에 영향을 미치며, 가족은 경계를 통해 외부 환경과 에너지를 주고받으면서 균형을 유지한다.","opts":["가족발달 이론","가족체계 이론","상징적 상호작용 이론","구조기능 이론"],"ans":1,"exp":"가족체계 이론은 가족을 부분의 합보다 큰 개방 체계로 보고 구성원 사이의 상호작용과 외부 환경과의 교류, 항상성에 주목한다. 가족발달 이론은 가족생활주기의 단계별 과업에, 상징적 상호작용 이론은 구성원이 부여하는 의미와 역할에, 구조기능 이론은 가족 구조가 기능을 얼마나 잘 수행하는지에 초점을 둔다."},
{"id":"c147","subj":"지역사회간호","unit":"학교보건","q":"「교육환경 보호에 관한 법률」상 교육환경보호구역을 설정·고시하는 사람은?","opts":["학교의 장","시장·군수·구청장","교육감","교육부장관"],"ans":2,"exp":"교육환경보호구역은 교육감이 학교 경계 또는 학교 설립 예정지 경계로부터 직선거리 200미터의 범위 안에서 절대보호구역과 상대보호구역으로 나누어 설정·고시한다. 학교의 장은 감염병에 걸린 학생의 등교 중지 등 학교 안의 보건 관리를 맡는다."},
{"id":"c148","subj":"지역사회간호","unit":"학교보건","q":"세계보건기구(WHO)가 제시한 건강증진학교의 구성 요소가 아닌 것은?","opts":["학교 보건 정책","학생의 학업 성취도 관리","학교의 물리적 환경","지역사회와의 연계"],"ans":1,"exp":"건강증진학교의 구성 요소는 학교 보건 정책, 학교의 물리적 환경, 학교의 사회적 환경, 지역사회와의 연계, 개인의 건강 기술과 활동 능력, 학교 보건 서비스의 여섯 가지이다. 학업 성취도 관리는 여기에 들어 있지 않다."},
{"id":"c149","subj":"지역사회간호","unit":"산업보건","q":"사업장 근로자에게 다음과 같은 중독 증상을 일으키는 중금속은?\n\n○ 잇몸과 입안에 염증이 생긴다.\n○ 손이 떨리는 근육 진전이 나타난다.\n○ 쉽게 흥분하고 불안해하는 정신 증상을 보인다.","opts":["납","카드뮴","크롬","수은"],"ans":3,"exp":"수은 중독의 3대 증상은 구내염, 근육 진전(떨림), 정신 증상이다. 납 중독은 빈혈과 잇몸의 연선, 손목 처짐이, 카드뮴 중독은 신장 장애와 골연화증이, 크롬 중독은 비중격 천공이 특징이다."},
{"id":"c150","subj":"지역사회간호","unit":"산업보건","q":"건축물 해체 작업 등에서 노출되어 폐암과 악성 중피종을 일으키는 분진은?","opts":["유리규산","석면","석탄 분진","면 분진"],"ans":1,"exp":"석면은 석면폐증과 폐암, 흉막이나 복막의 악성 중피종을 일으키며 노출된 뒤 수십 년이 지나 발병하기도 한다. 유리규산은 규폐증을, 석탄 분진은 탄광부 진폐증을, 면 분진은 면폐증을 일으킨다."},
{"id":"c151","subj":"지역사회간호","unit":"산업보건","q":"소음 작업장 근로자에게 발생하는 소음성 난청에 대한 설명으로 옳은 것은?","opts":["초기에는 4,000 Hz 부근의 고음역에서 청력이 저하된다.","소음 노출을 중단하면 손상된 청력이 대부분 회복된다.","외이와 중이의 장애로 발생하는 전음성 난청이다.","대개 한쪽 귀에만 나타나고 다른 쪽 귀는 정상이다."],"ans":0,"exp":"소음성 난청은 속귀의 코르티기관이 손상되어 생기는 감각신경성 난청으로, 초기에 4,000 Hz 부근에서 청력 손실이 뚜렷하다(C5-dip). 대개 양쪽 귀에 함께 나타나고 한번 손상되면 회복되지 않으므로 예방이 가장 중요하다."},
{"id":"c152","subj":"지역사회간호","unit":"산업보건","q":"작업환경 관리 방법과 그 예를 옳게 짝 지은 것은?","opts":["대치 － 분무 도장 공정을 담금 도장 공정으로 바꾼다.","격리 － 세척제로 쓰던 벤젠을 톨루엔으로 바꾼다.","환기 － 유해 물질 취급 설비를 밀폐하고 원격으로 조작한다.","교육 － 분진이 발생하는 곳에 국소 배기 장치를 설치한다."],"ans":0,"exp":"대치는 공정, 시설, 물질을 덜 해로운 것으로 바꾸는 것이며, 페인트를 뿌려 칠하던 것을 담가 칠하는 방식으로 바꾸는 것은 공정의 변경에 해당한다. 벤젠을 톨루엔으로 바꾸는 것은 대치(물질의 변경), 설비를 밀폐하고 원격으로 조작하는 것은 격리, 국소 배기 장치를 설치하는 것은 환기이다."},
{"id":"c155","subj":"지역사회간호","unit":"산업보건","q":"다음 A 사업장의 1년간 자료로 산출한 도수율은?\n\n○ 평균 근로자 수: 800명\n○ 연 근로시간 수: 1,600,000시간\n○ 재해 건수: 8건\n○ 근로 손실 일수: 320일","opts":["0.2","5","10","40"],"ans":1,"exp":"도수율 = (재해 건수 / 연 근로시간 수) × 1,000,000 이다. 8 ÷ 1,600,000 × 1,000,000 = 5. 0.2는 강도율(320 ÷ 1,600,000 × 1,000), 10은 건수율(8 ÷ 800 × 1,000), 40은 재해 한 건당 평균 손실 일수(320 ÷ 8)이다."},
{"id":"c166","subj":"지역사회간호","unit":"인구","q":"인구 구조 지표 중 노년부양비의 산출식으로 옳은 것은?","opts":["(65세 이상 인구 / 15～64세 인구) × 100","(65세 이상 인구 / 0～14세 인구) × 100","(0～14세 인구 / 15～64세 인구) × 100","(65세 이상 인구 / 전체 인구) × 100"],"ans":0,"exp":"노년부양비는 65세 이상 인구를 생산연령 인구(15～64세)로 나누고 100을 곱한 값이다. 65세 이상 인구를 0～14세 인구로 나눈 것은 노령화지수, 0～14세 인구를 15～64세 인구로 나눈 것은 유년부양비이다. 65세 이상 인구를 전체 인구로 나눈 것은 노인 인구 비율이다."},
{"id":"c167","subj":"지역사회간호","unit":"인구","q":"인구의 성별 구조를 나타내는 성비에 대한 설명으로 옳은 것은?","opts":["남자 100명에 대한 여자의 수로 나타낸다.","1차 성비는 현재 인구의 성비이다.","2차 성비는 출생 시의 성비이다.","3차 성비는 태아의 성비이다."],"ans":2,"exp":"성비는 여자 100명에 대한 남자의 수이다. 1차 성비는 태아의 성비, 2차 성비는 출생 시의 성비, 3차 성비는 현재 인구의 성비이다. 예를 들어 한 해에 남아 525명, 여아 500명이 태어났다면 2차 성비는 105이다."},
{"id":"c168","subj":"지역사회간호","unit":"인구","q":"인구의 자연증가와 사회증가에 대한 설명으로 옳은 것은?","opts":["사회증가는 전출 수에서 전입 수를 뺀 것이다.","자연증가는 출생 수에서 사망 수를 뺀 것이다.","인구증가는 자연증가에서 사회증가를 뺀 것이다.","자연증가율의 분모는 15～49세 여성 인구이다."],"ans":1,"exp":"자연증가는 출생 수에서 사망 수를 뺀 것이고, 사회증가는 전입 수에서 전출 수를 뺀 것이다. 인구증가는 자연증가와 사회증가를 더한 것이다. 자연증가율은 자연증가를 연앙인구로 나누고 1,000을 곱하여 구한다."},
{"id":"c169","subj":"지역사회간호","unit":"모자보건","q":"모자보건 지표인 영아사망률에 대한 설명으로 옳은 것은?","opts":["분모는 그해의 연앙인구이다.","분자는 생후 28일 미만에 사망한 아기 수이다.","출생아 1,000명당 생후 1년 미만 사망아 수로 나타낸다.","값이 클수록 그 지역의 보건 수준이 높다고 평가한다."],"ans":2,"exp":"영아사망률은 생후 1년 미만에 사망한 아기 수를 그해 출생아 수로 나누고 1,000을 곱한 값이다. 영아 사망에는 신생아 사망(28일 미만)과 그 뒤의 사망이 모두 들어간다. 생후 28일 미만 사망아 수만 분자로 하면 신생아사망률이며, 영아사망률은 낮을수록 보건 수준이 높다고 본다."},
{"id":"c171","subj":"지역사회간호","unit":"모자보건","q":"알파 인덱스(α-index)가 1에 가까울 때의 해석으로 옳은 것은?","opts":["신생아기 이후의 영아 사망이 많아 환경 개선이 시급하다.","영아 사망의 대부분이 신생아기에 발생하며 보건 수준이 높다.","영아 사망자 수가 출생아 수와 비슷한 수준에 이르렀다.","신생아 사망은 거의 없고 영아 사망의 대부분이 감염 때문이다."],"ans":1,"exp":"알파 인덱스는 영아 사망자 수를 신생아 사망자 수로 나눈 값이다. 1에 가깝다는 것은 영아 사망의 거의 전부가 선천적 원인이 많은 신생아기에 일어나고, 감염이나 영양 같은 환경 요인으로 인한 신생아기 이후 사망은 적다는 뜻이므로 보건 수준이 높다고 본다. 값이 클수록 신생아기 이후 사망이 많다."},
{"id":"c179","subj":"지역사회간호","unit":"재난간호","q":"다수 사상자가 발생한 재난 현장의 중증도 분류에서 황색으로 분류하는 환자는?","opts":["기도가 막혀 호흡 곤란이 심한 환자","의식이 또렷하고 맥박이 안정된 대퇴골 골절 환자","걸어서 이동할 수 있는 찰과상 환자","호흡과 맥박이 모두 없는 환자"],"ans":1,"exp":"황색은 걷지 못하는 손상이 있지만 호흡과 순환, 의식이 안정되어 치료가 몇 시간 늦어져도 생명에 지장이 없는 환자이다. 기도 폐쇄로 호흡 곤란이 심한 환자는 즉시 처치해야 하는 적색, 걸을 수 있는 경상 환자는 녹색, 호흡과 맥박이 없는 환자는 흑색이다."},
{"id":"c180","subj":"지역사회간호","unit":"재난간호","q":"재난 관리 단계 중 대응 단계의 활동에 해당하는 것은?","opts":["위험 지도를 작성하고 건축물의 내진 기준을 강화한다.","비상 연락망을 정비하고 모의 훈련을 실시한다.","현장에서 사상자를 중증도에 따라 분류하고 이송한다.","이재민의 외상 후 스트레스를 장기적으로 관리한다."],"ans":2,"exp":"대응 단계는 재난이 일어난 직후 인명을 구조하고 피해를 줄이는 단계로, 중증도 분류와 응급 처치, 이송, 대피소 운영이 이루어진다. 위험 지도 작성과 내진 기준 강화는 예방·완화 단계, 연락망 정비와 훈련은 대비 단계, 이재민의 장기적인 심리 지원은 복구 단계의 활동이다."},
{"id":"c182","subj":"지역사회간호","unit":"국제보건","q":"국제보건규칙(IHR)에 따라 국제공중보건위기상황(PHEIC)을 선포하는 주체는?","opts":["유엔 사무총장","세계보건총회 의장","유엔 안전보장이사회","세계보건기구 사무총장"],"ans":3,"exp":"국제공중보건위기상황은 질병이 국제적으로 퍼져 다른 나라의 공중보건에 위험이 되고 국제적으로 공동 대응이 필요할 때, 「국제보건규칙(IHR)」에 따라 세계보건기구 사무총장이 긴급위원회의 자문을 받아 선포한다. 유엔 사무총장이나 안전보장이사회의 권한이 아니다."},
{"id":"c183","subj":"지역사회간호","unit":"간호 이론","q":"다음 간호 활동에 해당하는 뉴만(Neuman) 건강관리체계이론의 예방 수준은?\n\n스트레스원이 정상방어선을 뚫고 들어와 증상이 나타난 대상자를 일찍 발견하여 치료하고, 저항선을 강화한다.","opts":["일차 예방","이차 예방","삼차 예방","재구성"],"ans":1,"exp":"이차 예방은 스트레스원이 정상방어선을 침범하여 반응(증상)이 나타났을 때 조기 발견과 치료로 저항선을 강화하는 것이다. 일차 예방은 스트레스원을 없애거나 유연방어선을 강화하여 침범을 막는 것이고, 삼차 예방은 치료 뒤 재적응과 재발 방지를 돕는 것이다. 재구성은 예방 수준이 아니라 체계가 안정을 되찾는 과정이다."},
{"id":"c184","subj":"지역사회간호","unit":"간호사의 역할","q":"다음 설명에 해당하는 지역사회간호사의 역할은?\n\n○ 여러 기관이 제공하는 서비스가 겹치거나 빠지지 않게 조절한다.\n○ 관계자 회의를 열어 대상자에게 필요한 서비스가 알맞은 순서로 제공되게 한다.","opts":["조정자","교육자","연구자","직접간호 제공자"],"ans":0,"exp":"조정자는 여러 기관과 인력이 제공하는 서비스가 겹치거나 빠지지 않도록 조직하고 조절하여 대상자에게 가장 알맞은 서비스가 제공되게 한다. 교육자는 건강 정보를 가르치는 역할, 직접간호 제공자는 간호 문제를 사정하고 직접 간호를 수행하는 역할이다."},
{"id":"c185","subj":"지역사회간호","unit":"간호사의 역할","q":"지역사회간호사의 역할 중 변화촉진자에 해당하는 것은?","opts":["대상자에게 필요한 기관과 자원을 찾아 연결해 준다.","대상자의 처지를 관계 기관에 대신 설명한다.","건강문제를 조사하고 그 결과를 실무에 적용한다.","주민이 저염식을 실천할 동기를 갖고 스스로 결정하게 돕는다."],"ans":3,"exp":"변화촉진자는 대상자가 건강에 이로운 방향으로 바뀌려는 동기를 갖게 하고, 의사결정을 도와 변화를 일으키고 유지하게 하는 역할이다. 필요한 기관이나 자원에 연결해 주는 것은 의뢰자(알선자), 대상자의 처지를 대신 말하는 것은 대변자, 조사 결과를 실무에 적용하는 것은 연구자의 역할이다."},
{"id":"c186","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정에서 이차 자료(기존 자료)에 해당하는 것은?","opts":["주민 대표와 면담한 내용","지역을 돌아보며 관찰한 기록","통계청의 사망 원인 통계","주민에게 직접 받은 설문 응답"],"ans":2,"exp":"이차 자료는 다른 목적으로 이미 만들어져 있는 자료로, 인구 통계와 생정 통계, 공공 기관의 보고서, 의료 기관의 기록, 연구 논문 등이다. 면담, 지역 시찰, 설문 조사로 간호사가 직접 모은 자료는 일차 자료이다."},
{"id":"c187","subj":"지역사회간호","unit":"간호과정","q":"브라이언트(Bryant)의 우선순위 결정 기준에 해당하지 않는 것은?","opts":["문제의 크기","사업의 적법성","문제의 심각도","주민의 관심도"],"ans":1,"exp":"브라이언트의 기준은 문제의 크기, 문제의 심각도, 사업의 기술적 해결 가능성, 주민의 관심도의 네 가지이다. 적법성은 BPRS로 순위를 정한 뒤 사업의 실행 가능성을 판단하는 PEARL의 항목이다."},
{"id":"c188","subj":"지역사회간호","unit":"간호과정","q":"다음 사례에 해당하는 보건사업 평가 범주는?\n\nA 보건소와 B 보건소는 금연 사업에 각각 1,000만 원을 썼고, 6개월 금연 성공자는 50명과 25명이었다. 성공자 한 명당 들어간 비용을 구하여 두 사업을 비교하였다.","opts":["사업의 적합성 평가","사업의 효율성 평가","투입된 노력에 대한 평가","사업 진행에 대한 평가"],"ans":1,"exp":"효율성 평가는 투입한 비용과 인력에 견주어 얼마나 많은 성과를 냈는지, 곧 단위 성과당 비용을 본다. 성공자 한 명당 비용은 A 보건소 20만 원(1,000만 ÷ 50), B 보건소 40만 원(1,000만 ÷ 25)으로 A가 더 효율적이다. 투입된 노력에 대한 평가는 들인 자원의 양만 보고, 진행에 대한 평가는 일정대로 되었는지를 본다."},
{"id":"c189","subj":"지역사회간호","unit":"간호과정","q":"보건사업 평가를 구조·과정·결과 평가로 나눌 때 구조 평가에 해당하는 것은?","opts":["인력, 예산, 시설을 알맞게 확보하였는지 본다.","사업이 계획한 일정대로 진행되었는지 본다.","대상자의 참여율과 프로그램 만족도를 본다.","사업 뒤 대상자의 혈압 조절률이 높아졌는지 본다."],"ans":0,"exp":"구조 평가는 사업에 투입되는 인력, 예산, 시설, 장비, 정보 같은 자원이 적절한지를 본다. 일정의 진행과 참여율, 만족도를 보는 것은 사업이 어떻게 수행되는지를 보는 과정 평가이고, 건강 수준의 변화처럼 목표를 이루었는지를 보는 것은 결과 평가이다."},
{"id":"c190","subj":"지역사회간호","unit":"보건의료체계","q":"다음 설명에 해당하는 진료비 지불제도는?\n\n○ 서비스의 양과 관계없이 질병군별로 미리 정한 금액을 지급한다.\n○ 과잉 진료가 줄고 진료비 청구가 간편해진다.\n○ 서비스를 줄여 의료의 질이 낮아질 우려가 있다.","opts":["포괄수가제","행위별수가제","봉급제","총액계약제"],"ans":0,"exp":"포괄수가제는 진단명 기준 질병군(DRG)별로 정해진 진료비를 지급하므로 의료기관이 스스로 비용을 줄이려 하고 행정이 간편하다. 행위별수가제는 서비스 항목마다 값을 매겨 과잉 진료를 부르기 쉽다. 총액계약제는 보험자와 의사 단체가 한 해의 진료비 총액을 미리 계약한다."},
{"id":"c192","subj":"지역사회간호","unit":"보건의료체계","q":"다음 설명에 해당하는 본인 일부 부담 방식은?\n\n의료비가 일정 금액에 이를 때까지는 이용자가 전액을 부담하고, 그 금액을 넘는 부분만 보험에서 급여한다.","opts":["정률 부담제","일정액 공제제","정액 부담제","급여 상한제"],"ans":1,"exp":"일정액 공제제는 정해진 금액까지는 본인이 모두 부담하게 하여 가벼운 질환으로 의료를 지나치게 이용하는 것을 줄인다. 정률 부담제는 의료비의 일정 비율을, 정액 부담제는 이용할 때마다 일정 금액을 본인이 내는 것이다. 급여 상한제는 보험이 일정 금액까지만 급여하고 넘는 부분을 본인이 내는 것이다."},
{"id":"c194","subj":"지역사회간호","unit":"사회보장","q":"우리나라 산업재해보상보험에 대한 설명으로 옳은 것은?","opts":["근로자에게 과실이 있으면 보상하지 않는다.","업무와 관계없는 질병도 보상 대상에 포함한다.","국민건강보험공단이 보험 사업을 수행한다.","보험료는 원칙적으로 사업주가 전액 부담한다."],"ans":3,"exp":"산업재해보상보험은 사업주의 보상 책임을 보험으로 만든 것이어서 보험료를 원칙적으로 사업주가 모두 부담하고, 근로자의 과실 여부와 관계없이 보상하는 무과실 책임주의를 따른다. 업무상 재해만 보상하며, 보험 사업은 고용노동부장관의 위탁을 받아 근로복지공단이 한다."},
{"id":"c195","subj":"지역사회간호","unit":"보건행정","q":"「지역보건법」상 병원의 요건을 갖춘 보건소가 사용할 수 있는 명칭은?","opts":["보건의료원","보건지소","보건진료소","건강생활지원센터"],"ans":0,"exp":"보건소 중 「의료법」에 따른 병원의 요건을 갖춘 보건소는 보건의료원이라는 명칭을 사용할 수 있다. 보건지소는 보건소의 업무 수행을 위해 읍·면에 두는 기관이고, 건강생활지원센터는 만성질환 예방과 건강한 생활습관 형성을 지원하는 기관이다. 보건진료소는 「농어촌 등 보건의료를 위한 특별조치법」에 따른 시설이다."},
{"id":"c196","subj":"지역사회간호","unit":"보건행정","q":"보건기관과 그 설치 근거 법률을 옳게 짝 지은 것은?","opts":["보건지소 － 농어촌 등 보건의료를 위한 특별조치법","건강생활지원센터 － 국민건강증진법","보건진료소 － 농어촌 등 보건의료를 위한 특별조치법","보건의료원 － 공공보건의료에 관한 법률"],"ans":2,"exp":"보건진료소는 의사가 없는 의료 취약지역에서 보건진료 전담공무원이 일차 진료를 하도록 「농어촌 등 보건의료를 위한 특별조치법」에 따라 설치한다. 보건소, 보건의료원, 보건지소, 건강생활지원센터는 모두 「지역보건법」에 따른 지역보건의료기관이다."},
{"id":"c198","subj":"지역사회간호","unit":"건강증진","q":"다음 설명에 해당하는 오타와 헌장의 건강증진 기본 전략은?\n\n건강의 중요성을 널리 알리고, 건강에 이로운 정책이 만들어지도록 정책 결정자와 대중의 관심과 지지를 이끌어 낸다.","opts":["연합(mediate)","규제(regulate)","역량 강화(enable)","옹호(advocate)"],"ans":3,"exp":"오타와 헌장의 3대 기본 전략은 옹호(advocate), 역량 강화(enable), 연합(mediate)이다. 옹호는 건강에 대한 관심을 불러일으키고 건강한 정책을 채택하도록 촉구하는 것이다. 역량 강화는 사람들이 자신의 건강을 스스로 관리할 수 있게 하는 것, 연합은 여러 분야가 서로 협력하도록 조정하는 것이며, 규제는 3대 전략에 들지 않는다."},
{"id":"c199","subj":"지역사회간호","unit":"건강증진","q":"다음 설명에 해당하는 건강증진 국제회의의 결과물은?\n\n○ 2005년 제6차 건강증진 국제회의에서 채택되었다.\n○ 세계화 시대의 건강 결정요인에 대처하는 전략을 제시하였다.\n○ 옹호, 투자, 역량 함양, 규제와 입법, 파트너십 구축을 강조하였다.","opts":["방콕 헌장","오타와 헌장","애들레이드 권고","자카르타 선언"],"ans":0,"exp":"방콕 헌장은 2005년 태국 방콕에서 열린 제6차 회의에서 채택되었다. 오타와 헌장은 1986년 제1차 회의에서 건강증진의 개념과 5대 활동 영역을 제시하였고, 애들레이드 권고(제2차)는 건강한 공공정책을, 자카르타 선언(제4차)은 건강을 위한 파트너십과 민간 부문의 참여를 강조하였다."},
{"id":"c200","subj":"지역사회간호","unit":"다문화 간호","q":"문화적 역량 모형(Campinha-Bacote)에서 다음 사례에 해당하는 구성 요소는?\n\nA 간호사는 다문화 가정을 방문하기 전에 다른 문화에 대한 자신의 편견과 선입견을 스스로 돌아보았다.","opts":["문화적 지식","문화적 인식","문화적 기술","문화적 만남"],"ans":1,"exp":"문화적 인식은 자신의 문화적 배경과 다른 문화에 대한 편견을 스스로 살피고 깨닫는 것이다. 문화적 지식은 다른 문화의 건강 신념과 관습을 배우는 것, 문화적 기술은 문화적 자료를 수집하고 사정하는 능력, 문화적 만남은 다른 문화권의 대상자와 직접 만나 교류하는 것이다."},
{"id":"c201","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정에서 간호사가 직접 자료를 수집하는 방법만을 모두 고르면?\n\nㄱ. 참여관찰\nㄴ. 지역 지도자 면담\nㄷ. 보건소 사업 보고서 검토\nㄹ. 주민 대상 설문지 조사","opts":["ㄱ, ㄴ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"ans":3,"exp":"참여관찰, 정보원(지역 지도자) 면담, 설문지 조사, 차창 밖 조사는 간호사가 지역사회에서 직접 자료를 얻는 직접 수집 방법이다. 사업 보고서나 통계 자료처럼 이미 만들어진 자료를 검토하는 것은 기존 자료를 활용하는 간접 수집 방법이다."},
{"id":"c202","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정의 자료 분석 단계를 순서대로 바르게 나열한 것은?\n\n(가) 수집한 자료를 서로 관련 있는 것끼리 묶어 범주화한다.\n(나) 다른 지역이나 과거의 자료와 견주어 보고 빠진 자료를 보충한다.\n(다) 범주별 자료를 비율로 계산하고 표와 그래프로 정리한다.\n(라) 분석 결과를 종합하여 지역사회의 건강문제를 찾아낸다.","opts":["(가) → (다) → (나) → (라)","(가) → (나) → (다) → (라)","(다) → (가) → (나) → (라)","(다) → (가) → (라) → (나)"],"ans":0,"exp":"자료 분석은 분류 → 요약 → 확인·비교 → 결론의 순서로 한다. (가)는 자료를 범주화하는 분류 단계, (다)는 표와 그래프로 정리하는 요약 단계, (나)는 다른 자료와 견주고 부족한 자료를 보충하는 확인·비교 단계, (라)는 건강문제를 찾아내는 결론 단계이다."},
{"id":"c203","subj":"지역사회간호","unit":"간호과정","q":"다음 사례에 해당하는 지역사회 간호사정의 자료 분석 단계는?\n\nA 지역 보건소 간호사는 정리한 고혈압 유병률을 전국 평균, 인근 지역, 이 지역의 5년 전 수치와 견주어 보고, 모자라는 자료를 다시 수집하였다.","opts":["분류 단계","요약 단계","확인·비교 단계","결론 단계"],"ans":2,"exp":"확인·비교 단계는 요약한 자료를 과거의 자료나 다른 지역, 전국 자료와 견주어 보고, 빠지거나 부족한 자료를 다시 확인하는 단계이다. 분류 단계는 자료를 범주화하고, 요약 단계는 표와 그래프로 정리하며, 결론 단계는 건강문제를 찾아낸다."},
{"id":"c204","subj":"지역사회간호","unit":"간호과정","q":"지역사회 간호사정의 자료 분석 단계에 대한 설명으로 옳은 것은?","opts":["분류 단계에서는 자료를 표와 그래프로 나타낸다.","확인·비교 단계에서는 다른 지역의 자료와 견주어 본다.","요약 단계에서는 지역사회의 건강문제를 확정한다.","결론 단계에서는 자료를 특성별로 묶어 범주화한다."],"ans":1,"exp":"확인·비교 단계에서는 요약한 자료를 다른 지역이나 과거의 자료와 견주어 보고 부족한 자료를 보충한다. 표와 그래프로 나타내는 것은 요약 단계, 건강문제를 찾아 확정하는 것은 결론 단계, 자료를 특성별로 묶어 범주화하는 것은 분류 단계이다."},
{"id":"c205","subj":"지역사회간호","unit":"간호과정","q":"보건소의 SWOT 분석에서 약점(Weakness)에 해당하는 것은?","opts":["건강증진 사업 전담 인력의 잦은 교체","지역 내 노인 인구 비율의 빠른 증가","만성질환 관리에 대한 정부 지원 확대","사업에 대한 보건소장의 높은 추진 의지"],"ans":0,"exp":"약점은 조직 내부의 부정적 요인이므로 전담 인력이 자주 바뀌는 것이 해당한다. 보건소장의 추진 의지는 내부의 긍정적 요인인 강점이다. 노인 인구 증가와 정부 지원 확대는 조직 바깥의 환경 요인으로, 위협이나 기회로 분류한다."},
{"id":"c206","subj":"지역사회간호","unit":"간호과정","q":"SWOT 분석에 대한 설명으로 옳지 않은 것은?","opts":["강점과 약점은 조직 내부 요인을 분석한 것이다.","기회와 위협은 조직 외부 환경을 분석한 것이다.","WT 전략은 약점을 보완하여 기회를 살리는 전략이다.","SO 전략은 강점을 살려 기회를 활용하는 전략이다."],"ans":2,"exp":"약점을 보완하여 기회를 살리는 것은 WO 전략(국면전환 전략)이다. WT 전략은 약점과 위협이 만날 때 약점을 최소화하고 위협을 피하는 방어적 전략으로, 사업을 줄이거나 철수하는 것이 해당한다. 강점·약점은 내부 요인, 기회·위협은 외부 요인이다."},
{"id":"c207","subj":"지역사회간호","unit":"간호과정","q":"다음 두 건강문제 중 우선순위가 더 높은 것과 그 BPRS 점수는? (단, BPRS ＝ (A ＋ 2B) × C로 계산한다)\n\n건강문제 | A(크기) | B(심각도) | C(사업 효과)\n높은 흡연율 | 8 | 5 | 6\n높은 자살률 | 2 | 10 | 5","opts":["높은 흡연율, 78점","높은 흡연율, 108점","높은 자살률, 60점","높은 자살률, 110점"],"ans":3,"exp":"높은 흡연율은 (8 ＋ 2 × 5) × 6 ＝ 108점, 높은 자살률은 (2 ＋ 2 × 10) × 5 ＝ 110점이므로 높은 자살률의 우선순위가 더 높다. 심각도에 2를 곱하지 않으면 78점과 60점으로 잘못 계산하게 된다."},
{"id":"c208","subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 우선순위 결정 방법은?\n\n○ 미국 메릴랜드주에서 보건지표별 우선순위를 정할 때 사용하였다.\n○ 주요 건강문제의 이환율과 사망률을 전국 수준과 비교하여 좋음, 같음, 나쁨으로 나눈다.\n○ 건강문제의 상대적 크기와 변화 추세를 기준으로 삼는다.","opts":["BPRS","PEARL","NIBP","황금다이아몬드 방식"],"ans":3,"exp":"황금다이아몬드(golden diamond) 방식은 주요 건강문제의 지표를 전국 수준과 견주어 상대적 크기와 변화 추세를 좋음·같음·나쁨으로 나누고, 둘 다 나쁜 문제를 1순위로 삼는다. BPRS는 문제의 크기·심각도·사업 효과를 점수로 계산하고, PEARL은 사업의 실행 가능성을 판단하며, NIBP는 문제의 크기와 해결 방법의 효과를 기준으로 삼는다."},
{"id":"c209","subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 우선순위 결정 방법은?\n\n건강문제의 크기와 해결 방법의 효과를 기준으로 사업을 ‘반드시 수행’, ‘수행’, ‘연구 촉진’, ‘수행 금지’로 구분한다.","opts":["NIBP(Needs Impact Based Planning)","BPRS(Basic Priority Rating System)","PATCH(Planned Approach to Community Health)","브라이언트(Bryant)의 방법"],"ans":0,"exp":"NIBP는 건강문제의 크기(need)와 해결 방법의 효과(impact)를 기준으로 우선순위를 정하여 반드시 수행할 문제, 수행할 문제, 연구를 촉진할 문제, 수행을 금지할 문제로 나눈다. BPRS는 크기·심각도·효과를 공식으로 계산하고, PATCH는 중요성과 변화 가능성을, 브라이언트는 크기·심각도·기술적 해결 가능성·주민의 관심도를 기준으로 삼는다."},
{"id":"c210","subj":"지역사회간호","unit":"간호과정","q":"(가), (나)에 해당하는 투입－산출 모형의 목표를 옳게 짝 지은 것은?\n\n(가) 금연 상담 간호사 2명을 금연클리닉에 배치한다.\n(나) 등록자의 6개월 금연 성공률을 30%로 높인다.","opts":["(가) 투입 목표, (나) 산출 목표","(가) 투입 목표, (나) 결과 목표","(가) 산출 목표, (나) 투입 목표","(가) 산출 목표, (나) 결과 목표"],"ans":1,"exp":"투입 목표는 사업에 들어가는 인력, 시설, 장비, 예산에 관한 목표이므로 간호사 배치가 해당한다. 결과 목표는 사업으로 나타나는 대상자의 건강 행위와 건강 수준의 변화에 관한 목표이므로 금연 성공률이 해당한다. 산출 목표는 상담 횟수나 교육 실시 횟수처럼 사업 활동의 실적에 관한 목표이다."},
{"id":"c211","subj":"지역사회간호","unit":"간호과정","q":"보건사업의 목표를 과정·영향·결과 목표로 나눌 때 결과 목표에 해당하는 것은?","opts":["걷기 교실을 주 2회 운영한다.","참여자의 운동 관련 지식 점수를 20% 높인다.","참여자의 규칙적 운동 실천율을 40%로 높인다.","지역의 심뇌혈관질환 사망률을 10% 낮춘다."],"ans":3,"exp":"결과 목표는 사업의 장기 효과인 사망률, 유병률 같은 건강 수준의 변화를 다룬다. 걷기 교실 운영은 사업 활동에 관한 과정 목표이고, 지식 점수와 운동 실천율의 변화는 건강 결정요인인 지식·태도·행동의 변화를 다루는 영향 목표이다."},
{"id":"c212","subj":"지역사회간호","unit":"간호과정","q":"다음 금연 사업의 목표 달성률[%]은? (단, 목표 달성률 ＝ 실제 변화량 ÷ 목표 변화량 × 100으로 계산한다)\n\n○ 사업 전 성인 흡연율: 40%\n○ 목표로 정한 흡연율: 30%\n○ 사업 후 성인 흡연율: 34%","opts":["15","40","60","85"],"ans":2,"exp":"목표 변화량은 40 － 30 ＝ 10%p이고 실제 변화량은 40 － 34 ＝ 6%p이므로 목표 달성률은 6 ÷ 10 × 100 ＝ 60%이다. 목표까지 남은 4%p를 10으로 나누면 40, 사업 후 흡연율을 사업 전 흡연율로 나누면 85가 되어 틀린다."},
{"id":"c213","subj":"지역사회간호","unit":"간호과정","q":"다음 설명에 해당하는 보건사업 기획 모형은?\n\n○ 지역보건체계의 역량을 높이기 위한 지역사회 단위의 전략적 기획 모형이다.\n○ 지역사회 조직화와 파트너십 개발, 비전 설정, 사정, 전략적 이슈 확인, 목표와 전략 수립, 순환적 활동의 순서로 진행한다.\n○ 사정 단계에서 지역사회의 핵심 주제와 강점, 지역보건체계, 지역사회 건강수준, 변화의 역량을 사정한다.","opts":["PRECEDE-PROCEED","PATCH(Planned Approach to Community Health)","MATCH(Multilevel Approach to Community Health)","MAPP(Mobilizing for Action through Planning and Partnerships)"],"ans":3,"exp":"MAPP은 지역사회 조직화와 파트너십 개발에서 시작하여 비전 설정, 네 가지 사정, 전략적 이슈 확인, 목표와 전략 수립, 순환적 활동으로 이어지는 6단계 전략 기획 모형이다. PATCH는 지역사회 조직화, 자료 수집과 분석, 우선순위 설정, 포괄적 중재 계획, 평가의 5단계이고, MATCH는 목적 설정에서 평가까지의 5단계이며, PRECEDE-PROCEED는 사회적 진단에서 시작한다."},
{"id":"c214","subj":"지역사회간호","unit":"간호과정","q":"PATCH(Planned Approach to Community Health) 모형에 대한 설명으로 옳은 것은?","opts":["삶의 질을 파악하는 사회적 진단에서 기획을 시작한다.","첫 단계에서 지역사회를 조직화하여 주민의 참여를 이끈다.","건강문제의 크기와 해결 방법의 효과로 우선순위를 정한다.","목적 설정, 중재 계획, 프로그램 개발, 실행 준비, 평가로 구성된다."],"ans":1,"exp":"PATCH는 미국 질병통제예방센터(CDC)가 개발한 기획 모형으로 지역사회 조직화(동원), 자료 수집과 분석, 우선순위 설정, 포괄적 중재 계획 개발, 평가의 순서로 진행한다. 사회적 진단에서 시작하는 것은 PRECEDE-PROCEED, 문제의 크기와 해결 방법의 효과로 우선순위를 정하는 것은 NIBP, 목적 설정에서 평가까지의 5단계는 MATCH이다."},
{"id":"c215","subj":"지역사회간호","unit":"간호과정","q":"PRECEDE-PROCEED 모형에 대한 설명으로 옳은 것은?","opts":["사회적 진단에서는 대상 집단의 삶의 질을 사정한다.","역학적 진단에서는 성향·촉진·강화 요인을 규명한다.","교육·생태학적 진단에서는 예산과 인력, 정책을 검토한다.","행정·정책적 진단에서는 건강문제와 행위·환경 요인을 찾는다."],"ans":0,"exp":"사회적 진단은 대상 집단의 삶의 질과 사회 문제를 사정하는 첫 단계이다. 건강문제와 그와 관련된 행위·환경 요인을 찾는 것은 역학적 진단이고, 성향·촉진·강화 요인을 규명하는 것은 교육·생태학적 진단이며, 예산과 인력, 정책을 검토하는 것은 행정·정책적 진단이다."},
{"id":"c216","subj":"지역사회간호","unit":"간호과정","q":"오마하 체계(Omaha System)에 대한 설명으로 옳지 않은 것은?","opts":["문제분류체계, 중재체계, 문제 측정 척도로 구성된다.","문제분류체계는 영역, 문제, 수정인자, 증상·징후의 순으로 이루어진다.","문제 측정 척도는 대상자의 지식, 태도, 기술을 5점 척도로 측정한다.","중재체계의 범주에는 보건교육·상담·안내, 처치와 시술, 사례관리, 감독이 있다."],"ans":2,"exp":"오마하 체계의 문제 측정 척도는 대상자의 지식, 행위, 상태를 5점 척도로 측정하여 간호의 결과를 평가한다. 오마하 체계는 문제분류체계, 중재체계, 문제 측정 척도의 세 부분으로 이루어지며, 중재체계는 보건교육·상담·안내, 처치와 시술, 사례관리, 감독의 네 범주로 나뉜다."},
{"id":"c217","subj":"지역사회간호","unit":"가족간호","q":"가계도(genogram)에 대한 설명으로 옳은 것은?","opts":["가족과 외부 체계의 상호작용을 선으로 나타낸다.","3세대 이상의 가족 구조와 질병력을 도식으로 나타낸다.","가족이 겪은 중요한 사건을 시간 순서대로 적는다.","최근 겪은 생활 변화를 점수로 합산하여 나타낸다."],"ans":1,"exp":"가계도는 3세대 이상에 걸친 가족 구성원의 출생, 사망, 결혼, 이혼, 질병력 등을 기호로 그려 가족 구조를 한눈에 보여 준다. 외부 체계와의 상호작용은 외부체계도, 중요한 사건의 시간 순서는 가족연대기, 생활 변화의 점수 합산은 생의 변화 질문지에 대한 설명이다."},
{"id":"c218","subj":"지역사회간호","unit":"가족간호","q":"가족의 역사에서 중요한 사건을 일어난 순서대로 나열한 가족사정 도구는?","opts":["가족연대기","가족밀착도","사회지지도","생의 변화 질문지"],"ans":0,"exp":"가족연대기는 가족에게 일어난 중요한 사건을 시간 순서대로 적어, 사건이 가족 구성원의 건강문제와 어떤 관련이 있는지 살피는 도구이다. 생의 변화 질문지는 최근에 겪은 생활 사건을 점수로 합산하여 질병 발생 가능성을 예측하는 도구이다."},
{"id":"c219","subj":"지역사회간호","unit":"가족간호","q":"듀발(Duvall)의 가족생활주기별 발달과업으로 옳지 않은 것은?","opts":["신혼기 가족 － 친척에 대한 이해와 관계 수립","양육기 가족 － 부모 역할과 책임에 대한 적응","학령전기 가족 － 자녀의 사회화 교육과 영양 관리","진수기 가족 － 은퇴와 수입 감소에 대한 적응"],"ans":3,"exp":"은퇴와 수입 감소에 적응하는 것은 노년기 가족의 발달과업이다. 진수기 가족의 과업은 자녀의 출가에 따른 부모 역할 적응과 부부 관계의 재조정이다. 신혼기의 친척 관계 수립, 양육기의 부모 역할 적응, 학령전기의 자녀 사회화 교육과 영양 관리는 옳게 연결되었다."},
{"id":"c220","subj":"지역사회간호","unit":"가족간호","q":"다음 사례의 가족이 듀발(Duvall)의 가족생활주기에서 이루어야 할 발달과업은?\n\nA 씨 부부는 초등학교 3학년인 첫째와 유치원에 다니는 둘째를 키우고 있다.","opts":["자녀의 학업 성취 증진","자녀의 출가에 따른 부모 역할 적응","친척에 대한 이해와 관계 수립","은퇴와 사회적 지위 변화에 대한 적응"],"ans":0,"exp":"듀발은 첫 자녀의 나이를 기준으로 단계를 나누므로, 첫 자녀가 초등학생(6～13세)인 이 가족은 학령기 가족이다. 학령기 가족의 과업은 자녀의 사회화와 학업 성취 증진, 가족 내 규칙과 규범 확립, 만족스러운 부부 관계 유지이다. 자녀 출가에 따른 적응은 진수기, 친척 관계 수립은 신혼기, 은퇴에 대한 적응은 노년기의 과업이다."},
{"id":"c221","subj":"지역사회간호","unit":"가족간호","q":"가족 이론 중 구조기능 이론에 대한 설명으로 옳은 것은?","opts":["가족생활주기의 단계마다 이루어야 할 과업에 초점을 둔다.","구성원이 상황에 부여하는 의미와 역할 기대에 초점을 둔다.","가족 구조가 사회가 요구하는 기능을 수행하는지에 초점을 둔다.","가족이 스트레스 사건에 적응해 가는 과정에 초점을 둔다."],"ans":2,"exp":"구조기능 이론은 가족을 사회 체계의 한 부분으로 보고, 가족의 구조가 사회와 구성원이 요구하는 기능을 얼마나 잘 수행하는지에 관심을 둔다. 단계별 과업은 가족발달 이론, 의미와 역할 기대는 상징적 상호작용 이론, 스트레스 사건에 대한 적응은 가족 스트레스(위기) 이론의 초점이다."},
{"id":"c222","subj":"지역사회간호","unit":"가족간호","q":"가족발달 이론에 대한 설명으로 옳지 않은 것은?","opts":["가족은 시간의 흐름에 따라 일정한 단계를 거치며 변화한다고 본다.","한부모 가족 등 다양한 가족 형태에 그대로 적용하기 쉽다.","각 단계의 과업을 이루면 다음 단계의 과업 수행이 쉬워진다고 본다.","듀발(Duvall)은 첫 자녀의 나이를 기준으로 가족생활주기를 나누었다."],"ans":1,"exp":"가족발달 이론은 부부와 자녀로 이루어진 핵가족을 전제로 단계를 나누었기 때문에 한부모 가족, 무자녀 가족, 재혼 가족 같은 다양한 가족 형태에는 그대로 적용하기 어렵다. 가족이 단계를 거치며 변화하고, 단계마다 발달과업이 있으며, 듀발이 첫 자녀의 나이를 기준으로 삼았다는 설명은 옳다."},
{"id":"c223","subj":"지역사회간호","unit":"가족간호","q":"가족 사정의 원칙으로 옳은 것만을 모두 고르면?\n\nㄱ. 가족의 다양성과 변화성을 고려한다.\nㄴ. 한 가지 방법으로 얻은 자료만으로 판단한다.\nㄷ. 수집한 자료 가운데 의미 있는 것을 선택하여 기록한다.\nㄹ. 한 번의 면담으로 끝내지 않고 자료를 지속적으로 수집한다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"ans":1,"exp":"가족 사정에서는 ‘정상 가족’이라는 고정관념을 버리고 가족의 다양성과 변화성을 고려하며, 자료를 지속적으로 수집하고 그 가운데 의미 있는 것을 골라 기록한다. 가족 정보에는 이중적인 의미가 담긴 것이 있으므로 한 가지 방법에 기대지 않고 여러 방법으로 복합적인 정보를 모아야 한다."},
{"id":"c224","subj":"지역사회간호","unit":"가족간호","q":"취약가족의 유형과 그 예를 옳게 연결한 것은?","opts":["구조적 취약가족 － 저소득 가족","기능적 취약가족 － 조손 가족","상호작용 취약가족 － 가정폭력 가족","발달단계 취약가족 － 이혼 가족"],"ans":2,"exp":"상호작용 취약가족은 구성원 사이의 상호작용에 문제가 있는 가족으로 가정폭력(학대) 가족, 비행 청소년 가족, 알코올 중독자 가족 등이 해당한다. 저소득 가족은 기능적 취약가족이고, 조손 가족과 이혼 가족은 구조적 취약가족이다."},
{"id":"c225","subj":"지역사회간호","unit":"가족간호","q":"프리드먼(Friedman)이 제시한 가족 기능에 대한 설명으로 옳은 것은?","opts":["사회화 기능 － 자녀를 낳아 사회 구성원을 충원한다.","경제적 기능 － 자녀에게 사회 규범과 가치를 가르친다.","건강관리 기능 － 필요한 자원을 마련하고 배분한다.","정서적 기능 － 구성원의 심리적 욕구를 충족하고 안정을 준다."],"ans":3,"exp":"정서적(애정) 기능은 가족 구성원의 심리적 욕구를 충족하고 정서적 안정을 주는 기능이다. 자녀를 낳아 사회 구성원을 충원하는 것은 생식 기능, 사회 규범과 가치를 가르치는 것은 사회화 기능, 자원을 마련하고 배분하는 것은 경제적 기능이며, 건강관리 기능은 의식주와 건강 관리를 제공하는 기능이다."},
{"id":"c226","subj":"지역사회간호","unit":"건강증진","q":"국민건강증진종합계획(Health Plan 2030)의 비전은?","opts":["모든 사람이 평생 건강을 누리는 사회","온 국민이 함께 만들고 누리는 건강세상","2000년까지 모든 인류에게 건강을","모든 정책에서 건강을 고려하는 사회"],"ans":0,"exp":"국민건강증진종합계획(Health Plan 2030)의 비전은 ‘모든 사람이 평생 건강을 누리는 사회’이며, 2026년 3월에 확정된 제6차 계획(2026～2030년)도 이 비전을 그대로 이어 간다. ‘온 국민이 함께 만들고 누리는 건강세상’은 그 앞의 계획인 Health Plan 2020의 비전이다. ‘2000년까지 모든 인류에게 건강을’은 세계보건기구가 내건 목표로 알마아타 선언과 관련되고, 모든 정책에서 건강을 고려하자는 것은 2013년 제8차 건강증진 국제회의(헬싱키)의 주제이다."},
{"id":"c227","subj":"지역사회간호","unit":"건강증진","q":"세계보건기구(WHO)가 제시한 건강도시(Healthy Cities)에 대한 설명으로 옳은 것은?","opts":["건강 지표가 정해진 수준에 이른 도시를 말한다.","보건의료 부문이 단독으로 추진하는 것을 원칙으로 한다.","질병 치료를 위한 의료 시설 확충을 우선 과제로 삼는다.","도시의 물리적·사회적 환경을 지속적으로 개선해 나간다."],"ans":3,"exp":"건강도시는 도시의 물리적·사회적 환경을 지속적으로 개선하고 지역사회의 자원을 넓혀, 시민이 서로 도우며 잠재력을 최대한 발휘하게 하는 도시이다. 특정한 건강 수준에 이른 도시가 아니라 건강을 높이려고 계속 노력하는 과정을 중시한다. 보건의료 부문만이 아니라 여러 부문의 협력과 주민 참여로 추진하며, 치료 시설 확충보다 건강에 이로운 환경과 정책을 만드는 데 초점을 둔다."},
{"id":"c228","subj":"지역사회간호","unit":"건강증진","q":"오타와 헌장의 건강증진 5대 활동 영역만을 모두 고르면?\n\nㄱ. 건강한 공공정책 수립\nㄴ. 지지적 환경 조성\nㄷ. 치료 중심 의료서비스 확대\nㄹ. 개인의 건강 기술 개발","opts":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"ans":2,"exp":"오타와 헌장의 5대 활동 영역은 건강한 공공정책 수립, 지지적 환경 조성, 지역사회 활동 강화, 개인의 기술 개발, 보건의료서비스의 방향 재설정이다. 보건의료서비스의 방향 재설정은 치료 중심에서 예방과 건강증진 중심으로 바꾸는 것이므로, 치료 중심 의료서비스 확대는 해당하지 않는다."},
{"id":"c229","subj":"지역사회간호","unit":"건강증진","q":"오타와 헌장의 건강증진 활동 영역과 그 예를 옳게 연결한 것은?","opts":["지지적 환경 조성 － 당뇨병 환자 대상 자가 관리 교육","지역사회 활동 강화 － 주민이 운영하는 걷기 모임 지원","개인의 기술 개발 － 사업장 금연구역 확대 조례 제정","보건의료서비스의 방향 재설정 － 학교 주변 보행로 설치"],"ans":1,"exp":"지역사회 활동 강화는 주민이 스스로 건강문제를 정하고 해결하도록 주민 조직과 참여를 지원하는 것이다. 자가 관리 교육은 개인의 기술 개발, 조례 제정은 건강한 공공정책 수립, 안전한 보행로 설치는 지지적 환경 조성에 해당한다."},
{"id":"c230","subj":"지역사회간호","unit":"건강증진","q":"건강증진 국제회의와 그 주요 내용을 옳게 연결한 것은?","opts":["제1차 오타와 회의 － 건강증진의 3대 원칙과 5대 활동 전략 제시","제2차 애들레이드 회의 － 건강을 지지하는 환경 조성 강조","제3차 선즈볼 회의 － 건강한 공공정책 수립 강조","제4차 자카르타 회의 － 모든 정책에서의 건강(HiAP) 강조"],"ans":0,"exp":"1986년 제1차 오타와 회의는 건강증진의 3대 원칙(옹호, 역량 강화, 연합)과 5대 활동 전략을 제시하였다. 건강한 공공정책은 제2차 애들레이드 회의, 지지적 환경 조성은 제3차 선즈볼 회의의 주제이고, 모든 정책에서의 건강(HiAP)은 2013년 제8차 헬싱키 회의에서 강조하였다."},
{"id":"c231","subj":"지역사회간호","unit":"건강증진","q":"건강형평성에 대한 설명으로 옳은 것은?","opts":["모든 사람에게 같은 양의 보건의료서비스를 제공하는 것을 뜻한다.","유전적 요인에 따른 건강 차이를 없애는 것을 일차 목표로 한다.","소득, 교육, 지역 등에 따른 피할 수 있는 건강 격차가 없는 상태이다.","집단 간 비교 없이 전체 인구의 평균 건강수준으로 판단한다."],"ans":2,"exp":"건강형평성은 사회적·경제적·지리적으로 나뉜 집단 사이에 피할 수 있고 불공정한 건강 격차가 없는 상태를 뜻한다. 똑같은 양을 나누는 평등과 다르며, 필요가 큰 집단에 더 많은 자원을 배분할 수 있다. 소득수준별·지역별 건강수명 격차처럼 집단 간 비교로 그 수준을 판단한다."},
{"id":"c232","subj":"지역사회간호","unit":"건강증진","q":"라론드(Lalonde) 보고서에 대한 설명으로 옳은 것은?","opts":["1986년 제1차 건강증진 국제회의에서 채택되었다.","건강에 가장 큰 영향을 미치는 요인을 보건의료조직으로 보았다.","치료 중심 의료에 대한 투자를 늘려야 한다고 강조하였다.","건강 결정요인으로 생물학적 요인, 환경, 생활양식, 보건의료조직을 들었다."],"ans":3,"exp":"1974년 캐나다의 라론드 보고서는 건강 결정요인을 생물학적 요인, 환경, 생활양식, 보건의료조직의 네 가지로 제시하고, 그 가운데 생활양식의 영향이 가장 크다고 보았다. 이 보고서는 치료 중심에서 예방과 건강증진 중심으로 정책이 바뀌는 계기가 되었다. 1986년 제1차 회의에서 채택된 것은 오타와 헌장이다."},
{"id":"c233","subj":"지역사회간호","unit":"건강증진","q":"타나힐(Tannahill)의 건강증진 모형을 구성하는 영역이 아닌 것은?","opts":["재활","예방","보건교육","건강보호"],"ans":0,"exp":"타나힐은 건강증진을 보건교육, 예방, 건강보호의 세 영역이 서로 겹치는 모형으로 설명하였다. 건강보호는 법률, 재정, 사회적 방법으로 건강에 이로운 환경을 만드는 것이다. 재활은 이 모형의 영역에 들지 않는다."},
{"id":"c234","subj":"지역사회간호","unit":"보건교육","q":"(가), (나)에 해당하는 브래드쇼(Bradshaw)의 교육 요구 유형을 옳게 짝 지은 것은?\n\n(가) 주민이 스스로 고혈압 관리 교육이 필요하다고 느낀다.\n(나) 주민이 보건소에 고혈압 관리 교육을 열어 달라고 신청한다.","opts":["(가) 내면적 요구, (나) 외향적 요구","(가) 내면적 요구, (나) 상대적 요구","(가) 규범적 요구, (나) 외향적 요구","(가) 외향적 요구, (나) 내면적 요구"],"ans":0,"exp":"내면적 요구는 대상자가 스스로 필요하다고 느끼는 요구이고, 외향적 요구는 그 느낌을 신청이나 요청 같은 말과 행동으로 드러낸 요구이다. 규범적 요구는 전문가가 기준에 비추어 판단한 요구, 상대적 요구는 다른 집단과 비교하여 드러난 요구이다."},
{"id":"c235","subj":"지역사회간호","unit":"보건교육","q":"보건교육의 학습목표를 진술하는 방법으로 옳지 않은 것은?","opts":["교육자가 아니라 학습자를 주어로 하여 진술한다.","‘안다’, ‘이해한다’처럼 포괄적인 동사를 사용한다.","한 문장에 한 가지 성과만 담아 진술한다.","학습 후 기대되는 최종 행동을 중심으로 진술한다."],"ans":1,"exp":"학습목표는 ‘열거한다’, ‘시범 보인다’처럼 관찰하고 측정할 수 있는 행동 용어로 진술해야 한다. ‘안다’, ‘이해한다’ 같은 동사는 달성 여부를 확인하기 어려워 알맞지 않다. 학습자를 주어로 하고, 한 문장에 한 가지 성과만 담으며, 학습 후의 최종 행동을 진술하는 것은 옳은 방법이다."},
{"id":"c236","subj":"지역사회간호","unit":"건강행위 이론","q":"다음 금연 전략에 해당하는 사회생태학적 모형의 수준은?\n\n○ 직장 내 금연 규정을 만들고 사업장 전체를 금연 구역으로 운영한다.\n○ 금연에 성공한 직원에게 회사가 포상 휴가를 준다.","opts":["개인 수준","개인 간 수준","조직 수준","정책 수준"],"ans":2,"exp":"조직 수준의 전략은 직장, 학교 같은 조직의 규칙과 규정, 환경, 보상 제도를 바꾸어 구성원의 행동에 영향을 주는 것이다. 개인 수준은 지식·태도·기술을 바꾸는 교육과 상담, 개인 간 수준은 가족·친구·동료 같은 사회적 관계망의 활용, 정책 수준은 법률과 조례, 세금 같은 공공정책이다."},
{"id":"c237","subj":"지역사회간호","unit":"건강행위 이론","q":"비만 예방 사업에서 사회생태학적 모형의 수준별 중재를 옳게 연결한 것은?","opts":["개인 수준 － 가족과 함께하는 걷기 동아리 운영","지역사회 수준 － 지역 단체들이 연합한 걷기 캠페인","개인 간 수준 － 영양 표시 읽는 법 개별 교육","정책 수준 － 직장 구내식당의 저열량 식단 제공"],"ans":1,"exp":"지역사회 수준의 중재는 지역의 조직과 단체가 연계하여 벌이는 캠페인, 행사, 환경 조성 등이다. 가족과 함께하는 동아리는 사회적 관계망을 활용하는 개인 간 수준, 개별 교육은 개인 수준, 구내식당 식단 제공은 조직 수준의 중재이다. 정책 수준은 법률 제정이나 세금 부과 같은 공공정책을 말한다."},
{"id":"c238","subj":"지역사회간호","unit":"간호 이론","q":"뉴만(Neuman)의 건강관리체계이론에 대한 설명으로 옳지 않은 것은?","opts":["기본 구조는 대상자의 생존에 필요한 에너지 자원이다.","정상방어선은 대상자가 오랫동안 유지해 온 안녕 상태이다.","저항선은 기본 구조를 둘러싸고 있는 가장 안쪽의 방어선이다.","일차 예방은 저항선을 강화하여 증상을 완화하는 활동이다."],"ans":3,"exp":"저항선을 강화하고 증상을 완화하는 것은 스트레스원이 정상방어선을 침범한 뒤에 하는 이차 예방이다. 일차 예방은 스트레스원을 줄이거나 유연방어선을 강화하여 스트레스원이 정상방어선을 침범하지 못하게 하는 활동이다. 기본 구조, 정상방어선, 저항선에 대한 설명은 옳다."},
{"id":"c239","subj":"지역사회간호","unit":"간호 이론","q":"오렘(Orem)의 자가간호이론에 대한 설명으로 옳은 것은?","opts":["보편적 자가간호요구는 질병이나 상해가 있을 때 생기는 요구이다.","건강이탈 자가간호요구는 모든 인간이 공통으로 가지는 요구이다.","자가간호요구가 자가간호역량보다 클 때 자가간호결핍이 생긴다.","교육지지적 체계는 자가간호를 전혀 하지 못하는 대상자에게 적용한다."],"ans":2,"exp":"오렘은 자가간호요구가 그것을 충족하는 능력인 자가간호역량보다 클 때 자가간호결핍이 생기고 이때 간호가 필요하다고 보았다. 모든 인간이 공통으로 가지는 요구는 보편적 자가간호요구이고, 질병이나 상해가 있을 때 생기는 요구는 건강이탈 자가간호요구이다. 자가간호를 전혀 하지 못하는 대상자에게는 전체적 보상체계를 적용한다."},
{"id":"c240","subj":"지역사회간호","unit":"간호 이론","q":"로이(Roy)의 적응이론에 대한 설명으로 옳은 것은?","opts":["적응 양상은 생리적 기능, 자아개념, 역할기능, 상호의존의 네 가지이다.","조절기전은 지각, 학습, 판단 등을 통해 반응하는 대처기전이다.","인지기전은 신경계와 내분비계를 통해 자동으로 반응하는 대처기전이다.","잔여자극은 초점자극과 함께 있어 영향을 뚜렷이 알 수 있는 자극이다."],"ans":0,"exp":"로이는 자극에 대한 대처기전이 작동한 결과가 생리적 기능, 자아개념, 역할기능, 상호의존의 네 가지 적응 양상으로 나타난다고 보았다. 신경계와 내분비계를 통해 자동으로 반응하는 것은 조절기전이고, 지각·학습·판단·정서를 통해 반응하는 것은 인지기전이다. 초점자극과 함께 작용하여 영향을 확인할 수 있는 자극은 연관자극이다."},
{"id":"c241","subj":"지역사회간호","unit":"간호 이론","q":"지역사회간호에 체계이론을 적용할 때 구성 요소를 옳게 연결한 것은?","opts":["투입 － 지역사회 간호과정","변환 － 지역사회 주민과 자원","산출 － 적정기능 수준의 향상","회환 － 지역사회의 물리적 환경"],"ans":2,"exp":"지역사회 간호사업을 체계로 보면 투입은 지역사회 주민과 인력·물자 같은 자원이고, 변환은 지역사회 간호과정이며, 산출은 지역사회의 적정기능 수준 향상이다. 회환은 산출을 평가한 결과를 다시 투입에 반영하는 과정이고, 물리적 환경은 체계를 둘러싸고 영향을 주는 환경에 해당한다."},
{"id":"c242","subj":"지역사회간호","unit":"가정간호·방문·사례관리","q":"가정방문의 장점만을 모두 고르면?\n\nㄱ. 대상자의 생활환경을 직접 보고 상황에 맞는 간호를 제공한다.\nㄴ. 거동이 불편한 대상자도 서비스를 받을 수 있다.\nㄷ. 같은 문제를 가진 대상자끼리 경험을 나누기 쉽다.\nㄹ. 다른 간호 수단보다 간호사의 시간과 비용이 적게 든다.","opts":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ"],"ans":0,"exp":"가정방문은 대상자의 실제 생활환경을 살펴 가족의 상황에 맞는 간호와 교육을 할 수 있고, 거동이 불편한 대상자도 서비스를 받을 수 있다. 반면 간호사의 시간과 비용이 많이 들고, 같은 문제를 가진 사람들과 경험을 나누기 어렵다. 경험을 나누기 쉽고 시간과 비용이 적게 드는 것은 건강관리실(클리닉) 활동의 장점이다."},
{"id":"c301","subj":"지역사회간호","unit":"산업보건","q":"산업안전보건법령상 근로자 건강진단에 대한 설명으로 옳지 않은 것은?","opts":["일반건강진단은 사무직 근로자에게 2년에 1회 이상 실시한다.","배치전건강진단은 특수건강진단 대상 업무에 배치하기 전에 실시한다.","임시건강진단은 고용노동부장관의 명령에 따라 사업주가 실시한다.","특수건강진단은 사무직을 포함한 모든 근로자에게 실시한다."],"ans":3,"exp":"특수건강진단은 소음, 분진, 화학물질 등 법령이 정한 유해 인자에 노출되는 업무에 종사하는 근로자에게 유해 인자별로 정해진 주기에 따라 실시한다. 일반건강진단은 사무직 근로자는 2년에 1회 이상, 그 밖의 근로자는 1년에 1회 이상 실시한다. 배치전건강진단은 배치 예정 업무에 대한 적합성을 평가하려는 것이다."},
{"id":"c302","subj":"지역사회간호","unit":"산업보건","q":"작업장의 유해 물질 노출 기준 중 다음 설명에 해당하는 것은?\n\n1일 8시간 작업을 기준으로, 유해 인자의 측정치에 발생 시간을 곱하여 8시간으로 나눈 값이다.","opts":["단시간노출기준(STEL)","최고노출기준(C)","시간가중평균노출기준(TWA)","생물학적 노출지수(BEI)"],"ans":2,"exp":"시간가중평균노출기준(TWA)은 1일 8시간 작업을 기준으로 한 평균 노출 농도이다. 단시간노출기준(STEL)은 15분간의 시간가중평균 노출값이고, 최고노출기준(C)은 1일 작업시간 동안 잠시라도 넘어서는 안 되는 기준이다. 생물학적 노출지수(BEI)는 혈액이나 소변 같은 생체 시료로 노출 정도를 평가하는 지표이다."},
{"id":"c303","subj":"지역사회간호","unit":"보건행정","q":"지역보건법령상 시장·군수·구청장이 수립한 지역보건의료계획의 처리 절차로 옳은 것은?","opts":["시·도 의회의 의결을 거쳐 보건복지부장관에게 제출한다.","시·군·구 의회에 보고하고 시·도지사에게 제출한다.","보건복지부장관의 승인을 받은 뒤 시·군·구 의회에 보고한다.","질병관리청장에게 제출한 뒤 시·도지사에게 통보한다."],"ans":1,"exp":"시장·군수·구청장은 지역보건의료계획을 수립한 뒤 해당 시·군·구 의회에 보고하고 시·도지사에게 제출한다. 시·도지사는 시·도의 계획을 수립하여 시·도 의회에 보고하고 보건복지부장관에게 제출한다. 의회에는 보고하는 것이며 의결이나 승인을 받는 것이 아니다."},
{"id":"c304","subj":"지역사회간호","unit":"보건행정","q":"보건소의 설치와 운영에 대한 설명으로 옳지 않은 것은?","opts":["보건복지부에 소속된 특별지방행정기관이다.","시·군·구에 1개소를 설치하는 것이 원칙이다.","보건소장은 시장·군수·구청장의 지휘·감독을 받는다.","보건사업에 대하여 보건복지부의 기술 지도를 받는다."],"ans":0,"exp":"보건소는 지방자치단체가 조례로 설치하는 지방자치단체 소속 기관이다. 그래서 인력과 예산은 지방자치단체에서 받고, 보건사업에 대한 기술 지도와 감독은 보건복지부에서 받는 이원적 구조이다. 「지역보건법」에 따라 시·군·구에 1개소를 설치하며 보건소장은 시장·군수·구청장의 지휘·감독을 받는다."},
{"id":"c305","subj":"지역사회간호","unit":"보건행정","q":"「지역보건법」상 보건소의 기능 및 업무에 해당하는 것만을 모두 고르면?\n\nㄱ. 건강 친화적인 지역사회 여건의 조성\nㄴ. 지역보건의료정책의 기획, 조사·연구 및 평가\nㄷ. 의료기관 인증 기준의 제정과 인증 평가\nㄹ. 보건의료 관련기관·단체, 학교, 직장 등과의 협력체계 구축","opts":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"ans":2,"exp":"「지역보건법」이 정한 보건소의 기능 및 업무는 건강 친화적인 지역사회 여건의 조성, 지역보건의료정책의 기획·조사·연구 및 평가, 보건의료인과 보건의료기관 등에 대한 지도·관리·육성, 보건의료 관련기관·단체 등과의 협력체계 구축, 지역주민의 건강증진 및 질병예방·관리를 위한 지역보건의료서비스의 제공이다. 의료기관 인증은 「의료법」에 따라 보건복지부장관이 하는 일이다."},
{"id":"c306","subj":"지역사회간호","unit":"보건행정","q":"지역보건법령상 지역사회 건강실태조사에 대한 설명으로 옳지 않은 것은?","opts":["지방자치단체의 장이 매년 실시한다.","보건소를 통하여 지역주민을 대상으로 실시한다.","표본조사를 원칙으로 하되 필요하면 전수조사를 할 수 있다.","조사 결과는 행정안전부장관에게 통보한다."],"ans":3,"exp":"지방자치단체의 장은 매년 보건소를 통하여 지역주민을 대상으로 지역사회 건강실태조사를 실시하고, 그 결과를 질병관리청장에게 통보한다. 조사는 표본조사를 원칙으로 하되 필요한 경우 전수조사를 할 수 있다."},
{"id":"c307","subj":"지역사회간호","unit":"보건행정","q":"지역보건법령상 다음 설명에 해당하는 지역보건의료기관은?\n\n○ 보건소의 업무 수행을 위하여 필요한 경우 지방자치단체의 조례로 설치한다.\n○ 읍·면(보건소가 설치된 읍·면은 제외)마다 1개씩 설치할 수 있다.","opts":["보건지소","보건의료원","보건진료소","건강생활지원센터"],"ans":0,"exp":"보건지소는 보건소의 업무 수행을 위하여 읍·면(보건소가 설치된 읍·면은 제외)마다 1개씩 설치할 수 있다. 건강생활지원센터는 만성질환 예방과 건강한 생활습관 형성을 지원하기 위하여 읍·면·동마다 설치할 수 있는 기관이다. 보건의료원은 병원의 요건을 갖춘 보건소이고, 보건진료소는 「지역보건법」이 아닌 「농어촌 등 보건의료를 위한 특별조치법」에 따른 시설이다."},
{"id":"c308","subj":"지역사회간호","unit":"역학 지표","q":"검사 도구의 타당도 지표에 대한 설명으로 옳지 않은 것은?","opts":["민감도는 질병이 있는 사람 중 검사 양성인 사람의 비율이다.","특이도는 질병이 없는 사람 중 검사 음성인 사람의 비율이다.","위양성률은 질병이 있는 사람 중 검사 음성인 사람의 비율이다.","양성예측도는 검사 양성인 사람 중 질병이 있는 사람의 비율이다."],"ans":2,"exp":"위양성률은 질병이 없는 사람 중 검사 결과가 양성으로 나온 사람의 비율로, 1에서 특이도를 뺀 값이다. 질병이 있는 사람 중 검사 음성인 사람의 비율은 위음성률이며 1에서 민감도를 뺀 값이다. 민감도, 특이도, 양성예측도의 정의는 모두 옳다."},
{"id":"c309","subj":"지역사회간호","unit":"감염병 관리","q":"약독화 생백신으로 예방접종하는 감염병만을 모두 고르면?\n\nㄱ. 결핵\nㄴ. 파상풍\nㄷ. 홍역\nㄹ. 수두","opts":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"ans":1,"exp":"결핵(BCG), 홍역(MMR), 수두 백신은 살아 있는 병원체의 독성을 약하게 만든 약독화 생백신이다. 파상풍은 균이 내는 독소가 병을 일으키므로, 독소의 독성을 없애고 면역을 일으키는 성질만 남긴 순화독소(톡소이드)로 접종한다."},
{"id":"c310","subj":"지역사회간호","unit":"감염병 관리","q":"감염병 유행과 관련한 집단면역에 대한 설명으로 옳지 않은 것은?","opts":["기초감염재생산수가 클수록 유행을 막는 데 필요한 면역 인구 비율이 낮다.","집단 안에서 면역을 가진 사람이 차지하는 비율로 나타낸다.","집단면역 수준이 한계밀도보다 높으면 유행이 일어나지 않는다.","예방접종률이 높아지면 집단면역 수준도 함께 높아진다."],"ans":0,"exp":"집단면역의 한계밀도는 1 － 1/R₀ 로 구하므로 기초감염재생산수(R₀)가 클수록 유행을 막는 데 필요한 면역 인구 비율이 높아진다. 예를 들어 R₀가 5이면 인구의 80% 이상이 면역을 가져야 한다. 집단면역은 집단 내 면역 보유자의 비율이며 예방접종으로 높일 수 있다."},
{"id":"c311","subj":"지역사회간호","unit":"감염병 관리","q":"(가), (나)에 해당하는 감염병 지표를 옳게 짝 지은 것은?\n\n(가) 감염된 사람 중 증상이 나타난 사람(현성 감염자)의 비율\n(나) 현성 감염자 중 중증 환자와 사망자의 비율","opts":["(가) 독력, (나) 병원력","(가) 병원력, (나) 독력","(가) 감염력, (나) 병원력","(가) 병원력, (나) 치명률"],"ans":1,"exp":"병원력은 감염된 사람 가운데 현성 감염자의 비율이고, 독력은 현성 감염자 가운데 중증 환자와 사망자의 비율이다. 감염력은 병원체에 접촉한 감수성자 가운데 감염된 사람의 비율이고, 치명률은 현성 감염자 가운데 사망자만의 비율이다."},
