{"id":"k09","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 쓰임이 옳은 것은?","opts":["우체국에서 소포를 __부쳤다__.","퀴즈의 정답을 모두 __맞췄다__.","고무줄을 길게 __늘렸다__.","비가 와서 우산을 __받혀__ 들었다."],"ans":0,"exp":"편지나 물건을 보낼 때는 \"부치다\"를 쓴다. 정답을 골라낼 때는 \"맞히다\"(맞혔다), 길이를 길게 할 때는 \"늘이다\"(늘였다), 우산을 펴 들 때는 \"받치다\"(받쳐)가 옳다. \"늘리다\"는 수나 양을 많게 할 때, \"맞추다\"는 둘을 나란히 놓고 비교할 때 쓴다."},
{"id":"k10","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["올해 __합격율__이 크게 올랐다.","점수를 __백분률__로 나타냈다.","남녀의 __비률__이 비슷하다.","이번 달 __출석률__이 가장 높다."],"ans":3,"exp":"\"率\"은 모음이나 ㄴ 받침 뒤에서는 \"율\"로, 그 밖의 받침 뒤에서는 \"률\"로 적는다. 따라서 \"출석률, 합격률\"과 \"백분율, 비율\"이 옳다."},
{"id":"k11","subj":"국어","unit":"맞춤법","q":"준말의 표기가 옳지 않은 것은?","opts":["생각하건대 → 생각건대","간편하게 → 간편케","넉넉하지 않다 → 넉넉치 않다","연구하도록 → 연구토록"],"ans":2,"exp":"\"하\" 앞의 받침이 ㄱ, ㄷ, ㅂ처럼 안울림소리이면 \"하\"가 통째로 줄므로 \"넉넉지 않다\", \"생각건대\"로 적는다. \"하\" 앞이 모음이나 울림소리(ㄴ, ㄹ, ㅁ, ㅇ)이면 ㅏ만 줄고 ㅎ이 뒤의 소리와 어울려 거센소리가 되므로 \"간편케\", \"연구토록\"이 된다."},
{"id":"k12","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["그는 소문난 __멋장이__이다.","벽을 바르려고 __미장이__를 불렀다.","동생은 __욕심장이__이다.","__대장쟁이__가 쇠를 달군다."],"ans":1,"exp":"기술을 가진 사람에게는 \"-장이\"를, 그 밖의 경우에는 \"-쟁이\"를 붙인다. 벽에 흙이나 시멘트를 바르는 기술자는 \"미장이\", 쇠를 다루는 기술자는 \"대장장이\"이고, 기술과 관계없는 말은 \"멋쟁이\", \"욕심쟁이\"로 적는다."},
{"id":"k13","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["그럴 수 밖에 없었다.","믿을 사람은 너 뿐이다.","아는 대로 말해라.","집채 만한 파도가 인다."],"ans":2,"exp":"관형어 \"아는\" 뒤의 \"대로\"는 의존 명사이므로 띄어 쓴다. \"밖에\", \"뿐\"이 체언 뒤에 오면 조사이므로 \"수밖에\", \"너뿐이다\"로 붙여 쓴다. \"만\"은 조사, \"한\"은 \"하다\"의 활용형이므로 \"집채만 한\"으로 쓴다."},
{"id":"k14","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳지 않은 것은?","opts":["소 한 마리를 샀다.","나이가 스물 다섯 살이다.","삼천사백오십육만 원을 모았다.","차 두 대가 서 있다."],"ans":1,"exp":"수를 적을 때는 만 단위로 띄어 쓰므로 \"스물다섯\"은 붙여 써서 \"스물다섯 살\"로 적는다. 단위를 나타내는 의존 명사 \"마리, 원, 대, 살\"은 앞말과 띄어 쓴다."},
{"id":"k15","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["비가 오는데 우산이 없다.","그 일을 끝내는데 사흘이 걸렸다.","머리 아픈데 먹는 약이다.","이제는 갈데가 없다."],"ans":0,"exp":"\"-는데\"가 뒤 내용의 배경을 나타내는 연결 어미일 때는 붙여 쓴다. \"일, 경우, 곳\"을 뜻하는 \"데\"는 의존 명사이므로 \"끝내는 데\", \"아픈 데\", \"갈 데\"로 띄어 쓴다. 뒤에 조사 \"에\"를 넣어 말이 되면 의존 명사이다."},
{"id":"k16","subj":"국어","unit":"표준어","q":"표준어가 아닌 것은?","opts":["삐지다","이쁘다","찰지다","설레이다"],"ans":3,"exp":"\"설레다\"만 표준어이고 \"설레이다\"는 표준어가 아니다(명사형도 \"설렘\"). \"삐지다\"(2014년), \"이쁘다\"와 \"찰지다\"(2015년)는 각각 \"삐치다\", \"예쁘다\", \"차지다\"와 함께 쓰는 표준어로 인정되었다."},
{"id":"k17","subj":"국어","unit":"표준어","q":"밑줄 친 말이 표준어인 것은?","opts":["__윗어른__께 인사를 드렸다.","외양간에 __숫소__가 있다.","__수캉아지__ 한 마리를 얻었다.","토끼가 __깡총깡총__ 뛴다."],"ans":2,"exp":"\"수캉아지\"는 접두사 \"수-\" 뒤에서 거센소리를 인정한 표준어이다(수캐, 수탉, 수평아리 등). 위아래의 짝이 없는 말은 \"웃-\"을 쓰므로 \"웃어른\", 수컷은 \"수-\"로 통일하므로 \"수소\"(숫양, 숫염소, 숫쥐만 \"숫-\"), 모음조화가 깨진 형태가 굳어진 \"깡충깡충\"이 표준어이다."},
{"id":"k18","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["맑게[말께]","읊고[읍꼬]","닭을[다글]","넓죽하다[넙쭈카다]"],"ans":2,"exp":"겹받침 뒤에 모음으로 시작하는 조사가 오면 뒤의 자음을 다음 음절로 옮겨 발음하므로 \"닭을\"은 [달글]이다. ㄺ은 ㄱ 앞에서 [ㄹ]로 발음하여 맑게[말께], ㄿ은 [ㅂ]으로 발음하여 읊고[읍꼬]이고, \"넓죽하다\"는 예외적으로 [넙]으로 발음한다."},
{"id":"k19","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["난로[난노]","의견란[의견난]","대관령[대괄령]","생산량[생산냥]"],"ans":0,"exp":"ㄴ은 ㄹ의 앞이나 뒤에서 [ㄹ]로 발음하므로 \"난로\"는 [날로], \"대관령\"은 [대괄령]이다. 다만 \"의견란, 생산량\"처럼 ㄴ으로 끝나는 한자어에 ㄹ로 시작하는 말이 덧붙은 일부 낱말은 ㄹ을 [ㄴ]으로 발음한다."},
{"id":"k20","subj":"국어","unit":"표준 발음","q":"표준 발음으로 인정되지 않는 것은?","opts":["희망[히망]","의사[으사]","주의[주이]","우리의[우리에]"],"ans":1,"exp":"낱말의 첫음절 \"의\"는 반드시 [ㅢ]로 발음하므로 \"의사\"는 [의사]이다. 자음을 첫소리로 가진 \"ㅢ\"는 [ㅣ]로 발음하고(희망[히망]), 첫음절이 아닌 \"의\"는 [ㅣ]로, 조사 \"의\"는 [ㅔ]로 발음하는 것도 허용한다."},
{"id":"k21","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 옳은 것은?","opts":["메세지","악세사리","쥬스","리더십"],"ans":3,"exp":"\"리더십\"이 옳다. 영어의 [ʃ]는 낱말 끝에서 \"시\"로 적는다. 나머지는 \"메시지\", \"액세서리\", \"주스\"로 적는다. 외래어에서는 ㅈ, ㅊ 뒤에 \"ㅑ, ㅕ, ㅛ, ㅠ\"를 쓰지 않는다."},
{"id":"k22","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 옳지 않은 것은?","opts":["바베큐","초콜릿","소시지","케이크"],"ans":0,"exp":"\"barbecue\"는 \"바비큐\"로 적는다. \"초콜릿\", \"소시지\", \"케이크\"는 옳은 표기이며, 흔히 \"초콜렛\", \"소세지\", \"케익\"으로 잘못 적는다."},
{"id":"k23","subj":"국어","unit":"로마자 표기","q":"국어의 로마자 표기가 옳은 것은?","opts":["종로 Jongro","독립문 Dongnimmun","신라 Sinla","속리산 Sokrisan"],"ans":1,"exp":"로마자 표기는 표준 발음에 따라 적는다. 독립문[동님문]은 Dongnimmun이다. 종로[종노]는 Jongno, 신라[실라]는 Silla, 속리산[송니산]은 Songnisan으로 적는다."},
{"id":"k24","subj":"국어","unit":"로마자 표기","q":"국어의 로마자 표기가 옳지 않은 것은?","opts":["울릉 Ulleung","경복궁 Gyeongbokgung","묵호 Mukho","압구정 Apggujeong"],"ans":3,"exp":"된소리되기는 로마자 표기에 반영하지 않으므로 압구정[압꾸정]은 Apgujeong으로 적는다. ㄹㄹ은 ll로 적고(Ulleung), 체언에서 ㄱ, ㄷ, ㅂ 뒤에 ㅎ이 올 때는 ㅎ을 밝혀 적는다(Mukho)."},
{"id":"k25","subj":"국어","unit":"음운","q":"\"국물[궁물]\"과 같은 종류의 음운 변동이 일어나는 것은?","opts":["좋아[조아]","솜이불[솜니불]","밥만[밤만]","축하[추카]"],"ans":2,"exp":"\"국물\"은 ㄱ이 비음 ㅁ 앞에서 비음 ㅇ으로 바뀌는 비음화(교체)이다. \"밥만\"도 ㅂ이 ㅁ 앞에서 ㅁ으로 바뀌는 비음화이다. \"좋아\"는 ㅎ 탈락, \"솜이불\"은 ㄴ 첨가, \"축하\"는 ㄱ과 ㅎ이 ㅋ으로 줄어드는 축약이다."},
{"id":"k26","subj":"국어","unit":"음운","q":"\"꽃잎[꼰닙]\"을 발음할 때 일어나는 음운 변동이 아닌 것은?","opts":["음절의 끝소리 규칙","ㄴ 첨가","비음화","구개음화"],"ans":3,"exp":"\"꽃잎\"은 받침 ㅊ과 ㅍ이 각각 ㄷ, ㅂ으로 바뀌고(음절의 끝소리 규칙), \"잎\" 앞에 ㄴ이 덧나며(ㄴ 첨가), 그 ㄴ 앞에서 ㄷ이 ㄴ으로 바뀐다(비음화). 구개음화는 ㄷ, ㅌ이 모음 ㅣ 앞에서 ㅈ, ㅊ으로 바뀌는 현상으로 여기서는 일어나지 않는다."},
{"id":"k27","subj":"국어","unit":"음운","q":"소리 나는 위치가 같은 자음끼리 묶은 것은?","opts":["ㄱ, ㅋ, ㅇ","ㄴ, ㅁ, ㅇ","ㅂ, ㄷ, ㄱ","ㅅ, ㅈ, ㅎ"],"ans":0,"exp":"ㄱ, ㅋ, ㅇ은 모두 혀의 뒷부분과 여린입천장 사이에서 나는 여린입천장소리(연구개음)이다. ㄴ, ㅁ, ㅇ은 소리 내는 방법이 같은 비음이고 위치는 서로 다르다. ㅂ은 입술, ㄷ과 ㅅ은 잇몸, ㅈ은 센입천장, ㅎ은 목청에서 난다."},
{"id":"k28","subj":"국어","unit":"품사","q":"밑줄 친 단어의 품사가 나머지 셋과 다른 것은?","opts":["__새__ 옷을 입었다.","__예쁜__ 꽃이 피었다.","__옛__ 친구를 만났다.","__온갖__ 꽃이 피었다."],"ans":1,"exp":"\"예쁜\"은 형용사 \"예쁘다\"의 활용형으로, 관형어 구실을 하지만 품사는 형용사이다. \"새, 옛, 온갖\"은 형태가 바뀌지 않고 체언만 꾸미는 관형사이다."},
{"id":"k29","subj":"국어","unit":"품사","q":"밑줄 친 말이 수사인 것은?","opts":["__한__ 사람도 오지 않았다.","__세__ 번이나 전화했다.","__여러__ 나라를 다녔다.","학생 __둘__이 찾아왔다."],"ans":3,"exp":"\"둘\"은 뒤에 조사 \"이\"가 붙어 수량을 나타내는 수사이다. \"한, 세, 여러\"는 뒤에 오는 체언을 꾸미는 관형사이며 조사가 붙지 못한다."},
{"id":"k30","subj":"국어","unit":"단어 형성","q":"파생어인 것은?","opts":["풋사과","돌다리","밤낮","작은집"],"ans":0,"exp":"\"풋사과\"는 \"덜 익은\"의 뜻을 더하는 접두사 \"풋-\"과 어근 \"사과\"가 합쳐진 파생어이다. \"돌다리, 밤낮, 작은집\"은 어근과 어근이 합쳐진 합성어이다."},
{"id":"k31","subj":"국어","unit":"단어 형성","q":"비통사적 합성어인 것은?","opts":["큰집","첫사랑","돌아가다","덮밥"],"ans":3,"exp":"\"덮밥\"은 용언의 어간 \"덮-\"이 관형사형 어미 없이 명사에 바로 붙었으므로 우리말의 일반적인 문장 구성 방식과 다른 비통사적 합성어이다. \"큰집\"(관형사형+명사), \"첫사랑\"(관형사+명사), \"돌아가다\"(연결 어미로 이어진 용언)는 통사적 합성어이다."},
{"id":"k32","subj":"국어","unit":"형태소","q":"\"나는 밥을 먹었다.\"에서 실질 형태소이면서 의존 형태소인 것은?","opts":["나","밥","먹-","-었-"],"ans":2,"exp":"\"먹-\"은 구체적인 동작의 뜻을 가진 실질 형태소이지만 어미 없이 혼자 쓰이지 못하는 의존 형태소이다. \"나, 밥\"은 실질 형태소이면서 자립 형태소이고, \"-었-\"은 문법적 뜻만 가진 형식 형태소이면서 의존 형태소이다."},
{"id":"k33","subj":"국어","unit":"용언의 활용","q":"규칙 활용을 하는 용언은?","opts":["(짐을) 싣다","(옷을) 벗다","(병이) 낫다","(물이) 흐르다"],"ans":1,"exp":"\"벗다\"는 \"벗어, 벗으니\"처럼 어간과 어미의 모양이 바뀌지 않는 규칙 활용을 한다. \"싣다\"는 \"실어\"(ㄷ 불규칙), \"낫다\"는 \"나아\"(ㅅ 불규칙), \"흐르다\"는 \"흘러\"(르 불규칙)로 활용한다."},
{"id":"k34","subj":"국어","unit":"조사","q":"밑줄 친 조사의 쓰임이 나머지 셋과 다른 것은?","opts":["아침에 빵__과__ 우유를 먹었다.","봄에는 개나리__와__ 진달래가 핀다.","서점에서 책__과__ 공책을 샀다.","그는 아버지__와__ 많이 닮았다."],"ans":3,"exp":"\"아버지와 닮았다\"의 \"와\"는 비교의 대상을 나타내는 부사격 조사이다. 나머지의 \"와/과\"는 두 체언을 같은 자격으로 이어 주는 접속 조사이다."},
{"id":"k35","subj":"국어","unit":"문장 성분","q":"밑줄 친 부분의 문장 성분이 나머지 셋과 다른 것은?","opts":["물이 __얼음이__ 되었다.","물이 __얼음으로__ 되었다.","그는 __학생이__ 아니다.","동생이 벌써 __어른이__ 되었다."],"ans":1,"exp":"\"되다, 아니다\" 앞에서 조사 \"이/가\"가 붙어 뜻을 보충하는 말은 보어이다. \"얼음으로\"는 부사격 조사 \"으로\"가 붙은 부사어이다."},
{"id":"k36","subj":"국어","unit":"안은문장","q":"명사절을 안은 문장은?","opts":["나는 그가 오기를 기다렸다.","그가 읽은 책은 재미있다.","비가 소리도 없이 내린다.","토끼는 앞발이 짧다."],"ans":0,"exp":"\"그가 오기\"는 명사형 어미 \"-기\"가 붙어 목적어 구실을 하는 명사절이다. \"그가 읽은\"은 관형절, \"소리도 없이\"는 부사절, \"앞발이 짧다\"는 서술절이다."},
{"id":"k37","subj":"국어","unit":"피동 표현","q":"피동 표현이 바르게 쓰인 문장은?","opts":["그의 이름은 곧 잊혀졌다.","칠판에 글씨가 쓰여 있다.","그렇게 보여진다고 한다.","종이가 둘로 나뉘어졌다."],"ans":1,"exp":"\"쓰여\"는 \"쓰다\"에 피동 접미사 \"-이-\"가 한 번만 붙은 바른 표현이다. \"잊혀지다, 보여지다, 나뉘어지다\"는 피동 접미사가 붙은 말에 \"-어지다\"가 또 붙은 이중 피동이므로 \"잊혔다, 보인다고, 나뉘었다\"로 고쳐야 한다."},
{"id":"k38","subj":"국어","unit":"사동 표현","q":"사동 표현이 쓰이지 않은 문장은?","opts":["엄마가 아이에게 밥을 먹였다.","선생님이 학생에게 책을 읽혔다.","도둑이 경찰에게 잡혔다.","형이 동생을 울렸다."],"ans":2,"exp":"\"잡혔다\"는 주어가 남의 행동을 당하는 것을 나타내는 피동 표현이다. \"먹였다, 읽혔다, 울렸다\"는 주어가 남에게 어떤 행동을 하게 하는 사동 표현이다."},
{"id":"k39","subj":"국어","unit":"높임법","q":"높임 표현이 바르게 쓰인 문장은?","opts":["주문하신 커피 나오셨습니다.","궁금한 점은 저에게 여쭤 보세요.","할머니께서는 귀가 밝으시다.","교장 선생님의 말씀이 계시겠습니다."],"ans":2,"exp":"높일 대상의 신체 일부를 높여 그 사람을 높이는 간접 높임은 \"-시-\"를 쓰므로 \"귀가 밝으시다\"가 옳다. 커피는 높일 대상이 아니므로 \"나왔습니다\", \"여쭈다\"는 말하는 이가 윗사람에게 물을 때 쓰므로 \"물어보세요\", 간접 높임에는 \"계시다\"를 쓰지 않으므로 \"말씀이 있으시겠습니다\"가 옳다."},
{"id":"k40","subj":"국어","unit":"높임법","q":"객체 높임법이 쓰인 문장은?","opts":["나는 어머니를 모시고 갔다.","아버지께서 신문을 보신다.","선생님께서 교실에 계신다.","오늘 날씨가 참 좋습니다."],"ans":0,"exp":"객체 높임법은 목적어나 부사어가 가리키는 대상을 높이는 방법으로, \"모시다, 드리다, 여쭈다, 뵙다\" 같은 특수 어휘를 쓴다. \"보신다, 계신다\"는 주어를 높이는 주체 높임법이고, \"좋습니다\"는 듣는 이를 높이는 상대 높임법이다."},
{"id":"k41","subj":"국어","unit":"문장 고쳐 쓰기","q":"어법에 맞고 자연스러운 문장은?","opts":["내 꿈은 훌륭한 간호사가 되고 싶다.","우리는 자연을 보호하고 순응하며 살아야 한다.","그는 결코 약속을 지키는 사람이다.","비록 형편이 어렵더라도 꿈을 포기하지 않겠다."],"ans":3,"exp":"\"비록\"은 \"-더라도\"와 호응하므로 자연스럽다. \"내 꿈은\"으로 시작한 문장은 주어와 서술어가 호응하도록 \"내 꿈은 훌륭한 간호사가 되는 것이다\"로 고치고, \"순응하며\" 앞에는 빠진 부사어를 넣어 \"자연을 보호하고 자연에 순응하며\"로 고친다. \"결코\"는 부정 표현과 호응하므로 \"결코 약속을 어기지 않는 사람이다\"처럼 써야 한다."},
{"id":"k42","subj":"국어","unit":"문장 고쳐 쓰기","q":"중의적으로 해석되지 않는 문장은?","opts":["나는 어제 학교에서 친구를 만났다.","학생들이 다 오지 않았다.","나는 형과 누나를 만났다.","키가 큰 친구의 동생을 보았다."],"ans":0,"exp":"\"나는 어제 학교에서 친구를 만났다.\"는 한 가지 뜻으로만 읽힌다. \"다 오지 않았다\"는 한 명도 오지 않았다는 뜻과 일부만 왔다는 뜻으로, \"형과 누나를 만났다\"는 형과 함께 누나를 만났다는 뜻과 두 사람을 모두 만났다는 뜻으로 읽힌다. \"키가 큰\"은 친구를 꾸미는지 동생을 꾸미는지 분명하지 않다."},
{"id":"k43","subj":"국어","unit":"한자성어","q":"반딧불과 눈빛으로 글을 읽었다는 고사에서 나온 말로, 고생하면서 꾸준히 공부하여 얻은 보람을 뜻하는 한자성어는?","opts":["형설지공(螢雪之功)","와신상담(臥薪嘗膽)","절차탁마(切磋琢磨)","주경야독(晝耕夜讀)"],"ans":0,"exp":"형설지공은 기름 살 돈이 없어 반딧불과 눈빛에 비추어 글을 읽었다는 차윤과 손강의 고사에서 나왔다. 와신상담은 원수를 갚으려고 괴로움을 참고 견딤, 절차탁마는 학문이나 덕행을 부지런히 닦음, 주경야독은 낮에 농사짓고 밤에 글을 읽음을 뜻한다."},
{"id":"k44","subj":"국어","unit":"한자성어","q":"뜻이 비슷한 한자성어끼리 짝지은 것이 아닌 것은?","opts":["풍전등화(風前燈火) – 누란지위(累卵之危)","수주대토(守株待兔) – 각주구검(刻舟求劍)","금의환향(錦衣還鄕) – 금의야행(錦衣夜行)","막역지우(莫逆之友) – 관포지교(管鮑之交)"],"ans":2,"exp":"금의환향은 출세하여 고향에 돌아옴을 뜻하고, 금의야행은 비단옷을 입고 밤길을 간다는 말로 아무 보람이 없는 행동을 뜻하므로 서로 비슷하지 않다. 풍전등화와 누란지위는 매우 위태로운 형편, 수주대토와 각주구검은 융통성 없는 어리석음, 막역지우와 관포지교는 두터운 우정을 뜻한다."},
{"id":"k45","subj":"국어","unit":"한자성어","q":"빈칸에 들어갈 한자성어로 가장 적절한 것은?\n\n지난 대회에서 예선 탈락의 쓴맛을 본 그 팀은 한 해 동안 실력을 길러 다시 도전하겠다며 ______의 뜻을 다졌다.","opts":["자포자기(自暴自棄)","권토중래(捲土重來)","수수방관(袖手傍觀)","안분지족(安分知足)"],"ans":1,"exp":"권토중래는 한 번 실패한 뒤 힘을 길러 다시 도전함을 뜻한다. 자포자기는 절망하여 자신을 돌보지 않음, 수수방관은 팔짱을 끼고 보고만 있음, 안분지족은 제 분수를 지키며 만족함을 뜻하므로 다시 도전하는 상황에 맞지 않는다."},
{"id":"k46","subj":"국어","unit":"한자성어","q":"밑줄 친 한자성어의 쓰임이 적절하지 않은 것은?","opts":["두 사람은 __견원지간__이라 만나기만 하면 다툰다.","길이 막히는데 __설상가상__으로 눈까지 내렸다.","다른 회사의 실패를 __타산지석__으로 삼았다.","그는 서류를 __주마간산__으로 꼼꼼히 검토했다."],"ans":3,"exp":"주마간산(走馬看山)은 달리는 말 위에서 산을 본다는 뜻으로 자세히 살피지 않고 대충 보고 지나감을 이르므로 \"꼼꼼히 검토했다\"와 어울리지 않는다. 견원지간은 사이가 매우 나쁜 관계, 설상가상은 어려운 일이 겹침, 타산지석은 남의 잘못을 자신을 닦는 데 도움으로 삼음을 뜻한다."},
{"id":"k47","subj":"국어","unit":"속담","q":"\"원인이 없으면 결과가 있을 수 없음\"을 뜻하는 속담은?","opts":["가는 말이 고와야 오는 말이 곱다","소 잃고 외양간 고친다","아니 땐 굴뚝에 연기 날까","바늘 도둑이 소도둑 된다"],"ans":2,"exp":"\"아니 땐 굴뚝에 연기 날까\"는 원인이 있어야 결과가 생긴다는 뜻이다. \"가는 말이 고와야 오는 말이 곱다\"는 내가 남에게 잘해야 남도 내게 잘한다는 뜻, \"소 잃고 외양간 고친다\"는 일을 그르친 뒤에 뉘우쳐도 소용없다는 뜻, \"바늘 도둑이 소도둑 된다\"는 작은 나쁜 버릇이 큰 잘못으로 자란다는 뜻이다."},
{"id":"k48","subj":"국어","unit":"속담","q":"속담과 한자성어의 뜻이 서로 통하지 않는 것은?","opts":["소 잃고 외양간 고친다 – 망양보뢰(亡羊補牢)","달면 삼키고 쓰면 뱉는다 – 감탄고토(甘呑苦吐)","등잔 밑이 어둡다 – 등하불명(燈下不明)","고래 싸움에 새우 등 터진다 – 어부지리(漁夫之利)"],"ans":3,"exp":"어부지리는 둘이 다투는 사이에 제삼자가 힘들이지 않고 이익을 얻음을 뜻한다. 강한 자들의 싸움에 약한 자가 피해를 본다는 \"고래 싸움에 새우 등 터진다\"와 통하는 말은 경전하사(鯨戰蝦死)이다. 나머지는 뜻이 서로 통한다."},
{"id":"k49","subj":"국어","unit":"고유어","q":"고유어의 뜻풀이가 옳지 않은 것은?","opts":["톺아보다: 대강 훑어보다","시나브로: 모르는 사이에 조금씩 조금씩","미쁘다: 믿음성이 있다","곰살궂다: 성질이 부드럽고 친절하다"],"ans":0,"exp":"\"톺아보다\"는 샅샅이 더듬어 가며 살핀다는 뜻이므로 \"대강 훑어보다\"와는 반대에 가깝다. 나머지 뜻풀이는 옳다."},
{"id":"k50","subj":"국어","unit":"단위어","q":"물건을 세는 단위와 그 수량의 연결이 옳지 않은 것은?","opts":["북어 한 쾌: 스무 마리","마늘 한 접: 쉰 개","오징어 한 축: 스무 마리","바늘 한 쌈: 스물네 개"],"ans":1,"exp":"\"접\"은 채소나 과일 따위를 백 개씩 묶어 세는 단위이므로 마늘 한 접은 백 개이다. 쾌는 북어 스무 마리, 축은 오징어 스무 마리, 쌈은 바늘 스물네 개를 이른다."},
{"id":"k51","subj":"국어","unit":"어휘","q":"밑줄 친 \"손\"의 의미가 〈보기〉와 가장 가까운 것은?\n\n〈보기〉 어머니는 __손__이 커서 음식을 늘 넉넉하게 장만하신다.","opts":["__손__이 모자라서 일을 끝내지 못했다.","그 일은 이제 내 __손__을 떠났다.","__손__이 작은 그는 선물도 조금만 샀다.","아이의 __손__을 꼭 잡았다."],"ans":2,"exp":"〈보기〉의 \"손이 크다\"는 씀씀이가 후하다는 뜻이고, \"손이 작다\"는 씀씀이가 깐깐하고 작다는 뜻이므로 둘 다 \"손\"이 씀씀이를 가리킨다. \"손이 모자라다\"의 손은 일하는 사람, \"손을 떠나다\"의 손은 영향력이 미치는 범위, \"손을 잡았다\"의 손은 신체의 일부이다."},
{"id":"k52","subj":"국어","unit":"한자어","q":"밑줄 친 한자어의 쓰임이 옳은 것은?","opts":["카드로 물건값을 __결재__했다.","우리 모임은 회원끼리의 친목을 __지양__한다.","부장에게 서류 __결제__를 받았다.","기간이 끝난 운전면허를 __갱신__했다."],"ans":3,"exp":"계약이나 면허의 기간을 연장하는 일은 \"갱신(更新)\"이다. \"지양(止揚)\"은 어떤 것을 하지 않는다는 뜻이므로, 목표로 삼아 나아간다는 뜻의 \"지향(志向)\"을 써서 \"친목을 지향한다\"로 고쳐야 한다. 대금을 치르는 일은 \"결제(決濟)\", 윗사람이 안건을 승인하는 일은 \"결재(決裁)\"이므로 \"물건값을 결제했다\", \"서류 결재를 받았다\"가 옳다."},
{"id":"k53","subj":"국어","unit":"한자어","q":"밑줄 친 말을 바꿔 쓴 것이 적절하지 않은 것은?","opts":["주민의 의견을 __수렴하다__ → 모으다","사소한 문제를 __간과하다__ → 꿰뚫어 보다","새해 계획을 __수립하다__ → 세우다","교통 법규를 __준수하다__ → 지키다"],"ans":1,"exp":"\"간과(看過)하다\"는 큰 관심 없이 대강 보아 넘긴다는 뜻이므로 \"보아 넘기다\"로 바꿔 써야 한다. \"꿰뚫어 보다\"는 \"간파(看破)하다\"에 해당한다. 나머지는 뜻이 맞게 바꿔 쓴 것이다."},
{"id":"k54","subj":"국어","unit":"의미 관계","q":"두 단어의 의미 관계가 나머지 셋과 다른 것은?","opts":["길다 – 짧다","살다 – 죽다","출석 – 결석","참 – 거짓"],"ans":0,"exp":"\"길다 – 짧다\"는 중간 단계가 있어 둘 다 부정할 수 있는 정도 반의어이다(\"길지도 짧지도 않다\"). 나머지는 한쪽을 부정하면 곧 다른 쪽이 되고 중간 단계가 없는 상보 반의어이다."},
{"id":"k55","subj":"국어","unit":"관용 표현","q":"관용 표현의 뜻풀이가 옳지 않은 것은?","opts":["발이 넓다: 아는 사람이 많아 활동 범위가 넓다","귀가 얇다: 남의 말을 쉽게 받아들인다","입이 무겁다: 말이 많고 수다스럽다","손을 씻다: 나쁜 일에서 관계를 끊는다"],"ans":2,"exp":"\"입이 무겁다\"는 말수가 적거나 비밀을 잘 지킨다는 뜻이다. 말이 많거나 비밀을 잘 지키지 못하는 것은 \"입이 가볍다\"라고 한다. 나머지 뜻풀이는 옳다."},
{"id":"k56","subj":"국어","unit":"한자어","q":"나이를 이르는 말과 그 나이의 연결이 옳지 않은 것은?","opts":["지학(志學): 15세","이립(而立): 30세","불혹(不惑): 40세","이순(耳順): 50세"],"ans":3,"exp":"이순은 60세를 이르는 말이다. 50세는 하늘의 뜻을 안다는 지천명(知天命)이다. 모두 《논어》에서 공자가 자신의 삶을 돌아보며 한 말에서 나왔다."},
{"id":"k57","subj":"국어","unit":"논리","q":"다음 두 진술이 모두 참일 때 반드시 참인 것은?\n\n- 간호사는 모두 면허를 가지고 있다.\n- 면허를 가진 사람은 모두 보수 교육을 받는다.","opts":["보수 교육을 받는 사람은 모두 간호사이다.","보수 교육을 받지 않는 사람은 간호사가 아니다.","면허를 가진 사람은 모두 간호사이다.","간호사가 아닌 사람은 면허를 가지고 있지 않다."],"ans":1,"exp":"두 진술을 이으면 \"간호사는 모두 보수 교육을 받는다\"가 되고, 그 대우인 \"보수 교육을 받지 않는 사람은 간호사가 아니다\"도 반드시 참이다. 나머지는 주어진 진술의 역이나 이에 해당하므로 반드시 참이라고 할 수 없다."},
{"id":"k58","subj":"국어","unit":"논리","q":"갑, 을, 병 세 사람 가운데 한 명이 꽃병을 깼다. 세 사람의 말 가운데 하나만 참일 때, 꽃병을 깬 사람은?\n\n갑: \"을이 깼다.\"\n을: \"나는 깨지 않았다.\"\n병: \"나는 깨지 않았다.\"","opts":["갑","을","병","주어진 말만으로는 알 수 없다"],"ans":2,"exp":"병이 깼다면 갑의 말은 거짓, 을의 말은 참, 병의 말은 거짓이어서 참인 말이 하나뿐이다. 갑이 깼다면 을과 병의 말이 모두 참이 되고, 을이 깼다면 갑과 병의 말이 모두 참이 되어 조건에 맞지 않는다."},
{"id":"k59","subj":"국어","unit":"논리","q":"다음 전제에 하나를 더하여 결론이 반드시 참이 되게 하려고 한다. 더할 전제로 알맞은 것은?\n\n전제: 성실한 사람은 모두 신뢰를 얻는다.\n결론: 어떤 신입 사원은 신뢰를 얻는다.","opts":["어떤 신입 사원은 성실하다.","신뢰를 얻는 사람은 모두 성실하다.","어떤 신입 사원은 성실하지 않다.","성실하지 않은 사람은 모두 신입 사원이다."],"ans":0,"exp":"성실한 신입 사원이 한 명이라도 있으면, 성실한 사람은 모두 신뢰를 얻으므로 그 사람은 신뢰를 얻는다. 나머지 전제는 신입 사원 가운데 성실한 사람이 있다는 것을 보장하지 못하므로 결론을 이끌어 낼 수 없다."},
{"id":"k60","subj":"국어","unit":"논리","q":"A, B, C, D 네 사람이 달리기를 했다. 다음 조건에 따를 때 두 번째로 들어온 사람은? (동시에 들어온 사람은 없다.)\n\n- A는 B보다 먼저 들어왔다.\n- C는 A보다 먼저 들어왔다.\n- D는 B보다 늦게 들어왔다.","opts":["A","B","C","D"],"ans":0,"exp":"조건을 이으면 C가 A보다, A가 B보다, B가 D보다 먼저 들어왔으므로 순서는 C, A, B, D이다. 따라서 두 번째로 들어온 사람은 A이다."},
{"id":"k61","subj":"국어","unit":"논리","q":"다음 논증에 나타난 오류는?\n\n귀신이 없다는 것을 지금까지 아무도 증명하지 못했다. 그러므로 귀신은 있다.","opts":["성급한 일반화의 오류","무지에 호소하는 오류","인신공격의 오류","순환 논증의 오류"],"ans":1,"exp":"거짓이라고 증명되지 않았다는 것을 근거로 참이라고 주장하는 것은 무지에 호소하는 오류이다. 성급한 일반화는 몇몇 사례만으로 전체를 판단하는 것, 인신공격은 주장이 아니라 주장하는 사람을 공격하는 것, 순환 논증은 결론을 전제로 다시 쓰는 것이다."},
{"id":"k62","subj":"국어","unit":"논리","q":"다음 논증을 약화하는 것으로 가장 적절한 것은?\n\n스마트폰을 오래 쓰는 청소년일수록 잠자는 시간이 짧다는 조사 결과가 나왔다. 따라서 스마트폰 사용이 청소년의 수면 부족을 일으킨다.","opts":["스마트폰 사용 시간을 줄이게 한 청소년 집단의 수면 시간이 늘어났다.","스마트폰 화면의 빛이 잠을 부르는 호르몬의 분비를 줄인다.","다른 나라의 조사에서도 같은 결과가 나왔다.","잠이 오지 않는 청소년이 그 시간에 스마트폰을 쓰는 경우가 많았다."],"ans":3,"exp":"잠이 오지 않아서 스마트폰을 쓰는 것이라면 원인과 결과의 방향이 반대이므로, 스마트폰 사용이 수면 부족의 원인이라는 결론이 약해진다. 나머지는 스마트폰 사용이 수면을 줄인다는 주장을 뒷받침하거나 같은 조사 결과를 되풀이할 뿐이다."},
{"id":"k63","subj":"국어","unit":"논리","q":"타당한 추론은?","opts":["독감에 걸리면 열이 난다. 민수는 열이 난다. 따라서 민수는 독감에 걸렸다.","비가 오면 땅이 젖는다. 비가 오지 않았다. 따라서 땅이 젖지 않았다.","비가 오면 땅이 젖는다. 땅이 젖지 않았다. 따라서 비가 오지 않았다.","합격한 사람은 모두 원서를 냈다. 영희는 원서를 냈다. 따라서 영희는 합격했다."],"ans":2,"exp":"\"P이면 Q이다. Q가 아니다. 따라서 P가 아니다.\"는 대우를 이용한 타당한 추론이다. 결과가 참이라고 해서 조건이 참이라고 하거나(열이 난다, 원서를 냈다), 조건이 거짓이라고 해서 결과도 거짓이라고 하는 것(비가 오지 않았다)은 타당하지 않다. 열이나 젖은 땅에는 다른 원인이 있을 수 있기 때문이다."},
{"id":"k64","subj":"국어","unit":"논리","q":"다음 논증에 생략된 전제로 가장 적절한 것은?\n\n이 식당은 늘 손님이 많다. 그러므로 이 식당의 음식은 맛있을 것이다.","opts":["음식이 맛있는 식당은 손님이 많다.","손님이 많은 식당은 음식이 맛있다.","손님이 적은 식당은 음식값이 비싸다.","이 식당은 음식값이 싸다."],"ans":1,"exp":"\"손님이 많다\"에서 \"음식이 맛있다\"를 이끌어 내려면 \"손님이 많은 식당은 음식이 맛있다\"는 전제가 있어야 한다. \"음식이 맛있는 식당은 손님이 많다\"는 그 역이어서, 이것을 전제로 삼으면 손님이 많은 까닭이 다른 데 있을 수도 있으므로 결론이 따라 나오지 않는다."},
{"id":"k65","subj":"국어","unit":"문학","q":"향가에 대한 설명으로 옳지 않은 것은?","opts":["한자의 음과 뜻을 빌려 우리말을 적는 향찰로 기록되었다.","4구체, 8구체, 10구체의 형식이 있다.","《삼국유사》와 《균여전》에 모두 25수가 전한다.","조선 전기에 양반 사대부가 주로 지어 불렀다."],"ans":3,"exp":"향가는 신라 때부터 고려 초까지 지어진 노래로, 승려와 화랑 등이 주로 지었다. 향찰로 기록되었고 4구체, 8구체, 10구체가 있으며, 《삼국유사》에 14수, 《균여전》에 11수가 전한다."},
{"id":"k66","subj":"국어","unit":"문학","q":"평시조의 형식에 대한 설명으로 옳은 것은?","opts":["종장의 첫 음보는 3음절로 고정된다.","초장, 중장, 종장, 결장의 4장으로 이루어진다.","한 장을 세 번씩 끊어 읽는 3음보 율격이 기본이다.","중장이 다른 장보다 두 배 이상 길다."],"ans":0,"exp":"평시조는 초장, 중장, 종장의 3장 6구 45자 안팎으로 이루어지고, 한 장을 네 번씩 끊어 읽는 4음보 율격이며, 종장의 첫 음보는 3음절로 고정된다. 중장이 길어진 것은 사설시조이다."},
{"id":"k67","subj":"국어","unit":"문학","q":"작가와 작품의 연결이 옳지 않은 것은?","opts":["정철 – 「관동별곡」","윤선도 – 「어부사시사」","김만중 – 「홍길동전」","박지원 – 「양반전」"],"ans":2,"exp":"「홍길동전」은 허균이 지은 것으로 알려진 한글 소설이다. 김만중의 작품으로는 「구운몽」과 「사씨남정기」가 있다. 「관동별곡」은 정철의 가사, 「어부사시사」는 윤선도의 연시조, 「양반전」은 박지원의 한문 소설이다."},
{"id":"k68","subj":"국어","unit":"문학","q":"다음 시구에 쓰인 표현 방법으로 가장 적절한 것은?\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리우리다\n- 김소월, 「진달래꽃」에서","opts":["반어법","직유법","의인법","대구법"],"ans":0,"exp":"임이 떠나면 몹시 슬플 것이면서도 죽어도 눈물을 흘리지 않겠다고 속마음과 반대로 말하고 있으므로 반어법이다. 직유법은 \"같이, 처럼\"으로 빗대는 것, 의인법은 사람이 아닌 것을 사람처럼 나타내는 것, 대구법은 비슷한 짜임의 구절을 나란히 놓는 것으로 이 구절에는 쓰이지 않았다."},
{"id":"k69","subj":"국어","unit":"문학","q":"〈보기〉와 같은 표현 방법이 쓰인 것은?\n\n〈보기〉 찬란한 슬픔의 봄","opts":["쟁반같이 둥근 달","소리 없는 아우성","바람이 귓가에 속삭인다","내 마음은 호수요"],"ans":1,"exp":"〈보기〉는 \"찬란한\"과 \"슬픔\"처럼 서로 어울리지 않는 말을 묶어 겉으로는 모순되지만 그 속에 진실을 담는 역설법이다. \"소리 없는 아우성\"도 소리가 없는데 아우성이라고 하였으므로 역설법이다. \"쟁반같이\"는 직유법, \"바람이 속삭인다\"는 의인법, \"내 마음은 호수요\"는 은유법이다."},
{"id":"k70","subj":"국어","unit":"문학","q":"「춘향전」에 대한 설명으로 옳지 않은 것은?","opts":["판소리 사설이 소설로 정착한 판소리계 소설이다.","신분을 넘어선 사랑과 탐관오리에 대한 비판이 담겨 있다.","지은이와 지은 때가 분명하게 알려져 있지 않다.","한 가지 판본만 전하여 내용이 모두 같다."],"ans":3,"exp":"「춘향전」은 여러 사람의 입과 손을 거치며 전해져서 내용이 조금씩 다른 이본이 매우 많다. 판소리 「춘향가」가 소설로 정착한 판소리계 소설이고, 지은이는 알려져 있지 않으며, 신분을 넘어선 사랑과 탐관오리에 대한 비판을 담고 있다."},
{"id":"k71","subj":"국어","unit":"문학","q":"주요섭의 「사랑손님과 어머니」는 여섯 살 난 \"나\"(옥희)가 어머니와 사랑손님 사이의 일을 지켜보며 전하는 소설이다. 이 작품의 시점은?","opts":["1인칭 주인공 시점","1인칭 관찰자 시점","3인칭 관찰자 시점","전지적 작가 시점"],"ans":1,"exp":"작품 속 인물인 \"나\"가 주인공이 아니라 다른 인물(어머니와 사랑손님)의 이야기를 지켜보며 전하므로 1인칭 관찰자 시점이다. \"나\"가 자기 이야기를 하면 1인칭 주인공 시점이고, 작품 밖의 서술자가 겉모습만 전하면 3인칭 관찰자 시점, 인물의 속마음까지 전하면 전지적 작가 시점이다."},
{"id":"k72","subj":"국어","unit":"문학","q":"다음 시조에 대한 설명으로 옳지 않은 것은?\n\n동짓달 기나긴 밤을 한 허리를 베어 내어\n춘풍 이불 아래 서리서리 넣었다가\n어론 임 오신 날 밤이어든 굽이굽이 펴리라\n- 황진이","opts":["눈에 보이지 않는 시간을 베어 낼 수 있는 사물처럼 나타냈다.","\"서리서리\", \"굽이굽이\" 같은 말로 우리말의 느낌을 살렸다.","자연 속에서 한가롭게 지내는 삶의 즐거움을 노래했다.","임과 함께할 시간이 길기를 바라는 마음이 드러난다."],"ans":2,"exp":"이 시조는 임이 없는 긴 겨울밤을 잘라 두었다가 임이 오신 밤에 펼쳐 그 밤을 길게 하고 싶다는 그리움을 노래한 것이지, 자연 속의 한가로운 삶을 노래한 것이 아니다. 추상적인 시간(밤)을 구체적인 사물처럼 나타냈고, \"서리서리\", \"굽이굽이\" 같은 의태어로 우리말의 맛을 살렸다."},
{"id":"k73","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n병원에서 일어나는 감염의 상당수는 의료인의 손을 거쳐 퍼진다. 손에 묻은 세균은 눈에 보이지 않아서, 깨끗해 보이는 손으로 환자를 만지는 순간에도 옮겨 갈 수 있다. 그래서 감염 관리의 출발점은 비싼 장비나 새로운 약이 아니라 손 씻기이다. 환자와 접촉하기 전과 후에 비누와 물로 손을 씻거나 손 소독제를 쓰는 것만으로도 병원 감염을 크게 줄일 수 있다는 사실이 여러 연구에서 확인되었다. 가장 단순한 행동이 가장 큰 효과를 내는 셈이다.","opts":["병원 감염을 막으려면 새로운 장비에 먼저 투자해야 한다.","세균은 눈에 보이지 않으므로 병원 감염을 막을 방법이 없다.","손 씻기는 단순하지만 병원 감염을 줄이는 가장 기본적인 방법이다.","손 소독제는 비누와 물로 손을 씻는 것보다 효과가 크다."],"ans":2,"exp":"글은 감염 관리의 출발점이 손 씻기이며 단순한 행동이 큰 효과를 낸다는 점을 말한다. 장비나 약이 출발점이 아니라고 했고, 감염을 막을 방법이 없다고 하지도 않았으며, 손 소독제와 비누의 효과를 비교하지도 않았다."},
{"id":"k74","subj":"국어","unit":"주제 찾기","q":"다음 글에서 글쓴이가 말하고자 하는 바로 가장 적절한 것은?\n\n요즘은 긴 글을 끝까지 읽는 사람이 줄었다고 한다. 화면을 넘기며 필요한 정보만 골라 읽는 습관이 몸에 밴 탓이다. 이런 읽기는 빠르지만, 글쓴이의 생각을 따라가며 스스로 묻고 따지는 과정을 건너뛰게 한다. 천천히 읽을 때 우리는 문장 사이의 빈틈을 메우고, 자기 경험에 비추어 뜻을 새긴다. 정보는 훑어 읽기로도 얻을 수 있지만 생각하는 힘은 느린 읽기에서 자란다.","opts":["생각하는 힘을 기르려면 글을 천천히 깊이 읽어야 한다.","정보가 많은 시대에는 빨리 읽는 기술부터 익혀야 한다.","긴 글보다 짧은 글이 생각을 전하는 데 알맞다.","화면으로 읽는 글은 종이로 읽는 글보다 정확하지 않다."],"ans":0,"exp":"글쓴이는 훑어 읽기가 생각하는 과정을 건너뛰게 한다고 지적하고, 생각하는 힘은 느린 읽기에서 자란다고 마무리한다. 빨리 읽기를 권하지 않았고, 글의 길이나 화면과 종이의 정확성을 비교하지도 않았다."},
{"id":"k75","subj":"국어","unit":"주제 찾기","q":"다음 글의 주장으로 가장 적절한 것은?\n\n잠은 그저 쉬는 시간이 아니다. 자는 동안 뇌는 낮에 받아들인 정보를 정리하여 오래 남길 것과 버릴 것을 가른다. 몸에서는 손상된 조직을 고치고 면역 기능을 조절하는 물질이 나온다. 그래서 잠이 모자라면 기억력과 집중력이 떨어지고 감염에도 약해진다. 잠을 줄여 얻은 시간은 다음 날의 낮은 능률로 되갚아야 한다.","opts":["할 일이 많을 때는 잠을 줄여 시간을 벌어야 한다.","자는 동안에는 뇌와 몸이 모두 활동을 멈춘다.","잠이 모자라면 낮잠으로 채우면 된다.","잠은 뇌와 몸에 꼭 필요하므로 충분히 자야 한다."],"ans":3,"exp":"글은 잠자는 동안 뇌와 몸에서 중요한 일이 일어나며, 잠을 줄이면 오히려 손해라고 말한다. 잠을 줄이라는 것은 글의 주장과 반대이고, 자는 동안 뇌와 몸이 일한다고 했으며, 낮잠에 관한 내용은 없다."},
{"id":"k76","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n마을 사람 누구나 쓸 수 있는 풀밭이 있다고 하자. 각자는 소를 한 마리 더 풀어 놓으면 이익이 늘어난다. 풀이 줄어드는 손해는 모두가 나누어 지기 때문이다. 그러나 모든 사람이 똑같이 생각하여 소를 늘리면 풀밭은 금세 황폐해지고, 결국 아무도 소를 기를 수 없게 된다. 개인에게는 합리적인 선택이 모여 공동체 전체에는 손해가 되는 것이다. 그러므로 함께 쓰는 자원에는 이용을 조절하는 약속이 필요하다.","opts":["공동체의 이익을 위해 개인은 소를 기르지 말아야 한다.","함께 쓰는 자원에는 이용을 조절하는 규칙이 있어야 한다.","풀밭을 넓히면 자원 고갈 문제를 해결할 수 있다.","합리적인 개인이 모이면 공동체도 저절로 이익을 얻는다."],"ans":1,"exp":"글은 개인의 합리적인 선택이 모여 공동 자원을 망가뜨릴 수 있으므로 이용을 조절하는 약속이 필요하다고 결론짓는다. 소를 기르지 말라거나 풀밭을 넓히자는 내용은 없고, 합리적인 개인이 모이면 공동체도 저절로 이익을 얻는다는 것은 글의 내용과 반대이다."},
{"id":"k77","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n평균은 자료 전체를 숫자 하나로 요약해 주어 편리하다. 그러나 평균만 보면 속기 쉽다. 직원 아홉 명의 월급이 각각 200만 원이고 사장의 월급이 2,200만 원인 회사의 평균 월급은 400만 원이지만, 그만큼 받는 직원은 한 명도 없다. 값이 한쪽으로 크게 치우친 자료에서는 크기 순서로 늘어놓았을 때 한가운데에 오는 값인 중앙값이 실제 모습을 더 잘 보여 준다. 숫자를 읽을 때는 그 숫자가 어떻게 만들어졌는지를 함께 살펴야 한다.","opts":["평균은 계산하기 쉬우므로 어떤 자료에나 쓰는 것이 바람직하다.","월급의 차이가 큰 회사는 평균 월급을 공개하지 말아야 한다.","평균은 실제 모습을 가릴 수 있으므로 만들어진 방식을 따져야 한다.","중앙값은 어떤 자료에서나 평균보다 큰 값으로 나타난다."],"ans":2,"exp":"글은 평균이 치우친 자료의 실제 모습을 보여 주지 못할 수 있다는 예를 든 뒤, 숫자가 만들어진 방식을 살펴야 한다고 마무리한다. 평균이 어떤 자료에나 알맞다는 것은 글과 반대이고, 공개 여부나 중앙값과 평균의 크기 비교는 글에 없다(예로 든 회사에서는 중앙값이 200만 원으로 평균보다 작다)."},
{"id":"k78","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n좋은 대화는 말을 잘하는 데서가 아니라 잘 듣는 데서 시작한다. 상대가 말하는 동안 대꾸할 말을 준비하는 사람은 듣는 것처럼 보일 뿐 사실은 자기 생각에 머물러 있다. 공감하며 듣는 사람은 섣불리 판단하거나 조언하지 않고, 상대의 말을 자기 말로 다시 정리해 주며 그 마음을 헤아린다. 그럴 때 말하는 사람은 이해받았다고 느끼고 스스로 문제를 풀어 갈 힘을 얻는다.","opts":["대화에서는 상대보다 먼저 조언해 주는 것이 중요하다.","말을 잘하려면 상대가 말하는 동안 대꾸할 말을 준비해야 한다.","듣는 사람은 상대의 잘못을 정확히 판단해 주어야 한다.","판단을 미루고 마음을 헤아리며 듣는 것이 좋은 대화의 바탕이다."],"ans":3,"exp":"글은 좋은 대화가 잘 듣는 데서 시작하며, 판단이나 조언을 서두르지 않고 마음을 헤아리는 공감적 듣기가 상대에게 힘을 준다고 말한다. 먼저 조언하기, 대꾸할 말 준비하기, 판단해 주기는 모두 글에서 바람직하지 않다고 본 태도이다."},
{"id":"k79","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n훈민정음은 1443년에 세종이 만들고 1446년에 반포하였다. 자음의 기본 글자 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ은 소리를 낼 때의 발음 기관 모양을 본떠 만들었고, 나머지 자음은 여기에 획을 더하는 방식 등으로 만들었다. 모음의 기본 글자 ㆍ, ㅡ, ㅣ는 각각 하늘, 땅, 사람의 모양을 본떴다. 만든 사람과 만든 때, 만든 원리가 기록으로 분명히 전하는 문자는 세계에서도 드물다.","opts":["모음의 기본 글자는 발음 기관을 본떠 만들었다.","훈민정음은 만든 지 3년이 지난 뒤에 반포되었다.","자음의 기본 글자는 모두 다섯 자이다.","훈민정음은 만든 원리가 기록으로 전하고 있다."],"ans":0,"exp":"발음 기관의 모양을 본뜬 것은 자음의 기본 글자이고, 모음의 기본 글자는 하늘, 땅, 사람의 모양을 본떴다. 1443년에 만들어 1446년에 반포했으므로 3년 뒤이고, 자음의 기본 글자는 ㄱ, ㄴ, ㅁ, ㅅ, ㅇ 다섯 자이며, 만든 원리가 기록으로 전한다고 했다."},
{"id":"k80","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n백신은 병을 일으키는 힘을 없애거나 약하게 만든 병원체, 또는 그 일부를 몸에 넣어 면역을 미리 만들어 두는 약이다. 우리 몸은 백신 속 물질을 침입자로 알아보고 항체를 만들며, 이 경험을 기억 세포에 저장한다. 나중에 진짜 병원체가 들어오면 기억 세포가 빠르게 반응하여 병에 걸리지 않거나 가볍게 앓고 지나가게 된다. 다만 면역이 유지되는 기간은 백신마다 달라서 어떤 백신은 여러 번 맞아야 한다.","opts":["백신에는 병을 일으키는 힘을 더 강하게 만든 병원체가 들어 있다.","어떤 백신이든 한 번 맞으면 면역이 평생 유지된다.","기억 세포는 진짜 병원체가 들어왔을 때 몸이 빠르게 반응하게 한다.","백신을 맞은 몸은 항체를 만들지 않고 병원체를 기억만 한다."],"ans":2,"exp":"진짜 병원체가 들어오면 기억 세포가 빠르게 반응한다고 했다. 백신은 병원체의 힘을 없애거나 약하게 만든 것이고, 면역이 유지되는 기간은 백신마다 다르며, 몸은 항체를 만들고 그 경험을 기억 세포에 저장한다."},
{"id":"k81","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n조선 후기 서울에는 돈을 받고 책을 빌려주는 세책점이 있었다. 책값이 비싸 사서 읽기 어려웠던 사람들은 이곳에서 소설을 빌려 보았다. 세책점 주인은 한 작품을 여러 권으로 나누어 손으로 베껴 썼는데, 권수가 많을수록 빌려주는 값을 더 받을 수 있었기 때문이다. 흥미로운 대목에서 권을 끊어 다음 권을 빌리게 만들기도 했다. 주요 독자는 한글을 읽을 줄 아는 여성들이었다고 전한다.","opts":["세책점은 책을 사기 어려운 사람들이 주로 이용했다.","한 작품을 여러 권으로 나눈 것은 수입을 늘리기 위해서였다.","세책점의 주요 독자는 여성이었다.","세책점의 책은 인쇄한 것이어서 값이 쌌다."],"ans":3,"exp":"세책점의 책은 주인이 손으로 베껴 쓴 것이라고 했고, 값이 쌌다는 내용도 없다. 책값이 비싸 사서 읽기 어려운 사람들이 이용했다는 것, 권수를 늘려 값을 더 받았다는 것, 주요 독자가 여성이었다는 것은 글의 내용과 일치한다."},
{"id":"k82","subj":"국어","unit":"내용 일치","q":"다음 안내문의 내용과 일치하는 것은?\n\n○○시 보건소 독감 무료 예방 접종 안내\n- 대상: ○○시에 주민 등록을 둔 만 65세 이상 어르신, 임신부, 생후 6개월~만 13세 어린이\n- 기간: 10월 15일~11월 30일(토요일, 일요일, 공휴일 제외)\n- 시간: 오전 9시~오후 5시(낮 12시~1시에는 접수하지 않음)\n- 준비물: 신분증. 임신부는 산모 수첩도 함께 가져오고, 어린이는 보호자와 함께 방문\n- 접종 뒤 20~30분 동안 보건소에 머물며 이상 반응이 없는지 살핀 다음 귀가","opts":["토요일 오전에도 접종을 받을 수 있다.","임신부는 신분증과 산모 수첩을 함께 가져가야 한다.","○○시에 사는 만 60세 주민은 무료 접종 대상이다.","접종을 받은 뒤에는 곧바로 집에 돌아가야 한다."],"ans":1,"exp":"준비물 항목에 임신부는 신분증과 함께 산모 수첩도 가져오라고 되어 있다. 토요일은 접종 기간에서 빠지고, 어르신은 만 65세 이상이 대상이며, 접종 뒤에는 20~30분 동안 보건소에 머물러야 한다."},
{"id":"k83","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n약효 성분이 전혀 없는 가짜 약을 먹고도 증상이 나아지는 현상을 위약 효과라고 한다. 나을 것이라는 환자의 기대가 실제로 통증이나 불안을 줄이는 것이다. 이 때문에 새 약의 효과를 시험할 때는 참가자를 두 집단으로 나누어 한쪽에는 진짜 약을, 다른 쪽에는 가짜 약을 준다. 진짜 약을 먹은 집단이 가짜 약을 먹은 집단보다 뚜렷이 더 나아져야 약효를 인정받는다. 이때 누가 어떤 약을 받았는지는 참가자도, 약을 주는 연구자도 모르게 한다.","opts":["위약 효과는 환자의 기대와 관련이 있다.","새 약은 가짜 약보다 효과가 뚜렷해야 약효를 인정받는다.","약을 주는 연구자는 누가 진짜 약을 받았는지 안다.","가짜 약에는 약효 성분이 들어 있지 않다."],"ans":2,"exp":"누가 어떤 약을 받았는지는 참가자뿐 아니라 약을 주는 연구자도 모르게 한다고 했다. 위약 효과가 환자의 기대에서 비롯한다는 것, 진짜 약이 가짜 약보다 뚜렷이 나아야 한다는 것, 가짜 약에 약효 성분이 없다는 것은 글의 내용과 일치한다."},
{"id":"k84","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n온돌은 아궁이에 불을 때어 생긴 열기가 방바닥 아래의 통로를 지나며 구들장을 데우는 난방 방식이다. 데워진 구들장은 불이 꺼진 뒤에도 오랫동안 열을 내놓는다. 열기가 처음 닿는 아궁이 쪽 바닥을 아랫목, 굴뚝에 가까운 쪽을 윗목이라 하는데, 아랫목이 더 따뜻하다. 온돌은 바닥을 직접 데우기 때문에 따뜻해진 공기가 아래에서 위로 올라가며 방 전체를 덥힌다. 다만 방을 데우는 데 시간이 걸리고 온도를 세밀하게 조절하기 어렵다.","opts":["구들장은 불이 꺼진 뒤에도 한동안 열을 낸다.","굴뚝에 가까운 윗목이 아랫목보다 따뜻하다.","온돌은 방 안의 공기를 먼저 데워 바닥을 덥힌다.","온돌은 방의 온도를 세밀하게 맞추기 쉽다."],"ans":0,"exp":"데워진 구들장은 불이 꺼진 뒤에도 오랫동안 열을 내놓는다고 했다. 더 따뜻한 쪽은 아궁이에 가까운 아랫목이고, 온돌은 바닥을 먼저 데워 그 열로 공기를 덥히며, 온도를 세밀하게 조절하기 어렵다고 했다."},
{"id":"k85","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n항생제는 세균을 죽이거나 자라지 못하게 하는 약이다. 감기나 독감 같은 바이러스 질환에는 효과가 없다. 항생제를 쓰면 대부분의 세균은 죽지만, 우연히 그 약에 견디는 성질을 지닌 세균은 살아남아 수를 늘린다. 항생제를 필요 이상으로 자주 쓰거나 처방받은 기간을 채우지 않고 중간에 끊으면 이런 내성균이 늘어날 기회가 커진다. 내성균이 퍼지면 전에는 쉽게 낫던 감염도 치료하기 어려워진다.","opts":["항생제를 쓴 뒤에도 일부 세균은 살아남을 수 있다.","처방받은 항생제를 중간에 끊으면 내성균이 늘어날 수 있다.","내성균이 퍼지면 감염을 치료하기가 어려워진다.","항생제는 바이러스가 일으키는 감기에도 효과가 있다."],"ans":3,"exp":"항생제는 세균에 작용하는 약이며 감기나 독감 같은 바이러스 질환에는 효과가 없다고 했다. 약에 견디는 세균이 살아남는다는 것, 복용을 중간에 끊으면 내성균이 늘 기회가 커진다는 것, 내성균이 퍼지면 치료가 어려워진다는 것은 글의 내용과 일치한다."},
{"id":"k86","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그러나 냉장고가 널리 쓰이면서 이런 저장법은 맛을 내는 방법으로 성격이 바뀌었다.\n(나) 냉장 기술이 없던 시절, 음식을 오래 두고 먹는 일은 살아남기 위한 과제였다.\n(다) 오늘날 우리가 김치나 젓갈을 먹는 까닭은 음식이 상할까 봐서가 아니라 그 맛을 즐기기 때문이다.\n(라) 사람들은 소금에 절이거나 말리거나 발효시키는 방법으로 이 과제를 풀었다.","opts":["(나) – (가) – (라) – (다)","(다) – (나) – (라) – (가)","(나) – (라) – (가) – (다)","(라) – (나) – (다) – (가)"],"ans":2,"exp":"과제를 내놓은 (나)가 맨 앞에 오고, \"이 과제\"를 푼 방법을 말하는 (라)가 이어진다. \"이런 저장법\"의 성격이 바뀌었다는 (가)는 (라) 뒤에 와야 하고, 그 변화를 오늘날의 예로 보여 주는 (다)가 마지막에 온다."},
{"id":"k87","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 이 때문에 열이 난다고 무조건 해열제부터 쓰는 것이 늘 좋은 것만은 아니다.\n(나) 체온이 오르면 병원체는 늘어나는 속도가 느려지고 면역 세포는 더 활발하게 움직인다.\n(다) 감염되었을 때 열이 나는 것은 몸이 고장 났다는 뜻이 아니라 몸이 싸우고 있다는 신호이다.\n(라) 다만 열이 너무 높거나 오래가면 몸에 부담이 되므로 그때는 열을 내려야 한다.","opts":["(다) – (나) – (가) – (라)","(나) – (다) – (라) – (가)","(다) – (라) – (가) – (나)","(가) – (다) – (나) – (라)"],"ans":0,"exp":"열이 몸이 싸우는 신호라는 (다)가 화제를 열고, 그 까닭을 설명하는 (나)가 이어진다. \"이 때문에\" 해열제를 무조건 쓸 일은 아니라는 (가)가 그 뒤에 오고, \"다만\"으로 예외를 덧붙이는 (라)가 마지막에 온다."},
{"id":"k88","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 예컨대 \"어리다\"는 본래 \"어리석다\"는 뜻이었으나 지금은 \"나이가 적다\"는 뜻으로 쓰인다.\n(나) 말의 뜻은 굳어 있지 않고 시간이 흐르면서 달라진다.\n(다) 이처럼 낱말의 뜻이 변하는 것은 언어가 그것을 쓰는 사회와 함께 살아 움직이기 때문이다.\n(라) 또 \"놈\"은 본래 평범한 사람을 두루 가리켰으나 지금은 남자를 낮잡아 이르는 말이 되었다.","opts":["(가) – (라) – (나) – (다)","(나) – (다) – (가) – (라)","(다) – (나) – (가) – (라)","(나) – (가) – (라) – (다)"],"ans":3,"exp":"말의 뜻이 달라진다는 일반적인 진술 (나)가 먼저 오고, \"예컨대\"로 시작하는 첫 번째 예 (가)와 \"또\"로 시작하는 두 번째 예 (라)가 이어진다. \"이처럼\"으로 두 예를 묶어 까닭을 밝히는 (다)가 마지막에 온다."},
{"id":"k89","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그 결과 도시 한가운데의 기온이 주변 지역보다 높아지는 열섬 현상이 나타난다.\n(나) 도시에는 아스팔트와 콘크리트로 덮인 땅이 많다.\n(다) 이 현상을 줄이려면 옥상과 길가에 나무를 심어 그늘과 수분을 늘려야 한다.\n(라) 이런 재료는 낮 동안 햇볕의 열을 많이 빨아들였다가 밤에 천천히 내보낸다.","opts":["(나) – (가) – (라) – (다)","(나) – (라) – (가) – (다)","(라) – (나) – (다) – (가)","(가) – (다) – (나) – (라)"],"ans":1,"exp":"도시의 땅을 덮은 재료를 소개하는 (나)가 먼저 오고, \"이런 재료\"의 성질을 말하는 (라)가 이어진다. \"그 결과\" 열섬 현상이 나타난다는 (가)가 그 뒤에 오고, \"이 현상\"을 줄이는 방법인 (다)가 마지막에 온다."},
{"id":"k90","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그래서 기자는 사실을 고르고 늘어놓는 단계에서부터 자신의 관점을 돌아보아야 한다.\n(나) 흔히 뉴스는 일어난 일을 있는 그대로 전한다고 생각한다.\n(다) 또 고른 사건 가운데 무엇을 머리기사로 올리느냐에 따라 같은 일도 전혀 다르게 보인다.\n(라) 하지만 수많은 사건 가운데 무엇을 보도할지 고르는 순간 이미 판단이 끼어든다.","opts":["(나) – (다) – (라) – (가)","(라) – (나) – (가) – (다)","(나) – (라) – (다) – (가)","(나) – (가) – (라) – (다)"],"ans":2,"exp":"일반적인 통념을 내놓은 (나)가 먼저 오고, \"하지만\"으로 이를 뒤집는 (라)가 이어진다. \"또 고른 사건 가운데\"로 시작하는 (다)는 사건을 고르는 일을 말한 (라) 뒤에 와야 하며, \"그래서\"로 결론을 내리는 (가)가 마지막에 온다."},
{"id":"k91","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n사람은 자기 생각과 맞는 정보는 쉽게 받아들이고, 맞지 않는 정보는 무시하거나 깎아내리는 경향이 있다. 이를 확증 편향이라고 한다. 인터넷의 추천 기능은 이용자가 좋아할 만한 글을 골라 보여 주므로 이 경향을 더 키운다. 그 결과 우리는 많은 정보를 접하면서도 ______. 그러므로 일부러 나와 다른 의견을 찾아 읽으려는 노력이 필요하다.","opts":["생각이 한쪽으로 치우치기 쉽다","여러 관점을 고루 갖추게 된다","정보가 모자란다고 느끼게 된다","자기 생각을 쉽게 바꾸게 된다"],"ans":0,"exp":"확증 편향과 추천 기능 때문에 자기 생각에 맞는 정보만 접하게 된다는 흐름이므로, 정보가 많아도 생각은 한쪽으로 치우친다는 내용이 들어가야 한다. 뒤 문장에서 다른 의견을 일부러 찾아 읽으라고 한 것과도 이어진다. 나머지는 앞 내용과 반대이거나 관계가 없다."},
{"id":"k92","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 접속어로 가장 적절한 것은?\n\n우리나라의 기대 수명은 빠르게 늘어 세계에서도 높은 편에 든다. ______ 아프지 않고 건강하게 사는 기간인 건강 수명은 그만큼 늘지 않았다. 기대 수명과 건강 수명의 차이는 병을 앓으며 보내는 기간을 뜻한다. 따라서 이제는 얼마나 오래 사느냐보다 얼마나 건강하게 사느냐가 더 중요한 과제가 되었다.","opts":["그래서","예컨대","왜냐하면","그러나"],"ans":3,"exp":"앞 문장은 기대 수명이 빠르게 늘었다는 내용이고 뒤 문장은 건강 수명은 그만큼 늘지 않았다는 내용이어서 서로 맞서므로 \"그러나\"가 알맞다. \"그래서\"는 원인과 결과, \"예컨대\"는 예시, \"왜냐하면\"은 이유를 이을 때 쓴다."},
{"id":"k93","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n경제학에서는 어떤 것을 선택하느라 포기한 것들 가운데 가장 가치가 큰 것을 기회비용이라고 한다. 주말에 영화를 보기로 했다면 그 시간에 아르바이트를 해서 벌 수 있었던 돈이 기회비용이 될 수 있다. 이 개념은 ______는 점을 일깨운다. 돈을 내지 않았더라도 시간과 기회를 썼다면 이미 값을 치른 것이다.","opts":["비용은 실제로 낸 돈만으로 계산해야 한다","공짜처럼 보이는 선택에도 대가가 따른다","선택의 가치는 누구에게나 똑같다","포기한 것이 많을수록 이익이 커진다"],"ans":1,"exp":"뒤 문장에서 돈을 내지 않았더라도 시간과 기회를 썼다면 값을 치른 것이라고 했으므로, 공짜처럼 보이는 선택에도 대가가 있다는 내용이 들어가야 한다. 실제로 낸 돈만 비용으로 보는 것은 기회비용의 개념과 반대이고, 나머지는 글에서 다루지 않은 내용이다."},
{"id":"k94","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n우리말에서 색을 나타내는 말은 매우 섬세하게 나뉜다. \"노랗다\" 하나만 해도 \"노르스름하다, 누렇다, 샛노랗다, 노릇노릇하다\"처럼 밝기와 짙기, 느낌에 따라 여러 낱말이 있다. 이런 낱말들은 다른 언어의 낱말 하나로 옮기기 어렵다. 번역이 어려운 까닭은 번역하는 사람의 솜씨가 모자라서가 아니라 ______ 때문이다.","opts":["색은 본래 말로 나타낼 수 없는 것이기","우리말에는 색을 나타내는 말이 적기","언어마다 세계를 나누어 이름 붙이는 방식이 다르기","다른 언어에는 색을 나타내는 말이 전혀 없기"],"ans":2,"exp":"우리말이 노란색을 여러 낱말로 잘게 나누어 부르는데 다른 언어에는 그에 딱 맞는 낱말이 없다는 내용이므로, 언어마다 대상을 나누어 이름 붙이는 방식이 다르다는 말이 들어가야 한다. 우리말에 색채어가 적다는 것은 글과 반대이고, 색을 말로 나타낼 수 없다거나 다른 언어에 색채어가 전혀 없다는 것은 지나친 말이다."},
{"id":"k95","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n습관은 굳은 의지보다 환경에서 만들어진다. 운동을 하겠다고 단단히 마음먹는 것보다 운동화를 현관에 꺼내 두는 편이 효과가 크다. 과자를 덜 먹고 싶다면 참으려고 애쓰기보다 과자를 눈에 띄지 않는 곳에 두면 된다. 요컨대 행동을 바꾸려면 ______.","opts":["그 행동을 둘러싼 환경부터 바꾸어야 한다","날마다 결심을 새롭게 다지는 일부터 해야 한다","실패한 까닭을 자신의 성격에서 찾아야 한다","여러 가지 습관을 한꺼번에 바꾸어야 한다"],"ans":0,"exp":"운동화를 꺼내 두는 것과 과자를 치워 두는 것은 모두 환경을 바꾼 예이므로, 행동을 둘러싼 환경부터 바꾸어야 한다는 말이 들어가야 한다. 결심을 다지는 것은 글에서 효과가 작다고 본 방법이고, 성격이나 여러 습관을 한꺼번에 바꾸는 일은 글에 없다."},
{"id":"k96","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n한 연구에서 병원 복도의 손 소독제 위에 사람의 눈 사진을 붙여 두었더니 손 소독제를 쓰는 사람이 늘었다. 꽃 사진을 붙였을 때는 변화가 없었다. 연구자들은 누군가 지켜본다는 느낌이 사람들로 하여금 규범에 맞게 행동하게 만든다고 설명했다. 실제로 지켜보는 사람이 없어도 그런 느낌만으로 행동이 달라진 것이다.","opts":["사진의 종류와 상관없이 사진을 붙이면 손 소독제 사용이 늘어난다.","손 소독제 사용을 늘리려면 실제로 지켜보는 사람이 꼭 있어야 한다.","꽃 사진은 사람들의 손 소독제 사용을 줄인다.","사람은 남의 눈길을 느낄 때 규범을 더 잘 지키는 경향이 있다."],"ans":3,"exp":"눈 사진만으로도 손 소독제 사용이 늘었다는 결과와 연구자들의 설명에서, 사람은 남의 눈길을 느끼면 규범을 더 잘 지킨다고 추론할 수 있다. 꽃 사진을 붙였을 때는 변화가 없었으므로 사진의 종류가 중요하고 꽃 사진이 사용을 줄인 것도 아니며, 실제로 지켜보는 사람이 없어도 행동이 달라졌다."},
{"id":"k97","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n\"엄마가\", \"아빠가\"라는 말을 익힌 아이는 한동안 \"선생님이가\", \"곰이가\"처럼 말하기도 한다. 어른에게서는 들어 본 적이 없는 말이다. 이는 아이가 들은 말을 그대로 흉내 내기만 하는 것이 아니라, 들은 말에서 나름대로 규칙을 찾아내어 새로운 말에 적용하고 있음을 보여 준다. 틀린 말이 오히려 배움이 진행되고 있다는 증거인 셈이다.","opts":["아이가 말을 배우는 과정은 흉내 내기만으로는 설명되지 않는다.","아이는 어른에게서 들은 말만 따라 한다.","틀린 말을 자주 하는 아이는 말을 배우는 속도가 느리다.","아이의 틀린 말은 어른이 곧바로 고쳐 주어야 없어진다."],"ans":0,"exp":"아이가 어른에게서 들어 본 적 없는 말을 스스로 만들어 낸다는 사실에서, 말 배우기가 단순한 흉내가 아니라는 점을 추론할 수 있다. 틀린 말은 배움이 진행된다는 증거라고 했으므로 느리다고 볼 수 없고, 어른이 고쳐 주어야 한다는 내용은 글에 없다."},
{"id":"k98","subj":"국어","unit":"추론","q":"밑줄 친 부분의 사례로 가장 적절한 것은?\n\n이미 써 버려서 되찾을 수 없는 비용을 매몰 비용이라고 한다. 합리적으로 판단하려면 앞으로 생길 이익과 손해만 따져야 한다. 그런데 사람들은 흔히 그동안 들인 돈과 시간이 아까워서 손해가 뻔한 일을 계속한다. 이를 __매몰 비용의 오류__라고 한다.","opts":["값이 오를 것 같아서 필요한 물건을 미리 사 두었다.","적성에 맞지 않아서 1년 동안 다닌 학원을 그만두었다.","영화가 재미없었지만 표를 산 돈이 아까워서 끝까지 보았다.","할인 기간을 기다렸다가 필요한 물건을 샀다."],"ans":2,"exp":"이미 표를 사는 데 쓴 돈은 되찾을 수 없는데도 그것이 아까워서 재미없는 영화를 계속 보는 것이 매몰 비용의 오류이다. 학원을 그만둔 것은 이미 들인 시간과 돈에 얽매이지 않은 판단이고, 미리 사 두거나 할인 기간을 기다리는 것은 앞으로의 이익을 따진 행동이다."},
{"id":"k99","subj":"국어","unit":"추론","q":"다음 글의 관점에서 볼 때 문제가 있는 추론은?\n\n아이스크림이 많이 팔리는 달에는 물놀이 사고도 늘어난다. 그렇다고 아이스크림이 사고를 일으킨다고 말할 수는 없다. 둘 다 더운 날씨라는 공통 원인 때문에 함께 늘어난 것이다. 이처럼 두 현상이 함께 변한다는 사실만으로는 한쪽이 다른 쪽의 원인이라고 단정할 수 없다. 인과 관계를 말하려면 제3의 요인이 없는지, 원인과 결과의 순서가 뒤바뀌지 않았는지를 따져 보아야 한다.","opts":["키가 큰 아이가 몸무게도 많이 나가지만, 키가 몸무게의 원인이라고 단정하기는 어렵다.","아침밥을 먹는 학생의 성적이 높게 나타났으므로, 아침밥을 먹으면 성적이 오른다.","소방차가 많이 출동한 화재일수록 피해가 컸는데, 이는 불의 크기라는 공통 원인 때문일 수 있다.","우산이 많이 팔린 날에 교통사고가 많았지만, 둘 다 비 때문일 수 있다."],"ans":1,"exp":"아침밥과 성적이 함께 나타난다는 사실만으로 아침밥이 성적을 올린다고 단정한 것이므로 글이 경계하는 추론이다. 가정 환경이나 생활 습관 같은 제3의 요인이 둘 모두에 영향을 주었을 수 있다. 나머지는 함께 변한다는 사실만으로 인과를 단정하지 않거나 공통 원인을 따지고 있다."},
{"id":"k100","subj":"국어","unit":"추론","q":"다음 글의 서술 방식으로 적절하지 않은 것은?\n\n단백질은 아미노산이 길게 이어져 만들어진 물질이다. 우리 몸은 스무 가지 아미노산을 쓰는데, 이 가운데 몸에서 만들지 못해 반드시 음식으로 얻어야 하는 것을 필수 아미노산이라 한다. 고기, 달걀, 우유 같은 동물성 식품에는 필수 아미노산이 고루 들어 있다. 반면 곡류나 콩류 같은 식물성 식품은 대개 한두 가지가 모자란다. 그래서 쌀밥에 콩을 섞어 먹듯 서로 모자란 것을 채워 주는 식품을 함께 먹는 것이 좋다.","opts":["용어의 뜻을 풀이하고 있다.","구체적인 예를 들고 있다.","두 대상의 차이를 견주고 있다.","전문가의 말을 인용하고 있다."],"ans":3,"exp":"글에는 전문가의 말을 따온 부분이 없다. 단백질과 필수 아미노산의 뜻을 풀이했고(정의), 고기, 달걀, 우유와 쌀밥에 콩을 섞어 먹는 예를 들었으며(예시), 동물성 식품과 식물성 식품의 차이를 \"반면\"으로 견주었다(대조)."},
{"id":"k101","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["__웬지__ 오늘은 기분이 좋다.","젖은 옷이 햇볕에 __금세__ 말랐다.","정말 __어의없는__ 일을 당했다.","참 __희안한__ 일도 다 있다."],"ans":1,"exp":"\"금세\"는 \"금시에\"가 줄어든 말이므로 \"금새\"로 적지 않는다. 나머지는 \"왠지\"(왜인지), \"어이없는\", \"희한한\"으로 적어야 한다."},
{"id":"k102","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳은 것은?","opts":["내일 비가 __올런지__ 모르겠다.","지금 집에 __갈려고__ 한다.","그는 아마 거기에 __있을껄__.","그 일은 내가 먼저 __할게__."],"ans":3,"exp":"어미 \"-ㄹ게\", \"-ㄹ걸\"은 된소리로 나더라도 예사소리로 적으므로 \"할게\"가 옳고 \"있을껄\"은 \"있을걸\"로 적는다. \"올런지\"는 \"올는지\", \"갈려고\"는 \"가려고\"가 옳다."},
{"id":"k103","subj":"국어","unit":"맞춤법","q":"한자어의 표기가 옳지 않은 것은?","opts":["실락원","공염불","고랭지","남존여비"],"ans":0,"exp":"\"실낙원\"은 \"실(失)\"과 \"낙원(樂園)\"이 합쳐진 말이어서 뒷말에 두음 법칙을 적용해 적는다. \"공염불\", \"남존여비\"도 같은 까닭으로 \"염불\", \"여비\"로 적는다. \"고랭지\"는 \"고랭\"에 \"지\"가 붙은 말이어서 \"랭\"을 그대로 적는다."},
{"id":"k104","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 표기가 옳지 않은 것은?","opts":["가을 하늘이 __파래서__ 눈이 부시다.","겁에 질려 얼굴이 __하얘졌다__.","할아버지의 머리카락이 __허얘졌다__.","가을 들판이 온통 __누레졌다__."],"ans":2,"exp":"\"허옇다\"에 \"-어지다\"가 붙으면 \"허예지다\"가 되므로 \"허예졌다\"로 적어야 한다. 어간 끝음절의 모음이 \"ㅏ, ㅑ\"인 \"파랗다\", \"하얗다\"는 \"파래\", \"하얘\"가 되고, \"ㅓ, ㅕ\"인 \"허옇다\", \"누렇다\"는 \"허예\", \"누레\"가 된다."},
{"id":"k105","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 쓰임이 옳은 것은?","opts":["나이가 __지긋이__ 든 어른이 들어왔다.","한약을 정성껏 __다려__ 먹었다.","마음을 __조리며__ 결과를 기다렸다.","저 산 __넘어__에 작은 마을이 있다."],"ans":0,"exp":"\"나이가 비교적 많아 듬직하게\"라는 뜻으로는 \"지긋이\"를 쓴다. 약재에 물을 부어 끓이는 것은 \"달여\", 속을 태우며 초조해하는 것은 \"졸이며\"이고, 산의 저쪽 공간을 가리키는 명사는 \"너머\"이다."},
{"id":"k106","subj":"국어","unit":"맞춤법","q":"밑줄 친 말의 쓰임이 옳은 것은?","opts":["얼굴에 미소를 __띄고__ 있다.","네가 꼭 합격하기를 __바래__.","배추를 소금에 __저렸다__.","지금은 바쁘니 __이따가__ 이야기하자."],"ans":3,"exp":"\"조금 지난 뒤에\"라는 뜻의 부사는 \"이따가\"이다. 미소는 \"띠고\"(띠다), 소망은 \"바라\"(바라다), 배추는 \"절였다\"(절이다)로 써야 한다. \"저리다\"는 팔다리가 눌려 감각이 둔해진다는 뜻이다."},
{"id":"k107","subj":"국어","unit":"맞춤법","q":"밑줄 친 명사형의 표기가 옳지 않은 것은?","opts":["어려운 이웃에게 사랑을 __베풂__.","시장에서 채소를 __팜__.","연이 하늘 높이 __낢__.","혼자서 저녁을 __먹음__."],"ans":1,"exp":"어간이 \"ㄹ\"로 끝나는 용언의 명사형은 \"ㄹ\"을 그대로 두고 \"-ㅁ\"을 붙여 \"ㄻ\"으로 적는다. 그래서 \"팔다\"는 \"팖\", \"베풀다\"는 \"베풂\", \"날다\"는 \"낢\"이 된다. \"먹다\"처럼 받침이 있는 어간에는 \"-음\"이 붙는다."},
{"id":"k108","subj":"국어","unit":"맞춤법","q":"표기가 옳지 않은 것은?","opts":["차돌박이","두 살배기","붙박이","곱배기"],"ans":3,"exp":"음식의 두 몫을 한 그릇에 담은 분량은 \"곱빼기\"로 적는다. \"차돌박이\", \"붙박이\"는 무엇이 박혀 있다는 뜻이 살아 있어 \"-박이\"로 적고, 그 나이를 먹은 아이를 뜻할 때는 \"-배기\"를 붙여 \"두 살배기\"로 적는다."},
{"id":"k109","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳은 것은?","opts":["십 년만에 고향에 돌아왔다.","옷을 입은채로 잠이 들었다.","서울과 부산 간 열차가 늘었다.","그는 떠날듯 말듯 망설였다."],"ans":2,"exp":"\"한 대상에서 다른 대상까지의 사이\"를 뜻하는 \"간\"은 의존 명사이므로 \"부산 간\"으로 띄어 쓴다. 시간이 얼마 지났음을 나타내는 \"만\"과 \"채\", \"듯\"도 의존 명사여서 \"십 년 만에\", \"입은 채로\", \"떠날 듯 말 듯\"으로 띄어 써야 한다."},
{"id":"k110","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳지 않은 것은? (붙여 씀이 허용되는 것은 옳은 것으로 본다.)","opts":["촛불이 꺼져 간다.","비가 올듯도하다.","그 일은 혼자서도 할만하다.","그는 늘 잘 아는 척한다."],"ans":1,"exp":"보조 용언은 띄어 씀이 원칙이고 붙여 씀도 허용되므로 \"할 만하다\"와 \"할만하다\"가 모두 가능하다. 그러나 \"듯하다\"처럼 의존 명사에 \"하다\"가 붙은 보조 용언 가운데에 조사가 들어가면 반드시 띄어 써야 하므로 \"올 듯도 하다\"가 옳다."},
{"id":"k111","subj":"국어","unit":"띄어쓰기","q":"띄어쓰기가 옳지 않은 것은?","opts":["이번이 제 3차 회의이다.","김영수 씨가 먼저 도착했다.","시장에서 사과, 배 등을 샀다.","그는 국장 겸 과장이다."],"ans":0,"exp":"차례를 나타내는 \"제-\"는 접두사이므로 뒷말에 붙여 \"제3 차\"로 쓰며, \"제3차\"로 붙여 쓰는 것도 허용된다. \"제 3차\"처럼 \"제\"를 띄어 쓸 수는 없다. 호칭어 \"씨\", 열거하는 \"등\", 두 말을 이어 주는 \"겸\"은 앞말과 띄어 쓴다."},
{"id":"k112","subj":"국어","unit":"표준어","q":"표준어인 것은?","opts":["아지랭이","강남콩","미류나무","사글세"],"ans":3,"exp":"\"사글세\"는 어원인 \"삭월세\"에서 멀어진 형태가 널리 쓰여 표준어가 되었다. 나머지는 \"아지랑이\", \"강낭콩\", \"미루나무\"가 표준어이다."},
{"id":"k113","subj":"국어","unit":"표준어","q":"밑줄 친 말이 표준어가 아닌 것은?","opts":["아이가 __맨날__ 늦게 일어난다.","점심에 __짜장면__을 먹었다.","어깨를 __으시대며__ 걸어갔다.","글씨를 __개발새발__ 써 놓았다."],"ans":2,"exp":"어울리지 않게 우쭐거리며 뽐낸다는 뜻의 표준어는 \"으스대다\"이다. \"맨날\", \"짜장면\", \"개발새발\"은 2011년에 \"만날\", \"자장면\", \"괴발개발\"과 함께 표준어로 인정되었다."},
{"id":"k114","subj":"국어","unit":"표준어","q":"두 말 가운데 하나만 표준어인 것은?","opts":["노을 – 놀","무 – 무우","외우다 – 외다","서두르다 – 서둘다"],"ans":1,"exp":"준말이 널리 쓰이고 본말이 잘 쓰이지 않으면 준말만 표준어로 삼는다. 그래서 \"무\"만 표준어이고 \"무우\"는 표준어가 아니다. \"노을/놀\", \"외우다/외다\", \"서두르다/서둘다\"는 본말과 준말이 모두 표준어이다."},
{"id":"k115","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["쌓이다[싸히다]","놓고[노코]","닿소[다쏘]","않네[안네]"],"ans":0,"exp":"받침 \"ㅎ\" 뒤에 모음으로 시작하는 어미나 접미사가 오면 \"ㅎ\"을 발음하지 않으므로 \"쌓이다\"는 [싸이다]이다. \"ㅎ\" 뒤에 \"ㄱ\"이 오면 합쳐서 [ㅋ]으로, \"ㅅ\"이 오면 [ㅆ]으로 발음하고, \"ㄶ\" 뒤에 \"ㄴ\"이 오면 \"ㅎ\"을 발음하지 않는다."},
{"id":"k116","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["겉옷[거돋]","헛웃음[허두슴]","꽃 위[꼬뒤]","맛없다[마섭따]"],"ans":3,"exp":"받침 뒤에 \"ㅏ, ㅓ, ㅗ, ㅜ, ㅟ\"로 시작하는 실질 형태소가 오면 받침을 대표음으로 바꾼 뒤에 뒤 음절의 첫소리로 옮겨 발음한다. 따라서 \"맛없다\"는 [마덥따]이다. \"겉옷\", \"헛웃음\", \"꽃 위\"도 같은 방식으로 [거돋], [허두슴], [꼬뒤]가 된다."},
{"id":"k117","subj":"국어","unit":"표준 발음","q":"표준 발음으로 옳지 않은 것은?","opts":["색연필[생년필]","서울역[서울력]","송별연[송별련]","한여름[한녀름]"],"ans":2,"exp":"\"송별연\"은 \"ㄴ\" 소리를 덧붙이지 않고 받침을 그대로 이어 [송벼련]으로 발음한다. \"색연필\", \"한여름\"은 \"ㄴ\"을 덧붙여 [생년필], [한녀름]으로 발음하고, \"서울역\"은 \"ㄹ\" 받침 뒤에서 덧붙은 \"ㄴ\"이 [ㄹ]로 바뀌어 [서울력]이 된다."},
{"id":"k118","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 옳은 것은?","opts":["컨텐츠","워크숍","타겟","화이팅"],"ans":1,"exp":"\"workshop\"은 \"워크숍\"으로 적는다. 나머지는 \"콘텐츠\", \"타깃\", \"파이팅\"이 옳은 표기이다. 영어의 [f]는 \"ㅍ\"으로 적으므로 \"화이팅\"으로 적지 않는다."},
{"id":"k119","subj":"국어","unit":"외래어 표기","q":"외래어 표기가 모두 옳은 것은?","opts":["플래카드, 심포지엄","렌트카, 스태프","넌센스, 팸플릿","케찹, 도넛"],"ans":0,"exp":"\"플래카드\"와 \"심포지엄\"은 모두 옳은 표기이다. \"렌트카\"는 \"렌터카\", \"넌센스\"는 \"난센스\", \"케찹\"은 \"케첩\"으로 적어야 한다. \"스태프\", \"팸플릿\", \"도넛\"은 옳은 표기이다."},
{"id":"k120","subj":"국어","unit":"로마자 표기","q":"국어의 로마자 표기가 옳은 것은?","opts":["백마 Baekma","알약 alyak","낙동강 Nakddonggang","왕십리 Wangsimni"],"ans":3,"exp":"로마자 표기는 표준 발음에 따라 적으므로 \"왕십리[왕심니]\"는 Wangsimni이다. \"백마[뱅마]\"는 Baengma, \"알약[알략]\"은 allyak으로 적는다. 된소리되기는 표기에 반영하지 않으므로 \"낙동강\"은 Nakdonggang이다."},
{"id":"k121","subj":"국어","unit":"음운","q":"두 음운이 합쳐져 하나의 음운으로 줄어드는 \"축약\"이 일어나는 것은?","opts":["닭[닥]","맨입[맨닙]","국화[구콰]","굳이[구지]"],"ans":2,"exp":"\"국화\"는 \"ㄱ\"과 \"ㅎ\"이 합쳐져 \"ㅋ\"이 되는 거센소리되기가 일어나므로 축약이다. \"닭[닥]\"은 겹받침 가운데 하나가 없어지는 탈락, \"맨입[맨닙]\"은 \"ㄴ\"이 덧붙는 첨가, \"굳이[구지]\"는 \"ㄷ\"이 \"ㅈ\"으로 바뀌는 교체이다."},
{"id":"k122","subj":"국어","unit":"음운","q":"음운 변동이 일어난 뒤에도 음운의 개수가 달라지지 않는 것은?","opts":["값[갑]","신라[실라]","좋은[조은]","한여름[한녀름]"],"ans":1,"exp":"\"신라[실라]\"는 \"ㄴ\"이 \"ㄹ\"로 바뀌는 교체(유음화)이므로 음운의 개수가 그대로이다. \"값[갑]\"과 \"좋은[조은]\"은 \"ㅅ\", \"ㅎ\"이 탈락하여 하나가 줄고, \"한여름[한녀름]\"은 \"ㄴ\"이 첨가되어 하나가 는다."},
{"id":"k123","subj":"국어","unit":"음운","q":"국어의 단모음 가운데 전설 모음이면서 원순 모음인 것은?","opts":["ㅟ","ㅣ","ㅜ","ㅡ"],"ans":0,"exp":"\"ㅟ\"는 혀의 앞쪽에서 입술을 둥글게 하여 내는 전설 원순 모음이다. \"ㅣ\"는 전설 평순 모음, \"ㅜ\"는 후설 원순 모음, \"ㅡ\"는 후설 평순 모음이다."},
{"id":"k124","subj":"국어","unit":"품사","q":"밑줄 친 단어가 형용사인 것은?","opts":["사람은 누구나 __늙는다__.","비를 맞고 나무가 잘 __큰다__.","벌써 날이 __밝는다__.","그는 나이보다 마음이 __젊다__."],"ans":3,"exp":"\"젊다\"는 상태를 나타내는 형용사여서 \"젊는다\"처럼 현재를 나타내는 \"-는-/-ㄴ-\"을 붙일 수 없다. \"늙는다\", \"큰다\", \"밝는다\"는 \"-는-/-ㄴ-\"이 붙어 변화를 나타내므로 동사이다. \"크다\"와 \"밝다\"는 형용사로도 쓰이지만 여기서는 \"자라다\", \"환해지다\"의 뜻인 동사이다."},
{"id":"k125","subj":"국어","unit":"품사","q":"밑줄 친 말의 품사가 나머지 셋과 다른 것은?","opts":["아는 __대로__ 말했다.","먹을 __만큼__ 덜어라.","법__대로__ 처리했다.","그는 웃을 __뿐__ 말이 없었다."],"ans":2,"exp":"\"법대로\"의 \"대로\"는 체언 뒤에 붙은 조사이다. \"아는 대로\", \"먹을 만큼\", \"웃을 뿐\"의 \"대로, 만큼, 뿐\"은 용언의 관형사형 뒤에 놓여 꾸밈을 받는 의존 명사이다. 같은 형태라도 체언 뒤에서는 조사, 관형어 뒤에서는 의존 명사이다."},
{"id":"k126","subj":"국어","unit":"단어 형성","q":"접사가 붙으면서 어근의 품사가 바뀐 파생어는?","opts":["먹이","덧신","날고기","햇과일"],"ans":0,"exp":"\"먹이\"는 동사의 어근 \"먹-\"에 접미사 \"-이\"가 붙어 명사가 된 말이다. \"덧신\", \"날고기\", \"햇과일\"은 명사 앞에 접두사 \"덧-\", \"날-\", \"햇-\"이 붙어 뜻만 더해졌을 뿐 품사는 그대로 명사이다."},
{"id":"k127","subj":"국어","unit":"단어 형성","q":"합성어끼리 묶은 것은?","opts":["지우개, 손수건","손발, 밤나무","맏아들, 눈물","달리기, 책가방"],"ans":1,"exp":"\"손발\"(손+발)과 \"밤나무\"(밤+나무)는 어근과 어근이 만난 합성어이다. \"지우개\"(지우-+-개), \"맏아들\"(맏-+아들), \"달리기\"(달리-+-기)는 접사가 붙은 파생어이다. \"손수건\", \"눈물\", \"책가방\"은 합성어이다."},
{"id":"k128","subj":"국어","unit":"형태소","q":"\"아이가 책을 읽는다.\"를 단어와 형태소로 나눌 때 그 개수가 옳은 것은?","opts":["단어 4개, 형태소 6개","단어 5개, 형태소 6개","단어 6개, 형태소 7개","단어 5개, 형태소 7개"],"ans":3,"exp":"조사도 단어로 보므로 단어는 \"아이, 가, 책, 을, 읽는다\"의 5개이다. 형태소는 \"읽는다\"를 \"읽-, -는-, -다\"로 더 나눌 수 있으므로 \"아이, 가, 책, 을, 읽-, -는-, -다\"의 7개이다."},
{"id":"k129","subj":"국어","unit":"용언의 활용","q":"밑줄 친 용언의 활용형이 옳지 않은 것은?","opts":["목적지에 __이르러__ 짐을 풀었다.","라면이 __불기__ 전에 어서 먹어라.","밀린 값을 모두 __치렀다__.","장마로 강물이 __불어__ 길이 잠겼다."],"ans":1,"exp":"\"붇다\"는 모음으로 시작하는 어미 앞에서만 \"ㄷ\"이 \"ㄹ\"로 바뀌는 \"ㄷ\" 불규칙 용언이다. 그래서 \"불어\", \"불으니\"가 되지만 자음으로 시작하는 어미 앞에서는 \"붇기\", \"붇고\"로 써야 한다. \"이르러\"는 \"러\" 불규칙 활용이고, \"치렀다\"는 \"치르다\"의 \"ㅡ\"가 탈락한 꼴이다."},
{"id":"k130","subj":"국어","unit":"조사","q":"밑줄 친 \"에서\"가 주격 조사로 쓰인 것은?","opts":["도서관__에서__ 책을 빌렸다.","서울__에서__ 아침 일찍 출발했다.","정부__에서__ 대책을 발표했다.","집__에서__ 하루 종일 쉬었다."],"ans":2,"exp":"\"에서\"는 단체를 나타내는 명사 뒤에 붙어 그 단체가 주어임을 나타내기도 한다. \"정부에서 대책을 발표했다\"는 \"정부가 대책을 발표했다\"로 바꿀 수 있다. 나머지의 \"에서\"는 행동이 이루어지는 곳이나 출발점을 나타내는 부사격 조사이다."},
{"id":"k131","subj":"국어","unit":"문장 성분","q":"밑줄 친 서술어가 반드시 필요로 하는 문장 성분의 개수가 가장 많은 것은?","opts":["나는 친구에게 선물을 __주었다__.","마당에 꽃이 __피었다__.","그는 의사가 __되었다__.","아이가 우유를 __마신다__."],"ans":0,"exp":"\"주다\"는 주어, 목적어, 필수 부사어(누구에게)를 모두 갖추어야 하는 세 자리 서술어이다. \"피다\"는 주어만 있으면 되는 한 자리 서술어이고, \"되다\"는 주어와 보어, \"마시다\"는 주어와 목적어가 필요한 두 자리 서술어이다."},
{"id":"k132","subj":"국어","unit":"문장 성분","q":"밑줄 친 부사어 가운데 빼면 문장이 성립하지 않는 것은?","opts":["꽃이 __아주__ 예쁘다.","나는 __어제__ 책을 읽었다.","그는 __도서관에서__ 공부한다.","이 그림은 __실물과__ 같다."],"ans":3,"exp":"부사어는 대개 빼도 문장이 성립하지만, 서술어가 꼭 필요로 하는 필수 부사어는 뺄 수 없다. \"같다\"는 비교 대상이 있어야 하므로 \"실물과\"를 빼면 \"이 그림은 같다\"라는 불완전한 문장이 된다. \"아주\", \"어제\", \"도서관에서\"는 빼도 문장이 성립한다."},
{"id":"k133","subj":"국어","unit":"안은문장","q":"밑줄 친 관형절의 성격이 나머지 셋과 다른 것은?","opts":["__내가 어제 읽은__ 책은 재미있었다.","__그가 시험에 합격했다는__ 소식을 들었다.","__마당에 핀__ 꽃이 아름답다.","__동생이 그린__ 그림이 벽에 걸렸다."],"ans":1,"exp":"\"그가 시험에 합격했다는\"은 뒤의 \"소식\"과 내용이 같은 관형절로, 절 안에 빠진 성분이 없다. 나머지는 꾸밈을 받는 명사가 절 안에서 목적어나 주어 구실을 하여 그 성분이 빠져 있다(내가 책을 읽다, 꽃이 피다, 동생이 그림을 그리다)."},
{"id":"k134","subj":"국어","unit":"사동 표현","q":"밑줄 친 말이 사동사로 쓰인 것은?","opts":["아기가 엄마 품에 __안겼다__.","멀리서 종소리가 __들렸다__.","친구에게 꽃다발을 __안겼다__.","옷자락이 못에 __걸렸다__."],"ans":2,"exp":"\"친구에게 꽃다발을 안겼다\"는 친구가 꽃다발을 안게 했다는 뜻이므로 사동사이고 목적어가 있다. \"아기가 품에 안겼다\", \"종소리가 들렸다\", \"옷자락이 걸렸다\"의 서술어는 주어가 남의 행동을 입는 피동사이다. \"안기다\"처럼 사동사와 피동사의 모양이 같은 말은 목적어가 있는지로 가릴 수 있다."},
{"id":"k135","subj":"국어","unit":"높임법","q":"다음 문장에 쓰인 높임법을 모두 든 것은?\n\n할머니께서 지금 방에서 주무십니다.","opts":["주체 높임","주체 높임, 객체 높임","주체 높임, 객체 높임, 상대 높임","주체 높임, 상대 높임"],"ans":3,"exp":"\"께서\"와 \"주무시다\"는 주어인 할머니를 높이는 주체 높임이고, 종결 어미 \"-ㅂ니다\"는 듣는 사람을 높이는 상대 높임이다. 객체 높임은 목적어나 부사어가 가리키는 대상을 \"모시다, 드리다, 께\" 등으로 높이는 것인데, 이 문장에는 높일 객체가 없다."},
{"id":"k136","subj":"국어","unit":"높임법","q":"높임 표현이 옳지 않은 것은?","opts":["아버지께서 할머니를 데리고 가셨다.","선생님께서는 따님이 있으시다.","할아버지께서 진지를 잡수신다.","나는 그 책을 선생님께 드렸다."],"ans":0,"exp":"목적어인 할머니는 높여야 할 대상이므로 \"데리고\"가 아니라 객체를 높이는 \"모시고\"를 써야 한다. 높일 대상의 가족이나 소유물을 통해 간접적으로 높일 때는 \"있으시다\"를 쓰므로 \"따님이 있으시다\"는 옳다. \"잡수신다\"와 \"드렸다\"도 각각 주체와 객체를 바르게 높였다."},
{"id":"k137","subj":"국어","unit":"문장 고쳐 쓰기","q":"어법에 맞는 문장은?","opts":["그는 여간 성실한 사람이다.","문제는 우리가 서로를 믿지 못한다는 것이다.","동생은 무대에서 노래와 춤을 추었다.","내일은 비와 바람이 강하게 불겠다."],"ans":1,"exp":"\"문제는 ~ 것이다\"는 주어와 서술어가 바르게 호응한다. \"여간\"은 \"아니다\" 같은 부정 표현과 함께 써야 하므로 \"여간 성실한 사람이 아니다\"가 옳다. \"노래를 추다\", \"비가 불다\"는 말이 되지 않으므로 \"노래를 부르고 춤을 추었다\", \"비가 오고 바람이 강하게 불겠다\"로 고쳐야 한다."},
{"id":"k138","subj":"국어","unit":"문장 고쳐 쓰기","q":"의미가 중복된 표현이 없는 문장은?","opts":["그 문제는 다시 재론할 필요가 없다.","참석자의 과반수 이상이 찬성했다.","돌이켜 회고해 보면 아쉬움이 많다.","회의에서 여러 가지 의견이 나왔다."],"ans":3,"exp":"\"재론(再論)\"에는 \"다시\"의 뜻이, \"과반수(過半數)\"에는 \"반을 넘음\"의 뜻이, \"회고(回顧)\"에는 \"돌이켜 봄\"의 뜻이 이미 들어 있다. 따라서 \"다시 재론\", \"과반수 이상\", \"돌이켜 회고\"는 뜻이 겹친다. \"회의에서 여러 가지 의견이 나왔다\"에는 겹치는 말이 없다."},
{"id":"k139","subj":"국어","unit":"문장 고쳐 쓰기","q":"중의적인 문장을 고쳐 쓴 것 가운데 중의성이 사라지지 않은 것은?","opts":["그는 나보다 축구를 더 좋아한다. → 그는 내가 축구를 좋아하는 것보다 축구를 더 좋아한다.","손님이 다 오지 않았다. → 손님이 다는 오지 않았다.","영수는 웃으면서 들어오는 민지에게 인사했다. → 영수는 웃으면서 들어오는 민지에게 인사를 했다.","예쁜 친구의 동생을 만났다. → 예쁜, 친구의 동생을 만났다."],"ans":2,"exp":"\"웃으면서\"가 영수의 행동인지 민지의 행동인지 알 수 없는 문장인데, \"인사했다\"를 \"인사를 했다\"로 바꾸어도 달라지는 것이 없다. \"영수는 웃으면서, 들어오는 민지에게 인사했다\"처럼 쉼표를 찍거나 어순을 바꾸어야 한다. 나머지는 비교 대상을 밝히고, 조사 \"는\"으로 일부만 오지 않았음을 나타내고, 쉼표로 꾸미는 대상을 \"동생\"으로 정하여 중의성을 없앴다."},
{"id":"k140","subj":"국어","unit":"문장 고쳐 쓰기","q":"번역 투 표현이 쓰이지 않은 문장은?","opts":["주민들은 그 결정에 반대했다.","학교는 시내 한가운데에 위치하고 있다.","이 일은 세심한 주의를 필요로 한다.","우리는 오후에 회의를 가졌다."],"ans":0,"exp":"\"위치하고 있다\", \"~을 필요로 한다\", \"회의를 가졌다\"는 외국어를 그대로 옮긴 듯한 번역 투 표현이다. 각각 \"한가운데에 있다\", \"세심하게 주의해야 한다\", \"회의를 했다\"로 고치면 자연스럽다. \"주민들은 그 결정에 반대했다\"에는 그런 표현이 없다."},
{"id":"k141","subj":"국어","unit":"한자성어","q":"\"겉으로는 복종하는 체하면서 속으로는 배반함\"을 뜻하는 한자성어는?","opts":["사필귀정(事必歸正)","유비무환(有備無患)","면종복배(面從腹背)","고진감래(苦盡甘來)"],"ans":2,"exp":"\"면종복배\"는 낯(面)으로는 따르고(從) 배(腹) 속으로는 등진다(背)는 뜻이다. \"사필귀정\"은 모든 일은 반드시 바른길로 돌아감, \"유비무환\"은 미리 준비하면 걱정할 것이 없음, \"고진감래\"는 고생 끝에 즐거움이 옴을 뜻한다."},
{"id":"k142","subj":"국어","unit":"한자성어","q":"다음 상황에 가장 어울리는 한자성어는?\n\n약속 시간에 한 시간이나 늦은 사람이, 기다리던 사람에게 왜 미리 전화하지 않았느냐며 도리어 화를 냈다.","opts":["동병상련(同病相憐)","적반하장(賊反荷杖)","이심전심(以心傳心)","다다익선(多多益善)"],"ans":1,"exp":"\"적반하장\"은 도둑이 도리어 매를 든다는 뜻으로, 잘못한 사람이 아무 잘못 없는 사람을 나무랄 때 쓴다. \"동병상련\"은 같은 처지의 사람끼리 서로 가엾게 여김, \"이심전심\"은 마음에서 마음으로 뜻이 통함, \"다다익선\"은 많으면 많을수록 좋음을 뜻한다."},
{"id":"k143","subj":"국어","unit":"한자성어","q":"한자성어의 뜻풀이가 옳지 않은 것은?","opts":["연목구어(緣木求魚): 물을 만난 고기처럼 제 능력을 마음껏 펼침","호가호위(狐假虎威): 남의 권세를 빌려 위세를 부림","교언영색(巧言令色): 남의 환심을 사려고 꾸미는 말과 얼굴빛","과유불급(過猶不及): 정도를 지나침은 미치지 못함과 같음"],"ans":0,"exp":"\"연목구어\"는 나무에 올라가서 물고기를 구한다는 뜻으로, 도저히 이룰 수 없는 일을 굳이 하려 함을 이른다. \"호가호위\", \"교언영색\", \"과유불급\"의 풀이는 옳다."},
{"id":"k144","subj":"국어","unit":"한자성어","q":"부모에 대한 효도와 관계가 없는 한자성어는?","opts":["반포지효(反哺之孝)","혼정신성(昏定晨省)","풍수지탄(風樹之歎)","순망치한(脣亡齒寒)"],"ans":3,"exp":"\"순망치한\"은 입술이 없으면 이가 시리다는 뜻으로, 서로 의지하는 사이에서 한쪽이 망하면 다른 쪽도 온전하기 어려움을 이른다. \"반포지효\"는 자식이 자라서 어버이의 은혜를 갚는 효성, \"혼정신성\"은 아침저녁으로 부모의 안부를 살핌, \"풍수지탄\"은 효도하려 할 때 이미 부모가 돌아가신 슬픔을 뜻한다."},
{"id":"k145","subj":"국어","unit":"속담","q":"\"쉬운 일이라도 힘을 합하면 훨씬 쉽다\"는 뜻의 속담은?","opts":["사공이 많으면 배가 산으로 간다","우물을 파도 한 우물을 파라","돌다리도 두들겨 보고 건너라","백지장도 맞들면 낫다"],"ans":3,"exp":"\"백지장도 맞들면 낫다\"는 가벼운 종이 한 장도 함께 들면 낫다는 말로 협력의 중요함을 이른다. \"사공이 많으면 배가 산으로 간다\"는 간섭하는 사람이 많으면 일이 제대로 되지 않음을, \"우물을 파도 한 우물을 파라\"는 한 가지 일을 끝까지 해야 함을, \"돌다리도 두들겨 보고 건너라\"는 잘 아는 일도 조심해야 함을 이른다."},
{"id":"k146","subj":"국어","unit":"속담","q":"속담의 뜻풀이가 옳지 않은 것은?","opts":["빈 수레가 요란하다: 실속 없는 사람이 겉으로 더 떠들어 댄다","미꾸라지 용 됐다: 못된 사람 하나가 온 집단을 흐려 놓는다","언 발에 오줌 누기: 임시변통은 효력이 오래가지 못하고 사태를 더 나쁘게 한다","개구리 올챙이 적 생각 못 한다: 형편이 나아진 사람이 어렵던 때를 잊고 잘난 듯이 군다"],"ans":1,"exp":"\"미꾸라지 용 됐다\"는 보잘것없던 사람이 크게 되었음을 이르는 말이다. 한 사람의 못된 행동이 집단 전체에 나쁜 영향을 미친다는 뜻의 속담은 \"미꾸라지 한 마리가 온 웅덩이를 흐려 놓는다\"이다. 나머지 속담의 풀이는 옳다."},
{"id":"k147","subj":"국어","unit":"한자어","q":"밑줄 친 한자어의 쓰임이 옳은 것은?","opts":["사상 __유래__가 없는 폭우가 쏟아졌다.","생산성 __재고__ 방안을 마련했다.","실내에서는 흡연을 __일절__ 금합니다.","집주인에게서 방을 __임대__해 살고 있다."],"ans":2,"exp":"\"일절(一切)\"은 \"아주, 전혀, 절대로\"의 뜻으로 금지하거나 부인하는 말과 함께 쓴다. 같거나 비슷한 예는 \"유례(類例)\", 수준을 끌어올리는 것은 \"제고(提高)\"이다. \"임대\"는 돈을 받고 빌려주는 것이므로 빌려 쓰는 쪽은 \"임차\"라고 해야 한다."},
{"id":"k148","subj":"국어","unit":"한자어","q":"공문서에 쓰인 한자어를 쉬운 말로 바꾼 것이 적절하지 않은 것은?","opts":["__작일__ 접수분 → 내일","__익일__까지 제출 → 다음 날","__금일__ 회의 → 오늘","__상기__ 내용 → 위의"],"ans":0,"exp":"\"작일(昨日)\"은 \"어제\"이다. \"내일\"에 해당하는 한자어는 \"명일(明日)\"이다. \"익일(翌日)\"은 \"다음 날\", \"금일(今日)\"은 \"오늘\", \"상기(上記)\"는 \"위에 적은\"이라는 뜻이므로 나머지는 알맞게 바꾸었다."},
{"id":"k149","subj":"국어","unit":"한자어","q":"사람을 이르는 말의 뜻풀이가 옳지 않은 것은?","opts":["춘부장(椿府丈): 남의 아버지를 높여 이르는 말","자당(慈堂): 남의 어머니를 높여 이르는 말","영애(令愛): 윗사람의 딸을 높여 이르는 말","선친(先親): 돌아가신 남의 아버지를 높여 이르는 말"],"ans":3,"exp":"\"선친\"은 남에게 돌아가신 자기 아버지를 이르는 말이다. 돌아가신 남의 아버지를 높여 이를 때는 \"선대인(先大人)\"을 쓴다. \"춘부장\", \"자당\", \"영애\"의 풀이는 옳다."},
{"id":"k150","subj":"국어","unit":"관용 표현","q":"밑줄 친 관용 표현의 쓰임이 적절하지 않은 것은?","opts":["그는 __입이 짧아서__ 음식을 가려 먹는다.","그는 __간이 작아서__ 위험한 일에도 겁 없이 나선다.","합격 소식을 __목이 빠지게__ 기다렸다.","큰일을 맡게 되어 __어깨가 무겁다__."],"ans":1,"exp":"\"간이 작다\"는 대담하지 못하고 겁이 많다는 뜻이므로 겁 없이 나선다는 내용과 맞지 않는다. 이 문장에는 \"간이 커서\"가 어울린다. \"입이 짧다\"는 음식을 심하게 가리거나 적게 먹음, \"목이 빠지게 기다리다\"는 몹시 애타게 기다림, \"어깨가 무겁다\"는 책임이 커서 부담스러움을 뜻한다."},
{"id":"k151","subj":"국어","unit":"관용 표현","q":"관용 표현 \"오지랖이 넓다\"의 뜻으로 옳은 것은?","opts":["쓸데없이 아무 일에나 참견하는 면이 있다","아는 사람이 많아 사귐의 폭이 넓다","마음이 너그럽고 남을 잘 이해한다","돈이나 물건을 쓰는 품이 넉넉하다"],"ans":0,"exp":"\"오지랖\"은 웃옷의 앞자락을 뜻하는 말로, \"오지랖이 넓다\"는 쓸데없이 지나치게 아무 일에나 참견하는 면이 있다는 뜻이다. 아는 사람이 많다는 뜻으로는 \"발이 넓다\", 씀씀이가 넉넉하다는 뜻으로는 \"손이 크다\"를 쓴다."},
{"id":"k152","subj":"국어","unit":"고유어","q":"날짜나 기간을 나타내는 고유어의 뜻풀이가 옳지 않은 것은?","opts":["사흘: 세 날","달포: 한 달이 조금 넘는 기간","그끄저께: 어제의 전날","글피: 모레의 다음 날"],"ans":2,"exp":"\"그끄저께\"는 그저께의 전날, 곧 오늘부터 사흘 전의 날이다. 어제의 전날은 \"그저께\"이다. \"사흘\"은 세 날(3일)이고, \"달포\"는 한 달이 조금 넘는 기간, \"글피\"는 모레의 다음 날이다."},
{"id":"k153","subj":"국어","unit":"어휘","q":"밑줄 친 말을 한자어로 바꾼 것이 적절하지 않은 것은?","opts":["올해 들어 물가가 계속 __올랐다__. → 상승했다","세자가 왕위에 __올랐다__. → 등극했다","그의 이름이 명단에 __올랐다__. → 등재되었다","그는 서둘러 기차에 __올랐다__. → 승선했다"],"ans":3,"exp":"\"승선(乘船)\"은 배를 탄다는 뜻이므로 기차에는 쓸 수 없다. 기차에 오르는 것은 \"승차했다\"나 \"탑승했다\"로 바꾸어야 한다. \"상승\"은 값이나 수치가 올라감, \"등극\"은 임금의 자리에 오름, \"등재\"는 이름이나 내용을 장부나 명단에 올림을 뜻한다."},
{"id":"k154","subj":"국어","unit":"의미 관계","q":"두 단어의 의미 관계가 나머지 셋과 다른 것은?","opts":["꽃 – 장미","책 – 서적","악기 – 피아노","과일 – 사과"],"ans":1,"exp":"\"책\"과 \"서적\"은 뜻이 서로 비슷한 유의 관계이다. \"꽃 – 장미\", \"악기 – 피아노\", \"과일 – 사과\"는 앞의 말이 뒤의 말을 포함하는 상하 관계이다."},
{"id":"k155","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n둥근 지구를 평평한 종이에 옮기면 어딘가는 반드시 일그러진다. 항해에 널리 쓰인 메르카토르 도법의 지도는 각도를 정확히 나타내는 대신 극지방에 가까울수록 땅을 실제보다 훨씬 크게 그린다. 반대로 넓이를 정확히 나타내는 지도는 땅의 모양이 찌그러진다. 그러므로 어떤 지도가 옳으냐고 묻기보다 그 지도가 무엇을 위해 만들어졌는지를 물어야 한다. 지도는 세계를 그대로 비추는 거울이 아니라 쓰임에 맞게 골라 그린 그림이다.","opts":["메르카토르 도법의 지도는 항해에 쓰기에 알맞지 않다.","지도는 쓰임에 따라 무엇을 정확히 나타낼지 골라서 만든 것이다.","넓이를 정확히 나타낸 지도가 가장 올바른 지도이다.","기술이 발달하면 일그러짐이 없는 종이 지도를 만들 수 있다."],"ans":1,"exp":"글은 어떤 지도든 일그러짐을 피할 수 없으므로 지도마다 쓰임에 맞게 정확히 나타낼 것을 고른다는 점을 말한다. 메르카토르 도법은 항해에 널리 쓰였다고 했고, 어느 지도가 옳은지를 묻지 말라고 했으며, 평평한 종이에 옮기면 반드시 일그러진다고 했으므로 나머지는 글과 맞지 않는다."},
{"id":"k156","subj":"국어","unit":"주제 찾기","q":"다음 글에서 글쓴이가 말하고자 하는 바로 가장 적절한 것은?\n\n병원에서 약을 잘못 줄 뻔했다가 직전에 알아차린 일은 환자에게 해가 없었으니 덮어 두어도 될까? 그렇지 않다. 사고가 될 뻔한 일은 실제 사고와 같은 원인에서 나오며 훨씬 자주 일어난다. 이런 일을 숨기지 않고 보고하게 하면 사고가 나기 전에 허점을 찾아 고칠 수 있다. 다만 보고한 사람을 탓하고 벌주는 조직에서는 아무도 입을 열지 않는다. 안전한 병원은 실수하지 않는 사람들이 모인 곳이 아니라 실수를 말할 수 있는 곳이다.","opts":["환자에게 해가 없었던 실수는 보고하지 않아도 된다.","실수를 줄이려면 실수한 사람을 엄하게 벌주어야 한다.","실수를 탓하지 않고 보고하게 해야 병원이 안전해진다.","사고가 될 뻔한 일은 실제 사고보다 드물게 일어난다."],"ans":2,"exp":"글쓴이는 사고가 될 뻔한 일도 보고해야 허점을 고칠 수 있고, 그러려면 보고한 사람을 탓하지 말아야 한다고 말한다. 해가 없었어도 덮어 두면 안 된다고 했고, 벌주는 조직에서는 아무도 말하지 않는다고 했으며, 사고가 될 뻔한 일이 훨씬 자주 일어난다고 했다."},
{"id":"k157","subj":"국어","unit":"주제 찾기","q":"다음 글의 주장으로 가장 적절한 것은?\n\n표준어는 여러 지역 사람이 서로 통하도록 정해 놓은 공통의 말이다. 그렇다고 방언이 틀린 말이거나 수준이 낮은 말인 것은 아니다. 방언에는 그 지역의 자연과 살림살이가 담긴 낱말이 많고, 표준어에서는 이미 사라진 옛말의 자취가 남아 있기도 하다. 방언이 사라지면 그 말에 실려 전해 오던 생각과 정서도 함께 사라진다. 공적인 자리에서는 표준어를 쓰되, 방언 또한 우리말을 넉넉하게 하는 자산으로 여겨 지키고 기록해야 한다.","opts":["방언은 우리말을 넉넉하게 하는 자산이므로 지켜야 한다.","의사소통을 위해서는 방언 대신 표준어만 써야 한다.","방언은 표준어보다 역사가 오래된 말이다.","공적인 자리에서도 방언을 자유롭게 쓸 수 있어야 한다."],"ans":0,"exp":"글쓴이는 방언이 틀린 말이 아니라 지역의 삶과 옛말의 자취를 담은 자산이므로 지키고 기록해야 한다고 주장한다. 표준어만 쓰자는 것은 글의 주장과 반대이고, 공적인 자리에서는 표준어를 쓰자고 했다. 방언에 옛말의 자취가 남아 있다고 했을 뿐 방언이 표준어보다 오래되었다고 하지는 않았다."},
{"id":"k158","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n어떤 수술을 두고 \"받은 사람 100명 가운데 90명이 산다\"고 들은 사람들은 \"100명 가운데 10명이 죽는다\"고 들은 사람들보다 수술을 더 많이 선택했다. 두 말이 전하는 정보는 똑같다. 달라진 것은 삶을 앞세웠느냐 죽음을 앞세웠느냐뿐이다. 사람의 판단은 내용만이 아니라 그것을 담은 말의 틀에도 좌우된다. 그러니 중요한 결정을 앞두었을 때는 같은 정보를 다른 방식으로 바꾸어 말해 보고도 생각이 그대로인지 살펴볼 일이다.","opts":["수술을 결정할 때는 성공률이 높은 쪽을 골라야 한다.","통계 수치는 대부분 사실을 정확하게 전하지 못한다.","죽음을 앞세운 설명이 삶을 앞세운 설명보다 정직하다.","같은 정보도 표현하는 틀에 따라 판단이 달라질 수 있다."],"ans":3,"exp":"글은 내용이 같은 두 설명을 들은 사람들의 선택이 달랐다는 예를 들어, 판단이 말의 틀에 좌우된다는 점을 말한다. 두 설명의 수치는 모두 정확하며 어느 쪽이 더 정직하다고 하지 않았다. 성공률이 높은 수술을 고르라는 내용도 글에 없다."},
{"id":"k159","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n책은 인터넷으로 사고 정보는 검색으로 찾는 시대에 공공 도서관이 왜 필요하냐고 묻는 사람이 있다. 그러나 오늘날의 도서관은 책을 빌려주는 일만 하지 않는다. 돈을 내지 않고도 누구나 머물 수 있고, 아이들은 숙제를 하며, 노인들은 스마트폰 쓰는 법을 배운다. 일자리를 찾는 사람은 컴퓨터를 쓰고 이웃들은 모임을 연다. 도서관은 형편과 나이에 상관없이 모두에게 열린 드문 공간이다. 도서관의 가치를 대출 권수로만 잴 수 없는 까닭이 여기에 있다.","opts":["인터넷이 발달하여 공공 도서관의 필요성이 줄어들었다.","공공 도서관은 누구에게나 열린 공간이라는 점에서 가치가 있다.","공공 도서관은 책을 더 사들여 대출 권수를 늘려야 한다.","공공 도서관은 노인과 아이를 위한 시설로 바뀌어야 한다."],"ans":1,"exp":"글은 도서관이 책을 빌려주는 곳을 넘어 형편과 나이에 상관없이 모두에게 열린 공간이라는 점에서 가치가 있다고 말한다. 필요성이 줄었다는 것은 글쓴이가 반박하는 생각이고, 대출 권수로만 가치를 잴 수 없다고 했다. 노인과 아이는 여러 이용자의 예일 뿐이다."},
{"id":"k160","subj":"국어","unit":"주제 찾기","q":"다음 글의 중심 내용으로 가장 적절한 것은?\n\n길을 넓히면 막힘이 풀릴 것 같지만 실제로는 그렇지 않은 경우가 많다. 길이 넓어져 운전하기 편해지면 그동안 차를 두고 다니던 사람들까지 차를 몰고 나오기 때문이다. 얼마 지나지 않아 넓어진 길은 다시 차로 가득 찬다. 그래서 여러 도시가 차도를 늘리는 대신 버스와 지하철을 편리하게 하고, 걷거나 자전거를 타기 좋은 길을 만드는 쪽으로 방향을 바꾸고 있다. 교통 문제의 해법은 차가 다닐 자리를 늘리는 데 있지 않고 차를 덜 타도 되게 하는 데 있다.","opts":["도로를 넓히는 것이 교통 혼잡을 푸는 가장 빠른 길이다.","자동차를 가진 사람이 늘어나는 것을 법으로 막아야 한다.","교통 혼잡은 차를 덜 타도 되는 여건을 만들어야 풀린다.","버스와 지하철은 자전거보다 환경에 부담을 덜 준다."],"ans":2,"exp":"글은 길을 넓혀도 차가 다시 늘어나므로 차를 덜 타도 되게 하는 것이 해법이라고 말한다. 도로를 넓히는 방법은 글쓴이가 한계를 지적한 것이다. 차를 갖지 못하게 법으로 막자는 내용이나 교통수단의 환경 부담을 견준 내용은 글에 없다."},
{"id":"k161","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n조선 시대에는 여성 환자가 남자 의원에게 몸을 보이기를 꺼려 치료를 받지 못하고 죽는 일이 있었다. 이를 막으려고 태종 때 관청에 딸린 여자 종 가운데 어린 사람을 뽑아 의술을 가르쳤는데, 이들이 의녀이다. 의녀는 글을 먼저 익힌 뒤 맥을 짚는 법과 침놓는 법 등을 배웠고, 여성 환자를 진찰하고 아이 낳는 일을 도왔다. 그러나 신분이 낮았기 때문에 뒤에는 의술과 관계없는 잔치에 불려 나가 일하기도 했다.","opts":["의녀는 양반 집안의 딸 가운데에서 뽑았다.","의녀는 여성 환자가 치료받지 못하는 일을 막으려고 두었다.","의녀는 의술을 배우기 전에 글부터 익혔다.","의녀는 의술과 관계없는 일에 불려 나가기도 했다."],"ans":0,"exp":"의녀는 관청에 딸린 여자 종 가운데 어린 사람을 뽑았다고 했으므로 양반 집안의 딸이라는 설명은 글과 다르다. 여성 환자가 치료받지 못하고 죽는 일을 막으려 했다는 것, 글을 먼저 익혔다는 것, 잔치에 불려 나가기도 했다는 것은 글에 나와 있다."},
{"id":"k162","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n꿀벌은 먹이가 있는 곳을 춤으로 동료에게 알린다. 먹이가 벌집에서 가까우면 제자리에서 원을 그리며 도는 춤을 추는데, 이 춤에는 방향에 대한 정보가 없다. 먹이가 멀리 있으면 배를 좌우로 흔들며 곧게 나아갔다가 되돌아오기를 되풀이하는 8자 모양의 춤을 춘다. 이때 곧게 나아가는 방향은 태양을 기준으로 한 먹이의 방향을 나타내고, 배를 흔들며 나아가는 시간이 길수록 먹이가 멀리 있다는 뜻이다. 어두운 벌집 안에서 동료들은 춤추는 벌을 더듬이로 만지며 이 정보를 읽어 낸다.","opts":["원을 그리는 춤은 먹이가 있는 방향을 알려 준다.","8자 모양의 춤은 먹이가 가까이 있을 때 춘다.","배를 흔들며 나아가는 시간이 짧을수록 먹이가 멀리 있다.","동료 벌들은 더듬이로 춤의 정보를 알아낸다."],"ans":3,"exp":"동료들이 춤추는 벌을 더듬이로 만지며 정보를 읽어 낸다고 했다. 원을 그리는 춤에는 방향 정보가 없고, 8자 모양의 춤은 먹이가 멀리 있을 때 추며, 배를 흔들며 나아가는 시간이 길수록 먹이가 멀다고 했으므로 나머지는 글과 다르다."},
{"id":"k163","subj":"국어","unit":"내용 일치","q":"다음 안내문의 내용과 일치하는 것은?\n\n○○시립도서관 이용 안내\n- 이용 시간: 화~금요일 오전 9시~오후 10시, 토·일요일 오전 9시~오후 6시\n- 쉬는 날: 매주 월요일, 법정 공휴일\n- 대출: 회원증이 있는 사람은 한 번에 5권까지 14일 동안 빌릴 수 있음. 그 책을 예약한 사람이 없으면 한 차례만 7일을 연장할 수 있음\n- 연체: 늦게 돌려준 날수만큼 대출이 정지됨\n- 회원증 발급: ○○시에 살거나 ○○시에 있는 직장 또는 학교에 다니는 사람이 신분증을 가지고 1층 안내 창구에서 신청","opts":["일요일에는 오후 10시까지 이용할 수 있다.","다른 사람이 예약한 책도 한 번은 대출 기간을 늘릴 수 있다.","책을 3일 늦게 돌려주면 3일 동안 책을 빌릴 수 없다.","○○시에 살지 않는 사람은 회원증을 만들 수 없다."],"ans":2,"exp":"늦게 돌려준 날수만큼 대출이 정지되므로 3일 늦으면 3일 동안 빌릴 수 없다. 일요일은 오후 6시까지이고, 연장은 예약한 사람이 없을 때만 할 수 있다. ○○시에 살지 않아도 ○○시에 있는 직장이나 학교에 다니면 회원증을 만들 수 있다."},
{"id":"k164","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n《조선왕조실록》은 임금이 세상을 떠난 뒤에 그 임금 때의 일을 정리하여 펴낸 기록이다. 편찬의 바탕이 되는 자료는 사관이 임금 곁에서 날마다 적은 사초였다. 사관이 눈치를 보지 않고 사실대로 쓸 수 있도록 임금이라도 사초와 실록을 볼 수 없게 하였다. 완성된 실록은 여러 벌을 만들어 서울과 지방의 사고에 나누어 보관하였다. 임진왜란 때 대부분의 사고가 불탔으나 전주 사고의 실록이 남아 다시 찍어 낼 수 있었다.","opts":["사초는 사관이 임금 곁에서 적은 기록이다.","실록은 해당 임금이 자리에 있는 동안에 펴냈다.","임금은 실록을 볼 수 없었다.","실록을 여러 곳에 나누어 둔 덕분에 전쟁을 겪고도 전해졌다."],"ans":1,"exp":"실록은 임금이 세상을 떠난 뒤에 그 임금 때의 일을 정리하여 펴냈다고 했다. 사초가 사관의 기록이라는 것, 임금도 사초와 실록을 볼 수 없었다는 것, 여러 사고에 나누어 보관하여 전주 사고의 것이 남았다는 것은 글의 내용과 일치한다."},
{"id":"k165","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n발효와 부패는 둘 다 미생물이 유기물을 분해하는 현상이다. 과학적으로 둘을 가르는 뚜렷한 선은 없다. 분해된 결과가 사람에게 이로우면 발효라 하고 해로우면 부패라 부를 뿐이다. 우유에 젖산균이 자라면 요구르트가 되지만 다른 세균이 자라면 상한 우유가 된다. 그래서 발효 식품을 만들 때는 소금의 양과 온도, 공기와 닿는 정도를 조절하여 원하는 미생물만 잘 자라게 한다. 김치를 담글 때 배추를 소금에 절이는 것도 해로운 세균이 자라기 어렵게 하려는 것이다.","opts":["발효와 부패에는 모두 미생물이 관여한다.","발효와 부패는 사람에게 이로운지에 따라 구별한다.","같은 우유라도 자라는 미생물에 따라 결과가 달라진다.","배추를 소금에 절이는 것은 모든 미생물을 없애기 위해서이다."],"ans":3,"exp":"소금에 절이는 것은 해로운 세균이 자라기 어렵게 하여 원하는 미생물만 잘 자라게 하려는 것이지 모든 미생물을 없애려는 것이 아니다. 발효와 부패가 모두 미생물의 분해 현상이고, 사람에게 이로운지로 나누며, 우유가 요구르트도 되고 상한 우유도 된다는 것은 글과 일치한다."},
{"id":"k166","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하는 것은?\n\n우리 몸에는 약 하루를 주기로 잠과 체온, 호르몬 분비를 조절하는 생체 시계가 있다. 비행기로 여러 시간대를 단숨에 넘어가면 몸속 시계와 현지 시각이 어긋나 낮에 졸리고 밤에 잠이 오지 않는데, 이것이 시차 피로이다. 대개 서쪽으로 갈 때보다 동쪽으로 갈 때 더 힘들다. 하루를 길게 늘리는 것보다 짧게 줄이는 쪽이 몸에 더 어렵기 때문이다. 생체 시계를 맞추는 가장 강한 신호는 빛이므로, 도착한 뒤 현지의 낮에 햇빛을 쬐면 적응이 빨라진다.","opts":["생체 시계는 잠만 조절하고 체온에는 관여하지 않는다.","시차 피로는 서쪽으로 갈 때 더 심한 것이 보통이다.","현지의 낮에 햇빛을 쬐면 시차에 빨리 적응할 수 있다.","몸은 하루를 늘리는 것보다 줄이는 것에 더 쉽게 적응한다."],"ans":2,"exp":"생체 시계를 맞추는 가장 강한 신호가 빛이어서 현지의 낮에 햇빛을 쬐면 적응이 빨라진다고 했다. 생체 시계는 잠과 체온, 호르몬 분비를 조절하고, 시차 피로는 동쪽으로 갈 때 더 힘들며, 하루를 줄이는 쪽이 몸에 더 어렵다고 했으므로 나머지는 글과 다르다."},
{"id":"k167","subj":"국어","unit":"내용 일치","q":"다음 글의 내용과 일치하지 않는 것은?\n\n한지는 닥나무 껍질로 만든 우리 전통 종이이다. 닥나무 껍질을 잿물에 삶아 불순물을 없애고 두들겨 풀어낸 뒤, 물에 풀어 발로 떠서 말린다. 닥나무의 섬유는 길고 질겨서 한지는 잘 찢어지지 않는다. 또 잿물에 삶아 만들기 때문에 산성을 띠지 않아 오랜 세월이 지나도 쉽게 삭지 않는다. 산성을 띠는 종이가 백 년쯤 지나면 누렇게 바스러지기 쉬운 것과 대조된다. 한지는 바람이 잘 통하고 습기를 머금었다 내놓는 성질도 있어 문에 바르는 창호지로 널리 쓰였다.","opts":["한지의 재료는 닥나무 껍질이다.","한지가 질긴 것은 섬유가 길고 질기기 때문이다.","한지는 산성을 띠어서 오래 보존된다.","한지는 습기를 머금었다 내놓는 성질이 있다."],"ans":2,"exp":"한지는 잿물에 삶아 만들어 산성을 띠지 않기 때문에 오래간다고 했으므로, 산성을 띠어서 오래 보존된다는 설명은 글과 반대이다. 재료가 닥나무 껍질이라는 것, 섬유가 길고 질겨 잘 찢어지지 않는다는 것, 습기를 머금었다 내놓는다는 것은 글에 나와 있다."},
{"id":"k168","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 카페인은 이 아데노신과 모양이 비슷해서 아데노신이 붙을 자리를 대신 차지한다.\n(나) 깨어 있는 동안 뇌에는 아데노신이라는 물질이 쌓이고, 이것이 신경 세포의 수용체에 붙으면 졸음이 온다.\n(다) 그러나 그동안에도 아데노신은 계속 쌓이므로, 카페인의 효과가 떨어지면 미뤄 둔 졸음이 한꺼번에 몰려온다.\n(라) 그 결과 뇌는 피로하다는 신호를 받지 못해 한동안 졸음을 느끼지 않는다.","opts":["(나) – (가) – (라) – (다)","(나) – (라) – (가) – (다)","(가) – (나) – (다) – (라)","(가) – (라) – (나) – (다)"],"ans":0,"exp":"아데노신을 처음 소개하는 (나)가 맨 앞에 온다. \"이 아데노신\"으로 받아 카페인의 작용을 말하는 (가), 그 결과를 말하는 (라), \"그러나 그동안에도\"로 한계를 덧붙이는 (다)가 차례로 이어진다."},
{"id":"k169","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 그래서 사람들은 누구나 받아 주는 조개껍데기나 곡식, 옷감 같은 물건을 교환의 매개로 삼기 시작했다.\n(나) 이후 금속을 일정한 모양과 무게로 찍어 낸 주화가 나와 이런 불편을 덜어 주었다.\n(다) 물건과 물건을 직접 바꾸던 시절에는 내가 가진 것을 원하면서 내가 원하는 것을 가진 상대를 만나야만 거래가 이루어졌다.\n(라) 하지만 이런 물건은 들고 다니기 무겁거나 쉽게 상하고, 품질이 고르지 않다는 문제가 있었다.","opts":["(다) – (라) – (가) – (나)","(가) – (다) – (라) – (나)","(다) – (나) – (가) – (라)","(다) – (가) – (라) – (나)"],"ans":3,"exp":"물물 교환의 어려움을 말하는 (다)가 맨 앞에 온다. 그 해결책으로 물건을 교환의 매개로 삼았다는 (가), \"이런 물건\"의 문제를 말하는 (라), \"이런 불편\"을 덜어 준 주화를 말하는 (나)가 차례로 이어진다."},
{"id":"k170","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 이는 먼저 들어온 정보가 틀이 되어 뒤에 들어온 정보를 그 틀에 맞추어 해석하게 되기 때문이다.\n(나) 한 실험에서 어떤 사람을 \"똑똑하고 부지런하지만 고집이 세고 질투가 많다\"고 소개하였다.\n(다) 다른 집단에는 같은 낱말을 순서만 뒤집어 \"질투가 많고 고집이 세지만 부지런하고 똑똑하다\"고 소개하였다.\n(라) 그러자 앞의 소개를 들은 집단이 그 사람을 훨씬 좋게 평가하였다.","opts":["(나) – (라) – (다) – (가)","(나) – (다) – (라) – (가)","(가) – (나) – (다) – (라)","(다) – (나) – (가) – (라)"],"ans":1,"exp":"실험을 꺼내는 (나)가 맨 앞에 오고, \"다른 집단에는\"으로 이어지는 (다)가 그 뒤에 온다. 두 집단의 소개가 모두 나온 뒤에야 결과를 견주는 (라)가 올 수 있고, \"이는 ~ 때문이다\"로 까닭을 밝히는 (가)가 마지막에 온다."},
{"id":"k171","subj":"국어","unit":"문장 순서","q":"(가)~(라)를 문맥에 맞게 순서대로 늘어놓은 것은?\n\n(가) 가까이 다가온 뒤에는 체온과 땀 냄새를 감지하여 내려앉을 자리를 정한다.\n(나) 모기는 어둠 속에서도 피를 빨 대상을 정확히 찾아낸다.\n(다) 그러므로 운동을 한 직후처럼 숨이 가쁘고 땀이 많이 날 때는 모기에 물리기 쉽다.\n(라) 먼저 멀리서 사람이 내쉬는 숨 속의 이산화 탄소를 감지하고 그쪽으로 날아온다.","opts":["(나) – (가) – (라) – (다)","(라) – (가) – (나) – (다)","(나) – (라) – (가) – (다)","(나) – (다) – (라) – (가)"],"ans":2,"exp":"모기가 대상을 잘 찾는다는 (나)가 화제를 꺼낸다. \"먼저 멀리서\"의 (라)와 \"가까이 다가온 뒤에는\"의 (가)가 찾는 과정을 차례로 설명하고, \"그러므로\"로 시작하는 (다)가 앞의 내용에서 결론을 끌어낸다."},
{"id":"k172","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n과학 이론은 한번 증명되면 영원히 참으로 남는 것이 아니다. 아무리 많은 관찰이 이론과 맞아떨어져도, 그와 어긋나는 관찰이 확인되면 이론은 고쳐지거나 버려진다. 뉴턴의 역학은 이백 년 넘게 흔들림 없는 진리로 여겨졌지만 아주 빠른 물체의 운동 앞에서는 한계가 드러났다. 과학이 믿을 만한 까닭은 틀리지 않기 때문이 아니라 ______ 때문이다.","opts":["뛰어난 학자들이 오랫동안 믿어 왔기","틀린 것으로 드러나면 스스로 고쳐 나가기","관찰한 사실과 한 번도 어긋난 적이 없기","한번 세운 이론을 끝까지 지켜 내기"],"ans":1,"exp":"글은 이론이 관찰과 어긋나면 고쳐지거나 버려진다고 했으므로, 과학을 믿을 만한 까닭은 틀린 것을 스스로 고쳐 나가는 데 있다. 오랫동안 믿어 온 뉴턴 역학도 한계가 드러났다고 했고, 어긋나는 관찰이 있을 수 있다고 했으며, 이론을 끝까지 지킨다는 것은 글의 내용과 반대이다."},
{"id":"k173","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n전쟁 중에 어느 군대가 임무를 마치고 돌아온 폭격기들의 총탄 자국을 조사하였다. 자국은 날개와 꼬리에 몰려 있었고, 장교들은 그 부분에 철판을 덧대자고 하였다. 그러나 한 통계학자는 오히려 자국이 거의 없는 엔진 쪽을 보강해야 한다고 주장하였다. ______ 때문이다. 날개와 꼬리에 총탄을 맞은 비행기는 그래도 돌아올 수 있었다는 뜻이다. 눈앞에 있는 자료만 보아서는 안 되고, 어떤 자료가 빠져 있는지를 물어야 한다.","opts":["엔진은 날개나 꼬리보다 작아서 총탄에 잘 맞지 않기","날개와 꼬리는 철판을 덧대기에는 너무 얇기","엔진에 총탄을 맞은 비행기는 돌아오지 못해 조사에서 빠졌기","돌아온 비행기의 수가 통계를 내기에는 너무 적었기"],"ans":2,"exp":"뒤 문장에서 날개와 꼬리에 맞은 비행기는 돌아올 수 있었다고 했고, 빠진 자료가 무엇인지 물어야 한다고 했다. 따라서 엔진에 자국이 없는 까닭은 엔진에 맞은 비행기가 돌아오지 못해 조사 대상에 없었기 때문이라는 말이 들어가야 한다. 나머지는 \"빠져 있는 자료\"라는 글의 결론과 이어지지 않는다."},
{"id":"k174","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n예전의 광고는 물건의 쓸모를 알리는 데 힘썼다. 이 비누는 때가 잘 빠지고 이 신발은 오래 신는다는 식이었다. 오늘날의 광고는 물건보다 그것을 가진 사람의 모습을 보여 준다. 이 차를 타면 성공한 사람으로 보이고 이 옷을 입으면 젊어 보인다는 것이다. 광고를 본 사람은 지금의 자신이 어딘가 모자란다고 느끼게 된다. 결국 오늘날의 광고는 이미 있는 필요를 채워 주는 데 그치지 않고 ______.","opts":["물건의 성능을 더 정확하게 알려 준다","소비자가 물건을 오래 쓰도록 이끈다","사람들의 씀씀이를 줄이는 구실을 한다","없던 필요를 새로 만들어 낸다"],"ans":3,"exp":"오늘날의 광고는 보는 사람이 자신을 모자란다고 느끼게 한다고 했으므로, 있던 필요를 채우는 데서 더 나아가 없던 필요를 만들어 낸다는 말이 알맞다. 성능을 알리는 것은 예전 광고의 특징이고, 물건을 오래 쓰게 하거나 씀씀이를 줄인다는 것은 글의 흐름과 맞지 않는다."},
{"id":"k175","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n핀 하나를 한 사람이 처음부터 끝까지 만들면 하루에 스무 개도 만들기 어렵다. 그런데 철사를 펴는 일, 자르는 일, 끝을 뾰족하게 하는 일 등으로 나누어 여러 사람이 한 가지씩 맡으면 한 사람당 수천 개를 만들 수 있다. 같은 일을 되풀이하면 솜씨가 늘고, 일을 바꾸느라 버리는 시간이 없어지기 때문이다. 이처럼 분업은 ______. 그러나 분업에는 그늘도 있다. 날마다 단순한 동작만 되풀이하는 사람은 일의 전체를 보지 못하고 일에서 보람을 느끼기도 어렵다.","opts":["생산성을 크게 높인다","일하는 사람의 보람을 키운다","물건의 값을 올리는 원인이 된다","여러 가지 기술을 고루 익히게 한다"],"ans":0,"exp":"빈칸 앞에서 일을 나누어 맡으면 한 사람이 만드는 양이 크게 는다고 했으므로 분업이 생산성을 높인다는 말로 정리해야 한다. 보람을 느끼기 어렵다는 것은 뒤에서 말한 분업의 그늘이고, 한 가지 일만 되풀이하므로 여러 기술을 고루 익힌다고 할 수 없다. 물건값에 대한 내용은 글에 없다."},
{"id":"k176","subj":"국어","unit":"빈칸 추론","q":"빈칸에 들어갈 말로 가장 적절한 것은?\n\n환자에게 \"어젯밤에는 잘 주무셨지요?\"라고 물으면 대답은 대개 \"네\"로 끝난다. 묻는 말 속에 이미 기대하는 답이 들어 있기 때문이다. \"어젯밤 잠은 어떠셨어요?\"라고 물으면 환자는 몇 번 깼는지, 무엇이 불편했는지를 자기 말로 이야기한다. \"예\"나 \"아니요\"로 답하게 되는 질문은 사실을 빨리 확인할 때 쓸모가 있지만, 상대의 사정을 알고 싶을 때는 알맞지 않다. 상대의 이야기를 충분히 듣고 싶다면 ______.","opts":["기대하는 답을 질문 속에 미리 넣어 두어야 한다","여러 가지 질문을 한꺼번에 던져야 한다","상대가 자기 말로 풀어 답할 수 있게 물어야 한다","사실을 확인하는 질문부터 빠르게 이어 가야 한다"],"ans":2,"exp":"글은 \"어떠셨어요?\"처럼 물을 때 환자가 자기 말로 사정을 이야기한다고 했으므로, 이야기를 충분히 들으려면 상대가 풀어서 답할 수 있게 물어야 한다. 기대하는 답이 들어 있는 질문이나 사실만 확인하는 질문은 대답을 짧게 끝내게 한다고 했다. 질문을 한꺼번에 던지라는 내용은 글에 없다."},
{"id":"k177","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n장기 기증에 동의한 사람의 비율은 나라마다 크게 다르다. 그런데 그 차이는 국민의 생각보다 신청 방식에서 비롯한 경우가 많다. 기증하려는 사람이 따로 신청해야 하는 나라에서는 동의율이 낮고, 반대로 기증하지 않으려는 사람이 따로 신청해야 하는 나라에서는 동의율이 매우 높다. 사람들은 깊이 따져 보지 않은 일에서는 처음에 정해져 있는 대로 두는 경향이 있기 때문이다.","opts":["동의율이 높은 나라의 국민은 남을 도우려는 마음이 더 크다.","신청 절차를 복잡하게 만들수록 동의율이 높아진다.","사람들은 어떤 일에서든 처음 정해진 대로 따른다.","처음에 정해 두는 방식을 바꾸면 동의율이 달라질 수 있다."],"ans":3,"exp":"동의율의 차이가 신청 방식, 곧 따로 신청하지 않을 때 어떻게 처리되느냐에서 나온다고 했으므로 처음에 정해 두는 방식을 바꾸면 동의율도 달라질 수 있다. 차이가 국민의 생각에서 나온 것이 아니라고 했고, 절차의 복잡함은 글에서 다루지 않았다. 처음 정해진 대로 두는 경향은 깊이 따져 보지 않은 일에 한정된다."},
{"id":"k178","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n오스트레일리아의 어느 원주민 말에는 \"왼쪽\"과 \"오른쪽\"에 해당하는 낱말이 없다. 이 말을 쓰는 사람들은 \"네 북쪽 발에 개미가 있다\"처럼 언제나 동서남북으로 위치를 말한다. 그러려면 어디에 있든 방위를 알고 있어야 한다. 실제로 이들은 낯선 건물 안에서도 방위를 정확히 가리켰다. 날마다 쓰는 말이 방위에 주의를 기울이는 습관을 길러 준 것이다.","opts":["이 말을 쓰는 사람들은 방위를 모르면 위치를 말하기 어렵다.","왼쪽과 오른쪽을 가리키는 낱말이 있는 언어에는 방위를 나타내는 말이 없다.","이 말을 쓰는 사람들은 태어날 때부터 방향 감각이 뛰어나다.","사람이 쓰는 말은 주의를 기울이는 대상에 영향을 주지 않는다."],"ans":0,"exp":"이 말에서는 언제나 동서남북으로 위치를 말하므로 방위를 모르면 위치를 말하기 어렵다고 추론할 수 있다. 이들의 방향 감각은 타고난 것이 아니라 날마다 쓰는 말이 길러 준 습관이라고 했고, 이는 말이 주의를 기울이는 대상에 영향을 준다는 뜻이다. 다른 언어에 방위를 나타내는 말이 없다는 내용은 글에 없다."},
{"id":"k179","subj":"국어","unit":"추론","q":"다음 글에 따를 때 가장 나중에 진료를 받는 환자는?\n\n응급실에서는 먼저 온 순서가 아니라 위급한 정도에 따라 진료 순서를 정한다. 어느 병원은 환자를 세 등급으로 나눈다. 숨을 쉬지 못하거나 의식이 없는 환자는 1등급으로 가장 먼저 진료한다. 의식은 있으나 심한 통증이나 출혈이 있는 환자는 2등급으로 그다음에 진료한다. 그 밖의 환자는 3등급으로, 앞의 환자들을 본 뒤에 진료한다. 같은 등급 안에서는 먼저 온 환자를 먼저 본다.","opts":["오후 2시에 온, 발목을 삐어 걸을 때 조금 아픈 환자","오후 2시 10분에 온, 의식이 없는 환자","오후 2시 20분에 온, 손을 깊이 베여 피가 많이 나는 환자","오후 2시 30분에 온, 가벼운 감기 기운이 있는 환자"],"ans":3,"exp":"의식이 없는 환자는 1등급, 피가 많이 나는 환자는 2등급이므로 온 시각과 관계없이 먼저 진료를 받는다. 발목을 삔 환자와 감기 기운이 있는 환자는 둘 다 3등급인데, 같은 등급 안에서는 먼저 온 환자를 먼저 보므로 오후 2시 30분에 온 환자가 가장 나중에 진료를 받는다."},
{"id":"k180","subj":"국어","unit":"추론","q":"다음 글에서 추론할 수 있는 것으로 가장 적절한 것은?\n\n종이 빨대는 플라스틱 빨대보다 환경에 이롭다고 흔히 말한다. 플라스틱은 썩는 데 수백 년이 걸리지만 종이는 금방 분해되기 때문이다. 그러나 물건이 환경에 주는 부담은 버려진 뒤만이 아니라 만들고 나르는 과정까지 합쳐서 따져야 한다. 종이 빨대는 만들 때 물과 에너지가 적지 않게 들고, 음료에 젖지 않도록 겉을 코팅한 것은 재활용하기도 어렵다.","opts":["종이 빨대는 어느 면에서나 플라스틱 빨대보다 환경에 해롭다.","물건의 환경 부담은 분해되는 기간만으로는 판단할 수 없다.","코팅하지 않은 종이 빨대는 만들 때 에너지가 들지 않는다.","플라스틱 빨대는 만들고 나르는 과정에서 환경에 부담을 주지 않는다."],"ans":1,"exp":"환경 부담은 버려진 뒤만이 아니라 만들고 나르는 과정까지 합쳐서 따져야 한다고 했으므로, 분해되는 기간만으로는 판단할 수 없다고 추론할 수 있다. 종이가 금방 분해된다는 이로운 점도 인정했으므로 어느 면에서나 해롭다고 할 수 없다. 코팅하지 않은 종이 빨대의 에너지나 플라스틱 빨대의 제조 과정에 대해서는 글에서 말하지 않았다."},
{"id":"k181","subj":"국어","unit":"추론","q":"다음 글에 주로 쓰인 설명 방식으로 가장 적절한 것은?\n\n우리 몸의 면역 체계는 나라를 지키는 군대와 비슷하다. 피부와 점막은 적이 들어오지 못하게 막는 성벽이다. 성벽이 뚫리면 가까이 있던 식세포들이 달려와 침입자를 가리지 않고 공격하는데, 이는 국경을 지키는 초병과 같다. 그래도 막지 못하면 그 침입자만을 겨냥하도록 훈련된 특수 부대, 곧 림프구가 나선다. 싸움이 끝난 뒤에도 일부는 남아 적의 얼굴을 기억해 두었다가 같은 적이 다시 오면 재빨리 물리친다.","opts":["낯선 대상을 친숙한 다른 대상에 빗대어 설명한다.","서로 맞서는 두 견해를 견주어 한쪽을 반박한다.","권위 있는 자료를 인용하여 주장을 뒷받침한다.","묻고 답하는 형식으로 통념의 문제점을 드러낸다."],"ans":0,"exp":"면역 체계를 군대에, 피부와 점막을 성벽에, 식세포를 초병에, 림프구를 특수 부대에 빗대어 설명하였다. 이처럼 낯선 대상을 비슷한 점이 있는 친숙한 대상에 견주어 풀이하는 방식을 유추라고 한다. 글에는 맞서는 견해나 인용, 묻고 답하는 형식이 나타나지 않는다."},
{"id":"k182","subj":"국어","unit":"추론","q":"다음 글의 전개 방식에 대한 설명으로 가장 적절한 것은?\n\n악기는 소리를 내는 방법에 따라 크게 세 가지로 나눌 수 있다. 줄을 켜거나 뜯어서 소리를 내는 현악기에는 바이올린, 가야금 등이 있다. 관 속의 공기를 떨게 하여 소리를 내는 관악기에는 플루트, 대금 등이 있다. 두드리거나 흔들어서 소리를 내는 타악기에는 북, 장구 등이 있다.","opts":["대상이 만들어지는 과정을 단계별로 서술하였다.","원인과 결과의 관계를 밝혀 현상을 설명하였다.","일정한 기준에 따라 대상을 나누고 각각의 예를 들었다.","서로 맞서는 두 견해를 견주어 절충하였다."],"ans":2,"exp":"\"소리를 내는 방법\"이라는 기준에 따라 악기를 현악기, 관악기, 타악기로 나누고(분류) 각각에 해당하는 악기를 예로 들었다(예시). 만드는 과정, 원인과 결과, 맞서는 견해는 글에 나타나지 않는다."},
{"id":"k183","subj":"국어","unit":"논리","q":"\"비가 오면 소풍을 가지 않는다.\"가 참일 때 반드시 참인 것은?","opts":["소풍을 가면 비가 오지 않은 것이다.","비가 오지 않으면 소풍을 간다.","소풍을 가지 않으면 비가 온 것이다.","소풍을 가는 날에도 비가 올 수 있다."],"ans":0,"exp":"\"P이면 Q이다\"가 참이면 그 대우인 \"Q가 아니면 P가 아니다\"도 반드시 참이다. 따라서 \"소풍을 가면 비가 오지 않은 것이다\"가 참이다. \"비가 오지 않으면 소풍을 간다\"와 \"소풍을 가지 않으면 비가 온 것이다\"는 반드시 참이라고 할 수 없고, 소풍을 가는 날에 비가 올 수 있다는 것은 주어진 진술과 어긋난다."},
{"id":"k184","subj":"국어","unit":"논리","q":"\"모든 직원이 교육을 받았다.\"가 거짓일 때 반드시 참인 것은?","opts":["교육을 받은 직원은 한 명도 없다.","교육을 받지 않은 직원이 적어도 한 명 있다.","교육을 받은 직원이 적어도 한 명 있다.","교육을 받지 않은 직원이 절반을 넘는다."],"ans":1,"exp":"\"모든 A가 B이다\"의 부정은 \"B가 아닌 A가 적어도 하나 있다\"이다. 따라서 교육을 받지 않은 직원이 적어도 한 명 있다는 것만 반드시 참이다. 아무도 받지 않았는지, 받은 직원이 있는지, 받지 않은 직원이 절반을 넘는지는 알 수 없다."},
{"id":"k185","subj":"국어","unit":"논리","q":"다음 논증에 나타난 오류는?\n\n이 건강식품은 지금까지 백만 명이 넘게 사 먹었다. 그러므로 이 건강식품은 효과가 좋은 것이 틀림없다.","opts":["대중에 호소하는 오류","흑백 논리의 오류","의도 확대의 오류","분할의 오류"],"ans":0,"exp":"많은 사람이 그렇게 한다는 사실을 근거로 삼아 주장이 옳다고 하는 것은 대중에 호소하는 오류이다. 흑백 논리의 오류는 선택지가 둘뿐이라고 보는 것, 의도 확대의 오류는 뜻하지 않은 결과를 의도한 것으로 보는 것, 분할의 오류는 전체의 성질을 부분도 지닌다고 보는 것이다."},
{"id":"k186","subj":"국어","unit":"논리","q":"〈보기〉와 같은 종류의 오류가 나타난 것은?\n\n〈보기〉 이 음식을 좋아하지 않는다고? 그렇다면 너는 이 음식을 싫어하는구나.","opts":["그 사람은 거짓말을 한 적이 있으니 그의 주장은 들을 필요도 없다.","내가 만난 그 학교 학생 두 명이 친절했으니 그 학교 학생은 모두 친절하다.","그는 나의 친구가 아니라고 했다. 그렇다면 그는 나의 적이다.","유명한 배우가 권한 약이니 틀림없이 효과가 좋을 것이다."],"ans":2,"exp":"〈보기〉는 좋아하지도 싫어하지도 않는 경우를 빼놓고 둘 가운데 하나라고 단정한 흑백 논리의 오류이다. 친구가 아니면 적이라고 단정한 것도 같은 오류이다. 나머지는 차례로 주장이 아닌 사람을 공격하는 인신공격의 오류, 적은 사례로 전체를 판단하는 성급한 일반화의 오류, 그 분야의 전문가가 아닌 사람의 말에 기대는 부적합한 권위에 호소하는 오류이다."},
{"id":"k187","subj":"국어","unit":"논리","q":"다음 논증을 강화하는 것으로 가장 적절한 것은?\n\n야간 근무를 하는 간호사에게 근무 중 20분 동안 눈을 붙일 시간을 주면 투약 실수가 줄어들 것이다. 졸음이 주의력을 떨어뜨려 실수를 부르기 때문이다.","opts":["야간 근무자가 실수하는 주된 까닭은 졸음이 아니라 일손 부족이다.","20분 동안 자고 일어난 직후에는 한동안 머리가 멍해진다.","낮 근무를 하는 간호사도 투약 실수를 할 때가 있다.","눈을 붙일 시간을 준 병동에서 그 뒤로 야간 투약 실수가 줄었다."],"ans":3,"exp":"눈을 붙일 시간을 준 병동에서 실제로 실수가 줄었다는 사실은 결론을 직접 뒷받침하므로 논증을 강화한다. 실수의 주된 까닭이 일손 부족이라는 것과 자고 난 직후에 머리가 멍해진다는 것은 논증을 약화한다. 낮 근무자의 실수는 이 논증과 관련이 없다."},
{"id":"k188","subj":"국어","unit":"논리","q":"다음 진술이 모두 참일 때 반드시 참인 것은?\n\n- A가 참석하면 B도 참석한다.\n- B가 참석하면 C는 참석하지 않는다.\n- C는 참석한다.","opts":["A와 B가 모두 참석한다.","A는 참석하고 B는 참석하지 않는다.","A와 B가 모두 참석하지 않는다.","A는 참석하지 않고 B는 참석한다."],"ans":2,"exp":"C가 참석하므로 둘째 진술의 대우(C가 참석하면 B는 참석하지 않는다)에 따라 B는 참석하지 않는다. B가 참석하지 않으므로 첫째 진술의 대우(B가 참석하지 않으면 A도 참석하지 않는다)에 따라 A도 참석하지 않는다."},
{"id":"k189","subj":"국어","unit":"논리","q":"\"운전면허가 있는 사람만 이 차를 빌릴 수 있다.\"가 참일 때 반드시 참인 것은?","opts":["운전면허가 있는 사람은 누구나 이 차를 빌릴 수 있다.","이 차를 빌린 사람은 운전면허가 있다.","이 차를 빌리지 못한 사람은 운전면허가 없다.","운전면허가 없어도 이 차를 빌릴 수 있는 경우가 있다."],"ans":1,"exp":"\"A인 사람만 B할 수 있다\"는 \"B한 사람은 모두 A이다\"와 같은 뜻이다. 따라서 이 차를 빌린 사람은 운전면허가 있다. 운전면허는 필요한 조건일 뿐이어서 면허가 있다고 누구나 빌릴 수 있는 것은 아니고, 빌리지 못한 사람 가운데에도 면허가 있는 사람이 있을 수 있다."},
{"id":"k190","subj":"국어","unit":"논리","q":"갑, 을, 병 세 사람의 직업은 의사, 간호사, 약사 가운데 하나이고 서로 다르다. 다음 조건에 따를 때 사람과 직업을 옳게 짝지은 것은?\n\n- 갑은 의사가 아니다.\n- 병은 의사가 아니다.\n- 병은 약사보다 나이가 많다.","opts":["갑 – 약사","을 – 간호사","병 – 약사","갑 – 간호사"],"ans":0,"exp":"갑과 병이 의사가 아니므로 의사는 을이다. 병은 약사보다 나이가 많다고 했으니 병 자신은 약사가 아니고, 따라서 병은 간호사이다. 남은 갑이 약사이다."},
{"id":"k191","subj":"국어","unit":"문학","q":"고려 가요(고려 속요)에 대한 설명으로 옳지 않은 것은?","opts":["「용비어천가」가 대표적인 작품이다.","주로 평민들 사이에서 불린 노래이다.","여러 연으로 나뉘고 후렴구가 발달하였다.","입으로 전해지다가 한글이 만들어진 뒤에 기록되었다."],"ans":0,"exp":"「용비어천가」는 조선 세종 때 지은 악장이다. 고려 가요의 대표적인 작품으로는 「청산별곡」, 「가시리」, 「서경별곡」 등이 있다. 고려 가요는 평민층이 주로 부른 노래로, 여러 연으로 나뉘고 후렴구가 발달했으며, 구전되다가 조선 시대에 한글로 기록되었다."},
{"id":"k192","subj":"국어","unit":"문학","q":"가사(歌辭)에 대한 설명으로 옳지 않은 것은?","opts":["4음보의 율격이 길이의 제한 없이 이어진다.","정극인의 「상춘곡」은 조선 전기의 대표적인 작품이다.","조선 후기에는 평민과 여성으로 작자층이 넓어졌다.","초장, 중장, 종장의 3장 6구로 이루어진다."],"ans":3,"exp":"초장, 중장, 종장의 3장 6구는 시조의 형식이다. 가사는 4음보의 율격이 행수의 제한 없이 이어지는 갈래이다. 조선 전기에는 「상춘곡」처럼 양반이 지은 작품이 중심이었고, 후기에는 평민과 여성도 가사를 지었다."},
{"id":"k193","subj":"국어","unit":"문학","q":"「금오신화」에 대한 설명으로 옳지 않은 것은?","opts":["김시습이 지었다.","한글로 지어져 서민들 사이에서 널리 읽혔다.","우리나라 최초의 한문 소설로 평가된다.","「이생규장전」, 「만복사저포기」 등이 실려 있다."],"ans":1,"exp":"「금오신화」는 조선 전기에 김시습이 한문으로 지은 소설집으로, 우리나라 최초의 한문 소설로 평가된다. 「만복사저포기」, 「이생규장전」, 「취유부벽정기」, 「남염부주지」, 「용궁부연록」의 다섯 편이 전한다. 한글로 지은 작품이 아니다."},
{"id":"k194","subj":"국어","unit":"문학","q":"하나의 감각을 다른 감각으로 옮겨 나타내는 공감각적 심상이 쓰인 것은?","opts":["뜰에 향기로운 꽃이 피었다.","이마에 차가운 바람이 스친다.","종소리가 푸르게 번져 간다.","산 너머로 붉은 해가 솟는다."],"ans":2,"exp":"\"종소리가 푸르게 번져 간다\"는 귀로 듣는 소리를 눈으로 보는 빛깔로 나타낸 공감각적 심상(청각의 시각화)이다. \"향기로운 꽃\"은 후각, \"차가운 바람\"은 촉각, \"붉은 해\"는 시각으로, 감각 하나만 쓰였다."},
{"id":"k195","subj":"국어","unit":"문학","q":"작가와 작품의 연결이 옳지 않은 것은?","opts":["김유정 – 「동백꽃」","현진건 – 「메밀꽃 필 무렵」","이상 – 「날개」","채만식 – 「태평천하」"],"ans":1,"exp":"「메밀꽃 필 무렵」은 이효석의 작품이다. 현진건의 작품으로는 「운수 좋은 날」, 「빈처」 등이 있다. 「동백꽃」은 김유정, 「날개」는 이상, 「태평천하」는 채만식의 작품이다."},
{"id":"k196","subj":"국어","unit":"문학","q":"희곡에 대한 설명으로 옳지 않은 것은?","opts":["서술자가 인물의 심리를 직접 설명한다.","무대에서 공연하는 것을 전제로 쓴다.","인물의 대사와 행동으로 사건이 전개된다.","시간과 공간, 등장인물의 수에 제약을 받는다."],"ans":0,"exp":"희곡에는 소설과 달리 서술자가 없어서 인물의 심리도 대사와 행동으로 드러낸다. 희곡은 무대 공연을 전제로 한 문학이므로 대사와 행동으로 사건을 전개하고, 무대라는 조건 때문에 시간과 공간, 등장인물의 수에 제약을 받는다."},
{"id":"k197","subj":"국어","unit":"화법","q":"토론의 논제 가운데 어떤 행동이나 제도를 실행해야 하는지를 다루는 \"정책 논제\"에 해당하는 것은?","opts":["인공 지능은 사람의 일자리를 줄인다.","선의의 거짓말은 정당하다.","학교 주변 도로의 제한 속도를 낮추어야 한다.","독서는 영상 시청보다 가치 있는 활동이다."],"ans":2,"exp":"정책 논제는 \"~해야 한다\"의 형식으로 어떤 정책이나 행동의 실행 여부를 다룬다. \"인공 지능은 사람의 일자리를 줄인다\"는 참과 거짓을 가리는 사실 논제이고, \"선의의 거짓말은 정당하다\"와 \"독서는 영상 시청보다 가치 있는 활동이다\"는 옳고 그름이나 좋고 나쁨을 판단하는 가치 논제이다."},
{"id":"k198","subj":"국어","unit":"화법","q":"\"발표를 정말 잘하시네요.\"라는 말에 대한 대답 가운데, 자신에 대한 칭찬은 줄이고 자신을 낮추는 표현은 늘리라는 \"겸양의 격률\"을 지킨 것은?","opts":["\"별말씀을요. 아직 부족한 점이 많습니다.\"","\"네, 이번에는 준비를 오래 했거든요.\"","\"제가 원래 발표에는 자신이 있습니다.\"","\"그런데 자료 화면은 어떻게 보셨어요?\""],"ans":0,"exp":"상대의 칭찬을 그대로 받지 않고 자신을 낮추어 말한 \"아직 부족한 점이 많습니다\"가 겸양의 격률을 지킨 대답이다. 준비를 오래 했다거나 발표에 자신이 있다는 대답은 자신을 내세운 것이고, 자료 화면을 묻는 대답은 화제를 바꾼 것이다."},
{"id":"k199","subj":"국어","unit":"화법","q":"다음 협상에 대한 설명으로 가장 적절한 것은?\n\n주민 대표: 공사 소음 때문에 아이들이 잠을 못 잡니다. 공사를 오전 9시 이후에만 해 주십시오.\n구청 담당자: 불편을 드려 죄송합니다. 다만 장마 전에 공사를 마쳐야 해서 시간을 그만큼 줄이기는 어렵습니다. 시작 시각을 7시에서 8시로 늦추고, 소음이 큰 작업은 10시 이후에만 하면 어떻겠습니까?\n주민 대표: 그렇다면 주말에는 공사를 쉬는 조건으로 받아들이겠습니다.","opts":["구청 담당자는 주민 대표의 요구를 그대로 받아들였다.","주민 대표는 상대의 제안에 조건을 붙여 받아들일 뜻을 밝혔다.","주민 대표는 처음의 요구를 끝까지 굽히지 않았다.","구청 담당자는 요구를 들어주기 어려운 까닭을 밝히지 않았다."],"ans":1,"exp":"주민 대표는 구청 담당자의 제안을 \"주말에는 공사를 쉬는 조건으로\" 받아들이겠다고 했다. 구청 담당자는 9시 이후에만 공사해 달라는 요구를 그대로 받아들이지 않고 대안을 내놓았으며, 장마 전에 공사를 마쳐야 한다는 까닭도 밝혔다. 주민 대표도 처음의 요구에서 물러나 대안을 받아들였다."},
{"id":"k200","subj":"국어","unit":"작문","q":"공문서의 문장을 다듬은 것으로 적절하지 않은 것은?","opts":["신청서를 접수 받습니다. → 신청서를 접수합니다.","두 기관은 MOU를 체결하였다. → 두 기관은 업무 협약(MOU)을 체결하였다.","참석자에게 기념품 제공 및 식사를 대접함. → 참석자에게 기념품을 제공하고 식사를 대접함.","안전사고가 일어나지 않도록 주의하시기 바랍니다. → 안전사고가 일어나지 않도록 주의가 요구되어집니다."],"ans":3,"exp":"\"주의가 요구되어집니다\"는 피동 표현을 겹쳐 쓴 데다 누가 주의해야 하는지도 드러나지 않아 원래 문장보다 못하다. 공문서는 쉽고 분명한 능동 표현으로 써야 한다. 나머지는 뜻이 겹치는 \"접수 받다\"를 \"접수하다\"로 고치고, 외국 글자 약어를 우리말로 풀어 쓰고, \"및\"으로 어색하게 이은 부분을 서술어를 갖추어 고친 것이다."},
{"id":"e01","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe nurse gently changed the patient's position and applied a warm pack to ______ the pain in his lower back until the medication took effect.","opts":["aggravate","alleviate","transmit","diagnose"],"ans":1,"exp":"약효가 나타날 때까지 자세를 바꿔 주고 따뜻한 찜질을 하는 것은 통증을 \"덜어 주기\"(alleviate) 위한 것이다. aggravate(악화시키다)는 반대 뜻이고, transmit(옮기다, 전하다)과 diagnose(진단하다)는 찜질의 목적이 될 수 없다."},
{"id":"e02","subj":"영어","unit":"문법","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nIf I ______ in your position, with two small children to support and a mortgage to pay, I would accept the offer without hesitating for a moment.","opts":["am","were","have been","will be"],"ans":1,"exp":"주절이 \"would + 동사원형\"(would accept)이므로 현재 사실과 반대되는 일을 가정하는 가정법 과거이다. if절에는 과거 동사를 쓰고 be동사는 주어와 관계없이 were를 쓴다. am, have been, will be는 would accept와 짝이 맞지 않는다."},
{"id":"e06","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nWearing a mask is ______ for all visitors to the intensive care unit, and anyone who refuses to put one on will not be allowed to enter.","opts":["optional","voluntary","harmful","mandatory"],"ans":3,"exp":"마스크 쓰기를 거부하면 들어갈 수 없다고 했으므로 마스크 착용은 \"의무적인\"(mandatory) 것이다. optional(선택할 수 있는)과 voluntary(자발적인)는 거부해도 된다는 뜻이어서 뒤 내용과 어긋나고, harmful(해로운)이라면 쓰라고 요구할 까닭이 없다."},
{"id":"e12","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe wording of the contract was so ______ that the two companies interpreted the same clause in completely different ways and eventually took the dispute to court.","opts":["convincing","explicit","ambiguous","concise"],"ans":2,"exp":"두 회사가 같은 조항을 전혀 다르게 해석해 소송까지 갔으므로 계약서의 표현이 \"여러 뜻으로 읽힐 수 있는, 모호한\"(ambiguous) 것이다. explicit(분명한)은 반대 뜻이고, convincing(설득력 있는)과 concise(간결한)는 해석이 갈린 원인이 되지 못한다."},
{"id":"e20","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nBecause the patient had a severe allergy to penicillin, the doctor looked for ______ antibiotics that could treat the infection without triggering a dangerous reaction.","opts":["alternative","identical","harmful","expired"],"ans":0,"exp":"페니실린에 심한 알레르기가 있으므로 위험한 반응을 일으키지 않는 \"다른, 대체할 수 있는\"(alternative) 항생제를 찾았다는 흐름이다. identical(똑같은)은 페니실린과 같은 약이 되어 맞지 않고, harmful(해로운)과 expired(유효 기간이 지난)는 치료에 쓸 약을 꾸밀 수 없다."},
{"id":"e21","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nApplicants are reminded that all the required documents must be submitted before the ______, as late applications will not be accepted under any circumstances.","opts":["refund","ceremony","deadline","vacancy"],"ans":2,"exp":"늦게 낸 지원서는 어떤 경우에도 받지 않는다고 했으므로 서류는 \"마감 기한\"(deadline) 전에 내야 한다. refund(환불), ceremony(의식), vacancy(빈자리, 결원)는 늦은 접수를 받지 않는다는 말과 이어지지 않는다."},
{"id":"e22","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nUnlike his talkative brother, who makes friends wherever he goes, Minsu is rather ______ and seldom speaks unless someone asks him a direct question.","opts":["outgoing","noisy","humorous","reserved"],"ans":3,"exp":"Unlike(~와 달리)로 수다스러운 형과 대비되고, 누가 직접 묻지 않으면 좀처럼 말하지 않는다고 했으므로 \"말수가 적은, 내성적인\"(reserved)이 알맞다. outgoing(외향적인), noisy(시끄러운), humorous(재미있는)는 형과 비슷한 성격이어서 대비가 되지 않는다."},
{"id":"e23","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nHealth officials explained that a single dose of the new vaccine provides ______ against the virus for at least ten years, so no booster shot is needed during that period.","opts":["exposure","immunity","infection","addiction"],"ans":1,"exp":"백신이 주는 것이고 그 기간에는 추가 접종이 필요 없다고 했으므로 \"면역\"(immunity)이 알맞다. provide immunity against는 \"~에 대한 면역을 주다\"라는 뜻이다. exposure(노출), infection(감염), addiction(중독)은 백신의 효과가 될 수 없다."},
{"id":"e24","subj":"영어","unit":"어휘","q":"밑줄 친 부분에 들어갈 말로 가장 적절한 것을 고르시오.\n\nThe police believed the witness because her statement was ______ with the security camera footage, which showed the suspect leaving the building at exactly the time she had mentioned.","opts":["consistent","unfamiliar","incompatible","dissatisfied"],"ans":0,"exp":"경찰이 증인을 믿은 이유이고, 영상이 증인이 말한 바로 그 시각에 용의자가 건물을 나서는 모습을 보여 주었으므로 진술이 영상과 \"일치하는\"(consistent with) 것이다. incompatible(맞지 않는)은 반대 뜻이고, unfamiliar(익숙하지 않은)와 dissatisfied(불만인)는 진술과 영상의 관계를 나타내지 못한다."},
